# Zapadniki vs Slavyanophiles
 je_bpm_zapadniks_and_slavophiles:0 "Zapadnikler ve Slavofiller"
 je_bpm_zapadniks_and_slavophiles_status:0 "Bu iki felsefenin tartışmalarını izleyin."
 je_bpm_zapadniks_and_slavophiles_zapadnik_prominence:0 "$bpm_je_all_zapadnik$ düşüncesi Rus entelektüelleri arasında hakim."
 je_bpm_zapadniks_and_slavophiles_no_prominence:0 "Hem $bpm_je_all_slavophile$ hem de $bpm_je_all_zapadnik$ düşüncesi Rus entelektüelleri arasında eşit derecede popüler."
 je_bpm_zapadniks_and_slavophiles_slavophile_prominence:0 "$bpm_je_all_slavophile$ düşüncesi Rus entelektüelleri arasında hakim."
 je_bpm_zapadniks_and_slavophiles_reason:0 "Büyük Petro (Deli Petro) kimdi? Bazıları için o harika bir adam, Rusya'yı Batı'dan en iyilerini alarak geçmişin karanlığından ve çöküşünden çıkaran, onu geleceğin zorlukları için modernleştiren inanılmaz bir reformcuydu. Diğerleri içinse o ulusal bir trajedinin kaynağı, yabancı medeniyetin uyumsuz değerlerini Rusya'nın egemen ruhuna nakletmeye cüret eden bir aptaldı. Açıkçası, önümüzdeki on yıllar boyunca Rus Aydınlarına hakim olacak iki felsefi akım — Zapadnikler ve Slavofiller — için tek bölücü şey sadece onun figürü değildi.\n\n$bpm_je_all_zapadniks$, büyük ulusal kahramanları Büyük Petro'nun izinden giderek, Rusya'yı içinde bulunduğu geri kalmış durumdan kurtarmak için Batı'yı taklit etmeyi ve onun en iyi yenilikleri olarak algıladıkları liberalizm, demokrasi, insan hakları ve ekonomik özgürlüğü onlardan almayı arzulayan Rus Aydınları içindeki bir akımdır.\n\n$bpm_je_all_slavophiles$, Zapadniklere karşıt bir akımdır — Rus ulusal ruhunun zaten batı etkisiyle çok fazla ayaklar altına alındığına ve kolektif, Hıristiyan ve sadık Rus Ruhu ile uyuşmayacak kadar egoist, seküler ve devrimci olduğuna inanırlar.\n\nBu Günlük Kaydı, bu iki konumun Rus akademisinin zihinlerinde birbirlerine göre sahip olduğu etkiyi temsil eder. Birinden biri galip gelirse, çeşitli araştırma alanlarına ölçeklenmiş bir değiştirici (modifier) kazanacaksınız — daha güçlü $bpm_je_all_slavophiles$, #bold Askeri#! ve #bold Endüstriyel#! araştırmayı hızlandırırken, $bpm_je_all_zapadniks$ dikkati #bold Teknolojik Yayılma#! ve #bold Sosyal#! araştırmalara kaydıracaktır. $bpm_je_all_slavophiles$ ve $bpm_je_all_zapadniks$ için [Concept('concept_leader', 'Çıkar Grubu Liderlerinin')] ve [Concept('concept_agitator', 'Agitatörlerin')] popülaritesi, zamanla kaçınılmaz olarak azalan şevkleriyle birlikte her iki tarafın popülaritesini belirleyecektir. Mevcut koşullar altında Günlük Kaydının haftada #tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_zapadniks_and_slavophiles_rate_tooltip [Country.MakeScope.ScriptValue('bpm_je_zapadniks_and_slavophiles_rate')|+]#! oranında ilerlemesi beklenmektedir.\n\n#lore \"Rusya son üç yüz yıldır Batı ile kaynaşmayı arzulamıştır; son üç yüz yıldır Batı'dan aşağı olduğunu kabul etmiş, tüm fikirlerini, tüm öğretilerini... Batı'dan almıştır. Krallarımızın en büyüğü... eski Rusya'yı reddetti. Tüm eski kurumlarımızı silip süpürdü ve eski geleneklerimizi çöpe attı... İtiraf etmelisiniz ki muazzamdı, Büyük Petro'nun yaratımı, bundan böyle izleyeceğimiz yolu dikte eden bu dahi adam fikri.\"\n\n—Pyotr Çaadayev, 1837#!"

