bpm_fascism_events.1.t:0 "Faşistler Başkente Yürüyor"
bpm_fascism_events.1.d:0 "Hükümetteki konumlarından yüz bulan faşistler, sola karşı bir siper olma bahanesiyle [SCOPE.sCharacter('ruler_scope').GetPrimaryRoleTitle] makamından mevcut hükümette dizginleri ele almayı talep ettiler."
bpm_fascism_events.1.f:0 "Üzerlerinde kara gömleklerle sokaklarda esip gürlüyorlar. Liderleri derme çatma bir podyuma çıkmış anırıyor: "Olayımız çok basit ulan, sike sike biz yöneteceğiz, o kadar!""
bpm_fascism_events.1.a:0 "Mesajı aldık anasını satayım, verin istediklerini."
bpm_fascism_events.1.b:0 "Böyle iş mi olur amınakoyayım, alayını hapse tıkın bu itlerin!"