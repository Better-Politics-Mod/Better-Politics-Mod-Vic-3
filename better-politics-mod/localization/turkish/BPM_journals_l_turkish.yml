# MARLIB SPLIT
 je_bpm_split_marlibs:0 "Piyasa Liberalizminin Yükselişi"
 je_bpm_split_marlibs_status:0 "Piyasa Liberallerinin ortaya çıkışını izleyin."
 je_bpm_split_marlibs_reason:0 "Ülkemizdeki son ekonomik tartışmalar, devletin asgari müdahalesiyle piyasanın en verimli olacağına yürekten inanan orta ve üst sınıf liberallerden oluşan yeni bir koalisyonun doğmasına yol açıyor. Serbest bir piyasanın hem fiyatları düşüreceğini ve toplumun tüm üyelerine daha iyi bir yaşam standardı sağlayacağını, hem de uluslararası çatışmaları caydıracağını savunuyorlar.\n\n#lore \"Serbest Ticaret! Nedir o? Ulusları ayıran sınırları yıkmak; arkasında gurur, intikam, nefret ve kıskançlık duygularının yuvalandığı, ara sıra sınırlarını aşıp tüm ülkeleri kana boğan o sınırları; savaş ve fetih zehrini besleyen, fetih olmadan ticaretimiz olamayacağını ileri süren, savaşçı şeflerinizi diğer topraklara yıkım saçmaları için gönderen ve sonra tutkularınızda güvenle tahta çıkmaları, ama sadece sizi evinizde taciz ve baskı altına almaları için onları geri çağıran o fetih ve tahakküm şehvetini besleyen duyguları yıkmak.\"\n\n—Richard Cobden, 1843#!"

 je_bpm_split_marlibs_special_tooltip:0 "İlerleme aşağıdakiler tarafından belirlenir:\n#variable [Country.MakeScope.Var('bpm_je_split_marlibs_progress_from_base').GetValue|+=]#! temel değer \n#variable [Country.MakeScope.Var('bpm_je_split_marlibs_progress_from_top_gp').GetValue|+=]#! lider [Concept('concept_great_power', '$concept_great_powers$')] (Büyük Güç) olmaktan.\n#variable [Country.MakeScope.Var('bpm_je_split_marlibs_progress_from_law_enactment').GetValue|+=]#! modern Ticaret, Ekonomi veya Tarım yasalarının yürürlüğe girmesinden.\n#variable [Country.MakeScope.Var('bpm_je_split_marlibs_progress_from_movement').GetValue|+=]#! Ekonomi, Ticaret veya Tarım yasalarını yürürlüğe koyma hareketinden.\n#variable [Country.MakeScope.Var('bpm_je_split_marlibs_progress_from_bad_laws').GetValue|+=]#! Serflik veya Gelenekselcilik gibi gerici Ekonomi yasalarına sahip olmaktan.\n#variable [Country.MakeScope.Var('bpm_je_split_marlibs_progress_from_patcons').GetValue|+=]#! Muhafazakarların Paternalizmi benimsemesinden.\n#variable [Country.MakeScope.Var('bpm_je_split_marlibs_progress_from_radcaps').GetValue|+=]#! Kapitalist nüfusun en az %10'unun radikal olmasından."

