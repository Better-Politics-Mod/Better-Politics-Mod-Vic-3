#Slavic
 bpm_slavic.1.t:0 "The Prague Conference"
 bpm_slavic.1.d:0 "Inspired by the revolutionary movements in Germany and elsewhere, Slavic nationalists of all stripes have assembled in Prague to discuss various ideas on Slavic nationalism."
 bpm_slavic.1.f:0 ""Brothers! This is the hour of decision. It is for you to take a stand, openly either for the old world, in ruins, which you would prop up for yet another little while, or for the new world whose radiance has reached you and which belongs to the generations and centuries to come. It is up to you, too, to determine whether the future is to be in your hands or, if you want, once more to sink into impotence, into the night of hopes abandoned, into the inferno of slavery..."\n\n—Mikhail Bakunin, 1848"
 bpm_slavic.1.a:0 "For our people."