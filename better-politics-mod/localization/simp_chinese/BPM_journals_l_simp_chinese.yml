 je_bpm_modernizers_status_conservative_prominence_overwhelming:0 "$bpm_je_all_antimodernizer$s在知识分子中#bold 压倒性地占据主导#!。"
 je_bpm_modernizers_status_conservative_prominence_strong:0 "$bpm_je_all_antimodernizer$s在知识分子中占主导。"
 je_bpm_modernizers_status_conservative_prominence_weak:0 "$bpm_je_all_antimodernizer$s在知识分子中逐渐得势。"
 je_bpm_modernizers_status_no_prominence:0 "$bpm_je_all_antimodernizer$s与$bpm_je_all_modernizer$s在知识分子中相互争斗。"
 je_bpm_modernizers_reason:0 "@information! #blue 生效期间解锁[GetLawType('law_repeatable_culture_invite_foreign_experts').GetName][Concept('concept_bpm_repeatable_law', '$concept_bpm_repeatable_law$')] #!\n\n$bpm_je_all_modernizers$的辩证强度：#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_modernizers_modernizer_strength_tooltip [Country.MakeScope.ScriptValue('bpm_je_modernizers_ideology_rate_modernizers')|2]#!\n$bpm_je_all_antimodernizers$的辩证强度：#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_modernizers_conservative_strength_tooltip [Country.MakeScope.ScriptValue('bpm_je_modernizers_ideology_rate_conservatives')|2]#!\n\n凝望欧美的诸国，已愈发清晰地看到，我们的制度日益陈旧而岌岌可危。最先认识到这一缺陷的是我们的知识分子，在他们中间浮现出两翼，各自提出对未来的对立愿景：$bpm_je_all_modernizers_tt$与$bpm_je_all_anti_modernizers_tt$。\n\n当辩论的#v 社会影响力#! #v > 25#!时，我们将依据二者中更具影响力的一方获得修正。\n\n若$bpm_je_all_modernizers$获胜：\n  @arrow_up!社会[concept_technology]研究速度与传播\n  @arrow_down!军事[concept_technology]研究速度与传播\n  @arrow_down![concept_bpm_political_stability]目标\n  @information! 在高#v 社会影响力#!下，@intelligentsia_bpm! 会采取激进立场！\n\n若$bpm_je_all_antimodernizers$获胜：\n  @arrow_down!社会[concept_technology]研究速度与传播\n  @arrow_up!军事[concept_technology]研究速度与传播\n  @arrow_up![concept_bpm_political_stability]目标\n\n双方都提供：\n  @arrow_up!生产[concept_technology]传播\n  @arrow_up!每周[concept_innovation]\n\n@warning! 我们较传统主义的势力可能不会对感知到的外国影响侵蚀泰然处之，倘若事情走得太远，他们可能会诉诸一场粗野而暴力的#N 政变#!。\n\n#lore “过去三百年，俄国一直渴望与西方融合；过去三百年，它一直承认自己劣于西方，从西方汲取了它所有的思想、所有的学说……我们最伟大的君王……背弃了旧俄国。他扫除了我们所有古老的制度，抛弃了我们古老的传统……你必须承认，这是辉煌的，彼得大帝的创造，这个天才人物的理念，他为我们此后所走的道路指明了方向。”\n\n——彼得·恰达耶夫，1837#!"
