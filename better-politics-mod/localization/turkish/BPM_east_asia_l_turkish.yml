#  era_showa:0 "Shōwa"

#  meiji.2.t:0 "Yenilenmiş Bir Japonya"
#  meiji.2.d:0 "Reforme edilmiş bir ordu, dünyaya açık ve tanınan bir ülke, yeni bir toplum. [ROOT.GetCountry.GetName], dünya güçleri arasında eşit bir konumda yer alıyor ve belki de kendi emperyal hırslarının peşinden gitmeye başlayacak."
#  meiji.2.f:0 "Cennetin kutsamasıyla atalarımızın çok eski zamanlardan beri hüküm sürdüğü kutsal tahtta oturuyoruz. Japonya'nın uygarlığı ve kurumları diğer ülkelerinkinden o kadar farklıdır ki, beyan edilen amaca bir anda ulaşmayı bekleyemeyiz. Amacımız, aydınlanmış uluslar arasında geçerli olan çeşitli kurumlardan mevcut koşullarımıza en uygun olanları seçmek ve onlarla eşit düzeyde olabilmek için politikamız ile geleneklerimizde kademeli reformlar ve iyileştirmeler yaparak uyarlamaktır.\n\n—İmparator Meiji, 1891"
#  meiji.2.a:0 "Japon İmparatorluğu yükselecek."

#  meiji.14.t:0 "Tokugawa Sikkelerinin Çöküşü"
#  meiji.14.d:0 "Tokugawa sikkelerinin kuruluşu, Japonya'nın Çin bronz sikkelerine bağımlı olduğu bir dönemi takip etti. Bu sistem bunun yerine farklı boyutlardaki altın plakalar ve sikkelerden oluşan bir tür altın standardı oluşturdu. Bu sistemin istikrarı, Japon ekonomisinin dış dünyadan neredeyse tamamen izole olmasıyla sağlanıyordu; ki artık durum böyle değil. Yabancılar büyük miktarda altın para birimini sürdürülemez oranlarda satın alarak kitlesel enflasyona ve sikke sisteminin istikrarının çökmesine neden oldu."
#  meiji.14.f:0 "Sıradan bir vatandaş kasabın arabasında listelenen ve önceki aya göre iki katına çıkan fiyatlara küçümseyerek baktı; cebindeki birkaç madeni paranın değeri geçen her gün daha da azalıyordu."
#  meiji.14.a:0 "Artık yapabileceğimiz pek bir şey yok."
#  meiji.14.tt:0 "#P +5#! Bakumatsu İlerlemesi"

#  meiji.15.t:0 "Limanda Çatışma"
#  meiji.15.d:0 "Yerel muhafızlar ve yabancı tüccarlar arasındaki bir anlaşmazlık, bir Japon limanında ölümcül bir kavgaya dönüştü. Kayıplar arasında birkaç denizci ve muhafız bulunuyor. Kısıtlamalara ilişkin kafa karıştırıcı ve çelişkili fermanlar ve yabancılara yönelik artan öfke, bu durumu giderek yaygınlaşan bir olay haline getirdi."
#  meiji.15.f:0 "Bıçakların ve sopaların etlere çarpma sesi, tersane boyunca yankılanan bağırışlar ve çığlıklar sayısız seyirciyi kendine çekti."
#  meiji.15.a:0 "Yerel daimyodan muhafızları değiştirmesini talep et."
#  meiji.15.tt:0 "#P +2#! Bakumatsu İlerlemesi"

#  meiji.16.t:0 "Sonnō Jōi Grupları Toplanıyor"
#  meiji.16.d:0 "Sonnō jōi (İmparatora Saygı Duy, Barbarları Kov), imparatoru güçlendirmeyi ve Japonya'yı batıya karşı kuvvetlendirmeyi amaçlayan neo-Konfüçyüsçü ve restorasyoncu grupların toplanma sloganıdır. Yabancı şeytanlara karşı etkisiz olarak gördükleri Şogunluğa doğrudan karşıdırlar."
#  meiji.16.f:0 "Hanedana Saygı Duy, Barbarları Kov, İhanete Son Ver, Toprak Sahiplerini Dizginle.\n\n—Qi Dükü Huan, M.Ö. 651"
#  meiji.16.a:0 "Şogun'un topraklarında çatlaklar büyüyor."
#  meiji.16.tt:0 "#P +2#! Bakumatsu İlerlemesi"

#  meiji.17.t:0 "Şogunluk Güvence Altında"
#  meiji.17.d:0 "Tokugawa klanı dengeyi dikkatle koruyarak ve kilit kurumlarda reformlar yaparak fırtınayı atlattı ve kendini yeni bir çağa hazırladı."
#  meiji.17.f:0 "\"Ülkemize Tanrıların Ülkesi dememiz sadece bir övünç değildi. Yaratılış'ta dünyanın tüm topraklarını oluşturanlar tanrılardı ve bu tanrılar istisnasız Japonya'da doğmuştu.\"\n\n—Hirata Atsutane, 1811"
#  meiji.17.a:0 "Her zaman olduğu gibi aynı."

#  meiji.18.t:0 "Hokkaidō Kalkınma Komisyonu"
#  meiji.18.d:0 "İmparatorluk hükümeti şimdi, resmi olarak Hokkaidō adını alan Ezo adasına ve kuzeydeki yerleşilmemiş Karafuto adasına yerleşmeyi ve korumayı hedefliyor. Tondenhei adı verilen silahlı yerleşimciler olarak askere alınan askerler, İmparatorluk için yepyeni bir sınır açarak binlerce toprak teklifini kabul etti. Bu elbette, artan baskı ve şiddetle karşı karşıya kalan yerel Ainu nüfusu için büyük bir bedel karşılığında gerçekleşti."
#  meiji.18.f:0 "\"...bunun üzerine hem kötü tanrılar hem de parlak tanrılar ışığın yükseleceği yere baktılar. Fakat sadece tilki tanrısı batıya doğru bakıyordu. Kısa bir süre sonra tilki bağırdı: 'Gün doğumunu görüyorum.' Hem kötü hem de iyi tanrılar dönüp baktıklarında, batıdaki ışığın parıltısını gördüler. Parlak tanrıların dünyayı yönetmesinin nedeni budur.\"\n\n—Bir Ainu Halk Masalı"
#  meiji.18.a:0 "Kuzey gönüllüleri çağırıyor."

#  meiji.19.t:0 "Yeni Bir Başkent"
#  meiji.19.d:0 "Şogunluğun feshedilmesiyle birlikte imparatorluk yönetimi, İmparator'un iktidar merkezi de dahil olmak üzere bir dizi değişiklik gördü."
#  meiji.19.f:0 "Eski Şogun, ikametgahı ve güç merkezi olan kudretli Edo Kalesi'ni yeniden tahta geçen İmparator'a devrederken saygı ve utançla eğiliyor. Tadilatların hemen başlaması planlanıyor; eski kalenin yerini görkemli bir İmparatorluk Sarayı alacak. Dış cephesi Kyoto'daki eski imparatorluk konutuyla neredeyse aynı görünecek olsa da İmparator, Japonya'nın zengin dekoratif geleneklerini alışılmadık Batı modasıyla harmanlamayı planlıyor. Belki de Japonya'nın gelecekteki şekli için bir metafor."
#  meiji.19.a:0 "Yeni bir Japonya'nın üzerine güneş doğuyor."

#  meiji.20.t:0 "Japon Sermayesinin Doğuşu"
#  meiji.20.d:0 "Feodal merkantilizmin sonu Japonya'da sanayide devrim yarattı. Bir zamanların küçük ev endüstrileri artık endüstriyel canlılıkla çeşitlenip genişleyebiliyor, ve hevesli yeni girişimciler nakliyecilik, madencilik ve daha fazlasında yeni hanedanlar kuruyor."
#  meiji.20.f:0 "Tokyo'nun her köşesinde bankalar ve sigorta acenteleri mantar gibi bitiyor. İş adamları sokaklarda yürüyor, sevkiyatları yönetiyor ve defterleri güncelliyor. Bir gecede ortaya çıkmış gibi görünen demirhaneler ve konserve fabrikaları gökyüzüne duman kusuyor. Şehir ilerlemenin sesiyle uğulduyor."
#  meiji.20.a:0 "Sermayenin motorları kükreyerek canlanıyor."

#  meiji.21.t:0 "Büyükelçilikte Çay"
#  meiji.21.d:0 "İmparatorluk birçok büyük güçle büyükelçilikler ve resmi ticari ilişkiler kurdu. Dünyanın dört bir yanından diplomatlar dünya sahnesinin bu en yeni oyuncusuyla bağlantılar kurmak için Tokyo'ya geliyor."
#  meiji.21.f:0 "Amerikalı fincanından uzun bir yudum aldı, \"Misafirperverliğiniz için minnettarım Sayın Arinori, Washington'a çelik gümrük vergilerinin yeniden gözden geçirilmesini önermekten mutluluk duyarım, ancak önce bazı güvencelere ihtiyacım var...\""
#  meiji.21.a:0 "Anlaşma tamam."

#  meiji.22.t:0 "Çiftçiler Hasadı Teslim Etmeyi Reddediyor"
#  meiji.22.d:0 "Kırsal kesimdeki köylüler, kitlesel enflasyonun ardından dalgalanan fiyatlara giderek daha fazla öfkeleniyor. [ROOT.GetState.GetName] bölgesindeki köylüler şimdi yerel daimyoların kotalarını karşılamayı reddediyor, daha tutarlı bir tazminat talep ediyor ve yerel yetkililere karşı küçük çaplı isyanlar düzenliyor."
#  meiji.22.f:0 "\"Bir savaşta bahçıvan olmaktansa, bahçede bir savaşçı olmak daha iyidir.\"\n\n—Miyamoto Musashi, 1645"
#  meiji.22.a:0 "Temeller sarsılıyor."

#  je_bpm_rising_sun:0 "Güneş Doğuyor"
#  je_bpm_rising_sun_reason:0 "Japon İmparatorluğu bir dönüm noktasında. İzolasyonist uykusundan uyanarak ordusunu ve toplumunu büyüyen bir sanayi gücüne dönüştürdü, ancak konumumuzu güvence altına almak için batı tarzında bir imparatorluk inşa etmeliyiz. Doğu Asya'da dayanak noktaları elde etmek ve Ruslar gibi güçlere karşı bir tampon oluşturmak en önemli önceliğimizdir. Buna ek olarak, donanmamızın dışarıya doğru genişlerken deniz yollarımızı güvence altına alması için modern zırhlı savaş gemilerinden oluşan bir filoya ihtiyacı var.\n\n#lore Halkımızı büyük bir kavga bekliyor. İstesek de istemesek de büyük bir savaş olması gerekecek ve o savaş, tüm ulusun dahil olacağı, çaresiz bir savaş olacak; tüm dünyaya karşı durduğumuz bir savaş. Bu savaşı verebilmek için mutlak güvene sahip olmalıyız. Halk cesur, bilgili, hızlı ve gayretli olmalı, fakat en önemlisi güven duymalıdır.\n—Saionji Kinmochi, 1903#!"
#  bpm_owns_kor_tt:0 "Tüm Kore eyaletlerine sahip"

#  je_bpm_taisho_democracy:0 "Kasımpatı Demokrasisi"
#  je_bpm_taisho_democracy_reason:0 "Japonya, Avrupa'nın güçlerine dayanan parlamenter bir sistem geliştirmiş olsa da, bu sisteme katılım, başta eski ve güçlü ailelerin üyeleri olmak üzere imparatorluk vatandaşlarından sadece seçkin bir azınlıkla sınırlıdır.\nÖzgürlük ve Halkın Hakları Hareketi ile filizlenen işçi örgütleri gibi gruplar, genişletilmiş bir oy hakkının yanı sıra hükümetin ifade ve toplanma özgürlüğü üzerindeki kısıtlamalarının gevşetilmesi için ajitasyon yapmaya başladı. Japon siyasetine hakim olan mevcut oligarşiyi yerinden edememek, militaristlerin imparatorluk hükümeti üzerindeki etkisini sonsuza dek perçinleyebilir.\n\n#lore \"Demokrasi, hukuk teorisinin egemenliği nereye yerleştirdiğine bağlı değildir. O sadece, bu egemenliğin kullanılmasında, egemenin her zaman halkın refahına ve görüşlerine değer vermeyi politikası haline getirmesi gerektiğini ima eder.... Şüphe yoktur ki, bir monarşide bile bu ilkeye saygı duyulabilir.\"\n-Yoshino Sakuzō, 1916#!"
#  bpm_taisho_fail_tt:0 "Popüler demokrasi pekiştirilemeden 25 Yıl geçti."

#  bpm_japan.1.t:0 "Değişen Rüzgarlar"
#  bpm_japan.1.d:0 "Güneşin altında kendine bir yer edinen imparatorluk hükümeti, önümüzdeki onyıllar için yeni dış politika hedefleri belirlemek istiyor."
#  bpm_japan.1.f:0 "\"Hiçbir amaç birliği yoktu ve yanlış anlaşılmalar aralıksız sürüyordu. Eğer özerklik imkansızsa ve ikili Yönetim başarısızsa, ilhaktan başka ne alternatif kalırdı?\"\n\n—The Times'ın Kore'nin ilhakı üzerine makalesi, 1910"
#  bpm_japan.1.a:0 "Kuzeydoğuyu güvence altına almaya daha fazla odaklan."
#  bpm_japan.1.b:0 "Doğu Hint Adaları'nın zenginliklerine doğru güneye ilerle."

#  bpm_japan.2.t:0 "Minpon Shugi"
#  bpm_japan.2.d:0 "Bir dizi anayasa reformunun ardından Japonya, imparatorluğun restorasyonunun ardından oluşan militan oligarşinin üstesinden geldi. Popüler Minpon Shugi doktrini, egemenliğin imparatorda kalmasını sürdürür ancak liberal kurumların önemini vurgular. Şimdi, imparatorluğun geleceğini şekillendireceği kesin olan yükselen ilerici bir hareketle yeni bir çağa giriyor."
#  bpm_japan.2.f:0 "\"Buna bir örnek olarak, bir hükümet yetkilisine saygı göstermemiz doğal olsa da, bunun nedeni o kişinin statüsünün saygınlığı değildir. Ona bu saygı sadece yeteneği ve erdemleri sayesinde o önemli rolü yerine getirdiği ve halkın iyiliği için önemli yasalarla uğraştığı için gösterilir. Saygınlığı olan adam değil, yasalardır.\"\n\n—Fukuzawa Yukichi, 1872"
#  bpm_japan.2.a:0 "Japon siyaseti için yeni bir çağ."

# China
 je_warlord_china:0 "Gök'ün Emri (Cennetin Mandası)"
 je_warlord_china_reason:1 "#bold İlerleme Çubuğu'nun#! durumu, belirli koşullara bağlı olarak #tooltippable;tooltip:[Country.GetTooltipTag],je_warlord_china_special_tooltip_advance ilerleyecek#! veya #tooltippable;tooltip:[Country.GetTooltipTag],je_warlord_china_special_tooltip_deplete gerileyecektir#!. #bold İlerleme Çubuğu'nun#! #variable %0#! değerine ulaşması, imparatorluk otoritesinin tamamen çökmesi ve Büyük Qing'in silah zoruyla sona ermesi anlamına gelir.\n\nYongzheng ve Qianlong İmparatorları dönemindeki geçici bir istikrar dönemine rağmen, Çin dış baskılar ve sayısız milyonların temel ihtiyaçlarını karşılayamama nedeniyle çöküşe doğru istikrarlı bir kayışa başladı. Sarı Nehir yatağından taştığında hiç kimse tarlaları onarmaya gelmiyor, hasat kötü olduğunda tahıl ambarları boş kalıyor ve toprak sahibi soylular köylülüğe yabancı bir imparatorun rızasıyla zulmediyor. İmparatorluk hükümetinin otoritesi ve yetkisi aşındıkça, giderek büyüyen yabancı düşmanı hareketler, modernleşmeci devrimciler ve orta krallık (Çin) boyunca öfkelenen köylüler ejderha tahtını devirmekle tehdit edecek. Mevcut hanedan güveni yeniden tesis etmek ve Gök'ün Emrini elinde tutmak istiyorsa Çin'in gücünü inşa etmeli ve dikkatli iç reformlar izlemelidir.\n\n#lore \"Batılı uluslar neden küçük oldukları halde güçlüler? Biz neden büyük olduğumuz halde zayıfız? Onlara eşit olmanın yollarını aramalıyız, ve bu tamamen insan çabasına bağlıdır... Sözleri eylemlerle eşleştirme konusunda barbarlardan daha aşağıdayız. Çareyi kendi içimizde aramalıyız. Eğer imparator bizi doğru yöne yönlendirirse, bu durum derhal değiştirilebilir.\"\n—Feng Guifen, 1861#!"
