# SYNDICALISM
 je_bpm_syndicalism:0 "Sendikalizm"
 je_bpm_syndicalism_status:0 "Sendikalist düşüncenin gelişimini izleyin"
 je_bpm_syndicalism_status_1:0 "Sendikalist düşünce emekleme aşamasında."
 je_bpm_syndicalism_status_2:0 "Sendikalist düşünce ivme kazanıyor."
 je_bpm_syndicalism_status_3:0 "Sendikalist düşünce işçi hareketi içinde yükselişte!"
 je_bpm_syndicalism_reason:0 "#v İlerleme Hızı:#! ayda #tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_syndicalism_rate_tooltip [Country.MakeScope.ScriptValue('bpm_je_syndicalism_rate')|+]#!.\n\nSendikalist düşünce, işçilerin mevcut durumlarının etkisizliğinden duydukları hayal kırıklığından doğar. Seçimci sosyalistlerin parlamentolarda didişmesini, anarşistlerin boşuna bomba atmasını ve sendika patronlarının taviz üstüne taviz vermesini izliyorlar. Artık yeter! Endüstriyel işçiler kalabalıktır, güçlüdür ve #PB Genel Grev#! stratejisini keşfetmişlerdir. Sendikalizm bunu sonuna kadar götürecek dürtüyü sağlayacaktır.\n\nBu Günlük Kaydı, Günlük ilerlemesi ve bir [concept_technology] (Teknoloji) ile geçilen #v üç bölüme#! ayrılmıştır. Her bölüm yeni bir etki ekler:\n (1) #v %0#!: Gereksinim yok.\n    [GetInterestGroupVariant('ig_trade_unions', GetPlayer).GetName] popülaritesi artar.\n (2) #v %33#!: #gold Sendika Federasyonları#! gerektirir.\n    [GetInterestGroupVariant('ig_trade_unions', GetPlayer).GetName] ve [GetInterestGroupVariant('ig_anarchists', GetPlayer).GetName], #pink Sendikalist#! Liderler kazanır.\n (3) #v %66#!: #gold Siyasi Ajitasyon#! gerektirir.\n    [GetInterestGroupVariant('ig_trade_unions', GetPlayer).GetName] ve [GetInterestGroupVariant('ig_anarchists', GetPlayer).GetName], kalıcı olarak #pink Sendikalist#! hale gelir.\n\n @information! Gerekli teknolojiyi araştırmadan bir Günlük ilerlemesi eşiğine ulaşırsanız, o teknoloji için otomatik olarak araştırma ilerlemesi kazanırsınız.\n\nGünlük Kaydı zirvesine ulaşırsa, bir #pink Genel Grev#! olasılığı son derece yükselecektir!\n\n#lore \"Sendikalizm ile eski sendika yöntemleri arasındaki temel fark şudur: Eski sendikalar istisnasız olarak ücret sistemi ve kapitalizm içinde hareket edip ikincisini kaçınılmaz olarak kabul ederken, Sendikalizm mevcut endüstriyel düzenlemeleri adaletsiz ve suçlu bularak reddeder ve kınar, işçiye bu sistemden kalıcı sonuçlar elde etmesi için hiçbir umut sunmaz.\"\n\n—Emma Goldman, 1913#!" 

 je_bpm_syndicalism_rate_tooltip:0 "[Country.MakeScope.GetScriptValueDesc('bpm_je_syndicalism_rate')]"

 bpm_syndicalism_legitimized_global:0 "#bold Sendikalist İdeoloji#! dünya çapında meşrulaşacak!"
 bpm_syndicalism.1.t:0 "Sendikalist Devrim!"
 bpm_syndicalism.1.d:0 "İş bitti! Sendikaların gücüyle, Genel Grev tehdidiyle ve kapsamlı bir devrimin sonucu olarak, Sendikalistler [Country.GetName] içinde galip geldiler. Eski yönetim organları artık yok; yeni ulus, işçi kontrollü Sendikaların federe bir dokusuyla yönetiliyor. Dahası, devrimin bu ülkede gerçekleşmiş olması, dünya çapında Sendikalizmin sosyal devrim yapabilen güçlü ve pratik bir ideoloji olduğunu kanıtladı."
 bpm_syndicalism.1.f:0 "Meslek toplulukları (direniş, dayanışma, sendika) teşvikimizi ve sempatimizi hak ediyor, zira onlar geleceğin toplumsal inşasının doğal unsurlarıdır; üretici birlikleri haline kolayca gelebilecek olan onlardır; sosyal araçları işletebilecek ve üretimi organize edebilecek olan onlardır. Birçok üyesi, başlangıçta bu toplulukların gelecekte oynamaya çağrıldığı rolün genellikle bilincinde değildir; ilk başta sadece sermayenin sömürüsüne direnmeyi veya yüzeysel bazı iyileştirmeler elde etmeyi düşünürler; ama çok geçmeden yetersiz yatıştırıcılar veya hatta bazen olumsuz sonuçlar elde etmek için göstermeleri gereken zorlu çabalar, onları kapitalist baskıdan kurtarabilecek radikal reformlar aramaya kolayca yöneltir. Sonra sosyal soruları inceler ve işçi kongrelerinde temsil edilirler. Yeni grupların eskilerle uyum içinde olması gerekir, çünkü ancak dayanışma yoluyla, geniş anlamda, tüm mesleklerden ve tüm ülkelerden işçilerin dünya çapında birliğiyle ayrıcalıkların bastırılmasına ve herkes için eşitliğe kesinlikle ulaşacağız.\n\n—Eugène Varlin, 1870"
 bpm_syndicalism.1.a:0 "Daima Dayanışma!"

 bpm_syndicalism.2.t:0 "Sendikalist Devrim!"
 bpm_syndicalism.2.d:0 "İş bitti! Sendikaların gücüyle, Genel Grev tehdidiyle ve kapsamlı bir devrimin sonucu olarak, Sendikalistler [Country.GetName] içinde galip geldiler. Eski yönetim organları artık yok; yeni ulus, işçi kontrollü Sendikaların federe bir dokusuyla yönetiliyor!"
 bpm_syndicalism.2.f:0 "Meslek toplulukları (direniş, dayanışma, sendika) teşvikimizi ve sempatimizi hak ediyor, zira onlar geleceğin toplumsal inşasının doğal unsurlarıdır; üretici birlikleri haline kolayca gelebilecek olan onlardır; sosyal araçları işletebilecek ve üretimi organize edebilecek olan onlardır. Birçok üyesi, başlangıçta bu toplulukların gelecekte oynamaya çağrıldığı rolün genellikle bilincinde değildir; ilk başta sadece sermayenin sömürüsüne direnmeyi veya yüzeysel bazı iyileştirmeler elde etmeyi düşünürler; ama çok geçmeden yetersiz yatıştırıcılar veya hatta bazen olumsuz sonuçlar elde etmek için göstermeleri gereken zorlu çabalar, onları kapitalist baskıdan kurtarabilecek radikal reformlar aramaya kolayca yöneltir. Sonra sosyal soruları inceler ve işçi kongrelerinde temsil edilirler... Yeni grupların eskilerle uyum içinde olması gerekir, çünkü ancak dayanışma yoluyla, geniş anlamda, tüm mesleklerden ve tüm ülkelerden işçilerin dünya çapında birliğiyle ayrıcalıkların bastırılmasına ve herkes için eşitliğe kesinlikle ulaşacağız.\n\n—Eugène Varlin, 1870"
 bpm_syndicalism.2.a:0 "Daima Dayanışma!"

# General Strike
 je_bpm_general_strike_trigger:0 "Genel Grev Tehdidi"
 # je_bpm_general_strike_trigger_status:0 "Genel Greve dikkat edin."
 je_bpm_general_strike_trigger_reason:0 "Bu günlük kaydı hızla #v #tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_general_strike_power_tooltip [Country.MakeScope.ScriptValue('bpm_je_general_strike_power')|.1]#!#! olan #yellow dinlenme noktasına#! yaklaşacak.\n\nFarklı kitleleri disiplinli fabrika çalışmasına zorlayan koşullar, onları devrimci yeni bir taktiğe getirdi. Orada burada iş bırakmalar görülmemiş bir şey olmasa da, ülke çapında koordineli bir grev — bir #PB Genel Grev#! — artık masada. Ne de olsa işçiler sayısız montaj hattında birbirinin yerine geçebilen dişlilerse, ortak çıkarlarını da paylaşmıyorlar mı? Bir dişli durursa, bütün dişliler hep bir ağızdan durmaz mı?\n\nÇeşitli faktörler bu Günlük Kaydının #yellow dinlenme noktasının#! değişmesine neden olabilir — savaşlar ve radikalizm potansiyel grevcileri cesaretlendirecek, cömert işçi hakları ise onlara yeniden düşündürecektir.\n\nBu kayıt sınırına ulaşırsa, bir #PB Genel Grev#! başlayacaktır.\n\nİşçilerin #blue Yorgunluk seviyesi#! #variable [Country.MakeScope.Var('bpm_je_general_strike_exhaustion').GetValue|.1]#! şeklindedir ve ayda #tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_general_strike_exhaustion_tooltip [Country.MakeScope.ScriptValue('bpm_je_general_strike_exhaustion_rate')|-.1]#! oranında #variable 0'a#! doğru iyileşir.\n\n#lore \"Bir emekçi, bir grev aracılığıyla kendisinden alınanın küçük bir kısmını geri almaya çabalasın — bu emekçi kutsal mülkiyet hakkını ihlal eder ve hükümet ordusuyla birlikte derhal emekçiye karşı, toprak sahibinin, fabrikatörün veya tüccarın yardımına koşar. ..Zenginlerin toprağa sahip olmalarını, vergi koyma hakkını ve diğer insanların emek ürünlerine sahip olma hakkını dayandırdıkları şeyin adaletle hiçbir ortak yanı yoktur ve hepsi de ordunun ürettiği şiddetten başka bir şeye dayanmaz.\"\n\n—Lev Tolstoy, 1900#!"

 je_bpm_general_strike_ongoing:0 "Genel Grev!"
 je_bpm_general_strike_ongoing_status:0 "Genel Grevi Çözün!"
 je_bpm_general_strike_ongoing_reason:0 "@warning! #PB Genel Grev#! haftada #tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_general_strike_power_tooltip [Country.MakeScope.ScriptValue('bpm_je_general_strike_power')|-=]#! hızında ilerler.\n@information! Grevcilerin #blue Yorgunluk seviyesi#! (#variable [Country.MakeScope.Var('bpm_je_general_strike_exhaustion').GetValue|.1]#!) haftada #tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_general_strike_exhaustion_tooltip [Country.MakeScope.ScriptValue('bpm_je_general_strike_exhaustion_rate')|+=]#! oranında değişir.\n\n[Country.GetName] işçilerinin canına tak etti. Şu andan itibaren ülkenin büyük işçi örgütlerinin çağrısıyla başlatılan #PB Genel Grev#! devam ediyor ve devlet ile toplumun tüm işlevlerini ciddi şekilde tehlikeye atıyor.\n\nBu kayıt aktif olduğu sürece, Günlük ilerlemesine göre ölçeklendirilmiş aşağıdaki cezaları alacağız:\n  #N - #!Tüm işyerlerine, Günlük ilerlemesine göre ölçeklendirilmiş [concept_throughput] cezaları,\n  #N - #!Endüstriyel binalara daha sert [concept_throughput] cezaları ve\n  #N - #!Ekstra haftalık [concept_war_exhaustion] (Savaş Yorgunluğu)\n\n[GetInstitutionType('institution_police').GetName] varlığımızı artırmak, daha baskıcı [GetLawGroup('lawgroup_policing').GetName] veya [GetLawGroup('lawgroup_internal_security').GetName] yasalarını yürürlüğe koymak veya belirli tavizler vermek bu bataklıktan çıkmamıza yardımcı olabilir.\n\n#lore \"Bizler, özgürlük mücadelemiz için, bu ayın 4'ünde öğlen vakti, Jing-Han Demiryolu'ndaki tüm bağlı sendikaların genel grev ilan etmesini kararlaştırıyoruz. Pratik nedenlerle, Genel Sendika faaliyetlerini Jiang'an'dan yürütecektir. Genel grev dönemindeki tüm faaliyetler harfiyen Genel Sendikanın emirlerine uygun olarak gerçekleştirilmelidir. Özgürlük için savaşıyoruz, insan hakları için savaşıyoruz ve geri adım atmayacağız!\"\n\n—Jing-Han Demiryolu Genel Sendikası, 1923#!"
