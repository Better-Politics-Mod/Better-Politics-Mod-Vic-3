metternich_resignation_and_flee_tt: "[SCOPE.sCharacter('metternich_scope').GetFullName], [SCOPE.sCharacter('metternich_scope').GetHerHis] istifasını sunacaktır"

metternich.1.t: "Bir Çağın Sonu"
metternich.1.d: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName]'ın tahta çıkmasıyla birlikte, uzun süredir görev yapan Şansölye [SCOPE.sCharacter('metternich_scope').GetFullName], [SCOPE.sCharacter('metternich_scope').GetHerHis] emekliliğini duyurdu. Tarihin onun devlet adamlığıyla şekillenen bu bölümü sona ermiştir."
metternich.1.f: ""Ancak her şeye rağmen, içten içe beslediğim düşünce kadim Avrupa'nın sonun başlangıcında olduğudur. Benim kararlılığım onunla birlikte yok olmaktır, üzerime düşen görevi nasıl yapacağımı bileceğim; ve bu sadece benim parolam değil - aynı zamanda İmparatorun parolasıdır. Öte yandan Yeni Avrupa henüz var olmaya başlamamıştır ve son ile başlangıç arasında sadece bir kaos olacaktır."\n\n— Klemens von Metternich" # Kaynak: Wolfgang Siemann, Metternich: Stratejist ve Vizyoner
metternich.1.a: "Büyük orkestra şefi sahneden ayrılıyor."

metternich.2.t: "Utanç Verici Bir Son"
metternich.2.d_revolution: "[ROOT.GetCountry.GetNameNoFlag] devrimci bir çalkantıyla sarsılırken ve hükümet artık [SCOPE.sCharacter('metternich_scope').GetHerHis] güvenliğini garanti edemezken, [SCOPE.sCharacter('metternich_scope').GetFullName] görevinden istifa etmek zorunda kaldı. [SCOPE.sCharacter('metternich_scope').GetSheHe|U], [ROOT.GetCountry.GetCapital.GetCityHubName] şehrinden kaçarak sürgüne gitti."
metternich.2.d_gov_change: "[SCOPE.gsInterestGroup('aristocracy_ig').GetName] grubunun hükümetten dışlanması, [SCOPE.sCharacter('metternich_scope').GetFullName]'e görevinden istifa etmekten başka bir seçenek bırakmadı. Eski nüfuzunun çoğundan yoksun bırakılan [SCOPE.sCharacter('metternich_scope').GetSheHe], malikanesinde inzivaya çekildi."
metternich.2.f: ""Ben artık hiçkimseyim. Artık yapacak hiçbir şeyim, tartışacak hiçbir şeyim kalmadı."\n\n— Klemens von Metternich"
metternich.2.a: "[SCOPE.sCharacter('metternich_scope').GetSheHe|U] artık bizi tanımlamayacak."

metternich.3.t: "Küçük Bir Darbe"
metternich.3.d: "Şansölye [SCOPE.sCharacter('metternich_scope').GetFullName], Geheime Staatskonferenz yapısında bir dizi reform önererek kurumun işleyişini iyileştirmeyi ve [SCOPE.sCharacter('metternich_scope').GetHerselfHimself]'i kurumun tartışılmaz lideri olarak konumlandırmayı hedefledi. Ancak [SCOPE.sCharacter('kolowrat_scope').GetFullName], bu adımı durdurmak için Kraliyet Ailesi ile ittifak kurdu."
metternich.3.f: ""Metternich'ten daha fazla güç kazanmasından daha az fayda sağlayacak çok az adam vardır", diye söze başladı haberci, "ve bunu söylediğim için Arşidük'ün beni bağışlamasını diliyorum. Eğer ay sonuna kadar müsaitseniz..."\n\nArşidük yüzünde sinirli bir ifadeyle durmasını işaret etti. Çizmelerinin yarısı ayağındaydı ve tüm dikkatini onlara vermek istiyordu. "Ay sonu mu? Kolowrat şimdi nerede?"\n\n"Bohemya'da, lordum. Grip olduğuna dair haberler gönderiyor.""
metternich.3.a: "Kolowrat'ın müdahalesi İmparatorluğun istikrarını tehdit ediyor."
metternich.3.b: "Şansölye kendini en iyisi dış işleriyle sınırlasın."

