 bpm_christian_democrats_events.1.t:0 "天主教会拒绝在选举中支持任何人"
 bpm_christian_democrats_events.1.d:0 "我们才不掺和这破玩意儿"
 bpm_christian_democrats_events.1.f:0 "#lore 20. 因此，依据你的牧灵关怀，要勤勉地保护和维护这份信仰。要不断教导众人，鼓励动摇者，说服异议者，坚固信心软弱者，绝不容忍、绝不放过任何可能丝毫玷污这份信仰纯洁性的东西。要以同样强大的心志，培养众人与天主教会的合一——教会之外别无救恩；也要培养他们对伯多禄宗座的服从，我们至圣宗教的整个架构都建立在这宗座之上。"
 bpm_christian_democrats_events.1.a:0 "选举太尬了——教宗如是说（认真地）"
