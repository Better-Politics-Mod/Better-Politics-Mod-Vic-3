 bpm_new_wine_old_wineskins_flavour.11.t: "Eski Kırbalarda Yeni Şarap"
 bpm_new_wine_old_wineskins_flavour.11.d: "‘Rerum novarum’ genelgesinin yayımlanması ve [GetInterestGroupVariant('ig_christian_democrats',GetPlayer).GetNameWithCountryVariant] grubunun ortaya çıkmasıyla yeni bir siyasi mücadele başlıyor. [GetInterestGroupVariant('ig_conservatives',GetPlayer).GetNameWithCountryVariant] içindeki eski, muhafazakar seçkinler yeni, radikal Katoliklere boyun eğmeye veya pes etmeye istekli değiller ve her iki grup da güç ve hayatta kalma mücadelesi verecek."
 bpm_new_wine_old_wineskins_flavour.11.f: "Ve hiç kimse yeni şarabı eski kırbalara doldurmaz. Yoksa yeni şarap kırbaları patlatır, hem şarap dökülür hem de kırbalar mahvolur. Yeni şarap yeni kırbalara doldurulmalıdır. Hiç kimse eski şarabı içtikten sonra yenisini istemez; çünkü ‘Eskisi daha iyi’ der.\n\n— Luka 5:37-39"
 bpm_new_wine_old_wineskins_flavour.11.a: "Bağımsız olarak yola çıkmayı hiç düşündüler mi?"


















