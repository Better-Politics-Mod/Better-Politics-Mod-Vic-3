l_turkish:

 # Nonideological traits
 ig_trait_urban_systematic_corruption:0 "Sistematik Yolsuzluk"
 ig_trait_urban_systematic_corruption_desc:0 "Bu çıkar grubu ayrıcalıklı muamele görüyor ve yolsuzluğa batmış durumda. Resmi bağlantılar ve özel ayrıcalıklardan oluşan bir ağ aracılığıyla sistematik olarak servet istifliyor, hükümetimizin işleyişine ve meşruiyetine zarar veriyorlar."
 ig_trait_urban_well_oiled_machine:0 "Tıkır Tıkır İşleyen Makine"
 ig_trait_urban_well_oiled_machine_desc:0 "Bu çıkar grubunun meşru ihtiyaçları iyi karşılanıyor. Artan bir verimlilikle çalışıyor, kendilerini zenginleştirirken hükümetimizin de ödülleri başka yerlere yatırmasına olanak tanıyorlar. Ancak onlara çok fazla serbestlik tanırsak, hızla yolsuzluğa batabilirler."
 ig_trait_urban_systematic_opposition:0 "Sistematik Muhalefet"
 ig_trait_urban_systematic_opposition_desc:0 "Bu çıkar grubu hükümet tarafından kronik olarak o kadar ihmal ediliyor ki, artık kendilerini resmi işlere zorla dahil ediyorlar. Mümkün olan her yerde politikalarımıza direnerek bürokratik yükümüzü artırdılar ve meşruiyetimize zarar verdiler."
 ig_trait_urban_election_interference:0 "Hükümet Müdahalesi"
 ig_trait_urban_election_interference_desc:0 "Bu çıkar grubu hükümet tarafından kronik olarak ihmal ediliyor ve devletteki rolleri nedeniyle hükümetimizin işlerine doğrudan müdahale etmeye başladılar."

 ig_trait_rural_systematic_corruption:0 "Sistematik Yolsuzluk"
 ig_trait_rural_systematic_corruption_desc:0 "Bu çıkar grubu ayrıcalıklı muamele görüyor ve yolsuzluğa batmış durumda. Resmi bağlantılar ve özel ayrıcalıklardan oluşan bir ağ aracılığıyla sistematik olarak servet istifliyor, hükümetimizin işleyişine ve meşruiyetine zarar veriyorlar."
 ig_trait_rural_well_oiled_machine:0 "Tıkır Tıkır İşleyen Makine"
 ig_trait_rural_well_oiled_machine_desc:0 "Bu çıkar grubunun meşru ihtiyaçları iyi karşılanıyor. Artan bir verimlilikle çalışıyor, kendilerini zenginleştirirken hükümetimizin de ödülleri başka yerlere yatırmasına olanak tanıyorlar. Ancak onlara çok fazla serbestlik tanırsak, hızla yolsuzluğa batabilirler."
 ig_trait_rural_systematic_opposition:0 "Sistematik Muhalefet"
 ig_trait_rural_systematic_opposition_desc:0 "Bu çıkar grubu hükümet tarafından kronik olarak o kadar ihmal ediliyor ki, artık kendilerini resmi işlere zorla dahil ediyorlar. Mümkün olan her yerde politikalarımıza direnerek bürokratik yükümüzü artırdılar ve meşruiyetimize zarar verdiler."

 ig_trait_military_systematic_corruption:0 "Sistematik Yolsuzluk"
 ig_trait_military_systematic_corruption_desc:0 "Ordu ayrıcalıklı muamele görüyor ve yolsuzluğa batmış durumda. Resmi bağlantılar ve özel ayrıcalıklardan oluşan bir ağ aracılığıyla sistematik olarak servet istifliyor, ordunun işleyişine ve hükümetimizin meşruiyetine zarar veriyorlar."
 ig_trait_military_well_oiled_machine:0 "Tıkır Tıkır İşleyen Makine"
 ig_trait_military_well_oiled_machine_desc:0 "Ordunun meşru ihtiyaçları iyi karşılanıyor. Artan bir verimlilikle çalışıyor, kendilerini zenginleştirirken hükümetimizin de ödülleri başka yerlere yatırmasına olanak tanıyorlar. Ancak onlara çok fazla serbestlik tanırsak, hızla yolsuzluğa batabilirler."
 ig_trait_military_systematic_opposition:0 "Sistematik Muhalefet"
 ig_trait_military_systematic_opposition_desc:0 "Ordu hükümet tarafından kronik olarak o kadar ihmal ediliyor ki, artık hükümetle işbirliği yapmayı reddediyorlar. Mümkün olan her yerde politikalarımıza direnerek savaş gücümüze ve meşruiyetimize zarar verdiler."

 ig_trait_left_systematic_corruption:0 "Sistematik Yolsuzluk"
 ig_trait_left_systematic_corruption_desc:0 "Ülkemiz dünyanın dört bir yanından göçmenleri çeken büyük bir özgürlük kalesi olarak görülüyor. Ancak bu ideolojinin takipçilerine hükümette ayrıcalıklı makamlar veriliyor ve yolsuzluğa batarak hükümetimizin meşruiyetine zarar veriyorlar."
 ig_trait_left_bastion_of_freedom:0 "Özgürlük Kalesi"
 ig_trait_left_bastion_of_freedom_desc:0 "Ülkemiz bu ideolojinin ilerici ideallerini benimsedi ve bir özgürlük kalesi olarak görülüyoruz. Yaşam, özgürlük ve mutluluk arayışının gerçek veya hayali garantilerinin peşinden giden ezilmiş göçmenler ülkemize akın ediyor."
 ig_trait_left_systematic_opposition:0 "Sistematik Muhalefet"
 ig_trait_left_systematic_opposition_desc:0 "Hükümetimiz bu ideolojinin mensuplarından gelen talepleri sürekli olarak reddediyor. Bu nedenle kitlesel çapta muhalefet örgütlüyor, grevler başlatıyor veya mümkün olan her yerde ülkemizden kaçıyorlar."

 ig_trait_right_systematic_corruption:0 "Sistematik Yolsuzluk"
 ig_trait_right_systematic_corruption_desc:0 "Ülkemiz, vatandaşlarımızı geleneksel aileye yönelmeye zorlayan büyük bir gelenek kalesi olarak görülüyor. Ancak bu ideolojinin takipçilerine hükümette ayrıcalıklı makamlar veriliyor ve yolsuzluğa batarak hükümetimizin meşruiyetine zarar veriyorlar."
 ig_trait_right_bastion_of_freedom:0 "Gelenek Kalesi"
 ig_trait_right_bastion_of_freedom_desc:0 "Ülkemizin sağcı politikaları altında vatandaşlarımız sosyal destek için geleneksel aile birimlerine yöneliyor. Geleneksel sosyal yapıların desteklenmesi, daha geniş aileleri teşvik ediyor ve genel olarak doğum oranlarını artırıyor."
 ig_trait_right_systematic_opposition:0 "Sistematik Muhalefet"
 ig_trait_right_systematic_opposition_desc:0 "Hükümetimiz bu ideolojinin mensuplarından gelen talepleri sürekli olarak reddediyor. Bu nedenle kitlesel çapta muhalefet örgütlüyor, muhafazakar aileleri ana akım topluma karşı izole ediyor ve mümkün olan her yerde sosyal ilerlemeyi engelliyorlar."