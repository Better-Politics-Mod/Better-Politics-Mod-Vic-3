 bpm_grasp_calm_neighbours: "Neighbouring states without [Concept('concept_bpm_revolutionary_cell', '$concept_bpm_revolutionary_cells|q$')]"
 bpm_cell_grows_below_front_line: "#v [GetPlayer.MakeScope.ScriptValue('bpm_revcell_front_line_chance')|0]%#! chance of an #gold Advance#!: this state is #R below the front line#!"
