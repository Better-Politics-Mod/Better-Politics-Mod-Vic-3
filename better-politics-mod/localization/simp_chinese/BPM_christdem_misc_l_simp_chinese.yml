 je_bpm_christian_democrats:0 "黑暗中的光明"
 je_bpm_christian_democrats_reason:0 "多年来，神父和广大信徒一直在呼吁变革；呼吁基督教最大的教派——天主教会和教皇——回应与资本主义及其存在本身所滋生的#yellow 自由主义#!和#pink 社会主义#!意识形态相关联的社会冲突。许多人目睹了#v 爱尔兰大饥荒#!的惨状，目睹了工厂#v 工人#!的苦难与悲惨，其中许多人正慢慢丧失对上帝及其在人世间代表的信仰；许多人为了贪婪而残忍的利润，接受了#v 工业革命#!的种种新现实。对世界各地的许多人而言，混乱与黑暗已然降临，实际被新的统治社会阶层所把持。\n\n这是一个[Concept('concept_bpm_global_je', '全局日志条目')]。在当前条件下，该日志的进度每月将变化 #tooltippable;tooltip:[Country.GetTooltipTag],je_christian_democrats_tooltip [GetGlobalVariable('je_christian_democracy_progress_rate').GetValue|+=]#!。完成之后，教皇将在其通谕《新事》中正式谈及工人阶级的状况，从而催生@ig_christian_democrats! #blue 基督教民主主义者#!。\n\n#lore 还有一件事值得深思，它更深刻地触及人的境况。国家对所有人——无论高低贵贱——都只有一套统一的标准。毫无疑问，就权利而言，工人与有产者是平等的。下层阶级是共同体身体的真实组成部分，他们以家庭为单位生活，与整个共同体的生活交融在一起。\n\n——教皇利奥十三世，1891年"
 party_centre_party:0 "中央党"
 je_bpm_what_is_national_conservatism_tooltip:0 "#v 什么是民族保守主义#!\n\n@ig_reactionaries! #purple 民族保守主义者#!致力于将其国家改革为一个理想化、传统主义却又带有些许现代主义色彩的国家。在天主教世界中，这样的国家将遵循《新事》通谕的右翼诠释——即一个真正的#v 有机#!国家。"
 je_bpm_what_is_christian_democracy_tooltip:0 "#v 什么是基督教民主？#!\n\n@ig_christian_democrats! #blue 基督教民主#!的定义在学者中仍争论不休，存在多种不同的进路。我们决定遵循#bold 功能主义#!进路（#italic 由#bold 卡尔·因韦尔尼齐·阿切蒂#!在其著作《#bold 什么是基督教民主？#!》中作了更详尽的阐述与比较#!）。它将#v 基督教民主#!定义为一种面临特定挑战的政治意识形态：#italic 使基督教与现代民主和解#!。\n\n最重要的是，这一定义并未将基督教民主化约为某种特定的、本质主义的信念集合——那可能会将那些使用这一标签、但其信念不符合定义的群体排除在外。这意味着在这一标签下，我们可以纳入彼此截然对立的异质群体与信念，例如立陶宛族裔民族主义的#v Krik??ionys Demokratai#!与意大利国际主义的#v 平民主义者#!，但两者都有他们要回应的挑战。\n\n它也划出了一条清晰的界线，区分于其他形式、在不同程度上以天主教社会训导为基础的#v 政治天主教#!；或那些信奉民主、却谋求引入不同替代形式或形态的群体。例如，这清晰地将其与@ig_reactionaries! #purple 民族保守主义者#!（#italic 及其众多名目#!）——天主教思想的右翼——区分开来，他们对民主采取不同的进路：与其像@ig_christian_democrats! #blue 基督教民主主义者#!那样谋求使基督教与现代民主和解、从而支持自由民主制度，民族保守主义者谋求拆解并取代现存的自由民主制度，代之以有机的制度。\n#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_christ_dem_pedia_tooltip #bold #gold ChristDemPedia#!#!#!"
 je_bpm_group_innovateuren_tooltip:0 "#v 敬请期待！#!（#italic :SHRUG:#!）"
 je_bpm_group_zentrumites_tooltip:0 "#v 中央党人#!（#italic：德语：#bold Zentristen#!#!），又称#v 中央派#!，是构成整个德国中央党（#italic 德语：#bold Deutsche Zentrumspartei, DZP，#italic 简称#!#v Z#!#!#!）的、以@ig_christian_democrats! #blue 基督教民主#!为主的#gold 天主教徒#!。#v 中央党人#!由代表形形色色意识形态的众多人物领导——早期数十年最有名的例子是#bold 路德维希·温特霍斯特#!和#bold 威廉·埃马努埃尔·冯·克特勒#!；而在最后几十年，像#bold 威廉·马克思#!和#bold 海因里希·布吕宁#!这样的人物在党内极具影响力。他们的根基总体上在于各行各业的#gold 天主教徒#!之中。\n\n由于#v 中央党人#!是一个庞大而多元的群体，在许多方面各不相同，且取决于谁最具影响力，因此很难说他们左倾还是右倾，但他们大多偏向自由民主制度。所以，非常概括地说，#v 中央党人#!政治上中左、经济上中间、社会上中右。\n\n#v 中央党人#!#bold 并非#!一个[Concept('concept_party', '宗派政党')]，自诞生之日起他们就谋求获得#gold 新教徒#!的支持。\n\n在政治方面，#v 中央党人#!总体倾向于[GetLawType('law_universal_suffrage').GetName]和去中心化，在女性投票和代表制上立场更为多元。早年，#v 中央党人#!在“#bold 文化斗争#!”期间反对学校教育和法律的世俗化；而在#gold 魏玛共和国#!时期，他们对世俗化总体上则较为务实。\n\n在经济方面，#v 中央党人#!总体倾向于有限的国家干预；对[GetLawGroup('lawgroup_trade_policy').GetName]和[GetLawGroup('lawgroup_taxation').GetName]的意见更为复杂。他们支持乡村发展和总体广泛的福利，但在#bold 大萧条#!期间，紧缩倾向主导了政策；在#bold 中央党#!青年中，对更为积极的国家干预的支持——包括#bold 社会化#!和#bold 国家计划#!——大为增长。然而，该[concept_party]在#bold 1933年#!的自行解散使任何可能的变革都无从实现。\n\n在社会方面，#v 中央党人#!通常不赞成反犹主义和敌对的民族主义，支持防御性的军队。在“#bold 文化斗争#!”期间，他们试图争取其他#gold 天主教徒#!的支持，主要来自#gold 波兰人#!和#gold 阿尔萨斯人#!，但大多未能成功。#v 中央党人#!在与欧洲其他@ig_christian_democrats! #blue 基督教民主#!政党的紧密联系上也较为务实，总体谋求获得影响力和支持。\n\n以下意识形态尽可能贴切地代表#v 中央党人#!：[GetIdeology('ideology_gov_moderate_monarchist').GetName] / [GetIdeology('ideology_gov_liberal_republican').GetName]；[GetIdeology('ideology_exe_weak_rigid').GetName]；[GetIdeology('ideology_dop_christian_democrat').GetName]；[GetIdeology('ideology_sta_federated_state').GetName]；[GetIdeology('ideology_eco_modern_interventionist').GetName]；[GetIdeology('ideology_wel_expanded_public_welfare').GetName]；[GetIdeology('ideology_cit_liberal_nationalist').GetName]；[GetIdeology('ideology_rel_pragmatic_moralist').GetName]；[GetIdeology('ideology_mil_patriotic_liberal').GetName]；[GetIdeology('ideology_fem_benevolent_sexism').GetName]\n#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_christ_dem_pedia_tooltip #bold #gold ChristDemPedia#!#!#!"
 je_bpm_group_young_right_tooltip:0 "#v 青年右翼#!（#italic 法语/瓦隆语：#bold Jeune Droite#!，荷兰语/弗拉芒语：#bold Jong Rechts#!#!）是比利时#bold 天主教党#!的一个@ig_christian_democrats! #blue 基督教民主#!政治运动和派系，谋求推行各种#gold 政治#!和#gold 社会改革#!，由#bold 若里斯·赫勒普特#!、#bold 阿瑟·费尔哈根#!和#bold 朱尔·伦金#!等人领导。#v 青年右翼#!强烈反对以夏尔·沃斯特为主要领导、自视为无人挑战的右翼领袖的、保守和家长式精英主义的@ig_conservatives! #v 旧右翼#!（#italic 法语/瓦隆语：#bold Vieille Droite#!，荷兰语/弗拉芒语：#bold Oud Rechts#!#!）。\n\n#v 青年右翼#!政治上中左、经济上中间、社会上中左。\n\n他们支持推行[GetLawType('law_universal_suffrage').GetName]和建立某种类似基督教民主的制度；扩展#gold 比利时#!的去中心化并赋权地方行政，确保宗教在国家中的重要性。与大多数其他基督教民主主义者不同，他们对[GetTechnology('corporatism').GetName]和任何形式的家长主义不那么友好。\n\n他们还支持为所有工人提供广泛而全面的福利，监管经济并加强国家对经济的干预，并谋求通过累进税制再分配财富。\n\n#v 青年右翼#!相对国际主义与和平主义，许多青年成员拒绝使用任何民族象征，视其为本质上反动的。#v 青年右翼#!也非常赞同建立统一的比利时认同、尽可能拉近弗拉芒人与瓦隆人的理念，使两个民族水乳交融、差异微乎其微。\n\n以下意识形态尽可能贴切地代表#v 青年右翼#!：[GetIdeology('ideology_gov_moderate_monarchist').GetName]；[GetIdeology('ideology_exe_weak_rigid').GetName]；[GetIdeology('ideology_dop_christian_democrat').GetName]；[GetIdeology('ideology_sta_regionalized_state').GetName]；[GetIdeology('ideology_eco_modern_interventionist').GetName]；[GetIdeology('ideology_wel_expanded_public_welfare').GetName]；[GetIdeology('ideology_cit_christian_internationalist').GetName]；[GetIdeology('ideology_rel_modern_moralist').GetName]；[GetIdeology('ideology_mil_antimilitarist').GetName]；[GetIdeology('ideology_fem_benevolent_sexism').GetName]\n\n#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_group_young_right_p1 #bold #grey 历史：第一页#!#!#!\n#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_christ_dem_pedia_tooltip #bold #gold ChristDemPedia#!#!#!"
 je_bpm_group_oreliten_tooltip:0 "#v 社会浪漫派#!（#italic 德语/奥地利德语：#bold Soziale Romantiker#!#!）是基督教社会党（#italic 德语：#bold Christlichsoziale Partei, CS/CSP#!#!）内部一个相对较小、充满对抗性的团体。#v 社会浪漫派#!围绕奥地利政治家——#bold 安东·奥雷尔#!、#bold 卡尔·卢格迈尔#!和#bold 维亚德·冯·克洛普#!——展开，其中前者最为重要。他们紧密追随#bold 卡尔·冯·福格尔桑#!的政治经济思想，总体围绕一个高度去中心化的有机国家；以及以中小型所有权（工业和乡村皆然）为中心的法团主义经济。\n\n很难用现有#bold BPM#![Concept('concept_interest_group', '利益集团')]的框架来界定他们，但由于他们对1934-1938年“现代主义”的“等级国家”、反资本主义以及极端反犹主义的强烈鄙夷，我们将其归类为@ig_reactionaries! #purple 民族保守主义者#!。\n\n#v 社会浪漫派#!在#bold CSP#!内部非常弱小、年轻。尽管颇具战斗性，他们却很少得到天主教青年主流#v 人民联盟派#!的支持。#bold 奥雷尔#!的青年协会发展得还算不错，但不幸的是还不足以使他获得赋能。#bold 安东·奥雷尔#!及其团体常常脱离、分裂出或被逐出#bold CSP#!，例如在#italic 1918年#!和#italic 1924年#!。\n\n以下意识形态尽可能贴切地代表#v 社会浪漫派#!：[GetIdeology('ideology_gov_placeholder').GetName]；[GetIdeology('ideology_dop_organic_democrat').GetName]；[GetIdeology('ideology_sta_organic_state').GetName]；[GetIdeology('ideology_eco_distributist_economy').GetName]；[GetIdeology('ideology_wel_distributist_welfare').GetName]；[GetIdeology('ideology_cit_multiethnic_nationalist').GetName]；[GetIdeology('ideology_rel_radical_moralist').GetName]；[GetIdeology('ideology_mil_patriotic_liberal').GetName]；[GetIdeology('ideology_fem_benevolent_sexism').GetName]\n#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_christ_dem_pedia_tooltip #bold #gold ChristDemPedia#!#!#!"
 je_bpm_group_seipelites_tooltip:0 "#v 赛佩尔派#!（#italic 德语/奥地利德语：#bold Seipeliten#!#!）是基督教社会党（#italic 德语：#bold Christlichsoziale Partei, CS/CSP#!#!）内部的一个派系。顾名思义，#v 赛佩尔派#!围绕两次大战之间#bold CSP#!的领袖——#bold 伊格纳茨·赛佩尔#!及其圈子展开。尽管#bold 赛佩尔#!掌握领导权，许多#v 赛佩尔派#!也是党内精英，但他们并不拥有群众支持，在[concept_party]内部本身也属于少数。最典型的例子是，在#italic 1929年宪法改革#!中，令#bold 赛佩尔#!大为不满的是，他们未能引入第二个法团主义议院。\n\n起初，他们对#gold 奥地利#!的#italic 议会民主#!相对积极，但随着时间推移，他们对其愈发鄙夷和宿命论，更倾向于对它进行试验。同样的过程也发生在#gold 奥地利#!#italic 社会民主#!#bold SDAP?#!以及#bold 基督教社会党#!的其余部分，当然程度各不相同。\n\n#bold 伊格纳茨·赛佩尔#!终其一生发展出一种“真正的民主”理念，即没有政党纷争、通过去中心化组织来行使统治。他的这一理念从未在党内领导层获得支持，而党权正慢慢被@ig_fascists! #v 奥地利法西斯#!接管。他也无法在其他@ig_christian_democrats! #bold 基督教社会党人#!的行列中找到支持。\n#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_christ_dem_pedia_tooltip #bold #gold ChristDemPedia#!#!#!"
 je_bpm_group_laborists_and_agrarians_tooltip:0 "#v 劳工派#!（#italic 德语/奥地利德语：#bold Laboristen#!#!）和#v 农本派#!（#italic 德语/奥地利德语：#bold Agrarianer#!#!）是#italic 两次大战之间#!时期基督教社会党（#italic 德语：#bold Christlichsoziale Partei, CS/CSP#!#!）内部的派系。#v 劳工派#!围绕#bold 利奥波德·昆沙克#!展开，而#v 农本派#!则没有一位鲜明的领导人物。\n\n#v 劳工派#!和#v 农本派#!政治上中右、经济上中右、社会上中右。\n\n#v 劳工派#!主要致力于扩大劳工改革与整合；其立场大多反映了#v 人民联盟派#!，但远为保守。由于#gold 奥地利#!内部日益加剧的两极分化和宿命论，#v 劳工派#!对社会主义及其形形色色的思想愈发敌视，甚至支持限制[GetLawGroup('lawgroup_labour_associations').GetName]、财政保守主义和更强大的国家；但仍支持议会政治。\n\n#v 农本派#!主要关注乡村发展，因为#gold 奥地利#!仍然十分落后。他们远为分权、组织松散，有时甚至敌视城市主义（#bold 在1918年的混乱中，#v 农本派#!反对救济饥荒中的城市#!）。\n\n[GetIdeology('ideology_gov_liberal_republican').GetName]；[GetIdeology('ideology_dop_conservative_democrat').GetName]；[GetIdeology('ideology_sta_federated_state').GetName]；[GetIdeology('ideology_eco_distributist_economy').GetName]；[GetIdeology('ideology_wel_distributist_welfare').GetName]；[GetIdeology('ideology_cit_multiethnic_nationalist').GetName]；[GetIdeology('ideology_rel_modern_moralist').GetName]；[GetIdeology('ideology_mil_patriotic_liberal').GetName]；[GetIdeology('ideology_fem_benevolent_sexism').GetName]\n#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_christ_dem_pedia_tooltip #bold #gold ChristDemPedia#!#!#!"
 je_bpm_group_reformists_and_volksbund_tooltip:0 "#v 改革派#!（#italic 德语/奥地利德语：#bold Reformisten#!#!）和#v 人民联盟成员#!（#italic 德语/奥地利德语：#bold Volksbundler#!#!）是基督教社会党（#italic 德语：#bold Christlichsoziale Partei, CS/CSP#!#!）内部的派系。#v 改革派#!围绕#bold 阿尔贝特·格斯曼#!和#bold 海因里希·马塔亚#!展开，而#v 人民联盟派#!由#bold 里夏德·施密茨#!和#bold 利奥波德·昆沙克#!领导。两派在使#bold CSP#!现代化、扩大选民基础和发展新思想方面密切合作。\n\n#v 改革派#!和#v 人民联盟派#!政治上中左、经济上中左、社会上中右。\n\n#v 改革派#!主要致力于使党内结构、领导、组织与联系现代化；扩大选民基础，与维也纳的#v 市民派#!作斗争，并使纲领现代化。他们推动党走向资本主义，抛弃了旧日的#bold 福格尔桑#!思想（这大大触怒了#v 社会浪漫派#!），并将选民基础扩展向城市工人选民。他们常将#v 人民联盟派#!的思想纳入党纲。\n\n#v 人民联盟派#!专注于意识形态发展，将选民基础扩展向农民、工人和青年。他们推动党走向资本主义，支持“#bold 国家社会主义#!”（施密茨）、比例代表制、[GetLawType('law_womens_suffrage').GetName]、广泛的劳工改革、“#bold 普及化#!”[GetLawType('law_universal_suffrage').GetName]（用于市政选举）。\n\n以下意识形态尽可能贴切地代表#v 改革派与人民联盟派#!：[GetIdeology('ideology_gov_moderate_monarchist').GetName]；[GetIdeology('ideology_dop_christian_democrat').GetName]；[GetIdeology('ideology_sta_federated_state').GetName]；[GetIdeology('ideology_eco_modern_interventionist').GetName]；[GetIdeology('ideology_wel_expanded_public_welfare').GetName]；[GetIdeology('ideology_cit_multiethnic_nationalist').GetName]；[GetIdeology('ideology_rel_modern_moralist').GetName]；[GetIdeology('ideology_mil_patriotic_liberal').GetName]；[GetIdeology('ideology_fem_benevolent_sexism').GetName]\n#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_christ_dem_pedia_tooltip #bold #gold ChristDemPedia#!#!#!"
 je_bpm_group_corporatists_tooltip:0 "#v 市民派#!（#italic 德语/奥地利德语：#bold Bürgerliche#!#!）是基督教社会党（#italic 德语：#bold Christlichsoziale Partei, CS/CSP#!#!）内部的一个派系。#v 市民派#!主要由#bold 里夏德·魏斯基希纳#!领导，代表该党的#italic 维也纳#!支部，主要得到维也纳工匠、店主和公务员的支持。\n\n他们的主要目标是维持维也纳的“法团主义”体制，其运作方式类似[GetLawType('law_census_voting').GetName]，偏袒较富裕者。他们在#italic 1918年#!#bold 奥匈帝国#!崩溃、以[GetLawType('law_universal_suffrage').GetName]取代库里亚体制、以及维也纳最终落入#v 社会民主党#!（#italic #bold SDAP?#!#!）之手后便消失了。一旦#v 市民派#!失去所有权力、党被其他所有潮流接管，#italic #bold 基督教社会党#!#!内部的#v 城乡#!分野也随之消失。该派系的残余及其位置被#v 教权派#!接管，而后者与前者几乎只在——正如其名所示——教权主义以及策略方法上有所不同。\n\n以下意识形态尽可能贴切地代表#v 市民派#!：[GetIdeology('ideology_gov_moderate_monarchist').GetName]；[GetIdeology('ideology_dop_moderate_democrat').GetName]；[GetIdeology('ideology_sta_federated_state').GetName]；[GetIdeology('ideology_eco_distributist_economy').GetName]；[GetIdeology('ideology_wel_distributist_welfare').GetName]；[GetIdeology('ideology_cit_multiethnic_nationalist').GetName]；[GetIdeology('ideology_rel_modern_moralist').GetName]；[GetIdeology('ideology_mil_patriotic_liberal').GetName]；[GetIdeology('ideology_fem_moderate_patriarchal').GetName]\n#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_christ_dem_pedia_tooltip #bold #gold ChristDemPedia#!#!#!"
 je_bpm_group_popolari_tooltip:0 "术语#v 平民党人#!（#italic 意大利语：#bold Popolari#!#!）指的是意大利人民党（#italic 意大利语：#bold Partito Popolare Italiano, PPI#!#!）的成员。尽管PPI的所有成员常被统称为#italic Popolari#!，但其中少数人并不遵循#bold 斯图尔佐#!式平民主义的原则。有时在外国史学中，PPI成员被称为#italic 平民党人#!，而#bold 斯图尔佐#!学说的信奉者则被称为#italic 平民主义者#!。\n\n#green 农本平民主义者#!\n#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_group_whites_tooltip @ig_agrarian_populists! #bold 白派#!#!（#italic 意大利语：#bold Bianchi#!#!）；\n\n#blue 基督教民主主义者#!\n#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_group_popularists_tooltip @ig_christian_democrats! #bold 平民主义者（左派）#!#!（#italic 意大利语：#bold Popolari#!#!）；\n#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_group_popularists_tooltip @ig_conservatives! #bold 平民主义者（右派）#!#!（#italic 意大利语：#bold Popolari#!#!）；\n\n#purple 民族保守主义者#!\n@ig_reactionaries! #bold 保守天主教徒#!（#italic 意大利语：#bold Cattolici Conservatori#!#!）；\n\n#italic PPI#!中可能的[Concept('concept_bpm_institutional_ig', '机构性利益集团')]：\n@trade_unions! 保守工会；"
 je_bpm_group_christlichsozialen_2_tooltip:0 "#v 共和国时期的基督教社会党人：#!\n#v 基督教社会党人#!政治上非自由-法团主义、经济上保守、社会上温和。\n\n随着#bold 第一共和国#!的建立，#v 基督教社会党人#!在[GetLawType('law_universal_suffrage').GetName]和议会制上变得更加非自由、法团主义和矛盾，尽管他们最终接受了[GetLawType('law_womens_suffrage').GetName]。他们对社会主义和自由政治的鄙夷大为增长，其宗教道德主义和反世俗主义亦然。他们仍支持一个联邦制的#gold 奥地利#!国家，并更支持有限的个人自由。\n\n经济上，他们支持有限干预但强保护主义的资本主义经济、更为“审慎”的税收和有限的土地改革。除严厉的紧缩措施和财政保守主义外，对国家任何有意义或更大规模经济控制的拥护都在减弱。对社会立法的态度转向非常宗教化、有时甚至是家长式的立场，甚至支持[GetLawType('law_religious_schools').GetName]。\n\n民族主义、反犹主义以及对军队的态度没有太大变化，前两者依然强劲。\n\n以下意识形态尽可能贴切地代表（#italic 共和国时期#!的）#v 基督教社会党人#!：[GetIdeology('ideology_gov_liberal_republican').GetName]；[GetIdeology('ideology_exe_strong_dynamic').GetName]；[GetIdeology('ideology_dop_conservative_democrat').GetName]；[GetIdeology('ideology_sta_federated_state').GetName]；[GetIdeology('ideology_eco_distributist_economy').GetName]；[GetIdeology('ideology_wel_distributist_welfare').GetName]；[GetIdeology('ideology_cit_multiethnic_nationalist').GetName]；[GetIdeology('ideology_rel_modern_moralist').GetName]；[GetIdeology('ideology_mil_patriotic_liberal').GetName]；[GetIdeology('ideology_fem_benevolent_sexism').GetName]"
 je_bpm_group_katholieken_tooltip:0 "#v 罗马天主教徒#!（#italic 荷兰语：#bold Rooms-katholieken#!#!）是构成荷兰各种罗马天主教[Concept('concept_party', '政党')]——如罗马天主教国家党（#italic 荷兰语：#bold Roomsch-Katholieke Staatspartij, RKSP#!#!）或反革命党的天主教支柱（#italic 荷兰语：#bold Anti-Revolutionaire Partij, ARP#!#!）——全部成员的@ig_christian_democrats! #blue 基督教民主主义者#!。他们谋求在选举政治中代表天主教的#bold 支柱#!，并推行与“#bold 新事#!”通谕理念相一致的改革。他们的根基在于#gold 荷兰#!的大多数天主教徒之中，并无特定的目标群体。\n\n#v 罗马天主教徒#!政治上中左、经济上中间、社会上中右。更偏向#bold 中产阶级#!的#v 罗马天主教徒#!反对扩大选举权，以免让“#bold 贫民窟居民#!”获得投票权，也不让#bold 人民主权#!凌驾于#bold 神授主权#!之上，但也常在推行福利等措施上趋于保守；而更偏向#bold 工人阶级#!的#v 罗马天主教徒#!则支持扩大选举权、更多的福利和经济干预。最受欢迎的左倾#v 罗马天主教徒#!是#bold 赫尔曼·沙普曼#!和#bold 阿尔方斯·阿里恩斯#!。\n\n#v 罗马天主教#!工人创造并普及了这句口号：“#bold 全世界天主教工人联合起来：#italic 新事#!!#!”\n\n在政治上，#v 罗马天主教徒#!支持现有的选举权体制，其中相对多数支持男女[GetLawType('law_universal_suffrage').GetName]。他们还支持比例代表制、去中心化以及确保新教徒与天主教徒平等的[GetLawType('law_freedom_of_conscience').GetName]。\n\n经济上，他们支持国家对经济更积极的干预。对[GetLawGroup('lawgroup_taxation').GetName]的立场各异，总体上支持有限的[GetLawType('law_protectionism').GetName]、阶级合作和温和的乡村发展。#v 罗马天主教徒#!支持一种遵循[GetTechnology('corporatism').GetName]理念的独特福利形式。他们希望福利由非国家行为体——如公司和合作社——来提供，其中福利、教育、住房等由雇主保障；社会无法覆盖的，则由国家承担。\n\n#v 罗马天主教徒#!是自由民族主义者、反军国主义者，在社会议题上总体更保守。他们支持更严格的道德立法，遏制消费主义和酗酒。\n\n以下意识形态尽可能贴切地代表#v 罗马天主教徒#!：[GetIdeology('ideology_gov_moderate_monarchist').GetName]；[GetIdeology('ideology_exe_weak_rigid').GetName]；[GetIdeology('ideology_dop_christian_democrat').GetName]；[GetIdeology('ideology_sta_federated_state').GetName]；[GetIdeology('ideology_eco_modern_interventionist').GetName]；[GetIdeology('ideology_wel_social_market_welfare').GetName]；[GetIdeology('ideology_cit_liberal_nationalist').GetName]；[GetIdeology('ideology_rel_modern_moralist').GetName]；[GetIdeology('ideology_mil_antimilitarist').GetName]；[GetIdeology('ideology_fem_benevolent_sexism').GetName]\n#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_christ_dem_pedia_tooltip #bold #gold ChristDemPedia#!#!#!"
 je_bpm_group_popular_democrats_tooltip:0 "#v 平民民主党人#!（#italic 法语：#bold démocrate populaires#!#!）是构成平民民主党（#italic 法语：#bold Parti démocrate populaire, PDP#!#!）多数的@ig_christian_democrats! #blue 基督教民主主义者#!。#v 平民民主党人#!遵循#bold 马克·桑尼耶#!和#bold 马塞尔·普雷洛#!的政治学说，以及#bold 奥古斯特·尚佩蒂耶·德里布#!的政治策略。他们的根基非常多元，最大的是体力劳动者#bold 7%#!、实业家#bold 6%#!、农民和商人各#bold 5%#!。\n\n#v 平民民主党人#!政治上左、经济上中左、社会上中左。在#bold 1926年教皇谴责#!了以@ig_reactionaries! #purple 民族保守主义#!为主的#v 法兰西行动#!之后，许多保守和反动的#gold 天主教徒#!转向了#bold PDP#!，使其右移。#v 平民民主党人#!尽管平均拥有#bold 5-6%#!的普遍支持，却苦于毫无权力，甚至连市政权力都没有；困扰他们的另一个问题是缺乏具体、原创的意识形态和社会层面的思想。\n\n政治上，#v 平民民主党人#!支持男女[GetLawType('law_universal_suffrage').GetName]、引入家庭票和比例代表制；但也支持单一制的#gold 法兰西第三共和国#!的广泛去中心化、温和的#bold 天主教#!政策。他们还支持将社会的职业和工会层面纳入政治。在1930年代，一些#v 平民民主党人#!支持一种“#bold 法团民主#!”，类似[GetLawType('law_organic_democracy').GetName]。\n\n经济上，#v 平民民主党人#!支持广泛的国家干预。与#italic 意大利#!的#v 平民主义者#!相似，他们支持[GetLawType('law_graduated_taxation').GetName]#yellow 税#!、有限的[GetLawType('law_protectionism').GetName]以及工厂工人参与（#italic 工人持股和利润分享#!）。他们还支持对经济关键方面的[Concept('concept_nationalize', '国有化')]，在#bold 大萧条#!期间支持就业计划，有时甚至以将妇女排除出劳动力为代价。在[Concept('concept_welfare_payments', '福利')]方面，他们支持以家庭为重点的广泛福利。\n\n社会上，#v 平民民主党人#!的特点是对军国主义的鄙夷和对第一次世界大战后各国和解的支持。他们相对国际主义，总体追求团结全球各国。在保守#gold 天主教徒#!流出#bold PDP#!期间，内部反犹主义滋长。\n\n以下意识形态尽可能贴切地代表#v 平民民主党人#!：[GetIdeology('ideology_gov_liberal_republican').GetName]；[GetIdeology('ideology_exe_strong_dynamic').GetName]；[GetIdeology('ideology_dop_christian_democrat').GetName]；[GetIdeology('ideology_sta_federated_state').GetName]；[GetIdeology('ideology_eco_modern_interventionist').GetName]；[GetIdeology('ideology_wel_expanded_public_welfare').GetName]；[GetIdeology('ideology_cit_christian_internationalist').GetName]；[GetIdeology('ideology_rel_modern_moralist').GetName]；[GetIdeology('ideology_mil_antimilitarist').GetName]；[GetIdeology('ideology_fem_benevolent_sexism').GetName]\n#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_christ_dem_pedia_tooltip #bold #gold ChristDemPedia#!#!#!"
 je_bpm_group_popularists_tooltip:0 "#v 平民主义者#!（#italic 意大利语：#bold Popolari#!#!）是构成意大利人民党（#italic 意大利语：#bold Partito Popolare Italiano, PPI#!#!）多数的@ig_christian_democrats! #blue 基督教民主主义者#!。#v 平民主义者#!遵循#bold 路易吉·斯图尔佐#!的政治学说和#bold 罗莫洛·穆里#!的教诲，谋求代表天主教徒并依照#bold 平民主义#!（#italic 意大利语：#bold Popolarismo#!#!）的理念改革国家。他们的根基主要在于农村劳动者和农民、神职人员、北方中产阶级和工人之中。\n\n#v 平民主义者#!政治上左、经济上中左、社会上左。更偏#bold 左#!的#v 平民主义者#!总体对与#pink 社会主义者#!的政治联盟持积极态度，更为激进、经济上更进步（#italic 在工人参与和福利方面#!），最著名的人物有#bold 阿喀琉斯·格兰迪#!、#bold 翁贝托·图皮尼#!和#bold 乔瓦尼·格龙基#!；更偏#bold 右#!的#v 平民主义者#!的特点是其保守-温和的立场，更倾向于与#yellow 自由主义者#!结盟，更强调私人福利，也更为不国际主义、对#gold 妇女权利#!更持怀疑态度，最著名的例子是#bold 阿尔契德·德·加斯佩里#!、#bold 乔瓦尼·巴蒂斯塔·米廖里#!和#bold 斯特凡诺·亚奇尼#!。\n\n政治上，#v 平民主义者#!支持男女[GetLawType('law_universal_suffrage').GetName]、比例代表制、扩大公共机构的去中心化、恢复#gold 天主教#!对国家的重要性（[GetLawType('law_freedom_of_conscience').GetName]）以及欢迎将社会-职业层面引入政治。\n\n经济上，他们支持国家积极干预经济、[GetLawType('law_graduated_taxation').GetName]#yellow 税#!、有限的[GetLawType('law_protectionism').GetName]以及工厂工人参与（#italic 工人持股和利润分享#!）。在农业方面，重点放在[GetLawGroup('lawgroup_land_reform').GetName]、乡村发展以及“#bold 大庄园的内部殖民#!”上。他们还支持广泛的社会和福利立法，无论是国内还是国际。\n\n#v 平民主义者#!是和平主义者和国际主义者，强烈鄙夷种族主义和特殊主义，谋求第一次世界大战后各国的和解以及裁军。#bold 斯图尔佐#!连接#italic 政治天主教#![Concept('concept_party', '政党')]的努力徒劳无功，未能引起其大多数成员真正的兴趣。\n\n以下意识形态尽可能贴切地代表#v 平民主义者#!：[GetIdeology('ideology_gov_moderate_monarchist').GetName]；[GetIdeology('ideology_exe_weak_rigid').GetName]；[GetIdeology('ideology_dop_christian_democrat').GetName]；[GetIdeology('ideology_sta_federated_state').GetName]；[GetIdeology('ideology_eco_modern_interventionist').GetName]；[GetIdeology('ideology_wel_expanded_public_welfare').GetName]；[GetIdeology('ideology_cit_christian_internationalist').GetName]；[GetIdeology('ideology_rel_modern_moralist').GetName]；[GetIdeology('ideology_mil_antimilitarist').GetName]；[GetIdeology('ideology_fem_benevolent_sexism').GetName]\n#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_christ_dem_pedia_tooltip #bold #gold ChristDemPedia#!#!#!"
 je_bpm_group_whites_tooltip:0 "#v 白派#!（#italic 意大利语：#bold Bianchi#!#!），有时也被贬称为“#bold 白色布尔什维克#!”，是构成意大利人民党（#italic 意大利语：#bold Partito Popolare Italiano, PPI#!#!）“#bold 极左#!”翼的一种天主教@ig_agrarian_populists! #green 农本平民主义者#!和意识形态上的#pink 工会主义者#!。#v 白派#!也指PPI的@trade_unions! #pink 城市工会#!，但该术语更常用于指农本派，有时仅指他们。\n\n#v 白派#!拥有相对广泛的群众支持（#italic 1919年注册的农村劳动者工会会员93万#!），但政治权力很小，且常与PPI其余部分发生冲突。最著名的人物、事实上的领袖是#bold 圭多·米廖利#!，主要报纸是“#bold 行动报#!”。\n\n#v 白派#!主要关注[GetLawType('law_universal_suffrage').GetName]、[GetLawGroup('lawgroup_land_reform').GetName]、和平主义以及乡村发展和福利等问题；他们提议无补偿的土地改革、广泛的乡村发展、对合作社和福利的支持。#bold 米廖利#!有时还号召对“#bold 农业资产阶级#!”进行社会革命，并领导了多次农民罢工和抗议。\n\n以下意识形态尽可能贴切地代表#v 白派#!：[GetIdeology('ideology_gov_placeholder').GetName]；[GetIdeology('ideology_dop_christian_democrat').GetName]；[GetIdeology('ideology_sta_minimal_state').GetName]；[GetIdeology('ideology_eco_modern_agrarian').GetName]；[GetIdeology('ideology_wel_expanded_public_welfare').GetName]；[GetIdeology('ideology_cit_liberal_nationalist').GetName]；[GetIdeology('ideology_rel_modern_moralist').GetName]；[GetIdeology('ideology_mil_antimilitarist').GetName]；[GetIdeology('ideology_fem_placeholder').GetName]\n#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_christ_dem_pedia_tooltip #bold #gold ChristDemPedia#!#!#!"
