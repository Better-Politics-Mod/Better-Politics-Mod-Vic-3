 children_rights_events.1.t:0 "无声的呐喊"
 children_rights_events.1.d:0 "为了动摇$country_legislature_name$其余成员的想法，[SCOPE.sCharacter('children_wrongs_ig_leader_scope').GetFullName]深入调查了[SCOPE.sState('child_labor_state').GetName]童工的工作环境。他发现，由于童工在工作场所遭受的非人待遇，[SCOPE.sState('child_labor_state').GetName]的许多家庭都选择把孩子藏起来，希望他们不必被送去劳作。"
 children_rights_events.1.f:0 ""妈妈叫我们保持安静，先生，所以我们照做了。我和弟弟就站在那儿，像坟墓一样安静，您瞧，我尽量屏住呼吸，但那儿太黑了，我心想那些打手已经走了。他们在这儿找不到我们，您瞧，妈妈是这么说的，但那儿太黑了，先生，而且很冷。""
 children_rights_events.1.a:0 "这消息会动摇$country_legislature_name$里一些人的想法"
 children_rights_events.1.b:0 "要不是[SCOPE.sCharacter('children_wrongs_ig_leader_scope').GetFullName]，这事根本不会传出去！"
 hidden_children_modifier:0 "被藏起的孩子"
 bpm_brought_hidden_children_modifier:0 "让被藏起的孩子受到关注"
 children_rights_events.2.t:0 "苦涩的真相"
 children_rights_events.2.d:0 "强烈反对该法律的[SCOPE.gsInterestGroup('children_wrongs_yes').GetName]指出，由于[SCOPE.sState('child_labor_state').GetName]的工人工资过低，他们被迫雇佣童工才能勉强糊口；一旦限制童工，那些家庭将遭受沉重打击。代表工人、却又支持该法律的[SCOPE.gsInterestGroup('trade_unions_scope').GetName]，陷入了两难境地。"
 children_rights_events.2.f:1 ""这简直是疯了！他们自己都逼着孩子去干活，我们还怎么帮助这些人？！我们必须做点什么！立即叫停这个野蛮的决定！"\n\n"嗯，很明显，如果他们还有别的选择，谁也不会让自己的孩子去干这个，对吧？仅凭这些可怜人的求生抉择就去评判他们，同样帮不了他们。""
 children_rights_events.2.a:0 "无论如何，我们必须阻止这一切。"
 children_rights_events.2.b:0 "他们只是在做活下去必须做的事。"
 stopped_families_modifier:0 "童工之争"
 allowed_families_send_their_children_modifier:0 "童工让步"
 didnt_allow_families_send_their_children_modifier:0 "未做童工让步"
 children_rights_events.3.t:0 "无法避免的工伤"
 children_rights_events.3.d:0 "随着政府推动[SCOPE.sLaw('current_law_scope').GetName]，成年男子被迫顶替孩子们留下的空缺。然而，他们的身体太大、手指太粗，无法胜任，工伤事故也随之不断增加。"
 children_rights_events.3.f:0 ""他们的尖叫响彻工厂，鲜血浸染机器，仿佛机器也长出了心脏。这已是一周内第十次有人试图操作那些先前只有孩童纤细的手才能操纵的微型机器，结果割伤了手指。抗议声此起彼伏：'若不是他们，那便是我们。'""
 children_rights_events.3.a:0 "不该有任何人从事这种工作。"
 children_rights_events.3.b:0 "孩子们回不来了，所以他们最好习惯这一切。"
 children_rights_event.3.c:0 "制定新规，避免再发生伤亡。"
