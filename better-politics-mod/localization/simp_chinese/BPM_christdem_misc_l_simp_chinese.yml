 je_bpm_group_lidovci_tooltip:0 "#v 利德维派#!（#italic 口语中，源自 #bold lidový#! 一词，意为#bold 人民的#!、#bold 属于人民的#!、#bold 大众的#!#!）是#gold 捷克斯洛伐克#!的@ig_christian_democrats! #blue 基督教民主主义者#!，在捷克斯洛伐克人民党（#italic 捷克语：#bold Československá strana lidová, ČSL#!#!）中构成相对多数。利德维派由#bold 扬·什拉梅克#!领导，他们谋求在捷克斯洛伐克国家中代表#bold 政治天主教#!，强调其#gold 天主教#!根源，并普遍推行各种受#bold 基督教社会训导#!启发的政策。他们的根基主要在于农民、工人和工匠之中。\n\n利德维派在政治上中左、经济上中右、社会上中右。除了总体上中立的利德维派之外，[concept_party]内部还有另两个流派——@ig_conservatives! #bold 保守利德维派#!和@ig_reactionaries! #purple 民族保守主义者#!——前者最著名的成员是#bold 莫日茨·赫鲁班#!，总体上更为宗教保守、对政治民主持务实态度、远为分配主义，甚至起初反对追求独立；而后者由#bold 博胡米尔·斯塔谢克#!领导，像任何其他#bold 民族保守主义者#!一样，对议会民主持否定态度，且更为分权主义。\n\n在政治上，利德维派支持#yellow 男性#!和#yellow 女性#![GetLawType('law_universal_suffrage').GetName]、比例代表制以及实施辅助性原则，但保留[GetLawType('law_unitary').GetName]的性质。他们还顽强地对抗世俗化，并凭借诸多妥协与务实，在历史上获得了成功（#italic 最终的法律是#bold 1926年国家补贴神职人员的法案#!#!）。\n\n在经济上，利德维派谋求扶植小型企业和合作社、[GetLawType('law_protectionism').GetName]，支持紧缩措施，并支持工厂工人参与（#italic 利润分享和参与管理#!）。在农业和福利方面，他们支持有补偿的[GetLawGroup('lawgroup_land_reform').GetName]，在教会财产问题上内部存在张力；同时支持广泛的社会立法，无论是保险、养老金还是法规。\n\n利德维派因其主要为#bold 捷克-摩拉维亚#!的特性和对#bold 捷克斯洛伐克主义#!的信念，反对自治，不承认#bold 斯洛伐克人#!，并在独立问题上总体持民族主义立场。他们还支持一切旨在确保独立与自卫能力的国家军事措施。\n\n以下意识形态尽可能贴切地代表利德维派：[GetIdeology('ideology_gov_liberal_republican').GetName]；[GetIdeology('ideology_exe_strong_dynamic').GetName]；[GetIdeology('ideology_dop_christian_democrat').GetName]；[GetIdeology('ideology_sta_federated_state').GetName]；[GetIdeology('ideology_eco_distributist_economy').GetName]；[GetIdeology('ideology_wel_expanded_public_welfare').GetName]；[GetIdeology('ideology_cit_multiethnic_nationalist').GetName]；[GetIdeology('ideology_rel_modern_moralist').GetName]；[GetIdeology('ideology_mil_patriotic_liberal').GetName]；[GetIdeology('ideology_fem_benevolent_sexism').GetName]\n#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_christ_dem_pedia_tooltip #bold #gold ChristDemPedia#!#!#!"
 je_bpm_group_chadecy_tooltip:0 "#v 哈德齐派#!（#italic 口语中，源自缩写#bold ChD#!，是#bold Chrześcijańska Demokracja#!——基督教民主——的首字母缩写#!）是#gold 波兰#!的@ig_christian_democrats! #blue 基督教民主主义者#!，其中绝大多数属于波兰基督教民主党（#italic 波兰语：#bold Polskie Stronnictwo Chrześcijańskiej Demokracji, PSChD#!#!）。他们的基督教民主形式深受其祖国发生的各种境况与事件的影响，在不同时期差异显著，转折点是#bold 大萧条#!的爆发。因此，他们被分为两个时期，一个在大萧条之前，另一个在大萧条期间及“之后”（大萧条及其影响其实从未真正结束）。他们的根基主要在于西里西亚工人、富裕的农村工人和中产阶级之中，大多来自普鲁士瓜分区。\n\n#v 1930年之前的哈德齐派：#!\n哈德齐派在政治上左倾、经济上右倾、社会上中右。\n\n在政治上，他们支持[GetLawType('law_universal_suffrage').GetName]和建立基督教民主，支持[GetLawType('law_womens_suffrage').GetName]，是坚定的宗教道德主义者，拒绝世俗国家，反对离婚，支持去中心化并提及联邦化。他们还强调赋权总统，并支持使参议院以经济为导向。\n\n在经济上，他们充满了矛盾与泛泛之谈。他们支持按照“#bold 新事#!”通谕的理念进行财富再分配，但同时反对对“正在#bold 毁掉#!”它们的“#bold 大企业#!”征收过高的税。他们支持“#bold 工人的赋权#!”（#italic 完全回归手工业生产#!），但同时反对“#bold 作为社会经济制度的国家主义#!”。他们还支持紧缩政策、强烈强调宗教的社会立法以及土地改革。\n\n他们强调波兰民族高于其他民族的重要性与首要地位，但仍尊重少数族裔，唯独犹太人除外，他们认为犹太人对“#bold 民族文化#!”构成威胁。他们还支持一支以现代、防御为主的国民军。\n\n以下意识形态尽可能贴切地代表（#italic 1930年之前的#!）哈德齐派：[GetIdeology('ideology_gov_liberal_republican').GetName]；[GetIdeology('ideology_exe_strong_dynamic').GetName]；[GetIdeology('ideology_dop_christian_democrat').GetName]；[GetIdeology('ideology_sta_federated_state').GetName]；[GetIdeology('ideology_eco_distributist_economy').GetName]；[GetIdeology('ideology_wel_distributist_welfare').GetName]；[GetIdeology('ideology_cit_multiethnic_nationalist').GetName]；[GetIdeology('ideology_rel_modern_moralist').GetName]；[GetIdeology('ideology_mil_patriotic_liberal').GetName]；[GetIdeology('ideology_fem_benevolent_sexism').GetName]\n\n#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_group_chadecy_2_tooltip #bold #grey 第二页#!#!#!\n#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_christ_dem_pedia_tooltip #bold #gold ChristDemPedia#!#!#!"
 je_bpm_group_chadecy_2_tooltip:0 "#v 1930年之后的哈德齐派：#!\n哈德齐派在政治上左倾、经济上左倾、社会上中立。\n\n随着全球性的激进化以及#gold 波兰#!威权主义的抬头，哈德齐派在政治事务上变得更加进步。他们仍然支持#yellow 普选#!和#yellow 妇女选举权#!，更加强调去中心化，支持完全的[GetLawType('law_freedom_of_conscience').GetName]、个人权利以及回归非威权的民主。\n\n在经济上，由于#v 大萧条#!的毁灭性打击，他们进一步发展并激进化，走向越来越反资本主义的“左翼”立场（当然，他们并非立即支持以下主张，而是逐步转向，最终成果是#bold 1937年#!的#v 劳动党#!纲领）。他们支持全面的“#bold 社会经济民主化#!”、合作社化与社会化、审慎的监管型经济、累进税制与福利。他们提出了一个“#bold #tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_group_chadecy_3_tooltip 结构化的[GetLawType('law_command_economy').GetName]#!#!”，私有制受到严格限制，以协助“#bold 全国性经济计划#!”。借助[Concept('concept_nationalize', '国有化')]或将所有权交给“#bold 自治政府或社会团体#!”，他们计划接管“#bold 对国家经济生活或其防御具有重大意义#!”的企业，以及“#bold 大型股份制企业及其分支机构#!”——这些企业所有者的重要性微乎其微，且不会随着“#bold 适当条件的成熟#!”而增长。中型和小型企业则大多保持私有。他们还支持土地改革，以及通过对乡村的“#bold 疗愈式重建#!”来振兴乡村，强调教育与现代化。\n\n他们的民族主义变化不大，只是其反犹主义在经济、社会和政治道德层面得到了强化。对斯拉夫联邦的支持也在内部大大增长。对军事的立场几乎没有变化。\n\n以下意识形态尽可能贴切地代表（#italic 1930年之后的#!）哈德齐派：[GetIdeology('ideology_gov_liberal_republican').GetName]；[GetIdeology('ideology_exe_strong_dynamic').GetName]；[GetIdeology('ideology_dop_christian_democrat').GetName]；[GetIdeology('ideology_sta_federated_state').GetName]；[GetIdeology('ideology_eco_centralized_economy').GetName]；[GetIdeology('ideology_wel_expanded_public_welfare').GetName]；[GetIdeology('ideology_cit_multiethnic_nationalist').GetName]；[GetIdeology('ideology_rel_modern_moralist').GetName]；[GetIdeology('ideology_mil_patriotic_liberal').GetName]；[GetIdeology('ideology_fem_benevolent_sexism').GetName]\n#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_christ_dem_pedia_tooltip #bold #gold ChristDemPedia#!#!#!"
 je_bpm_group_chadecy_3_tooltip:0 "#bold 哈德齐派是唯一宣布支持[GetLawType('law_command_economy').GetName]的@ig_christian_democrats! #blue 基督教民主主义者#!。#!"
 je_bpm_group_krikscionys_demokratai_tooltip:0 "#v Krikščionys Demokratai#!（#italic 字面意思即#bold 基督教民主主义者#!#!）是构成立陶宛基督教民主党（#italic 立陶宛语：Lietuvos krikščionių demokratų partija，#bold LKDP#!#!）多数的@ig_christian_democrats! #blue 基督教民主主义者#!。Krikščionys Demokratai由#bold 米科拉斯·克鲁帕维丘斯#!领导，他们谋求将#gold 立陶宛#!引向其天主教根源，并扩展其农本特性。他们的根基主要在于天主教知识分子和中产阶级之中。\n\nKrikščionys Demokratai在政治上右翼、经济上右翼、社会上右翼。Krikščionys Demokratai有两个亲密盟友：劳工派（#italic 源自立陶宛劳工联合会——Lietuvos darbo federacija，#bold LDF#!#!）主要关注经济上的[GetLawType('law_interventionism').GetName]和[Concept('concept_welfare_payments', '福利')]，其根基主要在乡村劳工和保守工人之中；农民派（#italic 源自农民协会——Ūkininkų sąjunga，#bold ŪS#!#!）主要关注丰富多彩的#bold 乡村发展#!和#bold 现代化#!，其根基主要在保守的农民和农场主之中。\n\n在政治上，Krikščionys Demokratai支持男女[GetLawType('law_universal_suffrage').GetName]、比例代表制和去中心化；他们还希望在政治生活的各个方面大力赋权#gold 天主教#!。尽管分权且民主，Krikščionys Demokratai却是威权的，利用强有力的[GetLawType('law_censorship').GetName]和戒严令来打击政敌；他们还希望保持行政部门的强大，并限制议会。\n\n在经济上，他们支持国家介入经济，首要目标是[GetLawGroup('lawgroup_land_reform').GetName]、宏大的乡村发展、赋权小农场主和贸易；他们还支持[GetLawType('law_protectionism').GetName]和更高的税收。在福利方面，他们希望强化其宗教层面，国家支持亦以此为引导。\n\nKrikščionys Demokratai是族裔民族主义者，谋求使立陶宛成为一个纯粹立陶宛人的国家；他们对#bold 犹太#!和#bold 波兰#!少数族裔尤为敌视，将任何对后者的支持都指责为“#bold 立陶宛的波兰化#!”。关于军事，最初在独立之初，他们支持一个动员程度高得多的[Concept('concept_country', '国家')]来捍卫并扩张它。战争之后，他们更偏好防御性军队，但因种种境况以及#bold 维尔纽斯#!的丧失，仍对#gold 波兰#!保持敌视态度。\n\n以下意识形态尽可能贴切地代表Krikščionys Demokratai：[GetIdeology('ideology_gov_liberal_republican').GetName]；[GetIdeology('ideology_exe_strong_dynamic').GetName]；[GetIdeology('ideology_dop_conservative_democrat').GetName]；[GetIdeology('ideology_sta_powerful_state').GetName]；[GetIdeology('ideology_eco_modern_agrarian').GetName]；[GetIdeology('ideology_wel_distributist_welfare').GetName]；[GetIdeology('ideology_cit_ethnonationalist').GetName]；[GetIdeology('ideology_rel_modern_moralist').GetName]；[GetIdeology('ideology_mil_patriotic_liberal').GetName]；[GetIdeology('ideology_fem_benevolent_sexism').GetName]\n#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_christ_dem_pedia_tooltip #bold #gold ChristDemPedia#!#!#!"
 je_bpm_group_catholics_tooltip:0 "#v 敬请期待！#!（#italic :SHRUG:#!）\n\n以下意识形态尽可能贴切地代表#v 瑞士天主教保守派#!：[GetIdeology('ideology_gov_liberal_republican').GetName]；[GetIdeology('ideology_exe_strong_dynamic').GetName]；[GetIdeology('ideology_dop_conservative_democrat').GetName]；[GetIdeology('ideology_sta_powerful_state').GetName]；[GetIdeology('ideology_eco_distributist_economy').GetName]；[GetIdeology('ideology_wel_distributist_welfare').GetName]；[GetIdeology('ideology_cit_multiethnic_nationalist').GetName]；[GetIdeology('ideology_rel_modern_moralist').GetName]；[GetIdeology('ideology_mil_patriotic_liberal').GetName]；[GetIdeology('ideology_fem_benevolent_sexism').GetName]\n#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_christ_dem_pedia_tooltip #bold #gold ChristDemPedia#!#!#!"
 je_bpm_group_young_right_tooltip_p2:0 "赫勒普特被委派参加F.C.C.C.A.的圣特赖登大会（1897年5月），他在会上提议在每个选区设立联合委员会，以汇聚各种社会运动和团体。沃斯特同意于1897年10月会见民主党人，但最终仍维持其反对立场，尽管主教们出面干预，“圣特赖登方案”还是未被#v 旧右翼#!接受。然而在#gold 比利时#!各地，都设立了联合委员会并达成了协议，为1898年的选举做准备。青年右翼保住了他们的代表，并赢得了更广泛的支持。\n\n随着时间推移，沃斯特的影响力不断缓慢下降，而青年右翼的支持持续增长，主教们和报纸都站在了他们一边。\n\n青年右翼与旧右翼之间的战争，已从悄无声息的基层转移到议会殿堂。1906年5月27日的立法选举在某种程度上削弱了政府的多数，但并未危及其地位。青年右翼对政府保守主义的不满，通过在对周日休息法（1905年7月26日）表决时弃权而表现出来。\n\n坎皮讷矿区特许权法案给了他们展示实力的绝佳机会。基督教民主主义者为授予这些特许权提出了条件：矿工养老金、八小时工作制上限、禁止妇女和儿童井下作业，以及改善工人的卫生设施。旧右翼和沃斯特意识到即将到来的危险，便提议将此事退回委员会审议。他的动议被否决了。基督教民主主义者打算为矿工争取最大利益，尽管旧右翼敦促他们不要强加“国家并不要求的改革”。\n\n由于谁也不愿向对方的要求让步，这场危机公开化了，社会主义者和激进自由派支持青年右翼并彼此合作。基督教民主主义者质疑政府的构成无法代表整个右翼，随后较为温和的前首相贝尔纳特加入了反对派。1907年4月12日，旧右翼政府倒台，该法案也随之下马，59名天主教徒和11名自由派投了赞成票，34名社会主义者、23名激进派和19名基督教民主主义者投了反对票。政府向国王递交了辞呈。\n\n#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_group_young_right_tooltip_p3 #bold #grey 第三页#!#!#!\n#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_christ_dem_pedia_tooltip #bold #gold ChristDemPedia#!#!#!"
 je_bpm_group_young_right_tooltip_p3:0 "下一届政府由朱尔·德·特罗兹领导，其中有2名青年右翼成员——朱尔·伦金和若里斯·赫勒普特，这向旧右翼表明，没有青年右翼的支持就不可能执政。\n\n沃斯特的影响力持续崩塌，到1907年他已在政治上完全无足轻重，随着亲青年右翼的德西雷-约瑟夫·梅西耶被任命为大主教，以及1909年第五届梅赫伦大会和沃斯特的又一次失败，他的影响力彻底消失了。当最终由温和派、且更亲近基督教民主的夏尔·德布罗克维尔执掌天主教党时，“旧”右翼实际上已不复存在，天主教党变得更加倾向基督教民主。\n\n所用资料来源：\n- 《1909年天主教大会之前的青年右翼与旧右翼》，菲利普·德福塞著；\n- 《西欧的基督教民主》，迈克尔·P·福格蒂著\n- 《1918-1945年欧洲的政治天主教》，沃尔夫拉姆·凯泽、赫尔穆特·沃努特（等）著；\n#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_christ_dem_pedia_tooltip #bold #gold ChristDemPedia#!#!#!"
