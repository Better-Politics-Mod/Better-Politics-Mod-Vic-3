l_turkish:
 concept_bpm_party_ban:0 "Parti Yasağı"
 concept_bpm_party_ban_desc:0 "Belirli [Concept('concept_law', 'Yasalar')] çeşitli [Concept('concept_party', 'Partilerin')] yasaklanmasına neden olabilir. Yasaklandığında, hiçbir [Concept('concept_interest_group','$concept_interest_groups$')] o [Concept('concept_party', 'Partiye')] katılamaz. İfade Özgürlüğü [Concept('concept_law', 'Yasalarınız')], parti yasaklarından tam olarak hangi [Concept('concept_party', 'Partilerin')] yasaklanacağını belirler."

 concept_bpm_bannable_parties:0 "Tüm Partiler Yasaklı"
 concept_bpm_bannable_parties_desc:0 "Sansür tüm partileri yasaklar ve onları parlamentoda Kurum liderliğindeki 'fraksiyonlar' olmaya zorlar. Yasadışı Muhalefet tüm partileri yasaklar ve Gericiler ile Kurumsal Çıkar Gruplarından oluşan devasa bir 'fraksiyon' yaratır. İdeolojik Çıkar Grupları çoğunlukla bağımsızdır."
 
 concept_bpm_bannable_reactionaries:0 "Yasaklı Gerici Partiler"
 concept_bpm_bannable_reactionaries_desc:0 "Faşist partiyi her zaman yasaklar. Sansür (veya daha ağırı) Gerici partiyi de yasaklar. Yasadışı Muhalefet, Muhafazakar ve Dindar partileri de yasaklar."
 concept_bpm_bannable_socialists:0 "Yasaklı Sosyalist Partiler"
 concept_bpm_bannable_socialists_desc:0 "Komünist ve Anarşist partileri (ve İkinci Enternasyonal'den önce Sosyal Demokrat Partiyi) her zaman yasaklar. Sansür (veya daha ağırı) Sosyal Demokrat partiyi de yasaklar (İkinci Enternasyonal'den sonraysa). Yasadışı Muhalefet Radikal partiyi de yasaklar."
 concept_bpm_bannable_reactionaries_plus:0 "Yasaklı Anti-Sosyalist Partiler"
 concept_bpm_bannable_reactionaries_plus_desc:0 "Faşist, Gerici, Dindar ve Muhafazakar partileri her zaman yasaklar. Sansür (veya daha ağırı) Liberal ve Tarımcı partileri de yasaklar. Yasadışı Muhalefet Radikal partiyi de yasaklar."
 concept_bpm_bannable_socialists_plus:0 "Yasaklı Gelenek Karşıtı Partiler"
 concept_bpm_bannable_socialists_plus_desc:0 "Komünist, Anarşist, Sosyal Demokrat ve Radikal partileri her zaman yasaklar. Sansür (veya daha ağırı) Liberal ve Tarımcı partileri de yasaklar. Yasadışı Muhalefet Muhafazakar partiyi de yasaklar."
 concept_bpm_bannable_liberals:0 "Yasaklı Liberal Partiler"
 concept_bpm_bannable_liberals_desc:0 "Liberal ve Radikal partileri her zaman yasaklar. Sansür (veya daha ağırı) Tarımcı partiyi de yasaklar. Yasadışı Muhalefet Muhafazakar partiyi de yasaklar."
 concept_bpm_bannable_antiliberals:0 "Yasaklı Anti-Liberal Partiler"
 concept_bpm_bannable_antiliberals_desc:0 "Komünist, Anarşist ve Faşist partileri (ve İkinci Enternasyonal'den önce Sosyal Demokrat Partiyi) her zaman yasaklar. Sansür (veya daha ağırı) Gerici partiyi de yasaklar (ve İkinci Enternasyonal'den sonra Sosyal Demokrat Partiyi). Yasadışı Muhalefet Radikal ve Dindar partileri de yasaklar."

 concept_bpm_socialist_agitator:0 "Sosyalist Agitatör"
 concept_bpm_socialist_agitator_desc:0 "[Concept('concept_ideology', 'İdeolojisi')] veya [Concept('concept_interest_group', 'Çıkar Grubu')] [GetLawType('law_council_republic').GetName] [Concept('concept_law', 'Yasasısının')] geçirilmesini destekleyen bir agitatör."

 concept_bpm_global_je:0 "Küresel Günlük Kaydı"
 concept_bpm_global_je_desc:0 "Tüm ülkelerde aynı anda aktif olan bir günlük kaydı. İlerleme bu ülkeler arasında paylaşılır ve ilerlemeyi etkileyen faktörler genellikle uluslararasıdır."

# Repeatable Law concepts
 concept_bpm_repeatable_law:0 "Tekrarlanabilir Yasa"
 concept_bpm_repeatable_laws:0 "Tekrarlanabilir Yasalar"
 concept_bpm_repeatable_law_desc:0 "$concept_bpm_repeatable_laws$, bir [Concept('concept_country', 'Ülkenin')] defalarca yürürlüğe koyabileceği [Concept('concept_law', 'Yasalardır')], çünkü bu tür bir Yasanın her yürürlüğe girişi onu varsayılan bir değere sıfırlar.\n\n$concept_bpm_repeatable_laws$ anında etkiler üretir ve normal yasalara göre geçirilmesi daha hızlıdır. Geçirildikten sonra $concept_bpm_repeatable_law$ bekleme süresine girer. Katlanarak artan etkilerle aynı anda birden fazla $concept_bpm_repeatable_laws$ geçirilebilir.\n\n@information! #blue #v Faydalı İpucu:#! Bunlar, daha anlamlı reformlar henüz mümkün olmadığında yasamanızı meşgul edebilecek isteğe bağlı yasalardır. Bazı tekrarlanabilir yasalar riskli olabilecek tavizlerle birlikte gelir, bu nedenle onları yürürlüğe koymadan önce dikkatlice düşündüğünüzden emin olun.#!"

# IG concepts

 concept_bpm_ideological_ig:0 "İdeolojik Çıkar Grubu"
 concept_bpm_ideological_ig_desc:0 "Bir İdeolojik [Concept('concept_interest_group', 'Çıkar Grubu')], güçlü ideolojik doğasıyla tanımlanır. Geniş bir [Concept('concept_law', 'Yasa')] yelpazesinde onlara güçlü fikirler veren geniş bir [Concept('concept_ideology', 'İdeoloji')] seçkisine sahiptirler. Bunlar aynı zamanda en değişken [Concept('concept_interest_group', 'Çıkar Gruplarıdır')]; sıklıkla [Concept('concept_radical', 'Radikallerden')] veya [Concept('concept_loyalist', 'Sadıklardan')] ve ülkenizdeki çeşitli olayların bir sonucu olarak destekçi kazanırlar."
 concept_bpm_institutional_ig:0 "Kurumsal Çıkar Grubu"
 concept_bpm_institutional_ig_desc:0 "Bir Kurumsal [Concept('concept_interest_group', 'Çıkar Grubu')], görece ideolojik olmayan doğasıyla tanımlanır. En çok doğrudan kendi maddi çıkarlarıyla ilgili olan, önem verdikleri mütevazı bir [Concept('concept_ideology', 'İdeoloji')] seçkisine sahiptirler. Bu [Concept('concept_interest_group', 'Çıkar Grupları')], [Concept('concept_bpm_politically_stagnant', 'Siyasi Açıdan Durgun')] ülkelerde baskın olma eğilimindeyken, [Concept('concept_bpm_politically_unstable', 'Siyasi İstikrarsızlık')] dönemlerinde önemsizleşerek kaybolurlar."

# VERY LONG STUFF BELOW
# PROLETARIAN
 tooltip_bpm_ig_is_revolutionary_socialist:0 "Bir [Concept('concept_bpm_ig_is_revolutionary_socialist', '$concept_bpm_ig_is_revolutionary_socialist$')] [Concept('concept_interest_group', 'Çıkar Grubu')]"
 concept_bpm_ig_is_revolutionary_socialist:0 "Devrimci Sosyalist"
 concept_bpm_ig_is_revolutionary_socialist_desc:0 "[GetIdeology('ideology_gov_radical_proletarian').GetName] [Concept('concept_ideology', 'İdeolojisine')] sahip olan ve [GetIdeology('ideology_dop_anarchist').GetName] [Concept('concept_ideology', 'İdeolojisine')] sahip olmayan bir [Concept('concept_interest_group', 'Çıkar Grubu')]. Sosyalizme ulaşmak ve devletin sönümlenmesi için parti örgütlenmesini gerekli görürler."

 tooltip_bpm_ig_is_anarchist:0 "Bir [Concept('concept_bpm_ig_is_anarchist', '$concept_bpm_ig_is_anarchist$')] [Concept('concept_interest_group', 'Çıkar Grubu')]"
 concept_bpm_ig_is_anarchist:0 "Anarşist"
 concept_bpm_ig_is_anarchist_desc:0 "[GetIdeology('ideology_dop_anarchist').GetName] veya [GetIdeology('ideology_dop_anarcho_syndicalist').GetName] [Concept('concept_ideology', 'İdeolojilerinden')] birine sahip bir [Concept('concept_interest_group', 'Çıkar Grubu')]. Acil hedefleri olarak başta devlet olmak üzere her türlü hiyerarşinin ortadan kaldırılması gerektiğine inanırlar."

 tooltip_bpm_ig_is_radical_socialist:0 "Bir [Concept('concept_bpm_ig_is_radical_socialist', '$concept_bpm_ig_is_radical_socialist$')] [Concept('concept_interest_group', 'Çıkar Grubu')]"
 concept_bpm_ig_is_radical_socialist:0 "Radikal Sosyalist"
 concept_bpm_ig_is_radical_socialist_desc:0 "@ig_socialists! #bold Sosyalistler#! [Concept('concept_interest_group', 'Çıkar Grubu')] veya [Concept('concept_bpm_ig_is_revolutionary_socialist', 'Devrimci Sosyalist')] ya da [Concept('concept_bpm_ig_is_anarchist', 'Anarşist')] olan bir [Concept('concept_interest_group', 'Çıkar Grubu')]. Sosyalizmin reformdan ziyade bir devrim yoluyla elde edilebileceğine inanırlar."

 tooltip_bpm_ig_is_reformist_socialist:0 "Bir [Concept('concept_bpm_ig_is_reformist_socialist', '$concept_bpm_ig_is_reformist_socialist$')] [Concept('concept_interest_group', 'Çıkar Grubu')]"
 concept_bpm_ig_is_reformist_socialist:0 "Reformist Sosyalist"
 concept_bpm_ig_is_reformist_socialist_desc:0 "@ig_reformist_socialists! #bold Reformist Sosyalistler#! [Concept('concept_interest_group', 'Çıkar Grubu')] veya [GetIdeology('ideology_gov_moderate_proletarian').GetName] [Concept('concept_ideology', 'İdeolojisine')] sahip bir [Concept('concept_interest_group', 'Çıkar Grubu')]. Devrim yerine reformlar yoluyla sosyalizme ulaşma olasılığına inanırlar."

 tooltip_bpm_ig_is_syndicalist:0 "Bir [Concept('concept_bpm_ig_is_syndicalist', '$concept_bpm_ig_is_syndicalist$')] [Concept('concept_interest_group', 'Çıkar Grubu')]"
 concept_bpm_ig_is_syndicalist:0 "Sendikalist"
 concept_bpm_ig_is_syndicalist_desc:0 "[GetIdeology('ideology_dop_syndicalist').GetName], [GetIdeology('ideology_dop_anarcho_syndicalist').GetName] veya [GetIdeology('ideology_dop_syndical_unionist').GetName] [Concept('concept_ideology', 'İdeolojilerinden')] birine sahip bir [Concept('concept_interest_group', 'Çıkar Grubu')]. Sosyalizm altında toplumun yapı taşlarının sendikalar olması gerektiğine inanırlar."

 tooltip_bpm_ig_is_party_socialist:0 "Bir [Concept('concept_bpm_ig_is_party_socialist', '$concept_bpm_ig_is_party_socialist$')] [Concept('concept_interest_group', 'Çıkar Grubu')]"
 concept_bpm_ig_is_party_socialist:0 "Parti Sosyalisti"
 concept_bpm_ig_is_party_socialist_desc:0 "[Concept('concept_bpm_ig_is_revolutionary_socialist', 'Devrimci Sosyalist')] veya [Concept('concept_bpm_ig_is_reformist_socialist', 'Reformist Sosyalist')] olan bir [Concept('concept_interest_group', 'Çıkar Grubu')]. Disiplinli bir parti yapısının sosyalizme doğru atılması gereken gerekli bir adım olduğuna inanırlar."

 tooltip_bpm_ig_is_authoritarian_socialist:0 "Bir [Concept('concept_bpm_ig_is_authoritarian_socialist', '$concept_bpm_ig_is_authoritarian_socialist$')] [Concept('concept_interest_group', 'Çıkar Grubu')]"
 concept_bpm_ig_is_authoritarian_socialist:0 "Otoriter Sosyalist"
 concept_bpm_ig_is_authoritarian_socialist_desc:0 "[Concept('concept_bpm_ig_is_socialist', 'Devrimci Sosyalist')] olan ve [GetIdeology('ideology_dop_party_socialist').GetName] veya [GetIdeology('ideology_dop_party_state').GetName] [Concept('concept_ideology', 'İdeolojilerinden')] birine sahip bir [Concept('concept_interest_group', 'Çıkar Grubu')]. Devrimin kazanımlarını korumak için sosyalist bir devletin gerekli olduğuna inanırlar."

 tooltip_bpm_ig_is_moderate_socialist:0 "Bir [Concept('concept_bpm_ig_is_moderate_socialist', '$concept_bpm_ig_is_moderate_socialist$')] [Concept('concept_interest_group', 'Çıkar Grubu')]"
 concept_bpm_ig_is_moderate_socialist:0 "Ilımlı Sosyalist"
 concept_bpm_ig_is_moderate_socialist_desc:0 "Hem [Concept('concept_bpm_ig_is_party_socialist', 'Parti Sosyalisti')] olan ve ne [GetIdeology('ideology_gov_radical_proletarian').GetName] ne de [GetIdeology('ideology_gov_moderate_proletarian').GetName] [Concept('concept_ideology', 'İdeolojisine')] sahip olmayan ya da [GetIdeology('ideology_eco_agrarian_socialist').GetName] [Concept('concept_ideology', 'İdeolojisine')] sahip bir [Concept('concept_interest_group', 'Çıkar Grubu')]. Tamamen sosyalist bir ekonominin ve devletin şu an için çok aşırıya kaçmak olduğuna, ancak yine de bazı ilerici reformlara inanırlar."

 tooltip_bpm_ig_is_proletarian_socialist:0 "Bir [Concept('tooltip_bpm_ig_is_proletarian_socialist', '$tooltip_bpm_ig_is_proletarian_socialist$')] [Concept('concept_interest_group', 'Çıkar Grubu')]"
 concept_bpm_ig_is_proletarian_socialist:0 "Proleter Sosyalist"
 concept_bpm_ig_is_proletarian_socialist_desc:0 "[Concept('concept_bpm_ig_is_party_socialist', 'Parti Sosyalisti')], [Concept('concept_bpm_ig_is_anarchist', 'Anarşist')] veya [Concept('concept_bpm_ig_is_syndicalist', 'Sendikalist')] olan bir [Concept('concept_interest_group', 'Çıkar Grubu')]. Sosyalizmi getirecek birincil sınıfın endüstriyel işçi sınıfı, yani Proletarya olduğuna inanırlar."

 tooltip_bpm_ig_is_socialist:0 "Bir [Concept('concept_bpm_ig_is_socialist', '$concept_bpm_ig_is_socialist$')] [Concept('concept_interest_group', 'Çıkar Grubu')]"
 concept_bpm_ig_is_socialist:0 "Sosyalist"
 concept_bpm_ig_is_socialist_desc:0 "[Concept('concept_bpm_ig_is_proletarian_socialist', 'Proleter Sosyalist')] olan veya [GetIdeology('ideology_eco_agrarian_socialist').GetName] [Concept('concept_ideology', 'İdeolojisine')] sahip bir [Concept('concept_interest_group', 'Çıkar Grubu')]. Üretim araçlarının ve yönetimin doğrudan halk tarafından kontrol edilmesini güvence altına almanın, yani sosyalizmin, arzu edilen bir nihai hedef olduğuna inanırlar."

 tooltip_bpm_ig_is_proletarian:0 "Bir [Concept('concept_bpm_ig_is_proletarian', '$concept_bpm_ig_is_proletarian$')] [Concept('concept_interest_group', 'Çıkar Grubu')]"
 concept_bpm_ig_is_proletarian:0 "Proleter"
 concept_bpm_ig_is_proletarian_desc:0 "[GetLawType('law_corporatized_unions').GetName] altında olmayan #bold Sendikalar#! [Concept('concept_interest_group', 'Çıkar Grubu')] veya [Concept('concept_bpm_ig_is_proletarian_socialist', 'Proleter Sosyalist')] olan bir [Concept('concept_interest_group', 'Çıkar Grubu')]. Bu değişim çağında sanayi işçilerinin arzularını temsil ederler."

 tooltip_bpm_ig_is_labor:0 "Bir [Concept('concept_bpm_ig_is_labor', '$concept_bpm_ig_is_labor$')] [Concept('concept_interest_group', 'Çıkar Grubu')]"
 concept_bpm_ig_is_labor:0 "Emek"
 concept_bpm_ig_is_labor_desc:0 "[Concept('concept_bpm_ig_is_socialist', 'Sosyalist')] veya [Concept('concept_bpm_ig_is_proletarian', 'Proleter')] olan bir [Concept('concept_interest_group', 'Çıkar Grubu')]. Çalışan halkların arzularını desteklemeye inanırlar."

 tooltip_bpm_ig_is_actually_desiring_socialism:0 "Bir [Concept('concept_bpm_ig_is_actually_desiring_socialism', '$concept_bpm_ig_is_actually_desiring_socialism$')] [Concept('concept_interest_group', 'Çıkar Grubu')]"
 concept_bpm_ig_is_actually_desiring_socialism:0 "Gerçek Anlamda Sosyalist"
 concept_bpm_ig_is_actually_desiring_socialism_desc:0 "Hem [Concept('concept_bpm_ig_is_socialist', 'Sosyalist')] olan hem de [Concept('concept_bpm_ig_is_moderate_socialist', 'Ilımlı Sosyalist')] #bold olmayan#! bir [Concept('concept_interest_group', 'Çıkar Grubu')]. Sosyalizmin görece yakın bir gelecekte inşa edilebileceğine ve edilmesi gerektiğine inanırlar."

# AGRARIAN

 tooltip_bpm_ig_is_agrarian:0 "Bir [Concept('concept_bpm_ig_is_agrarian', '$concept_bpm_ig_is_agrarian$')] [Concept('concept_interest_group', 'Çıkar Grubu')]"
 concept_bpm_ig_is_agrarian:0 "Tarımcı"
 concept_bpm_ig_is_agrarian_desc:0 "[GetIdeology('ideology_eco_agrarian_socialist').GetName], [GetIdeology('ideology_eco_modern_agrarian').GetName], [GetIdeology('ideology_eco_traditional_agrarian').GetName], [GetIdeology('ideology_eco_slave_economy').GetName], [GetIdeology('ideology_eco_serf_economy').GetName], [GetIdeology('ideology_eco_trad_isolationist').GetName] veya [GetIdeology('ideology_eco_agrarian_autarky').GetName] [Concept('concept_ideology', 'İdeolojilerinden')] birine sahip bir [Concept('concept_interest_group', 'Çıkar Grubu')]. Tarımın ihtiyaçlarına öncelik vermeyi ve onu ekonominin odak noktası olarak görmeyi desteklerler."

 tooltip_bpm_ig_wants_small_government:0 "Bir [Concept('concept_bpm_ig_wants_small_government', '$concept_bpm_ig_wants_small_government$')] [Concept('concept_interest_group', 'Çıkar Grubu')]"
 concept_bpm_ig_wants_small_government:0 "Sınırlı Devlet"
 concept_bpm_ig_wants_small_government_desc:0 "[GetIdeology('ideology_sta_minimal_state').GetName], [GetIdeology('ideology_sta_decentralized_state').GetName], [GetIdeology('ideology_sta_subjugated_state').GetName] veya [GetIdeology('ideology_sta_weak_state').GetName] [Concept('concept_ideology', 'İdeolojilerinden')] birine sahip bir [Concept('concept_interest_group', 'Çıkar Grubu')]. Toplumun iyiliği için vatandaşlarının (veya en azından kendi gruplarının destekçilerinin) yolundan çekilen küçük bir devlete ihtiyaç olduğuna inanırlar."

 tooltip_bpm_ig_is_pro_serfdom:0 "Bir [Concept('concept_bpm_ig_is_pro_serfdom', '$concept_bpm_ig_is_pro_serfdom$')] [Concept('concept_interest_group', 'Çıkar Grubu')]"
 concept_bpm_ig_is_pro_serfdom:0 "Serflik Yanlısı"
 concept_bpm_ig_is_pro_serfdom_desc:0 "[GetIdeology('ideology_eco_serf_economy').GetName], [GetIdeology('ideology_eco_trad_isolationist').GetName] veya [GetIdeology('ideology_eco_debt_serf_economy').GetName] [Concept('concept_ideology', 'İdeolojilerinden')] birine sahip bir [Concept('concept_interest_group', 'Çıkar Grubu')]. Büyük tarım arazilerine bağlı köylü serflerin geleneksel yapısını korumaya çalışırlar."

# LIBERAL IGS

 tooltip_bpm_ig_is_democrat:0 "Bir [Concept('concept_bpm_ig_is_democrat', '$concept_bpm_ig_is_democrat$')] [Concept('concept_interest_group', 'Çıkar Grubu')]"
 concept_bpm_ig_is_democrat:0 "Demokrat"
 concept_bpm_ig_is_democrat_desc:0 "[GetIdeology('ideology_dop_radical_democrat').GetName], [GetIdeology('ideology_dop_moderate_democrat').GetName] veya [GetIdeology('ideology_dop_authoritarian_democrat').GetName] [Concept('concept_ideology', 'İdeolojilerinden')] birine sahip bir [Concept('concept_interest_group', 'Çıkar Grubu')]. Modern çağda ayakta kalmak isteyen herhangi bir devlet için en azından bir tür seçim hakkının gerekli olduğuna inanırlar."

 tooltip_bpm_ig_is_republican:0 "Bir [Concept('concept_bpm_ig_is_republican', '$concept_bpm_ig_is_republican$')] [Concept('concept_interest_group', 'Çıkar Grubu')]"
 concept_bpm_ig_is_republican:0 "Cumhuriyetçi"
 concept_bpm_ig_is_republican_desc:0 "[GetIdeology('ideology_gov_liberal_republican').GetName] veya [GetIdeology('ideology_gov_radical_republican').GetName] [Concept('concept_ideology', 'İdeolojilerinden')] birine sahip bir [Concept('concept_interest_group', 'Çıkar Grubu')]. Monarşi fikrinin geçmiş bir çağın kalıntısı olduğuna, ondan kurtulunması ve yerine liberal bir cumhuriyetin getirilmesi gerektiğine inanırlar."

 tooltip_bpm_ig_is_radical_liberal:0 "Bir [Concept('concept_bpm_ig_is_radical_liberal', '$concept_bpm_ig_is_radical_liberal$')] [Concept('concept_interest_group', 'Çıkar Grubu')]"
 concept_bpm_ig_is_radical_liberal:0 "Radikal Liberal"
 concept_bpm_ig_is_radical_liberal_desc:0 "@ig_radicals! #bold Radikaller#! [Concept('concept_interest_group', 'Çıkar Grubu')] veya [GetIdeology('ideology_dop_radical_democrat').GetName] [Concept('concept_ideology', 'İdeolojisine')] sahip olan ancak [Concept('concept_bpm_ig_is_actually_desiring_socialism', '$concept_bpm_ig_is_actually_desiring_socialism$')] [Concept('concept_interest_group', 'Çıkar Grubu')] #bold olmayan#! bir [Concept('concept_interest_group', 'Çıkar Grubu')]. İnsanların hükümetin saygı duyması gereken doğuştan haklara sahip olduğuna inanırlar ve liberalizmin eşitlikçi ile bireyci hayalini gerçekleştirmek için savaşırlar."

 tooltip_bpm_ig_is_moderate_liberal:0 "Bir [Concept('concept_bpm_ig_is_moderate_liberal', '$concept_bpm_ig_is_moderate_liberal$')] [Concept('concept_interest_group', 'Çıkar Grubu')]"
 concept_bpm_ig_is_moderate_liberal:0 "Ilımlı Liberal"
 concept_bpm_ig_is_moderate_liberal_desc:0 "@ig_liberals! #bold Liberaller#! [Concept('concept_interest_group', 'Çıkar Grubu')] veya [GetIdeology('ideology_dop_moderate_democrat').GetName] [Concept('concept_ideology', 'İdeolojisine')] sahip bir [Concept('concept_interest_group', 'Çıkar Grubu')]. Demokrasiyi teşvik etmeye inanırlar, ancak devrimci kaosu önlemek için ılımlı bir temponun gerekli olduğunu düşünürler."

 tooltip_bpm_ig_is_non_religious:0 "Bir [Concept('concept_bpm_ig_is_non_religious', '$concept_bpm_ig_is_non_religious$')] [Concept('concept_interest_group', 'Çıkar Grubu')]"
 concept_bpm_ig_is_non_religious:0 "Sekülerist"
