 je_bpm_split_patcons:0 "家长保守主义崛起"
 je_bpm_split_patcons_status:0 "监测保守派对家长主义的接纳。"
 je_bpm_split_patcons_reason:0 "现代问题需要现代解决方案。快速的工业化与城市化极大地提升了生产力，而工人阶级却在破败的贫民窟中挣扎。我们的保守派若想抵御左翼激进派的诱惑，此刻也必须去关注穷人的疾苦。\n\n#lore “只要劳动者身体健康，就给予他工作的权利；他生病时，保障他得到照料；他年老时，保障他获得赡养……只要国家能为劳动者多展现几分基督徒般的关怀，那么我相信，社会民主党纲领的先生们将徒劳地吹响他们的鸟哨，而一旦劳动者看到政府和立法机构真心关切他们的福祉，涌向那些人的队伍便会随之消散。”\n\n——奥托·冯·俾斯麦，1884#!"
 je_bpm_split_patcons_special_tooltip:0 "该进度由以下因素决定：\n#variable [Country.MakeScope.Var('bpm_je_split_patcons_progress_from_base').GetValue|+=]#! 基础值\n#variable [Country.MakeScope.Var('bpm_je_split_patcons_progress_from_poverty').GetValue|+=]#! 来自生活水平低于最低预期的人口\n#variable [Country.MakeScope.Var('bpm_je_split_patcons_progress_from_loyalists').GetValue|+=]#! 来自已整合地区的忠诚派\n#variable [Country.MakeScope.Var('bpm_je_split_patcons_progress_from_radicals').GetValue|+=]#! 来自已整合地区的激进派\n#variable [Country.MakeScope.Var('bpm_je_split_patcons_progress_from_conservative_status').GetValue|+=]#! 来自#bold 保守#![Concept('concept_interest_group', '利益集团')]受打压\n#variable [Country.MakeScope.Var('bpm_je_split_patcons_progress_from_left_wing_power').GetValue|+=]#! 来自强大的左翼[Concept('concept_interest_group', '利益集团')]\n#variable [Country.MakeScope.Var('bpm_je_split_patcons_progress_from_left_wing_government').GetValue|+=]#! 来自执政的激进左翼[Concept('concept_interest_group', '利益集团')]\n#variable [Country.MakeScope.Var('bpm_je_split_patcons_progress_from_communist_victory_coping').GetValue|+=]#! 来自已颁布的委员会共和制法律\n#variable [Country.MakeScope.Var('bpm_je_split_patcons_progress_from_corporatism').GetValue|+=]#! 来自已研究#bold 社团主义#!\n#variable [Country.MakeScope.Var('bpm_je_split_patcons_progress_from_marlibs').GetValue|+=]#! 来自存在的#bold 市场自由#![Concept('concept_interest_group', '利益集团')]"
