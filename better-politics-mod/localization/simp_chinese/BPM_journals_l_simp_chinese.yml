 bpm_russia.1.t:0 "哲学书简"
 bpm_russia.1.d:0 "一册由[SCOPE.sCharacter('bpm_russia_chaadayev').GetFullName]从法文译出的书信集出版，令俄国少数识字之人沸腾起来——书中字句令[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFullName]宣布其为疯子，而全国的知识分子或谴责或支持他，通过两极化的辩论阐发书简中表达的思想。不经意间，[SCOPE.sCharacter('bpm_russia_chaadayev').GetFullName]挑起了近半个世纪俄国哲学中最深刻的分裂——西方派与斯拉夫派之间的那场分裂。"
 bpm_russia.1.f:0 "曾几何时，彼得大帝想要教化我们，为使我们对启蒙满怀渴望，他向我们抛来文明的外衣：我们接住了外衣，却未触及文明……我们的血液中有某种东西，驱散了一切真正的进步。而今天……我们在思想领域划下了一片虚空。\n\n——彼得·恰达耶夫，1836#!"
 bpm_russia.1.a:0 "看在上帝份上，把这个疯子软禁起来！"
 bpm_russia.1.b:0 "他尖刻的话语中确有些许道理……"
 bpm_russia.2.t:0 "折断的矛"
 bpm_russia.2.d:0 "俄国知识界中西方派与斯拉夫派两翼之间的辩论，几年前还是那般炽热激昂，如今终于落下帷幕。无论好坏，俄国的政治思想已然前行。"
 bpm_russia.2.f:0 "最终，新的哲学与新的议题吸引了知识分子的注意。这场辩论的终结，并非以一场轰动的胜利，而是以震耳欲聋的沉寂。"
 bpm_russia.2.a:0 "然而俄国依然坚忍"
 bpm_russia.3.t:0 "梦想者"
 bpm_russia.3.d:0 "西方派的梦想已在俄国实现——一个自由俄国公民的梦想。尽管俄国的未来尚未书写，但看来它将是那个并非由古老衰朽的贵族及其暴虐沙皇、而是由俄国人民自己书写的未来。俄国在至关重要的方面追赶上了西方——现在，让我们看看它能否更进一步，超越它们！"
 bpm_russia.3.f:0 "我们未曾想过这是可能的——一个落后于文明国家的国度竟能如此迅速地追赶上来。但那些心怀梦想之人已将梦想化为现实，而俄国的未来似乎也明亮了那么一点点。"
 bpm_russia.3.a:0 "前进！"
 je_bpm_split_fascists:0 "法西斯主义崛起"
 je_bpm_split_fascists_status:0 "监测右翼新元素的崛起。"
 je_bpm_split_fascists_reason:0 "在群众政治崛起之际，传统反动意识形态的失败正催生出一个革命民族主义者的新联盟。法西斯分子从退伍军人组织和右翼专业人士那里获得支持，他们试图建立一个以阶级合作和武器化的民族神话为基础的强大中央集权国家。\n\n#lore “看来……人已被战争冲击得忘记了自己如何做一个政治动物。法西斯主义的蔓延证实了这一怀疑，那是一种从政治思考的必要性中仓皇逃入幻想的行为。战后局势最明显不过的一点在于，它是全新的，源于尚未得到分析的原因，而在这一分析完成并成为新的社会公式的基础之前，它无法得到缓解。然而支持法西斯主义的人却表现得仿佛人类早已掌握了足以应对我们所有问题的原则，仿佛问题仅仅在于任命一位独裁者来加以应用。”\n\n——丽贝卡·韦斯特，1935#!"
 je_bpm_split_fascists_special_tooltip:0 "该进度由以下因素决定：\n#variable [Country.MakeScope.Var('bpm_je_split_fascists_progress_from_base').GetValue|+=]#! 基础值\n#variable [Country.MakeScope.Var('bpm_je_split_fascists_progress_from_conflicts').GetValue|+=]#! 来自处于战争、外交博弈、革命或担任民族统一领袖\n#variable [Country.MakeScope.Var('bpm_je_split_fascists_progress_from_rightists_empowered').GetValue|+=]#! 来自执政或受扶植的#bold 反动#!与#bold 保守#![Concept('concept_interest_group', '利益集团')]\n#variable [Country.MakeScope.Var('bpm_je_split_fascists_progress_from_rightists_suppressed').GetValue|+=]#! 来自受打压的#bold 反动#!与#bold 保守#![Concept('concept_interest_group', '利益集团')]\n#variable [Country.MakeScope.Var('bpm_je_split_fascists_progress_from_rightists_marginal').GetValue|+=]#! 来自边缘化的#bold 反动#!与#bold 保守#![Concept('concept_interest_group', '利益集团')]\n#variable [Country.MakeScope.Var('bpm_je_split_fascists_progress_from_radicals').GetValue|+=]#! 来自激进的中层人群；仅当#bold 自由#!与#bold 保守#![Concept('concept_interest_group', '利益集团')]未被边缘化且未受打压时，此项才会累积。"
 je_bpm_fascism:0 "法西斯渗透"
 je_bpm_fascism_status:0 "法西斯分子正在我们的制度中获取影响力。"
 je_bpm_fascism_reason:0 "我国的法西斯运动正达到白热化，许多显赫人物参与其中。最令人担忧的是他们在军官团中日益增长的影响力。这一危险的组合威胁着将法西斯分子嵌入我们最根本的制度之中。"
