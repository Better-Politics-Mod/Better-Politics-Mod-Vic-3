l_english:
  bpm_japan.1.t: "The Bakufu and the Ballot Box"
  bpm_japan.1.d: "Under overwhelming popular pressure, [SCOPE.sCharacter('shogun_scope').GetFullNameWithTitle] has allowed the creation of #b [SCOPE.GetRootScope.GetCountry.GetCustom('country_legislature_name')]#!, an elected legislature which will possess the power to select the [concept_bpm_head_of_government]. As votes are beginning to be cast in the first national election in [SCOPE.GetRootScope.GetCountry.GetAdjectiveNoFlag] history, [SCOPE.sCharacter('shogun_scope').GetFullName] must decide how [SCOPE.sCharacter('shogun_scope').GetSheHe] will navigate [SCOPE.sCharacter('shogun_scope').GetHerHis] loss of authority."
  bpm_japan.1.f: ""As a case in point, while it is natural that we show deference to a government official, this is not because of the dignity of that person's status. He is accorded that respect only because he performs that important role through his talent and virtues, and because he deals with weighty laws for the sake of the people. It is the laws which have dignity, not the man."\n\n—Fukuzawa Yukichi, 1872"
  bpm_japan.1.a: "Support a peaceful transfer of power. The Tokugawa clan can campaign like everyone else."
  bpm_japan.1.b: "The destruction of the Shogunate is unacceptable. Loyal Samurai will support an end to this farce."

# East Asia flavors
 je_bpm_confucian_state:0 "The Confucian State"
 je_bpm_confucian_state_reason:0 "Our state is deeply rooted in [SCOPE.sReligion('conf_religion').GetName] philosophy. The imperial examination system is the foundation of the government's [concept_bureaucracy], with civil servants selected through a series of rigorous exams testing their insight into the Confucian classics. Only those who excel in these examinations can ascend the ranks of the bureaucracy, ensuring that the state is led by the most learned and virtuous scholars.\n\n#lore "He who exercises government by means of his virtue may be compared to the north polar star, which keeps its place and all the stars turn towards it."\n—Confucius, The Analects#!"