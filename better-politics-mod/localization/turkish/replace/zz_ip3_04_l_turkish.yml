### Federal Project
je_danubian_federation_observer: "Federal Proje"
je_danubian_federation_observer_reason: "[SCOPE.sCountry('austria_scope').GetName] hükümeti, [SCOPE.sCountry('austria_scope').GetAdjectiveNoFormatting] İmparatorluğu topraklarını etnik sınırlara göre çizilmiş, kendi kendini yöneten eyaletlerden oluşan bir federasyona dönüştürme önerisini destekledi. Bu öneri, halihazırda İmparatorluğu oluşturan veliaht toprakları ve kişisel birliklerden oluşan karmaşık ağı ortadan kaldıracak, yerine nihayetinde Viyana'ya hesap veren federal bir yapı getirecektir.\n\nEğer [SCOPE.sCountry('austria_scope').GetNameNoFlag], #v $je_danubian_federation$#! [concept_journal_entry] kaydını tamamlarsa, [ROOT.GetCountry.GetName] devletinin geleneksel hakları ve ayrıcalıkları ortadan kaldırılacak ve topraklarımız doğrudan gelecekteki [SCOPE.sCountry('austria_scope').GetCustom('future_kuk_name')|v] devletiyle birleştirilecektir."

has_been_integrated_into_federation_tt: "[SCOPE.sCountry('austria_scope').GetName], #v $je_danubian_federation$#! kaydını #b tamamladı#! ve aşağıdakiler aracılığıyla #v $dyn_c_usga$#! devletini kurdu: #indent_newline:3 "
