 je_bpm_second_revolution:0 "İkinci Amerikan Devrimi"
 je_bpm_second_revolution_reason:0 "Büyük Kurtarıcı ölü yatıyor. Cesedinin şehirlerimizden geçirilişini gördük. Vizyonunu gördük ve şimdi ruhlarımıza kazındı. Konfederasyonların kazanmasına, ulusumuzu günaha geri döndürmesine izin veremeyiz, vermemeliyiz. İlk devrimimizin hayallerini gerçekleştirmek için, bahçemizdeki nefreti ve baskıyı kökünden söküp atacak ikinci bir devrime girişmeliyiz. Nüfusumuz devrimden çok yorulmadan ve özgür adamları terk etmeden önce şunları geçirmeliyiz:\n\nUlusal Polis\nUlusal Muhafızlar\nDemokratik Değerleri Teşvik Et\nTarımsal Yatırımlar\nYerinden Yönetim\nAtanmış Bürokratlar\nKölelik Yasaklandı\nKültürel Dışlama\nYolsuzluk Karşıtı Tasfiye\n\nDevrimimize yardımcı olmak için, yasama organı, ulusumuzun bürokrasisine ve diplomatik kapasitesine büyük bir maliyetle reformlarımızı hızlandırmamıza izin verecek anayasal boşlukları düşünmeye başladı. Özgürlük bayrağını sonsuza dek dalgalandırmak için ne yapacağız?"
