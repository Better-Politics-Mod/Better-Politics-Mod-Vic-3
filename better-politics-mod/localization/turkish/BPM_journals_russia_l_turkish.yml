 je_bpm_russia_estates_will_abolish_estate:0 "Söz konusu zümre #green Kaldırılacak#!!"
 je_bpm_russia_estates_will_abolish_estate_de_facto:0 "Söz konusu zümre tutulacak ancak fiilen #green Kaldırılacak#!!"
 je_bpm_russia_estates_will_abolish_estate_peasants:0 "Ek olarak, sadece resmi de olsa varlığını koruyan #v Krestyanstvo#! zümresi de tamamen #green Kaldırılacak#!!"
 je_bpm_russia_estates_will_abolish_estate_foreigners:0 "Bir Rus ile bir İnorodet arasındaki ayrımların çoğu #green Kaldırılacak#!!"
 je_bpm_russia_estates_will_abolish_estate_foreigners_good:0 "Bir Rus ile bir İnorodet arasındaki ayrımların çoğu #green Kaldırılacak#!; ancak sınırlı geleneksel özyönetim kurumlarını ellerinde tutacaklar."
 je_bpm_russia_estates_will_abolish_estate_foreigners_racist:0 "İnorodet nüfusuna verilen ayrıcalıklar #blue Kaldırılacak#!, özyönetim kurumları da aynı şekilde ortadan kaldırılacak."

 bpm_russia.4.t:0 "Zümrelerin ve Sivil Rütbelerin Kaldırılmasına Dair Kararname"
 bpm_russia.4.d:0 "Rus zümre sisteminin neden olduğu brüt eşitsizlik konusunda ayak sürmeye hiç niyeti olmayan yeni sosyalist hükümet, [ROOT.GetCountry.GetName] içinde daha önce var olan tüm zümreleri kararnameyle lağvetti."
 bpm_russia.4.f:0 "1. Rusya'da şimdiye kadar var olan tüm sınıflar ve sınıf ayrımları, sınıf ayrıcalıkları ve sınıf sınırlamaları, sınıf örgütleri ve kurumlarının yanı sıra tüm sivil rütbeler kaldırılmıştır.\n2. Tüm zümreler (soylu, tüccar, halktan, köylü vb.), unvanlar (prens, kont vb.) ve sivil rütbe adlandırmaları (özel meclis üyesi, devlet meclisi üyesi vb.) kaldırılmış olup, bunların yerine Rusya sakinleri herkes için ortak olan tek bir isme – Rusya Cumhuriyeti vatandaşlarına – sahip olacaktır.\n3. Soyluların mülkleri derhal ilgili zemstvo kurumlarına devredilecektir.\n4. Tüccarların ve halk birliklerinin mülkleri derhal belediyelere devredilecektir.\n5. Tüm sınıf kurumları, işlemleri, kayıtları ve arşivleri derhal belediye ve zemstvo kurumlarına devredilecektir.\n6. Tüm yasalar (sınıf kurumlarıyla ilgili olanlar) iptal edilmiştir.\n\n—Merkezi Yürütme Komitesi, 1917"
 bpm_russia.4.a:0 "Sınıf Savaşında dev bir zafer daha!"

 bpm_russia.5.t:0 "Zümrelerin ve Sivil Rütbelerin Kaldırılmasına Dair Kararname"
 bpm_russia.5.d:0 "Son reformlarımızın bir sonucu olarak, evrensel oy hakkına sahip cumhuriyetçi bir yönetim biçiminin kurulması zorunlu olarak zümrelerin [ROOT.GetCountry.GetName] içinden tamamen sökülüp atılmasıyla sonuçlandı."
 bpm_russia.5.f:0 "1. Rusya'da şimdiye kadar var olan tüm zümreler ve zümre ayrımları, zümre ayrıcalıkları ve zümre sınırlamaları, zümre örgütleri ve kurumlarının yanı sıra tüm sivil rütbeler kaldırılmıştır.\n2. Tüm zümreler (soylu, tüccar, halktan, köylü vb.), unvanlar (prens, kont vb.) ve sivil rütbe adlandırmaları (özel meclis üyesi, devlet meclisi üyesi vb.) kaldırılmış olup, bunların yerine Rusya sakinleri herkes için ortak olan tek bir isme – Rusya Cumhuriyeti vatandaşlarına – sahip olacaktır."
 bpm_russia.5.a:0 "Özgürlük ve Eşitlik!"

 bpm_russia.6.t:0 "Zümrelerin Kaldırılması"
 bpm_russia.6.d:0 "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] makamının titiz çalışmaları nihayet uygun bir sonuca ulaştı. Tüm zümrelerin tamamen kaldırılmasıyla birlikte, modern ve eşit bir Rusya'nın önündeki bir barikat daha yıkılmış oldu."
 bpm_russia.6.f:0 "Rus aydınlarının kafasını ilginç bir açmaz dolduruyor. Rusya, şu anki haliyle ne gerçekten özgür ne de gerçekten demokratik bir cumhuriyet. Yine de tüm engellere rağmen, hiçbir taviz verilmeden, tüm o kadim zümreler birer birer tepeden inme kararlarla kaldırıldı. Rusların, zümre ayrımı gözetmeksizin birbirlerine eşit davranması biraz zaman alacaktır. Ancak o ilk cesur adımlar atıldı ve artık geri dönüşü yok."
 bpm_russia.6.a:0 "Umarım bundan pişman olmayız anasını satayım."

 bpm_russia.7.t:0 "Zümrelerin Alacakaranlığı"
 bpm_russia.7.d:0 "Zümrelerimizle ilgili son yasal düzenleme de meclisten geçerken, bazı tavizler verilmiş olsa da, Rus zümre sisteminin tüm niyet ve amaçlarıyla artık bittiğini sonunda söyleyebiliriz."
 bpm_russia.7.f:0 "Tabii ki zümreler öylece yok olup gitmedi. Hükümetin zaman zaman yaptığı nüfus sayımlarında insanlara hâlâ kim oldukları ve hangi zümreden oldukları soruluyordu. Ama giderek daha fazla insan hangi zümrede olduğunu bile bilmiyordu. Pratik anlamda, kanunlar önünde — esasen — eşittiler. En azından şu kadim zümreler söz konusu olduğunda..."
 bpm_russia.7.a:0 "Atılması elzem bir adımdı."

 bpm_russia.10.t:0 "Krestyanin'e Son"
 bpm_russia.10.d:0 "Serfliğin kaldırılması, yönetimimiz ile ekonomimizin modernleşmesiyle birlikte Krestyanstvo zümresi tarihi bir dipnot olmaya adım adım yaklaşıyor. Bu defteri kapatan mevcut hükümetimiz mi olacak?"
 bpm_russia.10.f:0 "Krestyanin iyi habere alışkın değildir, ne devlet yetkililerinden ne de Dvoryanstvo'dan. Geldiklerinde tahıllarını, etlerini, adamlarını uzak savaşlarda gebermek üzere almaya gelirler; kendilerini savunmalarına bile izin vermeden onları bir şeylerle suçlarlar. Ancak son zamanlarda haberler değişti; kötü haberler yerinde duruyor tabii, ama bazı iyi haberler de gelmeye başladı - bedensel cezalar kalktı, köylüler toprak ağalarının malı olmaktan çıktı, hatta kısıtlı da olsa bazı özgürlükler tanınması bile beklenmedik güzelliklerdi. Ve bugün, belki de Rus köylüsüne ulaşacak yepyeni güzel haberlerin günü olacak."
 bpm_russia.10.a:0 "Köylüleri zümrelerinden kurtarın!"
 bpm_russia.10.b:0 "Zümreyi kağıt üstünde tutun, ancak ilgili yasaların çoğunu iptal edin"
 bpm_russia.10.c:0 "Galiba biraz daha beklesek iyi olacak."

 bpm_russia.11.t:0 "Son Dvoryane'ler"
 bpm_russia.11.d:0 "[ROOT.GetCountry.GetName] içindeki zümre sistemi giderek aşınırken, hakkıyla lağvedilmeyi bekleyen son bir zümre kaldı - $je_bpm_russia_estates_tooltipable_nobles$. Ancak Rusya'nın büyük bir kısmı zaten kendi zümrelerinin boyunduruğundan kurtulmuşken, bu son adım gerçekten gerekli mi?"
 bpm_russia.11.f:0 "Dvoryane soysuzları çok uzun zamandır herkesin baş ağrısı oldu. Sömürdükleri köylülere, ezdikleri kentlilere; hatta semirmiş soyluların dar görüşlü talepleriyle zincirlenmek zorunda kalan Çarlara bile. Rusya, bu aristokratik çapadan kurtulup özgürleşmek için o son adımı nihayet atacak mı?"
 bpm_russia.11.a:0 "Atağız ulan. Bu çürümüş geleneklerin [ROOT.GetCountry.GetName] içinde yeri yok!"
 bpm_russia.11.a2:0 "Hem o sikik soylu unvanlarını hem de Krestyanstvo zümresinin kalıntılarını silip atmalıyız."
 bpm_russia.11.b:0 "Unvanlarını ellerinde tutsunlar ama ayrıcalıklarının çoğunu ellerinden alın"
 bpm_russia.11.c:0 "Belki... başka bir zaman bakarız."

 bpm_russia.12.t:0 "Yeryüzüne İndirilenler"
 bpm_russia.12.desc:0 "Dukhovenstvo cemaati ülkemizde çok uzun süre boyunca devasa ayrıcalıkların keyfini sürdü. Yeni seküler politikamızla birlikte, bunları artık geri almanın zamanı geldi."
 bpm_russia.12.f:0 "Kesin mırın kırın edecekler amınakoyayım. Sıradan halkla, hatta sadece farklı cemaatlerle eşit olmak bile onlara zulüm gibi gelir. Ama gerekli olduğunu zamanla anlayacaklar."
 bpm_russia.12.a:0 "Şu unvanı da ayrıcalıkları da çöpe atın!"
 bpm_russia.12.b:0 "Unvanları kalabilir ama ayrıcalıkları yok"
 bpm_russia.12.d:0 "Zümreye yabancıları alın ve ayrıcalıklarını genel olarak zayıflatın"
 bpm_russia.12.c:0 "Bu mevzuyu baştan bi' düşünsek fena olmaz."

 bpm_russia.13.t:0 "Şehrin Vatandaşı"
 bpm_russia.13.d:0 "Çeşitli Gorozhanelerin hak ve yükümlülüklerini kodlayan tonla yasa vardı, zaten katmanlaşmış olan şehirli nüfusunu daha da katmanlara ayırıyorlardı. Zümre sistemini bir bütün olarak ortadan kaldırmak için bu ayrımları geçersiz kılmak gereklidir."
 bpm_russia.13.f:0 "Geleceğimizi inşa edecek insanların hareketliliğine ket vuran o bitmek bilmeyen unvanlar, ayrımlar ve statü sembolleri... Geleceğimiz uğruna bu sürtünmeyi ortadan kaldırmak zorundayız."
 bpm_russia.13.a:0 "Kaldırın şu zümreleri!"
 bpm_russia.13.b:0 "Bazı zümreleri tutun, ancak onlarla ilgili yasaları kaldırın"
 bpm_russia.13.c:0 "Şimdi sırası değil."

 bpm_russia.14.t:0 "İnorodet Ayrımı"
 bpm_russia.14.d:0 "İnorodtsy denilen kesim, onların hayatlarını ve bizim onlarla etkileşimlerimizi yöneten kurallar ile istisnaların yasal bir yamalı bohçasıdır. Bunları basitleştirmek ve düzene sokmak, zümre sistemimizin kaldırılmasının elzem bir parçasıdır."
 bpm_russia.14.f:0 "Zümrelerimiz güç kaybederken, odadaki fil ile yüzleşiyoruz — doğaları veya inançları gereği yıllardır sahip olduğumuz zümrelerden ayrılmış, ayrıcalıklar ve özel yükümlülükler verilmiş büyük bir insan grubu. Ancak zümreler ortadan kalktığına göre İnorodetlerin statüsü sorunu giderek daha acil bir hal alıyor."
 bpm_russia.14.a:0 "Bazı yerel yönetim politikalarını elde tutun"
 bpm_russia.14.b:0 "Ayrıcalıklarını ellerinden alın; haklarını sonra kazanırlar"
 bpm_russia.14.c:0 "Bu meseleyle sonra ilgileniriz."

# BUREAUCRATIC STREAMLINING
 je_bpm_russia_patchwork_governance:0 "Devlet Yönetimini Düzenlemek"
 je_bpm_russia_patchwork_governance_reason:0 "Rusya'yı tanıyan herkesin dikkatini çekecek bir şey varsa o da devasa boyutudur. Bazıları için bu büyük bir gurur ve muazzam bir güç kaynağıdır. Diğerleri içinse, karmaşık, neredeyse Bizans düzeyinde istisnalar ve kurallar gerektiren bitmek bilmeyen baş ağrılarının kaynağıdır. Ancak Rusya'yı bu yüzyılda yönetmek için bu kuralların gözden geçirilmesi, düzene sokulması ve iyileştirilmesi şarttır.\n\n#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_russia_patchwork_governance_tooltip_zemstvo Zemstvo'ları#! kurarak ve #tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_russia_patchwork_governance_tooltip_obschina Obşçina'ları#! hallederek devasa ülkemizin yönetimini iyileştirebiliriz, vakit kaybetmeden koyulmamız gereken bir görev."

 bpm_russia_obschina_empowered:0 "Obşçina (Güçlendirilmiş)"
 bpm_russia_obschina:0 "Obşçina"
 bpm_russia_obschina_abolished:0 "Obşçina'lar Kaldırıldı"
 bpm_russia_ad_hoc_governance:0 "Düzensiz Yönetim"
