l_simp_chinese:
 hog_regency.1.t:0 "年幼的$bpm_hog_title_default_contextless$"
 hog_regency.1.d:0 "$bpm_hog_title_default_contextless$的头衔已传给[SCOPE.sCharacter('hog_scope').GetFullName]，而此人尚未成年。推选代理$bpm_hog_title_default_contextless$的重任落到了现任政府肩上。"
 hog_regency.1.f:0 ""你的首要任务，是在$bpm_hog_title_default_contextless$未成年的这段时间里维系[ROOT.GetCountry.GetNameNoFormatting]的稳定。我们已准备好承担抚养这位孩子的责任。你大可放心，我们不会把你当成代养父母。"\n\n使者顿了顿，等待大臣的答复。\n\n"我明白了，"对方答道，"关于教育一事，[SCOPE.GetRootScope.GetCountry.GetCustom('country_legislature_name')]已准备好拨出所需款项。你还有什么要求？""
 hog_regency.1.a:0 "[SCOPE.sCharacter('acting_hog_scope').GetFullName]将代行年幼的$bpm_hog_title_default_contextless$的统治职责。"
 modifier_acting_hog:0 "代理政府首脑"
