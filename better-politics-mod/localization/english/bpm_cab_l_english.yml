  concept_bpm_synergy: "Synergy"
  concept_bpm_synergy_desc: "Synergy is the measure of the cohesion of the [Concept('concept_bpm_cabinet', 'Government')]. The higher the synergy, the more effective the [concept_bpm_cabinet] will be in implementing policies.\n\nSynergy is calculated from the ideological proximity of each of your [Concept('concept_bpm_minister','Ministers')], the most influential of which is the Head of Government. [Concept('concept_bpm_institutional_ig','Institutional Interest Groups')] are less likely to be in conflict with each other, whereas [Concept('concept_bpm_ideological_ig','Ideological Interest Groups')] must share similar ideologies to avoid butting heads. Certain political systems may have more difficulty in achieving a highly functional [Concept('concept_bpm_cabinet', 'Government')] than others."

  bpm_cab_synergy_tt: "#header [Concept('concept_bpm_synergy', 'Synergy')]#!: [GetPlayer.MakeScope.ScriptValue('bpm_cab_synergy_value')|v]\n$TOOLTIP_DELIMITER$\n[GetPlayer.GetCustom('bpm_current_government_formation_synergy_tt')].$bpm_cab_synergy_mult_modifier$$bpm_cab_synergy_add_modifier$\n\n@warning! [concept_bpm_synergy] gives scaling bonuses and penalties:\n  Above #v 80%#! (#blue Cohesive#!):\n    @arrow_up! Enactment Speed\n #v 60% - 80%#! (#blue Functional#!):\n     @arrow_down! Base Law Support, Enactment Speed\n  Below #v 60%#! (#blue Dysfunctional#!):\n    @arrow_down! Enactment Speed, Base Law Support, Bureaucracy, Rigidity"

  concept_bpm_antagonism: "Antagonism"
  concept_bpm_antagonism_desc: "Antagonism is the amount of [concept_bpm_cabinet] members that are opposed to the existence of the [concept_institution] that they are appointed to. The higher the antagonism, the less effective the [concept_bpm_cabinet] will be in implementing policies."

