 bpm_decorative_modify_sol_per_workplace_safety_investment_desc:0 "$bpm_decorative_modify_sol_per_workplace_safety_investment$"
 bpm_decorative_modify_employment_laborers_per_workplace_safety_investment:0 "[GetInstitutionType('institution_workplace_safety').GetName] [Concept('concept_institution', 'Kurum')] Seviyesi başına @laborers! Düz İşçi İstihdamı"
 bpm_decorative_modify_employment_laborers_per_workplace_safety_investment_desc:0 "$bpm_decorative_modify_employment_laborers_per_workplace_safety_investment$"
