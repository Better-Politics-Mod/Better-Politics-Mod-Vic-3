 je_bpm_errors_of_the_world: "Modern Dünyanın Hataları"
 je_bpm_errors_of_the_world_reason: "Modern dünya, orman yangını gibi yayılan çeşitli günahkar ruhlar ve fikirler tarafından yavaş yavaş yutulmaktadır. Bu fikirler, tarih boyunca bize eşlik eden tüm düzene ve geleneğe tehdit oluşturmaktan başka bir şey yapmazlar ve sadece her şeyi yok edip öldürmeye çalışırlar. Boşa harcanacak zaman yok ve Katolik Kilisesi, modernist, tanrısız #yellow liberalizm#! ve #gold radikalizm#! tehdidine karşı savaşmalıdır.\n\nBu bir [Concept('concept_bpm_global_je', 'Küresel Günlük Kaydıdır')]. Aşağıdakiler gibi çeşitli değerlere bağlı olarak her ay ilerleme kaydeder:\n#P +#! @ig_liberals! #yellow Liberallerin#!, @ig_radicals! #gold Radikal Liberallerin#! ve @ig_socialists! #pink Sosyalistlerin#! [concept_clout] değeri;\n#P +#! Dünyadaki [GetLawType('law_wealth_voting').GetName] #v veya daha iyi#! yasalara sahip hükümetlerin [concept_legitimacy] değeri;\n#P +#! [GetLawGroup('lawgroup_church_and_state').GetName] [Concept('concept_law', 'Yasaları')] ve [GetLawType('law_public_schools').GetName] yasasına sahip olmak (#italic #bold laikleştirilmiş#! bir okul sistemi olarak#!)\n\nTamamlandığında, #bold #gold Hristiyan mı, yoksa Demokrat mı?#!#! [concept_journal_entry] görevinin #v İkinci Aşaması#! açılacak ve ilerleme kazanımını yavaşlatacak ve @ig_reactionaries! #purple Gericilerin#! popülaritesi artacaktır.\n\n#lore Yasamada ateizm, din meselelerinde kayıtsızlık ve Liberal Katoliklik adı altında geçen yıkıcı özdeyişler devletlerin yıkılmasının gerçek nedenleridir; Fransa'nın mahvına neden olmuşlardır. İnanın bana, ihbar ettiğim kötülük Devrimden daha korkunç, hatta Komünden bile daha korkunç. Liberal Katolikliği her zaman kınadım ve gerekirse kırk kez daha kınayacağım.\n\n— Papa Pius IX, 1871#!"
 je_bpm_errors_of_the_world_status: "Liberal Katolikliği kınamak."
 
 bpm_papal_encyclicals.1.t: "Quanta cura"
 bpm_papal_encyclicals.1.d: "#v Katolik Kilisesi#! ve Roma Piskoposu #v Papa Pius IX#!, çeşitli ideolojileri, uygulamaları ve fikirleri açıkça kınadı. Liberalizm, sosyalizm, laiklik, radikalizm, liberal katoliklik ve genel olarak modernite gibi fikirler açıkça kınandı ve kapsamlı bir şekilde eleştirildi."
 bpm_papal_encyclicals.1.f: "Sesimizi yükselttik ve yayınlanan birçok Genelge Mektubunda ve Ruhani Meclis'te verilen Tahsislerde ve diğer Apostolik Mektuplarda, bu en mutsuz çağın başlıca hatalarını kınadık ve takdire şayan piskoposluk uyanıklığınızı uyandırdık ve bize en çok değer veren Katolik Kilisesi'nin tüm oğullarına, bu kadar korkunç bir vebanın bulaşmasından tamamen iğrenmeleri ve kaçmaları gerektiğini defalarca uyardık ve tavsiye ettik.\n\n— Papa Pius IX, 1864"
 bpm_papal_encyclicals.1.a: "Yüksek sesli bir azınlık gibi duruyor."

 je_bpm_immortal_god: "Ölümsüz Bir Tanrı"
 je_bpm_immortal_god_reason: "Önceki papa — #v Papa Piux IX#! — Katolik Kilisesi'ni cehaletin ve utancın en karanlık çukurlarına daha da derinlere sürükledi. Kilise, yeni gerçeklere yanıt vermek ve Rab'bin sözünü yaymak yerine, zamanını her şeye ve herkese meydan okuyarak geçirdi, sevgili takipçilerini ve gücünü kaybetti. Kutsal Makam içindeki yeni düşünce sesi olan #v Papa Leo XIII#!, Katolik öğretilerinin seyriyle ilgili planlara sahip.\n\nBu bir [Concept('concept_bpm_global_je', 'Küresel Günlük Kaydıdır')]. Aşağıdakiler gibi çeşitli değerlere bağlı olarak her ay ilerleme kaydeder:\n#P +#! Çeşitli [Concept('concept_bpm_ig_is_socialist', 'Sosyalistlerin')] [concept_clout] değeri;\n#P +#! Çeşitli @ig_conservatives! #blue Muhafazakar-Milliyetçi#! [Concept('concept_interest_group', 'Çıkar Gruplarının')] [concept_clout] değeri;\n#P +#! Dünyadaki hükümetlerin [GetLawGroup('lawgroup_centralization').GetName] [Concept('concept_law', 'Yasaları')];\n#P +#! [GetLawGroup('lawgroup_church_and_state').GetName] [Concept('concept_law', 'Yasaları')]\n#P +#! Dünyadaki [GetLawType('law_census_voting').GetName] #v veya daha iyi#! yasalara sahip hükümetlerin [concept_legitimacy] değeri;\n\nTamamlandığında, Katolik @ig_reactionaries! #purple Gericiler#! ve @ig_christian_democrats! #blue Katolikler#!, [GetIdeology('ideology_rel_modern_moralist').GetName] [concept_ideology] ideolojisini kazanacak ve @ig_reactionaries! #purple Gericiler#! ayrıca [GetIdeology('ideology_cit_multiethnic_nationalist').GetName] ve [GetIdeology('ideology_jingoist').GetName] ideolojilerini alacaklardır.\n\n#lore ...Devlet, fikir ve eylem özgürlüğünün zihinleri hakikatten ve ruhları erdem pratiğinden saptırmasına izin verdiği her zaman, doğanın yasalarına ve emirlerine karşı hareket etmiş olur.\n\n— Papa Leo XIII, 1885#!"

 je_bpm_immortal_god_status: "Yeni fikirler aramak."

 bpm_papal_encyclicals.2.t: "Immortale dei"
 bpm_papal_encyclicals.2.d: "#v Katolik Kilisesi#! ve Roma Piskoposu #v Papa Leo XIII#!, milliyetçiliğin, laikleşmenin ve #bold Katoliklerin#! seçim sistemine katılımının yeni fikirlerine açıkça yanıt verdi. Meşru oldukları sürece tüm konularda sivil yöneticilere itaat edilmesi lehinde konuştu ve Katoliklerin siyasi, kamusal yaşama katılımına açık destek ifade etti."
 bpm_papal_encyclicals.2.f: "Her uygar toplumun yönetici bir otoritesi olmalıdır ve bu otorite, toplumun kendisinden daha az olmamak üzere, kaynağını doğadan alır ve sonuç olarak, yazarı Tanrı'dır. Buradan, tüm kamusal gücün Tanrı'dan gelmesi gerektiği sonucu çıkar. Çünkü dünyanın gerçek ve yüce efendisi yalnızca Tanrı'dır. İstisnasız her şey O'na tabi olmalı ve O'na hizmet etmelidir, böylece yönetme hakkını elinde tutan kişi, onu tek ve yegane kaynaktan, yani herkesin Egemen Yöneticisi olan Tanrı'dan almış olur.\n\n— Papa Leo XIII, 1885"
 bpm_papal_encyclicals.2.a: "Gerçekten bir şey yapacak mı?"

 je_bpm_light_amidst_darkness: "Karanlığın Ortasındaki Işık"
 je_bpm_light_amidst_darkness_reason: "Sanayi Devrimi ve onun renkli sonuçları, ister insanın hayatını maddi bir nesneye indirgeyerek olsun, isterse hepimize rehberlik eden tüm doğal yasaları yok etmeye çalışarak olsun, tüm insanlık için büyük bir acı getirdi. Tüm dünya, yeni yönetici sosyal kastlar tarafından etkili bir şekilde sürdürülen karanlık ve hüzünle yutuldu.\n\nBu bir [Concept('concept_bpm_global_je', 'Küresel Günlük Kaydıdır')]. Aşağıdakiler gibi çeşitli değerlere bağlı olarak her ay ilerleme kaydeder:\n#P +#! [Concept('concept_bpm_ig_is_socialist', 'Sosyalist')] [concept_interest_group] [concept_clout] veya [Concept('concept_political_movement', 'Siyasi Hareketler')];\n#P +#! Çeşitli #bold Kapitalist#! ve/veya #bold devlet refahı karşıtı#! [Concept('concept_interest_group', 'Çıkar Gruplarının')] [concept_clout] değeri;\n#P +#! Dünyadaki [GetLawType('law_census_voting').GetName] #v veya daha iyi#! yasası olmayan hükümetlerin [concept_legitimacy] değeri;\n#P +#! Çeşitli ülkelerdeki Ortalama [concept_sol];\n#P +#! [GetLawGroup('lawgroup_church_and_state').GetName] [Concept('concept_law', 'Yasaları')]\n\nTamamlandığında, #bold #gold Hristiyan mı, yoksa Demokrat mı?#!#! [concept_journal_entry] görevinin #v Üçüncü Aşaması#! açılacaktır. #v Rerum novarum#!'un yorumlanması sorunu üzerinden, @ig_christian_democrats! #blue Katolikler#!, her iki grubun da daha fazla destek kazanacağı @ig_christian_democrats! #blue Hristiyan Demokratlar#! ve @ig_reactionaries! #purple Ulusal Muhafazakarlar#! (#italic eski Gericilerin yerini alarak#!) olarak uzlaşmaz bir bölünme yaşayacaklardır.\n\n#lore Tartıştığımız konuyla ilgili olarak, sanki doğa zenginleri ve fakirleri amansız bir savaşta şiddetle savaşmaları için birbirlerine karşı kışkırtmış gibi, toplumun bir sınıfının kendi başına diğerine düşman olduğunu varsaymak büyük bir kötülüktür. Bu akla ve gerçeğe o kadar aykırıdır ki tam tersi doğrudur; tıpkı insan vücudunda farklı organların birbiriyle uyum içinde olması ve insan figüründe haklı olarak simetri adı verilen o parçaların yerleşiminin ve oranının ortaya çıkması gibi, doğa da Devlet durumunda söz konusu iki sınıfın uyumlu bir şekilde anlaşmasını ve uygun şekilde birbirinin dengeli birer karşılığı olmasını emretmiştir.\n\n— Papa Leo XIII, 1891#!"

 je_bpm_light_amidst_darkness_status: "Şimdi bölücü bir felsefe için."

 bpm_papal_encyclicals.3.t: "Rerum novarum"
 bpm_papal_encyclicals.3.d: "#v Katolik Kilisesi#! ve Roma Piskoposu #v Papa Leo XIII#!, sıradan işçilerin sefaletine ve Kapitalizmin neden olduğu çeşitli sorunlarla mücadele etmek için refah ve sosyal eylem araçlarına açıkça yanıt verdi. Sendikalara benzer hareketlere destek ifade etti, sosyalizmi ve kapitalizmi kınadı ve devlet ile ekonominin inşasına organikçi bir yaklaşımı açıkça destekledi."
 bpm_papal_encyclicals.3.f: "Dünyaya gerçekten olduğu gibi bakmaktan ve aynı zamanda sorunlarına teselli bulmak için... başka yerlere bakmaktan daha yararlı hiçbir şey yoktur.\n\n— Papa Leo XIII, 1891"
 bpm_papal_encyclicals.3.a: "O bir devrimci mi yoksa ılımlı mı?"

 je_bpm_graves_de_communi_re: "Modern Zamanlar Üzerine"
 je_bpm_graves_de_communi_re_reason: "Önceki büyük genelge #v Rerum novarum#!'un yayımlanması, genelgeyi programları için ideolojik-düşünce temeli olarak kullanmaya başlayan siyasi olarak aktif Katolik hareketler içinde büyük bir aktivizm ve çeşitlilik yarattı. #v Leo XIII#!, Katoliklerin kamusal yaşama katılmasını istese de, bu grupların faaliyet göstermeleri gereken terimleri ve hedefleri karıştırmalarını amaçlamamıştı.\n\nBu bir [Concept('concept_bpm_global_je', 'Küresel Günlük Kaydıdır')]. Aşağıdakiler gibi çeşitli değerlere bağlı olarak her ay ilerleme kaydeder:\n#P +#! [Concept('concept_bpm_ig_is_socialist', 'Sosyalist')] [concept_interest_group] [concept_clout] veya [Concept('concept_political_movement', 'Siyasi Hareketler')];\n#P +#! [GetInterestGroupVariant('ig_christian_democrats',GetPlayer).GetNameWithCountryVariant] ve [GetInterestGroupVariant('ig_reactionaries',GetPlayer).GetNameWithCountryVariant] [Concept('concept_interest_group', 'Çıkar Gruplarının')] [concept_clout] değeri\n#P +#! Dünyadaki [GetLawType('law_census_voting').GetName] #v veya daha iyi#! yasalara sahip hükümetlerin [concept_legitimacy] değeri;\n\nTamamlandığında, #bold #gold Hristiyan mı, yoksa Demokrat mı?#!#! [concept_journal_entry] görevinin #v Dördüncü Aşaması#! açılacaktır. #v Graves de communi re#! temel olarak @ig_christian_democrats! #blue Hristiyan Demokratik#! hareketlerini ve onların radikal bir şekilde yükselen ivmesini zayıflatacaktır.\n\n#lore Dahası, bu Hristiyan Demokrasi adını siyasete çarpıtmak bir suç olur; zira demokrasi hem filolojik hem de felsefi anlamlarıyla halk yönetimini ima etse de, mevcut uygulamasında hiçbir siyasi anlam olmaksızın, halk adına bu yararlı Hristiyan eyleminden başka bir anlama gelmeyecek şekilde kullanılmalıdır. Zira, haklı olarak tüm insani ihtimallerden üstün olan doğa ve İncil yasaları, zorunlu olarak her türlü belirli sivil hükümet biçiminden bağımsızdır; aynı zamanda ahlaka ve adalete aykırı olmayan her şeyle uyum içindedirler.\n\n— Papa Leo XIII, 1901#!"
 je_bpm_graves_de_communi_re_status: "Zayıflayan Katolik hareketleri."

 bpm_papal_encyclicals.4.t: "Graves de communi re"
 bpm_papal_encyclicals.4.d: "#v Katolik Kilisesi#! ve Roma Piskoposu #v Papa Leo XIII#!, çoğunlukla Hristiyan Demokrasisi olmak üzere [GetReligion('catholic').GetName] kökenli yükselen fikirlere açıkça yanıt verdi. Hristiyan Demokrasisinin ne olduğunu ve diğer ideolojilerden nasıl farklı olması #bold gerektiğini#, amacını ve diğer açıklamaları ve izahları tanımladı."
 bpm_papal_encyclicals.4.f: "Buna karşın Hristiyan Demokrasisi, Hristiyan olması gerçeğiyle, zorunlu olarak ilahi inancın temel ilkeleri üzerine inşa edilmiştir ve sonsuz olan şeyler için yaratılmış ruhların mükemmelliğini teşvik etme nihai amacıyla, kitleler için daha iyi koşullar sağlamalıdır.\n\n— Papa Leo XIII, 1901"
 bpm_papal_encyclicals.4.a: "Yani onlar bir tehdit mi değil mi?"


 ############### Nüfus sayımı oy hakkı tasarısı

 bpm_new_wine_old_wineskins_flavour.100.t: "Oy Hakkı Reformu"
 bpm_new_wine_old_wineskins_flavour.100.d: "Daha geniş oy hakkı arayışı işçi sınıfları ve siyasi elitler arasında istikrarlı bir şekilde artmaktadır. Desteğin büyümesi, parlamentoyu hala daha zengin olanları kayıran bir oy hakkı genişletme tasarısı (— [GetLawType('law_census_voting').GetName] —) sunmaya itti. Kısa bir süre sonra, yerel hükümetleri seçmek için oy hakkını genişleten bir Belediye Seçimleri Yasası tanıtıldı."
 bpm_new_wine_old_wineskins_flavour.100.f: "Bugün konuşma hakkından yararlanmak için altına, hem de çok altına ihtiyacınız var; biz yeterince zengin değiliz. Yoksullar için sessizlik.\n\n— Félicité de La Mennais, 1848"
 bpm_new_wine_old_wineskins_flavour.100.a: "İhtiyatlı temsil ancak bu şekilde kullanılabilir."

 bpm_new_wine_old_wineskins_flavour.101.t: "Atölye Düzenlemeleri Yasası"
 bpm_new_wine_old_wineskins_flavour.101.d: "İşçilerin korkunç yaşam ve çalışma koşullarının neden olduğu büyük radikalizmlerin yükselişiyle birlikte, [GetInterestGroupVariant('ig_conservatives',GetPlayer).GetNameWithCountryVariant] istihdam koşullarının düzenlenmesini ve kontrolünü getiren bir yasa tasarısı sundu. Tasarı, kapsamlı olmasa da, işçilerin güvenliği, hijyeni ve kötü koşulları üzerinde çeşitli kurallar getiriyor."
 bpm_new_wine_old_wineskins_flavour.101.f: "#italic MADDE 1. — En az on işçi çalıştıran sanayi ve ticari işletmelerde, ayrıca il ve ilçe hizmetlerinde, bu yasada öngörülen şekilde yazılı atölye düzenlemeleri oluşturulmalıdır.\n\nBu zorunluluk, kraliyet kararnamesi ile ondan az işçi çalıştıran şirketlere de genişletilebilir. 1900 yılından önce, en az beş işçi çalıştıran şirketlere de genişletilecektir.#!\n\n— Atölye Düzenlemeleri Yasası, 15 Haziran 1896"
 bpm_new_wine_old_wineskins_flavour.101.a: "Umarım bu işe yarar."
 
 bpm_new_wine_old_wineskins_flavour.102.t: "Tarımsal Reformlar"
 bpm_new_wine_old_wineskins_flavour.102.d: "Tarım bir süredir pek de iyi gitmiyor. Genel olarak geri kalmış, hem modern aletlerden hem de ülkenin geri kalanıyla bağlantıdan yoksun. Tarımsal gelişmeyle yakından ilgilenen [GetInterestGroupVariant('ig_conservatives',GetPlayer).GetNameWithCountryVariant], küçük ve büyük tarım işletmelerini destekleyen bir yasa tasarısını zorladı."
 bpm_new_wine_old_wineskins_flavour.102.f: "Ellerinin emeğinin meyvesini yiyeceksin; kutsanacaksın ve her şey senin için iyi olacak.\n\n— Mezmurlar 128:2"
 bpm_new_wine_old_wineskins_flavour.102.a: "Umarım bu işe yarar."

 bpm_new_wine_old_wineskins_flavour.103.t: "Dini Okulların Finansmanı"
 bpm_new_wine_old_wineskins_flavour.103.d: "Tüm [GetInterestGroupVariant('ig_conservatives',GetPlayer).GetNameWithCountryVariant] gruplarının değer verdiği ana şeylerden biri, özellikle de devlet tarafından büyük miktarda parayla finanse ediliyorsa, dini eğitimdir. Bu yüzden muhafazakarlar, dini okullar ve Kilise örgütleri için daha fazla fon sağlayan bir yasa tasarısını meclisten geçirdiler."
 bpm_new_wine_old_wineskins_flavour.103.f: "Zorunlu eğitim zararsız olsaydı yine iyiydi. Ancak destekçilerinin düşüncelerini incelediğimizde aksi ikna edici oluyor: bu araştırmadan pek çok ders çıkarılabilir. Zorunlu eğitimin, birçok yerde, zorunlu okul eğitimine yol açacağını ve Kilise'nin ve genel olarak tüm vahyedilmiş dinlerin düşmanlarının bu yüzden onu savunduğunu iddia ediyorum. Kurulması gereken şey budur.\n\n— Charles Woeste, 1907"
 bpm_new_wine_old_wineskins_flavour.103.a: "Bunun sonunun iyi olacağından eminim..."

 bpm_new_wine_old_wineskins_flavour.104.t: "Küçük Düzenleyici Önlemler"
 bpm_new_wine_old_wineskins_flavour.104.d: "Kötüleşen yaşam koşulları ve genel hoşnutsuzluk, [GetInterestGroupVariant('ig_conservatives',GetPlayer).GetNameWithCountryVariant] grubunu madenciliği hedefleyen ve düzenleyen bir yasa tasarısı sunmaya yöneltti. Madencilikte hijyen, güvenlik ve istihdam ile ilgili düzenlemeler getiriyor, ayrıca kadınların madenlerde çalışmasını yasaklıyor."
 bpm_new_wine_old_wineskins_flavour.104.f: "Prensipte zorunlu önlemlere karşı çok anlayışsız kalmaya devam ediyorum. Bireylere Devletin ve toplumun çıkarları doğrultusunda dayatılan kısıtlamalar gibi örnekler verildiğini biliyorum ve çoğunun gerekliliğine itiraz etmiyorum. Ancak bu, onları kaçınılabilecek alanlara yaymak için bir neden değildir.\n\n— Charles Woeste, 1907"
 bpm_new_wine_old_wineskins_flavour.104.a: "Küçük ama çok şey."

 bpm_new_wine_old_wineskins_flavour.105.t: "İstihdam Ücret Reformu"
 bpm_new_wine_old_wineskins_flavour.105.d: "[GetInterestGroupVariant('ig_conservatives',GetPlayer).GetNameWithCountryVariant] tarafından sunulan bir yasa tasarısı, adil ve tüm kalbiyle çalışan işçilere yönelik devlet desteğini genişletti. Bu tasarı, çok az şey verse de, işçilerin hayatta kalabilmelerini sağlamak için genişleyecek."
 bpm_new_wine_old_wineskins_flavour.105.f: "Gereklilik ve dürüstlük talepleri karşılandıktan sonra, kişinin sahip olduğu geri kalan şeyler fakirlere aittir.\n\n— Papa Leo XIII, 1891"
 bpm_new_wine_old_wineskins_flavour.105.a: "Tuhaf derecede tartışmalı bir tasarı..."

 bpm_new_wine_old_wineskins_flavour.106.t: "Pazar Günü Dinlenme Yasası"
 bpm_new_wine_old_wineskins_flavour.106.d: "Dindarlığı el üstünde tutan [GetInterestGroupVariant('ig_conservatives',GetPlayer).GetNameWithCountryVariant], Pazar günü Dinlenmesini getiren, çalışma saatlerini düzenleyen ve önemli, çoğunlukla dini etkinlikler gerçekleştiğinde bir gün izin alınmasına izin veren bir yasa tasarısını kabul etti. Temelde oldukça din odaklı olan bu tasarı, parlamentodaki tüm partilerin muhalefetiyle karşılaşıyor."
 bpm_new_wine_old_wineskins_flavour.106.f: "Şabat gününü kutsal tutmak için hatırla. Altı gün çalışacaksın ve bütün işini yapacaksın, ama yedinci gün Tanrın Rab'be bir Şabat'tır...\n\n— Çıkış 20:8-10"
 bpm_new_wine_old_wineskins_flavour.106.a: "Tevazu her zaman tüm Hristiyanların yol gösterici bir ilkesi olmuştur."
 
