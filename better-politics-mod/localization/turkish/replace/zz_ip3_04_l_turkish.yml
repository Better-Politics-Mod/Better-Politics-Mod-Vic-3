je_metternich: "Metternich Çağı"
je_metternich_reason: "#b Napolyon Savaşlarının#! sonrası, [ROOT.GetCountry.GetName] devletini Avrupa'da lider bir muhafazakar güç olarak tesis etmiştir. Post-Napolyon düzeninin baş mimarı [SCOPE.sCharacter('metternich_scope').GetFullName], çalkantılı 1821 yılından bu yana [ROOT.GetCountry.GetNameNoFormatting] Şansölyesi olarak görev yapmaktadır. [SCOPE.sCharacter('metternich_scope').GetHerHis|U] gündemi; [ROOT.GetCountry.GetAdjectiveNoFormatting] [GetLawType('law_autocracy').GetName] (Otokrasisini) savunmayı, Avrupa'daki muhafazakar barışı korumayı ve sanat ile bilimleri teşvik etmeyi amaçlamaktadır.\n\n#b Metternich Gündemi:#!\nŞansölye [SCOPE.sCharacter('metternich_scope').GetLastName]'in gündemindeki çeşitli maddelerin gerçekleştirilmesi bu [concept_journal_entry] kaydının etkilerini iyileştirecektir. Bu başarılar, bu jurnal kaydı başarılı bir şekilde #b tamamlandığında#! puanlanacaktır.\n• [SCOPE.GetRootScope.GetCountry.GetCustom('metternich_ita_checkbox')] #b $ITA_ADJ$#! [Concept('concept_unification', '$concept_unification_short$')] (Birleşmesi) engellendi\n• [SCOPE.GetRootScope.GetCountry.GetCustom('metternich_ger_checkbox')] #b $GER$#! başka herhangi bir [concept_country] (ülke) tarafından [Concept('concept_unification', 'birleştirilmedi')]\n• [SCOPE.GetRootScope.GetCountry.GetCustom('metternich_art_checkbox')] [ROOT.GetCountry.GetNameNoFlag], lider bir [GetGoods('fine_art').GetName] üreticisidir\n• [SCOPE.GetRootScope.GetCountry.GetCustom('metternich_krakow_checkbox')] [ROOT.GetCountry.GetNameNoFlag], tüm [GetStateRegion('STATE_WEST_GALICIA').GetName] [concept_state_region] (eyalet bölgesine) sahiptir\n• [SCOPE.GetRootScope.GetCountry.GetCustom('metternich_tech_checkbox')] [ROOT.GetCountry.GetNameNoFlag], [GetPlayer.MakeScope.ScriptValue('metternich_tech_target')|v0] adet [Concept('concept_technology', '$concept_technologies$')] araştırdı (şu an [GetPlayer.MakeScope.ScriptValue('techs_researched_script')|v0])[SCOPE.GetRootScope.GetCountry.GetCustom('metternich_system_entry')][SCOPE.GetRootScope.GetCountry.GetCustom('metternich_system_cohesion_entry')]\n• [SCOPE.GetRootScope.GetCountry.GetCustom('metternich_movement_checkbox')] Tüm #tooltippable;tooltip:[GetPlayer.GetTooltipTag],liberal_movements_list_tt Liberal#! veya #tooltippable;tooltip:[GetPlayer.GetTooltipTag],socialist_movements_list_tt Sosyalist#! [Concept('concept_political_movement','$concept_political_movements$')] (hareketler) yalnızca #b Marjinal#! desteğe sahiptir\n• [SCOPE.GetRootScope.GetCountry.GetCustom('metternich_laws_checkbox')] [ROOT.GetCountry.GetNameNoFlag]; [GetLawType('law_autocracy').GetName], [GetLawType('law_censorship').GetName] ve [GetLawType('law_secret_police').GetName] yasalarına sahiptir\n• [SCOPE.GetRootScope.GetCountry.GetCustom('metternich_institution_checkbox')] #b $institution_home_affairs$#! ve #b $institution_police$#! [Concept('concept_institution', '$concept_institutions$')] kurumları seviye #v 3#! veya daha yüksektir"

