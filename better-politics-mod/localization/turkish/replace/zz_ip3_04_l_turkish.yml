metternich_memory_level_0: "yetersizliğiyle [ROOT.GetCountry.GetNameNoFormatting]'nın kaçınılmaz çöküşünün tohumlarını eken kişi"
metternich_memory_level_1:1 "vizyonu dokunduğu her şeyi çürütmüş, itibarı zedelenmiş bir gericilik pınarı"
metternich_memory_level_2: "vadesi çoktan dolduğu halde iktidara tutunan sönmüş bir devlet adamı"
metternich_memory_level_3: "gerçek başarıları son dönemindeki çılgınlıklarının gölgesinde kalmış, geçmiş bir dönemin lekeli devi"
metternich_memory_level_4: "hem baştan çıkarıcı hem de yok olmaya mahkum bir idealin ev sahibi, eski toplumun vizyoneri"
metternich_memory_level_5: "eşit ölçüde hem nefret edilen hem de romantize edilen, gericiliğin cesur şampiyonu"
metternich_memory_level_6:1 "ilericilerin değerli rakibi ve halen direnen cesur aristokrasinin bir ikonu"
metternich_memory_level_7: "Modernite'nin büyük bir şüphecisi, ama yine de onun adı az duyulmuş mimarlarından biri"
metternich_memory_level_8: "[ROOT.GetCountry.GetNameNoFormatting]'nın başarısını borçlu olduğu, büyük bir stratejist ve vizyoner"
metternich_memory_level_9: "kıyaslanmanın bile hayal edildiği, modern devlet yönetiminin kusursuz bir örneği (paragon)"
metternich_memory_level_10: "her siyasi akım tarafından kendi insanı olarak benimsenen, Napolyon'a eşdeğer tarihi bir figür"

