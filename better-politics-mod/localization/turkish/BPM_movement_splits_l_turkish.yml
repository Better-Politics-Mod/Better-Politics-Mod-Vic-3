l_turkish:
# Liberal ayrılığı
 bpm_movement_splits.1.t: "Liberalizmin Yükselişi"
 bpm_movement_splits.1.d: "Aydınlar ve burjuvazi, ulusumuzda büyüyen bir liberal harekete ilgi duymaya başladı. Anayasal yönetimi ve mülkiyet haklarının korunmasını teşvik eden reformları benimsiyorlar. Liberal düşünürler artık örgütlendiler ve hükümetimiz üzerinde doğrudan baskı kurmaya başladılar."
 bpm_movement_splits.1.f: "Ahlak her ülkede mevzuatın ve hükümetin sonucudur; Afrika, Asya veya Avrupa'ya özgü değildir: ya iyidir ya da kötüdür\n—Denis Diderot, 1774"
 bpm_movement_splits.1.a: "İşe yarayabilirler!"
 bpm_movement_splits.1.b: "Onlar bir tehdit!"
 bpm_movement_splits_liberals_tt: "@information! #blue Liberaller ayrı bir [Concept('concept_interest_group', 'Çıkar Grubu')] olarak var olacaklar.#!"

# Muhafazakar Ayrılığı
 bpm_movement_splits.2.t: "Moderniteye Yürüyüş"
 bpm_movement_splits.2.d: "Ulusumuzda reformizm gelişmeye devam ettikçe, giderek daha fazla önde gelen lider ve düşünür modern siyasi ve ekonomik kurumlar geliştirmekle ciddi şekilde ilgilenmeye başladı. Reformist hareket artık iki kampa ayrılabilir: muhafazakarlar ve liberaller. İlki daha temkinlidir; devleti modernize ederken, yükselen burjuvaziye tavizler vererek geleneksel kurumlarla desteklenen dikkatli bir oligarşiyi sürdürmeyi hedefler. İkincisi ise liyakatli reformlara, anayasacılığın resmileşmesine ve erken demokratik kurumların güçlendirilmesine odaklanmıştır."
 bpm_movement_splits.2.f: "Ulusal zenginlik ve gücün dışsal koşulları doğanın kararıyla geri alınamaz bir şekilde sabitlenmemiştir. İnsanların gayretli çabalarıyla değiştirilebilirler. Bugünün aptalları yarının bilgeleri olabilir. Geçmişin zengin ve güçlüleri bugün fakir ve zayıf olabilir... Eğer kişisel bağımsızlığa ulaşmak ve böylece ulusu zenginleştirip güçlendirmek için ruhla ve enerjiyle öğrenmenin peşine düşmeye başlarsak, neden batının güçlerinden korkalım?\n -Fukuzawa Yukichi, 1872"
 bpm_movement_splits.2.a: "İşe yarayabilirler!"
 bpm_movement_splits.2.b: "Onlar bir tehdit!"
 bpm_movement_splits_conservatives_tt: "@information! #blue Muhafazakarlar ayrı bir [Concept('concept_interest_group', 'Çıkar Grubu')] olarak var olacaklar.#!"

# Radikal Ayrılığı
 bpm_movement_splits.3.t: "Radikaller"
 bpm_movement_splits.3.d: "Ulusumuzda büyüyen bir liberal fraksiyon (kanat) ulusal dikkatleri üzerine çekti. Bu radikal liberaller, eşitlikçilik ve özgür ifade lehine devletin büyük bir revizyondan geçirilmesi çağrısında bulunuyorlar. Geleneksel kurumları (monarşiler dahil) devrimci bir şevkle ezme arzuları açısından daha ılımlı liberallerden ayrılıyorlar."
 bpm_movement_splits.3.f: "Titreyeceksiniz, ey dünyanın tüm zalimleri! Kölece hükümetlerin ve kölece hiyerarşilerin tüm destekçileri, uyarıları dikkate alın! Artık reforma, yeniliğe (saçma ve kötü bir şekilde) karşı çıkmayın. Artık dünyayı karanlıkta tutamazsınız. Artan ışık ve özgürlüğe karşı artık direnmeyin. İnsanlığa haklarını geri verin; ve onlar ve siz birlikte yok olmadan önce suiistimallerin düzeltilmesine razı olun.\n —Richard Price, 1789"
 bpm_movement_splits.3.a: "İşe yarayabilirler!"
 bpm_movement_splits.3.b: "Onlar bir tehdit!"
 bpm_movement_splits_radicals_tt: "@information! #blue Radikaller ayrı bir [Concept('concept_interest_group', 'Çıkar Grubu')] olarak var olacaklar.#!"

# Mutlakiyetçi Ayrılığı
 bpm_movement_splits.4.t: "Mutlakiyetçiler"
 bpm_movement_splits.4.d: "Diyarımızda giderek artan sayıda etkili şahsiyet, yönetme haklarını doğrudan cennetten aldıkları ve devletin egemenliğinin bu gerçekten türetildiği inancıyla [GetPlayer.GetRuler.GetPrimaryRoleTitle] altında bir merkezileşme felsefesini benimsedi."
 bpm_movement_splits.4.f: "Kral, bahçesini güzelleştirmek için dikenleri ve çalıları söküp bir kenara atan, aynı zamanda arazisini yabancıların izinsiz girişinden koruyan bir çit ören bir bahçıvana benzer. Kral, soyluları çok sayıdaki arkadaşlarından ve tehlikeli bağımlılarından ayırır. Önemli meselelerde çok kişiye danışmak tavsiye edilmez.\n —Abul Fazl, 1590"
 bpm_movement_splits.4.a: "İşe yarayabilirler!"
 bpm_movement_splits.4.b: "Onlar bir tehdit!"
 bpm_movement_splits_absolutists_tt: "@information! #blue Mutlakiyetçiler ayrı bir [Concept('concept_interest_group', 'Çıkar Grubu')] olarak var olacaklar.#!"

# Tarımsal Popülist (Agpop) Ayrılığı
 bpm_movement_splits.5.t: "Tarımsal Popülizmin Yükselişi"
 bpm_movement_splits.5.d: "Sürekli değişen ve modernleşen bir dünyanın yükselen ideolojileri, kırsal kesimin güç yapılarını eleştirmek için bu kavramları uygulayan birçok kırsal liderine ilham verdi. Bu Tarımsal Popülistler, kültürleri ve maddi koşulları tarafından şekillendirilen, zaman zaman kendine özgü çok çeşitli inançlara sahiptirler, ancak hepsi toprak reformu ve gücün ulusumuzun çiftliklerinde ve köylerinde çalışan insanlara geri verilmesi konusunda derin bir inanç taşırlar."
 bpm_movement_splits.5.f: "Çar sürekli bir kararsızlık içinde ve tüm gerçek düşünme gücünü kaybetmiş durumda: özgürleşme (emancipation) istiyor ve yine de bunu önlemek için elinden geleni yapıyor. Köylünün özgürleşmesinin toprağın özgürleşmesiyle eşdeğer olduğunu ve toprağın özgürleşmesinin de sırasıyla bir sosyal devrim başlatacağını ve kırsal komünizmi kutsal kılacağını görmeye başladı... Kırsal komünün (commune) hiçbir zaman parçalanmamış olması, özel mülkiyetin hiçbir zaman komün mülkiyetinin yerini almamış olması Rusya için ne büyük bir nimet.\n —Aleksandr Herzen, 1851"
 bpm_movement_splits.5.a: "İşe yarayabilirler!"
 bpm_movement_splits.5.b: "Onlar bir tehdit!"
 bpm_movement_splits_agpops_tt: "@information! #blue Tarımsal Popülistler ayrı bir [Concept('concept_interest_group', 'Çıkar Grubu')] olarak var olacaklar.#!"

# Sosyalist Ayrılığı
 bpm_movement_splits.6.t: "Sosyalistler"
 bpm_movement_splits.6.d: "Ulusumuzun dört bir yanında eşitlikçi bir hareket büyüyor. Büyüyen şehirlerimizde belirginleşen keskin eşitsizlikten güç alan sosyalist hareket, toplumu tabandan yukarıya doğru demokratikleştirmeyi amaçlıyor. Sosyalistler; bağımsız komünler (communes) kurmaktan kapsamlı reformizme, halk direnişini ve devrimi örgütlemeye kadar çeşitli stratejilere sahiptir. Sosyalist hareket gençtir, ancak çoktan güçlülere musallat olan ve sıradan insanı cesaretlendiren bir hayalet haline gelmiştir."
 bpm_movement_splits.6.f: "Biliyorum ki, bir Nero veya Tiberius'un tiranlığından çok daha zor atlatılacak veya sarsılacak bir tiranlık vardır; o da koşulların tiranlığıdır. Bozulmuş bir toplumsal düzenden doğar; cehalet, yoksulluk, ihmal, kötü örnek, zihinsel acılardan oluşur... Mevcut düzende herkesin, bir başkasını mahvetmek için kendini mahvetmekte özgür olduğunun son derece açık ve anlaşılır olduğu düşünülmektedir!\n—Louis Blanc, 1839"
 bpm_movement_splits.6.a: "İşe yarayabilirler!"
 bpm_movement_splits.6.b: "Onlar bir tehdit!"
 bpm_movement_splits_socialists_tt: "@information! #blue Sosyalistler ayrı bir [Concept('concept_interest_group', 'Çıkar Grubu')] olarak var olacaklar.#!"

# Piyasa Liberali Ayrılığı
 bpm_movement_splits.7.t: "Piyasa Liberalleri"
 bpm_movement_splits.7.d: "Korumacılık ve serbest ticaret arasındaki tartışma şiddetlenirken, bir grup liberal serbest ticaret ve laissez-faire (bırakınız yapsınlar) ekonomik politikalarına daha da sıkı sarıldı. Piyasaların serbestleştirilmesini refah ve adil bir ekonomi inşa etmenin en kesin yolu olarak görüyorlar. Dalgalı bir piyasada kaynakları yönetmeleri, küresel pazardaki arz ve talep değişimlerine hızla uyum sağlamaları konusunda özel aktörlere (işletmelere) güveniyorlar."
 bpm_movement_splits.7.f: "Kısacası korumacılığın amacı, kendi içlerinde yararlı ve değerli olan şeylerin, onları yapmaya zorlamak amacıyla bir ülkeye getirilmesini engellemektir. Fakat tüm insanlığın, günlük hayatın bireysel işlerinde arzu edilecek olarak gördüğü şey, bir şeyler üretmek değil, bir şeylere sahip olmaktır.\n -Henry George, 1896"
 bpm_movement_splits.7.a: "İşe yarayabilirler!"
 bpm_movement_splits.7.b: "Onlar bir tehdit!"
 bpm_movement_splits_marlibs_tt: "@information! #blue Piyasa Liberalleri ayrı bir [Concept('concept_interest_group', 'Çıkar Grubu')] olarak var olacaklar.#!"

# Ulusal Liberal Ayrılığı 
 bpm_movement_splits.8.t: "Ulusal Liberaller"
 bpm_movement_splits.8.d: "19. yüzyıl ilerledikçe, liberal milliyetçilik kavramı hem başarılar hem de başarısızlıklarla şekillenerek büyüdü ve olgunlaştı. Bizimki de dahil olmak üzere pek çok çağdaş ulus devlette bu hareket, güçlü ve modern bir ulusal kimlik geliştirmeyi amaçlayan ve bu akıma kapılanların yer aldığı son derece romantik bir harekete dönüştü. Çağdaş milliyetçilik, yönetişimi ve kültürü eşit derecede etkiler; ve bu hareketin ön saflarında yer alan ulusal liberaller, kendi başlarına bir güç olarak kendilerini tanıtırlar."
 bpm_movement_splits.8.f: "O geçmiş nesil devlet adamlarının, kanun yapıcıların ve yazarların neler yapabildiğini biliyoruz. Neleri başardıklarını, neleri başaramadıklarını da biliyoruz. Bizim görevimiz ve kaderimiz onlarınkinden farklıdır. Ödünç alınmış sesini hiç sevmeyerek, bizler henüz... yeni bir nesiliz; ve şimdi bizim için, başarma gücüne sahip olabileceğimiz şeyin ne olduğunu ve dünyanın, gözlerimizi dikmemizi makul bir şekilde isteyebileceği nesnelerin neler olduğunu sorgulama zamanıdır.\n -Cornelius Mathews, 1845"
 bpm_movement_splits.8.a: "İşe yarayabilirler!"
 bpm_movement_splits.8.b: "Onlar bir tehdit!"
 bpm_movement_splits_natlibs_tt: "@information! #blue Ulusal Liberaller ayrı bir [Concept('concept_interest_group', 'Çıkar Grubu')] olarak var olacaklar.#!"

# Anarşist Ayrılığı
 bpm_movement_splits.9.t: "Anarşistler"
 bpm_movement_splits.9.d: "Sosyalist düşünce büyüyüp geliştikçe, hareket içindeki iç tartışmalar kendi karakterlerini ve kendi fraksiyonlarını kazanır. Bu kez yeni fraksiyon Anarşistlerinki oldu; zorlayıcı gücüyle devletin, insanlığın refahı için burjuvazi kadar büyük bir tehdit olduğuna inanan ve mümkün olduğunca eşzamanlı olarak her ikisinin de ortadan kaldırılmasını talep eden sosyalist inançlılar."
 bpm_movement_splits.9.f: "Anarşistler bunu binlerce kez söylemişlerdir ve tüm tarih onların söylediklerini doğrulamaktadır: özel mülkiyet ve siyasi güç, insanlığı birbirine bağlayan zincirin iki halkası ve bir suikastçının bıçağının ikiz kenarları gibidir. Birinden kurtulmadan diğerinden kurtulmanın hiçbir yolu yoktur. Hükümeti ortadan kaldırmadan özel mülkiyeti ortadan kaldırırsanız, ilki yönetenler tarafından diriltilecektir. Özel mülkiyeti ortadan kaldırmadan hükümeti ortadan kaldırırsanız, mülk sahipleri hükümeti diriltecektir.\n—Errico Malatesta, 1897"
 bpm_movement_splits.9.a: "İşe yarayabilirler!"
 bpm_movement_splits.9.b: "Onlar bir tehdit!"
 bpm_movement_splits_anarchists_tt: "@information! #blue Anarşistler ayrı bir [Concept('concept_interest_group', 'Çıkar Grubu')] olarak var olacaklar.#!"

# Devrimci Sosyalist Ayrılığı
 bpm_movement_splits.10.t: "Kızıllar"
 bpm_movement_splits.10.d: "Kapsamlı tartışmaların ardından, işçiler ve Aydınlar daha devrimci bir akıma kapıldılar. İşçilerin kurtuluşu için bir araç olarak reformları reddetmeyi benimseyen Devrimci Sosyalist düşünürler artık örgütlendiler ve Proletaryanın devrimci enternasyonal diktatörlüğü için ajitasyon yapmaya başladılar."
 bpm_movement_splits.10.f: "Komünistler, görüşlerini ve amaçlarını gizlemeyi küçümserler. Amaçlarına ancak mevcut tüm toplumsal koşulların zorla yıkılmasıyla ulaşılabileceğini açıkça ilan ederler. Bırakın egemen sınıflar Komünist bir devrimde titresinler. Proleterlerin zincirlerinden başka kaybedecekleri hiçbir şeyleri yoktur. Kazanacakları bir dünya var.\n—Karl Marx, 1848"
 bpm_movement_splits.10.a: "İşe yarayabilirler!"
 bpm_movement_splits.10.b: "Onlar bir tehdit!"
 bpm_movement_splits_revsocs_tt: "@information! #blue Devrimci Sosyalistler ayrı bir [Concept('concept_interest_group', 'Çıkar Grubu')] olarak var olacaklar.#!"

# Reformist Sosyalist Ayrılığı
 bpm_movement_splits.11.t: "Reformist Dava"
 bpm_movement_splits.11.d: "Sosyalist davanın çekiciliği genişlemeye devam ettikçe, geleceği hakkındaki tartışmalar da artıyor. Proletaryanın son dönemdeki seçim başarıları, yeni bir sosyalist fraksiyon olan Reformistlerin yolunu açtı. Yeni ortaya çıkan bu Reformist kanat, sosyalizme ulaşma nihai hedefine sadık kalırken, gereksiz kan dökülmesi yerine kademeli ve barışçıl reformları savunuyor."
 bpm_movement_splits.11.f: "Yükselmek isteyen bir sınıfın sağlam bir morale sahip olması gerekir ve hiçbir bozulmaya uğramamalıdır. Kendine ideal bir nihai amaç belirleyip belirlememesi, yakın amaçlarını enerjiyle takip ediyorsa ikincil derecede önemlidir. Önemli olan nokta, bu amaçların daha yüksek derecede bir ekonomi ve toplumsal yaşam ifade eden belirli bir ilkeden ilham almasıdır; bunların, uygarlığın evriminde ahlakın ve yasal hakların daha yüksek bir görünümü anlamına gelen toplumsal bir anlayışın somutlaşması olmasıdır.\n—Eduard Bernstein, 1899"
 bpm_movement_splits.11.a: "İşe yarayabilirler!"
 bpm_movement_splits.11.b: "Onlar bir tehdit!"
 bpm_movement_splits_refsocs_tt: "@information! #blue Reformist Sosyalistler ayrı bir [Concept('concept_interest_group', 'Çıkar Grubu')] olarak var olacaklar.#!"

# Faşist Ayrılığı
 bpm_movement_splits.12.t: "Faşizmin Yükselişi"
 bpm_movement_splits.12.d: "Yeni bir gericilik gücü ortaya çıkıyor: @ig_fascists!Faşistler. Aşırı milliyetçi bir hareket olarak, sınıf işbirliği ve ulusa sarsılmaz bir sadakat üzerine kurulmuş bir devleti savunuyorlar."
 bpm_movement_splits.12.f: "Kitlelerin mülkiyet ilişkilerini değiştirme hakkı vardır; Faşizm mülkiyeti korurken onlara bir ifade vermeye çalışır. Faşizmin mantıksal sonucu, estetiğin siyasi yaşama sokulmasıdır. Führer kültü ile Faşizmin diz çökmeye zorladığı kitlelerin ihlal edilmesi, ritüel değerlerin üretimine bastırılan bir aygıtın ihlal edilmesiyle karşılığını bulur.\n—Walter Benjamin, 1936"
 bpm_movement_splits.12.a: "İşe yarayabilirler!"
 bpm_movement_splits.12.b: "Onlar bir tehdit!"
 bpm_movement_splits_fascists_tt: "@information! #blue Faşistler ayrı bir [Concept('concept_interest_group', 'Çıkar Grubu')] olarak var olacaklar.#!"
  
# Tarımsal Sosyalizm
 bpm_movement_takeovers.1.t: "Tarımsal Sosyalistler"
 bpm_movement_takeovers.1.d: "Aydınlar ve burjuvazi, ulusumuzda büyüyen bir liberal harekete ilgi duymaya başladı. Anayasal yönetimi ve mülkiyet haklarının korunmasını teşvik eden reformları benimsiyorlar. Liberal düşünürler artık örgütlendiler ve hükümetimiz üzerinde doğrudan baskı kurmaya başladılar."
 bpm_movement_takeovers.1.f: "Ahlak her ülkede mevzuatın ve hükümetin sonucudur; Afrika, Asya veya Avrupa'ya özgü değildir: ya iyidir ya da kötüdür\n—Denis Diderot, 1774"
 bpm_movement_takeovers.1.a: "Anlaşıldı."

