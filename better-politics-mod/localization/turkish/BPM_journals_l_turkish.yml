 bpm_russia.1.t:0 "Felsefi Mektuplar"
 bpm_russia.1.d:0 "[SCOPE.sCharacter('bpm_russia_chaadayev').GetFullName] tarafından Fransızca'dan çevrilen mektupların yayımlanması, Rusya'nın okur yazar azınlığını ateşe verdi; yazılanlar o kadar olay yarattı ki, [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullName] adamı resmen deli ilan etti, tüm ülkedeki entelektüeller ise kutuplaşmış tartışmalarla mektuplarda ifade edilen fikirleri açıklayarak onu kınadı ya da destekledi. Farkında olmadan [SCOPE.sCharacter('bpm_russia_chaadayev').GetFullName], yakın yarım yüzyıl boyunca Rus felsefesindeki en derin bölünmeyi, Zapadnikler ve Slavofiller arasındaki bölünmeyi kışkırtmış oldu."
 bpm_russia.1.f:0 "Bir zamanlar Büyük Petro bizi eğitmek istedi ve aydınlanmaya hevesli olmamız için bize medeniyetin pelerinini fırlattı: Pelerini aldık ama medeniyete dokunmadık... Kanımızda tüm gerçek ilerlemeleri kovan bir şey var. Bugün... entelektüel alanda bir boşluğa işaret ediyoruz.\n\n—Pyotr Çaadayev, 1836#!"
 bpm_russia.1.a:0 "Şu manyağı tıkın ev hapsine amınakoyayım, başımıza iş açacak!"
 bpm_russia.1.b:0 "Herifin lafları acı ama içinde doğruluk payı var..."

 bpm_russia.2.t:0 "Kırık Mızraklar"
 bpm_russia.2.d:0 "Sadece birkaç yıl önce çok ateşli ve tutkulu olan Rus Aydınlarının Zapadnik ve Slavofil kanatları arasındaki tartışmalar nihayet sona erdi. İyi ya da kötü Rus siyasi düşüncesi yoluna devam ediyor."
 bpm_russia.2.f:0 "Sonunda, yeni felsefeler ve yeni meseleler eğitimli adamların dikkatini çekti. Tartışmalar yankılanan bir zaferle değil, sağır edici bir sessizlikle sona erdi."
 bpm_russia.2.a:0 "Ve Rusya hala ayakta, anasını satayım."

 bpm_russia.3.t:0 "Hayal Kuranlar"
 bpm_russia.3.d:0 "Zapadniklerin hayali Rusya'da gerçekleşti; özgür bir Rus vatandaşı hayali. Rusya için gelecek henüz yazılmamış olsa da, kadim ve köhne soylular ile onun zalim çarı tarafından değil, bizzat Rusya halkı tarafından yazılan bir gelecek olacak gibi görünüyor. Rusya batıyı önemli bir şekilde yakaladı; şimdi onları daha da geçip geçemeyeceğini göreceğiz!"
 bpm_russia.3.f:0 "Bunun mümkün olabileceğini, medeni ulusların gerisinde kalan bir ülkenin bu kadar hızlı yetişebileceğini düşünmemiştik. Ancak hayal kuranlar o hayalleri gerçeğe dönüştürdüler ve Rusya'nın geleceği biraz daha parlak görünüyor."
 bpm_russia.3.a:0 "İleri ulan!"
 
# FASCIST "SPLIT" (its more of a spawn really)
 je_bpm_split_fascists:0 "Faşizmin Yükselişi"
 je_bpm_split_fascists_status:0 "Sağın yeni bir unsurunun yükselişini izleyin."
 je_bpm_split_fascists_reason:0 "Kitle siyasetinin yükselişinin ortasında geleneksel gerici ideolojinin başarısızlıkları, devrimci milliyetçilerden oluşan yeni bir koalisyonun doğmasına yol açıyor. Gaziler örgütlerinden ve sağcı profesyonellerden destek alan faşistler, sınıf işbirliğine ve silahlanmış bir ulusal efsaneye dayalı güçlü, merkezi bir devlet kurmayı amaçlıyorlar.\n\n#lore \"Görünüşe göre... insan, savaşın etkisiyle siyasi bir hayvan olmayı unutacak kadar sarsılmış. Bu şüphe, siyasi düşünce gerekliliğinden fanteziye doğru baş aşağı bir kaçış olan Faşizmin yayılmasıyla doğrulanıyor. Savaş sonrası durumla ilgili, henüz analiz edilmemiş nedenlerden kaynaklanan ve bu analiz tamamlanıp yeni bir sosyal formülün temeli haline getirilene kadar giderilemeyecek olan yeniliğinden daha bariz bir şey yoktur. Ancak Faşizmi destekleyen kişiler, sanki insan zaten tüm sorunlarımızla başa çıkmamızı sağlayacak ilkelere sahipmiş ve sanki mesele sadece onları uygulayacak bir diktatör atamakmış gibi davranıyorlar.\"\n\n—Rebecca West, 1935#!"

 je_bpm_split_fascists_special_tooltip:0 "İlerleme aşağıdakiler tarafından belirlenir:\n#variable [Country.MakeScope.Var('bpm_je_split_fascists_progress_from_base').GetValue|+=]#! temel değer\n#variable [Country.MakeScope.Var('bpm_je_split_fascists_progress_from_conflicts').GetValue|+=]#! Savaşlarda, Diplomatik Oyunlarda, Devrimlerde veya Ulusal Birleşme lideri olmaktan\n#variable [Country.MakeScope.Var('bpm_je_split_fascists_progress_from_rightists_empowered').GetValue|+=]#! #bold Gerici#! ve #bold Muhafazakar#! [Concept('concept_interest_group', 'Çıkar Gruplarının')] hükümette olmasından veya Desteklenmesinden\n#variable [Country.MakeScope.Var('bpm_je_split_fascists_progress_from_rightists_suppressed').GetValue|+=]#! bastırılmış #bold Gerici#! ve #bold Muhafazakar#! [Concept('concept_interest_group', 'Çıkar Gruplarından')]\n#variable [Country.MakeScope.Var('bpm_je_split_fascists_progress_from_rightists_marginal').GetValue|+=]#! marjinalize olmuş #bold Gerici#! ve #bold Muhafazakar#! [Concept('concept_interest_group', 'Çıkar Gruplarından')]\n#variable [Country.MakeScope.Var('bpm_je_split_fascists_progress_from_radicals').GetValue|+=]#! radikal orta tabaka nüfusundan; bu sadece #bold Liberal#! ve #bold Muhafazakar#! [Concept('concept_interest_group', 'Çıkar Grupları')] marjinalize değilse ve bastırılmamışsa birikecektir."

