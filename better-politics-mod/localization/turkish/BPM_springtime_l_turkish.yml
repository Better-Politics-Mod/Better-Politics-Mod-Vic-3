#Slavlar
 bpm_slavic.1.t:0 "Prag Konferansı"
 bpm_slavic.1.d:0 "Almanya ve başka yerlerdeki devrimci hareketlerden ilham alan her türden Slav milliyetçisi, Slav milliyetçiliğine dair çeşitli fikirleri tartışmak üzere Prag'da bir araya geldi."
 bpm_slavic.1.f:0 "Kardeşler! Karar saati geldi. Eski, yıkılmış dünyaya mı arka çıkacaksınız, yoksa gelecek nesillerin ve yüzyılların ait olduğu, ihtişamıyla sizi aydınlatan yeni dünya için açıkça taraf mı olacaksınız; işte buna siz karar vereceksiniz. Geleceğin kendi ellerinizde olmasını mı seçeceğiniz, yoksa dilerseniz bir kez daha güçsüzlüğe, terk edilmiş umutların karanlığına, kölelik cehennemine batmayı mı seçeceğiniz de size kalmış...\n\n—Mikhail Bakunin, 1848"
 bpm_slavic.1.a:0 "Halkımız için."