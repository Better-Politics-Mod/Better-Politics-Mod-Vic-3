 je_bpm_revolt_ember_tt_lvl2: "#bold [THIS.GetState.GetName]#!\n#v Level 2#! revolutionary cell: the flames are rising"
 je_bpm_revolt_ember_tt_lvl1: "#bold [THIS.GetState.GetName]#!\n#v Level 1#! revolutionary cell: a smouldering ember"
