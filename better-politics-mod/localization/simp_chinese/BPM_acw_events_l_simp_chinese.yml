 bpm_acw_month.tt:0 "内战将在一个月内爆发"
 FDN:0 "自由国"
 FDN_ADJ:0 "自由国的"
 bpm_acw_events.101.t:0 "国家联盟全国代表大会"
 bpm_acw_events.101.d:0 "随着进行中的内战对我国政治体制施加压力，总统决定组建国家联盟党，希望将共和党人和民主党人团结在战争事业之后。这项政策的关键在于副总统人选。现任副总统是一名激进共和党人，若被要求，他愿意平静地退出竞选。万一发生不测，谁应当领导我们的国家走向胜利？"
 bpm_acw_events.101.f:0 ""兹决议：我们赞同合众国政府的决心，即不与叛乱者妥协，也不向其提供任何和平条件，除非是基于其无条件放弃敌对、重新忠诚于合众国宪法和法律的条件；我们吁请政府坚守这一立场，以最大可能的活力推进战争，彻底镇压叛乱，并完全信赖美国人民对其国家及其自由制度无私奉献的爱国精神、英雄气概与不灭的忠诚。"\n\n—国家联盟党政纲第二项决议，1864年"
 bpm_acw_events.101.a:0 "总统选择了一名战争民主党人，标志着行政主导的温和重建。"
 bpm_acw_events.101.b:0 "总统保留其旧副总统，标志着国会主导的重建。"
 bpm_acw_events.101.c:0 "总统选择了一名激进民主党人，标志着行政主导的强硬重建。"
 bpm_acw_events.102.t:0 "蟒蛇缠身"
 bpm_acw_events.102.d:0 "经过大量流血，我军成功控制了密西西比河。这不仅将叛乱各州一分为二，还迫使叛军沿阿巴拉契亚山脉全线分散兵力，最终暴露了其工业和政治中心。我们的士兵为这些胜利而欢欣鼓舞，必定会在下次选举中投票支持我们。"
 bpm_acw_events.102.f:0 ""我已看到你的电报，表明你不愿放弃目前的坚守。我也不愿意。像斗牛犬一样咬住不放，尽可能地咀嚼、扼杀。"\n\n—亚伯拉罕·林肯，1864年"
 bpm_acw_events.102.a:0 "万岁！万岁！我们带来解放的欢呼！"
 bpm_acw_events.103.t:0 "中止人身保护令的命令"
 bpm_acw_events.103.d:0 "混乱与叛乱不仅遍布叛乱各州，也蔓延至通往首都的中大西洋港口和铁路沿线。叛徒们威胁要阻止我们政府所在地获得增援，并拖延国会的召集。为补救此局，我们可以在关键地区中止人身保护令，以保障政府的安全。这将是极具争议的举动，不太可能获得立法或司法机构的批准。然而，执行这样一项命令也将强化我们的警务权力，从而赋予我们在叛乱被镇压后采取更大步骤重建联邦的能力。"
 bpm_acw_events.103.f:0 ""你们正从事镇压一场违反合众国法律的叛乱。如果在费城与华盛顿市之间现在或将要使用的任何军事防线沿线或其附近，你们发现有必要为公共安全而中止人身保护令的抵抗，你们本人，或通过抵抗发生地点的指挥官，均被授权中止该令状。"\n\n—亚伯拉罕·林肯，1861年"
 bpm_acw_events.103.a:0 "未经立法批准，我们不能迈出这一步。"
 bpm_acw_events.103.b:0 "他们会叫我暴君，但我必须捍卫民主。下达命令！"
 bpm_acw_events.104.t:0 "法定货币法"
 bpm_acw_events.104.d:0 "为筹措这场战争的经费，国会先是授权印制可兑换黄金的即期票据，因此其价值依赖我们的硬币储备。随着战争进入第二年，显然我们无法继续以金属本位为这场冲突提供资金。同情我们事业的企业家因此建议发行纸币。此举将令拥有丰富黄金储备的西部各州不满，但我们需要继续向供应商和士兵付款才能赢得这场战争。"
 bpm_acw_events.104.f:0 ""如果你要在绿背纸币上印一句格言，我会建议印彼得与保罗的那句：'金银我都没有，只把我所有的给你。'"\n\n—亚伯拉罕·林肯，1862年"
 bpm_acw_events.104.a:0 "我们将启动一个试点计划，但不会重蹈大陆币的覆辙。"
 bpm_acw_events.104.b:0 "我们将鼓励国会通过法案，授权大规模印制这种法定货币。"
 bpm_acw_events.105.t:0 "征兵法案"
 bpm_acw_events.105.d:0 "随着这场该死的战争持续，我们对新兵的需求越来越大。以前我们还能依靠国民的爱国热情充实民兵，但战争倦怠已耗尽了我们的兵源，对废奴主义的猜疑又使白人不愿参军。为了联邦，现在或许有必要实施普遍的男性征兵。这必将激起民主党中主和派系以及穷人的愤怒——穷人会认为对富人的豁免是不公正的。但若想尽快结束这场战争，我们就需要更多的战士，无论其来自何方。"
 bpm_acw_events.105.f:0 ""一次只应付一场叛乱，大概是我们能方便处理的上限了。"\n\n—亚伯拉罕·林肯，1863年"
 bpm_acw_events.105.a:0 "我们要像开国元勋们作战那样作战。不实施征兵。"
 bpm_acw_events.105.b:0 "每个人都必须尽责，哪怕有些人会替别人尽责。让国会通过征兵法案。"
 bpm_acw_events.106.t:0 "十字路口"
 bpm_acw_events.106.d1:0 "随着我们的国家走向其存在的十字路口，国家联盟党亦如此。我们在立法和副总统人选上的激进决定，不仅导致战争民主党人抛弃了我们，还使霍勒斯·格里利的自由共和党人与铜头蛇联合起来。这将是一个残酷的选举季，一个我们不太可能获胜的选举季。祝你好运，总统先生。"
 bpm_acw_events.106.d2:0 "随着我们的国家走向其存在的十字路口，国家联盟党亦如此。我们在立法和副总统人选上颇具争议的决定，使战争民主党人未能加入我方阵营，他们与其暗中通敌的兄弟们和解了。这场选举会很艰难，总统先生，但只要我们努力竞选，仍可获胜。只是别让它分散你对战争的注意力。"
 bpm_acw_events.106.d3:0 "随着我们的国家走向其存在的十字路口，国家联盟党亦如此。经过艰辛努力，我们成功团结了战争民主党人、自由共和党人和激进共和党人的联盟。此外，新的缺席投票制度将保证士兵在这场重大抉择中拥有发言权。只要不犯重大错误，这场选举正朝着您的胜利迈进，总统先生。"
 bpm_acw_events.106.d4:0 "随着我们的国家走向其存在的十字路口，国家联盟党亦如此。凭借妥协与决心，你驾驶着国家之舟穿越了它最严峻的考验。各派系的共和党人和民主党人纷纷涌向国家联盟的旗帜，甚至有人预言你将赢得每一张选举人票。如此成就，唯有华盛顿可以比肩，实无愧于你卓越的作为，总统先生。"
 bpm_acw_events.106.d5:0 "随着我们的国家走向其存在的十字路口，国家联盟党亦如此。凭借妥协与决心，你驾驶着国家之舟穿越了它最严峻的考验。各派系的共和党人和民主党人纷纷涌向国家联盟的旗帜，甚至有人预言你将赢得每一张选举人票。如此成就，唯有华盛顿可以比肩，实无愧于你卓越的作为，总统先生。"
 bpm_acw_events.106.d6:0 "随着我们的国家走向其存在的十字路口，国家联盟党亦如此。凭借妥协与决心，你驾驶着国家之舟穿越了它最严峻的考验。各派系的共和党人和民主党人纷纷涌向国家联盟的旗帜，甚至有人预言你将赢得每一张选举人票。如此成就，唯有华盛顿可以比肩，实无愧于你卓越的作为，总统先生。"
 bpm_acw_events.106.f:0 ""毋宁说，是我们这些活着的人，应当在此献身于那些在此战斗过的人们迄今如此崇高推进的未竟事业；毋宁说，我们应当在此献身于仍待我们完成的大业——从这些光荣的死者身上汲取更大的献身精神，去完成他们为之献出最后全部忠诚的事业——我们在此庄严立志，这些死者绝不至于白白牺牲——这个国家，在上帝的庇佑下，将迎来自由的新生——而这个民有、民治、民享的政府，绝不会从地球上消亡。"，1863年"
 bpm_acw_events.106.a:0 "过河途中别换马！"
 bpm_acw_events.107.t2:0 "铜头蛇获胜"
 bpm_acw_events.107.t1:0 "共和党人获胜"
 bpm_acw_events.107.d2:0 "尽管我们尽了最大努力，我们还是输了选举。随着我们的失败，联邦的梦想也随之破灭——因为无论对手的竞选承诺如何，民主党中的铜头蛇势必会在和谈中寻求最省事的出路。如今我们只能哀悼那些白白牺牲的死者，他们被南北双方的同胞所背叛。"
 bpm_acw_events.107.d1:0 "历经艰难困苦，我们变得更强。铜头蛇已被击败，我们身后不仅有击败邦联的授权，还有开启伟大国家重建的使命。但让我们不要忘记那些殉难的死者，从老布朗开始。让我们奋起使人自由！"
 bpm_acw_events.107.f:0 ""选举是必需的。没有选举，就没有自由政府；如果叛乱能迫使我们放弃或推迟一次全国选举，那它倒真可以宣称已经征服并毁掉了我们。"\n\n—亚伯拉罕·林肯，1864年"
 bpm_acw_events.107.a:0 "我们辜负了所有人，无论白人还是黑人。"
 bpm_acw_events.107.b:0 "而他的灵魂仍在前进！"
 bpm_acw_events.108.t:0 "殉难的解放者"
 bpm_acw_events.108.d:0 "在我们对叛徒取得最终胜利后不到一周，我们的总统、伟大的解放者，就遭到刺客枪杀。有证据表明邦联情报机构与这一阴谋可能存在关联，但缺乏确凿证据，我们只剩下种种推测。正如这场内战以一场殉难开始，它也以一场殉难结束。归向主吧，总统先生。"
 bpm_acw_events.108.f:0 ""当约翰·布朗伸出他的手臂，天空为之澄明。妥协的时代已经过去——自由的武装大军在一个破裂的联邦深渊两岸面对面站立——刀兵相接的时刻近在眼前。南方把一切押在夺取联邦政府上，而一旦失败，便拔出叛乱之剑，从而让失败的事业成了她自己的，而非布朗的，成为本世纪的失败事业。"\n\n—弗雷德里克·道格拉斯，1881年"
 bpm_acw_events.108.a:0 "如今我们的职责是完成他最后的使命：重建联邦。"
 bpm_acw_events.109.t:0 "汉普顿路会议"
 bpm_acw_events.109.d:0 "新任总司令从汉普顿路和平会议带回了一份和平条约。正如我们所料，他们在文件的每一个方面都作了让步，承诺归还逃奴、完全撤出分离各州，并承认邦联。"
 bpm_acw_events.109.f:0 ""至于和平，我此前说过，现在重申，有三件事不可或缺。\n\n一、在全国所有州恢复国家权威。\n\n二、合众国行政机构在奴隶制问题上，不得从最近的国会年度咨文及此前的文件中所持立场上退缩。\n\n三、在战争结束、所有与政府为敌的武装解散之前，不得停止敌对行动。"\n\n—亚伯拉罕·林肯，1865年"
 bpm_acw_events.109.a:0 "最后一柄匕首刺入了它的刀刃。"
 bpm_acw_events.110.t1:0 "布尔朗战役"
 bpm_acw_events.110.t2:0 "半岛战役"
 bpm_acw_events.110.t3:0 "陆路战役"
 bpm_acw_events.110.t4:0 "彼得斯堡战役"
 bpm_acw_events.110.d1:0 "尽管叛军顽强抵抗，我们身穿蓝衣的战士们仍在一场快速的战役中成功攻入里士满。邦联政府惊慌逃窜，留下了许多重要物资。总统在萨姆特堡事件后号召志愿者的呼吁，因其果断而受到报纸的赞扬。然而，我们对叛军的战争才刚刚开始……"
 bpm_acw_events.110.d2:0 "尽管行动十分复杂，我们身穿蓝衣的战士和他们英俊的将领们仍在半岛战役中获胜。邦联政府遭到侧翼包抄且兵力劣势，已撤退至阿拉巴马。这场战役注重机动，令人联想到1814年反法同盟进军巴黎。尽管如此，我们对叛军的战争尚未结束……"
 bpm_acw_events.110.d3:0 "尽管损失惨重，我们身穿蓝衣的战士们仍成功将邦联军逐出里士满。不幸的是，叛军政府在可能被俘之前已经逃脱。总体战的学说在我们将领中赢得了赞誉，对邦联掘壕固守的担忧被证明毫无根据。不过，除非每一个奴隶都获得自由，我们对叛军的战争就仍未完成……"
 bpm_acw_events.110.d4:0 "尽管战斗多年，我们身穿蓝衣的战士们成功赢得了彼得斯堡围城战，从而切断了里士满与邦联其余部分的联系，迫使其投降。邦联政府和军队已向西向南突围，可能试图迁往蒙哥马利。然而，只要我军能持续施压，这场战争很快就会结束，叛军将被粉碎！"
 bpm_acw_events.110.f:0 ""我已看到你的电报，表明你不愿放弃目前的坚守。我也不愿意。像斗牛犬一样咬住不放，尽可能地咀嚼、扼杀。"\n\n—亚伯拉罕·林肯，1864年"
 bpm_acw_events.110.a:0 "万岁！万岁！我们带来解放的欢呼！"
 bpm_acw_events.111.t:0 "向大海进军"
 bpm_acw_events.111.d:0 "在成功占领亚特兰大之后，我们英俊的将领们对佐治亚——南方帝国州——发动了一场毁灭性的袭扰。随着大军抵达萨凡纳，南方工业实际上已告终结，其残骸在远处冒烟。这场战役充分揭示了这场战争的总体性质，以及一场从根本上改革南方生活方式的总体性和平的必要性。"
 bpm_acw_events.111.f:0 ""我已看到你的电报，表明你不愿放弃目前的坚守。我也不愿意。像斗牛犬一样咬住不放，尽可能地咀嚼、扼杀。"\n\n—亚伯拉罕·林肯，1864年"
 bpm_acw_events.111.a:0 "万岁！万岁！我们带来解放的欢呼！"
 bpm_acw_events.112.t:0 "邦联军队投降"
 bpm_acw_events.112.d:0 "已经无处可退，邦联将领们终于认识到其事业的徒劳。四面被围、无望逃脱，叛徒们终于放下了武器。如今开始了镇压南方动乱的艰巨任务，以及交付给我们的重大使命：将压迫的杂草从这片土地上连根拔除。"
 bpm_acw_events.112.f:0 ""我已看到你的电报，表明你不愿放弃目前的坚守。我也不愿意。像斗牛犬一样咬住不放，尽可能地咀嚼、扼杀。"\n\n—亚伯拉罕·林肯，1864年"
 bpm_acw_events.112.a:0 "万岁！万岁！我们带来解放的欢呼！"
 bpm_acw_events.201.t:0 "国家融合全国代表大会"
 bpm_acw_events.201.d:0 "随着进行中的内战对我国政治体制施加压力，总统决定组建国家融合党，希望将民主党人和辉格党人团结在战争事业之后。这项政策的关键在于副总统人选。现任副总统是一名北方民主党人，若被要求，他愿意平静地退出竞选。这一决定将向新党及全世界表明我们对战后重聚的计划。"
 bpm_acw_events.201.f:0 ""兹决议：我们赞同合众国政府的决心，即不与叛乱者妥协，也不向其提供任何和平条件，除非是基于其无条件放弃敌对、重新忠诚于合众国宪法和法律的条件；我们吁请政府坚守这一立场，以最大可能的活力推进战争，彻底镇压叛乱，并完全信赖美国人民对其国家及其自由制度无私奉献的爱国精神、英雄气概与不灭的忠诚。"\n\n—国家联盟党政纲第二项决议，1864年"
 bpm_acw_events.201.a:0 "总统选择了一名火食者，标志着奴隶制在整个联邦的全面扩张。"
 bpm_acw_events.201.b:0 "总统保留其旧副总统，标志着对"特殊制度"采取人民主权的政策。"
 bpm_acw_events.201.c:0 "总统选择了一名南方辉格党人，标志着回归密苏里妥协。"
 bpm_acw_events.202.t:0 "毒蛇出击"
 bpm_acw_events.202.d:0 "经过大量流血，我军成功控制了所谓的"自由州"。这不仅结束了公开的叛乱，还迫使布朗的袭击者一分为三——一些人西进，另一些人北上，还有更多人藏身于阿巴拉契亚山脉之中。我们的精英为奴性叛乱的失败而欢欣鼓舞，并团结在我们的扩张计划之后。"
 bpm_acw_events.202.f:0 ""我已看到你的电报，表明你不愿放弃目前的坚守。我也不愿意。像斗牛犬一样咬住不放，尽可能地咀嚼、扼杀。"\n\n—亚伯拉罕·林肯，1864年"
 bpm_acw_events.202.a:0 "万岁！万岁！我们带来解放的欢呼！"
 bpm_acw_events.203.t:0 "中止人身保护令的命令"
 bpm_acw_events.203.d:0 "混乱与叛乱不仅遍布叛乱各州，也蔓延至通往首都的中大西洋港口和铁路沿线。叛徒们威胁要阻止我们政府所在地获得增援，并拖延国会的召集。为补救此局，我们可以在关键地区中止人身保护令，以保障政府的安全。这将是极具争议的举动，不太可能获得立法或司法机构的批准。然而，执行这样一项命令也将强化我们的警务权力，从而赋予我们在叛乱被镇压后采取更大步骤重聚联邦的能力。"
 bpm_acw_events.203.f:0 ""你们正从事镇压一场违反合众国法律的叛乱。如果在费城与华盛顿市之间现在或将要使用的任何军事防线沿线或其附近，你们发现有必要为公共安全而中止人身保护令的抵抗，你们本人，或通过抵抗发生地点的指挥官，均被授权中止该令状。"\n\n—亚伯拉罕·林肯，1861年"
 bpm_acw_events.203.a:0 "未经立法批准，我们不能迈出这一步。"
 bpm_acw_events.203.b:0 "他们会叫我暴君，但这是捍卫民主的命令。下达命令！"
 bpm_acw_events.204.t:0 "法定货币法"
 bpm_acw_events.204.d:0 "为筹措这场战争的经费，国会先是授权印制可兑换黄金的即期票据，因此其价值依赖我们的硬币储备。随着战争进入第二年，显然我们无法继续以金属本位为这场冲突提供资金。同情我们事业的企业家因此建议发行纸币。此举将令拥有丰富黄金储备的西部各州不满，但我们需要继续向供应商和士兵付款才能赢得这场战争。"
 bpm_acw_events.204.f:0 ""如果你要在绿背纸币上印一句格言，我会建议印彼得与保罗的那句：'金银我都没有，只把我所有的给你。'"\n\n—亚伯拉罕·林肯，1862年"
 bpm_acw_events.204.a:0 "我们将启动一个试点计划，但不会重蹈大陆币的覆辙。"
 bpm_acw_events.204.b:0 "我们将鼓励国会通过法案，授权大规模印制这种法定货币。"
 bpm_acw_events.205.t:0 "征兵法案"
 bpm_acw_events.205.d:0 "随着这场该死的战争持续，我们对新兵的需求越来越大。以前我们还能依靠国民的爱国热情充实民兵，但战争倦怠已耗尽了我们的兵源，对种植园贵族的猜疑又使小农不愿参军。为了联邦，现在或许有必要实施普遍的男性征兵。这必将激起辉格党中主和派系以及穷人的愤怒——穷人会认为对富人的豁免是不公正的。但若想尽快结束这场战争，我们就需要更多的战士，无论其来自何方。"
 bpm_acw_events.205.f:0 ""一次只应付一场叛乱，大概是我们能方便处理的上限了。"\n\n—亚伯拉罕·林肯，1863年"
 bpm_acw_events.205.a:0 "我们要像开国元勋们作战那样作战。不实施征兵。"
 bpm_acw_events.205.b:0 "每个人都必须尽责，哪怕有些人会替别人尽责。让国会通过征兵法案。"
 bpm_acw_events.206.t:0 "十字路口"
 bpm_acw_events.206.d1:0 "随着我们的国家走向其存在的十字路口，国家融合党亦如此。我们在立法和副总统人选上的激进决定，不仅导致战争辉格党人抛弃了我们，还使斯蒂芬·F·道格拉斯的年轻美国人派与和平辉格党人联合起来。这将是一个残酷的选举季，一个我们不太可能获胜的选举季。祝你好运，总统先生。"
 bpm_acw_events.206.d2:0 "随着我们的国家走向其存在的十字路口，国家融合党亦如此。我们在立法和副总统人选上颇具争议的决定，使战争辉格党人未能加入我方阵营，他们与其暗中通敌的兄弟们和解了。这场选举会很艰难，总统先生，但只要我们努力竞选，仍可获胜。只是别让它分散你对战争的注意力。"
 bpm_acw_events.206.d3:0 "随着我们的国家走向其存在的十字路口，国家融合党亦如此。经过艰辛努力，我们成功团结了战争辉格党人、年轻美国人派和火食者的联盟。此外，新的缺席投票制度将保证士兵在这场重大抉择中拥有发言权。只要不犯重大错误，这场选举正朝着您的胜利迈进，总统先生。"
 bpm_acw_events.206.d4:0 "随着我们的国家走向其存在的十字路口，国家融合党亦如此。凭借妥协与决心，你驾驶着国家之舟穿越了它最严峻的考验。各派系的民主党人和辉格党人纷纷涌向国家融合的旗帜，甚至有人预言你将赢得每一张选举人票。如此成就，唯有华盛顿可以比肩，实无愧于你卓越的作为，总统先生。"
 bpm_acw_events.206.f:0 ""毋宁说，是我们这些活着的人，应当在此献身于那些在此战斗过的人们迄今如此崇高推进的未竟事业；毋宁说，我们应当在此献身于仍待我们完成的大业——从这些光荣的死者身上汲取更大的献身精神，去完成他们为之献出最后全部忠诚的事业——我们在此庄严立志，这些死者绝不至于白白牺牲——这个国家，在上帝的庇佑下，将迎来自由的新生——而这个民有、民治、民享的政府，绝不会从地球上消亡。"，1863年"
 bpm_acw_events.206.a:0 "过河途中别换马！"
 bpm_acw_events.207.t1:0 "和平辉格党人获胜"
 bpm_acw_events.207.t2:0 "民主党人获胜"
 bpm_acw_events.207.d1:0 "尽管我们尽了最大努力，我们还是输了选举。随着我们的失败，联邦的梦想也随之破灭——因为无论对手的竞选承诺如何，辉格党中的和平派势必会在和谈中寻求最省事的出路。如今我们只能哀悼那些白白牺牲的死者，他们被南北双方的同胞所背叛。"
 bpm_acw_events.207.d2:0 "历经艰难困苦，我们变得更强。和平辉格党人已被击败，我们身后不仅有击败废奴主义者的授权，还有为国家荣耀开启伟大征战的使命。不久，我们将铸造一个伟大的黄金圈，在其中建立我们的人间天国。"
 bpm_acw_events.207.f:0 ""选举是必需的。没有选举，就没有自由政府；如果叛乱能迫使我们放弃或推迟一次全国选举，那它倒真可以宣称已经征服并毁掉了我们。"\n\n—亚伯拉罕·林肯，1864年"
 bpm_acw_events.207.a:0 "我们辜负了开国元勋，也辱没了我们的国家。"
 bpm_acw_events.207.b:0 "山巅之城"
 bpm_acw_events.208.t:0 "大妥协"
 bpm_acw_events.208.d:0 "随着我们对煽动者和种族叛徒的胜利已成定局，我们召开了第二次制宪会议。在我们副总统的主持下，代表们将奴隶制写入宪法，从此万世不易。谈话如今转向起草一份大妥协，一份将北方与南方永久绑定的妥协。经过诸多承诺与威胁，北方代表初步同意了修改后的宪法。如今剩下的，就是铲除布朗军队的残余，转而南下，去争取我们应得的阳光之地！"
 bpm_acw_events.208.f:0 ""挑起白人的重担——\n派出你最优的子孙——\n把你的儿子们送去流放\n去服侍你俘虏的需要；\n套上沉重的轭具\n去驱策那惶恐而野性的人群——\n你那新俘获的、阴郁的族类，\n一半是魔鬼，一半是孩童。"\n\n—拉迪亚德·吉卜林，1899年"
 bpm_acw_events.208.a:0 "这世界任由我们索取。"
 bpm_acw_events.209.t:0 "汉普顿路会议"
 bpm_acw_events.209.d:0 "新任总司令从汉普顿路和平会议带回了一份和平条约。正如我们所料，他们在文件的每一个方面都作了让步，承诺不追捕逃奴、完全撤出分离各州，并承认自由州。"
 bpm_acw_events.209.f:0 ""至于和平，我此前说过，现在重申，有三件事不可或缺。\n\n一、在全国所有州恢复国家权威。\n\n二、合众国行政机构在奴隶制问题上，不得从最近的国会年度咨文及此前的文件中所持立场上退缩。\n\n三、在战争结束、所有与政府为敌的武装解散之前，不得停止敌对行动。"\n\n—亚伯拉罕·林肯，1865年"
 bpm_acw_events.209.a:0 "最后一柄匕首刺入了它的刀刃。"
 bpm_csa_crossroads_neg.1.tt:0 "国家团结强度将减少10%"
 bpm_csa_crossroads_neg.3.tt:0 "国家团结强度将减少30%"
 bpm_csa_crossroads_pos.1.tt:0 "国家团结强度将增加10%"
 bpm_csa_crossroads_pos.2.tt:0 "国家团结强度将增加20%"
 bpm_csa_crossroads_pos.3.tt:0 "国家团结强度将增加30%"
 bpm_fsa_crossroads_neg.1.tt:0 "国家融合强度将减少10%"
 bpm_fsa_crossroads_pos.1.tt:0 "国家融合强度将增加10%"
 bpm_fsa_crossroads_neg.3.tt:0 "国家融合强度将减少30%"
 bpm_fsa_crossroads_pos.3.tt:0 "国家融合强度将增加30%"
 bpm_acw_events.301.t:0 "平民民兵法"
 bpm_acw_events.301.d:0 "《平民民兵法》将联邦对民防民兵的保护写入法律，尤其是南方自由民为自卫而组建的民兵。联邦政府还保留介入权，以防止州政府解散这些团体，并以南方强大的自由民局和司法部基础设施作为可能发生邦联势力回潮的预警灯塔。"
 bpm_acw_events.301.f:0 ""一把温彻斯特步枪应在每个黑人家庭中占有一席荣耀之地……当白人知道，每次他的非裔美国受害者丧命时，他自己也冒着同样大的丧命风险，他就会对非裔美国人的生命怀有更大的尊重。"\n\n—艾达·B·韦尔斯，1892年"
 bpm_acw_events.301.a:0 "我们让约翰·布朗感到自豪"
 bpm_acw_events.302.t1:0 "第十四修正案"
 bpm_acw_events.302.t2:0 "第十五修正案"
 bpm_acw_events.302.t3:0 "第十六修正案"
 bpm_acw_events.302.d:0 "虽然宪法确实允许在联邦层面制定禁止歧视的法律，但联邦是否有能力禁止私人行为者的歧视仍不确定，种族主义者已利用这一点推翻反歧视法律。为纠正此弊，数年前有人提出一项新宪法修正案，明确扩大商业条款的权力以允许此类反歧视法律。经过一番艰难斗争，在第十一个小时，共和党人得以聚集足够的政治资本通过该修正案。自由民无疑仍会面临非法歧视，但至少现在有了起诉的希望。"
 bpm_acw_events.302.f:0 ""它并不授权国会为规范私权而制定一套市政法典；而是授权在州法律和州官员（行政或司法）的行为颠覆修正案所规定的基本权利时，提供救济途径。"\n\n—约瑟夫·P·布拉德利，1883年"
 bpm_acw_events.302.a:0 "我们暂时确保了非洲人的平等"
 bpm_acw_events.303.t:0 "强制执行民权法"
 bpm_acw_events.303.d:0 "经过一番辩论，国会通过了《民权法》，赋予除不纳税印第安人以外的所有人公民身份，并保证所有此类个人在法律和契约中享有平等保护。然而，有些人担心联邦政府仍缺乏执行真正法律平等的实权。"
 bpm_acw_events.303.f:0 ""它规定了合众国公民在享有'公民权利与豁免'方面的平等。这些词是什么意思？难道是说，在一切民事、社会、政治事务中，所有公民不分种族或肤色都应平等？绝无可能作此解释……公民权利是那些与政府的建立、支持或管理无关的权利。"\n\n—詹姆斯·F·威尔逊，1866年"
 bpm_acw_events.303.a:0 "我们做得够了吗？"
 bpm_acw_events.304.t:0 "流浪法"
 bpm_acw_events.304.d:0 "从动产奴隶制中解放出来的数百万人，发现自己落入了一个仍渴望压制他们的政府的瞄准镜中。国会强行通过了一系列联邦流浪法，其反对者称之为"黑人法典"。除了流浪之外，这些法案还对自由民施加了严厉的旅行限制和对轻罪的惩罚，而他们甚至还算不上正式的公民。"
 bpm_acw_events.304.f:0 ""那些在很大程度上塑造和控制大众舆论的人……忙于颁布奴隶法典，并向其下属发布命令、要求执行，而这都是在州高级官员——州长及其他人——知情的情况下进行的。……这些法典不过是该州旧有的黑人法典，只是把'奴隶'一词删去，换成了'黑人'……"\n\n—托马斯·W·康韦，1866年"
 bpm_acw_events.304.a:0 "一种罪行被另一种罪行取代……"
 bpm_acw_events.305.t:0 "非洲迁徙法"
 bpm_acw_events.305.d:0 "随着重建彻底崩溃，一股反动浪潮冲击了国会殿堂。联邦政府在总统同意下，推行了一项将自由民驱逐到利比里亚共和国的激进计划。这引发了大规模暴力，军队残酷地围捕自由民并将其驱赶至各港口。激进派和黑人活动家义愤填膺，正竭尽全力抵制这项法案。"
 bpm_acw_events.305.f:0 "你是人吗？那你就该有一颗人心……当你把那些痛苦的生灵塞进船舱，或把他们可怜的残缺尸体抛入大海时，你就没有丝毫怜悯吗？难道没有一滴泪水从你眼中滴落，没有一声叹息从你胸中逸出吗？你现在就没有丝毫怜悯吗？如果没有，你就必须继续下去，直到你的罪孽满盈。那时，伟大的上帝将处置你，如同你曾处置他们一样，并向你索要他们的全部鲜血。到那一天，所多玛和蛾摩拉所承受的，也比你所承受的更可忍受！\n\n—约翰·卫斯理，1774年"
 bpm_acw_events.305.a:0 "我们将因自己的罪孽而永远受诅咒"
 bpm_acw_events.306.t:0 "第二次禁言规则"
 bpm_acw_events.306.d:0 "解放已完全停滞，大量黑人民众被带回非正式的奴隶制和契约劳役中。国会新颁布了一项禁言规则，禁止进一步讨论扩大民权。"
 bpm_acw_events.306.f:0 "一想到奴隶制可能在这个国家造成的灾祸，我就不寒而栗。如果我描述我的预想，你会以为我疯了……\n\n—约翰·亚当斯，1820年"
 bpm_acw_events.306.a:0 "你为自己感到骄傲吗？"
 bpm_acw_events.307.t1:0 "第十三修正案"
 bpm_acw_events.307.t2:0 "第十四修正案"
 bpm_acw_events.307.t3:0 "第十五修正案"
 bpm_acw_events.307.d:0 "自解放以来，自由民在某种意义上一直处于悬而未决的状态。他们不再是奴隶，却也不是共和国的公民。这使许多州政府得以在没有法律救济的情况下侵犯他们的公民自由。这项宪法修正案赋予所有在美国出生或归化者以公民身份，在联邦层面禁止侵犯其基本宪法权利。"
 bpm_acw_events.307.f:0 ""无论何种法律惩罚白人犯罪，都应完全以同样方式和程度惩罚黑人。无论何种法律保护白人，都应对黑人提供'平等'保护。无论何种救济手段提供给一人，都应提供给所有人。"\n\n—撒迪厄斯·史蒂文斯，1866年"
 bpm_acw_events.307.a:0 "为了生命与自由！"
 bpm_acw_events.308.t:0 "自由民局法律部门扩充"
 bpm_acw_events.308.d:0 "总统赋予了自由民局新的实权，大幅扩充其人员和经费，以起诉更多捍卫南方民权的案件。该局越来越像是联邦政府的一个常设机构。"
 bpm_acw_events.308.f:0 "自由民被赶出自己的土地，结婚证被非法吊销，私刑无人追究。该局手头的案件似乎无穷无尽，但其雇佣的明智官僚仍满怀热忱地坚持着……"
 bpm_acw_events.308.a:0 "正义之剑延展其锋芒。"
 bpm_acw_events.309.t:0 "三K党法"
 bpm_acw_events.309.d:0 "今天，三K党——一个南方白人至上主义团体——被一项国会法案宣布为煽动叛乱者及合众国之敌。该宣布不仅责成军队，也责成地方执法机构解散三K党分部并逮捕其头目。"
 bpm_acw_events.309.f:0 "在自由民局特工的协助下，军队单位将花费数月时间开展一项铲除阿肯色州三K党据点的行动。最大的困难不在于被剥夺财产的种植园主，而在于该地区的普通白人，他们一次又一次地拒绝交出当地分部的成员身份和据点……"
 bpm_acw_events.309.a:0 "恐怖的面孔被揭开。"
 bpm_acw_events.310.t:0 "铁甲誓言"
 bpm_acw_events.310.d:0 "作为一项旨在阻止煽动叛乱的南方人担任公职的措施，当选甚至非当选的州政府人员都被要求宣誓效忠联邦，此外还要求选民宣誓遵守废除奴隶制。"
 bpm_acw_events.310.f:0 "本人庄严宣誓，自从成为合众国公民以来，从未自愿拿起武器反对合众国；从未自愿向从事武装敌对行动的人提供任何援助、支持、建议或鼓励；从未在敌视合众国的任何权威或伪权威之下，寻求、接受或试图行使任何职务的职能……"
 bpm_acw_events.310.a:0 "上帝助我。"
 bpm_acw_events.311.t:0 "司法部"
 bpm_acw_events.311.d:0 "虽然司法部长一职自共和国早期就已存在，但他们及联邦政府雇佣的其他律师一直是兼职且缺乏协调的。总统如今签署了一项法案，将司法部长办公室扩编为常设的司法部，有权协调联邦绝大多数法律调查。"
 bpm_acw_events.311.f:0 ""我将支持和捍卫合众国宪法，抵御一切敌人，无论国外的还是国内的；我将对其保持真正的信仰和忠诚；我自愿承担此义务，没有任何内心保留或逃避之意；我将忠实、尽职地履行我将就任的职务。上帝助我。""
 bpm_acw_events.311.a:0 "为正义女神而追寻"
 bpm_acw_events.312.t1:0 "第十三修正案"
 bpm_acw_events.312.t2:0 "第十四修正案"
 bpm_acw_events.312.t3:0 "第十五修正案"
 bpm_acw_events.312.d:0 "联邦废除奴隶制一直依赖总统法令，而这项修正案的通过与批准在全国范围内禁止奴隶制和强迫劳役——作为犯罪惩罚的强迫劳动除外……"
 bpm_acw_events.312.f:0 ""奴隶制是罪恶，任何理智、诚实的人都不会否认。它自这个国家诞生至今，一直是它最大的诅咒。如今，叛乱中的各州给了忠诚各州一个机会，去摘除这个诅咒、抹去这污秽的斑点。我说，就让它实现吧。"\n\n—埃本·C·英格索尔，1864年"
 bpm_acw_events.312.a:0 "特殊制度终告灭亡"
 bpm_acw_events.313.t:0 "南方宅地法"
 bpm_acw_events.313.d:0 "在内战过程中，我们许多英俊的将领为加速结束冲突而在法律上有所变通。其中一项变通就是承诺将种植园主的土地重新分配给土地的耕种者——南方自由民。通过一部精心起草的法律，允许行政分支以没收财产惩罚与煽动叛乱有关联者，我们实际上为司法部长和自由民局兑现这一承诺创造了途径。"
 bpm_acw_events.313.f:0 ""每当三个体面的黑人户主希望定居在土地上，并在上述划定的范围内选定一个岛屿或明确界定的地点，定居与种植园督察将亲自或通过其可能指定的下属官员，向他们颁发定居该岛屿或地区的许可证，并尽其所能提供援助，使其能够建立和平的农业定居点。"\n\n—威廉·T·谢尔曼，1865年。"
 bpm_acw_events.313.a:0 "他的灵魂仍在前进！"
 bpm_acw_events.314.t1:0 "第十三修正案"
 bpm_acw_events.314.t2:0 "第十四修正案"
 bpm_acw_events.314.t3:0 "第十五修正案"
 bpm_acw_events.314.d:0 "近年来，南方的种族主义暴君们开始制定最阴险的法律，以自由民的肤色和过去的奴役身份为由，企图剥夺他们的投票权。国会和各州始终警惕，通过了一项新修正案，禁止这些令人发指的做法，并保证自由民的投票权。"
 bpm_acw_events.314.f:0 ""合众国公民的投票权，不得因种族、肤色或以前的奴役状态而被合众国或任何州剥夺或削减。"\n\n—第十五修正案，1870年"
 bpm_acw_events.314.a:0 "他的灵魂仍在前进！"
 bpm_acw_events.315.t:0 "自由民局教育部门扩充"
 bpm_acw_events.315.d:0 "自由民局旨在帮助自由民全面融入我们的联邦，政府为其设定了新的宏大目标。为终结南方文盲泛滥的祸害，一项大规模教育计划已经启动。实用工业技能是重点，但尽管该局的目标以劳工为中心，这些政策也为未来的黑人知识分子奠定了基础。"
 bpm_acw_events.315.f:0 ""自由民局最大的成功，在于在黑人间建立了免费学校，以及在南方所有阶级中推广免费初等教育的理念。"\n\n—W·E·B·杜波依斯，1903年"
 bpm_acw_events.315.a:0 "他的灵魂仍在前进！"
 bpm_acw_events.316.t:0 "自由而无权利"
 bpm_acw_events.316.d:0 "虽然名义上是自由的，但所谓的自由民可能并不知道自己是自由的。围绕非裔美国人法律权利的不确定性，使得对自由民的系统性剥削和歧视得以延续。这样的不公正难道可以被忽视吗？"
 bpm_acw_events.316.f:0 "你承诺给我们选票，然后对我们唱起《我们终将胜利》"\n\n—伦·钱德勒，1965年"
 bpm_acw_events.316.a:0 "严厉打击这种歧视，并解雇那些责任人！"
 bpm_acw_events.316.b:0 "白人本无义务尊重黑人的任何权利，的确……"
 bpm_acw_events.317.t:0 "囚犯租赁"
 bpm_acw_events.317.d:0 "南方经济长期依赖奴隶劳动，这使自由民获得自由时引发了大量经济混乱。在这场混乱中，南方的矿主似乎与地方官员合谋，以莫须有的罪名监禁自由民，然后将他们出租给采矿作业，以维持低利润率、高利润。这样的不公正难道可以被忽视吗？"
 bpm_acw_events.317.f:0 ""你们合谋让我们在田间和贫民窟里保持沉默。"\n\n—伦·钱德勒"
 bpm_acw_events.317.a:0 "动用自由民局展开调查，这种新奴隶制必须终结！"
 bpm_acw_events.317.b:0 "从田间的死亡到矿坑的死亡，与其说是革命，不如说是平移……"
 bpm_acw_events.318.t:0 "邦联恐怖主义"
 bpm_acw_events.318.d:0 "虽然在重建进行期间，理想的做法是将所有邦联士兵都关押起来，但南方的真实状况远非完美。许多邦联军队的老兵，包括一些将军，组成了武装组织，恐吓自由民使之屈服。这样的不公正难道可以被忽视吗？"
 bpm_acw_events.318.f:0 ""你把橄榄枝弯成一张弓，然后微笑着，用它串起你一直藏着的私刑绳"\n\n—伦·钱德勒，1965年"
 bpm_acw_events.318.a:0 "这些叛乱分子必须被铲除！部署军队粉碎一切叛徒游击队，保护自由民"
 bpm_acw_events.318.b:0 "如果法律无法执行，那通过法律又有何意义？"
 bpm_acw_events.319.t:0 "邦联政变"
 bpm_acw_events.319.d:0 "内战结束时，许多邦联政客都希望，他们曾在前一场选举的混乱中向华盛顿进军、政变推翻联邦政府。看来反动势力已经把这一教训记在了心上，并利用当地的同情者暴力推翻了南方一个州的合法政府。这样的不公正难道可以被忽视吗？"
 bpm_acw_events.319.f:0 ""在强盗横行的野蛮世界里，极端的反而是你们。你们从不摘下耳罩，也从不倾听我们的呐喊"\n\n—伦·钱德勒，1965年"
 bpm_acw_events.319.a:0 "火速介入，借助忠诚的当地人恢复合法政府！"
 bpm_acw_events.319.b:0 "自由在非洲裔的鲜血与铅弹的浪潮中消逝……"
 bpm_acw_events.320.t:0 "邦联法律战"
 bpm_acw_events.320.d:0 "内战既在战场上打，也在法庭上打。殉难的解放者因其解放行动而被斥为暴君，在作出结束战争所必需的决定时处处受阻。如今，邦联同情者似乎已开始对重建施展同样的司法战战术。这样的不公正难道可以被忽视吗？"
 bpm_acw_events.320.f:0 ""你们的监狱里塞满了黑人，你们的法庭因仇恨而发白，而每一次争取自由的呼声，都有人对我们低语：等等"\n\n—伦·钱德勒，1965年"
 bpm_acw_events.320.a:0 "指示司法部长调动其部门的全部力量对付这些邦联同情者"
 bpm_acw_events.320.b:0 "人手太少、案件太多，错误在所难免……"
 bpm_acw_events.321.t:0 "新奴隶制"
 bpm_acw_events.321.d:0 "邦联政府投降时，你知道种植园主做的第一件事是什么吗？他们以暴力胁迫，逼迫自由民签署非法契约，把自己的身体捆绑给种植园主。每一天，都有奴隶主犯下最恶劣罪行的新案例。这样的不公正难道可以被忽视吗？"
 bpm_acw_events.321.f:0 ""但约翰·布朗知道自由是什么，他为此而死，为我们赢得了一些自由"\n\n—伦·钱德勒，1965年"
 bpm_acw_events.321.a:0 "惩罚责任人，补偿受害者。然后开始下一项调查"
 bpm_acw_events.321.b:0 "虽然我们谴责这种做法，但严格来说它并不违反现行法律，暂时如此……"
 bpm_acw_events.322.t:0 "重建派夺取委员会控制权"
 bpm_acw_events.322.d:0 "对重建进展的迟缓感到不满，激进共和党人得以夺取了较温和盟友所持有的全部剩余委员会控制职位。这预示着重建方式的更激进转向，一些人已经开始呼吁弹劾总统或最高法院大法官。"
 bpm_acw_events.322.f:0 "\[史蒂文斯\]即将成为美国历史上（可能有一个例外）最有权势的独裁式政党和国会领袖，并以纯粹的意志力将其革命理论强加于这个国家。"\n\n—克劳德·鲍尔斯（种族主义者），1929年"
 bpm_acw_events.322.a:0 "民主武器库中的新武器"
 bpm_acw_events.323.t:0 "黑色星期五"
 bpm_acw_events.323.d:0 "虽然共和党中坚定的激进派在捍卫自由民方面毫不妥协，但他们和任何人一样容易上当受骗。若非几位行政分支官员的机智，一些骗子本会完全垄断黄金市场，并操纵我国中止其近期的通胀政策。然而，这些骗子如今把矛头指向行政分支，编造出更大阴谋的故事。更糟的是，金价波动已引发多起银行挤兑，所有这些都给了对重建持怀疑态度的自由派共和党人充足的弹药来攻击我们的政策。"
 bpm_acw_events.323.f:0 ""你可以以我的名义声明，我认为杰伊·古尔德先生是个该死的恶棍。"\n\n—科尼利厄斯·范德比尔特，1872年"
 bpm_acw_events.323.a:0 "大萧条或许得以避免，但这桩丑闻将困扰我们的重建努力"
 bpm_acw_events.324.t:0 "自由共和党人反叛！"
 bpm_acw_events.324.d:0 "无论是腐败的流言、重建的代价，还是单纯的对权力的欲望，自由共和党人抛弃了老大党。他们组建了一个新政党，毫无创意地命名为自由共和党，并迅速与民主党人结成融合竞选安排。虽然这次分裂对重建构成威胁，但尚不清楚它能持续多久。"
 bpm_acw_events.324.f:0 ""我们南北双方的广大同胞，都渴望跨越那条长久分裂他们的血腥鸿沟，握手言和。"\n\n—霍勒斯·格里利（傻瓜），1872年"
 bpm_acw_events.324.a:0 "他们难道看不出，要实现真正的平等，这些政策是必要的吗？"
 bpm_acw_events.325.t:0 "革命的窒息"
 bpm_acw_events.325.d:0 "黄金帮所威胁的，铁路阴谋实现了。铁路阴谋原本签约修建边疆与东海岸之间的铁路，却向联邦政府收取两倍于建造成本的费用，同时贿赂立法者以维持资金流动。如今丑闻爆发，股市陷入混乱，许多估值过高的铁路公司倒闭，大批国会议员被牵连。至少自由共和党人终于放弃了他们自己的党，回到了党内？"
 bpm_acw_events.325.f:0 ""这个动产信贷公司到底是什么，似乎与这些铁路公司价值一亿八千万美元股本的神秘失踪一样扑朔迷离。"\n\n—小查尔斯·弗朗西斯·亚当斯，1869年"
 bpm_acw_events.325.a:0 "随着这场危机，我们漫长的全国性大萧条开始了"
 bpm_acw_events.326.t:0 "自由白银的兴起"
 bpm_acw_events.326.d:0 "在围绕政府腐败的辩论日益激烈之际，一场新的政治运动开始成形。自由白银派主张通过回归一种故意高估白银的复本位制来有意加速通胀。这一提议不仅能扩大边疆的货币供应，使那里的商业和生活更加便利，还能使我国众多贫困农民和工人的债务贬值。虽然目前只是少数民粹主义者的异端立场，但或许这个想法有朝一日能形成一场真正的运动。"
 bpm_acw_events.326.f:0 ""你们不得将人类钉死在黄金的十字架上。"\n\n—威廉·詹宁斯·布赖恩，1896年"
 bpm_acw_events.326.a:0 "这样的提议真能解决这场漫长的萧条吗？"
 bpm_acw_events.327.t:0 "挥舞血衫"
 bpm_acw_events.327.d:0 "随着国家进入又一次竞选活动，共和党人必须再次向自己提出血衫的问题。每个人都认识在内战中死去的人，他们的生活被叛徒的傲慢与骄傲永远改变。如果共和党人以奖励忠诚士兵、惩罚邦联分子、谴责民主党人叛国同情的论调来竞选，他们或许能维持自己的选举地位。然而，这一策略不仅使内战的伤口无法愈合，也使自由共和党人的内心深感不安。老大党将采取何种策略？"
 bpm_acw_events.327.f:0 ""三K党带走了我的宝贝\n他们把她带走了\n离开了我"\n—乔伊·雷蒙，1981年"
 bpm_acw_events.327.a:0 "我们尽量少进行这种竞选宣传，以免让选民疲惫"
 bpm_acw_events.327.b:0 "你真要把白宫的钥匙交给杀死你兄弟的人吗？"
 bpm_acw_events.328.t:0 "管理老大党"
 bpm_acw_events.328.d:0 "在老大党内部，有一场无声的较量。不是自由派与激进派之间——不，因为他们的支持者几乎没有重叠。而是激进派与殉难解放者的追随者之间，为争夺这位已故领袖的遗产而决斗。激进派曾是殉难者的敌人，他们寻求一场彻底的重建，不仅要与南方和解，还要重建它。相比之下，殉难者的追随者则固执地坚持解放者在任期间的作为：他对邦联分子的温和态度，他对最激进提议的沉默，甚至他否决严厉的重建法律。"
 bpm_acw_events.328.f:0 ""如果我曾如此代表富人、有权势者、智者、所谓的大人物，或他们任何朋友的利益而干涉……并为此忍受和牺牲了我所忍受和牺牲的一切，那倒还说得过去；这个法庭上的每一个人都会认为这是值得奖赏而非惩罚的行为。"\n\n—约翰·布朗，1859年"
 bpm_acw_events.328.a:0 "站在殉难者追随者一边，我们不能过度强加人民的意志"
 bpm_acw_events.328.b:0 "在解放者之前，还有另一位为使人成圣而死的殉难者。我效仿他的榜样"
 bpm_acw_events.329.t:0 "弹劾问题"
 bpm_acw_events.329.d:0 "尽管重建努力在[ROOT.GetCountry.GetRuler.GetLastName]总统领导下继续进行，激进重建派对[ROOT.GetCountry.GetRuler.GetHerHis]政府却几乎没有信心。不满的共和党人以行政拖延为由，启动了弹劾现任总统的程序。虽然该程序已在众议院通过，但尚不清楚能否在参议院也获得通过。"
 bpm_acw_events.329.f:0 ""我告诉你们我做了什么？我呼吁你们那个正企图瓦解政府的国会。总之，除了那个国会费尽心机在选民中抹黑他之外，国会又做了什么？他们做了什么来恢复各州的联合吗？没有。相反，他们做尽一切来阻止它：因为他仍坚守着叛乱爆发时他所处的立场，他就被斥为叛徒。谁比他冒过更大的风险、作出过更大的牺牲？但国会，拉帮结派、专横跋扈，却企图毒害美国人民的思想。"\n\n—安德鲁·约翰逊，1868年"
 bpm_acw_events.329.a:0 "现在弹劾并非明智之举"
 bpm_acw_events.329.b:0 "弹劾这个混蛋！"
 bpm_acw_events.330.t:0 "法院与占领之间的墙"
 bpm_acw_events.330.d:0 "内战结束后，许多邦联同情者被监禁。共和党人担心最高法院会释放这些囚犯，于是通过了一项法案，限制法院对人身保护令案件的管辖权。司法机构已经退让，但一些共和党人建议更进一步，完全剥夺最高法院的上诉管辖权，这将使该机构仅限于州际、宪法和外交事务。"
 bpm_acw_events.330.f:0 ""律师似乎以为，如果该废除法案生效，法院在人身保护令案件中的全部上诉权就会被剥夺。但这是一个错误。"\n\n—萨蒙·P·蔡斯，1869年"
 bpm_acw_events.330.a:0 "法院已经吸取了教训，我们将走高尚之路"
 bpm_acw_events.330.b:0 "我们不能让占领受到挑战，剪断他们的翅膀！"
 bpm_acw_events.331.t:0 "巩固立法权威"
 bpm_acw_events.331.d:0 "为进一步加强立法权威，共和党人通过了一系列有关解职行为的法律。有了这些法律，总统未经事先咨询国会而解雇政府官员的行为被定为"重罪"。这实际上掏空了行政独立性，但司法机构仍能制衡立法分支。"
 bpm_acw_events.331.f:0 ""看来，我们有了两位战争部长，一位是依法产生，一位是篡权而来"\n\n—本杰明·F·巴特勒，1868年"
 bpm_acw_events.331.a:0 "终于，如开国元勋所愿"
 bpm_acw_events.332.t:0 "一权独大"
 bpm_acw_events.332.d:0 "在制服行政分支之后，立法分支将目光投向了司法。共和党主导的国会不仅弹劾了最高法院中所有内战前的大法官，还弹劾了殉难解放者任命的所有大法官。这既剥夺了最高法院的政治独立性，也移除了对国会权力仅存的制度性限制，实际上把美国变成了一个议会制共和国。"
 bpm_acw_events.332.f:0 ""反对这一计划的人试图通过叫嚷我要'塞满'最高法院、将开创一个恶劣先例来煽动偏见和恐惧。"\n\n—富兰克林·D·罗斯福，1937年"
 bpm_acw_events.332.a:0 "如果他们想保住职位，就不该反对我们"
 bpm_acw_events.333.t:0 "公立学校修正案"
 bpm_acw_events.333.d:0 "一项新的宪法修正案开始在共和党人中流传。这项修正案将削减向宗教机构分配任何公共资金的额度。在纸面上，这项修正案只是维护政教分离。在实践中，它将尤其影响天主教学校，恰好按宗教界限分裂了民主党的支持基础。然而，对天主教徒不成比例的影响并未逃过他们的眼睛，这可能使批准该修正案在他们中间成为有争议的举动。"
 bpm_acw_events.333.f:0 ""任何州均不得制定有关建立宗教或禁止宗教自由活动的法律；任何州为支持公立学校而通过税收筹集的资金，或由此产生的任何公共资金，或用于此的任何公共土地，均不得处于任何宗教教派的控制之下；如此筹集的资金或如此划拨的土地，也不得在宗教教派或宗派之间分配。"\n\n—詹姆斯·G·布莱恩，1875年"
 bpm_acw_events.333.a:0 "我们真的必须堕落到这种地步吗？"
 bpm_acw_events.333.b:0 "妙极了的阴险……"
 bpm_acw_events.334.t:0 "民主党的两难"
 bpm_acw_events.334.d:0 "随着共和党人支持公立学校修正案，现在轮到民主党领导层决定本党是支持还是反对该修正案。支持会疏远本党的天主教支持基础，而反对则可能招致南方浸信会的反弹。无论如何，共和党的这一手似乎都成功了。"
 bpm_acw_events.334.f:0 ""任何州均不得制定有关建立宗教或禁止宗教自由活动的法律；任何州为支持公立学校而通过税收筹集的资金，或由此产生的任何公共资金，或用于此的任何公共土地，均不得处于任何宗教教派的控制之下；如此筹集的资金或如此划拨的土地，也不得在宗教教派或宗派之间分配。"\n\n—詹姆斯·G·布莱恩，1875年"
 bpm_acw_events.334.a:0 "我们需要天主教徒，反对该修正案"
 bpm_acw_events.334.b:0 "我们需要南方，反对该修正案"
 bpm_acw_events.335.t:0 "反弹"
 bpm_acw_events.335.d:0 "看来共和党的宪法图谋在选票箱前反噬了他们：温和派、自由派、宪政主义者及其他天真的傻瓜纷纷倒向民主党，而后者正把自己塑造成宪法的捍卫者。"
 bpm_acw_events.335.f:0 "为了平等而破坏我们的制度，值得吗？"
 bpm_acw_events.335.a:0 "值得"
 bpm_acw_events.336.t:0 "行政再度强硬"
 bpm_acw_events.336.d:0 "随着对首位总统被弹劾的记忆终于开始消退，行政分支终于在我国的官僚和外交中重新确立其关键作用。限制行政控制部长的法律已被废除，所有剩余的激进重建派都更专注于捍卫其社会改革，而非给总统套上缰绳。这或许是我们国家一个由行政主导的新时代的开端。"
 bpm_acw_events.336.f:0 ""单人总统制，在合适的人担任总统时，自有其用处；而历史上美国人选对人选的次数与选错的次数大致相当。"\n\n—小阿瑟·M·施莱辛格，1973年"
 bpm_acw_events.336.a:0 "我猜，回到常态了……"
 bpm_rec_307.tt:0 "公民身份得到保障，至少非裔美国人将在法律体系内有一些追索途径"
 bpm_rec_308.tt:0 "法律部门得到加强，自由民局如今将尽最大努力捍卫非裔美国人"
 bpm_rec_309.tt:0 "安全得到保护，也许非裔美国人终于能够安全地积累财富"
 bpm_rec_310.tt:0 "随着邦联分子被清除出州政府，内部政变的威胁终于下降"
 bpm_rec_311.tt:0 "随着司法部的建立，我们的政府终于能够组织反法律战运动"
 bpm_rec_312.tt:0 "你以为拔出匕首就足以愈合伤口吗？这还不够"
 bpm_rec_313.tt:0 "随着土地的大规模重新分配，也许非裔美国人将达到所有美国人享有的繁荣"
 bpm_rec_314.tt:0 "投票权如今受到宪法保护，这无疑是非裔美国人被剥夺选举权历史的终结"
 bpm_rec_315.tt:0 "教育部门得到扩充，自由民局如今可以开始大规模扫盲运动这一宏伟任务"
 bpm_rec_322.tt:0 "你现在将能够扭曲美国宪法的制度规则，以加速改革速度。但要小心，你操纵国家制度越多，国内和国外的官僚体系愈合所需的时间就越长"
 bpm_rec_323.tt:0 "灾难勉强得以避免，但经济显然过度暴露于投机之中。我们必须加快步伐，以免又一场危机摧毁任何改革动力"
 bpm_rec_324.tt:0 "联盟开始瓦解，如果你还没有，考虑利用制度损害按钮"
 bpm_rec_325.tt:0 "国会如今陷入瘫痪，试图避免一场经济灾难。南方改革的政治意愿几乎熄灭，但或许我们还能用些花招再挤出一项法案"
 bpm_rec_326.tt:0 "盯着这些人，我有种感觉，他们几年后会很关键……"
 bpm_rec_329.tt:0 "现任参议院临时议长，一位纸币和其他激进事业的拥护者，将成为总统。下次选举会有后果"
 bpm_rec_330.tt:0 "最高法院对拒绝人身保护令申请作出裁决的管辖权、南方占领的合法性得到了保证。下次选举会有后果"
 bpm_rec_333.tt:0 "这项法律将导致我国对天主教徒的更多歧视。作为交换，民主党很快将被迫要么谴责该法而得罪南方，要么支持该法而得罪天主教徒"
 bpm_rec_exhaust_13.tt:0 "#GBB 重建#! #GB 疲惫度#! 将减少3"
 bpm_rec_exhaust_16.tt:0 "#GBB 重建#! #GB 疲惫度#! 将减少6"
 bpm_rec_exhaust_03.tt:0 "#GBB 重建#! #GB 疲惫度#! 将增加3"
 bpm_rec_exhaust_06.tt:0 "#GBB 重建#! #GB 疲惫度#! 将增加6"
 bpm_rec_decreased_discipline.tt:0 "激进重建派将在共和党内失去权力"
 bpm_rec_increased_discipline.tt:0 "激进重建派将在共和党内获得权力"
 bpm_rec_constant_vigilance.tt:0 "在反抗压迫的斗争中，我们必须保持时刻警惕"
 bpm_acw_events.401.t:0 "行政再度强硬"
 bpm_acw_events.401.d:0 "随着对立法胁迫司法和行政的记忆终于开始消退，其他分支终于在我国的官僚和外交中重新确立其关键作用。限制最高法院管辖权的法律已被废除，少数激进重建派绝望地试图保住他们的委员会职位。这或许是我们国家一个由行政主导的新时代的开端。"
 bpm_acw_events.401.f:0 ""单人总统制，在合适的人担任总统时，自有其用处；而历史上美国人选对人选的次数与选错的次数大致相当。"\n\n—小阿瑟·M·施莱辛格，1973年"
 bpm_acw_events.401.a:0 "我猜，回到常态了……"
 bpm_acw_events.402.t:0 "文官制度法的通过"
 bpm_acw_events.402.d:0 "在坚定支持改革的总统和副总统的帮助下，《文官制度法》成功通过了腐朽的参议院，送到了总统的案头。随着法案的签署，杰克逊为将政府屈从于其民粹意志而建立的官职分赃制终于走上了改革之路。然而，随着法案条款的废除，北方多个政治机器骤然崩溃，如今缺乏可作贿赂分配的稳定职位。没有了机器支持，产业后备军忽然又涌入了成千上万寻求保障的饥饿移民。哦，改革的代价……"
 bpm_acw_events.402.f:0 ""战利品属于胜利者。"\n\n—威廉·L·马西，1832年"
 bpm_acw_events.402.a:0 "官职分赃制就此终结"
 bpm_acw_events.403.t:0 "又一场刺杀"
 bpm_acw_events.403.d:0 "殉难解放者的刺杀至少是为了重要的事。一位总统因一个疯狂狂徒对领事职位的争夺而被谋杀，这对实用主义者和理想主义者都造成了创伤。尽管代理总统本人是实用主义者，他已立即开始为《文官制度法》的通过而奔走，视官职分赃制为其前任遇害的根源。这场刺杀虽是悲剧，却使实业界和官僚体系团结在改革事业之后，将改革引发的混乱降至最低。"
 bpm_acw_events.403.f:0 ""战利品属于胜利者。"\n\n—威廉·L·马西，1832年"
 bpm_acw_events.403.a:0 "为一场领事职位的争夺竟至于此……"
 bpm_acw_events.404.t:0 "文官制度法的夭折"
 bpm_acw_events.404.d:0 "在坚决反对改革的总统和副总统的顽固抵抗下，《文官制度法》折戟沉沙，逐条否决、搁置否决和委员会拖延终于碾碎了理想主义者仍抱持的一切希望。这种对政府腐败的捍卫导致了商业信心的飙升，投资者们终于可以像上帝所愿的那样，安心地贿赂他们的代表以换取有利的合同。官职分赃制存续的一个副作用，是重整派运动的日益壮大。这些由贫穷白人领导的州级政党与共和党人结盟，主张联邦对社会和经济政策进行强力干预。真是一群令人费解的人……"
 bpm_acw_events.404.f:0 ""战利品属于胜利者。"\n\n—威廉·L·马西，1832年"
 bpm_acw_events.404.a:0 "改革不会如此轻易地在摇篮中被扼杀……"
 bpm_acw_events.405.t:0 "被逼到绝境"
 bpm_acw_events.405.d:0 "经过多年的辩论，官职分赃之争似乎达到了高潮。经过35轮失败的投票，政党领袖们正在烟雾缭绕的房间里开会，决定下一任候选人是谁。混血派会胜出，还是妥协将赢得这一天？"
 bpm_acw_events.405.f:0 ""如果接受任何局外人，我希望是加菲尔德。如果俄亥俄想要一个人，就让俄亥俄推出它最优秀的人。"\n\n—佚名，1880年"
 bpm_acw_events.405.a:0 "支持混血派，改革是责任！"
 bpm_acw_events.405.b:0 "我们难道就不能妥协一下吗？"
 bpm_acw_events.406.t:0 "被逼到绝境"
 bpm_acw_events.406.d:0 "经过多年的辩论，官职分赃之争似乎达到了高潮。经过35轮失败的投票，政党领袖们正在烟雾缭绕的房间里开会，决定下一任候选人是谁。忠坚派会胜出，还是妥协将赢得这一天？"
 bpm_acw_events.406.f:0 ""如果接受任何局外人，我希望是加菲尔德。如果俄亥俄想要一个人，就让俄亥俄推出它最优秀的人。"\n\n—佚名，1880年"
 bpm_acw_events.406.a:0 "支持忠坚派，实用主义是必需！"
 bpm_acw_events.406.b:0 "我们难道就不能妥协一下吗？"
 bpm_acw_events.407.t:0 "加冕继承人"
 bpm_acw_events.407.d:0 "随着重建名存实亡，显然党内需要新鲜血液。问题是，什么样的血液？一些人呼吁提名一位纯粹的候选人，未受重建期间掀起的腐败指控的玷污。另一些人则呼吁一位经验丰富、身经百战的政治家，他能牵动正确的线，确保改革继续（或不继续）推进。"
 bpm_acw_events.407.f:0 ""战利品属于胜利者。"\n\n—威廉·L·马西，1832年"
 bpm_acw_events.407.a:0 "改革势力赢得早期胜利"
 bpm_acw_events.407.b:0 "实用主义巧妙地驾驭丑闻，赢得代表大会胜利"
 bpm_acw_events.408.t:0 "港口之争"
 bpm_acw_events.408.d:0 "美国通过关税为政府提供资金，而这些关税几乎全部从纽约港征收。因此，纽约港税务司司长一职不仅赋予控制该职位的派系巨大的官僚影响力，还提供了一个可从中截留资金用于贿赂和竞选筹款的宝贵来源。围绕下一任税务司司长的任命之争正愈演愈烈，忠坚派占据上风，但混血派在道德高地上昂然挺立。"
 bpm_acw_events.408.f:0 ""战利品属于胜利者。"\n\n—威廉·L·马西，1832年"
 bpm_acw_events.408.a:0 "改革者在帝国州赢得一场爆冷胜利"
 bpm_acw_events.408.b:0 "委员会控制证明是一道难以逾越的障碍"
 bpm_acw_events.409.t:0 "单位规则"
 bpm_acw_events.409.d:0 "在全国代表大会上，长期以来习惯将一个州的所有代表都分配给一位候选人，以模仿大选中全有或全无的性质。这一制度极大地有利于实用主义者，他们只需贿赂一个州51%而非全部100%的代表即可赢得其代表席位。尽管改革这一规则需要代表大会多数，混血派已开始运作以迫使废除它。"
 bpm_acw_events.409.f:0 ""战利品属于胜利者。"\n\n—威廉·L·马西，1832年"
 bpm_acw_events.409.a:0 "改革者成功智取主席，阻止了单位规则"
 bpm_acw_events.409.b:0 "一场反叛运动被镇压，单位规则得以实施"
 bpm_acw_events.410.t:0 "一份"简单"的忠诚誓言"
 bpm_acw_events.410.d:0 "随着下次选举在全体共和党人心中迫近，忠诚问题成为一个重大关切。忠坚派担心，如果实用主义者在代表大会上获胜，最顽固的改革派会抛弃本党，因此开始推动制定忠诚誓言规则，规定所有代表必须宣誓效忠当选候选人才能参与投票。理想主义阵营中冉冉升起的新星刚刚发表了一篇激昂的演讲，谴责这一提议是暴政，并直接点名抨击那位头号实用主义者。"
 bpm_acw_events.410.f:0 ""战利品属于胜利者。"\n\n—威廉·L·马西，1832年"
 bpm_acw_events.410.a:0 "头号实用主义者尴尬地撤回了提案"
 bpm_acw_events.410.b:0 "权力政治压过了个人魅力，忠诚誓言得以确认"
 bpm_acw_events.411.t:0 "辞职计谋"
 bpm_acw_events.411.d:0 "虽然实用主义者在其权力位置上稳如泰山，但他们常被理想主义者指责缺乏民众支持。为反驳这些指责，头号实用主义者策划了一个计谋：他们将辞去参议员席位，然后立即被州议会重新任命，以此彰显其民众支持。"
 bpm_acw_events.411.f:0 ""战利品属于胜利者。"\n\n—威廉·L·马西，1832年"
 bpm_acw_events.411.a:0 "州议会受够了头号实用主义者的做派，没有重新任命他们"
 bpm_acw_events.411.b:0 "不出所料，头号实用主义者被迅速且大张旗鼓地重新任命"
 bpm_acw_events.412.t:0 "司法奇招"
 bpm_acw_events.412.d:0 "头号实用主义者的种种戏剧性表演：单位规则、忠诚誓言、辞职计谋，效果虽有争议，却极具破坏性。鉴于此，总统认为应当任命这位头号实用主义者进入最高法院。也许新职位所赋予的责任会让他们停止这些滑稽表演，或至少降低噪音？"
 bpm_acw_events.412.f:0 ""战利品属于胜利者。"\n\n—威廉·L·马西，1832年"
 bpm_acw_events.412.a:0 "头号实用主义者被拔除了獠牙，沦为九票中的一票"
 bpm_acw_events.412.b:0 "一只狐狸进了鸡窝，还带着它所有的老把戏"
 bpm_acw_events.501.t:0 "为三十块银币"
 bpm_acw_events.501.d:0 "在党的组织根基于东部遭到重创之后，人民党提前召开了一场由西部主导的代表大会，起草新纲领并筹划今年的竞选活动。令人数有限的南方党团大为震怒的是，融合派批准了一项新纲领，支持打入民主党内部，甚至允许州级支部自行解散以改善与民主党领导层的关系。在民主党代表大会上，杰克逊的党确实选出了一位复本位制的总统候选人，却为其搭配了一位大企业出身的副总统，这大大削弱了该竞选组合的民粹吸引力。"
 bpm_acw_events.501.f:0 ""你们不得把荆棘之冠强压在劳工的额头上。"\n\n—威廉·詹宁斯·布赖恩，1896年"
 bpm_acw_events.501.a:0 "于是团结就此消亡"
 bpm_acw_events.502.t:0 "被天选者抛弃"
 bpm_acw_events.502.d:0 "随着民主党代表大会选出一位复本位制的总统候选人，人民党全国代表大会被迫展开一场复杂的辩论。尽管遭到北方和进步派南方党团的抵制，一个由西部人和温和派南方人组成的联盟还是带领本党支持民主党候选人参选。这一妥协的关键，是决定另行支持一位进步派南方人出任副总统候选人。无论党内激进派抱有何种希望，这种对民主党的支持标志着独立民粹运动的死亡。"
 bpm_acw_events.502.f:0 ""你们不得把荆棘之冠强压在劳工的额头上。"\n\n—威廉·詹宁斯·布赖恩，1896年"
 bpm_acw_events.502.a:0 "于是团结就此消亡"
 bpm_acw_events.503.t:0 "父与子"
 bpm_acw_events.503.d:0 "人民党内部一直存在一场辩论：是在民主党之前召开代表大会（几乎肯定会产生独立竞选组合），还是在民主党之后召开（必然产生全国融合竞选组合），这场辩论得出了一个奇特的结论。人民党和民主党都决定在同一座城市召开各自的代表大会，并在这场双重代表大会上投票将两党合并为一个统一的"民主党-人民党"。虽然一些激进民粹主义者对这一妥协持怀疑态度，但选出民粹主义者任副总统、复本位民主党人任总统，已使许多激进活动家欢呼这一举措为决定性的胜利。"
 bpm_acw_events.503.f:0 ""你们不得把荆棘之冠强压在劳工的额头上。"\n\n—威廉·詹宁斯·布赖恩，1896年"
 bpm_acw_events.503.a:0 "于是团结就此消亡"
 bpm_acw_events.504.t:0 "主的荣光"
 bpm_acw_events.504.d:0 "激进民粹主义者取得了胜利！人民党全国代表大会不仅成功比民主党提前一周召开——尽管遭到温和派领袖的强烈抵制——而且确认了一份独立的总统候选人名单！此外，人民党选择进一步激进化其纲领，强调其政策诉求的不可分割性，并威胁开除任何妥协于这些目标的成员。"
 bpm_acw_events.504.f:0 ""你们不得把荆棘之冠强压在劳工的额头上。"\n\n—威廉·詹宁斯·布赖恩，1896年"
 bpm_acw_events.504.a:0 "团结永不消亡！"
 bpm_acw_events.505.t:0 "有人过度吝啬，终陷贫穷"
 bpm_acw_events.505.d:0 "尽管在东部取得了一些成功，主流政党还是成功地将民粹运动孤立于州长府邸和参议院之外。民粹主义者及其众议院盟友推动通过了几项小法案，但没有州或参议院的存在，民粹运动改革的希望已死并被埋葬。"
 bpm_acw_events.505.f:0 ""对任何人都不怀恶意，对所有人都心怀仁慈，在上帝让我们明辨是非的坚定信念下，让我们努力完成我们正在从事的事业，包扎国家的创伤"\n\n—亚伯拉罕·林肯，1865年"
 bpm_acw_events.505.a:0 "我们辜负了人民"
 bpm_acw_events.506.t:0 "有人慷慨施予，反而收获更多"
 bpm_acw_events.506.d:0 "随着民粹运动不仅夺取了多个州长职位和参议院席位，还在上次选举中赢得了多张选举人票，民主党开始窃取民粹主义的提案用于自己的竞选。虽然共和党人阻止了所有修宪企图，但多项全面法案已在参众两院通过，行政和司法机构正承受着允许其实施的压力。"
 bpm_acw_events.506.f:0 ""对任何人都不怀恶意，对所有人都心怀仁慈，在上帝让我们明辨是非的坚定信念下，让我们努力完成我们正在从事的事业，包扎国家的创伤"\n\n—亚伯拉罕·林肯，1865年"
 bpm_acw_events.506.a:0 "不算多，但或许够了？"
 bpm_acw_events.507.t:0 "施舍穷人，你将积财于天"
 bpm_acw_events.507.d:0 "如今共和党和民主党都未能在参众两院获得相对多数，两个主流政党都为争取民粹主义议员的支持展开了竞价。一项新的宪法修正案已由参众两院通过并送交各州，必获批准。虽然民粹主义者最大胆的梦想尚未实现，但即便最激进的活动家也能对自己的胜利感到满意。"
 bpm_acw_events.507.f:0 ""对任何人都不怀恶意，对所有人都心怀仁慈，在上帝让我们明辨是非的坚定信念下，让我们努力完成我们正在从事的事业，包扎国家的创伤"\n\n—亚伯拉罕·林肯，1865年"
 bpm_acw_events.507.a:0 "他们只给我们残羹剩饭，因为他们知道我们本可独享盛宴"
 bpm_acw_events.508.t:0 "凯撒的物当归给凯撒"
 bpm_acw_events.508.d:0 "出人意料的是，人民党成功地号召召开第二次制宪会议！无论即将到来的竞选活动结果如何，民粹主义者都已用血汗起草了一个新的、更完美的联邦，永久地在这个国家的灵魂上打上了印记。"
 bpm_acw_events.508.f:0 ""对任何人都不怀恶意，对所有人都心怀仁慈，在上帝让我们明辨是非的坚定信念下，让我们努力完成我们正在从事的事业，包扎国家的创伤"\n\n—亚伯拉罕·林肯，1865年"
 bpm_acw_events.508.a:0 "如今，在我们所建的伟大华盖的荫庇下安歇"
 bpm_acw_events.512.t:0 "行政再度强硬"
 bpm_acw_events.512.d:0 "在国会主导数十年后，总统终于重新夺回了对行政分支的控制权。在一项具有里程碑意义的最高法院案件中，首席大法官裁定总统对其内阁拥有支配权，尽管该裁定是否延伸至整个行政分支仍有疑问。虽然这一裁定遭到激进重建派的谴责，但这些老政治家已所剩无几，更不用说在我国政治中仍具影响力。这或许是我们国家一个由行政主导的新时代的开端。"
 bpm_acw_events.512.f:0 ""单人总统制，在合适的人担任总统时，自有其用处；而历史上美国人选对人选的次数与选错的次数大致相当。"\n\n—小阿瑟·M·施莱辛格，1973年"
 bpm_acw_events.512.a:0 "我猜，回到常态了……"
 bpm_acw_events.513.t:0 "民主党的漫长阴影"
 bpm_acw_events.513.d:0 "当人民党发布一份彻底反女权、反非裔美国人的党纲时，代表大会希望他们能用南方白人轻易填补失去的非裔美国人支持。事实证明这个想法只是幻想，因为任何尚未被我们争取过来的南方白人都顽固地忠于民主党。更糟的是，我们正在不断流失非裔美国人支持者——他们曾是我们最狂热的拥护者。"
 bpm_acw_events.513.f:0 ""我不会去投票。我没有登记。我相信民主在美国已经消失殆尽，根本不存在什么'两害相权'。只有一个挂两个名字的邪恶政党，无论我做什么或说什么，它都会当选。根本没有第三党。"\n\n—W·E·B·杜波依斯，1956年"
 bpm_acw_events.513.a:0 "谁会想到种族主义不能为我们赢得黑人支持？"
 bpm_acw_events.514.t:0 "党内内讧"
 bpm_acw_events.514.d:0 "虽然人民党在非裔美国人和女权问题上正式采取温和立场，南方各州支部在捍卫自由方面却坚定得多。一些州级人民党甚至走得更远，支持非民粹主义候选人（主要是共和党人），少数活动家甚至主张与地方共和党合并。全国性政党因此开始与许多进步激进派划清界限，而许多中产阶级纨绔子弟则津津有味地品读着我们的小纷争。"
 bpm_acw_events.514.f:0 ""我不会去投票。我没有登记。我相信民主在美国已经消失殆尽，根本不存在什么'两害相权'。只有一个挂两个名字的邪恶政党，无论我做什么或说什么，它都会当选。根本没有第三党。"\n\n—W·E·B·杜波依斯，1956年"
 bpm_acw_events.514.a:0 "该死的进步派，难道不知道这是民粹党吗？"
 bpm_acw_events.515.t:0 "准军事组织出击"
 bpm_acw_events.515.d:0 "我们党在提出诉求时，希望在保住非裔美国人党员与不让国家铁锤砸向活动家之间穿针引线。从某种角度看，这种平衡术是成功的：截至目前，州或联邦政府尚未对我们党进行直接镇压。然而，统治当局却非常乐意对白人准军事组织针对我们党员的暴力行为视而不见。私刑、枪击，甚至偶尔的纵火，一直困扰着我们在南方的组织工作。"
 bpm_acw_events.515.f:0 ""在任何借口下都不应交出武器和弹药；任何企图解除人民武装的行为都必须制止，必要时以武力制止"\n\n—《共产党宣言》，1848年"
 bpm_acw_events.515.a:0 "反动势力张牙舞爪"
 bpm_acw_events.516.t:0 "国家镇压"
 bpm_acw_events.516.d:0 "我们提出诉求时就料到国家会报复。但我们没想到他们会这么快出手。报纸因'扰乱治安'被查封，倡导者因'鼓励种族通婚'被捕，工会和合作社因'种族叛徒的阴谋'被取缔。白人党员被监禁，而我们的非裔党员则面临死亡与亵渎。"
 bpm_acw_events.516.f:0 ""在任何借口下都不应交出武器和弹药；任何企图解除人民武装的行为都必须制止，必要时以武力制止"\n\n—《共产党宣言》，1848年"
 bpm_acw_events.516.a:0 "他们不可能永远捂住人民的嘴"
 bpm_acw_events.517.t:0 "一场愉快的小内战"
 bpm_acw_events.517.d:0 "正义是容不得拖延的。当我们确立妇女解放和非裔平等立场时就明白这一点。我们也知道，不义势力会为我们的仗义执言而索要一磅肉。昨天，一名治安官带着他五个人的民团，以'与优等种族的女人勾搭'为由绞死了一个人。今天，那个女人和她的两个兄弟把治安官送进了地狱——那是他应得的地方。明天，在南方的另一个地方，这一切将再次上演。"
 bpm_acw_events.517.f:0 ""在任何借口下都不应交出武器和弹药；任何企图解除人民武装的行为都必须制止，必要时以武力制止"\n\n—《共产党宣言》，1848年"
 bpm_acw_events.517.a:0 "无论黑或白，我们的血都是红的"
 bpm_acw_events.518.t:0 "奥卡拉会议"
 bpm_acw_events.518.d:0 "十年前，民粹运动开始组织成一个统一阵线。自那时起，我们为赢得选举而战，以各自的方式高举自由的旗帜前进。我们认识到，并肩对抗剥削势力要有效得多。于是我们齐聚一堂召开全国代表大会，来定义一个新的、为人民发声的政党。我们必须决定的首要问题是参议院问题。参议员由州议会选出，掌握着条约和战争的大权，是立法进步最大的敌人。该怎么办？"
 bpm_acw_events.518.f:0 ""我们身处的环境最能证明我们合作的正当性；我们相聚于一个被推到道德、政治和物质崩溃边缘的国家。"\n\n—1892年人民党政纲，1892年"
 bpm_acw_events.518.a:0 "在暴民与强盗大亨之间存在一个折中方案：参议员由人民选举，并经州议会确认"
 bpm_acw_events.518.b:0 "参议院必须从属于人民，因此应由全州投票选出"
 bpm_acw_events.518.c:0 "人民院不应再受制于精英主义的参议院"
 bpm_acw_events.518.e:0 "我们的代议制必须与全国公投相平衡，以实现真正的民主"
 bpm_acw_events.519.t:0 "农场问题"
 bpm_acw_events.519.d:0 "其次，我们必须声明，我们的运动将如何帮助缓解小农日益加剧的盈利危机。"
 bpm_acw_events.519.f:0 ""腐败主宰着票箱、州议会、国会，甚至玷污了法官席上的貂皮。"\n\n—1892年人民党政纲，1892年"
 bpm_acw_events.519.a:0 "如果我们不再两头被动接受价格，我们就能最终实现繁荣。支持副国库制度"
 bpm_acw_events.519.b:0 "铁路大亨吸食我们的骨髓太久了，他们必须受到管制"
 bpm_acw_events.519.c:0 "管制只是贴在一处溃烂伤口上的创可贴，市政化才能治愈我们的创伤"
 bpm_acw_events.519.e:0 "全国农民联盟是唯一真正值得信赖的机构，让我们把它们扩展为由国家支持的合作社体系，为农民确保现代机械的奇迹"
 bpm_acw_events.520.t:0 "税收问题"
 bpm_acw_events.520.d:0 "第三，我们必须就如何改革税收以更公平地为重要的政府工作获取资金达成一致。"
 bpm_acw_events.520.f:0 ""人民士气低落；大多数州被迫将选民隔离在投票点，以防止普遍的恐吓和贿赂。"\n\n—1892年人民党政纲，1892年"
 bpm_acw_events.520.a:0 "关税是高物价的根源，必须削减"
 bpm_acw_events.520.b:0 "税收必须落在收入最高者身上才算真正公平，我们必须实施所得税"
 bpm_acw_events.520.c:0 "乔治先生的地价税理论颇为有趣，我们也一并倡导吧"
 bpm_acw_events.520.e:0 "积累的财富才是不平等的真正根源，必须通过税收来纠正。财富税、土地税和所得税将取代关税"
 bpm_acw_events.521.t:0 "货币问题"
 bpm_acw_events.521.d:0 "现在到了我们运动中许多人认为最重要的问题：货币。通货紧缩使我们的成员背负了无力偿还的债务：我们该如何解除他们的负担？"
 bpm_acw_events.521.f:0 ""报纸大多受到补贴或遭到封口，舆论被压制，商业被摧垮，家家户户被抵押压身，劳工陷入贫困，土地集中在资本家手中。"\n\n—1892年人民党政纲，1892年"
 bpm_acw_events.521.a:0 "白银争议太大，我们不如呼吁美元贬值，使我国每人对应50美元"
 bpm_acw_events.521.b:0 "白银虽有争议，但或许可以达成妥协。每年购买400万美元白银怎么样？"
 bpm_acw_events.521.c:0 "白银是我们运动的核心，这一点不会改变。自由土地、自由劳工、自由白银！"
 bpm_acw_events.521.e:0 "若要真正矫正我们这个误入歧途的社会，就必须大胆。我们将呼吁恢复绿背纸币，以及真正通胀性的货币政策"
 bpm_acw_events.522.t:0 "移民问题"
 bpm_acw_events.522.d:0 "接下来是一个令人不快的话题：排外政策。我们的成员要求制定一项针对外国移民的纲领条款，但或许我们能缓和他们的最坏冲动？"
 bpm_acw_events.522.f:0 ""城市工人被剥夺了为自保而组织起来的权利；输入的赤贫劳工压低了他们的工资，一支法律不承认的雇佣常备军被用来镇压他们，他们正迅速沦为欧洲般的境况。"\n\n—1892年人民党政纲，1892年"
 bpm_acw_events.522.a:0 "美国土地只属于美国人！我们的梦想不属于中国人"
 bpm_acw_events.522.b:0 "国家银行不过是金钱势力将我们贬为附庸的工具，此类提议必须终结"
 bpm_acw_events.522.c:0 "禁止土地所有权还不够，我们必须阻止所有进一步的华人移民进入我国"
 bpm_acw_events.522.e:0 "而且不光是华人，还有犹太人！美国只属于白人（也许还有黑人）"
 bpm_acw_events.523.t:0 "性别问题"
 bpm_acw_events.523.d:0 "妇女一直是我们运动的基石。现在是时候决定我们党在妇女权利问题上的立场了。"
 bpm_acw_events.523.f:0 ""数百万人的劳动果实被公然窃取，用来为少数人筑起人类历史上空前的巨额财富；而这些财富的占有者反过来蔑视共和国、危及自由。"\n\n—1892年人民党政纲，1892年"
 bpm_acw_events.523.a:0 ""一切与男性有关之事，也与女性同样有关""
 bpm_acw_events.523.b:0 ""教育你们的女儿，使她们得以独立""
 bpm_acw_events.523.c:0 ""少种玉米，多闹腾""
 bpm_acw_events.523.e:0 ""妇女能顶半边天""
 bpm_acw_events.524.t:0 "种族问题"
 bpm_acw_events.524.d:0 "最后，我们必须就非裔美国人的地位表态。虽然许多人惧怕黑人劳工的竞争，但有色人种农民联盟是我们在南方工作的核心组织。党将如何决定？"
 bpm_acw_events.524.f:0 ""政府不公的同一丰饶子宫，孕育出两大阶级——流浪汉和百万富翁。"\n\n—1892年人民党政纲，1892年"
 bpm_acw_events.524.a:0 "非裔美国人是劣等种族，必须如此指明"
 bpm_acw_events.524.b:0 "我们种族之间差异太多，必须保持隔离"
 bpm_acw_events.524.c:0 "隔离或许最好，但机会平等仍应维持"
 bpm_acw_events.524.e:0 "为什么非裔美国人要与他的白人兄弟隔离？在上帝眼中，我们难道不都是平等的吗？"
 bpm_acw_events.525.t:0 "标题问题"
 bpm_acw_events.525.d:0 "如今剩下的就是为我们这份建党文件命名。虽然看似小事，但这将决定我们党的论调，从而深刻影响我们成员的意识形态。"
 bpm_acw_events.525.f:0 ""作为一个改革政党，我们的同情自然倾向于一切能使人们明智、有德、节制的提案；然而，我们认为这些问题虽重要，却次于当下亟待解决的大问题——不仅我们个人的繁荣，连自由制度的存亡本身都取决于此；"\n\n—1892年人民党政纲，1892年"
 bpm_acw_events.525.a:0 "《第二次独立宣言》"
 bpm_acw_events.525.b:0 "《第二权利法案》"
 bpm_acw_events.525.c:0 "《平民的常识》"
 bpm_acw_events.525.e:0 "《被进步所贫化》"
 bpm_acw_events.525.g:0 "《工人宣言》"
 bpm_acw_events.526.t:0 "人民党"
 bpm_acw_events.526.d:0 "终于，我们的党纲完成了。一些人将其作为未来的蓝图来庆祝。另一些人则感到失望，认为它走得太远，或还不够远。还有一些人因与它的分歧而彻底离开我们的运动。无论如何，已经无法回头了。"
 bpm_acw_events.526.f:0 ""我们恳请所有人在我们就如何管理共和国产生分歧之前，先帮助我们确定我们是否还有一个共和国可以管理，因为我们相信，今日组织起来的改革力量将永不停歇地前进，直到一切冤屈得到纠正，这个国家的所有男女都稳固地获得平等的权利和平等的特权。"\n\n—1892年人民党政纲，1892年"
 bpm_acw_events.526.a:0 "一个农本主义政党"
 bpm_acw_events.526.b:0 "一个民粹主义政党"
 bpm_acw_events.526.c:0 "一个劳苦者政党"
 bpm_acw_events.526.e:0 "一个行动政党"
 bpm_acw_events.526.g:0 "一个革命政党"
 bpm_acw_events.526.h:0 "一个反动政党"
 bpm_acw_events.527.t:0 "首届全国代表大会"
 bpm_acw_events.527.d:0 "随着竞选活动全面展开，人民党终于迎来了首届全国代表大会。在推定候选人英年早逝后，代表大会选定了一位领导绿背运动激进派的纽约记者。"
 bpm_acw_events.527.f:0 "\[他\]是自尼禄时代以来比任何人都更恶劣的暴君、更残忍的屠夫……如今投票给林肯的人都是叛徒和凶手……如果他再次当选、再治理四年，我们相信会有一只勇敢的手为公共利益将匕首刺入他的心脏。"\n\n—马库斯·波默罗伊，1860年代"
 bpm_acw_events.527.a:0 "撇开那些污言秽语，他其实相当雄辩"
 bpm_acw_events.528.t:0 "首届全国代表大会"
 bpm_acw_events.528.d:0 "随着竞选活动全面展开，人民党终于迎来了首届全国代表大会。在推定候选人英年早逝后，代表大会选定了一位领导绿背运动温和派的北方国会领袖。"
 bpm_acw_events.528.f:0 ""旧世界的贵族阶级不断把他们动荡饥饿的民众引向美国，以证明共和国无法为受压迫的芸芸众生提供庇护或希望。"\n\n—詹姆斯·B·韦弗，1892年"
 bpm_acw_events.528.a:0 "毕竟他最擅长的就是输掉选举"
 bpm_acw_events.529.t:0 "首届全国代表大会"
 bpm_acw_events.529.d:0 "随着竞选活动全面展开，人民党终于迎来了首届全国代表大会。在推定候选人英年早逝后，代表大会选定了一位以品格高尚和反垄断裁决闻名的共和党上诉法官。"
 bpm_acw_events.529.f:0 ""我已退出政坛，没有政治抱负。虽然我对一些共和党朋友说过，我不愿让自己的名字出现在明尼阿波利斯代表大会上，但我并不觉得有必要公开宣布这一事实。"\n\n—沃尔特·Q·格雷沙姆，1892年"
 bpm_acw_events.529.a:0 "他们曾是共和党人又如何，现在他们是民粹主义者了"
 bpm_acw_events.530.t:0 "首届全国代表大会"
 bpm_acw_events.530.d:0 "随着竞选活动全面展开，人民党终于迎来了首届全国代表大会。在推定候选人英年早逝后，代表大会选定了一位以其土地单一税理论和纽约市长竞选闻名的经济学家。"
 bpm_acw_events.530.f:0 ""我们把自由说成是一回事，把美德、财富、知识、发明、国力和民族独立说成是另一回事。但在这一切之中，自由是源泉，是母亲，是必要条件。"\n\n—亨利·乔治，1879年"
 bpm_acw_events.530.a:0 "一位美国马克思，只是更温和一些"
 bpm_acw_events.531.t:0 "首届全国代表大会"
 bpm_acw_events.531.d:0 "随着竞选活动全面展开，人民党终于迎来了首届全国代表大会。在推定候选人英年早逝后，代表大会选定了劳工骑士团的领袖。"
 bpm_acw_events.531.f:0 ""晚年的我被许多人指责为煽动者；我的一些朋友在为我辩护时否认我是煽动者；他们错了，我确实是煽动者，并且竭尽全力以口与笔去鼓动，反对施加在劳动男女身上的不公。"\n\n—特伦斯·鲍德利，1940年"
 bpm_acw_events.531.a:0 "让工会领袖来领导联邦，只希望他们别罢工"
 bpm_acw_events.532.t:0 "首届全国代表大会"
 bpm_acw_events.532.d:0 "随着竞选活动全面展开，人民党终于迎来了首届全国代表大会。在推定候选人英年早逝后，代表大会选定了一位律师兼前民主党人，他因我们党对白人至上和种族隔离的执着而转向我们。"
 bpm_acw_events.532.f:0 ""我为我的州感到自豪……因为我们在那里解决了黑人问题……我们把他逐出了政治，从而在任何政党下都确保了善治，并为两个种族的未来发展奠定了基础。"\n\n—查尔斯·艾科克，1903年"
 bpm_acw_events.532.a:0 "任何谈论威尔明顿的人都会被开除出党"
 bpm_acw_events.533.t:0 "分裂"
 bpm_acw_events.533.d:0 "虽然我们党在最近的选举中表现惊人地好，但胜利是千百个争吵不休孩子的母亲。我们党已经开始在推进其诉求的理想方式上产生分裂。融合派主张与民主党结盟，希望通过立法胜利来成功实施其政策。而中间路线派则希望保持战略独立，相信只有民粹主义候选人才能被信任去实施民粹主义思想。"
 bpm_acw_events.533.f:0 "你们不得把荆棘之冠强压在劳工的额头上。"\n\n—威廉·詹宁斯·布赖恩，1896年""
 bpm_acw_events.533.a:0 "团结到哪里去了？"
 bpm_acw_events.534.t:0 "全国农民联盟"
 bpm_acw_events.534.d:0 "自内战以来，全国农庄会一直是北方农民的教育、文化和社会团体。随着南方农民（无论白人还是黑人）重返政治对话，农庄会的激进派也随之壮大。为寻求一个经济组织来倡导和组织美国农民，两个全国农民联盟应运而生：一个在北方较为温和，一个在南方较为激进。虽然北方分支拒绝为其组织设置肤色门槛，南方团体却坚决拒绝自由民的入会。"
 bpm_acw_events.534.f:0 ""你们不得把荆棘之冠强压在劳工的额头上。"\n\n—威廉·詹宁斯·布赖恩，1896年"
 bpm_acw_events.534.a:0 "非裔美国人因此将组建自己的组织，成为南方民粹主义的堡垒"
 bpm_acw_events.535.t:0 "劳工骑士团"
 bpm_acw_events.535.d:0 "我国第一个全国性劳工联合会——全国劳工联合会——在种族主义和政府镇压使其地方分会如鼠群般四散后，落得个悲惨的结局。如今，全国劳工联合会的灰烬孕育出一个新的、更强大的劳工联合会：劳工骑士团。其领导层毫不掩饰地主张多种族，全国视野使骑士团的会员人数在全国范围内激增。然而，有些人担心骑士团拒绝与行业工会合作、不断介入地方工会纠纷，以及拒绝坚决支持罢工策略，终将把这个联合会撕裂。"
 bpm_acw_events.535.f:0 ""你们不得把荆棘之冠强压在劳工的额头上。"\n\n—威廉·詹宁斯·布赖恩，1896年"
 bpm_acw_events.535.a:0 "有了妥协的力量，谁还需要罢工基金或罢工委员会？"
 bpm_acw_events.536.t:0 "土地单一税派"
 bpm_acw_events.536.d:0 "在我们运动的黎明，我们事业的一位关键领袖写了一本书。在那部著作中，他们提出：虽然技术确实会带来社会财富的增长，但这种财富主要落入自然资源所有者手中这一事实，意味着技术进步只会加剧贫困的蔓延。针对这一问题，他们提议对自然资源所有者征收一种包罗万象的单一税，以遏制这些所有者对财富的自然垄断。虽然这一哲学在关税等问题上与我们运动的其他成员分歧很大，但它也是一个极为流行的理论，该书售出300万册，发行量仅次于《圣经》。"
 bpm_acw_events.536.f:0 ""你们不得把荆棘之冠强压在劳工的额头上。"\n\n—威廉·詹宁斯·布赖恩，1896年"
 bpm_acw_events.536.a:0 "要是我再听一次地价税就……"
 bpm_acw_events.537.t:0 "社会主义者"
 bpm_acw_events.537.d:0 "在我们运动的初期，就一直有社会主义者的存在。社会主义劳工党和铁路兄弟会一直是我们关键的活动家，以其他成员缺乏胆量去做的、令人不快的行动来推动我们的提案。但这种联盟一直保持着距离：温和派担心社会主义者的激进，社会主义者则厌恶我们的妥协本性。但如今，社会主义者终于完全融入了我们党，导致党内形成了两个新党团。一方是工团主义者，由前社会主义劳工党成员组成，主张激进的产业工团主义，勉强踩在法律边缘。另一方，劳工骑士团的铁路兄弟会组成了兄弟会派系，充当党内中间派社会主义和正统马克思主义思想的堡垒。"
 bpm_acw_events.537.f:0 ""你们不得把荆棘之冠强压在劳工的额头上。"\n\n—威廉·詹宁斯·布赖恩，1896年"
 bpm_acw_events.537.a:0 "德布斯与德莱昂，以及他们的德意志同志"
 bpm_acw_events.538.t:0 "第三政党体制"
 bpm_acw_events.538.d:0 "殉难解放者摧毁了第二政党体制，并用其碎片构建了一个建立在党派忠诚政治之上的新体制。这种对主流政党盲目狂热，抑制了第三党的崛起——无论是绿背党、联合劳工党、禁酒党还是人民党。\n\n尽管这些政党在政治对话中颇有影响，却从未获得足够选票来真正威胁到僵持的选举人团。这就是简单多数制的偏见。"
 bpm_acw_events.538.f:0 ""你们不得把荆棘之冠强压在劳工的额头上。"\n\n—威廉·詹宁斯·布赖恩，1896年"
 bpm_acw_events.538.a:0 "华盛顿的天真继续困扰着我们。"
 bpm_acw_events.539.t:0 "民粹主义重组"
 bpm_acw_events.539.d:0 "殉难解放者摧毁第二政党体制之处，人民运动如今摧毁了他的第三政党体制，构建了一个新的现实。人民党如今主导边疆，同时威胁着工业化的中西部和农业化的南方。\n\n长久以来，我们把简单多数制的偏见当作不可避免来接受，但凭借团结与抗争，我们终于打破了两党垄断。"
 bpm_acw_events.539.f:0 ""你们不得把荆棘之冠强压在劳工的额头上。"\n\n—威廉·詹宁斯·布赖恩，1896年"
 bpm_acw_events.539.a:0 "华盛顿的天真继续困扰着我们。"
 bpm_solidarity_knights_of_labor.tt:0 "要采取这一立场，我们需要先赢得工会的支持。"
 bpm_solidarity_geoists.tt:0 "要采取这一立场，我们需要先赢得乔治主义者的支持。"
 bpm_solidarity_socialistic_laborers.tt:0 "要采取这一立场，我们需要先赢得社会主义劳工党的支持。"
 bpm_acw_events.601.t:0 "国际货币大会"
 bpm_acw_events.601.d:0 "在内战后的岁月里，曾有过多次尝试，试图建立一种终结白银货币崩溃的国际货币秩序。如今，随着我国国力达到新高度，我们召开了一次新的国际货币会议，以终结无休止的货币战争，保障我国人民的稳定与繁荣。"
 bpm_acw_events.601.f:0 ""你们不得把荆棘之冠强压在劳工的额头上。"\n\n—威廉·詹宁斯·布赖恩，1896年"
 bpm_acw_events.601.a:0 "人类终于从十字架上解脱了！"
 bpm_acw_events.602.t:0 "太平洋霸权确立"
 bpm_acw_events.602.d:0 "当哥伦布航行到美洲时，他寻找的不是我们神圣的土地，而是亚洲的财富。如今，为支撑我国的繁荣，我们开始了自己伟大的西进事业，止于马尼拉湾。在那里，在我们的东方明珠，我们将维护对华自由贸易，并保障我们太平洋商人的安全。"
 bpm_acw_events.602.f:0 ""我们不能在菲律宾否定自治原则，而又不削弱这一原则在我们国内的力量"\n\n—威廉·詹宁斯·布赖恩，1900年"
 bpm_acw_events.602.a:0 "欢呼吧哥伦比亚，幸福的土地！"
 bpm_acw_events.603.t:0 "征服西北航道"
 bpm_acw_events.603.d:0 "当我们第三次进军征服加拿大时，我们在北极圈止步，认为冰川治理成本过高。然而，随着海军技术的进步，西北航道的潜在利润也随之增长。随着我们对北极的取得，我们对北方海路的主导权将永世巩固。"
 bpm_acw_events.603.f:0 ""我们不能在菲律宾否定自治原则，而又不削弱这一原则在我们国内的力量"\n\n—威廉·詹宁斯·布赖恩，1900年"
 bpm_acw_events.603.a:0 "欢呼吧哥伦比亚，幸福的土地！"
 bpm_acw_events.604.t:0 "夺取特万特佩克走廊"
 bpm_acw_events.604.d:0 "我们曾扩张门罗主义以涵盖现存的欧洲殖民地。如今，我们又为我们的外交政策增添了一条新推论：任何为维护自由美洲国家安全所必需的战略领土，即便目前由一个自由美洲国家持有，为维护整个西半球的安全，也必须让出。"
 bpm_acw_events.604.f:0 ""我们不能在菲律宾否定自治原则，而又不削弱这一原则在我们国内的力量"\n\n—威廉·詹宁斯·布赖恩，1900年"
 bpm_acw_events.604.a:0 "欢呼吧哥伦比亚，幸福的土地！"
 bpm_acw_events.605.t:0 "向旧金山进军"
 bpm_acw_events.605.d:0 "我们终于打通了从密西西比河到浩瀚太平洋的通道。直到此刻才可以说，我国的旗帜从这片海飘扬到那片海！"
 bpm_acw_events.605.f:0 ""我们不能在菲律宾否定自治原则，而又不削弱这一原则在我们国内的力量。"\n\n—威廉·詹宁斯·布赖恩，1900年"
 bpm_acw_events.605.a:0 "欢呼吧哥伦比亚，幸福的土地！"
 bpm_acw_events.606.t:0 "五十四度四十分已兑现"
 bpm_acw_events.606.d:0 "我们的先辈曾高呼"五十四度四十分，否则开战！"如今他们得以在天堂欣慰——因为随着对温哥华的夺取，我们终于能保障我们太平洋属地免受英国的侵略。"
 bpm_acw_events.606.f:0 ""我们不能在菲律宾否定自治原则，而又不削弱这一原则在我们国内的力量。"\n\n—威廉·詹宁斯·布赖恩，1900年"
 bpm_acw_events.606.a:0 "欢呼吧哥伦比亚，幸福的土地！"
 bpm_acw_events.607.t:0 "奥斯坦德如愿"
 bpm_acw_events.607.d:0 "古巴一直是我们实业家和种植园主阶层觊觎的对象，岛上丰饶的甘蔗园许诺着丰厚的回报。如今，这份战利品归我们所有，关塔那摩湾的海军基地亦随之而来。"
 bpm_acw_events.607.f:0 ""我们不能在菲律宾否定自治原则，而又不削弱这一原则在我们国内的力量。"\n\n—威廉·詹宁斯·布赖恩，1900年"
 bpm_acw_events.607.a:0 "欢呼吧哥伦比亚，幸福的土地！"
