je_danubian_federation_ukrainian_button: "[GetCulture('ukrainian').GetName] Endişelerini Giderin"
je_danubian_federation_ukrainian_button_desc: "[ROOT.GetCountry.GetNameNoFlag] tarafından #b Lehistan-Litvanya Birliği#!'nden (Commonwealth) ele geçirilen #b Galiçya#! bölgesi, ağırlıklı olarak [GetCulture('ukrainian').GetName] bir Doğu ile [GetCulture('polish').GetName] bir Batı arasında bölünmüş durumdadır. Tüm bölge uzun süredir [GetCulture('polish').GetNameNoFormatting] elitler tarafından yönetilmektedir ve #b $STATE_EAST_GALICIA$#! bölgesindeki büyük şehirlerde [GetCulture('polish').GetNameNoFormatting] yerleşimleri bulunmaktadır. Eğer [GetCulture('ukrainian').GetNameNoFormatting] toprakları Federasyon'a sorunsuz bir şekilde entegre edilecekse, #b Galiçya#! adil bir şekilde bölünmeli ve bu [GetCulture('polish').GetNameNoFormatting] yerleşimleriyle ilgili bir uzlaşmaya varılmalıdır."

je_danubian_federation_serb_button: "[GetCulture('serb').GetName] Endişelerini Giderin"
je_danubian_federation_serb_button_desc: "İmparatorluğun #b Vojvodina#! bölgesi etrafında yoğunlaşan [GetCulture('serb').GetName] nüfusu, uzun süredir #b Macar#! yargı yetkisi altında var olmuştur. Vojvodina son derece çeşitli bir nüfusa ev sahipliği yapmaktadır ve [GetCulture('hungarian').GetName] milliyetçileri tarafından #b Macaristan#!'ın çekirdek (ana) bölgesi olarak kabul edilmektedir. [GetCulture('serb').GetNameNoFormatting] nüfusu büyük ölçüde bir [GetCulture('serb').GetNameNoFormatting] veya pan-Slav devleti altında federalleşmeye açıktır - ancak bunu yapmaya yönelik herhangi bir adım, bölgedeki [GetCulture('serb').GetNameNoFormatting] olmayan çeşitli halklar arasında kesinlikle hoşnutsuzluk yaratacaktır."

