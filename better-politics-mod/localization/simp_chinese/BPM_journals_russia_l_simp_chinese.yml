l_simp_chinese:
 je_bpm_russia_estates:0 "俄罗斯帝国的等级"
 je_bpm_russia_estates_reason:0 "俄罗斯国家带着沉重的历史包袱迈入动荡的1800年代。深深烙印于其法律之中、并贯穿社会各层面的，是以“索斯洛维耶”（Sosloviye）——一种主要由世袭决定的、人生而所属的等级——为界线的划分。这些古老的等级扼杀社会流动、加剧紧张、抑制创新，若想将其废除，就需要意义深远的改革——前提是俄罗斯的当权者相信现代化是必要的。不过，也许这个国家能够将它的古老习俗原封不动地带入下一个世纪……\n\n$je_bpm_russia_estates_tooltipable_peasants$: [SCOPE.GetRootScope.GetCountry.GetCustom('je_bpm_russia_estates_status_peasants')]\n$je_bpm_russia_estates_tooltipable_nobles$: [SCOPE.GetRootScope.GetCountry.GetCustom('je_bpm_russia_estates_status_nobles')]\n$je_bpm_russia_estates_tooltipable_clergy$: [SCOPE.GetRootScope.GetCountry.GetCustom('je_bpm_russia_estates_status_clergy')]\n$je_bpm_russia_estates_tooltipable_burghers$: [SCOPE.GetRootScope.GetCountry.GetCustom('je_bpm_russia_estates_status_burghers')]\n$je_bpm_russia_estates_tooltipable_foreigners$: [SCOPE.GetRootScope.GetCountry.GetCustom('je_bpm_russia_estates_status_foreigners')]"
 je_bpm_russia_estates_tooltip_exists:0 "#lore 存在#!"
 je_bpm_russia_estates_tooltip_exists_de_jure:0 "#lore 存在#!（事实上已#green 废除#!）"
 je_bpm_russia_estates_tooltip_abolished:0 "#green 已废除#!"
 je_bpm_russia_estates_tooltip_abolished_racist:0 "#blue 已废除特权#!"
 je_bpm_russia_estates_tooltip_abolished_partial:0 "#green 已废除#!（#lore 保留自治#!）"
 je_bpm_russia_estates_abolish_peasants_button:0 "废除克列斯季扬斯特沃"
 je_bpm_russia_estates_abolish_peasants_button_desc:0 "废除这个人口最多的等级，将使俄罗斯绝大多数人在法律上获得平等；对贵族而言，这绝非最令人愉悦的主张。这样的变革也必然要求废除农民自身的自治单位——古老的奥勃希纳将不得不走向现代化。"
 je_bpm_russia_estates_abolish_nobles_button:0 "废除德沃里扬斯特沃"
 je_bpm_russia_estates_abolish_nobles_button_desc:0 "废除贵族特权，将让我们的精英凭借才干而非出身权位居于高位。自然，那些靠后者而非前者身居高位的人，会对这种安排感到相当不满。"
 je_bpm_russia_estates_abolish_clergy_button:0 "废除杜霍文斯特沃"
 je_bpm_russia_estates_abolish_clergy_button_desc:0 "剥夺神职人员的特殊待遇，无疑会让他们不满——但若我们想成为一个更加世俗的国家，这一步是必须的。"
 je_bpm_russia_estates_abolish_burghers_button:0 "废除戈罗扎内等级"
 je_bpm_russia_estates_abolish_burghers_button_desc:0 "消除城市人口中各阶层不同的特权与义务，将带来更大的社会流动，这对于一个正在走向现代化的国家而言是必要的。"
 je_bpm_russia_estates_abolish_foreigners_button:0 "废除伊诺罗杰茨区分"
 je_bpm_russia_estates_abolish_foreigners_button_desc:0 "我们无须为与我们国籍不同的人设定特殊的权利与义务。"
 je_bpm_russia_estates_tooltipable_peasants:0 "#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_russia_estates_tooltip_peasants 克列斯季扬斯特沃#!"
 je_bpm_russia_estates_tooltipable_nobles:0 "#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_russia_estates_tooltip_nobles 德沃里扬斯特沃#!"
 je_bpm_russia_estates_tooltipable_clergy:0 "#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_russia_estates_tooltip_clergy 杜霍文斯特沃#!"
 je_bpm_russia_estates_tooltipable_burghers:0 "#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_russia_estates_tooltip_burghers 戈罗扎内#!"
 je_bpm_russia_estates_tooltipable_foreigners:0 "#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_russia_estates_tooltip_foreigners 伊诺罗杰茨#!"
 je_bpm_russia_estates_tooltip_peasants:0 "#v 克列斯季扬斯特沃#!，即农民，是俄罗斯绝大多数人口所属的等级。作为地位最低的等级，克列斯季扬斯特沃承受着征兵与赋税的重担，同时也遭受最严厉的刑罚。\n\n只要农奴制仍是这个国家的法律，农民实质上就是当地贵族的财产——正如当代思想家所指出的，这种安排与奴隶制并无太大区别。"
 je_bpm_russia_estates_tooltip_nobles:0 "#v 德沃里扬斯特沃#!，即贵族，是包含俄罗斯帝国世袭贵族在内的等级。\n\n作为最受优待的等级，它被授予独占拥有有人居住之土地的权利、免于征兵与肉刑的保护、免缴赋税，以及参与俄罗斯行政管理的专属特权。"
 je_bpm_russia_estates_tooltip_clergy:0 "#v 杜霍文斯特沃#!，即神职人员，是包含俄罗斯正教会成员在内的等级。虽然与其他等级一样，该等级大多也是世袭的，但其所授予的特权要求其成员完成宗教教育；若不迈出这一步，个人就必须改而加入另一个（相对受优待的）等级。\n\n作为一个受优待的等级，它使其成员免缴人头税、免于征兵与肉刑。非正教的神职人员不属于这一等级，这迫使他们的社会地位依附于另一个等级。"
 je_bpm_russia_estates_tooltip_burghers:0 "#v 戈罗扎内#!，即城市居民，是包含俄罗斯城市中大多数人口的等级。这一等级的独特之处在于其内部还有细分阶层，分为#v 波切特内·戈罗扎内#!（体面市民）、#v 库佩切斯特沃#!（商人）、#v 梅夏涅#!（市民）、#v 列梅斯连尼基#!（工匠）和#v 拉博奇耶#!（工人），各群体的权利与特权各不相同。尤为值得注意的是，戈罗扎内的下层——梅夏涅被允许施以肉刑，这是他们与克列斯季扬斯特沃共同背负的枷锁。\n\n除了这些正式界定的区分之外，城市居民中还包含一个非正式、却极为重要的群体——#v 拉兹诺钦齐#!，即没有正式等级身份的人。他们是俄罗斯帝国各种进步或革命性社会与思想运动中最常见的成员。"
 je_bpm_russia_estates_tooltip_foreigners:0 "#v 伊诺罗杰茨#!，即外国人，是对居住在俄罗斯帝国境内的非斯拉夫民族的一个宽泛法律类别，通常居住在俄罗斯远东、西伯利亚、中亚或高加索地区。\n\n国家对他们的待遇差异极大，其共同的基调是普遍豁免于俄罗斯等级制度之外，而以临时的、各式各样的特权和歧视性政策加以对待。"
 je_bpm_russia_estates_peasants_abolished_trigger:0 "废除了#v 克列斯季扬斯特沃#!"
 je_bpm_russia_estates_peasants_abolished_fully_trigger:0 "在法律上和事实上都废除了#v 克列斯季扬斯特沃#!"
 je_bpm_russia_estates_nobles_abolished_trigger:0 "废除了#v 德沃里扬斯特沃#!"
 je_bpm_russia_estates_clergy_abolished_trigger:0 "废除了#v 杜霍文斯特沃#!"
 je_bpm_russia_estates_burghers_abolished_trigger:0 "废除了#v 戈罗扎内等级#!"
 je_bpm_russia_estates_foreigners_abolished_trigger:0 "废除了#v 伊诺罗杰茨区分#!"
 bpm_russia_foreigners_estate_abolished_good:0 "重组伊诺罗杰茨法律"
 bpm_russia_foreigners_estate_abolished_racist:0 "废除伊诺罗杰茨特权"
 je_bpm_russia_estates_will_abolish_estate:0 "该等级将被#green 废除#！！"
 je_bpm_russia_estates_will_abolish_estate_de_facto:0 "该等级将被保留，但在事实上#green 废除#！！"
 je_bpm_russia_estates_will_abolish_estate_peasants:0 "此外，仍以名存实亡形式存在的#v 克列斯季扬斯特沃#!等级，同样将被彻底#green 废除#！！"
 je_bpm_russia_estates_will_abolish_estate_foreigners:0 "俄罗斯人与伊诺罗杰茨之间的大部分区分将被#green 废除#！！"
 je_bpm_russia_estates_will_abolish_estate_foreigners_good:0 "俄罗斯人与伊诺罗杰茨之间的大部分区分将被#green 废除#！；不过他们将保留其有限的自治理传统机构。"
 je_bpm_russia_estates_will_abolish_estate_foreigners_racist:0 "授予伊诺罗杰茨居民的特权将被#blue 废除#！，其自治机构同样被取消。"
 bpm_russia.4.t:0 "关于废除等级与文官官阶的法令"
 bpm_russia.4.d:0 "新的社会主义政府不愿在俄罗斯等级制度所造成的严重不平等问题上拖沓，已通过法令废除了[ROOT.GetCountry.GetName]此前存在的一切等级。"
 bpm_russia.4.f:0 "1. 废除迄今为止存在于俄国的一切阶级及阶级差别、阶级特权和阶级限制、阶级组织和机构，以及一切文官官阶。\n2. 废除一切等级（贵族、商人、平民、农民等）、爵衔（亲王、伯爵等）及文官官阶称谓（枢密顾问、国务顾问等），代之以俄国全体居民共同享有的一个名称——俄罗斯共和国公民。\n3. 贵族财产立即移交给相应的地方自治机构。\n4. 商人及平民团体的财产立即移交给市政当局。\n5. 一切等级机构、事务、档案立即移交给市政和地方自治机构。\n6. 废除一切（关于等级机构的）法律。\n\n——中央执行委员会，1917年"
 bpm_russia.4.a:0 "阶级斗争的又一胜利！"
 bpm_russia.5.t:0 "关于废除等级与文官官阶的法令"
 bpm_russia.5.d:0 "由于我们近来的改革，共和国政体与普选制的建立，必然导致[ROOT.GetCountry.GetName]的等级被彻底废除。"
 bpm_russia.5.f:0 "1. 废除迄今为止存在于俄国的一切等级及等级差别、等级特权和等级限制、等级组织和机构，以及一切文官官阶。\n2. 废除一切等级（贵族、商人、平民、农民等）、爵衔（亲王、伯爵等）及文官官阶称谓（枢密顾问、国务顾问等），代之以俄国全体居民共同享有的一个名称——俄罗斯共和国公民。"
 bpm_russia.5.a:0 "自由与平等！"
 bpm_russia.6.t:0 "废除等级"
 bpm_russia.6.d:0 "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]所做的审慎工作终于得到了恰当的收尾。随着所有等级被彻底废除，通向一个现代而平等的俄罗斯的又一道障碍被清除了。"
 bpm_russia.6.f:0 "一个耐人寻味的难题萦绕在俄罗斯知识分子的心头。眼下的俄罗斯，并非真正的自由，也并非真正的民主共和国。然而，尽管困难重重，却毫无妥协地，所有古老的等级被自上而下地一一废除了。俄罗斯人要摆脱等级的区分、彼此平等相待，还需要一些时日。但最初的大胆步伐已经迈出，且已无法收回。"
 bpm_russia.6.a:0 "希望我们不会为此后悔。"
 bpm_russia.7.t:0 "等级的黄昏"
 bpm_russia.7.d:0 "随着围绕我们等级制度的最后一项立法通过，我们终于可以说，尽管有所妥协，俄罗斯的等级制度从各种实际意义上说都已经不复存在了。"
 bpm_russia.7.f:0 "诚然，等级并未完全消失。政府时不时进行的人口普查，仍会询问人们的等级及其归属。但越来越多的人已不知自己属于哪个等级。从各种实际意义上看，在法律之下——他们实质上已然平等。至少，就这些古老的等级而言……"
 bpm_russia.7.a:0 "必要的一步。"
 bpm_russia.10.t:0 "不再是克列斯季亚宁"
 bpm_russia.10.d:0 "随着农奴制的废除以及国家治理与经济的现代化，克列斯季扬斯特沃等级离成为历史注脚越来越近了。我们当今的政府会是那个为这一篇章画上句号的人吗？"
 bpm_russia.10.f:0 "克列斯季亚宁不习惯听到好消息，无论是来自国家官员，还是来自德沃里扬斯特沃。他们来时，总是来收走粮食、抢走肉、把男人们送去远方战场送死、诬陷他们却不让他们自辩。但近来消息变了样；坏消息当然还在，但也有好消息传来——肉刑被废除了，农民不再是地主的财产，甚至还有一些自由，尽管有限，却是意想不到的恩惠。而今天，或许又将是俄罗斯农民接连收到好消息的一天。"
 bpm_russia.10.a:0 "把农民从等级中解放出来"
 bpm_russia.10.b:0 "保留等级于纸面，但废除大部分相关法律"
 bpm_russia.10.c:0 "我们或许还需要更多时间"
 bpm_russia.11.t:0 "最后的德沃里亚涅"
 bpm_russia.11.d:0 "随着[ROOT.GetCountry.GetName]的等级制度不断瓦解，最后一个等级仍有待恰当地废除——即$je_bpm_russia_estates_tooltipable_nobles$。然而，既然俄罗斯大部分地区已摆脱了各自等级的枷锁，这最后一步真的有必要吗？"
 bpm_russia.11.f:0 "太久以来，德沃里亚涅让所有人都头疼不已。让被他们剥削的农民头疼，让被他们压制的城市居民头疼；甚至让沙皇头疼，因为沙皇不得不被养尊处优的贵族那些目光短浅的要求所束缚。俄罗斯最终会迈出这最后一步，摆脱贵族这块沉重的锚吗？"
 bpm_russia.11.a:0 "会的。这些过时的习俗在[ROOT.GetCountry.GetName]没有立足之地！"
 bpm_russia.11.a2:0 "我们必须同时废除贵族爵衔和克列斯季扬斯特沃等级的残余。"
 bpm_russia.11.b:0 "让他们保留爵衔，但废除大部分特权"
 bpm_russia.11.c:0 "也许……改日再说"
 bpm_russia.12.t:0 "落到现实"
 bpm_russia.12.desc:0 "我们的杜霍文斯特沃在我国享有巨大特权实在太久了。随着我们新的世俗政策，现在收回这些特权是合理的。"
 bpm_russia.12.f:0 "诚然，也许他们会抱怨。对他们而言，与俗人甚至与不同神职人员平等，感觉就像压迫。但假以时日，他们会明白这是必要的。"
 bpm_russia.12.a:0 "废除名号与特权"
 bpm_russia.12.b:0 "名号可以保留，但特权不行"
 bpm_russia.12.d:0 "允许外国人进入该等级，并总体上削弱其特权"
 bpm_russia.12.c:0 "我们应该重新考虑"
 bpm_russia.13.t:0 "城市公民"
 bpm_russia.13.d:0 "各种戈罗扎内有着大量法律来规定其权利与义务，将本已分层的城市人口进一步分层。废除这些区分，是废除整个等级制度的必要条件。"
 bpm_russia.13.f:0 "无尽的名号、区分与身份象征，为将建设我们未来的人民的流动制造了阻力。为了我们的未来，我们必须消除这种阻力。"
 bpm_russia.13.a:0 "废除这些等级"
 bpm_russia.13.b:0 "保留部分等级，但废除其相关法律"
 bpm_russia.13.c:0 "现在不行"
 bpm_russia.14.t:0 "伊诺罗杰茨区分"
 bpm_russia.14.d:0 "所谓的伊诺罗杰茨，是一套支配他们生活及我们与他们互动方式的、由规则与例外拼凑而成的法律。简化并理顺这些规则，是废除我们等级制度的必要组成部分。"
 bpm_russia.14.f:0 "随着我们的等级日渐式微，一个房间里的大象摆在了我们面前——一大群人因出身或信仰而被与我们多年来的等级相隔绝，被授予例外与特殊义务。然而如今等级既已废除，伊诺罗杰茨的身份问题就变得越来越紧迫了。"
 bpm_russia.14.a:0 "保留一些原住民治理政策"
 bpm_russia.14.b:0 "废除他们的特权；他们以后会自己挣得权利"
 bpm_russia.14.c:0 "我们日后再处理此事"
 je_bpm_russia_patchwork_governance:0 "精简治国"
 je_bpm_russia_patchwork_governance_reason:0 "任何熟悉俄罗斯的人都会注意到的一点，就是它的幅员辽阔。对一些人而言，这是莫大的骄傲与力量的源泉。而对另一些人来说，它却是无数头疼的根源，需要一套复杂、几乎如拜占庭般盘根错节的例外与规则。然而，要治理这个世纪的俄罗斯，这些规则必须加以修订、精简和改进。\n\n通过设立#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_russia_patchwork_governance_tooltip_zemstvo 地方自治会#!并处理#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_russia_patchwork_governance_tooltip_obschina 奥勃希纳#!，我们庞大国家的治理可以得以改善，这是一项我们必须立即着手完成的任务。"
 bpm_russia_obschina_empowered:0 "奥勃希纳（强化）"
 bpm_russia_obschina:0 "奥勃希纳"
 bpm_russia_obschina_abolished:0 "奥勃希纳被废除"
 bpm_russia_ad_hoc_governance:0 "治理混乱"
 bpm_russia_zemstvos:0 "设立地方自治会"
 bpm_russia_zemstvos_abolished:0 "削减地方自治会"
 bpm_russia_ig_promoted_obschina:0 "奥勃希纳的捍卫者"
 bpm_russia_rapid_bureaucratic_modernization:0 "迅速官僚现代化"
 je_bpm_russia_patchwork_governance_tooltip_obschina:0 "#v 奥勃希纳#!是俄罗斯农民的自治机构。奥勃希纳能够处理内部纠纷与经济活动；它简化了农民中的地方治安，尤以连坐惩罚见长，并协助贵族进行征税与征兵。\n\n然而，农奴制与土地集体所有制的结合，往往导致#v 切尔诺波洛西察#!——即农民家庭所用的土地被分割成难以管理且相距遥远的零散地块，造成经济效率低下。"
 je_bpm_russia_patchwork_governance_tooltip_zemstvo:0 "#v 地方自治会#!是俄罗斯地方行政的自治机构。由于没有治安权，地方自治会纯粹专注于组织、行政和税收相关事务。\n\n然而，即便是这点微小的权力，也足以让各种进步势力得以施展其力量与影响力——令该国较为保守的贵族大为懊恼。"
 je_bpm_russia_patchwork_governance_abolish_obschina_button:0 "废除奥勃希纳"
 je_bpm_russia_patchwork_governance_abolish_obschina_button_desc:0 "奥勃希纳作为一种制度，曾让我们的农民享有一定程度的自治，并协助我们简化了村庄内的执法。随着我们经济的变迁以及警察力量日趋标准化，这一古老的制度已成为负担而非资产；负担必须被废除。"
 je_bpm_russia_patchwork_governance_empower_obschina_button:0 "强化奥勃希纳"
 je_bpm_russia_patchwork_governance_empower_obschina_button_desc:0 "奥勃希纳是俄罗斯动荡历史中一片暴政之海上的珍贵自由绿洲。民粹派——这一制度最坚定的捍卫者——已经积累了足够的政治资本，使他们的声音得以被听见。奥勃希纳不会被历史洪流冲走——它将是我们自己的、真正俄罗斯的民主制度，是对激进自由主义种种悲剧与失败的进步解毒剂。"
 je_bpm_russia_patchwork_governance_institute_zemstvos_button:0 "设立地方自治会"
 je_bpm_russia_patchwork_governance_institute_zemstvos_button_desc:0 "设立地方自治会——没有执法权的地区自治单位——将极大地提升我们这个庞大国家贯彻其意志的能力，而无需陷入地方治理的琐碎事务。然而，随着自由主义的兴起，这有可能在那些大众治理的温床中扎根，成为一种威胁，因此我们也必须对此保持警惕。"
 je_bpm_russia_patchwork_governance_abolish_zemstvos_button:0 "削减地方自治会"
 je_bpm_russia_patchwork_governance_abolish_zemstvos_button_desc:0 "设立地方自治会惠及了我们的国家——但也并非没有副作用。也许应当通过限制其所拥有的权力来抑制其破坏稳定的倾向。毕竟，它们是为国家服务的，而不是相反。"
 bpm_russia.8.t:0 "迅速的现代化"
 bpm_russia.8.d:0 "随着社会主义者上台，彻底现代化[ROOT.GetCountry.GetName]治理的政治意愿到来了，而这在以往是无法实现的。"
 bpm_russia.8.f:0 "由于沙皇们无力、或许也不愿恰当地重建俄罗斯古老而过时的政府，修复前任政权严重忽视之处的重任，便落到了工人的肩上。"
 bpm_russia.8.a:0 "旧的不去，新的不来！"
 bpm_russia.8.b:0 "我们将现代化——以奥勃希纳为蓝图！"
 bpm_russia_evt_8_warning_old_admin:0 "#blue @information! 若地方自治会未被设立、新近被废除，或奥勃希纳未被改革或废除，此惩罚将加重；这些因素叠加自然会导致更严厉的惩罚#!"
 bpm_russia.9.t:0 "稳步的现代化"
 bpm_russia.9.d:0 "过去数年实施的改革终于收到了成效，使全国各地的治理变得更加完善、更加灵敏。"
 bpm_russia.9.f:0 "来自俄罗斯各地的报告源源不断地传来。都是好消息——农业产量增长、税收改善、信息更加可靠。俄罗斯将永远难以驾驭，但如今这艘国家之船对指令的响应，变得稍微灵敏了些许。"
 bpm_russia.9.a:0 "好极了"
