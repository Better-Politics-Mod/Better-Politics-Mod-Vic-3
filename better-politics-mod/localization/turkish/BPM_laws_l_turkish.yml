# Laws Centralization
 lawgroup_centralization:0 "Merkezileşme"
 lawgroup_centralization_desc:0 "Merkezi hükümet ile yerel hükümetler arasındaki güç dengesini belirleyen yasalar."
 law_unitary:0 "Üniter"
 law_unitary_desc:0 "Üniter bir devlette tüm güç nihayetinde merkezi hükümettedir ve yerel makamlar onun iradesini yerine getirir."
 law_devolved:0 "Yerinden Yönetim (Devolved)"
 law_devolved_desc:0 "Yerinden yönetilen bir devlette gücün neredeyse tamamı merkezi hükümettedir; bu gücün bir kısmı sınırlı bir özyönetim için seçilmiş bölgesel otoritelere devredilir."
 law_federated:0 "Federe"
 law_federated_desc:0 "Federal bir devlette gücün önemli bir kısmı yerel federal tebaalara devredilir. Merkezi hükümet önemli bir etkiye sahip olmaya devam eder, ancak bölgesel güçleri hesaba katmak zorundadır."
 law_confederated:0 "Konfedere"
 law_confederated_desc:0 "Konfedere bir yönetim biçiminde güç yerel otoriteler arasında dağılmıştır; merkezi otorite ya hiç yoktur, ya ismen vardır ya da yetkileri devredilmiştir."
 law_ad_hoc_centralization:0 "Yamalı Yönetim"
 law_ad_hoc_centralization_desc:0 "Bu yönetimin idaresi, çeşitli bölgelerin özerkliği ve ayrıcalıkları konusunda tutarsız, bazen çelişkili politikalar bütününe sahiptir."

# Officer
 bpm_law_effect_tt_officer_law_change:0 "Yeni komutanlara yer açmak için mevcut tüm komutanlarınız kovulacak."
 lawgroup_officers:0 "Subay Kompozisyonu"
 lawgroup_officers_desc:0 "Subayların atanması ve terfi ettirilmesi için kriterler."
 law_noble_officers:0 "Aristokrat Subaylar"
 law_noble_officers_desc:0 "Sadece soylular subay unvanına sahip olabilir."
 bpm_law_effect_tt_noble_officers:0 "Komutanlarınız öncelikle [GetInterestGroupVariant('ig_landowners', GetPlayer).GetName] [Concept('concept_interest_group', 'Çıkar Grubundan')] gelecektir. Ayrıca [Concept('concept_bpm_ig_is_liberal', '$concept_bpm_ig_is_liberal$')], [Concept('concept_bpm_ig_is_right_wing', '$concept_bpm_ig_is_right_wing$')], [Concept('concept_bpm_ig_is_middle_institutional', '$concept_bpm_ig_is_middle_institutional$')] veya [Concept('concept_bpm_ig_is_upper_institutional', '$concept_bpm_ig_is_upper_institutional$')] [Concept('concept_interest_group', 'Çıkar Gruplarından')] da gelebilirler."
 law_purchased_officers:0 "Satın Alınan Komisyonlar"
 law_purchased_officers_desc:0 "Terfiler ve yüksek rütbeler zenginler tarafından satın alınabilir."
 bpm_law_effect_tt_purchased_officers:0 "Komutanlarınız [Concept('concept_bpm_ig_is_liberal', '$concept_bpm_ig_is_liberal$')], [Concept('concept_bpm_ig_is_right_wing', '$concept_bpm_ig_is_right_wing$')], [Concept('concept_bpm_ig_is_middle_institutional', '$concept_bpm_ig_is_middle_institutional$')] veya [Concept('concept_bpm_ig_is_upper_institutional', '$concept_bpm_ig_is_upper_institutional$')] [Concept('concept_interest_group', 'Çıkar Gruplarından')] gelecektir."
 law_professional_officers:0 "Profesyonel Subaylar"
 law_professional_officers_desc:0 "Subaylar liyakatlerine göre atanır ve terfi ettirilir."
 bpm_law_effect_tt_professional_officers:0 "Komutanlarınız öncelikle [Concept('concept_bpm_ig_is_state_institutional', '$concept_bpm_ig_is_state_institutional$')] [Concept('concept_interest_group', 'Çıkar Gruplarından')] gelecektir."
 law_political_officers:0 "Politikleşmiş Subaylar"
 law_political_officers_desc:0 "Devlet, gerekli her yolu kullanarak her subayın sadakatini garanti altına alır."
 bpm_law_effect_tt_political_officers:0 "Komutanlarınız yalnızca [Concept('concept_bpm_ig_is_state_institutional', '$concept_bpm_ig_is_state_institutional$')] [Concept('concept_interest_group', 'Çıkar Gruplarından')] veya şu anda hükümette olan [Concept('concept_interest_group', 'Çıkar Gruplarından')] gelecektir. Bir [Concept('concept_interest_group', 'Çıkar Grubunu')] hükümetten çıkaran herhangi bir hükümet reformu, onun subaylarını da ülkeden uzaklaştıracaktır!"
 law_elected_officers:0 "Seçilmiş Subaylar"
 law_elected_officers_desc:0 "Bu ordudaki subaylar komuta ettikleri askerlerin saflarından seçilir."
 bpm_law_effect_tt_elected_officers:0 "Komutanlarınız yalnızca [Concept('concept_bpm_ig_is_institutional', '$concept_bpm_ig_is_institutional$')] olmayan [Concept('concept_interest_group', 'Çıkar Gruplarından')] gelecektir. Eğer [GetLawType('law_womens_suffrage').GetName] [Concept('concept_law', 'yasasına')] sahipseniz, kadın komutanlarınız da olabilir."

# Taxation

 law_land_based_taxation:0 "Köylü Vergisi"
 law_land_based_taxation_desc:0 "Esas olarak arazi vergileri, ayni vergilendirme, angarya emeği ve sınırlı bir gelir vergisinin herhangi bir kombinasyonu aracılığıyla köylülük üzerinden toplanan geleneksel bir vergilendirme biçimi."
 law_per_capita_based_taxation:0 "Gerileyen Vergi"
 law_proportional_taxation:0 "Orantılı Vergi"
 law_graduated_taxation:0 "Artan Oranlı Vergi"

# Freedom of Speech

 law_traditional_ostracism:0 "Geleneksel Dışlanma"
 law_traditional_ostracism_desc:0 "Sansürü dayatan resmi hiçbir yapı olmamasına rağmen, geleneksel kurumlar mevcut düzeni korumak için baskı uygular."
 law_right_of_assembly:0 "Devlet Medyası"
 law_right_of_assembly_desc:0 "Halk toplanma hakkına ve ifade özgürlüğüne sahiptir; ancak devlet, kendi yayınlarının üretimi ve sanat sponsorluğu yoluyla popüler kültüre müdahale etme hakkını saklı tutar."
 law_protected_speech:0 "Sözlü Müdahale Yok"
 law_protected_speech_desc:0 "Devlet kamusal söyleme müdahale etmez. Toplanma özgürlüğü ve ifade özgürlüğü güvence altına alınmıştır ve kamusal yapılar kendi medyalarını üretmez veya sanatlara önemli ölçüde müdahale etmez."

