l_turkish:

 ################################################# 
 ############## Hristiyan Demokratlar: İdeoloji İsimleri ve Açıklamaları

 ideology_eco_modern_interventionist: "Modern Müdahaleci"
 ideology_eco_modern_interventionist_desc: "#lore Bu grup, bağlılıkları değişkenlik gösterse de modern ve adil müdahaleci politikalara inanmaktadır. Bu politikalar, düzenlemeler ve artan oranlı vergilendirmeden, işyeri demokratikleşmesi ve millileştirme politikalarına, hatta devlet istihdam planlarına kadar uzanır.#!"
 
 ideology_eco_centralized_economy: "Merkezileştirilmiş Ekonomi"
 ideology_eco_centralized_economy_desc: "#lore Bu grup liberal kapitalizmi bir başarısızlık olarak görür ve onu piyasa ekonomisi ile komuta ekonomisinin demokratik bir karışımıyla değiştirmeyi, özel mülkiyeti ise ülke çapındaki ekonomik planlamaya tabi tarım ve küçük ölçekli üretimle sınırlandırmayı hedefler.#!" 

 ideology_sta_regionalized_state: "Tamamlayıcı Devlet (Subsidiary State)"
 ideology_sta_regionalized_state_desc: "#lore Bu grup, gücünü yerel insan topluluklarına dayandıran ve vatandaşlarının haklarını koruyan modern, organik ve tamamlayıcı bir devlete inanır.#!"

 ideology_dop_christian_democrat: "Hristiyan Demokrat"
 ideology_dop_christian_democrat_desc: "#lore Bu grup, Katolik unsurunun ön planda olduğu, evrensel oy hakkı, serbest emek ve devlet gücünün yerelleşmesini sağlamayı amaçlayan radikal demokrasi ilkelerine inanır.#!"

 ideology_cit_christian_internationalist: "Hristiyan Enternasyonalist"
 ideology_cit_christian_internationalist_desc: "#lore Bu grup milletlerin kardeşliğine inanır ve hem iç hem de uluslararası sınırları zayıflatmayı hedefler.#!"

 ideology_dop_conservative_democrat: "Muhafazakar Demokrat"
 ideology_dop_conservative_democrat_desc: "#lore Bu grup demokrasinin önemli bir ilke olduğuna inanır, ancak güçlü ve ihtiyatlı bir yönetim, korporatizm ve dini ahlak kullanarak onu sosyalist tehditten korumayı ve arındırmayı hedefler.#!"

 ideology_dop_divine_democrat: "İlahi Demokrat"
 ideology_dop_divine_democrat_desc: "#lore Bu grup, dini ve siyasi ılımlılığı korumayı amaçlayarak, ihtiyatlı bir şekilde sınırlandırılmış bir demokrasi ile desteklenen ilahi egemenliğe inanır.#!"
 
 ideology_rel_modern_moralist: "Modern Ahlakçı"
 ideology_rel_modern_moralist_desc: "#lore Bu grup, hükümet politikalarının aynı zamanda dini azınlıklar için koruma sağlayan ve yönetimin profesyonel karakterini güvence altına alan dini ahlak ile uyumlu olması gerektiğine inanır.#!"

 bpm_christdem_split.1.t: "Mütevazı Evinizi Savunmak"
 bpm_christdem_split.1.d: "Katolikliğin; kendi gözlerinde günahkar olan modern demokrasi fikirleri, liberal laikleşme ve eğitimin devlet kontrolüne geçmesiyle birleşmesi, Katolik mezhebine mensup olanlar tarafından geniş çaplı bir tepkiye yol açtı.\n\n@ig_christian_democrats! #blue Katolik Çıkarlarını#! düşmanca devlet politikalarından korumaya yönelik siyasi hareketler, seçim siyasetinin dışında ve çeşitli gruplar halinde ortaya çıkmaya ve örgütlenmeye başlıyor. Katoliklerin nüfuzunu sınırlama çabaları artık zor olabilir."
 bpm_christdem_split.1.f: "Ayrıca bugün var olanın yarına ve ötesine kadar yaşamak zorunda olduğuna inanmak, içinde kendimizi rahat hissettiğimiz için ne pahasına olursa olsun bugünü korumak istemek, içinde kendimizi rahatsız hissettiğimiz için bugünde acil bir değişim için çabalamak ve son olarak, bugünün her zaman, gerçekte, yeni bir durumun ortaya çıkışı olduğunu ve bu ortaya çıkışın sürekli olduğunu unutmak da bir hatadır.\n\n— Wojciech Korfanty, 1927"
 bpm_christdem_split.1.a: "Sadakatsiz hoşnutsuzlar."

 bpm_christdem_split.2.t: "Hristiyan Demokratlar"
 bpm_christdem_split.2.d: "Avrupa'da sosyalist ve liberal eğilimlerin yükselişi ile Sanayi Devrimi'nin tüm hızıyla sürmesi, Papa'yı 'Rerum novarum' genelgesini yayımlamaya teşvik etti ve bunun sonucunda @ig_christian_democrats! #blue Hristiyan Demokratlar#! ortaya çıktı.\n\nOldukça bölünmüş olsalar da, genel olarak işçiler için insana yakışır bir geçim kaynağı, sosyal adalet ve demokrasi çağrısında bulunuyorlar; 'tanrısız sosyalizmi' ve 'kana susamış liberalizmi' kınayarak, bunun yerine ekonomi ve devlet için korporatist bir yaklaşım öneriyorlar."
 bpm_christdem_split.2.f: "Zentrum (Merkez) partisinde iki farklı ruh değil, en uç sağdan radikal sola kadar siyasi gökkuşağının tüm renklerinde parıldayan yedi farklı düşünce okulu vardır. Kendi adıma, Zentrum partisinin arabacısının tüm bu farklı ruhları böylesine zarif bir şekilde yönlendirmeyi bildiği ustalığa hayranım.\n\n— Otto von Bismarck, 1890"
 bpm_christdem_split.2.a: "Yeni bir güç mü yoksa idealist hayalperestler mi?"
 bpm_christdem_split.2.b: "İşe yarayabilirler!"
 bpm_christdem_split.2.c: "Onlar bir tehdit!"
 bpm_movement_splits_christdems_tt: "@information! #blue Hristiyan Demokratlar ayrı bir [Concept('concept_interest_group', 'Çıkar Grubu')] olarak var olacaklar.#!"

