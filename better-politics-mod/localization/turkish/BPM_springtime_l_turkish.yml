l_turkish:
# GENEL
 1848.13.t:0 "Aç Kırklar (The Hungry Forties)"
 1848.13.d:0 "1840'ların ortalarından itibaren haşere (blight) ve kötü hasatlar Batı Avrupa'da mahsul verimini düşürdü. Ortaya çıkan kıtlıklar ekonomik krizlerin zincirleme reaksiyonuna neden olacak, yeni doğmakta olan endüstriyel düzeni kargaşaya sürükleyecek ve toplumun her kesiminde siyasi hoşnutsuzluğu tetikleyecekti."
 1848.13.f:0 "Tüm toplumsal düzeninin temel direklerinden biri olan patatesin tehlikede olduğu yönündeki bunaltıcı keşiften henüz yeni yeni kurtulan burjuvazi, şimdi ikinci direği olan pamuğun da tehdit altında olduğunu görüyor. Orta derecede zayıf tek bir pamuk hasadı ve ikincisinin beklentisi, refahın sevinci içinde ciddi bir alarma neden olabiliyorsa; birkaç yıl üst üste pamukta yaşanacak mutlak bir başarısızlık, tüm uygar toplumu kaçınılmaz olarak geçici bir süreliğine barbarlığa geri fırlatacaktır.\n\n—Karl Marx, 1850"
 1848.13.a:0 "Bir fırtına yaklaşıyor."
 1848.13.b:0 "Acil Yardım önlemlerimiz kurbanların sayısını azalttı."

 peoples_springtime.100.t:0 "Kitlelere Boyun Eğmek"
 peoples_springtime.100.d:0 "Dilekçeler ve münazara kulüpleri dönemi sona erdi. Bu sabah erken saatlerde, bir grup protestocu [GetPlayer.GetRuler.GetFullNameWithTitle] ikametgahının dış duvarlarını aşarak 'Ya Özgürlük Ya Ölüm' sloganları attı ve yepyeni bir anayasa talep etti. Neyse ki, sadık muhafızlarımız kalabalığı daha fazla ilerlemeden püskürttü, ancak görünen o ki bu onları daha da öfkelendirdi. Kitleler hayatlarını riske atmaya istekli. Peki ya biz?"
 peoples_springtime.100.f:0 "Bunu yapmalarına izin veriliyor mu?\n\n—I. Ferdinand, 1848"
 peoples_springtime.100.a:0 "Başka seçeneğimiz yok. Yeni bir anayasa taslağı hazırlayın."
 peoples_springtime.100.b:0 "O zaman ölüm."

 peoples_springtime.101.t:0 "Kalıcı Olmayan Devrim"
 peoples_springtime.101.d:0 "Eski rejime karşı kazanılan son zafer, Burjuvazi ve Proletarya koalisyonu tarafından kazanıldı. Koalisyon çoğunluğu olarak Proletarya, devrim işinin büyük kısmını gerçekleştirdi ve şimdi daha da büyük ilerlemeler peşinde koşuyor. Kendi düzeninden korkan Burjuvazi, işçilerin bu küstah kibrinin cezasız kalmayacağına karar verdi."
 peoples_springtime.101.f:0 "Bu ve Almanya'nın 1848-49 yılları arasındaki tarihi beni şu sonuca götürüyor: Avrupa'da hiçbir devrim, en başından itibaren tamamen sosyalist olduğu ilan edilmedikçe başarılı olamaz. Eğer toplumsal meseleler işin içine sadece bir tür bulanık unsur olarak girerse ve arka planda kalırsa; ve eğer bu devrim ulusal yenilenme veya burjuva cumhuriyetçiliği bayrağı altında yürütülürse hiçbir mücadele başarılı olamaz.\n\n—Ferdinand Lassalle, 1849"
 peoples_springtime.101.a:0 "Il faut en finir! (Bitmesi gerek!)"

 peoples_springtime.102.t:0 "[SCOPE.sState('capital_scope').GetCityHubName] Şehrinde Düzen Hakim!"
 peoples_springtime.102.d:0 "Eski rejimin zayıflamış temsilcileriyle birlikte, ılımlı Burjuva devrimcileri kamu düzenini yeniden tesis etmeyi amaçlayan bir dizi acil durum önlemini zorla kabul ettirdi. Bunlar, işçi sınıfı gösterilerinin saldırgan bir şekilde bastırılmasıyla birleştiğinde, Proletarya'nın umutlarını paramparça etti ve Burjuvaziyi yeni devletin tartışmasız diktatörleri olarak taçlandırdı."
 peoples_springtime.102.f:0 "Düzen! Guizot'nun savaş çığlığıydı. Düzen! diye bağırdı Guizotçu Sebastiani, Varşova Rus olduğunda. Düzen! diye bağırıyor Cavaignac, Fransız Ulusal Meclisi'nin ve cumhuriyetçi burjuvazinin acımasız yankısı. Düzen! diye gürledi şarapneli proletaryanın bedenini parçalarken.\n\n—Karl Marx, 1848"
 peoples_springtime.102.a:0 "Normalliğe dönüş."

 peoples_springtime.6.t:0 "İlkbaharın Sonu"
 peoples_springtime.6.d:0 "Devrimci dalga ülkemizde sona erdi. Herhangi bir uzlaşma ya da gerici görünüme rağmen, eski düzenin sonsuza dek silinip gittiği artık herkes için aşikâr."
 peoples_springtime.6.f:0 "Devrim öldü. Çok yaşa devrim!\n\n—Karl Marx, 1850"
 peoples_springtime.6.a:0 "Dünya değişiyor."

#Avusturya
 peoples_springtime.9.t:0 "Macar Diyeti Otorite Talep Ediyor"
 peoples_springtime.9.d:0 "İmparatorluğun yapısında önerilen değişiklikler, Macar elitlerinin önceki özgürlüklerinin çoğunu silerek Viyana ile Peşte'deki diyet arasına bir takoz sokuyor. İkincisi giderek milliyetçi bir hal aldı ve Macaristan Krallığı için resmileştirilmiş bir özerklik çağrısında bulunuyor."
 peoples_springtime.9.a:0 "Onların özerkliği bir ayrıcalıktır!"
 peoples_springtime.9.b:0 "Belki onlara bunu verebiliriz."

 hungarian_revolution:0 "Macar Devrimi"
 milan_revolution:0 "Milano Ayaklanması"
 san_marco_revolution:0 "San Marco Ayaklanması"
 bpm_hungary_union:0 "Bu, Macaristan Krallığı ile St. Stephen (Aziz İstván) Tacı Topraklarını kişisel bir birlik altında ayrı bir devlet olarak bölecektir"

 peoples_springtime.10.t:0 "Peşte'de Kansız Devrim"
 peoples_springtime.10.d:0 "Peşte'de yükselişe geçen liberal fraksiyon, ağır imparatorluk kararnamelerimizi kınadı ve peşindeki büyük bir gösterici grubuyla birlikte imparatorluk valisini istifaya zorladı. Yeni bir Macar hükümeti ilan edildi."
 peoples_springtime.10.f:0 "Çağımızın ruhu Demokrasidir. Her şey halk için ve her şey halk tarafından. Halk olmadan halk hakkında hiçbir şey olmaz... Benim ulusum, doğa yasasının ve doğanın Tanrısının ebedi ilkeleri tarafından dirilişe çağrılarak yükselecektir. Kutsal üç rakamından daha uzun süre mezarda kalmayacak ve Avrupa Kıtasında ulusal bağımsızlığın temel taşı haline gelerek sizin yüce gönüllülüğünüzü gerektirecektir.\n\n—Lajos Kossuth, 1852"
 peoples_springtime.10.a:0 "Vatana ihanetleri cezasız kalmayacak, orduyu toplayın!"
 peoples_springtime.10.b:0 "Macaristan özgür olacak!"

 peoples_springtime.11.t:0 "Milano'nun Beş Günü"
 peoples_springtime.11.d:0 "İmparatorluğu kasıp kavuran devrimle birlikte, Milano'daki İtalyan devrimcileri demir tavındayken vurdular ve Avusturya garnizonlarını şehirden sürdüler."
 peoples_springtime.11.f:0 "Düşman şimdiye kadar bize cephane sağladı, sağlamaya da devam edecektir. Yirmi dört saatlik erzak ve yirmi dört saatlik açlık, ihtiyacımız olan saatten çok daha fazlası olacaktır. Bu akşam, henüz yeni yaptığımız planlar başarılı olursa, tabyaların hattı kırılacaktır. Her ne olursa olsun, ekmeğimiz kalmasa da açlıktan ölmek darağacında ölmekten daha iyidir.\n\n—Carlo Cattaneo, 1848#!"
 peoples_springtime.11.a:0 "Hainler, hepsi hain!"
 peoples_springtime.11.b:0 "Çok yaşa Cumhuriyet!"

 peoples_springtime.12.t:0 "Çok Yaşa San Marco"
 peoples_springtime.12.d:0 "Milanolu devrimciler Venedik'teki yoldaşlarını cesaretlendirdi ve onlar da şimdi eski asude (serene) cumhuriyetin sloganıyla anılan bir cumhuriyet ilan ettiler."
 peoples_springtime.12.f:0 "İtalya'daki herhangi bir yabancı tahakkümünü bir an önce bitirelim. Ülke üzerinde dalgalanan bu üç renkli bayrağı cesaretiniz için kucaklayın ve onun bir daha yırtılmasına asla izin vermeyeceğinize yemin edin.\n\n—Gabrio Casati, 1848"
 peoples_springtime.12.a:0 "Bu delilik ne zaman sona erecek?!"
 peoples_springtime.12.b:0 "Çok yaşa Cumhuriyet!"

 peoples_springtime.13.t:0 "Parçaları Toplamak"
 peoples_springtime.13.t2:0 "Parçaları Tekrar Bir Araya Getirmek"
 peoples_springtime.13.d:0 "Aziz İstván'ın (Saint Stephen) topraklarının elimizden alınmasıyla, çökmek istemiyorsak şimdi topraklarımızı yeniden organize etmeliyiz. Galiçya ve Lodomerya Krallığı, yıkılmış Lehistan-Litvanya Topluluğu'ndan elde edilen bir başka kraliyete bağlı topraktır ve şimdi bize yalnızca dar bir koridorla ve milyonlarca Polonyalı ile Rutenyalı'nın tereddütlü sadakatiyle bağlıdır. Krallığa özerklik vermek, onların bize bağlı kalmasını sağlamanın tek yoludur."
 peoples_springtime.13.d2:0 "YAPILACAK Zafer konuşması yaz"
 peoples_springtime.13.f:0 "Yarım binyıllık bir birlik, tarihin çöplüğünde kayboldu."
 peoples_springtime.13.f2:0 "YAPILACAK"
 peoples_springtime.13.a:0 "Kirden bir imparatorluk."
 peoples_springtime.13.b:0 "Macar Devrimi yenilgiye uğratıldı."
 bpm_gl_union:0 "#gold Galiçya-Lodomerya#! kişisel bir birlik olarak serbest bırakılır."

 peoples_springtime.14.t:0 "Roma'da Papalık Otoritesi Yıkıldı"
 peoples_springtime.14.d:0 "Giderek büyüyen devrimci öfke Papalık Devletleri'ne sıçradı ve papa, muhafazakar hükümete karşı kitlesel protestolar ve ayaklanmalar karşısında Roma'dan kaçtı. Kuzeydeki devrimcilerle dayanışma içinde bir cumhuriyet ilan edildi ve İki Sicilya asker toplamaya başladı."
 peoples_springtime.14.f:0 "Tüm hayatımın eseri yok edildi.\n\n—Klemens von Metternich, 1848#!"
 peoples_springtime.14.a:0 "İtalya yanıyor."

 peoples_springtime.15.t:0 "Avusturya İmparatorluğu'nun Sonu"
 peoples_springtime.15.d:0 "Kaiser ve ailesinin yurtdışına kaçmasıyla Viyana devrimci şevkin son kurbanı oldu. Şimdi başsız kalan imparatorluk, çeşitli yerel konseylerin ve meclislerin güç boşluğunu doldurmasına ve yeni cumhuriyetçi hükümetler ilan etmesine tanık oldu."
 peoples_springtime.15.f:0 "Halkların kurtuluşu ve kefareti düşüncesi \[...\] Özgürleşen ya da serbest bırakılan Batı'nın kardeşleşmesi hedefi için oyumu kullanıyorum. Bu hedefe ulaşılmasıyla Avrupa'da özgürlük ve barış güvence altına alınmış, bu hedefe ulaşılmasıyla Avrupalı devletler ailesinin en büyük ve en akıllıca küfründen arındırılması, yenilmez bir birliktelikte birleşmiş olur.\n\n—Robert Blum, 1848#!"
 peoples_springtime.15.a:0 "Kartal parçalara ayrıldı."
 peoples_springtime.15.b:0 "Yeni bir şey için bir şans..."
 bpm_danubia:0 "Eski Avusturya İmparatorluğu devletler birliği olarak yeniden organize edilecek."


#İtalya
 italian_springtime.1.t:0 "Pellegrino Rossi'nin Suikastı"
 italian_springtime.1.d:0 "Yeni atanan Adalet Bakanı Pellegrino Rossi, Şansölyelik Sarayı'nın basamaklarında bıçaklı bir suikastçının elinde can verdi. Rossi, Papalık hükümetiyle birlikte daha liberal ve bağımsız bir yasama organı kurmak için çalışan liberal bir reformcuydu. Onun ölümü, bunu reform için bir başka felaket niteliğinde başarısızlık veya daha kötüsü Papalık muhafazakarlarının gizli bir saldırısı olarak gören Roma halkını kışkırtıyor."
 italian_springtime.1.f:0 "Tek bir Tanrı;\n\n Tek bir hükümdar, — onun Yasası;\n\n O yasanın tek bir yorumcusu — İnsanlık.\n\n—Giuseppe Mazzini, 1848#!"
 italian_springtime.1.a:0 "Roma'nın üzerinde dumanlar yükselmeye başlıyor."

 italian_springtime.2.t:0 "Papa Gaeta'ya Kaçıyor"
 italian_springtime.2.d:0 "Papa, Roma'yı kasıp kavuran isyanın ardından Napoli'deki Gaeta kalesine kaçtı ve yerine geçecek bakanın bir hükümet kurması çağrısında bulundu; bu çabalar başarısız oldu ve vatandaş meclisleri kontrolü ele aldı."
 italian_springtime.2.f:0 "Kararımızı bilmeyen, sadece sarayları savunmakla kalmayıp, özellikle de yakınınızdaki kişileri savunmak için diğer tüm bakanlarla birlikte çalışan bakan Galletti'yi bilgilendirmeyi, bilinen sağduyu ve dürüstlüğünüze emanet ediyoruz... ancak tüm şehrin huzur ve düzenini bu beylere çok daha fazla tavsiye ediyoruz.\n\n—Papa Pius IX, 1849"
 italian_springtime.2.a:0 "Yeni bir Roma Cumhuriyeti ilan edin!"

 italian_springtime.3.t:0 "Parma Veraseti"
 italian_springtime.3.d:0 "Napolyon'un ikinci eşi Marie Louise'e, Napolyon Savaşlarının sonunda Parma Düşesi unvanı verildi ve Lucca Dükalığı'na sürgün edilen Bourbon-Parma hanedanı yerinden edildi. Şimdi onun ani ölümüyle birlikte dükalık Bourbon-Parma'ya iade edilecek, Lucca ise Toskana yönetimine geri dönecek."
 italian_springtime.3.a:0 "Parma hanedanı geri dönüyor."

 italian_springtime.4.t:0 "Parma Veraseti"
 italian_springtime.4.d:0 "Napolyon'un ikinci eşi Marie Louise'e, Napolyon Savaşlarının sonunda Parma Düşesi unvanı verildi ve Lucca Dükalığı'na sürgün edilen Bourbon-Parma hanedanı yerinden edildi. Şimdi onun ani ölümüyle birlikte dükalık Bourbon-Parma'ya iade edilecek, Lucca ise Toskana yönetimine geri dönecek."
 italian_springtime.4.a:0 "Dükalıklar el değiştiriyor."

 italian_springtime.5.t:0 "Albertine Tüzüğü (Statuto Albertino)"
 italian_springtime.5.d:0 "İtalyan devletlerini kasıp kavuran devrim dalgasıyla birlikte Charles Albert, buna yanıt olarak Sardinya-Piedmont halkına temel demokrasi ve sivil hakları garanti eden bir tüzüğün yayımlanmasını değerlendiriyor."
 italian_springtime.5.f:0 "Mevcut Temel Tüzük'te yer alan geniş ve güçlü temsili kurumların, İtalyan Tacımıza Bize inanç, itaat ve sevgiye dair bu kadar çok kanıt vermiş bir Halkı bağlayan kopmaz şefkat bağlarıyla yeniden birleştirmenin en kesin yolu olduğunu göz önünde bulundurarak; Tanrı'nın Niyetlerimizi kutsayacağı ve özgür, güçlü ve mutlu Ulusun kendisini eski şöhretine her zaman daha layık göstereceği ve görkemli bir geleceği hak edeceği inancıyla bunu onaylamaya ve yürürlüğe koymaya Karar Verdik.\n\n—Kral Charles Albert, 1848#!"
 italian_springtime.5.a:0 "Sadakat, halkın güvenebileceği bir devlete sahip olmasından doğar."
 italian_springtime.5.b:0 "Böyle zamanlarda kraliyet otoritesini zayıflatamayız!"

 italian_springtime.6.t:0 "İtalyan Devrimlerine Müdahale"
 italian_springtime.6.d:0 "İtalyan Bağımsızlık Savaşlarının tüm hızıyla devam ettiği bu dönemde, Avusturya ve tebaasını yarımadadan kovarak İtalya'yı kendi tacımız altında birleştirme fırsatına sahibiz. Ancak Avusturya ve Napoli koalisyonu hala güçlüdür ve zaferin garantisi yoktur."
 italian_springtime.6.f:0 "Eğer Avusturya'ya karşı yeni bir savaş çıkarsa, basit bir asker olarak da olsa hemen koşarak geleceğim; düşmanlarının saflarında, yaratmaya çalıştığım o günün geleceği düşüncesi ve umuduyla eşit derecede yüceleceğim... Ulusun benden daha iyi bir prensi olabilirdi, ama onu daha çok seven biri olamazdı.\n\n—Kral Charles Albert, 1849#!"
 italian_springtime.6.a:0 "L'Italia farà da se (İtalya kendi başının çaresine bakacak)"
 italian_springtime.6.b:0 "Hayır, bırakın devrimciler kendi savaşlarını versinler"

 italian_springtime.7.t:0 "Roma'da Papalık Otoritesi Yıkıldı"
 italian_springtime.7.d:0 "Giderek büyüyen devrimci öfke Papalık Devletleri'ne sıçradı ve papa, muhafazakar hükümete karşı kitlesel protestolar ve ayaklanmalar karşısında Roma'dan kaçtı. Papa krallığımıza kaçtı, Gaeta'daki kaleye sığındı ve bizden müdahale etmemizi talep etti."
 italian_springtime.7.f:0 "Bana Tespih duasını eden bir ordu verin, dünyayı fethedeyim.\n\n—Papa Pius IX#!"
 italian_springtime.7.a:0 "Onurumuz bizi kuzeye yürümeye zorluyor"

 italian_springtime.8.t:0 "Papa İktidara Geri Döndü"
 italian_springtime.8.d:0 "Cumhuriyetin gerici güçler tarafından ezilmesiyle birlikte papa Roma'da yeniden iktidara getirildi."
 italian_springtime.8.f:0 "Toplumsal sorunun ve toplumsal bilimin dünün eseri olmadığına; Kilise ve Devletin, her zaman ve mutlu bir uyum içinde, bu amaç için verimli örgütler yetiştirdiğine; şüpheli ittifaklara rıza göstererek halkın mutluluğuna asla ihanet etmemiş olan Kilise'nin, kendisini geçmişten kurtarmak zorunda olmadığına ikna olsunlar.\n\n—Papa Pius IX#!"
 italian_springtime.8.a:0 "Söndürülen bir alev."

 italian_unification.20.t:0 "Italia Libera (Özgür İtalya)"
 italian_unification.20.d:0 "Avusturyalılara ve onların gerici müttefiklerine karşı galip gelen İtalyan yarımadası artık emperyal yönetimden kurtulmuş durumda."
 italian_unification.20.f:0 "İtalya! Ey İtalya! Sen ki sahip oldun\nŞu ölümcül güzellik armağanına, ki dönüştü\nMevcut ve geçmiş acıların cenaze çeyizine,\nO tatlı alnında utançla sürülmüş keder var,\nVe alevden karakterlerle kazınmış yıllıklar.\n\n—Vicenzo Filicaja, 1723"
 italian_unification.20.a:0 "İtalya kendi başının çaresine bakacaktır!"

 italian_unification.21.t:0 "Konfederasyona Doğru"
 italian_unification.21.d:0 "Avusturya'nın İtalya'dan sürülmesiyle birlikte, yarımadada ortak bir pazar kurarak İtalyan devletlerini daha yakın bir koordinasyon içine getirme fırsatına sahibiz."

 LEGA_ITALICA: "Lega Italica (İtalyan Birliği)"

#Fransa
 je_bpm_july_monarchy:0 "Temmuz Monarşisi"
 je_bpm_july_monarchy_reason:0 "#lore "Bundan böyle bankacılar yönetecek."\n—Jaques Laffitte, 1830#!\n\nTemmuz 1830 devrimi gerici Bourbon Krallığı'nın sonunu getirmiş ve #blue Louis-Philippe I d'Orléans#! yeni bir anayasal monarşinin tahtına oturmuştur. Demokrasiye yönelik bu adıma rağmen, oy kullanma hakkı büyük ölçüde servet ve güce sahip olanlarla sınırlandırıldığı için Fransa'da radikalizm büyümeye devam etmektedir. Krallık hayatta kalmak istiyorsa halkın desteğini sağlamalı ve ulusu istikrara kavuşturmalıdır.\n\nBu Günlük Kaydında (Journal Entry) ilerlemek için, Krallık en az #v 50#! [concept_legitimacy] ile yönetilmeli ve her türlü isyandan kaçınmalıdır. Daha yüksek [concept_legitimacy], Krallığın yönetimini daha hızlı bir şekilde konsolide etmesini sağlayacaktır."

 je_bpm_july_monarchy_paris_turmoil:0 "#N Paris'teki Kargaşa kritik seviyeye yaklaştı!#!"
 je_bpm_july_monarchy_progressing_civil_war: "#N İç savaş mayalanıyor!#!"
 je_bpm_july_monarchy_progressing_fast: "Krallık yönetimini konsolide ediyor."
 je_bpm_july_monarchy_progressing_normal: "Krallık kademeli olarak konsolide oluyor."
 je_bpm_july_monarchy_progressing_slow: "Krallık yavaş yavaş konsolide oluyor."
 je_bpm_july_monarchy_progressing_low_legitimacy: "Hükümet bir #r çıkmazda#!."

 je_bpm_nova_republica:0 "Nova Republica (Yeni Cumhuriyet)"
 je_bpm_nova_republica_reason:0 "#bold Louis Napoleon veya bir Meşruiyetçi lider başkanlığa yükselmeyi başarabilirse, Cumhuriyeti sona erdirme ve kendi şartlarında bir monarşiyi restore etme fırsatına sahip olacaklardır.#!\n\nFransa #yellow ikinci cumhuriyet#! dönemine girerken tarihin çarkı bir kez daha ileriye doğru dönüyor. Önceki monarşinin destekçilerinin hayalleri kayalara çarpıp parçalandı ve yeni aktörler 19. yüzyılda ilerleyen Fransa'yı yeniden şekillendirme fırsatına sahip.\nİlk grup, @ig_liberals! [GetInterestGroupVariant('ig_liberals', GetPlayer).GetName]'den, @ig_socialists! [GetInterestGroupVariant('ig_socialists', GetPlayer).GetName]'e kadar pek çok türden oluşan geniş bir koalisyon olan Cumhuriyeti korumak isteyenlerdir. Ortak noktaları laik ve demokratik bir cumhuriyeti ayakta tutma arzusudur ve eğer bu cumhuriyet birincisinin yolundan gitmeyecekse kalıcı kurumlar ve popüler bir destek tabanı oluşturmak için çok çalışmaları gerekir.\nOrleancılar arka planda kalsalar da monarşizm Fransız siyasetinde hâlâ çok canlıdır. @ig_national_liberals! [GetInterestGroupVariant('ig_national_liberals', GetPlayer).GetName], İmparatorluğu yeniden kurmayı ve Fransa'yı benzersiz bir modern güç olarak şekillendirmeyi umarak popüler Louis Napoleon Bonaparte'ın arkasında toplanıyorlar. @ig_reactionaries! [GetInterestGroupVariant('ig_reactionaries', GetPlayer).GetName] ise Orleancılar gibi bir Bourbon'u tahta geri getirmeyi hedefliyor ancak farklı bir soydan gelen birini. Onlar her şeyden önce Başmuhafazakarlardır ve Kilise gibi geleneksel kurumların desteklediği güçlü bir monarka inanırlar.\n\n#lore "Filozoflar ve devlet adamları İhtilalimizin tarihinden alçakgönüllülük adına değerli bir ders çıkarabilirler; zira hiçbir zaman daha büyük, daha iyi hazırlanmış, daha uzun süre olgunlaşmış ve yine de bu kadar az öngörülmüş olaylar yaşanmamıştır."\n—Alexis de Tocqueville, 1856#!"
 
 bpm_france_july_monarchy.1.t:0 "Broglie Dükü Victor'un İstifası"
 bpm_france_july_monarchy.1.d:0 "Başbakan Broglie Dükü Victor, vergilendirmeyle ilgili bir tasarıyı meclisten geçirememesi üzerine bugün istifasını sundu. Hükümetten ve siyasetten ayrılmasıyla birlikte Direniş Partisi'nin hizipçiliği daha da kötüleşti ve @industrialists! [GetInterestGroupVariant('ig_industrialists', GetPlayer).GetName] partiden tamamen ayrılarak Hareket Partisi'ne katıldı"
 bpm_france_july_monarchy.1.f:0 "Ülkemiz en büyük tehlikelerin tam ortasında ve biz kargaşayla tüm gücümüzle savaşmalıyız. Bir devrimi kurtarmak için, onu kendi aşırılıklarından korumalıyız. İster sokaklarda ister kurumların istismar edilmesinde üretilsin, bu aşırılıkları bastırmaya güç kullanarak ve yasalarla katkıda bulunacağım."
 bpm_france_july_monarchy.1.a:0 "Dük gitti, yerine kim geçecek?"

 bpm_france.1.t:0 "Kral İsyanlar Arasında Tahttan Çekildi"
 bpm_france.1.d:0 "Kral'ın oy hakkını genişletmedeki sürekli başarısızlığına öfkelenen burjuva ve işçi sınıfı radikallerinden oluşan bir koalisyon, peşlerinde isyankar bir Ulusal Muhafız ile Paris sokaklarını bir kez daha barikatlarla doldurdu. Var olan küçük sadık hükümet dağıldı ve müttefiki kalmayan Kral tahttan çekilip ülkeyi terk etmeyi seçti. Bir #yellow İkinci Cumhuriyet#! ilan edildi."
 bpm_france.1.f:0 "O günden itibaren binlerce tuhaf sistem yenilikçilerin zihinlerinden şiddetle fışkırdı ve kalabalığın sorunlu zihinlerine yayıldı. Kraliyet ve parlamento dışında her şey hala ayaktaydı ve devrimin şokuyla toplumun kendisi toza dönüşmüş ve topluma verilmesi gereken yeni şekil rekabete açılmış gibi görünüyordu.\n\n—Alexis de Tocqueville, 1850"
 bpm_france.1.a:0 "Çok yaşa Cumhuriyet!"

 bpm_france.2.t:0 "Halkın Krallığı"
 bpm_france.2.d:0 "Oy kullanma hakkı verilirken düzenin korunması sayesinde Kral, Fransız halkının güvenini ve sadakatini yeniden kazandı. Fransa'nın liberal ve anayasal bir monarşi olarak geleceği şimdilik güvence altına alınmış oldu."
 bpm_france.2.f:0 "Demokrasi kelimesinin gücü öylesine büyüktür ki, bu kelimeyi sancağında yazılı olarak taşımayan hiçbir parti ya da hükümet başını kaldırmaya cesaret edemez ya da kendi varlığını mümkün kılmaz.\n\n—François Guizot, 1849#!"
 bpm_france.2.a:0 "Bir özgürlük krallığı."

 bpm_france.3.t:0 "Bonaparte'ın Darbesi"
 bpm_france.3.d:0 "Louis-Napoléon uzun zamandır geniş bir halk desteğine sahipti, ancak şimdi ulusun başında Fransa'nın dizginlerini ele geçirmek ve onu ihtişama kavuşturmak için uygun konumda!"
 bpm_france.3.f:0 "Bana onların mevcut hükümete bağlı olup olmadıklarını soruyorsunuz; düzeni yeniden tesis ettiği için ona içtenlikle minnettarlar—Bugün Arles'te Roma obeliskinde (dikilitaşında) Louis Napoleon'a ithafen basitçe \"il nous a sauvés de l'Anarchie\" (Bizi anarşiden kurtardı) yazan bir yazıt gördüm—bunun çalışkan sınıfların samimi duygularını ifade ettiğine güvenebilirsiniz. Ancak her şeyden önce, (orduyu besleyen ve Fransa'nın gerçek gücü olan) Fransız köylüsü bu adama bağlıdır ve onu sürdürmeye eğilimlidir çünkü o, her şeyden sonra, köylünün bir şahsiyet haline geldiği ve asla doldurulmamasına kesin olarak karar verdiği, geçmişle ve feodal bir aristokrasiyle olan o nihai kopuşun sembolüdür.\n\n—Matthew Arnold, 1859#!"
 bpm_france.3.a:0 "Çok yaşa İmparator!"
 bpm_france.3.b:0 "Mutlak hüküm sürecek!"

 bpm_france.4.t:0 "Meşruiyetçi (Legitimist) Darbe"
 bpm_france.4.d:0 "Gerici Meşruiyetçiler (Legitimists), cumhurbaşkanlığını ve mecliste önemli bir çoğunluğu ele geçirdikten sonra cumhuriyeti yıkmak için harekete geçtiler ve Meşruiyetçi Bourbon soyunun başını tahta oturttular. Liberaller, sosyalistler ve hatta daha ılımlı bazı monarşistler öfkeli ve gayrimeşru bir restorasyon olarak gördükleri bu duruma karşı direnmeye yemin ediyorlar."
 bpm_france.4.f:0 "Tebaam, zalim sınavlarla öğrendi ki, hükümdarların meşruiyeti ilkesi, toplumsal düzenin temel dayanaklarından biridir,—büyük bir ulusun ortasında, akıllıca ve iyi düzenlenmiş bir özgürlüğün üzerine kurulabileceği tek dayanaktır.\n\n—Louis XVIII, 1815#!"
 bpm_france.4.a:0 "L'État, c'est moi (Devlet benim)"

 bpm_france.5.t:0 "Cumhuriyetin Kökleşmesi"
 bpm_france.5.d:0 "Cumhuriyete yönelik hem Bonapartistlerden hem de Meşruiyetçilerden gelen tehditleri savuşturan Cumhuriyetçiliğin siyasi gerçekliği, Fransız Siyasi yaşamı içinde yerleşmeye başladı. Bonaparte'ın restorasyon girişimleri başarısız oldu, Orleancılar bölündü. Çoğu kişi Cumhuriyetçi bir sistem içinde çalışmaya isteklidir, isteksiz olanlar ise Meşruiyetçilerle bir pakt oluşturur."
 bpm_france.5.f:0 "Kardeşler, kutsal bir dava için,\nHer birimiz şehit düştüğünde,\nBir şikayet sözü etmeyelim,\nFransa bir gün bizi kutsamalıdır.\n\n—Le Chant des Girondins, 1848#!"
 bpm_france.5.a:0 "Liberté, Égalité, Fraternité! (Özgürlük, Eşitlik, Kardeşlik!)"

 bpm_je_springtime_over:0 "Halkların İlkbaharı'nın (Springtime of Peoples) sona ermesinden bu yana 2 yıl geçti."

