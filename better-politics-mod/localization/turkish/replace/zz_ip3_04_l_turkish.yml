subjecthood_events.1.t: "Çokluktan Tekliğe"
subjecthood_events.1.d_1: "[ROOT.GetCountry.GetAdjectiveNoFlag] devletinin [SCOPE.sCulture('relevant_primary_culture').GetName] milliyetçiliğini benimsemesi, [SCOPE.sCulture('relevant_minority_culture').GetName] toplulukları arasında zorla asimile edilme korkularını artırdı. [SCOPE.sLaw('current_law_scope').GetName] yasasını çıkarma yönündeki her türlü girişime karşı muhalefet edeceklerine söz verdiler."
subjecthood_events.1.d_2: "[ROOT.GetCountry.GetAdjectiveNoFlag] devletinin [SCOPE.sCulture('relevant_primary_culture').GetName] ve [SCOPE.sCulture('relevant_primary_culture_2').GetName] milliyetçiliğini benimsemesi, [SCOPE.sCulture('relevant_minority_culture').GetName] toplulukları arasında zorla asimile edilme korkularını artırdı. [SCOPE.sLaw('current_law_scope').GetName] yasasını çıkarma yönündeki her türlü girişime karşı muhalefet edeceklerine söz verdiler."
subjecthood_events.1.d_3: "[ROOT.GetCountry.GetAdjectiveNoFlag] devletinin milliyetçiliği benimsemesi, [SCOPE.sCulture('relevant_minority_culture').GetName] toplulukları arasında zorla asimile edilme korkularını artırdı. [SCOPE.sLaw('current_law_scope').GetName] yasasını çıkarma yönündeki her türlü girişime karşı muhalefet edeceklerine söz verdiler."
subjecthood_events.1.f:1 "Köy halkı uzun zamandır [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] makamının sadık tebaasıydı. Elbette sıkıntılar olmuştu - vergi kaçırma, bireysel isyanlar, hoşnutsuz köylülerin tipik homurdanmaları - ama sonunda hep sadık kalmışlardı. Ve sonra [ROOT.GetCountry.GetCapital.GetCityHubName] merkezinden haber geldi ve beraberinde büyük bir huzursuzluk getirdi. Hükümet artık kararnamelerini [SCOPE.sCulture('relevant_primary_culture').GetNameNoFormatting] dilinde, yani çok azının konuştuğu ve daha da azının okuyabildiği bir dilde yayınlayacaktı. [SCOPE.sCulture('relevant_minority_culture').GetNameNoFormatting] dili artık yeterince iyi kabul edilmeyecekti. Görünüşe göre "Öğrenin", diyorlardı. "Bizim dilimizde konuşun ya da hiç konuşmayın"."
subjecthood_events.1.a: "Neden ilerlemeye direnmekte bu kadar ısrar ediyorlar?"
subjecthood_events.1.b: "Bir kişi hem [SCOPE.sCulture('relevant_minority_culture').GetName] hem de [ROOT.GetCountry.GetAdjectiveNoFlag] olabilir."

subjecthood_events.2.t: "İdeal Vatandaşlık"
subjecthood_events.2.d_1: "[SCOPE.sState('relevant_state').GetCityHubName] salonlarında ulusal vatandaşlığın doğası üzerine tartışmalar ortaya çıktı. [SCOPE.sLaw('current_law_scope').GetName] altındaki [SCOPE.sCulture('relevant_primary_culture').GetName] üstünlüğü vizyonu, daha evrenselci ideallerle çatışmaya başladı."
subjecthood_events.2.d_2: "[SCOPE.sState('relevant_state').GetCityHubName] salonlarında ulusal vatandaşlığın doğası üzerine tartışmalar ortaya çıktı. [SCOPE.sLaw('current_law_scope').GetName] altındaki [SCOPE.sCulture('relevant_primary_culture').GetName] ve [SCOPE.sCulture('relevant_primary_culture_2').GetName] üstünlüğü vizyonu, daha evrenselci ideallerle çatışmaya başladı."
subjecthood_events.2.d_3: "[SCOPE.sState('relevant_state').GetCityHubName] salonlarında ulusal vatandaşlığın doğası üzerine tartışmalar ortaya çıktı. [SCOPE.sLaw('current_law_scope').GetName] altındaki devletin resmi milliyetlerinin üstünlüğü vizyonu, daha evrenselci ideallerle çatışmaya başladı."
subjecthood_events.2.f: ""Binbaşı [SCOPE.sCharacter('name_a_scope').GetLastNameNoFormatting] yine komplo kuruyor."\n\n[SCOPE.sCharacter('name_b_scope').GetFirstNameNoFormatting], arkadaşının başparmağını takip etmek için başını çevirdi. Binbaşı gerçekten de oradaydı, her zamanki üniforması içindeydi. Gerçek bir gizlilik arzusundan ziyade gösteriş olsun diye yanındakiyle bir şeyler tartışmak için ona doğru eğilmişti.\n\n"İşte öyle. "Onur ve sadakat", der hep, "onur ve sadakat". Geçen hafta onunla iyi bir vatandaşı neyin iyi yaptığı hakkında konuştuk ve aynı şeyi söyledi."\n\n"Peki sen ne dedin?""
subjecthood_events.2.a: ""İyi bir vatandaş olmak için, iyi bir [SCOPE.sCulture('relevant_primary_culture').GetCustom('getSingularDemonym')] olunmalıdır.""
subjecthood_events.2.b: ""Elbette haklıydı. Ama her şeyden önce sadakat gelir.""
subjecthood_events.2.c: ""[ROOT.GetCountry.GetAdjectiveNoFormatting] olmak başlı başına bir milliyettir.""

subjecthood_events.3.t: "[SCOPE.sCulture('relevant_primary_culture').GetCustom('getPluralDemonym')] [SCOPE.sCharacter('ruler_scope').GetPrimaryRoleTitle|U]"
subjecthood_events.3.d: "Hükümetin [SCOPE.sLaw('current_law_scope').GetName] yasasını çıkarma çabalarından cesaret alan [SCOPE.sCulture('relevant_primary_culture').GetName] milliyetçileri, [SCOPE.sCharacter('ruler_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('ruler_scope').GetFullName] hazretlerine törenle "[SCOPE.sCulture('relevant_primary_culture').GetCustom('getPluralDemonym')] [SCOPE.sCharacter('ruler_scope').GetPrimaryRoleTitle|U]" unvanını sundular. Bu unvanı kabul etmek, [SCOPE.sCharacter('ruler_scope').GetHerHis] gücünün nihayetinde ulustan geldiği iddiasını meşrulaştıracaktır."
subjecthood_events.3.f: ""Napolyon tacını giydiğinde, 'yalnızca Fransız halkının çıkarı, mutluluğu ve ihtişamı için' yöneteceğine yemin etmişti. Ona gücünü veren ve tüm düşmanlarına karşı zafer kazanmasını sağlayan şey buydu. [SCOPE.sCharacter('ruler_scope').GetPrimaryRoleTitle] isterse, [SCOPE.sCulture('relevant_primary_culture').GetNameNoFormatting] halkını göz önünde bulundurarak aynı şeyi yapabilirdi."\n\n[SCOPE.sCharacter('ruler_scope').GetPrimaryRoleTitle], dilekçe sahibine yüzünde düşünceli bir ifadeyle baktı.\n\n"Peki Napolyon'a ne oldu?"\n\n"O ölümsüz oldu, [SCOPE.sCharacter('ruler_scope').GetCustom('getLadyLordSpouse')|l].""
subjecthood_events.3.a: "Çok yaşa, [SCOPE.sCulture('relevant_primary_culture').GetCustom('getPluralDemonym')] [SCOPE.sCharacter('ruler_scope').GetPrimaryRoleTitle|U]!"
subjecthood_events.3.b: "Güç ulustan değil, [SCOPE.GetRootScope.GetCountry.GetCustom('GetDivinity')]'dan gelir."

subjecthood_events.4.t: "Tebaadan Vatandaşlığa"
subjecthood_events.4.d_1: "[ROOT.GetCountry.GetName] devletinin kademeli olarak bir ulus-devlete dönüşmesi, okullarında yeni bir yurttaşlık müfredatına ihtiyaç duyulmasına neden oldu. Yeni müfredat, [SCOPE.sCulture('relevant_primary_culture').GetName] halkının tarihini diğer ulusların tarihinin üzerine çıkaracaktır."
subjecthood_events.4.d_2: "[ROOT.GetCountry.GetName] devletinin kademeli olarak bir ulus-devlete dönüşmesi, okullarında yeni bir yurttaşlık müfredatına ihtiyaç duyulmasına neden oldu. Yeni müfredat, [SCOPE.sCulture('relevant_primary_culture').GetName] ve [SCOPE.sCulture('relevant_primary_culture_2').GetName] halklarının tarihini diğer ulusların tarihinin üzerine çıkaracaktır."
subjecthood_events.4.d_3: "[ROOT.GetCountry.GetName] devletinin kademeli olarak bir ulus-devlete dönüşmesi, okullarında yeni bir yurttaşlık müfredatına ihtiyaç duyulmasına neden oldu. Yeni müfredat, devletin resmi milliyetlerinin tarihini diğer ulusların tarihinin üzerine çıkaracaktır."
subjecthood_events.4.f: "Öğretmen sordu, "Peki, "bir [SCOPE.sCulture('relevant_primary_culture').GetCustom('getSingularDemonym')] olmak" dediğimde ne kastediyorum?"\n\nÖğrencilerden biri cevaplamak için ayağa kalktı. "Bir [SCOPE.sCulture('relevant_primary_culture').GetCustom('getSingularDemonym')] olmak gururlu olmaktır, onurlu olmaktır ve halkımızı savunmaktır. [SCOPE.GetRootScope.GetCountry.GetCustom('GetDivinity')]'a ve [SCOPE.sCulture('relevant_primary_culture').GetNameNoFormatting] ulusuna hizmet etmek, [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] ve bakanlarına saygı duymaktır."\n\nÖğrenci, odanın köşesindeki portre ressamı tuvalinin arkasından bakana kadar kaskatı durdu.\n\n"Aferin, [SCOPE.sCharacter('name_a_scope').GetFirstNameNoFormatting]. Oturabilirsin.""
subjecthood_events.4.a: "Bu değişiklikler için gereken tüm fonları sağlayın."
subjecthood_events.4.b: "Daha yavaş bir süreç hazinemizin üzerindeki yükü hafifletir."
subjecthood_events.4.c: "[SCOPE.sState('claim_state').GetName] tarihi ilk dersleri olabilir."
neighbouring_state_claimable_tt: "Sahip olunmayan komşu tüm [concept_state] (Eyaletler), herhangi bir [ROOT.GetCountry.GetAdjectiveNoFlag] [Concept('concept_primary_cultures','$concept_primary_culture$')] (Birincil Kültürünün) [concept_homeland] (Anayurdudur)"

subjecthood_events.5.t: "Giyotin Anıları"
subjecthood_events.5.d: "Hükümetin vatandaşlık reformu, [GetPopType('aristocrats').GetName] ve [GetPopType('clergymen').GetName] arasında devrimci aşırılıkların hayaletini uyandırdı. Eşit vatandaşlık uğruna geleneksel unvanlarının ellerinden alınmasından korkuyorlar."
subjecthood_events.5.f: ""Bu tamamen doğa dışı. Günahkarca diyebilirim - hem günahkarca hem de #italic yabancı#!. Atalarım bu topraklara bin yıldır hükmetti ve [ROOT.GetCountry.GetCapital.GetCityHubName] içindeki o işgüzarlar tüm düzeni yıkmak istiyor. Benim "#italic Vatandaş#! [SCOPE.sCharacter('name_a_scope').GetLastNameNoFormatting]" olarak anılmamı mı istiyorlar? Bu, her şeyin sonudur."\n\nSürücü, gözlerini sıkıca önlerindeki yola dikmiş halde başını salladı. Belki de bir sonraki çukur ikisini birden yutacaktı.\n\nLord devam etti, "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]'ın o lanet olası yeni bakanlar tarafından tamamen yoldan çıkarıldığını söyleyebilirim. Halktan kişileri atamanın sonu budur!""
subjecthood_events.5.a: "Hayaletleri görünce bayılmaları onlar için fazla tipik."
subjecthood_events.5.b: "Onlar [SCOPE.sCulture('relevant_primary_culture').GetName] ulusu içinde birincidirler."
subjecthood_events.5.c: "Evet, tüm bunların gitme vakti geldi."

