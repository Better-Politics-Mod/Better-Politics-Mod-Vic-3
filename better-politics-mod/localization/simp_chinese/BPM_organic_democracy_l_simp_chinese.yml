l_simp_chinese:
 law_organic_democracy:0 "有机民主"
 law_organic_democracy_desc:0 "各种传统的“器官”——如家庭、工作场所、市镇或社区——自行治理其事务，并选举代表进入立法机构。不存在任何政党或意识形态组织。"
 ideology_dop_organic_democrat:0 "有机民主主义者"
 ideology_dop_organic_democrat_desc:0 "#lore 该群体信仰一种以社会片段为基础、实行自我治理的有机民主，拥有充分的迁徙与结社自由。#!"
 ig_national_conservatives_catholic:0 "民族保守主义者"
 ig_national_conservatives_catholic_desc:0 "天主教民族保守主义者是一个名目繁多、观点各异的松散群体，但总体上处于天主教思想的右翼。他们主张拆除自由主义制度，代之以有机民主国家与法团主义。历史上这是一个宽泛的概念：从葡萄牙的国家法团主义萨拉查主义者，到法国保皇派的“法兰西行动”，再到意大利无产阶级的ANI，乃至奥地利乌托邦式的“社会浪漫派”和波兰分配主义的“青年民族派”，不一而足。"
 je_bpm_clay_forming_an_organism:0 "黏土成形为有机体"
 je_bpm_clay_forming_an_organism_reason:0 ""
 je_bpm_clay_forming_an_organism_status_consolidating_power:0 "巩固权力"
 concept_bpm_ig_is_organicist:0 "有机主义者"
 concept_bpm_ig_is_organicist_desc:0 "@ig_christian_democrats! #bold 基督教民主主义者#!、@ig_reactionaries! #bold 反动主义者#! 和 @ig_fascists! #bold 法西斯主义者#! [Concept('concept_interest_group', '利益集团')]。他们相信人类社会如同一个有机体，而个体的人如同有机体的细胞——寻求在国家中赋予这些细胞权力，或使其成为国家的一部分。"
