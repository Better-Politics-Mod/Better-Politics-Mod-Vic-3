l_simp_chinese:
 bpm_natlib_split.1.t:0 "民族国、法治国、思想国"
 bpm_natlib_split.1.d:0 "随着激进派的民族主义淡出记忆，一种全新的民族主义已经崛起取而代之。在整个德意志，资本家和工人纷纷聚集到 @ig_national_liberals! #yellow 民族自由党#! 的旗帜下。他们承诺公民自由、强大的国家、安稳的生计，以及最重要的——建立在德意志唯心主义伟大传统之上的统一德国。"
 bpm_natlib_split.1.f:0 "源自政治权威的行为是一种普遍的行为，凭借其真正的普遍性，它自身也蕴含着其适用的规则。它所指向的对象是普遍的，并与自身同一。政治权威的行为赋予了一种自由而普遍的确定性，它的执行同时就是它的适用。由于它所适用的对象无法加以区分，它的适用必须在行为本身中被界定，并且没有任何顽固或异质的材料会对其适用构成抵抗。\n\n——G.W.F. 黑格尔，1802 年"
 bpm_natlib_split.1.a:0 "理性永远向前迈进！"
 bpm_natlib_split.2.t:0 "民族自由党"
 bpm_natlib_split.2.d:0 "随着激进派的民族主义淡出记忆，一种全新的民族主义已经崛起取而代之。在我们的国家，资本家和工人如今纷纷聚集到 @ig_national_liberals! #yellow 民族自由党#! 的旗帜下。他们承诺一个由人民支持的强大国家、为人民提供的安稳生计，以及最重要的——一个在世界舞台上昂首挺立的统一民族。"
 bpm_natlib_split.2.f:0 "源自政治权威的行为是一种普遍的行为，凭借其真正的普遍性，它自身也蕴含着其适用的规则。它所指向的对象是普遍的，并与自身同一。政治权威的行为赋予了一种自由而普遍的确定性，它的执行同时就是它的适用。由于它所适用的对象无法加以区分，它的适用必须在行为本身中被界定，并且没有任何顽固或异质的材料会对其适用构成抵抗。\n\n——G.W.F. 黑格尔，1802 年"
 bpm_natlib_split.2.a:0 "不统一，毋宁死！"
 bpm_natlib_split.3.t:0 "民族自由党"
 bpm_natlib_split.3.d:0 "随着激进派的民族主义淡出记忆，一种全新的民族主义已经崛起取而代之。在我们的国家，资本家和工人如今纷纷聚集到 @ig_national_liberals! #yellow 民族自由党#! 的旗帜下。他们承诺一个由人民支持的强大国家、为人民提供的安稳生计，以及一个在世界舞台上昂首挺立的现代民族。"
 bpm_natlib_split.3.f:0 "有些并非真正男子汉的人，会喜爱自己身上的其他东西；但真正的男子汉相信，他的荣誉比他的生命更宝贵；而一个民族，不过就是我们所有人的总和，民族的荣誉比民族的安逸、民族的和平乃至民族的生命本身都更加宝贵。\n\n——伍德罗·威尔逊，1916 年"
 bpm_natlib_split.3.a:0 "万岁！"
 bpm_natlib_split.4.t:0 "波拿巴主义的回归"
 bpm_natlib_split.4.d:0 "老拿破仑长眠于墓中，他的继承者们却挣扎着爬回生者的世界。在那里，他们发现了一座古老而衰败的巴黎，四周是一个四分五裂、贫困与绝望横行的国家。大失所望之下，他们把目光投向自己的领袖——#blue 路易·拿破仑·波拿巴#!，此人身上挂着两次政变的战绩，镀满曾激励了整整一代法国人的荣光。\n\n尽管如今他们遭到上流社会绅士们的嘲笑，但很快，人民将决定自己是否终究还是更偏爱波拿巴的铁腕。"
 bpm_natlib_split.4.f:0 "黑格尔在某个地方说过，一切伟大的世界历史事变和人物，可以说都出现两次。他忘记补充一句：第一次是作为悲剧，第二次是作为闹剧。\n\n——卡尔·马克思，1852 年"
 bpm_natlib_split.4.a:0 "那只火鸡是什么时候出狱的！？"
 bpm_natlib_split.5.t:0 "实证主义者"
 bpm_natlib_split.5.d:0 "随着激进派的民族主义淡出记忆，一种全新的民族主义已经崛起取而代之。在我们的国家，实业家和工人如今纷纷聚集到 @ig_national_liberals! 实证主义的旗帜下，它承诺一个由人民支持的强大国家、为人民提供的安稳生计，以及一个在世界舞台上昂首挺立的现代化民族。"
 bpm_natlib_split.5.f:0 "统一的首要条件是一个主观原则；而在实证体系中，这一原则便是理智对情感的从属：没有这一点，我们所追求的统一——无论是个体的还是集体的——就永远无法建立在永久的基础上。对于像我们这样复杂的有机体，必须有一种足够强大的影响力，才能在种种异质且常常相互对立的倾向中促成汇聚。\n\n——奥古斯特·孔德，1844 年"
 bpm_natlib_split.5.a:0 "爱、秩序与进步！"
 bpm_fascist_split.1.t:0 "法西斯主义者"
 bpm_fascist_split.1.d:0 "一股新的反动势力崛起了，@ig_fascists! 法西斯主义者。这是一场极端民族主义运动，他们主张建立一个以阶级合作为基础、对民族绝对忠诚的国家。"
 bpm_fascist_split.1.f:0 "大众有权改变财产关系；法西斯主义力图在保留财产的同时赋予他们表达。法西斯主义的合乎逻辑的结果，是把美学引入政治生活。法西斯主义以其元首崇拜强迫大众屈膝，这种对大众的践踏，与对一种被驱使去生产仪式价值的机器的践踏，恰相对应。\n\n——瓦尔特·本雅明，1936 年"
 bpm_fascist_split.1.a:0 "民族昂首向前！"
