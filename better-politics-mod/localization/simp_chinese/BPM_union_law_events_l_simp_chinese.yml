l_simp_chinese:
 bpm_union_laws.1.t:0 "工会？"
 bpm_union_laws.1.desc:0 "随着我们城市的壮大，栖身其中的那些可恶的煽动者也在增多。@trade_unions_bpm! 工会此前不过是个微不足道的麻烦，但如今我们的工业巨头们报告了令人担忧的有组织破坏、煽动叛乱，甚至更糟——#r 社会主义#! 的事件。看来我们睁一只眼闭一只眼的政策必须到此为止了，否则它们将毁掉我们骄傲国家的经济与道德肌理。"
 bpm_union_laws.1.f:0 "工人为提高工资而结社，可从两方面来看待；其一是为了自利……其二是为了损害那些不加入其社团的人。法律对两者都予以谴责。\n\n——《马萨诸塞州诉普利斯案》审理记录，1806"
 bpm_union_laws.1.a:0 "彻底取缔它们！"
 bpm_union_laws.1.b:0 "允许它们，但限制其活动。"
 bpm_union_laws.1.c:0 "国家应该将其收编！"
 bpm_union_laws.1.d:0 "转念一想，谁在乎呢？"
 communism.1.a:1 "为他们的劳动提供更高的工资。"
 communism.1.b:1 "让最后的奴隶主就此解脱。"
 communism.1.c:1 "保证工人更好的条件。"
 communism.1.d:1 "取消对有组织劳工的限制。"
 communism.1.e:1 "我们绝不投降！"
