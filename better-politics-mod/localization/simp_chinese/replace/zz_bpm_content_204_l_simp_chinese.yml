l_simp_chinese:
 je_south_american_national_identity_emergence_reason:0 "[ROOT.GetCountry.GetName]从西班牙独立后，全国上下涌起了民族主义的呼声。随着我国迈向未来，我们的知识分子试图构建一种全新的身份认同，一种独特且仅属于[SCOPE.sCulture('new_national_culture').GetName]的身份。\n\n以下条件将有助于推动我们 #bold 民族认同#! 的形成进程：\n• 支持[GetLawType('law_repeatable_culture_promote_patriotic_values').GetName]、且[concept_in_government]或拥有高[concept_clout]的[Concept('concept_interest_group','$concept_interest_groups$')]\n• 拥有高[concept_war_support]的进行中的[Concept('concept_war','$concept_wars$')]\n• 拥有高[concept_occupancy]的[GetBuildingType('building_university').GetName]、[GetBuildingType('building_art_academy').GetName]和[GetBuildingType('building_government_administration').GetName]建筑\n• 高国家[concept_prestige]\n• 不拥有非[SCOPE.sCulture('old_national_culture').GetName]的[Concept('concept_homeland','$concept_homelands$')]\n• 颁布[GetLawType('law_repeatable_culture_promote_patriotic_values').GetName]\n\n预计这场 #bold 民族觉醒#! 的进度将在下个月推进 #tooltippable;tooltip:[Country.GetTooltipTag],je_south_american_national_identity_emergence_special_tooltip [Country.MakeScope.Var('national_identity_progress_var_next').GetValue|+=]#!。\n\n@warning! 完成此[concept_journal_entry]将使[ROOT.GetCountry.GetName]无法再追求 #bold 更宏大的泛民族抱负#!"
 je_south_american_national_identity_emergence_special_tooltip:0 "该速率由以下因素决定：\n#variable [Country.MakeScope.Var('national_identity_progress_from_igs').GetValue|+=]#! 来自支持[GetLawType('law_repeatable_culture_promote_patriotic_values').GetName]的[Concept('concept_interest_group','$concept_interest_groups$')]的[concept_clout]\n#variable [Country.MakeScope.Var('national_identity_progress_from_wars').GetValue|+=]#! 来自进行中的[Concept('concept_war','$concept_wars$')]\n#variable [Country.MakeScope.Var('national_identity_progress_from_universities').GetValue|+=]#! 来自[GetBuildingType('building_university').GetName]、[GetBuildingType('building_art_academy').GetName]和[GetBuildingType('building_government_administration').GetName]建筑\n#variable [Country.MakeScope.Var('national_identity_progress_from_prestige').GetValue|+=]#! 来自[concept_prestige]\n#variable [Country.MakeScope.Var('national_identity_progress_from_homelands').GetValue|+=]#! 来自拥有非[Concept('concept_primary_cultures','$concept_primary_culture$')]的[Concept('concept_homeland','$concept_homelands$')]\n#variable [Country.MakeScope.Var('national_identity_progress_from_law').GetValue|+=]#! 来自[GetLawType('law_repeatable_culture_promote_patriotic_values').GetName]\n#variable [Country.MakeScope.Var('national_identity_progress_var_add').GetValue|+=]#! 来自其他效果"
