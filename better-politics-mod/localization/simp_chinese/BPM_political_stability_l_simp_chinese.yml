 bpm_political_stability_baseline_tooltip:0 "这一基准值主要受国家所拥有的[Concept('concept_law', '法律')]影响（传统主义与压制性法律会使其趋向更高的稳定度），此外还受[Concept('concept_radical', '激进派')]与[Concept('concept_loyalist', '忠臣')]的存在，以及进行中的[Concept('concept_revolution', '革命')]、[Concept('concept_war', '战争')]或[Concept('concept_election', '选举')]的影响。$bpm_political_stability_baseline_value_tt$"
