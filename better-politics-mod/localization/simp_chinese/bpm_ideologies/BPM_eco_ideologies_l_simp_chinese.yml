l_simp_chinese:
 ideology_eco_artisan:0 "手工艺者"
 ideology_eco_artisan_desc:0 "#lore 该群体信奉一种以本地熟练生产为核心的手工艺经济。 #!"
 ideology_eco_laissez_faire:0 "自由放任"
 ideology_eco_laissez_faire_desc:0 "#lore 该群体信奉在较少国家力量干预时能最优化运作的市场经济。 #!"
 ideology_eco_interventionist:0 "干预主义"
 ideology_eco_interventionist_desc:0 "#lore 该群体信奉一种受到一定程度国家干预影响的市场经济。 #!"
 ideology_eco_traditional_agrarian:0 "传统农本主义"
 ideology_eco_traditional_agrarian_desc:0 "#lore 该群体希望维持传统且以农业为主的经济。在无法做到的地方，他们希望通过国家限制工业化。 #!"
 ideology_eco_modern_agrarian:0 "现代农本主义"
 ideology_eco_modern_agrarian_desc:0 "#lore 该群体代表现代商业农民的利益。他们可能感到受城市化与自由贸易的威胁，并会通过国家干预来捍卫自身利益。 #!"
 ideology_eco_agrarian_socialist:0 "农本社会主义"
 ideology_eco_agrarian_socialist_desc:0 "#lore 该群体代表广泛的立场，总体上都偏好乡村土地的平等或公有所有权。 #!"
 ideology_eco_autarky:0 "自给自足"
 ideology_eco_autarky_desc:0 "#lore 该群体追求经济独立，将强有力的经济管理视为国家的一项核心职能。 #!"
 ideology_eco_socialist_autarky:0 "社会主义自给自足"
 ideology_eco_socialist_autarky_desc:0 "#lore 该群体追求摆脱资本主义国家的经济独立，将国家对经济的强力管理和集体化视为实现社会主义的必要中间步骤。 #!"
 ideology_eco_agrarian_autarky:0 "农本自给自足"
 ideology_eco_agrarian_autarky_desc:0 "#lore 该群体追求摆脱外国的经济独立，将发展强大而独立的农民阶级视为国家自强的根本。 #!"
 ideology_eco_socialist_mixed_economy:0 "社会主义混合经济"
 ideology_eco_socialist_mixed_economy_desc:0 "#lore 该群体寻求将市场经济与一定程度的国家干预和合作所有制相融合，作为实现社会主义的中间步骤。 #!"
 ideology_eco_proletarian_economy:0 "无产阶级经济"
 ideology_eco_proletarian_economy_desc:0 "#lore 该群体寻求最大限度地实现合作管理以及对生产资料的所有。 #!"
 ideology_eco_serf_economy:0 "农奴经济"
 ideology_eco_serf_economy_desc:0 "#lore 该群体寻求保留依附于大庄园的农民农奴的传统结构。 #!"
 ideology_eco_trad_isolationist:0 "孤立主义农奴经济"
 ideology_eco_trad_isolationist_desc:0 "#lore 该群体寻求保留依附于大庄园的农民农奴的传统结构，并彻底排斥外国人。 #!"
 ideology_eco_slave_economy:0 "奴隶经济"
 ideology_eco_slave_economy_desc:0 "#lore 该群体寻求保留奴隶制。 #!"
 ideology_eco_antebellum_economy:0 "战前经济"
 ideology_eco_antebellum_economy_desc:0 "#lore 该群体寻求保留奴隶制和自由贸易。 #!"
 ideology_eco_modernizer:0 "经济现代化派"
 ideology_eco_modernizer_desc:0 "#lore 该群体寻求使经济现代化。"
 ideology_eco_conservative_agrarian:0 "保守农本主义"
 ideology_eco_conservative_agrarian_desc:0 "#lore 该群体代表现代贵族农民的利益。他们可能感到受城市化与自由贸易的威胁，并会通过国家干预来捍卫自身利益。 #!"
 ideology_eco_american_system:0 "美国体制"
 ideology_eco_american_system_desc:0 "#lore 该群体寻求通过保护性关税、内部改良和国家银行来促进国民经济，同时对奴隶制保持暧昧态度。 #!"
 ideology_eco_debt_serf_economy:0 "债务农奴经济"
 ideology_eco_debt_serf_economy_desc:0 "#lore 该群体寻求保留依附于大庄园、且带有债务奴役的农民农奴的传统结构。 #!"
 ideology_eco_colonialist:0 "殖民主义经济"
 ideology_eco_colonialist_desc:0 "#lore 该群体代表依赖持续从其领地榨取财富的殖民利益，并倾向于维持这一体系而非独立的经济开发。 #!"
 ideology_eco_slave_colonialist:0 "奴隶殖民主义经济"
 ideology_eco_slave_colonialist_desc:0 "#lore 该群体代表依赖以奴隶持续从其领地榨取财富的殖民利益，并倾向于维持这一体系而非独立的经济开发。 #!"
 ideology_eco_colonial_slavery_supporter:0 "殖民奴隶制支持者"
 ideology_eco_colonial_slavery_supporter_desc:0 "#lore 该群体代表从殖民奴隶劳动中获益的保守土地所有者的经济利益。他们寻求在殖民地保留奴隶制，但不愿在本土恢复奴隶制。 #!"
