 POLITICAL_MOVEMENT_RADICALISM_TOOLTIP:3 "#header [concept_activism] in the [PoliticalMovement.GetNameNoIcon]#!\nSome Movements require #v 10%#! support to Revolt, while others require #v 15%#!. The Anarchists need #v 30%#! for a mass spontaneous uprising. The Socialist and Communist movements require 25 and 50 Labor Consciousness respectively.\n[SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(PoliticalMovement.GetRadicalism, '(CFixedPoint)0.5'), 'ACTIVISM_RED_ICON', 'ACTIVISM_ICON')] [LabelingHelper.GetLabelForRadicalism(PoliticalMovement.GetRadicalism)] ($POLITICAL_MOVEMENT_RADICALISM_WITHOUT_LABEL$)\n$TOOLTIP_DELIMITER$\n#title This $concept_activism_short$ is predicted to drift towards #b [LabelingHelper.GetLabelForRadicalism(PoliticalMovement.GetTargetRadicalism)]#! (#tooltippable #tooltip:[PoliticalMovement.GetTooltipTag],POLITICAL_MOVEMENT_RADICALISM_BREAKDOWN [SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(PoliticalMovement.GetTargetRadicalism, '(CFixedPoint)1'), 'POLITICAL_MOVEMENT_TARGET_RADICALISM_WITHOUT_LABEL_RED', 'POLITICAL_MOVEMENT_TARGET_RADICALISM_WITHOUT_LABEL')]#!#!):#! #indent_newline:3 \n[PoliticalMovement.GetTargetRadicalismDesc]"

 BPM_ACTIONS_TAB: "Actions"
 BPM_COALITION_TAB: "Coalition Actions"
 BPM_ACTION_REVOLT_PROGRESS_VALUE: "#v [ScriptContainer.MakeScope.Var('bpm_revolt_progress').GetValue|0]%#!"
 BPM_ACTION_CLOUT_VALUE: "Clout: #v [ScriptContainer.MakeScope.ScriptValue('bpm_action_total_clout_gui')|%1]#!"
 BPM_ACTION_CLOUT_TT: "The combined [concept_clout] of all [concept_interest_group]s actively involved in this action: #v [ScriptContainer.MakeScope.ScriptValue('bpm_action_total_clout_gui')|%1]#!"
 BPM_ACTION_REVOLT_CELLS_VALUE: "#v [ScriptContainer.MakeScope.ScriptValue('bpm_number_of_states_with_cells')|0]#!"
 BPM_ACTION_REVOLT_CELLS_TT: "This revolution has #gold revolutionary cells#! in #v [ScriptContainer.MakeScope.ScriptValue('bpm_number_of_states_with_cells')|0]#! states."
 BPM_ACTION_REVOLT_ITEM_TT: "#tooltip_header [Localize(Concatenate(ScriptContainer.MakeScope.Var('bpm_action_type').GetFlagName, '_name'))]#!\n$TOOLTIP_DELIMITER$\nProgress: $BPM_ACTION_REVOLT_PROGRESS_VALUE$\n$BPM_ACTION_CLOUT_VALUE$\nStates with cells: $BPM_ACTION_REVOLT_CELLS_VALUE$\n\nNext month, each cell grows with a chance factor of #v [GuiScope.SetRoot(ScriptContainer.MakeScope).AddScope('action', ScriptContainer.MakeScope).ScriptValue('bpm_cell_growth_chance')|0]#!."
 bpm_action_revolt: "bpm_action_revolt"
 bpm_action_revolt_name: "Revolting"
 bpm_action_take_down_coalition: "bpm_action_take_down_coalition"
 bpm_action_take_down_coalition_name: "Take Down the Coalition"
 bpm_action_take_down_coalition_desc: "$bpm_action_take_down_coalition_name$"
 BPM_ACTION_TAKE_DOWN_COALITION_ITEM_TT: "#tooltip_header $bpm_action_take_down_coalition_name$#!\n$TOOLTIP_DELIMITER$\n$BPM_ACTION_CLOUT_VALUE$\n\nWhile this action is active, the [GetLawType('law_repeatable_special_take_down_coalition').GetName] [concept_law] can be brought forward, and it climbs the agenda in proportion to the [concept_clout] involved.\n\nAn [concept_interest_group] joins when it is #red Unhappy#! or worse. A group that is [concept_powerful] or has more [concept_clout] than the [concept_bpm_ruling_ig] only joins if it cannot initiate or join a take-over. There is only ever one such action: every willing group joins it. After an attempt is voted on, none can be started for #v 1#! year."
 bpm_action_take_over_rig: "bpm_action_take_over_rig"
 bpm_action_take_over_rig_name: "Replace the Ruling Coalition"
 bpm_action_take_over_rig_desc: "$bpm_action_take_over_rig_name$"
 BPM_ACTION_TAKE_OVER_RIG_ITEM_TT: "#tooltip_header $bpm_action_take_over_rig_name$#!\n$TOOLTIP_DELIMITER$\nProposed new [concept_bpm_ruling_ig]: #v [ScriptContainer.MakeScope.Var('bpm_action_initiator').GetInterestGroup.GetName]#!\n$BPM_ACTION_CLOUT_VALUE$\n\nWhile this action is active, the [GetLawType('law_repeatable_special_take_over_rig').GetName] [concept_law] can be brought forward, and it climbs the agenda in proportion to the [concept_clout] involved. If it passes, the challenger becomes the [concept_bpm_ruling_ig] and everyone who voted for it forms the new coalition.\n\nOnly possible in a #gold Parliamentary System#!. An [concept_interest_group] joins when it is #green Friendly#! with the challenger and not #green Friendly#! with the [concept_bpm_ruling_ig], or #red Hostile#! with the [concept_bpm_ruling_ig] and at least #grey Neutral#! with the challenger. There is only ever one such action, and after an attempt is voted on, none can be started for #v 1#! year."
 BPM_ACTION_ITEM_TT: "[SelectLocalization(EqualTo_string(ScriptContainer.MakeScope.Var('bpm_action_type').GetFlagName, 'bpm_action_revolt'), 'BPM_ACTION_REVOLT_ITEM_TT', 'BPM_ACTION_NON_REVOLT_ITEM_TT')]"
 BPM_ACTION_NON_REVOLT_ITEM_TT: "[SelectLocalization(EqualTo_string(ScriptContainer.MakeScope.Var('bpm_action_type').GetFlagName, 'bpm_action_take_over_rig'), 'BPM_ACTION_TAKE_OVER_RIG_ITEM_TT', 'BPM_ACTION_TAKE_DOWN_COALITION_ITEM_TT')]"
 BPM_IG_UNHAPPY_THRESHOLD_TT: "#tooltip_header Unhappy#!\n$TOOLTIP_DELIMITER$\nLights up when this [concept_interest_group] has #red Unhappy#! [concept_approval] or worse.\n\nIt may then join the action to #v $bpm_action_take_down_coalition_name$#!. If it is [concept_powerful] or has more [concept_clout] than the [concept_bpm_ruling_ig], it will pursue a take-over instead when it can."
 BPM_IG_ANGRY_THRESHOLD_TT: "#tooltip_header Angry#!\n$TOOLTIP_DELIMITER$\nLights up when this [concept_interest_group] has #red Angry#! [concept_approval].\n\nIt will then never support a coalition negotiation and may join a #v $bpm_action_revolt$#!."
 BPM_IG_APPROVAL_BREAKDOWN: "$IG_APPROVAL_BREAKDOWN$\n\n[SelectLocalization(GetScriptedGui('bpm_ig_in_action_gui').IsShown(GuiScope.SetRoot(InterestGroup.MakeScope).End), 'BPM_IG_ACTION_ATTRACTION_LINE', 'BPM_IG_NO_ACTION_LINE')]"
 BPM_IG_ACTION_ATTRACTION_LINE: "Supporting #b [Localize(Concatenate(InterestGroup.MakeScope.Var('bpm_action').Var('bpm_action_type').GetFlagName, '_name'))]#!, attraction: #tooltippable #tooltip:[InterestGroup.GetTooltipTag],BPM_IG_ACTION_ATTRACTION_BREAKDOWN [InterestGroup.MakeScope.ScriptValue('bpm_ig_current_action_attraction')|1]#!#!"
 BPM_IG_NO_ACTION_LINE: "#tooltippable #tooltip:[InterestGroup.GetTooltipTag],BPM_IG_ACTION_ATTRACTION_BREAKDOWN Not supporting any action#!#!"
 BPM_IG_ACTION_ATTRACTION_BREAKDOWN: "#header Action Attraction#!\nThe [InterestGroup.GetName] support the available action they are most attracted to, if any is above #v 0#!.\n$TOOLTIP_DELIMITER$\n#b $bpm_action_revolt_name$#!: #v [InterestGroup.MakeScope.ScriptValue('bpm_ig_attraction_to_revolt')|1]#!\n[InterestGroup.MakeScope.GetScriptValueDesc('bpm_ig_attraction_to_revolt')]\n\n#b $bpm_action_take_over_rig_name$#!: #v [InterestGroup.MakeScope.ScriptValue('bpm_ig_attraction_to_take_over_rig')|1]#!\n[InterestGroup.MakeScope.GetScriptValueDesc('bpm_ig_attraction_to_take_over_rig')]\n\n#b $bpm_action_take_down_coalition_name$#!: #v [InterestGroup.MakeScope.ScriptValue('bpm_ig_attraction_to_take_down_coalition')|1]#!\n[InterestGroup.MakeScope.GetScriptValueDesc('bpm_ig_attraction_to_take_down_coalition')]"
