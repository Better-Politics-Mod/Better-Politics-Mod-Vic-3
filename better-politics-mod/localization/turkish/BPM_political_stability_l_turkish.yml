 bpm_political_stability_baseline_tooltip: "Bu temel değer (baseline) birincil olarak ülkenin sahip olduğu [Concept('concept_law', 'Yasalar')] tarafından (gelenekselci ve baskıcı yasalar onu daha yüksek istikrara doğru etkiler) ve bunun yanı sıra [Concept('concept_radical', 'Radikallerin')] ve [Concept('concept_loyalist', 'Sadıkların')] varlığından ya da süregelen [Concept('concept_revolution', 'Devrimlerden')], [Concept('concept_war', 'Savaşlardan')] veya [Concept('concept_election', 'Seçimlerden')] etkilenir.$bpm_political_stability_baseline_value_tt$"
 bpm_political_stability_rate_tooltip: "[Concept('concept_bpm_political_stability', '$concept_bpm_political_stability$')] değerinin hedefe yaklaşma oranı genellikle yavaştır; devam eden [Concept('concept_revolution', 'Devrim')], [Concept('concept_war', 'Savaşlar')] veya [Concept('concept_election', 'Seçimler')] bu oranı hızlandırır.$bpm_political_stability_rate_value_tt$"

