je_danubian_federation_slovak_button: "[GetCulture('slovak').GetName] Endişelerini Giderin"
je_danubian_federation_slovak_button_desc: "[GetCulture('slovak').GetName] halkının yaşadığı topraklar uzun zamandır #b $HUN_ADJ$#! tacı altında örgütlenmiştir ve bu nedenle ulusal kimliklerinin büyümesini engelleyen yoğun Macarlaştırma politikalarına maruz kalmışlardır. Buna ek olarak, [GetCulture('czech').GetName] ve [GetCulture('slovak').GetNameNoFormatting] milliyetçileri tarihsel olarak yakın ilişkiler sürdürmüş ve bazıları tarafından bir [GetCulture('czech').GetNameNoFormatting]-[GetCulture('slovak').GetNameNoFormatting] varlığının kurulması savunulmuştur. [GetCulture('slovak').GetCustom('getPluralDemonym')] halkını Federasyon'a başarılı bir şekilde entegre etmek için, bölgeyi #b Macaristan#!'dan ayırmak ve çözülmemiş [GetCulture('czech').GetNameNoFormatting]-[GetCulture('slovak').GetNameNoFormatting] birliği sorunu için bir çözüm bulmak gerekir."

je_danubian_federation_polish_button: "[GetCulture('polish').GetName] Endişelerini Giderin"
je_danubian_federation_polish_button_desc: "#b Galiçya#! bölgesinde [GetCulture('polish').GetCustom('getPluralDemonym')] ve [GetCulture('ukrainian').GetCustom('getPluralDemonym')] olmak üzere iki halk yaşamaktadır. Uzun süre tarımsal bir durgunluk bölgesi olarak nitelendirilen bu bölge, aynı zamanda iki halk arasında büyük çatışmalara sahne olmuştur. #b Galiçya#!'nın batısında büyük ölçüde [GetCulture('polish').GetName] çoğunluk bulunurken, doğusunda geleneksel olarak [GetCulture('polish').GetNameNoFormatting] bir yönetici sınıfa sahip [GetCulture('ukrainian').GetName] çoğunluk bulunmaktadır. [GetCulture('polish').GetNameNoFormatting] topraklarını başarılı bir şekilde entegre etmek için #b Galiçya#!'yı bölüp bölmemeye - ve Doğudaki [GetCulture('polish').GetNameNoFormatting] yerleşim bölgelerini nasıl güvence altına alacağımıza - karar vermeliyiz."

je_danubian_federation_hungarian_button: "[GetCulture('hungarian').GetName] Endişelerini Giderin"
je_danubian_federation_hungarian_button_desc: "[GetCulture('hungarian').GetName] halkı, tarihi #b $HUN$#! topraklarının tek bir geniş veliaht toprağı (crownland) olarak örgütlenmesiyle İmparatorluk içinde uzun zamandır yüksek bir statüye sahip olmuştur. Geleneksel [GetCulture('hungarian').GetNameNoFormatting] toprakları, tamamı milliyetçi [GetCulture('hungarian').GetNameNoFormatting] yönetimi tarafından Macarlaştırma politikalarına maruz bırakılmış çok sayıda Slav, Cermen ve Rumen halkını içerir. #b Macaristan#!'ı başarılı bir şekilde entegre etmek için, tarihi topraklarının çeşitli halkları arasında nasıl bölüşüleceğine - veya azınlıkları pahasına bütün kalıp kalmayacağına - karar vermeliyiz."

je_danubian_federation_slovene_button: "[GetCulture('slovene').GetName] Endişelerini Giderin"
je_danubian_federation_slovene_button_desc: "[GetCulture('slovene').GetName] halkının yaşadığı topraklar, #b Littoral (Kıyı Bölgesi)#!, #b Carniola#! ve #b Steiermark#! veliaht toprakları içinde, [ROOT.GetCountry.GetNameNoFlag] ekonomik merkezine yakın konumdadır. Bazı [GetCulture('slovene').GetNameNoFormatting] milliyetçileri uzun zamandır Güney Slav birliğine yönelik daha geniş bir hareketle ilişkilendirilmiş ve [GetCulture('slovene').GetCustom('getPluralDemonym')], [GetCulture('croat').GetCustom('getPluralDemonym')] ve [GetCulture('serb').GetCustom('getPluralDemonym')] topraklarını kapsayan özerk bir yapı çağrısında bulunmuşlardır. Bu bölgeyi başarılı bir şekilde entegre etmek için, hem üç mevcut veliaht toprağından bir [GetCulture('slovene').GetNameNoFormatting] devleti sınırlarını çizmeli hem de potansiyel bir birleşik Güney Slav devleti sorusuna cevap bulmalıyız."

je_danubian_federation_croat_button: "[GetCulture('croat').GetName] Endişelerini Giderin"
je_danubian_federation_croat_button_desc: "[GetCulture('croat').GetName] toprakları uzun zamandır bölünmüş durumdadır - önce #b $STATE_CROATIA$#!, #b $STATE_SLAVONIA$#! ve #b $STATE_DALMATIA$#! olmak üzere üç veliaht toprağına ayrılmış, ardından #b $AUS_ADJ$#! ve #b $HUN_ADJ$#! idareleri arasında paylaştırılmıştır. [SCOPE.GetRootScope.GetCountry.GetCustom('triune_kingdom_exists_or_not')] Dahası, [GetCulture('croat').GetNameNoFormatting] milliyetçi hareketi uzun zamandır "İlirizm" ile hizalanmıştır; bu eğilim [GetCulture('slovene').GetCustom('getPluralDemonym')], [GetCulture('croat').GetCustom('getPluralDemonym')] ve [GetCulture('serb').GetCustom('getPluralDemonym')] halklarını tek bir devlet altında birleştirmeyi arzulamaktadır. Hırvatistan'ı Federasyon'a entegre etmek için [SCOPE.GetRootScope.GetCountry.GetCustom('triune_kingdom_exists_or_not_goal')]"
TRIUNE_KINGDOM_NOT_EXISTS: "Her üç geleneksel [GetCulture('croat').GetNameNoFormatting] toprağından oluşan bir "Üçlü Krallık" kurulması, [GetCulture('croat').GetNameNoFormatting] milliyetçilerinin uzun süredir devam eden bir hedefi olmuştur."
TRIUNE_KINGDOM_EXISTS: "Her üç geleneksel [GetCulture('croat').GetNameNoFormatting] toprağından oluşan bir "Üçlü Krallık" yapısının yakın zamanda kurulması, [GetCulture('croat').GetNameNoFormatting] milliyetçilerini yatıştırmış olsa da şimdi devletlerinin genişlediğini görmek istemektedirler."
TRIUNE_KINGDOM_NOT_EXISTS_GOAL: ""Üçlü Krallık" projesini hayata geçirecek bir çözüm bulmalı, aynı zamanda Güney Slav birliği meselesinde de bir karara varmalıyız."
TRIUNE_KINGDOM_EXISTS_GOAL: ""Üçlü Krallığı" elde tutmayı taahhüt etmeli, aynı zamanda Güney Slav birliği meselesinde de bir karara varmalıyız."

je_danubian_federation_romanian_button: "[GetCulture('romanian').GetName] Endişelerini Giderin"
je_danubian_federation_romanian_button_desc: "[GetCulture('romanian').GetName] toprakları, olağanüstü çeşitliliğe sahip #b Banat#! bölgesi, çok sayıda [GetCulture('south_german').GetName] yerleşimi ve devasa [GetCulture('hungarian').GetName] yerleşim bölgesi olan #b Sekelistan#! ile İmparatorluğun en karmaşık bölgelerinden bazılarıdır. Bölgenin [GetCulture('romanian').GetNameNoFormatting] ve [GetCulture('hungarian').GetNameNoFormatting] milliyetçileri ile bölgede bulunan sayısız diğer azınlık arasında nasıl bölüşüleceğine dair şiddetli tartışmalar yaşanmaktadır. [SCOPE.GetRootScope.GetCountry.GetCustom('danubian_principalities_exists_or_not')] Bu bölgeyi Federasyon'a entegre etmek için, gelecekteki [GetCulture('romanian').GetNameNoFormatting] devletinin sınırları sorusunu çözmeli ve ayrıca #b Banat#! bölgesinin ve bölgedeki [GetCulture('south_german').GetNameNoFormatting] ile [GetCulture('hungarian').GetNameNoFormatting] yerleşimlerinin statüsünü netleştirmeliyiz."
ROMANIA_EXISTS: "Bu anlaşmazlıklara ek olarak, bölgenin diğer [GetCulture('romanian').GetNameNoFormatting] devletleriyle birleşmesine yönelik bir eğilim de bulunmaktadır."
ROMANIA_NOT_EXISTS: ""

je_danubian_federation_north_italian_button: "[GetCulture('north_italian').GetName] Endişelerini Giderin"
je_danubian_federation_north_italian_button_desc: "[GetCulture('north_italian').GetName] veliaht toprakları uzun zamandır İmparatorluğun en müreffeh bölgelerinden biri olmuş ve [ROOT.GetCountry.GetAdjectiveNoFlag] ticaret ve denizcilik uzmanlığının büyük kısmını sağlamıştır. Bu topraklar aynı zamanda sürekli kural tanımaz olmuş, İtalyan milliyetçileri [SCOPE.GetRootScope.GetCountry.GetCustom('italy_or_italian_states')] ile birleşmek için ağır bir baskı uygulamıştır. Eğer [GetCulture('north_italian').GetNameNoFormatting] toprakları Federasyon'a entegre edilecekse, birleşme yanlısı duygular bastırılmalı ve [GetCulture('south_german').GetName] ile [GetCulture('slovene').GetName] bölgeleri içindeki [GetCulture('north_italian').GetNameNoFormatting] azınlıkların sorunu [GetCulture('north_italian').GetNameNoFormatting] milliyetçilerini tatmin edecek şekilde çözülmelidir."

ITALY_EXISTS: "#b İtalya#!"
ITALY_NOT_EXISTS: "diğer İtalyan devletleri"

