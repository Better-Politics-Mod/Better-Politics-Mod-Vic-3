 concept_bpm_party_establishment: "Yerleşiklik"
 concept_bpm_party_establishment_desc: "Bir siyasi partinin yerleşikliliği, bir ülkenin siyasi kültüründe ne kadar kök saldığının bir ölçüsüdür. Bu durum partinin popülaritesini ve güç kazanma yeteneğini etkiler. Bir partinin yerleşikliliği; ülkenin [Concept('concept_bpm_political_stability', 'Siyasi Katılığından')], onu oluşturan [Concept('concept_bpm_ig_is_upper_institutional', 'Kurumsal')] ve [Concept('concept_bpm_ideological_ig', 'İdeolojik')] [Concept('concept_interest_group', 'Çıkar Gruplarından')] ve partinin [Concept('concept_government', 'Hükümette')] bulunmasından etkilenebilir."