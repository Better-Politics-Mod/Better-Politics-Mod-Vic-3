l_simp_chinese:
 bpm_japan.1.t:0 "幕府与票箱"
 bpm_japan.1.d:0 "在压倒性的民众压力下，[SCOPE.sCharacter('shogun_scope').GetFullNameWithTitle]已允许成立#b [SCOPE.GetRootScope.GetCountry.GetCustom('country_legislature_name')]#!，这是一个由选举产生的立法机构，将拥有推选[concept_bpm_head_of_government]的权力。随着[SCOPE.GetRootScope.GetCountry.GetAdjectiveNoFlag]历史上首次全国选举的选票开始投出，[SCOPE.sCharacter('shogun_scope').GetFullName]必须决定[SCOPE.sCharacter('shogun_scope').GetSheHe]将如何应对[SCOPE.sCharacter('shogun_scope').GetHerHis]权威的丧失。"
 bpm_japan.1.f:0 ""举例而言，我们对政府官员表示敬重是自然的，但这并非因为其身份的尊贵。他之所以获得这种敬重，仅仅是因为他凭借才能与德行履行了那一重要职责，并且为人民处理重大的法律事务。有尊严的是法律，而不是人。\n\n——福泽谕吉，1872年"
 bpm_japan.1.a:0 "支持和平移交权力。德川家族可以像其他人一样参与竞选。"
 bpm_japan.1.b:0 "幕府的毁灭是不可接受的。忠诚的武士将支持终结这场闹剧。"
 je_warlord_china:0 "天命"
 je_warlord_china_reason:1 "#bold 进度条#!的状态将根据特定条件#tooltippable;tooltip:[Country.GetTooltipTag],je_warlord_china_special_tooltip_advance 前进#!或#tooltippable;tooltip:[Country.GetTooltipTag],je_warlord_china_special_tooltip_deplete 后退#!。#bold 进度条#!达到#variable 0%#!意味着帝国权威彻底崩溃，大清在枪口下走向终结。\n\n尽管在雍正、乾隆皇帝治下曾有过一段暂时的稳定，中国却在外国压力下，以及无力满足数以百万计人民基本需求的窘境中，稳步滑向崩溃。当黄河决堤时，无人前来修复田亩；当收成欠佳时，粮仓空空如也；地方士绅在外来皇帝的默许下肆意欺凌农民。随着帝国政府的权威与天命不断遭到侵蚀，中土大地上日益壮大的排外运动、主张现代化的革命者，以及怒不可遏的农民，都将威胁着推翻这龙椅。若当今王朝想要重振信心、保住天命，就必须增强中国的实力，并推行审慎的内部改革。\n\n#lore "西方诸国为何小而强？我们为何大而弱？我们必须寻求与他们并驾齐驱之道，而这全赖人力……在言行合一上，我们不如夷狄。补救之法在于反求诸己。只要皇帝为我们指明正确的方向，这一切可以立即改变。"\n——冯桂芬，1861年#!"
 je_warlord_china_special_tooltip_deplete:0 "以下条件将使#bold 进度条#!#bold 后退#!：\n• 输掉#BOLD 鸦片战争#!\n• 未能阻止#BOLD 太平天国#!的出现\n• 未能收复#BOLD 太平天国#!\n• #BOLD 义和团运动#!失败\n• 负债并借取任何[concept_loans]\n• 发生[concept_civil_war]\n• 沦为其他国家的[concept_subject]\n• 废除[GetLawType('law_monarchy').GetName]"
 je_warlord_china_special_tooltip_advance:0 "以下条件将使#bold 进度条#!#bold 前进#!：\n• 打赢#BOLD 鸦片战争#!\n• 不再是[concept_unrecognized_power]\n• 完成#BOLD 根除君主制#!这一[concept_journal_entry]"
 je_china_failure_tt:0 "#bold 进度条#!已达到#variable 0%#!"
 je_warlord_china_stable:0 "天下太平"
 je_warlord_china_crumbling:0 "龙椅开始动摇"
 je_warlord_china_burning:0 "禁宫城墙之外，中国在燃烧"
 je_bpm_xinjiang:0 "塞外边疆"
 je_bpm_xinjiang_reason:0 "在过去的两个世纪里，大清征服了中国本土之外的广袤土地，从蒙古和满洲的草原，到极西的荒漠。这些土地目前由军事总督乃至忠诚的部落首领等多种形式进行治理，因此北京对这些土地的掌控往往十分脆弱，时刻受到殖民列强和叛乱的当地人的威胁。如果我们希望这些土地能被作为核心省份来治理，那还有很多工作要做。\n\n #lore "有一种关于中国（中华）的观点认为，非汉族人不能成为中国的臣民，他们的土地也不能纳入中国的版图。这并不代表我们王朝对中国的理解，而是先前汉、唐、宋、明各朝的看法……"\n\n——乾隆皇帝，1755年#!"
 xinjiang_integration_tt:0 "$xinjiang_states_tt$诸州已整合，且[concept_turmoil]低于10%"
 xinjiang_states_tt:0 "属于#tooltippable;tooltip:[Country.GetTooltipTag]je_bpm_xinjiang_special_tooltip 大中华#!"
 je_bpm_xinjiang_special_tooltip:0 "• [GetStateRegion('STATE_QINGHAI').GetName]\n• [GetStateRegion('STATE_TIANSHAN').GetName]\n• [GetStateRegion('STATE_DZUNGARIA').GetName]\n• [GetStateRegion('STATE_ALXA').GetName]\n• [GetStateRegion('STATE_HINGGAN').GetName]\n• [GetStateRegion('STATE_NORTHERN_MANCHURIA').GetName]\n• [GetStateRegion('STATE_SOUTHERN_MANCHURIA').GetName]\n• [GetStateRegion('STATE_FORMOSA').GetName]"
 xinjiang_decisions_tt:0 "已完成所有建制决策"
 je_xinjiang_button_manchu:0 "经略东北"
 je_xinjiang_button_manchu_desc:0 "满洲人东北部的故土长期以来一直作为特殊总督辖区治理，如今我们有权重组并开发这一地区，使之成为正式的省份。"
 je_xinjiang_button_qinghai:0 "经略青海"
 je_xinjiang_button_qinghai_desc:0 "青海这片多山的地区是一个偏远的军事总督辖区，是众多藏人与蒙古人的家园。若想进一步整合青海，我们必须努力建立更持久的制度……"
 je_xinjiang_button_xinjiang:0 "经略新疆"
 je_xinjiang_button_xinjiang_desc:0 "帝国蛮荒的极西疆域，从准噶尔的丘陵到塔里木无尽的黄沙，局势动荡，对该地区的控制有赖于少数几支忠于职守的驻军。要使这些领土成为帝国不可分割的一部分，就必须先稳定它们。"
 je_xinjiang_button_mongol:0 "经略蒙古"
 je_xinjiang_button_mongol_desc:0 "蒙古各部长期以来臣服于大清，但随着欧洲列强逼近我们疆域的边界，我们必须鼓励对内蒙的移民与开发。"
 bpm_encouraged_growth:0 "人口激增"
 notify_east_asia_loss_of_opium_wars_tt:0 "我们的邻邦与朝贡国将得知我们的失败"
 je_taiping:0 "大叛乱"
 je_taiping_status:0 "在整个帝国，我们统治天命根基的动摇最终酿成了一系列针对我们权威的重大叛乱。从宗教狂热分子到各族军阀，若我们的帝国要熬过这一黑暗时刻，就必须迅速镇压叛军，并不惜一切代价恢复内部秩序。"
 je_taiping_reason:0 "狂热分子已起兵反抗我们的正统统治！他们的叛乱必须被彻底镇压。"
 je_taiping_tt:0 "所有叛军势力均已被吞并。"
 bpm_east_asia_dynamics.1.t:0 "鸦片战争：中央王国的惨败"
 bpm_east_asia_dynamics.1.d:0 "曾经强大的[SCOPE.sCountry('china_scope').GetName]遭到沉重打击，其军队在最近这场围绕鸦片禁令的战争中败于凶悍的[SCOPE.sCountry('opium_wars_aggressor').GetName]之手。这场毁灭性的失败动摇了中央王国的根基。他们被迫开放市场，东亚的邻国则开始思索这场历史性力量对比转变的意义。"
 bpm_east_asia_dynamics.1.d2:0 "曾经强大的[SCOPE.sCountry('china_scope').GetName]遭到沉重打击，其军队在最近这场围绕鸦片禁令的战争中败于凶悍的[SCOPE.sCountry('opium_wars_aggressor').GetName]之手。这场毁灭性的失败动摇了中央王国的根基。他们被迫将[SCOPE.sState('treaty_port_state').GetName]港割让给[SCOPE.sCountry('opium_wars_treaty_port_winner').GetName]，东亚的邻国则开始思索这场历史性力量对比转变的意义。"
 bpm_east_asia_dynamics.1.d3:0 "曾经强大的[SCOPE.sCountry('china_scope').GetName]遭到沉重打击，其军队在最近这场围绕鸦片禁令的战争中败于凶悍的[SCOPE.sCountry('opium_wars_aggressor').GetName]之手。这场毁灭性的失败动摇了中央王国的根基，东亚的邻国则开始思索这场历史性力量对比转变的意义。"
 bpm_east_asia_dynamics.1.f:0 "随着[SCOPE.sCountry('china_scope').GetName]战败的现实逐渐深入人心，该地区的政治格局开始发生变化。改良派的声音愈发响亮，呼吁本国政府进行现代化与变革，以免重蹈覆辙；而反动派则力图压制一切骚动迹象，唯恐引发剧变。东亚曾经稳定的力量平衡已被无可挽回地打破，未来岁月将充满动荡与不确定，该地区的诸国都在努力摸索如何在这一险象环生的新格局中前行。"
 bpm_east_asia_dynamics.1.a:0 "[ROOT.GetCountry.GetName]将站在中央王国一边！"
 bpm_east_asia_dynamics.1.b:0 "要么改革，要么灭亡！"
 bpm_east_asia_dynamics.1.c:0 "我们应该寻求对西方列强的绥靖！"
 bpm_east_asia_dynamics.1.e:0 "与我们无关。"
 bpm_china.1.t:0 "《南京条约》"
 bpm_china.1.d:0 "帝国在陆地和海上均惨遭败绩，英国与中国官员在南京外的一艘英国军舰上会晤，商讨和平条款。协议不仅规定向英国王室赔款，还废除了已施行80余年的保护主义"广州体制"。取而代之的是，多个中国港口将向欧洲贸易开放，香港岛将被割让给英国。"
 bpm_china.1.f:0 ""和平条款宣读完毕后，首席钦差大臣伊里布停顿了一下，似乎在期待更多内容，最后说道："就这些了吗？"莫里森先生向马尔科姆中校询问是否还有其他事项，得到否定答复后，伊里布立即以极大的圆滑结束了谈判，说道："一切照准，事情已定，就此了结。"\n\n——蒙哥马利·马丁，1842年"
 bpm_china.1.a:0 "这不过是一次小小的屈辱吧？"
 bpm_china.2.t:0 "欧洲传教士的到来"
 bpm_china.2.d:0 "随着《南京条约》将中国向欧洲贸易与外国居留开放，中国日益成为福音派新教徒的热门目标，他们力求在几乎每一座主要城市和省份建立传教站。"
 bpm_china.2.f:0 "在东部各省，西方传教士的身影愈发常见，他们散发译好的宗教经文，宣扬那位唯一的天主的光荣。虽然许多人对这些外国人嗤之以鼻，但也有一些好奇的路人驻足倾听。"
 bpm_china.2.a:0 "希望这些外国人别惹出太大的乱子。"
 bpm_china.3.t:0 "黄河大洪水"
 bpm_china.3.d:0 "1851年至1855年间的暴雨季节异常猛烈，在黄河流域造成了严重洪灾，并使河道整体改道至山东半岛以北，导致流域内农业区遭到大规模毁坏。"
 bpm_china.3.f:0 "整个村庄和农田又一次被一尺深的洪水淹没，又一季的收成连续第二年彻底毁于一旦。村民们只能咬牙准备迎接又一年流窜的匪患和地主们的漠视。"
 bpm_china.3.a:0 "我们是被上天抛弃了吗？"
 bpm_china.7.t:0 "塔里木之乱"
 bpm_china.7.d:0 "极西的新疆总督辖区由18世纪中叶被征服的原准噶尔汗国土地组成。在这个偏远地区，清朝的权威时常受到叛乱当地人和草原上各种势力的考验。"
 bpm_china.7.f:0 "萨马特早已习惯时时回头张望；在喀什噶尔以南开阔的旷野中，一个孤身的旅人可以说无处遁形。此刻，远处传来一队骑兵经过的清晰声响，令他警觉起来。他屏息静立，紧盯着地平线，直到看见那队突厥人并未朝他的方向而来，才松了一口气，继续上路。"
 bpm_china.7.a:0 "在这里，低头做人总是明智的。"
 bpm_china.8.t:0 "偏远戍所"
 bpm_china.8.d:0 "新疆处于伊犁将军及其属官的直接管辖之下，他们负责维持主要人口聚居地的安全，尤其是汉民与回民聚居地。多年来，各旗旗人与将领轮番出任此职。特依顺保将军曾主持了与浩罕人在南疆的一场重大冲突的善后，以换取若干贸易与居留方面的保证。"
 bpm_china.8.f:0 ""迪化比这个鬼地方好多了。"尼堪愤愤地想。极西城镇克孜勒的烈日灼烧着每一个不幸置身其下的人，当地的东干人对旗人进城也并无多少热情。如今西部局势已经平息，他只盼着自己的营能早日被调回北方。"
 bpm_china.8.a:0 "在塔里木巡防，几乎让人怀念起西藏的严冬。"
 bpm_china.9.t:0 "新疆的匪患"
 bpm_china.9.d:0 "极西之地比内地各省要无法无天得多，许多地区仍饱受各种匪患与袭扰。只要这片领土仍是一个边陲总督辖区，此类事件恐怕就会一再发生。"
 bpm_china.9.f:0 "匪徒袭击了多处聚落，驻军仓促应战。他们如恶魔般从沙漠中驰骋而来，见人便抓、见物便抢。"
 bpm_china.9.a:0 "硝烟升入西边的天空。"
 bpm_china.10.t:0 "府县事务"
 bpm_china.10.d:0 "在17世纪80年代平定台湾诸王国之后，大清将这座岛屿设为福建的一个府。此后，历任皇帝及其朝臣都不得不处理如何在[SCOPE.sCulture('han_culture').GetName]移民与[SCOPE.sCulture('formosa_culture').GetName]人口之间平衡关系与权利的问题。如今，移民再次向多山的腹地推进，导致与当地原住民的紧张关系加剧。这个问题又一次成为福建巡抚与朝廷之间争论的焦点。"
 bpm_china.10.f:0 ""台湾汉民奸徒租种熟番荒地者，依'私垦盗占田土'律治罪；在生番地界垦荒者，依'越界'律治罪。土地归还原住民。"\n——户部谕令，1746年"
 bpm_china.10.a:0 "制止进一步的非法定居，和平是我们的首要任务。"
 bpm_china.10.b:0 "达成协议，让当地人能将土地租给移民。"
 bpm_china.10.c:0 "够了，必须让整座岛屿俯首听命，以武力控制腹地。"
 bpm_china.11.t:0 "洪秀全第二次应试落第"
 bpm_china.11.d:0 "洪秀全，一个志向远大的年轻学子，今年第二次在初级科举考试中落第。 "
 bpm_china.11.f:0 "秀全天资聪颖、勤奋好学，是广东省一位客家村长的儿子。他自幼便为科举考试做准备，7岁入本村私塾，13岁时已熟记主要经典，并显露出作文的才华。他的老师、亲属和同村人都对他刮目相看，对这个年轻的神童通过科举寄予厚望。\n\n 13岁时，他在科举第一轮的资格考试中名列第一，16岁时首次应试秀才。\n\n他没有成功。\n\n在这令人失望的结果之后，洪秀全回到家乡务农，父母已无力再供他读书。他跻身中国士林之列的抱负似乎就此破灭，直到一位富有的朋友邀请他一起读书，准备第二次应试。\n\n今年他再次参加考试，却又一次名落孙山。对于一个如此有前途的年轻学子来说，这是何等沉重的打击。 "
 bpm_china.11.a:0 "谁知道他的前途会把他带向何方？"
 bpm_china.12.t:0 "洪秀全第三次落第"
 bpm_china.12.d:0 "在第三次科举落第之后，洪秀全因过度失望而身体垮掉了。在病榻上将养，处于生死之间，洪秀全的脑海中充满了幻象。\n\n#lore 他看到一大群天使将他抬向天堂，男男女女在他到来时向他致敬。一位#yellow 金须老人#!一见到秀全，便放声痛哭。\n"普天之下所有世人，皆由我生养；他们吃我的食、穿我的衣，却没有一个人有心记念我、尊崇我；……他们拿了我的恩赐，却去敬拜邪魔。\n 这位#yellow 老人#!随后赐给秀全一柄剑以除灭邪魔，一枚印以克胜恶灵，还有一块果子让他吃。"要勇敢做工；我必在一切患难中帮助你。\n\n 这些幻象持续了40天，在此期间洪秀全见到一位#r 中年男子#!，洪秀全称他为自己的#r 长兄#!，他教导秀全如何行事，并协助他斩杀邪灵#!"
 bpm_china.12.a:0 "#yellow 天父#!与#r 天子#!已选定了他们的斗士"
 bpm_china.13.t:0 "拜上帝会"
 bpm_china.13.d:0 "在广西的群山中，一个奇异的教团形成了。他们自称为拜上帝会，最初由一位名叫冯云山的前教师发起，宣扬[SCOPE.sCharacter('bpm_hong_xiuquan').GetFullName]的信仰，而此人自称是基督教人物耶稣基督的弟弟。他们已在客家当地人中建立起可观的追随者。"
 bpm_china.13.f:0 ""实知我们罪孽滔天，上达于天；\n 幸知耶稣替我们担当一切。\n 不再信靠邪魔，惟遵圣言，敬拜独一真主，修心养性。"\n ——洪秀全，1844年"
 bpm_china.13.a:0 "又一桩外省的怪事。"
 bpm_china.14.t:0 "拜上帝会声势渐起"
 bpm_china.14.d:0 "拜上帝会在广西乡村的规模与影响力持续增长，吸引了数以万计的虔诚信徒。他们大多能够避免政府当局的镇压，因为与该省四处劫掠的匪徒相比，他们保持着较为低调的存在。"
 bpm_china.14.f:0 ""这悖逆而麻木的世界，何以不能在一日之间变为诚实正直的世界？这充满侮辱与侵害、争斗与杀戮的世道，何以不能在一日之间变为强者不再欺凌弱者、众者不再压制寡者、智者不再蒙蔽愚者、勇者不再骚扰畏者的世界？\n -洪秀全，1847年"
 bpm_china.14.a:0 "令人担忧，要密切关注他们。"
 bpm_china.14.b:0 "趁现在赶紧制止，逮捕洪秀全"
 bpm_china.15.t:0 "在租界之中"
 bpm_china.15.d:0 "作为《南京条约》的一项条款，若干沿海城市已成为向欧洲贸易与居留开放的条约口岸。它们，无论好坏，都已成为向西方利益与思想敞开的门户。"
 bpm_china.15.f:0 "詹姆斯扫视着面前的各种账册，"我们到底该怎么整理这些付款，这该死的国家好像每个省都铸一种不同的钱！"\n 他的同事瞥了他一眼，叹了口气。\n "就把所用币制注在页边空白处吧，我在那张桌子上有个对照索引。"\n 詹姆斯皱起了眉头。"
 bpm_china.15.a:0 "这"厂平两"到底是个什么鬼？"
 bpm_treaty_ports:0 "条约口岸"
 bpm_china.16.t:0 "汉人移民边疆"
 bpm_china.16.d:0 "几个世纪以来，汉族农民选择离开家乡，到边疆地区谋求土地与机遇。尽管清朝当局往往予以劝阻，但如此辽阔的内部边界往往难以管控。"
 bpm_china.16.f:0 "东北广袤的旷野为许多人提供了全新的开始，尽管寒风凛冽，却土地充裕，且能摆脱旧地主的束缚。随着一波波移民涌入，城镇不断壮大，对工匠和劳工的需求也日益增长。"
 bpm_china.16.a:0 "一个全新的开始。"
 bpm_china.17.t:0 "东三省"
 bpm_china.17.d:0 "根据皇帝谕令，东北被重组为三个省份：奉天、吉林和黑龙江。这一地区正日益为汉族移民所主导，而帝国政府并无意阻止。"
 bpm_china.17.f:0 ""壮丽的盛京建于沈水北岸。其山高耸，其水辽阔。它被定为万世楷模，乃最奇妙之地，其伟如虎如龙……如此祥瑞之地将永世长存，代代相传。它超越并凌驾于所有地方之上，统一了域内与域外。"\n——清高宗，1743年"
 bpm_china.17.a:0 "东北迈入了19世纪。"
 bpm_china.18.t:0 "这些古老的河谷"
 bpm_china.18.d:0 "青海的群山在数百年间几经易主，但帝国政府已采取措施，使其成为中国的一个核心省份。"
 bpm_china.18.f:0 "当地人称其为库库诺尔，青海这个与湖同名的湖泊是该地区朝圣者的心仪之地。每12年，朝圣者都会绕库库诺尔进行一场盛大的转湖，并讲述古代大师莲花生大士的传说，其中许多传说将这片湖泊的诞生神化……"
 bpm_china.18.a:0 "一片对许多人而言神圣的土地。"
 bpm_china.19.t:0 "西疆归化"
 bpm_china.19.d:0 "经过多年的征战，新疆终于可以开始由正规的省级行政机构来治理，从而为进一步的移民与开发打开了大门。"
 bpm_china.19.f:0 "极西省份正在愈合，七座城池似乎一夜间变大，新的集市与学堂在每个街角拔地而起。这份和平能持续多久无人能确知，但它们与北京的联系无疑比以往任何时候都更紧密了……"
 bpm_china.19.a:0 "边疆就此稳固。"
 bpm_china.20.t:0 "蒙古事务"
 bpm_china.20.d:0 "经过一番斟酌，内外蒙古的旗与盟已被正式确立为正规的行政区划。"
 bpm_china.20.f:0 "诸旗被编为盟，而旗本身又辖若干盟部。这些都是蒙古传统的组织形式，如今却构成了一套真正的三级行政体系……"
 bpm_china.20.a:0 "既然没坏，就别修……"
 bpm_china_revolts.1.t:0 "山间血债"
 bpm_china_revolts.1.d:0 "许多回族穆斯林在云南这片多山的省份已居住了数百年，却因其信仰以及对云南许多富矿的控制，时常与清朝当局和当地汉民团练发生冲突。近年来暴力不断升级，满洲当局下令的又一场残酷屠杀，使当地民众人心惶惶。"
 bpm_china_revolts.1.f:0 ""倘若我们回族不复此仇，暴行便会在各地重演，直到最后一个回民被杀尽……官府与官兵助汉灭回，尸积如山、血流成海，这苦难绝不会白费……"\n ——永昌回民檄文，1845年"
 bpm_china_revolts.1.a:0 "回族人民的耐心正在耗尽。"
 bpm_china_revolts.2.t:0 "大理之变"
 bpm_china_revolts.2.d:0 "成千上万的回族与汉族民众向大理城进发，云贵总督已自杀，其他满洲官员被叛军一网打尽。如今叛乱已蔓延到大理以外，这些叛军找到了一位领袖——皈依伊斯兰教的[SCOPE.sCharacter('bpm_du_wenxiu').GetFullName]，他宣布建立平南国。"
 bpm_china_revolts.2.f:0 "在全省各地，不仅回族，还有成千上万的汉族与彝族民众纷纷投奔平南国的旗帜。叛军如今直逼昆明这最后一座保皇派堡垒。"
 bpm_china_revolts.2.a:0 "立即集结剩余驻军！"
 bpm_china_revolts.2.b:0 "为使汉民得以安宁，推翻清廷！"
 bpm_panthay_war_tt:0 "战争将在数月后爆发……"
 bpm_china_revolts.3.t:0 "潘泰起义"
 bpm_china_revolts.3.d:0 "大理的自发起义已失控，如今演变成一场席卷云南、摧毁帝国控制的声势浩大的运动。叛军兵临昆明城下，回族起义在中国各地此起彼伏，我们已被卷入又一场叛乱战争。"
 bpm_china_revolts.3.f:0 ""……先是一声可怕的巨响，待巨大的烟尘散去，城墙上出现了一个大洞，大批回族战士如潮水般涌入城中。"\n ——《钦定平定回匪方略》，1896年"
 bpm_china_revolts.3.a:0 "镇压叛徒！"
 panthay_rebellion:0 "潘泰起义"
 dyn_c_pingnan_guo:0 "平南国"
 dyn_c_pingnan_guo_adj:0 "平南"
 bpm_china_revolts.5.t:0 "回族动荡蔓延"
 bpm_china_revolts.5.d:0 "云南的起义加剧了帝国穆斯林人口与各省政府之间的紧张关系，日益加深的猜疑导致了更严厉的镇压，反过来又激起许多回民更绝望的反抗。"
 bpm_china_revolts.5.f:0 ""情况不妙。"\n ——某位将军"
 bpm_china_revolts.5.a:0 "我们还能指望遏制住这一切吗？"
 bpm_china_revolts.6.t:0 "东干起义"
 bpm_china_revolts.6.d:0 "席卷帝国的动荡浪潮最终在极西之地达到了临界点。一连串的骚乱与屠杀使一个名叫阿古柏的浩罕人得以入侵新疆，自称埃米尔与信士的捍卫者。"
 bpm_china_revolts.6.f:0 "竹矛扎人很疼"
 bpm_china_revolts.6.a:0 "在西部集结志愿军！"
 bpm_china_revolts.6.b:0 "为了真主与荣耀，我们冲锋！"
 dyn_c_kashgaria:0 "喀什噶尔"
 dyn_c_kashgaria_adj:0 "喀什噶尔"
 bpm_china_revolts.100.t:0 "龙之陨落"
 bpm_china_revolts.100.d:0 "叛军终于登上了紫禁城的城墙，最后的清朝皇室或遭俘获，或仓皇逃往东北。正如历史上多次上演的那样，一个王朝倒下，为另一个王朝的崛起创造了机会。唯一的问题是，谁将抓住这个机会。"
 bpm_china_revolts.100.f:0 "叛军们满怀敬畏地在华丽的宫殿庭院中游荡，随着时间流逝，所作之事的沉重与对未来的疑问，开始压上他们的心头。"
 bpm_china_revolts.100.a:0 "白莲教系的叛军抓住机会，拥立了一位明朝后裔。"
 bpm_china_revolts.100.b:0 "孔子的直系后裔、现任衍圣公被拥立为一位温和的统治者。"
 bpm_china_revolts.100.c:0 "叛军将领自立为王，夺取了帝位。"
 bpm_china_revolts.101.t:0 "妖魔授首"
 bpm_china_revolts.101.d:0 "太平天国终于战胜了清朝妖魔。如今，全中国的天王洪秀全可以将中国带入一个圣洁的时代。"
 bpm_china_revolts.101.f:0 "叛军们满怀敬畏地在华丽的宫殿庭院中游荡，随着时间流逝，所作之事的沉重与对未来的疑问，开始压上他们的心头。"
 bpm_china_revolts.101.a:0 "愿主永远统治！"
 bpm_china_revolts.102.t:0 "龙之陨落"
 bpm_china_revolts.102.d:0 "革命军已夺取北京和紫禁城的控制权，皇帝与清朝皇室被拘押，一个临时政府正在迅速组建，许多人倾向于建立共和国，从而终结延续近两千年、王朝相继的帝制。"
 bpm_china_revolts.102.f:0 "叛军们满怀敬畏地在华丽的宫殿庭院中游荡，随着时间流逝，所作之事的沉重与对未来的疑问，开始压上他们的心头。"
 bpm_china_revolts.103.t:0 "漫长的下坡路"
 bpm_china_revolts.103.d:0 "尽管帝国都城仍在我们的掌控之中，叛军却已从我们手中夺去了帝国的大片土地。这对大清而言可能是一记致命的重击。"
 bpm_china_revolts.103.f:0 "近日，一股寒意笼罩了北京，无数官员与侍从惴惴不安地奔走，揣度着这份和平还能维持多久。"
 bpm_china_revolts.103.a:0 "大清鼎盛的时代就此落下帷幕。"
 QNG:0 "青海"
 QNG_ADJ:0 "青海"
 MLY:0 "马来亚"
 MLY_ADJ:0 "马来"
 je_bpm_confucian_state:0 "儒教国家"
 je_bpm_confucian_state_reason:0 "我们的国家深深植根于[SCOPE.sReligion('conf_religion').GetName]哲学之中。科举制度是政府[concept_bureaucracy]的基础，通过一系列严格的考试来选拔文官，以检验他们对儒家经典的领悟。唯有在这些考试中出类拔萃者才能晋升官僚体系的阶层，从而确保国家由最博学、最有德行的士大夫来治理。\n\n#lore "以德为政的人，好比北极星，安守其位，而众星都环绕着它。"\n——孔子，《论语》#!"
 bpm_confucian_state.1.t:0 "科举：中平之科"
 bpm_confucian_state.1.d:0 "又到了科举之时。数百年来，历朝历代都将其作为一种理论上唯才是举的方式，用以选拔和提供遍布[ROOT.GetCountry.GetName]各地所需的庞大官僚队伍。然而，考试并非都通向同一种功名，那些能历年间通过多次考试的人，可以取得更高的功名，从而有资格出任更显要的官职。"
 bpm_confucian_state.1.f:0 ""为政在人，取人以身，修身以道，修道以仁。"\n——孔子，《中庸》"
 bpm_confucian_state.1.a:0 "愿他们好好报效帝国。"
 bpm_confucian_state.2.t:0 "科举：卓异之科"
 bpm_confucian_state.2.d:0 "又到了科举之时。数百年来，历朝历代都将其作为一种理论上唯才是举的方式，用以选拔和提供遍布[ROOT.GetCountry.GetName]各地所需的庞大官僚队伍。然而，考试并非都通向同一种功名，那些能历年间通过多次考试的人，可以取得更高的功名，从而有资格出任更显要的官职。"
 bpm_confucian_state.2.f:0 ""国有道，不变塞焉，强哉矫！国无道，至死不变，强哉矫！"\n——孔子，《中庸》"
 bpm_confucian_state.2.a:0 "他们将成为最高品级的称职官员。"
 bpm_confucian_state.3.t:0 "科举：平庸之科"
 bpm_confucian_state.3.d:0 "又到了科举之时。数百年来，历朝历代都将其作为一种理论上唯才是举的方式，用以选拔和提供遍布[ROOT.GetCountry.GetName]各地所需的庞大官僚队伍。然而，考试并非都通向同一种功名，那些能历年间通过多次考试的人，可以取得更高的功名，从而有资格出任更显要的官职。"
 bpm_confucian_state.3.f:0 ""凡事豫则立，不豫则废"\n——孔子，《中庸》"
 bpm_confucian_state.3.a:0 "希望未来的考生能更加用功。"
 je_meiji_restoration:0 "The Bakumatsu"
 je_meiji_restoration_reason:0 "#lore "With many little strokes a large tree is felled."\n—Japansese Proverb#!\n\nThe powers of the west have crashed upon the shores of Japan, and the policy of Sakoku has left Japan weak. The forcing open of our ports has led to the collapse of our banking system and the flooding of our ports with foreigners, including missionaries. Many Daimyos and members of the imperial house are beginning to believe radical change is needed to secure Japan from foreign domination.\n\nSome are calling this the #v Bakumatsu#!, the end of the Shogunate.\n\nProgress towards the end of the shogunate is made on a monthly basis by #P 1#! each month. Events may also occur that allow for jumps in progress towards a restoration."
 je_meiji_restoration_goal:0 "The progress of the Bakumatsu has reached 100"
 bpm_shogunate_var:0 "Bakumatsu Progress"
 bpm_shogunate_secured_tt:0 "The Shogunate has been reformed."
 bpm_emperor_restored_tt:0 "The Emperor has been restored."
 je_bpm_secure_shogunate:0 "Shoring up the Shogunate"
 je_bpm_secure_shogunate_reason:0 "The Tokugawa clan has lead Japan as shoguns since the 17th century, establishing a time of order and isolation off the heels of the warring states period. However, not all power in Japan lies in the palm of the Shogun and his clan, regional Daimyo lords privately control vast swaths of the country and command legions of men at arms and Samurai. This careful balance of policy has been shattered by European intervention and the imposition of treaties bringing and end to Sakoku isolation.\n\nTo preserve the Tokugawa shogunate and rebuke the restorationists certain careful reforms must be taken to secure power before the Tokugawa clan loses its credibility and grasp on power."
 je_meiji_main:0 "The [ROOT.GetCountry.GetRuler.GetFirstName] Restoration"
 je_meiji_main_reason:0 "#lore "The Way here set forth is indeed the teaching bequeathed by Our Imperial Ancestors, to be observed alike by Their Descendants and the subjects, infallible for all ages and true in all places. It is Our wish to lay it to heart in all reverence, in common with you, Our subjects, that we may all thus attain to the same virtue."\n- Mutsuhito Meiji, 1868#!\n\nThe Emperor has been restored to power, and the process of modernization begins. The empire must revitalize it's institutions and economy if it wishes to one day become a [concept_great_power]."
 je_meiji_main_goal:0 "Complete 3 Restoration [Concept('concept_journal_entry', '$concept_journal_entries$')]"
 je_meiji_diplomacy:0 "Restoration: Ending Sakoku"
 je_meiji_diplomacy_reason:0 "#lore "Social development in the West is endogenous, while Japan's social development is exogenous. Here, endogenous means emerging naturally from within, like a bud blooms into a flower in an outward motion, and exogenous means being forced to take a certain form because of external influences..."\n—Soseki Natsume, 1911#!\n\nJapan has for cenuries been an isolated economy, with little in the way of foreign trade. However, with the coming of the Black Ships and the restoration of the Emperor, that time is long past us. We must continue to reform the economy to pave the way for Japan to not just be a part of asian trade, but to lead it."
 je_meiji_economy:0 "Restoration: Industrialize Japan"
 je_meiji_economy_reason:0 "#lore "Life without industry is guilt, and industry without art is brutality."\n—John Ruskin, 1870#!\n\nFor Japan to grow and stand tall in front of the western powers it much be able to reach its full economic potential. The home islands are rich with raw resurces and industrious people, and thus the empire must take advantage of these gifts if it is to succeed."
 je_meiji_economy_goal:0 "Increase the Japanese GDP by 50%"
 je_meiji_army:0 "Restoration: Retire the Samurai"
 je_meiji_army_reason:0 "#lore "Even if my body rots in the land of Ezo, my soul will protect you as the East's Lord"\n-Hijikata Toshisan, 1869#!\n\nThe Samurai are our ancient feudal-hereditary warrior caste. For centuries they have fought for us and commanded our armies. But in the centuries of relative peace we have enjoyed, they have forgotten the ways of war and have become a burden to the state.\nAdditionally, altercations with western forces have revealed the inadequacy of the equipment and training of our average footsoldier. We must build a modern infantry corps if we are to ever secure our lands."
 meiji.1.t:0 "The [SCOPE.GetRootScope.GetCountry.GetCustom('jap_imperial_era_name')] Restoration"
 meiji.1.d:0 "The [SCOPE.gsInterestGroup('shogunate_ig').GetName] has fallen from power, and [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] has restored the political primacy of the monarchy. This momentous occasion marks the end of centuries of Shogunate rule in [ROOT.GetCountry.GetName], and heralds a new era of modernization and reform. The [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] must choose his political allies carefully."
 meiji.1.f:0 ""The Emperor of Japan announces to the sovereigns of all foreign countries and to their subjects that permission has been granted to the shōgun Tokugawa Yoshinobu to return the governing power in accordance with his own request. We shall henceforward exercise supreme authority in all the internal and external affairs of the country. Consequently, the title of Emperor must be substituted for that of Taikun, in which the treaties have been made. Officers are being appointed by us to the conduct of foreign affairs. It is desirable that the representatives of the treaty powers recognize this announcement.""
 meiji.1.a:0 "Industrial might will see us through."
 meiji.1.b:0 "We must look to the intellectuals."
 era_ninko:0 "Ninko"
 era_komei:0 "Komei"
 era_meiji:0 "Meiji"
 era_taisho:0 "Taisho"
 era_showa:0 "Showa"
 meiji.2.t:0 "A Renewed Japan"
 meiji.2.d:0 "A reformed army, an open and recognized country, a new society. [ROOT.GetCountry.GetName] stands as an equal among the powers of the world, and will perhaps begin to pursue imperial ambitions of her own."
 meiji.2.f:0 ""By the blessing of heaven we sit upon the sacred throne on which our ancestors reigned from time immemorial. The civilization and institutions of Japan are so different from those of other countries that we cannot expect to reach the declared end at once. It is our purpose to select from the various institutions prevailing among enlightened nations such as are best suited to our present conditions, and adapt them in gradual reforms and improvements of our policy and customs so as to be upon equality with them.""
 meiji.2.a:0 "The Empire of Japan shall rise."
 meiji.14.t:0 "Collapse of Tokugawa Coinage"
 meiji.14.d:0 "The establishment of Tokugawa coinage followed a period in which Japan was dependent on Chinese bronze coinage. This system instead established a sort of gold standard with a variety of different sized gold plates and coins. The stability of this system was ensured by the near total isolation of the Japanese economy from the outside world, which is no longer the case. Foreigners have bought out large amounts of gold currency at unsustainable rates causing mass inflation and the collapse of the coinage's stability."
 meiji.14.f:0 "The commoner looked with disdain at the prices listed on the butcher's cart, prices doubling from the month before, the few coins in his pocket worth less with every day that passed."
 meiji.14.a:0 "There is little we can do now."
 meiji.14.tt:0 "#P +5#! Bakumatsu Progress"
 meiji.15.t:0 "Portside Clash"
 meiji.15.d:0 "A disagreement between local guardsmen and foreign traders has escalated to a deadly brawl at a Japanese port. Among the casualties are several sailors and guards. Confusing and contradictory edicts on restrictions and growing anger towards foreigners has made this an increasingly common occurance."
 meiji.15.f:0 "The sound of blades and clubs colliding with flesh, the echoing of yells and screams across the dockyard drew countless onlookers."
 meiji.15.a:0 "Demand that the local daimyo changes the guard."
 meiji.15.tt:0 "#P +2#! Bakumatsu Progress"
 meiji.16.t:0 "Sonnō Jōi Groups Meet"
 meiji.16.d:0 "Sonnō jōi (revere the emperor, expel the barbarians) is a rallying cry of several neo-confucian and restorationist groups that seek to empower the emperor and strengthen Japan against the westerners. They are directly opposed to the shogunate which they see as weak against the foreign devils."
 meiji.16.f:0 ""The shogun has caved time and time again to the westerners and their black ships, NO MORE, only those loyal to the emperor and his will can protect us now.""
 meiji.16.a:0 "Cracks spread beneath the shogun's domain."
 meiji.16.tt:0 "#P +2#! Bakumatsu Progress"
 meiji.17.t:0 "The Shogunate Secured"
 meiji.17.d:0 "Having carefully walked the line and reformed key isntitutions, the Tokugawa clan has weathered the storm and has prepared itself for a new era."
 meiji.17.f:0 ""For us to have called our country the Land of the Gods was not mere vainglory. It was the gods who formed all the lands of the world at the Creation, and these gods were without exception born in Japan."\n\n—Hirata Atsutane, 1811#!"
 meiji.17.a:0 "Same as it ever was."
 meiji.18.t:0 "The Hokkaidō Development Commission"
 meiji.18.d:0 "The Imperial government now seeks to settle and guard the newley renamed island of Ezo, now offically Hokkaidō, and the unsettled island of Karafuto to the north. Soldiers recuruited as armed settlers called Tondenhei haven taken up offers for land by the thousands, opening up a whole new frontier for the Empire. This has of course come at great expense to the local Ainu population who face mounting oppression and violence."
 meiji.18.f:0 ""...thereupon both the bad Gods and the brilliant gods looked towards the place where the luminary was to rise. But the fox god alone stood looking towards the west. After a little time, the fox cried out: "I see the sunrise." On the gods, both bad and good, turning round and gazing, they saw in truth the refulgence of the luminary in the west. This is the cause for which the brilliant gods rule the world."\n\n—Ainu Folk Tale#!"
 meiji.18.a:0 "The north calls forth the willing."
 meiji.19.t:0 "A New Capital"
 meiji.19.d:0 "With the shogunate dissolved the imperial administration has seen a number of changes, including the seat of of the Emperor's power."
 meiji.19.f:0 "The former Shogun bows with respect and shame as he hands over his residence and seat of power, the mighty Edo Castle, to the restored Emperor. Renovations are set to begin at once; the old castle to be replaced by a glorious Imperial Palace. Though the exterior will appear much the same as the former imperial residence in Kyoto, the Emperor plans to combine Japan's rich decorative traditions with strange Western fashions. A metaphor, perhaps, for the future shape of Japan."
 meiji.19.a:0 "The sun rises on a new Japan."
 meiji.20.t:0 "The Birth of Japanese Capital"
 meiji.20.d:0 "The end of feudal mercantalism has revolutionized industry in Japan. Once small cottage industries can now diversify and expand with industrial vigor, and new aspiring entrepreneurs build new dynasties in shipping, mining, and more."
 meiji.20.f:0 "Banks and and insurance agencies pop up on every corner in Tokyo. Buisnessmen march through the streets, managing shipments and updating ledgers. Iron works and canneries that have seemingly sprung up overnight spew smoke into the skys above. The city hums with the sound of progress."
 meiji.20.a:0 "The engines of capital roar to life."
 meiji.21.t:0 "Tea at the Embassy"
 meiji.21.d:0 "The Empire has established embassies and formal trade contacts with many of the great powers. From around the world diplomats come to Tokyo to build connections with the newest player on the world's stage."
 meiji.21.f:0 "The American took a long sip from his cup, "I am grateful for your hospitality Mr. Arinori, I would happy to recommend a second look at steel tariffs to Washington, but I need some assurances first...""
 meiji.21.a:0 "A done deal."
 meiji.22.t:0 "Farmers Refuse to Part With Harvest"
 meiji.22.d:0 "The rural peasantry has become increasingly incensed at fluctuating prices in the wake of mass inflation. Peasants in [ROOT.GetState.GetName] are now refusing to meet the quotas of local daimyos and are demanding more consistent compensation and are staging small scale revolts against local authorities."
 meiji.22.f:0 ""It is better to be a warrior in a garden, than a gardener in a war."\n\n—Miyamoto Musashi, 1645#!"
 meiji.22.a:0 "The foundation shakes."
 je_bpm_rising_sun:0 "The Sun Rises"
 je_bpm_rising_sun_reason:0 "The Japanese Empire is at a crossroads. Having awakened from its isolationist slumber it has refomed its military and society into one of growing industrial might, but to secure our position, we must build an empire in the western style. Securing footholds in East Asia is our top priority, as well as forming a buffer against powers such as the Russians. On top of this our navy requires a fleet of modern armored warships to secure our sealines as we expand outwards.\n\n#lore How courteous is the Japanese;\nHe always says, “Excuse it, please.”\nHe climbs into his neighbor's garden,\nAnd smiles, and says, “I beg your pardon”;\nHe bows and grins a friendly grin,\nAnd calls his hungry family in;\nHe grins, and bows a friendly bow;\n“So sorry, this my garden now.”\n-Ogden Nash, 1938#!"
 bpm_owns_kor_tt:0 "Owns all Korean states"
 je_bpm_taisho_democracy:0 "Chrysanthemum Democracy"
 je_bpm_taisho_democracy_reason:0 "While Japan has developed a parliamentary system based on the powers of Europe, participation in this system is limited to a select few of the empire's citizens, primarily those of old and powerful families.\nGroups such as the Freedom and People's Rights Movement and burgeoning labor organizations have begun to agitate for an expanded franchise, as well as for the slackening of government restrictions on speech and public assembly. Failure to dislodge the current oligarchy dominating Japanese politics may forever cement the influence of the militarists over the imperial government.\n\n#lore "Democracy is not contingent on where legal theory locates sovereignty. It merely implies that in the exercise of this sovereignty, the sovereign should always make it his policy to value the well-being and opinions of the people.... There is no doubt that even in a monarchy this principle can be honored."\n-Yoshino Sakuzō, 1916"
 bpm_taisho_fail_tt:0 "25 Years have passed without cementing popular democracy."
 bpm_japan.2.t:0 "Minpon Shugi"
 bpm_japan.2.d:0 "Following a series of constitutional reforms, Japan has overcome the militant oligrachy that had formed in the wake of the imperial restoration. The popular doctrine of Minpon Shugi, retains sovereignty in the emperor, but stresses the importance of liberal institutions  It now enters a new age with an ascendant progressive movement that is sure to define the future of the empire."
 bpm_japan.2.f:0 "As a case in point, while it is natural that we show deference to a government official, this is not because of the dignity of that person's status. He is accorded that respect only because he performs that important role through his talent and virtues, and because he deals with weighty laws for the sake of the people. It is the laws which have dignity, not the man."\n\n-Fukuzawa Yukichi, 1872#!"
 bpm_japan.2.a:0 "A new era for Japanese politics."
 bpm_not_emperor_restored:0 "The Emperor has not (yet) been restored."
 bpm_fight_shogunate_civil_war:0 "Shogunate loyalists have risen in rebellion."
 bpm_china_revolts.102.a:0 "China marches on!"
