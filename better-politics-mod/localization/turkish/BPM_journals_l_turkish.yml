# MODERNIZERS (Zapandiki JE facelift)

 je_bpm_modernizers:0 "Modernleştirici Tartışması"
 je_bpm_modernizers_status:0 "$bpm_je_all_modernizers$ ve rakiplerinin tartışmalarını izleyin."
 je_bpm_modernizers_status_no_dialectic:0 "#bold Diyalektik#! şimdilik çok zayıf."
 je_bpm_modernizers_status_modernizer_prominence_overwhelming:0 "Entelektüeller arasında $bpm_je_all_modernizer$ler #bold ezici bir şekilde baskın#!"
 je_bpm_modernizers_status_modernizer_prominence_strong:0 "Entelektüeller arasında $bpm_je_all_modernizer$ler baskın."
 je_bpm_modernizers_status_modernizer_prominence_weak:0 "Entelektüeller arasında $bpm_je_all_modernizer$ler tutunmaya çalışıyor."
 je_bpm_modernizers_status_conservative_prominence_overwhelming:0 "Entelektüeller arasında $bpm_je_all_antimodernizer$ler #bold ezici bir şekilde baskın#!"
 je_bpm_modernizers_status_conservative_prominence_strong:0 "Entelektüeller arasında $bpm_je_all_antimodernizer$ler baskın."
 je_bpm_modernizers_status_conservative_prominence_weak:0 "Entelektüeller arasında $bpm_je_all_antimodernizer$ler tutunmaya çalışıyor."
 je_bpm_modernizers_status_no_prominence:0 "Entelektüeller arasında $bpm_je_all_antimodernizer$ler ve $bpm_je_all_modernizer$ler çekişiyor."
 je_bpm_modernizers_reason:0 "@information! #blue Aktifken [GetLawType('law_repeatable_culture_invite_foreign_experts').GetName] [Concept('concept_bpm_repeatable_law', '$concept_bpm_repeatable_law$')] kilidini açar #!\n\n$bpm_je_all_modernizers$ Diyalektik Gücü: #tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_modernizers_modernizer_strength_tooltip [Country.MakeScope.ScriptValue('bpm_je_modernizers_ideology_rate_modernizers')|2]#!\n$bpm_je_all_antimodernizers$ Diyalektik Gücü: #tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_modernizers_conservative_strength_tooltip [Country.MakeScope.ScriptValue('bpm_je_modernizers_ideology_rate_conservatives')|2]#! \n\nAvrupa ve Amerika uluslarına bakıldığında, kurumlarımızın giderek daha fazla modası geçmiş ve güvencesiz hale geldiği fazlasıyla netleşti. Bu eksikliği ilk fark edenler, aralarından geleceğe dair iki zıt vizyon sunmak üzere iki kanadın ortaya çıktığı entelektüellerimiz oldu: $bpm_je_all_modernizers_tt$ ve $bpm_je_all_anti_modernizers_tt$.\n\nTartışmanın #v Sosyal Etkisi#! #v > 25#! olduğunda, ikisinden hangisinin daha etkili olduğuna bağlı olarak değiştiriciler (modifiers) kazanacağız.\n\nEğer $bpm_je_all_modernizers$ kazanıyorsa:\n  @arrow_up!Toplum [concept_technology] (Teknoloji) araştırma hızı ve yayılımı\n  @arrow_down!Askeri [concept_technology] (Teknoloji) araştırma hızı ve yayılımı\n  @arrow_down![concept_bpm_political_stability] (Siyasi Katılık) hedefi\n  @information! @intelligentsia_bpm! yüksek #v Sosyal Etki#! altında radikal duruşlar benimser\n\nEğer $bpm_je_all_antimodernizers$ kazanıyorsa:\n  @arrow_down!Toplum [concept_technology] (Teknoloji) araştırma hızı ve yayılımı\n  @arrow_up!Askeri [concept_technology] (Teknoloji) araştırma hızı ve yayılımı\n  @arrow_up![concept_bpm_political_stability] (Siyasi Katılık) hedefi\n\nHer İkisi de Şunları Sağlar:\n  @arrow_up!Üretim [concept_technology] (Teknoloji) yayılımı\n  @arrow_up!Haftalık [concept_innovation] (İnovasyon)\n\n@warning! Daha gelenekçi unsurlarımız, yabancı etkisinin tecavüzü olarak algıladıkları şeyleri hafife almayabilirler ve işler çok ileri giderse kaba ve şiddetli bir #N Darbeye#! başvurabilirler.\n\n#lore \"Rusya son üç yüz yıldır Batı ile kaynaşmayı arzulamıştır; son üç yüz yıldır Batı'dan aşağı olduğunu kabul etmiş, tüm fikirlerini, tüm öğretilerini... Batı'dan almıştır. Krallarımızın en büyüğü... eski Rusya'yı reddetti. Tüm eski kurumlarımızı silip süpürdü ve eski geleneklerimizi çöpe attı... İtiraf etmelisiniz ki muazzamdı, Büyük Petro'nun yaratımı, bundan böyle izleyeceğimiz yolu dikte eden bu dahi adam fikri.\"\n\n—Pyotr Çaadayev, 1837#!"

