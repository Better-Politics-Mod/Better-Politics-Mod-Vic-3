l_turkish:
  bpm_marlib_split.1.t:0 "Piyasa Liberalleri"
  bpm_marlib_split.1.d:0 "Bazen umutsuz birer ütopyacı olarak alaya alınan, bazen de ruhsuz bir şekilde kâr peşinde koşmakla suçlanan @ig_market_liberals! #yellow Piyasa Liberalleri#!, görünmez elin gücünü savunmak için geldiler. Mübadele (ticaret) yoluyla barış, rekabet yoluyla refah, liyakat sahibi olanların rehberliğinde bir devlet ve her bireyin kendi kaderinin mimarı olduğu bir toplum vaat ediyorlar."
  bpm_marlib_split.1.f:0 "Serbest ticaret, sanayiyi teşvik ederek, yaratıcılığı ödüllendirerek ve doğanın bahşettiği kendine has güçleri en etkili şekilde kullanarak, emeği en verimli ve en ekonomik biçimde dağıtır: aynı zamanda, üretimin genel hacmini artırarak genel faydayı yayar ve tüm uygar dünyadaki evrensel uluslar toplumunu ortak bir çıkar ve etkileşim bağıyla birbirine bağlar.\n\n—David Ricardo, 1821"
  bpm_marlib_split.1.a:0 "Piyasa gerekeni sağlayacaktır!"

  bpm_marlib_split.2.t:0 "Faydacılar"
  bpm_marlib_split.2.d:0 "Bazen aşırı pragmatik olarak görülen, bazen de daha büyük iyiliğe yaptıkları vurgu nedeniyle övülen @ig_market_liberals! #yellow Faydacılar#!, en yüksek sayıdaki insan için en yüksek mutluluğu maksimize etmenin savunucuları olarak ortaya çıktılar. Bireysel özgürlükleri toplumsal refah ile dengeleyen politikaları savunuyor ve daha adil ve verimli bir toplum yaratmayı hedefliyorlar."
  bpm_marlib_split.2.f:0 "En yüksek sayıdaki insanın en yüksek mutluluğu, ahlakın ve yasamanın temelidir. Genel refahı artıran ve acıyı azaltan eylemlere öncelik vererek, rasyonel ilkeler ve insani değerler üzerinde yükselen bir toplum inşa edebiliriz.\n\n—Jeremy Bentham, 1789"
  bpm_marlib_split.2.a:0 "En yüksek sayıdaki insan için en büyük fayda!"