 concept_bpm_synergy_weight_desc: "İki farklı kuruma atanan [concept_bpm_cabinet] üyesi arasındaki ideolojik benzerliğin [concept_bpm_cabinet] genel sinerjisini etkileme Ağırlığı."
 concept_bpm_synergy: "Sinerji"
 concept_bpm_synergy_desc: "Sinerji, [Concept('concept_bpm_cabinet', 'Hükümetin')] uyumunun bir ölçüsüdür. Sinerji ne kadar yüksek olursa, [concept_bpm_cabinet] politikaları uygulamada o kadar etkili olur.\n\nSinerji, en etkilisi Hükümet Başkanı olmak üzere [Concept('concept_bpm_minister','Bakanlarınızın')] her birinin ideolojik yakınlığından hesaplanır. [Concept('concept_bpm_institutional_ig','Kurumsal Çıkar Gruplarının')] birbirleriyle çatışma olasılığı daha düşüktür; buna karşın [Concept('concept_bpm_ideological_ig','İdeolojik Çıkar Grupları')] anlaşmazlıkları önlemek için benzer ideolojileri paylaşmalıdır. Bazı siyasi sistemler, son derece işlevsel bir [Concept('concept_bpm_cabinet', 'Hükümet')] elde etmede diğerlerinden daha fazla zorluk çekebilir."

 bpm_antagonism_tt: "#header [Concept('concept_bpm_antagonism', 'Düşmanlık')]#!: #v [GetPlayer.MakeScope.ScriptValue('bpm_antagonism_cached')|0]%#!\n$TOOLTIP_DELIMITER$\nDüşmanlık, atandıkları [concept_institution] varlığına karşı çıkan [concept_bpm_cabinet] üyelerinin miktarıdır. [concept_bpm_antagonism] ne kadar yüksek olursa, [concept_bpm_cabinet] politikaları uygulamada o kadar az etkili olacaktır.\n\nMevcut [Concept('concept_bpm_antagonism', 'Düşmanca')] [concept_bpm_cabinet] üyelerinin sayısı [GetPlayer.MakeScope.ScriptValue('bpm_antagonism_raw_cached')|v0] şeklindedir."

