je_danubian_federation: "Federal Çözüm"
je_danubian_federation_reason: "[ROOT.GetCountry.GetName] içindeki sayısız milliyet arasındaki sürtüşmeler, İmparatorluğun bütünlüğü için uzun zamandır bir tehlike olmuştur. Çeşitli milliyetlerin haklarını savunanlar uzun zamandır İmparatorluk için çeşitli federalleşme biçimleri talep ediyorlar ve son yıllar onları hanedanı korumak adına radikal reformlarla ilgilenen [SCOPE.gsInterestGroup('armed_forces_ig').GetName] üyeleriyle temasa geçirdi. Bu önerilerin en yenisi olan önerilen #b $dyn_c_usga$#!, eski veliaht topraklarını (crownlands) ortadan kaldıracak ve bunların yerine etnik sınırlara göre çizilmiş, kendi kendini yöneten bir dizi devlet kuracaktır.\n\nBu teklif, tarihi Macaristan'ın bölünmesi önerisine karşı çıkan [GetCulture('hungarian').GetName] politikacıların yanı sıra Alman olmayan eyaletlerde azınlık durumuna düşmesi muhtemel olan [GetCulture('south_german').GetName] nüfusu tarafından da muhalefetle karşılaştı."

austria_federation.1.t: "[SelectLocalization(SCOPE.sCharacter('relevant_character').IsValid, SCOPE.sCharacter('relevant_character').GetLastName, 'Federal')] Teklifi"
austria_federation.1.d: "Milliyet haklarının [SCOPE.sCharacter('relevant_character').GetCulture.GetName] savunucusu olan [SCOPE.sCharacter('relevant_character').GetFullName], İmparatorluğun federal ve çok etnikli bir devlet olarak yeniden örgütlenmesi için bir öneri sundu. [SCOPE.sCharacter('relevant_character').GetHerHis|U] önerisi, [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]'ın kendisiyle aynı fikirde olan ortakları arasında popüler hale geldi."
austria_federation.1.d_mil: "[SCOPE.sCharacter('relevant_character').GetInterestGroup.GetName] içinde etkili bir figür olan [SCOPE.sCharacter('relevant_character').GetFullName], İmparatorluğu federalleştirerek [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]'ın otoritesini geri getirmek için bir öneri sundu. [SCOPE.sCharacter('relevant_character').GetHerHis|U] önerisi, sarayın kendisiyle aynı fikirde olan üyeleri arasında popüler hale geldi."
austria_federation.1.f: ""O halde bu bakış açısına göre bu bir "çöküş" meselesi değil, [ROOT.GetCountry.GetNameNoFormatting]'nın yeniden örgütlenmesi ve yeniden doğuşu meselesidir. Keşke bu imparatorluğa yürekten önem veren herkes, karanlık özlemlerinde bile ileriye giden doğru yolun tamamen farkına varabilseydi. Öncelikle, sadece bağımsız ulusal devletlerin var olma hakkına sahip olduğu doğru değildir. Haklı olarak çokça zikredilen $SWI$ (İsviçre) örneği, karma uluslu bir yönetim tipidir ve hiç kimse makul bir şekilde onun var olma hakkını inkar etmek istemez. Aslında bizim imparatorluğumuzda tarihi süreç, sadece yeni uyanan ihtiyaçlarına karşılık gelen modern bir ulus-devlet ilişkileri formu için mücadele etmektedir."\n\n— Aurel Popovici, #italic Büyük Avusturya Birleşik Devletleri#!"
austria_federation.1.a: "Bu [ROOT.GetCountry.GetNameNoFormatting]'nın ihtiyaç duyduğu reformdur."
austria_federation.1.b: "Bunu şimdi yönetebileceğimizi umamayız."
modifier_endorse_popovici_proposal: "Desteklenen Teklif"
modifier_shelve_popovici_proposal: "Rafa Kaldırılmış Teklif"

austria_federation.2.t: "Diğer Yön"
austria_federation.2.d: "[ROOT.GetCountry.GetName] bildirgesi, ulusal olmayan (a-national) birliği hakim ulus-devlet modeline sağlam bir alternatif olarak kurmuştur. Başkaları meşruiyetlerini ortak kandan alırken, biz gücümüzü hanedandan ve halklarımızın çeşitliliğinden alacağız."
austria_federation.2.f: ""Neşe, sen Tanrı'nın parlayan kıvılcımı,\nElysium'un kızı,\nAteşli bir vecd ile, tanrıça,\nYaklaşıyoruz senin tapınağına!\nSenin büyün yeniden birleştiriyor,\nSert geleneklerin ayırdıklarını;\nTüm insanlar kardeş olacak,\nSenin koruyucu kanatlarının altında."\n\n— Friedrich Schiller, "Neşeye Övgü""
austria_federation.2.a: "İmparatorluk tüm halklarını birleştirir."
austria_federation.2.b: "Halkın İmparatoru çok yaşa!"

austria_federation.3.t: "Bohemya Sorunu"
austria_federation.3.desc: "Eski Bohemya Tacı'nın topraklarında yüzlerce yıldır hem [SCOPE.sCulture('czech_culture').GetName] hem de [GetCulture('south_german').GetName] nüfusu yaşamaktadır. Eğer Federasyon içinde bir [GetCulture('czech').GetNameNoFormatting] devleti kurulacaksa, Bohemya ve Moravya Almanları sorunu çözülmelidir."
austria_federation.3.f: ""Harita neden öyle görünüyor? Ne kadar da tuhaf bir şekil, değil mi?"\n\n"Bohemyalılar onları yüz yıl kadar önce davet ettiler. O zamanlar birinin Alman ya da Çek olmasının bir önemi yoktu, Tanrı'nın ve Kral'ın gözünde herkes eşitti. Bana sorarsanız, her ikisi de Protestanları suçlamalı.""
austria_federation.3.a: "Bohemya ve Moravya Almanlarının kendi devletleri olmalıdır."
austria_federation.3.b: "Bohemya birleşecek ve Almanlar eşit vatandaşlar olacak."
austria_federation.3.c: "Eğer Almanlar özerklik alabilirse, Çekler de Slovakya'yı alabilir."
austria_federation.3.d: "Çekoslovakya hiçbir çekince olmaksızın birleşecektir."

austria_federation.4.t: "Slovakya'nın Kaderi"
austria_federation.4.desc: "[SCOPE.sCulture('slovak_culture').GetName] halkının yaşadığı topraklar uzun zamandır Macaristan ile iç içe geçmiş durumdadır. [SelectLocalization(SCOPE.sState('slovakia_state').IsValid, SCOPE.sState('slovakia_state').GetName, 'STATE_SLOVAKIA')] bölgesini Macaristan'dan ayırma düşüncesi [GetCulture('hungarian').GetName] milliyetçilerini kesinlikle kızdıracaktır, ancak projemizin diğer Batı Slav halkları nezdindeki inandırıcılığını güvence altına alabilir."
austria_federation.4.f: ""Orası Macaristan'ın başkentiydi. Bu konuda gerçekten dikkatli adımlar atmalısınız."\n\n"Peki Slovaklar oranın Macaristan başkenti olmasını istediler mi? Neden Macaristan yüzünden bundan mahrum bırakılsınlar? Sadece ve sadece o bölgede yaşayanların fikirlerini dikkate almalıyız. Realpolitik (gerçekçi siyaset) yapmaktan oldukça yorulmaya başladım.""
austria_federation.4.a: "Bir [SCOPE.sCulture('slovak_culture').GetName] devleti kurun."
austria_federation.4.b: "Bir [SCOPE.sCulture('slovak_culture').GetName] devletini Zips Almanlarına özerklik verilmesi şartına bağlayın."
austria_federation.4.c: "Slovakya, Macaristan'ın bir parçası olarak tutulacaktır."
austria_federation.4.d: "Çekler ve Slovaklar için ortak bir devleti destekleyin."

austria_federation.5.t: "Galiçya'nın Geleceği"
austria_federation.5.desc: "Galiçya bölgesi, [ROOT.GetCountry.GetNameNoFlag]'nın Polonya'nın Paylaşılmasından elde ettiği ganimetleri temsil etmektedir. Bölge geleneksel olarak [SCOPE.sCulture('polish_culture').GetName] aristokratların hakimiyetinde olsa da, doğusunun büyük bölümünde [GetCulture('ukrainian').GetName] çoğunluk bulunmaktadır. [SCOPE.sCulture('polish_culture').GetNameNoFormatting] desteğini güvence altına almak için elverişli bir bölünme ayarlamalıyız."
austria_federation.5.f: ""Ne düşünüyorsun? Çizgiyi nereye çekiyoruz?"\n\n"Rutenyalıların beklentileri Polonyalılardan daha düşük. Doğuyu Batıdan temiz bir şekilde ayırmak onları memnun edecek, ancak doğal olarak daha fazlasını bekleyen Polonyalıları kızdıracaktır. Lemberg'i Polonyalılara verin, Rutenyalılar başka bir taviz karşılığında bizi hâlâ hoş görmeye istekli olabilirler. Görevinize imrenmiyorum, ancak gayet uygulanabilir de olabilir.""
austria_federation.5.a: "[GetCulture('polish').GetName] devletini Batı Galiçya ile sınırlayın."
austria_federation.5.b: "Lwów, [GetCulture('polish').GetName] otoritesi altında olmak kaydıyla Galiçya'yı bölün."
austria_federation.5.c: "Galiçya'nın tamamını bir [GetCulture('polish').GetName] devleti olarak tutun."

austria_federation.6.t: "Macaristan'ın Bölünmesi"
austria_federation.6.desc: "Macaristan'ın geleneksel sınırları, [SCOPE.sCulture('hungarian_culture').GetName] olmayan hatırı sayılır büyüklükte pek çok bölgeyi içermektedir. Ya [SCOPE.sCulture('hungarian_culture').GetName] halkını yatıştırmak ya da Macaristan'ı bölerek federal projeye yönelik [SCOPE.sCulture('hungarian_culture').GetNameNoFormatting] muhalefetini kışkırtmak arasında bir seçim yapmalıyız."
austria_federation.6.desc_dual: "[SCOPE.sCulture('hungarian_culture').GetName] ulusu, büyük ölçüde farklılıklara sahip bir bölge üzerinde temelde denetimsiz bir şekilde hüküm süren İmparatorluğumuzun uzun zamandır eşit bir yarısı olmuştur. Ya [SCOPE.sCountry('hungary_scope').GetNameNoFlag] devletini yatıştırmak ya da milliyetlerine kendi devletlerini vererek bir [SCOPE.sCulture('hungarian_culture').GetNameNoFormatting] reaksiyonunu kışkırtmak arasında bir seçim yapmalıyız."
austria_federation.6.f: ""Bu planın uygulanamaz olmasından sık sık endişe duyuyorum. Macarlar isyan etmeyecek mi?"\n\n"Çinli bir general yağmur nedeniyle gecikir ve ataşesine geç kalmanın cezasının ne olduğunu sorar. "Ölüm" diye cevap verir. Ve sonra isyanın cezasını sorar - elbette ki aynıdır. Ve Hanedanlık böyle yıkılır. Macarlarla içinde bulunduğumuz durum da tamamen aynı. En ufak bir tavizde isyan edeceklerse, neden en büyüğünü zorlamayalım?""
austria_federation.6.a: "Tarihi Macaristan'ı Federasyon içinde koruyun."
austria_federation.6.b: "[GetCulture('hungarian').GetCustom('getPluralDemonym')] sadece Slovakya'dan vazgeçmelidir."
austria_federation.6.c: "Hırvatistan ve Transilvanya'yı Macaristan'dan ayırın."
austria_federation.6.d: "Macaristan'ı, Macarların çoğunlukta olduğu topraklarla sınırlandırın."

austria_federation.7.t: "Sloven Toprakları"
austria_federation.7.desc: "Büyük ölçüde [SCOPE.sState('slovenia_scope').GetName] bölgesinde yoğunlaşan [SCOPE.sCulture('slovene_culture').GetName] halkı, İmparatorluğumuzdaki birkaç Güney Slav milliyetinden biridir. [SCOPE.sCulture('slovene_culture').GetName] devletinin, birçok Güney Slav devletinden biri mi olacağı yoksa diğer benzer halklarla bir birlik içine mi yerleştirileceği konusunu düşünmeliyiz."
austria_federation.7.desc_istria: "İmparatorluğumuzun güneyindeki [SelectLocalization(SCOPE.sState('istria_scope').IsValid, SCOPE.sState('istria_scope').GetName, 'STATE_ISTRIA')] üzerindeki [SCOPE.sCulture('slovene_culture').GetName] hak iddiaları hem [GetCulture('croat').GetName] hem de [GetCulture('north_italian').GetName] halklarının iddialarıyla çatışmaktadır. Ayrıca, [SCOPE.sCulture('slovene_culture').GetName] devletinin, birçok Güney Slav devletinden biri mi olacağı yoksa diğer benzer halklarla bir birlik içine mi yerleştirileceği sorunu bulunmaktadır."
austria_federation.7.f: ""Şimdi, sahile bakarsanız Güneyin büyük ölçüde Hırvat, Kuzeyin ise İtalyan olduğunu göreceksiniz. Sloven kısmı ise ortalarda bir yerde kalıyor. Biraz kördüğüm oldu, ama sanırım öğle yemeğinden önce bu düğümü çözebiliriz. Sistiana yeterince iyi bir liman, öyle değil mi?""
austria_federation.7.a: "Sloven devleti denize kadar uzanacak."
austria_federation.7.b1: "[SelectLocalization(SCOPE.sState('istria_scope').IsValid, SCOPE.sState('istria_scope').GetName, 'STATE_ISTRIA')] için Hırvat ve İtalyan hak iddialarını destekleyin."
austria_federation.7.b2: "[SCOPE.sState('slovenia_scope').GetName] bölgesinde bir Sloven devleti kurun."
austria_federation.7.c: "İmparatorluğumuzda zaten yeterince Slav devleti var."
austria_federation.7.d: "Alman ve İtalyan toprakları hariç, bir Sloven-Hırvat birliği verin."
austria_federation.7.e: "Federasyon içinde tüm Güney Slavları için bir devleti destekleyin."

austria_federation.8.t: "Üçlü Krallık"
austria_federation.8.desc: "[SCOPE.sCulture('croat_culture').GetName] halkının yaşadığı veliaht toprakları, Venedik'in eski bölgelerini almamızdan bu yana [ROOT.GetCountry.GetNameNoFlag] ve [GetCulture('hungarian').GetName] yargı yetkisi arasında bölünmüştür. Eğer [SCOPE.sCulture('croat_culture').GetCustom('getPluralDemonym')] halkını tatmin etmek istiyorsak, tüm [SCOPE.sCulture('croat_culture').GetNameNoFormatting] halkını bir [SCOPE.sCulture('croat_culture').GetNameNoFormatting] devleti altında birleştirmeliyiz."
austria_federation.8.desc_triune: "[SelectLocalization(SCOPE.sCountry('croatia_scope').IsValid, SCOPE.sCountry('croatia_scope').GetName, 'CRO')] devletinin kurulması, [SCOPE.sCulture('croat_culture').GetName] halkının tek bir siyasi yapı altında birleşmesi yönündeki uzun süredir devam eden taleplerini tatmin etti. Şimdi, [SCOPE.sCulture('croat_culture').GetName] devletinin birçok Güney Slav devletinden biri mi olacağı yoksa diğer benzer halklarla bir birlik içine mi yerleştirileceğini düşünmeliyiz."
austria_federation.8.f: "Güney Slavları sorunu bir ülseri tetikleyecek kadar zordu. Macaristan, bir haritacının yeni ve güçlü bir idari yapı önerme konusunda tereddüt etmesine yetecek kadar uzun bir süre [ROOT.GetCountry.GetCapital.GetCityHubName]'in bağrında bir diken olmuştu. Ancak hem güçlü hem de sarsılmaz sadakate sahip bir İlirya ihtimali... belki de mümkündür. Tabii her şey tam da istendiği gibi giderse."
austria_federation.8.a: "Hırvat devletini [ROOT.GetCountry.GetAdjective] Hırvatistan'ı ile sınırlayın."
austria_federation.8.b: "Mevcut Üçlü Krallığı Federasyon içinde koruyun."
austria_federation.8.c: "Hırvat topraklarını bir Üçlü Krallık altında birleştirin."
austria_federation.8.d: "Sloven ve Hırvat toprakları arasında bir birlik kurun."
austria_federation.8.e: "Federasyon içinde tüm Güney Slavları için bir devleti destekleyin."

austria_federation.9.t: "Ormanın Ötesi"
austria_federation.9.desc: "[SCOPE.sCulture('romanian_culture').GetName] halkının yaşadığı veliaht toprakları İmparatorluğumuzun en çeşitli bölgelerinden bazılarıdır. Herhangi bir [SCOPE.sCulture('romanian_culture').GetNameNoFormatting] bölgesinin kurulması, [GetCulture('hungarian').GetName] milliyetçilerini kesinlikle telaşlandıracaktır ve bölgedeki [GetCulture('south_german').GetName] grupları özerklik konusunda endişelidir."
austria_federation.9.f: ""Burada en az üç özerkliğe ihtiyacımız olacak. Muhtemelen daha fazlasına. Bütün bu Almanlar nereden geldi?"\n\n"Onları buraya biz yerleştirdik — hem de oldukça yakın bir zamanda, Türklerle yapılan son savaştan sonra. Görünüşe göre bize son bir kez daha musallat olmak için geri dönüyorlar.""
austria_federation.9.a: "Romanya devletine Banat'ı ve tüm Transilvanya'yı verin."
austria_federation.9.b: "Romanya devletine Sekelistan hariç her yeri verin."
austria_federation.9.c: "Transilvanya Romanyalıdır, ancak Banat Almandır."
austria_federation.9.d: "Romanya devletini Transilvanya'nın Güneyine doğru küçültün."
austria_federation.9.e: "Transilvanya'nın tamamı geri dönülemez şekilde Macar'dır."

austria_federation.10.t: "Batı Sınırları"
austria_federation.10.desc: "İtalyan yarımadasını kasıp kavuran milliyetçi akımlar bizi şimdiden İtalyan topraklarımızın çoğundan mahrum bıraktı. Kalan [SCOPE.sCulture('north_italian_culture').GetName] nüfusunun desteği sağlanacaksa, İtalyan, [GetCulture('slovene').GetName] ve [GetCulture('south_german').GetName] toprakları arasındaki mevcut anlaşmazlıklar çözülmelidir."
austria_federation.10.desc_lomven: "[SCOPE.sCulture('north_italian_culture').GetName] halkı, İtalyan veliaht topraklarının nüfusu ve ekonomik gücü sayesinde İmparatorluktaki en etkili milliyetlerden biridir. Eğer federalleşme için destekleri sağlanacaksa, İtalyan, [GetCulture('slovene').GetName] ve [GetCulture('south_german').GetName] toprakları arasındaki mevcut anlaşmazlıklar [GetCulture('north_italian').GetNameNoFormatting] milliyetçilerini tatmin edecek şekilde çözülmelidir."
austria_federation.10.f: ""Donanmadan bir mektup aldım. İşe alım sayıları adına İtalyanlara karşı cömert olmamı istiyor."\n\n"Şaşırmadım. Oldukça İtalyan bir kurumdur."\n\n"Ben de Palermo'dan bir mektup aldım. O da benden... şey, bunu burada tekrar etmeyeceğim."\n\n"Bunu söylemekten nefret ediyorum, ama o daha bile İtalyan.""
austria_federation.10.a: "Trento ve Trieste'nin her ikisi de İtalyan olacak."
austria_federation.10.b: "Trento İtalyan olacak ama Trieste Slav."
austria_federation.10.c: "Trieste tek başına yeterlidir."
austria_federation.10.d: "Lombardiya-Venedik yeterli bir temsildir."
austria_federation.10.e: "Böylesine küçük nüfuslar kendi devletlerini haklı çıkarmaz."

austria_federation.11.t: "Sınır Bölgesi"
austria_federation.11.desc: "[SelectLocalization(SCOPE.sState('east_galicia_state').IsValid, SCOPE.sState('east_galicia_state').GetName, 'STATE_EAST_GALICIA')] bölgesindeki [SCOPE.sCulture('ukrainian_culture').GetName] nüfusu, İngiliz Milletler Topluluğu günlerinden beri [GetCulture('polish').GetName] seçkinleri tarafından yönetilmiştir. [SelectLocalization(SCOPE.sState('east_galicia_state').IsValid, SCOPE.sState('east_galicia_state').GetCityHubName, 'HUB_NAME_STATE_EAST_GALICIA_city_polish')] kentinin büyük ölçüde [GetCulture('polish').GetNameNoFormatting] olan nüfusu, bir [GetCulture('polish').GetNameNoFormatting] devleti altında özerklik talep etmektedir. Bunu kabul etmek [GetCulture('polish').GetCustom('getPluralDemonym')] halkını yatıştırır, ancak [SCOPE.sCulture('ukrainian_culture').GetNameNoFormatting] devletini hayati bir ekonomik motordan mahrum bırakır."
austria_federation.11.f: ""Galiçya mı? Orada tuhaf bir dinamik var. Aristokratlar [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]'dan nefret ederler, ancak köylüler [ROOT.GetCountry.GetRuler.GetHerHim] makamına bayılırlar. Aristokratlar - ki çoğu Polonyalıdır - isyan etmeye kalkıştıklarında, köylüler malikanelerini basıp onları ipe çektiler. Sözde isyancıları korumak için Orduyu göndermek zorunda kaldık. Bana soracak olursanız, bu olay Rutenyalıların kendi devletlerini tam da orada ve o anda kazandıklarını gösterir derdim.""
austria_federation.11.a: "Ukrayna devletine tüm Doğu Galiçya'yı verin."
austria_federation.11.b: "Lwów şehri Polonya otoritesinde olmak kaydıyla Doğu Galiçya'da bir Ukrayna devleti kurun."
austria_federation.11.c: "Polonyalıların Lwów şehrine karşılık Ukraynalılara Bukovina'yı teklif edin."
austria_federation.11.d: "Galiçya'nın tamamı Polonya toprağıdır."

austria_federation.12.t: "[SelectLocalization(SCOPE.sState('vojvodina_state').IsValid, SCOPE.sState('vojvodina_state').GetName, 'STATE_DELVIDEK_serbian')] Sırpları"
austria_federation.12.desc: "[SCOPE.sState('vojvodina_state').GetName] eyaleti uzun zamandır [SCOPE.sCulture('serb_culture').GetName] kültürünün merkezi olarak hizmet vermiştir. Bölgedeki [SCOPE.sCulture('serb_culture').GetNameNoFormatting] nüfusu, başkenti [SCOPE.sState('vojvodina_state').GetCityHubName] olan bir [SCOPE.sCulture('serb_culture').GetNameNoFormatting] devletinin kurulmasını talep etti. Bu öneri, yerel [GetCulture('hungarian').GetName] ve [GetCulture('south_german').GetName] toplulukları tarafından muhalefetle karşılandı."
austria_federation.12.f: ""Teklifi yayınladığınızda, buna yalnızca Macarların Újvidék dediğini unutmayın. Diğer herkes Novi Sad der. Bizim içinse Neusatz."\n\nHaritacı ismin üzerini çizdi. "Oldukça dağınık bir bölge, değil mi?"\n\n"Bilebileceğinden çok daha fazla. Eskiden bu şehre Sırp Atinası derlerdi — eğer onların lehine karar verirsek, yeniden öyle olabilir.""
austria_federation.12.a: "Bir Sırp devleti olarak [SCOPE.sState('vojvodina_state').GetNameNoFormatting] bölgesini Macaristan'dan ayırın."
austria_federation.12.b: "[SCOPE.sState('vojvodina_state').GetNameNoFormatting] Macaristan sınırları içinde kalmalıdır."
austria_federation.12.c: "Federasyon içinde tüm Güney Slavları için bir devleti destekleyin."

croats_are_fine_tt: "#b Üçlü Krallık#! kurulduğu için: #indent_newline:3 \n• [GetCulture('croat').GetName] kültürü gelecekteki [Concept('concept_integrated_culture','$concept_integrated_culture_process$')] (Entegrasyon) işlemlerinden [Concept('concept_disqualified_culture','$concept_disqualified_culture_short$')] #b edilmeyecek#!#!"
