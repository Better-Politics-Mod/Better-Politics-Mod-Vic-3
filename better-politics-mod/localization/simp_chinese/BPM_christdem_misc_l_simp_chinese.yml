 je_bpm_propagate_the_new_wine_button_desc:0 "那些常被冠以“基督教民主”之名的崭新理念，非常激进，近乎革命。但它们承诺变革，而这种变革将伴随着真正的基督教价值观与道德而来。而这些是诚实的，也是有力的。"
