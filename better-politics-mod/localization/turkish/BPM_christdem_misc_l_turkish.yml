 bpm_new_wine_old_wineskins_flavour.1.t: "Sirke Değil"
 bpm_new_wine_old_wineskins_flavour.1.d: "@ig_christian_democrats! Hristiyan Demokratların siyasete girmesi ve @ig_conservatives! Klasik Muhafazakarlarla kaçınılmaz siyasi savaşları, ikincisinin çöküşüne ve asimile edilmesine yol açtı. Ancak Hristiyan Demokratlar genişledikçe, daha muhafazakar gruplar resmi olarak kopacak ve daha çok kendi başlarına gelişeceklerdir."
 bpm_new_wine_old_wineskins_flavour.1.f: "Yeni şarap gerçekten harika, rafine tadı eskisini çok geride bırakıyor. Bayat, acı şarabın yerini nihayet taze ve canlı bir şeye bırakmasından büyük bir rahatlama duyuyorum."
 bpm_new_wine_old_wineskins_flavour.1.a: "Artık yalnız değiliz."


 bpm_new_wine_old_wineskins_flavour.2.t: "Yaldızlı, Ama Altın Değil"
 bpm_new_wine_old_wineskins_flavour.2.d: "@ig_christian_democrats! Hristiyan Demokratların yükselişi eski @ig_conservatives! Klasik Muhafazakarlar tarafından şiddetle durduruldu ve nihayetinde yeni akımlar yenilgiye uğratılarak sadece sosyal eylemlere indirgendi. Yeni ve gelecekteki yönetim, sınıf işbirliği, paternalizm ve ihtiyatlı gelişim rehberliğinde şekillenecektir."
 bpm_new_wine_old_wineskins_flavour.2.f: "Yeni şaraptan çok beklentim vardı, ama çok yanılmışım. Tadı yeterince hoş ama altından çok yaldızlı; damağı şaşırtmayı ya da yakalamayı başaramıyor."
 bpm_new_wine_old_wineskins_flavour.2.a: "Tam da Papa'nın amaçladığı gibi."

 bpm_new_wine_old_wineskins_flavour.3.t: "Zeytinyağı ve Su Gibi"
 bpm_new_wine_old_wineskins_flavour.3.d: "@ig_christian_democrats! Hristiyan Demokratların yükselişi ve @ig_conservatives! Klasik Muhafazakarlara karşı verdikleri mücadele, her iki tarafın da diğerini yok edememesiyle sonuçsuz bir Statüko (Status Quo) ile sona erdi."
 bpm_new_wine_old_wineskins_flavour.3.f: ""
 bpm_new_wine_old_wineskins_flavour.3.a: "Bu... hayal kırıklığı yarattı..."

 bpm_new_wine_old_wineskins_flavour.4.t: "Rakipsiz Sağcı"
 bpm_new_wine_old_wineskins_flavour.4.d: "Önde gelen @ig_conservatives! Muhafazakar hizbin lideri — [SCOPE.sCharacter('unchallanged_right_winger').GetFullName] — siyasi sağı gerçekten temsil eden tek gerçek liderin kendisi olduğunu ilan etti. Kendisine ve muhafazakarlığına karşı çıkan herkese açıkça meydan okudu ve daha fazla destek kazandı."
 bpm_new_wine_old_wineskins_flavour.4.f: "Bu ülkede siyasi sağın ancak güçlü, dindar ve rakipsiz bir lideri olabilir. Ve ben de hem kamusal hem de özel yaşamda iyi bir Katolik ahlakı sağlamak için Kilise ile ihtiyatlı bir şekilde işbirliği yapabilen, uygun biri olduğumu alçakgönüllülükle kanıtladım. Bana karşı çıkanlar aslında Tanrı'nın kendisine ve onun planına karşı çıkmış olurlar."
 bpm_new_wine_old_wineskins_flavour.4.a: "Ne inatçı bir ahmak."


 bpm_new_wine_old_wineskins_flavour.5.t: "Özerk Gruplar Arası İşbirliği"
 bpm_new_wine_old_wineskins_flavour.5.d: "[GetInterestGroupVariant('ig_conservatives',GetPlayer).GetName] lideri resmi olarak [GetInterestGroupVariant('ig_christian_democrats',GetPlayer).GetName] üyelerinin var olma hakkı olmadığını iddia etse ve işbirliğini yasaklasa da, tabandaki birçok hücre ve örgüt işbirliği yapmaya başladı. Çoğunlukla küçük olsalar da, birçoğu hızla büyüyor ve @ig_christian_democrats! #blue Hristiyan Demokrat#! fikirlerin yayılmasına olanak tanıyor."
 bpm_new_wine_old_wineskins_flavour.5.f: "Sizi seçim listelerine almamayı ve sıkı gözetim altında tutmayı mantıksız buluyorum. Bu sadece bölünme yoluyla Katolik davasına zarar vermekle kalmıyor, aynı zamanda potansiyel seçmen tabanını da zayıflatıyor."
 bpm_new_wine_old_wineskins_flavour.5.a: "Kovulmak mı istiyorlar, nedir dertleri?"

 bpm_new_wine_old_wineskins_flavour.6.t: "Güçlü Bir Piskopos Demokratları Destekliyor"
 bpm_new_wine_old_wineskins_flavour.6.d: "[GetInterestGroupVariant('ig_devout',GetPlayer).GetName] üzerinde güçlü bir etkiye sahip olan bir piskopos, bir gazetede yaptığı konuşmada yeni @ig_christian_democrats! Hristiyan Demokrat akımları açıkça destekledi. İnsanları bu yeni fikirleri yaymaya katılmaya çağırdı."
 bpm_new_wine_old_wineskins_flavour.6.f: "Üyelerinin kendilerine 'Hristiyan Demokratlar' dedikleri yeni siyasi grup... çok dindar ve gerçekten İsa'nın Öğretilerini hayatlarımıza kucaklamaya çalışıyor. Sosyal adalete olan inançları, eşitlik arayışları ve yoksullar için mücadele etmeleri, aynı zamanda dindarlığı da el üstünde tutmaları çok güçlü ve gerçekten de erdemlidir."
 bpm_new_wine_old_wineskins_flavour.6.a: "Buna izin var mı ki?"
 
 bpm_new_wine_old_wineskins_flavour.7.t: "Muhafazakar Gazetelerden Güçlü Destek"
 bpm_new_wine_old_wineskins_flavour.7.d: "Önemli bir gazete, [GetInterestGroupVariant('ig_christian_democrats',GetPlayer).GetName] aleyhine saldırılarla dolu bir makale yayınladı ve [GetInterestGroupVariant('ig_conservatives',GetPlayer).GetName] liderini — [SCOPE.sCharacter('clacon_leader').GetFullName] — övdü. Günahkar ilericiliği şiddetle eleştirdiler ve Hristiyan Demokratları Katolikleri zayıflatmakla ve bir bütün olarak muhafazakarlıktan vazgeçmekle suçladılar."
 bpm_new_wine_old_wineskins_flavour.7.f: "Bu 'Hristiyan Demokratlar' ve devrimci fikirleri, gerçek muhafazakarlığın ve dindarlığın yüzüne tükürmek gibidir. Sadece yok etmek ve kötülük tohumunu güçlendirmek istiyorlar. Onlar ne Hristiyan ne de Demokrattır."
 bpm_new_wine_old_wineskins_flavour.7.a: "Ne ağır bir suçlama!"

 bpm_new_wine_old_wineskins_flavour.8.t: "Ruhu Yaymak"
 bpm_new_wine_old_wineskins_flavour.8.d: "Seçim listelerine erişim konusundaki bazı sorunlar nedeniyle, @ig_christian_democrats! Hristiyan Demokrasi fikirlerine bağlı bağımsız ve yeni bir parti kuruldu ve ilgi görmeye başladı. Ne kadar başarılı olacağını söylemek için henüz çok erken, ancak kesinlikle sol görüşlü Katolik fikirleri ülke çapında yayacaktır."
 bpm_new_wine_old_wineskins_flavour.8.f: "Biz, #italic ‘Rerum novarum’#! papalık genelgesini yakından takip eden bağımsız bir partiyiz ve onun fikirlerini sevgili ülkemizin çeşitli kesimlerinde hayata geçirmeyi amaçlıyoruz..."
 bpm_new_wine_old_wineskins_flavour.8.a: "Kafaları biraz karışık ama ruhları yerinde!"

 bpm_new_wine_old_wineskins_flavour.9.t: "Destekleyici Piskoposa Muhalefet Baskısı"
 bpm_new_wine_old_wineskins_flavour.9.d: "@ig_christian_democrats! Hristiyan Demokratik fikirleri destekleyen bir piskopos, [GetInterestGroupVariant('ig_conservatives',GetPlayer).GetName] bünyesindeki çeşitli politikacılar tarafından muhalefete zorlandı; kapsamlı demokrasi konusundaki duruşunu değiştirdi ve [SCOPE.sParty('conservative_party_scope').GetName] lehine reformlar yaptı."
 bpm_new_wine_old_wineskins_flavour.9.f: "Görünüşe göre modernizmi ve diğer günahkar fikirleri onayladığıma dair büyük bir yanlış anlaşılma var. Böyle hedefler peşinde koşmayı ya da seçim siyasetine katılmayı asla düşünmedim."
 bpm_new_wine_old_wineskins_flavour.9.a: "Zaten bunu yapmaması gerekiyordu."

 bpm_new_wine_old_wineskins_flavour.10.t: "Yükselen Düşmanlık"
 bpm_new_wine_old_wineskins_flavour.10.d: "Hayatta kalma ve gelecek için verilen siyasi mücadele siyasi ve kamusal yaşamın çeşitli yönlerine yayıldıkça, hem [GetInterestGroupVariant('ig_conservatives',GetPlayer).GetName] hem de [GetInterestGroupVariant('ig_christian_democrats',GetPlayer).GetName] giderek daha fazla birbirlerine düşman oluyor ve kendi hedeflerine ulaşmaya daha kararlı hale geliyorlar."
 bpm_new_wine_old_wineskins_flavour.10.f: "Düşman partiye yarar sağlayan değersiz uzlaşmalara girmemiz için hiçbir neden yok; diğerinin üstünlük sağlamasına izin vermemek için saflarımızı genişletmeli ve kontrol altında tutmalıyız."
 bpm_new_wine_old_wineskins_flavour.10.a: "Bunun sonu nereye varacak merak ediyorum."
 

