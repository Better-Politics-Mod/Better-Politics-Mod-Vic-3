je_the_hungry_forties_reason: "Mahsul hastalıklarından oluşan bir dalga [concept_georegion_europe] bölgesini vurarak kötü hasatlara ve gıda kıtlığına yol açtı. Yanıklık hastalığı özellikle patatesler için ölümcül olup, hızla pis kokulu ve yenilemez bir püreye dönüşerek çürümelerine neden olmaktadır.\n\n#b Avrupa Patates Yanıklığı#:\nBu [concept_journal_entry] aktif olduğu sürece, Avrupa eyaletlerinde $disease_outbreak$ [concept_harvest_condition] (Hastalık Salgını) görülme oranı büyük ölçüde artacaktır."

