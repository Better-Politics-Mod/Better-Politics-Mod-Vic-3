 ideology_wel_reactionary_paternalistic: "Reaksiyoner Paternalist"
 ideology_wel_reactionary_paternalistic_desc: "#lore Acımasız kapitalizm karşısında bu grup, dini ahlakı da göz önünde bulundurarak devletin yoksullara temel ve insanca bir yaşam standardı sunması gerektiğine inanır.#!"