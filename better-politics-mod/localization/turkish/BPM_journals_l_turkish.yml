 bpm_je_split_natlibs_progress_from_conflicts_desc:0 "Savaşlarda, Diplomatik Oyunlarda, Devrimlerde veya Ulusal Birleşme lideri olmak"
 bpm_je_split_natlibs_progress_from_liberals_empowered_desc:0 "@ig_liberals! Liberaller, @ig_radicals! Radikal Liberaller veya @ig_market_liberals! Piyasa Liberalleri Hükümette veya Destekleniyor"
 bpm_je_split_natlibs_progress_from_libcons_suppressed_desc:0 "bastırılmış #bold Liberal#! ve #bold Muhafazakar#! [Concept('concept_interest_group', 'Çıkar Grupları')]"
 bpm_je_split_natlibs_progress_from_libcons_marginal_desc:0 "marjinalize olmuş #bold Liberal#! ve #bold Muhafazakar#! [Concept('concept_interest_group', 'Çıkar Grupları')]"
 bpm_je_split_natlibs_progress_from_radicals_desc:0 "[concept_radical] yoksul tabaka nüfusu. #blue @information! Bu sadece @ig_liberals! Liberaller ve @ig_conservatives! Muhafazakarlar marjinalize değilse ve bastırılmamışsa birikecektir.#!"
