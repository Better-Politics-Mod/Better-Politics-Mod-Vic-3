labour_associations_events.1.t: "Sendikasız"
labour_associations_events.1.d: "[SCOPE.sLaw('current_law_scope').GetName] altında işçi derneklerinin güçlenmesinden tehdit hisseden [SCOPE.gsInterestGroup('industrialists_ig').GetName], sendikalı bir iş gücünün tehlikeleri hakkında çok sayıda rapor yayınladı."
labour_associations_events.1.f: "#bold Benim İçin Sendikalı Bir Hayat mı?#!\n\n• Ücretinizden kesilen aidatlar\n• Ücret, yan haklar veya çalışma kuralları konusunda hiçbir garanti yok\n• Bireysel pazarlık şansı yok\n\n#italic İşinizi ve ücretinizi ŞİRKETİNİZ sağlar - SENDİKA asla sağlamadı ve sağlamayacak!#!"
labour_associations_events.1.a: "Çok korkmuş olmalılar."
labour_associations_events.1.b: "Herkesin kendi çıkarlarının peşinden gitme hakkı vardır."

labour_associations_events.2.t: "Önleyici Grevler"
labour_associations_events.2.d: "Hükümetin [SCOPE.sLaw('current_law_scope').GetName] yasasını güvence altına alma çabalarının haberi işçi sınıfı toplulukları arasında hızla yayıldı. [SCOPE.gsInterestGroup('industrialists_ig').GetName], yasadışı sendikal faaliyetlerde buna paralel bir artış olduğundan şikayet etmeye başladı."
labour_associations_events.2.f: "Hükümet girişimini duyurduğu an afişler ortaya çıkmaya başladı. Gece bekçilerinin failleri yakalamaya yönelik beyhude çabaları sonuç vermeyince, firma hasar kontrolü yapmak zorunda kaldı. Her gece duvarlar afişlerle kaplanıyor - ve sabahları şirket, bir önceki gecenin eserleriyle çöpleri dolduruyordu.\n\nHemen ertesi hafta, çöpçüler kendi yeni sendikalarını duyurdular."
labour_associations_events.2.a: "Mahkemelere bu şikayetleri dikkate almamalarını emredin."
labour_associations_events.2.b: "Mevcut yasalar yürürlükte kalacaktır."

labour_associations_events.3.t: "Sendikalar Komisyonu"
labour_associations_events.3.d: "İşçi gruplarının dilekçelerinin ardından, [SCOPE.GetRootScope.GetCountry.GetCustom('country_legislature_name')], [SCOPE.sLaw('current_law_scope').GetName] hakkında bir komisyon kurdu. Komisyon, hükümete iki rapor sundu - [SCOPE.gsInterestGroup('opposed_ig').GetName] tarafından yazılan bir çoğunluk raporu ve [SCOPE.gsInterestGroup('unions_ig').GetName] grubuna sempati duyan bir azınlık raporu."
labour_associations_events.3.f: ""Aslında, mevcut haliyle yasa tek taraflı ve adaletsizdi. İşçilerin hedeflerini ilerletmek için yaptıkları neredeyse her tür örgütlenme, ticareti kısıtlayan bir komplo olarak kabul edilip cezai yaptırıma tabi tutulurken, bir patron tarafından işlenen tamamen benzer eylemler, komplo suçunu içermediği gerekçesiyle yasanın dikkatinden kaçıyordu. Ancak gerçekte, binlerce işçiyi çalıştıran işveren, kendi başına bir örgütlenmeydi."" #- Henry Bruce, 1871 Sendikalar Yasası üzerine
labour_associations_events.3.a: "Azınlık raporunu kabul et."
labour_associations_events.3.b: "Çoğunluk raporu daha ikna edici."

labour_associations_events.4.t: "Ölmekte Olan Bir Endüstri"
labour_associations_events.4.d: "Hükümetin [GetLawType('law_guild_system').GetName] kurumunu ortadan kaldırma adımları, geçim kaynaklarının tehdit altında olduğunu hissedenler arasında isyanlara yol açtı. [SCOPE.sState('relevant_state').GetName] içinde ayaklanan zanaatkarlar ve vasıflı işçiler makineleri parçaladı ve müteahhitlere gözdağı verdi."
labour_associations_events.4.f: "Açlıktan ölmek üzereyken\nBoşuna yakardığımız Tanrı'ya lanet olsun;\nBoşuna umut ettik, boşuna bekledik,\nO sadece alay etti ve güldü kaderimize,—\nDokuyoruz, dokuyoruz!" #- Die armen Weber (Zavallı Dokumacılar), Heinrich Heine
labour_associations_events.4.a: "Eğer özgürce rekabet edemiyorlarsa, başka bir yerde iş bulabilirler."
labour_associations_events.4.b: "Mülkiyeti korumak için Orduyu gönderin."

labour_associations_events.5.t: "Son Çare"
labour_associations_events.5.d: "Hükümetin [SCOPE.sLaw('current_law_scope').GetName] yasasını çıkarma çabaları, [SCOPE.gsInterestGroup('trade_unions_ig').GetName] tarafından neredeyse evrensel bir muhalefetle karşılaştı. Sendika liderliği, hükümeti taviz vermeye zorlamak amacıyla genel grev çağrısında bulundu."
labour_associations_events.5.f: "Sendikalar tüm güçleriyle sokaktaydı. [SCOPE.GetRootScope.GetCountry.GetCustom('country_legislature_name')] çevresindeki bir millik alanda her elektrik direği kırmızı flamalarla donatılmıştı ve yaya trafiği umutsuz bir çabaydı. Birçok hükümet vekili, insan seliyle yüzleşmek yerine ofislerinde uyumayı seçmişti. Diğerleri, yani muhalefetteki radikaller ise onlara katılmayı tercih etti. Ancak binanın etrafını yılan gibi saran polis kordonu nedeniyle geri dönüş yollarının kesildiğini fark ettiler.\n\nHer iki taraf da artık durumu bir kuşatma hali olarak görüyordu. Protestocular, kendi aralarında ekmek ve su dağıtmak için gerçekten etkileyici bir lojistik sistem kurmuşlardı, bu sırada yasama üyeleri de [SCOPE.GetRootScope.GetCountry.GetCustom('country_legislature_name')] kafeteryasını ve şarap mahzenini sömürüyordu.\n\n"Daha ne kadar?" diye sordu genç bir üye. Meslektaşı cevap verecek enerjiyi kendinde bulamadı."
labour_associations_events.5.a: "Tepkileri tasarının haklılığını kanıtlıyor."
labour_associations_events.5.b: "Müzakere teklif edin."
labour_associations_events.5.c: "İletişim araçlarını kesin."

labour_associations_events.6.t: "Katlanılamaz Çatışma"
labour_associations_events.6.d: "Sanayi işçilerinin rutin olarak maruz kaldığı korkunç koşulları detaylandıran bir kitap, bir gecede büyük başarı yakaladı. Kitabın başarısı [SCOPE.sLaw('current_law_scope').GetName] tasarısına olan kamuoyu ilgisini artırırken, [SCOPE.gsInterestGroup('industrialists_ig').GetName] grubunu utandırdı."
labour_associations_events.6.f: ""Böylece toplumsal düzen, işçi için aile hayatını neredeyse imkansız hale getirir. Sadece gecelik bir barınağa yetecek kadar iyi, eşyasız, çoğu zaman ne yağmur geçirmeyen ne de sıcak olan, insanlarla hıncahınç dolu odaların pis bir atmosferle dolduğu konforsuz, kirli bir evde, ev konforu imkansızdır. Koca bütün gün çalışır, belki eşi ve büyük çocuklar da farklı yerlerde; sadece gece ve sabah görüşürler, hepsi sürekli bir içki içme eğilimi altındadır; böyle koşullar altında nasıl bir aile hayatı mümkün olabilir ki?"" #- Friedrich Engels, İngiltere'de Emekçi Sınıfların Durumu
labour_associations_events.6.a: "İşçiler kendi haklarını savunabilmeli."
labour_associations_events.6.b: "Sahipleri daha fazla üzmemeliyiz."

labour_associations_events.7.t: "Yasanın Lafzı (Harfi Harfine)"
labour_associations_events.7.d: "Hükümetin örgütlü emeğe karşı cephe almasından cesaret alan [SCOPE.gsInterestGroup('relevant_bourgeois_ig').GetName], kendi dükkanlarındaki işçi sendikalarına karşı önleyici olarak baskı uygulamaya başladı. Eski yasalar hâlâ yürürlükteyken [SCOPE.gsInterestGroup('unions_ig').GetName] bir yanıt talep ediyor."
labour_associations_events.7.f: "Bu bir saçmalıktı. Memur bunu biliyordu, üstleri biliyordu ve önünde duran sendika temsilcisi de muhtemelen biliyordu. Bir hakimin önüne çıkmadan önce kitaplardan silinecek bir yasaya dayanan son dakika dilekçesi.\n\nVe yine de kusursuzdu. Doğrudan reddetmesine izin verecek bariz bir hatadan yoksundu. Tek seçeneği, bunun bir başkasının evrak sepetini tıkamasına izin vermekti. Ağzının kenarları neşesiz bir gülümsemeyle gerildi.\n\n"Teşekkür ederim efendim. Bakanlık sizinle posta yoluyla iletişime geçecektir.""
labour_associations_events.7.a: "Artık hiçbir hukuki dayanakları yok."
labour_associations_events.7.b: "Mevcut yasaları uygulamalıyız."

labour_associations_events.8.t: "Serbest İş Gücü Piyasası"
labour_associations_events.8.d: "Hükümet [GetLawType('law_guild_system').GetName] sistemini tasfiye etme adımları attıkça, cesaretlenen [GetPopType('laborers').GetName] ve [GetPopType('machinists').GetName], eskiden dışlandıkları alanlara girmeye başladılar."
labour_associations_events.8.f: ""Ben gidiyorum. Daha önce söylemeliydim. [SCOPE.sState('relevant_state').GetCityHubName] içinde, fabrikada bir iş buldum. Bana yolculuk için borç ve kalacak yer teklif ettiler..."\n\nSesi yavaşça kısıldı, sırayla arkadaşlarının yüzüne baktı.\n\n"Teşekkür ederim. Her şey için. Size yazacağım, ya da birinden yazmasını isteyeceğim. Sizinle olmak... harikaydı. Sizi bir gün tekrar göreceğim. Söz veriyorum.""
labour_associations_events.8.a: "Çabalarımız fazlasıyla ödüllendirildi."
labour_associations_events.8.b: "Özgürlük için büyük bir zafer."

labour_associations_events.9.t: "Gizli Niyetler"
labour_associations_events.9.d: "Şehirlerdeki ekonomik rakiplerini dezavantajlı duruma düşürme şansı yakaladığını hisseden [SCOPE.gsInterestGroup('landowners_ig').GetName] grubunun önde gelen üyeleri, [SCOPE.sLaw('current_law_scope').GetName] yasasının çıkarılması lehinde tavır aldılar."
labour_associations_events.9.f: ""Sendikalar düzensizliğin ajanlarıdır - ama en önemlisi, en büyük düşmanlıklarını doğrudan bizim rakiplerimize saklayan ajanlardır. Üstlerinden tavizler talep edecekler, [SCOPE.sState('relevant_state').GetCityHubName] patronlarının ceplerini derinden oyacak tavizler. Bu kayıpları telafi etmek için fiyatlarını yükseltmek zorunda kalacaklar ve kendi ürünümüzü çok avantajlı bir konuma getirecekler."\n\n"Peki ya kendi halkımız? Bir Köylü Sendikası'ndan korkmamız gerekmez mi?"\n\n"Onlar temiz hava soluyor ve ensesinde güneşi hissedebiliyorlar. Çoğunun kendi toprak parçası var. Sendikaya ne ihtiyaçları olabilir ki?""
labour_associations_events.9.a: "Mükemmel derecede işe yarar bir düzenleme."
labour_associations_events.9.b: "Bu tür tekliflere karşı temkinli olmalıyız."

