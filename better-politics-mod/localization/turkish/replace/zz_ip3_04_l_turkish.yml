eastern_question_russia.1.t: "Güney Slavlarının Koruyucusu"
eastern_question_russia.1.t2: "[SelectLocalization(SCOPE.sCountry('bulgaria_scope').IsValid, SCOPE.sCountry('bulgaria_scope').GetAdjective, 'BUL_ADJ')] Canlanışı"
eastern_question_russia.1.d: "[SCOPE.sCountry('bulgaria_scope').GetName] devletinin bağımsızlığına katkımız bize Güney Slav halklarının koruyucusu olarak itibar kazandırdı. Artık Balkanlardaki nüfuzumuzu pekiştirmek için geniş bir fırsata sahibiz."
eastern_question_russia.1.d2: "[SCOPE.sCountry('bulgaria_scope').GetName] devletinin bağımsızlığı Osmanlı etki alanındaki çatlakları ortaya çıkardı. Balkanlar'daki nüfuz alanımızı genişletmek için tesadüfi bir fırsat elde ettik."
eastern_question_russia.1.f: "Yeni kurulan [SCOPE.sCountry('bulgaria_scope').GetAdjectiveNoFormatting] alayları yürüyüşe geçerken bir bando takımı çalıyordu. [SCOPE.sCharacter('name_a_scope').GetLastNameNoFormatting], yeni [SCOPE.sCountry('bulgaria_scope').GetAdjectiveNoFormatting] üniformalarının kendisininkilere neredeyse tıpatıp benzemesinin ne kadar ilginç olduğunu düşündü. Yeşil-mavi kumaş, kırmızı fitiller. Babasını taklit eden bir çocuk gibi sevimlilerdi.\n\nAncak görevi sevimlilikten daha fazlasını gerektiriyordu. Bir gün, bu askerlerin kendi ülkesinin çıkarları adına yürümeleri gerekebilirdi. [ROOT.GetCountry.GetNameNoFormatting], [SCOPE.sCountry('bulgaria_scope').GetRuler.GetPrimaryRoleTitle] makamından bir güvenceye ihtiyaç duyacaktı. Ayarlanacak askeri işbirlikleri, hak iddia edilecek Osmanlı dosyaları vardı. Her bir saatlik keyfe karşılık, bir günlük iş."
eastern_question_russia.1.a: "[SCOPE.sCountry('bulgaria_scope').GetRuler.GetPrimaryRoleTitle] [SCOPE.sCountry('bulgaria_scope').GetRuler.GetLastName]'e tebriklerimizi ve bir büyükelçilik teklif edin."
eastern_question_russia.1.b: "Daha uzaklarda daha fazla fırsat var."
eastern_question_russia.1.c: "[SCOPE.sCountry('bulgaria_scope').GetRuler.GetPrimaryRoleTitle] [SCOPE.sCountry('bulgaria_scope').GetRuler.GetLastName]'e tebriklerimizi ve bir büyükelçilik teklif edin."
eastern_question_russia.1.e: "Belki de daha uzun süreli bir kalış daha uygundur."

