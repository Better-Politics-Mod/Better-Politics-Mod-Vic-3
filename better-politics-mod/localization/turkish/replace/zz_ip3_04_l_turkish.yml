autocracy.4.t: "Sorumlu Hükümet"
autocracy.4.d: "[ROOT.GetCountry.GetAdjectiveNoFlag] parlamenter düzeninin istikrarı, kralcıların restore edilmiş bir mutlakıyetçilik umutlarını terk etmelerine yol açtı. Yeni statüko olarak anayasal bir monarşi kuruldu."
autocracy.4.f: ""Parlamento; hükümete hayat ve hareket veren en yüce ve mutlak güçtür. Barışımızın ebeveyni, inancımızın savunucusu ve mülklerimizin temeli olarak tüm çeşitli prosedürlerini o yönlendirir ve harekete geçirir; ve bu büyük kaynağın, işlerin ilk hareket ettiricisinin (primum mobile) Anayasası nasıl güç ve güzellik içindeyse, ondan türetilen tüm eylemler ve icraatlar da uygun bir orantı ve benzerlik taşıyacaktır."" #- 1. Shaftesbury Kontu
autocracy.4.a: "[SCOPE.GetRootScope.GetCountry.GetCustom('country_legislature_name')] şerefine!"
autocracy.4.b: "[SCOPE.GetRootScope.GetCountry.GetCustom('GetDivinity')], [SCOPE.sCharacter('ruler_scope').GetPrimaryRoleTitle]'ı korusun!"

