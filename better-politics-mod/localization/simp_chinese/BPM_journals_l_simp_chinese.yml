 je_march_to_radicalism:0 "革命的幽灵"
 je_march_to_radicalism_status:0 "一个火药桶正在蓄满。"
 je_march_to_radicalism_awaiting_spark_status:0 "等待着革命的火花。"
 je_march_to_radicalism_reason:0 "在撼动欧洲古老强权约五十年之后，法国革命的遗产仍在回响。随着自由主义的复兴与新兴的民族意识相遇，资产者与无产者都将寻求拆毁旧世界的腐朽制度。\n\n#v 这是一个[Concept('concept_bpm_global_je', '全球日志条目')]。#!每当欧洲有国家：#P 获得#!进度：\n#P +#! 研究了#YB 平等主义#!、#YB 民族主义#!或#YB 辩证法#!\n#P +#! 经历了一场[concept_civil_war]，按国家[concept_rank]调整\n\n此外，还会因以下因素增加一些#P 每年进度#!：\n#P +#! 欧洲[Concept('concept_great_power', '列强')]中的每一位激进左翼[concept_agitator]或[concept_politician]\n#P +#! 每个欧洲[Concept('concept_great_power', '列强')]中低于[Concept('concept_expected_sol','最低生活水平')]的人口\n\n随着该条目的推进，@ig_radicals! #YB 激进派#!的人气将上升，欧洲各国将出现人口的大规模激进化。完成时，欧洲将面临一波争取民族主义与民主的革命运动浪潮。在尚未研究#YB 平等主义#!的国家，这项科技也将逐步获得研究进度。\n\n#lore “自由的事业与人类的命运紧密相连，无论它在世界何处逐渐取得进展，对于所有渴望它的人都将是一项共同的收获。”\n\n——拉约什·科苏特，1849#!"
 bpm_peoples_springtime_spark_happened:0 "一场#v 革命火花#!已在欧洲迸发。"
 bpm_activate_je_springtimes:0 "激活#v 人民之春#!。"
 je_springtime_of_the_peoples_status:0 "经受住风暴。"
 je_springtime_of_the_peoples_reason:0 "在整个欧洲，各族人民高举旗帜、为变革而游行。他们耀眼旗帜上镌刻着一代人之前的禁忌之词：#gold 自由、平等、博爱#!。\n\n这一时期的末尾，若你的国家满足以下条件，#gold 革命派#!将取得胜利：\n- 是一个#yellow 共和国#!，并且\n- 拥有#yellow 财产投票#!或#v 更佳#!。\n\n另一方面，若满足以下条件，#purple 反动派#!将取得胜利：\n- [GetInterestGroupVariant('ig_radicals',GetPlayer).GetName]与[GetInterestGroupVariant('ig_socialists',GetPlayer).GetName]为[concept_marginalized]。\n\n否则，你的国家将维持一种改良后的现状。\n\n#lore 第三等级是什么？是一切。\n——阿贝·西耶斯，1788#!#!"
 je_frankfurt_parliament:0 "法兰克福议会"
 je_frankfurt_parliament_status:0 "je_frankfurt_parliament_status"
 je_frankfurt_parliament_reason:0 "自拿破仑解散神圣罗马帝国、代之以#yellow 德意志邦联#!以来，德意志民族国家的运动便与德意志各邦对公民权利和宪政治理日益增长的渴望一同壮大。如今，随着革命热情席卷欧洲，许多邦国已屈从于日益增长的压力，开始在#yellow 法兰克福#!组建#yellow 国民议会#!，代表们将在那里就一部集中邦联权力的新德意志宪法展开辩论。\n\n本日志的进度，以及议会中各派系的构成，由参与各邦中激进左翼、自由派和保守派利益集团的总力量决定。更强大的左翼或自由派系将加速进度。\n\n本日志条目每取得10点进度，议会就将就新德意志宪法中的一个议题进行表决。某些决定可能导致一些代表团抵制议会。\n\n议会必须在革命平息之前敲定一部宪法，否则#pink 它将被彻底解散。#!\n\n若激进派成为主导派系，且至少有一个列强或以上等级的德意志政权拥有左翼政府或共和国，则激进派将获胜。若保守派取得主导地位并使奥地利帝国留在谈判桌前，则保守派获胜。否则将达成一个温和的结局，将宪法呈交给一位皇冠候选人。\n\n#lore 从默兹河到梅梅尔河，从阿迪杰河到贝尔特海峡，德意志，德意志高于一切，高于世间一切！\n——德意志之歌，奥古斯特·海因里希·霍夫曼，1841#!"
