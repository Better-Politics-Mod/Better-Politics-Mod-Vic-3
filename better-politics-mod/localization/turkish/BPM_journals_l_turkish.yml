 bpm_rec_institutional_one:0 "Yürütme Yetkisini Kontrol Et"
 bpm_rec_institutional_one_desc:0 "Yürütme Organı, Afrikalı-Amerikalıları savunmak için yeterli kararlılıkla hareket etmiyor. Yürütme Organı ajanlarının başkan tarafından görevden alınma tehdidi olmadan faaliyet gösterebilmesini sağlamak için Görev Süresi Yasasını (Tenure of Office Act) kabul etmeliyiz"
 bpm_rec_institutional_two:0 "Yargı Yetkisini Sınırla"
 bpm_rec_institutional_two_desc:0 "Yargı Organı, Yeniden İnşa önlemlerini uyguladığımız yetkiyi sorguluyor. Mahkemeyi hizaya getirmek için Yüksek Mahkemenin Güney İşgalindeki Habeas Corpus davalarına bakma hakkını askıya almalıyız"
 bpm_rec_institutional_three:0 "Yürütme Üstünlüğüne Son Ver"
 bpm_rec_institutional_three_desc:0 "Yürütme Organı, Afrikalı-Amerikalıları savunmak için yeterli kararlılıkla hareket etmiyor. Başkanın Yasama Organının iradesine uymasını sağlayarak görevden alma (impeachment) yetkilerimizi bir binici kırbacı gibi kullanmalıyız"
 bpm_rec_institutional_four:0 "Yargısal Güvenlik Duvarını Yakın"
 bpm_rec_institutional_four_desc:0 "Yargı Organı, Yeniden İnşa önlemlerini uyguladığımız yetkiyi sorguluyor. Jefferson'ın başarısızlığını düzeltmeli ve Yüksek Mahkemeyi halkın iradesine tamamen tabi kılmalıyız. Gerekirse hepsini görevden alacağız"

 bpm_western_monroe:0 "Yeni Emperyalizm: Pasifik Hegemonyası"
 bpm_western_monroe_desc:0 "Çin Pazarlarına erişimi ve Pasifik Kıyımızın güvenliğini sağlamak için, deniz üslerimiz için Kuzey Meksika'yı ve Filipin Adaları'nı özgürleştirmeliyiz!"
 bpm_northern_monroe:0 "Yeni Emperyalizm: Kuzeybatı Geçidi"
 bpm_northern_monroe_desc:0 "Yarımküre savunmasını Avrupa işgalinden korumak ve teorik Kuzeybatı Geçidi üzerinde hak iddia etmek için, deniz üslerimiz için Kuzey Kutbu'nu fethetmeliyiz!"
 bpm_southern_monroe:0 "Yeni Emperyalizm: Tehuantepec Okyanuslararası Koridoru"
 bpm_southern_monroe_desc:0 "Orta Amerika'yı Avrupa kolonizasyonundan korumak ve Atlantik ile Pasifik arasında daha hızlı yollar açmak için, deniz üslerimiz için Tehuantepec Kıstağını fethetmeliyiz! Kim bilir, belki bir kanal bile inşa edebiliriz!"
