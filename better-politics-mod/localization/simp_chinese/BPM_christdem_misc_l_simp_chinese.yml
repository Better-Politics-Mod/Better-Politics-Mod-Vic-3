l_simp_chinese:
 ideology_eco_modern_interventionist:0 "现代干预主义者"
 ideology_eco_modern_interventionist_desc:0 "#lore 该群体虽然信念程度各异，但信奉现代而公正的干预主义政策，范围从监管与累进税制，到工作场所民主化与国有化政策，再到国家就业计划。#!"
 ideology_eco_centralized_economy:0 "中央集权经济"
 ideology_eco_centralized_economy_desc:0 "#lore 该群体视自由资本主义为失败，谋求以市场经济与指令经济的民主混合体取而代之，将私有财产局限于农业和从属于全国经济计划的小规模生产。#!"
 ideology_sta_regionalized_state:0 "辅助性国家"
 ideology_sta_regionalized_state_desc:0 "#lore 该群体信奉一个现代、有机、辅助性的国家，其权力建立在地方人群集体之上，并保护其公民的权利。#!"
 ideology_dop_christian_democrat:0 "基督教民主主义者"
 ideology_dop_christian_democrat_desc:0 "#lore 该群体信奉激进的民主原则，谋求推行普选权、自由劳工和国家权力的去中心化，且带有鲜明的天主教色彩。#!"
 ideology_cit_christian_internationalist:0 "基督教国际主义者"
 ideology_cit_christian_internationalist_desc:0 "#lore 该群体信奉各国之间的兄弟情谊，谋求削弱国内与国际边界。#!"
 ideology_dop_conservative_democrat:0 "保守民主主义者"
 ideology_dop_conservative_democrat_desc:0 "#lore 该群体认为民主是重要原则，但谋求以强有力而审慎的统治、法团主义和宗教道德来保护民主，使其免受社会主义威胁。#!"
 ideology_dop_divine_democrat:0 "神授民主主义者"
 ideology_dop_divine_democrat_desc:0 "#lore 该群体信奉以审慎受限的民主作为补充的神授主权，谋求维持宗教与政治的温和。#!"
 ideology_rel_modern_moralist:0 "现代道德主义者"
 ideology_rel_modern_moralist_desc:0 "#lore 该群体认为政府的政策应当与宗教道德保持一致，同时为宗教少数派提供保护，并确保行政的职业性。#!"
 bpm_christdem_split.1.t:0 "捍卫你卑微的家园"
 bpm_christdem_split.1.d:0 "天主教与在其眼中罪恶的现代民主、自由世俗化和国家掌控教育等思想相汇合，引发了天主教派信徒的广泛回应。\n\n旨在保护@ig_christian_democrats! #blue 天主教利益#!免受不友好国家政策侵害的政治运动，正开始出现于选举政治之外的各种群体之中，并组织成各式各样的团体和组织。限制天主教徒影响力的尝试可能会举步维艰。"
 bpm_christdem_split.1.f:0 "同样错误的是相信今日存在之物必须存续到明日乃至更久，因为身处其中感到舒适便不惜一切代价维持现状，又因为身处其中感到不适便急于求变，最终忘却了：现实中的当下，永远是一种新事态的出现，而这一出现是持续不断的。\n\n——沃伊切赫·科尔凡蒂，1927年"
 bpm_christdem_split.1.a:0 "不忠的怨言者。"
 bpm_christdem_split.2.t:0 "基督教民主主义者"
 bpm_christdem_split.2.d:0 "欧洲社会主义与自由主义思潮的兴起，以及全面展开的工业革命，促使教皇颁布了《新事》通谕，从而催生了@ig_christian_democrats! #blue 基督教民主主义者#!。\n\n尽管内部分歧严重，他们总体上呼吁为工人争取体面的生计、社会正义与民主；他们谴责“无神社会主义”与“嗜血自由主义”，转而主张对经济与国家采取法团主义的做法。"
 bpm_christdem_split.2.f:0 "中央党内部并非只有两个灵魂，而是七个不同的思想流派，它们闪烁着政治彩虹的种种色彩，从极右到极左不一而足。就我而言，我钦佩中央党车夫驾驭这些纷繁灵魂时那优雅的技艺。\n\n——奥托·冯·俾斯麦，1890年"
 bpm_christdem_split.2.a:0 "一股新力量，还是一群理想主义的空想家？"
 bpm_christdem_split.2.b:0 "他们或许有用！"
 bpm_christdem_split.2.c:0 "他们是一种威胁！"
 bpm_movement_splits_christdems_tt:0 "@information! #blue 基督教民主主义者将作为一个独立的[Concept('concept_interest_group', '利益集团')]存在。#!"
 bpm_pronounced_support_for_democracy_despite_backlash:0 "不顾反对而明确支持民主"
 bpm_ig_support_from_church_authorities:0 "获得教会当局的正式支持"
 bpm_strong_backlash_for_pronouncing_support_for_democracy:0 "因支持民主而遭到强烈反对"
 bpm_interest_group_supportive_of_liberal_democracy:0 "支持自由民主的反现代主义利益集团"
 bpm_reinforcing_anti_modernist_ideas:0 "强化反现代主义立场"
 option_moderated_towards_democracy_tt:0 "#v 意识形态倾向#!进度条将每月向#bold 民主一侧#!移动 #italic 0.1#! 点。"
 option_moderated_towards_christianity_tt:0 "#v 意识形态倾向#!进度条将每月向#bold 基督教一侧#!移动 #italic 0.1#! 点。"
 bpm_christdem_flavour.1.t:0 "[ROOT.GetCountry.GetName]首席主教捍卫民主"
 bpm_christdem_flavour.1.desc:0 "我们的首席主教发表了一场高调且富有争议的演说，为坚持并立足于民主的立场辩护，同时委婉地保证教会对自由宪法并不抱有敌意。这场演说既赢得了掌声，也引来了对教会现代主义政策的不满之声，首席主教本人亦遭到反对。"
 bpm_christdem_flavour.1.f:0 "我不愿被国家强迫去相信它所认定的真理，因为国家并非真理的裁决者。然而国家有义务保护我实践我所选择的真理，即践行我所信奉的宗教。这正是现代国家中宗教自由之所在，自由的国家有义务予以尊重和保障，不仅对每一位公民如此，对为信奉和传播其信仰而联合起来的公民群体也是如此——即对法人、对社团、对教会。\n\n——夏尔·德·蒙塔朗贝尔，1863年"
 bpm_christdem_flavour.1.a:0 "教会终于前进，接纳了现代世界。"
 bpm_christdem_flavour.1.b:0 "首席主教在现代主义威胁上走得太远了。"
 bpm_christdem_flavour.3.t:0 "孤军奋战"
 bpm_christdem_flavour.3.desc:0 "政治上的孤独感与被迫的自力更生，沉重地压在众多天主教活动家心头，又常因争夺影响力与成员、保护自己人免受众多不友好群体侵害的持续政治斗争而加剧——从@ig_conservatives! 保守主义者，到@ig_liberals! 自由主义者与@ig_socialists! 社会主义者，再到天主教会本身。这些束缚虽令天主教徒备受煎熬，却也赋予了他们采取更为激进行动、击败对手的力量与动力。"
 bpm_christdem_flavour.3.f:0 "——我告诉你，如果我们不从保守派那里得到临时支持，我们根本斗不过这些穷凶极恶的自由派！我甚至得到了一位官——……\n\n——我告诉你，没门，也没人可帮，因为我们只能靠自己！他们早就串通好了要利用我们，而且教会还一直在给我们设置重重障碍……让这些贪婪的罪人都下地狱去吧……"
 bpm_christdem_flavour.3.a:0 "我们永远有彼此！"
 bpm_christdem_flavour.3.a.tt:0 "#v 脱离天主教会#!进度条将推进 #bold #italic 0.5%#!#!。"
 bpm_christdem_flavour.3.b:0 "至少教会或许还能帮上点忙……"
 bpm_rising_internationalism_amongst_christian_youth:0 "基督教青年中日渐高涨的国际主义"
 bpm_christdem_flavour.15.a.tt:0 "#v 脱离天主教会#!进度条将推进 #bold #italic 0.25%#!#!。"
 bpm_christdem_flavour.15.t:0 "天主教青年拒升国旗"
 bpm_christdem_flavour.15.desc:0 "在某个天主教青年组织的一次地方集会上，发生了一桩不可思议的丑闻。部分青年，多为工人，大多干脆拒绝唱国歌，并就此事与在场的其他人激烈争吵。\n\n消息传到当地报界，称该支部对任何[ROOT.GetCountry.GetAdjective]象征都极为敌视，将“传统民族主义”视为“社会反动”。"
 bpm_christdem_flavour.15.f:0 "我记得多年前，我手下有一个由本市工人阶级青年组成的支部。那些小伙子非常激进、成分复杂，但又是何等的宗教狂热分子！他们都觉得国旗这个理想总体上已经过时，一被要求为国家祈祷就发牢骚或争吵，每次集会——无论是自家人还是与外人一起——都拒绝升起我们的国旗。他们感到与广大人民、或作为欧洲人更为亲近，而非作为某个民族。"
 bpm_christdem_flavour.15.a:0 "我想我们该睁一只眼闭一只眼……"
 bpm_christdem_flavour.15.b:0 "管教他们！谁都不许亵渎我们的民族象征。"
 bpm_christdem_split.30.t:0 "变革的落日"
 bpm_christdem_split.30.d:0 "大规模的贫困、经济危机，以及难以想象的恶劣劳动与生活条件，促使@ig_christian_democrats! #blue 基督教民主主义者#!将其意识形态转向非常反资本主义和民主的立场，把普遍的政治与经济民主置于首位——提议推行普选权、妇女选举权、经济社会化以及中央计划至上的原则，而这一切又都受基督教道德与公民社会的约束。"
 bpm_christdem_split.30.a:0 "他们是什么社会主义的冒牌货吗？"
 ideology_eco_distributist_economy:0 "分配主义经济"
 ideology_eco_distributist_economy_desc:0 "#lore 该群体信奉分配主义、法团主义与财政保守主义的原则，谋求改革资本主义——支持合作社、乡村发展和手工业生产。#!"
 ig_christian_democrats:0 "基督教民主主义者"
 ig_christian_democrats_only_icon:0 "@ig_christian_democrats!"
 ig_christian_democrats_desc:0 "基督教民主主义者代表着左翼天主教思想，谋求让天主教徒与现代（自由）民主和解。尽管其意识形态深受各地情况以及《新事》通谕及其有机主义原则的影响，他们总体上致力于社会平等主义，并辅之以形形色色的激进理念。例证包括意大利国际主义的平民主义者、德国大帐篷式的中央党、捷克分配主义的利德维派，以及1930年代波兰国家统制主义的哈德齐派。"
 ig_catholic_interests:0 "天主教利益"
 ig_catholic_interests_desc:0 "一个代表政治上多元化、独立的天主教会信徒的利益集团。他们谋求扩大天主教在政治与文化中的参与，并保护信众免受国家在宗教领域越权的侵害，例如强行推行世俗主义。例证包括德国中央党、法国自由行动、意大利劳动大会组织以及比利时的F.C.C.C.A。"
