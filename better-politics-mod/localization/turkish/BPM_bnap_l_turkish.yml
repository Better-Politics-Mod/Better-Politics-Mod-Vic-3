 bpm_bnap_patriots_events.1.t:0 "Vatanseverler İsyanı"
 bpm_bnap_patriots_events.1.d:0 "Vatanseverler Kraliyet'e karşı ayaklandı."
 bpm_bnap_patriots_events.1.f:0 "BİZ, Aşağı Kanada halkı adına, yaratılış amacını ve niyetini kötüye kullanan bir Hükümeti devirmemize ve adalet imparatorluğunu yeniden kuracak, iç huzuru sağlayacak, ortak savunmayı temin edecek, genel iyiliği teşvik edecek ve bize ve gelecek nesillerimize sivil ve dini özgürlüklerin avantajlarını güvence altına alacak bir Hükümet biçimini seçmemize izin veren İlahi Takdir'in kararlarını kabul ederek..."

 bpm_bnap_patriots_events.1.a:0 "İsyanı ezeceğiz!"
 bpm_bnap_patriots_events.1.b:0 "İngiliz yardımına ihtiyacımız var."

 je_bpm_bnap_the_patriots:0 "Vatanseverler"
 je_bpm_bnap_the_patriots_desc:0 "İngiliz sömürgelerindeki Fransız Kanadalıları izlemeliyiz."
 je_bpm_bnap_the_patriots_reason:0 "[SCOPE.sCulture('que_culture').GetName] halkı, İngiliz sömürgelerindeki nüfusun önemli bir bölümünü oluşturmaktadır ve Yeni Fransa sakinlerinin soyundan gelmektedir. Fransızca konuşan Katolikler olarak, İngiliz yönetimine karşı küçümsemeyle yaklaşmaktadırlar ve geçmişte İngiliz yönetimine isyan ettikleri bilinmektedir. Aşağı Kanada'nın Fransız çoğunluğu, sömürge üzerindeki İngiliz kontrolünü ortadan kaldırmayı amaçlayan radikal ve cumhuriyetçi bir hareket olan 'Vatanseverler Hareketi'ne giderek daha fazla ilgi duymaya başlamıştır. Ayaklanıp sömürgeleri parçalamamalarını sağlamak için onlara göz kulak olmalıyız."
