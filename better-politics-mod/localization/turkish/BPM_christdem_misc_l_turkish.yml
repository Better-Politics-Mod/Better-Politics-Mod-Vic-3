 ############## Hristiyan mı, yoksa Demokrat mı? Rol Yapma / LARP Amaçları ve Öğretim için İpuçları: Tarihçe Sayfaları


 je_bpm_group_young_right_p1: "Doğuşları, #bold 'Ligue démocratique belge'#!'nin (#italic Belçika Demokratik Ligi, L.D.B.#!) kurulduğu 30 Mart 1891 tarihine dayandırılabilir. #v Genç Sağ#!, artan popülerliğe ve Leo XIII'ün desteğine (Temmuz 1895) sahip olsa da, Katolik Partisi içinde ve dışında çeşitli devasa engelleri aşmak ve birçok grupla, örneğin çeşitli #gold Sosyalistler#!, #gold Liberaller#!, #gold Katolik Kilisesi#! (birliği korumak isteyen ve aynı zamanda genellikle Woeste ile müttefik olanlar) ve hatta bazen #gold Kral II. Leopold#! ile (Papa Leo XIII'e #v Genç Sağ#! hakkında birkaç kez yazan kişi) savaşmak zorundaydı.\n\nEski Sağ, #bold L.D.B.#!'nin var olma hakkını reddetti ve zaman kazanmaya çalışarak, piskoposlarla işbirliği yaparak, çeşitli kongreleri (#italic Liège#!'dekiler gibi) kapatarak, seçim listelerini reddederek ve en önemlisi Hristiyan Demokrat liderliğindeki her türlü mevzuatla, özellikle de sosyal olanlarla mücadele ederek aktif olarak onunla savaştı. 1893 karma evrensel oy hakkı sistemi, #v Genç Sağ#!'ın parlamenter siyasete girmesine izin verdi ve onlara Parlamento'da 12 sandalye kazandırdı, ancak aynı zamanda L.D.B.'de 'groupe démocratique' adlı 8 üyeli grubun işçileri dezavantajlı duruma düşüren bir belediye seçimleri tasarısına isteksizce oy vermesi nedeniyle bir krize neden oldu. Bu durum Helleputte'in başkanlıktan istifa etmesine yol açtı, ancak sonunda ayakta kalmayı başardılar.\n\nPapa'nın #v Genç Sağ#! adına müdahalesi, onların 1895 belediye seçimlerinde Katolik listelerine kabul edilmelerini sağladı. Yasama seçimleri yaklaşırken iki fraksiyon arasında 1896'da bir ateşkes yapıldı, ancak Woeste Katoliklerin listeleri kapatmasını sağladı ve Hristiyan Demokratları zayıflatmak ve asimile etmek amacıyla sosyal bir program hazırlamak üzere F.C.C.C.A. içinde bir komisyon kurdu. Ancak yerel olarak muhafazakarlar, Hristiyan demokratların seçim listelerine girmesine izin verdi ve sonuçta #v Genç Sağ#!'ın Federal Parlamento'da 14 sandalye kazanmasını sağladı.\n\n#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_group_young_right_tooltip_p2 #bold #grey İkinci Sayfa#!#!#!\n#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_christ_dem_pedia_tooltip #bold #gold ChristDemPedia#!#!#!" # 

 je_bpm_group_young_right_tooltip_p2: "Helleputte, çeşitli toplumsal hareketleri ve grupları bir araya getirmek için her seçim bölgesinde ortak bir komite önerdiği F.C.C.C.A. Sint-Truiden kongresine (Mayıs 1897) delege olarak seçildi. Woeste, Ekim 1897'de Demokratlarla görüşmeyi kabul etti, ancak sonunda muhalif pozisyonunu korudu ve piskoposların müdahalesine rağmen 'Saint-Trond formülü' #v Eski Sağ#! tarafından kabul edilmedi. Ancak #gold Belçika'nın#! çeşitli yerlerinde ortak komiteler kuruldu ve 1898 seçimlerine hazırlık için anlaşmalar yapıldı. Genç Sağ temsilcilerini korudu ve daha geniş bir destek kazandı.\n\nZaman geçtikçe Woeste'nin nüfuzu yavaş yavaş azalırken, Genç Sağ'ın desteği piskoposların ve gazetelerin onların yanında yer almasıyla artmaya devam etti.\n\nGenç ve Eski Sağ arasındaki savaş sessiz tabandan Parlamento kürsüsüne kaymıştı. 27 Mayıs 1906'daki yasama seçimleri, hükümetin çoğunluğunu bir şekilde azaltmış ancak tehlikeye atmamıştı. Genç Sağ'ın hükümetin muhafazakarlığından duyduğu memnuniyetsizlik, Pazar günü tatil yasası (26 Temmuz 1905) oylamasında çekimser kalarak ifade edildi.\n\nCampine'deki madencilik imtiyazları tasarısı, güçlerini göstermek için büyük bir fırsat verdi. Hristiyan Demokratlar bu imtiyazların verilmesi için şu şartları koştular: madenciler için emeklilik, çalışma saatlerinde sekiz saatlik bir sınır, kadınlar ve çocuklar için yeraltında çalışmanın yasaklanması ve işçiler için sıhhi tesislerin iyileştirilmesi. Eski Sağ ve Woeste, yaklaşan tehlikeyi bilerek, konuyu komiteye geri göndermeyi önererek yanıt verdiler. Önergesi reddedildi. Hristiyan demokratlar, Eski Sağ'ın 'ülkenin talep etmediği reformları' dayatmamaları yönündeki uyarılarına rağmen madencilere azami fayda sağlamaya niyetliydiler.\n\nHiç kimsenin diğerinin taleplerine boyun eğmek istememesi üzerine kriz kamuoyuna yansıdı; Sosyalistler ve Radikal Liberaller Genç Sağ'ı destekledi ve birbirleriyle işbirliği yaptılar. Hristiyan demokratlar hükümetin yapısının tüm sağı temsil etmediğini sorguladı, ardından daha ılımlı olan önceki Başbakan Beernaert muhalefete katıldı. 12 Nisan 1907'de Eski Sağ hükümeti yenilgiye uğratıldı ve tasarı da reddedildi; 59 Katolik ve 11 liberal lehte, 34 sosyalist, 23 radikal ve 19 Hristiyan demokrat ise aleyhte oy kullandı. Hükümet istifasını Kral'a sundu.\n\n#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_group_young_right_tooltip_p3 #bold #grey Üçüncü Sayfa#!#!#!\n#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_christ_dem_pedia_tooltip #bold #gold ChristDemPedia#!#!#!"

 je_bpm_group_young_right_tooltip_p3: "Bir sonraki hükümet, Genç Sağ'dan 2 üyesi olan (Jules Renkin ve Joris Helleputte) Jules de Trooz tarafından yönetildi ve Eski Sağ'a Genç Sağ'ın desteği olmadan yönetmenin mümkün olmadığını gösterdi.\n\nWoeste'nin nüfuzu çökmeye devam etti ve 1907'ye gelindiğinde siyasette tamamen önemsiz bir hale geldi; Genç Sağ yanlısı Désiré-Joseph Mercier'in Başpiskopos olarak atanması, 1909 5. Malines Kongresi ve Woeste'nin bir başka yenilgisiyle nüfuzu tamamen ortadan kalktı. Nihayetinde Hristiyan Demokrasi'ye daha yakın ılımlı biri olan Charles de Broqueville, Katolik Partisi'nin liderliğini üstlendiğinde, 'Eski' Eski Sağ işlevsel olarak var olmaktan çıktı ve Katolik Partisi daha Hristiyan Demokrat eğilimli hale geldi.\n\nKullanılan Kaynaklar:\n- Philippe Defossez'in \"Jeune droite et vieille droite avant le congrès catholique de 1909\" eseri;\n- Michael P. Fogarty'nin \"Christian Democracy in Western Europe\" eseri;\n- Wolfram Kaiser, Helmut Wohnout (ve daha fazlası) tarafından hazırlanan \"Political Catholicism in Europe 1918-1945\" eseri;\n#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_christ_dem_pedia_tooltip #bold #gold ChristDemPedia#!#!#!"



