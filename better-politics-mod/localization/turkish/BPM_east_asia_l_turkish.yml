 je_bpm_xinjiang:0 "Dış Sınır"
 je_bpm_xinjiang_reason:0 "Moğolistan ve Mançurya bozkırlarından uzak batının çöllerine kadar asıl Çin'in çok ötesindeki topraklar son iki yüzyılda Büyük Qing tarafından fethedildi. Bu topraklar şu anda askeri valilerden sadık kabile yetkililerine kadar değişen kişiler tarafından yönetiliyor ve bu nedenle Pekin'in bu topraklar üzerindeki kavrayışı en iyi ihtimalle genellikle zayıftır, her daim sömürgeci güçler ve isyankar yereller tarafından tehdit altındadır. Eğer bir gün bu toprakların temel eyaletler olarak yönetilmesini umut ediyorsak, yapacak çok işimiz var.\n\n #lore \"Han olmayan insanların Çin'in tebaası olamayacağına ve onların topraklarının Çin topraklarına entegre edilemeyeceğine dair bir Çin (Zhongxia) görüşü var. Bu bizim hanedanımızın Çin anlayışını temsil etmez, daha çok önceki Han, Tang, Song ve Ming hanedanlarının anlayışıdır...\"\n\n-Qianlong İmparatoru, 1755#!"
 xinjiang_integration_tt:0 "$xinjiang_states_tt$ eyaletleri entegre edildi ve %10'un altında [concept_turmoil] değerine sahip"
 xinjiang_states_tt:0 "of #tooltippable;tooltip:[Country.GetTooltipTag]je_bpm_xinjiang_special_tooltip Büyük Çin#!"
