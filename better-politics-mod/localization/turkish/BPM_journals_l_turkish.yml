 bpm_modernizers.1.t:0 "Modernleşme Tartışması"
 bpm_modernizers.1.d:0 "Batılı fikirlerin [ROOT.GetCountry.GetName] içine tüm gücüyle girmeye başlamasıyla birlikte, sanayileşmiş batılı ülkelere yetişmek için kat etmemiz gereken çok mesafe olduğu giderek daha açık hale geldi. Sonuç olarak entelektüeller arasındaki tartışmalar ilginç bir hal almaya başlıyor - kendi modernleşmemiz uğruna Batı'yı ne kadar taklit etmeliyiz?"
 bpm_modernizers.1.f:0 "TODO"
 bpm_modernizers.1.a:0 "Batılılaşsak da batılılaşmasak da, [ROOT.GetCountry.GetName] sike sike modernleşecek!"

 bpm_modernizers.2.t:0 "İleri, Modernliğe!"
 bpm_modernizers.2.d:0 "Ülkemizdeki modernleşme tartışmaları nihayet sona erdi - sonuç olarak $bpm_je_all_modernizers$ açıkça ideolojik bir zafer elde etti. Ülkenin geri kalanı onların vizyonunu paylaşsın ya da paylaşmasın, aydınlar genel olarak $bpm_je_all_modernizers$ tarafının davasına sıkı sıkıya inanıyor ve önümüzdeki yıllarda da fikirlerini değiştirmeyecekler."
 bpm_modernizers.2.f:0 "TODO"
 bpm_modernizers.2.a:0 "Göreceğiz bakalım fikirleri bir boka yarayacak mı."

 bpm_modernizers.3.t:0 "Kendi Yolumuz"
 bpm_modernizers.3.d:0 "Modernleşme tartışmaları sona ererken, aydınlarımızın [ROOT.GetCountry.GetName] merkezli grupları kazanmış gibi görünüyor. Rakiplerinin fikirlerinin akademik çevrelerde tamamen itibarını kaybetmesiyle, [ROOT.GetCountry.GetName] adlı ülkenin sosyal yapılarının yakın gelecekte çoğunlukla değişmeden kalmaya hazır olduğu görülüyor."
 bpm_modernizers.3.f:0 "TODO"
 bpm_modernizers.3.a:0 "Özümüzü koruduk değil mi ulan?"

 bpm_modernizers.4.t:0 "Boş Kazanlar"
 bpm_modernizers.4.d:0 "Ateşli modernleşme tartışmaları sona erdiğinde, duman dağıldığında edebi savaş alanları boş kalıyor. Hiçbir tarafın ideolojik bir zafer elde edememesiyle, görünüşe göre hiçbir vizyon ülkemizin aydınları arasında galip olarak kendini sağlamlaştıramadı."
 bpm_modernizers.4.f:0 "TODO"
 bpm_modernizers.4.a:0 "En azından şu entel dantel gürültüsü bitti."

 bpm_modernizers.5.t:0 "Kapı Sertçe Kapandı"
 bpm_modernizers.5.d:0 "Bir yandan yabancı etkisinin, diğer yandan muhafazakar muhalefetin artan baskısıyla [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullName], ulusu dışarıdan ülkeyi kirleten yıkıcı fikirlerden korumak için radikal bir şekilde tecritçi bir politika ilan etti. Ticari bağların ciddi şekilde azaltılması, elçiliklerin kapatılması ve yabancı aydınların sınır dışı edilmesiyle, [ROOT.GetCountry.GetName] adlı ülkenin geleceği kendi kendine dayatılan bir izolasyon gibi görünüyor."
 bpm_modernizers.5.f:0 "TODO"
 bpm_modernizers.5.a:0 "Geriye sadece sağır edici bir sessizlik kaldı."

 bpm_modernizers.6.t:0 "Büyük Susturma"
 bpm_modernizers.6.d:0 "Hükümetin liberal yakınlıklarından ve geleneği açıkça hiçe saymasından memnun olmayan muhafazakarlarımız, [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] makamını iktidardan uzaklaştırmak için bir araya geldiler. Şimdi ülkeye giren her yeni fikri boğmak için harekete geçtiklerinden, ülkemizin geleceği kendi kendine dayatılan bir izolasyon gibi görünüyor."
 bpm_modernizers.6.f:0 "TODO"
 bpm_modernizers.6.a:0 "Geriye sadece sağır edici bir sessizlik kaldı."

 bpm_modernizers.7.t:0 "Bir Modernlik Örneği"
 bpm_modernizers.7.d:0 "[SCOPE.gsInterestGroup('relevant_ig').GetName], [SCOPE.sCountry('relevant_country').GetName] içinde kaydedilen ilerlemeden ilham alarak, Modernleşme Tartışmalarında $bpm_je_all_modernizers$ ile olan uyumlarını takip ederek karşılıklı ilişkilerimizi geliştirmeyi amaçlıyorlar."
 bpm_modernizers.7.f:0 "TODO"
 bpm_modernizers.7.a:0 "İlginç cidden."

 bpm_modernizers.8.t:0 "Bir Çürüme Örneği"
 bpm_modernizers.8.d:0 "[SCOPE.gsInterestGroup('relevant_ig').GetName], [SCOPE.sCountry('relevant_country').GetName] tarafındaki ahlaki çürümeden öfke duyarak, Modernleşme Tartışmalarında $bpm_je_all_anti_modernizers_tt$ ile olan uyumlarını takip ederek aramızdaki daha yakın ilişkileri caydırmayı amaçlıyorlar."
 bpm_modernizers.8.f:0 "TODO"
 bpm_modernizers.8.a:0 "Bu da enteresan bak."

 bpm_modernizers.9.t:0 "Yeni Bir Örnek"
 bpm_modernizers.9.d:0 "[SCOPE.sCountry('relevant_country').GetName] adlı ülkenin uluslararası siyasi alanda bir eşit olarak yükselişiyle birlikte, Modernleşme Tartışmalarında $bpm_je_all_modernizer$ tarafında olanların bir kısmı, öykünme ufkumuzu genişletmeyi ve batılılaşmaya olan odağımızdan vazgeçerek modernleşmek için batılı olmayan yöntemleri dahil etmeyi amaçlıyorlar."
 bpm_modernizers.9.f:0 "TODO"
 bpm_modernizers.9.a:0 "Sonradan görme dallamalar, başka bir şey değil."
 bpm_modernizers.9.b:0 "[SCOPE.sCountry('relevant_country').GetName] Batı'dan çok daha iyi bir örnek ulan!"

