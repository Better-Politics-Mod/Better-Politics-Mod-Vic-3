l_english:
 bpm_codification_level_constitutional: "#tooltip_header Constitutional Law#!\n$TOOLTIP_DELIMITER$\nThe highest level of codification, the constitution is the foundation of the legal system and the source of all other laws. It is the most difficult to change and is usually only amended in exceptional circumstances."
 bpm_codification_level_legal: "#tooltip_header Law#!\n$TOOLTIP_DELIMITER$\nThe second highest level of codification, laws are passed by the legislature and are binding on the government. They are usually more detailed than the constitution and can be changed more easily."
 bpm_codification_level_decree: "#tooltip_header Edict#!\n$TOOLTIP_DELIMITER$\nEdicts are issued by the executive branch and have the force of law. They are usually used to implement laws passed by the legislature or to address emergencies. They are less formal than laws and can be changed very easily."
 bpm_codification_level_traditional: "#tooltip_header Traditional Law#!\n$TOOLTIP_DELIMITER$\nTraditional law is based on customs and practices that have developed over time. They are usually unwritten and are enforced by the community rather than the state."

 bpm_codification_cannot_be_legal: "Cannot be Enacted by Legislature"
 
 bpm_codification_executive_supports: "The #gold [GetPlayer.MakeScope.Var('bpm_ruling_ig').GetCharacter.GetPrimaryRoleTitle]#! #g supports#! the [concept_bpm_edict]." 
 bpm_codification_hog_supports: "The #gold $bpm_hog_title_default_contextless$#! #g supports#! the [concept_bpm_edict]." 
 bpm_codification_decree_cooldown: "Has not enacted a decree recently."

# decree support reasons
 bpm_codification_decree_support_from_advisory_body: "[GetLawType('law_advisory_body').GetName]"
 bpm_codification_decree_support_from_aristocrats: "[GetInterestGroupVariant('ig_landowners', GetPlayer).GetName]"
 bpm_codification_decree_support_from_bureaucrats: "[GetInterestGroupVariant('ig_petty_bourgeoisie', GetPlayer).GetName]"
 bpm_codification_decree_support_from_armed_forces: "[GetInterestGroupVariant('ig_armed_forces', GetPlayer).GetName]"
 bpm_codification_decree_support_from_strong_executive: "[GetLawType('law_executive_popular').GetName]"
 bpm_codification_decree_support_from_centralization: "[GetPlayer.GetActiveLawFromGroup('lawgroup_centralization').GetName]"
 bpm_codification_decree_support_from_censorship: "[GetPlayer.GetActiveLawFromGroup('lawgroup_free_speech').GetName]"
 bpm_codification_decree_support_from_loyal_bureaucrats: "#yellow;tooltip:[GetPlayer.GetTooltipTag],bpm_codification_loyal_bureaucrats_tt Loyal Bureaucrats#!"
 bpm_codification_loyal_bureaucrats_tt: "The [GetInterestGroupVariant('ig_petty_bourgeoisie', GetPlayer).GetName] are loyal if their $concept_approval$ is at least $ig_approval_neutral$ and we have [GetLawType('law_appointed_bureaucrats').GetName] or if their $concept_approval$ is $ig_approval_loyal$ and we have [GetLawType('law_elected_bureaucrats').GetName]."
 bpm_codification_decree_current_legal_codification: "#yellow;tooltip:bpm_codification_decree_current_codification_tt Current Codification Level ([concept_bpm_law])"
 bpm_codification_decree_support_from_supreme_legislature: "[GetLawType('law_supreme_legislature').GetName]"
 bpm_codification_character_risk_taking_default: "Base Risk Tolerance"

 bpm_codification_decree_current_codification_tt: "Changing a #yellow;tooltip:bpm_codified_law Codified#! Law by [concept_bpm_edict] is likely to be seen as illegitimate. Since [GetPlayer.MakeScope.Var('bpm_decree_cooldown_current_law').GetLawType.GetName] is #yellow;tooltip:bpm_codified_law Codified#!, it will be difficult to have [Concept('concept_bpm_ig_is_state_institutional', 'State Institutions')] turn a blind eye to this."

# concepts
 bpm_codified_law: "Codified\n$TOOLTIP_DELIMITER$\nA law that is enacted by the legislature. It is either a [concept_bpm_law] or a [concept_bpm_constitutional]."
 concept_bpm_codification: "Codification Level"
 concept_bpm_codification_desc: "The level of codification of the legal system. The higher the level, the more difficult it is to change the law. Levels are:\n[concept_bpm_tradition]\n[concept_bpm_edict]\n[concept_bpm_law]\n[concept_bpm_constitutional]"
 
 concept_bpm_tradition: "Traditional Law"
 concept_bpm_tradition_desc: "Traditional law is based on customs and practices that have developed over time. They are usually unwritten and are enforced by the community rather than the state."

 concept_bpm_edict: "Edict"
 concept_bpm_edicts: "Edicts"
 concept_bpm_edict_desc: "Edicts are issued by the executive branch and have the force of law. They are usually used to implement laws passed by the legislature or to address emergencies. They are less formal than laws and can be changed very easily."

 concept_bpm_law: "Law"
 concept_bpm_law_desc: "The second highest level of codification, laws are passed by the legislature and are binding on the government. They are usually more detailed than the constitution and can be changed more easily."

 concept_bpm_constitutional: "Constitutional Law"
 concept_bpm_constitutional_desc: "The highest level of codification, the constitution is the foundation of the legal system and the source of all other laws. It is the most difficult to change and is usually only amended in exceptional circumstances."


# failure/success events
 bpm_codification_events.2.t: "Non Compliance"
 bpm_codification_events.2.d: "The [concept_bpm_ig_is_state_institutional] have refused to implement the decree. They claim that it is illegitimate and that it violates the current codification level. The bureaucracy is not revolting, but they are not cooperating either."
 bpm_codification_events.2.f: "“I swear loyalty to the Constitution, obedience to the law, and conscientious fulfillment of the duties of my office, so help me God”.\n\n- Oath of Loyalty for All State Officials, German Reich, 1919"
 bpm_codification_events.2.a: "We have avoided the worst."

 bpm_codification_events.3.t: "Edict Implemented"
 bpm_codification_events.3.d: "The [concept_bpm_ig_is_state_institutional] have implemented the decree. The bureaucracy is cooperating and the decree is now in effect."
 bpm_codification_events.3.f: "“I do order and declare that all persons held as slaves are, and henceforward shall be free.”\n\n- Emancipation Proclamation, United States, 1863"
 bpm_codification_events.3.a: "We have succeeded."

 bpm_codification_events.4.t: "Institutional Takeover"
 bpm_codification_events.4.d: "We have implemented the decree to no resistance. The [concept_bpm_ig_is_state_institutional] have been taken over by the executive branch. The bureaucracy is now entirely under our control."
 bpm_codification_events.4.f: "“I am the state”.\n\n- Louis XIV of France, 1661 (misattributed)"
 bpm_codification_events.4.a: "Power is ours."

 bpm_codification_events.5.t: "Complete Backfiring"
 bpm_codification_events.5.d: "The [concept_bpm_ig_is_state_institutional] have staged a coup. The executive branch has been overthrown and the decree has been abolished. The bureaucracy is now in control."
 bpm_codification_events.5.f: "“I die, but the State remains.”.\n\n- Louis XIV of France, 1715"
 bpm_codification_events.5.a: "We have failed."


 bpm_codification_set_traditional_tooltip: "[concept_bpm_codification] of is set to [concept_bpm_tradition]."
 bpm_codification_set_decree_tooltip: "[concept_bpm_codification] of is set to [concept_bpm_edict]."
 bpm_codification_set_legal_tooltip: "[concept_bpm_codification] of is set to [concept_bpm_law]."
 bpm_codification_set_constitutional_tooltip: "[concept_bpm_codification] of is set to [concept_bpm_constitutional]."

 bpm_codification_cannot_do_decree_on_supreme_legislature: "[GetLawType('law_supreme_legislature').GetName] disallows executive decrees."


 je_codifying_constitution: "Formalizing our Traditions"
 je_codifying_constitution_reason: "There is now pressure to formalize the structure of our government. We must decide whether to codify our traditions into a constitution or to continue with the status quo. We also have the option of granting all powers to the legislature, which will make it easier to pass laws but significantly weaken swift executive action."
 bpm_executive_principle_is_constitutional_law: "[GetPlayer.GetActiveLawFromGroup('lawgroup_executive_principles').GetName] is [concept_bpm_constitutional]."
 bpm_legislative_principle_is_constitutional_law: "[GetPlayer.GetActiveLawFromGroup('lawgroup_legislative_principles').GetName] is [concept_bpm_constitutional]."
 bpm_governance_principle_is_constitutional_law: "[GetPlayer.GetActiveLawFromGroup('lawgroup_governance_principles').GetName] is [concept_bpm_constitutional]."

 bpm_executive_principle_is_not_constitutional_law: "[GetPlayer.GetActiveLawFromGroup('lawgroup_executive_principles').GetName] is not a [concept_bpm_constitutional]."
 bpm_legislative_principle_is_not_constitutional_law: "[GetPlayer.GetActiveLawFromGroup('lawgroup_legislative_principles').GetName] is not a [concept_bpm_constitutional]."
 bpm_governance_principle_is_not_constitutional_law: "[GetPlayer.GetActiveLawFromGroup('lawgroup_governance_principles').GetName] is not a [concept_bpm_constitutional]."

 bpm_constitutional_convention: "Constitution Codified"

 bpm_in_negotiation: "In Negotiations"