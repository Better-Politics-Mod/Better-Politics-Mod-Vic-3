l_turkish:

# ESTATES
 je_bpm_russia_estates:0 "Rus İmparatorluğu Zümreleri"
 je_bpm_russia_estates_reason:0 "Rus devleti fırtınalı 1800'lere pek çok tarihi bagajla giriyor. Yasalarına sıkı sıkıya kodlanmış ve sosyal dokuyu her seviyede delip geçen Sosloviye ayrılıkları vardır - bir kişinin içine doğduğu, çoğunlukla soydan geçen bir zümre. Sosyal hareketliliği boğan, gerilimleri artıran ve yenilikleri sekteye uğratan bu kadim zümrelerin ortadan kaldırılması için geniş çaplı reformlar gerekecektir - tabii eğer Rusya'daki güçler modernitenin gerekli olduğuna inanırsa. Ama belki de bu ülke kadim geleneklerini bir sonraki yüzyıla da değişmeden taşıyabilir...\n\n$je_bpm_russia_estates_tooltipable_peasants$: [SCOPE.GetRootScope.GetCountry.GetCustom('je_bpm_russia_estates_status_peasants')]\n$je_bpm_russia_estates_tooltipable_nobles$: [SCOPE.GetRootScope.GetCountry.GetCustom('je_bpm_russia_estates_status_nobles')]\n$je_bpm_russia_estates_tooltipable_clergy$: [SCOPE.GetRootScope.GetCountry.GetCustom('je_bpm_russia_estates_status_clergy')]\n$je_bpm_russia_estates_tooltipable_burghers$: [SCOPE.GetRootScope.GetCountry.GetCustom('je_bpm_russia_estates_status_burghers')]\n$je_bpm_russia_estates_tooltipable_foreigners$: [SCOPE.GetRootScope.GetCountry.GetCustom('je_bpm_russia_estates_status_foreigners')]"

 je_bpm_russia_estates_tooltip_exists:0 "#lore Var#!"
 je_bpm_russia_estates_tooltip_exists_de_jure:0 "#lore Var#! (Fiilen #green Kaldırıldı#!)"
 je_bpm_russia_estates_tooltip_abolished:0 "#green Kaldırıldı#!"
 je_bpm_russia_estates_tooltip_abolished_racist:0 "#blue Korumalar Kaldırıldı#!"
 je_bpm_russia_estates_tooltip_abolished_partial:0 "#green Kaldırıldı#! (#lore Özyönetim Korundu#!)"

 je_bpm_russia_estates_abolish_peasants_button:0 "Krestyanstvo'yu Kaldır"
 je_bpm_russia_estates_abolish_peasants_button_desc:0 "Bu en kalabalık zümreyi kaldırmak, Rusya'nın büyük çoğunluğunu yasal olarak eşit hale getirecektir; ki bu soylular için pek de hoş bir teklif değil. Böyle bir değişiklik, köylülerin kendi özyönetim biriminin de kaldırılmasını gerektirecektir - kadim Obşçina modernleşmek zorunda kalacaktır."
 je_bpm_russia_estates_abolish_nobles_button:0 "Dvoryanstvo'yu Kaldır"
 je_bpm_russia_estates_abolish_nobles_button_desc:0 "Soylu ayrıcalıklarını kaldırmak, en iyilerimizin doğum haklarıyla değil, liyakatleriyle zirvede olmalarını sağlayacaktır. Doğal olarak liyakatle değil de ayrıcalıkla orada olanlar bu durumdan epey rahatsız olacaktır."
 je_bpm_russia_estates_abolish_clergy_button:0 "Dukhovenstvo'yu Kaldır"
 je_bpm_russia_estates_abolish_clergy_button_desc:0 "Ruhban sınıfını o eşsiz nimetlerinden mahrum bırakmak onları kesinlikle kızdıracaktır - ancak daha seküler bir ulus olacaksak bu adım şarttır."
 je_bpm_russia_estates_abolish_burghers_button:0 "Gorozhane Zümrelerini Kaldır"
 je_bpm_russia_estates_abolish_burghers_button_desc:0 "Kent nüfusu içindeki çeşitli tabakaların farklı ayrıcalıklarını ve yükümlülüklerini kaldırmak, modernleşen bir ulus için gerekli olan daha fazla sosyal hareketliliğe olanak tanıyacaktır."
 je_bpm_russia_estates_abolish_foreigners_button:0 "İnorodet Ayrımlarını Kaldır"
 je_bpm_russia_estates_abolish_foreigners_button_desc:0 "Bizden farklı milliyetten olan insanlara spesifik haklar ve yükümlülükler vermemize gerek yok."

 je_bpm_russia_estates_tooltipable_peasants:0 "#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_russia_estates_tooltip_peasants Krestyanstvo #!"
 je_bpm_russia_estates_tooltipable_nobles:0 "#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_russia_estates_tooltip_nobles Dvoryanstvo #!"
 je_bpm_russia_estates_tooltipable_clergy:0 "#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_russia_estates_tooltip_clergy Dukhovenstvo #!"
 je_bpm_russia_estates_tooltipable_burghers:0 "#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_russia_estates_tooltip_burghers Gorozhane #!"
 je_bpm_russia_estates_tooltipable_foreigners:0 "#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_russia_estates_tooltip_foreigners Inorodtsy #!"

 je_bpm_russia_estates_tooltip_peasants:0 "#v Krestyanstvo#!, Köylülük, Rus nüfusunun büyük çoğunluğunun ait olduğu bir zümredir. En alt rütbeli zümre olan Krestyanstvo, zorunlu askerlik ve vergilendirmenin asıl yükünü çekerken aynı zamanda en sert cezalara maruz kalır.\n\nEğer serflik ülkenin yasası olarak kalırsa, köylüler esasen yerel aristokratların mülkü olmaya devam edecektir - çağdaş düşünürlerin de belirttiği gibi, kölelikten farksız bir düzen."
 je_bpm_russia_estates_tooltip_nobles:0 "#v Dvoryanstvo#!, Soylular, içinde Rus İmparatorluğu'nun soydan geçen aristokrasisini barındıran bir zümredir.\n\nEn ayrıcalıklı zümre olarak onlara yerleşim yeri olan toprakları mülk edinme, zorunlu askerlik ile bedensel cezadan korunma, vergiden muafiyet ve Rus yönetiminde yer alma konusunda özel ayrıcalıklar tanınır."
 je_bpm_russia_estates_tooltip_clergy:0 "#v Dukhovenstvo#!, Ruhbanlar, içinde Rus Ortodoks Kilisesi mensuplarını barındıran bir zümredir. Bu zümre de diğerleri gibi çoğunlukla babadan oğula geçse de, sağladığı ayrıcalıklar üyelerinin dini eğitimini tamamlamasını gerektirir; aksi takdirde birey kendi zümresi olarak başka bir (nispeten ayrıcalıklı) zümreyi seçmek zorunda kalır.\n\nAyrıcalıklı bir zümre olarak üyelerini kelle vergisinden, zorunlu askerlikten ve bedensel cezadan muaf tutar. Ortodoks olmayan din adamları bu zümrenin bir parçası değildir ve sosyal statüleri farklı bir zümreye bağlanmak zorundadır."
 je_bpm_russia_estates_tooltip_burghers:0 "#v Gorozhane#!, Kent Sakinleri, Rus şehirlerinde yaşayan insanların çoğunu içeren bir zümredir. Bu zümre kendi içinde #v Pochetnye Gorozhane#! (Saygın Vatandaşlar), #v Kupechestvo#! (Tüccarlar), #v Meschane#! (Burjuvalar), #v Remeslenniki#! (Zanaatkarlar) ve #v Rabochiye#! (İşçiler) olarak ayrılan, gruplar arasında hakları ile ayrıcalıkları değişen alt tabakalara sahip olma gibi benzersiz bir özelliğe sahiptir. En önemlisi, Gorozhane'nin alt sınıflarına -Meschane'ye- Krestyanstvo ile paylaştıkları bir boyunduruk olan bedensel cezaların uygulanmasına izin verilmişti.\n\nResmi olarak tanımlanmış ayrımlara ek olarak kent sakinleri, kendi içlerinde gayri resmi ancak buna rağmen son derece önemli bir grup da içeriyordu - hiçbir resmi zümreye ait olmayan bireyler, #v Raznochintsy#!. Bunlar, Rus İmparatorluğu'ndaki çeşitli ilerici veya devrimci sosyal ile entelektüel hareketlerin en yaygın mensuplarıdır."
 je_bpm_russia_estates_tooltip_foreigners:0 "#v Inorodtsy#!, Yabancılar, Rus İmparatorluğu'nda, genellikle Rus Uzak Doğusu, Sibirya, Orta Asya veya Kafkasya'da yaşayan Slav olmayan insanların geniş bir yasal kategorisidir.\n\nKendilerine yapılan muamele son derece farklı olsa da, devletin onlara yönelik muamelesinin birleştirici faktörü, kendilerine geçici olarak (ad-hoc) uygulanan farklı ayrıcalıklar ve ayrımcı politikalarla Rus zümre sisteminden genel muafiyetleriydi."

