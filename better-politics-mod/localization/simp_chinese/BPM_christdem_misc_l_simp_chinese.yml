 bpm_new_wine_old_wineskins_flavour.11.t:0 "旧皮囊里的新酒"
 bpm_new_wine_old_wineskins_flavour.11.d:0 "随着《新事》通谕的颁布和[GetInterestGroupVariant('ig_christian_democrats',GetPlayer).GetNameWithCountryVariant]的出现，一场新的政治斗争就此展开。[GetInterestGroupVariant('ig_conservatives',GetPlayer).GetNameWithCountryVariant]的老派保守精英不愿向激进的新天主教徒让步或认输，双方将为权力与生存而战。"
 bpm_new_wine_old_wineskins_flavour.11.f:0 "没有人把新酒装在旧皮囊里；否则新酒会把皮囊涨破，酒洒出来，皮囊也就毁了。但新酒必须装在新皮囊里，两者才能都保全。也没有人喝了陈酒就想喝新酒，因为他总说：陈的更好。\n\n——路加福音 5:36-39"
 bpm_new_wine_old_wineskins_flavour.11.a:0 "他们有没有想过独立起步？"
