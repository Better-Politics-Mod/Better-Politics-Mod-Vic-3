 bpm_je_modernizers_name_conservatives:0 "保守派"
 bpm_je_modernizers_name_conservative:0 "保守派"
 bpm_je_modernizers_desc_conservative:0 "保守派是与[GetPlayer.GetCustom('bpm_je_modernizers_name_modernizers')]对立的思潮——他们相信外国影响带来的风险远多于好处。他们赞成适度吸收外国思想，主要是在工业与军事领域，但坚决反对一切超出最必要范围的社会变革。"
 bpm_je_modernizers_name_slavophiles:0 "斯拉夫派"
 bpm_je_modernizers_name_slavophile:0 "斯拉夫派"
 bpm_je_modernizers_desc_slavophiles:0 "斯拉夫派是与西方派对立的思潮——他们相信，俄国的民族精神已被西方影响践踏得太过，而它过于自我、世俗和革命，无法与集体主义、基督教和忠君的俄国精神相契合。他们赞成适度吸收外国思想，主要是在工业与军事领域，但坚决反对一切超出最必要范围的社会变革。"
 bpm_je_modernizers_name_zapadniks:0 "西方派"
 bpm_je_modernizers_name_zapadnik:0 "西方派"
 bpm_je_modernizers_desc_zapadniks:0 "西方派是俄国知识界中的一股思潮，他们渴望效仿西方，从中汲取他们眼中最优秀的创新——自由主义、民主、人权与经济自由——以使俄国摆脱其落后的境地，追随他们伟大民族英雄彼得大帝的脚步。"
 bpm_je_modernizers_name_westernizers:0 "西化派"
 bpm_je_modernizers_name_westernizer:0 "西化派"
 bpm_je_modernizers_desc_westernizers:0 "西化派是我们知识界中的一股思潮，他们渴望效仿西方，从中汲取他们眼中最优秀的创新——自由主义、民主、人权与经济自由——以使我们的国家摆脱其落后的境地。"
 bpm_je_modernizers_name_modernizers:0 "现代化派"
 bpm_je_modernizers_name_modernizer:0 "现代化派"
 bpm_je_modernizers_desc_modernizers:0 "现代化派渴望以文化、产业的最新创新来更新我们的国家，以其他被视为进步前沿的国家为蓝图。随着非西方国家近来以既定秩序中受尊重成员的身份登上政治舞台，西化的理念让位于更广泛的现代化，现代化派愿意踏足更多独特的道路。"
 bpm_je_modernizers_desc_modernizer_effects:0 "若$bpm_je_all_modernizers$获胜，将按#v 社会影响力#!比例提供以下修正：\n  @arrow_up!社会[concept_technology]研究速度与传播\n  @arrow_down!军事[concept_technology]研究速度与传播\n  @arrow_up!生产[concept_technology]传播\n  @arrow_up!每周[concept_innovation]\n  @arrow_down![concept_bpm_political_stability]目标\n  @information! 在高#v 社会影响力#!下，[GetInterestGroupVariant('ig_intelligentsia', GetPlayer).GetName]会采取激进立场！"
 bpm_je_modernizers_desc_anti_modernizer_effects:0 "若$bpm_je_all_antimodernizers$获胜，将按#v 社会影响力#!比例提供以下修正：\n  @arrow_down!社会[concept_technology]研究速度与传播\n  @arrow_up!军事[concept_technology]研究速度与传播\n  @arrow_up!生产[concept_technology]传播\n  @arrow_up!每周[concept_innovation]\n  @arrow_up![concept_bpm_political_stability]目标"
