 bpm_je_split_natlibs_progress_from_conflicts_desc:0 "处于战争、外交博弈、革命或担任民族统一领袖"
 bpm_je_split_natlibs_progress_from_liberals_empowered_desc:0 "@ig_liberals! 自由主义者、@ig_radicals! 激进自由主义者或@ig_market_liberals! 市场自由主义者在执政或受扶植"
 bpm_je_split_natlibs_progress_from_libcons_suppressed_desc:0 "受打压的#bold 自由#!与#bold 保守#![Concept('concept_interest_group', '利益集团')]"
 bpm_je_split_natlibs_progress_from_libcons_marginal_desc:0 "边缘化的#bold 自由#!与#bold 保守#![Concept('concept_interest_group', '利益集团')]"
 bpm_je_split_natlibs_progress_from_radicals_desc:0 "[concept_radical]的下层人群。#blue @information! 仅当@ig_liberals! 自由主义者与@ig_conservatives! 保守主义者未被边缘化且未受打压时，此项才会累积。#!"
 bpm_je_split_natlibs_progress_from_ruler_desc:0 "来自[Concept('concept_interest_group', '利益集团')]的[concept_ruler]"
 je_bpm_split_marlibs:0 "市场自由主义崛起"
 je_bpm_split_marlibs_status:0 "监测市场自由主义者的涌现。"
 je_bpm_split_marlibs_reason:0 "我国近期的经济辩论正催生出一个由中上层自由主义者组成的新联盟，他们坚信在最小国家干预下市场最为高效。他们主张，自由市场将降低物价，为社会全体成员提供更好的生活水平，同时还能消弭国际冲突。\n\n#lore “自由贸易！它是什么？就是拆除分隔各国的那道壁垒；在那壁垒之后，盘踞着骄傲、复仇、仇恨与嫉妒的情绪，这些情绪不时冲破束缚，让一个个国家血流成河；这些情绪滋养着战争与征服的毒瘤，它们断言没有征服便没有贸易，助长着征服与统治的贪欲——正是这种贪欲驱遣你们的武将们前往异国散播毁灭，随后又召他们回来，让他们安稳地坐上你们激情的宝座，却只是用来在国内骚扰、压迫你们。”\n\n——理查德·科布登，1843#!"
 je_bpm_split_marlibs_special_tooltip:0 "该进度由以下因素决定：\n#variable [Country.MakeScope.Var('bpm_je_split_marlibs_progress_from_base').GetValue|+=]#! 基础值\n#variable [Country.MakeScope.Var('bpm_je_split_marlibs_progress_from_top_gp').GetValue|+=]#! 来自身为领先的[Concept('concept_great_power', '$concept_great_powers$')]。\n#variable [Country.MakeScope.Var('bpm_je_split_marlibs_progress_from_law_enactment').GetValue|+=]#! 来自颁布现代贸易、经济或农业法律。\n#variable [Country.MakeScope.Var('bpm_je_split_marlibs_progress_from_movement').GetValue|+=]#! 来自颁布经济、贸易或农业法律的政治运动。\n#variable [Country.MakeScope.Var('bpm_je_split_marlibs_progress_from_bad_laws').GetValue|+=]#! 来自实行倒退的经济法律，如农奴制或传统主义。\n#variable [Country.MakeScope.Var('bpm_je_split_marlibs_progress_from_patcons').GetValue|+=]#! 来自保守派接纳家长主义。\n#variable [Country.MakeScope.Var('bpm_je_split_marlibs_progress_from_radcaps').GetValue|+=]#! 来自至少10%的资本家人群为激进派。"
