# AMERICAN CIVIL WAR
 je_bpm_guilty_land:0 "Bu Suçlu Topraklar"
 je_bpm_guilty_land_reason:0 "Kölelik günahı Amerikan projesinin ruhunda yara izi bırakmıştır; \"tüm insanlar eşit yaratılmıştır\" sözleri Dokuzuncu Çember'in bir günahıdır. Halkımız bunu biliyor ve bu nedenle seçimlerin ve tavizlerin ikiyüzlülüğüne karşı mücadele ediyorlar. Bu yöntemler başarısız olduğunda, komplo teorileri ve ayrılıkçı duygular üretiyor.\n\n#GBB Kuzey'de#!, köleliğin devam eden suçundan Köle Gücü sorumlu tutuluyor. Çoğu kişi bu konuda kararsız olsa da, önümüzdeki yıllarda artan gerilim kitle sempatisi toplayabilir.\n\n#GB Güney'de#! şarlatanlar, kendini kandıran plantasyon sahiplerine ve çaresiz küçük mülk sahiplerine Eyalet Hakları (State's Rights) masalları anlatıyor. Yok Sayma (Nullification) krizinden yeni çıkmış olarak, tutkuları şimdilik yumuşadı.\n\n#GBB Kuzey#! ve #GB Güney#! radikalleşmesi sırasıyla şunlarla artar:\n#N +#! #GBB Kölelik karşıtı#!/#GB Kölelik yanlısı#! grupların seçim zaferleri,\n#N +#! Görevdeki #GBB Kölelik karşıtı#!/#GB Kölelik yanlısı#! Başkanların ölümleri,\n#N +#! Birliğe #GBB köle#!/#GB özgür#! eyaletlerin eklenmesi.\nZaman zaman tavizler teklif edilecek, ancak her iki tarafı da asla tatmin etmeyeceklerdir.\n\nUlusun çok hızlı genişlemesi konusunda dikkatli olun, zira yeni topraklar, bu toprakları kimin ekebileceği konusundaki tartışmaları beraberinde getirir. #BB Ulusal radikalleşme#! kaynama noktasına ulaştığında, her iki taraf da yasal savaş ve paramiliter şiddet kampanyalarını ilerletecektir.\n\n#N Harper's Ferry'ye yürüyüş durdurulamaz, sadece geciktirilebilir.#!"
