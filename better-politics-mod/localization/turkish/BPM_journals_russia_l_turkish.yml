 je_bpm_russia_patchwork_governance_tooltip_obschina:0 "#v Obşçina#!, Rusya'daki köylüler için bir özyönetim kurumudur. İç anlaşmazlıkları, ekonomik faaliyeti yönetebilir; köylüler arasındaki yerel asayişi, özellikle kolektif cezalandırmayı kullanarak düzene sokar ve aristokrasiye vergilendirme ile zorunlu askerlik konularında yardımcı olur.\n\nAncak serflik ve toprağın kolektif mülkiyetinin birleşimi, çoğu zaman #v Chernopolositsa'ya#! - köylü hanesinin kullandığı toprağın yönetilemez ve uzak parçalara bölünmesine yol açarak ekonomik verimsizlik yaratır."
 je_bpm_russia_patchwork_governance_tooltip_zemstvo:0 "#v Zemstvo#!, Rusya'daki bölgesel idareler için bir özyönetim kurumudur. Hiçbir polis gücü olmayan Zemstvolar tamamen örgütsel, idari ve vergiyle ilgili konulara odaklanırlar.\n\nAncak bu küçük güç bile, ülkenin daha muhafazakar aristokrasisinin canını sıkacak şekilde, çeşitli ilerici güçlerin güç ve nüfuzlarını kullanmalarına olanak tanır."

 je_bpm_russia_patchwork_governance_abolish_obschina_button:0 "Obşçina'yı Kaldır"
 je_bpm_russia_patchwork_governance_abolish_obschina_button_desc:0 "Obşçina, kurum olarak köylülerimize bir dereceye kadar özyönetim sağladı ve köylerdeki kolluk kuvvetlerini basitleştirmemize yardımcı oldu. Ekonomimiz değiştikçe ve polis güçlerimiz giderek daha standart hale geldikçe, bu kadim kurum bir varlık değil, bir yük haline geliyor; yükler ise atılmalıdır."
 je_bpm_russia_patchwork_governance_empower_obschina_button:0 "Obşçina'yı Güçlendir"
 je_bpm_russia_patchwork_governance_empower_obschina_button_desc:0 "Obşçina, Rusya'nın çalkantılı tarihindeki tiranlık denizinde kıymetli bir özgürlük vahasıdır. Bu kurumun en büyük savunucuları olan Narodnikler, seslerini duyuracak kadar siyasi sermaye elde ettiler. Obşçina tarihin akıntısına kapılmayacak - o bizim kendi, gerçekten Rus olan demokratik kurumumuz ve radikal liberalizmin trajedileri ile başarısızlıklarına karşı ilerici bir panzehirimiz olacak."
 je_bpm_russia_patchwork_governance_institute_zemstvos_button:0 "Zemstvo'ları Kur"
 je_bpm_russia_patchwork_governance_institute_zemstvos_button_desc:0 "Yaptırım gücü olmayan bölgesel özyönetim birimleri olan Zemstvoların kurulması, devasa devletimizin iradesini dayatma becerisini, bölgesel yönetimin ıvır zıvırlarına takılmadan büyük ölçüde artıracaktır. Ancak liberalizmin yükselişte olmasıyla birlikte, bu popüler yönetim çekirgelerinin kök salması bir tehdittir ve onlara karşı da gözümüzü dört açmamız gerekecek."
 je_bpm_russia_patchwork_governance_abolish_zemstvos_button:0 "Zemstvo'ları Kısıtla"
 je_bpm_russia_patchwork_governance_abolish_zemstvos_button_desc:0 "Zemstvoların getirilmesi ulusumuz için bir nimet oldu - ancak yan etkileri de olmadı değil. Sahip oldukları güçleri sınırlayarak, istikrarı bozan bu doğaları belki de kısıtlanmalıdır. Ne de olsa onlar ülkeye hizmet etmek için buradalar, tersi için değil."

 bpm_russia.8.t:0 "Hızlı Bir Modernizasyon"
 bpm_russia.8.d:0 "Sosyalistlerin başa geçmesiyle birlikte, [ROOT.GetCountry.GetName] adlı ülkenin yönetimini radikal bir şekilde modernize edecek ve daha önce gerçekleşemeyen siyasi irade geldi çattı."
 bpm_russia.8.f:0 "Çarların Rusya'nın o kadim, modası geçmiş hükümetini düzgün bir şekilde yeniden yapılandırmaktan aciz ya da belki de isteksiz olmasıyla, önceki rejimin fena halde ihmal ettiği şeyleri düzeltmek işçilerin omuzlarına kaldı."
 bpm_russia.8.a:0 "Siktirsin gitsin eskiler, yaşasın yeniler!"
 bpm_russia.8.b:0 "Obşçinaları taslak olarak kullanarak modernleşeceğiz ulan!"
 bpm_russia_evt_8_warning_old_admin:0 "#blue @information! Eğer Zemstvolar kurulmadıysa, yakın zamanda kaldırıldıysa veya Obşçinalar reformdan geçirilmediyse veya kaldırılmadıysa bu ceza artar; doğal olarak bu faktörlerin birleşimi çok daha ağır bir cezaya yol açar#!"

 bpm_russia.9.t:0 "İstikrarlı Bir Modernizasyon"
 bpm_russia.9.d:0 "Geçtiğimiz yıllarda yürürlüğe konan reformlar nihayet meyvesini verdi ve ülkenin dört bir yanında daha iyi, daha duyarlı bir yönetimi beraberinde getirdi."
 bpm_russia.9.f:0 "Rusya'nın dört bir yanından istikrarlı bir şekilde raporlar geliyordu. İyi raporlar; artan tarımsal verim, daha iyi vergilendirme ve daha güvenilir bilgi raporları. Rusya'yı yönlendirmek her zaman zor olacaktı ama artık devlet gemisi emirlere biraz daha tepki verir hale gelmişti."
 bpm_russia.9.a:0 "Mükemmel."