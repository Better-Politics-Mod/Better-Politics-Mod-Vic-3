# PATCON "SPLIT"
 je_bpm_split_patcons:0 "Paternalist Muhafazakarlığın Yükselişi"
 je_bpm_split_patcons_status:0 "Muhafazakarların Paternalizmi benimsemesini izleyin."
 je_bpm_split_patcons_reason:0 "Modern sorunlar modern çözümler gerektirir. Hızlı sanayileşme ve kentleşme verimliliği büyük ölçüde artırırken, işçi sınıfı harap kenar mahallelerde sefalet çekiyor. Eğer muhafazakarlarımız solcu radikallerin cazibesine karşı durmak istiyorsa, artık yoksulların içinde bulunduğu kötü duruma da hitap etmelidirler.\n\n#lore \"İşçiye sağlıklı olduğu sürece çalışma hakkı verin, hastalandığında ona bakım sağlayın; yaşlandığında geçimini güvence altına alın. ... Eğer Devlet işçiye biraz daha Hıristiyanca şefkat gösterirse, inanıyorum ki Sosyal Demokrat programın beyleri kuş çağrılarını boşuna yapacaklardır ve işçiler Hükümet ile yasama organlarının kendi refahlarıyla içtenlikle ilgilendiklerini görür görmez onlara akın etmeyi keseceklerdir.\"\n\n—Otto von Bismarck, 1884#!"

 je_bpm_split_patcons_special_tooltip:0 "İlerleme aşağıdakiler tarafından belirlenir:\n#variable [Country.MakeScope.Var('bpm_je_split_patcons_progress_from_base').GetValue|+=]#! temel değer\n#variable [Country.MakeScope.Var('bpm_je_split_patcons_progress_from_poverty').GetValue|+=]#! Beklenen Minimum Yaşam Standardının altında yaşayan nüfustan\n#variable [Country.MakeScope.Var('bpm_je_split_patcons_progress_from_loyalists').GetValue|+=]#! bütünleştirilmiş eyaletlerdeki sadıklardan\n#variable [Country.MakeScope.Var('bpm_je_split_patcons_progress_from_radicals').GetValue|+=]#! bütünleştirilmiş eyaletlerdeki radikallerden\n#variable [Country.MakeScope.Var('bpm_je_split_patcons_progress_from_conservative_status').GetValue|+=]#! #bold Muhafazakar#! [Concept('concept_interest_group', 'Çıkar Grubunun')] bastırılmasından\n#variable [Country.MakeScope.Var('bpm_je_split_patcons_progress_from_left_wing_power').GetValue|+=]#! önemli Sol kanat [Concept('concept_interest_group', 'Çıkar Grubundan')]\n#variable [Country.MakeScope.Var('bpm_je_split_patcons_progress_from_left_wing_government').GetValue|+=]#! hükümetteki radikal Sol kanat [Concept('concept_interest_group', 'Çıkar Gruplarından')]\n#variable [Country.MakeScope.Var('bpm_je_split_patcons_progress_from_communist_victory_coping').GetValue|+=]#! yürürlüğe giren Konsey Cumhuriyeti yasasından\n#variable [Country.MakeScope.Var('bpm_je_split_patcons_progress_from_corporatism').GetValue|+=]#! araştırılan #bold Korporatizmden#!\n#variable [Country.MakeScope.Var('bpm_je_split_patcons_progress_from_marlibs').GetValue|+=]#! var olan #bold Piyasa Liberali#! [Concept('concept_interest_group', 'Çıkar Grubundan')]"

