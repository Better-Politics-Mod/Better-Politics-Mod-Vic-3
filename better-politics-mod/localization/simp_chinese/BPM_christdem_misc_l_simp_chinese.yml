 bpm_christdem_split.50.t:0 "修订经济事务"
 bpm_christdem_split.50.d:0 "国家经济的近期变化、总体的生活水准以及内部张力，已开始影响@ig_christian_democrats! #blue 基督教民主主义者#!及其对国家干预、贸易和税收的看法，并促使他们内部展开辩论，朝着替代其现行经济立场的不同方向转变，同时也让先前沉默的声音得以发声。"
 bpm_christdem_split.50.f:0 ""
 bpm_christdem_split.51.t:0 "修订意识形态事务"
 bpm_christdem_split.51.d:0 "国家政治体制的近期变化、不断发展的现代主义思想以及内部张力，已开始影响@ig_christian_democrats! #blue 基督教民主主义者#!及其对政治体制与选举权、中央集权以及回应国家发展的看法，并促使他们内部展开辩论，朝着替代其现行经济立场的不同方向转变，同时也让先前沉默的声音得以发声。"
 bpm_christdem_split.51.f:0 ""
 bpm_christdem_split.4.t:0 "论国家权力与去中心化"
 bpm_christdem_split.4.desc:0 "国家的去中心化以及强化地方结构的愿望，对天主教徒而言始终至关重要。多数人认同国家去中心化的必要性，但程度各不相同。\n\n一个群体认为应当维持或推行一个高度联邦化、凝聚力强的国家，而另一个群体则致力于更深层的国家去中心化，指出国家的种种弱点与无能。"
 bpm_christdem_split.4.f:0 "国家，就其定义而言，连一间小小的修鞋铺都经营不好。\n\n——路易吉·斯图尔佐，1951年"
 bpm_christdem_split.4.a:0 "深度的去中心化十分必要，我们应当积极争取。"
 bpm_christdem_split.4.b:0 "去中心化固然重要，但国家的稳定更为重要。"
 bpm_christdem_split.4.c:0 "国家应当强大，并维持安宁的公共秩序。"
 bpm_christdem_split.5.t:0 "论经济与资本主义"
 bpm_christdem_split.5.desc:0 "自由资本主义、工业化，以及人类生活各个领域与层面的彻底变革，最初都遭到天主教活动家和平信徒的强烈敌视与抵制。然而随着时间推移，许多人接纳了它，只是接纳的方式各不相同。\n\n有人认为资本主义总体上是积极的，国家应当奉行财政保守主义；而另一些人则谋求通过逐步的民主化和缩小差距来限制资本主义，以利于国家和公民。还有一些人虽然沉默，却视资本主义为绝对之恶，谋求以高度民主化、中央计划的经济取而代之。"
 bpm_christdem_split.5.f:0 "贫富之间的巨大鸿沟必须弥合——若不能弥合，我们就要遭殃了！在上帝面前，爱的诫命甚至高于正义的诫命。\n\n——卡尔·弗赖赫尔·冯·福格尔桑"
 bpm_christdem_split.5.a:0 "资本与工人的和平合作必将结出丰硕果实。"
 bpm_christdem_split.5.b:0 "资本主义需要进一步的改革与变革。"
 bpm_christdem_split.5.c:0 "自由资本主义政策已被证明是致命的，必须予以摧毁。"
 bpm_christdem_split.5.d:0 "必须维护并积极扶持以农业为基础的经济。"
 bpm_christdem_split.3.t:0 "论平信徒运动与教会"
 bpm_christdem_split.3.d:0 "所有@ig_christian_democrats! 天主教徒都谋求在国家中赋予天主教道德以力量，并积极捍卫自身影响力免受现代世俗主义和政治自由主义的侵害。有些天主教徒希望教会与平信徒运动联手对抗现代主义威胁，而另一些人则谋求独立发展，甚至可能为争取民众而与教会相争。"
 bpm_christdem_split.3.f:0 "顺从上帝，胜过顺从人。\n\n——沃伊切赫·科尔凡蒂，1927年"
 bpm_christdem_split.3.a:0 "教会应当监督这一进程。"
 bpm_christdem_split.3.b:0 "教会只会成为我们的敌人，而非盟友。"
 bpm_christdem_split.6.t:0 "论宗教与道德"
 bpm_christdem_split.6.d1:0 "所有@ig_christian_democrats! 天主教徒都或多或少地虔诚，但他们终究是虔诚的。因此，维护人类整体的宗教与道德层面的必要性，始终且继续具有重要意义，许多信徒致力于维护法律与国家活动的宗教与道德品格，但并非所有人都认同这一理想的广度与强度。\n\n一些人谋求为法律与国家确立更坚实的宗教基础，另一些人则致力于对宗教道德主义作更深的节制，还有一些人谋求在政治生活中更广泛地限制宗教，甚至政教分离。"
 bpm_christdem_split.6.f:0 "顺从上帝，胜过顺从人。\n\n——沃伊切赫·科尔凡蒂，1927年"
 bpm_christdem_split.6.a:0 "天主教应当规范公共生活的方方面面。"
 bpm_christdem_split.6.b:0 "必须保障良心自由，公共行政必须保持专业。"
 bpm_christdem_split.6.c:0 "宗教道德固然重要，但我们的自由更为重要。"
 bpm_christdem_split.7.t:0 "论福利与慈善"
 bpm_christdem_split.7.d1:0 "许多@ig_christian_democrats! 天主教平信徒真诚地相信慈善，相信人类作为一个整体有必要让每个人都能获得一切生活必需品。\n\n有人认为仅凭公民社会与慈善就能惠及所有人，另一些人则相信应强力运用国家为所有人提供福利，还有一些人谋求折中之道，有限度地兼用两种理念。"
 bpm_christdem_split.7.f:0 "只知道施舍金钱的慈善，还算不上基督之爱。唯有当你同时献出你的时间、精力与才智，去帮助彻底终结这类弊端，并且绝不让藏于你基督教信仰宝库中的任何东西闲置不用、任其无力对抗那正以惊人方式吞噬我们社会活力的毒瘤时，你才算是无罪。\n\n——亚伯拉罕·凯珀，1891年"
 bpm_christdem_split.7.a:0 "一人通过慈善帮助另一人，是保障体面生活最公正的方式。"
 bpm_christdem_split.7.b:0 "慈善远远不够，国家必须为劳动者确保某些公共福利。"
 bpm_christdem_split.7.c:0 "私人之手未能保护劳动者，国家必须全权接管。"
 bpm_christdem_split.7.d:0 "宗教福利与慈善相结合，必将结出丰硕果实。"
 bpm_christdem_split.8.t:0 "论民族主义与边界"
 bpm_christdem_split.8.desc:0 "@ig_christian_democrats! 天主教平信徒长期以来对其文化有着强烈的归属感，但随着民族主义和现代人民观念的到来，他们认同这种文化的方式也发生了显著变化。过去，许多人只感到自己属于家庭和家园；如今，越来越多的人在村庄之外找到了自己的位置。\n\n民族主义使一些人爱上了自己的民族，并在他人身上找到了敌人，而另一些人则对整个人类产生了强烈的归属感，坚持将小群体联合为一个整体的追求。与此同时，也有人在两种极端观念之间找到了中庸之道。"
 bpm_christdem_split.8.f:0 "神职人员作为更广泛社会秩序的组成部分，自然应当把祖国的利益放在心上，但滑入任何一种民族主义或特殊主义，既非自然亦非基督教精神，因为那会丧失源自普世基督教道德的那种判断上的优越性。\n\n——路易吉·斯图尔佐，1929年"
 bpm_christdem_split.8.a:0 "一切边界，无论是国内的还是国际的，都必须削弱并最终废除。"
 bpm_christdem_split.8.b:0 "应当允许所有人寻求一个新的避风港。"
 bpm_christdem_split.8.d:0 "应当保护所有文化，但我们必须保持我们文化的首要地位。"
 bpm_christdem_split.8.e:0 "一切文化都会削弱我们的国家与认同，因此必须予以清除。"
 bpm_christdem_split.9.t:0 "论民主与选举权"
 bpm_christdem_split.9.desc:0 "自由民主，曾为大多数@ig_christian_democrats! 天主教徒所敌视，如今却已几乎为所有人广泛接受，渗透到人类生活的各个领域。许多天主教徒如今对民主的态度或积极或至少是肯定的，相信其在社会中的必要性，但每个人的愿景各不相同。\n\n有些人谋求限制其中明确的“议会-自由”部分，有些人谋求保留它但不违背神授主权的原则，而另一些人则相信需要引入民主与基督教的综合，并致力于扩展它。"
 bpm_christdem_split.9.f:0 "今天，你需要黄金，大量的黄金，才能享有发言权；而我们还不够富有。为穷人沉默吧。\n\n——费利西泰·德·拉梅内，1848年"
 bpm_christdem_split.9.a:0 "我们是民主派，是基督教民主主义者。"
 bpm_christdem_split.9.b:0 "在民主之中应保留神授主权。"
 bpm_christdem_split.9.c:0 "民主应当成为强有力统治的补充。"
 bpm_christdem_split.10.t:0 "论军事与国防"
 bpm_christdem_split.10.desc:0 "维护和平、保护自身的愿望，在天主教会信徒中历来普遍。加之民族主义和现代军国主义，促使@ig_christian_democrats! 天主教徒整体转向和平主义立场，并对过度膨胀的军队持敌视态度。\n\n第一个群体坚持需要一支强大而现代的军队，但仅用于防御，同时继续追求和平与相互合作；第二个群体则致力于全世界逐步、彻底的裁军与普遍和平。"
 bpm_christdem_split.10.f:0 "有信心的人能移山；有信心的人能使人皈依；有信心的人能赢得战斗。\n\n——路易吉·斯图尔佐，1922年"
 bpm_christdem_split.10.a:0 "我们需要非常规的国防手段。"
 bpm_christdem_split.10.b:0 "我们的军队应当强大而现代。"
 bpm_christdem_split.10.c:0 "我们必须追求全面而普遍的裁军。"
 bpm_christdem_split.11.t:0 "论妇女与选举权"
 bpm_christdem_split.11.desc:0 "对天主教平信徒而言，家庭极其重要，自其诞生之日起他们便致力于捍卫和支持家庭。\n\n随着女权主义的兴起，天主教徒对妇女的看法也发生了改变，绝大多数人希望确保妇女的选举权，其中仍有一些人更希望她们留在家中。\n\n然而，也有人宁愿妇女完全不参与政治。"
 bpm_christdem_split.11.f:0 ""
 bpm_christdem_split.11.a:0 "妇女应当能够投票，但她们真正的位置其实是在家中。"
 bpm_christdem_split.11.b:0 "妇女恰当的位置只在家中。"
 bpm_christdem_split.12.t:0 "基督教民主的兴起"
 bpm_christdem_split.12.desc:0 "随着《新事》与《论基督宗教的民主》两部通谕的问世，一种新的意识形态——@ig_christian_democrats! 基督教民主——开始向政治领域扩展。基督教民主主义者难以界定，因为各国之间差异极大，但绝大多数人支持选举权、法团主义和宗教道德，有时还以天主教社会训导为基础谋求改变世界。\n\n他们的出现或许会撼动历史，或许实际上也改变不了什么。"
 bpm_christdem_split.12.f:0 "中央党本质上是一个政治党，而非宗派党。它立足于德意志宪法，而宪法要求议员视自己为全体人民的代表。\n\n——中央党领导层，1909年"
 bpm_christdem_split.12.a:0 "所以他们终于决定了自己究竟是基督徒，还是民主派？"
 bpm_christdem_split.13.t:0 "余波"
 bpm_christdem_split.13.d:0 "基督教民主主义者出现在欧洲许多地方，导致了与其宿敌所预期相反的显著变化。在各国，他们全力投入政治机器，组建政党或接管了政党，削弱了昔日的精英。\n\n在有些地方，他们推动了重大改革的实施，如[GetLawType('law_universal_suffrage').GetName]、社会[GetLawGroup('lawgroup_welfare').GetName]、现代经济政策；而在另一些地方，他们谋求强化国家，围绕法团主义和教会训导来发展国家，遏制自由派与左翼的极端倾向。"
 bpm_christdem_split.13.f:0 "让我们首先学会在捍卫自己信仰的同时不仇视对手，学会欣赏那些与我们所想不同的人，认识到每个阵营中都有基督徒，而上帝无论过去还是现在都可以被侍奉！让我们少抱怨时代，多反省自己。让我们不要气馁，让我们变得更好。\n\n——弗雷德里克·奥扎纳姆"
 bpm_christdem_split.13.a:0 "非常古怪的一群人。"
 bpm_ig_all_alone_again:0 "孤军奋战"
