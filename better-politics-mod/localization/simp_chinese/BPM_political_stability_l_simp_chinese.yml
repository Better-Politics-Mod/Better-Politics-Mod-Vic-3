l_simp_chinese:
 concept_bpm_political_stability:0 "政治僵化度"
 concept_bpm_political_stability_desc:0 "$concept_bpm_political_stability$代表你国家中政治力量的活跃或停滞程度。它会影响[Concept('concept_bpm_institutional_ig', '建制派')]与[Concept('concept_bpm_ideological_ig', '意识形态型')][Concept('concept_interest_group', '利益集团')]的受欢迎程度：\n- $bpm_political_stability$越高，[Concept('concept_bpm_institutional_ig', '建制集团')]越受欢迎。\n- $bpm_political_stability$越低，[Concept('concept_bpm_ideological_ig', '意识形态集团')]越受欢迎。\n\n@warning! $bpm_political_stability$还会带来随等级变化的加成与惩罚：\n  高于#v 66%#!（[Concept('concept_bpm_politically_stagnant', '停滞')]）：\n    @arrow_down! 立法成功几率、速度\n  #v 33% - 66%#!（[Concept('concept_bpm_politically_dynamic', '活跃')]）：\n     无效果。\n  低于#v 33%#!（[Concept('concept_bpm_politically_unstable', '不稳')]）：\n    @arrow_up! 人群政治力量、生活水平下降产生的激进派；\n    @arrow_down! 建筑吞吐量、建造效率"
 bpm_political_stability_baseline_value_tt:0 "\n[GetPlayer.MakeScope.GetScriptValueDesc('bpm_political_stability_baseline_target')]$bpm_rigidity_baseline_value_add_modifier$$bpm_rigidity_baseline_value_mult_modifier$\n"
 bpm_rigidity_baseline_value_add_modifier:0 "[AddTextIf(Not(EqualTo_string('', Country.GetModifier.GetDescFor('country_rigidity_baseline_add'))), Concatenate('\n', Country.GetModifier.GetDescFor('country_rigidity_baseline_add')))]"
 bpm_rigidity_baseline_value_mult_modifier:0 "[AddTextIf(Not(EqualTo_string('', Country.GetModifier.GetDescFor('country_rigidity_baseline_mult'))), Concatenate('\n', Country.GetModifier.GetDescFor('country_rigidity_baseline_mult')))]"
 bpm_political_stability_rate_value_tt:0 "\n[GetPlayer.MakeScope.GetScriptValueDesc('bpm_political_stability_rate')]$bpm_rigidity_rate_value_add_modifier$$bpm_rigidity_rate_value_mult_modifier$"
 bpm_rigidity_rate_value_add_modifier:0 "[AddTextIf(Not(EqualTo_string('', Country.GetModifier.GetDescFor('country_rigidity_rate_add'))), Concatenate('\n', Country.GetModifier.GetDescFor('country_rigidity_rate_add')))]"
 bpm_rigidity_rate_value_mult_modifier:0 "[AddTextIf(Not(EqualTo_string('', Country.GetModifier.GetDescFor('country_rigidity_rate_mult'))), Concatenate('\n', Country.GetModifier.GetDescFor('country_rigidity_rate_mult')))]"
 concept_bpm_politically_unstable:0 "政治不稳"
 concept_bpm_politically_unstable_desc:0 "当一个国家的$concept_bpm_political_stability$降至33%以下时，就会变得政治不稳。不稳的影响最高可达：\n[GetStaticModifier('bpm_stability_unstable').GetDesc]"
 concept_bpm_politically_dynamic:0 "政治活跃"
 concept_bpm_politically_dynamic_desc:0 "政治活跃的国家不会受到任何特殊效果或修正；只要它们将$concept_bpm_political_stability$保持在33%到66%之间，就被视为活跃。这种状态通常比更极端的其他选择更为可取。"
 concept_bpm_politically_stagnant:0 "政治停滞"
 concept_bpm_politically_stagnant_desc:0 "当一个国家的$concept_bpm_political_stability$升至66%以上时，就会变得政治停滞。停滞的影响最高可达：\n[GetStaticModifier('bpm_stability_stagnant').GetDesc]"
 bpm_political_stability_tooltip:0 "#header $bpm_political_stability$#!: [GetPlayer.MakeScope.ScriptValue('bpm_political_stability')|v]\n$TOOLTIP_DELIMITER$\n正趋向目标#tooltippable;tooltip:[GetPlayer.GetTooltipTag],bpm_political_stability_baseline_tooltip [GetPlayer.MakeScope.ScriptValue('bpm_political_stability_baseline_target')|v]#!，原因：#indent_newline:4 $bpm_political_stability_baseline_value_tt$#!\n月变化率为#tooltippable;tooltip:[GetPlayer.GetTooltipTag],bpm_political_stability_rate_tooltip [GetPlayer.MakeScope.ScriptValue('bpm_political_stability_rate_signed')|+=]#!，原因：#indent_newline:4 $bpm_political_stability_rate_value_tt$#!\n\n基础$bpm_political_stability$会因压制性法律而提高，并因战争、革命运动、激进派、低$concept_legitimacy$等因素而降低。\n\n它会影响[Concept('concept_bpm_institutional_ig', '建制派')]与[Concept('concept_bpm_ideological_ig', '意识形态型')][Concept('concept_interest_group', '利益集团')]的受欢迎程度：\n- $bpm_political_stability$越高，[Concept('concept_bpm_institutional_ig', '建制集团')]越受欢迎。\n- $bpm_political_stability$越低，[Concept('concept_bpm_ideological_ig', '意识形态集团')]越受欢迎。\n\n@warning! $bpm_political_stability$还会带来随等级变化的加成与惩罚：\n  高于#v 66%#!（[Concept('concept_bpm_politically_stagnant', '停滞')]）：\n    @arrow_down! 立法成功几率、速度\n  #v 33% - 66%#!（[Concept('concept_bpm_politically_dynamic', '活跃')]）：\n    无效果。\n  低于#v 33%#!（[Concept('concept_bpm_politically_unstable', '不稳')]）：\n    @arrow_up! 人群政治力量、生活水平下降产生的激进派；\n    @arrow_down! 建筑吞吐量、建造效率"
