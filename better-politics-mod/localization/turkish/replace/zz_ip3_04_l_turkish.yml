hungry_forties.1.t: "Açlık Kırkları ([SCOPE.GetRootScope.GetCountry.GetCustom('getDecadeName')|U])"
hungry_forties.1.d: "[SCOPE.sState('relevant_state').GetName] içindeki bir mahsul hastalığı salgını Avrupa kıtasının büyük bölümüne yayılmaya başladı. Ufukta beliren başarısız bir hasatla birlikte kıtlık korkuları dolaşmaya başladı."
hungry_forties.1.f: "Doktor aletiyle patatesi dürttü ve meslektaşının da görebilmesi için yana doğru eğildi. Aletin küt ucu, patatesin etindeki rengi solmuş bir lekenin içine bir santimetre kadar gömülmüştü.\n\n"Korkarım bu bir yanıklık (çürüme) hastalığı. Tarladaki başka bir yumruyu inceleseydim de sonuç muhtemelen aynı olurdu. Mevcut durumda olağanüstü önlemler alınmasını tavsiye ederim.""
hungry_forties.1.a: "Felaket!"
hungry_forties.1.b: "Yabancı tahıl satın almak için fonlar oluşturun."

hungry_forties.2.t: "Daha Kolay Zamanlar"
hungry_forties.2.d: ""Açlık [SCOPE.GetRootScope.GetCountry.GetCustom('getDecadeName')]" boyunca Avrupa kıtasını kasıp kavuran mahsul hastalığı dalgaları yatıştı. Hastalıklı tarlalar, etkilenen patates türüne bir daha asla ev sahipliği yapamayacak olsa da, diğer ürünlerin tamamen iyileşmesi bekleniyor."
hungry_forties.2.f: ""Duydun mu? Yeni bir tür patates tohumu satıyorlarmış. Hastalıklı olmayanlardanmış, ya da öyle söylüyorlar."\n\nÇitin diğer tarafına yaslanmış olan adam tek kaşını kaldırdı, "Zamanı gelmişti bile. Hatta çok geç. Kışı atlatabilmek için çocuklarıma saman yedirmek zorunda kaldım."\n\n"Sen yine ucuz kurtulmuşsun. Yolun aşağısındaki aile çocuklarını kaybetti. Gerçekten de, lanet olası derecede geç kalındı.""
hungry_forties.2.a: "Tanrıya şükürler olsun."
hungry_forties.2.b: "Bittiğinden emin olabilir miyiz?"

