 ################## ORGANİK DEMOKRASİ
 
 law_organic_democracy: "Organik Demokrasi"
 law_organic_democracy_desc: "Aile, işyeri, belediye veya topluluk gibi çeşitli geleneksel 'organlar' kendi işlerini yönetir ve yasama meclislerine temsilciler seçerler. Hiçbir siyasi parti veya ideolojik örgüt bulunmaz."

 ideology_dop_organic_democrat: "Organik Demokrat"
 ideology_dop_organic_democrat_desc: "#lore Bu grup, tam dolaşım ve örgütlenme özgürlüğüne sahip, toplumsal parçalara dayanan organik, özyönetimli bir demokrasiye inanır.#!"


 ig_national_conservatives_catholic: "Ulusal Muhafazakarlar"
 ig_national_conservatives_catholic_desc: "Katolik Ulusal Muhafazakarlar çeşitli isimlere ve görüşlere sahip tutarsız bir gruptur, ancak genellikle kendilerini Katolik düşüncesinin sağ kanadında bulurlar. Liberal kurumların dağıtılıp yerine organik bir demokrasi ve devletin getirilmesini, ayrıca korporatizmi desteklerler. Tarihsel olarak bu çok geniş bir kavram olmuştur: Portekizli devlet-korporatisti Salazaristlerden, Fransız kralcı Action Française'e ve İtalyan proleter ANI'ye, oradan da Avusturyalı ütopik Soziale Romantiker'e ve Polonyalı dağıtımcı Młodzi Endecy'e kadar uzanır."

