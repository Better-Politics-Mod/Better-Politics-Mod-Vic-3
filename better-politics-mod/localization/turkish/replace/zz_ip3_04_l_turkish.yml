liberals_out_of_government_tt: "@warning! #b Karşı Devrim#! #r hızla ilerleyebilir#!. #tooltippable;tooltip:[GetPlayer.GetTooltipTag],red_summer_liberal_ideologies_list_tt Devrimci#! [Concept('concept_politician', '$concept_politicians$')] şu an [concept_in_government] (hükümette) #bold değil#!."

peoples_springtime.9.t: "[SCOPE.sCountry('relevant_country').GetAdjectiveNoFormatting] Devrimi"
peoples_springtime.9.d: "Avrupa'ya yayılan devrimci dalgadan ilham alan [SCOPE.sState('relevant_state').GetCityHubName] şehrindeki devrimciler, [SCOPE.sCharacter('ruler_scope').GetPrimaryRoleTitle]'a taleplerini iletmek için toplandılar. [GetLawType('law_universal_suffrage').GetName], demokratik bir anayasa ve [GetLawType('law_national_guard').GetName] kurulmasını talep ediyorlar."
peoples_springtime.9.f: "Kalabalık şimdi, sadece taş yüzlü askerlerden oluşan ince bir duvarın geride tuttuğu [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] konutuna doğru taşıyordu. Süngüler ve toplar dizisine doğru hakaretler ve sokak döküntüleri uçuşuyor, atların kuyruklarını kamçılatıyordu. Ticaret bölgelerinde, yürüyüşe katılmamayı seçen perakendeciler dükkanlarını tahtalarla kapatıyordu. Doğaçlama hatların daha da gerisinde, işçiler şehir kapılarını yıkmak için sokak lambalarını yerinden sökmüşlerdi. Kırık borular sokakların üzerine uğursuz bir loşluk saçıyordu."
peoples_springtime.9.a: "Bir iç savaşı göze alamayız."
peoples_springtime.9.b: "Oy hakkı konusunda uzlaşın, ancak bunun yapıldığından emin olun."
peoples_springtime.9.c: "Derhal Orduyu gönderin."

had_springtime_revolution_tt: "[ROOT.GetCountry.GetNameNoFlag], demokratik bir anayasa çıkarmaya zorlandı"

peoples_springtime.10.t: "Kızıl [SCOPE.GetRootScope.GetCountry.GetCustom('country_red_season_name_dynamic')]"
peoples_springtime.10.d: "Avrupa'daki devrimci dalga, [ROOT.GetCountry.GetName] ülkesinde liberal bir hükümeti iktidara taşıdı. Bu kırılgan liberal düzen, hem kazanımlarını geri almak isteyen muhafazakar güçler hem de yeni bir devrim tehdidinde bulunan radikaller tarafından tehdit ediliyor."
peoples_springtime.10.f:1 ""Başkentte, işsiz ve açlıktan ölmek üzere olan ancak zihinleri boş teoriler ve hayali umutlarla dolu yüz bin silahlı işçinin alaylar oluşturduğunu gördüm. Toplumun ikiye bölündüğünü gördüm: Hiçbir şeye sahip olmayanlar ortak bir açgözlülükte, bir şeylere sahip olanlar ise ortak bir dehşette birleşmişti. Bu iki büyük kesim arasında ne bir bağ ne de bir sempati vardı; her yerde kaçınılmaz ve yakın bir mücadelenin fikri eli kulağında görünüyordu."\n\n—Alexis de Tocqueville, #italic Alexis de Tocqueville'in Anıları#!"
peoples_springtime.10.a: "Çok yaşa Anayasa!"
peoples_springtime.10.b: "Bu saçmalık sona ermeli."
