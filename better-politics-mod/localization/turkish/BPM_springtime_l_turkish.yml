 notification_bpm_1848_danubia_tooltip: "$notification_bpm_1848_danubia_name$"

 notification_bpm_1848_hungarian_revolution_name: "#v Peşte'de Devrim!#!"
 notification_bpm_1848_hungarian_revolution_desc: "Macar başkentindeki liberaller yeni bir hükümet ilan etti. Avusturya birlikleri düzeni sağlamak için yürüyüşe geçti."
 notification_bpm_1848_hungarian_revolution_tooltip: "$notification_bpm_1848_hungarian_revolution_name$"

 notification_bpm_1848_baden_name: "#v [SCOPE.sC('baden_revolter').GetName] Şehrinde Halk Devrimi!#!"
 notification_bpm_1848_baden_desc: "[SCOPE.sC('baden_revolter').GetName] şehrindeki demokratik ajitatörler, Alman özgürlüğünü daha da ileriye taşımak için bir devrime öncülük ettiler!"
