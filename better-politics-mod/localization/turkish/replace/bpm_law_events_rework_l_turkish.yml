l_turkish:
 
 children_rights_events.1.t:0 "Görünmez Çığlık"
 children_rights_events.1.d:0 "$bpm_legislature_name$ içindeki diğer üyeleri ikna etmek amacıyla [SCOPE.sCharacter('children_wrongs_ig_leader_scope').GetFullName], [SCOPE.sState('child_labor_state').GetName] içindeki çocukların çalışma koşullarını araştırdı. Orada, çocukların işyerlerinde karşılaştığı insanlık dışı koşullar nedeniyle, [SCOPE.sState('child_labor_state').GetName] bölgesindeki birçok ailenin çalışmaya gönderilmesinler diye çocuklarını saklamayı seçtiklerini öğrendi."
 children_rights_events.1.f:0 ""Annemiz bize sessiz kalmamızı söyledi beyim, biz de öyle yaptık. Kardeşim ve ben orada mezar gibi sessizce durduk, anlarsınız ya, nefesimi tutabildiğim kadar tuttum ama çok karanlıktı, bu yüzden haydutların çoktan gittiğini düşündüm. Bizi burada bulamazlardı, anlarsınız ya, annem öyle demişti ama çok karanlıktı beyim ve çok soğuktu.""
 children_rights_events.1.a:0 "Bu bilgi, $bpm_legislature_name$ içindeki bazı fikirleri değiştirecek"
 children_rights_events.1.b:0 "Eğer [SCOPE.sCharacter('children_wrongs_ig_leader_scope').GetFullName] olmasaydı bu hikaye asla ortaya çıkmazdı!"
 hidden_children_modifier:0 "Saklanan Çocuklar"
 bpm_brought_hidden_children_modifier:0 "Saklanan Çocuklara Dikkat Çekti"
 
 children_rights_events.2.t:0 "Acı Bir Gerçek"
 children_rights_events.2.d:0 "Yasanın ateşli karşıtları olan [SCOPE.gsInterestGroup('children_wrongs_yes').GetName], [SCOPE.sState('child_labor_state').GetName] içindeki işçilerin aldığı düşük ücretler nedeniyle ay sonunu getirebilmek için çocuklarını çalıştırmak zorunda kaldıklarına dikkat çektiler; eğer çocuk işçiliği kısıtlanırsa, bu aileler büyük acılar çekecektir. İşçileri temsil eden ama yine de yasayı destekleyen [SCOPE.gsInterestGroup('trade_unions_scope').GetName] ise oldukça zor bir durumda."
 children_rights_events.2.f:1 ""Bu bir delilik! Kendi çocuklarını çalışmaya zorlayan bu insanlara nasıl yardım edebiliriz ki?! Bir şeyler yapmalıyız! Bu barbarca karara derhal bir son verin!"\n\n"Pekala, eğer başka seçenekleri olsaydı kendi çocukları için bunu istemeyecekleri oldukça açık, değil mi? Bu zavallı insanları hayatta kalma kararları üzerinden yargılamak onlara da yardımcı olmayacaktır.""
 children_rights_events.2.a:0 "Ne olursa olsun, bunu durdurmalıyız."
 children_rights_events.2.b:0 "Hayatta kalmak için ne gerekiyorsa onu yapıyorlar."
 stopped_families_modifier:0 "Çocuk İşçiliği Tartışması"
 allowed_families_send_their_children_modifier:0 "Çocuk İşçiliği Tavizleri"
 didnt_allow_families_send_their_children_modifier:0 "Çocuk İşçiliği Tavizi Yok"
 
 children_rights_events.3.t:0 "Kaçınılmaz Yaralanmalar"
 children_rights_events.3.d:0 "Hükümetin [SCOPE.sLaw('current_law_scope').GetName] için baskı yapmasıyla birlikte, yetişkin erkekler çocukların geride bırakacağı boşluğu doldurmaya zorlandı. Ancak vücutları çok büyük ve parmakları çok geniş olduğu için endüstriyel kazalar giderek artıyor."
 children_rights_events.3.f:0 ""Çığlıkları fabrikayı doldurdu, kanları sanki kendi kalpleri varmış gibi makineleri kapladı. Bir adamın eskiden sadece bir çocuğun ince elleriyle kullandığı küçücük bir makineyi çalıştırmaya çalışırken parmağını kesmesi bu hafta onuncu kez oluyor. Protestolar artıyor: "Onlar değilse, o zaman biziz."""
 children_rights_events.3.a:0 "Kimse bu tür bir iş yapmamalı."
 children_rights_events.3.b:0 "Çocuklar geri dönmüyor, bu yüzden alışsalar iyi olur."
  children_rights_event.3.c:0 "Daha fazla yaralanma yaşanmaması için yeni düzenlemeler ekleyin."
