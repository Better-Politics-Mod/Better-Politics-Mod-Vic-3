 council_republic_law_events.2.d:0 "Bir grup işçinin patronlarına karşı ayaklanıp [ROOT.GetCountry.GetCapital.GetCityHubName] içindeki bir fabrikanın kontrolünü ele geçirdiği söyleniyor. Ülkenin dört bir yanındaki işçiler heyecanlı ve onların örneğini takip ediyor."
 council_republic_law_events.2.f:0 ""Bir gün geldiler ve patronu kıçından tutup dışarı attılar, sonra da normal şekilde çalışmaya başladılar. Polis müdahale etmeye çalıştı, ama siz bir de ellerinde aletlerle bekleyen yüzlerce öfkeli fabrika işçisine ne yapacaklarını söylemeyi deneyin.""
