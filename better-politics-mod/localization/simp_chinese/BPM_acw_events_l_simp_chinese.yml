l_simp_chinese:
 bpm_acw_events.999.t:0 "占位事件"
 bpm_acw_events.999.d:0 "你到底是怎么找到这个的。"
 bpm_acw_events.999.f:0 ""等等，你是谁？"\n\n—佚名"
 bpm_acw_events.999.a:0 "谁会以联邦军（CSA）的身份和美国打合作战役？"
 bpm_acw_events.1.t:0 "崩溃点"
 bpm_acw_events.1.d:0 "为了通过法律手段遏制约翰·布朗游击队造成的损害，首席大法官罗杰·B·坦尼决定加速审理莱蒙诉纽约州案。在一项7比2的裁决中，法院裁定各州无权废除奴隶制，并以财产权和州际贸易的论据支撑这一裁决。北方各州的反应极为激烈，宾夕法尼亚州和俄亥俄州的州长公开承诺：若总统试图执行这项裁决，他们将武装布朗的游击队。最高法院的这一失策，已注定我们国家将陷入数年的血腥内战。"
 bpm_acw_events.1.f:0 ""如今……宪法中已明确而清晰地确认了对奴隶的财产权。……基于这些考量，法院认为，国会禁止公民在美国境内该线以北地区持有和拥有此类财产的法令，并不为宪法所支持，因此归于无效……"\n\n—罗杰·B·坦尼，1857年"
 bpm_acw_events.1.a:0 "分裂之家不能久存。为了联邦！"
 bpm_acw_events.1.b:0 "正如他献身使人成圣，让我们奋起使人自由！"
 bpm_acw_events.2.t:0 "崩溃点"
 bpm_acw_events.2.d:0 "针对近期的选举，深南部的许多州纷纷召开大会，讨论脱离联邦的问题。为应对这些事态，一位来自边境州的参议员承诺提出一项妥协方案，以一纸不可更改的修正案将奴隶制永久写入宪法。这一提议既遭到新总统的拒绝，也遭到分离主义者的拒绝。最高行政长官指出，宪法中并无"不可更改修正案"的条款；而分离主义者则要求对南扩奴隶制做出根本性的政策保证。各州已经开始袭击联邦军火库以夺取武器。"
 bpm_acw_events.2.f:0 ""我们的新政府恰恰建立在相反的理念之上；它的根基，它的基石，正是这一伟大真理：黑人并不与白人平等；服从于优等种族的奴隶制，正是他天然且正常的状态。"\n\n—亚历山大·H·斯蒂芬斯，1861年"
 bpm_acw_events.2.a:0 "分裂之家不能久存。为了联邦！"
 bpm_acw_events.2.b:0 "我宁愿把我们的事业称为州权事业。"
 bpm_acw_events.3.t:0 "解除钳制"
 bpm_acw_events.3.d:0 "随着奴隶制问题引发的紧张局势沸腾，@ig_radicals! 良心辉格党人终于集结了北方辉格党人和民主党人足够的票数，推翻了禁言规则。如今奴隶制再度在国会殿堂中被辩论，两党脆弱的联盟内部的裂痕愈发明显。"
 bpm_acw_events.3.f:0 ""我到底是被禁言了，还是没有？"\n\n—约翰·昆西·亚当斯，1836年"
 bpm_acw_events.3.a:0 "但这一切真的能改变什么吗？"
 bpm_acw_events.4.t:0 "辉格党瓦解"
 bpm_acw_events.4.d:0 "随着奴隶制成为美国政治中无所不包的核心议题，似乎没有哪个主要政党能承受住这种压力。杰克逊派自由主义者已抛弃民主党，加入旧日的良心辉格党人，共同组成一个崭新的北方共和党。与此同时，棉花辉格党人被抛下，一些人加入民主党，另一些人则试图组建宪政联盟党。第二政党体制就此终结。"
 bpm_acw_events.4.f:0 ""先生们，我们的宗旨，共和党的使命及其组织的基础，就是抵制这种地方性利益的政策……我们的宗旨和政策，就是抵制这些新的宪法教条——它们宣称奴隶制依宪法而存在，无论联邦旗帜飘扬于何处。"\n\n—大卫·威尔莫特，1860年"
 bpm_acw_events.4.a:0 "这意味着未来的政治只会更加分裂……"
 bpm_acw_events.5.t:0 "海盗窃国战争"
 bpm_acw_events.5.d:0 "自美国独立以来，我们国民中总有一些人想以不太合法的手段传播自由之光。如今一批新的"海盗窃国者"登上了舞台中央，对洪都拉斯、尼加拉瓜和哥斯达黎加的入侵相继展开。这些人计划将美国文明和奴隶制扩展至他们的征服地，最终目标是将这些国家并入我们的联邦，以确保蓄奴州的优势地位。我们是援助这些勇敢的战士、却冒着得罪在中美洲有利益的欧洲列强的风险？还是在这些流浪汉引发国际事件之前加以阻止？抑或采取观望态度？"
 bpm_acw_events.5.f:0 ""美国文明的敌人——因为奴隶制的敌人正是如此——似乎比其朋友更加警觉。"\n\n—威廉·沃克，1860年"
 bpm_acw_events.5.a:0 "我们必须阻止这些公然扩张奴隶制的行径！"
 bpm_acw_events.5.b:0 "不要阻止这些恶棍，但也不要帮助他们。这样我们就能坐收其利而不担风险。"
 bpm_acw_events.5.c:0 "若无法直接扩张这"特殊制度"，也许我们可以利用这些雇佣兵……"
 bpm_acw_events.6.t:0 "重审威尔莫特附文"
 bpm_acw_events.6.d:0 "在一起进行中的案件中，最高法院首席大法官罗杰·B·坦尼质疑了威尔莫特附文的合法性。他认为该附文，以及先于它的密苏里妥协，都是违宪的，并正试图说服同僚大法官予以推翻。无论最终裁决如何，这场冲突已重新点燃了围绕墨西哥领土的紧张局势。法院将如何裁决？"
 bpm_acw_events.6.f:0 ""兹规定：作为美国从墨西哥共和国取得任何领土的明示且根本的条件——无论是依据双方可能谈判达成的任何条约，还是为行政机构使用本法所拨款项——除因犯罪且当事人已被依法定罪的惩罚情形外，奴隶制与强迫劳役均不得在该领土任何部分存在。"\n\n—威尔莫特附文，1846年"
 bpm_acw_events.6.a:0 "在一项7比2的裁决中，威尔莫特附文被推翻。"
 bpm_acw_events.6.b:0 "在一项5比4的裁决中，威尔莫特附文得以再存续一天。"
 bpm_acw_events.7.t:0 "逃奴法被宣布无效"
 bpm_acw_events.7.d:0 "威斯康星州最高法院宣布，大妥协中的逃奴法条款违宪。这一裁决公然藐视最高法院的最高权威，并有助长北方各州立法机构对抗试图追捕逃奴的美国联邦执法官之势。最高法院认识到此案不可放任不管，但又拿不准是否应加速审理如此棘手的事项。法院将如何裁决？"
 bpm_acw_events.7.f:0 ""本宪法，以及依此制定的合众国法律，以及依据合众国权力已缔结或将要缔结的一切条约，均为全国的最高法律；各州法官均应受其约束，即使任何州的宪法或法律有任何相反的规定，也不例外。"\n\n—罗杰·B·坦尼，1858年"
 bpm_acw_events.7.a:0 "法院加速审理此案，一致裁决激怒了北方人。"
 bpm_acw_events.7.b:0 "法院照章办事，令南方人大为光火。"
 bpm_acw_events.8.t:0 "流血的[SCOPE.sState('bpm_bleeding_kansas').GetName]"
 bpm_acw_events.8.d:0 "废奴主义者与蓄奴制拥护者纷纷涌入[SCOPE.sState('bpm_bleeding_kansas').GetName]，希望按自己的意愿塑造该准州的政府。准军事团体已开始彼此及针对平民实施暴力。"
 bpm_acw_events.8.f:0 ""在上帝面前，在这些见证人面前，从此刻起，我毕生献身于摧毁奴隶制。"\n\n—约翰·布朗，1837年"
 bpm_acw_events.8.a:0 "丛林游击队员不能左右法律！[SCOPE.sState('bpm_bleeding_kansas').GetName]必须成为自由州。"
 bpm_acw_events.8.b:0 "我们不能在此事上选边站，那将意味着内战。尽量拖延[SCOPE.sState('bpm_bleeding_kansas').GetName]的加入。"
 bpm_acw_events.8.c:0 "劫掠者不能决定什么是对的！[SCOPE.sState('bpm_bleeding_kansas').GetName]将成为蓄奴州。"
 bpm_acw_events.9.t:0 "德雷德·斯科特诉桑福德案"
 bpm_acw_events.9.d:0 "德雷德·斯科特是一名奴隶，他的主人将他带入自由州伊利诺伊和自由准州威斯康星。在被带回蓄奴州密苏里之后，斯科特起诉争取自由，声称自己既然曾被带入自由州和自由准州，便已自动获得自由，法律上不再是奴隶。此案现已上诉至最高法院，首席大法官罗杰·B·坦尼正筹划撰写未来史学家称之为司法史上最糟糕的裁决。然而，其余6名立场一致的大法官对如此激进地打击废奴之举心存犹豫，唯恐引发地方性危机。在这一脆弱的司法局势中，总统将如何干预？"
 bpm_acw_events.9.f:0 ""白人本无义务尊重黑人的任何权利"\n\n—罗杰·B·坦尼，1857年"
 bpm_acw_events.9.a:0 "总统施压大法官们支持坦尼，坦尼随即证明了州权论的虚伪。7比2，这个有罪国家的罪孽被墨迹写就，只待鲜血洗去。"
 bpm_acw_events.9.b:0 "总统施压坦尼与其同僚合作，斯科特被承认为公民但未获自由。南方对后者置之不理、对前者大做文章，开始怒火中烧。"
 bpm_acw_events.10.t:0 "约翰·布朗袭击"
 bpm_acw_events.10.d1:0 ""废奴海盗"约翰·布朗在哈珀斯费里发动了一场奴隶起义。在成功孤立该镇并夺取军火库后，布朗借助哈丽雅特·塔布曼的网络，动员了500多名奴隶，逃入阿巴拉契亚山脉。布朗如今袭扰着山脉沿线每一个蓄奴州，利用地下铁路将无力作战者秘密护送至安全处，同时武装并训练有能力作战者去解放更多兄弟姐妹。南方正要求宾夕法尼亚和俄亥俄州打击其境内的布朗补给网络，但当地政府坚决拒绝。"
 bpm_acw_events.10.d2:0 ""废奴海盗"约翰·布朗在哈珀斯费里发动了一场未遂的奴隶起义。一连串的偶然失误导致计划失败，约翰·布朗被捕并被绞死。然而，北方报纸迅速将布朗的形象塑造成一名殉道者，为下一场斗争动员废奴主义者。南方如今惊恐地担忧着：当又一个约翰·布朗挥师南下，或者更糟——当一位反奴隶制的总统动用军队实施类似的计划时，将会发生什么。"
 bpm_acw_events.10.f:0 ""约翰·布朗的遗体躺在坟墓里腐烂，但他的灵魂仍在前进……"\n\n—《约翰·布朗之躯》，1861年"
 bpm_acw_events.10.a:0 "战争的号角已经开始吹响……"
 bpm_acw_events.11.t:0 "西部也蓄奴？"
 bpm_acw_events.11.d:0 "随着我们意图夺取北墨西哥的意图如今已昭然若揭，废奴主义者和蓄奴派开始就如何处理任何新获领土上的奴隶制展开辩论。大卫·威尔莫特提出一项附文，禁止奴隶制向准州扩张；而斯蒂芬·A·道格拉斯与亨利·克莱则主张一项新妥协，以人民主权的新理论解决密苏里妥协遗留的问题。国会将如何决断？"
 bpm_acw_events.11.f:0 ""我否认国会有权把一个蓄奴州强加给不愿接受它的人民。我否认他们有权把一个自由州强加给不愿接受它的人民。我否认他们有权把一件好事强加给不愿接受它的人民。伟大的原则是：每个社群都有权自行判断和决定一件事是对是错、采纳它对他们是好是坏；而自由行动的权利、自由思想的权利、对这一问题自由判断的权利，对每一个真正的美国人而言，比自由政府之下的任何其他权利都更加珍贵。"\n\n—斯蒂芬·A·道格拉斯，1858年"
 bpm_acw_events.11.a:0 "人民主权论赢得辩论。"
 bpm_acw_events.11.b:0 "威尔莫特附文获胜。"
 bpm_acw_events.12.t:0 "西北法令的扩展"
 bpm_acw_events.12.d:0 "随着我们意图夺取加拿大的意图如今已昭然若揭，必须就如何组织这些新领土作出决定。国会已同意暂时恢复西北法令，将其宗教平等和免于奴隶制的保证适用于任何新获领土。这引起了南方极大的不满，他们担心自己刚刚失去了维持自由州与蓄奴州平衡的任何机会。"
 bpm_acw_events.12.f:0 ""该领土内既不得有奴隶制，也不得有强迫劳役，但作为对当事人已被依法定罪的犯罪的惩罚者除外"\n\n—西北法令，1787年"
 bpm_acw_events.12.a:0 "魁北克人可能是天主教徒，但他们将是美利坚的天主教徒。"
 bpm_acw_events.13.t:0 "扩张门罗主义"
 bpm_acw_events.13.d:0 "门罗主义在最初起草时，声称不适用于任何现存的欧洲殖民地。然而，随着我们意图夺取古巴和加勒比的意图如今已昭然若揭，我们需要为我们的新政策寻找依据。这通过扩张门罗主义、删除现存殖民地条款来完成。这一决定在北方引起公愤，他们担心南方人建立甘蔗帝国将使蓄奴势力得以巩固其对联邦政府的统治。"
 bpm_acw_events.13.f:0 ""对于任何欧洲强国的现存殖民地或属地，我们过去未加干涉，今后也不会干涉"\n\n—门罗主义，1823年"
 bpm_acw_events.13.a:0 "古巴人可能是天主教徒，但他们将是美利坚的天主教徒。"
 bpm_acw_events.14.t:0 "美国体系得到认可"
 bpm_acw_events.14.d:0 "经过一番努力，亨利·克莱成功地使南方拒绝执行派与其美国体系和解。在即将到来的选举中，南方将成为辉格党的堡垒。"
 bpm_acw_events.14.f:0 ""我希望有朝一日能说：美国是美国最好的主顾。"\n\n—亨利·克莱，年份不详"
 bpm_acw_events.14.a:0 "谢天谢地！"
 bpm_acw_events.15.t:0 "可憎之物的终结"
 bpm_acw_events.15.d:0 "经过巨大的反对声浪，民主党人成功地安抚了南方拒绝执行派。在即将到来的选举中，南方将成为民主党的堡垒。"
 bpm_acw_events.15.f:0 ""我是种植园主——一个棉花种植园主。我是南方人，也是奴隶主——我相信自己是一个和善而仁慈的奴隶主——并且绝不因身为奴隶主而更糟。"\n\n—约翰·C·卡尔霍恩，1847年"
 bpm_acw_events.15.a:0 "谢天谢地！"
 bpm_acw_events.16.t:0 "禁言规则固化"
 bpm_acw_events.16.d:0 "尽管两党都尽了最大努力，拒绝执行派仍未及时得到满足。禁言规则如今在国会各层级中被固定下来，要消除这一损害尚需时日。"
 bpm_acw_events.16.f:0 ""我到底是被禁言了，还是没有？"\n\n—约翰·昆西·亚当斯，1836年"
 bpm_acw_events.16.a:0 "哦，天哪！"
 bpm_acw_events.17.t:0 "独立堡战役"
 bpm_acw_events.17.d:0 "经过数周的对峙，州际战争的第一枪已经打响。为确保对波士顿港的控制，自由州联盟（FSA）炮轰了独立堡。"
 bpm_acw_events.17.f:0 ""上帝保佑我们。""
 bpm_acw_events.17.a:0 "于是便开始了。"
 bpm_acw_events.18.t:0 "萨姆特堡战役"
 bpm_acw_events.18.d:0 "经过数周的对峙，州际战争的第一枪已经打响。为确保对查尔斯顿港的控制，邦联军炮轰了萨姆特堡。"
 bpm_acw_events.18.f:0 ""上帝保佑我们。""
 bpm_acw_events.18.a:0 "于是便开始了。"
 bpm_acw_events.19.t:0 "独立堡战役"
 bpm_acw_events.19.d:0 "经过数周的对峙，州际战争的第一枪已经打响。为确保对波士顿港的控制，自由州联盟（FSA）炮轰了独立堡。"
 bpm_acw_events.19.f:0 ""上帝保佑我们。""
 bpm_acw_events.19.a:0 "于是便开始了。"
 bpm_acw_events.20.t:0 "萨姆特堡战役"
 bpm_acw_events.20.d:0 "经过数周的对峙，州际战争的第一枪已经打响。为确保对查尔斯顿港的控制，邦联军炮轰了萨姆特堡。"
 bpm_acw_events.20.f:0 ""上帝保佑我们。""
 bpm_acw_events.20.a:0 "于是便开始了。"
 bpm_acw_events.21.t:0 "离开特区"
 bpm_acw_events.21.d:0 "经过一番辩论，国会决定废除《宅邸法》，将我国首都迁出哥伦比亚特区。官僚们已经纷纷敲响警钟，指出这一决定何等愚蠢；而我们首都的新宿主州则对其新机遇垂涎三尺。"
 bpm_acw_events.21.f:0 ""对所有人公正"\n\n—华盛顿特区格言"
 bpm_acw_events.21.a:0 "我们行为的后果"
 bpm_acw_events.22.t:0 "获得承认！"
 bpm_acw_events.22.d:0 "经过两年的战争，我们的外交试探终于得到了回应！战前的美国与欧洲列强在中美洲市场上的竞争，为我们争取承认提供了机会。甚至连联邦的旧世界盟友也已与我们建立关系！"
 bpm_acw_events.22.f:0 ""北方若胜，我会很高兴。但南方若胜，我会欣喜若狂。"\n\n—拿破仑三世，年份不详"
 bpm_acw_events.22.a:0 "我们将获得自由！"
 bpm_acw_events.23.t:0 "谷仓纵火派宣言"
 bpm_acw_events.23.d:0 "随着我们国家地方性紧张局势的加剧，民主党内部的紧张也在酝酿。忠于马丁·范布伦奥尔巴尼摄政集团的政治家们支持了一份文件，声明开国元勋们希望终结奴隶制、且国会有权管制奴隶制。\n\n这样一份得到民主党创始骨干支持的文件，分裂了杰克逊的民粹主义运动。新生的"谷仓纵火派"民主党人已开始与自由党接洽，以组建自由土地党。"
 bpm_acw_events.23.f:0 ""至于总统职位，我一生中最快乐的两天，是我就职的那天和卸任的那天。"\n\n—马丁·范布伦，年份不详"
 bpm_acw_events.23.a:0 "小魔术师施展了他最后的咒语……"
 bpm_acw_events.24.t:0 "新一届政府"
 bpm_acw_events.24.d:0 "选举箱前的每一次失败，都意味着败选一方更加激进。这一点在约翰·C·布雷肯里奇败给亚伯拉罕·林肯一事上表现得最为极端，它使许多南方州得出结论：选举政治已不再是可行的选项。"
 bpm_acw_events.24.f:0 ""遵照与政府本身一样古老的传统，我在你们面前现身，作简短致辞，并在你们面前宣誓就职——即美国总统在开始履行其职务前依合众国宪法必须宣读的誓词。"\n\n—亚伯拉罕·林肯，1861年"
 bpm_acw_events.24.a:0 "离内战又近了一步……"
 bpm_acw_events.25.t1:0 "总统之死"
 bpm_acw_events.25.t2:0 "紧张的权力移交"
 bpm_acw_events.25.d1:0 "如果说总统选举在激进化，那么早期的副总统继任则更甚。若副总统与已故总统在地区上对立，党内就会发生反叛。若副总统延续其前任的政策，他们就会预料到自己会被指控为非法。"
 bpm_acw_events.25.d2:0 "只要奴隶制仍是国法，美国的选举就永远是导火索。在1860年的选举中，无论谁胜出，都几乎无法避免地方性危机。"
 bpm_acw_events.25.f:0 ""我从来不是叛徒。"\n\n—约翰·泰勒，年份不详"
 bpm_acw_events.25.a:0 "离内战又近了两步……"
 bpm_acw_events.26.t:0 "一州之诞生"
 bpm_acw_events.26.d:0 "每当有新州加入联邦，参议院就会剧烈地倒向新的方向。历史上，美国通过先让新州以自由州和蓄奴州成对进入的方式处理这一问题。如今[SCOPE.sState('bpm_new_state').GetName]已作为正式州加入我们的联邦，他们的命运应当如何？"
 bpm_acw_events.26.f:0 ""分裂之家不能久存。"\n\n—亚伯拉罕·林肯，1858年"
 bpm_acw_events.26.a:0 "欢迎一个新的蓄奴州加入联邦。"
 bpm_acw_events.26.b:0 "欢迎一个新的自由州加入联邦。"
 bpm_acw_events.27.t:0 "越过卢比孔河"
 bpm_acw_events.27.d:0 "我们曾相信可以通过立法手段清除奴隶制、避免流血。这种团结的梦想不过是天真心灵的幻影。南方各州政府因国会立法废除奴隶制而震怒，已经拿起武器，要建立一个不被自由的谎言所玷污的新国家。"
 bpm_acw_events.27.f:0 ""这片有罪土地的罪孽，除非用鲜血，否则永难洗清。"\n\n—约翰·布朗，1859年"
 bpm_acw_events.28.t:0 "越过卢比孔河"
 bpm_acw_events.28.d:0 "我们曾相信可以让奴隶制的时钟倒转、回归旧路。这种反动的梦想不过是一场海市蜃楼。北方各州政府因国会扩张奴隶制而震怒，已经拿起武器，要建立一个不被奴隶制的罪孽所玷污的新国家。"
 bpm_acw_events.28.f:0 ""这片有罪土地的罪孽，除非用鲜血，否则永难洗清。"\n\n—约翰·布朗，1859年"
 bpm_acw_events.29.t:0 "第二政党体制"
 bpm_acw_events.29.d:0 "杰克逊是第二政党体制及其大众参与政治之父。随着第二政党体制的兴起，反共济会党、自由党、美国党和自由土地党等第三党也相继崛起。\n\n尽管这些政党在政治对话中颇有影响，却从未获得足够选票赢得任何一个州。这就是简单多数制的偏见。"
 bpm_acw_events.29.f:0 ""这场竞争正在变成——已经变成——一场不仅关乎黑人自由，也关乎白人自由的竞争。"\n\n—詹姆斯·G·伯尼，年份不详"
 bpm_acw_events.29.a:0 "华盛顿的天真继续困扰着我们。"
 bpm_acw_events.30.t:0 "第二政党体制"
 bpm_acw_events.30.d:0 "杰克逊是第二政党体制及其大众参与政治之父。随着第二政党体制的兴起，反共济会党、自由党、美国党和自由土地党等第三党也相继崛起。\n\n尽管这些政党在政治对话中颇有影响，却从未获得足够选票赢得任何一个州。这就是简单多数制的偏见。"
 bpm_acw_events.30.f:0 ""这场竞争正在变成——已经变成——一场不仅关乎黑人自由，也关乎白人自由的竞争。"\n\n—詹姆斯·G·伯尼，年份不详"
 bpm_acw_events.30.a:0 "华盛顿的天真继续困扰着我们。"
 bpm_acw_states_rights.1.tt:0 "#GB 南方#! 激进度将增加1"
 bpm_acw_states_rights.3.tt:0 "#GB 南方#! 激进度将增加3"
