l_turkish:
 bpm_union_leadership.1.t:0 "Emeğin Boyunduruk Altına Alınması"
 bpm_union_leadership.1.desc:0 "Sosyalizm Hayaletinin güzel ulusumuza musallat olmasıyla birlikte, hükümetimizin bir tür işçi örgütlenmesinin kaçınılmaz olduğunu kabul etmekten başka çaresi kalmadı. Ancak bu, hükümetin boyun eğdiği anlamına gelmiyor. Aksine, hükümet, işverenlerin ve çalışanların ulusumuzun iyiliği için işbirliği yapabilmesini sağlamak amacıyla sendika fikrini yeni bir departman altında konsolide etti."
 bpm_union_leadership.1.f:0 "Marksist öğretinin etkisi altındaki sendikalar toplumsal barış istemiyorlardı. İşçilerin artan hoşnutsuzluğuyla siyasi güç elde etme şanslarının artacağını hesaplıyorlardı. Hitler Hükümeti'nin karşı karşıya kaldığı ilk gerekliliklerden biri, işverenler ve çalışanlar arasındaki düşmanlığı canlı tutan örgütleri dağıtmaktı. Bunların yerini Emek Cephesi aldı.\n\n—Robert Ley, 1936"
 bpm_union_leadership.1.a:0 "Böylesi bizim için daha iyi."

 bpm_union_leadership.2.t:0 "Emeğin Kurtuluşu"
 bpm_union_leadership.2.desc:0 "Ulusumuzun alt sınıflarını yatıştırmaya yönelik son hamleyle, devlet sendikası örgütü resmen feshedildi. Artık bir ofisi olmayan eski liderleri ya emekli oldu ya da geniş bürokrasiye geri döndü; bu esnada bağımsız işçi sendikaları topraklarımızın dört bir yanındaki işyerlerinde kendilerini yeniden kuruyorlar."
 bpm_union_leadership.2.f:0 "Her işçinin bir sendikaya katılmasının iyi bir karar olduğunu düşünüyorum. Bu dünyadaki güçlere karşı savunmasız duran herhangi bir adamın, eğer ailesinin geçiminden artırabileceği bir parası varsa, emeğin haklarını ve çıkarlarını koruyan bir örgütle birleşmemesinin nasıl bu kadar aptalca olabileceğini aklım almıyor.\n\n—Winston Churchill, 1911"
 bpm_union_leadership.2.a:0 "Halk için üç defa hurra!"

 bpm_union_leadership.2.t2:0 "Devlet Sendikasının Sonu"
 bpm_union_leadership.2.desc2:0 "Ulusumuzun liderleri yakın zamanda devlet işçi örgütünün maliyetli, gereksiz ve hatta potansiyel olarak riskli bir kurum olduğuna karar verdiler. Sonuç olarak, devlet sendika örgütünü resmen feshettiler ve onun yerini almaya çalışan diğer tüm grupları yasakladılar. Ancak, eski liderleri emekliye ayrılmış ya da unutulup gitmiş olsa bile, yeni yeteneklerin önderlik ettiği tabandan gelen işçi hareketleri ulusumuzun yeraltında varlığını sürdürüyor."
 bpm_union_leadership.2.f2:0 "Bu ülkede emeğini istediği yerde ve istediği zaman satmak için genel hukuk hakkını kullanmak isteyen bir adamın evine yüz kişinin gitmesine ve ona çalışmaması için 'tavsiyede bulunmasına' veya onu 'barışçıl bir şekilde ikna etmesine' izin vermemiz isteniyor. Eğer barışçıl ikna asıl amaçsa, bunu yapmak için neden yüz kişiye ihtiyaç var? ... Her dürüst adam, sendikaların neden sayıca güçlü bir grev gözcüsü (picket) hakkı konusunda ısrar ettiklerini bilir. Çünkü onlar amaçları için ne barışçıllığa ne de iknaya güvenirler. Gözcülük yaptıkları kişiler barışçıl bir şekilde ikna edilemezler.\n\n—F. E. Smith, 1. Birkenhead Kontu, 1906"
 bpm_union_leadership.2.a2:0 "O kışkırtıcıları eninde sonunda yakalayacağız."

 bpm_union_leadership.2.t3:0 "Emeğin Kurtuluşu"
 bpm_union_leadership.2.desc3:0 "Ulusumuzun alt sınıflarını yatıştırmaya yönelik son hamleyle, devlet sendikası örgütü resmen feshedildi. Artık bir ofisi olmayan eski liderleri ya emekli oldu ya da geniş bürokrasiye geri döndü; bu esnada bağımsız işçi sendikaları topraklarımızın dört bir yanındaki işyerlerinde kendilerini yeniden kuruyorlar. Ancak, bu sendikaların çok fazla tuhaf fikre kapılmamaları için tedbirler alınmaya devam edilecek."
 bpm_union_leadership.2.f3:0 "Her işçinin bir sendikaya katılmasının iyi bir karar olduğunu düşünüyorum. Bu dünyadaki güçlere karşı savunmasız duran herhangi bir adamın, eğer ailesinin geçiminden artırabileceği bir parası varsa, emeğin haklarını ve çıkarlarını koruyan bir örgütle birleşmemesinin nasıl bu kadar aptalca olabileceğini aklım almıyor.\n\n—Winston Churchill, 1911"
 bpm_union_leadership.2.a3:0 "Ilımlılık galip geldi."

 bpm_union_leadership.2.t4:0 "Emeğin Yeniden Yükselişi"
 bpm_union_leadership.2.desc4:0 "İşçi sendikaları devlet aygıtının kolektif kontrolünü ele geçirdikçe, devlet sendikası örgütü devrimin baskısı altında çöktü. Bir zamanlar baskıladıkları sendikalar artık toplumumuzun belkemiğini oluştururken, devlet sendikasının eski liderleri ya adalete teslim edildi ya da unutulup gittiler."
 bpm_union_leadership.2.f4:0 "Sahaya çıkın ve diğer işçileri içeri alın ki, o büyük misyonları için tam olarak donatılabilsinler. Kapitalistlerden ne koparabilirsek adım adım koparacağız, ancak gözümüzü hedefe dikmiş durumdayız; yeni kurtuluşun ilham verici müziğine ayak uydurarak ileriye doğru bastıracağız; ve bu tür bir örgütlenmeye yeterince sahip olduğumuzda, Kardeş DeLeon'un geçen gün çok güzel bir şekilde söylediği gibi, savaş düzenine girdiğimizde ve kapitalistler bizi dışarıda bırakmaya çalıştığında, durumu tersine çevireceğiz ve onları dışarıda bırakacağız. Fabrikaları onlarsız çalıştırabiliriz ama onlar bizsiz çalıştıramazlar.\n\n—Eugene Debs, 1905"
 bpm_union_leadership.2.a4:0 "Daima dayanışma!"

 bpm_union_leadership.2.t5:0 "Emek Devrimi"
 bpm_union_leadership.2.desc5:0 "Proleter kurtuluşun bu yeni çağında, devlet sendikası örgütü nihayet alaşağı edildi. Ulusumuzun işçi sendikaları yasallaştırılıp cesur devrimci öncülerin rehberliğine bırakılırken, devlet sendikasına liderlik edenler kendilerini zincire vurulmuş ya da sürgünde buldular."
 bpm_union_leadership.2.f5:0 "Sosyalist ideolojiyi herhangi bir şekilde küçümsemek, ondan en ufak bir şekilde sapmak, burjuva ideolojisini güçlendirmek demektir. Kendiliğindenlikten çokça söz ediliyor. Ancak işçi sınıfı hareketinin kendiliğinden gelişimi, onun burjuva ideolojisine tabi olmasına yol açar...; çünkü kendiliğinden işçi sınıfı hareketi sendikacılıktır..., ve sendikacılık, işçilerin burjuvazi tarafından ideolojik olarak köleleştirilmesi demektir. Bu nedenle, bizim görevimiz, Sosyal Demokrasi'nin görevi, kendiliğindenlikle mücadele etmek, işçi sınıfı hareketini burjuvazinin kanatları altına girmeye yönelik bu kendiliğinden, sendikalist çabadan saptırmak ve onu devrimci Sosyal Demokrasinin kanatları altına almaktır.\n\n—V. I. Lenin, 1902"
 bpm_union_leadership.2.a5:0 "Yaşasın Devrim!"