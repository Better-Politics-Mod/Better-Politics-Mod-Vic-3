 bpm_frankfurt_parliament_events.1.t:0 "Kilise Üzerine"
 bpm_frankfurt_parliament_events.1.d:0 "Geleceğin Almanya'sında kilise ile devlet arasındaki ilişkinin nasıl olması gerektiği üzerine yapılan ateşli tartışmalar Parlamento salonunu dolduruyor. Argümanlarla, anlaşmalarla ve ihanetlerle geçen günler ve geceler... Ancak sonunda bir karara varılıyor."
 bpm_frankfurt_parliament_events.1.f:0 "Barış tüm adaletten daha önemlidir; ve barış adalet uğruna yapılmamıştır, adalet barış uğruna yapılmıştır.\n\n—Martin Luther, 1530"
 bpm_frankfurt_parliament_events.1.a:0 "[SCOPE.GetRootScope.GetCountry.GetCustom('religious_debate_outcome')]"
 frankfurt_secular:0 "Almanya laik bir ulus olacak!"
 frankfurt_conscience:0 "Almanya tüm Hristiyanlar için bir yuva olacak!"
 frankfurt_state_church:0 "Meclis Katolikliği azarlıyor!"
 catholic_boycott_tt:0 "#red Katolik devletler parlamentoyu boykot edecek!"
 austria_boycott_tt:0 "#red Avusturya İmparatorluğu parlamentoyu boykot edecek!"

 bpm_frankfurt_parliament_events.2.t:0 "İfade Özgürlüğü Üzerine"
 bpm_frankfurt_parliament_events.2.d:0 "Kilise ve devletle ilgili temel sorunun çözülmesiyle birlikte meclis, odak noktasını ifade özgürlüğü sorusuna kaydırıyor. Muhafazakar delegeler devletin isyankar (seditious) konuşmaları bastırabilmesi gerektiği fikrini savunurken, sol kanat ifade özgürlüğünün aydınlanmış bir toplumun temeli olduğunu tutkuyla savunuyor."
 bpm_frankfurt_parliament_events.2.f:0 "İnsanların fikirlerini özgürce söyleyebilecekleri, hükümetlerine dilekçe verebilecekleri iddiası olmasaydı, bugün herhangi birimiz burada olabilir miydi? Tüm bulunanlardan, bu önergeyi oylamadan önce bunu düşünmelerini rica ediyorum..."
 bpm_frankfurt_parliament_events.2.a:0 "[SCOPE.GetRootScope.GetCountry.GetCustom('speech_debate_outcome')]"
 frankfurt_free_speech:0 "Tüm Almanlar için ifade ve basın özgürlüğü!"
 frankfurt_free_assembly:0 "Toplanma hakkı esastır."
 frankfurt_censorship:0 "Konuşmak bir ayrıcalıktır."

 frank_speech_tt_1:0 "[SCOPE.sLaw('law_protected_speech').GetName] kutsallaştırılacaktır"
 frank_speech_tt_2:0 "[SCOPE.sLaw('law_right_of_assembly').GetName] kutsallaştırılacaktır"
 frank_speech_tt_3:0 "[SCOPE.sLaw('law_censorship').GetName] kutsallaştırılacaktır"

 bpm_frankfurt_parliament_events.3.t:0 "Özerklik Üzerine"
 bpm_frankfurt_parliament_events.3.d:0 "Alman Konfederasyonu'nun iç örgütlenmesi şu anda, Kutsal Roma İmparatorluğu günlerine kadar uzanan sınırları ve gelenekleriyle çalışan büyük bir karmaşadır. Delegeler Almanya'nın kurucu devletlerine ne kadar özerklik verilmesi gerektiği konusunda anlaşmazlığa düştükçe tartışma şimdi tüm hızıyla devam ediyor."
 bpm_frankfurt_parliament_events.3.f:0 "Tamamen burjuva bakış açısından bile Almanya'nın sağlam birliği, onun mevcut sefaletinden kurtulmasının ve ulusal servetinin inşasının birincil koşuludur. Ve 39 küçük devlete bölünmüş bir bölgede modern sosyal sorunlar nasıl çözülebilirdi?\n\n—Karl Marx, 1848"
 bpm_frankfurt_parliament_events.3.a:0 "[SCOPE.GetRootScope.GetCountry.GetCustom('centralization_debate_outcome')]"
 frankfurt_unitary:0 "Meclis eyaletleri lağvetmek için harekete geçiyor."
 frankfurt_federal:0 "Almanya eşitlerin birliği olacak."
 frankfurt_confederal:0 "Geleneksel özerklik sürdürülecektir."

 bpm_frankfurt_parliament_events.4.t:0 "Bohemya ve Posen Üzerine"
 bpm_frankfurt_parliament_events.4.d:0 "Bohemya Krallığı Avusturya ile daimi bir birlik içindedir ve bu nedenle toprakları Konfederasyonun bir parçası haline gelmiştir. Benzer şekilde Polonya çoğunluklu Posen Dükalığı da konfederasyon içinde kalmaktadır. Ancak bu devletlerdeki Slav çoğunlukları kendilerine ait bir ulusal kimlik geliştiriyor. Ne olursa olsun, bu alanın dahil edilip edilmeyeceği konusunda bir karara varılmıştır."
 bpm_frankfurt_parliament_events.4.f:0 "Beyler, çağrınızı ne kendim ne de başka bir 'güvenilir vatansever' göndererek kabul edemem. Lütfen bunun nedenlerini size olabildiğince kısaca açıklamama izin verin.\nMeclisinizin açık amacı, mevcut prensler federasyonunun yerine bir Volksbund (Halk Birliği) koymaktır... Bu çabaya ve dayandığı duyguya ne kadar saygı duysam da, özellikle de saygı duyduğum için ona katılamam. Ben bir Alman değilim - en azından kendimi öyle görmüyorum - ve kesinlikle beni fikri veya iradesi olmayan sırf bir evet efendimci (yes-man) olarak davet etmek istemediniz...\n\n—František Palacký, 1848"
 bpm_frankfurt_parliament_events.4.a:0 "Bohemya ve Posen Alman eyaletleri olarak kalacak."
 bpm_frankfurt_parliament_events.4.b:0 "Bu bölgelere Alman koruması altında özerklik verilecek."

 bpm_frankfurt_parliament_events.5.t:0 "Oy Verme Hakkı Üzerine"
 bpm_frankfurt_parliament_events.5.d:0 "Alman halkının bu yeni hükümette ne derece söz sahibi olacağı önemli bir bölünme konusudur; görüşler oy hakkının toprak sahipleriyle sınırlandırılmasından tüm yetişkin erkeklere açılmasına kadar uzanmaktadır. Sonuçta bu nihai bir oylamaya kalır."
 bpm_frankfurt_parliament_events.5.f:0 "\"Halk tabakası (Commoner), ulusal meselelerde söz sahibi olmak için gereken o nitelikten ve çok önemli bahislerden yoksundur-\"\n\n\"Buna kesinlikle katılmıyorum, yeni Alman devletinin meşruiyeti volk'un (halkın) rızası üzerine inşa edilmelidir...\""
 bpm_frankfurt_parliament_events.5.a:0 "[SCOPE.GetRootScope.GetCountry.GetCustom('voting_debate_outcome')]"
 frankfurt_universal:0 "Tüm erkek vatandaşlar için Evrensel Oy Hakkı!"
 frankfurt_census:0 "Bazı servet ve hizmet gereklilikleri olan yetişkin erkek oy hakkı."
 frankfurt_landed:0 "Ulusal seçimler toprak sahibi bireyler tarafından kararlaştırılacaktır."
 autocracy_boycott_tt:0 "#red Otokratik devletler parlamentoyu boykot edecek!"

 bpm_frankfurt_parliament_events.6.t:0 "Reich (İmparatorluk) Üzerine"
 bpm_frankfurt_parliament_events.6.d:0 "Meclis ilerledikçe, birleşik bir Alman devletindeki nihai sınırların ne olacağı sorusu merkezi soru haline gelmiştir. Avusturya delegasyonu büyük ölçüde kendi diyarının veya bağımlılıklarının dahil edilmesine direniyor, Küçük Almanya'yı tercih ederken; radikaller Büyük Almanya'ya (Greater Germany) doğrudan dahil edilmesi konusunda ısrar ediyor. Nihayetinde mesele oylamaya sunuluyor."
 bpm_frankfurt_parliament_events.6.f:0 "Şu sevimli Avusturyalılar! Şimdi Almanya ile birleşmeden nasıl Almanya ile birleşebileceklerini düşünüyorlar!\n\n—Friedrich Hebbel, 1848"
 bpm_frankfurt_parliament_events.6.a:0 "Tüm Büyük Almanya, birleşik ve bölünmez tek bir devlette!"
 bpm_frankfurt_parliament_events.6.b:0 "Meclis Küçük Alman (Lesser German) birleşmesiyle ilerleyecek."
 frankfurt_lesser:0 "Meclis, gelecekte Avusturya'nın katılımı için bir olasılık sağlayarak Küçük Alman birleşmesiyle ilerleyecek."
 frankfurt_greater:0 "Gelecekte, daha büyük Avusturya'nın kaderini müzakere etmek için Avusturya delegeleriyle görüşmemiz gerekecek."

 bpm_frankfurt_parliament_events.7.t:0 "Şansölyelik Üzerine"
 bpm_frankfurt_parliament_events.7.d:0 "Meclis genel olarak bazı güçler ayrılığı konusunda hemfikir olsa da, hükümet başkanı ile devlet başkanı arasındaki ilişki tartışmalıdır. Sağ kanat bir Şansölye ve hükümetinin İmparator'un kaprislerine (keyfine) bağlı olması gerektiğine inanırken, daha liberal sesler yasama organının gücünün bu konuda daha fazla anayasal olarak korunması çağrısında bulunuyor."
 bpm_frankfurt_parliament_events.7.f:0 "Devleti ya yönetmeye ya da mahvetmeye kararlı.\n\n—John Dryden, 1681"
 bpm_frankfurt_parliament_events.7.a:0 "[SCOPE.GetRootScope.GetCountry.GetCustom('hog_debate_outcome')]"
 frankfurt_hog_hos:0 "İmparator, şansölyeyi değiştirme konusundaki mutlak otoritesini koruyacaktır."
 frankfurt_hog_advice:0 "İmparator'un şansölyeyi değiştirmek için resmi desteğe ihtiyacı olacak."

 bpm_frankfurt_parliament_events.8.t:0 "Liderlik Üzerine"
 bpm_frankfurt_parliament_events.8.d:0 "Anayasanın geniş hatları tamamlandığında, şimdi asıl soru şu: yeni, anayasal Almanya'yı yönetme tacı ve görevi kime sunulacak."
 bpm_frankfurt_parliament_events.8.f:0 "Tüm Almanya'nın tacını kimin başının takması gerektiği sorusu büyük önem taşıyordu; çoğu kişi Prusya veya Avusturya monarşisini öneriyordu. Şaşırtıcı olmayan bir şekilde, en radikal hizipler bu soruyu tamamen reddetti ve gerçek bir Alman demokrasisinin Kaiser'i olmayacağını öne sürdüler..."
 bpm_frankfurt_parliament_events.8.a:0 "[SCOPE.sCountry('frankfurt_crown_candidate').GetName] ve onun hükümdarı aşikar bir seçimdir."
 bpm_frankfurt_parliament_events.8.b:0 "Hiçbir İmparator Alman halkına gerçekten liderlik edemez, çok yaşa Cumhuriyet!"
 frankfurt_crown_candidate_tt:0 "[SCOPE.sCountry('frankfurt_crown_candidate').GetRuler.GetFullName] Almanya'nın tacını teklif alacak"
 frankfurt_republic_candidate_tt:0 "Meclis, İmparatorluk liderliğinden vazgeçecek ve bunun yerine cumhuriyetçi bir #bold Alman Federasyonu#! kuracak!"

 bpm_frankfurt_parliament_events.9.t:0 "İmparatorluk Teklifi"
 bpm_frankfurt_parliament_events.9.d:0 "Frankfurt'taki parlamento [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] yetkilimize tüm Almanya'nın tacını teklif etti. Bu büyük teklif anayasaya bağlılığımızı gerektiriyor ve muhtemelen bizi diğer Alman devletleriyle bir çatışmaya sürükleyecek."
 bpm_frankfurt_parliament_events.9.f:0 "§. 70.\n1. İmparatorluğun Başı şu unvanı taşır: Almanların İmparatoru.\n\n§. 71.\n1. İmparator'un ikametgahı İmparatorluk Hükümeti'nin merkezindedir. En azından Reichstag'ın (Meclisin) oturumu sırasında İmparator orada kalıcı olarak ikamet edecektir.\n2. İmparator İmparatorluk Hükümeti'nin merkezinde olmadığında, İmparatorluk bakanlarından biri onun hemen yakınında olmalıdır.\n3. İmparatorluk Hükümeti'nin yerine ilişkin hükümler bir İmparatorluk yasasına tabidir.\n\n§. 72.\n1. İmparator, Reichstag tarafından belirlenen bir sivil liste alır."
 bpm_frankfurt_parliament_events.9.a:0 "\"Büyük onur büyük sorumluluk getirir, yine de kabul edeceğim.\""
 bpm_frankfurt_parliament_events.9.b:0 "\"Oluktan gelen bu tacı kabul etmeyeceğim!\""
 bpm_frankfurt_parliament_events.9.c:0 "\"Kabul etmeye istekliyiz ama bazı tavizler olmadan değil...\""

 bpm_frankfurt_parliament_events.10.t:0 "[ROOT.GetCountry.GetName] Ülkesinde Halk Devrimi"
 bpm_frankfurt_parliament_events.10.d:0 "Alman devletlerini kasıp kavuran halk huzursuzluğu dalgası, [ROOT.GetCountry.GetName] ülkesinde kontrolden çıkan bir ateş yaktı. İsyancılar ve isyankar askerler başkenti ele geçirip devrimci bir hükümet kurdular."
 bpm_frankfurt_parliament_events.10.f:0 "Birkaç devrimci meclisin zirvesi meyvesini vermişti, Alman diyarının dört bir yanından gelen demokratik ajitatörler yeni anayasanın yürürlüğe girmesini gözlemlemek ve buna yardımcı olmak için gelmişlerdi. Birçok ses bir toplanma çığlığı altında birleşti:\n\n\"Herkes için Sağlık, Eğitim, Özgürlük!\""
 bpm_frankfurt_parliament_events.10.a:0 "Volk (Halk) zincirlerinden kurtuldu..."

 bpm_frankfurt_parliament_events.11.t:0 "Ertelenen Rüya"
 bpm_frankfurt_parliament_events.11.d:0 "Kitlesel baskılar ve uyum kaybının ortasında Frankfurt Parlamentosu dağıldı. Şimdilik, Alman birliği rüyasının gerçekleşmekten hala çok uzak olduğu görülüyor."
 bpm_frankfurt_parliament_events.11.f:0 "Hayır, biz \[parlamentoya\] çok fazla onur atfediyoruz; ona çoktandır kaybettiği siyasi bir önem atfediyoruz. En ağır hüküm zaten verilmiştir -- kararlarının hiçe sayılması ve tamamen unutulması.\n\n—Karl Marx, 1848"
 bpm_frankfurt_parliament_events.11.a:0 "Olmayacaktı..."

 bpm_frankfurt_parliament_events.12.t:0 "Schwarz Rot Gold (Siyah Kırmızı Altın)"
 bpm_frankfurt_parliament_events.12.d:0 "O an geldi! Devrimci devletlerden oluşan bir birlik ile nihayet ileri doğru yürüyebilir ve Almanya'yı ulusumuzun siyah, kırmızı ve altın renkli bayrağı altında birleştirebiliriz! Bırakın diyarın gericileri ve tüm Avrupa kararlılığımız karşısında titresin!"
 bpm_frankfurt_parliament_events.12.f:0 "Tarihin ruhu Alman halkını ele geçirmişti, her çatıyı çevreleyen bayraklar, askerler ve coşkulu vatandaşlarla dolup taşan şehir sokaklarının çok yukarısında rüzgarda dalgalanıyordu..."
 bpm_frankfurt_parliament_events.12.a:0 "Birlik için, adalet için!"
 bpm_frankfurt_parliament_events.12.b:0 "Birlik için, adalet için!"

 bpm_frankfurt_parliament_events.13.t:0 "Einigkeit und Recht und Freiheit (Birlik ve Adalet ve Özgürlük)"
 bpm_frankfurt_parliament_events.13.d:0 "Nihayet zafer! Birçok zorluk ve musibetten sonra Almanya nihayet şanlı bayrağımızın altında birleşti, bugün bir olarak yürüyoruz!"
 bpm_frankfurt_parliament_events.13.f:0 "İşte Alman sadakati,\nİşte Alman çalışkanlığı,\nİşini nasıl yapacağını bilen,\nTanrı'nın verdiği işi,\nDürüstçe yerine getirenin,\nTüm hayatı yakında olacak,\nOnun sevdiği bir sanat eseri.\n\n—Max von Schenkendorf, 1815"
 bpm_frankfurt_parliament_events.13.a:0 "Deutschland, Deutschland über alles! (Almanya, Her Şeyin Üstünde Almanya!)"

 bpm_frankfurt_parliament_events.14.t:0 "Grossdeutschland (Büyük Almanya)"
 bpm_frankfurt_parliament_events.14.d:0 "Avusturya sevdalıları ve Muhafazakarlar muzaffer bir şekilde ortaya çıkarak, konfederasyonu Habsburg Kaiser'in altında bir imparatorluk halinde merkezileştirdi. Bu birliğin krallıklarına önemli ölçüde özerklik tanındı."
 bpm_frankfurt_parliament_events.14.f:0 "İşte Alman sadakati,\nİşte Alman çalışkanlığı,\nİşini nasıl yapacağını bilen,\nTanrı'nın verdiği işi,\nDürüstçe yerine getirenin,\nTüm hayatı yakında olacak,\nOnun sevdiği bir sanat eseri.\n\n—Max von Schenkendorf, 1815"
 bpm_frankfurt_parliament_events.14.a:0 "Deutschland, Deutschland über alles! (Almanya, Her Şeyin Üstünde Almanya!)"

 bpm_frankfurt_parliament_events.20.t:0 "Yarımlar ve Bütünler Hakkında"
 bpm_frankfurt_parliament_events.20.d:0 "Sol hizipler ile liberal merkez arasındaki tartışmalar bir dizi konu üzerinde şiddetle devam ediyor. Asıl soru; taviz vererek daha güçlü bir merkez mi inşa edileceği, yoksa radikal bir platformla mı ilerleneceği."
 bpm_frankfurt_parliament_events.20.f:0 "\"Anlamıyorsunuz, benden bu programın, bu meclisin temellerini zayıflatmam istenemez-\"\n\n\"Hayır asıl anlamayan sizsiniz, oyları bulamazsak anayasa da olmaz!\""
 bpm_frankfurt_parliament_events.20.a:0 "İlerleyebilmemiz için bir uzlaşmaya varın."
 bpm_frankfurt_parliament_events.20.b:0 "Alman özgürlüğü için taviz yok, oyları bulun!"

 bpm_frankfurt_parliament_events.21.t:0 "Kutuplaşma"
 bpm_frankfurt_parliament_events.21.d:0 "Casino-Fraktion ve Café Milani gibi büyük hiziplerin kendi iç çekişmelerine düşmesi, bazı delegeleri daha sert (hard-line) pozisyonlara itti."
 bpm_frankfurt_parliament_events.21.f:0 "Her iki tarafça da çürütülemez argümanlarla savunulmayan, tartışılamayacak herhangi bir nokta olduğunu hiç bilmiyordum...\n\n—Letitia Elizabeth Landon, 1831"
 bpm_frankfurt_parliament_events.21.a:0 "Sağ avantajı ele geçiriyor."
 bpm_frankfurt_parliament_events.21.b:0 "Muhalifler solla birleşiyor."

 bpm_frankfurt_parliament_events.22.t:0 "Yükselen Cumhuriyetçilik"
 bpm_frankfurt_parliament_events.22.d:0 "Almanya genelinde radikal ayaklanmaların başarısıyla, daha fazla liberal delege Deutscher Hof gibi hiziplere katılarak cumhuriyetçilik davasına yöneldi."
 bpm_frankfurt_parliament_events.22.f:0 "İleri atılan bir kalabalığın içinde dikilen biri ona karşı da duruyormuş gibi iyi bir direniş göstermektedir; ayaklar altında ezilecektir.\n\n—Danton'un Ölümü, Bölüm 1"
 bpm_frankfurt_parliament_events.22.a:0 "Sadece bir cumhuriyet gerçekten halkın hükümeti olabilir."

 bpm_frankfurt_parliament_events.23.t:0 "Dindar Reaksiyon"
 bpm_frankfurt_parliament_events.23.d:0 "Kilise ile devletin tamamen ayrılmasına ilişkin bir muhtıranın (memorandum) kabul edilmesi, Alman yaşamında kilisenin etkisine daha fazla koruma arzulayan daha inançlı delegelerin bazılarını kutuplaştırdı."
 bpm_frankfurt_parliament_events.23.f:0 "Birçok dindar lider, Frankfurt Anayasası'nın laikliğini şiddetle kınayarak, bunu \"tanrısal yönetime hakaret\" ve \"yozlaşmış laiklik\" olarak nitelendirdi; bu saldırılar çoğu liberali etkilemese de, sağdaki bazıları tedirgin oldu..."
 bpm_frankfurt_parliament_events.23.a:0 "Belki de aşırı bir tepki..."

 bpm_frankfurt_parliament_events.24.t:0 "Kurumsal Liberalizm"
 bpm_frankfurt_parliament_events.24.d:0 "Frankfurt Parlamentosu tartışmaları uzayıp giderken, liberal merkezin elde ettiği başarılar Alman devletleri genelinde daha güçlü liberal reform hareketlerinin yolunu açtı."
 bpm_frankfurt_parliament_events.24.f:0 "Liberalizm tarihin geleceğinden başka hiçbir şey istemez.\n\n—Theodor Mundt, 1834"
 bpm_frankfurt_parliament_events.24.a:0 "Belki de daha büyük bir şeyin başlangıcı..."

 bpm_frankfurt_parliament_events.25.t:0 "Prosedür Kaosu"
 bpm_frankfurt_parliament_events.25.d:0 "Parlamento işlemleri, prosedürdeki bazı ciddi anlaşmazlıklar nedeniyle durma noktasına geldi. Bu durum, önemli anayasal maddeler üzerindeki kritik oylamaları daha da geciktirme tehdidinde bulunuyor."
 bpm_frankfurt_parliament_events.25.f:0 "\"Muhalefet bazen burada siyaset yaptığımızı ve tiyatro oynamadığımızı unutuyor gibi görünüyor...\""
 bpm_frankfurt_parliament_events.25.a:0 "Hasar kontrolü yapıp yola devam edin."
 bpm_frankfurt_parliament_events.25.b:0 "Bakalım biraz gözdağıyla işleri yoluna koyabilecek miyiz."

 bpm_frankfurt_parliament_events.26.t:0 "Taarruza Geçmek - Başarısızlık"
 bpm_frankfurt_parliament_events.26.d:0 "Muhalefete baskı yapma girişimleri iftira niteliğinde saldırılara dönüştü ve birçok delege bugünkü oturumlara katılmayı reddediyor."
 bpm_frankfurt_parliament_events.26.f:0 "\"Kişisel olarak Bay Strauss'u ve yorumlarını reddetmek isterim, onların programımızın amaçlarını temsil ettiğine inanmıyorum ve dahası...\""
 bpm_frankfurt_parliament_events.26.a:0 "Ona NE dedin sen?!"

 bpm_frankfurt_parliament_events.27.t:0 "Taarruza Geçmek - Başarı"
 bpm_frankfurt_parliament_events.27.d:0 "Muhalefete baskı yapma girişimleri bazılarını pek mutlu etmemiş olsa da, yine de meclisin daha önemli meselelere ilerlemesine olanak tanıdı."
 bpm_frankfurt_parliament_events.27.f:0 "\"Sanırım bizimle aynı çizgide durmanın sizin de en çok yararınıza olacağını anlayacaksınız, öyle değil mi?\""
 bpm_frankfurt_parliament_events.27.a:0 "Anlaşma sanatı."

