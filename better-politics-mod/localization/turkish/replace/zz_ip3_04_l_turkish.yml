je_eastern_question_austria: "Bosna Sorunu"
je_eastern_question_austria_reason: "Lobilerimiz, şu anda [SCOPE.sCountry('bosnia_owner_scope').GetName] toprağı olan [GetStateRegion('STATE_BOSNIA').GetName] bölgesini işgal etmemizi talep etti. Harekete geçilirse bu öneri, [SelectLocalization(SCOPE.sCountry('relevant_country').IsValid, SCOPE.sCountry('relevant_country').GetAdjectiveNoFlag, 'dyn_c_rsfsr_adj')] etkisinin [GetStrategicRegion('region_balkans').GetName] bölgesinde ilerlemesini durdurmaya yardımcı olacaktır.\n\nTaleplerini başarıyla yerine getirmek bize [Concept('concept_political_lobby','$concept_political_lobby_short$')] nezdinde iyi niyet kazandıracak olsa da, ayrılan süre içinde bunu yapmamak onları büyük ölçüde hoşnutsuz edecektir."

eastern_question_austria.1.t: "Sınırı Taşımak"
eastern_question_austria.1.d: "[SCOPE.sCountry('relevant_country').GetName] devletinin Balkan bölgesindeki nüfuzunu genişletme çabaları [SCOPE.sPoliticalLobby('relevant_lobby').GetName] lobisini alarma geçirdi. [SCOPE.sCountry('relevant_country').GetNameNoFormatting]'nın [GetStateRegion('STATE_BOSNIA').GetName] üzerinde nüfuz sağlamasını önlemek için [SCOPE.sCountry('bosnia_owner_scope').GetName] devletine karşı önleyici bir eylem önerdiler."
eastern_question_austria.1.f: ""Size bir teklifte bulunmama izin verin," diye söze başladı [SCOPE.sCharacter('lobby_politician_scope').GetLastNameNoFormatting].\n\n[SCOPE.sCharacter('lobby_politician_scope').GetSheHe|U], Generali [ROOT.GetCountry.GetCapital.GetCityHubName] içindeki bir restoranda köşeye sıkıştırmış, yarım saatini ayırması karşılığında hesabı ödemeye söz vermişti. General menüdeki en pahalı şaraptan bir yudum aldı ve başını salladı.\n\n"Bu, [SCOPE.sCulture('relevant_country_culture').GetCustom('getPluralDemonym')] ve onların mevcut çabalarıyla ilgili. Gazetelere göz kulak olduğunuzu ve Slavların içinde bulunduğu tehlikeli durumu ve [SCOPE.sCountry('relevant_country').GetRuler.GetPrimaryRoleTitle]'ın bu konudaki agresif retoriğini bildiğinizi varsayıyorum...""
eastern_question_austria.1.a: "[GetStateRegion('STATE_BOSNIA').GetNameNoFormatting] bölgesini medenileştirme yükünü biz omuzlayacağız."
eastern_question_austria.1.b: "Bu teklif buram buram savaş kokuyor."

eastern_question_austria.2.t: "İşgal Hükümeti"
eastern_question_austria.2.d: "[GetStateRegion('STATE_BOSNIA').GetName] güvence altına alındığına göre, artık bölgenin geleceğine karar verebiliriz. Sözde [SCOPE.sCountry('bosnia_owner_scope').GetAdjective] otoritesini koruyan bir işgal muhtemelen uluslararası onay alacak, ancak pratik kazanımlarımızı sınırlayacaktır."
eastern_question_austria.2.d_2: "[GetStateRegion('STATE_BOSNIA').GetName] güvence altına alındığına göre, artık bölgenin geleceğine karar verebiliriz. Bölgenin egemenliğini sözde koruyan bir işgal muhtemelen uluslararası onay alacak, ancak pratik kazanımlarımızı sınırlayacaktır."
eastern_question_austria.2.f: "Bakan, "Aşağıdakileri tavsiye ederim," dedi. "İlk değerlendirmemiz için [SCOPE.sState('bosnia_state_scope').GetCityHubName]'de [SCOPE.sCharacter('name_a_scope').GetLastNameNoFormatting], [SCOPE.sState('bosnia_state_scope').GetFarmHubName]'de [SCOPE.sCharacter('name_b_scope').GetLastNameNoFormatting] ve [SCOPE.sState('bosnia_state_scope').GetForestryHubName]'de [SCOPE.sCharacter('name_c_scope').GetLastNameNoFormatting]. Her bölgenin özel eksiklikleri temelinde idari görev güçleri göndereceğiz."\n\nİlk sırada oturan [SCOPE.sCharacter('name_b_scope').GetLastNameNoFormatting|U] elini kaldırdı. "Henüz Ordunun raporlarını almadım. Bizi neler bekliyor?"\n\n"Kızgın bir halk ve vergi toplamaya takıntılı memurlar. Gerektiği kadarını görevden alın. Türkler hiçbir zaman iyi bir yönetim itibarı kazanmamıştır.""
eastern_question_austria.2.a: "Bölgeyi işgal edin ve yönetimini yeniden düzenleyin."
eastern_question_austria.2.b: "[GetStateRegion('STATE_BOSNIA').GetName] bölgesini İmparatorluğumuzun ayrılmaz bir parçası olarak ilhak edin."
eastern_question_austria.2.c: "[GetStateRegion('STATE_BOSNIA').GetName] bölgesini ortak Maliye Bakanlığı himayesinde İmparatorluğumuza katın."
eastern_question_austria.2.e: "[GetStateRegion('STATE_BOSNIA').GetName] bölgesini [SCOPE.sCountry('croatia_scope').GetName] devletinin bir bileşeni olarak ilhak edin."

