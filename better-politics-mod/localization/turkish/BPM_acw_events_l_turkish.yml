  bpm_acw_events.101.t:0 "Ulusal Birlik Ulusal Kongresi"
  bpm_acw_events.101.d:0 "Devam eden İç Savaş'ın ulusumuzun siyasi sistemi üzerinde baskı yaratmasıyla Başkan, savaş çabası etrafında hem Cumhuriyetçileri hem de Demokratları birleştirmeyi umarak Ulusal Birlik Partisi'ni kurmaya karar verdi. Bu politikanın kilit noktası Başkan Yardımcısı seçimidir. Mevcut Başkan Yardımcısı Radikal bir Cumhuriyetçidir ve istendiği takdirde olay çıkarmadan pusuladan ayrılmaya isteklidir. Düşünülemez olan gerçekleşirse ulusumuzu zafere kim taşımalı?"
  bpm_acw_events.101.f:0 ""Karar Verildi ki: Amerika Birleşik Devletleri Hükümeti'nin İsyancılarla uzlaşmama veya düşmanlıklarının koşulsuz teslimiyeti ile Amerika Birleşik Devletleri Anayasası ve yasalarına adil bağlılıklarına dönüşü haricinde herhangi bir barış şartı sunmama kararlılığını onaylıyoruz..."\n\n—Ulusal Birlik Partisi Programının İkinci Kararı, 1864"
  bpm_acw_events.101.a:0 "Başkan bir Savaş Demokratı seçerek, yürütme liderliğinde yumuşak bir Yeniden Yapılanma sinyali verir."
  bpm_acw_events.101.b:0 "Başkan eski Başkan Yardımcısını koruyarak, Kongre liderliğinde bir Yeniden Yapılanma sinyali verir."
  bpm_acw_events.101.c:0 "Başkan bir Radikal Demokrat seçerek, yürütme liderliğinde sert bir Yeniden Yapılanma sinyali verir."

  bpm_acw_events.102.t:0 "Anakondanın Kıvrımları"
  bpm_acw_events.102.d:0 "Büyük kan dökülmesinin ardından ordumuz Mississippi Nehri'ni başarıyla güvence altına aldı. Bu sadece isyancı eyaletleri ikiye bölmekle kalmadı, aynı zamanda isyancıları kuvvetlerini Appalachian Dağları boyunca yaymaya zorlayarak sonunda sanayi ve siyasi merkezlerini açıkta bıraktı. Askerlerimiz bu zaferlerle seviniyor ve bir sonraki seçimde bize oy vereceklerinden eminler."
  bpm_acw_events.102.f:0 ""Bulunduğunuz yeri bırakma konusundaki isteksizliğinizi belirten mesajınızı gördüm. Ben de istekli değilim. Bir buldozer gibi tutunun ve elinizden geldiğince sıkıştırıp boğun."\n\n—Abraham Lincoln, 1864"
  bpm_acw_events.102.a:0 "Yaşa! Yaşa! Bayramı biz getiriyoruz!"

  bpm_acw_events.103.t:0 "Habeas Corpus'un Askıya Alınması Emri"
  bpm_acw_events.103.d:0 "Kaos ve isyan yalnızca asi eyaletlerde değil, aynı zamanda Orta Atlantik limanlarında ve başkente giden demiryolu hatlarında da yaygındır. Hainler hükümet merkezimizin takviye edilmesini engellemekle ve Kongre'nin toplanmasını geciktirmekle tehdit ediyor. Bunu çözmek için hükümetimizin güvenliğini garanti altına almak amacıyla kilit bölgelerde ihzar müzekkeresini (habeas corpus) askıya alabiliriz. Bu, ne yasama ne de yargı tarafından onaylanması muhtemel olmayan oldukça tartışmalı bir hamle olacaktır. Ancak böylesi bir emrin uygulanması polis yetkilerimizi güçlendirecek ve isyan bastırıldıktan sonra Birliği yeniden inşa etmek için daha büyük adımlar atmamızı sağlayacaktır."
  bpm_acw_events.103.f:0 ""Amerika Birleşik Devletleri yasalarına karşı bir ayaklanmayı bastırmakla görevlendirildiniz. Philadelphia şehri ile Washington şehri arasında şu anda kullanılan veya kullanılacak olan herhangi bir askeri hat üzerinde veya yakınında kamu güvenliği için ihzar müzekkeresini askıya almayı gerektiren bir direnişle karşılaşırsanız, şahsen veya direnişin gerçekleştiği noktadaki komutan subay aracılığıyla bu müzekkereyi askıya alma yetkisine sahipsiniz."\n\n—Abraham Lincoln, 1861"
  bpm_acw_events.103.a:0 "Yasama onayı olmadan bu adımı atamayız."
  bpm_acw_events.103.b:0 "Bana tiran diyecekler ama demokrasiyi korumak zorundayım. Emri çıkarın!"
  
  bpm_acw_events.104.t:0 "Yasal Ödeme Araçları Yasaları"
  bpm_acw_events.104.d:0 "Bu savaşı finanse etmek için Kongre ilk olarak altın karşılığı olan ve bu nedenle değerleri için madeni para stoklarımıza dayanan Talep Senetlerinin basılmasına izin vermişti. Bu savaş ikinci yılına girerken, bu çatışmayı artık madeni para standardında finanse etmeye devam edemeyeceğimiz açıktır. Davamıza sempati duyan iş adamları kağıt para basılmasını önerdiler. Böylesi bir hamle bol miktarda altın rezervine sahip olan Batı Eyaletlerini üzecektir ancak bu savaşı kazanmak için tedarikçilerimize ve askerlerimize ödeme yapmaya devam etmemiz gerekiyor."
  bpm_acw_events.104.f:0 ""Yeşil banknotların (greenbacks) üzerine bir yazı koyacaksanız, Petrus ve Pavlus'unkini öneririm: 'Gümüşüm ve altınım yok ama bende olanı sana veriyorum.'"\n\n—Abraham Lincoln, 1862"
  bpm_acw_events.104.a:0 "Bir pilot program başlatacağız ancak Kıta Doları'nın hatalarını tekrarlamayacağız."
  bpm_acw_events.104.b:0 "Kongre'yi bu itibari paranın (fiat currency) kitlesel olarak basılmasına izin verecek Yasaları geçirmeye teşvik edeceğiz."
  
  bpm_acw_events.105.t:0 "Askere Alma Yasası"
  bpm_acw_events.105.d:0 "Bu lanet savaş devam ettikçe, yeni asker ihtiyacımız giderek artıyor. Daha önce milislerimizi doldurmak için vatandaşlarımızın vatanseverliğine güvenebiliyorduk ancak savaş yorgunluğu sayımızı tüketti ve kölelik karşıtlığı şüphesi beyaz adamların orduya katılmasını engelledi. Birlik uğruna evrensel erkek zorunlu askerliğini uygulamak artık gerekli olabilir. Bu durum şüphesiz Demokratların barış yanlısı fraksiyonları arasında ve zenginler için tanınan istisnaları adaletsiz görecek olan yoksullar arasında öfkeye yol açacaktır. Ancak bu savaşı çabuk bitirmek istiyorsak, kaynağı ne olursa olsun daha fazla savaşçıya ihtiyacımız olacak."
  bpm_acw_events.105.f:0 ""Aynı anda bir isyanla başa çıkmak, rahatça idare edebileceğimiz kadardır."\n\n—Abraham Lincoln, 1863"
  bpm_acw_events.105.a:0 "Bu savaşı Kurucu Babalarımızın kendi savaşlarını verdiği gibi vereceğiz. Zorunlu askerlik getirmeyin."
  bpm_acw_events.105.b:0 "Bazıları başkalarının yerine yapacak olsa bile her erkek görevini yapmalıdır. Kongre'nin zorunlu askerliği onaylamasını sağlayın."
  
  bpm_acw_events.106.t:0 "Dönüm Noktasında"
  bpm_acw_events.106.d1:0 "Ulusumuz varlığının dönüm noktasına yaklaşırken, Ulusal Birlik Partisi de öyle. Yasalar ve Başkan Yardımcılığı konusundaki radikal kararlarımız yalnızca Savaş Demokratlarının bizi terk etmesine yol açmakla kalmadı, aynı zamanda Horace Greeley'nin Liberal Cumhuriyetçilerinin de Bakırbaşlar (Copperheads) ile birleşmesine neden oldu. Bu, kazanmamız pek olası olmayan acımasız bir seçim dönemi olacak. İyi şanslar Sayın Başkan."
  bpm_acw_events.106.d2:0 "Ulusumuz varlığının dönüm noktasına yaklaşırken, Ulusal Birlik Partisi de öyle. Yasalar ve Başkan Yardımcılığı konusundaki tartışmalı kararlarımız, gizli hain kardeşleriyle uzlaşan Savaş Demokratlarını safımızdan uzaklaştırdı. Bu seçim zor olacak Sayın Başkan, ancak sıkı kampanya yürütürsek kazanılabilir. Sadece bunun sizi savaştan alıkoymasına izin vermeyin."
  bpm_acw_events.106.d3:0 "Ulusumuz varlığının dönüm noktasına yaklaşırken, Ulusal Birlik Partisi de öyle. Büyük çabalar sonucunda Savaş Demokratları, Liberal Cumhuriyetçiler ve Radikal Cumhuriyetçilerden oluşan bir koalisyonu başarıyla birleştirdik. Dahası, yeni bir gıyabi oy sistemi askerlerin bu anıtsal kararda söz sahibi olmasını garanti edecek. Büyük bir hata olmazsa bu seçim sizin zaferinize doğru ilerliyor Sayın Başkan."
  bpm_acw_events.106.d4:0 "Ulusumuz varlığının dönüm noktasına yaklaşırken, Ulusal Birlik Partisi de öyle. Uzlaşma ve kararlılıkla devlet gemisini en büyük sınavından geçirdiniz. Bütün hiziplerden Cumhuriyetçiler ve Demokratlar Ulusal Birlik Sancağı altında toplanıyor ve bazıları her seçici oyu kazanacağınızı tahmin ediyor. Yalnızca Washington ile kıyaslanabilecek böylesi bir başarı, parlak yönetiminize yakışır Sayın Başkan."
  bpm_acw_events.106.d5:0 "Ulusumuz varlığının dönüm noktasına yaklaşırken, Ulusal Birlik Partisi de öyle. Uzlaşma ve kararlılıkla devlet gemisini en büyük sınavından geçirdiniz. Bütün hiziplerden Cumhuriyetçiler ve Demokratlar Ulusal Birlik Sancağı altında toplanıyor ve bazıları her seçici oyu kazanacağınızı tahmin ediyor. Yalnızca Washington ile kıyaslanabilecek böylesi bir başarı, parlak yönetiminize yakışır Sayın Başkan."
  bpm_acw_events.106.d6:0 "Ulusumuz varlığının dönüm noktasına yaklaşırken, Ulusal Birlik Partisi de öyle. Uzlaşma ve kararlılıkla devlet gemisini en büyük sınavından geçirdiniz. Bütün hiziplerden Cumhuriyetçiler ve Demokratlar Ulusal Birlik Sancağı altında toplanıyor ve bazıları her seçici oyu kazanacağınızı tahmin ediyor. Yalnızca Washington ile kıyaslanabilecek böylesi bir başarı, parlak yönetiminize yakışır Sayın Başkan."
  bpm_acw_events.106.f:0 ""Asıl biz yaşayanlar, burada savaşanların şimdiye kadar bu denli asilce ilerlettiği bitmemiş işe kendimizi adamalıyız. Önümüzde duran büyük göreve kendimizi adamalıyız ki; bu şerefli ölülerden, onların son tam bağlılık ölçüsünü verdikleri davaya daha büyük bir bağlılık çıkaralım -- bu ölülerin boşuna ölmediğine burada kesin bir dille ant içelim -- Tanrı'nın altındaki bu ulusun yeni bir özgürlük doğuşuna sahip olacağını -- ve halkın, halk tarafından, halk için olan hükümetinin yeryüzünden silinmeyeceğini ilan edelim.", 1863"
  bpm_acw_events.106.a:0 "Dere geçerken at değiştirilmez!"

  bpm_acw_events.107.t2:0 "Bakırbaşlar Zafer Kazandı"
  bpm_acw_events.107.t1:0 "Cumhuriyetçiler Zafer Kazandı"
  bpm_acw_events.107.d2:0 "Tüm çabalarımıza rağmen seçimi kaybettik. Yenilgimizle Birlik hayali ölüyor; zira rakibimizin seçim vaatleri ne olursa olsun Demokrat Parti'deki Bakırbaşlar (Copperheads) barış müzakerelerinde kesinlikle kolay çözümü arayacaklardır. Artık sadece hem Kuzeyli hem de Güneyli yurttaşları tarafından ihanete uğrayan amaçsız ölüler için yas tutabiliriz."
  bpm_acw_events.107.d1:0 "Sınavlardan ve badirelerden daha güçlü çıktık. Bakırbaşlar mağlup edildi ve arkamızda sadece Konfederasyonu yenmek için değil, aynı zamanda ulusumuzun büyük bir Yeniden Yapılanma sürecine başlamak için de bir yetki var. Ancak yaşlı adam Brown'dan başlayarak şehit olan ölüleri unutmayalım. Gelin insanları özgür kılmak için savaşalım!"
  bpm_acw_events.107.f:0 ""Seçim bir zorunluluktu. Seçimler olmadan özgür bir hükümete sahip olamayız; ve eğer isyan bizi ulusal bir seçimden vazgeçmeye veya ertelemeye zorlayabilseydi, bizi çoktan fethetmiş ve mahvetmiş olduğunu haklı olarak iddia edebilirdi."\n\n—Abraham Lincoln, 1864"
  bpm_acw_events.107.a:0 "Hem beyaz hem de siyah tüm insanları hayal kırıklığına uğrattık."
  bpm_acw_events.107.b:0 "O dimdik ilerlerken!"

  bpm_acw_events.108.t:0 "Şehit Kurtarıcı"
  bpm_acw_events.108.d:0 "Hainlere karşı kazandığımız nihai zaferin üzerinden bir hafta bile geçmeden Başkanımız, Büyük Kurtarıcı, bir suikastçı tarafından vurularak öldürüldü. Kanıtlar Konfederasyon İstihbarat Servisleri ile bu komplo arasında potansiyel bir bağlantıya işaret ediyor ancak somut kanıt bulunmadığından teorilerle baş başa kaldık. Bu İç Savaş nasıl bir şehadetle başladıysa, yine bir şehadetle sona eriyor. Tanrı'ya emanet olun, Sayın Başkan."
  bpm_acw_events.108.f:0 ""John Brown kolunu uzattığında gökyüzü aydınlandı. Uzlaşma zamanı geçmişti - özgürlüğün silahlı orduları parçalanmış bir Birlik uçurumunun üzerinde yüz yüze duruyordu - ve silahların çatışması kapıdaydı. Güney her şeyi Federal Hükümeti ele geçirmeye bağladı ve bunu başaramayınca isyan kılıcını çekti ve böylece Brown'ın değil, kendisinin davasını yüzyılın kayıp davası yaptı."\n\n—Frederick Douglass, 1881"
  bpm_acw_events.108.a:0 "Artık onun son görevini yerine getirmek bizim vazifemizdir: Birliğin Yeniden Yapılanması."

  bpm_acw_events.109.t:0 "Hampton Roads Konferansı"
  bpm_acw_events.109.d:0 "Yeni Başkomutan, Hampton Roads Barış Konferansı'ndan bir barış antlaşmasıyla döndü. Beklediğimiz gibi belgenin her maddesinde boyun eğmişler; kaçan köleleri iade etme, ayrılan eyaletlerden tamamen çekilme ve Konfederasyonu tanıma sözü vermişler."
  bpm_acw_events.109.f:0 ""Barışa gelince, daha önce söyledim ve şimdi tekrar ediyorum; üç şey vazgeçilmezdir.\n\n1. Tüm Eyaletlerde ulusal otoritenin yeniden tesis edilmesi.\n\n2. Kongre'ye sunulan son Yıllık Mesajda ve önceki belgelerde kölelik sorunu konusunda alınan pozisyondan Amerika Birleşik Devletleri İcrası tarafından geri adım atılmaması.\n\n3. Savaşın sona ermesi ve hükümete düşman olan tüm güçlerin dağıtılması dışında hiçbir düşmanlığın durdurulmaması."\n\n—Abraham Lincoln, 1865"
  bpm_acw_events.109.a:0 "Son hançer de bıçağını saplıyor."

  bpm_acw_events.110.t1:0 "Bull Run Harekâtı"
  bpm_acw_events.110.t2:0 "Yarımada Harekâtı"
  bpm_acw_events.110.t3:0 "Overland Harekâtı"
  bpm_acw_events.110.t4:0 "Petersburg Harekâtı"
  bpm_acw_events.110.d1:0 "Hainlerin güçlü direnişine rağmen mavi üniformalı çocuklarımız hızlı bir harekâtla Richmond'a kadar savaşarak ilerlemeyi başardılar. Konfederasyon Hükümeti panik içinde kaçarak geride birçok hayati kaynak bıraktı. Başkan'ın Fort Sumter'ın ardından yaptığı gönüllü çağrısı, kararlılığı nedeniyle gazeteler tarafından övgüyle karşılandı. Ancak asilere karşı savaşımız henüz yeni başladı..."
  bpm_acw_events.110.d2:0 "Operasyonun karmaşıklığına rağmen mavi üniformalı çocuklarımız ve yakışıklı generalleri Yarımada Harekâtı'ndan zaferle çıktılar. Kanatlardan sarılan ve sayıca azalan Konfederasyon Hükümeti Alabama'ya geri çekildi. Bu harekâttaki manevra odağı, Koalisyon'un 1814'teki Paris Yürüyüşü ile karşılaştırıldı. Yine de asilere karşı savaşımız henüz bitmedi..."
  bpm_acw_events.110.d3:0 "Ağır kayıplara rağmen mavi üniformalı çocuklarımız Konfederasyon güçlerini Richmond'dan çıkarmayı başardılar. Ne yazık ki asi hükümet yakalanamadan çoktan kaçmıştı. Topyekûn savaş doktrini generallerimiz arasında övgü topladı ve Konfederasyon'un siper kazıp mevzileneceği korkularının asılsız olduğu kanıtlandı. Yine de son köle özgür kalana dek asilere karşı savaşımız tamamlanmış sayılmaz..."
  bpm_acw_events.110.d4:0 "Yıllar süren çatışmaların ardından mavi üniformalı çocuklarımız Petersburg Kuşatması'nı başarıyla kazandılar; böylece Richmond'ın Konfederasyon'un geri kalanıyla olan bağlantısını kestiler ve şehrin teslim olmasını sağladılar. Konfederasyon Hükümeti ve Ordusu muhtemelen Montgomery'ye taşınmak üzere Batı ve Güney yönünde bir yarma harekâtı yaptı. Ancak kuvvetlerimiz baskıyı sürdürebilirse bu savaş yakında bitecek ve asiler ezilecek!"
  bpm_acw_events.110.f:0 ""Bulunduğunuz yeri bırakma konusundaki isteksizliğinizi belirten mesajınızı gördüm. Ben de istekli değilim. Bir buldozer gibi tutunun ve elinizden geldiğince sıkıştırıp boğun."\n\n—Abraham Lincoln, 1864"
  bpm_acw_events.110.a:0 "Yaşa! Yaşa! Bayramı biz getiriyoruz!"

  bpm_acw_events.111.t:0 "Denize Yürüyüş"
  bpm_acw_events.111.d:0 "Atlanta'yı başarıyla ele geçiren yakışıklı generallerimiz, Güney'in İmparatorluk Eyaleti Georgia'ya yıkıcı bir akın başlattılar. Ordunun Savannah'a varmasıyla birlikte Güney Sanayisi fiilen sona eriyor ve kalıntıları uzakta tütüyor. Bu harekât, bu savaşın topyekûn doğasını ve Güney yaşam tarzını kökten reforme eden topyekûn bir barışın gerekliliğini gözler önüne serdi."
  bpm_acw_events.111.f:0 ""Bulunduğunuz yeri bırakma konusundaki isteksizliğinizi belirten mesajınızı gördüm. Ben de istekli değilim. Bir buldozer gibi tutunun ve elinizden geldiğince sıkıştırıp boğun."\n\n—Abraham Lincoln, 1864"
  bpm_acw_events.111.a:0 "Yaşa! Yaşa! Bayramı biz getiriyoruz!"

  bpm_acw_events.112.t:0 "Konfederasyon Ordusunun Teslimiyeti"
  bpm_acw_events.112.d:0 "Gidecek başka hiçbir yeri kalmayan Konfederasyon generalleri nihayet davalarının nafileliğini anladılar. Kaçış umudu olmaksızın her yönden kuşatılan hainler nihayet silahlarını bıraktılar. Şimdi Güney'deki huzursuzluğu bastırma görevi ve bize verilen anıtsal misyon başlıyor: Bu topraklardaki zulmün ayrık otlarını köklerinden sökmek."
  bpm_acw_events.112.f:0 ""Bulunduğunuz yeri bırakma konusundaki isteksizliğinizi belirten mesajınızı gördüm. Ben de istekli değilim. Bir buldozer gibi tutunun ve elinizden geldiğince sıkıştırıp boğun."\n\n—Abraham Lincoln, 1864"
  bpm_acw_events.112.a:0 "Yaşa! Yaşa! Bayramı biz getiriyoruz!"

  bpm_acw_events.201.t:0 "Ulusal Füzyon Ulusal Kongresi"
  bpm_acw_events.201.d:0 "Devam eden İç Savaş'ın ulusumuzun siyasi sistemi üzerinde baskı yaratmasıyla Başkan, savaş çabası etrafında hem Demokratları hem de Whigleri birleştirmeyi umarak Ulusal Füzyon Partisi'ni kurmaya karar verdi. Bu politikanın kilit noktası Başkan Yardımcısı seçimidir. Mevcut Başkan Yardımcısı Kuzeyli bir Demokrattır ve istendiği takdirde olay çıkarmadan pusuladan ayrılmaya isteklidir. Bu karar hem yeni partiye hem de dünyaya savaş sonrası yeniden birleşme planlarımızın sinyalini verecektir."
  bpm_acw_events.201.f:0 ""Karar Verildi ki: Amerika Birleşik Devletleri Hükümeti'nin İsyancılarla uzlaşmama veya düşmanlıklarının koşulsuz teslimiyeti ile Amerika Birleşik Devletleri Anayasası ve yasalarına adil bağlılıklarına dönüşü haricinde herhangi bir barış şartı sunmama kararlılığını onaylıyoruz..."\n\n—Ulusal Birlik Partisi Programının İkinci Kararı, 1864"
  bpm_acw_events.201.a:0 "Başkan bir Ateş-Yiyen (Fire-Eater) seçerek, köleliğin Birlik genelinde tamamen yayılacağının sinyalini verir."
  bpm_acw_events.201.b:0 "Başkan eski Başkan Yardımcısını koruyarak, "Kendine Has Kurum" üzerinde halk egemenliği politikasının sinyalini verir."
  bpm_acw_events.201.c:0 "Başkan Güneyli bir Whig seçerek, Missouri Uzlaşması'na dönüş sinyali verir."

  bpm_acw_events.202.t:0 "Çıngıraklı Yılan Vuruyor"
  bpm_acw_events.202.d:0 "Büyük kan dökülmesinin ardından ordumuz sözde "Özgür Eyaletleri" başarıyla güvence altına aldı. Bu sadece açık ayaklanmayı sona erdirmekle kalmadı, aynı zamanda Brown'ın akıncılarını üçe bölünmeye zorladı; bazıları Batı'ya gitti, diğerleri Kuzey'e yöneldi ve daha fazlası Appalachian Dağları'nda saklanıyor. Seçkinlerimiz köle ayaklanmasının yenilgisinden memnun ve genişleme planlarımızın arkasında toplanıyor."
  bpm_acw_events.202.f:0 ""Bulunduğunuz yeri bırakma konusundaki isteksizliğinizi belirten mesajınızı gördüm. Ben de istekli değilim. Bir buldozer gibi tutunun ve elinizden geldiğince sıkıştırıp boğun."\n\n—Abraham Lincoln, 1864"
  bpm_acw_events.202.a:0 "Yaşa! Yaşa! Bayramı biz getiriyoruz!"

  bpm_acw_events.203.t:0 "Habeas Corpus'un Askıya Alınması Emri"
  bpm_acw_events.203.d:0 "Kaos ve isyan yalnızca asi eyaletlerde değil, aynı zamanda Orta Atlantik limanlarında ve başkente giden demiryolu hatlarında da yaygındır. Hainler hükümet merkezimizin takviye edilmesini engellemekle ve Kongre'nin toplanmasını geciktirmekle tehdit ediyor. Bunu çözmek için hükümetimizin güvenliğini garanti altına almak amacıyla kilit bölgelerde ihzar müzekkeresini (habeas corpus) askıya alabiliriz. Bu, ne yasama ne de yargı tarafından onaylanması muhtemel olmayan oldukça tartışmalı bir hamle olacaktır. Ancak böylesi bir emrin uygulanması polis yetkilerimizi güçlendirecek ve isyan bastırıldıktan sonra Birliği yeniden birleştirmek için daha büyük adımlar atmamızı sağlayacaktır."
  bpm_acw_events.203.f:0 ""Amerika Birleşik Devletleri yasalarına karşı bir ayaklanmayı bastırmakla görevlendirildiniz. Philadelphia şehri ile Washington şehri arasında şu anda kullanılan veya kullanılacak olan herhangi bir askeri hat üzerinde veya yakınında kamu güvenliği için ihzar müzekkeresini askıya almayı gerektiren bir direnişle karşılaşırsanız, şahsen veya direnişin gerçekleştiği noktadaki komutan subay aracılığıyla bu müzekkereyi askıya alma yetkisine sahipsiniz."\n\n—Abraham Lincoln, 1861"
  bpm_acw_events.203.a:0 "Yasama onayı olmadan bu adımı atamayız."
  bpm_acw_events.203.b:0 "Bana tiran diyecekler ama bu emir demokrasiyi korumak için. Emri çıkarın!"
  
  bpm_acw_events.204.t:0 "Yasal Ödeme Araçları Yasaları"
  bpm_acw_events.204.d:0 "Bu savaşı finanse etmek için Kongre ilk olarak altın karşılığı olan ve bu nedenle değerleri için madeni para stoklarımıza dayanan Talep Senetlerinin basılmasına izin vermişti. Bu savaş ikinci yılına girerken, bu çatışmayı artık madeni para standardında finanse etmeye devam edemeyeceğimiz açıktır. Davamıza sempati duyan iş adamları kağıt para basılmasını önerdiler. Böylesi bir hamle bol miktarda altın rezervine sahip olan Batı Eyaletlerini üzecektir ancak bu savaşı kazanmak için tedarikçilerimize ve askerlerimize ödeme yapmaya devam etmemiz gerekiyor."
  bpm_acw_events.204.f:0 ""Yeşil banknotların üzerine bir yazı koyacaksanız, Petrus ve Pavlus'unkini öneririm: 'Gümüşüm ve altınım yok ama bende olanı sana veriyorum.'"\n\n—Abraham Lincoln, 1862"
  bpm_acw_events.204.a:0 "Bir pilot program başlatacağız ancak Kıta Doları'nın hatalarını tekrarlamayacağız."
  bpm_acw_events.204.b:0 "Kongre'yi bu itibari paranın kitlesel olarak basılmasına izin verecek Yasaları geçirmeye teşvik edeceğiz."
  
  bpm_acw_events.205.t:0 "Askere Alma Yasası"
  bpm_acw_events.205.d:0 "Bu lanet savaş devam ettikçe, yeni asker ihtiyacımız giderek artıyor. Daha önce milislerimizi doldurmak için vatandaşlarımızın vatanseverliğine güvenebiliyorduk ancak savaş yorgunluğu sayımızı tüketti ve plantasyon aristokrasisine duyulan şüphe küçük çiftçilerin orduya katılmasını engelledi. Birlik uğruna evrensel erkek zorunlu askerliğini uygulamak artık gerekli olabilir. Bu durum şüphesiz Whiglerin barış yanlısı fraksiyonları arasında ve zenginler için tanınan istisnaları adaletsiz görecek olan yoksullar arasında öfkeye yol açacaktır. Ancak bu savaşı çabuk bitirmek istiyorsak, kaynağı ne olursa olsun daha fazla savaşçıya ihtiyacımız olacak."
  bpm_acw_events.205.f:0 ""Aynı anda bir isyanla başa çıkmak, rahatça idare edebileceğimiz kadardır."\n\n—Abraham Lincoln, 1863"
  bpm_acw_events.205.a:0 "Bu savaşı Kurucu Babalarımızın kendi savaşlarını verdiği gibi vereceğiz. Zorunlu askerlik getirmeyin."
  bpm_acw_events.205.b:0 "Bazıları başkalarının yerine yapacak olsa bile her erkek görevini yapmalıdır. Kongre'nin zorunlu askerliği onaylamasını sağlayın."
  
  bpm_acw_events.206.t:0 "Dönüm Noktasında"
  bpm_acw_events.206.d1:0 "Ulusumuz varlığının dönüm noktasına yaklaşırken, Ulusal Füzyon Partisi de öyle. Yasalar ve Başkan Yardımcılığı konusundaki radikal kararlarımız yalnızca Savaş Whiglerinin bizi terk etmesine yol açmakla kalmadı, aynı zamanda Stephen F. Douglas'ın Genç Amerikalılarının Barış Whigleri ile birleşmesine neden oldu. Bu, kazanmamız pek olası olmayan acımasız bir seçim dönemi olacak. İyi şanslar Sayın Başkan."
  bpm_acw_events.206.d2:0 "Ulusumuz varlığının dönüm noktasına yaklaşırken, Ulusal Füzyon Partisi de öyle. Yasalar ve Başkan Yardımcılığı konusundaki tartışmalı kararlarımız, gizli hain kardeşleriyle uzlaşan Savaş Whiglerini safımızdan uzaklaştırdı. Bu seçim zor olacak Sayın Başkan, ancak sıkı kampanya yürütürsek kazanılabilir. Sadece bunun sizi savaştan alıkoymasına izin vermeyin."
  bpm_acw_events.206.d3:0 "Ulusumuz varlığının dönüm noktasına yaklaşırken, Ulusal Füzyon Partisi de öyle. Büyük çabalar sonucunda Savaş Whigleri, Genç Amerikalılar ve Ateş-Yiyenlerden oluşan bir koalisyonu başarıyla birleştirdik. Dahası, yeni bir gıyabi oy sistemi askerlerin bu anıtsal kararda söz sahibi olmasını garanti edecek. Büyük bir hata olmazsa bu seçim sizin zaferinize doğru ilerliyor Sayın Başkan."
  bpm_acw_events.206.d4:0 "Ulusumuz varlığının dönüm noktasına yaklaşırken, Ulusal Füzyon Partisi de öyle. Uzlaşma ve kararlılıkla devlet gemisini en büyük sınavından geçirdiniz. Bütün hiziplerden Demokratlar ve Whigler Ulusal Füzyon Sancağı altında toplanıyor ve bazıları her seçici oyu kazanacağınızı tahmin ediyor. Yalnızca Washington ile kıyaslanabilecek böylesi bir başarı, parlak yönetiminize yakışır Sayın Başkan."
  bpm_acw_events.206.f:0 ""Asıl biz yaşayanlar, burada savaşanların şimdiye kadar bu denli asilce ilerlettiği bitmemiş işe kendimizi adamalıyız. Önümüzde duran büyük göreve kendimizi adamalıyız ki; bu şerefli ölülerden, onların son tam bağlılık ölçüsünü verdikleri davaya daha büyük bir bağlılık çıkaralım -- bu ölülerin boşuna ölmediğine burada kesin bir dille ant içelim -- Tanrı'nın altındaki bu ulusun yeni bir özgürlük doğuşuna sahip olacağını -- ve halkın, halk tarafından, halk için olan hükümetinin yeryüzünden silinmeyeceğini ilan edelim.", 1863"
  bpm_acw_events.206.a:0 "Dere geçerken at değiştirilmez!"

  bpm_acw_events.207.t1:0 "Barış Whigleri Zafer Kazandı"
  bpm_acw_events.207.t2:0 "Demokratlar Zafer Kazandı"
  bpm_acw_events.207.d1:0 "Tüm çabalarımıza rağmen seçimi kaybettik. Yenilgimizle Birlik hayali ölüyor; zira rakibimizin kampanya vaatleri ne olursa olsun Whig Partisi'ndeki Barış Fraksiyonu barış müzakerelerinde kesinlikle kolay çözümü arayacaktır. Artık sadece hem Kuzeyli hem de Güneyli yurttaşları tarafından ihanete uğrayan amaçsız ölüler için yas tutabiliriz."
  bpm_acw_events.207.d2:0 "Sınavlardan ve badirelerden daha güçlü çıktık. Barış Whigleri mağlup edildi ve arkamızda sadece Kölelik Karşıtlarını yenmek için değil, aynı zamanda ulusumuzun şanı için büyük bir Sefer başlatmak için de bir yetki var. Yakında büyük bir Altın Çember (Golden Circle) oluşturacağız ve onun içinde Yeryüzündeki Cennetimizi inşa edeceğiz."
  bpm_acw_events.207.f:0 ""Seçim bir zorunluluktu. Seçimler olmadan özgür bir hükümete sahip olamayız; ve eğer isyan bizi ulusal bir seçimden vazgeçmeye veya ertelemeye zorlayabilseydi, bizi çoktan fethetmiş ve mahvetmiş olduğunu haklı olarak iddia edebilirdi."\n\n—Abraham Lincoln, 1864"
  bpm_acw_events.207.a:0 "Kurucu Babaları hayal kırıklığına uğrattık ve ulusumuzu rezil ettik."
  bpm_acw_events.207.b:0 "Tepedeki bir imparatorluk"

  bpm_acw_events.208.t:0 "Büyük Uzlaşma"
  bpm_acw_events.208.d:0 "Kışkırtıcılara ve ırk hainlerine karşı kazandığımız zaferin güvence altına alınmasıyla İkinci bir Anayasa Konvansiyonu topladık. Başkan Yardımcımızın liderliğinde delegeler Köleliği şimdi ve sonsuza dek Anayasaya kazıdılar. Tartışmalar şimdi Kuzey'i Güney'e sonsuza kadar bağlayacak Büyük bir Uzlaşma'nın hazırlanmasına yöneldi. Birçok vaat ve tehdidin ardından Kuzeyli temsilciler reformdan geçirilmiş Anayasayı geçici olarak kabul ettiler. Şimdi geriye sadece Brown'ın Ordusu'nun kalıntılarını temizlemek, Güneye dönmek ve güneşteki yerimizi talep etmek kalıyor!"
  bpm_acw_events.208.f:0 ""Yüklen Beyaz Adamın yükünü—\nYolla soyunun en iyilerini—\nBağla oğullarını sürgüne\nEsirlerinin hizmetine;\nAğır koşumlar altında beklemeye\nÜrkek ve vahşi halklar için—\nYeni yakalanmış, somurtkan kavimlerin,\nYarısı şeytan, yarısı çocuk."\n\n—Rudyard Kipling, 1899"
  bpm_acw_events.208.a:0 "Dünya hak iddia etmemiz için bizi bekliyor."

  bpm_acw_events.209.t:0 "Hampton Roads Konferansı"
  bpm_acw_events.209.d:0 "Yeni Başkomutan, Hampton Roads Barış Konferansı'ndan bir barış antlaşmasıyla döndü. Beklediğimiz gibi belgenin her maddesinde boyun eğmişler; kaçan kölelerin peşine düşmeme, ayrılan eyaletlerden tamamen çekilme ve Özgür Eyaletleri tanıma sözü vermişler."
  bpm_acw_events.209.f:0 ""Barışa gelince, daha önce söyledim ve şimdi tekrar ediyorum; üç şey vazgeçilmezdir.\n\n1. Tüm Eyaletlerde ulusal otoritenin yeniden tesis edilmesi.\n\n2. Kongre'ye sunulan son Yıllık Mesajda ve önceki belgelerde kölelik sorunu konusunda alınan pozisyondan Amerika Birleşik Devletleri İcrası tarafından geri adım atılmaması.\n\n3. Savaşın sona ermesi ve hükümete düşman olan tüm güçlerin dağıtılması dışında hiçbir düşmanlığın durdurulmaması."\n\n—Abraham Lincoln, 1865"
  bpm_acw_events.209.a:0 "Son hançer de bıçağını saplıyor."

