l_turkish:
  je_pedro_brazil_reason: "#bold İlerleme Çubuğunun#! durumu, çeşitli #tooltippable;tooltip:[Country.GetTooltipTag],je_pedro_special_tooltip_advance olumlu#! veya #tooltippable;tooltip:[Country.GetTooltipTag],je_pedro_special_tooltip_deplete olumsuz#! koşullara göre belirlenecektir. #bold İlerleme Çubuğunun#! #bold 0#!'a ulaşması, İmparatorun saltanatının sona ermesine ve oligarşik bir #bold Cumhuriyetin#! ilan edilmesine yol açacaktır.\n\n[SCOPE.sCountry('brazil_scope').GetName] İmparatorluğunun ikinci hükümdarı olan İmparator [SCOPE.sCountry('brazil_scope').GetRuler.GetFullName], babasının tahttan feragat etmesinin ardından erken yaşta bu role itilmiştir. II. Pedro, demokratik yönetimi sürdürmeyi ve anayasanın sağladığı sivil özgürlükleri korumayı, aynı zamanda Brezilya'yı lekeleyen kölelik kurumuna nihayet son vermeyi arzulamaktadır.\n\n@warning! Eğer gerçekleşirse, cumhuriyetçi darbeye direnebilmek için ilerleme çubuğunda en az 3 puana sahip olmak ve başkent Rio de Janeiro'yu elde tutmak gerekir."
  je_pedro_special_tooltip_deplete: "Aşağıdaki koşullar #bold İlerleme Çubuğunu#! #bold azaltacaktır#!:\n• II. Pedro'nun erkek varislerinin ölmesi\n• II. Pedro'nun sağlığının kötüleşmesi\n• Cumhuriyetçi Teklif'in reddedilmesi veya başarısız olması\n• Brezilya'nın [GetLawType('law_slavery_banned').GetName] yasasına sahip olması\n• [GetInterestGroupVariant('ig_armed_forces',GetPlayer).GetNameWithCountryVariant] veya [GetInterestGroupVariant('ig_landowners',GetPlayer).GetNameWithCountryVariant] gruplarının [concept_powerful] (güçlü) olması ve [concept_in_government] (hükümette) olmaması\n• Brezilya'nın [GetLawType('law_tenant_farmers').GetName] veya [GetLawType('law_serfdom').GetName] yasasına sahip olmaması\n• #bold Ragamuffin Savaşı#! adlı [concept_journal_entry] kaydında başarısız olunması\n• #bold Brezilya Ulusunu Entegre Etmek#! adlı [concept_journal_entry] kaydında başarısız olunması\n• Brezilya'nın [concept_default] (temerrüt) durumunda olması veya [concept_bankruptcy] (iflas) ilan etmesi\n• Herhangi bir [concept_revolution] ilerlemesinin #variable %80#!'in üzerine çıkması"


 # Age of Caudillos
 je_caudillo_reason: "#bold İlerleme Çubuğunun#! durumu, çeşitli #tooltippable;tooltip:[Country.GetTooltipTag],je_caudillo_special_tooltip_advance olumlu#! veya #tooltippable;tooltip:[Country.GetTooltipTag],je_caudillo_special_tooltip_deplete olumsuz#! koşullara göre belirlenecektir. #bold İlerleme Çubuğunun#! #bold 100#!'e ulaşması, [SCOPE.sCountry('caudillo_country_scope').GetName] içindeki askeri liderlerin (diktatörlerin) gücünü sağlamlaştıracaktır. Gelecek ay, #bold İlerleme Çubuğu#! #variable [Country.MakeScope.Var('caudillo_next').GetValue|+=]#! oranında değişecektir.\n\nİlerleme çubuğunu tüketmek (sıfırlamak) ve [Concept('concept_bpm_ig_is_anti_democratic', '$concept_bpm_ig_is_anti_democratic$')] [Concept('concept_interest_group','$concept_interest_groups$')] gruplarını hükümet dışında tutmak, [GetInterestGroupVariant('ig_armed_forces',GetPlayer).GetNameWithCountryVariant] içindeki #bold Caudillo'luğu (Caudillismo)#! yok edecek ve ülkedeki askeri diktatör tehdidini sona erdirecektir.\n\n#italic İspanya'dan bağımsızlığımızı kazanmamızın ardından, dağıtılan sömürge hükümetlerinin yerinde karizmatik askeri liderler tarafından hızla doldurulan bir güç boşluğu kaldı. Bu "caudillo"lar, Güney Amerika siyasetinin büyük bir bölümünü tanımlar hale geldi.#!"
 je_caudillo_special_tooltip_advance: "[concept_journal_entry], ilerleme çubuğu tamamen dolduğunda veya boşaldığında sona erecektir. \n\nBu faktörlerin #bold her biri#!, ilerleme çubuğunu #bold ayda 1 artıracaktır#!:\n• [Concept('concept_bpm_ig_is_anti_democratic', '$concept_bpm_ig_is_anti_democratic$')] bir [Concept('concept_interest_group','$concept_interest_groups$')] grubunun [concept_powerful] (güçlü) olması\n• [Concept('concept_bpm_ig_is_anti_democratic', '$concept_bpm_ig_is_anti_democratic$')] bir [Concept('concept_interest_group','$concept_interest_groups$')] grubunun [concept_in_government] (hükümette) olması\n• [GetLawType('law_autocracy').GetName], [GetLawType('law_oligarchy').GetName], [GetLawType('law_technocracy').GetName] veya [GetLawType('law_military_junta').GetName] yasalarından birine sahip olmamız\n• [Concept('concept_popularity','Sevilen')] bir [concept_general] veya [concept_admiral] bulunması\n• #bold Otoriter#! ideolojiye sahip bir [concept_ruler] bulunması"
 je_caudillo_special_tooltip_deplete: "Aşağıdaki faktörlerin #bold her biri#!, ilerleme çubuğunu #bold ayda 1 azaltacaktır#!:\n• [Concept('concept_bpm_ig_is_anti_democratic', '$concept_bpm_ig_is_anti_democratic$')] bir [Concept('concept_interest_group','$concept_interest_groups$')] grubunun [concept_marginalized] (marjinalleşmiş) olması\n• [Concept('concept_bpm_ig_is_anti_democratic', '$concept_bpm_ig_is_anti_democratic$')] bir [Concept('concept_interest_group','$concept_interest_groups$')] grubunun [concept_in_government] (hükümette) olmaması\n• [GetLawType('law_census_voting').GetName] veya [GetLawType('law_universal_suffrage').GetName] yasalarından birine sahip olmamız\n• [GetLawType('law_autocracy').GetName], [GetLawType('law_oligarchy').GetName], [GetLawType('law_technocracy').GetName] ve [GetLawType('law_military_junta').GetName] yasalarını onaylamayan, herhangi bir [concept_powerful] çıkar grubuna mensup [Concept('concept_popularity','sevilen')] bir [concept_politician] bulunması\n• [GetLawType('law_purchased_officers').GetName] yasasına sahip olmamamız"

