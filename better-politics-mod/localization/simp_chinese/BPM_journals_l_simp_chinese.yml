 je_bpm_zapadniks_and_slavophiles:0 "西方派与斯拉夫派"
 je_bpm_zapadniks_and_slavophiles_status:0 "监测这两种哲学的辩论。"
 je_bpm_zapadniks_and_slavophiles_zapadnik_prominence:0 "$bpm_je_all_zapadnik$思想在俄国知识分子中占主导"
 je_bpm_zapadniks_and_slavophiles_no_prominence:0 "$bpm_je_all_slavophile$与$bpm_je_all_zapadnik$思想在俄国知识分子中同样流行"
 je_bpm_zapadniks_and_slavophiles_slavophile_prominence:0 "$bpm_je_all_slavophile$思想在俄国知识分子中占主导"
 je_bpm_zapadniks_and_slavophiles_reason:0 "彼得大帝是谁？对一些人而言，他是一位伟人，一位不可思议的改革者，他利用西方之精华将俄国带出往日的黑暗与腐朽，为未来的挑战进行现代化改造。对另一些人而言，他则是民族悲剧的根源，一个竟敢将异质文明中不相容的价值观移植到俄国主权精神之上的愚人。诚然，他个人的形象并非让此后数十年主导俄国知识界的两大哲学流派——西方派与斯拉夫派——产生分歧的唯一因素。\n\n$bpm_je_all_zapadniks$是俄国知识界中的一股思潮，他们渴望效仿西方，从中汲取他们眼中最优秀的创新——自由主义、民主、人权与经济自由——以使俄国摆脱其落后的境地，追随他们伟大民族英雄彼得大帝的脚步。\n\n$bpm_je_all_slavophiles$是与西方派对立的思潮——他们相信，俄国的民族精神已被西方影响践踏得太过，而它过于自我、世俗和革命，无法与集体主义、基督教和忠君的俄国精神相契合。\n\n本日志条目代表这两种立场在俄国学术界心中相对彼此的影响力。若其中任何一方占据上风，你将在多个研究领域获得按比例调整的修正——更强大的$bpm_je_all_slavophiles$将带来更快的#bold 军事#!与#bold 工业#!研究，而$bpm_je_all_zapadniks$则会将注意力转向#bold 科技传播#!与#bold 社会#!研究。$bpm_je_all_slavophiles$与$bpm_je_all_zapadniks$各自的[Concept('concept_leader', '利益集团领袖')]和[Concept('concept_agitator', '煽动者')]的人气将决定各方的受欢迎程度，而其热忱会随着时间不可避免地消退。在当前情况下，本日志条目预计以#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_zapadniks_and_slavophiles_rate_tooltip [Country.MakeScope.ScriptValue('bpm_je_zapadniks_and_slavophiles_rate')|+]#!每周的速率推进。\n\n#lore “过去三百年，俄国一直渴望与西方融合；过去三百年，它一直承认自己劣于西方，从西方汲取了它所有的思想、所有的学说……我们最伟大的君王……背弃了旧俄国。他扫除了我们所有古老的制度，抛弃了我们古老的传统……你必须承认，这是辉煌的，彼得大帝的创造，这个天才人物的理念，他为我们此后所走的道路指明了方向。”\n\n——彼得·恰达耶夫，1837#!"
 bpm_je_all_zapadniks:0 "@ig_liberals! @ig_radicals! @ig_socialists! #bold 西方派#!"
 bpm_je_all_zapadnik:0 "@ig_liberals! @ig_radicals! @ig_socialists! #bold 西方派#!"
 bpm_je_all_slavophiles:0 "@ig_conservatives! @ig_reactionaries! #bold 斯拉夫派#!"
 bpm_je_all_slavophile:0 "@ig_conservatives! @ig_reactionaries! #bold 斯拉夫派#!"
 bpm_journal_zapadniks_and_slavophiles_stagnant:0 "本日志条目的进度停滞在#bold 50#!，而其变化速率为#bold 0#!"
