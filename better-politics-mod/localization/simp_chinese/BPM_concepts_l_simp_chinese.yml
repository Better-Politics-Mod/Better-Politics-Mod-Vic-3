 tooltip_bpm_ig_is_isolationist:0 "是一个[Concept('concept_bpm_ig_is_isolationist', '$concept_bpm_ig_is_isolationist$')][Concept('concept_interest_group', '利益集团')]"
 concept_bpm_ig_is_isolationist:0 "孤立主义者"
 concept_bpm_ig_is_isolationist_desc:0 "拥有[GetIdeology('ideology_eco_autarky').GetName]、[GetIdeology('ideology_eco_trad_isolationist').GetName]、[GetIdeology('ideology_eco_socialist_autarky').GetName]或[GetIdeology('ideology_eco_agrarian_autarky').GetName][Concept('concept_ideology', '意识形态')]的[Concept('concept_interest_group', '利益集团')]。他们认为专注孤立主义与自力更生是发展经济和国家整体的恰当途径。"
 tooltip_bpm_ig_is_hawkish:0 "是一个[Concept('concept_bpm_ig_is_hawkish', '$concept_bpm_ig_is_hawkish$')][Concept('concept_interest_group', '利益集团')]"
 concept_bpm_ig_is_hawkish:0 "鹰派"
 concept_bpm_ig_is_hawkish_desc:0 "一个[Concept('concept_bpm_ig_is_very_hawkish', '$concept_bpm_ig_is_very_hawkish$')]或拥有[GetIdeology('ideology_mil_patriotic').GetName]、[GetIdeology('ideology_mil_mass_army').GetName]或[GetIdeology('ideology_mil_institutional_militarist').GetName][Concept('concept_ideology', '意识形态')]的[Concept('concept_interest_group', '利益集团')]。他们信奉沙文主义的外交政策，宁愿用军事手段而非外交来解决国际问题。"
 tooltip_bpm_ig_is_very_hawkish:0 "是一个[Concept('concept_bpm_ig_is_very_hawkish', '$concept_bpm_ig_is_very_hawkish$')][Concept('concept_interest_group', '利益集团')]"
 concept_bpm_ig_is_very_hawkish:0 "极端鹰派"
 concept_bpm_ig_is_very_hawkish_desc:0 "拥有[GetIdeology('ideology_jingoist').GetName]或[GetIdeology('ideology_mil_ultramilitarist').GetName][Concept('concept_ideology', '意识形态')]的[Concept('concept_interest_group', '利益集团')]。他们认为一切外交问题都应当主要靠武力来解决。"
 tooltip_bpm_ig_is_doveish:0 "是一个[Concept('concept_bpm_ig_is_doveish', '$concept_bpm_ig_is_doveish$')][Concept('concept_interest_group', '利益集团')]"
 concept_bpm_ig_is_doveish:0 "鸽派"
 concept_bpm_ig_is_doveish_desc:0 "拥有[GetIdeology('ideology_mil_patriotic_liberal').GetName]、[GetIdeology('ideology_mil_defensive_patriot').GetName]、[GetIdeology('ideology_mil_popular_army').GetName]或[GetIdeology('ideology_mil_antimilitarist').GetName][Concept('concept_ideology', '意识形态')]的[Concept('concept_interest_group', '利益集团')]。他们认为外交问题应当主要通过外交手段来解决。"
 tooltip_bpm_ig_is_unpopular:0 "是一个[Concept('concept_bpm_ig_is_unpopular', '$concept_bpm_ig_is_unpopular$')][Concept('concept_interest_group', '利益集团')]"
 concept_bpm_ig_is_unpopular:0 "不受欢迎"
 concept_bpm_ig_is_unpopular_desc:0 "一个[Concept('concept_interest_group', '利益集团')]若既非[Concept('concept_bpm_ig_is_popular', '$concept_bpm_ig_is_popular$')]也非[Concept('concept_bpm_ig_is_prominent', '$concept_bpm_ig_is_prominent$')]，则被视为#bold 不受欢迎#!。"
 tooltip_bpm_ig_is_popular:0 "是一个[Concept('concept_bpm_ig_is_popular', '$concept_bpm_ig_is_popular$')][Concept('concept_interest_group', '利益集团')]"
 concept_bpm_ig_is_popular:0 "受欢迎"
 concept_bpm_ig_is_popular_desc:0 "一个[Concept('concept_interest_group', '利益集团')]若其支持者占总人口的比例超过1%，则被视为#bold 受欢迎#!。"
 tooltip_bpm_ig_is_prominent:0 "是一个[Concept('concept_bpm_ig_is_prominent', '$concept_bpm_ig_is_prominent$')][Concept('concept_interest_group', '利益集团')]"
 concept_bpm_ig_is_prominent:0 "显赫"
 concept_bpm_ig_is_prominent_desc:0 "一个[Concept('concept_interest_group', '利益集团')]若其支持者占总人口的比例超过10%，则被视为#bold 显赫#!。"
 tooltip_bpm_country_proletarian_are_popular:0 "总人口中超过5%属于[Concept('concept_bpm_ig_is_proletarian','无产阶级利益集团')]（当前为[GetPlayer.MakeScope.ScriptValue('bpm_proletarian_popularity')|%]）"
 concept_bpm_country_proletarian_are_popular:0 "无产阶级组织受欢迎"
 concept_bpm_country_proletarian_are_popular_desc:0 "若总人口中超过5%属于[Concept('concept_bpm_ig_is_socialist','社会主义利益集团')]，则无产阶级组织被视为受欢迎。"
 concept_extremist:0 "反建制"
 concept_extremist_desc:0 "反对我国当前体制的[Concept('concept_interest_group', '利益集团')]。"
 concept_super_extremist:0 "极端主义"
 concept_super_extremist_desc:0 "在我国[concept_country]体面政治的界限之外运作的[Concept('concept_interest_group', '利益集团')]。"
 concept_bpm_law_support:0 "法律支持度"
 concept_bpm_law_support_desc:0 "立法机构中对[Concept('concept_law', '法律')]获得颁布的支持程度。这决定了一个[Concept('concept_interest_group', '利益集团')]会支持还是反对某项法律。"
 concept_bpm_cabinet:0 "内阁"
 concept_bpm_cabinet_desc:0 "内阁是由政府高层成员组成的机构，代表行政分支。它由各政府部门的首脑组成，负责政府的日常行政事务。"
 concept_bpm_ministerial_appointment:0 "部长任命"
 concept_bpm_ministerial_appointment_desc:0 "以[Concept('concept_bpm_minister', '部长')]身份被任命到[concept_bpm_cabinet]中的一个职位。"
 concept_bpm_minister:0 "部长"
 concept_bpm_minister_desc:0 "部长是被任命到[concept_bpm_cabinet]以监督某个[Concept('concept_institution', '制度')]运作的人物。根据其[Concept('concept_interest_group', '利益集团')]和该制度的投入等级，他们会带来独特的益处与弊端。"
 concept_bpm_mandate:0 "委任"
 concept_bpm_mandate_desc:0 "委任源自[Concept('concept_in_government','政府')][concept_clout]，并受#yellow 行政原则#!法律的加权，在你各[Concept('concept_interest_group', '利益集团')]之间分配，可用于[Concept('concept_bpm_ministerial_appointment','任命部长')]。某些[Concept('concept_interest_group', '利益集团')]更适合某些[Concept('concept_institution', '部门')]，指派时所需消耗的委任更少。"
 concept_bpm_minister_skill:0 "部长技能等级"
 concept_bpm_minister_skill_desc:0 "[concept_bpm_minister]技能由其[Concept('concept_character_trait','性格特质')]决定，影响其[Concept('concept_institution', '部门')]的最大投入等级：\n @arrow_up! #yellow 专家#![Concept('concept_bpm_minister','部长')]#P 提高#!其[Concept('concept_institution', '部门')]最大投入等级 #v 1#!\n @arrow_down! #yellow 无能#![Concept('concept_bpm_minister','部长')]#N 降低#!其[Concept('concept_institution', '部门')]最大投入等级 #v 1#!\n\n#v 任命部长时将选择可用的#yellow 技能最高#!候选人。#!\n开放、民主的国家拥有技能范围更广的候选人，而威权或传统主义国家可能难以找到任何有用之才。"
 concept_bpm_head_of_government:0 "政府首脑"
 concept_bpm_head_of_government_possessive:0 "政府首脑的"
 concept_bpm_head_of_government_desc:0 "政府首脑是政府行政分支中最有权力的官员，也是你各[Concept('concept_bpm_minister','部长')]之首。在一些国家，这是由国王或总统任命的首相；而在另一些国家，政府首脑与国家元首是同一人。"
 concept_bpm_regent:0 "摄政"
 concept_bpm_regent_desc:0 "当[concept_ruler]无法亲政时，[concept_bpm_regent]代其执政。在[Concept('concept_ruler','$concept_ruler_possessive$')]未成年或其他不能亲政期间，摄政将代[Concept('concept_ruler','$concept_ruler_possessive$')]决定否决哪些法律。"
 concept_bpm_acting_hog:0 "代理政府首脑"
 concept_bpm_acting_hog_possessive:0 "代理政府首脑的"
 concept_bpm_acting_hog_desc:0 "当[concept_bpm_head_of_government]无法亲政时，代理[concept_bpm_head_of_government]代其执政。在[Concept('concept_bpm_head_of_government','$concept_bpm_head_of_government_possessive$')]未成年或其他不能亲政期间，代理[concept_bpm_head_of_government]将代[Concept('concept_bpm_head_of_government','$concept_bpm_head_of_government_possessive$')]决定否决哪些法律。"
 tooltip_bpm_ig_is_autocratic:0 "是[Concept('concept_bpm_ig_is_autocratic', '$concept_bpm_ig_is_monarchist$')][Concept('concept_interest_group', '利益集团')]"
 concept_bpm_ig_is_autocratic:0 "极端性别主义者"
 concept_bpm_ig_is_autocratic_desc:0 "这个[Concept('concept_interest_group', '利益集团')]信奉[GetIdeology('ideology_dop_technocrat').GetName]、[GetIdeology('ideology_dop_meritocratic_autocrat').GetName]、[GetIdeology('ideology_dop_meritocratic_autocrat').GetName]、[GetIdeology('ideology_dop_party_state').GetName]、[GetIdeology('ideology_dop_party_socialist').GetName]、[GetIdeology('ideology_dop_dissent').GetName]、[GetIdeology('ideology_dop_traditional_power').GetName]、[GetIdeology('ideology_dop_oligarch').GetName]或[GetIdeology('ideology_dop_autocrat').GetName][Concept('concept_ideology', '意识形态')]。"
 concept_bpm_ig_is_non_paternal_conserative:0 "Non-Paternal Conservative"
 concept_bpm_ig_is_non_paternal_conserative_desc:0 "The @ig_conservatives! #bold Conservatives#! [Concept('concept_interest_group', 'Interest Group')] that don't hold paternalist ideals."
 concept_bpm_ig_is_tooltip_bpm_ig_is_hawkish:0 "Hawk"
 concept_bpm_ig_is_tooltip_bpm_ig_is_hawkish_desc:0 "An [Concept('concept_interest_group', 'Interest Group')] that is either [Concept('concept_bpm_ig_is_tooltip_bpm_ig_is_very_hawkish', '$concept_bpm_ig_is_tooltip_bpm_ig_is_very_hawkish$')] or has the [GetIdeology('ideology_mil_patriotic').GetName], the [GetIdeology('ideology_mil_mass_army').GetName], or the [GetIdeology('ideology_mil_institutional_militarist').GetName] [Concept('concept_ideology', 'Ideology')]. They believe in a jingoistic foreign policy, preferring military solutions to diplomatic questions."
