 je_bpm_the_holy_see_sees_reason: "#bold #tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_encyclical_progress_values Genelgenin İlerleme Değerleri#!#!\n#bold #tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_encyclical_progress_effects Genelgenin Neden Olabileceği Potansiyel Etkiler#!#!\n\n#bold Mevcut #gold Papa#!:#! #v [GetPlayer.GetCustom('bpm_papal_name_global_variable')]#!\n#bold Mevcut #gold Papalık İdeolojisi#!:#! #v [GetPlayer.GetCustom('bpm_personal_papal_ideology_global_variable')]#!\n\nZaman ve dünya sürekli değişiyor, ancak bu eski figürlerin, şeylerin ve fikirlerin değiştiği anlamına gelmiyor. #bold Katolik Kilisesi#!, ve hepsinden öte onun kalbi ve aklı olan — #v #gold Kutsal Makam#!#! için de durum böyledir. Eğer #bold Katolik Kilisesi#! bu değişen zamanlarda sebat etmek istiyorsa, küresel değişimlere de yanıt vermelidir.\n\nBu [concept_journal_entry], hızla değişen modern dünyayı #bold gören#! ve eski fikirleri yeniden tasdik ederek yeni modern tehditlere renkli tepkiler veren #v Kutsal Makamın#! sürecini takip eder. Çeşitli #v Genelgeler#! ve yaratılışlarının ilerlemesi, neyin cevaplandırıldığına ve yaratılışına yönelik değerlerin ne olduğuna bağlı olacaktır."

