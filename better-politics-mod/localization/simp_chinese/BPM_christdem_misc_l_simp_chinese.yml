 bpm_new_wine_old_wineskins_flavour.1.t:0 "并非醋"
 bpm_new_wine_old_wineskins_flavour.1.d:0 "@ig_christian_democrats! 基督教民主主义者现身政坛，以及他们与@ig_conservatives! 古典保守主义者之间不可避免的政治战争，导致了后者的衰落与被吞并。但随着基督教民主主义者扩张，更为保守的群体将正式脱离，并更独立地自行发展。"
 bpm_new_wine_old_wineskins_flavour.1.f:0 "这新酒委实妙不可言，其醇美远胜旧酒。我颇感欣慰，那陈腐苦涩的酒终于被某种清新而鲜活之物所取代。"
 bpm_new_wine_old_wineskins_flavour.1.a:0 "不再孤单。"
 bpm_new_wine_old_wineskins_flavour.2.t:0 "镀金，而非真金"
 bpm_new_wine_old_wineskins_flavour.2.d:0 "@ig_christian_democrats! 基督教民主主义者的崛起，遭到老派@ig_conservatives! 古典保守主义者的强力遏制，后者最终击败了新思潮，将其削弱为单纯的社会行动。今后与未来的统治，将由阶级合作、家长主义和审慎的发展来引导。"
 bpm_new_wine_old_wineskins_flavour.2.f:0 "我曾对这新酒寄予厚望，却大失所望。口感尚可，然镀金而非真金，既无法令人惊艳，也无法征服味蕾。"
 bpm_new_wine_old_wineskins_flavour.2.a:0 "正如教皇所愿。"
 bpm_new_wine_old_wineskins_flavour.3.t:0 "油与水"
 bpm_new_wine_old_wineskins_flavour.3.d:0 "@ig_christian_democrats! 基督教民主主义者的崛起，以及他们与@ig_conservatives! 古典保守主义者的斗争，最终以一场无休无止的现状告终，双方都无力摧毁对方。"
 bpm_new_wine_old_wineskins_flavour.3.f:0 ""
 bpm_new_wine_old_wineskins_flavour.3.a:0 "这可真是……令人失望……"
 bpm_new_wine_old_wineskins_flavour.4.t:0 "无人挑战的右翼领袖"
 bpm_new_wine_old_wineskins_flavour.4.d:0 "居于主导地位的@ig_conservatives! 保守派派系的领袖——[SCOPE.sCharacter('unchallanged_right_winger').GetFullName]——宣称自己是唯一真正代表政治右翼的领袖。他公开抨击所有反对他及其保守主义的人，并赢得了更多支持。"
 bpm_new_wine_old_wineskins_flavour.4.f:0 "在这个国家，政治右翼只能有一位强大、虔诚且无人挑战的领袖。而我已谦逊地证明了自己堪当此任，能够审慎地与教会合作，确保公共与私人生活中良好的天主教道德。凡违抗我者，实乃违抗上帝本身及其安排。"
 bpm_new_wine_old_wineskins_flavour.4.a:0 "真是个固执的蠢货。"
 bpm_new_wine_old_wineskins_flavour.5.t:0 "自主的派系间合作"
 bpm_new_wine_old_wineskins_flavour.5.d:0 "尽管[GetInterestGroupVariant('ig_conservatives',GetPlayer).GetName]的领袖正式宣称[GetInterestGroupVariant('ig_christian_democrats',GetPlayer).GetName]没有存在的权利，并禁止合作，但许多基层小组和组织已经开始合作。虽常属小事，但许多都发展迅速，使得@ig_christian_democrats! #blue 基督教民主#!思想得以传播。"
 bpm_new_wine_old_wineskins_flavour.5.f:0 "我认为不让你上选举名单、把你置于严密监视之下，是不合理的。这不仅通过分裂损害了天主教事业，也削弱了潜在的选举基础。"
 bpm_new_wine_old_wineskins_flavour.5.a:0 "他们是想要被开除还是怎么着？"
 bpm_new_wine_old_wineskins_flavour.6.t:0 "权势主教支持民主党人"
 bpm_new_wine_old_wineskins_flavour.6.d:0 "一位在[GetInterestGroupVariant('ig_devout',GetPlayer).GetName]中拥有强大影响力的权势主教，在报纸上发表演说，公开支持新兴的@ig_christian_democrats! 基督教民主思潮。他号召人们参与传播这些新思想。"
 bpm_new_wine_old_wineskins_flavour.6.f:0 "这个新政治团体……其成员自称“基督教民主主义者”……非常虔诚，真心寻求在我们的生活中践行耶稣的教诲。他们信仰社会正义，追求平等，为穷人而奋斗，同时又珍视虔诚，这种信念十分坚定，也确实是正义的。"
 bpm_new_wine_old_wineskins_flavour.6.a:0 "这难道是允许的吗？"
 bpm_new_wine_old_wineskins_flavour.7.t:0 "保守派报纸的强力声援"
 bpm_new_wine_old_wineskins_flavour.7.d:0 "一家重要报纸发表了一篇文章，通篇攻击[GetInterestGroupVariant('ig_christian_democrats',GetPlayer).GetName]，并赞扬[GetInterestGroupVariant('ig_conservatives',GetPlayer).GetName]的领袖——[SCOPE.sCharacter('clacon_leader').GetFullName]。他们猛烈抨击罪恶的进步主义，指责基督教民主主义者削弱天主教徒，并背弃了整体的保守主义。"
 bpm_new_wine_old_wineskins_flavour.7.f:0 "那些“基督教民主主义者”及其革命性的思想，无异于朝真正的保守主义和虔诚的脸上啐唾沫。他们只想破坏，只想助长邪恶的种子。他们既不是基督徒，也不是民主派。"
 bpm_new_wine_old_wineskins_flavour.7.a:0 "好一桩严厉的指控！"
 bpm_new_wine_old_wineskins_flavour.8.t:0 "传播精神"
 bpm_new_wine_old_wineskins_flavour.8.d:0 "由于在选举名单准入方面的一些问题，一个信奉@ig_christian_democrats! 基督教民主思想的独立新党成立了，并开始赢得支持。目前还难以判断它会有何表现，但它几乎肯定会将左翼天主教思想传播到全国各地。"
 bpm_new_wine_old_wineskins_flavour.8.f:0 "我们是一个独立政党，紧密追随#italic 《新事》#!通谕，谋求将它的理念引入我们亲爱祖国的各个领域……"
 bpm_new_wine_old_wineskins_flavour.8.a:0 "他们有点搞不清状况，但那股精气神倒是对了！"
 bpm_new_wine_old_wineskins_flavour.9.t:0 "支持的主教受压转向反对"
 bpm_new_wine_old_wineskins_flavour.9.d:0 "一位支持@ig_christian_democrats! 基督教民主思想的主教，在[GetInterestGroupVariant('ig_conservatives',GetPlayer).GetName]诸位政治家的压力下转为反对派，改变了他关于广泛民主以及改革[SCOPE.sParty('conservative_party_scope').GetName]的立场。"
 bpm_new_wine_old_wineskins_flavour.9.f:0 "看来对于我所谓支持现代主义及其他罪恶思想的说法，存在重大误解。我从未想过追求这类目标，也从未参与选举政治。"
 bpm_new_wine_old_wineskins_flavour.9.a:0 "反正他本来也不该做那种事。"
 bpm_new_wine_old_wineskins_flavour.10.t:0 "敌意升温"
 bpm_new_wine_old_wineskins_flavour.10.d:0 "随着这场生存与未来之争扩展到政治与公共生活的方方面面，[GetInterestGroupVariant('ig_conservatives',GetPlayer).GetName]和[GetInterestGroupVariant('ig_christian_democrats',GetPlayer).GetName]都变得越来越敌对，愈发决心实现各自的目标。"
 bpm_new_wine_old_wineskins_flavour.10.f:0 "我们实在没有理由去进行那些实际上只会让敌方政党得利的无谓妥协，我们必须扩大并掌控自己的队伍，不让对方占得先机。"
 bpm_new_wine_old_wineskins_flavour.10.a:0 "不知道这最后会怎么收场？"
