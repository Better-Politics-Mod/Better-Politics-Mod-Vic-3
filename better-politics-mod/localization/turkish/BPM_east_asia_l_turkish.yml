 je_taiping:0 "Büyük İsyanlar"
 je_taiping_status:0 "İmparatorluğun dört bir yanında yönetme yetkimize azalan destek, otoritemize karşı bir dizi büyük isyanla sonuçlandı. Dini fanatiklerden etnik savaş ağalarına kadar, imparatorluğumuz bu karanlık andan sağ çıkacaksa isyancıları hızla ezmeli ve ne pahasına olursa olsun iç düzeni yeniden sağlamalıyız."
 je_taiping_reason:0 "Fanatikler haklı yönetimimize karşı ayaklandılar! İsyanları tamamen ezilmelidir."
 je_taiping_tt:0 "Tüm isyancı devletler ilhak edildi."

 bpm_east_asia_dynamics.1.t:0 "Afyon Savaşları: Orta Krallık'ın Ezici Yenilgisi"
 bpm_east_asia_dynamics.1.d:0 "Bir zamanlar kudretli olan [SCOPE.sCountry('china_scope').GetName], güçlerinin afyon yasağıyla ilgili son savaşta vahşi [SCOPE.sCountry('opium_wars_aggressor').GetName] tarafından yenilgiye uğratılmasıyla ezici bir darbe aldı. Bu yıkıcı kayıp Orta Krallık'ın temellerini sarstı. Pazarlarını açmaya zorlandılar ve Doğu Asya'daki komşularını güç dengesindeki bu tarihi değişimin sonuçları üzerinde düşünmeye terk ettiler."
 bpm_east_asia_dynamics.1.d2:0 "Bir zamanlar kudretli olan [SCOPE.sCountry('china_scope').GetName], güçlerinin afyon yasağıyla ilgili son savaşta vahşi [SCOPE.sCountry('opium_wars_aggressor').GetName] tarafından yenilgiye uğratılmasıyla ezici bir darbe aldı. Bu yıkıcı kayıp Orta Krallık'ın temellerini sarstı. [SCOPE.sState('treaty_port_state').GetName] limanını [SCOPE.sCountry('opium_wars_treaty_port_winner').GetName]'a bırakmak zorunda kaldılar ve Doğu Asya'daki komşularını güç dengesindeki bu tarihi değişimin sonuçları üzerinde düşünmeye terk ettiler."
 bpm_east_asia_dynamics.1.d3:0 "Bir zamanlar kudretli olan [SCOPE.sCountry('china_scope').GetName], güçlerinin afyon yasağıyla ilgili son savaşta vahşi [SCOPE.sCountry('opium_wars_aggressor').GetName] tarafından yenilgiye uğratılmasıyla ezici bir darbe aldı. Bu yıkıcı kayıp Orta Krallık'ın temellerini sarstı ve Doğu Asya'daki komşularını güç dengesindeki bu tarihi değişimin sonuçları üzerinde düşünmeye terk etti."
 bpm_east_asia_dynamics.1.f:0 "[SCOPE.sCountry('china_scope').GetName]'in yenilgisinin gerçekliği anlaşıldıkça, bölgenin siyasi manzarası da değişmeye başlıyor. Reformcu sesler giderek daha da yükselerek kendi hükümetlerini benzer bir kaderden kaçınmak için modernleşmeye ve uyum sağlamaya çağırıyor. Gericiler ise ayaklanma potansiyelinden korkarak her türlü huzursuzluk belirtisini bastırmaya çalışıyor. Doğu Asya'daki bir zamanlar istikrarlı olan güç dengesi geri döndürülemez bir şekilde paramparça oldu ve bölge ülkelerinin bu yeni ve tehlikeli manzarada gezinmek için mücadele edeceği önümüzdeki yıllara çalkantı ile belirsizlik damgasını vuracak."
 bpm_east_asia_dynamics.1.a:0 "[ROOT.GetCountry.GetName] Orta Krallık'ın yanında yer alacak!"
 bpm_east_asia_dynamics.1.b:0 "Ya Reform Ya Ölüm!"
 bpm_east_asia_dynamics.1.c:0 "Batılı güçlerle uzlaşma aramalıyız!"
 bpm_east_asia_dynamics.1.e:0 "Bizi ilgilendirmez."

 bpm_china.1.t:0 "Nanking Antlaşması"
 bpm_china.1.d:0 "İmparatorluğun hem karada hem de denizde kesin bir yenilgiye uğratılmasının ardından İngiliz ve Çinli yetkililer barış şartlarını görüşmek üzere Nanjing dışında bir İngiliz savaş gemisinde bir araya geldi. Anlaşma sadece İngiliz tacına tazminat ödenmesini değil, aynı zamanda 80 yılı aşkın süredir yürürlükte olan korumacı Kanton Sistemi'nin de lağvedilmesini öngörüyor. Bunun yerine birçok Çin limanı Avrupa ticaretine açılacak ve Hong Kong Adası İngiltere'ye bırakılacak."
 bpm_china.1.f:0 "\"Barış şartları okunduktan sonra kıdemli komiser Elepoo daha fazlasını bekleyerek durakladı ve en sonunda 'hepsi bu mu?' dedi. Bay Morrison Yarbay Malcolm'a başka bir şey olup olmadığını sordu ve olumsuz yanıt alınca Elepoo hemen ve büyük bir incelikle, 'hepsi verilecek, halloldu, bitti' diyerek müzakereyi kapattı.\"\n\n—Montgomery Martin, 1842"
 bpm_china.1.a:0 "Emin olun önemsiz bir aşağılanma değil mi?"

 bpm_china.2.t:0 "Avrupalı Misyonerlerin Gelişi"
 bpm_china.2.d:0 "Nanking Antlaşması'nın Çin'i Avrupa ticaretine ve yabancı ikametine açmasıyla birlikte Çin, neredeyse her büyük şehir ve eyalette misyonlar kurmak isteyen evanjelik protestanlar için giderek daha popüler bir hedef haline geldi."
 bpm_china.2.f:0 "Doğu eyaletleri boyunca batılı misyonerler giderek daha yaygın bir manzara haline geldi, çevrilmiş dini metinler dağıtıyorlar ve cennetin tek bir tanrısının yüceliğini ilan ediyorlar. Birçoğu bu yabancılara burun kıvırırken, bazı meraklı yoldan geçenler kalıp dinliyor."
 bpm_china.2.a:0 "Umalım da bu yabancılar çok fazla soruna neden olmasın."

 bpm_china.3.t:0 "Büyük Sarı Nehir Taşkını"
 bpm_china.3.d:0 "1851'den 1855'e kadar süren yoğun yağmurlu mevsimler, Sarı Nehir havzasında şiddetli sel baskınlarına, aynı zamanda nehrin Shandong Yarımadası'nın kuzeyine kaymasına ve havzadaki tarım bölgelerinin kitlesel yıkımına neden oldu."
 bpm_china.3.f:0 "Tüm köy ve tarlaları bir kez daha bir ayak boyu sel suları altında oturuyor, bir başka hasat mevsimi daha üst üste ikinci yıl tamamen mahvoldu. Köylüler kendilerini aylak haydutlar ve toprak sahiplerinin ihmaliyle geçecek bir yıla daha hazırlıyor."
 bpm_china.3.a:0 "Cennetin bizzat kendisi tarafından mı terk edildik?"

 bpm_china.7.t:0 "Tarım'da Bela"
 bpm_china.7.d:0 "Uzak batıdaki Sincan valiliği, 18. yüzyılın ortalarında eski Çungar Hanlığı'nın fethedilen topraklarından kurulmuştu. Qing'in bu ücra bölgedeki otoritesi isyankar yerliler ve bozkırın çeşitli güçleri tarafından sıklıkla sınanıyor."
 bpm_china.7.f:0 "Samat sürekli omzunun üzerinden arkasına bakmaya hiç yabancı değildi; Kaşgar'ın güneyindeki açık genişlikte yalnız bir gezgin olabildiğince savunmasızdı. Şimdi, uzaktan geçen bir atlı grubunun o bilindik sesiyle irkildi. Uzun bir süre hareketsiz kalıp ufku yakından izledikten sonra, Türki grubun onun yönüne gelmediğini gören Samat rahat bir nefes alır ve yolculuğuna devam eder."
 bpm_china.7.a:0 "İnsan buralarda kafasını eğik tutsa iyi eder."

 bpm_china.8.t:0 "Uzak Bir Görevlendirme"
 bpm_china.8.d:0 "Sincan, Han ve Hui yerleşimcileri başta olmak üzere önemli nüfus merkezlerinin güvenliğini sağlayan İli Generali ve subaylarının doğrudan yönetimi altındadır. Yıllar boyunca bu pozisyona çeşitli sancaklar ve generaller gelip gitti. General Teyishunbao, belirli ticaret ve ikamet garantileri karşılığında güneyde Hokandlılarla yaşanan büyük bir çatışmanın sonuçlandırılmasını denetledi."
 bpm_china.8.f:0 "\"Dihua bu çukurdan çok daha iyiydi.\" diye öfkelendi Nikan. Uzak batı kasabası Kızıl'da güneş, altında bulunacak kadar şanssız olan herkesi yakıyordu ve Dungan yerlileri kasabada sancaktarları görmekten pek de heyecan duymuyordu. Artık burada, batıda işler sakinleştiğine göre taburunun kuzeye geri çağrılmasını umabilirdi."
 bpm_china.8.a:0 "Tarım'da devriye gezmek insana neredeyse bir Tibet kışı diletiyor."

 bpm_china.9.t:0 "Sincan'da Haydut Baskınları"
 bpm_china.9.d:0 "Uzak batı eyaletlerden çok daha fazla kanunsuz ve birçok bölge hâlâ çeşitli eşkıyalık biçimlerine ve baskınlara maruz kalıyor. Bu topraklar uç bir valilik olmaya devam ettiği sürece bu olaylar muhtemelen tekrar tekrar yaşanacaktır."
 bpm_china.9.f:0 "Haydutlar, karşılık vermek için telaşlanan askeri garnizonlarla bir dizi yerleşime saldırdı. Çölden iblisler gibi at sürüp gelirler ve ellerine geçirebildikleri her şeyi veya herkesi ele geçirirler."
 bpm_china.9.a:0 "Batı semalarına doğru dumanlar yükseliyor."

 bpm_china.10.t:0 "Eyalet İşleri"
 bpm_china.10.d:0 "Büyük Qing, 1680'lerde Tayvan krallıklarını yıktıktan sonra adayı Fujian'ın bir bölgesi (prefect) yaptı. O zamandan beri ardışık imparatorlar ve konseyleri, [SCOPE.sCulture('han_culture').GetName] yerleşimcileri ile [SCOPE.sCulture('formosa_culture').GetName] nüfusu arasındaki ilişkileri ve hakları nasıl dengeleyecekleriyle uğraşmak zorunda kaldılar. Yerleşimcilerin bir kez daha dağlık iç kesimlere doğru ilerlemesi yerli halklarla tansiyonun yükselmesine neden oluyor. Konu bir kez daha Fujian valisi ile İmparatorluk Sarayı arasında bir çekişme noktası haline geldi."
 bpm_china.10.f:0 "\"Tayvan'da, kültürleşmiş yerlilerin çorak arazilerini kiralayan Han kökenli kötüler, 'izinsiz ekim yoluyla toprak hırsızlığı' yasasına göre cezalandırılır; kültürleşmemiş yerli bölgesindeki toprakları geri alanlar sınır kontrolünü ihlal yasasına göre cezalandırılır. Toprak yerlilere iade edilmelidir.\"\n—Hanehalkı Bakanlığı Kararnamesi, 1746"
 bpm_china.10.a:0 "Daha fazla yasadışı yerleşimi durdurun, önceliğimiz barıştır."
 bpm_china.10.b:0 "Yerlilerin topraklarını yerleşimcilere kiralayabilmesi için bir anlaşma yapın."
 bpm_china.10.c:0 "Yeter, tüm adaya boyun eğdirilmeli, iç kesimleri güç kullanarak güvence altına alın."
 
 bpm_china.11.t:0 "Hong Xiuquan İkinci Sınavında da Başarısız Oldu"
 bpm_china.11.d:0 "Hırslı ve genç bir öğrenci olan Hong Xiuquan, bu yılki giriş seviyesi sınavlarında ikinci kez başarısız oldu."
 bpm_china.11.f:0 "Son derece zeki ve çalışkan bir öğrenci olan Xiuquan, Guangdong eyaletindeki bir Hakka köy liderinin oğluydu. Genç yaşından itibaren devlet memurluğu sınavlarına hazırlanmış, 7 yaşında yerel köyünün ilkokuluna kaydolmuş ve 13 yaşına geldiğinde temel klasikleri ezberlemiş ve kompozisyon yazmada yetenek göstermişti. Öğretmenleri, akrabaları ve köylüleri son derece etkilenmişlerdi ve genç dahinin devlet memurluğu sınavlarını geçmesi konusunda büyük umutları vardı. \n\n13 yaşında memuriyet sınavlarının ilk turundaki eleme sınavında birinci olmuş ve 16 yaşında Xiu Cai sınavını ilk kez denemişti. \n\nBaşarılı olamadı. \n\nBu hayal kırıklığı yaratan sonucun ardından Hong, memleketinde tarım işine geri dönmüştü, ebeveynleri artık eğitimini destekleyemiyordu. Görünüşe göre Çin'in okuryazarları (literati) arasına yükselme arzusu, zengin bir arkadaşının onu sınavı ikinci kez denemek üzere birlikte çalışmaya davet etmesine kadar paramparça olmuştu. \n\nBu yıl sınavı tekrar aldı, ancak bir kez daha başarısız oldu. Böylesine gelecek vaat eden genç bir öğrenci için ezici bir hayal kırıklığı."
 bpm_china.11.a:0 "Kariyerinin onu nereye götüreceğini kim bilebilir?"

 bpm_china.12.t:0 "Hong Xiuquan'ın Üçüncü Başarısızlığı"
 bpm_china.12.d:0 "Üçüncü devlet memurluğu sınavında da başarısız olduktan sonra Hong Xiuquan o kadar büyük bir hayal kırıklığına uğradı ki bedeni iflas etmeye başladı. Ölümle yaşam arasında bir durumda nekahat dönemindeyken, Hong'un zihni vizyonlarla doldu. \n\n#lore Onu Cennet'e doğru taşıyan büyük bir melek ordusu gördü; oraya vardığında erkekler ve kadınlar onu selamlıyordu. #yellow Altın Sakallı İhtiyar Bir Adam#!, XiuQuan'ı görünce gözyaşlarına boğuldu. \n\"Tüm dünyadaki bütün insanlar benim tarafımdan yaratılıp yaşatılıyor; benim yemeğimi yiyorlar ve benim kıyafetlerimi giyiyorlar, ancak içlerinden tek bir tanesi bile beni hatırlayacak ve bana saygı gösterecek bir kalbe sahip değil; ...Benim hediyelerimi alıp onlarla iblislere tapıyorlar\"\n#yellow İhtiyar Adam#! daha sonra Xiuquan'a iblisleri yok etmesi için bir kılıç, kötü ruhların üstesinden gelmesi için bir mühür ve yemesi için bir parça meyve verdi. \"Cesur ol ve işi yap; her zorlukta sana yardım edeceğim\"\n\nVizyonlar 40 gün boyunca devam edecek ve Hong bu sürede, #r Ağabeyi #! olarak bahsettiği, Hong'a nasıl davranması gerektiğini öğreten ve kötü ruhları öldürmesinde ona yardım eden #r Orta Yaşlı Bir Adamla #! görüşecekti#!"
 bpm_china.12.a:0 "#yellow Baba Tanrı#! ve #r Oğul Tanrı#! kendi şampiyonlarını seçtiler"

 bpm_china.13.t:0 "Tanrıya Tapanlar"
 bpm_china.13.d:0 "Guangxi dağlarında tuhaf bir tarikat oluştu. Kendilerine Tanrıya Tapanlar Cemiyeti adını veren bu grup, ilk olarak Feng Yunshan adında eski bir öğretmen tarafından kuruldu ve Hristiyan figürü İsa Mesih'in küçük kardeşi olduğunu iddia eden [SCOPE.sCharacter('bpm_hong_xiuquan').GetFullName]'ın inançlarını vaaz ediyor. Bölgedeki Hakkalar arasında önemli bir takipçi kitlesi oluşturmayı başardılar."
 bpm_china.13.f:0 "\"Elbette günahlarımız göğe kadar yükselir;\n İsa'nın tüm bunları bizim adımıza taşıdığını bilmek ne kadar güzel.\n Artık şeytani iblislere güvenmiyor, kutsal kelama itaat ediyoruz, kalbimizi arındırmak için Tek Gerçek Rabbe tapıyoruz\"\n —Hong Xiuquan, 1844"
 bpm_china.13.a:0 "Sıradan bir başka eyalet tuhaflığı."

 bpm_china.14.t:0 "Tanrıya Tapanlar İvme Kazanıyor"
 bpm_china.14.d:0 "Tanrıya Tapanlar Cemiyeti kırsal Guangxi'de önderliğin altında büyümeye, on binlerce sadık takipçiyi çekmeye, nüfuz ve büyüklük olarak artmaya devam ediyor. Eyalette çapulculuk yapan haydutlarla karşılaştırıldığında daha sakin bir varlık göstererek hükümet yetkilileri tarafından bastırılmaktan büyük ölçüde kaçınmayı başardılar."
 bpm_china.14.f:0 "\"Nasıl olur da bu sapkın ve hissiz dünya bir günde dürüst ve doğru bir dünyaya dönüştürülemez? Hakaretler ve ihlaller, savaşma ve öldürmelerle dolu bu çağ nasıl olur da bir günde güçlünün zayıfı ezmediği, çoğunluğun azınlığı bunaltmadığı, bilgenin basiti aldatmadığı veya cesurun korkağı rahatsız etmediği bir dünyaya dönüştürülemez?\"\n -Hong Xiuquan, 1847"
 bpm_china.14.a:0 "Endişe verici, onlara gözünüzü dört açın."
 bpm_china.14.b:0 "Fırsatımız varken bunu hemen durdurun, Hong Xiquan'ı tutuklayın"

 bpm_china.15.t:0 "İmtiyazlı Bölgelerde"
 bpm_china.15.d:0 "Nanking Antlaşması'nın bir koşulu olarak, bir dizi kıyı kenti Avrupa ticaretine ve yerleşimine açık antlaşma limanları haline geldi. İyi ya da kötü batılı çıkarlarına ve fikirlerine sonuna kadar açılan kapılar oldular."
 bpm_china.15.f:0 "James önündeki çeşitli muhasebe çizelgelerini taradı, \"Bu ödemeleri nasıl organize edeceğiz ki, ülkedeki her lanet eyalet farklı bir madeni para basıyor gibi görünüyor!\"\n Meslektaşı ona baktı ve iç çekti.\n \"Sadece kenar boşluklarına kullanılan madeni parayı not et, diğer masanın üzerinde bir fihristim var\"\n James kaşlarını çattı."
 bpm_china.15.a:0 "\"Fabrika Taeli\" de neyin nesi?"
 bpm_treaty_ports:0 "Antlaşma Limanları"

 bpm_china.16.t:0 "Sınıra Doğru Han Göçleri"
 bpm_china.16.d:0 "Yüzyıllar boyunca Han çiftçileri sınır bölgelerinde toprak ve fırsat elde etmek için kendi memleketlerinden ayrılmayı seçtiler. Qing yetkilileri tarafından sık sık caydırılsa da, bu devasa iç sınırları yönetmek genellikle zordur."
 bpm_china.16.f:0 "Kuzeydoğunun geniş açık arazileri birçokları için yeni bir başlangıç sunuyor; rüzgarlı ve soğuk olsa da, bol miktarda arazi ve eski toprak sahiplerinden özgürlük vadediyor. Gelen her yeni göçmen dalgasıyla kasabalar ve şehirler daha fazla zanaatkar ve işçi talep ederek büyüyor."
 bpm_china.16.a:0 "Yeni bir başlangıç."

 bpm_china.17.t:0 "Üç Doğu Eyaleti"
 bpm_china.17.d:0 "İmparatorluk kararnamesiyle kuzeydoğu üç eyalet halinde yeniden düzenlendi: Fengtian, Jilin ve Heilongjiang. Bölge giderek Han yerleşimcilerin hakimiyetine giriyor ve İmparatorluk hükümeti bunu durdurma konusunda isteksiz."
 bpm_china.17.f:0 "\"Görkemli Mukden, Shen sularının kuzey kıyısında kuruldu. Dağları yüksek ve nehirleri geniştir. Evrensel bir model, bir kaplan veya ejderha kadar büyük ve muhteşem bir yer olarak sabitlenmiştir... Böylesine uğurlu bir konum nesilden nesile sonsuza kadar yaşayacaktır. Tüm diğer yerleri geride bırakır, onları gölgede bırakır ve içerideki topraklarla dışarıdaki toprakları birleştirmiştir.\"\n—Qing Gaozong, 1743"
 bpm_china.17.a:0 "Kuzeydoğu 19. yüzyıla giriyor."

 bpm_china.18.t:0 "Bu Kadim Vadiler"
 bpm_china.18.d:0 "Qinghai dağları yüzyıllar boyunca pek çok kez el değiştirdi, ancak İmparatorluk hükümeti burayı Çin'in çekirdek eyaletlerinden biri yapmak için adımlar attı."
 bpm_china.18.f:0 "Yerliler tarafından Koko Nur olarak bilinen adaş Qinghai gölü, bölgedeki hacıların gözde bir destinasyonudur. Her 12 yılda bir hacılar tarafından Koko Nur'un etrafında büyük bir tavaf (circumambulation) yapılır ve pek çoğu gölün yaratılışını mitolojikleştiren kadim usta Padmasambhava'nın hikayeleri anlatılır..."
 bpm_china.18.a:0 "Birçoğu için kutsal olan bir yer."

 bpm_china.19.t:0 "Batı Ehlileştirildi"
 bpm_china.19.d:0 "Yıllarca süren savaşlardan sonra Sincan nihayet düzgün bir eyalet yönetimi tarafından yönetilmeye başlanabilir ve bu da onu daha fazla yerleşime ile kalkınmaya açacaktır."
 bpm_china.19.f:0 "Uzak batı eyaleti iyileşiyor ve sanki yedi şehir bir gecede daha da büyüyor, her köşede yeni pazar yerleri ve okullar yükseliyor. Bu barışın ne kadar süreceğini kimse kesin olarak bilemiyor, ancak kesinlikle Pekin'e her zamankinden daha yakınlar..."
 bpm_china.19.a:0 "Sınır kapandı."

 bpm_china.20.t:0 "Moğol İşleri"
 bpm_china.20.d:0 "Biraz müzakereden sonra, İç ve Dış Moğolistan'ın sancakları ve aymak'ları (aimag) uygun idari bölümler halinde resmileştirildi."
 bpm_china.20.f:0 "Sancaklar birlikler halinde örgütlendi, sancakların kendileri ise birkaç aymak'ı (aimag) gruplandırıyor. Bunların hepsi geleneksel Moğol gruplaşmalarıdır, ancak şimdi gerçek bir üç seviyeli idari sistem oluşturuyorlar..."
 bpm_china.20.a:0 "Bozulmamışsa tamir etme..."

 bpm_china_revolts.1.t:0 "Dağlarda Kan"
 bpm_china_revolts.1.d:0 "Birçok Hui Müslümanı yüzyıllardır Yunnan'ın dağlık eyaletinde yaşıyor, ancak inançları ve Yunnan'ın pek çok zengin madeni üzerindeki kontrolleri nedeniyle Qing yetkilileri ile yerel Han milisleriyle sıklıkla çatışma yaşıyorlar. Şiddet olayları son yıllarda tırmanmaya devam etti ve Mançulu yetkililerin emrettiği bir başka acımasız katliam daha yerel halkı tetikte beklemeye itti."
 bpm_china_revolts.1.f:0 "\"Eğer biz Huiler şiddetin intikamını almazsak, son Hui öldürülene kadar bu her yerde tekrarlanacaktır.... Memurların ve askerlerin Hanlara Huileri yok etmeleri için yardım ettiği gerçeği; dağ kadar yüksekte yığılı ölüler ve deniz kadar derin akan kanlarla çekilen bu acılar boşa gitmiş olamaz...\"\n —Yongchang Huilerinin Bildirisi, 1845"
 bpm_china_revolts.1.a:0 "Hui halkının sabrı tükeniyor."

 bpm_china_revolts.2.t:0 "Dali'de Devrim"
 bpm_china_revolts.2.d:0 "On binlerce Hui ve Han yerlisi Dali şehrine yürüdü, Genel Vali intihar etti ve diğer Mançu yetkilileri isyancılar tarafından yakalandı. İsyanın Dali'nin çok ötesine yayılmasıyla, bu isyancılar şimdi Pingnan Guo'yu ilan eden Müslümanlığa geçmiş bir lider olan [SCOPE.sCharacter('bpm_du_wenxiu').GetFullName]'da kendilerine bir önder buldular."
 bpm_china_revolts.2.f:0 "Eyaletin dört bir yanında sadece Hui değil, binlerce Han ve Yi de Pingnan Guo sancağına akın ediyor. İsyancı ordular şimdi Kunming'deki son sadık kaleye çullanıyor."
 bpm_china_revolts.2.a:0 "Kalan garnizonları derhal toplayın!"
 bpm_china_revolts.2.b:0 "Han'a barış getirmek için Qing sarayını kahrolsun!"
 bpm_panthay_war_tt:0 "Birkaç ay içinde savaş patlak verecek..."

 bpm_china_revolts.3.t:0 "Panthay İsyanı"
 bpm_china_revolts.3.d:0 "Dali'deki kendiliğinden gelişen ayaklanma kontrolden çıktı ve artık Yunnan'daki İmparatorluk kontrolünü silip süpüren adanmış bir harekete dönüştü. İsyancıların Kunming kapılarına dayanması ve Çin'in dört bir yanında patlak veren Muhammedî isyanlarla birlikte bir başka isyan savaşına daha sürüklendik."
 bpm_china_revolts.3.f:0 "\"...korkutucu bir patlama oldu ve ardından o devasa duman ile toz bulutu çöktüğünde, Hui savaşçılarının oluşturduğu kitlenin şehre aktığı o duvarda devasa bir delik açılmıştı\"\n —Hui isyancılarını pasifize etme seferinin İmparatorluk Tarafından Görevlendirilen Kaydı, 1896"
 bpm_china_revolts.3.a:0 "Hainleri ezin!"
 panthay_rebellion:0 "Panthay İsyanı"
 dyn_c_pingnan_guo:0 "Pingnan Guo"
 dyn_c_pingnan_guo_adj:0 "Pingnan"

 bpm_china_revolts.5.t:0 "Muhammedî Huzursuzluğu Yayılıyor"
 bpm_china_revolts.5.d:0 "Yunnan'daki isyan, İmparatorluğun Müslüman nüfusu ile eyalet hükümetleri arasındaki gerilimi alevlendirdi, artan şüphe daha sert baskılara ve bu da birçok Hui'nin daha çaresizce bir direnişe geçmesine yol açtı."
 bpm_china_revolts.5.f:0 "\"Kötü görünüyor.\"\n —herhangi bir general"
 bpm_china_revolts.5.a:0 "Bunu kontrol altına almayı umabilir miyiz?"
 
 bpm_china_revolts.6.t:0 "Dungan İsyanı"
 bpm_china_revolts.6.d:0 "İmparatorluğu kasıp kavuran huzursuzluk dalgaları nihayet uzak batıda bir kırılma noktasına ulaştı. İsyanlar ve katliamlar sarmalı, Yakub Beg adında bir Hokandlının Sincan'ı işgal etmesine ve Emir ile inananların şampiyonu unvanını almasına olanak tanıdı."
 bpm_china_revolts.6.f:0 "Bambu mızraklar can yakar"
 bpm_china_revolts.6.a:0 "Batı'da gönüllüleri toplayın!"
 bpm_china_revolts.6.b:0 "Tanrı ve zafer için at süreceğiz!"
 dyn_c_kashgaria:0 "Kaşgarya"
 dyn_c_kashgaria_adj:0 "Kaşgar"

 bpm_china_revolts.100.t:0 "Ejderha Katledildi"
 bpm_china_revolts.100.d:0 "İsyancılar nihayet Yasak Saray'ın surlarını aştı; Qing imparatorluk sarayının son üyeleri ya esir alındı ya da kuzeydoğuya kaçmaya zorlandı. Daha önce pek çok kez olduğu gibi bir hanedan düşerken bir diğerinin yükselmesi için fırsat yaratıyor. Şimdiki tek soru bu fırsatı kimin değerlendireceği"
 bpm_china_revolts.100.f:0 "İsyancılar görkemli saray arazisinde hayranlık içinde dolaştılar, zaman geçtikçe yapılanların ağırlığı ve gelecekte ne olacağı sorusu zihinlerinde ağır basmaya başladı."
 bpm_china_revolts.100.a:0 "Beyaz Lotus ile aynı çizgideki isyancılar, Ming hanedanından bir taht talibini başa geçirme fırsatını kullanıyor."
 bpm_china_revolts.100.b:0 "Bizzat Konfüçyüs'ün soyundan gelen mevcut Yansheng Dükü ılımlı bir hükümdar olarak başa getirilir."
 bpm_china_revolts.100.c:0 "İsyancı ordusunun Generali tahtı kendisi için ele geçirir."

 bpm_china_revolts.101.t:0 "Şeytan Katledildi"
 bpm_china_revolts.101.d:0 "Göksel Krallık nihayet Qing şeytanlarına karşı zafer kazandı. Artık Tüm Çin'in Göksel Kralı Hong Xiquan Çin'i bir kutsallık çağına sokabilir."
 bpm_china_revolts.101.f:0 "İsyancılar görkemli saray arazisinde hayranlık içinde dolaştılar, zaman geçtikçe yapılanların ağırlığı ve gelecekte ne olacağı sorusu zihinlerinde ağır basmaya başladı."
 bpm_china_revolts.101.a:0 "Rab sonsuza dek hüküm sürsün!"

 bpm_china_revolts.102.t:0 "Ejderha Katledildi"
 bpm_china_revolts.102.d:0 "Devrimci güçler Pekin ve Yasak Saray'ın kontrolünü ele geçirdi, İmparator ve Qing sarayı gözetim altına alındı ve pek çoğunun bir cumhuriyet kurulmasını desteklediği, birbirini izleyen imparatorluk hanedanlarının neredeyse iki bin yıllık zincirini sona erdiren geçici bir hükümet hızla kuruluyor."
 bpm_china_revolts.102.f:0 "İsyancılar görkemli saray arazisinde hayranlık içinde dolaştılar, zaman geçtikçe yapılanların ağırlığı ve gelecekte ne olacağı sorusu zihinlerinde ağır basmaya başladı."
 bpm_china_revolts.102.a:0 "Çin ileri yürüyor!" #adds 'Birth of the Chinese State' JE, where radical and conservative elements will battle over the laws of the new Chinese nation

 bpm_china_revolts.103.t:0 "Uzun Düşüş"
 bpm_china_revolts.103.d:0 "İmparatorluk başkenti elimizde kalsa da isyancılar imparatorluğun büyük kısımlarını elimizden almayı başardı. Bu durum Büyük Qing'e ölümcül bir darbe olabilir."
 bpm_china_revolts.103.f:0 "Son günlerde Pekin'i soğuk bir his sardı, sayısız yetkili ve görevli bu barışın ne kadar sürebileceğini merak ederek ortalıkta dolaşıyor."
 bpm_china_revolts.103.a:0 "Bir Qing üstünlüğü çağı sona eriyor."

