l_turkish:
 ideology_cit_internationalist:0 "Enternasyonalist"
 ideology_cit_internationalist_desc:0 "#lore Bütün ülkelerin işçileri, birleşin! Bu grup, mümkün olan her yerde uluslararası sınırları zayıflatmayı — veya tamamen kaldırmayı — amaçlar. #!"

 ideology_cit_closed_internationalist:0 "Kapalı Enternasyonalist"
 ideology_cit_closed_internationalist_desc:0 "#lore Bu grup halkların uluslararası kardeşliğine inanır, ancak çeşitli nedenlerden ötürü sınırlarını kapatma ihtiyacı görür. #!"

 ideology_cit_immigrant_nationalist:0 "Göçmen Milliyetçisi"
 ideology_cit_immigrant_nationalist_desc:0 "#lore Bu grup, ulusal kültürlerinin kısmen göçmenlerin kaynaştığı bir pota olmasıyla tanımlandığına inanır. Bana yorgun, yoksul ve itilip kakılmış yığınlarınızı verin (sınırlar dahilinde). #!"

 ideology_cit_liberal_nationalist:0 "Liberal Milliyetçi"
 ideology_cit_liberal_nationalist_desc:0 "#lore Bu grup ulusları için daha kapsayıcı ve geniş bir tanıma sahiptir; eski yerel veya aristokratik bağlardan kurtulmak için ulusal kardeşliği kullanmayı amaçlar. #!"

 ideology_cit_nationalist:0 "Milliyetçi"
 ideology_cit_nationalist_desc:0 "#lore Bu grup güçlü bir ulusal kültüre inanır ve genellikle yabancı olarak gördükleri herhangi bir etnik grubu dışlamaya veya asimile etmeye çalışır. #!"

 ideology_cit_segregationist:0 "Ayrımcı"
 ideology_cit_segregationist_desc:0 "#lore Irksal bir ideolojiden güç alan bu grup, farklı ırklardan insanların birbirinden ayrı tutulması gerektiğine ve bazılarının diğerlerinden daha iyi muameleyi hak ettiğine inanır. #!"

 ideology_cit_ethnonationalist:0 "Etnomilliyetçi"
 ideology_cit_ethnonationalist_desc:0 "#lore Bu grup, ulusal kültürlerinin korunmasının — veya yayılmasının — her şeyden önemli olduğunu savunur ve ne pahasına olursa olsun politikalarını bu amaca yönlendirir. #!"

 ideology_cit_multiethnic_nationalist:0 "Çok Etnikli Milliyetçi"
 ideology_cit_multiethnic_nationalist_desc:0 "#lore Bu grup, geleneksel olarak birkaç farklı etnik kökeni içerebilen güçlü bir ulusal kültüre inanır. #!"

 ideology_cit_traditional_culture:0 "Geleneksel Kültür"
 ideology_cit_traditional_culture_desc:0 "#lore Bu grubun net bir vatandaşlık politikası yoktur, ancak genel olarak geleneksel kültürü korumaya yöneliktirler. #!"

 ideology_cit_colonial_segregationist:0 "Kolonyal Ayrımcı"
 ideology_cit_colonial_segregationist_desc:0 "#lore Bu grup, kendi etnik grubunun üyelerini kolonyal (sömürgeci) yönetici sınıf olarak konumlandırarak sömürgeci ırk hiyerarşisini korumayı amaçlar. #!"

 ideology_cit_samurai: "Geleneksel Samuray Kültürü"
 ideology_cit_samurai_desc: "#lore Bu grubun net bir vatandaşlık politikası yoktur, ancak genel olarak geleneksel kültürü ve Samurayların statüsünü korumaya yöneliktirler. #!"