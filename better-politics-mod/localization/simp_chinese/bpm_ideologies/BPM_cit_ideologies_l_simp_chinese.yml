l_simp_chinese:
 ideology_cit_internationalist:0 "国际主义者"
 ideology_cit_internationalist_desc:0 "#lore 全世界无产者，联合起来！该集团力求尽可能削弱——乃至废除——国际边界。#!"
 ideology_cit_closed_internationalist:0 "封闭国际主义者"
 ideology_cit_closed_internationalist_desc:0 "#lore 该集团相信各民族之间的国际友爱，但由于种种原因，认为有必要关闭自己的边界。#!"
 ideology_cit_immigrant_nationalist:0 "移民民族主义者"
 ideology_cit_immigrant_nationalist_desc:0 "#lore 该集团认为，其民族文化在一定程度上正是由移民大熔炉所定义的。把你疲惫的、贫穷的、蜷缩成团渴望自由呼吸的民众都交给我吧（但有数量限制）。#!"
 ideology_cit_liberal_nationalist:0 "自由民族主义者"
 ideology_cit_liberal_nationalist_desc:0 "#lore 该集团对其民族有着宽泛的定义，并力图利用民族友爱来消除旧有的地方或贵族纽带。#!"
 ideology_cit_nationalist:0 "民族主义者"
 ideology_cit_nationalist_desc:0 "#lore 该集团信奉强大的民族文化，通常会试图排斥或同化任何其视为异族的族群。#!"
 ideology_cit_segregationist:0 "种族隔离主义者"
 ideology_cit_segregationist_desc:0 "#lore 出于种族意识形态的动机，该集团认为不同种族的人必须相互隔离，其中一些理应得到比另一些更好的待遇。#!"
 ideology_cit_ethnonationalist:0 "族裔民族主义者"
 ideology_cit_ethnonationalist_desc:0 "#lore 该集团认为，维护——或传播——其民族文化是至高无上的，并将不惜一切代价将政策导向这一目标。#!"
 ideology_cit_multiethnic_nationalist:0 "多民族民族主义者"
 ideology_cit_multiethnic_nationalist_desc:0 "#lore 该集团信奉强大的民族文化，而传统上这一文化可能包含多个不同的民族。#!"
 ideology_cit_traditional_culture:0 "传统文化"
 ideology_cit_traditional_culture_desc:0 "#lore 该集团没有任何明确的公民身份政策，但总体上倾向于维护传统文化。#!"
 ideology_cit_colonial_segregationist:0 "殖民种族隔离主义者"
 ideology_cit_colonial_segregationist_desc:0 "#lore 该集团力求维持殖民地的种族等级制度，以本族群成员作为殖民统治阶层。#!"
 ideology_cit_samurai:0 "传统武士文化"
 ideology_cit_samurai_desc:0 "#lore 该集团没有任何明确的公民身份政策，但总体上倾向于维护传统文化与武士的地位。#!"
