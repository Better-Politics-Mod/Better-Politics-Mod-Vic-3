 bpm_je_button_cooldown_month:0 "此选项不在每月冷却中"
 bpm_je_reached_stage_2:0 "#bold 进度条#!此前曾#v 高于33%#!。"
 bpm_je_reached_stage_3:0 "#bold 进度条#!此前曾#v 高于66%#!。"
 bpm_je_trigger_bpm_peoples_springtime_happened:0 "人民之春必须在国际上结束。"
 bpm_je_trigger_peoples_springtime_not_recent:0 "人民之春必须已在国际上结束#v 2年#!。"
