 xinjiang_decisions_tt:0 "Tüm organizasyon kararlarını tamamladı"

 je_xinjiang_button_manchu:0 "Dōngběi'yi Organize Et"
 je_xinjiang_button_manchu_desc:0 "Mançuların kuzeydoğu anavatanları uzun zamandır özel bir valilik olarak yönetiliyor, artık bu bölgeyi uygun eyaletler halinde yeniden düzenleme ve geliştirme ayrıcalığına sahibiz."

 je_xinjiang_button_qinghai:0 "Qinghai'yi Organize Et"
 je_xinjiang_button_qinghai_desc:0 "Dağlık Qinghai bölgesi, birçok Tibetli ve Moğol'a ev sahipliği yapan uzak bir askeri valiliktir; Qinghai'yi daha fazla entegre etmek istiyorsak daha kalıcı kurumlar kurmak için çalışmalıyız..."

 je_xinjiang_button_xinjiang:0 "Sincan'ı Organize Et"
 je_xinjiang_button_xinjiang_desc:0 "İmparatorluğun Çungarya'nın tepelerinden Tarim'in uçsuz bucaksız kumlarına uzanan vahşi batı sınırları şiddet doludur ve bölgenin kontrolü kendini adamış birkaç garnizona bağlıdır. İmparatorluğun ayrılmaz bir bölgesi olmak için bu toprakların istikrara kavuşturulması gerekiyor."

 je_xinjiang_button_mongol:0 "Měnggǔ'yu Organize Et"
 je_xinjiang_button_mongol_desc:0 "Moğolistan kabileleri uzun zamandır Büyük Qing'e tabi kılındı, ancak Avrupa güçlerinin dünyamızın sınırlarına tecavüz etmesiyle İç Moğolistan'ın yerleşimini ve gelişimini teşvik etmeliyiz."

