l_turkish:
 bpm_1st_intl.1.t:0 "Birinci Enternasyonal"
 bpm_1st_intl.1.d:0 "Erken dönem @ig_socialists! Sosyalist hareketi birleşik tek bir gelenekten doğmadı, daha çok radikal bir amaca yönelmiş farklı felsefelerin bir karışımı olarak bir araya geldi. 19. yüzyılın ortalarına gelindiğinde, hareketin bu yamalı bohça doğasının sürdürülemez olduğu işin içindeki herkes için netleşmişti. Böylece, geriye dönük olarak #pink Birinci Enternasyonal#! olarak bilinen #pink Uluslararası İşçi Birliği#!, dünya çapındaki çeşitli sosyalizm akımlarını birleştirmeye yönelik ilk ciddi girişim olarak kuruldu."
 bpm_1st_intl.1.f:0 "Sahip oldukları bir başarı unsuru var — sayılar; ancak sayılar terazide yalnızca birleşmeyle bir araya gelir ve bilgiyle yönlendirilirse ağır basar. Geçmiş deneyimler, farklı ülkelerin işçileri arasında var olması gereken ve onları kurtuluş için verdikleri tüm mücadelelerde birbirlerinin yanında sıkıca durmaya teşvik eden o kardeşlik bağına aldırış etmemenin, tutarsız çabalarının ortak yenilgisiyle nasıl cezalandırılacağını göstermiştir.\n\n—Karl Marx, 1864"
 bpm_1st_intl.1.a:0 "Buna göz kulak olalım."
 bpm_1st_intl.1.b:0 "Umurumda gibi mi duruyor? #pink (Olay zincirini atlar)#!"

 bpm_1st_intl.2.t:0 "Kızıl ve Kara"
 bpm_1st_intl.2.d:0 "Çok çeşitli geleneklerden gelen #pink Birinci Enternasyonal#! üyeleri, bazılarının umut ettiği kadar birlik içinde değiller. Anlaşmazlıkları büyük ölçüde iki grup etrafında birleşiyor: Başlıca Proudhon ve Bakunin'in liderliğindeki @ig_anarchists! Anarşistler ve anarşistlerin @ig_socialists! Devletçi Sosyalistler olarak adlandırdığı, Marksistler, Owen'cılar, Blanquist'ler ve çeşitli ezilen ulusların cumhuriyetçi milliyetçilerini içeren grup. İşbirliği yaptıkları kadar ateşli tartışmalara da giren bu grupların anlaşmazlıkları, koalisyonun varlığını tehdit ediyor."
 bpm_1st_intl.2.f:0 "Enternasyonal ancak kendini kurtardığında halkı özgürleştirecek bir silaha dönüşebilir; kendini iki gruba, yani eğitilmiş bir azınlığın kör aracı olan büyük bir çoğunluk ile diğerine bölünmeye bırakmadığında. İşte bu yüzden ilk görevi, üyelerinin zihinlerine Sosyalizmin bilimini, felsefesini ve politikasını kazımaktır.\n\n—Mihail Bakunin, 1869"
 bpm_1st_intl.2.a:0 "Ayaktakımı kışkırtıcıları arasında anlaşmazlık mı? Güzel!"

 bpm_1st_intl.2b.t:0 "Sosyalistlerimiz Bölündü!"
 bpm_1st_intl.2b.d:0 "@ig_socialists! Sosyalistler artık sadece bir araya toplanmış, yüksek idealleri olan bir grup entelektüel değil. Artık siyasi bir güce sahip olduklarına göre, yerel toplantıların otoriterlik ve devlet üzerine tartışmalarla domine edilmesiyle farklılıkları da çok daha belirgin hale geldi. @ig_anarchists! Anarşistler özellikle anti-otoriter bir fraksiyon olarak öne çıktılar ve kendi örgütlerini kurmaya başlıyorlar."
 bpm_1st_intl.2b.f:0 "Bu devrimci ittifak, her türlü diktatörlük ve denetleyici, yönlendirici bir güç fikrini dışlar. Ancak, bu devrimci ittifakın kurulması ve Devrimin gericiliğe karşı zafer kazanması için, fikirlerin ve devrimci eylemin birliğinin, Devrimin hayatı ve enerjisi olacak olan popüler anarşinin ortasında bir organ bulması gereklidir. Bu organ, Uluslararası Kardeşler'in gizli ve evrensel birliği olmalıdır.\n\n—Mihail Bakunin, 1869"
 bpm_1st_intl.2b.a:0 "Anlıyorum."

 bpm_1st_intl.3.t:0 "Anarşistler"
 bpm_1st_intl.3.d:0 "Erken dönem sosyalist hareketin @ig_anarchists! Anarşistleri kendi içlerinde bile tam anlamıyla birleşik bir cephe oluşturmuyordu. Anarşizmin iki ana akımı, serbest mübadele toplumunu savunan mutüalizmiyle Proudhon ve özel mülkiyetin tamamen ortadan kaldırılmasını savunan kolektivizmiyle Bakunin tarafından temsil ediliyordu.\n\nUygulamada, öncelikle hiyerarşik parti disiplinine karşı çıkıp özgür ve organik bir birleşmeyi savunmakla ilgileniyorlardı ve aynı zamanda doğrudan eylemin değerini vurguluyorlardı."
 bpm_1st_intl.3.f:0 "Devletin yapmaya çalıştığı gibi, meslek farklılıklarından doğan çıkar farklılıklarını göz ardı ederek insan toplumuna görünüşte bir birlik ve düzen dayatarak yukarıdan aşağıya doğru değil. Aksine Enternasyonal kitleleri, kitlelerin toplumsal yaşamını ve gerçek özlemlerini bir başlangıç noktası olarak alarak ve onları toplumdaki gerçek çıkarlarına göre gruplar halinde birleşmeye teşvik ederek aşağıdan yukarıya doğru örgütler.\n\n—Mihail Bakunin, 1869"
 bpm_1st_intl.3.a:0 "Peki ya rakipleri?"

 bpm_1st_intl.4.t:0 "Parti Sosyalistleri"
 bpm_1st_intl.4.d:0 "#pink Birinci Enternasyonal'in#! diğer tarafı, anarşistler tarafından küçümseyici bir şekilde 'devletçiler' olarak bilinen çeşitli @ig_socialists! Sosyalistlerden oluşuyordu. @ig_anarchists! Anarşistlerin aksine, ya reformlar elde etmek ya da gelecekteki devrim için sınıf bilincini geliştirmek amacıyla hem burjuva siyasetine hem de ekonomik mücadelelere katılmaya çalıştılar.\n\n'Devletçiler'in daha radikal üyeleri için bu isim iftira niteliğinde bir lakaptı. Anarşizmi bu haliyle reddetseler de, devletin ortadan kaldırılmasını sosyalizmin gerekli bir hedefi olarak görüyorlardı. Daha doğrusu, anarşistlerden en çok partileri tercih etmeleri konusunda ayrılıyorlardı."
 bpm_1st_intl.4.f:0 "Parlamentoda işçilerin bulunmasının önemsiz olduğuna asla inanılmamalıdır. Eğer onların sesleri bastırılırsa veya dışarı atılırlarsa, bu misillemeler ve baskılar halk üzerinde derin bir etki bırakır. Öte yandan, Bebel ve Liebknecht'in yaptığı gibi parlamento kürsüsünden konuşabilirlerse, bütün dünya onları dinler.\n\n—Karl Marx, 1871"
 bpm_1st_intl.4.a:0 "Gelin de alın!"

 bpm_1st_intl.5.t:0 "Bir Dönüm Noktası"
 bpm_1st_intl.5.d:0 "@ig_socialists! Sosyalistler, anarşistlerle yaşadıkları pek çok çatışma sürecinde, #pink Enternasyonal'in#! saflarında faaliyet gösteren gizli bir @ig_anarchists! Anarşist 'İttifak'ın kanıtlarını ortaya çıkarmış gibi görünüyorlar. Bu tür bir hizipçiliğin, #pink Enternasyonal'in#! bütünlüğünü tehdit ettiğini ve kuruluş kurallarını ihlal ettiğini iddia ediyorlar.\n\nÖte yandan, bazıları bunun sadece @ig_anarchists! Anarşistleri tamamen ideolojik nedenlerle kenara itmek için bir bahane olduğuna inanıyor."
 bpm_1st_intl.5.f:0 "Tarikatların yeniden dirilişini büyük bir ileri adım olarak gören İttifak'ın bizzat kendisi, onların zamanının geçtiğinin kesin kanıtıdır: Zira başlangıçta ilerleme unsurları barındırsalar da, 'Kur'an'sız bir Muhammed'in' yedeğindeki İttifak'ın programı, çoktan ölmüş, yalnızca burjuva aptallarını korkutmaya ya da Bonapartist veya diğer savcılar tarafından Enternasyonal üyelerine karşı kullanılacak kanıt olarak hizmet etmeye yarayan şatafatlı bir şekilde ifade edilmiş fikirler yığınından başka bir şey değildir.\n\n—Karl Marx, 1872"
 bpm_1st_intl.5.a:0 "Siyaset acımasızdır."

 bpm_1st_intl.6.t:0 "Kararlar"
 bpm_1st_intl.6.d:0 "@ig_anarchists! Anarşistlerin gizli 'İttifak'ı üzerindeki drama doruk noktasına ulaştı. Radikal @ig_socialists! Sosyalistlerden oluşan bir grup, diğer şeylerin yanı sıra bir proleter partisinin gerekliliğini ilan etmek ve @ig_anarchists! Anarşistleri #pink Enternasyonal#! içindeki hizipçilikleri nedeniyle ihraç etmek için bir dizi karar önergesi sundu. Kararlar geçecek mi?\n\n#gold (Bu seçim, @ig_anarchists! Anarşistlerin ve @ig_socialists! Sosyalistlerin uluslararası düzeyde işbirliği yapma istekliliğini etkiler.)#!"
 bpm_1st_intl.6.f:0 "Mülk sahibi sınıfların kolektif gücüne karşı mücadelesinde, işçi sınıfı, kendisini mülk sahibi sınıflar tarafından kurulan tüm eski partilerden farklı ve onlara karşı siyasi bir parti olarak oluşturmadıkça bir sınıf olarak hareket edemez.\n\n—Madde 7a, Lahey Kongresi, 1872"
 bpm_1st_intl.6.a:0 "Karar meclisten geçer. (Tarihsel)"
 bpm_1st_intl.6.b:0 "Karar meclisten geçemez."