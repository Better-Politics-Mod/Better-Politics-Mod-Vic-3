 country_bpm_hog_advice_on_ruler_veto:0 "[concept_bpm_head_of_government]的[concept_ideology]影响[Concept('concept_ruler','国家元首')]的否决决定"
 country_bpm_hog_advice_on_ruler_veto_desc:0 "[Concept('concept_ruler','国家元首')]不再仅凭自身判断，其否决法律的决定将受到[concept_bpm_head_of_government]的[concept_ideology]的影响。"
 country_bpm_hog_veto:0 "[concept_bpm_head_of_government]拥有否决的单独决定权"
 country_bpm_hog_veto_desc:0 "[Concept('concept_ruler','国家元首')]纯属礼仪性质，真正的法律否决权掌握在[concept_bpm_head_of_government]手中。"
 country_bpm_hog_hoshogsame:0 "[concept_bpm_head_of_government]与[Concept('concept_ruler','国家元首')]为同一人"
 country_bpm_hog_hoshogsame_desc:0 "[concept_bpm_head_of_government]与[Concept('concept_ruler','国家元首')]为同一人。"
 country_bpm_hog_top_advice:0 "[concept_bpm_head_of_government]可从任何[concept_powerful] [Concept('concept_interest_group', '利益集团')]中任命"
 country_bpm_hog_top_advice_desc:0 "[Concept('concept_ruler','国家元首')]受制于政治风向，而[Concept('concept_government','concept_bpm_head_of_government')]必须从[concept_powerful] [Concept('concept_interest_group', '利益集团')]中任命。"
 country_bpm_hog_top_hosapp:0 "[concept_bpm_head_of_government]可从任何[Concept('concept_interest_group', '利益集团')]中任命"
 country_bpm_hog_top_hosapp_desc:0 "[Concept('concept_ruler','国家元首')]独立而强大，可从任何[Concept('concept_interest_group', '利益集团')]中任命[concept_bpm_head_of_government]。"
 country_bpm_hog_top_parlelec:0 "[concept_bpm_head_of_government]由立法机构选定"
 country_bpm_hog_top_parlelec_desc:0 "[Concept('concept_ruler','国家元首')]大体上只是一个象征性人物，负责钦定由立法机构选定的[Concept('concept_government','concept_bpm_head_of_government')]。"
 country_bpm_cabinet_variety:0 "内阁人选来自各种[Concept('concept_interest_group', '利益集团')]"
 country_bpm_cabinet_variety_desc:0 "行政机构独立而强大，任命部长时不受掣肘。内阁人选来自各式各样的[Concept('concept_interest_group', '利益集团')]。"
 country_bpm_cabinet_influenced:0 "内阁人选偏向更具影响力的[Concept('concept_interest_group', '利益集团')]"
 country_bpm_cabinet_influenced_desc:0 "在部长任命上，行政机构受制于政治风向。内阁人选偏向更具影响力的[Concept('concept_interest_group', '利益集团')]。"
 country_bpm_cabinet_controlled:0 "内阁人选仅来自极具影响力的[Concept('concept_interest_group', '利益集团')]"
 country_bpm_cabinet_controlled_desc:0 "内阁任命大多在烟雾缭绕的密室中敲定，仅由总统形式上加冕。内阁人选仅来自极具影响力的[Concept('concept_interest_group', '利益集团')]。"
