l_turkish:
 ideology_sta_minimal_state:0 "Minimal Devlet"
 ideology_sta_minimal_state_desc:0 "#lore Bu grup, eğer var olacaksa bile, devletin mümkün olduğunca küçük olması gerektiğine inanır. #!"

 ideology_sta_decentralized_state:0 "Ademimerkeziyetçi Devlet"
 ideology_sta_decentralized_state_desc:0 "#lore Bu grup, devlet gücünün yönetim biçimine bağlı olarak demokratik konseylerden yerel soylulara kadar değişebilen yerel otoritelere devredilmesi gerektiğine inanır. #!"

 ideology_sta_weak_state:0 "Sınırlı Devlet"
 ideology_sta_weak_state_desc:0 "#lore Bu grup, yalnızca sivil toplumun düzgün işleyişini sağlamakla görevli, sınırlı bir devlete inanır ve daha fazlasını istemez. #!"

 ideology_sta_powerful_state:0 "Güçlü Devlet"
 ideology_sta_powerful_state_desc:0 "#lore Bu grup, iradesini kitlelere dayatabilen güçlü ve merkezi bir devlete inanır. #!"

 ideology_sta_progressive_state:0 "İlerici Devlet"
 ideology_sta_progressive_state_desc:0 "#lore Bu grup, gücünü vatandaşlarının haklarını ve refahını garanti altına almak için kullanan güçlü ve ilerici bir devlete inanır. #!"

 ideology_sta_security_state:0 "Güvenlik Devleti"
 ideology_sta_security_state_desc:0 "#lore Bu grup, kendi güvenliğini toplumdaki diğer tüm endişelerin üstünde tutan çok güçlü bir devlete inanır. #!"

 ideology_sta_subjugated_state:0 "Boyun Eğdirilmiş Devlet"
 ideology_sta_subjugated_state_desc:0 "#lore Bu grup, devleti nihayetinde sönümlenip yok olması amacıyla boyunduruk altına almak ister. #!"

 ideology_sta_subjugated_security_state:0 "Boyun Eğdirilmiş Güvenlik Devleti"
 ideology_sta_subjugated_security_state_desc:0 "#lore Bu grup, devleti nihayetinde sönümlenip yok olması amacıyla boyunduruk altına almak ister, ancak şimdilik gücü pekiştirmek için devleti kullanma ihtiyacı hisseder. #!"

 ideology_sta_federated_state:0 "Federal Devlet"
 ideology_sta_federated_state_desc:0 "#lore Bu grup, gücünü yerel otoritelerle paylaşan güçlü ve federal bir devlete inanır. #!"
 ideology_sta_devolved_state:0 "Yetkileri Devredilmiş Devlet"
 ideology_sta_devolved_state_desc:0 "#lore Bu grup, gücünün bir kısmını yerel otoritelerle paylaşan güçlü ve yetkileri devredilmiş bir devlete inanır. #!"
 ideology_sta_effective_state:0 "Etkili Devlet"
 ideology_sta_effective_state_desc:0 "#lore Bu grup, iradesini dayatabilirken aynı zamanda hesap verebilir olan etkili bir devlete inanır. #!"

 ideology_sta_organic_state:0 "Organik Devlet"
 ideology_sta_organic_state_desc:0 "#lore Bu grup, büyük miktarda otoritenin yerel ve geleneksel kurumlarda yoğunlaştığı ademimerkeziyetçi (merkezi olmayan) bir devlete inanır. #!"
 ideology_sta_institutional_state:0 "Kurumsal Devlet"
 ideology_sta_institutional_state_desc:0 "#lore Bu grup, iradesini kitlelere dayatabilen, ancak liyakatlerine bakılmaksızın şu anda iktidarda olanlara hareket alanı tanıyan güçlü ve merkezi bir devleti arzular. #!"