 je_bpm_bnap_the_question_of_british_rule:0 "英国统治的问题"
 je_bpm_bnap_the_question_of_british_rule_desc:0 "英国统治的问题在北美殖民地中是一个热门话题。"
 je_bpm_bnap_the_question_of_british_rule_reason:0 "自 1763 年以来，英国人一直统治着我们，但现在是时候做出改变了吗？英国人越深入我们的事务，他们向我们索取的就会越多，但我们也越能从他们那里得到更多。我们必须决定是否愿意接受这一切，还是应当设法远离伦敦。\n\n英国人负担了我们 #tooltippable;tooltip:[Country.GetTooltipTag],bpm_british_admin_payment_tt [Country.MakeScope.ScriptValue('bpm_british_administrative_payments_percent')|%0]#! 的行政开支。"
