austria_germany.1.t: "Yetmiş Milyonluk Reich"
austria_germany.1.d: "Eski #b Avusturya İmparatorluğu#! topraklarının tamamının [ROOT.GetCountry.GetName] içine dahil edilmesi, [GetCulture('north_german').GetName] milliyetçileri arasında büyük bir paniğe neden oldu. Birçoğu, Almanların kendi devletlerinde azınlık durumuna düşmemeleri için bu bölgelere bağımsızlık verilmesini talep ediyor."
austria_germany.1.d1: "Eski #b Avusturya İmparatorluğu#! topraklarının tamamının [ROOT.GetCountry.GetName] içine dahil edilmesi, Alman olmayan nüfusları arasında büyük bir paniğe neden oldu. Birçoğu, Alman milliyetçisi bir devlet altında ayrımcılığa uğramaktan veya zorla asimile edilmekten korkuyor."
austria_germany.1.f: ""Anlamalısınız," dedi Prusyalı delege, "halk korkuyor. Kırk milyona yakın eski Avusturyalının ulusumuzun karakterini sulandıracağından korkuyorlar ve onların dahil edilmesinin Almanya'yı Büyük Avusturya'dan başka bir şey yapmayacağından korkuyorlar."\n\nAvusturyalı başını iki yana salladı. "Onlar iyi Katolik tebaalardır; yabancı kışkırtmalarıyla ayağa kaldırılmadıkları sürece uysaldırlar. Sizi temin ederim ki bu korkular tamamen yersizdir."\n\n"Sorun da bu, değil mi? Burası Katolik İmparatorluğu değil.""
austria_germany.1.a: "Alman olmayan bölgeleri bağımlı devletler olarak serbest bırakın."
austria_germany.1.b: "Alman olmayan bölgelere bağımsızlık verin."
austria_germany.1.c: "Yetmiş Milyon Planının rotasından sapmayın."

austria_germany_warning_2_tt: "#r Hegemonik bir Büyük Alman devleti kurmak, diğer Büyük Güçler arasında korku yaratacaktır#!"
austria_germany_warning_tt: "#r Bölünmemiş bir Büyük Alman devleti kurmak, diğer Büyük Güçler arasında korku yaratacaktır#!"

