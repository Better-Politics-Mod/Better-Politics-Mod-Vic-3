 bpm_pronounced_support_for_democracy_despite_backlash: "Tepkilere Rağmen Demokrasiye Belirgin Destek"
 bpm_ig_support_from_church_authorities: "Kilise Yetkililerinden Resmi Destek Alındı"
 bpm_strong_backlash_for_pronouncing_support_for_democracy: "Demokrasiyi Desteklediği İçin Çok Güçlü Tepkiyle Karşılaştı"
 bpm_interest_group_supportive_of_liberal_democracy: "Liberal Demokrasiyi Destekleyen Modernist Karşıtı Çıkar Grubu"
 bpm_reinforcing_anti_modernist_ideas: "Modernist Karşıtı Duruşların Güçlendirilmesi"
 option_moderated_towards_democracy_tt: "#v İdeolojik Eğilim#! İlerleme Çubuğu ayda #italic 0.1#! puan #bold Demokrasi Tarafına#! doğru hareket edecektir."
 option_moderated_towards_christianity_tt: "#v İdeolojik Eğilim#! İlerleme Çubuğu ayda #italic 0.1#! puan #bold Hristiyanlık Tarafına#! doğru hareket edecektir."

 bpm_christdem_flavour.1.t: "[ROOT.GetCountry.GetName] Başpiskoposu Demokrasiyi Savunuyor"
 bpm_christdem_flavour.1.desc: "Başpiskoposumuz, demokrasinin zemininde durmayı ve orada kalmayı savunan görüşleri savunduğu ve aynı zamanda Kilise'nin liberal anayasaya düşman olmadığını gizlice temin ettiği, dikkat çeken ve tartışmalı bir konuşma yaptı. Konuşma, Kilise'nin modernist politikalarına karşı duyulan hoşnutsuzluk sesleri kadar alkış topladı ve Başpiskoposun bizzat kendisi de tepkiyle karşılaştı."
 bpm_christdem_flavour.1.f: "Devletin doğru olduğuna inandığı şeye inanmak için devlet tarafından zorlanmak istemiyorum, çünkü Devlet hakikatin yargıcı değildir. Ancak Devlet, seçtiğim hakikatin pratiğinde, yani inandığım dinin icrasında beni korumakla yükümlüdür. Özgür devletin sadece her bir vatandaş için değil, inançlarını ifade etmek ve yaymak için bir araya gelen vatandaş grupları için, yani şirketler, dernekler ve kiliseler için saygı duymak ve garanti etmek zorunda olduğu modern devletteki dini özgürlüğü oluşturan şey budur.\n\n— Charles de Montalembert, 1863"

 bpm_christdem_flavour.1.a: "Kilise nihayet ilerliyor ve günümüzü kabul ediyor."
 bpm_christdem_flavour.1.b: "Başpiskopos modernist tehdidin içine çok fazla girdi." 
 

 bpm_christdem_flavour.3.t: "Herkese Karşı Yapayalnız"
 bpm_christdem_flavour.3.desc: "Siyasi yalnızlık ve zorunlu kendine yetme hissi birçok Katolik aktivistin üzerinde ağır bir yük oluşturmakta ve bu durum genellikle etki ve üye kazanmak için verilen sürekli siyasi mücadelelerin yanı sıra @ig_conservatives! Muhafazakarlar'dan, @ig_liberals! Liberaller ve @ig_socialists! Sosyalistler'e ve hatta Katolik Kilisesi'nin kendisine kadar pek çok dostane olmayan gruba karşı kendi adamlarını koruma çabalarıyla daha da şiddetlenmektedir. Sınırlamalar Katolikleri zorlarken, onlara giderek daha radikal eylemler gerçekleştirme ve rakiplerini yenme gücü ve şevki de vermektedir."
 bpm_christdem_flavour.3.f: "— Muhafazakarlardan anlık destek almazsak bu şeytani liberallerle savaşmamızın imkanı yok diyorum sana! Hatta ben bir subaydan destek bile—...\n\n— Ben de sana hiçbir yolumuz ve yanımızda kimsemiz yok diyorum, çünkü kendi başımızayız! Bizi kullanmak için çoktan anlaştılar ve bunun da ötesinde Kilise engellerle bizi bunaltıyor... Bırakın cehennem bu açgözlü günahkarların hepsini alsın artık..."
 
 bpm_christdem_flavour.3.a: "Bizim her zaman birbirimiz var!"
 bpm_christdem_flavour.3.a.tt: "#v Katolik Kilisesi'nden Bağımsızlık#! Çubuğu #bold #italic %0.5#!#! oranında ilerleyecektir."
 
 bpm_christdem_flavour.3.b: "En azından Kilise'nin biraz yardımı dokunabilir..."

 bpm_rising_internationalism_amongst_christian_youth: "Hristiyan Gençlik Arasında Yükselen Enternasyonalizm"

 bpm_christdem_flavour.15.a.tt: "#v Katolik Kilisesi'nden Bağımsızlık#! Çubuğu #bold #italic %0.25#!#! oranında ilerleyecektir."
 bpm_christdem_flavour.15.t: "Katolik Gençler Ulusal Renkleri Dalgalandırmayı Reddediyor"
 bpm_christdem_flavour.15.desc: "Katolik gençlik örgütlerinden birinin yerel toplantısında inanılmaz bir skandal yaşandı. Çoğunluğu işçi olan gençlerin bir kısmı ulusal marşı söylemeyi reddetti ve bu olay üzerine toplananların geri kalanıyla büyük bir dirençle tartıştılar.\n\nBölümün her türlü [ROOT.GetCountry.GetAdjective] sembolizmine karşı oldukça düşmanca bir tavır sergilediği ve 'geleneksel milliyetçiliği' 'toplumsal gericilik' olarak nitelendirdiği haberi yerel basına ulaştı."
 bpm_christdem_flavour.15.f: "Yıllar önce şehrimdeki işçi sınıfı gençlerinden oluşan bir birliğin kontrolüm altında olduğunu hatırlıyorum. Çocuklar çok radikal ve çok farklıydılar ama ne dini bağnazlardı! Hepsi genel olarak bayrak idealinin modasının geçtiğini hissediyordu, devlet için dua etmeleri istendiğinde her zaman mızmızlanıyor veya itiraz ediyorlardı ve kendi üyeleriyle veya başkalarıyla yaptıkları her toplantıda, her seferinde bayrağımızı dalgalandırmayı reddettiler. Herhangi bir ulus olarak değil, genel olarak halka veya Avrupalılar olarak kendilerini daha bağlı hissediyorlardı."

 bpm_christdem_flavour.15.a: "Sanırım bunu görmezden gelmeliyiz..."
 bpm_christdem_flavour.15.b: "Onları disipline edin! Hiç kimse ulusal sembollerimize saygısızlık edemez."
 
 bpm_christdem_split.30.t: "Değişimin Gün Batımı"
 bpm_christdem_split.30.d: "Büyük yoksulluk, ekonomik kriz ve hayal edilemeyecek kadar korkunç çalışma ve yaşam koşulları, @ig_christian_democrats! #blue Hristiyan Demokratlar#!ı ideolojilerini son derece anti-kapitalist ve demokratik konumlara doğru dönüştürmeye yöneltti. Evrensel bir siyasi ve sosyo-ekonomik demokrasiyi ön plana çıkararak; genel oy hakkının, kadınlara oy hakkının, ekonomik sosyalleşmenin ve merkezi planlama üstünlüğünün (tümü Hristiyan ahlakı ve sivil toplum tarafından sınırlandırılmış şekilde) getirilmesini önerdiler."
 bpm_christdem_split.30.f: "Hayatlarımızın siyasi demokratikleşmesi, ekonomik ve sosyal demokratikleşme ile tamamlanmalıdır.\n\n(...)\n\nLiberal-kapitalist politikanın, özellikle sosyal etkileri açısından ölümcül olduğu kanıtlanmıştır. Ana hedefi yalnızca girişimci ve kapitalist için mümkün olan en büyük kişisel kârı elde etmek olan, adalet, insan onuru ve ortak iyi ilkesini hiç umursamayan bu politika, sağlıklı bir sosyal düzenin temeline zarar vermektedir.\n\n— Emek Partisi (Stronnictwo Pracy) Programı, 1937"
 bpm_christdem_split.30.a: "Bunlar bir tür sosyalist kopyası mı?"

