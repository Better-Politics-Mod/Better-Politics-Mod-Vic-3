l_simp_chinese:
 bpm_marlib_split.1.t:0 "市场自由派"
 bpm_marlib_split.1.d:0 "时而被人讥为无可救药的乌托邦主义者，时而又被指责为冷酷无情的牟利之徒，@ig_market_liberals! #yellow 市场自由派#! 已经登场，来捍卫“看不见的手”的力量。他们许诺以交换带来和平，以竞争带来繁荣，国家由贤能之士指引，而社会中的每个人都是自己命运的主宰者。"
 bpm_marlib_split.1.f:0 "通过刺激工业、奖赏才智，并最有效地利用自然所赋予的特殊力量，自由贸易能够最有效、最经济地分配劳动：同时，通过增加生产的总量，它传播普遍的福祉，并凭借利益与交往这一共同的纽带，将文明世界中的万国社会联结为一体。\n\n——大卫·李嘉图，1821"
 bpm_marlib_split.1.a:0 "市场会解决一切！"
 bpm_marlib_split.2.t:0 "功利主义者"
 bpm_marlib_split.2.d:0 "有时被视为过于务实，有时又因强调最大多数人的福祉而受到赞扬，@ig_market_liberals! #yellow 功利主义者#! 已经成为最大化最大多数人幸福的倡导者。他们主张在个人自由与社会福祉之间取得平衡的政策，旨在创造一个更公平、更高效的社会。"
 bpm_marlib_split.2.f:0 "最大多数人的最大幸福，是道德与立法的基础。通过优先采取增进整体福祉、减少苦难的行动，我们能够建立起一个依托理性原则与人道价值而繁荣的社会。\n\n——杰里米·边沁，1789"
 bpm_marlib_split.2.a:0 "为最大多数人谋最大的善！"
