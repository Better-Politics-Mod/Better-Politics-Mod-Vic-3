# Sometimes vic3-tiger makes a mistake in determining the scope types expected
# by a scripted trigger or effect. Its conclusions can be overridden here.
# Scope overrides can be ALL (to accept any scope) or a list separated by |,
# like character|province|landed_title
scope_override = {
    bpm_codification_is_constitutional_law = law
    bpm_issue_attraction = flag
    var:bpm_action_type = flag
    com_type = value
    global_list:bpm_unrepealable_amendment_types = amendment_type
    bpm_country_has_law_or_variant_entrenched = country
    bpm_country_has_law_entrenched = country
}

