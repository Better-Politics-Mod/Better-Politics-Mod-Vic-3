 je_bpm_ideological_leaning_progress_tooltip:0 "#v 意识形态倾向#!代表了天主教运动、政党、工会、团体和组织内部现有的思潮、变迁与争论，改变着它们在[GetLawGroup('lawgroup_distribution_of_power').GetName]、[GetLawGroup('lawgroup_rights_of_women').GetName]、宗教道德以及神授主权与人民主权之辨上的立场，也涉及基督教能否与民主相容的问题。总体上有三个主要的[Concept('concept_ideology', '意识形态')]与阵营：\n\n#v 基督教一侧#!（#italic <33%#!）——这一侧代表内部较为保守、教权甚至反动的思潮，主导意识形态为[GetIdeology('ideology_dop_conservative_democrat').GetName]，他们怀旧地追念旧日，谋求以宗教道德和强大的[GetTechnology('corporatism').GetName]为指导的强有力统治，如在立法机构中赋权职业团体（例证包括#bold 立陶宛 #tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_group_krikscionys_demokratai_tooltip Krikščionys Demokratai#!#!、#bold 西班牙基督教民主集团#!和#bold #italic 共和国时期#!的奥地利#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_group_laborists_and_agrarians_tooltip 劳工派与农本派#!#!）。\n\n#v 中间/温和一侧#!（#italic >25%、<75%#!）——这一侧代表经由[GetIdeology('ideology_dop_divine_democrat').GetName][concept_ideology]所体现的、普遍的自由-保守、自由-教权、保守的@middling! [Concept('concept_middle_strata', '中产阶级')]思潮。他们将致力于维护神授主权高于人民主权的首要地位，同时保持审慎的温和、宗教道德，并反对[GetLawType('law_universal_suffrage').GetName]（例证包括#bold 荷兰反革命党的天主教派系#!、#bold #italic 共和国之前#!的奥地利#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_group_corporatists_tooltip 市民派#!#!以及#bold #italic 少数独立#!的匈牙利基督教民主主义者#!）。\n\n#v 民主一侧#!（#italic >66%#!）——这一侧代表以农民和工人为基础的、总体上进步的各种[GetIdeology('ideology_dop_christian_democrat').GetName]思潮。他们最重要的诉求是推行[GetLawType('law_universal_suffrage').GetName]，追求在生活各领域引入并扩展民主、下放权力、扩大[GetLawGroup('lawgroup_labour_associations').GetName][Concept('concept_law', '法律')]，并在政治生活中限制[concept_religion]的压迫性（但不排斥一般性的宗教道德）（例证包括#bold 意大利 #tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_group_popularists_tooltip 平民主义者#!#!、#bold 德国 #tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_group_zentrumites_tooltip 中央党人#!#!和#bold 捷克 #tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_group_lidovci_tooltip 利德维派#!#!）。\n\n#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_christ_dem_pedia_tooltip #bold #gold ChristDemPedia#!#!#!"
 je_bpm_economical_leaning_progress_tooltip:0 "#v 经济倾向#!代表了天主教运动、政党、工会和组织内部现存的高度分裂的思潮、变迁与争论，以及对待资本主义的总体态度，和它们在[GetLawGroup('lawgroup_economic_system').GetName]、[GetLawGroup('lawgroup_trade_policy').GetName]、[GetLawGroup('lawgroup_land_reform').GetName]、私有制与经济发展上的立场。总体上有三个主要的[Concept('concept_ideology', '意识形态')]与阵营：\n\n#v 分配主义一侧#!（#italic <20%#!）——这一侧代表“基督教社会主义”式的、保守的、从@middling! [Concept('concept_middle_strata', '中产-')]到[Concept('concept_upper_strata', '上层阶级')]的思潮，他们认为受到轻微监管的资本主义更像是事物的本性，热衷于通过财政保守政策建立[GetIdeology('ideology_eco_distributist_economy').GetName]，支持有限的[GetLawType('law_interventionism').GetName]和经济法团主义、温和的[GetLawType('law_homesteading').GetName]、[GetLawType('law_protectionism').GetName]，而在[GetLawGroup('lawgroup_taxation').GetName]上往往没有明确立场。（例证包括#bold 捷克 #tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_group_lidovci_tooltip 利德维派#!#!和#bold #italic 共和国时期#!的奥地利#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_group_laborists_and_agrarians_tooltip 劳工派与农本派#!#!）；#v 基督教社会主义者#!，与其名称所示不同，他们#bold 并非#!社会主义者。此处的这一术语指的是谋求全面推行《新事》通谕的天主教活动家。他们从根本上反资本主义，谋求回归手工业生产方式，同时又反对过度的政府干预。（例证包括#bold #italic 1930年代之前#!的波兰#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_group_chadecy_tooltip 哈德齐派#!#!和#bold 奥地利 #tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_group_christlichsozialen_tooltip 联合基督徒#!#!）。\n\n#v 温和/中间立场#!（#italic >15%、<85%#!）——这一侧代表对资本主义较为凝聚而温和的立场，谋求推行[GetIdeology('ideology_eco_modern_interventionist').GetName]政策。现代干预主义经济的支持者对[GetLawType('law_interventionism').GetName]的投入程度差别很大。他们总体上谋求推行现代经济政策，会支持监管型经济、现代化和国家对工业化的扶持，但也可能支持更为经济民主和统制主义的政策——如所有权的#gold 民主化#!；对关键部门的[Concept('concept_nationalize', '国有化')]（如#yellow 重工业#!、[GetBuildingType('building_railway').GetName]），甚至#bold 有限的国家计划#!以应对[Concept('concept_unemployed', '失业')]或[Concept('concept_good', '资源')]匮乏。他们还支持累进而公正的[GetLawGroup('lawgroup_taxation').GetName]、更偏向[GetLawType('law_free_trade').GetName]的政策以及土地改革（例证包括#bold 比利时 #tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_group_young_right_tooltip 青年右翼#!#!运动/派系、#bold 法国 #tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_group_popular_democrats_tooltip 平民民主党人#!#!和#bold 意大利 #tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_group_popularists_tooltip 平民主义者#!#!）。\n\n#v 反资本主义一侧#!（#italic >80%#!）——这一侧代表那些看到当今贫苦境况、视资本主义为可怕的历史遗物、认为许多现代[Concept('concept_party', '政党')]都想“修补”资本主义的思潮。他们转而主张[GetIdeology('ideology_eco_centralized_economy').GetName]——一种以[GetLawType('law_command_economy').GetName]为主、辅以法团主义、有限社会化与全面民主化的经济，一种高度合作社化的农民自有农业，并通过[GetLawType('law_free_trade').GetName]打破国际贸易壁垒，认为[GetLawType('law_protectionism').GetName]只会造成不必要的损害（例证包括#bold #italic 1930年之后#!的波兰#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_group_chadecy_tooltip 哈德齐派#!#!和#bold #italic 年轻的#!德国#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_group_zentrumites_tooltip 中央党人#!#!）。\n\n#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_christ_dem_pedia_tooltip #bold #gold ChristDemPedia#!#!#!"
 je_bpm_welfare_leaning_progress_tooltip:0 "#v 福利倾向#!代表了天主教运动、政党、工会和组织内部高度分裂的思潮、变迁与争论，以及它们在福利上的立场，例如在[GetLawGroup('lawgroup_education_system').GetName]、[GetLawGroup('lawgroup_health_system').GetName]或[GetLawGroup('lawgroup_welfare').GetName]上，以及应当如何推行——是通过慈善等私人倡议、法团主义，还是应当由国家介入。总体上有三个主要的[Concept('concept_ideology', '意识形态')]与阵营：\n\n#v 社会一侧#!（#italic <25%#!）——这一侧代表保守、严格宗教、法团主义的思潮，认为在法团主义和[GetIdeology('ideology_wel_religious_welfare').GetName]之中，应当由私人倡议来主导福利。\n\n#v 温和/中间立场#!（#italic >20%、<80%#!）——这一侧代表通常宗教的、中产阶级、以工人为基础且相对温和的思潮，信奉[GetIdeology('ideology_wel_social_market_welfare').GetName]，谋求在私人倡议不足以维持工人正常生活时引入国家的控制与支持。他们通常倾向于推行补贴而非全额资助的福利。\n\n#v 国家一侧#!（#italic >75%#!）——这一侧代表进步、以工人为基础的思潮，谋求逐步而高效地推行[GetIdeology('ideology_wel_expanded_public_welfare').GetName]，认为私人的法团主义理念并非应对社会问题与贫困的恰当答案。"
 je_bpm_independence_from_church_tooltip:0 "#v 脱离天主教会#!代表了天主教平信徒在多大程度上独立于#bold 教会#!当局及其影响。此进度条每月增长，在此[concept_journal_entry]中每取得#bold 10%的进度#!，[GetInterestGroupVariant('ig_christian_democrats',GetPlayer).GetNameWithCountryVariant]就会就涉及其[concept_interest_group]的诸多议题展开辩论，并借助你的帮助，根据各地情况塑造和改变其[concept_ideology]。\n\n以下数值影响#v 脱离天主教会#!：\n    @arrow_up! 保守的[GetLawGroup('lawgroup_church_and_state').GetName][Concept('concept_law', '法律')]；\n    @arrow_up! 反教权的[GetInterestGroupVariant('ig_liberals', GetPlayer).GetNameWithCountryVariant]和[GetInterestGroupVariant('ig_radicals', GetPlayer).GetNameWithCountryVariant]的[concept_clout]\n    @arrow_up! “#bold 新事#!”通谕已颁布；\n    @arrow_up! #yellow 自由#!与#gold 激进#![Concept('concept_political_movement', '政治运动')]的[concept_political_movement_support]；\n    @arrow_up! #pink 社会主义#!或#pink 无政府主义#![Concept('concept_political_movement', '政治运动')]；\n    @arrow_up! 研究出[GetTechnology('labor_movement').GetName]或[GetTechnology('political_agitation').GetName]等[Concept('concept_technology', '科技')]；\n    @arrow_up! #gold @academics! 自由意识#!；\n    @arrow_up! [GetInterestGroupVariant('ig_christian_democrats', GetPlayer).GetName]受欢迎程度的逐步上升；\n    @arrow_up! [GetInterestGroupVariant('ig_trade_unions', GetPlayer).GetNameWithCountryVariant]的[concept_clout]；\n    @arrow_down! “#bold 论基督宗教的民主#!”通谕已颁布；\n    @arrow_down! [GetInterestGroupVariant('ig_devout', GetPlayer).GetNameWithCountryVariant]的[concept_clout]；\n    @arrow_down! 精英主义的[GetInterestGroupVariant('ig_conservatives', GetPlayer).GetNameWithCountryVariant]、[GetInterestGroupVariant('ig_reactionaries', GetPlayer).GetNameWithCountryVariant]和[GetInterestGroupVariant('ig_national_liberals', GetPlayer).GetNameWithCountryVariant]的[concept_clout]；\n\n当前数值：0.[GetPlayer.MakeScope.ScriptValue('bpm_indepndence_from_the_church_values')|0]"
 je_bpm_christian_democrat_development_stages_tooltip:0 "[GetInterestGroupVariant('ig_christian_democrats',GetPlayer).GetNameWithCountryVariant]的发展大体上有几个阶段与节点：\n\n (1) #v 0%#!：[GetLawType('law_wealth_voting').GetName]或更高；天主教的[concept_state_religion]或重要少数派；强大的[concept_bpm_ig_is_liberal]或[concept_bpm_ig_is_socialist][concept_interest_group]。\n    平信徒[GetInterestGroupVariant('ig_christian_democrats', GetPlayer).GetName]作为对现代主义危险的回应而出现，尽管#bold 教会#!想将他们置于掌控之下。\n\n (2) #v 25%#!：需要颁布#v “忧虑之母”#!通谕。\n    [GetInterestGroupVariant('ig_christian_democrats', GetPlayer).GetName]获得更多关注，讨论自由民主与民族主义之事，并可能宣布支持福利措施。\n\n (3) #v 50%#!：需要颁布#v “新事”#!通谕。\n    [GetInterestGroupVariant('ig_christian_democrats', GetPlayer).GetName]以通谕为思想基础，开始在福利、经济与资本主义问题上确立立场。\n\n (4) #v 75%#!：需要颁布#v “论基督宗教的民主”#!通谕。\n    [GetInterestGroupVariant('ig_christian_democrats', GetPlayer).GetName]与平信徒运动在被#bold 教皇#!点名之后，开始全面参与政治生活，并以形形色色的名目与理想积极参与选举政治和基层运动。"
