 hog_regency.3.t:0 "$bpm_hog_title_default_contextless$成年"
 hog_regency.3.d:0 "[SCOPE.sCharacter('hog_scope').GetFullName]已届成年，现在可以即位成为$bpm_hog_title_default_contextless$。[SCOPE.sCharacter('acting_hog_scope').GetFullName]将不再担任代理$bpm_hog_title_default_contextless$。"
 hog_regency.3.f:0 "[SCOPE.sCharacter('acting_hog_scope').GetFullNameNoFormatting]注视着神父完成最后的涂油礼。今日的$bpm_hog_title_default_contextless$与昨日的判若两人，其差距远超[SCOPE.sCharacter('acting_hog_scope').GetSheHe]所能想象。[SCOPE.sCharacter('hog_scope').GetSheHe|U]站得比从前更挺拔，脸上带着一副久经磨砺的坚毅神色。法衣披上[SCOPE.sCharacter('hog_scope').GetHerHis]肩头时，显得轻若无物。\n\n神父退下，号角齐鸣，伴随着宫墙外隆隆的炮声。\n\n"我在此许下的诺言，必将履行与恪守，"$bpm_hog_title_default_contextless$朗声诵道，"愿[SCOPE.GetRootScope.GetCountry.GetCustom('GetDivinity')]助我。""
 hog_regency.3.a:0 "$bpm_hog_title_default_contextless$万岁！"
 regency.1.a:0 "[SCOPE.sCharacter('regent_scope').GetFullName]将代行年幼的[SCOPE.sCharacter('monarch_scope').GetPrimaryRoleTitle]的统治职责。"
