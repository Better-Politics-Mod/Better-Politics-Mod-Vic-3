l_turkish:
 bpm_2nd_intl.1.t:0 "Yeni Bir Enternasyonalin Tohumları"
 bpm_2nd_intl.1.d:0 "İşçi sınıfının çıkarlarının ulusal sınırları aştığı @ig_socialists! Sosyalistler arasında genel olarak kabul görmektedir. Ancak #pink Uluslararası İşçi Birliği'nin#! sona ermesinden bu yana, yeni bir uluslararası koalisyon kurmak için ciddi bir girişimde bulunulmadı. Bunu düzeltmek amacıyla çeşitli işçi örgütlerinden delegeler bugün İsviçre'de bir araya geldi ve #pink İkinci Enternasyonal'in#! kurucu belgesi olarak yeni bir sosyalist manifestonun taslağının hazırlanmasına karar verildi."
 bpm_2nd_intl.1.f:0 "Eski ve Yeni Dünya proletaryasında bir uyum ruhu hakimdir. Acı çekenler ve ezilenler arasında sömürücülerine karşı nefret, kapitalist zalimlerine karşı güvensizlik artıyor. Kardeşlerim, bunun belirleyici an olduğunu hissetmiyor musunuz?\n\n—Brüksel Kongresi, 1880"
 bpm_2nd_intl.1.a:0 "Buna göz kulak olalım."

 bpm_2nd_intl.2.t:0 "Enternasyonal ve Hoşnutsuzlukları"
 bpm_2nd_intl.2.d:0 "#pink İkinci Enternasyonal'in#! toplanması planlandığı gibi gitmedi. Kötü organize edilmesinin yanı sıra, sosyalist hareketin bölünmelerle sarsıldığı görülüyor.\n\nBunların başında, pratik bir sorun üzerinde anlaşmazlığa düşen @ig_reformist_socialists! Reformistler ile @ig_revolutionist_socialists! Devrimciler arasındaki bölünme geliyor; ilki sadece gerçek delegelerin katılabilmesi gerektiğinde ısrar ederken, ikincisi yalnızca anonimliğin tüm katılımcıların güvenliğini sağlayabileceğini savunuyor.\n\nUzlaşamayan her iki kamp da ayrı kongreler düzenlemeye başladı."
 bpm_2nd_intl.2.f:0 "Kongre toplandı. İşçi sınıfı hareketinin tüm tarihi boyunca bir İşçi Kongresi hiçbir zaman böylesine aşağılayıcı koşullar altında toplanmamıştı.\n\n—Eduard Bernstein, 1889"
 bpm_2nd_intl.2.a:0 "Ayaktakımı kışkırtıcıları arasında anlaşmazlık mı? Güzel!"

 bpm_2nd_intl.2b.t:0 "Sosyalistlerimiz Bölündü!"
 bpm_2nd_intl.2b.d:0 "@ig_socialists! Sosyalistler güçlendikçe, aralarındaki çeşitli doktrinel ve taktiksel anlaşmazlıklar da giderek hararetleniyor. Bu farklılıklar son bir tartışmada doruk noktasına ulaştı ve bir taraf muhaliflerini toplantı salonundan zorla dışarı attı. İki farklı fraksiyon ortaya çıktı: @ig_reformist_socialists! Reformistler ve @ig_revolutionist_socialists! Devrimciler."
 bpm_2nd_intl.2b.f:0 "Tüm farklılıklara neden olan sorunun özü budur. Orta sınıf ile proletarya arasındaki uzlaşmazlık, proletaryanın orta sınıfın bazı kesimleriyle orta sınıfın diğer gruplarına karşı ittifak kurmasını engelleyecek kadar büyük müdür? Yoksa orta sınıfın içinde, orta sınıf ile işçi sınıfı arasında var olan düşmanlıktan daha büyük düşmanlıklar mı var?\n\n—Karl Kautsky, 1902"
 bpm_2nd_intl.2b.a:0 "Anlıyorum."

 bpm_2nd_intl.3.t:0 "Possibilist Enternasyonal"
 bpm_2nd_intl.3.d:0 "@ig_reformist_socialists! Reformistlere Fransız Possibilistler ve İngiliz Sendikalar Kongresi öncülük ediyor. 'Marksist Klik' olarak adlandırdıkları grubun katı söylemini reddeden Possibilistler, genel olarak sosyalizme ulaşma yolunda şu an için mümkün olanı, yani kademeli reformları gerçekleştirmeye öncelik vermeyi seçiyorlar. Possibilist kongre, diğer şeylerin yanı sıra, sekiz saatlik işgünü ve işyeri demokrasisi için baskı yapma kararı aldı."
 bpm_2nd_intl.3.f:0 "Bu Uluslararası İşçi Kongresi, çalışma saatlerinin azaltılması, çocuk işçiliğinin sınırlandırılması ve benzeri önlemler lehine aldığı kararların, Endüstriyel Reform programının tamamını ifade ettiği şeklinde değerlendirilmemesi gerektiğini; ancak bu önlemlerin, emeğin zorluklarının şu an için hafifletilmesini sağlamak ve nihayetinde tüm üretim araçlarının mülkiyetinin ve kontrolünün bizzat işçiler tarafından güvence altına alınması için gerekli olan boş zamanı, eğitimi ve örgütlenmeyi teşvik etmek amacıyla talep edildiğini beyan eder.\n\n—Possibilist Kongre, 1889"
 bpm_2nd_intl.3.a:0 "Peki ya Marksistler?"

 bpm_2nd_intl.4.t:0 "Marksist Enternasyonal"
 bpm_2nd_intl.4.d:0 "Reformistlerin karşısında, Blanquistler ve diğer çeşitli geleneklerle birlikte Marksist sosyal demokrasi bayrağı altında birleşen @ig_revolutionist_socialists! Devrimciler yer alıyor. Genel olarak Marksistler, reformlar için ajitasyon yapmayı kendi başına bir amaçtan ziyade devrimci sınıf bilinci inşa etmenin bir aracı olarak görüyor ve sosyalizme ulaşmanın tek yolu olarak devrime öncelik veriyorlar. Genellikle yasadışı koşullarda çalışıyorlar ve bu nedenle Possibilistleri gerçek sosyalist davaya karşı çıkan, resmi olarak onaylanmış #gold 'Bakanlık Sosyalistleri'#! olmakla suçluyorlar."
 bpm_2nd_intl.4.f:0 "Sadece Sekiz Saatlik İşgünü bile hayata geçirilse, Emeğin nihai kurtuluşu yolunda ilk adım atılmış olacaktır. Bu belki de kendi içsel değerinden ziyade, uluslararası düzeyde hareket ettiklerinde işçilere vereceği güç bilinci sayesinde kazanılacaktır.\n\n—Cunninghame Graham, 1889"
 bpm_2nd_intl.4.a:0 "Tehlikeli suçlular."

 bpm_2nd_intl.5.t:0 "Kongrelerin Ardından"
 bpm_2nd_intl.5.d:0 "@ig_reformist_socialists! Reformist ve @ig_revolutionist_socialists! Devrimci kongreler sona erdi ve katılımcılar hararetli polemiklerin ve kişisel saldırıların haberlerini vermek üzere evlerine döndüler. Kongrelerin asıl içerikleri dikkat çekici derecede benzerdi; her ikisi de sekiz saatlik işgünü için bastırdı, her ikisi de kadınların eşitliği için bastırdı, her ikisi de yoldan çıkmış yoldaşlarıyla birlik konusunda iç çekişmelere maruz kaldı. Yine de, araçlar ve amaçlar konusundaki ayrılık derin ve onarılma ihtimali zayıf görünüyor."
 bpm_2nd_intl.5.f:0 "Bu Kongre, ezilenlerin haklarının bilinçli ve sistematik bir şekilde uygulanmasının, uluslararası proletarya ve sosyalizm tarafından planlı ve oybirliğiyle eyleme geçilmesinin yeni bir çağını zekice açıyor. Kesin ve belirleyici zaferin teminatıdır; yaşasın sosyal uluslararası cumhuriyet!\n\n—Marksist Kongre, 1889"
 bpm_2nd_intl.5.a:0 "Umarım düşman olarak kalırlar."

 bpm_2nd_intl.6.t:0 "Sera le Genre Humain?"
 bpm_2nd_intl.6.d:0 "Birbirine karşıt işçi kongrelerinin çalkantılarının üzerinden bir süre geçti. Olayın körüklediği kişisel düşmanlıklar yatıştı; her iki taraf da bir kez daha kendi kongrelerini toplamaya hazırlansa da, birleşik bir #pink İkinci Enternasyonal'de#! birleşme umuduyla birbirlerine delegeler gönderdiler.\n\nYoldaşlar yeniden bir araya mı gelecek, yoksa geçmişteki sosyalistlerin ve anarşistlerin yolundan mı gidecekler?\n\n#gold (Bu seçim, @ig_reformist_socialists! Reformistlerin ve @ig_revolutionist_socialists! Devrimcilerin uluslararası düzeyde işbirliği yapma istekliliğini etkiler.)#!"
 bpm_2nd_intl.6.f:0 "Uluslar arasındaki uçurumun bu şekilde köprülenmesini, farklı diyarların insanlarının büyük kesimlerinin bu denli uluslararası düzeyde kaynaşmasını dünya tarihi daha önce hiç görmemişti. Bu olgu, daha önce dünyada eşi benzeri görülmemiş bir manzara sunan askeri silahlanmaların gölgesinde var olduğu hatırlandığında daha da görkemli görünmektedir.\n\n—Karl Kautsky, 1892"
 bpm_2nd_intl.6.a:0 "İkisi birleşiyor — şimdilik. (Tarihsel)"
 bpm_2nd_intl.6.b:0 "İkisi ayrı kalıyor."

 bpm_2nd_intl.7.t:0 "Sembolik Bir Oylama"
 bpm_2nd_intl.7.d:0 "#pink İkinci Enternasyonal'in#! draması, kendi ülkemizdeki sosyalistler arasındaki bölünmeleri genişletti. Yakın tarihli bir parti toplantısında, iç çekişmeleri bir dönüm noktasına geldi. Bir fraksiyon yeni bir dizi üyelik kuralı önerirken, diğeri önergenin geçmesi halinde boykot tehdidinde bulundu.\n\nOylama nasıl sonuçlandı?\n\n#gold (Bu durum, kendi @ig_reformist_socialists! Reformistlerimizin ve @ig_revolutionist_socialists! Devrimcilerimizin aynı partide çalışma istekliliğini etkiler.)#!"
 bpm_2nd_intl.7.f:0 "Merkezi organların 'etkisiz' olduğunu onları boykot ederek kanıtlamaya çalışmak, Parti görevinin benzeri görülmemiş ve emsalsiz bir ihlalidir ve hiçbir safsata gerçeği gizleyemez: Boykot, Partiyi parçalamaya yönelik bir adımdır. Rus Sosyal-Demokrat hareketi; çevrelerden Parti'ye, dar kafalılıktan devrimci görevin kavranmasına, skandal tüccarlığı ve çevre baskısı yoluyla hareket etmekten disipline geçişin son zorlu aşamasının sancılarını çekmektedir.\n\n—Vladimir Lenin, 1903"
 bpm_2nd_intl.7.a:0 "İki fraksiyon uzlaşmaya vardı."
 bpm_2nd_intl.7.b:0 "Muhalif fraksiyon partiden atıldı."

 bpm_1st_commie_rev.2.t:0 "Sosyal Demokrasinin Krizi"
 bpm_1st_commie_rev.2.d:0 "#pink Sosyalist dünya devriminin ilk kıvılcımı [SCOPE.sCountry('first_major_rev_country_scope').GetName] sınırlarına ulaştı!#!\n\nDünyanın dört bir yanındaki işçiler sokaklarda kutlama yapsa da tüm sosyalistler tamamen mutlu değil. Bazıları durumun henüz olgunlaşmadığını söylerken, diğerleri yeni devrimci hükümetin otoriter uygulamalarını kınıyor. Bu tartışmalar önceden var olan anlaşmazlıkları ölüm kalım savaşına dönüştürdü; @ig_reformist_socialists! Reformistler ile @ig_revolutionist_socialists! Devrimcilerin daha önce birlikte çalışma ihtimalleri vardıysa bile, artık kesinlikle yok."
 bpm_1st_commie_rev.2.f:0 "Barış zamanında dünya proletaryasının başında yürüyormuş gibi yapan, bütün dünyaya akıl vermeye ve öncülük etmeye kalkışan, kendi ülkesinde her iki cinsiyetten en az on milyon destekçisi olan bu parti; Orta Çağ'ın satılık paralı askerleri gibi, egemen sınıfın emriyle dört yıl boyunca günde yirmi dört saat sosyalizmi çarmıha geren partinin ta kendisidir.\n\n—Rosa Luxemburg, 1918"
 bpm_1st_commie_rev.2.a:0 "Gelecek olanların bir işareti."

 bpm_1st_commie_rev.3.t:0 "Hayaleti Canlandırmak"
 bpm_1st_commie_rev.3.d:0 "Eski yoldaşlarının eylemsizliğinden bıkan sosyal demokrat hareketin radikalleri, kendilerine @ig_revolutionist_socialists! Komünistler demeye başladılar. Ilımlı kuzenleri ise devrimci söylemleri tamamen terk ederken @ig_reformist_socialists! Sosyal Demokrasi şeklindeki eski etiketi korudular."
 bpm_1st_commie_rev.3.f:0 "Ve şu anda şüphesiz tüm ülkelerin çalışan kitlelerinin en büyük sempatisini toplayan Partimiz, o eski resmi sosyalizmle bağlarını kopardığına dair mümkün olan en kararlı, keskin, net ve açık açıklamayı yapmalıdır; bu amaçla Partinin adının değiştirilmesi en etkili araç olacaktır.\n\n—Vladimir Lenin, 1918"
 bpm_1st_commie_rev.3.a:0 "Hayalet aslında hiç gitmemişti."