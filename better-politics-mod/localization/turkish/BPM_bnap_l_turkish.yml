 je_bpm_bnap_the_question_of_british_rule_desc:0 "İngiliz yönetimi meselesi, Kuzey Amerika sömürgelerinde hararetli bir konudur."
 je_bpm_bnap_the_question_of_british_rule_reason:0 "İngilizler bizi 1763'ten beri yönetiyor, ancak değişim zamanı geldi mi? İngilizler işlerimize ne kadar çok müdahil olursa, bizden o kadar çok şey talep edeceklerdir, ancak onlardan o kadar çok şey elde edebiliriz. Bunu kabul etmeye istekli miyiz, yoksa Londra'dan uzaklaşmanın yollarını mı aramalıyız buna karar vermeliyiz.\n\nİngilizler, idari maliyetlerimizin #tooltippable;tooltip:[Country.GetTooltipTag],bpm_british_admin_payment_tt [Country.MakeScope.ScriptValue('bpm_british_administrative_payments_percent')|%0]#!'lık kısmını karşılıyor."

