 ig_christian_democrats: "Hristiyan Demokratlar"
 ig_christian_democrats_only_icon: "@ig_christian_democrats!"
 ig_christian_democrats_desc: "Hristiyan Demokratlar, Katolikleri modern (liberal) demokrasiyle uzlaştırmayı amaçlayan sol kanat Katolik düşüncesini temsil eder. İdeolojileri büyük ölçüde yerel koşullara ve organikçilik (organicism) ilkesi ile Rerum novarum genelgesine dayansa da, genel olarak her türlü radikal kavramla desteklenen sosyal eşitlikçilik için çabalarlar. İtalyan enternasyonalist Popülerciler (Popularists), Alman büyük çatı partisi Zentrumspartei, Çek dağıtımcı Lidovci ve 1930'ların Polonyalı devletçi Chadecy'si bunlara örnektir."

 ig_catholic_interests: "Katolik Çıkarları"
 ig_catholic_interests_desc: "Katolik Kilisesi'nin siyasi açıdan çeşitli, bağımsız takipçilerini temsil eden bir çıkar bloku. Siyasette ve kültürde Katolik katılımını genişletmeyi ve örneğin sekülerizmin dayatılması gibi konularda inananları dini alanlardaki devlet baskısından korumayı amaçlarlar. Alman Zentrumspartei, Fransız Liberal Eylemi, İtalyan Opera dei Congressi ve Belçika F.C.C.C.A. bunlara örnektir."
 
