 notification_bpm_revolution_appears_name: "[Concept('concept_bpm_revolutionary_cell', '$concept_bpm_revolutionary_cells|q$')] Emerge"
 notification_bpm_revolution_appears_desc: "New cells of the revolutionaries led by the [SCOPE.gsInterestGroup('revolt_leader').GetName] have emerged in $BPM_REVOLT_TOAST_STATES$."
 notification_bpm_revolution_appears_tooltip: "#header $notification_bpm_revolution_appears_name$#!\n$TOOLTIP_DELIMITER$\n$notification_bpm_revolution_appears_desc$"
