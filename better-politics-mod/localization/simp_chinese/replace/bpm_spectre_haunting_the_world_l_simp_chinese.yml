l_simp_chinese:
 je_communism_1:1 "宗派还是阶级政党？"
 je_communism_1_reason:1 "[GetInterestGroupVariant('ig_trade_unions', GetPlayer).GetName]与各种更激进的[Concept('concept_bpm_ig_is_party_socialist','政党社会主义者')]有许多共同的目标和手段，但他们的组织凝聚力充其量仍然脆弱，甚至可说完全分裂。[Concept('concept_bpm_ig_is_party_socialist','政党社会主义者')]提出了 #PB 政党合并#! 的理论，认为社会主义只能通过一个将群众劳工组织与社会民主主义 #N 先锋队#! 结合起来的统一政党来推进。\n\n[Concept('concept_bpm_ig_is_party_socialist','政党社会主义者')]对工会的温和倾向不抱幻想，准备一次又一次地尝试 #pink 合并#!。预计这次 #pink 合并#! 尝试将在下月推进 #tooltippable;tooltip:[Country.GetTooltipTag],je_communism_1_special_tooltip [Country.MakeScope.Var('communism_progress_var_next').GetValue|-=]#!。\n\n#lore 理想的组织是所有无产阶级政党、政治团体、工会、合作社，都作为平等的成员联合起来；不是像如今英国那样没有纲领的工党，而是一个具有阶级意识、包罗万象的社会民主党。\n\n——卡尔·考茨基，1909#!"
 communism_1_progress_bar:0 "#PB 合并#!"
 je_communism_1_special_tooltip:0 "这一速率由以下因素决定：\n#variable [Country.MakeScope.Var('communism_progress_from_party_socialist_tu').GetValue|-=]#! 来自拥有[Concept('concept_bpm_ig_is_party_socialist','政党社会主义')]领袖的[GetInterestGroupVariant('ig_trade_unions', GetPlayer).GetName]\n#variable [Country.MakeScope.Var('communism_progress_from_tu_party').GetValue|-=]#! 来自同一[concept_party]中的[GetInterestGroupVariant('ig_trade_unions', GetPlayer).GetName]与[Concept('concept_bpm_ig_is_party_socialist','政党社会主义者')]\n#variable [Country.MakeScope.Var('communism_progress_from_movements').GetValue|-=]#! 来自包含[GetInterestGroupVariant('ig_trade_unions', GetPlayer).GetName]和[Concept('concept_bpm_ig_is_party_socialist','政党社会主义者')]的[concept_political_movement]\n#variable [Country.MakeScope.Var('communism_progress_from_revolutions').GetValue|-=]#! 来自包含[GetInterestGroupVariant('ig_trade_unions', GetPlayer).GetName]和[Concept('concept_bpm_ig_is_party_socialist','政党社会主义者')]的[concept_revolution]\n#variable [Country.MakeScope.Var('communism_progress_from_radicals').GetValue|-=]#! 来自[Concept('concept_incorporated_state','已合并州份')]中的[concept_radical]人口\n#variable [Country.MakeScope.Var('communism_progress_from_loyalists').GetValue|-=]#! 来自[Concept('concept_incorporated_state','已合并州份')]中的[concept_loyalist]人口\n#variable [Country.MakeScope.Var('communism_progress_from_laws').GetValue|-=]#! 来自 #bold 执法#! 和 #bold 内务#! [Concept('concept_institution', '$concept_institutions$')]\n#variable [Country.MakeScope.Var('communism_progress_from_igs').GetValue|-=]#! 来自[concept_bpm_ig_is_party_socialist][Concept('concept_interest_group','$concept_interest_groups$')]的人气\n#variable [Country.MakeScope.Var('communism_progress_from_characters').GetValue|-=]#! 来自[concept_bpm_ig_is_party_socialist][Concept('concept_agitator', '$concept_agitators$')]的人气\n#variable [Country.MakeScope.Var('communism_progress_var_add').GetValue|-=]#! 来自事件和其他效果"
 je_communism_2:0 "人民革命"
 je_communism_2_reason:0 "人民仍在国王、神父和资本家的暴政铁蹄下受苦。我们必须推翻反动政府，建立工人的天堂。"
 communism.1.t:1 "整个无产阶级的政党？"
 communism.1.desc:1 "不再只是一盘散沙的宗派，劳工运动如今团结在 #N 社会党#! 的旗帜下——然而这一成就已面临严重的内部威胁。在许多地方，旧的分歧只是被草草掩盖。如果我们作出某些让步，也许就能再次瓦解他们。"
 communism.1.f:1 "无论有没有拉萨尔，德国社会民主主义都会兴起，正如无论有没有马克思和恩格斯，国际无产阶级的阶级斗争都会成为近代史的主导因素。然而，德国无产阶级的阶级政党早在五十年前就以如此光辉灿烂的姿态出现在大门口，比所有其他国家早了二十多年，并成为它们的楷模，这要归功于拉萨尔的毕生事业和他的座右铭：“我敢于行动！”\n\n——罗莎·卢森堡，1913"
 communism.1.a:1 "为他们的劳动提供更高的工资。"
 communism.1.b:1 "让最后的奴隶主就此解脱。"
 communism.1.c:1 "保证工人更好的条件。"
 communism.1.d:1 "取消对工会的限制。"
 communism.1.e:1 "我们绝不投降！"
 communism.10.t:0 "大众政党"
 communism.10.d:0 "[GetInterestGroupVariant('ig_trade_unions', GetPlayer).GetName]与各种更激进的[Concept('concept_bpm_ig_is_party_socialist','政党社会主义者')]有许多共同的目标和手段，但他们的组织凝聚力充其量仍然脆弱。[Concept('concept_bpm_ig_is_party_socialist','政党社会主义者')]提出了 #PB 政党合并#! 的理论，试图将群众劳工组织与社会民主主义 #N 先锋队#! 结合起来。"
 communism.10.f:0 "由拉萨尔缔造的德国社会民主主义，是为阶级斗争建立群众、即人民多数的常设组织的第一次历史性尝试。多亏拉萨尔的政治行动和马克思的理论，德国社会民主主义光辉地解决了这一新任务。\n\n——罗莎·卢森堡，1913"
 communism.10.a:0 "风暴将至。"
 communism.10.b:0 "世界终将自由，总有一天。"
