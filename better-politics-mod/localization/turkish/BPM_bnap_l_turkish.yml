 bpm_bnap_confederation_events.1.t:0 "Charlottetown Konferansı"
 bpm_bnap_confederation_events.1.d:0 "Charlottetown Konferansı, Kanada Konfederasyonu olasılığını tartışmak üzere toplandı."
 bpm_bnap_confederation_events.1.f:0 "Kanada, New Brunswick ve Nova Scotia eyaletlerinin delegeleri, Kanada Konfederasyonu olasılığını tartışmak üzere Charlottetown'da bir araya geldi. Delegeler, Konfederasyon şartlarını daha detaylı tartışmak üzere Quebec City'de tekrar toplanmayı kabul ettiler."
 bpm_bnap_confederation_events.1.a:0 "Konfederasyon'a Doğru!"
 bpm_bnap_confederation_events.1.b:0 "İhanet!"

 bpm_bnap_confederation_events.3.t:1 "Rupert Toprakları İçin Bir Teklif"
 bpm_bnap_confederation_events.3.d:1 "[SCOPE.sCountry('rupert_buyer').GetName], bize [SCOPE.sState('rupert_scope').GetName] bölgesinin satın alınması için bir teklifte bulundu."
 bpm_bnap_confederation_events.3.f:1 "\"Bizler [SCOPE.sCountry('rupert_buyer').GetNameNoFormatting] temsilcisi olarak, bundan böyle [SCOPE.sCountry('rupert_buyer').GetCapital.GetCityHubName] hazinesinde, [SCOPE.sCountry('rupert_seller').GetNameNoFormatting] [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]'nin diplomatik temsilcisine veya bir diğer aracısına altın olarak üç yüz bin pound ödemeyi kabul ediyoruz.\""
 bpm_bnap_confederation_events.3.a:0 "Uzun zamandır bu topraklardan kâr elde edemiyorduk, [SCOPE.sCountry('rupert_buyer').GetAdjectiveNoFormatting] halkının olsun."

 bpm_bnap_confederation_events.4.t:1 "Rupert Toprakları İçin Bir Teklif"
 bpm_bnap_confederation_events.4.d:2 "[SCOPE.sCountry('rupert_seller').GetName], Rupert Toprakları'ndaki sömürgelerini finanse edemiyor ve bölgeyi bize uygun bir fiyata satmaya istekli görünüyor."
 bpm_bnap_confederation_events.4.f:0 "\"[SCOPE.sCountry('rupert_buyer').GetNameNoFormatting] temsilcisi, [SCOPE.sCountry('rupert_buyer').GetCapital.GetCityHubName] hazinesinde, tüm [SCOPE.sCountry('rupert_seller').GetNameNoFormatting] Majesteleri [SCOPE.sCountry('rupert_seller').GetRuler.GetPrimaryRoleTitle]'nin diplomatik temsilcisine veya bir diğer aracısına altın olarak üç yüz bin pound ödemeyi kabul ediyor.\""
 bpm_bnap_confederation_events.4.a:1 "Gerekli düzenlemeleri yapın."
 bpm_bnap_confederation_events.4.b:1 "Şu anda böyle bir masrafı karşılayamayız."

 bpm_bnap_confederation_events.5.t:0 "Rupert Toprakları Yasası"
 bpm_bnap_confederation_events.5.d:0 "[SCOPE.sCountry('rupert_seller').GetName] şartlarımızı kabul etti. Rupert Toprakları'nın satın alınması için bir antlaşma taslağı hazırlandı."
 bpm_bnap_confederation_events.5.f:0 "\"İsterseniz yarın bakanlığa gelirim ve antlaşmayı yapabiliriz.\"\n\"Neden yarına kadar bekleyelim Bay Northcote? Antlaşmayı bu gece yapalım!\""
 bpm_bnap_confederation_events.5.a:0 "Büyük kuzeybatı bizi çağırıyor!"

 bpm_bnap_confederation_events.6.t:0 "Victoria'daki Müzakereler"
