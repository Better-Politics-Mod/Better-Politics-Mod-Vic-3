 je_bpm_second_revolution:0 "第二次美国革命"
 je_bpm_second_revolution_reason:0 "伟大的解放者已死。我们看到他的遗体被抬着穿过我们的城市。我们目睹了他的愿景，如今它已烙印在我们的灵魂之中。我们不能、也绝不能让邦联得逞，让我们的国家重陷罪孽。为了实现我们第一次革命的梦想，我们必须展开第二次革命，从我们的花园中根除仇恨与压迫。我们必须通过：\n\n国家警察\n国民警卫队\n推广民主价值观\n农业投资\n分权\n任命制官僚\n禁止奴隶制\n文化排斥\n反腐肃清\n\n在我们的人民对革命过于疲惫、抛弃自由人之前。为助益我们的革命，立法机构已开始审议宪法漏洞，以使我们能够以官僚体系与外交能力为巨大代价来加速改革。我们将如何做，才能让自由之旗永远飘扬？"
