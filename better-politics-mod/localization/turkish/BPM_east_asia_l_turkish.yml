# East Asia flavors
 je_bpm_confucian_state:0 "Konfüçyüsçü Devlet"
 je_bpm_confucian_state_reason:0 "Devletimizin kökleri [SCOPE.sReligion('conf_religion').GetName] felsefesine derinden bağlıdır. Devletin [concept_bureaucracy] (bürokrasisinin) temeli olan imparatorluk sınav sistemiyle devlet memurları, Konfüçyüsçü klasiklere dair içgörülerini test eden bir dizi zorlu sınav aracılığıyla seçilir. Sadece bu sınavlarda başarılı olanlar bürokrasi saflarında yükselebilir ve devletin en bilgili ile erdemli akademisyenler tarafından yönetilmesi sağlanır.\n\n#lore \"Hükümeti kendi erdemiyle yöneten kişi, yerini koruyan ve tüm yıldızların ona doğru döndüğü kuzey kutup yıldızına benzetilebilir.\"\n—Konfüçyüs, Seçmeler (Analektler)#!"
 
 bpm_confucian_state.1.t:0 "İmparatorluk Sınavı: Ortalama Sınıf"
 bpm_confucian_state.1.d:0 "İmparatorluk sınavlarının zamanı bir kez daha geldi. Bunlar, [ROOT.GetCountry.GetName] genelinde gereken devasa miktardaki bürokratı seçmek ve sağlamak için teorik olarak liyakate dayalı bir yol olarak birden fazla hanedanlık boyunca yüzyıllardır kullanılmaktadır. Ancak sınavlar tek bir sertifika için değildi, yıllar içinde birden fazla sınavı tamamlayabilenler daha yüksek dereceler kazanarak daha kıdemli pozisyonlara hak kazanabilirdi."
 bpm_confucian_state.1.f:0 "\"Hükümetin yönetimi doğru adamları bulmakta yatar. Bu tür adamlar hükümdarın kendi karakteri vasıtasıyla elde edilir. Bu karakter onun görev yollarında yürümesiyle geliştirilmelidir.\"\n—Konfüçyüs, Orta Yol Öğretisi"
 bpm_confucian_state.1.a:0 "Umarım imparatorluğa iyi hizmet ederler."

 bpm_confucian_state.2.t:0 "İmparatorluk Sınavı: İstisnai Sınıf"
 bpm_confucian_state.2.d:0 "İmparatorluk sınavlarının zamanı bir kez daha geldi. Bunlar, [ROOT.GetCountry.GetName] genelinde gereken devasa miktardaki bürokratı seçmek ve sağlamak için teorik olarak liyakate dayalı bir yol olarak birden fazla hanedanlık boyunca yüzyıllardır kullanılmaktadır. Ancak sınavlar tek bir sertifika için değildi, yıllar içinde birden fazla sınavı tamamlayabilenler daha yüksek dereceler kazanarak daha kıdemli pozisyonlara hak kazanabilirdi."
 bpm_confucian_state.2.f:0 "\"Ülkesinin yönetiminde iyi ilkeler hakim olduğunda, inzivada olduğu halinden değişmez. Enerjisinde ne kadar da kararlıdır! Ülkede kötü ilkeler hakim olduğunda, rotasını değiştirmeden ölüme kadar sürdürür — Enerjisinde ne kadar da kararlıdır!.\"\n—Konfüçyüs, Orta Yol Öğretisi"
 bpm_confucian_state.2.a:0 "Onlar en yüksek dereceden sorumlu bürokratlar olacaklar."

 bpm_confucian_state.3.t:0 "İmparatorluk Sınavı: Zayıf Sınıf"
 bpm_confucian_state.3.d:0 "İmparatorluk sınavlarının zamanı bir kez daha geldi. Bunlar, [ROOT.GetCountry.GetName] genelinde gereken devasa miktardaki bürokratı seçmek ve sağlamak için teorik olarak liyakate dayalı bir yol olarak birden fazla hanedanlık boyunca yüzyıllardır kullanılmaktadır. Ancak sınavlar tek bir sertifika için değildi, yıllar içinde birden fazla sınavı tamamlayabilenler daha yüksek dereceler kazanarak daha kıdemli pozisyonlara hak kazanabilirdi."
 bpm_confucian_state.3.f:0 "\"Her şeyde başarı önceden yapılan hazırlığa bağlıdır ve bu tür bir ön hazırlık yapılmazsa başarısızlık kesindir\"\n—Konfüçyüs, Orta Yol Öğretisi"
 bpm_confucian_state.3.a:0 "Umalım da gelecekteki adaylar daha çalışkan olsun."