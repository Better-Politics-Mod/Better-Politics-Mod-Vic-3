 ig_bianchi: "Beyazlar"
 ig_bianchi_desc: "Beyazlar, İtalyanca #italic bianchi#! veya aşağılayıcı bir ifadeyle 'Beyaz Bolşevikler', Katolik Sosyal Öğretisini takip eden kiracı-çiftçi sendikacılarıydı. Genel olarak radikal ve pasifist olan bu grup; çiftçi mülkiyetini genişletmeyi, büyük toprak sahiplerine savaş açmayı ve sosyal bakımı geliştirmeyi amaçlıyordu. En popüler Beyaz ve genellikle fiili lider olarak kabul edilen kişi Guido Miglioli idi."

