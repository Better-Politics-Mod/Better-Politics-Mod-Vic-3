 notification_bpm_revolution_subsides_desc: "The cells of the revolutionaries led by the [SCOPE.gsInterestGroup('revolt_leader').GetName] have been stamped out in $BPM_REVOLT_TOAST_STATES$."
 notification_bpm_revolution_subsides_tooltip: "#header $notification_bpm_revolution_subsides_name$#!\n$TOOLTIP_DELIMITER$\n$notification_bpm_revolution_subsides_desc$"
