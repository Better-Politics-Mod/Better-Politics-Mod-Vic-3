 coup.6.t:0 "Askeri Hareketlilik"
 coup.6.d:0 "[SCOPE.sCharacter('coup_leader').GetFullName] orduda uzun süredir hatırı sayılır bir güç biriktiriyor, ancak şimdi hükümetimiz yaygın bir huzursuzlukla karşı karşıyayken [SCOPE.sCharacter('coup_leader').GetHerHis] karizması ve siyasi zekası yavaş yavaş tüm topluma nüfuz etmeye başladı. Artık subaylarımız arasında bir komplo kurulduğuna dair rahatsız edici fısıltılar duyuyoruz."
 coup.6.f:0 "Sen nesin, astım mı yoksa düşmanım mı? Eğer astımsan, emirlerime uymalısın. Eğer düşmanımsan, beni hiç vakit kaybetmeden öldürmelisin.\n\n—Çan Kay-şek, 1936"
 coup.6.a:0 "Yapabileceğimiz bir şey var mı?"
 coup.6.b:0 "Gözünüzü [SCOPE.sCharacter('coup_leader').GetFullName] üzerinden ayırmayın."

 bpm_coup_leader_changed:0 "[SCOPE.gsInterestGroup('coup_ig').GetName] lideri değişti"