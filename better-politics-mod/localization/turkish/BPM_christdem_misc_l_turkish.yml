 je_bpm_ideological_leaning_progress_tooltip: "#v İdeolojik Eğilim#!, Katolik hareketleri, partileri, sendikaları, grupları ve örgütleri içindeki mevcut akımları, değişimleri ve tartışmaları temsil eder; onların [GetLawGroup('lawgroup_distribution_of_power').GetName], [GetLawGroup('lawgroup_rights_of_women').GetName], dini ahlak ve İlahi ile Halk egemenliği sorununun yanı sıra Hristiyanlığın demokrasi ile uzlaşıp uzlaşamayacağı konusundaki duruşlarını değiştirir. Genel olarak üç ana [Concept('concept_ideology', 'İdeoloji')] ve taraf vardır:\n\n#v Hristiyanlık Tarafı#! (#italic <%33#!) — Bu taraf, [GetIdeology('ideology_dop_conservative_democrat').GetName] ideolojisinin hakim olduğu, daha muhafazakar, klerikal ve hatta gerici akımları temsil eder; geçmişe nostaljik bir özlem duyarak, dini ahlakın ve yasama meclisindeki meslek gruplarını güçlendirmek gibi güçlü [GetTechnology('corporatism').GetName]'in rehberliğinde güçlü bir yönetim arayışında olacaklardır (Örnekler arasında #bold Litvanyalı #tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_group_krikscionys_demokratai_tooltip Krikščionys Demokratai#!#!, #bold İspanyol Grupo de la Democracia Cristiana#! ve #bold #italic Cumhuriyet-içi#! Avusturyalı #tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_group_laborists_and_agrarians_tooltip Laboristen und Agrarianer#!#! bulunur).\n\n#v Orta/Ilımlı Taraf#! (#italic >%25, <%75#!) — Bu taraf, [GetIdeology('ideology_dop_divine_democrat').GetName] [concept_ideology] aracılığıyla içindeki genel liberal-muhafazakar, liberal-klerikal, muhafazakar @middling! [Concept('concept_middle_strata', 'Orta Sınıf')] akımları temsil eder. Halk egemenliği üzerinde ilahi egemenliğin üstünlüğünü korumaya çalışırken, aynı zamanda ihtiyatlı bir ılımlılığı, dini ahlakı sürdürecek ve [GetLawType('law_universal_suffrage').GetName] yasasına karşı çıkacaklardır (Örnekler arasında #bold Hollandalı Devrim Karşıtlarının Katolik bölümü#!, #bold #italic Cumhuriyet-öncesi#! Avusturyalı #tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_group_corporatists_tooltip Bürgerliche#!#! ve #bold #italic küçük-bağımsız#! Macar Hristiyan Demokratlar#! bulunur).\n\n#v Demokrat Taraf#! (#italic >%66#!) — Bu taraf, içindeki çeşitli, çoğunlukla ilerici, çiftçi ve işçi tabanlı [GetIdeology('ideology_dop_christian_democrat').GetName] akımlarını temsil eder. En önemlisi [GetLawType('law_universal_suffrage').GetName] yasasını getirmeyi, demokrasiyi kurmayı ve yaşamın çeşitli alanlarında genişletmeyi, gücü merkezden uzaklaştırmayı, [GetLawGroup('lawgroup_labour_associations').GetName] [Concept('concept_law', 'Yasalarını')] genişletmeyi ve genel dini ahlakı dışarıda bırakarak siyasi yaşamda [concept_religion] baskıcılığını sınırlamayı amaçlarlar (Örnekler arasında #bold İtalyan #tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_group_popularists_tooltip Popülerciler#!#!, #bold Alman #tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_group_zentrumites_tooltip Zentrumcular#!#! ve #bold Çek #tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_group_lidovci_tooltip Lidovci#!#! bulunur).\n\n#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_christ_dem_pedia_tooltip #bold #gold ChristDemPedia#!#!#!"

 je_bpm_economical_leaning_progress_tooltip: "#v Ekonomik Eğilim#!; Katolik hareketleri, partileri, sendikaları ve örgütleri içindeki oldukça bölünmüş mevcut akımları, değişimleri ve tartışmaları ile kapitalizme yönelik genel tutumu ve onların [GetLawGroup('lawgroup_economic_system').GetName], [GetLawGroup('lawgroup_trade_policy').GetName], [GetLawGroup('lawgroup_land_reform').GetName], özel mülkiyet ve ekonomik kalkınma konusundaki duruşlarını temsil eder. Genel olarak üç ana [Concept('concept_ideology', 'İdeoloji')] ve taraf vardır:\n\n#v Dağıtımcılık (Distributism) Tarafı#! (#italic <%20#!) — Bu taraf, hafifçe düzenlenmiş kapitalizmi daha çok eşyanın doğası olarak gören ve mali açıdan muhafazakar politikalar, sınırlı [GetLawType('law_interventionism').GetName] ve ekonomik korporatizmi, ılımlı [GetLawType('law_homesteading').GetName] ve [GetLawType('law_protectionism').GetName] yasalarını destekleyerek [GetIdeology('ideology_eco_distributist_economy').GetName] kurmaya hevesli olan, genellikle [GetLawGroup('lawgroup_taxation').GetName] konusunda net bir duruşu olmayan 'Hristiyan Sosyalist', muhafazakar, @middling! [Concept('concept_middle_strata', 'Orta')] ila [Concept('concept_upper_strata', 'Üst Sınıf')] akımları temsil eder. (Örnekler arasında #bold Çek #tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_group_lidovci_tooltip Lidovci#!#! ve #bold #italic Cumhuriyet-içi#! Avusturyalı #tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_group_laborists_and_agrarians_tooltip Laboristen und Agrarianer#!#! bulunur); #v Hristiyan Sosyalistler#!, isimlerinin aksine Sosyalist #bold değildir#. Bu terim, bu durumlarda ‘Rerum novarum’ genelgesini tamamen uygulamayı amaçlayan Katolik aktivistleri ifade eder. Temelde anti-kapitalisttirler ve zanaatkar üretim yöntemlerine geri dönmeyi hedeflerken, aynı zamanda aşırı hükümet müdahalesine karşı dururlar. (Örnekler arasında #bold #italic 1930'lar öncesi#! Polonyalı #tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_group_chadecy_tooltip Chadecy#!#! ve #bold Avusturyalı #tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_group_christlichsozialen_tooltip Vereinigten Christen#!#! bulunur).\n\n#v Ilımlı/Orta Duruş#! (#italic >%15, <%85#!) — Bu taraf, [GetIdeology('ideology_eco_modern_interventionist').GetName] politikalarını uygulamayı amaçlayan, kapitalizm konusunda oldukça tutarlı ve ılımlı duruşları temsil eder. Modern müdahaleci bir ekonominin destekçileri, [GetLawType('law_interventionism').GetName] yasasına bağlılıklarında büyük farklılıklar gösterirler. Genel olarak modern ekonomik politikaları teşvik etmeyi amaçlayan bu kesim; düzenleyici ekonomiyi, modernizasyonu ve sanayileşmeye devlet desteğini savunacak, ancak aynı zamanda mülkiyetin #gold demokratikleştirilmesi#, kilit sektörlerin (#yellow Ağır Sanayi#!, [GetBuildingType('building_railway').GetName] gibi) [Concept('concept_nationalize', 'Millileştirilmesi')] veya [Concept('concept_unemployed', 'İşsizlik')] veya [Concept('concept_good', 'Kaynak')] eksikliğiyle mücadele etmek için #bold sınırlı devlet planlaması#! gibi daha ekonomik olarak demokratik ve devletçi politikaları da destekleyebilecektir. Ayrıca ilerici ve adil [GetLawGroup('lawgroup_taxation').GetName], daha fazla [GetLawType('law_free_trade').GetName] yanlısı politika ve toprak reformunu da desteklerler (Örnekler arasında #bold Belçikalı #tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_group_young_right_tooltip Genç Sağ#!#! hareketi/fraksiyonu, #bold Fransız #tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_group_popular_democrats_tooltip Popüler Demokratlar#!#! ve #bold İtalyan #tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_group_popularists_tooltip Popülerciler#!#! bulunur).\n\n#v Anti-Kapitalizm tarafı#! (#italic >%80#!) — Bu taraf, günümüzün sefil koşullarını görerek kapitalizmi geçmişin korkunç bir kalıntısı, birçok modern [Concept('concept_party', 'Partinin')] 'onarmayı' amaçladığı bir şey olarak gören akımları temsil eder. Bunun yerine, korporatizm, sınırlı sosyalleşme ve tam demokratikleşme ile desteklenen temelde [GetLawType('law_command_economy').GetName] odaklı bir [GetIdeology('ideology_eco_centralized_economy').GetName] — çiftçilerin sahip olduğu yoğun kooperatifçi bir tarım ve [GetLawType('law_protectionism').GetName] yasasında yalnızca gereksiz zarar görerek [GetLawType('law_free_trade').GetName] yoluyla uluslararası ticaret engellerini yıkmayı önerirler (Örnekler arasında #bold #italic 1930 sonrası#! Polonyalı #tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_group_chadecy_tooltip Chadecy#!#! ve #bold #italic genç#! Alman #tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_group_zentrumites_tooltip Zentrumcular#!#! bulunur).\n\n#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_christ_dem_pedia_tooltip #bold #gold ChristDemPedia#!#!#!"

 je_bpm_welfare_leaning_progress_tooltip: "#v Refah Eğilimi#!, Katolik hareketleri, partileri, sendikaları ve örgütleri içindeki oldukça bölünmüş akımları, değişimleri ve tartışmaları ve bunların [GetLawGroup('lawgroup_education_system').GetName], [GetLawGroup('lawgroup_health_system').GetName] veya [GetLawGroup('lawgroup_welfare').GetName] gibi refah konularındaki duruşlarını ve bunların nasıl uygulanması gerektiğini (yardım dernekleri gibi özel girişimler yoluyla mı, korporatizm yoluyla mı yoksa devletin mi devreye girmesi gerektiği) temsil eder. Genel olarak üç ana [Concept('concept_ideology', 'İdeoloji')] ve taraf vardır:\n\n#v Toplum Tarafı#! (#italic <%25#!) — Bu taraf, korporatizm ve [GetIdeology('ideology_wel_religious_welfare').GetName] kapsamında refah konusunda özel girişimin öncülük etmesi gerektiğine inanan muhafazakar, katı dini ve korporatist akımları temsil eder.\n\n#v Ilımlı/Orta Duruş#! (#italic >%20, <%80#!) — Bu taraf, [GetIdeology('ideology_wel_social_market_welfare').GetName] ilkesine inanan, özel girişimin işçilerin düzgün bir şekilde yaşamasını sağlayacak kadar güçlü olmadığı durumlarda devlet kontrolü ve desteğini getirmeyi amaçlayan, genellikle dindar, orta sınıf, işçi tabanlı ve nispeten ılımlı akımları temsil eder. Genellikle tamamen finanse edilen refah yerine sübvansiyon getirmeyi tercih ederler.\n\n#v Devlet Tarafı#! (#italic >%75#!) — Bu taraf, özel korporatist fikirlerin sosyal sorunlara ve yoksulluğa uygun bir cevap olmadığına inanarak [GetIdeology('ideology_wel_expanded_public_welfare').GetName] sistemini aşamalı ve verimli bir şekilde uygulamayı amaçlayan ilerici ve işçi tabanlı akımları temsil eder."

 je_bpm_independence_from_church_tooltip: "#v Katolik Kilisesinden Bağımsızlık#!, Katolik sıradan insanların #bold Kilise#! yetkililerinden ve onun etkisinden ne kadar bağımsız olduğunu temsil eder. Bu ilerleme çubuğu her ay artar ve bu [concept_journal_entry] görevinde kaydedilen her #bold %10'luk ilerleme#! için, [GetInterestGroupVariant('ig_christian_democrats',GetPlayer).GetNameWithCountryVariant] kendi [concept_interest_group] gruplarını ilgilendiren çeşitli konularda tartışacak ve sizin de yardımınızla, yerel koşullara bağlı olarak [concept_ideology] ideolojisini şekillendirecek ve değiştirecektir.\n\nAşağıdaki değerler #v Katolik Kilisesinden Bağımsızlığı#! etkiler:\n    @arrow_up! Muhafazakar [GetLawGroup('lawgroup_church_and_state').GetName] [Concept('concept_law', 'Yasaları')];\n    @arrow_up! Anti-klerikal [GetInterestGroupVariant('ig_liberals', GetPlayer).GetNameWithCountryVariant] ve [GetInterestGroupVariant('ig_radicals', GetPlayer).GetNameWithCountryVariant] [concept_clout] değeri\n    @arrow_up! ‘#bold Rerum novarum#!’ yayımlanması;\n    @arrow_up! #yellow Liberal#! ve #gold Radikal#! [Concept('concept_political_movement', 'Siyasi Hareketlerin')] [concept_political_movement_support] değeri;\n    @arrow_up! #pink Sosyalist#! veya #pink Anarşist#! [Concept('concept_political_movement', 'Siyasi Hareketler')];\n    @arrow_up! [GetTechnology('labor_movement').GetName] veya [GetTechnology('political_agitation').GetName] gibi araştırılmış [Concept('concept_technology', 'Teknolojiler')];\n    @arrow_up! #gold @academics! Liberal Bilinç#!;\n    @arrow_up! [GetInterestGroupVariant('ig_christian_democrats', GetPlayer).GetName] popülaritesinde kademeli artış;\n    @arrow_up! [GetInterestGroupVariant('ig_trade_unions', GetPlayer).GetNameWithCountryVariant] [concept_clout] değeri;\n    @arrow_down! ‘#bold Graves de communi re#!’ yayımlanması;\n    @arrow_down! [GetInterestGroupVariant('ig_devout', GetPlayer).GetNameWithCountryVariant] [concept_clout] değeri;\n    @arrow_down! Seçkinci [GetInterestGroupVariant('ig_conservatives', GetPlayer).GetNameWithCountryVariant], [GetInterestGroupVariant('ig_reactionaries', GetPlayer).GetNameWithCountryVariant] ve [GetInterestGroupVariant('ig_national_liberals', GetPlayer).GetNameWithCountryVariant] [concept_clout] değeri;\n\nMevcut değerler: 0.[GetPlayer.MakeScope.ScriptValue('bpm_indepndence_from_the_church_values')|0]"

 je_bpm_christian_democrat_development_stages_tooltip: "[GetInterestGroupVariant('ig_christian_democrats',GetPlayer).GetNameWithCountryVariant] grubunun gelişimi için genel olarak birkaç aşama ve kontrol noktası vardır:\n\n (1) #v %0#!: [GetLawType('law_wealth_voting').GetName] veya üzeri; Katolik [concept_state_religion] veya önemli azınlık; Güçlü [concept_bpm_ig_is_liberal] veya [concept_bpm_ig_is_socialist] [concept_interest_group].\n    Sıradan [GetInterestGroupVariant('ig_christian_democrats', GetPlayer).GetName], onları kontrol altında tutmak isteyen #bold Kiliseye#! inat, modernist tehlikeye bir yanıt olarak ortaya çıkar.\n\n (2) #v %25#!: #v ‘Quanta cura’#! genelgesinin yayımlanmasını gerektirir.\n    [GetInterestGroupVariant('ig_christian_democrats', GetPlayer).GetName] daha da güç kazanır ve liberal demokrasi ile milliyetçilik meselelerini tartışır, refah önlemlerine desteklerini ilan edebilirler.\n\n (3) #v %50#!: #v ‘Rerum novarum’#! genelgesinin yayımlanmasını gerektirir.\n    Düşünce temelleri olarak genelgeyi alan [GetInterestGroupVariant('ig_christian_democrats', GetPlayer).GetName], refah, ekonomi ve kapitalizm konularında duruşlar kazanmaya başlayacaktır.\n\n (4) #v %75#!: #v ‘Graves de communi re’#! genelgesinin yayımlanmasını gerektirir.\n    [GetInterestGroupVariant('ig_christian_democrats', GetPlayer).GetName] ve sıradan hareketler, #bold Papa#! tarafından muhatap alındıktan sonra, siyasi yaşama tam olarak katılmaya başlar ve çeşitli ve renkli isimler ve idealler altında seçim sisteminde ve taban hareketlerinde aktif olarak yer alırlar." 

 je_bpm_christian_or_democrat: "Hristiyan mı, yoksa Demokrat mı?"
 je_bpm_christian_or_democrat_reason: "Güçlü kralların ve kırsal yaşamın çağı çoktan geride kaldı; yerini ahlaktan ve Tanrı'dan yoksun, günahkar modern demokrasi, sanayileşme ve kapitalizm fikirleri aldı. Bu nedenle, sıradan Katolikler bu karanlık zamanlarda hayatta kalmak için uyum sağlamalı, nüfuzlarını savunmak ve varoluşundan kaynaklanan kana susamış #yellow liberalizm#! ile tanrısız #pink sosyalizm#! fikirleriyle mücadele etmek için yeni sistemler içinde çalışmalıdırlar ve bunu #bold tamamen tek başlarına#! yapmak zorundadırlar.\n\nBu [concept_journal_entry], zayıf ve dağınık sıradan grupların kendilerini örgütlemelerinin, yeni fikirler geliştirmelerinin ve modern [Concept('concept_bpm_ig_is_liberal', 'Liberal')] [Concept('concept_country', 'Devlete')] doğru büyümelerinin, nihayetinde #v Kilise#!'nin etkisini aşarak yeni, bağımsız bir ideoloji haline gelmelerinin uzun ve dinamik sürecini takip eder. [concept_interest_group] büyüdükçe ve #gold #tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_independence_from_church_tooltip Kiliseden Daha Bağımsız#!#! hale geldikçe ve daha ileri #gold #tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_christian_democrat_development_stages_tooltip Aşamalara#!#! ilerledikçe, [GetInterestGroupVariant('ig_christian_democrats',GetPlayer).GetNameWithCountryVariant] grubunun gelişimini etkilemenize olanak tanıyan olaylar alacaksınız, ancak bunlar hala büyük ölçüde onların #gold #tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_ideological_leaning_progress_tooltip İdeolojik#!#! ve #gold #tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_economical_leaning_progress_tooltip Ekonomik#!#! Eğilimlerine bağlı olacaktır.\n\n#lore Zentrum (Merkez) partisinde iki farklı ruh değil, en uç sağdan radikal sola kadar siyasi gökkuşağının tüm renklerinde parıldayan yedi farklı düşünce okulu vardır. Kendi adıma, Zentrum partisinin arabacısının tüm bu farklı ruhları böylesine zarif bir şekilde yönlendirmeyi bildiği ustalığa hayranım.\n\n— Otto von Bismarck, 1890#!" #tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_welfare_leaning_progress_tooltip Refah#!
 
