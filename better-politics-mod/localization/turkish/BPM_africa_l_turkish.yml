l_turkish:
 je_age_of_princes:0 "Prensler Çağı"
 je_age_of_princes_reason:0 "Süleyman Hanedanı, bizzat İncil'deki Kral Süleyman'ın oğlunun soyundan geldiğini iddia ederek neredeyse altı yüzyıldır Etiyopya'yı yönetmektedir. Ancak bir asır süren iç çekişmelerin ardından Gondar'daki imparatorun elinde çok az gerçek güç kalmıştır; ülke, Ras'lar tarafından yönetilen kan davalı alt soyların hakimiyeti altındadır.\n\nEtiyopya'nın bir kez daha ihtişamına kavuşması için halkımıza barış ve refahı geri getirecek hegemonyamızı sağlamalıyız.\n\n#lore \"Ve toplanan tüm azizler dediler ki, 'Şüphesiz, tüm gerçekliğiyle Etiyopya Kralı, göksel Siyon'un görkemi ve büyüklüğü nedeniyle yeryüzündeki diğer tüm krallardan daha yüce ve daha onurludur.'\"\n—Kebra Nagast, 14. Yüzyıl dolayları#!"
 age_of_princes_complete:0 "Etiyopya birleştirildi."

 ethiopia.1.t:0 "Kanunsuz Prens"
 ethiopia.1.d:0 "Süleyman Hanedanı'na mensup küçük bir soylu hızla güce ve popülerliğe kavuştu. Yasal olarak bir kanunsuz (haydut) olan bu kişi, üzerine gönderilen her orduyu yendi ve şimdi güç kullanarak [ROOT.GetCountry.GetName] tahtını ele geçirmeyi amaçlıyor."
 ethiopia.1.f:0 "Zenginden alıp fakire veren kanunsuz efsanesi zaman kadar eskidir ve bu serseri Prens bunun tam bir örneğidir. Soylu mirasından yoksun bırakılan ve Kassa Hailu olarak doğan bu adam, yalnızca bir ordu yetiştirmekle kalmadı, aynı zamanda takipçilerinin kalplerini de kazandı."
 ethiopia.1.a:0 "Tewodros bizi zafere taşıyacak. Onu tahta çıkarın!"
 ethiopia.1.b:0 "Kanunsuzlarla nasıl başa çıktığımızı ona göstereceğiz."

 ethiopia.2.t:0 "Zemene Mesafint"
 ethiopia.2.d:0 "Bir asrı aşkın bir süredir Etiyopya çeşitli yerel soylular arasındaki sürekli veraset savaşlarıyla boğuşmakta; bu durum imparatorluğu zar zor bir arada tutmakta ve Gondar'daki imparatoru bir kukladan biraz daha fazlası haline getirmektedir. Düzeni sağlamak için prensleri kurnazlık ve kudretle boyunduruk altına almak gerekir."
 ethiopia.2.f:0 "\"Tanrı kalksın, düşmanları dağılsın; O'ndan nefret edenler O'nun önünden kaçsın.\"\n\n—Mezmurlar 68:1"
 ethiopia.2.a:0 "Bir prensler ve yargıçlar çağı."

 je_age_of_princes_button_ras:0 "Sadık Bir İmparator Tahta Çıkar"
 je_age_of_princes_button_ras_desc:0 "Artık Gondar ve Begemder Vilayeti elimizde olduğuna göre, ailemiz imparatorluk sarayı üzerinde kontrolünü uygularken imparatorluk tahtına uysal bir Süleyman soyu adayı oturtabiliriz."
 age_of_princes_button_tt:0 "Süleyman Hanedanı'nın bir üyesi bizim korumamız altında imparator olacak, bu durum diğer vilayetleri büyük ölçüde öfkelendirecektir."
 je_age_of_princes_button_bgm: "$je_age_of_princes_button_ras$"
 je_age_of_princes_button_bgm_desc: "$je_age_of_princes_button_bgm$"