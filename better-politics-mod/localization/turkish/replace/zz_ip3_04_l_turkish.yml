peoples_springtime.71.t: "Barış, Özgürlük ve Uyum"
peoples_springtime.71.d: "[ROOT.GetCountry.GetName] ülkesindeki liberal hükümet, yeniden canlanan mutlakıyetçilik ve sosyal devrimin oluşturduğu çifte tehdidi başarıyla aştı. Devrimci çalkantı dönemi barışçıl bir şekilde sona erdi."
peoples_springtime.71.f:1 ""Mucizeler yaratma konusunda özgür olma sanatından daha verimli hiçbir şey yoktur; ancak özgürlükteki çıraklıktan daha zor bir şey de yoktur."\n\n—Alexis de Tocqueville, #italic Amerika'da Demokrasi#!"
peoples_springtime.71.a: "[ROOT.GetCountry.GetNameNoFormatting] için özgürlük çağı doğuyor."
peoples_springtime.71.b: "[SCOPE.sCulture('primary_culture_scope').GetName] halkı özgürlüklerini kazandı."

