 je_tenpo_crisis_reason:0 "天保年号于1830年宣布，天保，即“上天保佑”之意，这一时代起初不负其吉祥之名。然而，[GetGeographicRegion('geographic_region_honshu').GetName]恶劣的天气很快导致米价飞涨和全国范围的饥荒，同时[Concept('concept_bpm_ig_is_liberal', '$ig_liberals$')]日益增长的影响力威胁着既有的[GetInterestGroupVariant('ig_armed_forces',GetPlayer).GetName]秩序。\n\n与此同时，在地平线上，西方的[Concept('concept_great_power','$concept_great_powers$')]愈发大胆，他们的商船和炮舰离我们的海岸越来越近。\n\n为应对这些问题，倾向改革的显贵们已向幕府呈上了他们的设想。\n\n#tooltippable;tooltip:tenpo_reformer_tt #b 改革派议程#!#!：\n• [SCOPE.GetRootScope.GetCountry.GetCustom('tenpo_checkbox_edo_system_lax')] [ROOT.GetCountry.GetNameNoFlag]已颁布[GetLawType('law_lax_edo_system').GetName]\n• [SCOPE.GetRootScope.GetCountry.GetCustom('tenpo_checkbox_bureaucrats')] [ROOT.GetCountry.GetNameNoFlag]已 #b 未#! 颁布[GetLawType('law_hereditary_bureaucrats').GetName]\n• [SCOPE.GetRootScope.GetCountry.GetCustom('tenpo_checkbox_urbanization')] [ROOT.GetCountry.GetNameNoFlag]拥有 #v 3#! 个建有 #v 3#! 级[GetBuildingType('building_urban_center').GetName]的[Concept('concept_state', '$concept_states$')]\n• [SCOPE.GetRootScope.GetCountry.GetCustom('tenpo_checkbox_government')] 任意[concept_bpm_ig_is_liberal][concept_interest_group]已[concept_in_government]\n#tooltippable;tooltip:tenpo_hardliner_tt #b 强硬派议程#!#!：\n• [SCOPE.GetRootScope.GetCountry.GetCustom('tenpo_checkbox_edo_system_strict')] [ROOT.GetCountry.GetNameNoFlag]已颁布[GetLawType('law_strict_edo_system').GetName]\n• [SCOPE.GetRootScope.GetCountry.GetCustom('tenpo_checkbox_social_control')] [ROOT.GetCountry.GetNameNoFlag]已颁布[GetLawType('law_shinsengumi').GetName]\n• [SCOPE.GetRootScope.GetCountry.GetCustom('tenpo_checkbox_rural')] [ROOT.GetCountry.GetNameNoFlag]拥有 #v 40#! 级[GetBuildingType('building_rice_farm').GetName]\n• [SCOPE.GetRootScope.GetCountry.GetCustom('tenpo_checkbox_liberals_marginalized')] 每个[concept_bpm_ig_is_liberal][concept_interest_group]都已被[concept_marginalized]\n#tooltippable;tooltip:tenpo_shared_tt #b 共同议程#!#!：\n• [SCOPE.GetRootScope.GetCountry.GetCustom('tenpo_checkbox_famine')] #b 没有任何#! 拥有[GetCulture('japanese').GetName]的[concept_homeland][concept_state]正遭受[concept_famine]\n• [SCOPE.GetRootScope.GetCountry.GetCustom('tenpo_checkbox_gdp')] [ROOT.GetCountry.GetNameNoFlag]的[Concept('concept_gdp', '$concept_gdp_short$')]达到或超过 @gdp!#v [Country.MakeScope.Var('tenpo_gdp_goal').GetValue|k0]#!\n• [SCOPE.GetRootScope.GetCountry.GetCustom('tenpo_checkbox_army_size')] [ROOT.GetCountry.GetAdjectiveNoFlag]军队的[concept_power_projection]大于 #v 500#!\n• [SCOPE.GetRootScope.GetCountry.GetCustom('tenpo_checkbox_naval_size')] 我们在拥有的[Concept('concept_state', '$concept_states$')]中建有 #v 10#! 级或以上的[GetBuildingType('building_naval_fortification').GetName]"
