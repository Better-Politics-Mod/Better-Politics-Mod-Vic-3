 council_republic_law_events.2.d:0 "据说一群工人在[ROOT.GetCountry.GetCapital.GetCityHubName]发动暴动反抗老板，并夺取了一家工厂的控制权。全国各地的工人受到鼓舞，纷纷效仿。"
 council_republic_law_events.2.f:0 ""某天他们闯了进来，把老板一把扔了出去，然后照常开工。警察试图干预，可你倒是试着对几百个挥舞着工具的愤怒工人指手画脚看看。""
 council_republic_law_events.2.a:0 "我们凭什么违抗民意？不要干预。"
 council_republic_law_events.2.b:0 "我们不能给资本家发动反扑的借口——必须叫停这一切。"
 council_republic_law_events.2.c:0 "我们必须帮助他们，革命万岁！"
 council_republic_law_events.3.t:0 "党总部被焚毁"
