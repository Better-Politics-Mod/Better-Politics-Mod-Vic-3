je_king_in_parliament: "Parlamentodaki-[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]"
je_king_in_parliament_reason: "[ROOT.GetCountry.GetName] ülkesinde mutlakıyetçi yönetimin sona ermesi, [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] ile [SCOPE.GetRootScope.GetCountry.GetCustom('country_legislature_name')] arasındaki güç dengesi sorununu çözmedi. Yeni parlamenter düzenin kendini sağlamlaştırabilmesi için, halkın iradesinin [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] iradesinin üzerinde olduğunu tesis etmesi gerekmektedir."
je_king_in_parliament_goal: "Aşağıdakiler toplam #v 10#! yıl boyunca geçerli olmalıdır:"
