l_turkish:
# TUs
 ig_trade_unions:0 "Sendikacılar"
 ig_trade_unions_only_icon:0 "@trade_unions_bpm!"
 ig_trade_unions_desc:0 "Sendikacılar faaliyetlerini parti veya hükümetten ziyade sendikalara odaklar, işçilerin işverenlere karşı gücünü korumak için grevleri ve toplu sözleşmeleri koordine ederler. Genellikle siyasi hedeflerden kaçınıp ekonomik hedeflere yönelirler, genel siyasete yalnızca belirli durumlarda katılırlar. Örgütlü örnekleri arasında Amerikan CIO ve İngiliz TUC bulunur."


 ig_conservative_unions:0 "Muhafazakar Sendikalar"
 ig_conservative_unions_desc:0 "$ig_trade_unions_desc$"

 ig_syndicalists:0 "Sendikalistler"
 ig_syndicalists_desc:0 "Sendikalistler, işçilerin üretim araçlarını devlet aracılığıyla değil, ekonomik eylem yoluyla ele geçirmesi gerektiğine inanırlar. Kendilerini endüstriyel sendikalar halinde örgütlerler ve bu sendikaların nihayetinde toplumun birincil örgütlenme birimi olarak devletin yerini alacağına inanırlar. Örnekleri arasında Fransız CGT ve İspanyol CNT bulunur."

 ig_locofocos:0 "Locofoco'lar"
 ig_locofocos_desc:0 "Locofoco'lar, 1830'larda ortaya çıkan Amerikan Demokrat Partisi'nin radikal kentli işçi sınıfı fraksiyonudur. Tekellere, bankalara, gümrük vergilerine, vergilere ve devletin toplum üzerindeki diğer çoğu kontrol biçimine karşıtlıklarıyla bilinirlerdi."

 ig_labor_radicals:0 "Emek Reformcuları"
 ig_labor_radicals_desc:0 "Sendikacılar faaliyetlerini parti veya hükümetten ziyade sendikalara odaklar, işçilerin işverenlere karşı gücünü korumak için grevleri ve toplu sözleşmeleri koordine ederler. Genellikle siyasi hedeflerden kaçınıp ekonomik hedeflere yönelirler, genel siyasete yalnızca belirli durumlarda katılırlar. Örgütlü örnekleri arasında Amerikan CIO ve İngiliz TUC bulunur."

 ig_urban_workers:0 "Kentli İşçiler"
 ig_urban_workers_desc:0 "Sendikacılar faaliyetlerini parti veya hükümetten ziyade sendikalara odaklar, işçilerin işverenlere karşı gücünü korumak için grevleri ve toplu sözleşmeleri koordine ederler. Genellikle siyasi hedeflerden kaçınıp ekonomik hedeflere yönelirler, genel siyasete yalnızca belirli durumlarda katılırlar. Örgütlü örnekleri arasında Amerikan CIO ve İngiliz TUC bulunur."
 ig_knights_of_labor:0 "Emeğin Şövalyeleri"
 ig_knights_of_labor_desc:0 "Emeğin Şövalyeleri (Knights of Labor), Amerikan işçi sınıfının ilk kitlesel örgütü olma gibi yüce bir unvana sahip bir işçi federasyonudur. Geleneksel sendika federasyonlarından daha ılımlı olsalar da Şövalyeler, ırk, sınıf ve cinsiyet sınırlarını aşarak aktif bir şekilde sendikalaşmalarıyla Amerika'da benzersizdir. Popülist Hareketin başlangıcından bu yana Şövalyelerin üye sayısı patlama yapmıştır, ancak hareketin ölmesi halinde sendikanın hayatta kalıp kalamayacağı belirsizdir."

# Agpops
 ig_agrarian_populists:0 "Tarım Popülistleri"
 ig_agrarian_populists_only_icon:0 "@ig_agrarian_populists!"
 ig_agrarian_populists_desc:0 "Tarım Popülistleri tek bir gelenekten gelmezler ve tek bir ülke içinde bile büyük farklılıklar gösterebilirler. Genel olarak, eşitlikçi arazi kullanımı lehine yerleşik toprak sahiplerine karşı çıkarlar; ılımlı popülistler yerel özerklik ve vergi reformu isterken, daha radikal olanlar toplumsal devrimi savunur. Örnekleri arasında Rus Narodnikleri ve Amerikan Popülist Partisi bulunur."

 ig_agrarian_socialists:0 "Tarım Sosyalistleri"
 ig_agrarian_socialists_desc:0 "Tarım Sosyalistleri, sosyalist bir devrimin gerekliliğine inanırken, köylülüğün bu devrimin birincil olmasa bile büyük bir parçası olması gerektiğini savunur ve çeşitli sınıfların devrimci potansiyelini yorumlarken daha kent odaklı sosyalistlere karşı çıkarlar."

 ig_radical_abolitionists:0 "Radikal Kaldırmacılar (Abolitionists)"
 ig_radical_abolitionists_desc:0 "$ig_agrarian_populists_desc$"

 ig_narodniks:0 "Narodnikler"
 ig_narodniks_desc:0 "Narodnikler, Rus serfliğinin sert gerçeklerinin bir sonucu olarak ortaya çıkan ve ideolojik olarak Rus Obşçina pratiklerinden esinlenen bir Rus popülist düşünce dalını tanımlayan bir terimdir. Narodnikler, Rusya için en acil sorunun tarım sorunu - serflerin özgürleştirilmesi ve toprak reformu - olduğuna inanırlar, ancak Zapadnik (Batıcı) düşüncesinden etkilenmeleri onları toplumsal devrime de çok açık hale getirir."

 ig_donghak:0 "Donghak Takipçileri"
 ig_donghak_desc:0 "Donghak, batı felsefesini ve teolojisini reddeden akademik ve dini bir harekettir. Hareket, Choe Je-u tarafından batılı güçlerin Kore'ye Hristiyanlığı sokmasına tepki olarak kurulmuştur. Donghak takipçileri, Kore'deki yabancı etkisine karşı koymanın en iyi yolunun demokrasiyi getirmek, insan haklarını tesis etmek ve reform ile eski Kore geleneklerinin yenilenmesi yoluyla yabancı müdahalesinden bağımsız, müreffeh bir Kore yaratmak olduğuna inanırlar."

 ig_bauernbewegung:0 "Bauernbewegung (Köylü Hareketi)"
 ig_bauernbewegung_desc:0 "Bauernbewegung, Sanayi Devrimi'nin ardından geride kalan Alman köylülüğünü kapsar. Dizginsiz sanayileşme, gerileyen ev endüstrisi ve hasat yetersizlikleri kırsal nüfusun bir bölümünü vahim koşullar içinde bırakmıştır. Alman köylü hareketi, kalan feodal yükümlülükleri kaldırarak bu koşulları iyileştirmeyi amaçlamaktadır."

# Socialists
 ig_socialists:0 "Sosyalistler"
 ig_socialists_only_icon:0 "@ig_socialists!"
 ig_socialists_desc:0 "Sosyalizm veya Sosyal Demokrasi, Birinci Enternasyonal'de anarşistlere karşı çıkan geniş solcu geleneği ifade eder. Belirli eğilimler, örneğin İngiliz Chartistlerinin kitle hareketi, Blankistlerin gizli cemiyetleri, Lassallecilerin parlamenter siyaseti ve Marksistlerin bilimsel sosyalizmi arasında büyük farklılıklar gösterebilir."

 ig_zapadniks_socialist:0 "Zapadnikler (Sosyalist)"
 ig_zapadniks_socialist_desc:0 "Zapadnikler, Rusya'nın felsefe ve kültürde batılı ülkeleri örnek alarak modernleşmesi gerektiğine inanırlar (isimleri buradan gelir). Sosyalist Zapadnikler, Zapadnik düşüncesinin en radikal versiyonunun - Avrupa'nın ilerlemesine rağmen Aydınlanma'nın vaatlerini gerçekleştirmek için hala yapılması gereken çok şey olduğuna inanan ve Marx ile Bakunin gibi düşünürlerin öngördüğü sınıfsız, eşit bir toplum inşa etmeye çabalayan versiyonun - ilkelerini takip ederler."
 ig_modernizers_socialist:0 "Modernleşmeciler (Sosyalist)"
 ig_modernizers_socialist_desc:0 "$ig_socialists_desc$"
 ig_westernizers_socialist:0 "Batılılaşmacılar (Sosyalist)"
 ig_westernizers_socialist_desc:0 "$ig_socialists_desc$"

 ig_independent_socialists:0 "Bağımsız Sosyalistler"
 ig_independent_socialists_desc:0 "Sosyalizm, Birinci Enternasyonal'de anarşistlere karşı çıkan geniş solcu geleneği ifade eder. Belirli eğilimler, örneğin İngiliz Chartistlerinin kitle hareketi, Blankistlerin gizli cemiyetleri, Lassallecilerin parlamenter siyaseti ve Marksistlerin bilimsel sosyalizmi arasında büyük farklılıklar gösterebilir."

 ig_debs_faction:0 "Kardeşlik Fraksiyonu"
 ig_debs_faction_desc:0 "Radikalleşmiş madencilerden ve demiryolu sendikalarından doğan Kardeşlik Fraksiyonu (Brotherhood Faction), Halk Partisi (Popülist Parti) içinde rekabet eden sosyalist bir eğilimdir. Yıllarca süren işbirliğinin ardından Popülistlere katılan Sendikalistlerin aksine, Kardeşlik Fraksiyonu Emeğin Şövalyeleri içindeki en çok sömürülen (ve dolayısıyla en çok radikalleşen) sendikalardan ortaya çıkmıştır. Sendikalistler gibi endüstriyel sendikacılığı savunurken, seçim yöntemlerine ve sendika dışı örgütlenmelere daha fazla odaklanırlar. Her türden azınlığın güçlü savunuculuğunu yapmaları, Sendikalistlerle karşılaştırıldığında bile pek çok kadını saflarına çekmiştir."

# Anarchists
 ig_anarchists:0 "Anarşistler"
 ig_anarchists_only_icon:0 "@ig_anarchists!"
 ig_anarchists_desc:0 "Anarşistler, devletin derhal ortadan kaldırılmasına inanan sosyalistlerdir. Belirli inançlara göre değişmekle birlikte, anarşistler genellikle diğer sosyalizm türlerine karşı Proudhon ve Bakunin'in geleneğini takip ederler ve hiyerarşik olmayan emek ittifakları kurarak ya devleti aşmayı ya da onu tek bir hamlede devirmeyi amaçlarlar."

 ig_anarcho_syndicalists:0 "Anarko-Sendikalistler"
 ig_anarcho_syndicalists_desc:0 "Anarko-Sendikalistler, işçilerin üretim araçlarını ekonomik eylem yoluyla ele geçirmesi ve bu süreçte devleti ortadan kaldırması gerektiğine inanırlar. Her türlü devlet gücüne ilkesel olarak karşı çıkmalarıyla Sendikalistlerin geri kalanından ayrılan Anarko-Sendikalistler, yine de işçi sendikalarını yeni, eşit ve devletsiz toplumun üzerine inşa edileceği birincil bloklar olarak görürler."

 ig_narodniks_anarchist:0 "Narodnikler (Anarşist)"
 ig_narodniks_anarchist_desc:0 "Narodnikler, Rus serfliğinin sert gerçeklerinin bir sonucu olarak ortaya çıkan ve ideolojik olarak Rus Obşçina pratiklerinden esinlenen bir Rus popülist düşünce dalını tanımlayan bir terimdir. Narodnik düşüncenin anarşist dalı, Rusya'da hala var olan tarımsal komünleri yeni toplumun bir prototipi olarak kullanarak, Rusya'nın devletsiz bir topluma geçişinin gerekliliğini savunur."

# Revolutionist Socialists
 ig_revolutionist_socialists:0 "Devrimci Sosyalistler"
 ig_revolutionist_socialists_only_icon:0 "@ig_revolutionist_socialists!"
 ig_revolutionist_socialists_desc:0 "Daha sonraki Komünistlerin ataları olan Devrimci Sosyalistler, proletaryanın uluslararası diktatörlüğünün sosyalizme ulaşmanın tek yolu olduğuna inanırlar. Onlara göre reform mücadelesi, siyasi iktidarı kazanmak için gerekli devrimci bilinci inşa etmenin bir aracı olarak sınıf mücadelesinin bir bileşenidir. Genellikle devrimciler, siyasi deneyimin bir havuzu olarak kitle partisinin etrafında da kenetlenirler. Örnekleri arasında erken dönem Alman SPD'si, Alman Spartakistleri ve Rus Bolşevikleri bulunur."

 ig_revolutionist_social_democrats:0 "Sol Sosyal Demokratlar"
 ig_revolutionist_social_democrats_desc:0 "Daha sonraki Komünistlerin ataları olan Devrimci Sosyal Demokratlar, proletaryanın uluslararası diktatörlüğünün sosyalizme ulaşmanın tek yolu olduğuna inanırlar. Onlara göre reform mücadelesi, siyasi iktidarı kazanmak için gerekli devrimci bilinci inşa etmenin bir aracı olarak sınıf mücadelesinin bir bileşenidir. Genellikle devrimciler, siyasi deneyimin bir havuzu olarak kitle partisinin etrafında da kenetlenirler. Örnekleri arasında erken dönem Alman SPD'si, Alman Spartakistleri ve Rus Bolşevikleri bulunur."

 ig_communists:0 "Komünistler"
 ig_communists_desc:0 "Komünistler, proletaryanın uluslararası diktatörlüğünün sosyalizme ulaşmanın tek yolu olduğuna inanırlar. Onlara göre reform mücadelesi, siyasi iktidarı kazanmak için gerekli devrimci bilinci inşa etmenin bir aracı olarak sınıf mücadelesinin bir bileşenidir. Genellikle devrimciler, siyasi deneyimin bir havuzu olarak kitle partisinin etrafında da kenetlenirler. Örnekleri arasında Alman Spartakistleri ve Rus Bolşevikleri bulunur."

 ig_narodniks_urban:0 "Narodnikler (Kentli)"
 ig_narodniks_urban_desc:0 "Narodnikler, Rus serfliğinin sert gerçeklerinin bir sonucu olarak ortaya çıkan ve ideolojik olarak Rus Obşçina pratiklerinden esinlenen bir Rus popülist düşünce dalını tanımlayan bir terimdir. Obşçina'nın güçlenmesinin bir sonucu olarak ortaya çıkan ve Kentli olarak adlandırılan Narodnik dalı, kentli işçilere odaklanan küresel sosyalist düşünceyi, kolektif kendi kendini yöneten bir kurum olarak Obşçina'nın benzersiz gerçekliği ile sentezleyerek, birincil olarak tarımsal olan ideolojinin belirgin bir şekilde daha kentli bir yorumunu teşvik eder."

 ig_deleonist_faction:0 "Sendikalist Fraksiyon"
 ig_deleonist_faction_desc:0 "Başlangıçta Sosyalist İşçi Partisi'nin (Socialistic Labor Party) bir parçası olan Sendikalist Fraksiyon, Amerika Birleşik Devletleri'ndeki ilk sosyalist partiydi. Popülist Hareketin Kuzey'e ulaşmasıyla birlikte liderlik bu giderek radikalleşen partiyle birleşmeye karar verdi. Büyük çoğunluğu Alman-Amerikalılardan oluşmasına rağmen, bir platforma dönüşmeleri, artık diğer göçmen gruplarını ve hatta bazı Afrikalı-Amerikalıları da içerecek şekilde hareketin tabanını önemli ölçüde genişletti. Devletin sendikalist bir örgütlenmesini ve bu amaca ulaşmak için militan ve endüstriyel sendika eylemlerinin kullanılmasını savunurlar."

# Reformist Socialists
 ig_reformist_socialists:0 "Reformist Sosyalistler"
 ig_reformist_socialists_only_icon:0 "@ig_reformist_socialists!"
 ig_reformist_socialists_desc:0 "Reformist Sosyalistler, reformizme ve sosyalizme bağlılıkları konusunda farklılık gösterirler. Radikal uçta (Fransız Olasılıkçıları ve Alman USPD'si gibi) devrimi uzun vadeli bir hedef olarak tutarken günümüzde reformlara öncelik verenler yer alır. Ortada, SPD'deki Eduard Bernstein fraksiyonu gibi sosyalizme yalnızca reformlarla ulaşılabileceğine inananlar vardır. Son olarak sağ kanatta kapitalizm ile sosyalizm arasında bir uzlaşma sağlamak isteyen ve sonunda bugün sosyal demokrasi olarak bildiğimiz şeye dönüşenler yer alır."

 ig_possibilists:0 "Olasılıkçılar (Possibilists)"
 ig_possibilists_desc:0 "$ig_reformist_socialists_desc$"

 ig_fabian_socialists:0 "Fabian Sosyalistleri"
 ig_fabian_socialists_desc:0 "$ig_reformist_socialists_desc$"

 ig_reformist_social_democrats:0 "Sağ Sosyal Demokratlar"
 ig_reformist_social_democrats_desc:0 "$ig_reformist_socialists_desc$"

 ig_social_democrats:0 "Sosyal Demokratlar"
 ig_social_democrats_desc:0 "Bir zamanlar devrimci olan sosyal demokratlar, artık çoğunlukla reformizme bağlıdır. Sol kanatta, SPD'deki Eduard Bernstein fraksiyonu gibi sosyalizme yalnızca reformlarla ulaşılabileceğine inananlar vardır. Sağ kanatta ise kapitalizm ile sosyalizm arasında bir uzlaşma sağlamak isteyen ve sonunda bugün sosyal demokrasi olarak bildiğimiz şeye dönüşenler yer alır."

 ig_geoist_movement:0 "Jeoistler"
 ig_geoist_movement_desc:0 "Jeoistler (Geoists), Henry George'un yazıları etrafında şekillenen ekonomik ve siyasi reformcular hareketidir. Önerilerinin başında, ekonomik yatırımları teşvik etmek ve rant arayışındaki davranışları caydırmak amacıyla, arazideki iyileştirmelerin değil sadece arazi değerlerinin vergilendirileceği bir Arazi Değer Vergisi gelir. Jeoistlerin, Henry George'un New York Belediye Başkanlığı için yarıştığı Doğu Yakası şehirlerinde önemli bir nüfuzları vardır."

# Radlibs
 ig_radicals:0 "Radikal Liberaller"
 ig_radicals_only_icon:0 "@ig_radicals!"
 ig_radicals_desc:0 "Radikal liberaller, ılımlı kuzenlerinin ideallerini mantıksal sonuçlarına taşırlar. Tam demokrasi ve sosyal eşitlikçilik için ajitasyon yapar, resmi siyasetin imkansız olduğu yerlerde devrimci yollara başvururlar. Bu nedenle, zamanla daha da ılımlılaşsalar da, erken dönemlerde sosyalistlerle örtüşebilirler. Örnekleri arasında Fransız Radikalleri, 1848 devrimcileri, Amerikan Radikal Cumhuriyetçileri ve Sun Yat-sen'in KMT'si (Kuomintang) bulunur."

 ig_progressive_liberals:0 "İlerici Liberaller"
 ig_progressive_liberals_desc:0 "İlerici liberaller, genişletilmiş oy hakkı ve sosyal eşitlik tercihlerini hala koruyan, ancak artık devrimci faaliyetlerde bulunmayan radikal liberallerin ılımlılaştırılmış torunlarıdır. Ancak kendi ülkeleri çok gerici hale gelirse, ilericiler radikal karakterlerini yeniden kazanabilirler! Örnekleri arasında Fransız Üçüncü Cumhuriyeti'nin Radikal-Sosyalistleri ve Teddy Roosevelt'in Bull-Moose Partisi bulunur."

 ig_social_liberals:0 "Sosyal Liberaller"
 ig_social_liberals_desc:0 "Sosyal liberaller, genişletilmiş oy hakkı ve sosyal eşitlik tercihlerini hala koruyan, ancak artık devrimci faaliyetlerde bulunmayan radikal liberallerin ılımlılaştırılmış torunlarıdır. Ancak kendi ülkeleri çok gerici hale gelirse, ilericiler radikal karakterlerini yeniden kazanabilirler! Örnekleri arasında Fransız Üçüncü Cumhuriyeti'nin Radikal-Sosyalistleri ve Teddy Roosevelt'in Bull-Moose Partisi bulunur."

 ig_left_liberals:0 "Sol Liberaller"
 ig_left_liberals_desc:0 "$ig_social_liberals_desc$"

 ig_conscience_whigs:0 "Vicdan Whigleri"
 ig_conscience_whigs_desc:0 "$ig_radicals_desc$"

 ig_anti_masonic_whigs:0 "Mason Karşıtı Whigler"
 ig_anti_masonic_whigs_desc:0 "$ig_radicals_desc$"

 ig_radical_republicans:0 "Radikal Cumhuriyetçiler"
 ig_radical_republicans_desc:0 "$ig_radicals_desc$"

 ig_stalwarts:0 "Stalwartlar"
 ig_stalwarts_desc:0 "Stalwartlar, Cumhuriyetçi Parti'nin Yeniden İnşa (Reconstruction) sürecinin devamından, Ganimet Sisteminin (Spoils System) korunmasından ve Kadınların Oy Hakkı ile İçki Yasağı da dahil olmak üzere pek çok popülist fikirden yana olan bir fraksiyonuydu. Destek tabanları New York Eyaleti'ndeydi ve New York Limanı Denetleyiciliği, en sadık vekillere verilen bir ödül görevi görüyordu."

 ig_silverite_democrats:0 "Gümüşçü Demokratlar"
 ig_silverite_democrats_desc:0 "Gümüşçüler (Silverites), Demokrat Parti'nin gümüşe dayalı serbest para birimini savunan bir fraksiyonuydu. Bu tür bir politikanın enflasyona neden olacağını ve böylece yoksulların üzerindeki göreceli borç yükünü azaltacağını umuyorlardı. Destek tabanları, borçlu çiftçilerin ve gümüş madencilerinin ortak bir dava bulduğu Batı'da en güçlü konumdaydı."

 ig_zapadniks:0 "Zapadnikler"
 ig_zapadniks_desc:0 "Zapadnikler, Rusya'nın felsefe ve kültürde batılı ülkeleri örnek alarak modernleşmesi gerektiğine inanırlar (isimleri buradan gelir). Neredeyse her zaman liberal reformları destekler, cumhuriyetçi idealleri, sivil hakları, özel mülkiyeti ve liberal düşüncenin diğer unsurlarını teşvik ederler."
 ig_modernizers:0 "Modernleşmeciler"
 ig_modernizers_desc:0 "$ig_radicals_desc$"
 ig_westernizers:0 "Batılılaşmacılar"
 ig_westernizers_desc:0 "$ig_radicals_desc$"

 ig_despotic_utopians:0 "Despotik Ütopyacılar"
 ig_despotic_utopians_desc:0 "Despotik Ütopyacılar, Aydınlanma ilkelerinden etkilenen, ancak otokratik bir hükümetin halkın çıkarları doğrultusunda hareket ettiği bir topluma inanırlar."

 ig_farroupilhas:0 "Farroupilhalar"
 ig_farroupilhas_desc:0 "Farroupilhalar veya Jurujubalar, kentsel popüler sınıflar arasındaki mülk sahibi özgür adamlar ve küçük tüccarlardan oluşur. Eyaletlerin özerkliğinin önemli ölçüde artırılması gerektiğine inanırlar; daha geniş siyasi reformlar ve daha aşırı bazı durumlarda bir cumhuriyet kurulmasını talep ederler."

 ig_demokraten:0 "Demokraten"
 ig_demokraten_desc:0 "Demokraten, Alman liberallerinin en radikal kanadıdır ve Metternich'in Alman siyasi alanı üzerindeki Karlsbad Kararnameleri gibi süregelen etkisine şiddetle karşı çıkarlar. Radikal demokratlar olarak monarşinin tamamen kaldırılmasını ve büyük bir Alman üniter devletinin kurulmasını savunurlar. İlerici sosyal reformlar da gündemlerinin kilit parçalarıdır ve hedeflerini alt sınıflara kadar genişletirler."

# Liberals
 ig_liberals:0 "Liberaller"
 ig_liberals_only_icon:0 "@ig_liberals!"
 ig_liberals_desc:0 "Klasik liberaller, Aydınlanma ideallerini benimsemek için devlette reform yapmak isterler. Geleneksel güç yapılarından ayrı, güçlü bir ulus-devlet içinde genellikle bırakınız yapsınlar ekonomisini ve sivil hakları savunurlar. Örnekleri arasında İngiliz Whigleri, Amerikan Cumhuriyetçileri ve Rus Kadetleri bulunur."

 ig_liberal_reformers:0 "Liberal Reformcular"
 ig_liberal_reformers_desc:0 "$ig_liberals_desc$"

 ig_orleanists_left:0 "Hanedan Solu"
 ig_orleanists_left_desc:0 "$ig_liberals_desc$"

 ig_moderate_republicans:0 "Ilımlı Cumhuriyetçiler"
 ig_moderate_republicans_desc:0 "$ig_liberals_desc$"

 ig_moderate_liberals:0 "Ilımlı Liberaller"
 ig_moderate_liberals_desc:0 "$ig_liberals_desc$"

 ig_moralist_liberals:0 "Ahlakçı Liberaller"
 ig_moralist_liberals_desc:0 "$ig_liberals_desc$"

 ig_jacksonians:0 "Jacksoncı Demokratlar"
 ig_jacksonians_desc:0 "$ig_liberals_desc$"

 ig_jacksonian_liberals:0 "Jacksoncı Popülistler"
 ig_jacksonian_liberals_desc:0 "$ig_liberals_desc$"

 ig_barnburners:0 "Barnburners"
 ig_barnburners_desc:0 "Barnburners, Demokrat Parti'nin köleliğin kaldırılması, özgür topraklar (free soil) ve diğer radikal reformlardan yana olan bir fraksiyonuydu. Özgür Toprak Partisi'nin ve Cumhuriyetçi Parti'nin kurulmasına yardımcı olacaklardı."

 ig_half_breeds:0 "Melezler (Half-Breeds)"
 ig_half_breeds_desc:0 "Melezler (Half-Breeds), Cumhuriyetçi Parti'nin Parti Birliğini vurgularken aynı zamanda ılımlı bir Sivil Hizmet Reformunu savunan bir fraksiyonuydu. İsimleri, Ganimet (Spoils) karşıtı politikaları nedeniyle üyelerinin sadece Yarı-Cumhuriyetçi (Half-Republican) olduğu iddialarından kaynaklanır."

 ig_readjusters:0 "Yeniden Düzenleyiciler (Readjusters)"
 ig_readjusters_desc:0 "Yeniden Düzenleyici Partisi (Readjuster Party), iç yatırımları, tüm erkekler için oy hakkının güvence altına alınmasını ve Konfederasyon borçlarına karşı finans karşıtı pozisyonları vurgulayan iki ırklı popülist bir hareketti. Parti, Cumhuriyetçi Parti'nin desteğini kaybettikten sonra geriledi, ancak Stalwartların yönetime geçmesiyle para ve destek bu iki ırklı koalisyonu yeniden şekillendirdi."

 ig_zapadniks_moderate:0 "Zapadnikler (Ilımlı)"
 ig_zapadniks_moderate_desc:0 "Zapadnikler, Rusya'nın felsefe ve kültürde batılı ülkeleri örnek alarak modernleşmesi gerektiğine inanırlar (isimleri buradan gelir). Aralarından daha ılımlı olanlar bunlara ulaşmada devrimci olmayan, reformist yöntemleri tercih etseler de liberal ve cumhuriyetçi reformlardan yanadırlar."
 ig_modernizers_moderate:0 "Modernleşmeciler (Ilımlı)"
 ig_modernizers_moderate_desc:0 "$ig_liberals_desc$"
 ig_westernizers_moderate:0 "Batılılaşmacılar (Ilımlı)"
 ig_westernizers_moderate_desc:0 "$ig_liberals_desc$"
 ig_chimangos:0 "Chimangolar"
 ig_chimangos_desc:0 "Chimangolar genellikle kent nüfusunun kesimleri, tüccarlar ve küçük kırsal toprak sahipleriyle ilişkilendirilir. Ekonomik kalkınmayı, gücün yerinden yönetimini, siyasi ve sosyal yapıların modernleşmesini teşvik eden önlemleri destekleme eğilimindedirler."
 ig_parlamentarisch_liberale:0 "Parlamentarisch-Liberale"
 ig_parlamentarisch_liberale_desc:0 "Parlamentarisch-Liberale, Alman liberallerinin ılımlı kanadıdır. Anayasacı mevkidaşlarının aksine, parlamenter liberaller, prenslerden oluşan bir Alman federasyonunun başı olarak sadece sembolik bir monarkı desteklerler. Hem büyük hem de küçük Alman duruşları fraksiyonun içine sızarak parlamenter liberalleri bu konuda bölünmüş bırakmıştır."
 ig_luzias:0 "Luzialar"
 ig_luzias_desc:0 "Luzialar genellikle kent nüfusunun kesimleri, tüccarlar ve küçük kırsal toprak sahipleriyle ilişkilendirilir. Ekonomik kalkınmayı, gücün yerinden yönetimini, siyasi ve sosyal yapıların modernleşmesini teşvik eden önlemleri destekleme eğilimindedirler."

# Marlibs
 ig_market_liberals:0 "Piyasa Liberalleri"
 ig_market_liberals_only_icon:0 "@ig_market_liberals!"
 ig_market_liberals_desc:0 "Piyasa liberalleri, laissez-faire ekonomisine toplumun diğer alanlarındaki liberalleşmeden daha fazla öncelik veren muhafazakar liberallerdir. Örnekleri arasında İngiliz Peelitleri ve Amerikan Bourbon Demokratları bulunur."

 ig_bourbon_liberals:0 "Bourbon Liberalleri"
 ig_bourbon_liberals_desc:0 "$ig_market_liberals_desc$"
 ig_bourbon_democrats:0 "Bourbon Demokratları"
 ig_bourbon_democrats_desc:0 "$ig_market_liberals_desc$"
 ig_young_americans:0 "Genç Amerikalılar"
 ig_young_americans_desc:0 "$ig_market_liberals_desc$"

 ig_utilitarians:0 "Faydacılar"
 ig_utilitarians_desc:0 "Faydacılar, kamu yararını teşvik etmek amacıyla hükümet işlevlerinin kodlanması ve rasyonelleştirilmesi gerektiğine inanırlar."

# Natlibs
 ig_national_liberals:0 "Ulusal Liberaller"
 ig_national_liberals_only_icon:0 "@ig_national_liberals!"
 ig_national_liberals_desc:0 "Ulusal liberaller, güçlü bir devlet ve güçlü bir ordu ile ulusal birliğe öncelik veren muhafazakar liberallerdir. Örnekleri arasında Alman Ulusal Liberalleri, Fransız Bonapartçıları, Amerikan Savaş Demokratları ve Japon Emperyalistleri bulunur."

 ig_bonapartists:0 "Bonapartçılar"
 ig_bonapartists_desc:0 "$ig_national_liberals_desc$"

 ig_positivists:0 "Pozitivistler"
 ig_positivists_desc:0 "$ig_national_liberals_desc$"

 ig_popular_sovereignty:0 "Popüler Egemenlik (Halk Egemenliği)"
 ig_popular_sovereignty_desc:0 "Halk Egemenliği, İkinci Parti Sistemi döneminde sınır bölgelerinin, müzakere edilen tavizlere bakılmaksızın kendi topraklarında köleliğin yasallığını seçmelerine izin verilmesini savunan siyasi bir pozisyondu. Demokrat Parti içinde en popüler olanıydı ve sonunda Genç Amerikan Hareketi'nin temel bir ilkesi haline geldi."

 ig_war_democrats:0 "Savaş Demokratları"
 ig_war_democrats_desc:0 "$ig_national_liberals_desc$"

 ig_liberal_republicans:0 "Liberal Cumhuriyetçiler"
 ig_liberal_republicans_desc:0 "Liberal Cumhuriyetçiler, Yeniden İnşayı (Reconstruction) sona erdirmeyi ve radikal Kamu Hizmeti Reformunu savunan Cumhuriyetçi Parti'nin bir fraksiyonuydu. İsimlerini Horace Greeley'in Liberal Cumhuriyetçi Partisi'nden alan bu grup, liyakat ideallerini pragmatik parti sadakatinin üstünde tutarak parti liderlik rollerini kaybettiler ve aynı zamanda Cumhuriyetçi Parti içindeki yolsuzluk karşıtı davayı da zayıflattılar."

 ig_mugwumps:0 "Mugwump'lar"
 ig_mugwumps_desc:0 "Mugwump'lar, yolsuzluk meselesi yüzünden Demokratların tarafına geçen Cumhuriyetçi Parti'nin bir fraksiyonuydu. İsimleri hem Algonkin dilindeki savaş lideri kelimesine hem de yüzlerinin (mug) siyasi yelpazenin bir tarafında, kıçlarının (rump) ise diğer tarafında olduğuna işaret eder."

 ig_reformist_democrats:0 "Reformcu Demokratlar"
 ig_reformist_democrats_desc:0 "Reformcu Demokratlar, Bourbonlar ile Gümüşçülerin (Silverites) ortasında duran Demokrat Parti'nin bir fraksiyonuydu. Gümüşçülerin ilerici politikalarının birçoğunu desteklerken, bunu zaman zaman soğukkanlı bir pragmatizmle evlendirirler. Bu fraksiyonun ünlü tarihi liderleri arasında Woodrow Wilson, Al Smith ve Franklin D. Roosevelt bulunur."

# Conservatives
 ig_conservatives:0 "Muhafazakarlar"
 ig_conservatives_only_icon:0 "@ig_conservatives!"
 ig_conservatives_desc:0 "Muhafazakarlar, sosyal krizlere yanıt olarak durumsal bir şekilde reformları ilerletirken veya geri alırken statükoyu korumak isteyen geniş bir insan grubunu ifade eder. Bu birleşik bir ideoloji olmadığından muhafazakarlar; liberteryenizmi destekleyenler ile sosyal paternalizmi savunanlar, yerelcilik ile milliyetçilik veya sekülerizm ile dini ahlakçılık arasında gibi iç çatışmalarla dolu olabilir."

 ig_conservative_reformers:0 "Muhafazakar Reformcular"
 ig_conservative_reformers_desc:0 "$ig_conservatives_desc$"

 ig_orleanists:0 "Orleancılar"
 ig_orleanists_desc:0 "$ig_conservatives_desc$"
 ig_orleanists_right:0 "Doktrinerler"
 ig_orleanists_right_desc:0 "$ig_conservatives_desc$"

 ig_cotton_whigs:0 "Pamuk Whigleri"
 ig_cotton_whigs_desc:0 "$ig_conservatives_desc$"

 ig_paternal_conservatives:0 "Paternalist Muhafazakarlar"
 ig_paternal_conservatives_desc:0 "Paternalist muhafazakarlar, genellikle dini, korporatizmi veya #italic noblesse oblige#! (soyluluğun mecburiyeti) kavramını referans alarak siyasi haklar, reformlar ve sosyal refahtaki taktiksel genişlemelerle temel statükoyu korumaya çalışan muhafazakarların bir alt kümesidir. Örnekleri arasında Disraeli'nin Muhafazakarları, Teddy'nin İlerici Muhafazakarları, Woeste'nin Eski Sağ'ı ve Bismarckçı Muhafazakarlar bulunur."

 ig_progressive_conservatives:0 "İlerici Muhafazakarlar"
 ig_progressive_conservatives_desc:0 "$ig_paternal_conservatives_desc$"

 ig_slavophiles_moderate:0 "Slavofiller (Ilımlı)"
 ig_slavophiles_moderate_desc:0 "Slavofiller, Rusya'nın batı düşüncesiyle lekelenmemesi gerektiğine inanırlar - liberal reformlara ve sosyalist devrime şüpheyle yaklaşır, Rusya'nın güçlü, tek ve bölünmez kalabilmesi için sadece bazı şeylerin değişmesi gerektiğini düşünürler. Aralarındaki daha ılımlı olanlar bazı gerekli reformları - ancak ülkenin istikrarlı kalmasını sağlayacak kadar - kabul ederler, daha fazlasını değil."

 ig_catholic_democrats:0 "Katolik Demokratlar"
 ig_catholic_democrats_desc:0 "$ig_paternal_conservatives_desc$"

 ig_saquaremas:0 "Saquaremalar"
 ig_saquaremas_desc:0 "Saquaremalar, imparatorluk bürokrasisine bağlı gruplardan ve aynı zamanda üretimleri için dış pazarı hedefleyen toprak sahiplerinden gelir. Bunlar, yönetimin tek sesli rolünü sürdürmenin (imparatorluk yetkililerine ayrıcalıklı bir konum sağlayan bir özellik) yanı sıra, tüm eyaletlerde üretimin akışı için benzersiz koşulları garanti edebilen güçlü bir merkezi hükümete ihtiyaç duyarlar."
 
 ig_konstitutionell_liberale:0 "Konstitutionell-Liberale"
 ig_konstitutionell_liberale_desc:0 "Konstitutionell-Liberale, Alman liberallerinin sağ kanadıdır. Anayasacı bir monarkın altında, daha küçük bir Alman prensler federasyonunu desteklerler. Anayasacılığın ötesinde birincil hedefleri, Almanya genelinde siyasi özgürlükleri güvence altına almaktır."

# Reactionaries
 ig_reactionaries:0 "Gericiler"
 ig_reactionaries_only_icon:0 "@ig_reactionaries!"
 ig_reactionaries_desc:0 "Gericiler, niş çıkar gruplarının aksine nostaljilerini genel bir siyasete yükselten ve eski güzel günlere geri dönmek isteyenlerden oluşan geniş bir şemsiyedir. Ne istediklerinin detayları, o ülkedeki eski güzel günlerin nasıl olduğuna (veya nasıl göründüğüne) bağlıdır. Bu grubun alt bölümleri arasında monarşik mutlakiyetçiler, dini ahlakçılar ve hatta varlıklı köylüler bulunur."

 ig_absolutists:0 "Mutlakiyetçiler"
 ig_absolutists_desc:0 "Mutlakiyetçiler, monarkın merkezi ve modernleşen bir devlet üzerinde mutlak güce sahip olması gerektiğine inanırlar. Mutlakiyetçiliği ata yadigarı güçlerine bir müdahale olarak gören yerel aristokratların yanı sıra liberal reformcular tarafından da karşı çıkılırlar. Örnekleri arasında Rus Çarcıları ve bazı Meiji restorasyoncuları bulunur."

 ig_slavophiles:0 "Slavofiller"
 ig_slavophiles_desc:0 "Slavofiller, Rusya'nın batı düşüncesiyle lekelenmemesi gerektiğine inanırlar - liberal reformlara ve sosyalist devrime şüpheyle yaklaşır, Rusya'nın güçlü, tek ve bölünmez kalabilmesi için sadece bazı şeylerin değişmesi gerektiğini düşünürler. Reformların çoğunu reddetmekte kararlıdırlar, sadece ilahi bir takdirle serfliği Rusya'nın dünyanın geri kalmasının gerisinde kalmamak için ortadan kaldırması gereken bir hastalık olarak kabul ederler, batıdan sadece teknik yeniliklerin ithal edilmesi gerektiğine ve bunların bile denetlenmesi gerektiğine inanırlar."

 ig_legitimists:0 "Meşruiyetçiler (Legitimists)"
 ig_legitimists_desc:0 "$ig_reactionaries_desc$"
 ig_carlists:0 "Carlistler"
 ig_carlists_desc:0 "$ig_reactionaries_desc$"
 ig_miguelists:0 "Miguelistler"
 ig_miguelists_desc:0 "$ig_reactionaries_desc$"

 ig_unionists:0 "İttihatçılar"
 ig_unionists_desc:0 "$ig_reactionaries_desc$"

 ig_restorationists:0 "Restorasyoncular"
 ig_restorationists_desc:0 "$ig_absolutists_desc$"

 ig_southern_democrats:0 "Güneyli Demokratlar"
 ig_southern_democrats_desc:0 "Güneyli Demokratlar, Amerikan siyasetinde aktif olan en ateşli kölelik yanlısı, federal karşıtı fraksiyondur. Köleliği gerekli bir kötülük olarak görebilen diğer pek çok Antebellum dönemi muhafazakarının aksine, Güneyli Demokratlar onu pozitif bir iyilik olarak görür ve korumak için büyük çaba sarf etmeye isteklidirler. Ayrıca ayrılmayı en çok destekleyen gruptur ve bir İç Savaş durumunda Konfederasyonu destekleyeceklerdir."

 ig_southern_conservatives:0 "Güneyli Muhafazakarlar"
 ig_southern_conservatives_desc:0 "Güneyli Muhafazakarlar, Amerikan siyasetinde aktif olan en ateşli kölelik yanlısı, federal karşıtı fraksiyondur. Köleliği gerekli bir kötülük olarak görebilen diğer pek çok Antebellum dönemi muhafazakarının aksine, Güneyli Muhafazakarlar onu pozitif bir iyilik olarak görür ve korumak için büyük çaba sarf etmeye isteklidirler. Ayrıca ayrılmayı en çok destekleyen gruptur ve bir İç Savaş durumunda Konfederasyonu destekleyeceklerdir."
 
 ig_calhounites:0 "Calhouncular"
 ig_calhounites_desc:0 "$ig_southern_democrats_desc$"

 ig_monarchists:0 "Monarşistler"
 ig_monarchists_desc:0 "$ig_reactionaries_desc$"

 ig_theocrats:0 "Teokratlar"
 ig_theocrats_desc:0 "$ig_reactionaries_desc$"

 ig_national_conservatives:0 "Ulusal Muhafazakarlar"
 ig_national_conservatives_desc:0 "Ulusal Muhafazakarlar, güçlü bir ulusal kimliğin sürdürülmesine ve ahlakçılığın devletin yol gösterici ilkesi olarak korunmasına adanmış bir muhafazakar alt kümesidir. Modernleşen bir dünyada, katı sağcı sosyal politikalarla ve amaçlarına ulaşmak için organik bir devlet gibi liberal kurumları parçalamaya istekli olmalarıyla kendilerini daha liberal mevkidaşlarından ayırırlar. Örnekleri arasında Alman DNVP'si, Avusturya Soziale Romantiker'i, 1930'ların Polonya Genç Endecy'si, Brezilya Patrianovistleri ve Norveç Anavatan Birliği bulunur." 

 ig_caramurus:0 "Caramurular"
 ig_caramurus_desc:0 "Caramurular, esasen İmparator Dom Pedro I'in Brezilya'ya dönüşünü savunan tüccarlar, bürokratlar ve askeri personelden oluşur. İmparatorun güçlerini garanti altına alan güçlü bir şekilde merkezi bir monarşik rejimi savunurlar."

 ig_patrianovists:0 "Patrianovistler"
 ig_patrianovists_desc:0 "Patrianovistler, gelenekçi politikalara dayanarak Brezilya'da organik bir monarşi kurmayı amaçlarlar. Kökleri Katolikliğe, Aziz Thomas Aquinas'ın siyasi öğretilerine, milliyetçiliğe ve liberalizm ile anayasanın reddedilmesine dayanır."

 ig_malthusians:0 "Malthusçular"
 ig_malthusians_desc:0 "Bu grup, Thomas Malthus tarafından kurulan ekonomi teorilerini benimser ve sonuçta ortaya çıkan nüfus artışı nedeniyle yoksulluğu hafifletmeye yönelik her türlü çabanın kendi kendini boşa çıkaracağına inanır."

 ig_konservative:0 "Konservative"
 ig_konservative_desc:0 "Konservative, Alman milliyetçilerinin çoğunlukla Güney Almanlar ve Katoliklerden oluşan en muhafazakar kanadıdır. Prusya'nın ve dolayısıyla protestanların birleşik bir Almanya üzerindeki hakimiyeti korkusu, fraksiyonun daha büyük bir Alman federasyonunu desteklemesine yol açmıştır. Konservative'in anayasacılığı reddetmesi, onları mutlak monarşinin devamını savunan tek fraksiyon yapar."

# Fascists
 ig_fascists:0 "Faşistler"
 ig_fascists_only_icon:0 "@ig_fascists!"
 ig_fascists_desc:0 "Aşırı sağcı bir ideoloji olan faşizmi belirli terimlerle tanımlamak zordur. Genellikle ulusal şovenizm, devlete saygı, her türlü solcu veya yabancı olarak algılanan unsurlara karşı fanatik bir düşmanlık ile karakterize edilir ve çelişkilerle doludur -- faşistler sıklıkla derinden geleneksel değerleri benimserken aynı zamanda modern endüstrinin ve savaşın verimliliğini de yüceltirler. Gelenekçilik ile modernitenin bu garip birlikteliği, örneğin klerikal faşizmi geleneksel ahlakçılıktan ve İtalyan Fütürizmini sosyalizmden ayıran şeyin bir parçasıdır."
 ig_integralists:0 "İntegralistler"
 ig_integralists_desc:0 "$ig_national_conservatives_catholic$"

# Christian Democrats
 #ig_christian_democrats:0 "Hristiyan Demokratlar"
 #ig_christian_democrats_only_icon:0 "@ig_christian_democrats!"
 #ig_christian_democrats_desc:0 "Merkezci bir ideoloji olan Hristiyan Demokrasi, Katolik siyasi düşüncesinin son noktasını temsil eder. Sosyal Katolik düşünceden etkilenerek, devletin kamusal alandaki rolünü korporatizm ve subsidiyarite ilkeleri aracılığıyla sınırlarken, kapitalizmin daha insani bir formunu teşvik etmeyi amaçlar. Genellikle oy hakkının genişletilmesini destekler, ancak diğer konularda muhafazakarlığa eğilimlidir. Tarihsel olarak geniş bir etiketti; örnekler Avusturya'daki antisemitik Hristiyan Sosyal Partisi'nden, Zentrum ve onun pek çok kanadı aracılığıyla reformist Luigi Sturzo'ya kadar uzanır. Katolik ülkelerde genellikle Katolik düşüncesinin merkez-sol kanadını temsil ederken, Katolik olmayan ülkelerde Katolik düşüncesinin tüm yelpazesini temsil eder."
 
 #ig_catholics:0 "Katolikler"
 #ig_catholics_desc:0 "Katolikleri ve Katolik Kilisesi'ni, devletin haddini aştığını düşündükleri şeylerden korumayı amaçlayan ve aynı zamanda diğer duruşlarını siyasi ve sosyal Katolik düşüncesine dayandıran bir çıkar bloku."


# Nonideological
# Village Interests
 ig_rural_folk:0 "Köy Çıkarları"
 ig_rural_folk_only_icon:0 "@rural_folk_bpm!"
 ig_rural_folk_desc:0 "Kırsal kesimdeki insanların ve yerel güç komisyoncularının çeşitli çıkarlarını temsil eden ideolojik olmayan bir güç bloku. Sıklıkla tutarsız olsa da, bu tür köy çıkarları genel olarak yerel özerklik ve geleneksel değerlere yöneliktir."
 ig_rus_obschina:0 "Obşçinalar"
 ig_rus_obschina_desc:0 "Obşçina, toprağı daha iyi yönetmek için Rus hükümeti tarafından kullanılan, köylülerin geleneksel bir komünal öz-örgütlenme biçimidir. Vergilendirme, zorunlu askerlik ve kırsal asayişten sorumlu olan bu nispeten özerk ve biraz gayriresmi yönetim birimleri, kendi yerel kırsal topluluklarının ekonomik yönetiminde de önemli bir rol alıyordu. Rus İmparatorluğu'nda kendi yerel liderlerinin (Starosta) seçiminin norm olduğu birkaç yerden biri olan bu sosyal kurumlar, şaşırtıcı olmayan bir şekilde Narodnikler olarak adlandırılan bir Rus Tarım Sosyalizmi hareketine ilham verdi."
 ig_rus_obschina_rural:0 "Kırsal Obşçinalar"
 ig_rus_obschina_rural_desc:0 "Kırsal Obşçina, kökleri yakın zamandaki sosyalist devrime kadar hayatta kalmayı başaran orijinal Rus Obşçinasına dayanan bir kırsal özyönetim kurumudur. Chernopolositsa'nın verimsizliklerini ortadan kaldırmak için reform edilen, serflik ve aristokrasi boyunduruğundan kurtarılan yeniden düzenlenmiş Kırsal Obşçina, şimdi yeni sosyalist rejimin özerk, kendi kendini yöneten bir birimi ve kentsel mevkidaşı için gurur verici bir prototip olarak duruyor."
 ig_greenbackers:0 "Greenbackerlar"
 ig_greenbackers_desc:0 "Greenbackerlar, çiftçiler üzerindeki borç yükümlülüklerini azaltmak için enflasyonist bir ekonomi politikasını savunan çiftçi örgütlerinin gevşek bir gruplaşmasıdır. Bu merkezi sorunun dışında Greenbackerlar, içinde önemli ırkçı ve cinsiyetçi fraksiyonlar barındıran son derece çeşitli bir gruptur."
 ig_national_grange:0 "Çiftçi İttifakları"
 ig_national_grange_desc:0 "Çiftçi İttifakları (Farmers' Alliances), bir üreticiler sendikası olma hırsına sahip çiftçi savunuculuğu gruplarıdır. İttifaklar, demiryolu ve kamu hizmeti reformundan tarife indirimine ve devlet alıcılı bir alt hazine sistemine kadar bir dizi reform paketini destekler. Renkli Çiftçiler İttifakı (Colored Farmers' Alliance) gibi bazıları sosyal politikalarında radikaldir, ayrımcılığın sona ermesini ve Demokratlara karşı Cumhuriyetçilerle ittifaklar kurulmasını savunurlar."

# Business Interests
 ig_industrialists:0 "İş Dünyası Çıkarları"
 ig_industrialists_only_icon:0 "@industrialists_bpm!"
 ig_bourgeoisie:0 "Burjuvazi"
 ig_bourgeoisie_desc:0 "Burjuvazi, varlıklı kentli tüccarlar sınıfıdır. Şimdilik servetlerini ve güçlerini genişletmenin ötesinde pek az ideolojik bağlılıkları vardır."
 ig_industrialists_desc:0 "Büyük işletmelerin çıkarlarını temsil eden ideolojik olmayan bir güç bloku. Genellikle hükümet gözetimini sınırlamaya bağlıdırlar, diğer tüm konularda her an tekelci sermayenin yararına olan ne varsa onun tarafını tutarlar."

# Aristocratic Interests
 ig_landowners:0 "Aristokratik Çıkarlar"
 ig_landowners_only_icon:0 "@landowners_bpm!"
 ig_landowners_desc:0 "Geleneksel olarak güçlü ailelerin çıkarlarını temsil eden ideolojik olmayan bir güç bloku. Genellikle güçlerini korumaya bağlıdırlar, eski kinler yüzünden çıkan çekişmelerle boğuşurlar."
 ig_slaver_interests:0 "Köle Sahibi Çıkarları"
 ig_slaver_interests_desc:0 "Köle sahiplerinin çıkarlarını temsil eden ideolojik olmayan bir güç bloku. Genellikle 'mülkiyet' haklarını savunmaya bağlıdırlar, bunun dışındaki çoğu konuda bölünmüşlerdir."
 ig_shogunate:0 "Daimyo Çıkarları"
 ig_shogunate_desc:0 "Daimyo'lar, 10. yüzyıldan itibaren Japonya'nın büyük bölümünü Kyoto'nun ve Şogun'un doğrudan mülklerinin ötesinde yöneten güçlü toprak sahibi lordlar ve kodamanlardı. Daimyo'lar, iddialarını savunmak için samuraylar kiralayan güçlü klanlara bölünmüşlerdi."
 ig_kazoku:0 "Kazoku"
 ig_kazoku_desc:0 "Kazoku, Meiji restorasyonundan sonra oluşturulan soydan geçen aristokrasiydi. Daimyo ve kuge'lerin, İngiliz asalet sisteminden modellenen tek bir unvan ve asalet sisteminde birleştirilmesiyle oluşturuldu."
 ig_mesafint:0 "Mesafint Çıkarları"
 ig_mesafint_desc:0 "Mesafint, imparatorluğun irsi soylularıydı ve genellikle çeşitli eyaletlerin liderliğine hakim oluyorlardı. Asıl çıkarları, Gondar'daki saray üzerinde nüfuz için savaşırken ayrıcalıklarını ve özerkliklerini korumak için mücadele etmektir."
 ig_hacendados:0 "Hacendado Çıkarları"
 ig_hacendados_desc:0 "Kırsal işçilerden ve kölelerden oluşan bir işgücüne sahip büyük haciendalar ve çiftliklere sahip olan ekici sınıfını temsil eder. Bu toprak sahipleri 19. yüzyılda birçok Latin Amerika ülkesinde güçlü bir elit haline geldiler."

# Professional Interests
 ig_intelligentsia:0 "Mesleki Çıkarlar"
 ig_intelligentsia_only_icon:0 "@intelligentsia_bpm!"
 ig_intelligentsia_desc:0 "Profesyonellerin ve tüccarların çıkarlarını temsil eden ideolojik olmayan bir güç bloku. Tipik olarak mesleki dernekler, zanaat sendikaları, geleneksel loncalar ve gayriresmi karteller halinde örgütlenen bu gruplar, hem büyük işletmelerin hem de yıkanmamış kitlelerin tecavüzünden korkarlar. Örnekleri arasında Hollanda ve İtalyan tüccar loncalarından Amerikan İşçi Federasyonu'na kadar çeşitlilik gösterir."
 ig_rus_meschane:0 "Meşçane Çıkarları"
 ig_rus_meschane_desc:0 "Meşçane (Meschane), mülkler (estates) sisteminin varlığı sırasında Rusya'daki kentsel alt sınıfı ifade eder. Bir diğer önemli kentsel tabaka olan Raznoçintsilere (Raznochintsy) kıyasla Meşçaneler, devrimci duygulardan ziyade ılımlılığı ve istikrarı tercih etme eğilimindedir."
 ig_artisanal_guilds:0 "Zanaatkar Loncaları"
 ig_artisanal_guilds_desc:0 "Geleneksel üretim yöntemlerine adanmış vasıflı zanaatkârları temsil eden bir zanaat loncaları, atölyeler ve zanaatkâr dernekleri koleksiyonu. Yerel zanaatkarlığın korunmasını, kalitenin düzenlenmesini ve geçim kaynaklarını ile bağımsızlıklarını tehdit eden endüstriyel genişlemeye karşı direnişi savunurlar."
 ig_rus_raznochintsy:0 "Raznoçintsi (Raznochintsy)"
 ig_rus_raznochintsy_desc:0 "Raznoçintsi, çoğunlukla kent sakinlerinden oluşan, şu veya bu nedenle yabancı olmayan ancak aynı zamanda Rusya'nın katı mülkler sisteminin dışında yer alan bir gruptur. Bu grubun üyeleri, batılı, liberal fikirlere sempati besleyen devrimci duygularıyla tanınırlar. Bu nedenle, Meşçanelere (Meschane) kıyasla Rusya'nın geleceğine ilişkin daha radikal fikirleri destekleme eğilimindedirler."
 ig_rus_obschina_urban:0 "Kentli Obşçinalar"
 ig_rus_obschina_urban_desc:0 "Kentli Obşçina, yakın zamanda güçlenen Obşçina'nın Rus toplumunun tarım dışı kesimine ekstrapolasyonunun sonucudur. Kolektif karar alma ve kamu mülkiyetindeki toprak uygulamalarından yararlanan Kentli Obşçinalar, kentsel nüfusun yüksek nüfus yoğunluğunu ve özel ihtiyaçlarını hesaba katarken, aynı zamanda Kırsal Obşçina tarafından mükemmelleştirilen mevcut kendi kendini yönetme mekanizmalarından bazılarını da kullanırlar."
 ig_negade:0 "Negade Çıkarları"
 ig_negade_desc:0 "Negade, Etiyopya'nın genellikle özellikle zengin Negadras'lar tarafından yönetilen kentli tüccarlarını ifade eder. Bu grup, diğer birçok tüccar gibi dış rekabetten korkar, zanaatkârları ve kentli kliklerden oluşan ağlarının nüfuzunu korumak ister."

# Bureaucratic Interests
 ig_petty_bourgeoisie:0 "Bürokratik Çıkarlar"
 ig_petty_bourgeoisie_only_icon:0 "@petty_bourgeoisie_bpm!"
 ig_petty_bourgeoisie_desc:0 "Kökleşmiş bürokratları temsil eden ideolojik olmayan bir güç bloku. Bu yozlaşmış yetkililer, hedeflenen siyasi süreçlere rağmen iktidarda kalmak için siyasi mekanizmaları manipüle etme konusunda uzmandır."
 ig_kuge:0 "Kuge Çıkarları"
 ig_kuge_desc:0 "Kuge'ler, İmparator'un iç sarayının soyluları ve memurlarıydı; Şogun veya bir daimyo'ya değil, doğrudan ona hesap verirlerdi."

# Military Interests
 ig_armed_forces:0 "Askeri Çıkarlar"
 ig_armed_forces_only_icon:0 "@armed_forces_bpm!"
 ig_armed_forces_desc:0 "Güçlü askeri liderleri temsil eden ideolojik olmayan bir güç bloku. Genellikle askeri gücü sivil toplum üzerinde genişletmeye bağlıdırlar, askeri makamlar aracılığıyla kişisel prestij ve zenginleşme arayışındadırlar."

# Church Interests
 ig_devout:0 "Kilise Çıkarları"
 ig_buddhist_monks:0 "Budist Rahipler"
 ig_sikh_priesthood:0 "Sih Rahipliği"
  ig_sikh_priesthood_desc:0 "$ig_devout_desc$"
 ig_devout_only_icon:0 "@devout_bpm!"
 ig_devout_desc:0 "Köklü bir kurum olarak organize dini temsil eden ideolojik olmayan bir güç bloku. Üyeleri, dini geniş siyasete enjekte etmek yerine dini yapılar içindeki ayrıcalıklarını korumaya çalıştıkları için dini ahlakçılardan farklıdırlar. Güçlü bir organize dine sahip olmayan ülkelerde bunlar servet veya dünyevi nüfuz sahibi yerel din adamlarıdır. Örnekleri arasında devlet kiliseleri, Sünni Müftüleri ve Çin'in ayin ustaları bulunur."

