l_turkish:
 concept_bpm_political_stability: "Siyasi Katılık"
 concept_bpm_political_stability_desc: "$concept_bpm_political_stability$, ülkenizdeki siyasi güçlerin dinamizm veya durağanlık seviyesini temsil eder. Bu durum, [Concept('concept_bpm_institutional_ig', 'Kurumsal')] ve [Concept('concept_bpm_ideological_ig', 'İdeolojik')] [Concept('concept_interest_group', 'Çıkar Grupları')] arasındaki popülariteyi etkiler:\n- Daha yüksek $bpm_political_stability$, [Concept('concept_bpm_institutional_ig', 'Kurumsal Grupları')] daha popüler hale getirir.\n- Daha düşük $bpm_political_stability$, [Concept('concept_bpm_ideological_ig', 'İdeolojik Grupları')] daha popüler hale getirir.\n\n@warning! $bpm_political_stability$ ayrıca kademeli bonuslar ve cezalar verir:\n  #v %66#! üzeri ([Concept('concept_bpm_politically_stagnant', 'Durağan')]):\n    @arrow_down! Yasa Geçme Şansı, Hızı\n  #v %33 - %66#! arası ([Concept('concept_bpm_politically_dynamic', 'Dinamik')]):\n     Etkisi yok.\n  #v %33#! altı ([Concept('concept_bpm_politically_unstable', 'İstikrarsız')]):\n    @arrow_up! Pop Siyasi Gücü, Yaşam Standardı Düşüşünden Gelen Radikaller;\n    @arrow_down! Bina Üretim Hacmi, İnşaat Verimliliği"

 bpm_political_stability_baseline_value_tt: "\n[GetPlayer.MakeScope.GetScriptValueDesc('bpm_political_stability_baseline_target')]$bpm_rigidity_baseline_value_add_modifier$$bpm_rigidity_baseline_value_mult_modifier$\n"
 bpm_rigidity_baseline_value_add_modifier: "[AddTextIf(Not(EqualTo_string('', Country.GetModifier.GetDescFor('country_rigidity_baseline_add'))), Concatenate('\n', Country.GetModifier.GetDescFor('country_rigidity_baseline_add')))]"
 bpm_rigidity_baseline_value_mult_modifier: "[AddTextIf(Not(EqualTo_string('', Country.GetModifier.GetDescFor('country_rigidity_baseline_mult'))), Concatenate('\n', Country.GetModifier.GetDescFor('country_rigidity_baseline_mult')))]"

 bpm_political_stability_rate_value_tt: "\n[GetPlayer.MakeScope.GetScriptValueDesc('bpm_political_stability_rate')]$bpm_rigidity_rate_value_add_modifier$$bpm_rigidity_rate_value_mult_modifier$"
 bpm_rigidity_rate_value_add_modifier: "[AddTextIf(Not(EqualTo_string('', Country.GetModifier.GetDescFor('country_rigidity_rate_add'))), Concatenate('\n', Country.GetModifier.GetDescFor('country_rigidity_rate_add')))]"
 bpm_rigidity_rate_value_mult_modifier: "[AddTextIf(Not(EqualTo_string('', Country.GetModifier.GetDescFor('country_rigidity_rate_mult'))), Concatenate('\n', Country.GetModifier.GetDescFor('country_rigidity_rate_mult')))]"

 concept_bpm_politically_unstable: "Siyasi Açıdan İstikrarsız"
 concept_bpm_politically_unstable_desc: "Ülkeler, $concept_bpm_political_stability$ seviyeleri %33'ün altına düştüğünde Siyasi Açıdan İstikrarsız hale gelirler. İstikrarsızlığın etkileri şunlara kadar çıkabilir:\n[GetStaticModifier('bpm_stability_unstable').GetDesc]"
 concept_bpm_politically_dynamic: "Siyasi Açıdan Dinamik"
 concept_bpm_politically_dynamic_desc: "Siyasi Açıdan Dinamik ülkelere uygulanan özel bir etki veya değiştirici yoktur; $concept_bpm_political_stability$ seviyelerini %33 ile %66 arasında tutarlarsa dinamik olarak kabul edilirler. Bu durum, daha radikal alternatiflere kıyasla genellikle tercih edilir."
 concept_bpm_politically_stagnant: "Siyasi Açıdan Durağan"
 concept_bpm_politically_stagnant_desc: "Ülkeler, $concept_bpm_political_stability$ seviyeleri %66'nın üzerine çıktığında Siyasi Açıdan Durağan hale gelirler. Durağanlığın etkileri şunlara kadar çıkabilir:\n[GetStaticModifier('bpm_stability_stagnant').GetDesc]"

 bpm_political_stability_tooltip: "#header $bpm_political_stability$#!: [GetPlayer.MakeScope.ScriptValue('bpm_political_stability')|v]\n$TOOLTIP_DELIMITER$\nŞu sebeplerden dolayı #tooltippable;tooltip:[GetPlayer.GetTooltipTag],bpm_political_stability_baseline_tooltip [GetPlayer.MakeScope.ScriptValue('bpm_political_stability_baseline_target')|v]#! hedefine doğru ilerliyor:#indent_newline:4 $bpm_political_stability_baseline_value_tt$#!\nAylık #tooltippable;tooltip:[GetPlayer.GetTooltipTag],bpm_political_stability_rate_tooltip [GetPlayer.MakeScope.ScriptValue('bpm_political_stability_rate_signed')|+=]#! oranında şu sebeplerden dolayı değişiyor:#indent_newline:4 $bpm_political_stability_rate_value_tt$#!\n\nTemel $bpm_political_stability$, diğer şeylerin yanı sıra baskıcı yasalarla artar ve savaş, devrimci hareketler, radikaller, düşük [concept_legitimacy] ile azalır.\n\nBu durum, [Concept('concept_bpm_institutional_ig', 'Kurumsal')] ve [Concept('concept_bpm_ideological_ig', 'İdeolojik')] [Concept('concept_interest_group', 'Çıkar Grupları')] arasındaki popülariteyi etkiler:\n- Daha yüksek $bpm_political_stability$, [Concept('concept_bpm_institutional_ig', 'Kurumsal Grupları')] daha popüler hale getirir.\n- Daha düşük $bpm_political_stability$, [Concept('concept_bpm_ideological_ig', 'İdeolojik Grupları')] daha popüler hale getirir.\n\n@warning! $bpm_political_stability$ ayrıca kademeli bonuslar ve cezalar verir:\n  #v %66#! üzeri ([Concept('concept_bpm_politically_stagnant', 'Durağan')]):\n    @arrow_down! Yasa Geçme Şansı, Hızı\n  #v %33 - %66#! arası ([Concept('concept_bpm_politically_dynamic', 'Dinamik')]):\n     Etkisi yok.\n  #v %33#! altı ([Concept('concept_bpm_politically_unstable', 'İstikrarsız')]):\n    @arrow_up! Pop Siyasi Gücü, Yaşam Standardı Düşüşünden Gelen Radikaller;\n    @arrow_down! Bina Üretim Hacmi, İnşaat Verimliliği"

