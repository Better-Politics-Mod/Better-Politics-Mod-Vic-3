l_simp_chinese:
 bpm_movement_splits.1.t:0 "自由主义的兴起"
 bpm_movement_splits.1.d:0 "知识分子与资产阶级都被我国日益壮大的自由运动所吸引。他们鼓吹推动立宪政体和保护财产权的改革。如今自由派思想家已经组织起来，开始对我国政府施加直接压力。"
 bpm_movement_splits.1.f:0 "道德在任何国家都是立法与政府的产物；它们不分非洲、亚洲或欧洲，只分善恶。\n——德尼·狄德罗，1774年"
 bpm_movement_splits.1.a:0 "他们或许有用！"
 bpm_movement_splits.1.b:0 "他们是威胁！"
 bpm_movement_splits_liberals_tt:0 "@information! #blue 自由派将作为一个独立的[Concept('concept_interest_group', '利益集团')]存在。#!"
 bpm_movement_splits.2.t:0 "迈向现代"
 bpm_movement_splits.2.d:0 "随着改革主义在我国不断发展，越来越多的显赫领袖与思想家开始认真地关注建设现代政治与经济制度。改革运动如今可分为两个阵营：保守派与自由派。前者更为谨慎，希望在维持由传统制度支撑的寡头统治的同时实现国家现代化，并对崛起的资产阶级作出让步；后者则专注于贤能主义改革、宪政的正式化，以及早期民主制度的赋权。"
 bpm_movement_splits.2.f:0 "国家财富与权力的外在境况并非由自然的旨意所注定不变。它们可以通过人的勤勉努力而改变。今日的愚人可以成为明日的贤者，往昔的富贵强者可以成为今日的贫弱之辈……倘若我们开始以满腔热情追求学问，以实现个人独立，从而富国强兵，又何须畏惧西方列强？\n——福泽谕吉，1872年"
 bpm_movement_splits.2.a:0 "他们或许有用！"
 bpm_movement_splits.2.b:0 "他们是威胁！"
 bpm_movement_splits_conservatives_tt:0 "@information! #blue 保守派将作为一个独立的[Concept('concept_interest_group', '利益集团')]存在。#!"
 bpm_movement_splits.3.t:0 "激进派"
 bpm_movement_splits.3.d:0 "我国自由派中一个不断壮大的派系引起了全国关注。这些激进自由派呼吁对国家进行大规模改造，以有利于平等主义与自由表达。他们与较为温和的自由派的分歧在于，他们渴望以革命热情摧毁包括君主制在内的传统制度。"
 bpm_movement_splits.3.f:0 "颤抖吧，世上所有的压迫者！警惕吧，所有拥护奴性政府和奴性等级制度的人！不要再（荒唐而邪恶地）称之为改革、革新。你们再也无法让世界陷入黑暗。不要再抗拒日益增长的光明与开明。把权利还给人类；在你们与人类一同毁灭之前，同意纠正种种弊端。\n——理查德·普赖斯，1789年"
 bpm_movement_splits.3.a:0 "他们或许有用！"
 bpm_movement_splits.3.b:0 "他们是威胁！"
 bpm_movement_splits_radicals_tt:0 "@information! #blue 激进派将作为一个独立的[Concept('concept_interest_group', '利益集团')]存在。#!"
 bpm_movement_splits.4.t:0 "专制主义者"
 bpm_movement_splits.4.d:0 "我国越来越多的显赫人物信奉这样一种集权哲学：统治权归于[GetPlayer.GetRuler.GetPrimaryRoleTitle]，其依据是他们统治的权力直接源自上天，而国家的主权正是源于这一真理。"
 bpm_movement_splits.4.f:0 "国王犹如一位园丁，拔除荆棘与乱草，弃之一旁，从而美化他的园圃，同时又筑起一道篱笆，使他的土地免遭外人侵入。国王将贵族身边过多的朋友和危险的附庸一一剪除。在重大的事务上，不宜与众人商议。\n——阿布·法兹勒，1590年"
 bpm_movement_splits.4.a:0 "他们或许有用！"
 bpm_movement_splits.4.b:0 "他们是威胁！"
 bpm_movement_splits_absolutists_tt:0 "@information! #blue 专制主义者将作为一个独立的[Concept('concept_interest_group', '利益集团')]存在。#!"
 bpm_movement_splits.5.t:0 "农本民粹主义的兴起"
 bpm_movement_splits.5.d:0 "这个日新月异、不断现代化的世界所涌现的种种意识形态，激励了许多乡村领袖，他们运用这些理念来批判乡间的权力结构。这些农本民粹主义者持有种种有时颇为怪异的信仰，这些信仰由各自的文化与物质条件所塑造，但他们全都怀有对土地改革和把权力交还给我国农场与村庄劳动者的坚定信念。"
 bpm_movement_splits.5.f:0 "沙皇陷入了永久的举棋不定，丧失了进行任何真正思考的能力：他想要解放，却又竭尽全力加以阻止。他已逐渐明白，解放农民就等于解放土地；而解放土地又将引发社会革命，使农村公社主义变得神圣不可侵犯……对俄国来说，农村公社从未解体、私有制从未取代公社财产，这是何等的福祉。\n——亚历山大·赫尔岑，1851年"
 bpm_movement_splits.5.a:0 "他们或许有用！"
 bpm_movement_splits.5.b:0 "他们是威胁！"
 bpm_movement_splits_agpops_tt:0 "@information! #blue 农本民粹主义者将作为一个独立的[Concept('concept_interest_group', '利益集团')]存在。#!"
 bpm_movement_splits.6.t:0 "社会主义者"
 bpm_movement_splits.6.d:0 "一场平等主义运动正在我国各地兴起。社会主义运动受我国日益扩张的城市中鲜明的贫富悬殊所驱动，力求自下而上地实现社会民主化。社会主义者的策略多种多样，从建立独立的公社，到全面的改良主义，再到组织民众反抗与革命。社会主义运动还很年轻，但它已然成为一股令权贵胆寒、令平民振奋的幽灵。"
 bpm_movement_splits.6.f:0 "我知道有一种暴政，远比尼禄或提比略的暴政更难逃避、更难摆脱；那就是环境的暴政。它诞生于腐败的社会秩序，由愚昧、贫困、漠视、恶例、精神痛苦所构成……在事物的现状下，人们认为完全清晰明白的是，每个人都可自由地毁灭自己，只为了毁灭他人！\n——路易·勃朗，1839年"
 bpm_movement_splits.6.a:0 "他们或许有用！"
 bpm_movement_splits.6.b:0 "他们是威胁！"
 bpm_movement_splits_socialists_tt:0 "@information! #blue 社会主义者将作为一个独立的[Concept('concept_interest_group', '利益集团')]存在。#!"
 bpm_movement_splits.7.t:0 "市场自由派"
 bpm_movement_splits.7.d:0 "随着保护主义与自由贸易之争愈演愈烈，一批自由派加倍押注于自由贸易与放任自由的经济政策，认为解放市场是建设繁荣而公正的经济最可靠的途径。他们信任私人行动者在一波动的市场中配置资源，迅速适应全球市场供求的变化。"
 bpm_movement_splits.7.f:0 "简而言之，保护的目的在于阻止那些本身有用而有价值的东西进入一国，以迫使人们去制造这些东西。然而，全人类在日常生活的个人事务中所渴望的，并非制造物品，而是拥有物品。\n——亨利·乔治，1896年"
 bpm_movement_splits.7.a:0 "他们或许有用！"
 bpm_movement_splits.7.b:0 "他们是威胁！"
 bpm_movement_splits_marlibs_tt:0 "@information! #blue 市场自由派将作为一个独立的[Concept('concept_interest_group', '利益集团')]存在。#!"
 bpm_movement_splits.8.t:0 "民族自由派"
 bpm_movement_splits.8.d:0 "随着19世纪的推进，自由民族主义的理念在成功与失败的共同塑造下不断成长、日趋成熟。在包括我国在内的许多当代民族国家中，它已演变为一场深具浪漫色彩的运动，被卷入其中的人们寻求发展一种强大而现代的民族认同。当代民族主义同时影响着治理与文化，而站在这一运动最前沿的民族自由派，也以一股独立力量的面貌为人所知。"
 bpm_movement_splits.8.f:0 "我们知道，上一代政治家、立法者和作家们能做成什么；我们也知道他们达成了什么、未能达成什么。我们的职责与命运与他们截然不同。我们全然不喜欢那借来的腔调，然而我们……是新一代；现在轮到我们去探究，我们有何力量可以成就，以及世人会合理地期待我们把目光投向何方。\n——科尼利厄斯·马修斯，1845年"
 bpm_movement_splits.8.a:0 "他们或许有用！"
 bpm_movement_splits.8.b:0 "他们是威胁！"
 bpm_movement_splits_natlibs_tt:0 "@information! #blue 民族自由派将作为一个独立的[Concept('concept_interest_group', '利益集团')]存在。#!"
 bpm_movement_splits.9.t:0 "无政府主义者"
 bpm_movement_splits.9.d:0 "随着社会主义思想不断成长、发展，运动内部的论争也逐渐形成了自己的性格与派系。这一次，新出现的派系是无政府主义者；他们是信奉社会主义信条的人，认为国家凭借其强制力量对人类的福祉而言是与资产阶级同样巨大的威胁，因而要求尽可能地同时废除这两者。"
 bpm_movement_splits.9.f:0 "“无政府主义者已经说过千百遍，全部历史也印证了他们的说法：私有财产与政治权力是束缚人类锁链上的两个环节，如同刺客刀锋的双刃。不斩断其一，就无法挣脱其二。只废除私有财产而不废除政府，前者就会被掌权者重新复活；只废除政府而不废除私有财产，财产所有者就会复活政府。”\n——埃里科·马拉泰斯塔，1897年"
 bpm_movement_splits.9.a:0 "他们或许有用！"
 bpm_movement_splits.9.b:0 "他们是威胁！"
 bpm_movement_splits_anarchists_tt:0 "@information! #blue 无政府主义者将作为一个独立的[Concept('concept_interest_group', '利益集团')]存在。#!"
 bpm_movement_splits.10.t:0 "赤色分子"
 bpm_movement_splits.10.d:0 "在广泛的论争之后，工人与知识分子都被一股更为革命的潮流所吸引。革命社会主义思想家摒弃将改良作为工人解放之途的做法，如今已经组织起来，开始为一场无产阶级的革命性国际专政而鼓动。"
 bpm_movement_splits.10.f:0 "“共产党人不屑于隐瞒自己的观点和意图。他们公开宣布：他们的目的只有用暴力推翻全部现存的社会制度才能达到。让统治阶级在共产主义革命面前发抖吧。无产者在这个革命中失去的只是锁链。他们获得的将是整个世界。”\n——卡尔·马克思，1848年"
 bpm_movement_splits.10.a:0 "他们或许有用！"
 bpm_movement_splits.10.b:0 "他们是威胁！"
 bpm_movement_splits_revsocs_tt:0 "@information! #blue 革命社会主义者将作为一个独立的[Concept('concept_interest_group', '利益集团')]存在。#!"
 bpm_movement_splits.11.t:0 "改良派的事业"
 bpm_movement_splits.11.d:0 "正如社会主义事业的吸引力不断扩展，关于其前途的论争也日益激烈。无产阶级近来的选举胜利，为社会主义者中一个新的派系——改良派——铺平了道路。这个新近涌现的改良派翼主张以渐进、和平的改良取代无谓的流血，同时始终忠于实现社会主义这一终极目标。"
 bpm_movement_splits.11.f:0 "“一个正在崛起的阶级需要健全的士气，绝不能容许任何堕落。它是否为自己设定一个理想的最终目标，与它是否全力以赴地追求其近期目标相比，只是次要的。关键在于，这些目标是由一个明确的原则所激发，该原则体现了更高程度的经济与社会生活，它们是某种社会观念的化身，这种观念意味着在文明的演进中，对道德与法律权利有了更高的认识。”\n——爱德华·伯恩施坦，1899年"
 bpm_movement_splits.11.a:0 "他们或许有用！"
 bpm_movement_splits.11.b:0 "他们是威胁！"
 bpm_movement_splits_refsocs_tt:0 "@information! #blue 改良派社会主义者将作为一个独立的[Concept('concept_interest_group', '利益集团')]存在。#!"
 bpm_movement_splits.12.t:0 "法西斯主义的兴起"
 bpm_movement_splits.12.d:0 "一股新的反动势力崛起了，即@ig_fascists!法西斯主义者。这是一场极端民族主义运动，主张建立一种基于阶级合作和对民族不渝忠诚的国家秩序。"
 bpm_movement_splits.12.f:0 "大众有权改变财产关系；法西斯主义试图在保留财产的同时给他们一个表达的渠道。法西斯主义的逻辑结果，是把美学引入政治生活。法西斯主义以元首崇拜强迫大众下跪，这种对大众的践踏，其对应物是对一个被迫生产仪式价值的机器的践踏。\n——瓦尔特·本雅明，1936年"
 bpm_movement_splits.12.a:0 "他们或许有用！"
 bpm_movement_splits.12.b:0 "他们是威胁！"
 bpm_movement_splits_fascists_tt:0 "@information! #blue 法西斯主义者将作为一个独立的[Concept('concept_interest_group', '利益集团')]存在。#!"
 bpm_movement_takeovers.1.t:0 "农本社会主义者"
 bpm_movement_takeovers.1.d:0 "知识分子与资产阶级都被我国日益壮大的自由运动所吸引。他们鼓吹推动立宪政体和保护财产权的改革。如今自由派思想家已经组织起来，开始对我国政府施加直接压力。"
 bpm_movement_takeovers.1.f:0 "道德在任何国家都是立法与政府的产物；它们不分非洲、亚洲或欧洲，只分善恶。\n——德尼·狄德罗，1774年"
 bpm_movement_takeovers.1.a:0 "明白了。"
