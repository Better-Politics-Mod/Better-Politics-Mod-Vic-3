l_simp_chinese:
 bpm_state_crisis.1.t:0 "危机！"
 bpm_state_crisis.1.d:0 "国家的传统制度正受到威胁。每一位忠于国家的[Concept('concept_interest_group', '利益集团')]都已同意携手合作，保护现行制度免受激进派侵害。他们将支持采取极端措施，以确保国家的存续。"
 bpm_state_crisis.1.f:0 "“保卫被压迫者免受压迫者之害，为弱者抗强者的剥削与欺凌而辩护，这是所有未受利己与腐败侵蚀之心的职责。”——马克西米连·罗伯斯庇尔"
 bpm_state_crisis.1.a:0 "朕即国家！"
 bpm_state_crisis.1.b:0 "国家即人民！"
 je_bpm_crisis_of_the_state:0 "国家危机"
 je_bpm_crisis_of_the_state_desc:0 "国家正受到激进派的威胁。"
 je_bpm_crisis_of_the_state_reason:0 "所有忠于国家的[Concept('concept_interest_group', '利益集团')]都已同意携手合作，保护现行制度免受日益壮大的激进派威胁。"
 bpm_extremist_tt:0 "该利益集团是极端主义者"
 bpm_crisis_movement_radicalism:0 "对激进主义视而不见"
 bpm_crisis_movement_crackdown:0 "镇压激进派"
 je_bpm_crisis_of_the_state_goal:0 "上述条件已维持6个月。"
 je_bpm_constitutional_restrictions:0 "法律限制"
 je_bpm_constitutional_restrictions_desc:0 "[GetPlayer.GetRuler.GetPrimaryRoleTitle]权力过大。"
 je_bpm_constitutional_restrictions_reason:0 "我国大多数利益集团都认同[Country.GetRuler.GetPrimaryRoleTitle]权力过大。他们愿意支持限制[Country.GetRuler.GetPrimaryRoleTitle]权力的法律措施。然而[Country.GetRuler.GetPrimaryRoleTitle]并不愿轻易放弃权力。\n\n如果我们能说服[Country.GetRuler.GetPrimaryRoleTitle]放弃部分权力，我们就能更轻松地推行我们的议程。若存在威胁性的革命或针对[Country.GetRuler.GetHerHim]的强大运动，[Country.GetRuler.GetPrimaryRoleTitle]是可以被说服的。"
