 je_bpm_errors_of_the_world:0 "现代世界的谬误"
 je_bpm_errors_of_the_world_reason:0 "现代世界正慢慢被种种罪恶的精神与思想所吞噬，如野火般蔓延。这些思想对伴随我们走过历史的一切秩序与传统只构成威胁，它们只想摧毁和杀戮一切。时不我待，天主教会必须反击#yellow 自由主义#!与#gold 激进主义#!这一现代主义、无神论的威胁。\n\n这是一个[Concept('concept_bpm_global_je', '全局日志条目')]。它每月根据各种数值获取进度，例如：\n#P +#! @ig_liberals! #yellow 自由主义者#!、@ig_radicals! #gold 激进自由主义者#!和@ig_socialists! #pink 社会主义者#!的[concept_clout]；\n#P +#! 拥有[GetLawType('law_wealth_voting').GetName]#v 或更高#!选举权的世界各国政府的[concept_legitimacy]；\n#P +#! [GetLawGroup('lawgroup_church_and_state').GetName][Concept('concept_law', '法律')]以及拥有[GetLawType('law_public_schools').GetName]（#italic 作为一种#bold 世俗化#!的教育体系#!）\n\n完成之后，#gold #bold 基督徒，还是民主派？#!#![concept_journal_entry]的#v 第二阶段#!将被解锁，并减缓其进度获取，且@ig_reactionaries! #purple 反动主义者#!将人气上升。\n\n#lore 立法上的无神论、对宗教事务的冷漠，以及那些冠以自由天主教之名的有害格言，正是国家毁灭的真正根源；它们毁掉了法国。相信我，我所谴责的罪恶，比大革命更可怕，甚至比公社更可怕。我一直谴责自由天主教，如有必要，我会再谴责它四十遍。\n\n——教皇庇护九世，1871年#!"
 je_bpm_errors_of_the_world_status:0 "谴责自由天主教。"
 bpm_papal_encyclicals.1.t:0 "《忧虑之母》"
 bpm_papal_encyclicals.1.d:0 "#v 天主教会#!和罗马主教#v 教皇庇护九世#!，公开谴责了种种意识形态、实践与思想。自由主义、社会主义、世俗主义、激进主义、自由天主教以及总体上的现代性等思想，都遭到了公开的谴责和广泛的批判。"
 bpm_papal_encyclicals.1.f:0 "我们发出了我们的声音，在许多已发布的通谕、在御前会议上的训谕以及其他宗座文书中，我们谴责了这个最不幸时代的主要谬误，激发了你们值得称道的主教警觉，并一再告诫和劝勉我们最亲爱的天主教会众子，应当彻底憎恶并逃离如此可怕的瘟疫的传染。\n\n——教皇庇护九世，1864年"
 bpm_papal_encyclicals.1.a:0 "听起来像是一群聒噪的少数派。"
 je_bpm_immortal_god:0 "一位不朽的天主"
 je_bpm_immortal_god_reason:0 "上一任教皇——#v 教皇庇护九世#!——将天主教会引向了无知与难堪的最黑暗深渊。教会非但没有回应新的现实、传播主的圣言，反而把时间花在反对一切与所有人之上，失去了宝贵的信徒与力量。#v 教皇利奥十三世#!，作为圣座内部新的思想之声，对天主教训导的走向有自己的计划。\n\n这是一个[Concept('concept_bpm_global_je', '全局日志条目')]。它每月根据各种数值获取进度，例如：\n#P +#! 各种[Concept('concept_bpm_ig_is_socialist', '社会主义者')]的[concept_clout]；\n#P +#! 各种@ig_conservatives! #blue 保守-民族主义#![Concept('concept_interest_group', '利益集团')]的[concept_clout]；\n#P +#! 世界各国政府的[GetLawGroup('lawgroup_centralization').GetName][Concept('concept_law', '法律')]；\n#P +#! [GetLawGroup('lawgroup_church_and_state').GetName][Concept('concept_law', '法律')]\n#P +#! 拥有[GetLawType('law_census_voting').GetName]#v 或更高#!选举权的世界各国政府的[concept_legitimacy]；\n\n完成之后，天主教@ig_reactionaries! #purple 反动主义者#!和@ig_christian_democrats! #blue 天主教徒#!将获得[GetIdeology('ideology_rel_modern_moralist').GetName][concept_ideology]，@ig_reactionaries! #purple 反动主义者#!还将获得[GetIdeology('ideology_cit_multiethnic_nationalist').GetName]和[GetIdeology('ideology_jingoist').GetName]\n\n#lore ……每当国家允许意见与行动的自由把人的思想引离真理、把灵魂引离美德实践之时，国家就是在违背自然的法则与训令。\n\n——教皇利奥十三世，1885年#!"
 je_bpm_immortal_god_status:0 "寻求新思想。"
 bpm_papal_encyclicals.2.t:0 "《不朽的天主》"
 bpm_papal_encyclicals.2.d:0 "#v 天主教会#!和罗马主教#v 教皇利奥十三世#!，公开回应了民族主义、世俗化以及#bold 天主教徒#!参与选举制度的新思想。他主张在一切事务上服从民政统治者——只要这些统治者是合法的，并公开表示支持天主教徒参与政治和公共生活。"
 bpm_papal_encyclicals.2.f:0 "每一个文明共同体都必须有一个统治权威，而这个权威，如同社会本身一样，其根源在于自然，因而以上帝为其创立者。由此可知，一切公共权力都必然源自上帝。因为唯有上帝才是世界真正而至高的主宰。万事万物毫无例外都必须服从于他、侍奉于他，因此任何执掌治理之权的人，都是从唯一而单一的源泉——即全能的至高主宰上帝——那里获得此权的。\n\n——教皇利奥十三世，1885年"
 bpm_papal_encyclicals.2.a:0 "他到底会不会做点什么实事？"
 je_bpm_light_amidst_darkness:0 "黑暗中的光明"
 je_bpm_light_amidst_darkness_reason:0 "工业革命及其形形色色的后果，给全人类带来了巨大的痛苦，无论是将人的生命贬低为一件物质，还是试图摧毁引导我们所有人的一切自然法则。整个世界都被黑暗与悲伤所吞没，实际被新的统治社会阶层所把持。\n\n这是一个[Concept('concept_bpm_global_je', '全局日志条目')]。它每月根据各种数值获取进度，例如：\n#P +#! [Concept('concept_bpm_ig_is_socialist', '社会主义')][concept_interest_group]的[concept_clout]或[Concept('concept_political_movement', '政治运动')]；\n#P +#! 各种#bold 资本主义#!或/和#bold 反国家福利#![Concept('concept_interest_group', '利益集团')]的[concept_clout]；\n#P +#! 没有[GetLawType('law_census_voting').GetName]#v 或更高#!选举权的世界各国政府的[concept_legitimacy]；\n#P +#! 各国的平均[concept_sol]；\n#P +#! [GetLawGroup('lawgroup_church_and_state').GetName][Concept('concept_law', '法律')]\n\n完成之后，#bold #gold 基督徒，还是民主派？#!#![concept_journal_entry]的#v 第三阶段#!将被解锁。在对#v 新事#!通谕的诠释问题上，@ig_christian_democrats! #blue 天主教徒#!将发生不可调和的分裂，分裂为@ig_christian_democrats! #blue 基督教民主主义者#!和@ig_reactionaries! #purple 民族保守主义者#!（#italic 取代旧的反动主义者#!），两派都将获得更多支持。\n\n#lore 就我们正在讨论的问题而言，一个首要的恶是，想当然地认为社会的某个阶级本身敌视另一个阶级，仿佛自然让富人与穷人相互对立，在不可调和的战争中殊死搏斗。这与理性和真理如此相悖，事实恰恰相反；因为正如在人体中不同的肢体彼此和谐，从而产生了人体构图中那恰如其分被称为对称的布局与比例，自然也在国家中命令上述两个阶级应当和谐相处，恰当地形成彼此均衡的对应。\n\n——教皇利奥十三世，1891年#!"
 je_bpm_light_amidst_darkness_status:0 "如今，迎来一种造成分裂的哲学。"
 bpm_papal_encyclicals.3.t:0 "《新事》"
 bpm_papal_encyclicals.3.d:0 "#v 天主教会#!和罗马主教#v 教皇利奥十三世#!，公开回应了普通劳动者的苦难，以及应对资本主义所造成种种问题的福利与社会行动手段。他表示支持类似工会的运动，谴责社会主义和资本主义，并公开支持以有机主义的方式来建设国家与经济。"
 bpm_papal_encyclicals.3.f:0 "没有什么比看清世界的真实面貌，同时又在别处……为其困境寻求慰藉更有益的了。\n\n——教皇利奥十三世，1891年"
 bpm_papal_encyclicals.3.a:0 "他是革命者还是温和派？"
 je_bpm_graves_de_communi_re:0 "论现代时局"
 je_bpm_graves_de_communi_re_reason:0 "上一部重大通谕#v 《新事》#!的发布，在如今政治活跃的天主教运动中激起了巨大的行动力与多样性，这些运动开始以该通谕作为其纲领的思想基础。尽管#v 利奥十三世#!确实希望天主教徒参与公共生活，但他并不想让这些团体混淆他们应当奉行的术语与目标。\n\n这是一个[Concept('concept_bpm_global_je', '全局日志条目')]。它每月根据各种数值获取进度，例如：\n#P +#! [Concept('concept_bpm_ig_is_socialist', '社会主义')][concept_interest_group]的[concept_clout]或[Concept('concept_political_movement', '政治运动')]；\n#P +#! [GetInterestGroupVariant('ig_christian_democrats',GetPlayer).GetNameWithCountryVariant]和[GetInterestGroupVariant('ig_reactionaries',GetPlayer).GetNameWithCountryVariant][Concept('concept_interest_group', '利益集团')]的[concept_clout]\n#P +#! 拥有[GetLawType('law_census_voting').GetName]#v 或更高#!选举权的世界各国政府的[concept_legitimacy]；\n\n完成之后，#bold #gold 基督徒，还是民主派？#!#![concept_journal_entry]的#v 第四阶段#!将被解锁。#v 《论基督宗教的民主》#!将主要削弱@ig_christian_democrats! #blue 基督教民主#!运动，并削弱其激进上扬的势头。\n\n#lore 此外，把基督教民主这一名称歪曲到政治上去，将是一种罪行，因为尽管民主在语文学和哲学含义上都意味着人民治理，然而在目前的应用中，它必须被使用得不带任何政治含义，只意味着为民众谋福祉的基督教行动，仅此而已。因为自然与福音的法则，以其权利而言高于一切人事变迁，必然独立于一切特定的民政政府形式，同时又与一切不悖于道德和正义的事物相和谐。\n\n——教皇利奥十三世，1901年#!"
 je_bpm_graves_de_communi_re_status:0 "削弱天主教运动。"
 bpm_papal_encyclicals.4.t:0 "《论基督宗教的民主》"
 bpm_papal_encyclicals.4.d:0 "#v 天主教会#!和罗马主教#v 教皇利奥十三世#!，公开回应了[GetReligion('catholic').GetName]起源的种种新兴思想，主要是基督教民主。他界定了基督教民主的含义，它#bold 必须#!与其他意识形态有何区别，其目标，以及其他澄清与说明。"
 bpm_papal_encyclicals.4.f:0 "与之相反，基督教民主，正因其是基督教的，必然建立在神圣信仰的基本原则之上，它必须为大众提供更好的境况，其更深层的目标在于促进为永恒之物而生的灵魂臻于完善。\n\n——教皇利奥十三世，1901年"
 bpm_papal_encyclicals.4.a:0 "那他们到底是不是威胁？"
 bpm_new_wine_old_wineskins_flavour.100.t:0 "选举权改革"
 bpm_new_wine_old_wineskins_flavour.100.d:0 "对更广泛选举权的追求，在工人阶级和政治精英中稳步增长。支持的增长促使议会提出了一项扩大选举权的法案——[GetLawType('law_census_voting').GetName]——它仍然偏袒那些较为富裕的人。不久之后，一项《市政选举法》被提出，扩大了选举地方政府的选举权。"
 bpm_new_wine_old_wineskins_flavour.100.f:0 "今天，你需要黄金，大量的黄金，才能享有发言权；而我们还不够富有。为穷人沉默吧。\n\n——费利西泰·德·拉梅内，1848年"
 bpm_new_wine_old_wineskins_flavour.100.a:0 "审慎的代表制只能以这种方式实现。"
 bpm_new_wine_old_wineskins_flavour.101.t:0 "工场规章法"
 bpm_new_wine_old_wineskins_flavour.101.d:0 "随着劳动者恶劣的生活与工作条件所引发的激进主义高涨，[GetInterestGroupVariant('ig_conservatives',GetPlayer).GetNameWithCountryVariant]提出了一项法案，对雇佣条件进行监管与控制。该法案引入了各种虽非全面、但涉及安全、卫生以及对工人恶劣条件监管的规则。"
 bpm_new_wine_old_wineskins_flavour.101.f:0 "#italic 第一条。——在工业与商业企业以及省级和市政部门中，凡雇用至少十名工人的，都必须依照本法规定的方式制定书面的工场规章。\n\n此项义务可通过敕令扩展至雇用少于十名工人的企业。到1900年之前，将扩展至雇用至少五名工人的企业。#!\n\n——《工场规章法》，1896年6月15日"
 bpm_new_wine_old_wineskins_flavour.101.a:0 "希望这能奏效。"
 bpm_new_wine_old_wineskins_flavour.102.t:0 "农业改革"
 bpm_new_wine_old_wineskins_flavour.102.d:0 "农业已经有一段时间状况不佳。总体落后，既缺乏现代工具，也与国内其他地区缺乏联系。[GetInterestGroupVariant('ig_conservatives',GetPlayer).GetNameWithCountryVariant]对农业发展高度关注，推动了一项扶持大小农业经营的法案。"
 bpm_new_wine_old_wineskins_flavour.102.f:0 "你要吃亲手劳碌所得的果实；你必蒙福，凡事亨通。\n\n——诗篇 128:2"
 bpm_new_wine_old_wineskins_flavour.102.a:0 "希望这能奏效。"
 bpm_new_wine_old_wineskins_flavour.103.t:0 "宗教学校拨款"
 bpm_new_wine_old_wineskins_flavour.103.d:0 "所有[GetInterestGroupVariant('ig_conservatives',GetPlayer).GetNameWithCountryVariant]都珍视的主要事务之一，就是宗教教育，尤其是由国家斥巨资资助的宗教教育。于是，保守派推动立法通过了一项法案，确保为宗教教育和教会组织提供更多拨款。"
 bpm_new_wine_old_wineskins_flavour.103.f:0 "再说，如果义务教育是无害的倒也罢了。但当我们审视其倡导者的思想时，我们确信并非如此：从这项研究中可以汲取许多教训。我坚持认为，义务教育在许多地方会导致强制性的学校化，而这正是教会的敌人和一切天启宗教的敌人普遍倡导它的原因。这正是需要加以确证的事情。\n\n——夏尔·沃斯特，1907年"
 bpm_new_wine_old_wineskins_flavour.103.a:0 "我确信这事会有个好收场……"
 bpm_new_wine_old_wineskins_flavour.104.t:0 "小型监管措施"
 bpm_new_wine_old_wineskins_flavour.104.d:0 "不断恶化的生活条件和普遍的不满，促使[GetInterestGroupVariant('ig_conservatives',GetPlayer).GetNameWithCountryVariant]提出一项针对并监管采矿业的法案。它引入了关于采矿卫生、安全和雇佣的法规，还禁止妇女在矿上工作。"
 bpm_new_wine_old_wineskins_flavour.104.f:0 "原则上，我对强制措施始终十分反感。我知道有人会举出例子，比如为了国家和社会的利益而施加于个人的种种约束，我也并不否认其中大多数是必要的。但这不能成为将其扩展到本可避免的领域的理由。\n\n——夏尔·沃斯特，1907年"
 bpm_new_wine_old_wineskins_flavour.104.a:0 "虽小，却意义重大。"
 bpm_new_wine_old_wineskins_flavour.105.t:0 "雇佣工资改革"
 bpm_new_wine_old_wineskins_flavour.105.d:0 "[GetInterestGroupVariant('ig_conservatives',GetPlayer).GetNameWithCountryVariant]提出的一项法案，扩大了国家对勤恳诚实工作的劳动者的支持。这项法案虽然给予甚少，但将扩大以确保工人能够生存。"
 bpm_new_wine_old_wineskins_flavour.105.f:0 "一旦必需与正当的需求得到满足，其余所拥有的就属于穷人。\n\n——教皇利奥十三世，1891年"
 bpm_new_wine_old_wineskins_flavour.105.a:0 "一项出奇有争议的法案……"
 bpm_new_wine_old_wineskins_flavour.106.t:0 "周日休息法"
 bpm_new_wine_old_wineskins_flavour.106.d:0 "秉持虔诚之心，[GetInterestGroupVariant('ig_conservatives',GetPlayer).GetNameWithCountryVariant]通过了一项引入周日休息的法案，规范工时，并允许在重要的（主要是宗教的）事件发生时休假。这项法案骨子里深受宗教引导，却遭到议会中所有政党的反对。"
 bpm_new_wine_old_wineskins_flavour.106.f:0 "当记念安息日，守为圣日。六日要劳碌做你一切的工，但第七日是向耶和华你神当守的安息日……\n\n——出埃及记 20:8-10"
 bpm_new_wine_old_wineskins_flavour.106.a:0 "谦逊一向是所有基督徒的指导原则。"
