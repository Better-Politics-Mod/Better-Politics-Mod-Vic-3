 POLITICAL_MOVEMENT_RADICALISM_TOOLTIP:3 "#header [PoliticalMovement.GetNameNoIcon] içindeki [concept_activism]#!\nBazı Hareketler İsyan etmek için #v %10#! desteğe ihtiyaç duyarken, diğerleri #v %15#! gerektirir. Anarşistlerin kendiliğinden kitlesel bir ayaklanma için #v %30#!'a ihtiyacı vardır. Sosyalist ve Komünist hareketler sırasıyla 25 ve 50 Emek Bilinci gerektirir.\n[SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(PoliticalMovement.GetRadicalism, '(CFixedPoint)0.5'), 'ACTIVISM_RED_ICON', 'ACTIVISM_ICON')] [LabelingHelper.GetLabelForRadicalism(PoliticalMovement.GetRadicalism)] ($POLITICAL_MOVEMENT_RADICALISM_WITHOUT_LABEL$)\n$TOOLTIP_DELIMITER$\n#title Bu $concept_activism_short$ değerinin şuna doğru kayması öngörülüyor: #b [LabelingHelper.GetLabelForRadicalism(PoliticalMovement.GetTargetRadicalism)]#! (#tooltippable #tooltip:[PoliticalMovement.GetTooltipTag],POLITICAL_MOVEMENT_RADICALISM_BREAKDOWN [SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(PoliticalMovement.GetTargetRadicalism, '(CFixedPoint)1'), 'POLITICAL_MOVEMENT_TARGET_RADICALISM_WITHOUT_LABEL_RED', 'POLITICAL_MOVEMENT_TARGET_RADICALISM_WITHOUT_LABEL')]#!#!):#! #indent_newline:3 \n[PoliticalMovement.GetTargetRadicalismDesc]"