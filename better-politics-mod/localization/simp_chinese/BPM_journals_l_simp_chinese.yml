 je_bpm_guilty_land:0 "这片有罪之地"
 je_bpm_guilty_land_reason:0 "奴隶制的罪孽深深烙印在美国事业之魂中，“人人生而平等”这句话成了第九层地狱之罪。我们的人民深知这一点，因而他们与选举和妥协的伪善作斗争。当那些手段失效时，便滋生出阴谋论与分裂主义情绪。\n\n在#GBB 北方#!，奴隶主势力因奴隶制这一持续的罪行而备受指责。尽管多数人对此态度暧昧，但未来数年不断升温的紧张局势能够赢得广泛同情。\n\n在#GB 南方#!，江湖骗子们向自我欺骗的种植园主和绝望的小农们编造着州权的故事。刚刚从联邦法令废止危机中走出来，他们的情绪暂时有所缓和。\n\n#GBB 北方#!与#GB 南方#!的激进化分别由以下因素加剧：\n#N +#! #GBB 支持#!／#GB 反对#!奴隶制团体的选举胜利，\n#N +#! #GBB 反对#!／#GB 支持#!奴隶制总统在任内去世，\n#N +#! #GBB 蓄奴#!／#GB 自由#!州加入联邦。\n偶尔会有人提出妥协，但它们永远不会让双方都满意。\n\n要警惕扩张过快，因为新领土的到来会引发谁应有权耕作那片土地的辩论。随着#BB 全国激进化#!达到沸点，双方都将发动法律战和准军事暴力的运动。\n\n#N 向哈珀斯费里的进军无法被阻止，只能被推迟。#!"
