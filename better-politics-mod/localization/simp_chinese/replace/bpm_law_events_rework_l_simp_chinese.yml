 education_laws.2.f:0 ""这不仅仅是维持课堂秩序以便传授知识的问题；而是要塑造品格。毕竟，这些孩子的父母把如此重大的责任托付给了我们，他们竭尽所能把孩子培养成正派的公民。可我们太常看到，一些男孩的品性早已被放纵的青春几乎无可挽回地败坏了，对自己的国家毫无爱意。本不必如此！""
