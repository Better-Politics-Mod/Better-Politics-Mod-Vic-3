l_simp_chinese:
 bpm_colony_events.2.t:0 "[ROOT.GetCountry.GetAdjective] 自治"
 bpm_colony_events.2.d:0 "[ROOT.GetCountry.GetOverlord.GetAdjective] 的殖民地 [ROOT.GetCountry.GetName] 已被其宗主授予有限自治权。该殖民地现在可以自行管理其内部事务。"
 bpm_colony_events.2.f:0 "我不知除了按照那些在宗主国已被证明完全有效的原则来治理政府之外，还能以何种方式确保和谐。我绝不会损害王室的任何一项特权；恰恰相反，我相信这些省份人民的利益正需要那些迄今尚未行使过的特权所提供的保护……"
 bpm_colony_events.2.a:0 "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] 必须继续统治。"
 bpm_colony_events.2.b:0 "我们必须实行责任政府。"
 bpm_colony_events.3.t:0 "[ROOT.GetCountry.GetAdjective] 殖民地独立"
 bpm_colony_events.3.d:0 "前殖民地 [ROOT.GetCountry.GetName] 已宣布脱离其宗主独立。该殖民地现在可以自行管理其内部事务。"
 bpm_colony_events.3.f:0 "我们相信，[ROOT.GetCountry.GetAdjectiveNoFormatting] 人民同任何其他民族一样，拥有不可剥夺的权利：享有自由、享有自己劳动成果并满足生活所需，从而获得充分的发展机会。我们还相信，倘若任何政府剥夺人民的这些权利并压迫他们，人民就有进一步的权利去改变它或废除它……"
 bpm_colony_events.3.a:0 "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] 必须继续统治。"
 bpm_colony_events.3.b:0 "权力归于人民！"
