 council_republic_law_events.3.f:0 ""亲爱的同志@censored!@censored!@censored!@censored! 我很遗憾地通知您，我们位于@censored!@censored!@censored!@censored!街的党总部在一场大火中被烧毁大半，现已无法使用。我们怀疑是@censored!@censored!@censored!@censored!的恶意所为，但目前尚无法证实。""
 council_republic_law_events.3.a:0 "真是个坏消息。"
 council_republic_law_events.3.b:0 "我相信我们能给他们另找个地方。"
 council_republic_law_events.3.c:0 "这是对反动派发动战争的正当理由。"
