 concept_bpm_party_establishment:0 "建制程度"
 concept_bpm_party_establishment_desc:0 "一个政党的建制程度，衡量它在一个国家政治文化中扎根的深度。它影响该政党的受欢迎程度及其掌权的能力。一个政党的建制程度会受到该国[Concept('concept_bpm_political_stability', '政治僵化度')]、构成该党的[Concept('concept_bpm_ig_is_upper_institutional', '建制派')]与[Concept('concept_bpm_ideological_ig', '意识形态型')][Concept('concept_interest_group', '利益集团')]，以及该党在[Concept('concept_government', '政府')]中的存在情况的影响。"
