l_turkish:
 bpm_union_laws.1.t:0 "Sendikalar Mı?"
 bpm_union_laws.1.desc:0 "Şehirlerimiz büyüdükçe, buralarda yaşayan beş para etmez kışkırtıcılar da çoğalıyor. @trade_unions_bpm! Sendikalar yakın zamana kadar sadece küçük bir baş ağrısıydı, ancak şimdi sanayicilerimiz endişe verici organize sabotaj, kargaşa ve daha da kötüsü — #r sosyalizm#! olayları bildiriyorlar. Görünüşe göre, gururlu ülkemizin ekonomik ve ahlaki dokusunu mahvetmelerine izin vermemek için onları görmezden gelme politikamız sona ermeli."
 bpm_union_laws.1.f:0 "İşçilerin ücretlerini artırmak için bir araya gelmesi iki açıdan değerlendirilebilir; biri kendilerine fayda sağlamak... diğeri ise kendi derneklerine katılmayanlara zarar vermek. Hukukun üstünlüğü her ikisini de kınar.\n\n—Commonwealth v. Pullis Davası Tutanakları, 1806"
 bpm_union_laws.1.a:0 "Onları tamamen yasaklayın!"
 bpm_union_laws.1.b:0 "Onlara izin verin, ama faaliyetlerini kısıtlayın."
 bpm_union_laws.1.c:0 "Devlet onları bünyesine katmalı!"
 bpm_union_laws.1.d:0 "Düşününce, kimin umurunda?"

 communism.1.a:1 "Emekleri için daha yüksek ücret teklif edin."
 communism.1.b:1 "Son köle sahiplerinin işini bitirin."
 communism.1.c:1 "İşçiler için daha iyi koşulları garanti edin."
 communism.1.d:1 "Örgütlü emek üzerindeki kısıtlamaları kaldırın."
 communism.1.e:1 "Boyun eğmeyeceğiz!"