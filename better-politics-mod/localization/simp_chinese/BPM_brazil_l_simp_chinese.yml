l_simp_chinese:
 1834_additional_act.1.t:0 "摄政的逊位"
 1834_additional_act.1.d:0 "由于健康不佳、心灰意冷，且不再拥有当年执掌司法部时的那股干劲，[SCOPE.sCharacter('feijo_regent').GetLastName] 因固执己见而渐渐不得人心，又失去了过早辞世的重要盟友埃瓦里斯托·达·维加的支持，最终无法组建他所期望的内阁，只得辞去了职务。他任命了思虑周全、宽容保守的 [SCOPE.sCharacter('araujo_lima_regent').GetLastName] 为代理摄政。"
 1834_additional_act.1.a:0 "一个保守的摄政？"
 1834_additional_act.2.t:0 "摄政选举"
 1834_additional_act.2.d:0 "在中央政府与自治各省之间长期的政治动荡之后，[SCOPE.gsInterestGroup('conservatives_scope').GetName] 力图选举 [SCOPE.sCharacter('araujo_lima_regent').GetLastName] 为新摄政，以废除自由派改革并集中权力。另一方面，[SCOPE.sCharacter('albuquerque_scope').GetLastName] 则主张，保障各省的自由才是应对局势的正确之道。"
 1834_additional_act.2.a:0 "保守派能够解决问题。"
 1834_additional_act.2.b:0 "进步派将带来自由。"
 brazil_monarchy.1.t:0 "路易斯一世即位"
 brazil_monarchy.1.d:0 "随着伊莎贝尔统治的结束，[SCOPE.sCharacter('emperor_scope').GetFullName] 以巴西皇帝路易斯一世之尊登上了 [ROOT.GetCountry.GetAdjective] 皇位。他主张联邦制、义务兵役制，并改善劳工的生活水平。"
 brazil_monarchy.1.a:0 "皇帝万岁！"
 pedro.8.b:0 "帝国反击！"
 BRZ_united_states:0 "巴西合众国"
 brz_republican_coup:0 "共和政变"
 lopez_legacy_modifier:0 "洛佩斯遗产"
