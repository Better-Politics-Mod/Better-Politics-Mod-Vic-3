austrian_fascism.1.t: "Yeni Muhafazakarlar"
austrian_fascism.1.d: "[ROOT.GetCountry.GetAdjective] parlamenter demokrasisine yönelik hoşnutsuzluktan ilham alan geleneksel sınıflar, kendilerini [SCOPE.sPoliticalMovement('corporatist_movement_scope').GetName] etrafında konumlandırmaya başladılar. Platformları, [GetReligion('catholic').GetName] sosyal öğretilerine ve işçi hareketinin bir [GetLawType('law_corporate_state').GetName] altında pasifize edilmesine dayanıyor."
austrian_fascism.1.f: ""Bizi birleştiren ikinci bir şey, ortak bir pratik hedef daha var: en iyisini istemek, insan topluluğunu en hoş durumuna getirmek.\n\nSolcu sosyalistlerin eylemlerinde yıkımdan başka bir şey görmeyen sağcı ile sağcıların eylemlerinde sadece karanlık bir felaket gören solcu — hepsi aynı asil çabanın kendilerine rehberlik ettiği inancını birbirlerine tanımalıdır ve tanımak zorundadır."\n\n— Othmar Spann, #italic Gerçek Devlet#!"
austrian_fascism.1.a: "Bu, muhafazakarlığın geleceğidir."
austrian_fascism.1.b: "Şimdi kendimizi en kara gericilikle karşı karşıya buluyoruz."

austrian_fascism.2.t: "Avusturya Uyandı"
austrian_fascism.2.d: "[SCOPE.sCharacter('ruler_scope').GetFullName] ve [SCOPE.sParty('fascist_party_scope').GetName]'in çabaları [ROOT.GetCountry.GetName] devletini başarıyla bir [GetLawType('law_corporate_state').GetName] sistemine dönüştürdü. İşçi hareketi susturulduktan veya bünyeye katıldıktan sonra nihayet bir sosyal barış duygusu tesis edildi."
austrian_fascism.2.f: ""İşçi sınıfının en büyük arzusu, Tanrı ve Vatan için çalışma hakkıdır. Komünistlerin en çok korktuğu şey de tam olarak budur."\n\nGeriye taranmış saçlarıyla Cephe görevlisi konuşurken bir ileri bir geri yürüdü. [SCOPE.sCharacter('name_a_scope').GetFirstNameNoFormatting] esas duruşta bekliyordu, sınıf arkadaşları da yanındaydı. Kırk sekiz göz onun her hareketini takip ediyordu.\n\n"Onların silahı sabotaj ve bölünmedir ve bunu gittikleri her yere ekerler. Sizin savaşacağınız şey budur. Bu salona sınıfınızın en iyileri olan öğrenciler olarak girdiniz. Buradan fırtına birlikleri olarak çıkacaksınız.""
austrian_fascism.2.a: "Österreich!"
austrian_fascism.2.b: "Cephenin iradesi kanun olacaktır."

austrian_fascism.3.t: "Sadece Bir Rüya"
austrian_fascism.3.d: "[SelectLocalization(SCOPE.sPoliticalMovement('corporatist_movement_scope').IsValid, SCOPE.sPoliticalMovement('corporatist_movement_scope').GetName, 'movement_corporatist')], [ROOT.GetCountry.GetName] kontrolünü ele geçirmekte başarısız oldu. Radikal milliyetçiliğin hayaleti kalmaya devam edecek olsa da, $gov_corporate_state_austrofascist$ vizyonu tarihe karıştı."
austrian_fascism.3.f: "[ROOT.GetCountry.GetCapital.GetCityHubName] bugünlerde daha rahat nefes alıyor gibiydi. Sokak köşelerindeki sert bakışlı üniformalı gençler kaybolmuş, buğday tutkalıyla yapıştırılmış sendika afişleri bir kez daha sıradan bir manzara haline gelmişti. Bir kahvehane verandasında oturan [SCOPE.sCharacter('name_a_scope').GetFirstNameNoFormatting], yoldan geçen bir grup işçiye baktı. Grubun ortasında tanıdığı bir yüz belirip kayboldu.\n\n"Bay [SCOPE.sCharacter('name_b_scope').GetLastNameNoFormatting]?" diye bahse girdi karşısında oturan adam. "Sanırım onu bir broşürde görmüştüm."\n\n"Kimin broşürü?"\n\n"Önemli biri değil sanırım. Onları etrafta en son ne zaman gördüğümü hatırlamıyorum bile.""
austrian_fascism.3.a: "[ROOT.GetCountry.GetNameNoFormatting] kurtuldu!"
austrian_fascism.3.b: "Buradan nereye gidebiliriz?"

