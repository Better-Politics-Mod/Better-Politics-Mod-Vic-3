# TUTORIAL
 je_bpm_winds_of_change:0 "Değişim Rüzgarları (Eğitim)"
 je_bpm_winds_of_change_status:0 "Siyasi Katılık hakkında bilgi edinin."
 je_bpm_winds_of_change_reason:0 "Bu yeni çağda ulusumuzda değişim rüzgarları esiyor, ancak yasaları geçirmek için [Concept('concept_bpm_political_stability', 'Siyasi Katılık')] seviyemizi düşürmemiz gerekiyor. Bu değer, Meşruiyet çubuğunun üzerinde, hükümet penceresinin en üstünde bulunabilir.\n\nHükümetinizdeki katılık düzeyine bağlı olarak [Concept('concept_bpm_politically_stagnant', 'Durgun')], [Concept('concept_bpm_politically_dynamic', 'Dinamik')] veya [Concept('concept_bpm_politically_unstable', 'İstikrarsız')] olacaksınız:\n- [Concept('concept_bpm_politically_stagnant', 'Durgun')] katılık #v (66-100)#!, [Concept('concept_enactment_of_laws','Yasa Çıkarmayı')] çok daha zorlaştırır\n- [Concept('concept_bpm_politically_dynamic', 'Dinamik')] katılık #v (33-66)#! hiçbir özel bonus vermez\n- [Concept('concept_bpm_politically_unstable', 'İstikrarsız')] katılık #v (0-33)#!, [concept_throughput] ve [concept_construction] (İnşaat) verimliliğini düşürür\n\nKatılık #v 0-100#! arasında değişir ve yavaşça bir #v hedef değere#! doğru ilerler. Bu hedef çeşitli faktörlerle @arrow_up!#v yükselir#!, örneğin:\n- Muhafazakar yönetim, örn. [GetLawType('law_monarchy').GetName] ve [GetLawType('law_ad_hoc_centralization').GetName]\n- Muhafazakar ekonomi, örn. [GetLawType('law_serfdom').GetName] veya [GetLawType('law_tenant_farmers').GetName]\n- Bastırılmış ifade özgürlüğü, örn. [GetLawType('law_censorship').GetName] veya [GetLawType('law_outlawed_dissent').GetName]\n- #yellow $institution_police$#! Kurumuna yapılan yatırım\n- Yüksek [concept_loyalist] (Sadık) nüfusu\n\nÖte yandan, #v hedef değer#! şu gibi faktörlerle @arrow_down!#v düşebilir#!:\n- #yellow $institution_suffrage$#! Kurumuna yapılan yatırım\n- İsyancı Çıkar Grupları ve [concept_revolution]\n- [concept_war_exhaustion] (Savaş Yorgunluğu)\n- Düşük [concept_legitimacy]\n- Yüksek [concept_radical] (Radikal) nüfusu\n\n#v Katılığı hemen düşüremezseniz endişelenmeyin.#! Sanayileşmeye çalışın ve mümkün olduğunda [Concept('concept_political_movement','Siyasi Hareketler')] ile [Concept('concept_war', 'Savaşlardan')] yararlanın. Çıkar gruplarını isyana kışkırtmak yardımcı olabilir ve bir iç savaş çok işe yarayacaktır!"
 bpm_tutorial_stability_req:0 "Eğitimi henüz tamamlamadı ve 66'dan fazla #v Siyasi Katılığa#! sahip."
 bpm_tutorial_stability:0 "#v Siyasi Katılık#! seviyenizi 66'ya veya daha altına düşürün."

 bpm_tutorial.1.t:0 "Dinamik Bir Hükümet"
 bpm_tutorial.1.d:0 "Artık [Concept('concept_bpm_politically_dynamic', 'Dinamik')] bir [Concept('concept_bpm_political_stability', 'Siyasi Katılık')] seviyemiz var! Bu seviyede tuttuğumuz sürece, siyasi düzenimiz artık tüm reform girişimlerini engellemeyecektir.\n\n@warning! Eğer katılık çok düşerse, hükümetimiz [Concept('concept_bpm_politically_unstable', 'İstikrarsız')] hale gelecek ve ciddi zayıflatmalar alacaktır!"
 bpm_tutorial.1.f:0 "Başkentte yeni bir siyasi dinamizm havası esiyor, belki de bir değişim çağı kapıdadır."
 bpm_tutorial.1.a:0 "İleri!"

# PARTY BAN
 je_bpm_ban_communists:0 "Anti-Sosyalist Yasalar"
 je_bpm_ban_communists_status:0 "Sosyalist örgütleri hükümetten kazıyıp atın."
 je_bpm_ban_communists_reason:0 "Sosyalistler, kırılgan doğal düzeni altüst etmek isteyen bir devrimin siren şarkısını söylüyorlar; siyasi düzenimiz için oldukça endişe verici hale gelen bir devrim.\n\nBu Günlük Kaydı aktif olduğu sürece, [Concept('concept_bpm_ig_is_liberal', '$concept_bpm_ig_is_liberal$')] ve [Concept('concept_bpm_ig_is_moderate_conservative', '$concept_bpm_ig_is_moderate_conservative$')] [Concept('concept_interest_group', 'Çıkar Gruplarımız')], komünist partileri yasaklayan yasaları destekleme eğiliminde olacaktır."

 je_bpm_ban_fascists:0 "Anti-Faşist Yasalar"
 je_bpm_ban_fascists_status:0 "Faşist örgütleri hükümetten kazıyıp atın."
 je_bpm_ban_fascists_reason:0 "Kudurmuş derecede yabancı düşmanı ve aşırı militarist fanatikler olan Faşistler, kahverengi bir veba gibi sokaklara döküldü ve şiddet dolu delilikleriyle siyasi sahnemizi istila ettiler. Faşist tehdit belirginleştikçe, siyasi sahnemizin daha büyük bir kısmı faaliyetlerinin tamamen yasaklanmasını savunacak noktaya kadar onlarla sorun yaşamaya başladı.\n\nBu Günlük Kaydı aktif olduğu sürece, [Concept('concept_bpm_ig_is_liberal', '$concept_bpm_ig_is_liberal$')], [Concept('concept_bpm_ig_is_moderate_conservative', '$concept_bpm_ig_is_moderate_conservative$')] ve anarşist olmayan [Concept('concept_bpm_ig_is_socialist', '$concept_bpm_ig_is_socialist$')] [Concept('concept_interest_group', 'Çıkar Gruplarımız')], faşist partileri yasaklayan yasaları destekleme eğiliminde olacaktır."

 je_bpm_ban_anti_communists:0 "Anti-Kapitalist Yasalar"
 je_bpm_ban_anti_communists_status:0 "Kapitalist örgütleri hükümetten kazıyıp atın."
 je_bpm_ban_anti_communists_reason:0 "Devrimci projemiz, burjuvazinin boyunduruğunu yeniden kurmak isteyen iç düşmanların istilasına uğradı. Gerici güçler demokratik sürecimize katılarak güç biriktirdikçe, devrimci liderlerimiz giderek daha fazla endişeleniyor ve onlarla başa çıkmak için sert önlemler talep ediyor.\n\nBu Günlük Kaydı aktif olduğu sürece, anarşist olmayan [Concept('concept_bpm_ig_is_socialist', '$concept_bpm_ig_is_socialist$')] [Concept('concept_interest_group', 'Çıkar Gruplarımız')], sosyalist olmayan partileri yasaklayan yasaları destekleme eğiliminde olacaktır."

# SINGLE PARTY STATE
 bpm_become_single_party:0 "Mevcut tek iktidar [Concept('concept_party', 'Partisi')], [GetLawType('law_party_single').GetName] [Concept('concept_law', 'yasasını')] yürürlüğe koyarak ülkenizdeki diğer tüm [Concept('concept_party', 'Siyasi Partileri')] yasaklayacaktır."
 bpm_je_single_party_in_government_trigger:0 "[Concept('concept_ruler', 'Hükümdarınızın')] mevcut [Concept('concept_party', 'Siyasi Partisi')], diğer [Concept('concept_party', 'Partiler')] veya [Concept('concept_interest_group', 'Çıkar Grupları')] olmaksızın [Concept('concept_government', 'Hükümette')] yalnız olmalıdır."

 bpm_je_reactionaries_in_government_trigger:0 "[GetInterestGroupVariant('ig_reactionaries',GetPlayer).GetNameWithCountryVariant] mevcut [Concept('concept_party', 'Siyasi Partisi')] [Concept('concept_government', 'Hükümette')] yalnız olmalı, [concept_powerful] (Güçlü) olmalı, [Concept('concept_bpm_ig_is_organicist', 'Organikçi')] olmalı ve diğer [Concept('concept_party', 'Partiler')] veya [Concept('concept_interest_group', 'Çıkar Grupları')] olmamalıdır."
 bpm_je_single_party_has_elections:0 "[Concept('concept_election', 'Seçimlere')] izin veren [Concept('concept_law', 'Yasalarınız')] var"

 je_bpm_single_party_become:0 "Tek Parti Devletine Giden Yol"
 je_bpm_single_party_become_status:0 "Gücü pekiştirin ve mevcut partinin yönetimini sağlamlaştırın."
 je_bpm_single_party_become_reason:0 "Partinin devletin kolları üzerinde tartışılmaz bir kontrol kurmasının ve devletimizi şanlı bir geleceğe yönlendirmesinin zamanı geldi! Tahtadaki sadece birkaç hamle ile gücümüzü pekiştirebilecek ve diğer tüm partilerin yolumuzdan çekilmesini sağlayabileceğiz.\n\n#italic Eğer [concept_in_government] durumunda [GetInterestGroupVariant('ig_reactionaries',GetPlayer).GetNameWithCountryVariant] varsa ve bunlar [Concept('concept_bpm_ig_is_organicist', 'Organikçi')] iseler, bunun yerine [GetLawType('law_no_parties_allowed').GetName] elde edeceksiniz!#!"
 
 bpm_single_party.1.t:0 "Parti-Devleti"
 bpm_single_party.1.d:0 "Bugünden itibaren, [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullName], [SCOPE.sParty('single_party_party').GetName] dışındaki tüm partileri yasadışı ilan etti. Ancak bu karardan önce bile, muhalefet tutuklamalar, kayıplar ve suikastlarla boğuşuyordu, bu da onların siyasi varlığını fiilen yasadışı hale getirmişti zaten."
 bpm_single_party.1.f:0 "Rus Devrimi, devrimin başarısından başka hiçbir şeyi umursamadan siyasi bir diktatörlük kullandı ... başarısı, partinin devletin üstüne yerleştirilmesinden kaynaklanıyordu. Partiyi devletin üstüne yerleştirerek yeniden örgütlenmemiz gerektiğine inanıyorum.\n\n—Sun Yat-sen, 1924"
 bpm_single_party.1.a:0 "Şan olsun [SCOPE.sParty('single_party_party').GetName] partisine!"

 bpm_single_party.2.t:0 "Partisiz Devlet"
 bpm_single_party.2.d:0 "Bugünden itibaren, [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullName], ideolojileri ne olursa olsun tüm partilerin yasadışı olduğunu ilan etti. Ancak bu karardan önce bile, muhalefet tutuklamalar, kayıplar ve suikastlarla boğuşuyordu, bu da onların siyasi varlığını fiilen yasadışı hale getirmişti zaten."
 bpm_single_party.2.f:0 "Rus Devrimi, devrimin başarısından başka hiçbir şeyi umursamadan siyasi bir diktatörlük kullandı ... başarısı, partinin devletin üstüne yerleştirilmesinden kaynaklanıyordu. Partiyi devletin üstüne yerleştirerek yeniden örgütlenmemiz gerektiğine inanıyorum.\n\n—Sun Yat-sen, 1924"
 bpm_single_party.2.a:0 "Gerçekten temsil edici bir devlet çok yakın!"

# SOCIALIST ELECTORALISM
 je_bpm_socialist_electoralism:0 "Sosyalistler ve Seçimler Üzerine"
 je_bpm_socialist_electoralism_status:0 "Sosyalistlerin seçimlere katılım düzeyini izleyin."
 je_bpm_socialist_electoralism_reason:0 "Demokratik kurumlarımızın ve sosyalist ideolojinin gelişiminin birleşimi, devrimci aktörleri zor bir duruma soktu — onların #bold 'Burjuva Demokrasisi'#! dedikleri şeye ve pratikte seçim sistemimize katılmanın yararları üzerine bir tartışma. Onların sandıklarımızdan uzak durmalarını mı istemeliyiz, yoksa belki de onları saygın siyasete girmeye mi teşvik etmeliyiz? Seçim dolaylı olarak bizim.\n\nMevcut koşullarda, #bold Sosyalist#! seçimciliğin (electoralism) değerinin önümüzdeki haftalarda #tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_socialist_electoralism_special_tooltip [Country.MakeScope.Var('bpm_je_socialist_electoralism_baseline_target').GetValue|-=]#! değerine ulaşması bekleniyor. Seçimcilik seviyesi #bold 10'un#! üzerinde olduğu sürece, @ig_reformist_socialists!#bold Reformist Sosyalistler#! seçim siyasetinde kalacaktır. @ig_revolutionist_socialists!#bold Devrimci Sosyalistler#!, seçimcilik seviyesi #bold 40'ın#! altındaysa partilere katılma olasılıkları azalacak ve seviye #bold 25'in#! altındaysa seçimcilikten tamamen kaçınacaklardır. @ig_anarchists!#bold Anarşistler#!, seçimcilik seviyesi #bold 90'ın#! altındaysa partilere katılma ihtimalleri düşük kalacak ve #bold 75'in#! altındaki seviyelerde tamamen seçim karşıtı olacaklardır.\n\n#lore \"Buradan çıkan sonuç kesinlikle inkar edilemez: Sovyet cumhuriyetinin zaferinden birkaç hafta önce ve hatta böyle bir zaferden sonra bile burjuva-demokratik bir parlamentoya katılmanın, devrimci proletaryaya zarar vermek şöyle dursun, aslında o proletaryanın geri kalmış kitlelere bu tür parlamentoların neden ortadan kaldırılmayı hak ettiğini kanıtlamasına yardımcı olduğu kanıtlanmıştır; onların başarılı bir şekilde feshedilmesini kolaylaştırır ve burjuva parlamentarizmini 'siyasi olarak modası geçmiş' hale getirmeye yardımcı olur.\"\n\n—Vladimir İlyiç Lenin, 1920#!"

 je_bpm_socialist_electoralism_special_tooltip:0 "Bu doğal temel seviye aşağıdakiler tarafından belirlenir:\n#variable [Country.MakeScope.Var('bpm_je_socialist_electoralism_from_base').GetValue|-=]#! temel değer\n#variable [Country.MakeScope.Var('bpm_je_socialist_electoralism_from_powerful_socialists').GetValue|-=]#! Güçlü #bold Sosyalist#! [Concept('concept_interest_group', 'Çıkar Gruplarından')]\n#variable [Country.MakeScope.Var('bpm_je_socialist_electoralism_from_socialists_in_government').GetValue|-=]#! Hükümetteki #bold Sosyalist#! [Concept('concept_interest_group', 'Çıkar Gruplarından')]\n#variable [Country.MakeScope.Var('bpm_je_socialist_electoralism_from_bolstered_socialists').GetValue|-=]#! Desteklenen #bold Sosyalist#! [Concept('concept_interest_group', 'Çıkar Gruplarından')]\n#variable [Country.MakeScope.Var('bpm_je_socialist_electoralism_from_happy_socialists').GetValue|-=]#! Mutlu #bold Sosyalist#! [Concept('concept_interest_group', 'Çıkar Gruplarından')]\n#variable [Country.MakeScope.Var('bpm_je_socialist_electoralism_from_suppressed_socialists').GetValue|-=]#! Bastırılan #bold Sosyalist#! [Concept('concept_interest_group', 'Çıkar Gruplarından')]\n#variable [Country.MakeScope.Var('bpm_je_socialist_electoralism_from_revolution').GetValue|-=]#! #bold Mevcut Devrimden#! veya %33'ün altındaki [Concept('concept_bpm_political_stability', 'Siyasi İstikrardan')]\n#variable [Country.MakeScope.Var('bpm_je_socialist_electoralism_from_censorship').GetValue|-=]#! #bold İfade Özgürlüğü#! yasalarından\n#variable [Country.MakeScope.Var('bpm_je_socialist_electoralism_from_party_ban').GetValue|-=]#! #bold Parti Yasalarından#!\n#variable [Country.MakeScope.Var('bpm_je_socialist_electoralism_from_home_affairs').GetValue|-=]#! #bold İçişleri#! [Concept('concept_institution', '$concept_institutions$')] kurumundan"

# ANARCHIST PROPAGANDA OF THE DEED
 je_bpm_propaganda_of_the_deed:0 "Eylem Propagandası"
 je_bpm_propaganda_of_the_deed_status_1:0 "Şimdi patlayıcı bir felsefe zamanı."
 je_bpm_propaganda_of_the_deed_status_2:0 "Patlayıcı planlaması şu anda devam ediyor."
 je_bpm_propaganda_of_the_deed_status_3:0 "Eylem neredeyse hazır."
 je_bpm_propaganda_of_the_deed_reason:0 "#v Aylık Planlama İlerlemesi:#! #tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_propaganda_of_the_deed_bomb_tooltip [Country.MakeScope.ScriptValue('bpm_je_propaganda_of_the_deed_бомбометр_rate_true')|-=]#!\n@warning! #v %100'de#!, [GetInterestGroupVariant('ig_anarchists',GetPlayer).GetName], bir [concept_leader] (Lidere) #N bombalı suikast#! düzenlemeye çalışacak.\n\n#PB İnancın Gücü:#! [Country.MakeScope.ScriptValue('bpm_je_propaganda_of_the_deed_philosophy_value')|-] @arrow_right! #tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_propaganda_of_the_deed_baseline_tooltip [Country.MakeScope.ScriptValue('bpm_je_propaganda_of_the_deed_baseline_target')|-]#! (aylık #v 0.5#!)\nBu değer #v [Country.MakeScope.ScriptValue('bpm_je_propaganda_of_the_deed_decay_threshold_value')]#! seviyesinin üzerinde olduğunda günlük ilerlemesi artacaktır.\n@warning! #v [Country.MakeScope.ScriptValue('bpm_je_propaganda_of_the_deed_complete_threshold_value')]#! seviyesinde, [GetInterestGroupVariant('ig_anarchists',GetPlayer).GetName], [concept_ruler] (Hükümdarımıza) #N bombalı suikast#! düzenlemeye çalışacak.\n\nRadikallerimiz devletten giderek daha fazla hayal kırıklığına uğrarken, adanmış Anarşistlerin bir bölümü şimdi hedefli cinayetlerle kitlelerin bilincini uyandırmaya çalışıyor.\n\nOnların #pink İnancın Gücü#!, devlet baskısı, ekonomik çekişme, savaş ve Anarşist hareketin cesareti gibi faktörlerle belirlenen bir #v hedef değere#! doğru eğilim gösterir. Bu yeterince yüksekse, Anarşistler bir sonraki #N bombalı saldırılarını#! #v planlamaya#! başlayacaklardır.\n\nAnarşistler zamanla bu stratejiden hüsrana uğrayacaklar. Her #N bombalı saldırı#! girişimi:\n  @arrow_up!Bir sonrakini planlamak için gereken #pink İnanç#! eşiğini (#v [Country.MakeScope.ScriptValue('bpm_je_propaganda_of_the_deed_decay_threshold_value')]#!) yükseltir ve\n  @arrow_down![concept_ruler] (Hükümdarı) #N bombalamak#! için gereken #pink İnanç#! eşiğini (#v [Country.MakeScope.ScriptValue('bpm_je_propaganda_of_the_deed_complete_threshold_value')]#!) düşürür.\n\nSon #N bombalı saldırı girişimi#! [Country.MakeScope.ScriptValue('bpm_je_propaganda_of_the_deed_months_below_value')] ay önceydi.\n\n#lore \"6 Temmuz 1892'de silahsız on bir işçinin son cinayeti, Amerika'yı öfkelendirdi... Ancak emekçilerin gazabını kahramanca bir eyleme dönüştüren tek bir adam vardı. Bu adam Alexander Berkman'dı. 22 Temmuz 1892'de H. C. Frick'in ofisine girdi ve canına kastetti. Frick'in vücuduna üç kurşun isabet etti ama hayatta kaldı... Bu, Amerika Birleşik Devletleri'ndeki ilk Anarşist ekonomik terör eylemiydi ve Alexander Berkman devrimci protestosunun bedelini ağır ödemek zorunda kaldı.\"\n\n—Emma Goldman, 1922#!"

 je_bpm_propaganda_of_the_deed_full:0 "#Pink İnancın Gücü#! şu anda #v [GetPlayer.MakeScope.ScriptValue('bpm_je_propaganda_of_the_deed_complete_threshold_value')]#!."
 je_bpm_propaganda_of_the_deed_empty:0 "#Pink İnancın Gücü#! şu anda #v 0#! (hareket fıs çıktı)."
 je_bpm_propaganda_of_the_deed_timeout:0 "#v 10 yıl#! boyunca #N bombalama#! yok (hareket fıs çıktı)."

 je_bpm_propaganda_of_the_deed_baseline_tooltip:0 "[Country.MakeScope.GetScriptValueDesc('bpm_je_propaganda_of_the_deed_baseline_target')]"
 je_bpm_propaganda_of_the_deed_bomb_tooltip:0 "[Country.MakeScope.GetScriptValueDesc('bpm_je_propaganda_of_the_deed_бомбометр_rate')]"

 bpm_je_potd_will_add_progress:0 "#bold Eylem Propagandası#! [Concept('concept_journal_entry', 'Günlük Kaydı')] #pink İnanç#! kazanacak."
 bpm_je_potd_will_remove_progress:0 "#bold Eylem Propagandası#! [Concept('concept_journal_entry', 'Günlük Kaydı')] #pink İnanç#! kaybedecek."
 bpm_je_propaganda_of_the_deed_complete:0 "Hareket fıs çıkarsa, [GetInterestGroupVariant('ig_anarchists',GetPlayer).GetName] başka stratejiler arayacaktır.\n\n#pink İnancın Gücü#! #v [GetPlayer.MakeScope.ScriptValue('bpm_je_propaganda_of_the_deed_complete_threshold_value')]#! değerine ulaşırsa, [Concept('concept_ruler', 'Hükümdarımızın')] hayatına kastedilecek bir girişimde bulunulacaktır. Suikast şu durumlarda başarısız olacaktır:\n- [GetInterestGroupVariant('ig_anarchists',GetPlayer).GetName] [concept_marginalized] (Marjinalize) ise ve,\n- Ülkemizde hiç [GetInterestGroupVariant('ig_anarchists',GetPlayer).GetName] [Concept('concept_agitator', 'Agitatörü')] yoksa.\nAksi takdirde, [Concept('concept_ruler', 'Hükümdar')] ölecek ve sert önlemler almak zorunda kalacağız."

 bpm_anarchist_potd.1.t:0 "Sıradaki Hedef"
 bpm_anarchist_potd.1.desc:0 "@ig_anarchists! #bold Anarşistler#! sıradaki eylemlerinin hazırlıklarını toparlıyorlar. Şu anda birkaç farklı plan arasında seçim yapıyorlar."
 bpm_anarchist_potd.1.f:0 "Havada boktan ve gergin bir bekleyiş vardı. Sağa soldan toplanma derme çatma malzemelerle yapılan bomba, o ölümcül patlama dürtüsünü zor zapt ediyordu. Birazdan ortalık cehenneme dönecek ve bu eylemin yankıları, o kahrolası bombanın sesinden bile daha uzağa gidecek."
 bpm_anarchist_potd.1.a:0 "Alt rütbeli memurlar"
 bpm_anarchist_potd.1.b:0 "[SCOPE.sCharacter('bpm_anarchist_potd_target_1').GetFullName]"
 bpm_anarchist_potd.1.c:0 "[SCOPE.sCharacter('bpm_anarchist_potd_target_2').GetFullName]"
 bpm_anarchist_potd.1.d:0 "[SCOPE.sCharacter('bpm_anarchist_potd_target_3').GetFullName]"

 bpm_anarchist_potd.2.t:0 "Hükümet Binası Bombalandı!"
 bpm_anarchist_potd.2.d:0 "@ig_anarchists! #bold Anarşistler#! üst düzey devlet memurlarımızdan birini harcamayı başardı — herifin ofisi patlamada harabeye döndü. Yakın gelecekte o tesisten yönetim kabiliyetimizi geri kazanmamız biraz zaman alacak."
 bpm_anarchist_potd.2.f:0 "Bir bürokratın gebermesi çözülemeyecek iş değil ama verdikleri mesaj çok daha ağır: Devletin en tepesindeki adamlar bile artık güvende değil amınakoyayım."
 bpm_anarchist_potd.2.a:0 "Sikeyim böyle işi!"

 bpm_anarchist_potd.3.t:0 "Önemli Bir Siyasi Figüre Suikast Düzenlendi!"
 bpm_anarchist_potd.3.d:0 "@ig_anarchists! #bold Anarşistler#!, [SCOPE.sCharacter('bpm_anarchist_potd_target').GetFullName] adlı kişiyi geberterek bu cüretkar hamleleriyle siyasi ortamın amına koydular."
 bpm_anarchist_potd.3.f:0 "Hızlı bir fırlatma, saniyesinde bir kaçış ve sonunda en güçlü adam bile yerle yeksan olur."
 bpm_anarchist_potd.3.a:0 "Bu kan yerde kalmayacak ulan!"
 bpm_anarchist_potd.3.b:0 "Sakin olmalıyız, yoksa bu itleri daha çok kışkırtırız!"

 bpm_anarchist_potd.4.t:0 "Suikast Çuvalladı!"
 bpm_anarchist_potd.4.d:0 "@ig_anarchists! #bold Anarşistler#! bir süredir [SCOPE.sCharacter('bpm_anarchist_potd_target_ruler').GetFullName] hazretlerinin canına kastediyorlardı. Son denemeleri direkten döndü... ve kopyalaması en zor olanıydı. Bir ton ibne fail çoktan enselendi ve her yerde devasa bir av başlattık. Bu kadar eylemden sonra bekledikleri sosyal değişiklikler gerçekleşmeyince, artık çok daha fazla insanın dahil olacağı farklı bir siyasi eylem biçimi arayışına girdiler."
 bpm_anarchist_potd.4.f:0 "Eğer patlamalar azaltılacak ve silahsızlandırılacaksa, herkesin propaganda ve örgütlenme özgürlüğüne izin vermekten başka çare yoktur; mülksüzleştirilenlerin, ezilenlerin ve hoşnutsuzların uygarca kampanya yürütme seçeneğine sahip olmaları için; parça parça da olsa kan dökmeden kendi kurtuluşlarını sağlayabilecekleri umudunun onlara verilmesi için. İtalya hükümeti bunların hiçbirine sahip olmayacak; baskısına devam edecek... ve ne ekerse onu biçmeye devam edecek.\n\n—Errico Malatesta, 1900"
 bpm_anarchist_potd.4.a:0 "Yeter ulan bu ılık götlü liberallik!"
 bpm_anarchist_potd.4.b:0 "Ucuz yırttık amına koyayım, bir daha böyle bir bok yaşanmasın."

 bpm_anarchist_potd.5.t:0 "Hükümdarımız Katledildi!"
 bpm_anarchist_potd.5.d:0 "@ig_anarchists! #bold Anarşistler#! bir süredir [SCOPE.sCharacter('bpm_anarchist_potd_target_ruler').GetFullName] hazretlerinin canına kastediyorlardı. Son denemeleri maalesef #N kanlı bir başarıya#! ulaştı ve [SCOPE.sCharacter('bpm_anarchist_potd_target_ruler').GetFullName] hazretlerinin ölüm haberi tüm ülkede şok etkisi yarattı. Başlattığımız intikam avı çok hızlı ve acımasız oldu."
 bpm_anarchist_potd.5.f:0 "Bir kral öldürüldü; ve bir kral sonuçta hala bir insan olduğundan, bu gerçeğe acımak gerekir. Bir kraliçe dul bırakıldı; ve bir kraliçe sonuçta hala bir kadın olduğundan, kaybında sempatimiz ondan yanadır. Ama her gün onca insan öldürülürken ve onca kadın savaşlar, iş kazaları, silah atışlarıyla ezilen isyanlar ve yoksulluğun, intikam ruhunun, fanatizmin ve alkolizmin doğurduğu binlerce suç yüzünden ağlamak zorunda bırakılırken, tek bir adamın ölümü ve tek bir kadının gözyaşları üzerindeki bu yaygara neden doğal kabul ediliyor?\n\n—Errico Malatesta, 1900"
 bpm_anarchist_potd.5.a:0 "[SCOPE.sCharacter('bpm_anarchist_potd_target_ruler').GetFullName] hazretlerinin intikamı fena alınacak ulan!"

 bpm_anarchist_potd.6.t:0 "Eylem Fıs Çıktı"
 bpm_anarchist_potd.6.d:0 "@ig_anarchists! #bold Anarşistler#!, hedefli suikast stratejilerinde sürekli olarak hayal kırıklığına uğradılar. İç tartışmalar ve değişen strateji sonucunda, şimdi odağı farklı siyasi eylem biçimlerine kaydırıyorlar."
 bpm_anarchist_potd.6.f:0 "Duygu ve prensip meselesi olarak şiddetten iğreniyor ve ondan kaçınmak için elimizden geleni her zaman yapıyoruz; bizi şiddete başvurmaya ancak kötülüğe uygun ve etkili yollarla direnme zorunluluğu itebilir. Halkın yeterli hazırlığı olmadan bu tür tekil şiddet eylemlerinin beyhude kaldığını ve hatta karşı konulamayacak tepkileri tetikleyerek, hizmet etmeleri amaçlanan davaya ölçülemez zararlar verdiğini biliyoruz. Özünde, tartışmasız amaca yönelik eylemin bir kralın fiziksel olarak öldürülmesinde değil, insanların kalplerinde ve zihinlerinde – mahkemelerden, parlamentolardan ve fabrikalardan – tüm kralların öldürülmesinde yattığını biliyoruz; yani insanların çoğu tarafından tapılan otorite ilkesine inancın kökünün kazınması.\n\n—Errico Malatesta, 1900"
 bpm_anarchist_potd.6.a:0 "Taktik değiştirme vakti geldi demek."

 bpm_anarchist_potd.7.t:0 "Patlayıcı Bir Felsefe"
 bpm_anarchist_potd.7.d:0 "[SCOPE.sCharacter('bpm_anarchist_potd_failed_target').GetFullName] şehirde gezerken pelerinli bir ibne arabasına bomba fırlattı. Panik içinde zar zor arabadan atladılar ki...\n\nHiçbir bok olmadı. Bomba fıs çıktı amınakoyayım. O sözde suikastçı ibne, polisler tarafından yaka paça sürüklenirken hâlâ 'Yaşasın Anarşi!' diye anırıyordu."
 bpm_anarchist_potd.7.f:0 "Savaş, Sınıf savaşı ve bunu kendi yasalarınızın karanlığında düzen dediğiniz o güçlü kurumların örtüsü altında ilk başlatan siz oldunuz. Kan dökülmesi gerekecek; kaçmayacağız; cinayet işlenmesi gerekecek: öldüreceğiz, çünkü bu gerekli; yıkım olması gerekecek; dünyayı sizin o zorba kurumlarınızdan temizlemek için yıkacağız.\n\n—Anarşist Broşürü, 1919"
 bpm_anarchist_potd.7.a:0 "Bu küstahlığın hesabı sorulacak ulan!"
 bpm_anarchist_potd.7.b:0 "Kimseye bir bok olmadı değil mi?"

# NATLIB SPLIT
 je_bpm_split_natlibs:0 "Ulusal Liberalizmin Yükselişi"
 je_bpm_split_natlibs_status:0 "Ulusal Liberallerin ortaya çıkışını izleyin."
 je_bpm_split_natlibs_reason:0 "Liberalizm artık sadece hayalperest kışkırtıcıların ideolojisi olmaktan çıkmış, toplumumuzun siyasi-ekonomik yapısına tamamen entegre olmuştur. Ülkemizdeki son krizler, ulusun çıkarlarına hizmet eden güçlü bir devlet, modern bir ekonomi ve kudretli bir orduyu savunan yepyeni bir muhafazakar liberal kohortunu sahneye taşıdı.\n\n#lore \"İşlenecek devasa sürülmemiş arazilerimiz var; açılacak yollar; kazılacak limanlar; ulaşıma açılacak nehirler; bitirilecek kanallar, tamamlanacak bir demiryolu ağı. Marsilya'nın önünde, Fransa'ya asimile edilecek geniş bir krallığımız var. ... İmparatorluk yeniden kurulursa, İmparatorluğu böyle görüyorum. Bunlar üzerinde düşündüğüm fetihlerdir ve etrafımdaki sizler, benim gibi ülkemizin iyiliğini isteyenler, sizler benim askerlerimsiniz.\"\n\n—III. Napolyon, 1852#!"

 je_bpm_split_natlibs_special_tooltip:0 "İlerleme aşağıdakiler tarafından belirlenir:\n#variable [Country.MakeScope.Var('bpm_je_split_natlibs_progress_from_base').GetValue|+=]#! temel değer\n#variable [Country.MakeScope.Var('bpm_je_split_natlibs_progress_from_conflicts').GetValue|+=]#! Savaşlarda, Diplomatik Oyunlarda, Devrimlerde veya Ulusal Birleşme lideri olmaktan\n#variable [Country.MakeScope.Var('bpm_je_split_natlibs_progress_from_liberals_empowered').GetValue|+=]#! #bold Liberal#! ve #bold Muhafazakar#! [Concept('concept_interest_group', 'Çıkar Gruplarının')] hükümette olmasından veya Desteklenmesinden\n#variable [Country.MakeScope.Var('bpm_je_split_natlibs_progress_from_libcons_suppressed').GetValue|+=]#! bastırılmış #bold Liberal#! ve #bold Muhafazakar#! [Concept('concept_interest_group', 'Çıkar Gruplarından')]\n#variable [Country.MakeScope.Var('bpm_je_split_natlibs_progress_from_libcons_marginal').GetValue|+=]#! marjinalize olmuş #bold Liberal#! ve #bold Muhafazakar#! [Concept('concept_interest_group', 'Çıkar Gruplarından')]\n#variable [Country.MakeScope.Var('bpm_je_split_natlibs_progress_from_radicals').GetValue|+=]#! radikal yoksul tabaka nüfusundan; bu sadece #bold Liberal#! ve #bold Muhafazakar#! [Concept('concept_interest_group', 'Çıkar Grupları')] marjinalize değilse ve bastırılmamışsa birikecektir."

 je_bpm_split_natlibs_progress_bar:0 "Ulusal Liberalizmin Yükselişi"
 je_bpm_split_natlibs_progress_bar_desc:0 "#v [JournalEntry.GetCurrentBarProgress(ScriptedProgressBar.Self)|%]#! ([JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1]/100) her hafta #v [SCOPE.GetRootScope.GetCountry.MakeScope.ScriptValue('bpm_je_split_natlibs_progress_rate')|+=]#! değişiyor."
