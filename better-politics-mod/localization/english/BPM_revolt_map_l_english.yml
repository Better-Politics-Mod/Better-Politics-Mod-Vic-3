l_english:
 je_bpm_revolt_ember: "Embers Beneath the Ashes"
 je_bpm_revolt_ember_concluded: "Embers Beneath the Ashes"
 je_bpm_revolt_ember_reason: "Beneath the calm of our streets, the fire has not gone out. In cellars and taverns, in factory yards and village squares, conspirators gather and whisper of a new order. Each #gold revolutionary cell#! is an ember."
 je_bpm_revolt_ember_status: "The embers are alive but the fire is not yet raging."
 je_bpm_revolt_ember_widget_header: ""
 je_bpm_revolt_ember_widget_none: "#i The embers have gone cold. There are no ongoing insurrections.#!"
 BPM_REVOLT_MAP_CELL_COUNT: "Revolutionary cells in this state: #v [THIS.GetState.MakeScope.ScriptValue('bpm_revolt_map_cells_in_state')|0]#!"
 je_bpm_revolt_ember_tt_lvl3: "#bold [THIS.GetState.GetName]#!\n$TOOLTIP_DELIMITER$\n#N Level 3: Blaze#!\nThe revolutionaries hold sway here. A cell at this level cannot grow further, and instead spreads to neighbouring states with more than #v 25%#! turmoil.\n\n$BPM_REVOLT_MAP_CELL_COUNT$"
 je_bpm_revolt_ember_tt_lvl2: "#bold [THIS.GetState.GetName]#!\n$TOOLTIP_DELIMITER$\n#v Level 2: Rising Flames#!\nThe conspiracy is organised and recruiting openly. If it keeps advancing, it will become a #N Blaze#! that spreads to neighbouring states.\n\n$BPM_REVOLT_MAP_CELL_COUNT$"
 je_bpm_revolt_ember_tt_lvl1: "#bold [THIS.GetState.GetName]#!\n$TOOLTIP_DELIMITER$\n#v Level 1: Smouldering Ember#!\nA handful of conspirators meet in secret. If the cell retreats, it will be stamped out.\n\n$BPM_REVOLT_MAP_CELL_COUNT$"
 je_bpm_revolt_ember_tt_none: "#bold [THIS.GetState.GetName]#!\n$TOOLTIP_DELIMITER$\nNo revolutionary cells in this state."
 BPM_GRASP_HEADER: "Grasp over the States"
 BPM_GRASP_HEADER_COUNT_TT: "#v [JournalEntry.GetCountry.MakeScope.ScriptValue('bpm_revolt_states_with_cells')|0]#! of our states harbour #gold revolutionary cells#!."
 BPM_GRASP_BOX_1: "Lost"
 BPM_GRASP_BOX_1_TT: "#tooltip_header Lost#!\n$TOOLTIP_DELIMITER$\nStates with a grasp of #v 0–20#!.\n\n#i The government's writ barely runs here. Officials are ignored, and the conspirators move openly.#!"
 BPM_GRASP_BOX_2: "Slipping"
 BPM_GRASP_BOX_2_TT: "#tooltip_header Slipping#!\n$TOOLTIP_DELIMITER$\nStates with a grasp of #v 21–40#!.\n\n#i Authority is eroding. Orders are obeyed grudgingly, if at all.#!"
 BPM_GRASP_BOX_3: "Contested"
 BPM_GRASP_BOX_3_TT: "#tooltip_header Contested#!\n$TOOLTIP_DELIMITER$\nStates with a grasp of #v 41–60#!.\n\n#i The government and its enemies vie for the loyalty of the populace.#!"
 BPM_GRASP_BOX_4: "Firm"
 BPM_GRASP_BOX_4_TT: "#tooltip_header Firm#!\n$TOOLTIP_DELIMITER$\nStates with a grasp of #v 61–80#!.\n\n#i The authorities are respected and the conspirators must keep their heads down.#!"
 BPM_GRASP_BOX_5: "Iron Grip"
 BPM_GRASP_BOX_5_TT: "#tooltip_header Iron Grip#!\n$TOOLTIP_DELIMITER$\nStates with a grasp of #v 81–100#!.\n\n#i The state is held tightly. Dissent is quickly found out and stamped out.#!"
 BPM_GRASP_BOX_EMPTY: "No states"
 BPM_GRASP_STATE_CELLS_TT: "#tooltip_header [State.GetName]#!\n$TOOLTIP_DELIMITER$\nGrasp: #v [State.MakeScope.ScriptValue('bpm_state_grasp')|0]#!\n#gold Revolutionary cells#!: #v [State.MakeScope.ScriptValue('bpm_revolt_map_cells_in_state')|0]#!\nHighest cell level: #v [State.MakeScope.ScriptValue('bpm_revolt_map_max_cell_level')|0]#!"
