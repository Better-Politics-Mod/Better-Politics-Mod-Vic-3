l_simp_chinese:
 bpm_fascism_events.1.t:0 "法西斯分子向首都进军"
 bpm_fascism_events.1.d:0 "法西斯分子因其在政府中的地位而愈发嚣张，他们要求[SCOPE.sCharacter('ruler_scope').GetPrimaryRoleTitle]授予他们当前政府中的领导角色，以此作为对抗左翼的堡垒。"
 bpm_fascism_events.1.f:0 "他们身着黑衣沿街前进，从临时搭建的讲台上，他们的领袖高呼：“我们的纲领很简单，我们要求掌权。”"
 bpm_fascism_events.1.a:0 "他们表明了立场"
 bpm_fascism_events.1.b:0 "这是暴行，立即逮捕组织者！"
