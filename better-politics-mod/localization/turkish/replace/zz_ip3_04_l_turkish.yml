# Technocracy

je_technocracy: "Yeni Makine"
je_technocracy_reason: "[ROOT.GetCountry.GetName] devletinde bir [GetLawType('law_technocracy').GetName] (Teknokrasi) kurulması; yetkin, düzenli ve varlıklı bir toplumun gerçekleşmesine doğru muazzam bir adımı temsil etmiştir. Ancak sadece [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] ve [SCOPE.GetRootScope.GetCountry.GetCustom('country_legislature_name')] varlığı, eski düzenin hatalarını ve verimsizliklerini silmek için yeterli değildir. Toplumsal dönüşümümüzü gerçekleştirmek için daha yapacak çok iş var ve kitleler projemize hâlâ şüpheyle yaklaşıyor.\n\nYeni rejimi sağlamlaştırmak için gündemimizi tamamlamalı ve $law_technocracy$ (Teknokrasinin) onların arzuladığı barış ve bolluk çağını gerçekleştireceğini göstermeliyiz."

je_technocracy_progress_bar: "Yeni Makine"
je_technocracy_progress_bar_desc: "İlerleme: #v [JournalEntry.GetCurrentBarProgress(ScriptedProgressBar.Self)|%]#! ([JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1]/[GetPlayer.MakeScope.ScriptValue('technocracy_upper_bound')])"
je_technocracy_complete_tt: "#variable $je_technocracy_progress_bar$#! ilerleme çubuğu #variable %100#!'e ulaştı!"

technocracy.4.t: "Bilim Altında Gelişim"
technocracy.4.d: "[ROOT.GetCountry.GetName], [GetIdeology('ideology_technocratic').GetName] yönetimi altında bir iç istikrar ve sürekli bir gelişim dönemi yaşadı. Toplumun önceden şüpheci olan kesimleri, [GetLawType('law_technocracy').GetName] sistemini ideal yönetim biçimi olarak geniş çapta kabul etmeye başladı."
technocracy.4.f: ""Teknokraside, bilimin kıtlık ekonomisinin yerine bolluk ekonomisini koyduğunu görüyoruz.\nTeknokraside işlevsel yetkinliğin grotesk ve israfkar beceriksizliğin yerini aldığını; gerçeklerin tahminlerin, düzenin düzensizliğin, endüstriyel planlamanın endüstriyel kaosun yerini aldığını görüyoruz.\nTeknokrasi, bilimin İnsanın zekasına yaraşır bir medeniyet inşa etme girişimidir."\n\n— Howard Scott, "Teknokrasi: Bilim Kaosa Karşı""
technocracy.4.a: "Yeni bir dünya hiç bu kadar yakın olmamıştı."
technocracy.4.b: "Yöntemlerimiz toplumun her yönüne uzanmalıdır."

