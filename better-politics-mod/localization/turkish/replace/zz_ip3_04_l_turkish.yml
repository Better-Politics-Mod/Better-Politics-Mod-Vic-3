je_red_summer: "Kızıl [SCOPE.GetRootScope.GetCountry.GetCustom('country_red_season_name')]"
je_red_summer_reason: "#b $je_springtime_of_the_peoples$#!'ın devrimci dalgası, [ROOT.GetCountry.GetName] ülkesinde yeni bir liberal hükümeti iktidara taşıdı. Ancak gücü elde etmek, onu korumakla aynı şey değildir. Liberal hükümet, hem yeni parlamenter düzeni ortadan kaldırmak isteyen #b muhafazakar güçler#!, hem de ikinci ve çok daha kapsamlı bir devrim tehdidinde bulunan #b radikaller#! tarafından tehdit edilmektedir.\n\n#b Karşı Devrim#!\nLiberal hükümet egemenliğini sağlamlaştırana kadar, eski düzenin intikamcı kalıntıları tarafından tehdit edilecektir. Eğer #b karşı devrim ilerlemesi#! #v 100#!'e ulaşırsa, devrimci hükümet #b iktidardan uzaklaştırılacak#! ve muhafazakar bir düzen yeniden kurulacaktır."
if_failed_through_counter_revolution_tt: "Eğer #b karşı devrim ilerlemesi#! #v 100#!'e ulaşırsa:"
if_failed_through_civil_war_tt: "Eğer bir [concept_civil_war] patlak verirse:"

