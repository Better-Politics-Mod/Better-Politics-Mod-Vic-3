 notification_bpm_1848_fail_name: "#v Frankfurt Parlamentosu Dağıldı!#!"
 notification_bpm_1848_fail_desc: "Anayasa ve liderlik meselelerinde birleşmeyi başaramayan Frankfurt'taki parlamento çöktü."
 notification_bpm_1848_fail_tooltip: "$notification_bpm_1848_fail_name$"

 notification_bpm_1848_win_name: "#v Einigkeit und Recht und Freiheit! (Birlik, Adalet ve Özgürlük)#!"
 notification_bpm_1848_win_desc: "Alman devletlerini yeni bir anayasa altında başarıyla birleştirdikten sonra, Almanya nihayet birleşik bir ulus oldu."
 notification_bpm_1848_win_tooltip: "$notification_bpm_1848_win_name$"

 notification_bpm_1848_milan_revolution_name: "#v Milano Günleri!#!"
 notification_bpm_1848_milan_revolution_desc: "Milano'daki devrimciler demir tavındayken vurdular ve Avusturya garnizonlarını şehirden sürdüler."
 notification_bpm_1848_milan_revolution_tooltip: "$notification_bpm_1848_milan_revolution_name$"

 notification_bpm_1848_san_marco_revolution_name: "#v Saint Mark (Aziz Mark) Geri Döndü!#!"
 notification_bpm_1848_san_marco_revolution_desc: "Venedikli devrimciler eski Asude (Serene) Cumhuriyet'in sloganıyla anılan yeni bir devlet ilan ettiler."
 notification_bpm_1848_san_marco_revolution_tooltip: "$notification_bpm_1848_san_marco_revolution_name$"

 notification_bpm_1848_roman_revolution_name: "#v Papa Roma'dan Kaçtı!#!"
 notification_bpm_1848_roman_revolution_desc: "Papa, Roma'da cumhuriyetçi bir ayaklanma beklentisiyle Gaeta'ya kaçtı."
 notification_bpm_1848_roman_revolution_tooltip: "$notification_bpm_1848_roman_revolution_name$"

 notification_bpm_1848_concede_constitution_name: "#v [SCOPE.sC('revolution_country').GetName] Ülkesinde Yeni Anayasa!#!"
 notification_bpm_1848_concede_constitution_desc: "[SCOPE.sC('revolution_country').GetName] hükümeti, devrimci baskı altında yeni bir anayasa yayımlamak üzere boyun eğdi."
 notification_bpm_1848_concede_constitution_tooltip: "$notification_bpm_1848_concede_constitution_name$"

 notification_bpm_significant_new_republic_name: "#v [SCOPE.sC('revolution_country').GetName] Ülkesinde Cumhuriyet İlan Edildi!#!"
 notification_bpm_significant_new_republic_desc: "[SCOPE.sC('revolution_country').GetName] ülkesinin eski rejimi devrildi ve yeni bir cumhuriyet ilan edildi."
 notification_bpm_significant_new_republic_tooltip: "$notification_bpm_significant_new_republic_name$"

 notification_bpm_significant_restore_monarchy_name: "#v Hükümdar [SCOPE.sC('revolution_country').GetName] Ülkesinde Taç Giydi!#!"
 notification_bpm_significant_restore_monarchy_desc: "Uzun süre iç krizlerden acı çeken [SCOPE.sC('revolution_country').GetName] ülkesinde monarşi geri döndü."
 notification_bpm_significant_restore_monarchy_tooltip: "$notification_bpm_significant_restore_monarchy_name$"

 notification_bpm_significant_new_council_republic_name: "#v [SCOPE.sC('revolution_country').GetName] Ülkesinde İşçi Konseyleri Yönetimi Ele Aldı!#!"
 notification_bpm_significant_new_council_republic_desc: "[SCOPE.sC('revolution_country').GetName] ülkesinin işçileri eski düzeni yıktı ve yeni bir proleter cumhuriyet ilan etti."
 notification_bpm_significant_new_council_republic_tooltip: "$notification_bpm_significant_new_council_republic_name$"

