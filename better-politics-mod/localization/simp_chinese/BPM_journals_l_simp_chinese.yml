 je_bpm_gag_rule:0 "封口规则"
 je_bpm_gag_rule_reason:0 "自1819年那场惨痛的恐慌以来，我们#GB 南方#!的正人君子们便不断遭受中央政府的欺凌。1820年的密苏里妥协案企图束缚我们所珍视的“特殊制度”，随后他们的关税又使我们缺乏进步所必需的机器，令我们饥馑。如今，那个加里森家伙又发起了一场旨在废除奴隶制的请愿运动，胆大包天！\n\n我们必须划清界限：那些爱管闲事的#GBB 北方人#!休想再进一步干涉我们崇高经济的根基。除非有某个政党准备治愈联邦法令废止危机留下的创伤，否则在这些神圣的殿堂之内，将不再有任何关于奴隶制的讨论！\n\n@information! 要为#brightyellow 辉格党#!赢得#GB 南方#!，我们必须在#GB 南方#!兴建#yellow 港口#!和#yellow 建筑部门#!，发起一场大规模的内部改良运动。\n\n@information! 要为#blue 民主党#!赢得#GB 南方#!，我们必须通过[GetLawType('law_free_trade').GetName]并扩建#yellow 棉花种植园#!，将棉花王推向世界市场。\n\n@warning! 这些要求荒唐至极；满足它们自担风险，因为安抚蓄奴者所带来的好处，或许并不值得惹上这些麻烦。\n\n若两大主要政党都无法在3年内弥合联邦法令废止危机造成的裂痕，#GB 南方#!将确立封口规则，在不久的将来终止一切关于奴隶制的讨论。\n\n#lore “我们种植某些主要农产品以供世界大众市场之需；而他们则几乎完全为国内市场而生产。他们在关税上的目标，就是压低外国竞争，以谋取国内市场的垄断。”\n\n——约翰·C·卡尔霍恩，1837#!"
 bpm_je_american_system:0 "在路易斯安那、密西西比、亚拉巴马、佐治亚和南卡罗来纳各拥有#yellow 5个建筑部门#!和#yellow 5个港口#!"
