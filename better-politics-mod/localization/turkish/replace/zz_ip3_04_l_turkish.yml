galicia_formation.1.t: "İlk Adım"
galicia_formation.1.d: "[SCOPE.sState('west_galicia_state').GetName] ve [SCOPE.sState('east_galicia_state').GetName] bölgelerini yeniden birleştirmemizle birlikte, salt bir özgür şehir statüsünden çok daha ileriye gitmiş bulunuyoruz. Ancak bir soru bizi sıkıştırıyor - [ROOT.GetCountry.GetNameNoFlag], bir [GetCulture('polish').GetName] birleşmesi için bir üs mü olacak, yoksa çok uluslu karakterini kucaklayacak mı?"
galicia_formation.1.f: "Kiril, [SCOPE.sState('west_galicia_state').GetCityHubName] içindeki havai fişeklere odaklanırsa Doğudaki sorunu neredeyse unutabileceğini düşündü. "Galiçya" adını hak iddia eden tek devlet, Polonyalı toprak sahipleri ve Alman bürokratlardan oluşan eski Habsburg Krallığı'ydı. Polonyalı milliyetçiler kesinlikle bu Almanların yerini alacaktı, ama halkına eşitlik getirme konusunda onlara güvenilebilir miydi? Kiril varışında şehri baştan başa dolaşmış ve ona güven verecek çok az şey görmüştü. İngiliz Milletler Topluluğunu geri getirme coşkusu içinde, onun kusurlarını unutmaya çok istekliydiler."
galicia_formation.1.a: "[ROOT.GetCountry.GetNameNoFlag] bir [GetCulture('polish').GetName] yurdudur ve daima öyle kalacaktır."
galicia_formation.1.b: "[GetCulture('polish').GetCustom('getPluralDemonym')] ve [GetCulture('ukrainian').GetCustom('getPluralDemonym')] bizim yönetimimiz altında birlik bulacaklardır."
galicia_formation.1.c: "Çok daha fazlası olabiliriz."

