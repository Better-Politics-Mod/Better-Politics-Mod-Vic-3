l_turkish:
 je_communism_1:1 "Fraksiyonlar mı Sınıf Partileri mi?"
 je_communism_1_reason:1 "[GetInterestGroupVariant('ig_trade_unions', GetPlayer).GetName] ve çeşitli daha radikal [Concept('concept_bpm_ig_is_party_socialist','Parti Sosyalistleri')] birçok ortak hedef ve taktiği paylaşıyor, ancak örgütsel uyumları tamamen bölünmüş olmasa da şu an için en iyi ihtimalle oldukça zayıf. [Concept('concept_bpm_ig_is_party_socialist','Parti Sosyalistleri')], sosyalizmin ancak kitle emek örgütlerini sosyal demokrat bir #N öncü (avangard)#! ile birleştiren birleşik bir parti tarafından ilerletilebileceğini öne süren bir #PB Parti Birleşmesi#! teorisi ortaya attılar.\n\nSendikaların ılımlı eğilimlerine dair hiçbir illüzyona kapılmayan [Concept('concept_bpm_ig_is_party_socialist','Parti Sosyalistleri')], tekrar tekrar bir #pink birleşme#! girişiminde bulunmaya hazırlar. Bu #pink birleşme#! girişiminin önümüzdeki ay #tooltippable;tooltip:[Country.GetTooltipTag],je_communism_1_special_tooltip [Country.MakeScope.Var('communism_progress_var_next').GetValue|-=]#! kadar ilerlemesi bekleniyor.\n\n#lore İdeal örgütlenme; tüm proleter partilerin, siyasi derneklerin, sendikaların ve kooperatiflerin, şu an İngiltere'de olduğu gibi programsız bir İşçi Partisi'nin değil, sınıf bilincine sahip, her şeyi kapsayan bir Sosyal Demokrasinin eşit üyeleri olarak birleşmesidir.\n\n—Karl Kautsky, 1909#!"
 communism_1_progress_bar: "#PB Birleşme#!"
 je_communism_1_special_tooltip: "Bu oran aşağıdakiler tarafından belirlenir:\n[Concept('concept_bpm_ig_is_party_socialist','Parti Sosyalisti')] lidere sahip [GetInterestGroupVariant('ig_trade_unions', GetPlayer).GetName] grubundan #variable [Country.MakeScope.Var('communism_progress_from_party_socialist_tu').GetValue|-=]#!\nAynı [concept_party] içindeki [GetInterestGroupVariant('ig_trade_unions', GetPlayer).GetName] ve [Concept('concept_bpm_ig_is_party_socialist','Parti Sosyalistlerinden')] #variable [Country.MakeScope.Var('communism_progress_from_tu_party').GetValue|-=]#!\n[GetInterestGroupVariant('ig_trade_unions', GetPlayer).GetName] ve [Concept('concept_bpm_ig_is_party_socialist','Parti Sosyalistlerinin')] bulunduğu [concept_political_movement] hareketinden #variable [Country.MakeScope.Var('communism_progress_from_movements').GetValue|-=]#!\n[GetInterestGroupVariant('ig_trade_unions', GetPlayer).GetName] ve [Concept('concept_bpm_ig_is_party_socialist','Parti Sosyalistlerinin')] bulunduğu [concept_revolution] eyleminden #variable [Country.MakeScope.Var('communism_progress_from_revolutions').GetValue|-=]#!\n[Concept('concept_incorporated_state','Entegre Edilmiş Eyaletlerdeki')] [concept_radical] nüfustan #variable [Country.MakeScope.Var('communism_progress_from_radicals').GetValue|-=]#!\n[Concept('concept_incorporated_state','Entegre Edilmiş Eyaletlerdeki')] [concept_loyalist] nüfustan #variable [Country.MakeScope.Var('communism_progress_from_loyalists').GetValue|-=]#!\n#bold Kolluk Kuvvetleri#! ve #bold İçişleri#! [Concept('concept_institution', '$concept_institutions$')] kurumlarından #variable [Country.MakeScope.Var('communism_progress_from_laws').GetValue|-=]#!\n[concept_bpm_ig_is_party_socialist] olan [Concept('concept_interest_group','$concept_interest_groups$')] gruplarının popülaritesinden #variable [Country.MakeScope.Var('communism_progress_from_igs').GetValue|-=]#!\n[concept_bpm_ig_is_party_socialist] olan [Concept('concept_agitator', '$concept_agitators$')] (kışkırtıcıların) popülaritesinden #variable [Country.MakeScope.Var('communism_progress_from_characters').GetValue|-=]#!\nOlaylar ve diğer etkilerden #variable [Country.MakeScope.Var('communism_progress_var_add').GetValue|-=]#!"
 je_communism_2:0 "Halk Devrimi"
 je_communism_2_reason:0 "Halk hâlâ kralların, rahiplerin ve kapitalistlerin zalim topuğu altında eziliyor. Gerici hükümeti devirmeli ve bir işçi cenneti kurmalıyız."

 communism.1.t:1 "Tüm Proletaryanın Partisi mi?"
 communism.1.desc:1 "Artık sadece bir avuç fraksiyondan ibaret olmayan işçi hareketi, şimdi #N Sosyalist Parti#! bayrağı altında toplanıyor — gerçi bu başarı şimdiden ciddi iç tehditler altında. Çoğu yerde eski anlaşmazlıkların sadece üstü örtüldü. Eğer belirli tavizler verirsek, onları bir kez daha parçalamayı başarabiliriz."
 communism.1.f:1 "Alman sosyal demokrasisi Lassalle olsa da olmasa da doğardı, tıpkı uluslararası proletaryanın sınıf mücadelesinin Marx ve Engels olsa da olmasa da yakın tarihin baskın faktörü olacağı gibi. Ancak Alman proleter sınıf partisinin 50 yıl önce, diğer tüm ülkelerden yirmi yıldan daha uzun bir süre önce böyle bir ihtişam ve parıltıyla kapıda belirmesi ve onlara rol model olması, Lassalle'in hayat boyu süren çalışmalarının ve şu düsturunun eseridir: 'Cesaret ettim!'\n\n—Rosa Luxemburg, 1913"
 communism.1.a:1 "Emekleri için daha yüksek ücret teklif edin."
 communism.1.b:1 "Son köle sahiplerinin acılarına son verin."
 communism.1.c:1 "İşçiler için daha iyi koşullar garanti edin."
 communism.1.d:1 "Sendikalar üzerindeki kısıtlamaları kaldırın."
 communism.1.e:1 "Teslim olmayacağız!"

 communism.10.t: "Kitle Partisi"
 communism.10.d: "[GetInterestGroupVariant('ig_trade_unions', GetPlayer).GetName] ve çeşitli daha radikal [Concept('concept_bpm_ig_is_party_socialist','Parti Sosyalistleri')] birçok ortak hedef ve taktiği paylaşıyor, ancak örgütsel uyumları şu an için en iyi ihtimalle oldukça zayıf. [Concept('concept_bpm_ig_is_party_socialist','Parti Sosyalistleri')], kitle emek örgütlerini sosyal demokrat bir #N öncü (avangard)#! ile birleştirmeyi amaçlayan bir #PB Parti Birleşmesi#! teorisi ortaya attılar."
 communism.10.f: "Lassalle tarafından hayata geçirilen Alman sosyal demokrasisi, kitlelerin, yani halkın çoğunluğunun sınıf mücadelesi için kalıcı bir örgütünü kurmaya yönelik ilk tarihi girişimdi. Lassalle'in siyasi eylemi ve Marx'ın teorisi sayesinde, Alman sosyal demokrasisi bu yeni görevi parlak bir şekilde çözmüştür.\n\n—Rosa Luxemburg, 1913"
 communism.10.a: "Bir fırtına yaklaşıyor."
 communism.10.b: "Dünya bir gün özgür olacak."