l_turkish:
  bpm_colony_events.2.t: "[ROOT.GetCountry.GetAdjective] Özerkliği"
  bpm_colony_events.2.d: "[ROOT.GetCountry.GetName] adlı [ROOT.GetCountry.GetOverlord.GetAdjective] sömürgesine süzereni tarafından sınırlı özerklik tanındı. Sömürge artık kendi içişlerini yönetebilecek."
  bpm_colony_events.2.f: "Hükümeti, Metropol'de mükemmel şekilde etkili olduğu kanıtlanmış ilkeler doğrultusunda yönetmekten başka bir yolla uyumu sağlamanın nasıl mümkün olduğunu bilmiyorum. Kraliyetin tek bir imtiyazına bile zarar vermem; aksine, bu vilayetlerin halkının çıkarlarının, bugüne kadar kullanılmamış imtiyazların korunmasını gerektirdiğine inanıyorum..."
  bpm_colony_events.2.a: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] yönetmeye devam etmelidir."
  bpm_colony_events.2.b: "Sorumlu bir Hükümet kurmalıyız."

  bpm_colony_events.3.t: "[ROOT.GetCountry.GetAdjective] Sömürge Bağımsızlığı"
  bpm_colony_events.3.d: "Eski [ROOT.GetCountry.GetName] sömürgesi süzereninden bağımsızlığını ilan etti. Sömürge artık kendi içişlerini yönetebilecek."
  bpm_colony_events.3.f: "Tıpkı diğer halklar gibi, [ROOT.GetCountry.GetAdjectiveNoFormatting] halkının da özgür olma, emeklerinin meyvelerinin tadını çıkarma ve yaşamın temel ihtiyaçlarına sahip olma, böylece tam büyüme fırsatlarına erişme hakkının devredilemez olduğuna inanıyoruz. Ayrıca, herhangi bir hükümet bir halkı bu haklardan mahrum bırakır ve onlara zulmederse, halkın o hükümeti değiştirme veya ortadan kaldırma hakkı olduğuna da inanıyoruz..."

  bpm_colony_events.3.a: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] yönetmeye devam etmelidir."
  bpm_colony_events.3.b: "İktidar halka!"