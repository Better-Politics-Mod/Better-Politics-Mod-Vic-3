 ig_bianchi:0 "白派"
 ig_bianchi_desc:0 "白派——意大利语作 #italic bianchi#!，或贬称为“白色布尔什维克”——是遵循天主教社会训导的佃农工会会员。他们总体激进而和平，谋求扩大农民所有权、向大地主开战并发展社会关怀。最受欢迎、也常被视为事实领袖的白派人物是圭多·米廖利。"
 ig_konservativni_lidovci:0 "保守利德维派"
 ig_konservativni_lidovci_desc:0 "$ig_christian_democrats_rightwing$"
 ig_old_right:0 "旧右翼"
