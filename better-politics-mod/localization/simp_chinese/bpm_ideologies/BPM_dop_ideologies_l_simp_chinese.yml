l_simp_chinese:
 ideology_dop_party_socialist:0 "政党社会主义者"
 ideology_dop_party_socialist_desc:0 "#lore 这一派别将社会主义政党视为无产阶级的首要政治组织。在革命形势下，他们可能会决定将权力集中于党内。 #!"
 ideology_dop_anarchist:0 "无政府主义者"
 ideology_dop_anarchist_desc:0 "#lore 这一派别认为国家本质上具有压迫性，并试图立即废除国家。 #!"
 ideology_dop_party_state:0 "党国一体论者"
 ideology_dop_party_state_desc:0 "#lore 这一派别力求使其政党尽可能与国家不可分割。反对党要么被视为国家的咨询附属机构，要么被视作公然叛国的势力。 #!"
 ideology_dop_radical_democrat:0 "激进民主主义者"
 ideology_dop_radical_democrat_desc:0 "#lore 这一派别信奉民主至上，并将在政府一切领域大力推动选举权。 #!"
 ideology_dop_moderate_democrat:0 "温和民主主义者"
 ideology_dop_moderate_democrat_desc:0 "#lore 这一派别持折中立场，将民主奉为政治原则，但认为任何明智的政府都必须施加限制。 #!"
 ideology_dop_authoritarian_democrat:0 "威权民主主义者"
 ideology_dop_authoritarian_democrat_desc:0 "#lore 无论出于愤世嫉俗还是真心实意，这一派别认为政府需要某种程度的民众参与，但力图对谁能参与以及什么可以改变施加严格限制。 #!"
 ideology_dop_autocrat:0 "独裁者"
 ideology_dop_autocrat_desc:0 "#lore 朕即国家！这一派别拥护一位强有力的领袖作为政府的主要权力。在日常决策需要官僚之处，这一派别认为官僚应通过任命或继承获得权力。 #!"
 ideology_dop_oligarch:0 "寡头"
 ideology_dop_oligarch_desc:0 "#lore 这一派别认为，由富裕和/或高贵的贵族阶层组成的种姓应成为政府的主要决策者。通常，这种信念更多出于私利而非任何明确的意识形态，因为这一派别要么由寡头组成，要么由寡头的直接受益者组成。 #!"
 ideology_dop_technocrat:0 "技术官僚"
 ideology_dop_technocrat_desc:0 "#lore 基于社会可以被科学管理的信念，技术官僚摒弃民主，转而由官僚和受过教育的专业人士进行决策。 #!"
 ideology_dop_traditional_power:0 "传统权力"
 ideology_dop_traditional_power_desc:0 "#lore 这一派别对民主没有明确的立场，但通常会努力捍卫传统权力结构，抵制变革。 #!"
 ideology_dop_state_power:0 "国家权力"
 ideology_dop_state_power_desc:0 "#lore 官僚机构不断扩张，以满足不断扩张的官僚机构的需求。 #!"
 ideology_dop_dissent:0 "异议者"
 ideology_dop_dissent_desc:0 "#lore 这一派别受到国家压制，因此他们对言论自由的渴望压过了他们可能持有的任何既有意识形态倾向。 #!"
 ideology_dop_meritocratic_autocrat:0 "贤能独裁者"
 ideology_dop_meritocratic_autocrat_desc:0 "#lore 这一派别珍视本国通过贤能考试选拔官僚的传统制度。 #!"
 ideology_dop_unionist:0 "工会主义者"
 ideology_dop_unionist_desc:0 "#lore 这一派别将工会视为争取工人权利的基石。因此，他们希望让工会碾过任何试图妨碍其独立的人。 #!"
 ideology_dop_syndical_unionist:0 "制度工团主义者"
 ideology_dop_syndical_unionist_desc:0 "#lore 如今工团主义已成为国法，工会已从意识形态狂热中退却，现在主要寻求维持现状。 #!"
 ideology_dop_state_unionist:0 "国家工会主义者"
 ideology_dop_state_unionist_desc:0 "#lore 如今国家官僚体系已取代了工会的角色，这一派别当前的目标是确保其成员与国家意志的合作。 #!"
 ideology_dop_syndicalist:0 "工团主义者"
 ideology_dop_syndicalist_desc:0 "#lore 工团主义理论已被甚至不太讲意识形态的工会所接受，它们如今视工团主义为打破老板枷锁的唯一途径。 #!"
 ideology_dop_anarcho_syndicalist:0 "无政府工团主义者"
 ideology_dop_anarcho_syndicalist_desc:0 "#lore 将无政府主义与工团组织相结合，这一派别如今看到了通向广泛号召力的道路。 #!"
 ideology_dop_organic_power:0 "国家法团主义者"
 ideology_dop_organic_power_desc:0 "#lore 这一派别信奉一种基于自然、社会碎片的民主，但国家积极介入决定谁能参与其中。#!"
