 je_bpm_christian_democrats: "Karanlığın Ortasındaki Işık"
 je_bpm_christian_democrats_reason: "Uzun yıllardır rahipler ve genel olarak inananlar değişim çağrısında bulunuyorlar; Hristiyanlığın en büyük mezhebi olan Katolik Kilisesi'nin ve Papa'nın, kapitalizmle ilişkili sosyal çatışmalara ve onun varlığından doğan #yellow liberalizm#! ile #pink sosyalizm#! ideolojilerine yanıt vermesini istiyorlar. Birçoğu, #v İrlanda'daki Büyük Kıtlık#!'ın dehşetini, yavaş yavaş Tanrı'ya ve onun yeryüzündeki temsilcilerine olan inançlarını kaybeden fabrika #v işçilerinin#! acılarını ve sefaletini gördü; birçoğu açgözlü ve acımasız kâr uğruna #v Sanayi Devrimi#!'nin yeni gerçeklerini kabul etti. Dünyanın dört bir yanındaki pek çok kişi için, yeni yönetici sosyal kastlar tarafından etkili bir şekilde sürdürülen bir kaos ve karanlık çöktü.\n\nBu bir [Concept('concept_bpm_global_je', 'Küresel Günlük Kaydıdır')]. Mevcut koşullarda, günlüğün ilerlemesi her ay #tooltippable;tooltip:[Country.GetTooltipTag],je_christian_democrats_tooltip [GetGlobalVariable('je_christian_democracy_progress_rate').GetValue|+=]#! oranında değişecektir. Tamamlandığında, Papa resmi olarak 'Rerum novarum' genelgesinde işçi sınıflarının durumunu ele alacak ve bu durum @ig_christian_democrats! #blue Hristiyan Demokratların#! kurulmasıyla sonuçlanacaktır.\n\n#lore İnsanlık durumuna daha derinden dokunan, dikkate alınması gereken başka bir şey daha var. Devletin herkes için, yüksek ve düşük için tek bir evrensel standardı vardır. Şüphesiz işçiler, haklar açısından mülk sahiplerine eşittir. Alt sınıflar, hayatlarını aileler olarak tüm topluluğun hayatına karışarak yaşayan, topluluğun bedeninin gerçek parçalarıdır.\n\n— Papa XIII. Leo, 1891"
 
 je_christian_democrats_tooltip: "İlerleme aşağıdakiler tarafından belirlenir:\n#variable [GetGlobalVariable('je_christian_democracy_progress_from_base').GetValue|+=]#! temel değer\nHer [Concept('concept_great_power', 'Büyük Güçteki')] Güçlü [Concept('concept_bpm_ig_is_left_wing', 'Sol-kanat')] [Concept('concept_interest_group', 'Çıkar Gruplarından')] gelen #variable [GetGlobalVariable('je_christian_democracy_progress_from_powerful_igs').GetValue|+=]#!\nHer [Concept('concept_great_power', 'Büyük Güçteki')] Nüfuzlu [Concept('concept_bpm_ig_is_left_wing', 'Sol-kanat')] [Concept('concept_interest_group', 'Çıkar Gruplarından')] gelen #variable [GetGlobalVariable('je_christian_democracy_progress_from_influential_igs').GetValue|+=]#!\nHer [Concept('concept_great_power', 'Büyük Güçteki')] aktif [Concept('concept_bpm_socialist_agitator', 'Sosyalist Ajitatörlerden')] gelen #variable [GetGlobalVariable('je_christian_democracy_progress_from_agitators').GetValue|+=]#!\nHer [Concept('concept_great_power', 'Büyük Güçteki')] aktif [Concept('concept_political_movement', 'Sosyalist Hareketlerden')] gelen #variable [GetGlobalVariable('je_christian_democracy_progress_from_socialist_movements').GetValue|+=]#!\nHer [Concept('concept_great_power', 'Büyük Güçteki')] aktif [Concept('concept_political_movement', 'Radikal Hareketlerden')] gelen #variable [GetGlobalVariable('je_christian_democracy_progress_from_radical_movements').GetValue|+=]#!\nHer [Concept('concept_great_power', 'Büyük Güçteki')] aktif [Concept('concept_political_movement', 'Bırakınız Yapsınlar Hareketlerinden')] gelen #variable [GetGlobalVariable('je_christian_democracy_progress_from_laissez_faire_movements').GetValue|+=]#!\nHer [Concept('concept_great_power', 'Büyük Güçteki')] Güçlü [Concept('concept_bpm_ig_is_religious', 'Ahlakçı')] [Concept('concept_interest_group', 'Çıkar Gruplarından')] gelen #variable [GetGlobalVariable('je_christian_democracy_progress_from_moralist_powerful_igs').GetValue|+=]#!" # \n#variable [GetGlobalVariable('je_christian_democracy_progress_from_moralist_influential_igs').GetValue|+=]#! from Influential [Concept('concept_bpm_ig_is_religious', 'Moralist')] [Concept('concept_interest_group', 'Interest Groups')] in every [Concept('concept_great_power', 'Great Power')]

