 tooltip_bpm_ig_is_middle_institutional:0 "Bir [Concept('concept_bpm_ig_is_middle_institutional', '$concept_bpm_ig_is_middle_institutional$')] [Concept('concept_interest_group', 'Çıkar Grubu')]"
 concept_bpm_ig_is_middle_institutional:0 "Orta Kurumsal"
 concept_bpm_ig_is_middle_institutional_desc:0 "[GetInterestGroupVariant('ig_armed_forces', GetPlayer).GetName], [GetInterestGroupVariant('ig_devout', GetPlayer).GetName], [GetInterestGroupVariant('ig_intelligentsia', GetPlayer).GetName] veya [GetInterestGroupVariant('ig_petty_bourgeoisie', GetPlayer).GetName] [Concept('concept_interest_group', 'Çıkar Grubu')]. Orta sınıfların kurumlarıdır."

 tooltip_bpm_ig_is_lower_institutional:0 "Bir [Concept('concept_bpm_ig_is_lower_institutional', '$concept_bpm_ig_is_lower_institutional$')] [Concept('concept_interest_group', 'Çıkar Grubu')]"
 concept_bpm_ig_is_lower_institutional:0 "Alt Kurumsal"
 concept_bpm_ig_is_lower_institutional_desc:0 "[GetInterestGroupVariant('ig_rural_folk', GetPlayer).GetName] veya [GetInterestGroupVariant('ig_trade_unions', GetPlayer).GetName] [Concept('concept_interest_group', 'Çıkar Grubu')]. Alt sınıfların kurumlarıdır."

# Other IG types
 tooltip_bpm_ig_is_isolationist:0 "Bir [Concept('concept_bpm_ig_is_isolationist', '$concept_bpm_ig_is_isolationist$')] [Concept('concept_interest_group', 'Çıkar Grubu')]"
 concept_bpm_ig_is_isolationist:0 "İzolasyonist"
 concept_bpm_ig_is_isolationist_desc:0 "[GetIdeology('ideology_eco_autarky').GetName], [GetIdeology('ideology_eco_trad_isolationist').GetName], [GetIdeology('ideology_eco_socialist_autarky').GetName] veya [GetIdeology('ideology_eco_agrarian_autarky').GetName] [Concept('concept_ideology', 'İdeolojilerinden')] birine sahip bir [Concept('concept_interest_group', 'Çıkar Grubu')]. Ekonomilerini ve genel olarak ülkelerini geliştirmenin doğru yolunun izolasyonizme ve kendi kendine yetmeye odaklanmak olduğuna inanırlar."

 tooltip_bpm_ig_is_hawkish:0 "Bir [Concept('concept_bpm_ig_is_hawkish', '$concept_bpm_ig_is_hawkish$')] [Concept('concept_interest_group', 'Çıkar Grubu')]"
 concept_bpm_ig_is_hawkish:0 "Şahin"
 concept_bpm_ig_is_hawkish_desc:0 "[Concept('concept_bpm_ig_is_very_hawkish', '$concept_bpm_ig_is_very_hawkish$')] olan veya [GetIdeology('ideology_mil_patriotic').GetName], [GetIdeology('ideology_mil_mass_army').GetName] ya da [GetIdeology('ideology_mil_institutional_militarist').GetName] [Concept('concept_ideology', 'İdeolojisine')] sahip bir [Concept('concept_interest_group', 'Çıkar Grubu')]. Diplomatik sorunlara askeri çözümleri tercih ederek şovenist bir dış politikaya inanırlar."

 tooltip_bpm_ig_is_very_hawkish:0 "Bir [Concept('concept_bpm_ig_is_very_hawkish', '$concept_bpm_ig_is_very_hawkish$')] [Concept('concept_interest_group', 'Çıkar Grubu')]"
 concept_bpm_ig_is_very_hawkish:0 "Çok Şahin"
 concept_bpm_ig_is_very_hawkish_desc:0 "[GetIdeology('ideology_jingoist').GetName] veya [GetIdeology('ideology_mil_ultramilitarist').GetName] [Concept('concept_ideology', 'İdeolojisine')] sahip bir [Concept('concept_interest_group', 'Çıkar Grubu')]. Tüm diplomatik sorunların birincil olarak silah zoruyla çözülmesi gerektiğine inanırlar."

 tooltip_bpm_ig_is_doveish:0 "Bir [Concept('concept_bpm_ig_is_doveish', '$concept_bpm_ig_is_doveish$')] [Concept('concept_interest_group', 'Çıkar Grubu')]"
 concept_bpm_ig_is_doveish:0 "Barışçıl"
 concept_bpm_ig_is_doveish_desc:0 "[GetIdeology('ideology_mil_patriotic_liberal').GetName], [GetIdeology('ideology_mil_defensive_patriot').GetName], [GetIdeology('ideology_mil_popular_army').GetName] veya [GetIdeology('ideology_mil_antimilitarist').GetName] [Concept('concept_ideology', 'İdeolojisine')] sahip bir [Concept('concept_interest_group', 'Çıkar Grubu')]. Diplomatik sorunların öncelikli olarak diplomasi yoluyla çözülmesi gerektiğine inanırlar."

# IG Popularity
 tooltip_bpm_ig_is_unpopular:0 "Bir [Concept('concept_bpm_ig_is_unpopular', '$concept_bpm_ig_is_unpopular$')] [Concept('concept_interest_group', 'Çıkar Grubu')]"
 concept_bpm_ig_is_unpopular:0 "Popüler Değil"
 concept_bpm_ig_is_unpopular_desc:0 "Bir [Concept('concept_interest_group', 'Çıkar Grubu')], [Concept('concept_bpm_ig_is_popular', '$concept_bpm_ig_is_popular$')] veya [Concept('concept_bpm_ig_is_prominent', '$concept_bpm_ig_is_prominent$')] değilse #bold Popüler Değil#! kabul edilir."

 tooltip_bpm_ig_is_popular:0 "Bir [Concept('concept_bpm_ig_is_popular', '$concept_bpm_ig_is_popular$')] [Concept('concept_interest_group', 'Çıkar Grubu')]"
 concept_bpm_ig_is_popular:0 "Popüler"
 concept_bpm_ig_is_popular_desc:0 "Bir [Concept('concept_interest_group', 'Çıkar Grubu')], toplam nüfusun %1'inden fazlası onu destekliyorsa #bold Popüler#! kabul edilir."

 tooltip_bpm_ig_is_prominent:0 "Bir [Concept('concept_bpm_ig_is_prominent', '$concept_bpm_ig_is_prominent$')] [Concept('concept_interest_group', 'Çıkar Grubu')]"
 concept_bpm_ig_is_prominent:0 "Öne Çıkan"
 concept_bpm_ig_is_prominent_desc:0 "Bir [Concept('concept_interest_group', 'Çıkar Grubu')], toplam nüfusun %10'undan fazlası onu destekliyorsa #bold Öne Çıkan#! kabul edilir."

 tooltip_bpm_country_proletarian_are_popular:0 "[Concept('concept_bpm_ig_is_proletarian','Proleter Çıkar Gruplarında')] toplam nüfusun >%5'i (şu anda %[GetPlayer.MakeScope.ScriptValue('bpm_proletarian_popularity')])"
 concept_bpm_country_proletarian_are_popular:0 "Proleter Örgütleri Popüler"
 concept_bpm_country_proletarian_are_popular_desc:0 "Proleter Örgütleri, toplam nüfusun %5'inden fazlası [Concept('concept_bpm_ig_is_socialist','Sosyalist Çıkar Grupları')] içindeyse popüler kabul edilir."

 concept_extremist:0 "Düzen Karşıtı"
 concept_extremist_desc:0 "[concept_country|Ülkemizin] mevcut rejimine karşı çıkan bir [Concept('concept_interest_group', 'Çıkar Grubu')]."
 concept_super_extremist:0 "Aşırılıkçı"
 concept_super_extremist_desc:0 "[concept_country|Ülkemizde] saygın siyasetin sınırlarının çok dışında faaliyet gösteren bir [Concept('concept_interest_group', 'Çıkar Grubu')]."

 concept_bpm_law_support:0 "Yasa Desteği"
 concept_bpm_law_support_desc:0 "Yasamada geçirilen [Concept('concept_law', 'Yasalara')] verilen destek seviyesi. Bu, bir [Concept('concept_interest_group', 'Çıkar Grubunun')] bir yasayı destekleyip desteklemeyeceğini belirler."

 concept_bpm_cabinet:0 "Kabine"
 concept_bpm_cabinet_desc:0 "Kabine, yürütme organını temsil eden Hükümetin üst düzey üyelerinden oluşan bir organdır. Çeşitli devlet dairelerinin başkanlarından oluşur ve Hükümetin günlük işleyişinden sorumludur."

 concept_bpm_ministerial_appointment:0 "Bakanlık Ataması"
 concept_bpm_ministerial_appointment_desc:0 "[concept_bpm_cabinet] içinde [Concept('concept_bpm_minister', 'Bakan')] olarak bir pozisyona atanma."

 concept_bpm_minister:0 "Bakan"
 concept_bpm_minister_desc:0 "Bakanlar, bir [Concept('concept_institution', 'Kurumun')] işleyişini denetlemek üzere [concept_bpm_cabinet] organına atanan karakterlerdir. [Concept('concept_interest_group', 'Çıkar Gruplarına')] ve kurumun yatırım seviyesine bağlı olarak benzersiz avantajlar ve dezavantajlar sağlarlar."

 concept_bpm_mandate:0 "Siyasi Yetki"
 concept_bpm_mandate_desc:0 "[Concept('concept_in_government','Hükümetteki')] [concept_clout] (Nüfuz) gücünden türetilen ve #yellow Yürütme İlkeleri#! yasalarıyla ağırlıklandırılan Siyasi Yetki, [Concept('concept_interest_group', 'Çıkar Gruplarınız')] arasında dağıtılır ve [Concept('concept_bpm_ministerial_appointment','Bakan atamak')] için harcanabilir. Belirli [Concept('concept_interest_group', 'Çıkar Grupları')] belirli [Concept('concept_institution', 'Bakanlıklara')] daha uygundur ve onları atamak daha az Siyasi Yetki gerektirir."

 concept_bpm_minister_skill:0 "Bakan Beceri Seviyesi"
 concept_bpm_minister_skill_desc:0 "[concept_bpm_minister] Becerisi, atandığı [Concept('concept_institution', 'Bakanlığın')] maksimum yatırım seviyesini etkileyen [Concept('concept_character_trait','karakter özellikleri')] tarafından belirlenir:\n @arrow_up! #yellow Uzman#! [Concept('concept_bpm_minister','Bakanlar')], [Concept('concept_institution', 'bakanlıklarının')] maksimum yatırım seviyesini #P 1 artırır#!\n @arrow_down! #yellow Beceriksiz#! [Concept('concept_bpm_minister','Bakanlar')], [Concept('concept_institution', 'bakanlıklarının')] maksimum yatırım seviyesini #N 1 azaltır#!\n\n#v Bir bakan atamak, mevcut olan #yellow en yetenekli#! adayı seçecektir.#!\nAçık, demokratik ülkeler daha geniş beceri seviyelerine sahip adaylara sahipken, otoriter veya gelenekçi ülkeler işe yarar herhangi bir yetenek bulmakta zorlanabilir."

 concept_bpm_head_of_government:0 "Hükümet Başkanı"
 concept_bpm_head_of_government_desc:0 "Hükümet Başkanı, hükümetin yürütme organındaki en güçlü yetkilidir ve [Concept('concept_bpm_minister','Bakanlarınızın')] başıdır. Bazı ülkelerde bu kişi bir Kral veya Cumhurbaşkanı tarafından atanan bir Başbakan iken, diğer durumlarda Hükümet Başkanı ile Devlet Başkanı aynı kişidir."