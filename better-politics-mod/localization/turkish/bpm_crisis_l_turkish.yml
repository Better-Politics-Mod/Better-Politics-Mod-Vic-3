 je_bpm_constitutional_restrictions_reason:0 "Ulusumuzdaki çoğu Çıkar Grubu, [Country.GetRuler.GetPrimaryRoleTitle] makamının çok fazla güce sahip olduğu konusunda hemfikir. [Country.GetRuler.GetPrimaryRoleTitle] makamının gücünü sınırlayacak yasal önlemleri desteklemeye istekliler. Ancak [Country.GetRuler.GetPrimaryRoleTitle] gücünden kolayca vazgeçmeye niyetli değil.\n\nEğer [Country.GetRuler.GetPrimaryRoleTitle] makamını gücünün bir kısmından vazgeçmeye ikna edebilirsek, gündemlerimizi daha kolay hayata geçirebiliriz. Tehditkar bir devrim veya [Country.GetRuler.GetHerHim] karşı güçlü bir hareket olursa [Country.GetRuler.GetPrimaryRoleTitle] ikna edilebilir."
