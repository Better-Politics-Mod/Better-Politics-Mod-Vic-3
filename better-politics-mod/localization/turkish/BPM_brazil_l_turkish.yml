l_turkish:
  #Brezilya olayları
  1834_additional_act.1.t: "Naib'in Feragati"
  1834_additional_act.1.d: "Sağlığı bozulan, cesareti kırılan ve Adalet Bakanlığı'nın başındayken kendisini karakterize eden o aynı enerjiden yoksun olan [SCOPE.sCharacter('feijo_regent').GetLastName], uzlaşmaz tavrı nedeniyle giderek gözden düştü ve zamansız ölen büyük müttefiki Evaristo da Veiga'nın desteğini de kaybedince, istediği kabineyi kuramayarak sonunda istifa etti. Yerine düşünceli ve hoşgörülü muhafazakar [SCOPE.sCharacter('araujo_lima_regent').GetLastName]'ı Geçici Naip olarak atadı."
  #1834_additional_act.1.f: "\n\n#lore \"Ben bir liberaldim; o zamanlar özgürlük ülkede yeniydi, herkesin özlemlerindeydi ama yasalarda yoktu, güç her şeydi: Ben bir liberaldim. Ancak bugün, toplumun görünümü farklı: demokratik ilkeler her şeyi kazandı ve pek çok şeyden taviz verdi; o zamanlar güç nedeniyle risk altında olan toplum, şimdi düzensizlik ve anarşi nedeniyle risk altında. O zaman istediğim gibi, bugün de ona hizmet etmek, onu kurtarmak istiyorum; ve işte bu yüzden ben bir gericiyim. Ben bir dönek değilim, savunduğum davayı tehlikeleri ve zayıflıkları gününde terk etmiyorum; onu, zaferinin o kadar kesin olduğu ve başarısının bile onu tehlikeye attığı günde bırakıyorum. Kim bilir, tıpkı bugün ülkeyi despotizme ve askeri komisyonlara karşı savunduktan sonra düzensizliğe karşı savunduğum gibi, bir gün özgürlüğün desteklenmesi ve savunulması için tekrar sesimi yükseltmek zorunda kalıp kalmayacağımı kim bilebilir?... Toplumun tehlikeleri değişkendir; fırtınaların rüzgarı her zaman aynı esmez: kör ve değişmez olan bir politikacı ülkesine nasıl hizmet edebilir?\"\n\n—[SCOPE.sCharacter('bernardo_scope').GetLastName]#!"
  1834_additional_act.1.a: "Muhafazakar bir naiplik mi?"
  #1834_additional_act.1.b: "Liberaller iktidarda kalmalı..."

  1834_additional_act.2.t: "Naiplik Seçimi"
  1834_additional_act.2.d: "Merkezi hükümet ile özerk vilayetler arasında yaşanan uzun siyasi çalkantıların ardından, [SCOPE.gsInterestGroup('conservatives_scope').GetName], liberal reformları iptal etmek ve gücü merkezileştirmek için [SCOPE.sCharacter('araujo_lima_regent').GetLastName]'ı yeni naip olarak seçtirmek istiyor. Öte yandan, [SCOPE.sCharacter('albuquerque_scope').GetLastName], vilayetlere özgürlük garantisi vermenin durumla başa çıkmanın doğru yolu olduğunu savunuyor."
  1834_additional_act.2.a: "Muhafazakarlar sorunu çözebilir."
  1834_additional_act.2.b: "İlericiler özgürlük getirecektir."

  brazil_monarchy.1.t: "I. Luis'in Tahta Çıkışı"
  brazil_monarchy.1.d: "Isabel'in saltanatının sona ermesiyle, [SCOPE.sCharacter('emperor_scope').GetFullName], Brezilya İmparatoru I. Luis olarak [ROOT.GetCountry.GetAdjective] tahtına çıktı. Kendisi federalizmi, zorunlu askerlik hizmetini ve işçilerin yaşam kalitesinin iyileştirilmesini savunuyor."
  brazil_monarchy.1.a: "Çok yaşa İmparator!"

  pedro.8.b: "İmparatorluk karşılık veriyor!"

