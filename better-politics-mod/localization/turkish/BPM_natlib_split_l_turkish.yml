l_turkish:
 bpm_natlib_split.1.t:0 "Nationalstaat, Rechtstaat, Gedankenstaat"
 bpm_natlib_split.1.d:0 "Radikallerin milliyetçiliği hafızalardan silinirken, onun yerini almak üzere yeni bir tür milliyetçilik ortaya çıktı. Almanya'nın dört bir yanında kapitalistler ve işçiler aynı şekilde @ig_national_liberals! #yellow Ulusal Liberallerin#! sancağı altında toplanıyor. Sivil özgürlükler, güçlü bir devlet, güvenli bir geçim kaynağı ve hepsinden önemlisi Alman idealizminin büyük geleneği üzerine inşa edilmiş birleşik bir Almanya vaat ediyorlar."
 bpm_natlib_split.1.f:0 "Siyasi otoriteden kaynaklanan bir eylem evrensel bir eylemdir ve gerçek evrenselliği sayesinde, uygulanmasının kuralını da kendi içinde taşır. Gönderme yaptığı şey evrenseldir ve kendisiyle özdeştir. Siyasi otoritenin eylemi özgür ve evrensel bir belirlenimcilik verir ve onun icrası aynı zamanda onun uygulanmasıdır. Uygulandığı şeyde hiçbir ayrım yapılamayacağından, uygulaması eylemin kendisinde tanımlanmalıdır ve hiçbir inatçı veya uyumsuz materyal uygulanmasında direnç gösteremez.\n\n—G.W.F. Hegel, 1802"
 bpm_natlib_split.1.a:0 "Akıl daima ileriye doğru yürür!"

 bpm_natlib_split.2.t:0 "Ulusal Liberaller"
 bpm_natlib_split.2.d:0 "Radikallerin milliyetçiliği hafızalardan silinirken, onun yerini almak üzere yeni bir tür milliyetçilik ortaya çıktı. Ülkemizin dört bir yanında, kapitalistler ve işçiler artık aynı şekilde @ig_national_liberals! #yellow Ulusal Liberallerin#! sancağı altında toplanıyor. Halk tarafından desteklenen güçlü bir devlet, halk için sağlanan güvenli bir geçim kaynağı ve hepsinden önemlisi dünya sahnesinde gururla duracak birleşik bir ulus vaat ediyorlar."
 bpm_natlib_split.2.f:0 "Siyasi otoriteden kaynaklanan bir eylem evrensel bir eylemdir ve gerçek evrenselliği sayesinde, uygulanmasının kuralını da kendi içinde taşır. Gönderme yaptığı şey evrenseldir ve kendisiyle özdeştir. Siyasi otoritenin eylemi özgür ve evrensel bir belirlenimcilik verir ve onun icrası aynı zamanda onun uygulanmasıdır. Uygulandığı şeyde hiçbir ayrım yapılamayacağından, uygulaması eylemin kendisinde tanımlanmalıdır ve hiçbir inatçı veya uyumsuz materyal uygulanmasında direnç gösteremez.\n\n—G.W.F. Hegel, 1802"
 bpm_natlib_split.2.a:0 "Birleş ya da Öl!"

 bpm_natlib_split.3.t:0 "Ulusal Liberaller"
 bpm_natlib_split.3.d:0 "Radikallerin milliyetçiliği hafızalardan silinirken, onun yerini almak üzere yeni bir tür milliyetçilik ortaya çıktı. Ülkemizin dört bir yanında, kapitalistler ve işçiler artık aynı şekilde @ig_national_liberals! #yellow Ulusal Liberallerin#! sancağı altında toplanıyor. Halk tarafından desteklenen güçlü bir devlet, halk için sağlanan güvenli bir geçim kaynağı ve dünya sahnesinde gururla duracak modern bir ulus vaat ediyorlar."
 bpm_natlib_split.3.f:0 "Gerçek erkek olmayan bazı adamlar kendilerinde başka şeyleri severler, ancak gerçek erkek onurunun hayatından daha değerli olduğuna inanır; ve bir ulus sadece hepimizin bir araya gelmiş halidir ve ulusun onuru, ulusun rahatından, ulusun barışından ve ulusun hayatının kendisinden daha değerlidir.\n\n—Woodrow Wilson, 1916"
 bpm_natlib_split.3.a:0 "Hurra!"

 bpm_natlib_split.4.t:0 "Bonapartizmin Dönüşü"
 bpm_natlib_split.4.d:0 "Yaşlı Napolyon mezarında yatarken, varisleri tırnaklarıyla kazıyarak yaşayanların dünyasına geri dönüyor. Orada, yoksulluk ve umutsuzlukla boğuşan, bölünmüş bir ülkeyle çevrili, kadim ve yıkılmakta olan bir Paris keşfediyorlar. Hayal kırıklığına uğramış bir halde liderlerine bakıyorlar — arkasında iki darbe girişimi olan ve daha önce bir nesil Fransız'a çok ilham vermiş olan ihtişamla yaldızlanmış #blue Louis Napoleon Bonaparte#!.\n\nBugün kendilerini yüksek sosyetenin beyefendileri tarafından alay edilirken bulsalar da, yakında halk nihayetinde bir Bonaparte'ın güçlü elini tercih edip etmeyeceğine karar verecek."
 bpm_natlib_split.4.f:0 "Hegel bir yerlerde, tüm büyük dünya-tarihsel olayların ve kişilerin deyim yerindeyse iki kez ortaya çıktığını belirtir. Şunu eklemeyi unutmuştur: ilkinde trajedi, ikincisinde fars (komedi) olarak.\n\n—Karl Marx, 1852"
 bpm_natlib_split.4.a:0 "O ahmak hapisten ne zaman çıktı!?"

 bpm_natlib_split.5.t:0 "Pozitivistler"
 bpm_natlib_split.5.d:0 "Radikallerin milliyetçiliği hafızalardan silinirken, onun yerini almak üzere yeni bir tür milliyetçilik ortaya çıktı. Ülkemizin dört bir yanında, sanayiciler ve işçiler artık aynı şekilde halk tarafından desteklenen güçlü bir devlet, halk için sağlanan güvenli bir geçim kaynağı ve dünya sahnesinde duracak modernize edilmiş bir ulus vaat eden @ig_national_liberals!Pozitivizm sancağı altında toplanıyor."
 bpm_natlib_split.5.f:0 "Birliğin ilk koşulu öznel bir ilkedir; ve bu ilke Pozitif sistemde aklın kalbe tabi kılınmasıdır: Bu olmadan aradığımız birlik, ister bireysel ister kolektif olarak asla kalıcı bir temele oturtulamaz. Bizimki kadar karmaşık bir organizmanın heterojen ve genellikle uzlaşmaz eğilimleri arasında yakınlaşma yaratacak kadar güçlü bir etkiye sahip olmak esastır.\n\n—Auguste Comte, 1844"
 bpm_natlib_split.5.a:0 "Sevgi, Düzen ve İlerleme!"

 bpm_fascist_split.1.t:0 "Faşistler"
 bpm_fascist_split.1.d:0 "Yeni bir gericilik gücü ortaya çıkıyor: @ig_fascists!Faşistler. Aşırı milliyetçi bir hareket olarak, sınıf işbirliği ve ulusa sarsılmaz bir sadakat üzerine kurulmuş bir devleti savunuyorlar."
 bpm_fascist_split.1.f:0 "Kitlelerin mülkiyet ilişkilerini değiştirme hakkı vardır; Faşizm mülkiyeti korurken onlara bir ifade vermeye çalışır. Faşizmin mantıksal sonucu, estetiğin siyasi yaşama sokulmasıdır. Führer kültü ile Faşizmin diz çökmeye zorladığı kitlelerin ihlal edilmesi, ritüel değerlerin üretimine bastırılan bir aygıtın ihlal edilmesiyle karşılığını bulur.\n\n—Walter Benjamin, 1936"
 bpm_fascist_split.1.a:0 "Ulus ileriye yürüyor!"