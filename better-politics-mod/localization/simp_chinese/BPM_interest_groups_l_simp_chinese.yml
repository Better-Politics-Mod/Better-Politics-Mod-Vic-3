l_simp_chinese:
 ig_trade_unions:0 "工会主义者"
 ig_trade_unions_only_icon:0 "@trade_unions_bpm!"
 ig_trade_unions_desc:0 "工会主义者将活动重心放在工会而非政党或政府上，通过协调罢工与集体谈判来维持工人对雇主的权力。他们通常回避政治目标而专注于经济目标，只在特定情况下才会参与一般政治。有组织的例子包括美国的产联和英国的职工大会。"
 ig_conservative_unions:0 "保守派工会"
 ig_conservative_unions_desc:0 "$ig_trade_unions_desc$"
 ig_syndicalists:0 "工团主义者"
 ig_syndicalists_desc:0 "工团主义者认为工人应通过经济行动而非国家来夺取生产资料。他们把自己组织成产业工会，并相信这些工会最终将取代国家，成为社会的基本组织单位。例子包括法国的法国总工会和西班牙的全国劳工联合会。"
 ig_locofocos:0 "洛科福科派"
 ig_locofocos_desc:0 "洛科福科派是1830年代兴起于美国民主党内的一支激进的城市工人阶级派系。他们以反对垄断、银行、关税、税收以及大多数形式的国家对社会控制而闻名。"
 ig_labor_radicals:0 "劳工改革派"
 ig_labor_radicals_desc:0 "工会主义者将活动重心放在工会而非政党或政府上，通过协调罢工与集体谈判来维持工人对雇主的权力。他们通常回避政治目标而专注于经济目标，只在特定情况下才会参与一般政治。有组织的例子包括美国的产联和英国的职工大会。"
 ig_urban_workers:0 "城市工人"
 ig_urban_workers_desc:0 "工会主义者将活动重心放在工会而非政党或政府上，通过协调罢工与集体谈判来维持工人对雇主的权力。他们通常回避政治目标而专注于经济目标，只在特定情况下才会参与一般政治。有组织的例子包括美国的产联和英国的职工大会。"
 ig_knights_of_labor:0 "劳工骑士团"
 ig_knights_of_labor_desc:0 "劳工骑士团是一个劳工联合会，拥有美国工人阶级第一个群众组织的崇高头衔。虽然比一般的工会联合会更为温和，但骑士团在美国独树一帜，积极跨越种族、阶级和性别界限进行工会组织。自民粹运动兴起以来，骑士团的会员人数激增，但若该运动消亡，工会能否存续尚不确定。"
 ig_agrarian_populists:0 "农本民粹主义者"
 ig_agrarian_populists_only_icon:0 "@ig_agrarian_populists!"
 ig_agrarian_populists_desc:0 "农本民粹主义者并非源自单一传统，即使在同一国家内部也可能千差万别。总体而言，他们反对既有的地主，主张平等的土地利用；温和的民粹主义者寻求地方自治和税制改革，而更激进者则倡导社会革命。例子包括俄国民粹派和美国的民粹党。"
 ig_agrarian_socialists:0 "农本社会主义者"
 ig_agrarian_socialists_desc:0 "农本社会主义者坚信社会主义革命的必要性，同时主张农民即使不是这场革命的主力，也应是其中的重要组成部分，与那些更偏向城市取向的社会主义者在对各阶级革命潜力的解读上针锋相对。"
 ig_radical_abolitionists:0 "激进废奴主义者"
 ig_radical_abolitionists_desc:0 "$ig_agrarian_populists_desc$"
 ig_narodniks:0 "民粹派"
 ig_narodniks_desc:0 "民粹派一词描述了俄罗斯民粹主义思想的一个分支，它因俄罗斯农奴制的严酷现实而形成，在思想上受到俄罗斯村社实践的启发。民粹派认为俄罗斯最紧迫的问题是土地问题——解放农奴与土地改革，尽管他们受西化派思想的影响，也使他们对社会革命十分开放。"
 ig_donghak:0 "东学追随者"
 ig_donghak_desc:0 "东学是一场拒绝西方哲学与神学的学术与宗教运动。该运动由崔济愚创立，以回应西方列强将基督教引入朝鲜。东学追随者认为，对抗外国在朝鲜影响的最佳途径是引入民主、确立人权，并建立一个不受外国干涉的繁荣朝鲜。"
 ig_bauernbewegung:0 "农民运动"
 ig_bauernbewegung_desc:0 "农民运动涵盖了那些在工业革命浪潮中被甩在身后的德国农民。肆意的工业化、衰落的家庭手工业以及作物歉收，使一部分乡村民众陷入悲惨的境地。德国农民运动试图通过废除残存的封建义务来改善这些状况。"
 ig_socialists:0 "社会主义者"
 ig_socialists_only_icon:0 "@ig_socialists!"
 ig_socialists_desc:0 "社会主义，或称社会民主主义，指的是在第一国际中反对无政府主义者的广泛左翼传统。具体倾向可能千差万别，例如英国宪章派的大众运动、布朗基派的秘密社团、拉萨尔派的议会政治，以及马克思主义者的科学社会主义之间的差异。"
 ig_zapadniks_socialist:0 "西化派（社会主义者）"
 ig_zapadniks_socialist_desc:0 "西化派认为俄罗斯必须在哲学和文化上以西方式国家为榜样实现现代化（其名称即由此而来）。社会主义西化派遵循西化派思想中最激进的版本——认为欧洲尽管取得了进步，但在实现启蒙运动的承诺方面仍有很长的路要走，并致力于建立马克思和巴枯宁等思想家所构想的无阶级、平等的社会。"
 ig_modernizers_socialist:0 "现代化派（社会主义者）"
 ig_modernizers_socialist_desc:0 "$ig_socialists_desc$"
 ig_westernizers_socialist:0 "西化派（社会主义者）"
 ig_westernizers_socialist_desc:0 "$ig_socialists_desc$"
 ig_independent_socialists:0 "独立社会主义者"
 ig_independent_socialists_desc:0 "社会主义指的是在第一国际中反对无政府主义者的广泛左翼传统。具体倾向可能千差万别，例如英国宪章派的大众运动、布朗基派的秘密社团、拉萨尔派的议会政治，以及马克思主义者的科学社会主义之间的差异。"
 ig_debs_faction:0 "兄弟会派系"
 ig_debs_faction_desc:0 "兄弟会派系诞生于激进的矿工和铁路工会，是人民党内一支与之竞争的社会主义派系。与经过多年合作后加入民粹派的工团主义者不同，兄弟会派系源自劳工骑士团中最受剥削（因而也最激进）的工会。他们虽然像工团主义者一样倡导产业工会主义，但更注重选举手段和非工会组织。他们对形形色色的少数群体的强力支持，使许多妇女加入他们的行列，即便与工团主义者相比也是如此。"
 ig_anarchists:0 "无政府主义者"
 ig_anarchists_only_icon:0 "@ig_anarchists!"
 ig_anarchists_desc:0 "无政府主义者是信奉立即废除国家的社会主义者。他们的具体信仰各不相同，通常遵循蒲鲁东和巴枯宁的传统以反对其他类型的社会主义，试图组建非等级制的劳工联盟，以期让国家逐渐消亡，或一举将其推翻。"
 ig_anarcho_syndicalists:0 "无政府工团主义者"
 ig_anarcho_syndicalists_desc:0 "无政府工团主义者认为工人应通过经济行动夺取生产资料，并在此过程中废除国家。他们与其他工团主义者的区别在于对任何国家权力都持原则性的反对态度，但仍将工会视为建立新的、平等的、无国家社会的基本构件。"
 ig_narodniks_anarchist:0 "民粹派（无政府主义者）"
 ig_narodniks_anarchist_desc:0 "民粹派一词描述了俄罗斯民粹主义思想的一个分支，它因俄罗斯农奴制的严酷现实而形成，在思想上受到俄罗斯村社实践的启发。民粹派思想的无政府主义分支主张俄罗斯有必要过渡到无国家社会，以俄罗斯仍然存在的农业公社作为新社会的原型。"
 ig_revolutionist_socialists:0 "革命派社会主义者"
 ig_revolutionist_socialists_only_icon:0 "@ig_revolutionist_socialists!"
 ig_revolutionist_socialists_desc:0 "革命派社会主义者是后来共产主义者的先驱，他们认为无产阶级的国际专政是实现社会主义的唯一途径。对他们而言，争取改革的斗争是阶级斗争的一个组成部分，是建立夺取政权所必需的革命意识的手段。革命派通常还会围绕一个群众性政党凝聚起来，作为政治经验的储备库。例子包括早期的德国社会民主党、德国斯巴达克同盟和俄国布尔什维克。"
 ig_revolutionist_social_democrats:0 "左翼社会民主主义者"
 ig_revolutionist_social_democrats_desc:0 "革命派社会民主主义者是后来共产主义者的先驱，他们认为无产阶级的国际专政是实现社会主义的唯一途径。对他们而言，争取改革的斗争是阶级斗争的一个组成部分，是建立夺取政权所必需的革命意识的手段。革命派通常还会围绕一个群众性政党凝聚起来，作为政治经验的储备库。例子包括早期的德国社会民主党、德国斯巴达克同盟和俄国布尔什维克。"
 ig_communists:0 "共产主义者"
 ig_communists_desc:0 "共产主义者认为无产阶级的国际专政是实现社会主义的唯一途径。对他们而言，争取改革的斗争是阶级斗争的一个组成部分，是建立夺取政权所必需的革命意识的手段。革命派通常还会围绕一个群众性政党凝聚起来，作为政治经验的储备库。例子包括德国斯巴达克同盟和俄国布尔什维克。"
 ig_narodniks_urban:0 "民粹派（城市派）"
 ig_narodniks_urban_desc:0 "民粹派一词描述了俄罗斯民粹主义思想的一个分支，它因俄罗斯农奴制的严酷现实而形成，在思想上受到俄罗斯村社实践的启发。所谓的城市民粹派，是村社地位提升的产物，它将聚焦城市工人的全球社会主义思想与村社作为集体自治机构的独特现实相结合，倡导对这种以农业为主的意识形态做出明显更偏向城市的诠释。"
 ig_deleonist_faction:0 "工团派系"
 ig_deleonist_faction_desc:0 "工团派系最初是社会主义劳工党的一部分，是美国第一个社会主义政党。随着民粹运动遍及北方，党的领导层决定并入这个日益激进的政党。虽然其成员以德裔美国人为主，但演变成一个平台后，其群众基础显著扩大，如今已包括其他移民群体，甚至一些非裔美国人。他们主张以工团主义方式组织国家，并利用激进的产业工会行动来实现这一目标。"
 ig_reformist_socialists:0 "改良派社会主义者"
 ig_reformist_socialists_only_icon:0 "@ig_reformist_socialists!"
 ig_reformist_socialists_desc:0 "改良派社会主义者对改良主义和社会主义的投入程度各不相同。在激进的一端，如法国的可能派和德国的独立社会民主党，他们优先考虑当前的改革，同时将革命视为长期目标。处于中间的则是那些认为仅凭改革就能实现社会主义的人，如德国社会民主党内爱德华·伯恩施坦的派系。最后，在右翼是那些想在资本主义与社会主义之间寻求折中的人，他们最终演变成了我们今天所说的社会民主主义。"
 ig_possibilists:0 "可能派"
 ig_possibilists_desc:0 "$ig_reformist_socialists_desc$"
 ig_fabian_socialists:0 "费边社会主义者"
 ig_fabian_socialists_desc:0 "$ig_reformist_socialists_desc$"
 ig_reformist_social_democrats:0 "右翼社会民主主义者"
 ig_reformist_social_democrats_desc:0 "$ig_reformist_socialists_desc$"
 ig_social_democrats:0 "社会民主主义者"
 ig_social_democrats_desc:0 "社会民主主义者曾经是革命派，如今则大多致力于改良主义。在左翼是那些认为仅凭改革就能实现社会主义的人，如德国社会民主党内爱德华·伯恩施坦的派系。在右翼是那些想在资本主义与社会主义之间寻求折中的人，他们最终演变成了我们今天所说的社会民主主义。"
 ig_geoist_movement:0 "乔治主义者"
 ig_geoist_movement_desc:0 "乔治主义者是一场围绕亨利·乔治著作展开的经济与政治改革运动。他们的核心主张之一是土地增值税，即对土地价值征税而对土地改良不征税，以鼓励经济投资并抑制寻租行为。乔治主义者在东海岸城市影响重大，亨利·乔治正在那里角逐纽约市市长职位。"
 ig_radicals:0 "激进自由主义者"
 ig_radicals_only_icon:0 "@ig_radicals!"
 ig_radicals_desc:0 "激进自由主义者将温和派同侪的理念推向了逻辑的终点。他们鼓动全面民主和社会平等主义，在官方政治行不通时诉诸革命手段。因此，他们早期可能与社会主义者有所重合，尽管随着时间推移会变得更加温和。例子包括法国激进派、1848年革命者、美国激进共和党人以及孙中山的国民党。"
 ig_progressive_liberals:0 "进步自由主义者"
 ig_progressive_liberals_desc:0 "进步自由主义者是激进自由主义者的温和化后裔，他们仍保留着对扩大选举权和社会平等主义的偏好，但已不再从事革命活动。然而，如果其母国变得过于反动，进步派可能会重拾其激进本色！例子包括法兰西第三共和国的激进社会主义者和西奥多·罗斯福的公麋党。"
 ig_social_liberals:0 "社会自由主义者"
 ig_social_liberals_desc:0 "社会自由主义者是激进自由主义者的温和化后裔，他们仍保留着对扩大选举权和社会平等主义的偏好，但已不再从事革命活动。然而，如果其母国变得过于反动，进步派可能会重拾其激进本色！例子包括法兰西第三共和国的激进社会主义者和西奥多·罗斯福的公麋党。"
 ig_left_liberals:0 "左翼自由主义者"
 ig_left_liberals_desc:0 "$ig_social_liberals_desc$"
 ig_conscience_whigs:0 "良心辉格党"
 ig_conscience_whigs_desc:0 "$ig_radicals_desc$"
 ig_anti_masonic_whigs:0 "反共济会辉格党"
 ig_anti_masonic_whigs_desc:0 "$ig_radicals_desc$"
 ig_radical_republicans:0 "激进共和党人"
 ig_radical_republicans_desc:0 "$ig_radicals_desc$"
 ig_stalwarts:0 "坚定派"
 ig_stalwarts_desc:0 "坚定派是共和党内的一个派系，主张延续重建、维持分肥制度，并支持许多民粹主义主张，包括妇女选举权和禁酒令。他们的支持基础在纽约州，纽约港的港务监督被视为授予最忠诚代理人的奖赏。"
 ig_silverite_democrats:0 "银币派民主党人"
 ig_silverite_democrats_desc:0 "银币派是民主党内主张自由铸造银币的一个派系。他们希望这一政策能引发通货膨胀，从而减轻穷人的相对债务负担。他们的支持基础在西部最为强大，那里负债累累的农民和银矿矿工找到了共同的诉求。"
 ig_zapadniks:0 "西化派"
 ig_zapadniks_desc:0 "西化派认为俄罗斯必须在哲学和文化上以西方式国家为榜样实现现代化（其名称即由此而来）。他们几乎总是支持自由主义改革，宣扬共和理想、公民权利、私有财产以及其他自由主义思想的要素。"
 ig_modernizers:0 "现代化派"
 ig_modernizers_desc:0 "$ig_radicals_desc$"
 ig_westernizers:0 "西化派"
 ig_westernizers_desc:0 "$ig_radicals_desc$"
 ig_despotic_utopians:0 "专制乌托邦主义者"
 ig_despotic_utopians_desc:0 "专制乌托邦主义者信奉一种受启蒙运动原则影响的社会，但在这种社会中，专制政府为人民的最高利益行事。"
 ig_farroupilhas:0 "破衫党"
 ig_farroupilhas_desc:0 "破衫党，又称朱鲁朱巴派，由城市平民阶层中的小商贩和自由民组成。他们认为各州的自治权应大大加强；他们要求更广泛的政治改革，在更极端的情况下，还要求建立共和国。"
 ig_demokraten:0 "民主党人"
 ig_demokraten_desc:0 "民主党人是德国自由主义者中最激进的一翼，坚决反对梅特涅对德国政治领域挥之不去的影响，比如卡尔斯巴德法令。作为激进民主派，他们主张彻底废除君主制，建立一个统一的大德意志国家。进步的社会改革也是他们纲领的关键部分，将他们的抱负延伸到下层阶级。"
 ig_liberals:0 "自由主义者"
 ig_liberals_only_icon:0 "@ig_liberals!"
 ig_liberals_desc:0 "古典自由主义者希望改革国家以拥抱启蒙运动的理想。他们通常倡导自由放任的经济和公民权利，并主张建立一个与传统权力结构相分离的强大民族国家。例子包括英国辉格党、美国共和党和俄国立宪民主党。"
 ig_liberal_reformers:0 "自由改革派"
 ig_liberal_reformers_desc:0 "$ig_liberals_desc$"
 ig_orleanists_left:0 "王朝左翼"
 ig_orleanists_left_desc:0 "$ig_liberals_desc$"
 ig_moderate_republicans:0 "温和共和党人"
 ig_moderate_republicans_desc:0 "$ig_liberals_desc$"
 ig_moderate_liberals:0 "温和自由主义者"
 ig_moderate_liberals_desc:0 "$ig_liberals_desc$"
 ig_moralist_liberals:0 "道德派自由主义者"
 ig_moralist_liberals_desc:0 "$ig_liberals_desc$"
 ig_jacksonians:0 "杰克逊民主党人"
 ig_jacksonians_desc:0 "$ig_liberals_desc$"
 ig_jacksonian_liberals:0 "杰克逊民粹主义者"
 ig_jacksonian_liberals_desc:0 "$ig_liberals_desc$"
 ig_barnburners:0 "焚仓派"
 ig_barnburners_desc:0 "焚仓派是民主党内主张废奴主义、自由土地以及其他激进改革的一个派系。他们协助创建了自由土地党和共和党。"
 ig_half_breeds:0 "混血派"
 ig_half_breeds_desc:0 "混血派是共和党内主张温和的文官制度改革、同时强调政党团结的一个派系。他们的名称源于一种说法，即由于他们反分肥的政策，其成员只能算是半个共和党人。"
 ig_readjusters:0 "重新调整派"
 ig_readjusters_desc:0 "重新调整党是一个跨种族的民粹主义运动，强调内部投资、为所有男性争取选举权，以及反对邦联债务的金融立场。该党在失去共和党的支持后衰落，但随着坚定派掌权，资金和支持重新铸就了这个跨种族联盟。"
 ig_zapadniks_moderate:0 "西化派（温和派）"
 ig_zapadniks_moderate_desc:0 "西化派认为俄罗斯必须在哲学和文化上以西方式国家为榜样实现现代化（其名称即由此而来）。他们赞成自由主义和共和主义改革，尽管其中较温和者倾向于以非革命、改良主义的方式来实现这些目标。"
 ig_modernizers_moderate:0 "现代化派（温和派）"
 ig_modernizers_moderate_desc:0 "$ig_liberals_desc$"
 ig_westernizers_moderate:0 "西化派（温和派）"
 ig_westernizers_moderate_desc:0 "$ig_liberals_desc$"
 ig_chimangos:0 "奇曼戈派"
 ig_chimangos_desc:0 "奇曼戈派通常与城市人口、商人和小乡村土地所有者阶层联系在一起。他们倾向于支持促进经济发展、权力下放以及政治和社会结构现代化的措施。"
 ig_parlamentarisch_liberale:0 "议会自由派"
 ig_parlamentarisch_liberale_desc:0 "议会自由派是德国自由主义者的温和一翼。与他们的立宪派同行不同，议会自由派支持君主仅具礼仪性质，作为德意志诸侯联邦的首脑。大德意志和小德意志两种立场都进入了该派系，使议会自由派在这一问题上产生分歧。"
 ig_luzias:0 "卢齐亚派"
 ig_luzias_desc:0 "卢齐亚派通常与城市人口、商人和小乡村土地所有者阶层联系在一起。他们倾向于支持促进经济发展、权力下放以及政治和社会结构现代化的措施。"
 ig_market_liberals:0 "市场自由主义者"
 ig_market_liberals_only_icon:0 "@ig_market_liberals!"
 ig_market_liberals_desc:0 "市场自由主义者是保守的自由主义者，他们优先考虑自由放任的经济，而非社会其他领域的自由化。例子包括英国皮尔派和美国波旁民主党人。"
 ig_bourbon_liberals:0 "波旁自由主义者"
 ig_bourbon_liberals_desc:0 "$ig_market_liberals_desc$"
 ig_bourbon_democrats:0 "波旁民主党人"
 ig_bourbon_democrats_desc:0 "$ig_market_liberals_desc$"
 ig_young_americans:0 "青年美国党"
 ig_young_americans_desc:0 "$ig_market_liberals_desc$"
 ig_utilitarians:0 "功利主义者"
 ig_utilitarians_desc:0 "功利主义者认为政府职能应被规范化与合理化，以促进公共利益。"
 ig_national_liberals:0 "民族自由主义者"
 ig_national_liberals_only_icon:0 "@ig_national_liberals!"
 ig_national_liberals_desc:0 "民族自由主义者是保守的自由主义者，他们优先考虑国家统一，以及强大的国家和强大的军队。例子包括德国民族自由党、法国波拿巴派、美国主战民主党人和日本帝国主义者。"
 ig_bonapartists:0 "波拿巴主义者"
 ig_bonapartists_desc:0 "$ig_national_liberals_desc$"
 ig_positivists:0 "实证主义者"
 ig_positivists_desc:0 "$ig_national_liberals_desc$"
 ig_popular_sovereignty:0 "人民主权论"
 ig_popular_sovereignty_desc:0 "人民主权论是第二政党体系时期的一种政治立场，主张允许边疆领地自行决定奴隶制在其境内是否合法，而无需顾及谈判达成的妥协。它在民主党中最受欢迎，最终成为青年美国运动的一项核心信条。"
 ig_war_democrats:0 "主战民主党人"
 ig_war_democrats_desc:0 "$ig_national_liberals_desc$"
 ig_liberal_republicans:0 "自由共和党人"
 ig_liberal_republicans_desc:0 "自由共和党人是共和党内主张结束重建并进行激进文官制度改革的一个派系。他们的名称取自霍勒斯·格里利领导的自由共和党，他们把精英治国的理想置于务实的政党忠诚之上，因而失去了党内领导职位，同时也削弱了共和党内反腐败的事业。"
 ig_mugwumps:0 "骑墙派"
 ig_mugwumps_desc:0 "骑墙派是共和党内因腐败问题而倒向民主党的一个派系。他们的名称既指阿尔冈昆语中“战争领袖”一词，也暗示他们的嘴脸在政治光谱的一边，而屁股在另一边。"
 ig_reformist_democrats:0 "改良民主党人"
 ig_reformist_democrats_desc:0 "改良民主党人是民主党内介于波旁派和银币派之间的一个派系。他们虽然支持银币派的许多进步政策，但同时也带有有时冷酷无情的实用主义。这一派系的著名历史领袖包括伍德罗·威尔逊、阿尔·史密斯和富兰克林·D·罗斯福。"
 ig_conservatives:0 "保守主义者"
 ig_conservatives_only_icon:0 "@ig_conservatives!"
 ig_conservatives_desc:0 "保守主义者指的是希望维持现状、同时根据社会危机的情势推进或倒退改革的广泛人群。由于这并非统一的意识形态，保守派内部可能充满冲突，例如支持自由至上主义与社会家长主义、特殊主义与民族主义、世俗主义与宗教道德主义之间的对立。"
 ig_conservative_reformers:0 "保守改革派"
 ig_conservative_reformers_desc:0 "$ig_conservatives_desc$"
 ig_orleanists:0 "奥尔良派"
 ig_orleanists_desc:0 "$ig_conservatives_desc$"
 ig_orleanists_right:0 "教条派"
 ig_orleanists_right_desc:0 "$ig_conservatives_desc$"
 ig_cotton_whigs:0 "棉花辉格党"
 ig_cotton_whigs_desc:0 "$ig_conservatives_desc$"
 ig_paternal_conservatives:0 "家长式保守主义者"
 ig_paternal_conservatives_desc:0 "家长式保守主义者是保守主义者的一个子集，他们试图以政治权利、改革和社会福利方面的战术性扩张来维护根本现状，通常援引宗教、法团主义或#italic 贵族义务#!。例子包括迪斯雷利的托利党、西奥多的进步保守党、韦斯特的旧右翼和俾斯麦式保守派。"
 ig_progressive_conservatives:0 "进步保守主义者"
 ig_progressive_conservatives_desc:0 "$ig_paternal_conservatives_desc$"
 ig_slavophiles_moderate:0 "斯拉夫派（温和派）"
 ig_slavophiles_moderate_desc:0 "斯拉夫派认为俄罗斯不应被西方思想玷污——他们对自由主义改革和社会主义革命持怀疑态度，认为只需改变某些事物即可让俄罗斯保持强大、统一且不可分割。其中较温和者同意一些更为必要的改革——仅仅足以让国家保持稳定，但不会更多。"
 ig_catholic_democrats:0 "天主教民主党人"
 ig_catholic_democrats_desc:0 "$ig_paternal_conservatives_desc$"
 ig_saquaremas:0 "萨夸雷马派"
 ig_saquaremas_desc:0 "萨夸雷马派来自与帝国官僚机构相关的群体，以及以外国市场为生产目标的土地所有者。他们需要一个强大的中央政府，能够保障所有州生产流通的特殊条件，并维持行政管理的单一角色，这一特质使帝国官员享有特权地位。"
 ig_konstitutionell_liberale:0 "立宪自由派"
 ig_konstitutionell_liberale_desc:0 "立宪自由派是德国自由主义者的右翼。他们支持在一个立宪君主制下的较小德意志诸侯联邦。除立宪主义之外，他们的首要目标是保障全德国的政治自由。"
 ig_reactionaries:0 "反动派"
 ig_reactionaries_only_icon:0 "@ig_reactionaries!"
 ig_reactionaries_desc:0 "反动派是一个宽泛的帐篷，涵盖那些想要回到“往昔美好时光”的人，他们不同于小众的利益集团，将怀旧升华为一种普遍政治。他们想要的具体内容取决于每个国家“往昔美好时光”是什么样的（或看似是什么样的）。这一群体的子类包括君主专制主义者、宗教道德主义者，甚至是富裕农民。"
 ig_absolutists:0 "专制主义者"
 ig_absolutists_desc:0 "专制主义者认为君主应在一个中央集权的、现代化的国家中掌握绝对权力。他们既受到自由主义改革者的反对，也受到地方贵族的反对，后者视专制主义为对其世袭权力的侵犯。例子包括俄国沙皇派和某些明治复辟派。"
 ig_slavophiles:0 "斯拉夫派"
 ig_slavophiles_desc:0 "斯拉夫派认为俄罗斯不应被西方思想玷污——他们对自由主义改革和社会主义革命持怀疑态度，认为只需改变某些事物即可让俄罗斯保持强大、统一且不可分割。他们坚决拒绝大多数改革，仅凭天意认识到农奴制是俄罗斯必须根除的弊病，以免落后于世界其他地区，并认为只应从西方引进技术创新，即便是这些也应加以审视。"
 ig_legitimists:0 "正统派"
 ig_legitimists_desc:0 "$ig_reactionaries_desc$"
 ig_carlists:0 "卡洛斯派"
 ig_carlists_desc:0 "$ig_reactionaries_desc$"
 ig_miguelists:0 "米格尔派"
 ig_miguelists_desc:0 "$ig_reactionaries_desc$"
 ig_unionists:0 "联合派"
 ig_unionists_desc:0 "$ig_reactionaries_desc$"
 ig_restorationists:0 "复辟派"
 ig_restorationists_desc:0 "$ig_absolutists_desc$"
 ig_southern_democrats:0 "南方民主党人"
 ig_southern_democrats_desc:0 "南方民主党人是活跃于美国政坛的最狂热的拥护奴隶制、反联邦的派系。与大多数其他战前保守派不同——他们可能视奴隶制为一种必要的恶——南方民主党人将其视为一种积极的善，并愿意不惜一切代价加以保护。他们也是最有可能支持分裂的人，一旦爆发内战，他们将支持美利坚联盟国。"
 ig_southern_conservatives:0 "南方保守主义者"
 ig_southern_conservatives_desc:0 "南方保守主义者是活跃于美国政坛的最狂热的拥护奴隶制、反联邦的派系。与大多数其他战前保守派不同——他们可能视奴隶制为一种必要的恶——南方保守主义者将其视为一种积极的善，并愿意不惜一切代价加以保护。他们也是最有可能支持分裂的人，一旦爆发内战，他们将支持美利坚联盟国。"
 ig_calhounites:0 "卡尔霍恩派"
 ig_calhounites_desc:0 "$ig_southern_democrats_desc$"
 ig_monarchists:0 "君主主义者"
 ig_monarchists_desc:0 "$ig_reactionaries_desc$"
 ig_theocrats:0 "神权政治主义者"
 ig_theocrats_desc:0 "$ig_reactionaries_desc$"
 ig_national_conservatives:0 "民族保守主义者"
 ig_national_conservatives_desc:0 "民族保守主义者是保守主义者的一个子集，致力于维护强大的民族认同，并将道德主义的维护作为国家的指导原则。在一个现代化的世界里，他们以强硬的右翼社会政策以及不惜拆解自由主义制度（例如一个有机国家）来实现目标的意愿，与较自由的同侪形成对比。例子包括德国民族人民党、奥地利的“社会浪漫派”、1930年代的波兰青年恩德奇、巴西的祖国革新派以及挪威祖国联盟。"
 ig_caramurus:0 "卡拉穆鲁派"
 ig_caramurus_desc:0 "卡拉穆鲁派主要由商人、官僚和军人组成，他们捍卫皇帝佩德罗一世重返巴西。他们捍卫一个高度中央集权的君主政体，以保障皇帝的权力。"
 ig_patrianovists:0 "祖国革新派"
 ig_patrianovists_desc:0 "祖国革新派寻求在巴西建立一种基于传统主义政策的有机君主制。他们植根于天主教、圣托马斯·阿奎那的政治学说、民族主义，以及对自由主义和宪法的拒斥。"
 ig_malthusians:0 "马尔萨斯主义者"
 ig_malthusians_desc:0 "这一群体信奉托马斯·马尔萨斯确立的经济理论，认为任何减轻贫困的努力都会因随之而来的人口增长而自取失败。"
 ig_konservative:0 "保守派"
 ig_konservative_desc:0 "保守派是德国民族主义者中最保守的一翼，主要由南德人和天主教徒组成。对普鲁士以及随之而来的新教主导统一德国的恐惧，导致该派系支持一个大德意志联邦。保守派对宪政主义的拒斥，使他们成为唯一主张延续绝对君主制的派系。"
 ig_fascists:0 "法西斯主义者"
 ig_fascists_only_icon:0 "@ig_fascists!"
 ig_fascists_desc:0 "作为一种极右翼意识形态，法西斯主义很难用具体术语来界定。它通常以民族沙文主义、对国家的高度尊崇以及对任何左翼或被认定为外来因素的狂热敌视为特征，同时也同样充满了矛盾——法西斯主义者虽然常常信奉根深蒂固的传统价值观，却也颂扬现代工业和战争的效率。这种传统主义与现代性的奇特结合，正是使例如教权法西斯主义区别于传统道德主义、意大利未来主义区别于社会主义的部分原因。"
 ig_integralists:0 "整合主义者"
 ig_integralists_desc:0 "$ig_national_conservatives_catholic$"
 ig_rural_folk:0 "乡村"
 ig_rural_folk_only_icon:0 "@rural_folk_bpm!"
 ig_rural_folk_desc:0 "一个非意识形态的权力集团，代表乡村民众和地方权势人物的多元利益。虽然常常缺乏一致性，但这类乡村利益总体上倾向于地方自治和传统价值观。"
 ig_rus_obschina:0 "村社"
 ig_rus_obschina_desc:0 "村社是农民社区自治的传统形式，被俄国政府用来更好地管理土地。这些相对自治、多少有些非正式的治理单位负责征税、征兵和乡村治安，同时也在各自地方乡村社区的经济管理中发挥重要作用。村社是俄罗斯帝国中少数几个地方领袖（村长）选举成为常态的地方之一，这些社会制度顺理成章地催生了被称为民粹派的俄罗斯农本社会主义运动。"
 ig_rus_obschina_rural:0 "乡村村社"
 ig_rus_obschina_rural_desc:0 "乡村村社是一种乡村自治机构，其根源可追溯到原始的俄罗斯村社，它甚至挺过了最近的社会革命存活下来。经过改革以消除条块分割制的低效，并摆脱农奴制和贵族的枷锁后，重组后的乡村村社如今成为新社会主义政权下自治的自治单位，并自豪地成为其城市对应物的原型。"
 ig_greenbackers:0 "绿背党"
 ig_greenbackers_desc:0 "绿背党是一个松散的农业组织集合，倡导通货膨胀性经济政策以减轻农民的债务负担。除了这一核心议题外，绿背党是一个高度多元化的群体，包含显著的种族主义和性别歧视派系。"
 ig_national_grange:0 "农民联盟"
 ig_national_grange_desc:0 "农民联盟是农民权益团体，怀有成为生产者联盟的雄心。联盟支持一系列改革方案，从铁路和公用事业改革到降低关税，以及国家买办制的国库分库制度。其中一些，如有色人种农民联盟，在社会政治上十分激进，主张结束种族隔离并与共和党人而非民主党人结盟。"
 ig_industrialists:0 "商界"
 ig_industrialists_only_icon:0 "@industrialists_bpm!"
 ig_bourgeoisie:0 "资产阶级"
 ig_bourgeoisie_desc:0 "资产阶级是富裕城市商人的阶级。除了扩张财富和权力之外，他们几乎没有意识形态上的承诺……至少目前如此。"
 ig_industrialists_desc:0 "一个非意识形态的权力集团，代表大企业的利益。他们总体上致力于限制政府监管，在所有其他议题上，则站在任何时刻有利于垄断资本的一方。"
 ig_landowners:0 "贵族"
 ig_landowners_only_icon:0 "@landowners_bpm!"
 ig_landowners_desc:0 "一个非意识形态的权力集团，代表传统权贵家族的利益。他们总体上致力于维护自身权力，却又被古老宿怨的纷争所困扰。"
 ig_slaver_interests:0 "蓄奴者"
 ig_slaver_interests_desc:0 "一个非意识形态的权力集团，代表奴隶主的利益。他们总体上致力于捍卫对其“财产”的权利，除此之外在大多数议题上则四分五裂。"
 ig_shogunate:0 "大名"
 ig_shogunate_desc:0 "大名是拥有强大土地的领主和权贵，从10世纪起统治着京都以外的大部分日本以及将军的直接领地。大名分为强大的氏族，他们雇佣武士来捍卫自己的领地。"
 ig_kazoku:0 "华族"
 ig_kazoku_desc:0 "华族是明治维新后形成的世袭贵族。它通过将大名和公家合并为一个效仿英国贵族体系的头衔和贵族制度而形成。"
 ig_mesafint:0 "梅萨芬特"
 ig_mesafint_desc:0 "梅萨芬特是帝国的世袭贵族，往往主导着各州的领导层。他们的主要利益在于为保持自己的特权和自治而斗争，同时争夺对贡德尔宫廷的影响力。"
 ig_hacendados:0 "庄园主"
 ig_hacendados_desc:0 "代表拥有大片庄园和牧场、雇佣乡村劳工和奴隶的种植园主阶级。这些土地所有者在19世纪成为许多拉丁美洲国家强大的精英阶层。"
 ig_intelligentsia:0 "专业界"
 ig_intelligentsia_only_icon:0 "@intelligentsia_bpm!"
 ig_intelligentsia_desc:0 "一个非意识形态的权力集团，代表专业人士和商人的利益。他们通常组织成专业协会、行业工会、传统行会和非正式卡特尔，这些群体既惧怕大企业的侵蚀，也惧怕“肮脏的大众”。例子从荷兰和意大利的商人行会到美国劳工联合会不一而足。"
 ig_rus_meschane:0 "市民阶层"
 ig_rus_meschane_desc:0 "市民阶层指的是俄罗斯等级制度存在期间的城市下层阶级。与另一个重要的城市阶层平民知识分子相比，市民阶层倾向于偏爱温和与稳定，而非革命情绪。"
 ig_artisanal_guilds:0 "手工业行会"
 ig_artisanal_guilds_desc:0 "手工艺行会、作坊和工匠协会的集合，代表着致力于传统生产方式的熟练工匠。他们倡导保护地方手工艺、规范质量，并抵制威胁其生计和独立性的工业扩张。"
 ig_rus_raznochintsy:0 "平民知识分子"
 ig_rus_raznochintsy_desc:0 "平民知识分子是一个主要由城市居民组成的群体，他们因各种原因既非外国人，又置身于俄罗斯僵化的等级制度之外。这一群体的成员常以其革命情绪著称，对西方的自由主义思想抱有好感。因此，与市民阶层相比，他们在关乎俄罗斯未来的问题上倾向于更激进的思想。"
 ig_rus_obschina_urban:0 "城市村社"
 ig_rus_obschina_urban_desc:0 "城市村社是将新近获得赋权的村社外推到俄罗斯社会非农业部分的结果。城市村社利用集体决策和土地公有的做法，考虑到更高的人口密度和城市人口的特殊需求，同时运用一些乡村村社已臻完善的既有自治机制。"
 ig_negade:0 "内加德"
 ig_negade_desc:0 "内加德指的是埃塞俄比亚的城市商人，通常由特别富有的内加德拉领导。这一群体与许多商人一样，惧怕外国竞争，并希望维持其工匠和城市小圈子网络的影响力。"
 ig_petty_bourgeoisie:0 "官僚"
 ig_petty_bourgeoisie_only_icon:0 "@petty_bourgeoisie_bpm!"
 ig_petty_bourgeoisie_desc:0 "一个非意识形态的权力集团，代表根深蒂固的官僚。这些腐败官员精于操纵政治机器以保住权力，尽管有既定的政治程序。"
 ig_kuge:0 "公家"
 ig_kuge_desc:0 "公家是天皇内廷的贵族和官员，直接向天皇而非将军或大名负责。"
 ig_armed_forces:0 "军方"
 ig_armed_forces_only_icon:0 "@armed_forces_bpm!"
 ig_armed_forces_desc:0 "一个非意识形态的权力集团，代表权势显赫的军事领袖。他们总体上致力于将军权扩张到市民社会之上，并通过军职谋取个人威望和财富。"
 ig_devout:0 "教会"
 ig_buddhist_monks:0 "佛教僧侣"
 ig_sikh_priesthood:0 "锡克教祭司"
 ig_sikh_priesthood_desc:0 "$ig_devout_desc$"
 ig_devout_only_icon:0 "@devout_bpm!"
 ig_devout_desc:0 "一个非意识形态的权力集团，代表作为一种根深蒂固制度的组织化宗教。其成员不同于宗教道德主义者，他们寻求在宗教结构内维护自身特权，而非将宗教注入更广泛的政治。在没有强大组织化宗教的国家，这些则是拥有财富或世俗影响力的地方神职人员。例子包括国教会、逊尼派穆夫提和中国的礼仪大师。"
