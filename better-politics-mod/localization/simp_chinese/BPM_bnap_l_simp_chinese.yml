 bpm_bnap_american_militias:0 "美国民兵"
 bpm_bnap_patriots_events.1.t:0 "爱国者起义"
 bpm_bnap_patriots_events.1.d:0 "爱国者们起而反抗王室。"
 bpm_bnap_patriots_events.1.f:0 "我们，以下加拿大人民的名义，承认神圣天意的裁决，它允许我们推翻一个滥用其创建之目的与意图的政府，并选择那种能够重建正义之治——确保国内安宁——提供共同防御——促进普遍福祉，并保障我们及我们子孙享有公民自由与宗教自由之益处的政府形式……"
 bpm_bnap_patriots_events.1.a:0 "我们将镇压这场叛乱！"
 bpm_bnap_patriots_events.1.b:0 "我们需要英国的援助。"
 je_bpm_bnap_the_patriots:0 "爱国者"
 je_bpm_bnap_the_patriots_desc:0 "我们必须监视英属殖民地的法裔加拿大人。"
 je_bpm_bnap_the_patriots_reason:0 "[SCOPE.sCulture('que_culture').GetName] 人是英国殖民地人口的重要组成部分，他们是新法兰西居民的后裔。作为讲法语的的天主教徒，他们鄙视英国当局，并且过去曾多次起而反抗英国的统治。下加拿大的法语多数越来越被「爱国者运动」所吸引，这是一场试图驱逐英国对殖民地控制的激进共和运动。我们必须紧盯他们，以防他们起而将殖民地撕裂。"
 bpm_bnap_bop_progress_bar:0 "势力均衡"
 bpm_bnap_bop_progress_bar_left:0 "法语裔势力"
 bpm_bnap_bop_progress_bar_right:0 "英语裔势力"
 bpm_bnap_ps_bar:0 "对爱国者的支持"
 bpm_bnap_ps_bar_desc:0 "爱国者支持度：([JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1]/100)"
 bpm_bnap_patriots_balance_of_power_from_gdp:0 "安大略 [concept_gdp] #variable [ROOT.GetCountry.MakeScope.ScriptValue('bpm_ontario_gdp')|D ]#!，对比魁北克 [concept_gdp] #variable [ROOT.GetCountry.MakeScope.ScriptValue('bpm_quebec_gdp')|D]#!"
 je_bpm_bnap_province_complete:0 "持续压制爱国者，并通过一项联合法案。"
 bpm_bnap_patriots_events.2.t:0 "十项决议"
 bpm_bnap_patriots_events.2.d:0 "英国大臣罗素拒绝了九十二项决议，转而提出了十项决议。"
 bpm_bnap_patriots_events.2.f:0 "在下加拿大目前的状态下，将该省的立法议会议员改为选举产生并不明智；但宜采取措施，确保立法机构的这一分支获得更大程度的公众信任……"
 bpm_bnap_patriots_events.2.a:0 "我们无法接受这一点！"
 bpm_bnap_patriots_events.2.b:0 "爱国者们是不讲理的。"
 bpm_increase_patriot_support_by_a_little:0 "#red 增加#! 爱国者支持度 5 点"
 bpm_increase_patriot_support_by_a_lot:0 "#red 增加#! 爱国者支持度 15 点"
 bpm_increase_british_engagement_a_little:0 "@information! 少量增加英国参与度"
 bpm_increase_british_engagement_a_lot:0 "@information! 大量增加英国参与度"
 bpm_decrease_british_engagement_a_lot:0 "@information! 大量降低英国参与度"
 bpm_bnap_durham_report_implement_report_tt:0 "@information! 我们将不得不落实达勒姆报告的建议。"
 bpm_bnap_patriots_events.3.t:0 "达勒姆报告"
 bpm_bnap_patriots_events.3.d:0 "爱国者起义之后，达勒姆勋爵发布了他关于英国殖民地局势的报告。"
 bpm_bnap_patriots_events.3.f:0 "我原本期望看到政府与人民之间的对立：却发现了在同一国家内部交战的两个民族：我发现的不是原则之争，而是种族之争；我认识到，除非我们能够首先成功终结如今将下加拿大居民分裂为敌对的法语与英语两大阵营的致命仇恨，否则任何改善法律或制度的努力都将是徒劳的。"
 bpm_bnap_patriots_events.3.a:0 "我们必须落实报告中的建议。"
 bpm_bnap_patriots_events.3.b:0 "如此激进的想法是危险的。"
 je_bpm_bnap_durham_report:0 "达勒姆报告"
 je_bpm_bnap_durham_report_desc:0 "我们必须尽快落实达勒姆报告。"
 je_bpm_bnap_durham_report_reason:0 "达勒姆报告已经找出了爱国者起义的根源，并提出了一系列改革措施以防止此类灾难再次发生。我们必须尽快落实这些改革，确保法裔加拿大人不再起而反抗我们。\n\n#lore 「法国人抱怨英国人的傲慢与不公；英国人则指责法国人具有软弱被征服民族的种种恶习，并斥其卑劣与背信。两个种族因此学会了彼此猜疑对方的意图，这种全然的不信任使他们对最无辜的举动也做出最恶意的解读；不公平地评判每一句话、每一个行为、每一种意图；将最可憎的图谋强加于人，并将任何善意或公正的表示都视为掩盖背叛与恶意的秘密企图。」\n\n——达勒姆勋爵，1839 年"
 je_bpm_bnap_durham_report_complete:0 "《联合法案》已获通过。"
 bpm_bnap_patriots_events.4.t:0 "来自拜敦的请愿"
 bpm_bnap_patriots_events.4.d:0 "加拿大省越来越倾心于合众国，且对其在伦敦的宗主满腹怨气，一个代表会议送来了一份请愿，请求加入我们的合众国。"
 bpm_bnap_patriots_events.4.f:0 ""加拿大实际上是那里一向所见景象的真正范本。在这两个地方，政府所管辖的头绪与人民一样多；它总揽一切、行事、规制、控制、包办所有事务，为一切筹谋，对臣民的事务比他自己了解得还多——简言之，它无时无刻不在忙碌，却又毫无成效。"\n——亚历克西·德·托克维尔，1856 年"
 bpm_bnap_patriots_events.4.a:0 "我们不能无视这份自由的请愿，立即将此事提交国会！"
 bpm_bnap_patriots_events.4.b:0 "不予理会。我们不能冒险与英国发生更广泛的冲突。"
 je_bpm_bnap_confederation_quest:0 "迈向联邦"
 je_bpm_bnap_confederation_quest_desc:0 "加拿大各省正在讨论建立加拿大联邦的可能性。"
 je_bpm_bnap_confederation_quest_reason:0 "如果我们修建铁路连接其他省份，它们可能会同意加入联邦。"
 je_west_canada:0 "跨越草原"
 je_west_canada_desc:0 "我们现在可以将联邦向西扩展。"
 je_west_canada_reason:0 "随着东部殖民地结成自治领，是否要将这一联邦向西扩展成为了讨论的话题。哈德逊湾公司长期控制着整个哈德逊湾流域和西部平原，但长期以来难以从其管理中获利，英国可能愿意促成一次出售。再往西是不列颠哥伦比亚殖民地；面对美国扩张的威胁，如果我们能用铁轨横贯大陆，他们可能愿意加入联邦……\n\n#lore 「他要执掌权柄，从这海直到那海，从大河直到地极……」\n\n——诗篇 72:8#!"
 bnap_rupert_button:0 "为鲁珀特地出价"
 bnap_rupert_button_desc:0 "联系我们在伦敦和哈德逊湾公司的联系人以提出报价。"
 bnap_columbia_button:0 "与不列颠哥伦比亚结成联邦"
 bnap_columbia_button_desc:0 "宣布横贯大陆铁路的竣工，并与不列颠哥伦比亚结成联邦。"
 has_rupert_sale_cooldown_tt:0 "最近未曾提出过报价。"
 bpm_bnap_responsible_government:0 "责任政府"
 bpm_bnap_responsible_government_desc:0 "英国将同意授予我们责任政府。"
 bpm_bnap_responsible_government_trigger_desc:0 "已结成加拿大联邦，且英国参与度低于 25。"
 bpm_bnap_call_to_war_button:0 "战争召唤"
 bpm_bnap_call_to_war_button_desc:0 "召唤 [Country.GetOverlord.GetAdjective] 参战，对抗我们的敌人。"
 bpm_bnap_call_to_war_trigger_desc:0 "英国参与度高于 15。"
 bpm_bnap_statehood_button:0 "申请合并"
 bpm_bnap_statehood_button_desc:0 "利用加拿大强烈的亲美情绪，向美国递交请愿，请求并入合众国。"
 bpm_bnap_statehood_button_trigger_desc:0 "最大化美国认同，并放弃与沿海殖民地的联邦。"
 bpm_bnap_canada_events.1.t:0 "责任政府"
 bpm_bnap_canada_events.1.d:0 "英国人已同意授予我们责任政府。"
 bpm_bnap_canada_events.1.f:0 "选民并不直接选出首相；他们选出代表。选民的力量，是通过其代表有权对政府表示信任或撤销信任来表达的。如果代表给予或撤销信任的能力受到干涉，我们就不再是民主政体了。"
 bpm_bnap_canada_events.1.a:0 "权力归于加拿大两大民族！"
 je_bpm_bnap_the_question_of_british_rule_complete:0 "我们已达到 #v 100#! 的英国参与度。"
 bpm_bnap_the_question_of_british_rule_complete_tt:0 "如果以 #v 100#! 英国参与度完成，我们将更贴近大英帝国，他们将负担我们更多的行政开支。\n如果通过降低英国参与度来完成，我们将更加独立于大英帝国，他们负担的行政开支将会减少。"
 bpm_bnap_canada_events.2.t:0 "英国统治的终结"
 bpm_bnap_canada_events.2.d:0 "我们已宣布脱离大英帝国独立。"
 bpm_bnap_canada_events.2.f:0 "在人类事务的进程中，当一个民族必须解除其与另一民族之间相连结的政治纽带，并在世界列国之中取得自然法则与自然神明所赋予的独立而平等的地位时，出于对人类舆论的应有尊重，就必须把他们不得不分立的原因予以宣布。"
 bpm_bnap_canada_events.2.a:0 "我们的北美"
 bpm_bnap_canada_events.3.t:0 "王室的忠诚臣民"
 bpm_bnap_canada_events.3.d:0 "我们决定继续效忠王室。"
 bpm_bnap_canada_events.3.f:0 "我们加拿大人民，郑重宣誓，我们将忠贞不渝，并真诚效忠 [Country.GetOverlord.GetRuler.GetHerHim] 陛下 [Country.GetOverlord.GetRuler.GetFullName]，加拿大 [Country.GetOverlord.GetRuler.GetPrimaryRoleTitle]，[Country.GetOverlord.GetRuler.GetHerHim] 的继承人及继任者。愿上帝助我。"
 je_bpm_bnap_between_lion_and_eagle:0 "狮子与鹰之间"
 je_bpm_bnap_between_lion_and_eagle_desc:0 "我们必须决定我们的忠诚所在。"
 je_bpm_bnap_between_lion_and_eagle_reason:0 "我们是大英帝国的殖民地，但也是合众国的邻邦。我们必须决定忠诚所在，以及如何驾驭这两大强国之间复杂的关系。我们可以选择继续效忠大英帝国、寻求民族独立，甚至加入合众国。"
 bpm_bnap_bleub_bar:0 "加拿大认同"
 bpm_bnap_bleub_bar_left:0 "英国"
 bpm_bnap_bleub_bar_right:0 "美国"
 bpm_bnap_bleub_from_relations:0 "与 [ROOT.GetCountry.GetOverlord.GetName] 的关系，对比与合众国的关系"
 bpm_bnap_blen_bar:0 "民族主义"
 bpm_bnap_blen_bar_desc:0 "对民族主义的支持"
 bpm_bnap_blen_from_prestige:0 "相对于 [ROOT.GetCountry.GetOverlord.GetAdjective] 的声望"
 bpm_bnap_blen_from_nationalism:0 "已研究民族主义科技"
 bpm_bnap_blen_from_gdp:0 "英国 GDP #variable [ROOT.GetCountry.MakeScope.ScriptValue('bpm_british_gdp')|D]#!，对比加拿大 GDP #variable [ROOT.GetCountry.MakeScope.ScriptValue('bpm_bnap_getgdp')|D]#!"
 bpm_bnap_liberty_desire:0 "自由渴望"
 bpm_bnap_confederation_events.1.t:0 "夏洛特敦会议"
 bpm_bnap_confederation_events.1.d:0 "夏洛特敦会议已经召开，以讨论建立加拿大联邦的可能性。"
 bpm_bnap_confederation_events.1.f:0 "加拿大省、新不伦瑞克和新斯科舍各省的代表在夏洛特敦会面，讨论建立加拿大联邦的可能性。代表们同意在魁北克城再次会面，以进一步商讨联邦的条款。"
 bpm_bnap_confederation_events.1.a:0 "向着联邦前进！"
 bpm_bnap_confederation_events.1.b:0 "背叛！"
 bpm_bnap_confederation_events.3.t:1 "购买鲁珀特地的报价"
 bpm_bnap_confederation_events.3.d:1 "[SCOPE.sCountry('rupert_buyer').GetName] 向我们提出了购买 [SCOPE.sState('rupert_scope').GetName] 的报价。"
 bpm_bnap_confederation_events.3.f:1 ""作为 [SCOPE.sCountry('rupert_buyer').GetNameNoFormatting] 的代表，我们特此同意在 [SCOPE.sCountry('rupert_buyer').GetCapital.GetCityHubName] 的国库，向 [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] 的外交代表或其他代理人支付三十万英镑黄金。"
 bpm_bnap_confederation_events.3.a:0 "长久以来我们都未能在这片土地上获利，就让 [SCOPE.sCountry('rupert_buyer').GetAdjectiveNoFormatting] 人拿去吧。"
 bpm_bnap_confederation_events.4.t:1 "购买鲁珀特地的报价"
 bpm_bnap_confederation_events.4.d:2 "[SCOPE.sCountry('rupert_seller').GetName] 发现自己无力资助其在鲁珀特地的殖民地，似乎愿意以一个可承受的价格将这片领土卖给我们。"
 bpm_bnap_confederation_events.4.f:0 ""[SCOPE.sCountry('rupert_buyer').GetNameNoFormatting] 的代表同意在 [SCOPE.sCountry('rupert_buyer').GetCapital.GetCityHubName] 的国库，向 [SCOPE.sCountry('rupert_seller').GetRuler.GetHerHis] 陛下，全 [SCOPE.sCountry('rupert_seller').GetNameNoFormatting] 的 [SCOPE.sCountry('rupert_seller').GetRuler.GetPrimaryRoleTitle] 的外交代表或其他代理人支付三十万英镑黄金。"
 bpm_bnap_confederation_events.4.a:1 "做出必要的安排。"
 bpm_bnap_confederation_events.4.b:1 "我们现在负担不起这笔开支。"
 bpm_bnap_confederation_events.5.t:0 "鲁珀特地法案"
 bpm_bnap_confederation_events.5.d:0 "[SCOPE.sCountry('rupert_seller').GetName] 已同意我们的条件。购买鲁珀特地的条约已经草拟完成。"
 bpm_bnap_confederation_events.5.f:0 ""如果你愿意，明天我就到部里来，我们可以着手签订条约。"\n"何必等到明天，诺思科特先生？今晚就签吧！""
 bpm_bnap_confederation_events.5.a:0 "辽阔的西北在召唤！"
 bpm_bnap_confederation_events.6.t:0 "维多利亚的谈判"
 bpm_bnap_confederation_events.6.d:0 "不列颠哥伦比亚如今已与加拿大其他地区相连，我们已开始与其政府谈判加入联邦的事宜。"
 bpm_bnap_confederation_events.6.f:0 ""
 bpm_bnap_confederation_events.6.a:0 "从这海到那海，横贯大陆的联邦！"
 bpm_bnap_confederation_events.6.b:0 "这实在行不通……"
