 je_bpm_christ_dem_pedia_tooltip: "ChristDemPedia, ipuçları (tooltip) arasında atlamak zorunda kalmadan tarih boyunca var olmuş (hakkında iyi okuyabildiğimiz ve bildiğimiz) (#italic #bold 1939'a#! kadar) çeşitli @ig_christian_democrats! #blue Hristiyan Demokrat#! partiler, fraksiyonlar, gruplar ve türler arasında size rehberlik etmeye yardımcı olacak oyun içi küçük bir mod wikisidir!. Tüm grupların/fraksiyonların [Concept('concept_ideology', 'İdeolojileri')], kim oldukları, onları kimin yönettiği ve neye inandıklarına dair açıklamaları yazılıdır. Bazıları ayrıca kapsamlı ve gerçekten ayrıntılı araştırmalar sayesinde çok sayfalı tarihlere de sahiptir.\n\nBu sayfaların içinde onlar ve iç hizipler, siyaset, ekonomi ve diğerleri ile ilgili politikaları hakkında bilgi bulabilirsiniz. 'İdeolojik spektrumdaki yerleşimleri', diğer ideolojilere göre değil, diğer #blue Hristiyan Demokratlara#! göre geriye dönük olarak temel alınmıştır.\n\n#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_what_is_christian_democracy_tooltip #v Hristiyan Demokrasisi Nedir?#!#!\n\n@ig_christian_democrats! #blue Hristiyan Demokratlar#!/@ig_reactionaries! #purple Ulusal Muhafazakarların#! bulunduğu ülkeler:\n\n#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_group_krikscionys_demokratai_tooltip #v Litvanya#!#!;\n#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_group_chadecy_tooltip #v Polonya#!#!;\n#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_group_lidovci_tooltip #v Çekoslovakya#!#!;\n#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_group_christlichsozialen_tooltip #v Avusturya#!#!;\n#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_group_young_right_tooltip #v Belçika#!#!;\n#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_group_popular_democrats_tooltip #v Fransa#!#!;\n#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_group_popolari_tooltip #v İtalya#!#!;\n#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_group_zentrumites_tooltip #v Almanya#!#!;\n#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_group_katholieken_tooltip #v Hollanda#!#!;\n#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_group_catholics_tooltip #v İsviçre#!#!;\n#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_group_innovateuren_tooltip #v Lüksemburg#!#!" # \n\n#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_what_is_national_conservatism_tooltip #v What is National Conservatism?#!#! #  @ig_reactionaries! #purple National Conservative#!

 

 je_bpm_what_is_national_conservatism_tooltip: "#v Ulusal Muhafazakarlık Nedir?#!\n\n@ig_reactionaries! #purple Ulusal Muhafazakarlar#! milletlerini idealist, gelenekselci ama bir o kadar da modernist bir devlete doğru dönüştürmeye çabalarlar. Böylesi bir devlet, Katolik dünyasında ‘Rerum novarum’un sağcı yorumunu, yani gerçek anlamda #v Organik#! bir devleti takip edecektir. "

 je_bpm_what_is_christian_democracy_tooltip: "#v Hristiyan Demokrasisi Nedir?#!\n\n@ig_christian_democrats! #blue Hristiyan Demokrasisinin#! tanımı akademisyenler arasında hala çok tartışılmaktadır ve mevcut çeşitli yaklaşımlar bulunmaktadır. Biz #bold İşlevselci (Functionalist)#! yaklaşımı izlemeye karar verdik (#italic #bold Carl Invernizzi Accetti#! tarafından ‘#bold Hristiyan Demokrasisi Nedir?#!’ adlı kitabında daha kapsamlı bir şekilde açıklanmış ve karşılaştırılmıştır). Hristiyan Demokrasisini özel bir zorlukla karşılaşan siyasi bir ideoloji olarak tanımlar: #italic Hristiyanlığın modern demokrasiyle uzlaştırılması#!.\n\nEn önemlisi, böylesi bir tanım, Hristiyan Demokrasisini, bu etiketi kullanan ve tanımlara uymayan inançlara sahip grupları başka türlü diskalifiye edebilecek belirli, özcü (essentialist) bir inançlar kümesi olmaya indirgemez. Bu, bu etiket altında, örneğin Litvanyalı etno-milliyetçi #v Krikščionys Demokratai#! ve İtalyan enternasyonalist #v Popülerciler#! gibi birbirinin taban tabana zıttı olan heterojen grupları ve inançları bir araya getirebileceğimiz anlamına gelir, ancak her ikisinin de cevaplamak istedikleri bir zorluk vardır.\n\nAyrıca, temellerini çeşitli derecelerde Katolik Sosyal Öğretilerine dayandıran veya demokrasi inancına sahip olup onun yerine farklı bir alternatif veya biçim getirmeyi amaçlayan diğer #v Siyasal Katoliklik#! biçimleri arasına da net bir çizgi çeker. Örneğin bu durum, Katolik düşüncesinin sağ kanadı olan ve demokrasiye farklı bir yaklaşım getiren @ig_reactionaries! #purple Ulusal Muhafazakarlardan#! (#italic ve onların pek çok isminden#!) net bir ayrım yapar — tıpkı @ig_christian_democrats! #blue Hristiyan Demokratların#! yapacağı gibi, Hristiyanlığı modern demokrasiyle uzlaştırmayı ve dolayısıyla liberal-demokratik bir sistemi desteklemeyi amaçlamak yerine, Ulusal Muhafazakarlar mevcut liberal-demokratik sistemleri ortadan kaldırmayı ve onları organik olanlarla değiştirmeyi amaçlamışlardır.\n#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_christ_dem_pedia_tooltip #bold #gold ChristDemPedia#!#!#!"

 je_bpm_group_innovateuren_tooltip: "#v YAKINDA!#! (#italic :OMUZ-SİLKEN-ADAM:#!)"

 je_bpm_group_zentrumites_tooltip: "#v Merkezciler (Centrists)#! (#italic: Almanca: #bold Zentristen#!#!), ya da diğer adıyla #v Zentrumcular#!, Alman Merkez Partisi'nin (#italic Almanca: #bold Deutsche Zentrumspartei, DZP, #italic ya da kısaca#! #v Z#!#!#!) tamamını oluşturan, çoğunlukla @ig_christian_democrats! #blue Hristiyan Demokrat#! #gold Katoliklerdi#!. #v Merkezcilere#! çeşitli, renkli ideolojileri temsil eden farklı kişiler öncülük etti — ilk on yıllardaki en popüler örnekler #bold Ludwig Windthorst#! ve #bold Wilhelm Emmanuel von Ketteler#!; son on yıllarda ise parti içinde büyük etkiye sahip #bold Wilhelm Marx#! ve #bold Heinrich Brüning#! gibi isimlerdi. Tabanları genellikle tüm mesleklerden #gold Katolikler#! arasındaydı.\n\n#v Merkezciler#! birçok konuda farklılık gösteren, kimin en çok etkiye sahip olduğuna bağlı olan devasa, çeşitli bir grup olduklarından ne kadar sola veya sağa eğilimli olduklarını söylemek çok zordur, ancak çoğu liberal-demokratik sistemi desteklemiştir. Yani çok genelleyecek olursak, #v Merkezciler#! siyasi olarak merkez sol, ekonomik olarak merkez ve sosyal olarak merkez sağdaydılar.\n\n#v Merkezciler#! [Concept('concept_party', 'İtirafçı Bir Parti (Confessional Party)')] #bold değillerdi#!, doğuşlarından bu yana #gold Protestanların#! desteğini kazanmaya çalıştılar.\n\nSiyasetle ilgili olarak #v Merkezciler#! genel olarak [GetLawType('law_universal_suffrage').GetName] yasasını ve yerelleşmeyi desteklediler, kadınların oy kullanması ve temsil edilmesi konusunda daha çeşitli duruşlara sahiptiler. İlk yıllarda #v Merkezciler#!, ‘#bold Kulturkampf#!’ sırasında eğitim ve hukukun laikleştirilmesine karşı çıktılar; #gold Weimar Cumhuriyeti#! sırasında ise bir bütün olarak laikleşmeye karşı oldukça pragmatiktiler.\n\nEkonomik olarak, #v Merkezciler#! genel olarak sınırlı devlet müdahalesini desteklediler; [GetLawGroup('lawgroup_trade_policy').GetName] ve [GetLawGroup('lawgroup_taxation').GetName] konularında daha karışık görüşlere sahiptiler. Kırsal kalkınmayı ve genellikle kapsamlı refahı desteklediler, ancak #bold Büyük Buhran#! sırasında kemer sıkma yanlısı politika hakim oldu; #bold Zentrum#! gençliği arasında, #bold sosyalleşme#! ve #bold devlet planlaması#! dahil olmak üzere çok daha aktif bir devlet müdahalesine destek büyük ölçüde arttı. Ancak [concept_party] partisinin #bold 1933'te#! kendini feshetmesi olası değişikliklere izin vermedi.\n\nSosyal olarak, #v Merkezciler#! genellikle savunmacı bir askeri destekle birlikte anti-semitizmi ve düşmanca milliyetçiliği tasvip etmediler. ‘#bold Kulturkampf#!’ sırasında diğer #gold Katoliklerin#!, özellikle de #gold Polonyalıların#! ve #gold Alsaslıların#! desteğini kazanmaya çalıştılar, ancak çoğunlukla başarısız oldular. #v Merkezciler#! ayrıca Avrupa'nın diğer @ig_christian_democrats! #blue Hristiyan Demokrat#! partileriyle yakın bağlar kurma konusunda oldukça pragmatiktiler ve genel olarak nüfuz ve destek kazanmayı amaçladılar.\n\nAşağıdaki ideolojiler #v Merkezcileri#! mümkün olduğunca yakından temsil etmektedir: [GetIdeology('ideology_gov_moderate_monarchist').GetName] / [GetIdeology('ideology_gov_liberal_republican').GetName]; [GetIdeology('ideology_exe_weak_rigid').GetName]; [GetIdeology('ideology_dop_christian_democrat').GetName]; [GetIdeology('ideology_sta_federated_state').GetName]; [GetIdeology('ideology_eco_modern_interventionist').GetName]; [GetIdeology('ideology_wel_expanded_public_welfare').GetName]; [GetIdeology('ideology_cit_liberal_nationalist').GetName]; [GetIdeology('ideology_rel_pragmatic_moralist').GetName]; [GetIdeology('ideology_mil_patriotic_liberal').GetName]; [GetIdeology('ideology_fem_benevolent_sexism').GetName]\n#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_christ_dem_pedia_tooltip #bold #gold ChristDemPedia#!#!#!"

 je_bpm_group_young_right_tooltip: "The #v Genç Sağ#! (#italic Fransızca/Valonca: #bold Jeune Droite#!, Felemenkçe/Flamanca: #bold Jong Rechts#!#!), çeşitli #gold siyasi#! ve #gold sosyal reformlar#! getirmeyi amaçlayan, #bold Joris Helleputte#!, #bold Arthur Verhaegen#! ve #bold Jules Renkin#! gibi isimler tarafından yönetilen, Belçika #bold Katolik Partisi#!'nin @ig_christian_democrats! #blue Hristiyan Demokrat#! bir siyasi hareketi ve hizbiydi. #v Genç Sağ#!, rakipsiz bir sağ kanat lideri olduğuna inanan Charles Woeste tarafından yönetilen muhafazakar ve paternalist-seçkinci @ig_conservatives! #v Eski Sağ#! (#italic Fransızca/Valonca: #bold Vieille Droite#!, Felemenkçe/Flamanca: #bold Oud Rechts#!#!) fraksiyonuna şiddetle karşı çıkıyordu.\n\n#v Genç Sağ#! siyasi olarak merkez-sol, ekonomik olarak merkez ve sosyal olarak merkez-soldu.\n\nOnlar [GetLawType('law_universal_suffrage').GetName] yasasının getirilmesini ve Hristiyan Demokrasisine benzeyen bir şeyin inşa edilmesini; #gold Belçika#!'nın yerelleşmesinin genişletilmesini ve yerel yönetimin güçlendirilmesini, dinin devletteki öneminin güvence altına alınmasını desteklediler. Çoğu diğer Hristiyan Demokratın aksine, [GetTechnology('corporatism').GetName] ideolojisine ve her türlü paternalizme pek sıcak bakmıyorlardı.\n\nAyrıca, tüm işçiler için geniş ve tam faydalar sağlanmasını, ekonominin düzenlenmesini ve devletin ekonomiye daha fazla müdahil olmasını desteklediler, artan oranlı vergilendirme yoluyla serveti yeniden dağıtmayı amaçladılar.\n\n#v Genç Sağ#! nispeten enternasyonalist ve pasifistti, birçok genç üye herhangi bir ulusal sembolü doğası gereği gerici olarak gördükleri için kullanmayı reddediyordu. #v Genç Sağ#! aynı zamanda birleşik bir Belçika kimliği inşa etme ve her iki ulusun da birbirine çok fazla bağlandığı ve farklılıklarının çok küçük olduğu Flamalar ve Valonları mümkün olduğunca birbirine bağlama fikrine de çok sıcak bakıyordu.\n\nAşağıdaki ideolojiler #v Genç Sağ#!'ı mümkün olduğunca yakından temsil etmektedir: [GetIdeology('ideology_gov_moderate_monarchist').GetName]; [GetIdeology('ideology_exe_weak_rigid').GetName]; [GetIdeology('ideology_dop_christian_democrat').GetName]; [GetIdeology('ideology_sta_regionalized_state').GetName]; [GetIdeology('ideology_eco_modern_interventionist').GetName]; [GetIdeology('ideology_wel_expanded_public_welfare').GetName]; [GetIdeology('ideology_cit_christian_internationalist').GetName]; [GetIdeology('ideology_rel_modern_moralist').GetName]; [GetIdeology('ideology_mil_antimilitarist').GetName]; [GetIdeology('ideology_fem_benevolent_sexism').GetName]\n\n#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_group_young_right_p1 #bold #grey Tarihçe: İlk Sayfa#!#!#!\n#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_christ_dem_pedia_tooltip #bold #gold ChristDemPedia#!#!#!"

 je_bpm_group_oreliten_tooltip: "#v Sosyal Romantikler#! (#italic Almanca/Avusturya Almancası: #bold Soziale Romantiker#!#!), Hristiyan Sosyal Partisi (#italic Almanca: #bold Christlichsoziale Partei, CS/CSP#!#!) içinde nispeten küçük, muhalif bir gruptu. #v Soziale Romantiker#!, Avusturyalı politikacılar etrafında şekilleniyordu — #bold Anton Orel#!, #bold Karl Lugmayer#! ve en önemlisi #bold Wiard v Klopp#!. Onlar genel olarak güçlü bir şekilde merkezden uzaklaştırılmış, organik bir devlete odaklanan #bold Karl von Vogelsang#! tarafından ortaya atılan siyasi-ekonomik fikirleri yakından takip ediyorlardı; hem endüstriyel hem de kırsal küçük ve orta ölçekli mülkiyete dayalı korporatist bir ekonomiyi benimsiyorlardı.\n\nOnları mevcut #bold BPM#! [Concept('concept_interest_group', 'Çıkar Grupları')] sınırları içinde tanımlamak oldukça zordur, ancak 'modernist' 1934-1938 'Ständestaat' rejimine duydukları istisnai güçlü nefret, anti-kapitalizm ve aşırı anti-semitizm nedeniyle onları @ig_reactionaries! #purple Ulusal Muhafazakarlar#! olarak sınıflandırdık.\n\n#v Sosyal Romantikler#!, #bold CSP#! içinde çok küçük, zayıf ve gençtiler. Militan olmalarına rağmen, Katolik gençliğin ana akımı olan #v Volksbundler#!'dan çok az destek gördüler. #bold Orel’in#! gençlik dernekleri nispeten iyi iş çıkardı, ancak maalesef onun için yeterince güçlendirici olmadılar. #bold Anton Orel#! ve grubu, örneğin #italic 1918#! ve #italic 1924#!'te olduğu gibi sık sık yollarını ayırdı, bölündü veya #bold CSP#!'den ihraç edildi.\n\nAşağıdaki ideolojiler #v Sosyal Romantikler#!'i mümkün olduğunca yakından temsil etmektedir: [GetIdeology('ideology_gov_placeholder').GetName]; [GetIdeology('ideology_dop_organic_democrat').GetName]; [GetIdeology('ideology_sta_organic_state').GetName]; [GetIdeology('ideology_eco_distributist_economy').GetName]; [GetIdeology('ideology_wel_distributist_welfare').GetName]; [GetIdeology('ideology_cit_multiethnic_nationalist').GetName]; [GetIdeology('ideology_rel_radical_moralist').GetName]; [GetIdeology('ideology_mil_patriotic_liberal').GetName]; [GetIdeology('ideology_fem_benevolent_sexism').GetName]\n#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_christ_dem_pedia_tooltip #bold #gold ChristDemPedia#!#!#!"

 je_bpm_group_seipelites_tooltip: "#v Seipelciler (Seipelites)#! (#italic Almanca/Avusturya Almancası: #bold Seipeliten#!#!), Hristiyan Sosyal Partisi (#italic Almanca: #bold Christlichsoziale Partei, CS/CSP#!#!) içinde bir fraksiyondu. #v Seipeliten#!, adından da anlaşılacağı gibi #bold CSP#!'nin iki savaş arası dönem (interwar) lideri — #bold Ignaz Seipel#! ve çevresi etrafında toplanmıştı. Her ne kadar liderlik #bold Seipel#!'in elinde olsa da ve pek çok #v Seipeliten#! parti elitlerinin bir üyesi olsa da, kitlesel bir desteğe sahip değillerdi ve [concept_party] partisi içinde bir azınlık konumundaydılar. Bunun en büyük örneği, #bold Seipel#!'in büyük memnuniyetsizliğine rağmen #italic 1929 Anayasa Reformu'nda#! ikinci bir korporatist meclisin kurulamamasıydı.\n\nBaşlangıçta #gold Avusturya'nın#! #italic parlamenter demokrasisine#! karşı nispeten olumluydular, ancak zaman ilerledikçe, üzerinde deneyler yapmayı tercih ederek daha küçümseyici ve kaderci bir tutum takındılar. Aynı süreçler, farklı derecelerde de olsa, #gold Avusturya#! #italic Sosyal Demokrat#! #bold SDAPÖ#! partisinde ve #bold Christlichsoziale Partei#!'nin geri kalanında da yaşandı.\n\n#bold Ignaz Seipel#!, hayatı boyunca, yönetimin merkezden uzaklaştırılmış örgütler aracılığıyla uygulandığı, parti çekişmelerinden arınmış bir 'gerçek demokrasi' fikri geliştirdi. Fikri, yavaş yavaş @ig_fascists! #v Avusturya-Faşistleri#! tarafından ele geçirilen parti liderliği içinde asla destek bulamadı. Diğer @ig_christian_democrats! #bold Hristiyan Sosyallerin#! saflarında da destek bulamadı.\n#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_christ_dem_pedia_tooltip #bold #gold ChristDemPedia#!#!#!"

 je_bpm_group_laborists_and_agrarians_tooltip: "#v İşçiciler (Laborists)#! (#italic Almanca/Avusturya Almancası: #bold Laboristen#!#!) ve #v Tarımcılar (Agrarians)#! (#italic Almanca/Avusturya Almancası: #bold Agrarianer#!#!), #italic iki savaş arası (interbellum)#! dönemde Hristiyan Sosyal Partisi (#italic Almanca: #bold Christlichsoziale Partei, CS/CSP#!#!) içinde bir fraksiyondu. #v Laboristen#! #bold Leopold Kunschak#! etrafında toplanırken, #v Agrarianer#!'ın belirgin, lider bir figürü yoktu.\n\n#v Laboristen#! ve #v Agrarianer#! siyasi olarak merkez-sağ, ekonomik olarak merkez-sağ ve sosyal olarak merkez-sağdaydı.\n\n#v Laboristen#! temel olarak işçi reformlarını genişletmeye ve konsolidasyona odaklandı; duruşları çoğunlukla #v Volksbundler#!'ı yansıtıyordu, ancak çok daha muhafazakardılar. #gold Avusturya#! içindeki artan kutuplaşma ve kadercilik nedeniyle #v Laboristen#! sosyalizme ve onun renkli fikirlerine karşı giderek daha düşmanca bir tutum takındı, [GetLawGroup('lawgroup_labour_associations').GetName] yasalarını sınırlandırmayı, mali muhafazakarlığı ve daha güçlü bir devleti destekledi; buna rağmen parlamenter siyaseti desteklemeye devam etti.\n\n#gold Avusturya#! hâlâ büyük ölçüde geri kalmış olduğundan #v Agrarianer#! çoğunlukla kırsal kalkınmaya odaklandı. Çok daha ademi merkeziyetçi, düzensiz ve bazen şehirciliğe bile düşmandılar (#bold 1918 kaosu sırasında #v Agrarianer#! açlıktan kırılan şehirlere desteğe karşı çıkmıştı#!).\n\n[GetIdeology('ideology_gov_liberal_republican').GetName]; [GetIdeology('ideology_dop_conservative_democrat').GetName]; [GetIdeology('ideology_sta_federated_state').GetName]; [GetIdeology('ideology_eco_distributist_economy').GetName]; [GetIdeology('ideology_wel_distributist_welfare').GetName]; [GetIdeology('ideology_cit_multiethnic_nationalist').GetName]; [GetIdeology('ideology_rel_modern_moralist').GetName]; [GetIdeology('ideology_mil_patriotic_liberal').GetName]; [GetIdeology('ideology_fem_benevolent_sexism').GetName]\n#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_christ_dem_pedia_tooltip #bold #gold ChristDemPedia#!#!#!"

 je_bpm_group_reformists_and_volksbund_tooltip: "#v Reformcular (Reformists)#! (#italic Almanca/Avusturya Almancası: #bold Reformisten#!#!) ve #v Volksbund Üyeleri#! (#italic Almanca/Avusturya Almancası: #bold Volksbundler#!#!), Hristiyan Sosyal Partisi (#italic Almanca: #bold Christlichsoziale Partei, CS/CSP#!#!) içindeki gruplardı. #v Reformisten#! #bold Albert Geßmann#! ve #bold Heinrich Mataja#! etrafında toplanırken, #v Volksbundler#! #bold Richard Schmitz#! ve #bold Leopold Kunschak#! tarafından yönetiliyordu. Her iki grup da #bold CSP#!'yi modernize etmek, oy tabanını genişletmek ve yeni fikirler geliştirmek için çok yakın işbirliği yaptı.\n\n#v Reformisten#! ve #v Volksbundler#! siyasi olarak merkez-sol, ekonomik olarak merkez-sol ve sosyal olarak merkez-sağdaydı.\n\n#v Reformisten#! temel olarak parti iç yapılarını, liderliği, örgütlenmeyi ve bağlantıları modernize etmeye; seçmen tabanını genişletmeye, Viyanalı #v Bürgerliche#! ile mücadele etmeye ve programı modernize etmeye odaklandı. Partiyi kapitalizme doğru kaydırdılar, eski #bold Vogelsangian#! fikirlerini terk ettiler (#v Soziale Romantiker#!'i büyük ölçüde kızdıran bir hamleydi) ve oy tabanını kentsel-işçi seçmenlere doğru genişlettiler. Çoğunlukla #v Volksbundler#!'ın fikirlerini parti programına uyarladılar.\n\n#v Volksbundler#! ideolojik gelişime, oy tabanını çiftçilere, işçilere ve gençlere doğru genişletmeye odaklandı. Partinin kapitalizme yönelmesine yardımcı oldular, ‘#bold devlet-sosyalizmi#!’ni (Schmitz), nispi temsili, [GetLawType('law_womens_suffrage').GetName] yasasını, geniş kapsamlı işçi reformlarını, (belediye seçimleri için) [GetLawType('law_universal_suffrage').GetName] 'ni ‘#bold evrenselleştirmeyi#!’ desteklediler.\n\nAşağıdaki ideolojiler #v Reformisten und Volksbundler#! grubunu mümkün olduğunca yakından temsil etmektedir: [GetIdeology('ideology_gov_moderate_monarchist').GetName]; [GetIdeology('ideology_dop_christian_democrat').GetName]; [GetIdeology('ideology_sta_federated_state').GetName]; [GetIdeology('ideology_eco_modern_interventionist').GetName]; [GetIdeology('ideology_wel_expanded_public_welfare').GetName]; [GetIdeology('ideology_cit_multiethnic_nationalist').GetName]; [GetIdeology('ideology_rel_modern_moralist').GetName]; [GetIdeology('ideology_mil_patriotic_liberal').GetName]; [GetIdeology('ideology_fem_benevolent_sexism').GetName]\n#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_christ_dem_pedia_tooltip #bold #gold ChristDemPedia#!#!#!"

 je_bpm_group_corporatists_tooltip: "#v Burjuvazi (Bourgeoisie)#! (#italic Almanca/Avusturya Almancası: #bold Bürgerliche#!#!), Hristiyan Sosyal Partisi (#italic Almanca: #bold Christlichsoziale Partei, CS/CSP#!#!) içinde bir fraksiyondu. #v Bürgerliche#! temel olarak #bold Richard Weiskirchner#! tarafından yönetiliyor ve Viyanalı zanaatkarlar, dükkân sahipleri ve memurlar tarafından desteklenen partinin #italic Viyana#! kolunu temsil ediyordu.\n\nAna hedefleri, daha zenginleri kayıran bir [GetLawType('law_census_voting').GetName] sistemine benzer şekilde işleyen Wien'in (Viyana) 'korporatist' sistemini korumaktı. #bold Avusturya-Macaristan İmparatorluğu'nun#! #italic 1918'de#! yıkılması, kuria (curia) sisteminin [GetLawType('law_universal_suffrage').GetName] lehine değiştirilmesi ve Viyana'nın nihayetinde #v Sosyal Demokratların#! (#italic #bold SDAPÖ#!#!) eline geçmesiyle ortadan kayboldular. #italic #bold Christlichsoziale Partei#!#! içindeki #v kentsel-kırsal#! ayrımı, #v Bürgerliche#!'nin tüm gücünü kaybetmesi ve partinin diğer tüm akımlar tarafından ele geçirilmesiyle sona erdi. Fraksiyonun kalıntıları ve yeri, adından da anlaşılacağı gibi, sadece klerikalizm ve taktiksel yaklaşım açısından farklılık gösteren #v Klerikale#! tarafından devralındı.\n\nAşağıdaki ideolojiler #v Bürgerliche#! fraksiyonunu mümkün olduğunca yakından temsil etmektedir: [GetIdeology('ideology_gov_moderate_monarchist').GetName]; [GetIdeology('ideology_dop_moderate_democrat').GetName]; [GetIdeology('ideology_sta_federated_state').GetName]; [GetIdeology('ideology_eco_distributist_economy').GetName]; [GetIdeology('ideology_wel_distributist_welfare').GetName]; [GetIdeology('ideology_cit_multiethnic_nationalist').GetName]; [GetIdeology('ideology_rel_modern_moralist').GetName]; [GetIdeology('ideology_mil_patriotic_liberal').GetName]; [GetIdeology('ideology_fem_moderate_patriarchal').GetName]\n#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_christ_dem_pedia_tooltip #bold #gold ChristDemPedia#!#!#!"

 je_bpm_group_popolari_tooltip: "#v Popülerciler (Populars)#! (#italic İtalyanca: #bold Popolari#!#!) terimi, İtalyan Halk Partisi'nin (#italic İtalyanca: #bold Partito Popolare Italiano, PPI#!#!) üyelerini ifade eder. Her ne kadar PPI'nin tüm üyeleri sıklıkla #italic Popolari#! olarak anılsa da, içlerinde #bold Sturzian#! Popülizminin ilkelerini takip etmeyen bir avuç insan da vardı. Bazen yabancı tarih yazımında PPI üyeleri #italic Populars#! olarak adlandırılırken, #bold Sturzo#!'nun doktrinlerine bağlı olanlar #italic Popularists#! olarak adlandırılır.\n\n#green Tarımsal Popülistler#!\n#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_group_whites_tooltip @ig_agrarian_populists! #bold Beyazlar#!#! (#italic İtalyanca: #bold Bianchi#!#!);\n\n#blue Hristiyan Demokratlar#!\n#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_group_popularists_tooltip @ig_christian_democrats! #bold Popülerciler (Sol)#!#! (#italic İtalyanca: #bold Popolari#!#!);\n#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_group_popularists_tooltip @ig_conservatives! #bold Popülerciler (Sağ)#!#! (#italic İtalyanca: #bold Popolari#!#!);\n\n#purple Ulusal Muhafazakarlar#!\n@ig_reactionaries! #bold Muhafazakar Katolikler#! (#italic İtalyanca: #bold Cattolici Conservatori#!#!);\n\n#italic PPI#! içindeki potansiyel [Concept('concept_bpm_institutional_ig', 'Kurumsal Çıkar Grupları')]:\n@trade_unions! Muhafazakar Sendikalar;" 
 
 je_bpm_group_christlichsozialen_tooltip: "#v Hristiyan Sosyaller#! (#italic Almanca/Avusturya Almancası: #bold Christlichsozialen#!#!), #gold Avusturya'da#! siyasi sağı temsil eden ve çoğunlukla @ig_christian_democrats! #blue Hristiyan Demokrat#! olan çok çeşitli akımlardan oluşan bir gruptu.\n\n#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_group_oreliten_tooltip #bold Soziale Romantiker#!#!\n#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_group_reformists_and_volksbund_tooltip #bold Reformisten und Volksbundler#!#!\n#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_group_corporatists_tooltip #bold Bürgerliche#!#!\n#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_group_seipelites_tooltip #bold Seipeliten#!#!\n#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_group_laborists_and_agrarians_tooltip #bold Laboristen und Agrarianer#!#!" # #v Hristiyan Sosyaller#! (#italic Almanca/Avusturya Almancası: #bold Christlichsozialen#!#!), Hristiyan Sosyal Parti'nin (#italic Almanca: #bold Christlichsoziale Partei, CS/CSP#!#!) çoğunluğunu oluşturan, #bold Karl Lueger#!'in siyasi doktrinlerini, #bold Aloys von Liechtenstein#!'ın sosyal eylemini ve #bold Karl von Vogelsang#!'ın ekonomik öğretilerini takip eden bir tür @ig_christian_democrats! #blue Hristiyan Demokratlardı#!. Tarihleri boyunca dinamik bir şekilde değiştiler ve geliştiler, başlangıçta #bold 1887'de#! '#v Birleşik Hristiyanlar#!' (#italic Almanca/Avusturya Almancası: #bold Vereinigten Christen#!#!) adı altında faaliyet gösterdiler ve nihayetinde çeşitli diğer gruplarla birleştikten sonra #bold 1893'te#! '#v Hristiyan Sosyaller#!' oldular. #bold Birinci Cumhuriyet'e#! girilmesiyle birlikte Hristiyan Sosyaller çeşitli konularda daha gerici ve illiberal pozisyonlara doğru kaymaya başladılar ve sonunda #v Anavatan Cephesi'nin#! (#italic Almanca/Avusturya Almancası: #bold Vaterländische Front#!#!) çekirdek bir parçası haline geldiler. Tabanları çoğunlukla orta sınıf, muhafazakar işçiler, zanaatkarlar, çiftçiler ve toprak sahipleri arasındaydı.\n\n#v Cumhuriyet-Öncesi Christlichsozialen:#!\n#v Hristiyan Sosyaller#! siyasi olarak nispeten muhafazakar, ekonomik olarak gerici ve sosyal olarak muhafazakardılar.\n\nSiyasi olarak açıkça [GetLawType('law_universal_suffrage').GetName] ve [GetLawType('law_womens_suffrage').GetName] yasalarına karşı çıktılar, dini olarak ahlakçıydılar, federalisttiler ve son derece bölünmüş olsalar da işyeri cinsiyetçiliği gibi çeşitli diğer konularda muhafazakarlığa eğilimliydiler, bazen de popülizmi kullanıyorlardı.\n\nEkonomik konularda başlangıçta #bold Vogelsang'ın#! gerici anti-kapitalizmini desteklediler, korporatist fikirler etrafında inşa edilmiş, zanaatkar ve küçük ölçekli endüstriyel üretime, kırsal kalkınmaya, ılımlı korumacılığa ve serveti yeniden dağıtmak için kapsamlı vergilendirmeye odaklanan bir #bold Dağıtımcı Ekonomi#! benimsemeye çalıştılar. Ancak #bold 1910'larda#! ve iş dünyasıyla daha yakın bir işbirliği ile, kapitalizme, müdahaleciliğe, ılımlı korumacılığa ve 'ihtiyatlı' vergilendirmeye karşı oldukça kabulleniciydiler. #bold 1918'de#! #gold Ağır Sanayi'nin#! [Concept('concept_nationalize', 'Millileştirilmesini')], sınırlı #gold [GetLawGroup('lawgroup_land_reform').GetName]#! ve yoğun emek gerektiren işçiler için kapsamlı sosyo-politik yasaları bile önerdiler. Refah konusunda #v Hristiyan Sosyaller#!, sosyal mevzuatın piyasa refahı ile birleştirilmesini destekliyorlardı.\n\n[GetTechnology('nationalism').GetName] bağlamında çeşitli gerekçelerle açıkça anti-semitiktiler, birçok etnik kökenin #gold Avusturya#! öncülüğündeki mevcut federasyonunu açıkça destekliyorlardı ve #gold Avusturya#! kültürünün ve kimliğinin farklılığını vurguluyorlardı. Ordu söz konusu olduğunda nispeten esnektiler ve modernizasyonu destekliyorlardı.\n\nAşağıdaki ideolojiler (#italic Cumhuriyet-Öncesi#!) #v Christlichsozialen#!'i olabildiğince yakından temsil etmektedir: [GetIdeology('ideology_gov_moderate_monarchist').GetName]; [GetIdeology('ideology_exe_weak_rigid').GetName]; [GetIdeology('ideology_dop_divine_democrat').GetName]; [GetIdeology('ideology_sta_federated_state').GetName]; [GetIdeology('ideology_eco_distributist_economy').GetName] / [GetIdeology('ideology_eco_modern_interventionist').GetName]; [GetIdeology('ideology_wel_social_market_welfare').GetName]; [GetIdeology('ideology_cit_multiethnic_nationalist').GetName]; [GetIdeology('ideology_rel_modern_moralist').GetName]; [GetIdeology('ideology_mil_patriotic_liberal').GetName]; [GetIdeology('ideology_fem_moderate_patriarchal').GetName]\n\n#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_group_christlichsozialen_2_tooltip #bold #grey İkinci Sayfa#!#!#!

 je_bpm_group_christlichsozialen_2_tooltip: "#v Cumhuriyet-İçi Christlichsozialen:#!\n#v Hristiyan Sosyaller#! siyasi olarak illiberal-korporatist, ekonomik olarak muhafazakar ve sosyal olarak ılımlıydılar.\n\n#bold Birinci Cumhuriyet'in#! kurulmasıyla birlikte #v Hristiyan Sosyaller#! [GetLawType('law_universal_suffrage').GetName] ve parlamentarizme karşı giderek daha illiberal, korporatist ve tutarsız hale geldiler, ancak sonunda [GetLawType('law_womens_suffrage').GetName] yasasını kabul ettiler. Sosyalizme ve liberal siyasete duydukları küçümseme, dini ahlakçılıkları ve laiklik karşıtlıkları gibi önemli ölçüde arttı. Sınırlı kişisel özgürlükler için daha fazla destekle birlikte hala federe bir #gold Avusturya#! devletini destekliyorlardı.\n\nEkonomik olarak, sınırlı müdahaleyle birlikte güçlü bir korumacılığı, daha 'ihtiyatlı' vergilendirmeyi ve sınırlı toprak reformunu destekleyen kapitalist bir ekonomiyi savundular. Sert kemer sıkma önlemleri ve mali muhafazakarlık dışında, ekonomi üzerinde anlamlı veya daha büyük bir devlet kontrolüne yönelik her türlü destek azaldı. Sosyal mevzuata yaklaşım, çok dindar ve hatta bazen paternalist pozisyonlara doğru kaydı ve hatta [GetLawType('law_religious_schools').GetName] yasasına bile destek verdi.\n\nMilliyetçilik, anti-semitizm ve orduya yaklaşım çok fazla değişmedi, ilk ikisi hala güçlü bir şekilde varlığını sürdürüyordu.\n\nAşağıdaki ideolojiler (#italic Cumhuriyet-İçi#!) #v Christlichsozialen#!'i olabildiğince yakından temsil etmektedir: [GetIdeology('ideology_gov_liberal_republican').GetName]; [GetIdeology('ideology_exe_strong_dynamic').GetName]; [GetIdeology('ideology_dop_conservative_democrat').GetName]; [GetIdeology('ideology_sta_federated_state').GetName]; [GetIdeology('ideology_eco_distributist_economy').GetName]; [GetIdeology('ideology_wel_distributist_welfare').GetName]; [GetIdeology('ideology_cit_multiethnic_nationalist').GetName]; [GetIdeology('ideology_rel_modern_moralist').GetName]; [GetIdeology('ideology_mil_patriotic_liberal').GetName]; [GetIdeology('ideology_fem_benevolent_sexism').GetName]"


 

 je_bpm_group_katholieken_tooltip: "#v Roman Katolikler#! (#italic Felemenkçe: #bold Rooms-katholieken#!#!), Hollanda'daki Roman Katolik Devlet Partisi (#italic Felemenkçe: #bold Roomsch-Katholieke Staatspartij, RKSP#!#!) veya Devrim Karşıtı Parti'nin (#italic Felemenkçe: #bold Anti-Revolutionaire Partij, ARP#!#!) Katolik kanadı gibi çeşitli Roman Katolik [Concept('concept_party', 'Partilerinin')] tamamını oluşturan bir tür @ig_christian_democrats! #blue Hristiyan Demokratlardı#!. Seçim siyasetinde Katolik #bold kanadı#! temsil etmeyi ve ‘#bold Rerum novarum#!’ fikirleri doğrultusunda reformlar gerçekleştirmeyi amaçladılar. Tabanları, belirli bir hedef kitle olmaksızın #gold Hollanda'daki#! Katoliklerin çoğunluğunu kapsıyordu.\n\n#v Roman Katolikler#! siyasi olarak merkez-sol, ekonomik olarak merkez ve sosyal olarak merkez-sağda yer alıyordu. Daha #bold Orta Sınıf#! #v Roman Katolikler#!, '#bold gecekondu sakinlerinin#!' oy kullanmasına izin vermemek ve #bold ilahi egemenlik#! yerine #bold halk egemenliğine#! izin vermemek için oy hakkının genişletilmesine karşı çıktılar, ancak refah ve diğer önlemlerin getirilmesi konusunda da sıklıkla muhafazakardılar; buna karşın daha #bold İşçi Sınıfı#! #v Roman Katolikler#! oy hakkının genişletilmesini, daha fazla refahı ve ekonomik müdahaleyi desteklediler. En popüler sola eğilimli #v Roman Katolikler#! #bold Herman Schaepman#! ve #bold Alfons Ariëns#! idi.\n\n#v Roman Katolik#! işçiler şu sloganı yarattılar ve yaygınlaştırdılar: ‘#bold Dünyanın Katolik işçileri birleşin: #italic Rerum novarum#!!#!’\n\nSiyasi olarak, #v Roman Katolikler#!, erkekler ve kadınlar için [GetLawType('law_universal_suffrage').GetName] yasasını destekleyen nispi çoğunlukla birlikte mevcut oy hakkı sistemlerini desteklediler. Ayrıca nispi temsili, ademi merkeziyetçiliği ve Protestanlar ile Katolikler arasında eşitliği sağlayacak olan [GetLawType('law_freedom_of_conscience').GetName] yasasını da desteklediler.\n\nEkonomik olarak, devletin ekonomiye daha aktif bir şekilde dahil olmasını desteklediler. [GetLawGroup('lawgroup_taxation').GetName] konusundaki duruşlar farklılık gösterdi; sınırlı [GetLawType('law_protectionism').GetName], sınıf işbirliği ve ılımlı kırsal kalkınmaya genel bir destek vardı. #v Roman Katolikler#!, [GetTechnology('corporatism').GetName] fikirleriyle birlikte benzersiz bir refah biçimini desteklediler. Refahın, refah, eğitim, barınma vb. şeylerin işveren tarafından sağlandığı şirketler ve kooperatifler gibi devlet dışı aktörler tarafından yapılmasını istediler; toplumun karşılayamadığı şeyleri ise devlet karşılayacaktı.\n\n#v Roman Katolikler#! liberal-milliyetçi, anti-militaristtiler ve sosyal konularda genellikle daha muhafazakardılar. Daha sıkı ahlaki mevzuatı, tüketiciliğin ve alkolizmin dizginlenmesini desteklediler.\n\nAşağıdaki ideolojiler #v Roman Katolikler#!'i mümkün olduğunca yakından temsil etmektedir: [GetIdeology('ideology_gov_moderate_monarchist').GetName]; [GetIdeology('ideology_exe_weak_rigid').GetName]; [GetIdeology('ideology_dop_christian_democrat').GetName]; [GetIdeology('ideology_sta_federated_state').GetName]; [GetIdeology('ideology_eco_modern_interventionist').GetName]; [GetIdeology('ideology_wel_social_market_welfare').GetName]; [GetIdeology('ideology_cit_liberal_nationalist').GetName]; [GetIdeology('ideology_rel_modern_moralist').GetName]; [GetIdeology('ideology_mil_antimilitarist').GetName]; [GetIdeology('ideology_fem_benevolent_sexism').GetName]\n#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_christ_dem_pedia_tooltip #bold #gold ChristDemPedia#!#!#!"

 je_bpm_group_popular_democrats_tooltip: "#v Popüler Demokratlar#! (#italic Fransızca: #bold démocrate populaires#!#!), Popüler Demokrat Parti'nin (#italic Fransızca: #bold Parti démocrate populaire, PDP#!#!) çoğunluğunu oluşturan bir tür @ig_christian_democrats! #blue Hristiyan Demokratlardı#!. #v Popüler Demokratlar#!, #bold Marc Sangnier#! ve #bold Marcel Prélot#!'nun siyasi doktrinlerini ve #bold Auguste Champetier de Ribes#!'in siyasi taktiklerini izlediler. Tabanları çok çeşitliydi; en büyük pay #bold %7#! ile el işçilerine, #bold %6#! ile sanayicilere ve #bold %5#! ile çiftçiler ve tüccarlara aitti.\n\n#v Popüler Demokratlar#! siyasi olarak sol, ekonomik olarak merkez-sol ve sosyal olarak merkez-soldu. Çoğunlukla @ig_reactionaries! #purple Ulusal Muhafazakar#! olan #v Action Française#! grubunun #bold 1926 Papalık tarafından kınanmasından#! sonra, birçok muhafazakar ve gerici #gold Katolik#! #bold PDP#!'ye kayarak onu sağa çekti. #v Popüler Demokratlar#!, genel destekte ortalama #bold %5-6#!'ya sahip olmalarına rağmen, yerel düzeyde bile hiçbir güce sahip olmamakla mücadele ettiler; onları rahatsız eden bir başka sorun da sosyal düzeyde somut, özgün bir ideolojinin ve düşüncenin olmamasıydı.\n\nSiyasi olarak, #v Popüler Demokratlar#! erkekler ve kadınlar için [GetLawType('law_universal_suffrage').GetName] yasasını, aile oyunun getirilmesini ve nispi temsili desteklediler; aynı zamanda üniter #gold Üçüncü Fransız Cumhuriyeti#!'nin kapsamlı bir şekilde merkezden uzaklaştırılmasını ve ılımlı #bold Katolik#! politikasını desteklediler. Ayrıca toplumun profesyonel ve sendikal yönünün siyasete dahil edilmesini de desteklediler. 1930'larda bazı #v Popüler Demokratlar#!, [GetLawType('law_organic_democracy').GetName] benzeri bir ‘#bold Korporatif Demokrasi#!’yi desteklediler.\n\nEkonomik olarak, #v Popüler Demokratlar#! devletin kapsamlı müdahalesini desteklediler. #italic İtalyan#! #v Popülercilerine#! benzer şekilde, [GetLawType('law_graduated_taxation').GetName]#yellow orantılı vergi#!, sınırlı [GetLawType('law_protectionism').GetName] ve fabrika işçilerinin katılımını (#italic işçi hisse sahipliği ve kâr paylaşımı#!) desteklediler. Ayrıca ekonominin temel yönlerinin [Concept('concept_nationalize', 'Millileştirilmesini')] desteklediler ve #bold Büyük Buhran#! sırasında, bazen kadınları işgücünden çıkarma pahasına da olsa istihdam planlarını desteklediler. [Concept('concept_welfare_payments', 'Refah')] konusunda, aileye vurgu yapan kapsamlı bir refahı desteklediler.\n\nSosyal olarak, #v Popüler Demokratlar#! militarizmi küçümsemeleri ve I. Dünya Savaşı'ndan sonra ulusların uzlaşmasına destekleriyle karakterize ediliyorlardı. Nispeten enternasyonalisttiler ve genel olarak tüm dünyadaki ulusları birleştirme peşindeydiler. Muhafazakar #gold Katoliklerin#! #bold PDP#!'den ayrılması sırasında, içsel anti-semitizm arttı.\n\nAşağıdaki ideolojiler #v Popüler Demokratları#! mümkün olduğunca yakından temsil etmektedir: [GetIdeology('ideology_gov_liberal_republican').GetName]; [GetIdeology('ideology_exe_strong_dynamic').GetName]; [GetIdeology('ideology_dop_christian_democrat').GetName]; [GetIdeology('ideology_sta_federated_state').GetName]; [GetIdeology('ideology_eco_modern_interventionist').GetName]; [GetIdeology('ideology_wel_expanded_public_welfare').GetName]; [GetIdeology('ideology_cit_christian_internationalist').GetName]; [GetIdeology('ideology_rel_modern_moralist').GetName]; [GetIdeology('ideology_mil_antimilitarist').GetName]; [GetIdeology('ideology_fem_benevolent_sexism').GetName]\n#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_christ_dem_pedia_tooltip #bold #gold ChristDemPedia#!#!#!"

 je_bpm_group_popularists_tooltip: "#v Popülerciler#! (#italic İtalyanca: #bold Popolari#!#!), İtalyan Halk Partisi'nin (#italic İtalyanca: #bold Partito Popolare Italiano, PPI#!#!) çoğunluğunu oluşturan bir tür @ig_christian_democrats! #blue Hristiyan Demokratlardı#!. #v Popülerciler#!, Katolikleri temsil etmeyi ve devleti #bold Popülizm#! (#italic İtalyanca: #bold Popolarismo#!#!) fikirleri doğrultusunda reforme etmeyi amaçlayan #bold Luigi Sturzo#!'nun siyasi doktrinlerini ve #bold Romolo Murri#!'nin öğretilerini izlediler. Tabanları çoğunlukla kırsal kesim işçileri ve çiftçiler, din adamları, kuzey orta sınıfı ve işçileri arasındaydı.\n\n#v Popülerciler#! siyasi olarak sol, ekonomik olarak merkez-sol ve sosyal olarak sol eğilimliydi. Daha #bold Sol#!-eğilimli #v Popülerciler#! genellikle #pink Sosyalistlerle#! siyasi bir ittifaka olumlu bakıyor, daha militan, ekonomik açıdan daha ilerici (#italic işçi katılımı ve refahı konularında#!) davranıyorlardı; en popüler figürleri #bold Achilles Grandi#!, #bold Umberto Tupini#! ve #bold Giovanni Gronchi#! idi. Daha #bold Sağ#!-eğilimli #v Popülerciler#! ise muhafazakar-ılımlı duruşlarıyla karakterize ediliyor, #yellow Liberallerle#! ittifakı tercih ediyor, özel refaha daha büyük vurgu yapıyor, aynı zamanda daha az enternasyonalist ve #gold kadın haklarına#! daha şüpheci yaklaşıyorlardı; en popüler örnekleri #bold Alcide De Gasperi#!, #bold Giovanni Battista Migliori#! ve #bold Stefano Jacini#! idi.\n\nSiyasi olarak #v Popülerciler#!, hem erkekler hem de kadınlar için [GetLawType('law_universal_suffrage').GetName] yasasını, nispi temsili, kamu kurumlarının yerelleşmesini genişletmeyi, #gold Katolikliğin#! devlet için önemini geri getirmeyi ([GetLawType('law_freedom_of_conscience').GetName]) ve sosyal-mesleki bir yönün siyasete dahil edilmesini memnuniyetle karşılamayı destekliyorlardı.\n\nEkonomik olarak, devletin ekonomiye aktif olarak dahil olmasını, [GetLawType('law_graduated_taxation').GetName]#yellow orantılı vergiyi#!, sınırlı [GetLawType('law_protectionism').GetName] yasasını ve fabrika işçilerinin katılımını (#italic işçi hisse sahipliği ve kâr paylaşımı#!) destekliyorlardı. Tarımda [GetLawGroup('lawgroup_land_reform').GetName], kırsal kalkınma ve ‘#bold latifundiaların iç kolonizasyonu#!’ konularına büyük bir vurgu yapılıyordu. Ayrıca hem ulusal hem de uluslararası düzeyde kapsamlı sosyal ve refah yasalarını da destekliyorlardı.\n\n#v Popülerciler#! pasifist ve enternasyonalistti, ırkçılık ve particiliğe karşı güçlü bir küçümsemeyle I. Dünya Savaşı'ndan sonra ulusların uzlaşmasını ve aynı zamanda silahsızlanmayı arzuluyorlardı. #bold Sturzo#!'nun #italic Siyasi Katolik#! [Concept('concept_party', 'Partileri')] birleştirme çabaları sonuçsuz kaldı ve üyelerinin çoğunun gerçek ilgisini çekmedi.\n\nAşağıdaki ideolojiler #v Popülerciler#!'i mümkün olduğunca yakından temsil etmektedir: [GetIdeology('ideology_gov_moderate_monarchist').GetName]; [GetIdeology('ideology_exe_weak_rigid').GetName]; [GetIdeology('ideology_dop_christian_democrat').GetName]; [GetIdeology('ideology_sta_federated_state').GetName]; [GetIdeology('ideology_eco_modern_interventionist').GetName]; [GetIdeology('ideology_wel_expanded_public_welfare').GetName]; [GetIdeology('ideology_cit_christian_internationalist').GetName]; [GetIdeology('ideology_rel_modern_moralist').GetName]; [GetIdeology('ideology_mil_antimilitarist').GetName]; [GetIdeology('ideology_fem_benevolent_sexism').GetName]\n#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_christ_dem_pedia_tooltip #bold #gold ChristDemPedia#!#!#!"

 je_bpm_group_whites_tooltip: "#v Beyazlar#! (#italic İtalyanca: #bold Bianchi#!#!), bazen aşağılayıcı bir şekilde '#bold Beyaz Bolşevikler#!' olarak da adlandırılan, İtalyan Halk Partisi'nin (#italic İtalyanca: #bold Partito Popolare Italiano, PPI#!#!) '#bold Aşırı Sol#!' kanadını oluşturan bir tür Katolik @ig_agrarian_populists! #green Tarımsal Popülistler#! ve ideolojik #pink Sendikacılardı#!. #v Beyazlar#! aynı zamanda PPI'nin @trade_unions! #pink Kent Sendikalarını#! da ifade eder, ancak bu terim köylü partizanlar için çok daha sık ve bazen sadece onlar için kullanılmıştır.\n\n#v Beyazlar#! nispeten geniş bir halk desteğine (#italic 1919'da 930.000 kayıtlı kırsal-işçi sendikacısı#!) sahipti ancak çok az siyasi güce sahip idiler ve çoğu zaman PPI'nin geri kalanıyla çatışma halindeydiler. En popüler figür ve de facto lider #bold Guido Miglioli#! ve ana gazete '#bold L'Azione#!' idi.\n\n#v Beyazlar#! temel olarak [GetLawType('law_universal_suffrage').GetName], [GetLawGroup('lawgroup_land_reform').GetName], pasifizm ile kırsal kalkınma ve refah konularına odaklandılar; tazminatsız toprak reformu, kapsamlı kırsal kalkınma, kooperatiflere destek ve refah önerdiler. #bold Miglioli#! bazen '#bold tarım burjuvazisine#!' karşı toplumsal devrim çağrısında da bulunuyor, çeşitli köylü grevleri ve protestolarına öncülük ediyordu.\n\nAşağıdaki ideolojiler #v Beyazlar#!'ı mümkün olduğunca yakından temsil etmektedir: [GetIdeology('ideology_gov_placeholder').GetName]; [GetIdeology('ideology_dop_christian_democrat').GetName]; [GetIdeology('ideology_sta_minimal_state').GetName]; [GetIdeology('ideology_eco_modern_agrarian').GetName]; [GetIdeology('ideology_wel_expanded_public_welfare').GetName]; [GetIdeology('ideology_cit_liberal_nationalist').GetName]; [GetIdeology('ideology_rel_modern_moralist').GetName]; [GetIdeology('ideology_mil_antimilitarist').GetName]; [GetIdeology('ideology_fem_placeholder').GetName]\n#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_christ_dem_pedia_tooltip #bold #gold ChristDemPedia#!#!#!"

 

 tooltip_bpm_country_secularists_are_popular: "[GetIdeology('ideology_rel_secularist').GetName], [GetIdeology('ideology_rel_radical_secularist').GetName] ve [GetIdeology('ideology_rel_atheist').GetName] [Concept('concept_interest_group', 'Çıkar Gruplarının')] toplam nüfuzunun >=%20'si (şu anda [GetPlayer.MakeScope.ScriptValue('bpm_secularist_popularity')|%])"

 tooltip_bpm_country_moralists_are_popular: "[GetIdeology('ideology_rel_radical_moralist').GetName], [GetIdeology('ideology_rel_moralist').GetName] ve [GetIdeology('ideology_rel_modern_moralist').GetName] [Concept('concept_interest_group', 'Çıkar Gruplarının')] toplam nüfuzunun >=%25'i (şu anda [GetPlayer.MakeScope.ScriptValue('bpm_moralist_popularity')|%]) #v &#! [Concept('concept_state_religion', 'Devlet')] [GetReligion('catholic').GetName] #bold değildir#!"

 rerum_novarum_issued_tooltip: "‘#bold Rerum novarum#!’ yayımlandı"

 je_bpm_group_lidovci_tooltip: "#v Lidovci#! (#italic günlük dilde, #bold lidový#! kelimesinden türetilmiştir ve #bold halkın#!, #bold halka ait#!, #bold popüler#! anlamına gelir#!) #gold Çekoslovakya'daki#! Çekoslovak Halk Partisi'nde (#italic Çekçe: #bold Československá strana lidová, ČSL#!#!) nispi çoğunluğu oluşturan @ig_christian_democrats! #blue Hristiyan Demokratlardı#!. #v Lidovci#! #bold Jan Šrámek#! tarafından yönetiliyordu ve Çekoslovak devletinde #bold Siyasi Katolikliği#! temsil etmeyi, onun #gold Katolik#! köklerini vurgulamayı ve genel olarak #bold Hristiyan Sosyal Öğretilerinden#! esinlenen çeşitli politikaları uygulamayı amaçlıyorlardı. Tabanları çoğunlukla köylüler, işçiler ve zanaatkarlar arasındaydı.\n\n#v Lidovci#! siyasi olarak merkez-sol, ekonomik olarak merkez-sağ ve sosyal olarak merkez-sağdaydı. Genel olarak merkezci olan #v Lidovci#!'nin yanı sıra [concept_party] içinde iki akım daha vardı — @ig_conservatives! #bold Konzervativní Lidovci#! ve @ig_reactionaries! #purple Ulusal Muhafazakarlar#! — birincisi, en önde gelen üyesi #bold Mořic Hruban#! olmak üzere, genel olarak daha muhafazakar-dindar ve siyasi demokrasiye karşı pragmatikti, çok daha fazla dağıtımcıydı ve hatta başlangıçta bağımsızlığın peşinden koşmaya karşı çıkıyordu; ikincisi ise #bold Bohumil Stašek#! liderliğindeydi ve diğer tüm #bold Ulusal Muhafazakarlar#! gibi parlamenter demokrasiye karşı olumsuz bakıyordu ve daha fazla yerelleşme taraftarıydı.\n\nSiyasi olarak, #v Lidovci#! #yellow Erkek#! ve #yellow Kadın#! [GetLawType('law_universal_suffrage').GetName] yasasını, nispi temsili ve subsidiarite (tamamlayıcılık) fikrini uygulamayı ancak [GetLawType('law_unitary').GetName] karakterini korumayı destekliyordu. Ayrıca laikleşmeyle inatla savaştılar ve birçok uzlaşma ve pragmatizm sayesinde tarihsel olarak bunu başardılar (#italic nihai yasa #bold din adamlarına devlet sübvansiyonları sağlayan 1926 yasası#!ydı#!).\n\nEkonomik olarak, #v Lidovci#! küçük ve kooperatif işletmelerini kayırmayı hedefledi, [GetLawType('law_protectionism').GetName] yasasını ve kemer sıkma önlemlerini destekledi, aynı zamanda fabrika işçilerinin katılımını (#italic kâr paylaşımı ve yönetime katılım#!) destekledi. Tarım ve refah konusunda, Kilise mülkiyeti hakkındaki iç gerilimlerle birlikte, tazminatlı [GetLawGroup('lawgroup_land_reform').GetName] yasasını desteklediler; bunun yanında sigorta, emeklilik veya düzenlemeler olsun kapsamlı sosyal mevzuatı da desteklediler.\n\n#v Lidovci#!, ağırlıklı olarak #bold Çek-Moravya#! karakterleri ve #bold Çekoslovakizm#! inançları nedeniyle, #bold Slovakların#! özerkliğine ve tanınmasına karşıydılar ve bağımsızlık konusunda genellikle milliyetçiydiler. Ayrıca bağımsızlığı ve savunma yeteneğini sağlamak için tüm devlet askeri önlemlerini desteklediler.\n\nAşağıdaki ideolojiler #v Lidovci#!'yi mümkün olduğunca yakından temsil etmektedir: [GetIdeology('ideology_gov_liberal_republican').GetName]; [GetIdeology('ideology_exe_strong_dynamic').GetName]; [GetIdeology('ideology_dop_christian_democrat').GetName]; [GetIdeology('ideology_sta_federated_state').GetName]; [GetIdeology('ideology_eco_distributist_economy').GetName]; [GetIdeology('ideology_wel_expanded_public_welfare').GetName]; [GetIdeology('ideology_cit_multiethnic_nationalist').GetName]; [GetIdeology('ideology_rel_modern_moralist').GetName]; [GetIdeology('ideology_mil_patriotic_liberal').GetName]; [GetIdeology('ideology_fem_benevolent_sexism').GetName]\n#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_christ_dem_pedia_tooltip #bold #gold ChristDemPedia#!#!#!" 

 je_bpm_group_chadecy_tooltip: "#v Chadecy#! (#italic günlük dilde, #bold Chrześcijańska Demokracja#! — Hristiyan Demokrasi kelimelerinin kısaltması olan #bold ChD#! akroniminden gelir#!) #gold Polonya'daki#! @ig_christian_democrats! #blue Hristiyan Demokratlardı#! ve büyük çoğunlukları Polonya Hristiyan Demokrasi Partisi'ndeydi (#italic Polonyaca: #bold Polskie Stronnictwo Chrześcijańskiej Demokracji, PSChD#!#!). Onların Hristiyan Demokrasisi biçimi, kendi ülkelerinde meydana gelen çeşitli durumlara ve olaylara büyük ölçüde bağlıydı ve #bold Büyük Buhran'ın#! başlangıcı bir dönüm noktası olmak üzere dönemden döneme önemli ölçüde farklılık gösteriyordu. Bu nedenle, Büyük Buhran öncesi ve Buhran sırası ve 'sonrası' (çünkü etkileri aslında hiçbir zaman tam olarak sona ermedi) olmak üzere iki döneme ayrılacaklardır. Tabanları çoğunlukla Silezyalı işçiler, varlıklı kırsal işçiler ve çoğunlukla Prusya bölünmesinden gelen orta sınıf arasındaydı.\n\n#v 1930 Öncesi Chadecy:#!\n#v Chadecy#! siyasi olarak sol, ekonomik olarak sağ ve sosyal olarak merkez-sağdaydı.\n\nSiyasi olarak [GetLawType('law_universal_suffrage').GetName] yasasını desteklediler ve bir Hristiyan Demokrasisi inşa etmeyi amaçladılar, [GetLawType('law_womens_suffrage').GetName] yasasını desteklediler, dinsel ahlakçı bir yapıya sahiptiler ve laik devleti reddettiler, boşanmaya karşı çıktılar ve ademi merkeziyetçiliği (yerelleşmeyi) destekleyip federalleşmeden bahsettiler. Ayrıca başkanın yetkilerinin artırılmasına vurgu yaptılar ve Senato'nun ekonomik odaklı olmasını desteklediler.\n\nEkonomik olarak çelişkiler ve genel ifadelerle doluydular. ‘#bold Rerum novarum#!’ fikirleri doğrultusunda servetin yeniden dağıtımını desteklediler, ancak aynı zamanda kendilerini ‘#bold mahveden#!’ ‘#bold büyük işletmeler#!’ üzerindeki aşırı vergilendirmeye de karşı çıktılar. ‘#bold İşçilerin haklarının verilmesini#!’ (#italic zanaatkar üretime tam dönüş#!) desteklediler ancak aynı zamanda ‘#bold sosyo-ekonomik bir sistem olarak devletçiliğe#!’ de karşıydılar. Ayrıca kemer sıkma politikalarını, dine güçlü bir vurgu yapan sosyal mevzuatı ve toprak reformunu desteklediler.\n\nPolonya ulusunun diğerleri üzerindeki önemini ve üstünlüğünü vurguladılar, ancak ‘#bold ulusal kültür#!’ için tehlikeli gördükleri Yahudiler hariç azınlıklara saygı duydular. Ayrıca temel olarak modern, savunma odaklı bir ulusal orduyu desteklediler.\n\nAşağıdaki ideolojiler (#italic 1930 Öncesi#!) #v Chadecy#!'yi mümkün olduğunca yakından temsil etmektedir: [GetIdeology('ideology_gov_liberal_republican').GetName]; [GetIdeology('ideology_exe_strong_dynamic').GetName]; [GetIdeology('ideology_dop_christian_democrat').GetName]; [GetIdeology('ideology_sta_federated_state').GetName]; [GetIdeology('ideology_eco_distributist_economy').GetName]; [GetIdeology('ideology_wel_distributist_welfare').GetName]; [GetIdeology('ideology_cit_multiethnic_nationalist').GetName]; [GetIdeology('ideology_rel_modern_moralist').GetName]; [GetIdeology('ideology_mil_patriotic_liberal').GetName]; [GetIdeology('ideology_fem_benevolent_sexism').GetName]\n\n#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_group_chadecy_2_tooltip #bold #grey İkinci Sayfa#!#!#!\n#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_christ_dem_pedia_tooltip #bold #gold ChristDemPedia#!#!#!"

 je_bpm_group_chadecy_2_tooltip: "#v 1930 Sonrası Chadecy:#!\n#v Chadecy#! siyasi olarak sol, ekonomik olarak sol ve sosyal olarak merkezde yer alıyordu.\n\nDünya çapındaki radikalleşme ve #gold Polonya'daki#! artan otoriterlik ile birlikte #v Chadecy#! siyasi konularda daha ilerici hale geldi. Hala #yellow Evrensel#! ve #yellow Kadınların Oy Hakkını#! destekliyor, yerelleşmeye daha da güçlü bir vurgu yapıyor, tam bir [GetLawType('law_freedom_of_conscience').GetName] özgürlüğünü, kişisel hakları ve otoriter olmayan demokrasiye dönüşü destekliyorlardı.\n\nEkonomik olarak, kesinlikle yıkıcı olan #v Büyük Buhran#! nedeniyle daha da geliştiler ve giderek daha fazla anti-kapitalist, 'sol' konumlara doğru radikalleştiler (Elbette, aşağıdaki önerileri hemen desteklemediler, ancak nihai sonuç #bold 1937#! yılındaki #v Stronnictwo Pracy#! programı olacak şekilde yavaş yavaş bu konumlara geçtiler). Tam bir '#bold sosyo-ekonomik demokratikleşmeyi#!', kooperatifleşmeyi ve sosyalleşmeyi, ihtiyatlı düzenleyici ekonomiyi, artan oranlı vergilendirmeyi ve refahı desteklediler. Özel mülkiyetin '#bold ülke çapında ekonomik plana#!' yardımcı olmak için güçlü bir şekilde sınırlandırıldığı, '#bold #tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_group_chadecy_3_tooltip yapılandırılmış bir [GetLawType('law_command_economy').GetName]#!#!' önerdiler. [Concept('concept_nationalize', 'Millileştirme')] veya mülkiyeti '#bold özyönetimlere veya sosyal derneklere#!' devretme yoluyla, '#bold Ulusun ekonomik hayatı veya savunması için büyük önem taşıyan#!' işletmeleri ve sahibinin öneminin çok küçük olduğu ve '#bold uygun koşulların olgunlaşmasıyla#!' büyümediği '#bold büyük anonim şirketleri ve onların şubelerini#!' devralmayı planladılar. Orta ve küçük işletmelerin çoğunlukla özel tutulması amaçlandı. Ayrıca toprak reformunu ve eğitim ve modernizasyona vurgu yaparak kırsal kesimin '#bold iyileştirilerek yeniden inşasını#!' desteklediler.\n\nMilliyetçilikleri, ekonomik, sosyal ve siyasi-ahlaki gerekçelerle güçlenen anti-semitizmleri dışında pek değişmedi. Ayrıca bir Slav federasyonuna destek de içlerinde büyük ölçüde arttı. Ordu konusundaki duruşları ise neredeyse hiç değişmedi.\n\nAşağıdaki ideolojiler (#italic 1930 Sonrası#!) #v Chadecy#!'yi mümkün olduğunca yakından temsil etmektedir: [GetIdeology('ideology_gov_liberal_republican').GetName]; [GetIdeology('ideology_exe_strong_dynamic').GetName]; [GetIdeology('ideology_dop_christian_democrat').GetName]; [GetIdeology('ideology_sta_federated_state').GetName]; [GetIdeology('ideology_eco_centralized_economy').GetName]; [GetIdeology('ideology_wel_expanded_public_welfare').GetName]; [GetIdeology('ideology_cit_multiethnic_nationalist').GetName]; [GetIdeology('ideology_rel_modern_moralist').GetName]; [GetIdeology('ideology_mil_patriotic_liberal').GetName]; [GetIdeology('ideology_fem_benevolent_sexism').GetName]\n#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_christ_dem_pedia_tooltip #bold #gold ChristDemPedia#!#!#!"

 je_bpm_group_chadecy_3_tooltip: "#bold #v Chadecy#!, bir [GetLawType('law_command_economy').GetName] yasasına destek veren tek @ig_christian_democrats! #blue Hristiyan Demokratlardır#!.#!"


 je_bpm_group_krikscionys_demokratai_tooltip: "#v Krikščionys Demokratai#! (#italic kelimenin tam anlamıyla #bold Hristiyan Demokratlar#! demektir#!) Litvanya Hristiyan Demokrat Partisi'nin (#italic Litvanca: Lietuvos krikščionių demokratų partija, #bold LKDP#!#!) çoğunluğunu oluşturan @ig_christian_democrats! #blue Hristiyan Demokratlardı#!. #v Krikščionys Demokratai#! #bold Mykolas Krupavičius#! tarafından yönetiliyordu ve #gold Litvanya'yı#! Katolik köklerine yönlendirmeyi ve tarımsal karakterini genişletmeyi amaçlıyorlardı. Tabanları çoğunlukla Katolik entelijansiyası ve orta sınıf arasındaydı.\n\n#v Krikščionys Demokratai#! siyasi, ekonomik ve sosyal olarak sağ kanattaydı. #v Krikščionys Demokratai#!'nin iki yakın müttefiki vardı: Esas olarak ekonomik [GetLawType('law_interventionism').GetName] ve [Concept('concept_welfare_payments', 'Refah')] konularına odaklanan #v İşçiciler (Laborists)#! (#italic Litvanya Emek Federasyonu'ndan — Lietuvos darbo federacija, #bold LDF#!#!). Onların tabanı çoğunlukla kırsal işçiler ve muhafazakar işçilerden oluşuyordu; Çoğunlukla renkli bir #bold kırsal kalkınma#! ve #bold modernleşme#! üzerine odaklanan #v Çiftçiler#! (#italic Çiftçiler Birliği'nden — Ūkininkų sąjunga, #bold ŪS#!#!). Onların tabanı ise çoğunlukla muhafazakar köylüler ve çiftçilerdi.\n\nSiyasi olarak, #v Krikščionys Demokratai#! hem erkekler hem de kadınlar için [GetLawType('law_universal_suffrage').GetName] yasasını, nispi temsili ve yerelleşmeyi destekledi; ayrıca #gold Katolikliği#! siyasi yaşamın her alanında büyük ölçüde güçlendirmek istediler. Yerelleşmeci ve demokratik olmalarına rağmen #v Krikščionys Demokratai#! otoriterdi; siyasi düşmanlarıyla savaşmak için güçlü [GetLawType('law_censorship').GetName] yasası ve sıkıyönetimi kullandılar; ayrıca yürütmeyi güçlü tutmak ve parlamentoyu sınırlamak istediler.\n\nEkonomik olarak, öncelikli hedefleri olan [GetLawGroup('lawgroup_land_reform').GetName], büyük kırsal kalkınma, küçük çiftçilerin ve ticaretin güçlendirilmesi ile devletin ekonomiye dahil olmasını desteklediler; ayrıca [GetLawType('law_protectionism').GetName] yasasını ve daha yüksek vergilendirmeyi de desteklediler. Refah açısından, dini boyutunu güçlendirmek istediler ve devlet desteğinin de buna göre yönlendirilmesini amaçladılar.\n\n#v Krikščionys Demokratai#! etno-milliyetçiydiler, Litvanya'yı sadece Litvanyalılardan oluşan bir ulus yapmayı amaçlıyorlardı; özellikle #bold Yahudi#! ve #bold Polonyalı#! azınlıklara düşmandılar ve ikincisine verilen her türlü desteği '#bold Litvanya'nın Polonyalılaştırılması#!' olarak suçluyorlardı. Orduyla ilgili olarak, bağımsızlığın ilk zamanlarında, devleti savunmak ve genişletmek için çok daha seferber edilmiş bir [Concept('concept_country', 'Devlet')] yapısını desteklediler. Savaşlardan sonra savunma amaçlı bir orduyu tercih ettiler, ancak çeşitli koşullar ve #bold Vilnius'un#! kaybı nedeniyle #gold Polonya'ya#! karşı düşmanca tutumlarını sürdürdüler.\n\nAşağıdaki ideolojiler #v Krikščionys Demokratai#!'yi mümkün olduğunca yakından temsil etmektedir: [GetIdeology('ideology_gov_liberal_republican').GetName]; [GetIdeology('ideology_exe_strong_dynamic').GetName]; [GetIdeology('ideology_dop_conservative_democrat').GetName]; [GetIdeology('ideology_sta_powerful_state').GetName]; [GetIdeology('ideology_eco_modern_agrarian').GetName]; [GetIdeology('ideology_wel_distributist_welfare').GetName]; [GetIdeology('ideology_cit_ethnonationalist').GetName]; [GetIdeology('ideology_rel_modern_moralist').GetName]; [GetIdeology('ideology_mil_patriotic_liberal').GetName]; [GetIdeology('ideology_fem_benevolent_sexism').GetName]\n#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_christ_dem_pedia_tooltip #bold #gold ChristDemPedia#!#!#!"

 je_bpm_group_catholics_tooltip: "#v YAKINDA!#! (#italic :OMUZ-SİLKEN-ADAM:#!)\n\nAşağıdaki ideolojiler #v İsviçreli Katolik Muhafazakarları#! mümkün olduğunca yakından temsil etmektedir: [GetIdeology('ideology_gov_liberal_republican').GetName]; [GetIdeology('ideology_exe_strong_dynamic').GetName]; [GetIdeology('ideology_dop_conservative_democrat').GetName]; [GetIdeology('ideology_sta_powerful_state').GetName]; [GetIdeology('ideology_eco_distributist_economy').GetName]; [GetIdeology('ideology_wel_distributist_welfare').GetName]; [GetIdeology('ideology_cit_multiethnic_nationalist').GetName]; [GetIdeology('ideology_rel_modern_moralist').GetName]; [GetIdeology('ideology_mil_patriotic_liberal').GetName]; [GetIdeology('ideology_fem_benevolent_sexism').GetName]\n#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_christ_dem_pedia_tooltip #bold #gold ChristDemPedia#!#!#!"

 
 
