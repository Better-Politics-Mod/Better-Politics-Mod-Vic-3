 ig_confessional_conservatives:0 "宗派保守主义者"
 ig_confessional_conservatives_desc:0 "$ig_conservatives_desc$"
 ig_christian_democrats_rightwing:0 "基督教民主主义者（右派）"
 ig_christian_democrats_rightwing_desc:0 "基督教民主主义思想的右翼总体上比其余派别更为温和、更为虔诚。其审慎的温和可以表现为限制选举权和社会经济立法，也可以表现为教权主义和宗教福利。例证包括意大利平民主义者（右派）、捷克保守利德维派、奥地利市民派以及比利时的#italic 德布罗克维尔#!内阁。"
 ig_classical_conservatives:0 "古典保守主义者"
 ig_classical_conservatives_desc:0 "$ig_conservatives_desc$"
 ig_conservative_catholics:0 "保守天主教徒"
 ig_conservative_catholics_desc:0 "保守天主教徒是意大利人民党内部代表该党右翼的一个派系。以教权主义为特征，他们内部又分为独裁派与有机派两个流派。他们最终分裂出去，加入了国家法西斯党。"
