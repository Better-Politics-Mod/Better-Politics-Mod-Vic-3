 je_bpm_new_imperialism_reason:0 "随着国家终于从内战余波中恢复过来，永恒的战鼓再次擂响。新一轮的昭昭天命如今披上了市场与产业的话语外衣。伤口已结痂，哥伦比亚如今必须重返扩张边疆的征程。\n\n伴随着新的扩张冲动，也出现了再次召开国际货币会议的呼声。这些会议常在美国内战之后召开，试图遏制国际市场上复本位制稳定性的持续下滑。最终，列强之间在对外贸易上的竞争意味着从未达成任何协议。如今，我国处于独特的安全地位，或许能够组织一场新的国际货币会议，最终解开国际货币政策这一戈尔迪之结。\n\n要成功组织一场国际货币会议，我们需要以下国家的认可：\n\n大不列颠\n法国或德国\n法国或西班牙\n德国或俄国\n奥地利或意大利\n奥地利或土耳其"
 bpm_mexican_destiny:0 "昭昭天命：西进"
 bpm_mexican_destiny_desc:0 "我们伟大的国家注定要横跨整个大陆。让我们向太平洋进军！"
 bpm_canadian_destiny:0 "昭昭天命：北上"
 bpm_canadian_destiny_desc:0 "我们伟大的国家注定要横跨整个大陆。让我们把这片土地从不列颠的暴政中解放出来！"
 bpm_caribbean_destiny:0 "昭昭天命：南下"
 bpm_caribbean_destiny_desc:0 "我们伟大的国家注定要横跨整个大陆。让我们终结拉丁帝国主义的最后残余！"
 bpm_rec_institutional_one:0 "掌控行政权"
 bpm_rec_institutional_one_desc:0 "行政部门在捍卫非裔美国人方面行动不够果断。我们必须通过《任期法》，确保行政部门的官员能够在不受总统免职威胁的情况下开展工作"
 bpm_rec_institutional_two:0 "限制司法管辖权"
 bpm_rec_institutional_two_desc:0 "司法部门正在质疑我们实施重建措施的权威。我们必须中止最高法院在南方占领区审理人身保护令案件的权力，以使法院就范"
 bpm_rec_institutional_three:0 "终结行政至上"
 bpm_rec_institutional_three_desc:0 "行政部门在捍卫非裔美国人方面行动不够果断。我们必须像挥动马鞭一样运用我们的弹劾权，确保总统服从立法部门的意志"
 bpm_rec_institutional_four:0 "焚毁司法防火墙"
 bpm_rec_institutional_four_desc:0 "司法部门正在质疑我们实施重建措施的权威。我们必须纠正杰斐逊的失误，将最高法院彻底置于人民意志之下。必要时我们将把他们全部弹劾"
 bpm_western_monroe:0 "新帝国主义：太平洋霸权"
 bpm_western_monroe_desc:0 "为确保进入中国市场的通道和太平洋海岸的安全，我们必须解放墨西哥北部和菲律宾群岛，以建立我们的海军基地！"
 bpm_northern_monroe:0 "新帝国主义：西北航道"
 bpm_northern_monroe_desc:0 "为确保半球免遭欧洲入侵并宣称对理论中的西北航道的主权，我们必须征服北极以建立海军基地！"
 bpm_southern_monroe:0 "新帝国主义：特万特佩克地峡通洋走廊"
 bpm_southern_monroe_desc:0 "为确保中美洲免遭欧洲殖民并在大西洋与太平洋之间开辟更快的通道，我们必须征服特万特佩克地峡以建立海军基地！谁知道呢，我们甚至还能开凿一条运河！"
