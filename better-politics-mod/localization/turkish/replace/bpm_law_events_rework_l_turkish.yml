 education_laws.2.t:0 "Vatansever Eğitim"
 education_laws.2.d:0 "Yeni [SCOPE.sLaw('current_law_scope').GetName] içinde vatanseverliğin rolü, [SCOPE.gsInterestGroup('armed_forces_ig').GetName] tarafından bu yeni eğitim sistemi planlarında geliştirilmesi gereken bir alan olarak gündeme getirildi."
 education_laws.2.f:0 ""Bu sadece bilginin aktarılabilmesi için düzenli bir sınıf sağlamakla ilgili değildir; karakter aşılamakla ilgilidir. Ne de olsa, onları dürüst ve namuslu vatandaşlar olarak yetiştirmek için ellerinden geleni yapan bu çocukların ebeveynleri tarafından bize muazzam bir sorumluluk verildi. Çok sık olarak, kural tanımaz bir gençlik tarafından karakteri neredeyse geri dönülemez bir şekilde mahvedilmiş ve ülkesine karşı hiçbir sevgi beslemeyen çocuklarla karşılaşıyoruz. Böyle olmak zorunda değil!""
 education_laws.2.a:0 "Müfredatımızda buna yer yok."
 education_laws.2.b:0 "Kişinin ülkesine duyduğu sevgiyi aşılamak her şeyden önemlidir."
