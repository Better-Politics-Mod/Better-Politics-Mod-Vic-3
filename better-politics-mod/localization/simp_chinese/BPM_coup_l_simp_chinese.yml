l_simp_chinese:
 coup.6.t:0 "军中异动"
 coup.6.d:0 "[SCOPE.sCharacter('coup_leader').GetFullName] 长期以来一直在军中积聚可观的权力，而如今我们的政府正面临大范围的动荡，[SCOPE.sCharacter('coup_leader').GetHerHis] 的魅力与政治手腕已经开始渗透整个社会。我们现在听到了军官中有人在密谋的令人不安的耳语。"
 coup.6.f:0 "你是我的下属，还是我的敌人？若你是我的下属，就应服从我的命令。若你是我的敌人，就应毫不犹豫地杀了我。\n\n——蒋介石，1936 年"
 coup.6.a:0 "我们能做些什么吗？"
 coup.6.b:0 "对 [SCOPE.sCharacter('coup_leader').GetFullName] 严加盯防。"
 bpm_coup_leader_changed:0 "[SCOPE.gsInterestGroup('coup_ig').GetName] 的领袖已经更换"
