l_simp_chinese:
 bpm_patcon_split.1.t:0 "家长式保守派"
 bpm_patcon_split.1.d:0 "国家的力量源自人民的力量，而对人民负责者，理应照料他们的共同福祉。\n\n也就是说，这是新一批逐渐主导保守运动的@ig_conservatives! #blue 家长式保守派#!的主张，他们承诺保护同胞免受现代世界的残酷。而那些不愿现代化的人，则沦落为@ig_reactionaries! 反动派，作为他们贵族往昔的最后堡垒。"
 bpm_patcon_split.1.f:0 "我一向把劳动阶级的利益视为国家最根本的保守利益。对我而言，劳工的权利始终与财产的权利一样神圣，而我始终认为，最为关心一个国家之稳定乃至荣耀的，正是广大的民众。\n\n——本杰明·迪斯雷利，1867年"
 bpm_patcon_split.1.a:0 "人民会有饭吃的！"
