l_turkish:
  
  je_south_american_national_identity_emergence_reason: "[ROOT.GetCountry.GetName] adlı ulusumuzun İspanya'dan bağımsızlığını kazanması, ülke çapında milliyetçilik kıpırdanmalarına yol açtı. Ulusumuz geleceğe doğru ilerlerken, entelektüellerimiz tamamen ve sadece [SCOPE.sCulture('new_national_culture').GetName] kültürüne özgü yeni bir kimlik oluşturmaya çalışıyorlar.\n\nAşağıdaki koşullar, #bold ulusal kimliğimizi#! geliştirme sürecine fayda sağlayacaktır:\n• [GetLawType('law_repeatable_culture_promote_patriotic_values').GetName] destekçisi olan ve [concept_in_government] (hükümette) bulunan veya yüksek [concept_clout] (nüfuz) sahibi [Concept('concept_interest_group','$concept_interest_groups$')]\n• Yüksek [concept_war_support] (savaş desteği) ile devam eden [Concept('concept_war','$concept_wars$')]\n• Yüksek [concept_occupancy] (doluluk) oranına sahip [GetBuildingType('building_university').GetName], [GetBuildingType('building_art_academy').GetName] ve [GetBuildingType('building_government_administration').GetName] binaları\n• Yüksek ulusal [concept_prestige] (prestij)\n• [SCOPE.sCulture('old_national_culture').GetName] kültürüne ait olmayan [Concept('concept_homeland','$concept_homelands$')] (anayurt) bölgelerine sahip olmamak\n• [GetLawType('law_repeatable_culture_promote_patriotic_values').GetName] yasasının yürürlüğe girmesi\n\nBu #bold ulusal uyanışın#! önümüzdeki ay #tooltippable;tooltip:[Country.GetTooltipTag],je_south_american_national_identity_emergence_special_tooltip [Country.MakeScope.Var('national_identity_progress_var_next').GetValue|+=]#! oranında ilerlemesi bekleniyor.\n\n@warning! Bu [concept_journal_entry] kaydını tamamlamak, [ROOT.GetCountry.GetName] adlı ulusumuzun #bold daha büyük pan-ulusal hedefler#! peşinde koşmasını engelleyecektir."
  je_south_american_national_identity_emergence_special_tooltip: "Bu oran aşağıdakiler tarafından belirlenir:\n[GetLawType('law_repeatable_culture_promote_patriotic_values').GetName] destekçisi [Concept('concept_interest_group','$concept_interest_groups$')] gruplarının [concept_clout] (nüfuz) oranından #variable [Country.MakeScope.Var('national_identity_progress_from_igs').GetValue|+=]#!\nDevam eden [Concept('concept_war','$concept_wars$')] kaynaklı #variable [Country.MakeScope.Var('national_identity_progress_from_wars').GetValue|+=]#!\n[GetBuildingType('building_university').GetName], [GetBuildingType('building_art_academy').GetName] ve [GetBuildingType('building_government_administration').GetName] binalarından #variable [Country.MakeScope.Var('national_identity_progress_from_universities').GetValue|+=]#!\n[concept_prestige] (prestij) kaynaklı #variable [Country.MakeScope.Var('national_identity_progress_from_prestige').GetValue|+=]#!\n[Concept('concept_primary_cultures','$concept_primary_culture$')] olmayan [Concept('concept_homeland','$concept_homelands$')] bölgelerine sahip olmaktan #variable [Country.MakeScope.Var('national_identity_progress_from_homelands').GetValue|+=]#!\n[GetLawType('law_repeatable_culture_promote_patriotic_values').GetName] yasasından #variable [Country.MakeScope.Var('national_identity_progress_from_law').GetValue|+=]#!\nDiğer etkilerden #variable [Country.MakeScope.Var('national_identity_progress_var_add').GetValue|+=]#!"

  TRIGGER_POLITICAL_MOVEMENT_SUPPORT: "Destek $COMPARATOR$ #variable $NUM|%0$#!"
  TRIGGER_POLITICAL_MOVEMENT_SUPPORT_NOT: "Destek $COMPARATOR$ #variable $NUM|%0$#! #bold değil#!"
 
  TRIGGER_POLITICAL_MOVEMENT_RADICALISM: "Radikalizm $COMPARATOR$ #variable $NUM|%0$#!"
  TRIGGER_POLITICAL_MOVEMENT_RADICALISM_NOT: "Radikalizm $COMPARATOR$ #variable $NUM|%0$#! #bold değil#!"