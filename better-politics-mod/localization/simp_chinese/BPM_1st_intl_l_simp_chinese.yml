l_simp_chinese:
 bpm_1st_intl.1.t:0 "第一国际"
 bpm_1st_intl.1.d:0 "早期的@ig_socialists! 社会主义运动并非从某个统一的传统中发展而来，而是由种种各具特色的哲学汇聚而成的一锅大杂烩，全都模糊地指向一个激进的目标。到了19世纪中叶，所有参与者都清楚地认识到，这种拼凑式的运动格局难以为继。于是，#pink 国际工人协会#!——后世追称为#pink 第一国际#!——作为团结世界各地形形色色社会主义的首次认真尝试而成立。"
 bpm_1st_intl.1.f:0 "他们拥有一个成功的要素——人数众多；但唯有团结协作、由知识加以领导，人数才能在天平上占得分量。过去的经验已经表明，若忽视那本应存在于各国工人之间的兄弟情谊之纽带，不激励他们在争取解放的一切斗争中坚定地相互扶持，其零散的努力必将因共同的失败而遭到惩罚。\n\n——卡尔·马克思，1864年"
 bpm_1st_intl.1.a:0 "我们且留意此事。"
 bpm_1st_intl.1.b:0 "我看上去像在乎吗？#pink （跳过事件链）#!"
 bpm_1st_intl.2.t:0 "红与黑"
 bpm_1st_intl.2.d:0 "#pink 第一国际#!的成员来自形形色色的传统，其团结程度并不如某些人所希望的那样。他们的分歧大体汇聚为两大派别：以蒲鲁东和巴枯宁为主要领袖的@ig_anarchists! 无政府主义者，以及被无政府主义者称为@ig_socialists! 国家社会主义者的那一派，其中包括马克思主义者、欧文主义者、布朗基主义者，以及各个受压迫民族的共和民族主义者。他们既相互合作，又彼此展开激烈的论战，其争端威胁着这一联盟本身的存续。"
 bpm_1st_intl.2.f:0 "唯有当国际获得解放，唯有当它不让自己分裂为两个集团——一个人数众多的大多数沦为一个受过教育的少数派的盲目工具——之时，国际才能成为解放人民的武器。正因为如此，它的首要职责，就是把社会主义的科学、哲学和政策印刻到其成员的心中。\n\n——米哈伊尔·巴枯宁，1869年"
 bpm_1st_intl.2.a:0 "煽动者内部不和？很好！"
 bpm_1st_intl.2b.t:0 "我们的社会主义者分裂了！"
 bpm_1st_intl.2b.d:0 "@ig_socialists! 社会主义者不再只是一群高谈阔论、杂乱无章的知识分子。如今他们既已取得些许政治权力的表象，他们的分歧也变得愈发明显，各地的集会如今都被关于威权主义与国家的论争所主导。@ig_anarchists! 无政府主义者作为一个格外反威权的派别崭露头角，并开始建立自己的组织。"
 bpm_1st_intl.2b.f:0 "这一革命联盟排斥任何专政观念以及任何掌控和指挥性的权力。然而，为了建立这一革命联盟，并为了革命战胜反动，思想的统一与革命行动的统一必须在民众的无政府状态之中找到一个器官，它将成为革命的生命与活力。这个器官应当就是国际兄弟会的秘密而普遍的协会。\n\n——米哈伊尔·巴枯宁，1869年"
 bpm_1st_intl.2b.a:0 "我明白了。"
 bpm_1st_intl.3.t:0 "无政府主义者"
 bpm_1st_intl.3.d:0 "即便在内部，早期社会主义运动中的@ig_anarchists! 无政府主义者也远非一条统一战线。无政府主义的两大主流分别由蒲鲁东和巴枯宁所代表：前者的互助主义提倡一个自由交换的社会，后者的集体主义则推动彻底废除私有财产。\n\n在实践中，他们主要关心的是反对等级森严的政党纪律，主张自由而有机的联合，同时强调直接行动的价值。"
 bpm_1st_intl.3.f:0 "不是像国家所企图的那样，从上层到下层，无视因职业差异而产生的利益差异，把一种表面上的统一与秩序强加于人类社会。恰恰相反，国际是自下而上地组织群众，以群众的社会生活、他们的真实诉求为出发点，鼓励他们按照自己在社会中真实的利益结成团体。\n\n——米哈伊尔·巴枯宁，1869年"
 bpm_1st_intl.3.a:0 "那他们的对手呢？"
 bpm_1st_intl.4.t:0 "政党社会主义者"
 bpm_1st_intl.4.d:0 "#pink 第一国际#!的另一方由一群形形色色的@ig_socialists! 社会主义者组成，被无政府主义者轻蔑地称为“国家主义者”。与@ig_anarchists! 无政府主义者不同，他们试图参与资产阶级政治以及经济斗争，要么为了实现改革，要么为了推进阶级意识以利于未来的革命。\n\n对于“国家主义者”中更为激进的成员而言，这一名称是诽谤性的绰号。他们固然反对无政府主义本身，却也把废除国家视为社会主义的必要目标。更准确地说，他们与无政府主义者最大的区别在于对政党的偏好。"
 bpm_1st_intl.4.f:0 "永远不要以为让工人进入议会是微不足道的小事。若有人扼杀他们的声音，或把他们逐出议会，种种报复与压迫将对人民产生深远的影响。反之，如果他们能像倍倍尔和李卜克内西那样站在议会的讲坛上发言，全世界都会倾听他们。\n\n——卡尔·马克思，1871年"
 bpm_1st_intl.4.a:0 "放马过来吧！"
 bpm_1st_intl.5.t:0 "转折点"
 bpm_1st_intl.5.d:0 "在与无政府主义者的多次交锋过程中，@ig_socialists! 社会主义者似乎发现了证据，表明有一个秘密的@ig_anarchists! 无政府主义“联盟”在#pink 国际#!内部活动。他们声称，这种宗派主义威胁到#pink 国际#!的完整性，并违反了其创立规则。\n\n另一方面，也有人认为，这不过是出于纯粹的意识形态原因而排挤@ig_anarchists! 无政府主义者的一个借口罢了。"
 bpm_1st_intl.5.f:0 "那个将宗派的复兴视为一大进步的联盟，其本身便是它们时代已终结的决定性证明：因为即便这些宗派最初含有进步的成分，这个跟在“没有《古兰经》的穆罕默德”身后的联盟纲领，也不过是一堆辞藻华丽、早已死去的观念，只能用来吓唬资产阶级的傻瓜，或者充当波拿巴派及其他检察官用来对付国际成员的证据。\n\n——卡尔·马克思，1872年"
 bpm_1st_intl.5.a:0 "政治是冷酷无情的。"
 bpm_1st_intl.6.t:0 "决议"
 bpm_1st_intl.6.d:0 "围绕@ig_anarchists! 无政府主义者秘密“联盟”的风波已经发展到了顶点。一群激进的@ig_socialists! 社会主义者提出了一系列决议，其中包括宣告成立无产阶级政党的必要性，并以#pink 国际#!内部的宗派主义为由驱逐@ig_anarchists! 无政府主义者。这些决议能通过吗？\n\n#gold （这一选择会影响@ig_anarchists! 无政府主义者与@ig_socialists! 社会主义者进行国际合作的意愿。）#!"
 bpm_1st_intl.6.f:0 "在同有产阶级的集体权力作斗争时，工人阶级唯有把自己组织成一个政党，一个区别于并反对一切由有产阶级组成的旧政党的政党，才能作为一个阶级来行动。\n\n——第七条甲款，海牙代表大会，1872年"
 bpm_1st_intl.6.a:0 "决议通过。（史实）"
 bpm_1st_intl.6.b:0 "决议未获通过。"
