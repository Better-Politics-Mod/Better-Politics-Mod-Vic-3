national_awakening.1.t: "[SCOPE.sCulture('primary_culture_scope').GetNameNoFormatting] Uyanışı"
national_awakening.1.d: "[ROOT.GetCountry.GetAdjective] devletinin ulusal coşkuyu teşvik etme çabaları kültürel bir rönesansa yol açtı. [SCOPE.sState('rural_state').GetName] bölgesindeki en ücra köylerde bile, vatandaşlarımız artık [SCOPE.sCulture('primary_culture_scope').GetName] ulusunun bir parçası olarak yerlerini anlıyorlar."
national_awakening.1.f: "Nüfus memuru kulübenin kapısının açılışını izledi. Şimdiye kadar ziyaret ettiği en ücra köydü burası; iki atın ve tek bir dolambaçlı yolun bulunduğu bir yer. Kapıda duran bir adam, onun pirinç düğmelerini görünce net bir şekilde selam verdi.\n\n"Adın nedir?"\n\nKapıdaki adam, "[SCOPE.sCharacter('relevant_character').GetFullNameNoFormatting]," diye cevap verdi.\n\n"Peki nerelisin?"\n\n"Ben bir [SCOPE.sCulture('primary_culture_scope').GetNameNoFormatting] vatandaşıyım beyim, tıpkı babam ve ondan önceki babası gibi.""
national_awakening.1.a: "Çok yaşa [SCOPE.sCulture('primary_culture_scope').GetNameNoFormatting] halkı!"
national_awakening.1.b: "Büyük bir ulus, büyük bir orduyu hak eder."

modifier_fervour_military_bonus: "Milliyetçi Coşku "
modifier_fervour_military_bonus_ig: "Hareketlendirilmiş Milliyetçi Coşku"

2TAB: "    "

national_awakening.2.t: "Köy Okullaşması"
national_awakening.2.d: "Hükümetin maaş bordrosundaki [GetPopType('academics').GetName] (Akademisyenler/Eğitmenler), [SCOPE.sState('relevant_state').GetName] kırsalında köy okulları kurdu. Bu köy okulları okuryazarlık oranlarını artırmayı ve köylülük arasında [SCOPE.sCulture('relevant_culture').GetName] ulusal kimlik duygusunu geliştirmeyi amaçlıyor."
national_awakening.2.f: ""Ulusumuzun kötü bir şansı oldu," diye başladı öğretmen. "Henüz tamamen birleşmedi. Bu topraklarda halkımız yabancılara bağımlı."\n\nDuvardaki haritayı, siyaha boyanmış birkaç bölgeyi işaret etti.\n\n"Bu vilayetlerde yabancılar hüküm sürüyor ve kardeşlerimiz için hayat çok zor..."" #- Sırp öğrenciler için hazırlanmış dördüncü sınıf bir ders kitabından esinlenilmiştir (Protić ve Stojanović)
national_awakening.2.a: "Mükemmel bir girişim."
national_awakening.2.b: "Onlara ek fon teklif edin."

national_awakening.3.t: "Ulusal Destan"
national_awakening.3.d: "Geleneksel [SCOPE.sCulture('relevant_culture').GetName] şiirleri ve şarkılarından oluşan ve yakın zamanda yayınlanan bir derleme, [ROOT.GetCountry.GetName] ülkesinin giderek okuryazarlaşan halkını büyüledi. [SCOPE.GetRootScope.GetCountry.GetCustom('country_national_epic_name')] adlı eserin çok okunmuş bir kopyası artık [ROOT.GetCountry.GetCapital.GetCityHubName] içindeki her kitaplıkta bulunabiliyor."
national_awakening.3.f: "Matbaa hiç bu kadar yoğun olmamıştı. Ilık kağıt desteleri taşıyan işçiler, tutkallanacakları ve deriyle ciltlenecekleri istasyonlara koşturuyordu. Arka tarafta, devasa baskı makineleri zarif düğüm motifleri ve çiçek resimleriyle süslenmiş sayfaları arka arkaya basıyordu. Elli kitaptan oluşan bu yığın [ROOT.GetCountry.GetCapital.GetCityHubName] için, diğeri ise [ROOT.GetCountry.GetCapital.GetFarmHubName] içindi. Hem şahıslardan hem de kitapçılardan gelen mektuplar, deftere işlenmeyi beklemek üzere bir tezgahın üzerine yığılmıştı.\n\nAz önce oradan ayrılan üniformalı bir adamın ardından ön taraftan bir ses yankılandı. "Bakanlıktan bir sipariş - Cuma gününe kadar iki yüz tane istiyorlar!""
national_awakening.3.a: "Ulusumuzu birbirine bağlayacak bir eser."
national_awakening.3.b: "Aydınlarımızın şerefine!"

national_awakening.4.t: "Halkın Dilinde"
national_awakening.4.d: "Ünlü bilgin [SCOPE.sCharacter('intelligentsia_leader').GetFullName], Yeni Ahit'i [SCOPE.sCulture('relevant_culture').GetName] diline çevirdi. Sayısı giderek artan [SCOPE.sCulture('relevant_culture').GetNameNoFormatting] dilindeki eserler bütünü, dilin rahipler ve entelektüeller arasındaki prestijinin artmasına yol açtı."
national_awakening.4.f:1 ""#italic Principia#! eserinin [SCOPE.sCulture('relevant_culture').GetNameNoFormatting] dilinde bir kopyasını sipariş ettim ve meslektaşlarımdan biri de aynı dilde tam bir İncil talep etti. Eğer her yıl dikkate değer bir eserin çevirisini yapabilir ve her çeviriyi ileride başkalarına eğitim verecek bir öğrenciye yaptırabilirsek, yüzyılın sonuna kadar büyük çaplı bir külliyatımız (eserler bütünümüz) olacak. Hatta tedarikçiler talebi fark ederse çok daha fazlası bile olacak."\n\n"Gerçekten iddialı bir girişim. Bölümü buna geçirebileceğinize inanıyor musunuz?"\n\n"Dilimizin başkalarının öğrenmek isteyeceği bir dil olduğu - bir İsveçlinin [SCOPE.sCulture('relevant_culture').GetNameNoFormatting] bir yayıncıdan makaleler talep edeceği - bir geleceğin hayalini kuruyorum. Ve dahası, o makalelerin yazarının kendi öğrencilerimden biri olmasını hayal ediyorum.""
national_awakening.4.a: "Yakında tüm Avrupa [SCOPE.sCulture('relevant_culture').GetNameNoFormatting] dilinde eserler yayınlayacak!"
national_awakening.4.b: "Özgün eserler üretmek için de çaba göstermeliyiz."

national_awakening.5.t: "Milliyetçi Romantizm"
national_awakening.5.d: "Yükselen [SCOPE.sCulture('relevant_culture').GetName] milliyetçiliği dalgasından ilham alan [SCOPE.sState('arts_academy_state').GetCityHubName] içindeki [SCOPE.sBuilding('arts_academy_building').GetName], geçtiğimiz günlerde ulusumuzun kuruluş efsanesini tasvir eden muhteşem bir romantik dönem tablosu üretti."
national_awakening.5.f: "[SCOPE.sCulture('relevant_culture').GetNameNoFormatting] ulusunun vücut bulmuş hali ön planda duruyor, cübbeler giyinmiş ve [ROOT.GetCountry.GetAdjectiveNoFormatting] bayrağını taşıyordu. Şanlı olmayan karanlık geçmişe uzanan kırık bir zincir ayak bileğinden sürükleniyordu. Arka planda sadece [ROOT.GetCountry.GetNameNoFormatting]'de bulunabilecek güzellikte, ışığı ulusal renklerde parlayan ışıltılı ve doğan bir güneşle aydınlatılmış bir arka plan uzanıyordu.\n\nHerkesin anlayabileceği ama çok az kişinin kopyalayabileceği bir mesaj taşıyordu. Karanlık geçmişin içinden doğan ışıltılı, yeni bir bahar. Baskının içinden doğan özgürlük."
national_awakening.5.a: "Paris'in başyapıtlarını geride bırakacak bir eser."
national_awakening.5.b: "Bu, ulusumuzun en yeni sembolü olsun."

national_awakening.6.t: "Folklor (Halk Kültürü)"
national_awakening.6.d: "Ortak bir ulusal kimlik arayışı, [SCOPE.gsInterestGroup('intelligentsia_ig').GetName] grubunun ilgisini kırsal kesime çevirdi. [SCOPE.gsInterestGroup('rural_folk_ig').GetName] geleneklerini incelemek, yabancı yönetimden etkilenmemiş ilkel bir [SCOPE.sCulture('relevant_culture').GetNameNoFormatting] kültürüne atılan bir bakış olarak görülüyor."
national_awakening.6.f: ""Büyük İskender'in ilk [SCOPE.sCulture('relevant_culture').GetNameNoFormatting] olduğunu söylüyorlar. İmparatorluğu parçalandığında generallerinin ilk [SCOPE.sCulture('relevant_culture').GetNameNoFormatting] krallıklarını kurduğunu söylüyorlar."\n\n"Öyle miymiş?"\n\n"Öyle söylemeleri mi, yoksa bunun doğru olması mı?"\n\n"İkincisi."\n\n"Hiçbir fark yok, öyle değil mi? Eğer yeterince insan bunu söylerse, onu doğru kılarız.""
national_awakening.6.a: "Ulusun tohumları böyle büyüyor."
national_awakening.6.b: "Gerçek ülkeden (taşradan) öğreneceğimiz çok şey var."

national_awakening.7.t: "Tek Ulus, Tek Halk"
national_awakening.7.d: "Devletin, ulusu ortak bir [SCOPE.sCulture('primary_culture').GetName] kimliği etrafında tanımlama çabaları, [SCOPE.sCulture('minority_culture').GetName] nüfusu arasında bir alarm hissiyatı uyandırdı. Çoğu [SCOPE.sCulture('minority_culture').GetNameNoFormatting] insanı, baskın kültüre asimile olmaya zorlanacaklarından korkuyor."
national_awakening.7.f: ""Eğer mezun olmak istiyorsa [SCOPE.sCulture('primary_culture').GetNameNoFormatting] dilini öğrenmeli ve [SCOPE.sCulture('primary_culture').GetNameNoFormatting] dilinde yazılmış bir sınavı geçmeli. Şu anda tolerans gösteremeyiz."\n\nKadın [SCOPE.sCulture('minority_culture').GetNameNoFormatting] dilinde cevap verdi. Yüzünde özür dileyen bir ifade olan oğlu, kadının sözlerini memurun kendi diline çevirdi.\n\n"Peki ya [SCOPE.sCulture('minority_culture').GetNameNoFormatting] öğrenmek ne olacak? Burada çoğumuz varız ve evde konuştuğumuz dil bu. [SCOPE.sCulture('minority_culture').GetNameNoFormatting] dersleri almazsa evden ayrıldığında bu dili unutacak ve ailesiyle olan tüm bağını kaybedecek."\n\n"Size tavsiyem, hanımefendi, [SCOPE.sCulture('primary_culture').GetNameNoFormatting] dilini öğrenmenizdir. Siz [ROOT.GetCountry.GetAdjectiveNoFormatting] vatandaşı değil misiniz?""
national_awakening.7.a: "Gerçekten de [SCOPE.sCulture('primary_culture').GetCustom('getPluralDemonym')] olmalılar."
national_awakening.7.b: "Korkacakları hiçbir şey yok."

