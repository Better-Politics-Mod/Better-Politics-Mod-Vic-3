l_turkish:
 ideology_dop_party_socialist:0 "Parti Sosyalisti"
 ideology_dop_party_socialist_desc:0 "#lore Bu grup, sosyalist partiyi proletaryanın birincil siyasi örgütü olarak görür. Devrimci bir durumda gücü partide yoğunlaştırmaya karar verebilirler. #!"

 ideology_dop_anarchist:0 "Anarşist"
 ideology_dop_anarchist_desc:0 "#lore Bu grup, devleti doğası gereği baskıcı olarak görür ve onu derhal ortadan kaldırmayı amaçlar. #!"

 ideology_dop_party_state:0 "Parti-Devletçi"
 ideology_dop_party_state_desc:0 "#lore Bu grup, partisini mümkün olduğunca devletten ayrılmaz hale getirmeyi amaçlar. Muhalefet partilerine ya devletin danışma uzantıları olarak muamele edilir ya da devlete karşı açıkça vatan haini güçler olarak bakılır. #!"

 ideology_dop_radical_democrat:0 "Radikal Demokrat"
 ideology_dop_radical_democrat_desc:0 "#lore Bu grup demokrasinin üstünlüğüne inanır ve hükümetin tüm alanlarında oy hakkını şiddetle teşvik edecektir. #!"

 ideology_dop_moderate_democrat:0 "Ilımlı Demokrat"
 ideology_dop_moderate_democrat_desc:0 "#lore Orta bir duruş sergileyen bu grup, demokrasiyi siyasi bir ilke olarak benimser, ancak makul herhangi bir hükümette sınırların getirilmesi gerektiğine inanır. #!"

 ideology_dop_authoritarian_democrat:0 "Otoriter Demokrat"
 ideology_dop_authoritarian_democrat_desc:0 "#lore İster kinik ister samimi bir şekilde olsun, bu grup hükümete bir miktar halk katılımının gerekli olduğuna inanır, ancak kimlerin katılabileceği ve nelerin değiştirilebileceği konusunda katı sınırlar getirmeyi amaçlar. #!"

 ideology_dop_autocrat:0 "Otokrat"
 ideology_dop_autocrat_desc:0 "#lore L'État, c'est moi! Bu grup, hükümetteki birincil güç olarak güçlü bir lideri destekler. Günlük kararlar için bürokratlara ihtiyaç duyulan yerlerde, bu grup onların güçlerini ya atama ya da miras yoluyla elde etmeleri gerektiğine inanır. #!"

 ideology_dop_oligarch:0 "Oligark"
 ideology_dop_oligarch_desc:0 "#lore Bu grup, hükümetteki ana karar vericilerin zengin ve/veya soylu bir patrisyen (aristokrat) sınıfı olması gerektiğini düşünür. Bu grup ya oligarklardan ya da onların doğrudan yararlanıcılarından oluştuğu için, bu inanç genellikle net bir ideolojiden ziyade kişisel çıkarlarla motive edilir. #!"

 ideology_dop_technocrat:0 "Teknokrat"
 ideology_dop_technocrat_desc:0 "#lore Toplumun bilimsel olarak yönetilebileceği inancından yola çıkan teknokratlar, demokrasiyi bir kenara bırakıp kararların bürokratlar ve eğitimli profesyoneller tarafından alınmasını tercih ederler. #!"

 ideology_dop_traditional_power:0 "Geleneksel Güç"
 ideology_dop_traditional_power_desc:0 "#lore Bu grubun demokrasi konusunda net bir duruşu yoktur, ancak genel olarak geleneksel güç yapılarını değişime karşı savunmaya çalışır. #!"

 ideology_dop_state_power:0 "Devlet Gücü"
 ideology_dop_state_power_desc:0 "#lore Bürokrasi, genişleyen bürokrasinin ihtiyaçlarını karşılamak için genişler. #!"

 ideology_dop_dissent:0 "Muhalif"
 ideology_dop_dissent_desc:0 "#lore Bu grup devlet tarafından baskı altına alınmıştır, bu nedenle ifade özgürlüğü arzuları, sahip olabilecekleri önceden var olan herhangi bir ideolojik eğilimden daha ağır basar. #!"

 ideology_dop_meritocratic_autocrat:0 "Meritokratik Otokrat"
 ideology_dop_meritocratic_autocrat_desc:0 "#lore Bu grup, ülkelerinin bürokratları liyakata dayalı sınavlarla seçen geleneksel sistemine değer verir. #!"

 ideology_dop_unionist:0 "Sendikacı"
 ideology_dop_unionist_desc:0 "#lore Bu grup, sendikaları işçi hakları mücadelesinin temel taşı olarak görür. Bu nedenle, bağımsızlıklarını engellemeye çalışan herkesin ezip geçilmesini isterler. #!"

 ideology_dop_syndical_unionist:0 "Kurumsal Sendikalist"
 ideology_dop_syndical_unionist_desc:0 "#lore Artık ülkenin kanunu Sendikalizm olduğuna göre, sendikalar ideolojik ateşten uzaklaşmış ve şimdilerde temel olarak mevcut durumu korumaya yönelmiştir. #!"

 ideology_dop_state_unionist:0 "Devlet Sendikacısı"
 ideology_dop_state_unionist_desc:0 "#lore Artık devlet bürokrasisi sendikaların rolünü üstlendiğine göre, bu grubun mevcut amacı üyelerinin devletin iradesiyle işbirliği yapmasını sağlamaktır. #!"

 ideology_dop_syndicalist:0 "Sendikalist"
 ideology_dop_syndicalist_desc:0 "#lore Sendikalist teori, daha az ideolojik olan sendikalar tarafından bile benimsenmiştir ve onlar artık sendikalizmi patronların zincirlerini kırmanın tek yolu olarak görmektedirler. #!"

 ideology_dop_anarcho_syndicalist:0 "Anarko-Sendikalist"
 ideology_dop_anarcho_syndicalist_desc:0 "#lore Anarşizmi sendikalist örgütlenmeyle birleştiren bu grup, artık kitlelere hitap edecek bir yol görmektedir. #!"

 ideology_dop_organic_power:0 "Devlet Korporatisti"
 ideology_dop_organic_power_desc:0 "#lore Bu grup, doğal ve sosyal parçalanmalara dayalı, ancak kimin buna katılabileceği konusunda aktif devlet müdahalesinin olduğu bir demokrasiye inanır.#!"