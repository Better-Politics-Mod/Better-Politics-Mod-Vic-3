l_simp_chinese:
 ideology_wel_expanded_public_welfare:0 "深化劳动改革"
 ideology_wel_expanded_public_welfare_desc:0 "#lore 该群体力图推进更高水平的劳动改革。#!"
 ideology_wel_public_welfare:0 "公共福利"
 ideology_wel_public_welfare_desc:0 "#lore 该群体认为公众应当为所有人提供某种程度的福利保障。#!"
 ideology_wel_paternalistic_welfare:0 "家长式福利"
 ideology_wel_paternalistic_welfare_desc:0 "#lore 无论是出于犬儒还是真心，该群体都认为国家应当为贫穷无助的大众提供基本的生活水准——免得他们太过不安分！#!"
 ideology_wel_market_welfare:0 "市场福利"
 ideology_wel_market_welfare_desc:0 "#lore 该群体认为，看不见的手才是福利的最佳保障者。#!"
 ideology_wel_religious_welfare:0 "宗教福利"
 ideology_wel_religious_welfare_desc:0 "#lore 该群体认为，通过宗教慈善实现的福利是一种道德之善。#!"
 ideology_wel_no_welfare:0 "无福利"
 ideology_wel_no_welfare_desc:0 "#lore 让他们吃蛋糕去吧！#!"
 ideology_wel_secular_anti_welfare:0 "世俗反福利"
 ideology_wel_secular_anti_welfare_desc:0 "#lore 该群体坚定捍卫世俗寡头的利益，反对国家福利，尤其是那些与宗教机构挂钩的福利。#!"
 ideology_wel_distributist_welfare:0 "分配主义福利"
 ideology_wel_distributist_welfare_desc:0 "#lore 该群体以天主教社会训导原则为基础，认为国家应当为贫穷无助的大众提供基本的生活水准。#!"
 ideology_wel_social_market_welfare:0 "社会市场福利"
 ideology_wel_social_market_welfare_desc:0 "#lore 该群体认为，实现社会平等的最佳途径是将市场与福利措施相结合。#!"
 ideology_wel_reactionary_paternalistic:0 "反动家长式"
 ideology_wel_reactionary_paternalistic_desc:0 "#lore 面对残酷的资本主义，该群体认为国家应当为穷人提供基本而体面的生活水准，同时心怀宗教道德。#!"
