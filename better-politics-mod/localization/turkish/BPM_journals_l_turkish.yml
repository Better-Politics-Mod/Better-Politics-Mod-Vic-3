 bpm_general_strike.1.t:0 "Zafer ve Tavizler"
 bpm_general_strike.1.d:0 "İşçi sendikaları zaferle önemli tavizleri kopardıklarını ilan ederken grev artık sona erdi ve pazarlıkların bir parçası olarak işlerine dönecekler. Grevin ödülleri yeterli görünse de, onca esip gürledikten sonra kopardıkları üç beş kuruşluk taviz çoğu işçinin kursağında kaldı."
 bpm_general_strike.1.f:0 "TODO"
 bpm_general_strike.1.a:0 "Böyle zaferin ta amına koyayım."

 bpm_general_strike.2.t:0 "Zafer ve Barış"
 bpm_general_strike.2.d:0 "İşçi hareketi, [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullName] adına savaşmak zorunda kaldıkları anlamsız savaştan yorgun ve kanı çekilmiş bir haldeyken grev zorla sona erdirildi. Zor kazanılan barış üzerindeki kutlamalar, bazıları için böyle bir barışın bir sevinç nedeni değil, daha ziyade hainlere karşı bir casus belli (savaş nedeni) olduğu bilgisiyle bozuluyor."
 bpm_general_strike.2.f:0 "TODO"
 bpm_general_strike.2.a:0 "Barış kazandı be!"

 bpm_general_strike.3.t:0 "Emeğin Zaferi"
 bpm_general_strike.3.d:0 "Bir ülkede başlayan grev, sonunda tamamen farklı bir ülkede iptal edildi. Hükümet devrimci sendikalistlerin etrafında çökerken, bir zamanlar sınıf savaşının bir tarafı olan militan sendikalar, şimdi parçalanmış ulusu toparlamakla, gerici ve modası geçmiş kurumları dayanışma ve örgütlü emeğin gücüyle değiştirmekle meşgul. Böyle bir deneyin hayatta kalıp kalmayacağını sadece zaman gösterecek, ancak bugün tarih yazıldığını inkar eden sadece bir aptaldır."
 bpm_general_strike.3.f:0 "TODO"
 bpm_general_strike.3.a:0 "Muazzam bir zafer!"

