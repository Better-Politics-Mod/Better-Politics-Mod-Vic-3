l_turkish:
 ideology_mil_ultramilitarist:0 "Ultramilitarist"
 ideology_mil_ultramilitarist_desc:0 "#lore Bu grup, savaşın ve çatışmanın doğası gereği iyi ve arzu edilebilir olduğuna inanır ve barış arzularından kaçınarak savaşı tercih eder. #!"

 ideology_jingoist:0 "Militarist"
 ideology_jingoist_desc:0 "#lore Savaş naralarıyla! Bu grup, dış ilişkilerde militarizmin üstünlüğüne inanır ve bu arzuyu desteklemek için bir orduya ihtiyaç duyar. #!"

 ideology_mil_patriotic:0 "Vatansever"
 ideology_mil_patriotic_desc:0 "#lore Bu grup, ulusal savunma — ve gerekirse ara sıra yapılacak seferler — için güçlü, profesyonel bir orduyu destekler. #!"

 ideology_mil_patriotic_liberal:0 "Liberal-Vatansever"
 ideology_mil_patriotic_liberal_desc:0 "#lore Bu grup, kullanımının ardındaki politikaya bazı ilerici unsurları entegre ederek, ulusal savunma için güçlü ve profesyonel bir orduyu destekler. #!"

 ideology_mil_defensive_patriot:0 "Savunmacı Militarist"
 ideology_mil_defensive_patriot_desc:0 "#lore Bu grup, ulusal savunma için güçlü, profesyonel bir orduyu destekler, ancak yalnızca ulusal savunma için. #!"

 ideology_mil_frontier_expansion:0 "Sınır Yayılmacısı"
 ideology_mil_frontier_expansion_desc:0 "#lore Bu grup, düşmanca sınırlarda yerleşimcilere eşlik etmek — veya yerlileri tahliye etmek — amacıyla gevşek bir şekilde organize edilmiş bir orduyu tercih eder. #!"

 ideology_mil_antimilitarist:0 "Anti-Militarist"
 ideology_mil_antimilitarist_desc:0 "#lore Eğer bir ordu olması gerekiyorsa, bu grup ideal olarak ordunun küçük, merkezi olmayan ve tamamen gönüllü olması gerektiğine, dış politikada ise pasifist bir bakış açısına sahip olunması gerektiğine inanır. #!"

 ideology_mil_popular_army:0 "Halkçı Militarist"
 ideology_mil_popular_army_desc:0 "#lore Bu grup; doğrudan halka hesap veren, öz savunma veya proleter dayanışma ihtiyaçları etrafında örgütlenmiş, merkezi olmayan, gönüllü bir ordunun savaş ve barışa yönelik en çok tercih edilebilir yaklaşım olduğuna inanır. #!"

 ideology_mil_aristocratic_militarist:0 "Aristokratik Militarist"
 ideology_mil_aristocratic_militarist_desc:0 "#lore Bu grup, ordunun temel olarak aristokratlar tarafından yönetilen köylü ordularından oluşması gerektiğine inanır. Profesyonel bir askeri sınıfı kendi güçlerine yönelik bir tehdit olarak görürler. #!"

 ideology_mil_plutocratic_militarist:0 "Plütokratik Militarist"
 ideology_mil_plutocratic_militarist_desc:0 "#lore Bu grubun, orduyu servetin etkisine açık tutmakta zümresel bir çıkarı vardır. #!"

 ideology_mil_mass_army:0 "Devrimci Militarist"
 ideology_mil_mass_army_desc:0 "#lore Bu grup barış zamanlarında anti-militarist olsa da, devrimi ne pahasına olursa olsun savunmak için bir kitle ordusuna (kapsamlı zorunlu askerliğe) ihtiyaç olduğuna inanır. #!"

 ideology_mil_emergency:0 "Acil Durum Militaristi"
 ideology_mil_emergency_desc:0 "#lore Büyük çaplı bir çatışmanın baskısı altında olan bu grup, barış zamanındaki askeri politikasına rağmen artık kitlesel seferberlik için baskı yapıyor. #!"

 ideology_mil_institutional_militarist:0 "Kurumsal Militarist"
 ideology_mil_institutional_militarist_desc:0 "#lore Bu grup, ordunun mevcut liderliğine müdahale edilmediği sürece, iyi finanse edilen ve güçlü bir orduya güçlü bir şekilde odaklanılmasını arzular. #!"