 concept_bpm_ig_is_organicist_desc: "@ig_christian_democrats! #bold Hristiyan Demokratlar#!, @ig_reactionaries! #bold Gericiler#! ve @ig_fascists! #bold Faşistler#! [Concept('concept_interest_group', 'Çıkar Grupları')]. İnsan toplumunun bir organizma gibi olduğuna ve bireylerin de bu organizmanın hücreleri olduğuna inanırlar -- bu hücreleri devlet içinde güçlendirmeyi veya onların devletin bir parçası haline gelmesini amaçlarlar."

 
