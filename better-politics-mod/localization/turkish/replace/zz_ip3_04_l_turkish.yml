austria_events.40.t: "İmparatorluğu Kurtarmak İçin"
austria_events.40.d: "[ROOT.GetCountry.GetName] devletinde oy hakkının genişletilmesi, geleneksel olarak muhafazakar olan [SCOPE.gsInterestGroup('armed_forces_ig').GetName] arasında sert bir tepkiye yol açtı. Birçok [GetPopType('officers').GetName], [SCOPE.GetRootScope.GetCountry.GetCustom('country_legislature_name')] kurumunu İmparatorluğun istikrarına yönelik bir yük olarak görmeye başladı."
austria_events.40.f: "Albay, "Politikacılar İmparatorluğu bir saçmalığa dönüştürmeye çalışıyorlar," diye söze başladı. "Oylamanın her genişlemesi [SCOPE.GetRootScope.GetCountry.GetCustom('country_legislature_name')] meclisini giderek daha yönetilemez hale getiriyor. Zamanlarını kafa karışıklığı ve gecikme yaratarak harcıyorlar ve ertelenen her karar Tacın üzerine yeni bir leke sürüyor."\n\nEtrafındaki herkesin başını sallayarak onayladığını gördü. Masadaki adamların her biri, bazı taşra meclislerinin desteğini almak uğruna yapılan bütçe kesintilerini hissetmişti. Devam etti.\n\n"İmparatorluğumuz alacakaranlık yıllarına girdi ve biz bu yıkımın ortasında duruyoruz. Eğer bu devam ederse - eğer devam etmesine #italic izin verilirse#! - korkarım ki hepimiz unutulup gideceğiz.""
austria_events.40.a: "Sözleri diktatörlük tehdidi taşıyor."
austria_events.40.b: "Gerçekten haksız olduklarını söyleyebilir miyiz?"

