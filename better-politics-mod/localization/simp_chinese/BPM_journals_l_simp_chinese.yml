 bpm_general_strike.1.t:0 "胜利与让步"
 bpm_general_strike.1.d:0 "罢工现已结束，工会们得意地宣称他们成功争取到了重要的让步，而作为谈判的一部分，他们现在将重返工作岗位。尽管罢工的回报看似尚可，但许多工人却对如此一番气势汹汹的武力展示所换来的区区所得感到不安。"
 bpm_general_strike.1.f:0 "TODO"
 bpm_general_strike.1.a:0 "一场微不足道的胜利。"
 bpm_general_strike.2.t:0 "胜利与和平"
 bpm_general_strike.2.d:0 "罢工现已结束，劳工运动在为他们代[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFullName]而进行的这场毫无意义的战争中已精疲力竭、元气大伤，如今被强行拉下帷幕。来之不易的和平所带来的庆祝，被这样一种认知蒙上了阴影：对某些人而言，这样的和平并非欢欣的理由，反而是讨伐叛徒的宣战理由。"
 bpm_general_strike.2.f:0 "TODO"
 bpm_general_strike.2.a:0 "为和平而胜利！"
 bpm_general_strike.3.t:0 "劳工的胜利"
 bpm_general_strike.3.d:0 "这场始于一个国家的罢工，最终在一个截然不同的国家被叫停。随着政府在革命工团主义者周围垮台，好斗的工会——曾是阶级战争的一方——如今正忙于收拾这个支离破碎的国家，以团结和有组织劳工的力量取代反动而过时的制度。唯有时间能证明这样一场实验能否存续，但唯有愚者才会否认，历史在这一天被书写。"
 bpm_general_strike.3.f:0 "TODO"
 bpm_general_strike.3.a:0 "一场胜利！"
