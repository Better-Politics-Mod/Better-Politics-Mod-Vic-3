 je_bpm_status_quo_armed_neutrality:0 "Dokunulmamış Kale"
 je_bpm_status_quo_armed_neutrality_reason:0 "[GetLawType('law_armed_neutrality').GetName] [Concept('concept_law', 'Yasasısının')] geçmesiyle birlikte ülkemizin siyaseti değişmeye başlıyor. Bu yasa #variable 10#! yıl boyunca yürürlükte kalırsa, [Concept('concept_interest_group', 'Çıkar Gruplarımızın')] bir kısmı ideolojik duruşlarını bu düzenlemeyi destekleyecek şekilde değiştirecektir."

 je_bpm_women_rights_upgrade:0 "Gerçek Cinsiyet Eşitliği"
 je_bpm_women_rights_upgrade_reason:0 "[GetLawType('law_womens_suffrage').GetName] [Concept('concept_law', 'Yasasısının')] geçmesiyle birlikte kadınların hakları kağıt üzerinde güvence altına alındı. Eğer [GetLawType('law_womens_suffrage_upgraded').GetName] hedefine ulaşmak istiyorsak, pratikte de eşitliği teşvik etmek için çaba göstermemiz gerekecek.\n\n[GetLawType('law_womens_suffrage_upgraded').GetName] destekçilerinin [Concept('concept_powerful', 'Güçlü')] veya [Concept('concept_in_government', 'Hükümette')] kalmasına izin vermek, [GetLawType('law_repeatable_culture_promote_socialist_values').GetName] yasasının tekrar tekrar geçirilmesiyle birlikte bu kaydın ilerlemesini artırır. Tersine, [Concept('concept_bpm_ig_is_sexist', 'anti-feministlerin')] [Concept('concept_powerful', 'Güçlü')] veya [Concept('concept_in_government', 'Hükümette')] kalmasına izin vermek bu kaydın ilerlemesini azaltacaktır."
 je_bpm_multicultural_upgrade:0 "Halkların Kardeşliği"
 je_bpm_multicultural_upgrade_reason:0 "[GetLawType('law_multicultural').GetName] [Concept('concept_law', 'Yasasısının')] geçmesiyle birlikte, ırkların ve kültürlerin eşitliği yalnızca kağıt üzerinde varsayıldı. Ancak uluslararası davanın en radikal savunucuları daha da ileri gitmeye zorluyorlar ve eğer onlara istediklerini verirsek, bunun yerine [GetLawType('law_multicultural_upgraded').GetName] kazanacağız.\n\n[GetLawType('law_multicultural').GetName] destekçilerinin [Concept('concept_powerful', 'Güçlü')] veya [Concept('concept_in_government', 'Hükümette')] kalmasına izin vermek, [GetLawType('law_repeatable_culture_affirmative_action').GetName] yasasının tekrar tekrar geçirilmesiyle birlikte bu kaydın ilerlemesini artırır. Tersine, [GetLawType('law_multicultural').GetName] karşıtlarının [Concept('concept_powerful', 'Güçlü')] veya [Concept('concept_in_government', 'Hükümette')] kalmasına izin vermek bu kaydın ilerlemesini azaltacaktır."
 je_bpm_total_separation_upgrade:0 "Gerçek Sekülerizm"
 je_bpm_total_separation_upgrade_reason:0 "[GetLawType('law_total_separation').GetName] [Concept('concept_law', 'Yasasısının')] geçmesiyle birlikte, görünüşte seküler bir ulus haline geldik. Eğer bunun yerine [GetLawType('law_total_separation_upgraded').GetName] kabulü için bastırırsak, belki de gerçekten seküler olmanın bir yolu vardır.\n\n[GetLawType('law_repeatable_religion_promote_secular_values').GetName] destekçilerinin [Concept('concept_powerful', 'Güçlü')] veya [Concept('concept_in_government', 'Hükümette')] kalmasına izin vermek, [GetLawType('law_repeatable_religion_promote_secular_values').GetName] yasasının tekrar tekrar geçirilmesiyle birlikte bu kaydın ilerlemesini artırır. Tersine, [GetLawType('law_repeatable_religion_promote_secular_values').GetName] karşıtlarının [Concept('concept_powerful', 'Güçlü')] veya [Concept('concept_in_government', 'Hükümette')] kalmasına izin vermek bu kaydın ilerlemesini azaltacaktır."

