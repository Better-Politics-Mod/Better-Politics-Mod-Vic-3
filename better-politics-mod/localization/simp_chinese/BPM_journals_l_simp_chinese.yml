 bpm_je_modernizers_copy_production_button_desc:0 "工业是现代国家的力量所在。我们应当研究外国的方法，以便赶上并超越它们。"
 bpm_je_modernizers_copy_military_button:0 "革新军队"
 bpm_je_modernizers_copy_military_button_desc:0 "集中精力研究外国的现代军队，将帮助我们赶上任何对手！"
 bpm_je_modernizers_copy_society_button:0 "推行新风俗"
 bpm_je_modernizers_copy_society_button_desc:0 "改变我们的风俗以更好地融入更先进的社会，或许会招致我们较传统势力的鄙视，但它无疑将帮助我们在各个方面更快地进步。"
 bpm_je_modernizers_invite_production_button:0 "招揽投资"
 bpm_je_modernizers_invite_production_button_desc:0 "我们近期对工业进步的考察为我们提供了知识——但缺乏运用这些知识所需的资源。招揽外国投资有助于我们快速启动这些产业。"
 bpm_je_modernizers_invite_production_button_tt:0 "一个拥有[GetArticleType('foreign_investment_rights').GetName]的[concept_great_power]将在[SCOPE.sState('selected_state').GetName]建造各一级的[GetBuildingType('building_railway').GetName]、[GetBuildingType('building_motor_industry').GetName]、[GetBuildingType('building_steel_mill').GetName]和[GetBuildingType('building_tooling_workshop').GetName]！"
 bpm_je_modernizers_button_on_cooldown_tt:0 "此行动不在#variable 一年期#!冷却中！"
 bpm_je_modernizers_button_stronger_with_dialectic_tt:0 "@information! #blue #bold 社会影响力#!会增强此行动的效果。#!"
 bpm_je_modernizers_button_stronger_with_conservative_dialectic_tt:0 "@information! #blue #bold 社会影响力#!会增强此行动的效果，其中$bpm_je_all_antimodernizers$占主导时增强幅度最大。#!"
 bpm_je_modernizers_button_stronger_with_modernizer_dialectic_tt:0 "@information! #blue #bold 社会影响力#!会增强此行动的效果，其中$bpm_je_all_modernizers$占主导时增强幅度最大。#!"
 bpm_modernizers.1.t:0 "现代化之辩"
 bpm_modernizers.1.d:0 "随着西方思潮开始以全部力量涌入[ROOT.GetCountry.GetName]，越来越清楚的是，我们与工业化西方国家之间还有很长的距离要追赶。知识分子之间的辩论因此开始呈现出有趣的角度——为了我们自身的现代化，我们应在多大程度上效仿西方？"
 bpm_modernizers.1.f:0 "TODO"
 bpm_modernizers.1.a:0 "无论西化与否，[ROOT.GetCountry.GetName]都将实现现代化！"
 bpm_modernizers.2.t:0 "向着现代，前进！"
 bpm_modernizers.2.d:0 "我国关于现代化的辩论终于尘埃落定——结果是$bpm_je_all_modernizers$明确取得了意识形态上的胜利。尽管国内其他人或许未必认同他们的愿景，但知识分子阶层整体上坚定地信奉$bpm_je_all_modernizers$的事业，并且在未来多年内都不会改变主意。"
 bpm_modernizers.2.f:0 "TODO"
 bpm_modernizers.2.a:0 "我们且看他们的想法能否成为现实"
 bpm_modernizers.3.t:0 "我们自己的道路"
 bpm_modernizers.3.d:0 "随着现代化之辩接近尾声，我们知识界中以[ROOT.GetCountry.GetName]为中心的各派系似乎占了上风。随着他们对手的理念在学术界被彻底驳倒，[ROOT.GetCountry.GetName]的社会结构在不久的将来似乎将基本保持不变。"
 bpm_modernizers.3.f:0 "TODO"
 bpm_modernizers.3.a:0 "我们确实忠于了自我，对吧？"
 bpm_modernizers.4.t:0 "空锅"
 bpm_modernizers.4.d:0 "随着关于现代化的激烈辩论接近尾声，硝烟散去后，文字的战场依然空空如也。没有任何一方取得意识形态上的胜利，看来在我们国家的知识分子中，没有任何单一愿景能够胜出。"
 bpm_modernizers.4.f:0 "TODO"
 bpm_modernizers.4.a:0 "至少学术界的噪音少了"
 bpm_modernizers.5.t:0 "大门砰然关闭"
 bpm_modernizers.5.d:0 "一方面是外国影响带来的压力与日俱增，另一方面是保守派的反对，[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFullName]宣布了一项激进的孤立主义政策，以保护国家免受从国外涌入的颠覆性思想的污染。随着贸易联系的严重削减、使馆的关闭以及外国知识分子的驱逐，[ROOT.GetCountry.GetName]的未来似乎将是自我强加的孤立。"
 bpm_modernizers.5.f:0 "TODO"
 bpm_modernizers.5.a:0 "只剩下震耳欲聋的沉寂"
 bpm_modernizers.6.t:0 "大缄默"
 bpm_modernizers.6.d:0 "对政府的自由主义倾向及其对传统的公然漠视深感不满，我们的保守派联合起来，将[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]赶下台。如今他们转而扼杀一切进入国家的新思想，我们国家的未来似乎将是自我强加的孤立。"
 bpm_modernizers.6.f:0 "TODO"
 bpm_modernizers.6.a:0 "只剩下震耳欲聋的沉寂"
 bpm_modernizers.7.t:0 "现代的典范"
 bpm_modernizers.7.d:0 "受[SCOPE.sCountry('relevant_country').GetName]所取得的进步鼓舞，[SCOPE.gsInterestGroup('relevant_ig').GetName]寻求改善我们的相互关系，他们在现代化之辩中与$bpm_je_all_modernizers$立场一致。"
 bpm_modernizers.7.f:0 "TODO"
 bpm_modernizers.7.a:0 "有意思"
 bpm_modernizers.8.t:0 "衰败的典范"
 bpm_modernizers.8.d:0 "对[SCOPE.sCountry('relevant_country').GetName]的道德沦丧感到愤慨，[SCOPE.gsInterestGroup('relevant_ig').GetName]寻求劝阻我们之间建立更密切的关系，他们在现代化之辩中与$bpm_je_all_anti_modernizers_tt$立场一致。"
 bpm_modernizers.8.f:0 "TODO"
 bpm_modernizers.8.a:0 "有意思"
 bpm_modernizers.9.t:0 "一个新的典范"
 bpm_modernizers.9.d:0 "随着[SCOPE.sCountry('relevant_country').GetName]作为国际政治舞台上的平等一员崛起，现代化之辩中$bpm_je_all_modernizer$一方的一些人寻求拓宽我们效仿的视野，摒弃对西化的专注，将非西方的现代化方法也纳入其中。"
 bpm_modernizers.9.f:0 "TODO"
 bpm_modernizers.9.a:0 "暴发户罢了，仅此而已"
 bpm_modernizers.9.b:0 "[SCOPE.sCountry('relevant_country').GetName]是比西方更好的榜样！"
