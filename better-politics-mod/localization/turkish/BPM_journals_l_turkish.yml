 bpm_je_modernizers_name_conservatives:0 "Muhafazakarlar"
 bpm_je_modernizers_name_conservative:0 "Muhafazakar"
 bpm_je_modernizers_desc_conservative:0 "Muhafazakarlar, [GetPlayer.GetCustom('bpm_je_modernizers_name_modernizers')] mevkidaşlarına zıt bir akımdır — yabancı etkisinin beraberinde çok fazla risk ve çok az avantaj getirdiğine inanırlar. Esas olarak endüstriyel ve askeri alanlarda yabancı fikirlerin ılımlı entegrasyonundan yanadırlar, ancak en gerekliler dışında her türlü sosyal değişime şiddetle karşıdırlar."
 bpm_je_modernizers_name_slavophiles:0 "Slavofiller"
 bpm_je_modernizers_name_slavophile:0 "Slavofil"
 bpm_je_modernizers_desc_slavophiles:0 "Slavofiller Zapadniklere zıt bir akımdır — Rus ulusal ruhunun batı etkisi altında zaten çok fazla ezildiğine ve kolektif, Hıristiyan ve sadık Rus Ruhu'na uymayacak kadar bencil, seküler ve devrimci olduğuna inanırlar. Esas olarak endüstriyel ve askeri alanlarda yabancı fikirlerin ılımlı entegrasyonundan yanadırlar, ancak en gerekliler dışında her türlü sosyal değişime şiddetle karşıdırlar."
 bpm_je_modernizers_name_zapadniks:0 "Zapadnikler"
 bpm_je_modernizers_name_zapadnik:0 "Zapadnik"
 bpm_je_modernizers_desc_zapadniks:0 "Zapadnikler, büyük ulusal kahramanları Büyük Petro'nun izinden giderek, Rusya'yı içinde bulunduğu geri kalmış durumdan kurtarmak için Batı'yı taklit etmeyi ve onun en iyi yenilikleri olarak algıladıkları liberalizm, demokrasi, insan hakları ve ekonomik özgürlüğü onlardan almayı arzulayan Rus Aydınları içindeki bir akımdır."
 bpm_je_modernizers_name_westernizers:0 "Batılılaşmacılar"
 bpm_je_modernizers_name_westernizer:0 "Batılılaşmacı"
 bpm_je_modernizers_desc_westernizers:0 "Batılılaşmacılar, ülkemizi içinde bulunduğu geri kalmış durumdan kurtarmak için Batı'yı taklit etmeyi ve onun en iyi yenilikleri olarak algıladıkları liberalizm, demokrasi, insan hakları ve ekonomik özgürlüğü onlardan almayı arzulayan Aydınlarımız içindeki bir akımdır."
 bpm_je_modernizers_name_modernizers:0 "Modernleşmeciler"
 bpm_je_modernizers_name_modernizer:0 "Modernleşmeci"
 bpm_je_modernizers_desc_modernizers:0 "Modernleşmeciler, ilerlemenin ön saflarında olduğu düşünülen diğer ulusları plan alarak ulusumuzu kültür ve endüstrideki en son yeniliklerle güncellemeyi arzularlar. Batılı olmayan ulusların son zamanlarda siyasi sahneye yerleşik düzenin saygın üyeleri olarak girmesiyle birlikte batılılaşma fikirleri, modernleşmecilerin izlemeye istekli olduğu daha benzersiz yollarla birlikte daha geniş bir modernleşmeye yol açtı."
 
 bpm_je_modernizers_desc_modernizer_effects:0 "Eğer $bpm_je_all_modernizers$ kazanıyorsa, #v Sosyal Etkiye#! göre ölçeklendirilmiş aşağıdaki değiştiricileri sağlar:\n  @arrow_up!Toplum [concept_technology] (Teknoloji) araştırma hızı ve yayılımı\n  @arrow_down!Askeri [concept_technology] (Teknoloji) araştırma hızı ve yayılımı\n  @arrow_up!Üretim [concept_technology] (Teknoloji) yayılımı\n  @arrow_up!Haftalık [concept_innovation] (İnovasyon)\n  @arrow_down![concept_bpm_political_stability] (Siyasi Katılık) hedefi\n  @information! [GetInterestGroupVariant('ig_intelligentsia', GetPlayer).GetName] yüksek #v Sosyal Etki#! altında radikal duruşlar benimser"
 bpm_je_modernizers_desc_anti_modernizer_effects:0 "Eğer $bpm_je_all_antimodernizers$ kazanıyorsa, #v Sosyal Etkiye#! göre ölçeklendirilmiş aşağıdaki değiştiricileri sağlar:\n  @arrow_down!Toplum [concept_technology] (Teknoloji) araştırma hızı ve yayılımı\n  @arrow_up!Askeri [concept_technology] (Teknoloji) araştırma hızı ve yayılımı\n  @arrow_up!Üretim [concept_technology] (Teknoloji) yayılımı\n  @arrow_up!Haftalık [concept_innovation] (İnovasyon)\n  @arrow_up![concept_bpm_political_stability] (Siyasi Katılık) hedefi"

