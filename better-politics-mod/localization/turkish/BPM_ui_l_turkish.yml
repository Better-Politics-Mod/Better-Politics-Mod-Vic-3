l_turkish:
 BPM_CALL_ELECTION_BUTTON:0 "#bold Seçim Çağrısı Yap#!"
 BPM_SWAY_ON_LAW_BUTTON:0 "#bold İkna Et#!"
 BPM_DATA_INTEREST_GROUP_NAME_TOOLTIP:6 "[SelectLocalization(InterestGroup.IsInGovernment, 'IN_GOVERNMENT_WITH_ICON', 'IN_OPPOSITION_WITH_ICON')][ConcatIfNeitherEmpty('\n',InterestGroup.GetDesc)]\n\n[concept_clout]: #v #tooltippable #tooltip:[InterestGroup.GetTooltipTag],IG_CLOUT_BREAKDOWN,IGCloutTooltip [InterestGroup.GetClout|%1]#!#!#![InterestGroup.GetInfluenceDesc]\n[AddLocalizationIf(InterestGroup.HasParty, 'PARTY_DESC')][concept_leader]: [InterestGroup.GetLeader.GetFullName] ([InterestGroup.GetLeaderIdeologyDesc])\n\n[concept_approval]: #tooltippable #tooltip:IG_APPROVAL_BREAKDOWN [InterestGroup.GetApprovalRating] #bold ([InterestGroup.GetApprovalValue|+=])#!#!#!\n[Concept('concept_interest_group_trait', '$concept_interest_group_traits$')]:\n[InterestGroup.GetTraitsDesc]\n\nNüfus: [InterestGroup.GetPopulation|Kv]\n[Concept('concept_radical', '$concept_radicals$')]: [InterestGroup.GetNumRadicals|Kv]\n[Concept('concept_loyalist', '$concept_loyalists$')]: [InterestGroup.GetNumLoyalists|Kv]\n\n[InterestGroup.GetSupportingPopTypesDesc]"

 RADICALS_TOOLTIP:1 "#tooltip_header $RADICALS$#!\n[Country.GetName] ülkesindeki toplam #v [Country.GetTotalPopulation|D]#! nüfus içinde #v [Country.GetNumRadicals|D]#! $RADICALS$ var.\n$TOOLTIP_DELIMITER$\n$RADICALS$ sayısı [Country.GetRadicalsLoyalistsChangeStartDate|v] tarihinden bu yana #v #tooltippable #tooltip:[Country.GetTooltipTag],RADICALS_CHANGE_TOOLTIP [Country.GetTotalNumRadicalsChange|D=-]#!#!#! değişti.\nEn etkili faktörler şunlardır: [Country.GetRadicalsChangeSummary]\n\n[Country.GetRadicalsSummaryDesc][ConcatIfNeitherEmpty('\n\n',SelectLocalization( GreaterThan_int32(Country.CalcNumStatesInTurmoil, '(int32)0'), 'STATES_IN_TURMOIL', '' ))]"
 LOYALISTS_TOOLTIP:1 "#tooltip_header $LOYALISTS$#!\n[Country.GetName] ülkesindeki toplam #v [Country.GetTotalPopulation|D]#! nüfus içinde #v [Country.GetNumLoyalists|D]#! $LOYALISTS$ var.\n$TOOLTIP_DELIMITER$\n$LOYALISTS$ sayısı [Country.GetRadicalsLoyalistsChangeStartDate|v] tarihinden bu yana #v #tooltippable #tooltip:[Country.GetTooltipTag],LOYALISTS_CHANGE_TOOLTIP [Country.GetTotalNumLoyalistsChange|D=+]#!#!#! değişti.\nEn etkili faktörler şunlardır: [Country.GetLoyalistsChangeSummary]\n\n[Country.GetLoyalistsSummaryDesc]"


