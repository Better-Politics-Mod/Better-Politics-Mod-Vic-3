l_turkish:
  bpm_christian_democrats_events.1.t:0 "Katolik Kilisesi seçimlerde herhangi birini desteklemekten kaçınıyor"
  bpm_christian_democrats_events.1.d:0 "Bu BOKTAN işlere katılmayacağız"
  bpm_christian_democrats_events.1.f:0 "#lore 20. Bu yüzden, pastoral göreviniz uyarınca, bu inancı korumak ve muhafaza etmek için özenle çalışın. Tüm insanlara onu öğretmekten, tereddüt edenleri cesaretlendirmekten, muhalifleri ikna etmekten, bu inancın saflığını en ufak bir şekilde bile lekeleyebilecek hiçbir şeye asla müsamaha göstermeyerek ve göz yummayarak inancı zayıf olanları güçlendirmekten asla vazgeçmeyin. Aynı büyük zihin gücüyle, dışında hiçbir kurtuluşun olmadığı Katolik Kilisesi ile olan birliklerini tüm insanlarda teşvik edin; ayrıca en kutsal dinimizin tüm yapısının dayandığı bu Petrus Makamı'na olan itaatlerini de teşvik edin."
  bpm_christian_democrats_events.1.a:0 "Seçimler çok cringe - Papa, muhtemelen (ciddi ciddi)"