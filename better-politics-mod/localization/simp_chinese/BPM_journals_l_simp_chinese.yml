 je_bpm_1834_additional_act:0 "1834年补充法案"
 je_bpm_1834_additional_act_reason:0 "1831年皇帝堂·佩德罗一世退位，三年之后，1824年巴西宪法仍未进行任何改革。国家因威胁其统一的斗争而四分五裂：里约热内卢、马拉尼昂和帕拉的革命暴动。最近的一次是1833年欧鲁普雷图的军队哗变。参议院是保守的，尽管远非《四月七日报》所称“堂·佩德罗一世的奴隶制”。1833年的选举让[SCOPE.gsInterestGroup('liberals_ig').GetName]在众议院取得多数，而依据1833年10月12日的法律，议员们被授予了制宪权。补充法案正是这一主张各省更大自治的多数派的直接成果。它于1834年8月12日获批，将联邦主义原则适用于君主制。这引发了中央政府与各省之间对控制权的冲突。[SCOPE.gsInterestGroup('conservatives_ig').GetName]指责该法案把国家变成了一个“无政府状态”，并主张必须予以修订。自由派关于联邦君主制的梦想能否维系？还是说，为了推行秩序，一场“保守的复辟”势在必行？"
 bpm_brz_provinces_turmoil:0 "各省动乱"
 je_bpm_arg_confed:0 "徒有其名的邦联"
 je_bpm_arg_confed_reason:0 "$je_bpm_arg_confed$"
 je_bpm_arg_confed_desc:0 "阿根廷是一个不成形的国家，一个自20年前从西班牙独立以来便深陷动乱的邦联。阿根廷的各组成省份缺乏一部将它们捆绑在一起的正式宪法，取而代之的是政治利益、以及如今在强人#bold 胡安·曼努埃尔·德·罗萨斯#!统治下往往诉诸军事力量来维系彼此。"
 je_peru_bolivia_goal:1 "维持玻利维亚的[SCOPE.sCulture('south_andean_culture').GetName]与[SCOPE.sCulture('quechua_culture').GetName][Concept('concept_subject', '$concept_subjects$')]，同时将[concept_liberty_desire]保持在#bold 60#!以下，持续10年"
 je_bpm_greece_early_parties:0 "早期希腊政党"
 je_bpm_greece_early_parties_reason:0 "早期希腊政党围绕各种利益和背景组织起来，但无论这些因素如何多样，这些政治派别都以三大强国（英国、法国和俄国）之一命名。俄国党是一个亲东正教、社会保守的政党。与之对立的是两个自由派政党组成的联盟——英国党和法国党，它们要求一部成文宪法。"
 bpm_gre_early_parties:0 "早期希腊政党"
 je_bpm_modernizers:0 "现代化派之辩"
 je_bpm_modernizers_status:0 "监测$bpm_je_all_modernizers$及其对手的辩论。"
 je_bpm_modernizers_status_no_dialectic:0 "#bold 辩证#!目前太过薄弱。"
 je_bpm_modernizers_status_modernizer_prominence_overwhelming:0 "$bpm_je_all_modernizer$s在知识分子中#bold 压倒性地占据主导#!。"
 je_bpm_modernizers_status_modernizer_prominence_strong:0 "$bpm_je_all_modernizer$s在知识分子中占主导。"
