# BRAZIL
 je_bpm_1834_additional_act:0 "1834 Ek Yasası"
 je_bpm_1834_additional_act_reason:0 "İmparator I. Pedro'nun 1831'de gerçekleşen tahttan feragat etmesinden üç yıl sonra, 1824 Brezilya anayasasında henüz hiçbir reform yapılmamıştı. Ülke birliğini tehdit eden mücadelelerle parçalanmıştı: Rio de Janeiro, Maranhão ve Pará'daki devrimci patlamalar. En sonuncusu 1833'teki Ouro Preto askeri isyanıydı. Senato, O Sete de Abril gazetesinin adlandırdığı gibi \"I. Pedro'nun köleliğinden\" uzak olmasına rağmen muhafazakârdı. 1833 seçimleri Temsilciler Meclisi'ne [SCOPE.gsInterestGroup('liberals_ig').GetName] çoğunluğunu gönderdi ve 12 Ekim 1833 tarihli yasayla temsilcilere kurucu yetkiler verildi. Ek Yasa, eyaletler için daha fazla özerkliği savunan bu çoğunluğun doğrudan bir sonucuydu. 12 Ağustos 1834'te onaylanan yasa, federalist ilkeleri monarşiye uyarladı. Bu durum, merkezi hükümet ile eyaletler arasında kontrol için çatışmalara neden oldu. [SCOPE.gsInterestGroup('conservatives_ig').GetName] yasayı ülkeyi bir \"anarşiye\" dönüştürmekle suçluyor ve gözden geçirilmesi gerektiğini savunuyorlar. Federatif bir monarşiye dair liberal hayal sürdürülecek mi, yoksa düzeni sağlamak için bir \"muhafazakar restorasyon\" gerekli mi olacak?"

 bpm_brz_provinces_turmoil:0 "Eyaletlerdeki Kargaşa"

 je_bpm_arg_confed:0 "Sadece İsimde Bir Konfederasyon"
 je_bpm_arg_confed_reason:0 "$je_bpm_arg_confed$"
 je_bpm_arg_confed_desc:0 "Arjantin biçimsiz bir ulustur, bölgenin İspanyollardan bağımsızlığını kazanmasından bu yana geçen 20 yıl boyunca kargaşa içinde kalmış bir konfederasyondur. Arjantin'i oluşturan eyaletler, onları birbirine bağlayan resmi bir anayasadan yoksundur, bunun yerine siyasi çıkarlar ve şu anda güçlü adam #bold Juan Manuel de Rosas'ın#! kontrolündeki askeri güçle birbirlerine bağlıdırlar."
 je_peru_bolivia_goal:1 "Bolivya'nın [SCOPE.sCulture('south_andean_culture').GetName] ve [SCOPE.sCulture('quechua_culture').GetName] [Concept('concept_subject', '$concept_subjects$')] (Tebaanızı) korurken, 10 yıl boyunca [concept_liberty_desire] (Özgürlük Arzusunu) #bold 60'ın#! altında tutun"

# GREECE
 je_bpm_greece_early_parties:0 "Erken Dönem Yunan Partileri"
 je_bpm_greece_early_parties_reason:0 "Erken dönem Yunan partileri çeşitli çıkarlar ve geçmişler etrafında örgütlenmiştir, ancak bu çeşitli faktörlere bakılmaksızın siyasi oluşumlar üç Büyük Güçten (İngiltere, Fransa ve Rusya) birinin adını almıştır. Rus Partisi, Ortodoks yanlısı ve sosyal açıdan muhafazakar bir partidir. Yazılı bir anayasa talep eden İngiliz Partisi ve Fransız Partisi olmak üzere iki liberal partinin ittifakı buna karşı çıkmaktadır."

