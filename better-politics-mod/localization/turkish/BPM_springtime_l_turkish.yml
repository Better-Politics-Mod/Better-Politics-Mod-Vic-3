 bpm_frankfurt_parliament_events.28.t:0 "Gece Gündüz Çalışmak"
 bpm_frankfurt_parliament_events.28.d:0 "Delegeler, anayasanın bir sonraki bölümünün ince ayrıntılarını belirlemek için son zamanlarda fazla mesai yapıyorlar. Çabaları meyvesini verdi ve bir sonraki oturum planlanandan erken gerçekleştirilecek."
 bpm_frankfurt_parliament_events.28.f:0 "Bir grup avukat, deneyimli politikacı ve ideolog gecenin geç saatlerine kadar mum ışığında çalışıp tartıştılar; zihinlerindeki politikayı var olanın politikası olacak şekilde şekillendirdiler. Sabaha karşı mumları eriyip dibe inmişti."
 bpm_frankfurt_parliament_events.28.a:0 "Biraz kahveyi hak ettiler!"

 bpm_frankfurt_parliament_events.29.t:0 "Satır Araları"
 bpm_frankfurt_parliament_events.29.d:0 "Önerilen bir zeyilnamenin (eklenti) yakın zamanda gözden geçirilmesi, göz ardı edilemeyecek bazı ciddi ihmalleri (oversights) ortaya çıkardı. Gelecekteki oylamayı geciktirecek önemli bir bölümün yeniden yazılması gerekiyor."
 bpm_frankfurt_parliament_events.29.f:0 "\"Bunun gözümüzden kaçmış olduğuna inanamıyorum, oysa ki çok büyük ilerleme kaydediyorduk.\"\n\nAdamın amiri sakalını sıvazladı.\n\n\"Eh, Aristoteles'in de bir zamanlar belirttiği gibi:\""
 bpm_frankfurt_parliament_events.29.a:0 "İyi başlanmış bir iş, yarı yarıya bitmiş demektir."

 bpm_frankfurt_parliament_events.30.t:0 "Bir Egemenlik Meselesi"
 bpm_frankfurt_parliament_events.30.d:0 "Frankfurt'taki meclisin son haftalarda izlediği yön egemenliğimizi ve özerkliğimizi yok ediyor. Muhafazakar sesler, parlamentoyu ve önerdiği anayasayı reddetmemizi talep ediyor."
 bpm_frankfurt_parliament_events.30.a:0 "Bu meclisi derhal tanımaktan vazgeçin!"
 bpm_frankfurt_parliament_events.30.b:0 "Alman birliğine bağlıyız."

 bpm_frankfurt_parliament_events.31.t:0 "Muhafazakar Değişiklikler"

 bpm_frankfurt_parliament_events.32.t:0 "Radikal Bir Dönüş"
 bpm_frankfurt_parliament_events.32.d:0 "Meclis, Alman volk'u (halkı) için bir cumhuriyet lehine Almanya'nın prenslerini bir kenara atmayı amaçlayan radikal hiziplerin (fractions) hakimiyeti altına girdi. Meclis, yeni kurulan [SCOPE.sCountry('frankfurt_crown_candidate').GetName] cumhuriyeti önderliğinde devrimci bir koalisyon doğurdu."
 bpm_frankfurt_parliament_events.32.a:0 "Bu meclisi derhal tanımaktan vazgeçin!"
 bpm_frankfurt_parliament_events.32.b:0 "Tüm Cermanya (Germania) için savaşacağız!"

 bpm_frankfurt_parliament_events.33.t:0 "Diyarları Bölmek"
 bpm_frankfurt_parliament_events.33.f:0 "Bırak başkaları savaşsın, sen, mutlu Avusturya, evlen!\n\n—15. Yüzyıl Deyişi"
 bpm_frankfurt_parliament_events.33.d:0 "Almanya tacının Avusturya Kaiser'inin başını süslemesiyle, Büyük Avusturya İmparatorluğu meselesi gündeme geldi. Alman delegeler ve Habsburg diyarlarından gelen pek çok temsilci, Alman olmayan Habsburg krallıklarının tamamen entegrasyonunu reddederek nasıl devam edileceği konusunda uzun bir tartışmaya girdiler."
 bpm_frankfurt_parliament_events.33.a:0 "İmparatorluğun Alman koruması altında egemen diyarlara bölünmesini onaylayın."
 bpm_frankfurt_parliament_events.33.b:0 "Diyarların Kaiser ile kişisel bir birlik içinde (personal union) kalmasını talep edin."
 bpm_frankfurt_parliament_events.33.c:0 "Avusturya ve imparatorluğu bölünemez! Tam entegrasyondan daha azını kabul etmeyeceğiz."

 bpm_frankfurt_parliament_events.200.t:0 "Frankfurt Parlamentosunun Başlangıcı"
 bpm_frankfurt_parliament_events.200.d:0 "Avrupa'yı kasıp kavuran devrimci şevk ile birlikte Alman Konfederasyonu'nun dört bir yanından gelen reformist ve devrimci delegeler St. Paul Kilisesi'nde ulusal bir meclis kurarak Almanya'yı modern bir anayasa altında birleştirmeyi amaçlıyorlar..."
 bpm_frankfurt_parliament_events.200.f:0 "Almanya'nın birliğini istiyoruz; özgürlüğün, herhangi bir tarafın isteğine bağlı olarak bahşedilen bir hediye veya armağan olarak değil, ulusun doğal mülkiyeti olarak tanınmasını istiyoruz... Devrimin sona erdirilebilmesi, Alman ulusu ve bireysel Alman kabileleri (tribes) için kalıcı bir yasallık, barış ve refah durumunun güvence altına alınabilmesi için bu temelde kurulan anayasaların bir bütün olarak devlet tarafından garanti edilmesini istiyoruz.\n\n—Mart Derneği Programı, 1848"
 bpm_frankfurt_parliament_events.200.a:0 "Buz kırıldı, Cermanya'da (Germania) bahar."

