  bpm_acw_events.301.t:0 "Sivil Milis Yasası"
  bpm_acw_events.301.d:0 "Sivil Milis Yasası, sivil savunma milisleri için, özellikle Güney'de Özgürleşenler (Azatlılar) tarafından kendi güvenlikleri için kurulan milisler için federal korumayı yasalaştırdı. Federal hükümet ayrıca Güney'deki güçlü Azatlılar Bürosu ve Adalet Bakanlığı altyapısını olası konfederasyon toparlanmalarına karşı erken uyarı fenerleri olarak kullanarak bu grupların eyalet hükümetleri tarafından dağıtılmasını önlemek için müdahale etme hakkını saklı tutar."
  bpm_acw_events.301.f:0 ""Her siyahın evinde bir Winchester tüfeği onur köşesinde durmalıdır... Beyaz adam, Afro-Amerikalı kurbanı her yere serildiğinde kendisinin de toz yutma riskinin aynı derecede büyük olduğunu bildiğinde, Afro-Amerikan hayatına daha büyük saygı duyacaktır."\n\n—Ida B. Wells, 1892"
  bpm_acw_events.301.a:0 "John Brown'ı gururlandırdık"

  bpm_acw_events.302.t1:0 "On Dördüncü Değişiklik"
  bpm_acw_events.302.t2:0 "On Beşinci Değişiklik"
  bpm_acw_events.302.t3:0 "On Altıncı Değişiklik"    
  bpm_acw_events.302.d:0 "Anayasa federal düzeyde ayrımcılığı yasaklayan yasalara izin verse de, federal yönetimin özel şahıslar tarafından yapılan ayrımcılığı yasaklama yetkisindeki belirsizlik, ırkçılar tarafından ayrımcılık karşıtı yasaları iptal etmek için çoktan istismar edildi. Bunu düzeltmek için birkaç yıl önce ticaret maddesi yetkilerini bu tür ayrımcılık karşıtı yasalara izin verecek şekilde açıkça genişleten yeni bir anayasa değişikliği önerildi. Büyük mücadelelerin ardından son anda Cumhuriyetçiler değişikliği geçirmek için yeterli siyasi sermayeyi toplamayı başardılar. Azatlılar şüphesiz hâlâ yasa dışı ayrımcılıkla karşılaşacaktır ancak en azından artık dava açma umudu var."
  bpm_acw_events.302.f:0 ""Kongre'ye özel hakların düzenlenmesi için bir belediye hukuku kuralları bütünü oluşturma yetkisi vermez; ancak eyalet yasalarının işleyişine ve eyalet görevlilerinin (yürütme veya yargı) bu değişiklikte belirtilen temel hakları zedeleyici eylemlerine karşı telafi yolları sağlama yetkisi verir."\n\n—Joseph P. Bradley, 1883"
  bpm_acw_events.302.a:0 "Siyahların eşitliğini sağladık, şimdilik"

  bpm_acw_events.303.t:0 "Sivil Hakların Uygulanması Yasası"
  bpm_acw_events.303.d:0 "Uzun tartışmaların ardından Kongre, vergiye tabi olmayan Yerliler hariç tüm kişilere vatandaşlık tanıyan ve bu kişilerin tamamına yasalar önünde ve sözleşmelerde eşit koruma garantisi veren bir Sivil Haklar Yasası çıkardı. Ancak bazıları Federal hükümetin gerçek yasal eşitliği uygulayacak yaptırım gücünden hâlâ yoksun olduğundan endişe ediyor."
  bpm_acw_events.303.f:0 ""Amerika Birleşik Devletleri vatandaşlarının 'sivil haklar ve dokunulmazlıklardan' yararlanmada eşitliğini sağlar. Bu terimler ne anlama geliyor? Irk veya renk ayrımı yapılmaksızın tüm vatandaşların sivil, sosyal, siyasi her şeyde eşit olacağı anlamına mı geliyor? Kesinlikle bu şekilde yorumlanamazlar... Sivil haklar, hükümetin kurulması, desteklenmesi veya yönetimi ile hiçbir ilgisi olmayan haklardır."\n\n—James F. Wilson, 1866"
  bpm_acw_events.303.a:0 "Yeterince şey yaptık mı?"

  bpm_acw_events.304.t:0 "Avarelik Yasası"
  bpm_acw_events.304.d:0 "Geleneksel kölelikten azat edilen milyonlarca insan, kendilerini hâlâ baskı altına almak isteyen bir hükümetin hedefinde buluyor. Kongre, muhalifleri tarafından "Kara Yasalar" (Black Codes) olarak adlandırılan bir dizi federal Avarelik Yasasını hızla yürürlüğe koydu. Yasa avareliğin ötesinde, hâlâ tam vatandaş sayılmayan Azatlılara seyahat konusunda ağır kısıtlamalar ve önemsiz suçlar için sert cezalar getiriyor."
  bpm_acw_events.304.f:0 ""Kitlelerin fikirlerini şekillendirmede ve kontrol etmede büyük rol oynayan adamlar... köle yasaları çıkarmakla ve bunları astlarına duyurarak uygulamalarını emretmekle meşguldüler; üstelik bu durum vali ve diğer üst düzey eyalet yetkililerinin bilgisi dahilindeydi. ... Bu yasalar, sadece 'köle' kelimesi çıkarılıp yerine 'Zenci' konulmuş olan eyaletin eski kara yasalarıydı..."\n\n—Thomas W. Conway, 1866"
  bpm_acw_events.304.a:0 "Bir suç gitti, yerine bir başkası geldi..."

  bpm_acw_events.305.t:0 "Afrikalıları Tehcir Yasası"
  bpm_acw_events.305.d:0 "Yeniden Yapılanma'nın tamamen çökmesiyle birlikte Kongre koridorlarına bir gericilik dalgası çarptı. Federal hükümet başkanın da onayıyla Azatlıları Liberya Cumhuriyeti'ne sınır dışı etmeye yönelik radikal bir planı uygulamaya koydu. Askerlerin Azatlıları acımasızca toplayıp çeşitli limanlara sürmesiyle bu durum geniş çaplı şiddeti tetikledi. Radikaller ve siyah aktivistler öfkeli ve bu yasaya direnmek için ellerinden gelen her şeyi yapıyorlar."
  bpm_acw_events.305.f:0 ""Sen bir insan mısın? Öyleyse insani bir kalbin olmalı... Gemide o acı çeken yaratıkları istiflediğinde ya da zavallı parçalanmış kalıntılarını denize fırlattığında hiç mi merhamet duymadın? Gözünden bir damla yaş damlamadı mı, göğsünden bir ah çıkmadı mı? Şimdi de mi merhamet hissetmiyorsun? Hissetmiyorsan, kötülüklerinin bardağı taşana kadar devam et. O zaman yüce Tanrı seninle, senin onlara davrandığın gibi ilgilenecek ve döktüğün tüm kanların hesabını senden soracaktır. Ve o gün Sodom ve Gomora için durum senden daha katlanılabilir olacaktır!"\n\n—John Wesley, 1774"
  bpm_acw_events.305.a:0 "Günahlarımız yüzünden sonsuza kadar lanetleneceğiz"

  bpm_acw_events.306.t:0 "İkinci Ağız Tıkama Kuralı"
  bpm_acw_events.306.d:0 "Kölelerin özgürleştirilmesi tamamen durdu; siyah nüfusun büyük bir kısmı gayriresmi köleliğe ve sözleşmeli köleliğe geri sürüklendi. Kongre'de sivil hakların genişletilmesinin daha fazla tartışılmasını engelleyen yeni bir ağız tıkama kuralı yürürlüğe girdi."
  bpm_acw_events.306.f:0 ""Köleliğin bu ülkede yol açması muhtemel felaketleri düşündükçe ürperiyorum. Beklentilerimi anlatsam deli olduğumu düşünürsünüz..."\n\n—John Adams, 1820"
  bpm_acw_events.306.a:0 "Kendinle gurur duyuyor musun?"

  bpm_acw_events.307.t1:0 "On Üçüncü Değişiklik"
  bpm_acw_events.307.t2:0 "On Dördüncü Değişiklik"
  bpm_acw_events.307.t3:0 "On Beşinci Değişiklik"
  bpm_acw_events.307.d:0 "Azatlılar kölelikten kurtulduklarından beri bir bakıma arafta yaşıyorlardı. Artık köle değillerdi ancak Cumhuriyetin vatandaşı da sayılmıyorlardı. Bu durum birçok eyalet hükümetinin yasal bir yaptırımla karşılaşmadan onların sivil özgürlüklerini suistimal etmesine olanak tanıdı. Bu anayasa değişikliği Amerika Birleşik Devletleri'nde doğan veya vatandaşlığa geçen herkese vatandaşlık hakkı vererek temel anayasal haklarının ihlal edilmesini federal olarak yasaklıyor."
  bpm_acw_events.307.f:0 ""Bir beyaz adamı bir suç için hangi yasa cezalandırıyorsa, siyah adamı da tamamen aynı şekilde ve aynı derecede cezalandıracaktır. Beyaz adamı hangi yasa koruyorsa, siyah adama da 'eşit' koruma sağlayacaktır. Birine hangi telafi yolu sağlanıyorsa, herkese sağlanacaktır."\n\n—Thaddeus Stevens, 1866"
  bpm_acw_events.307.a:0 "Yaşama ve özgürlüğe!"

  bpm_acw_events.308.t:0 "Azatlılar Bürosu Hukuk Kanadı Genişletildi"
  bpm_acw_events.308.d:0 "Başkan; Güney'de sivil hakları savunmak amacıyla daha fazla dava açabilmesi için personelini ve finansmanını büyük ölçüde genişleterek Azatlılar Bürosu'na yeni yetkiler verdi. Büro giderek federal hükümetin kalıcı bir parçası haline geliyor gibi görünüyor."
  bpm_acw_events.308.f:0 ""Topraklarından sürülen azatlılar, hukuka aykırı şekilde iptal edilen evlilik cüzdanları, cezasız kalan linçler. Büronun önünde bitmek bilmeyen bir dava yığını var gibi görünüyordu ancak bünyesindeki basiretli bürokratlar şevkle çalışmaya devam ettiler..." "
  bpm_acw_events.308.a:0 "Adaletin kılıcının menzili genişliyor."

  bpm_acw_events.309.t:0 "Ku Klux Klan Yasası"
  bpm_acw_events.309.d:0 "Bugün Güneyli bir beyaz üstünlükçü grup olan Ku Klux Klan, bir Kongre yasasıyla isyancı ve Amerika Birleşik Devletleri'nin düşmanı ilan edildi. Bu bildiri KKK şubelerini dağıtma ve liderliğini tutuklama görevini yalnızca Ordu'ya değil, aynı zamanda yerel kolluk kuvvetlerine de yüklüyor."
  bpm_acw_events.309.f:0 ""Azatlılar Bürosu ajanlarının yardım ettiği ordu birlikleri, Arkansas'taki KKK hücrelerini kökünden sökmek için aylarca süren bir operasyon yürütecekti. En büyük mücadele mülksüzleştirilmiş plantasyon sahipleriyle değil, yerel şubelerin kimliklerini ve karargahlarını teslim etmeye defalarca direnen bölgenin sıradan beyazlarıyla olacaktı..." "
  bpm_acw_events.309.a:0 "Terörün maskesi düştü."

  bpm_acw_events.310.t:0 "Sarsılmaz Yemin (Ironclad Oath)"
  bpm_acw_events.310.d:0 "İsyancı Güneylileri makamlardan uzaklaştırmayı amaçlayan bir tedbir olarak, seçmenlerin köleliğin kaldırılmasına uyma taahhüdünde bulunmasını zorunlu kılmanın yanı sıra, seçilmiş ve hatta seçilmemiş eyalet yetkilileri de Birlik'e sadakat yemini etmeye zorlanıyor."
  bpm_acw_events.310.f:0 ""Ben, vatandaş olduğum günden bu yana Amerika Birleşik Devletleri'ne karşı hiçbir zaman gönüllü olarak silah taşımadığıma; oradaki silahlı düşmanlık içinde bulunan kişilere gönüllü olarak hiçbir yardım, destek, tavsiye veya cesaret vermediğime; Amerika Birleşik Devletleri'ne düşman olan herhangi bir otorite veya sözde otorite altında hiçbir makamın yetkilerini aramadığıma, kabul etmediğime ve icra etmeye kalkışmadığıma... ciddiyetle yemin ederim." "
  bpm_acw_events.310.a:0 "Tanrı yardımcım olsun."

  bpm_acw_events.311.t:0 "Adalet Bakanlığı"
  bpm_acw_events.311.d:0 "Başsavcılık pozisyonu Cumhuriyetin ilk günlerinden beri var olmasına rağmen, bu yetkili ve federal hükümetteki diğer avukatlar yarı zamanlı ve koordinasyonsuz çalışıyorlardı. Başkan şimdi Başsavcılık makamını, federal yasal soruşturmaların büyük çoğunluğunu koordine etme yetkisine sahip kalıcı bir Adalet Bakanlığı'na dönüştüren bir yasa tasarısını imzaladı."
  bpm_acw_events.311.f:0 ""Amerika Birleşik Devletleri Anayasasını içeriden ve dışarıdan tüm düşmanlara karşı destekleyeceğime ve savunacağıma; aynı şekilde tam bir inanç ve sadakat göstereceğime; bu yükümlülüğü hiçbir zihinsel çekince veya kaçınma amacı gütmeksizin özgürce üstlendiğime; ve girmek üzere olduğum makamın görevlerini layıkıyla ve sadakatle yerine getireceğime yemin ederim. Tanrı yardımcım olsun.""
  bpm_acw_events.311.a:0 "Qui Pro Domina Justitia Sequitur (Adalet Hanımefendisi Adına Takip Eden)"

  bpm_acw_events.312.t1:0 "On Üçüncü Değişiklik"
  bpm_acw_events.312.t2:0 "On Dördüncü Değişiklik"
  bpm_acw_events.312.t3:0 "On Beşinci Değişiklik"    
  bpm_acw_events.312.d:0 "Birlikte köleliğin kaldırılması başkanlık kararnamelerine bağlı kalmıştı; ancak bu anayasa değişikliğinin kabul edilmesi ve onaylanması ülke çapında köleliği ve zorla çalıştırmayı yasaklıyor. Tabii ki bir suçun cezası olarak uygulanan zorla çalıştırma hariç..."
  bpm_acw_events.312.f:0 ""Köleliğin bir kötülük olduğunu aklı başında, dürüst hiçbir insan inkâr edemez. Bu ülkenin çocukluğundan bu yana en büyük laneti olmuştur. Ve şimdi isyandaki eyaletler sadık eyaletlere bu laneti kaldırma, bu iğrenç lekeyi silme fırsatını verdiler, ben de diyorum ki yapılsın."\n\n—Ebon C. Ingersoll, 1864"
  bpm_acw_events.312.a:0 "Kendine has kurum nihayet ölüyor"

  bpm_acw_events.313.t:0 "Güney İskân Yasası (Southern Homestead Act)"
  bpm_acw_events.313.d:0 "İç Savaş sırasında yakışıklı generallerimizin çoğu çatışmanın sonunu hızlandırmak için yasaları esnettiler. Bu esnekliklerden biri de plantasyon sahiplerinin topraklarını söz konusu toprakları işleyenlere, yani Güney'in Azatlılarına yeniden dağıtma vaadiydi. Yürütme Organının ayaklanmayı kışkırtmakla bağlantılı olanları mülklerine el koyarak cezalandırmasına izin veren ustaca hazırlanmış bir yasa sayesinde Başsavcı ve Azatlılar Bürosu'nun bu vaadi yerine getirmesi için etkili bir yol oluşturduk."
  bpm_acw_events.313.f:0 ""Aile reisi olan üç saygın zenci toprağa yerleşmek istediğinde ve bu amaçla yukarıda belirtilen sınırlar içinde açıkça tanımlanmış bir adayı veya bölgeyi seçtiğinde, İskân ve Plantasyon Müfettişi bizzat veya atayacağı ast bir subay aracılığıyla onlara söz konusu adaya veya bölgeye yerleşme izni verecek ve barışçıl bir tarım yerleşimi kurmalarını sağlamak için elinden gelen yardımı yapacaktır."\n\n—William T. Sherman, 1865"
  bpm_acw_events.313.a:0 "Ruhu dimdik ilerliyor!"

  bpm_acw_events.314.t1:0 "On Üçüncü Değişiklik"
  bpm_acw_events.314.t2:0 "On Dördüncü Değişiklik"
  bpm_acw_events.314.t3:0 "On Beşinci Değişiklik"    
  bpm_acw_events.314.d:0 "Son yıllarda Güney'in ırkçı tiranları, renklerine ve geçmişteki kölelik statülerine atıfta bulunarak Azatlıların oy kullanma hakkını ellerinden almayı amaçlayan son derece sinsi yasalar hazırlamaya başladılar. Her zaman uyanık olan Kongre ve Eyaletler bu menfur uygulamaları yasaklamak ve Azatlılara oy kullanma hakkını garanti etmek için yeni bir anayasa değişikliği kabul ettiler."
  bpm_acw_events.314.f:0 ""Amerika Birleşik Devletleri vatandaşlarının oy kullanma hakkı, Amerika Birleşik Devletleri veya herhangi bir Eyalet tarafından ırk, renk veya önceki kölelik durumu nedeniyle reddedilemez veya kısıtlanamaz."\n\n—15. Değişiklik, 1870"
  bpm_acw_events.314.a:0 "Ruhu dimdik ilerliyor!"

  bpm_acw_events.315.t:0 "Azatlılar Bürosu Eğitim Kanadı Genişletildi"
  bpm_acw_events.315.d:0 "Azatlıların birliğimize tam entegrasyonuna yardımcı olmak için tasarlanan Azatlılar Bürosu'na Hükümet tarafından kapsamlı yeni hedefler verildi. Güney'deki cehalet belasına son vermek amacıyla büyük bir eğitim seferberliği başlatıldı. Pratik sanayi becerilerine odaklanılsa da büronun emek odaklı hedeflerine rağmen bu politikalar geleceğin Siyah entelektüelleri için de temel oluşturuyor."
  bpm_acw_events.315.f:0 ""Azatlılar Bürosu'nun en büyük başarısı, Zenciler arasında ücretsiz okul kurması ve Güney'deki tüm sınıflar arasında ücretsiz ilköğretim fikrini yerleştirmesiydi."\n\n—W. E. B. DuBois, 1903"
  bpm_acw_events.315.a:0 "Ruhu dimdik ilerliyor!"

  bpm_acw_events.316.t:0 "Haksız Özgürlük"
  bpm_acw_events.316.d:0 "Resmi olarak özgür olsalar da sözde Azatlıların bunu bilmediği zannedilebilir. Afro-Amerikalıların yasal haklarını çevreleyen belirsizlik Azatlıların sistematik olarak sömürülmesine ve ayrımcılığa uğramasına yol açtı. Elbette bu adaletsizlik görmezden gelinemez, değil mi?"
  bpm_acw_events.316.f:0 ""Bize oy vaat ediyorsunuz sonra da 'We Shall Overcome' şarkısını söylüyorsunuz"\n\n—Len Chandler, 1965"
  bpm_acw_events.316.a:0 "Bu ayrımcılığa sert bir şekilde müdahale edin ve sorumluları kovun!"
  bpm_acw_events.316.b:0 "Gerçekten de Beyaz Adamın saygı duymak zorunda olduğu hiçbir hak yokmuş..."

  bpm_acw_events.317.t:0 "Mahkûm Kiralama Sistemi"
  bpm_acw_events.317.d:0 "Güney ekonomisi uzun süredir köle emeğine bağımlıydı; bu da Azatlılar özgürlüklerine kavuştuğunda büyük bir ekonomik kaosa yol açtı. Görünüşe göre bu kaos ortamında Güney'deki maden sahipleri yerel yetkililerle gizli anlaşmalar yaparak Azatlıları asılsız suçlamalarla hapse atıyor ve ardından maliyetleri düşük, kârları yüksek tutmak için onları maden işletmelerine kiralıyorlar. Elbette bu adaletsizlik görmezden gelinemez, değil mi?"
  bpm_acw_events.317.f:0 ""Bizi tarlada ve gecekondu mahallelerinde sessiz tutmak için kumpas kuruyorsunuz."\n\n—Len Chandler"
  bpm_acw_events.317.a:0 "Azatlılar Bürosu'nu kullanarak bir soruşturma başlatın, bu neo-kölelik sona ermeli!"
  bpm_acw_events.317.b:0 "Tarlalarda ölümden madenlerde ölüme; bu bir devrimden ziyade bir nakil..."

  bpm_acw_events.318.t:0 "Konfederasyon Terörü"
  bpm_acw_events.318.d:0 "Yeniden Yapılanma devam ederken tüm Konfederasyon askerlerinin esir tutulabilmesi ideal olsa da, Güney'in gerçek durumu mükemmellikten çok uzaktır. Bazı generaller de dahil olmak üzere Konfederasyon Ordusu'nun birçok gazisi, Azatlıları sindirerek boyun eğdirmek için militan örgütler kurdu. Elbette bu adaletsizlik görmezden gelinemez, değil mi?"
  bpm_acw_events.318.f:0 ""Zeytin dalını büküp yay yapıyorsunuz, sonra bir gülümsemeyle, bunca zamandır sakladığınız linç ipini ona takıyorsunuz"\n\n—Len Chandler, 1965"
  bpm_acw_events.318.a:0 "Bu isyancıların kökü kazınmalı! Tüm hain partizanları ezmek ve özgür insanları korumak için orduyu konuşlandırın"
  bpm_acw_events.318.b:0 "Uygulanamayacaksa yasa çıkarmanın ne anlamı var?"

  bpm_acw_events.319.t:0 "Konfederasyon Darbesi"
  bpm_acw_events.319.d:0 "İç Savaş sona erdiğinde birçok Konfederasyon yanlısı politikacı, önceki seçimin kaosu sırasında Washington'a yürüyüp federal hükümete darbe yapmış olmayı diledi. Görünüşe göre gerici güçler bu dersi iyi kavramış ve yerel sempatizanları kullanarak bir Güney eyaletinin yasal hükümetine şiddet yoluyla darbe yapmışlar. Elbette bu adaletsizlik görmezden gelinemez, değil mi?"
  bpm_acw_events.319.f:0 ""Haydutların vahşi dünyasında aşırı olan sizlersiniz. Ve kulaklıklarınızı asla çıkarmıyorsunuz, biz çığlık attığımızda bizi dinlemiyorsunuz"\n\n—Len Chandler, 1965"
  bpm_acw_events.319.a:0 "Meşru hükümeti yeniden kurmak için sadık yerel halkı kullanarak aceleyle müdahale edin!"
  bpm_acw_events.319.b:0 "Özgürlük, bir Afrika kanı ve kurşun dalgasıyla akıp gidiyor..."

  bpm_acw_events.320.t:0 "Konfederasyon Hukuk Savaşı (Lawfare)"
  bpm_acw_events.320.d:0 "İç Savaş savaş alanında verilirken aynı zamanda mahkeme salonlarında da verildi. Şehit Kurtarıcı özgürleştirici eylemleri nedeniyle tiran ilan edilmiş, savaşı çabuk bitirmek için gerekli kararları alması her fırsatta engellenmişti. Şimdi Konfederasyon sempatizanlarının Yeniden Yapılanma'ya karşı aynı adli savaş taktiklerini uygulamaya başladığı görülüyor. Elbette bu adaletsizlik görmezden gelinemez, değil mi?"
  bpm_acw_events.320.f:0 ""Hapishaneleriniz siyah adamlarla dolu ve mahkemeleriniz nefretle bembeyaz, Ve her özgürlük arayışımızda birileri bize fısıldıyor: bekleyin"\n\n—Len Chandler, 1965"
  bpm_acw_events.320.a:0 "Başsavcıya bu Konfederasyon sempatizanlarına karşı bakanlığının tüm gücünü kullanması talimatını verin"
  bpm_acw_events.320.b:0 "Çok az personel ve çok fazla dava varken hatalar kaçınılmazdır..."

  bpm_acw_events.321.t:0 "Neo-Kölelik"
  bpm_acw_events.321.d:0 "Konfederasyon Hükümeti teslim olduğunda plantasyon sahiplerinin yaptığı ilk şeyi biliyor musunuz? Şiddet tehdidiyle Azatlılara bedenlerini plantasyon sahiplerine bağlayan yasadışı sözleşmeler imzalattılar. Her gün köle sahiplerinin en büyük günahları işlediği bir başka vaka ortaya çıkıyor. Elbette bu adaletsizlik görmezden gelinemez, değil mi?"
  bpm_acw_events.321.f:0 ""Ama John Brown özgürlüğün ne olduğunu biliyordu ve bize birazını kazandırmak için öldü"\n\n—Len Chandler, 1965"
  bpm_acw_events.321.a:0 "Sorumluları cezalandırın ve kurbanların haklarını iade edin. Ardından bir sonraki soruşturmayı başlatın"
  bpm_acw_events.321.b:0 "Bu uygulamayı kınasak da teknik olarak şimdilik yürürlükteki yasaları ihlal etmiyor..."

  bpm_acw_events.322.t:0 "Yeniden Yapılanmacılar Komite Kontrolünü Ele Geçiriyor"
  bpm_acw_events.322.d:0 "Yeniden Yapılanma'nın ilerleyişindeki gecikmelerden bıkan Radikal Cumhuriyetçiler daha ılımlı müttefiklerinin elindeki tüm kalan komite başkanlıklarını ele geçirmeyi başardılar. Bu durum Yeniden Yapılanma yöntemlerinde daha radikal bir değişimin habercisi olup Başkan'ın veya Yüksek Mahkeme Yargıçlarının görevden alınması (impeachment) yönündeki bazı çağrılar şimdiden başlamıştır."
  bpm_acw_events.322.f:0 ""\[Stevens\] Amerikan tarihindeki muhtemel tek bir istisna dışında en güçlü diktatör parti ve kongre lideri olacak ve devrimci teorilerini saf bir kararlılıkla ülkeye dayatacaktı."\n\n—Claude Bowers (Irkçı), 1929"
  bpm_acw_events.322.a:0 "Demokrasinin cephaneliğindeki yeni silahlar"

  bpm_acw_events.323.t:0 "Kara Gün"
  bpm_acw_events.323.d:0 "Cumhuriyetçi Parti'deki sadık radikaller Azatlıların savunulmasında ne kadar kararlı olsalar da dolandırıcıların hilelerine karşı herkes kadar savunmasızdırlar. Bazı düzenbazlar birkaç Yürütme Organı yetkilisinin pratik zekası olmasaydı altın piyasasını tamamen köşeye sıkıştıracak ve ulusumuzu son enflasyonist politikalarını durdurmaya yönlendirecekti. Ancak bu dolandırıcılar şimdi parmaklarını Yürütme Organına doğrultarak daha geniş bir komplo hikayesi örüyorlar. Daha da kötüsü altın fiyatlarındaki dalgalanmalar birçok bankaya hücuma neden oldu ve bunların hepsi Liberal, Yeniden Yapılanma karşıtı Cumhuriyetçilere politikamıza saldırmaları için fazlasıyla mühimmat sağladı."
  bpm_acw_events.323.f:0 ""Bay Jay Gould'u lanet bir alçak olarak gördüğümü belirtmem için bana yetki verdiniz."\n\n—Cornelius Vanderbilt, 1872"
  bpm_acw_events.323.a:0 "Ekonomik kriz önlenmiş olabilir ancak bu skandal Yeniden Yapılanma çabalarımızın peşini bırakmayacak"

  bpm_acw_events.324.t:0 "Liberal Cumhuriyetçiler İsyan Ediyor!"
  bpm_acw_events.324.d:0 "İster yolsuzluk fısıltıları, ister Yeniden Yapılanma'nın maliyeti, isterse basit bir güç hırsı olsun Liberal Cumhuriyetçiler Büyük Eski Parti'yi (GOP) terk ettiler. Yaratıcılıktan uzak bir şekilde Liberal Cumhuriyetçi Parti adını verdikleri ve hızla Demokratlarla ortak liste (fusion ticket) düzenlemelerine giren yeni bir parti kurdular. Bu ayrılık Yeniden Yapılanma için bir tehdit olsa da ne kadar süreceği belirsizdir."
  bpm_acw_events.324.f:0 ""Kuzey ve Güney'deki yurttaşlarımızın kitleleri, onları bu kadar uzun süredir ayıran kanlı uçurumun üzerinden el sıkışmaya heveslidir."\n\n—Horace Greeley (Aptal), 1872"
  bpm_acw_events.324.a:0 "Gerçek eşitliğin sağlanması için bu politikaların gerekli olduğunu göremiyorlar mı?"

  bpm_acw_events.325.t:0 "Devrimin Boğulması"
  bpm_acw_events.325.d:0 "Altın Çetesi'nin tehdit ettiği şeyi Demiryolu Komplosu başardı. Başlangıçta sınır bölgesi ile doğu kıyısı arasında demiryolları inşa etmek için sözleşme imzalayan Demiryolu Şirketi, fonların akışını sürdürmek için yasa koyuculara rüşvet verirken federal hükümete inşaat maliyetinin iki katını fatura ediyordu. Şimdi skandal patlak verdiğinde aşırı değerlenmiş birçok demiryolu şirketi çökerken borsa kaosa sürüklendi ve çok sayıda kongre üyesi zan altında kaldı. En azından Liberal Cumhuriyetçiler sonunda kendi partilerinden vazgeçip yuvaya geri döndüler mi?"
  bpm_acw_events.325.f:0 ""Bu Crédit Mobilier'in ne olduğu, bu yolların kayıp yüz seksen milyon dolarlık sermaye hissesinin akıbeti kadar gizemle örtülü görünüyor."\n\n—Charles Francis Adams Jr, 1869"
  bpm_acw_events.325.a:0 "Bu krizle birlikte uzun ulusal buhranımız başlıyor"

  bpm_acw_events.326.t:0 "Serbest Gümüşün Yükselişi"
  bpm_acw_events.326.d:0 "Hükümet yolsuzluğu üzerine büyüyen tartışmaların ortasında yeni bir siyasi hareket şekillenmeye başladı. Serbest Gümüşçüler (Free Silverites), gümüşe kasıtlı olarak fazla değer biçen bimetalik standarda geri dönerek enflasyonu kasıtlı olarak hızlandırmayı savunuyorlar. Bu öneri sadece sınırdaki para arzını genişleterek orada ticareti ve yaşamı kolaylaştırmakla kalmayacak, aynı zamanda ulusumuzun birçok yoksul çiftçi ve işçisinin borçlarını da değersizleştirecektir. Şu anda birkaç popülistin alışılmışın dışındaki bir duruşu olsa da belki bu fikir bir gün gerçek bir harekete dönüşebilir."
  bpm_acw_events.326.f:0 ""İnsanlığı altından bir haç üzerinde çarmıha germeyeceksiniz."\n\n—William Jennings Bryan, 1896"
  bpm_acw_events.326.a:0 "Bu tür öneriler bu uzun buhranı gerçekten çözer mi?"

  bpm_acw_events.327.t:0 "Kanlı Gömleği Sallamak (Wave the Bloody Shirt)"
  bpm_acw_events.327.d:0 "Ulus yeni bir seçim kampanyasına girerken Cumhuriyetçiler bir kez daha kanlı gömlek sorusunu kendilerine sormalılar. Herkes İç Savaş'ta ölen, hayatı hainlerin kibri ve gururu yüzünden sonsuza dek değişen birini tanıyor. Eğer Cumhuriyetçiler sadık askerleri ödüllendirme, Konfederasyon yanlılarını cezalandırma ve Demokratları haince sempatileri nedeniyle kötüleme söylemi üzerinden kampanya yürütürlerse seçim pozisyonlarını koruyabilirler. Ancak bu strateji hem İç Savaş'ın yaralarının sarılmasını engellemekte hem de Liberal Cumhuriyetçilerin yüreklerinde büyük rahatsızlık yaratmaktadır. Büyük Eski Parti hangi stratejiyi benimseyecek?"
  bpm_acw_events.327.f:0 ""KKK bebeğimi elimden aldı\nOnu benden uzaklara götürdüler\nBenden çok uzaklara"\n\n—Joey Ramone, 1981"
  bpm_acw_events.327.a:0 "Seçmenleri yormamak için bu tür propagandayı asgari düzeyde tutalım"
  bpm_acw_events.327.b:0 "Kardeşinizi öldüren adamlara gerçekten Beyaz Saray'ın anahtarlarını mı vereceksiniz?"

  bpm_acw_events.328.t:0 "Büyük Eski Parti'yi İdare Etmek"
  bpm_acw_events.328.d:0 "Büyük Eski Parti (GOP) içinde sessiz bir savaş yaşanıyor. Liberaller ile Radikaller arasında değil; zira onların destekçileri arasında çok az örtüşme var. Daha ziyade Radikaller, o düşmüş liderin mirasını kontrol etmek için Şehit Kurtarıcı'nın takipçileriyle düello yapıyor. Bir zamanlar Şehit'in düşmanı olan Radikaller yalnızca Güney'i uzlaştırmakla kalmayacak, onu yeniden inşa edecek eksiksiz bir Yeniden Yapılanma istiyorlar. Buna karşılık Şehit'in takipçileri Kurtarıcı'nın başkanlığı sırasındaki eylemlerine inatla bağlı kalıyorlar: Konfederasyon yanlılarına karşı yumuşak tavrı, en radikal teklifler karşısındaki sessizliği ve hatta sert Yeniden Yapılanma yasalarını veto etmesi."
  bpm_acw_events.328.f:0 ""Zenginlerin, güçlülerin, akıllıların, sözde büyüklerin adına ya da onların arkadaşlarından herhangi birinin adına müdahale etmiş olsaydım... ve bu müdahalede çektiklerimi çekip feda ettiklerimi feda etmiş olsaydım her şey yolunda olurdu; ve bu mahkemedeki her adam bunu cezalandırılmaya değil ödüllendirilmeye layık bir eylem olarak görürdü."\n\n—John Brown, 1859"
  bpm_acw_events.328.a:0 "Şehit yanlılarının tarafını tutun, halkın iradesini aşırı zorlamamalıyız"
  bpm_acw_events.328.b:0 "Kurtarıcı'dan önce insanları kutsal kılmak için ölen başka bir Şehit vardı. Ben onun örneğini takip ediyorum"

  bpm_acw_events.329.t:0 "Azil (Impeachment) Sorusu"
  bpm_acw_events.329.d:0 "Başkan [ROOT.GetCountry.GetRuler.GetLastName] yönetiminde Yeniden Yapılanma çabalarının sürmesine rağmen Radikal Yeniden Yapılanmacıların [ROOT.GetCountry.GetRuler.GetHerHis] yönetimine pek inancı yok. Memnuniyetsiz Cumhuriyetçiler yürütmedeki gecikmeleri gerekçe göstererek görevdeki Başkanı azletme prosedürlerini başlattılar. Prosedür Temsilciler Meclisi'nden geçmiş olsa da Senato'dan da geçip geçmeyeceği belirsizdir."
  bpm_acw_events.329.f:0 ""Size ne yaptığımı söyleyeyim mi? Hükümeti parçalamaya çalışan Kongrenize seslendim. Sonuç olarak Kongre seçmenleri ona karşı zehirlemek için çok uğraşmasının yanında ne yaptı? Eyaletlerin birliğini yeniden tesis etmek için bir şey yaptılar mı? Hayır. Tam aksine bunu önlemek için her şeyi yaptılar: ve o İsyan başladığında nerede duruyorsa şimdi de orada durduğu için hain ilan edildi. Kim kendisinden daha büyük riskler almış veya daha büyük fedakarlıklar yapmıştı? Ancak hizipçi ve baskıcı Kongre, Amerikan halkının zihnini zehirlemeye girişmişti."\n\n—Andrew Johnson, 1868"
  bpm_acw_events.329.a:0 "Azil şu anda tavsiye edilebilir bir hareket tarzı değil"
  bpm_acw_events.329.b:0 "Azledin o aşağılığı!"

  bpm_acw_events.330.t:0 "Mahkeme ve İşgal Arasındaki Duvar"
  bpm_acw_events.330.d:0 "İç Savaş'ın sona ermesinden sonra birçok Konfederasyon sempatizanı hapsedildi. Yüksek Mahkeme'nin bu mahkûmları serbest bırakmasından korkan Cumhuriyetçiler, mahkemenin Habeas Corpus davaları üzerindeki yargı yetkisini sınırlayan bir yasa tasarısını kabul ettiler. Yargı şimdiden geri adım attı ancak bazı Cumhuriyetçiler daha da ileri giderek temyiz yetkisini Yüksek Mahkeme'den tamamen almayı öneriyorlar; bu da kurumu yalnızca eyaletler arası, anayasal ve dış meselelerle sınırlandıracaktır."
  bpm_acw_events.330.f:0 ""Avukatlar söz konusu yürürlükten kaldırma yasasına geçerlilik verilmesi halinde mahkemenin habeas corpus davalarındaki tüm temyiz yetkisinin reddedildiğini varsaymış gibi görünüyorlar. Ancak bu bir hatadır."\n\n—Salmon P. Chase, 1869"
  bpm_acw_events.330.a:0 "Mahkeme dersini aldı, biz olgun davranacağız"
  bpm_acw_events.330.b:0 "İşgalin sorgulanmasına izin veremeyiz, kanatlarını kırın!"

  bpm_acw_events.331.t:0 "Yasama Yetkisinin Güvenceye Alınması"
  bpm_acw_events.331.d:0 "Yasama yetkisini daha da güçlendirme çabasıyla Cumhuriyetçiler görevden alma eylemleriyle ilgili bir dizi yasa çıkardılar. Bu yasaların yürürlüğe girmesiyle birlikte hükümet yetkililerinin Başkan tarafından önce Kongre'ye danışılmadan görevden alınması 'ağır suç' (high crime) haline getirildi. Bu durum yürütmenin bağımsızlığını fiilen ortadan kaldırmış olsa da yargı yasama organını kontrol altında tutmaya devam edebilecektir."
  bpm_acw_events.331.f:0 ""Görünüşe göre biri hukuken, diğeri ise gasp yoluyla olmak üzere iki Savaş Bakanımız var"\n\n—Benjamin F. Butler, 1868"
  bpm_acw_events.331.a:0 "Nihayet Kurucuların amaçladığı gibi"

  bpm_acw_events.332.t:0 "Hepsine Hükmedecek Tek Erk"
  bpm_acw_events.332.d:0 "Yürütme organının boyunduruk altına alınmasının ardından yasama organı gözünü yargıya dikti. Cumhuriyetçilerin liderliğindeki Kongre sadece Yüksek Mahkeme içindeki tüm Savaş Öncesi (Antebellum) yargıçları değil, aynı zamanda Şehit Kurtarıcı tarafından atanan tüm yargıçları da görevden aldı. Bu durum hem Yüksek Mahkeme'yi siyasi bağımsızlığından yoksun bıraktı hem de kongre gücü üzerindeki kalan son kurumsal kısıtlamaları kaldırarak Amerika Birleşik Devletleri'ni fiilen bir parlamenter cumhuriyete dönüştürdü."
  bpm_acw_events.332.f:0 ""Bu plana karşı çıkanlar Yüksek Mahkeme'yi 'kendi adamlarımla doldurmaya' çalıştığımı ve uğursuz bir emsal oluşturulacağını haykırarak önyargı ve korku uyandırmaya çalıştılar."\n\n—Franklin D. Roosevelt, 1937"
  bpm_acw_events.332.a:0 "Makamlarını korumak isteselerdi bize karşı çıkmamalıydılar"

  bpm_acw_events.333.t:0 "Devlet Okulları Değişikliği"
  bpm_acw_events.333.d:0 "Cumhuriyetçi saflarında yeni bir anayasa değişikliği dolaşmaya başladı. Bu değişiklik kamu fonlarının dini kurumlara aktarılmasını engelleyecektir. Kağıt üzerinde bu değişiklik yalnızca din ve devlet işlerinin ayrılmasını savunmaktadır. Uygulamada ise özellikle Katolik okullarını etkileyecek ve Demokratların destek tabanını dini çizgilerde elverişli bir şekilde bölecektir. Ancak Katolikler üzerindeki bu orantısız etki onların gözünden kaçmadı ve bu durum aralarında onayın tartışmalı bir hamle olduğunu kanıtlayabilir."
  bpm_acw_events.333.f:0 ""Hiçbir Eyalet bir dinin tesis edilmesine ilişkin veya dinin serbestçe icrasını yasaklayan hiçbir yasa yapamaz; ve herhangi bir Eyalette devlet okullarının desteklenmesi için vergilendirme yoluyla toplanan veya bunun için herhangi bir kamu fonundan elde edilen hiçbir para ve buna tahsis edilen hiçbir kamu arazisi asla herhangi bir dini mezhebin kontrolü altında olamaz..."\n\n—James G. Blaine, 1875"
  bpm_acw_events.333.a:0 "Gerçekten bu seviyeye inmek zorunda mıyız?"
  bpm_acw_events.333.b:0 "Nefis derecede şeytanca..."

  bpm_acw_events.334.t:0 "Demokratların İkilemi"
  bpm_acw_events.334.d:0 "Cumhuriyetçiler Devlet Okulları Değişikliği'ne destek verdiklerinden partilerinin bu değişikliği destekleyip desteklemeyeceğine karar vermek artık Demokrat liderliğe kalmıştır. Değişikliği desteklemek partinin Katolik destek tabanını yabancılaştıracak, buna karşı çıkmak ise Güneyli Baptistlerin tepkisine yol açabilecektir. Her iki durumda da Cumhuriyetçilerin kumarı başarılı olmuş gibi görünüyor."
  bpm_acw_events.334.f:0 ""Hiçbir Eyalet bir dinin tesis edilmesine ilişkin veya dinin serbestçe icrasını yasaklayan hiçbir yasa yapamaz; ve herhangi bir Eyalette devlet okullarının desteklenmesi için vergilendirme yoluyla toplanan veya bunun için herhangi bir kamu fonundan elde edilen hiçbir para ve buna tahsis edilen hiçbir kamu arazisi asla herhangi bir dini mezhebin kontrolü altında olamaz..."\n\n—James G. Blaine, 1875"
  bpm_acw_events.334.a:0 "Katoliklere ihtiyacımız var, değişikliğe karşı çıkın"
  bpm_acw_events.334.b:0 "Güney'e ihtiyacımız var, değişikliğe karşı çıkın"

  bpm_acw_events.335.t:0 "Ters Tepki"
  bpm_acw_events.335.d:0 "Görünüşe göre Cumhuriyetçilerin anayasal planları sandıkta başlarına bela oldu: Ilımlılar, liberaller, anayasacılar ve diğer saf ahmaklar kendisini anayasanın savunucusu olarak konumlandıran Demokrat Parti'ye geçiyor."
  bpm_acw_events.335.f:0 ""Eşitlik, kurumlarımızı ihlal etmeye değer mi?""
  bpm_acw_events.335.a:0 "Evet"

  bpm_acw_events.336.t:0 "Yürütme Bir Kez Daha İddialı"
  bpm_acw_events.336.d:0 "Bir başkanın ilk kez azledilmesinin anısı nihayet solmaya başlarken, yürütme nihayet ulusumuzun bürokrasisinde ve diplomasisinde kilit rolünü yeniden ortaya koyuyor. Yürütmenin bakanlar üzerindeki kontrolünü kısıtlayan yasalar yürürlükten kaldırıldı ve hayatta kalan tüm Radikal Yeniden Yapılanmacılar Başkanı kontrol altında tutmaktan ziyade toplumsal reformlarını savunmaya çok daha fazla odaklanmış durumdalar. Bu ulusumuzun yeni, yürütme egemenliğindeki bir döneminin başlangıcı olabilir."
  bpm_acw_events.336.f:0 ""Doğru adam Başkan olduğunda tek adamlık Başkanlığın faydaları vardı; ve tarihsel olarak Amerikalılar çoğunlukla doğru adamı seçmişlerdi."\n\n—Arthur M. Schlesinger Jr., 1973"
  bpm_acw_events.336.a:0 "Normale döndük sanırım..."

  bpm_rec_307.tt:0 "Vatandaşlığın güvence altına alınmasıyla en azından Afro-Amerikalılar hukuk sistemi içinde bazı telafi yollarına sahip olacaklar"
  bpm_rec_308.tt:0 "Hukuk kanadının güçlendirilmesiyle Azatlılar Bürosu artık Afro-Amerikalıları savunmak için elinden geleni yapacak"
  bpm_rec_309.tt:0 "Güvenliklerinin korunmasıyla belki de Afro-Amerikalılar nihayet güvenli bir şekilde servet biriktirebilecekler"
  bpm_rec_310.tt:0 "Konfederasyon yanlılarının Eyalet Yönetimlerinden tasfiye edilmesiyle iç darbe tehdidi nihayet azalıyor"
  bpm_rec_311.tt:0 "Adalet Bakanlığı'nın kurulmasıyla hükümetimiz nihayet hukuk savaşı karşıtı kampanyalar düzenleyebilir"
  bpm_rec_312.tt:0 "Hançeri çıkarmanın yarayı iyileştirmeye yeteceğini mi sanıyorsunuz? Bu yeterli değil"
  bpm_rec_313.tt:0 "Toprakların kitlesel olarak yeniden dağıtılmasıyla belki de Afro-Amerikalılar tüm Amerikalıların sahip olduğu refaha ulaşacaklar"
  bpm_rec_314.tt:0 "Oy hakkının artık anayasa ile korunmasıyla Afro-Amerikalıların oy hakkından mahrum bırakılması kesinlikle sona eriyor"
  bpm_rec_315.tt:0 "Eğitim kanadının genişletilmesiyle Azatlılar Bürosu artık kitlesel okuryazarlık seferberlikleri gibi muazzam görevlere başlayabilir"
  bpm_rec_322.tt:0 "Artık reform hızını artırmak için ABD Anayasası'nın kurumsal kurallarını esnetebileceksiniz. Ancak dikkatli olun; ulusun kurumlarıyla ne kadar çok oynarsanız, iç ve dış bürokrasinin iyileşmesi o kadar uzun sürecektir"
  bpm_rec_323.tt:0 "Felaketten kıl payı kurtulduk ancak ekonominin spekülasyona aşırı derecede maruz kaldığı açıktır. Başka bir kriz reform ivmesini yok etmeden önce daha hızlı çalışmalıyız"
  bpm_rec_324.tt:0 "Koalisyon çökmeye başlıyor, eğer henüz yapmadıysanız kurumsal hasar düğmesini kullanmayı düşünün"
  bpm_rec_325.tt:0 "Kongre ekonomik bir felaketi önlemeye çalışırken felç oldu. Güney reformu için siyasi irade neredeyse tükendi ancak belki biraz kurnazlıkla son bir yasa tasarısını aradan çıkarabiliriz"
  bpm_rec_326.tt:0 "Bu adamlara göz kulak olun, birkaç yıl içinde önemli olacaklarını hissediyorum..."
  bpm_rec_329.tt:0 "Senato'nun mevcut Geçici Başkanı, kağıt paranın ve diğer radikal davaların destekçisi başkan olacak. Gelecek seçimde sonuçları olacaktır"
  bpm_rec_330.tt:0 "Yüksek Mahkeme'nin habeas corpus başvurusunun reddine karar verme yetkisi ve Güney'in işgalinin yasallığı güvence altına alındı. Gelecek seçimde sonuçları olacaktır"
  bpm_rec_333.tt:0 "Bu yasa ulusumuzda Katoliklere karşı daha fazla ayrımcılığa neden olacaktır. Karşılığında Demokrat Parti yakında yasayı kınayıp Güney'i üzmek ya da yasayı destekleyip Katolikleri üzmek arasında seçim yapmak zorunda kalacak"
  bpm_rec_exhaust_13.tt:0 "#GBB Yeniden Yapılanma#! #GB Yorgunluğu#! 3 azalacak"
  bpm_rec_exhaust_16.tt:0 "#GBB Yeniden Yapılanma#! #GB Yorgunluğu#! 6 azalacak"
  bpm_rec_exhaust_03.tt:0 "#GBB Yeniden Yapılanma#! #GB Yorgunluğu#! 3 artacak"
  bpm_rec_exhaust_06.tt:0 "#GBB Yeniden Yapılanma#! #GB Yorgunluğu#! 6 artacak"
  bpm_rec_decreased_discipline.tt:0 "Radikal Yeniden Yapılanmacılar Cumhuriyetçi Parti'de güç kaybedecek"
  bpm_rec_increased_discipline.tt:0 "Radikal Yeniden Yapılanmacılar Cumhuriyetçi Parti'de güç kazanacak"
  bpm_rec_constant_vigilance.tt:0 "Baskıya karşı mücadelede daima tetikte olmalıyız"

  bpm_acw_events.401.t:0 "Yürütme Bir Kez Daha İddialı"
  bpm_acw_events.401.d:0 "Yargı ve yürütmeye yönelik yasama baskısının anısı nihayet solmaya başlarken diğer erkler nihayet ulusumuzun bürokrasisinde ve diplomasisinde kilit rollerini yeniden ortaya koyuyorlar. Yüksek Mahkeme'nin yargı yetkisini kısıtlayan yasalar yürürlükten kaldırıldı ve az sayıdaki Radikal Yeniden Yapılanmacı umutsuzca komite pozisyonlarını korumaya çalışıyor. Bu ulusumuzun yeni, yürütme egemenliğindeki bir döneminin başlangıcı olabilir."
  bpm_acw_events.401.f:0 ""Doğru adam Başkan olduğunda tek adamlık Başkanlığın faydaları vardı; ve tarihsel olarak Amerikalılar çoğunlukla doğru adamı seçmişlerdi."\n\n—Arthur M. Schlesinger Jr., 1973"
  bpm_acw_events.401.a:0 "Normale döndük sanırım..."

  bpm_acw_events.402.t:0 "Kamu Hizmeti Yasasının Kabul Edilmesi"
  bpm_acw_events.402.d:0 "Tamamen reform yanlısı Başkan ve Başkan Yardımcısının yardımıyla Kamu Hizmeti Yasası kokuşmuş Senato'dan başarıyla geçti ve Başkan'ın masasına ulaştı. Yasa tasarısının imzalanmasıyla Jackson tarafından hükümeti popülist iradesine bükmek için oluşturulan Ganimet Sistemi (Spoils System) nihayet reform yoluna girdi. Ancak yasa hükümlerinin yürürlüğe girmesiyle birlikte Kuzey'deki birçok siyasi teşkilat rüşvet olarak dağıtılacak garantili pozisyonlardan yoksun kalarak aniden çöktü. Teşkilat desteği olmadan yedek işgücü ordusu aniden güvenlik arayan binlerce aç göçmenle doldu. Ah reformun bedelleri..."
  bpm_acw_events.402.f:0 ""Galiplere düşmanın ganimetleri aittir."\n\n—William L. Marcy, 1832"
  bpm_acw_events.402.a:0 "İşte Ganimet Sistemi böyle ölüyor"

  bpm_acw_events.403.t:0 "Bir Başka Suikast"
  bpm_acw_events.403.d:0 "Şehit Kurtarıcı'nın suikastı en azından önemli bir mesele yüzündendi. Bir başkanın çılgın bir deli tarafından sırf bir yabancı konsolosluk arzusu yüzünden öldürülmesi hem pragmatistler hem de idealistler için travmatik oldu. Kendisi de bir pragmatist olmasına rağmen Başkan Vekili Ganimet Sistemini selefinin öldürülmesinin nedeni olarak görerek derhal Kamu Hizmeti Yasasının geçirilmesi için kampanya yürütmeye başladı. Bu suikast bir trajedi olsa da reformun yol açtığı kargaşayı en aza indirerek sanayiyi ve bürokrasiyi reform davası arkasında birleştirdi."
  bpm_acw_events.403.f:0 ""Galiplere düşmanın ganimetleri aittir."\n\n—William L. Marcy, 1832"
  bpm_acw_events.403.a:0 "Bir konsolosluk tartışmasının bu noktaya gelmesi..."

  bpm_acw_events.404.t:0 "Kamu Hizmeti Yasasının Ölümü"
  bpm_acw_events.404.d:0 "Reform karşıtı Başkan ve Başkan Yardımcısının inatçı direnişiyle Kamu Hizmeti Yasası fiyaskoyla sonuçlandı; madde vetoları, örtülü vetolar (pocket vetos) ve komite gecikmeleri sonunda idealistlerin hâlâ tutunduğu her türlü umudu ezdi. Hükümet yolsuzluğunun bu şekilde savunulması iş dünyasının güveninde bir artışa yol açtı; çünkü yatırımcılar nihayet temsilcilerine Tanrı'nın emrettiği gibi karlı sözleşmeler için rüşvet verme konusunda kendilerini güvende hissedebilirler. Ganimet Sistemi'nin bu şekilde hayatta kalmasının bir yan etkisi Yeniden Ayarlayıcı Hareketlerin (Readjuster Movements) artan önemi oldu. Yoksul beyazların önderliğindeki bu eyalet partileri Cumhuriyetçilerle koalisyon kuruyor ve sosyal ve ekonomik politikaya güçlü federal müdahaleyi savunuyor. Ne kafa karıştırıcı bir grup..."
  bpm_acw_events.404.f:0 ""Galiplere düşmanın ganimetleri aittir."\n\n—William L. Marcy, 1832"
  bpm_acw_events.404.a:0 "Reform öyle kolayca beşiğinde boğulmayacaktır..."

  bpm_acw_events.405.t:0 "Sınıra Sürüklenmek"
  bpm_acw_events.405.d:0 "Yıllar süren tartışmaların ardından Ganimet Tartışması zirve noktasına ulaşmış görünüyor. Başarısız geçen 35 oylamanın ardından parti liderleri bir sonraki adayın kim olması gerektiğine karar vermek için duman altı odalarda toplanıyorlar. Melezler (Half-Breeds) mi galip gelecek, yoksa uzlaşma mı günü kurtaracak?"
  bpm_acw_events.405.f:0 ""Dışarıdan biri alınacaksa umarım Garfield olur. Ohio bir adam istiyorsa Ohio en iyisini istesin."\n\n—Bilinmeyen, 1880"
  bpm_acw_events.405.a:0 "Melezleri Destekleyin, Reform Bir Görevdir!"
  bpm_acw_events.405.b:0 "Lütfen sadece uzlaşamaz mıyız?"

  bpm_acw_events.406.t:0 "Sınıra Sürüklenmek"
  bpm_acw_events.406.d:0 "Yıllar süren tartışmaların ardından Ganimet Tartışması zirve noktasına ulaşmış görünüyor. Başarısız geçen 35 oylamanın ardından parti liderleri bir sonraki adayın kim olması gerektiğine karar vermek için duman altı odalarda toplanıyorlar. Sadıklar (Stalwarts) mı galip gelecek, yoksa uzlaşma mı günü kurtaracak?"
  bpm_acw_events.406.f:0 ""Dışarıdan biri alınacaksa umarım Garfield olur. Ohio bir adam istiyorsa Ohio en iyisini istesin."\n\n—Bilinmeyen, 1880"
  bpm_acw_events.406.a:0 "Sadıkları Destekleyin, Pragmatizm Bir Zorunluluktur!"
  bpm_acw_events.406.b:0 "Lütfen sadece uzlaşamaz mıyız?"

  bpm_acw_events.407.t:0 "Vârise Taç Giydirmek"
  bpm_acw_events.407.d:0 "Yeniden Yapılanma suya düşmüşken partide yeni kana ihtiyaç olduğu açıktır. Soru şu: Ne tür bir kan? Bazıları Yeniden Yapılanma sırasında ortaya atılan yolsuzluk iddialarıyla lekelenmemiş tertemiz bir adayın gösterilmesini istiyor. Diğerleri ise reformların ilerlemesini (veya ilerlememesini) sağlamak için doğru ipleri çekebilecek deneyimli, tecrübeli bir politikacı çağrısında bulunuyor."
  bpm_acw_events.407.f:0 ""Galiplere düşmanın ganimetleri aittir."\n\n—William L. Marcy, 1832"
  bpm_acw_events.407.a:0 "Reform Güçleri erken bir zafer kazanıyor"
  bpm_acw_events.407.b:0 "Pragmatizm skandalları ustalıkla aşarak kongre zaferine ulaşıyor"

  bpm_acw_events.408.t:0 "Liman Savaşı"
  bpm_acw_events.408.d:0 "ABD hükümetini gümrük vergileriyle finanse ediyor ve bu vergiler neredeyse tamamen New York Limanı'ndan toplanıyor. Bu nedenle New York Limanı Gümrük Tahsildarı pozisyonu onu kontrol eden fraksiyona yalnızca muazzam bir bürokratik nüfuz değil, aynı zamanda rüşvet ve kampanya finansmanı için değerli bir kaynak sağlıyor. Bir sonraki Tahsildarın kim atanacağı konusundaki tartışma kızışıyor; Sadıklar (Stalwarts) üstünlüğü elinde tutuyor ancak Melezler (Half-Breeds) ahlaki üstünlük zemininde dimdik duruyor."
  bpm_acw_events.408.f:0 ""Galiplere düşmanın ganimetleri aittir."\n\n—William L. Marcy, 1832"
  bpm_acw_events.408.a:0 "Reformcular İmparatorluk Eyaleti'nde sürpriz bir zafer kazanıyor"
  bpm_acw_events.408.b:0 "Komite Kontrolü aşılması zor bir engel olduğunu kanıtlıyor"

  bpm_acw_events.409.t:0 "Birim Kuralı (The Unit Rule)"
  bpm_acw_events.409.d:0 "Ulusal Kongrelerde genel seçimin ya hep ya hiç doğasını taklit ederek bir eyaletin tüm delegelerini tek bir adaya atamak uzun süredir bir gelenek olmuştur. Bu sistem bir eyaletin delegelerini kazanmak için %100'ü yerine yalnızca %51'ine rüşvet vermesi gereken Pragmatistlerin işine fazlasıyla yaramaktadır. Bu kuralı değiştirmek için kongre çoğunluğuna ihtiyaç duymalarına rağmen Melezler (Half-Breeds) kuralın iptal edilmesini sağlamak için manevralara başladılar."
  bpm_acw_events.409.f:0 ""Galiplere düşmanın ganimetleri aittir."\n\n—William L. Marcy, 1832"
  bpm_acw_events.409.a:0 "Reformcular Başkanı başarıyla alt ederek Birim Kuralını engelliyor"
  bpm_acw_events.409.b:0 "İsyankâr kampanya bastırıldı ve birim kuralı uygulandı"

  bpm_acw_events.410.t:0 "'Basit' Bir Sadakat Yemini"
  bpm_acw_events.410.d:0 "Gelecek seçimin tüm Cumhuriyetçilerin zihninde büyük yer tutmasıyla sadakat sorusu önemli bir endişe kaynağıdır. Sadıklar (Stalwarts), kongreyi bir Pragmatist kazanırsa en sıkı reformistlerin partiyi terk etmesinden korkuyorlar ve bu nedenle oy kullanmaya katılabilmek için tüm delegelerin seçilen adaya sadakat yemini etmesi gereken bir sadakat yemini kuralının getirilmesi için kampanya yürütmeye başladılar. İdealist kampın yükselen yıldızı bu öneriyi tiranlık olarak kınayan ve doğrudan baş-Pragmatisti hedef alan heyecan verici bir konuşma yaptı."
  bpm_acw_events.410.f:0 ""Galiplere düşmanın ganimetleri aittir."\n\n—William L. Marcy, 1832"
  bpm_acw_events.410.a:0 "Utanan baş-Pragmatist öneriyi geri çeker"
  bpm_acw_events.410.b:0 "Güç Siyaseti Kişisel Karizmayı alt eder ve sadakat yemini onaylanır"

  bpm_acw_events.411.t:0 "İstifa Planı"
  bpm_acw_events.411.d:0 "Pragmatistler güç pozisyonlarında güvende olsalar da İdealistler tarafından sıklıkla halkın desteğinden yoksun olmakla suçlanıyorlar. Bu iddialara karşı koymak için baş-Pragmatist senato koltuğundan istifa edeceği ve ardından eyalet yasama organı tarafından derhal yeniden atanarak halk desteğini göstereceği bir plan hazırladı."
  bpm_acw_events.411.f:0 ""Galiplere düşmanın ganimetleri aittir."\n\n—William L. Marcy, 1832"
  bpm_acw_events.411.a:0 "Eyalet yasama organı baş-Pragmatistin maskaralıklarından bıkmıştır ve onu yeniden atamaz"
  bpm_acw_events.411.b:0 "Beklendiği gibi baş-Pragmatist hızla ve büyük bir tantanayla yeniden atanır"

  bpm_acw_events.412.t:0 "Yargı Hamlesi"
  bpm_acw_events.412.d:0 "Baş-Pragmatistin teatral çıkışları: birim kuralları, sadakat yeminleri, istifa planları tartışmalı bir şekilde etkilidir ancak son derece yıkıcıdır. Bu durum karşısında başkan baş-Pragmatisti Yüksek Mahkeme'ye atamayı uygun gördü. Belki de yeni pozisyonunun sorumluluğu onun bu soytarılıklarını durdurur ya da en azından gürültüyü azaltır?"
  bpm_acw_events.412.f:0 ""Galiplere düşmanın ganimetleri aittir."\n\n—William L. Marcy, 1832"
  bpm_acw_events.412.a:0 "Baş-Pragmatistin dişleri söküldü, dokuzda bir oya indirgendi"
  bpm_acw_events.412.b:0 "Kümesin içine bir tilki giriyor ve yanında bütün eski numaralarını getiriyor"

  bpm_acw_events.501.t:0 "30 Gümüş Paraya"
  bpm_acw_events.501.d:0 "Partinin Doğu'daki örgütsel köklerinin yok edilmesinin ardından bu yılki seçim kampanyasını planlamak ve yeni bir program hazırlamak üzere Halk Partisi'nin (People's Party) Batı egemenliğindeki erken bir kongresi toplandı. Kısıtlı Güney grubunun öfkesine rağmen Füzyonist fraksiyon Demokrat Parti Yönetimi ile ilişkileri geliştirmek amacıyla Eyalet Teşkilatlarının kendilerini feshetmelerine izin verecek kadar ileri giderek Demokrat Parti'ye sızmayı (entryism) onaylayan yeni bir maddeyi kabul etti. Demokratik Kongre'de Jackson'ın partisi Bimetalist bir başkan adayı seçti ancak onu büyük sermaye yanlısı bir Başkan Yardımcısı ile eşleştirdi; bu da pusulanın popülist çekiciliğini önemli ölçüde zayıflattı."
  bpm_acw_events.501.f:0 ""Emeğin alnına bu dikenli tacı bastırmayacaksınız."\n\n—William Jennings Bryan, 1896"
  bpm_acw_events.501.a:0 "Ve böylece Dayanışma ölüyor"

  bpm_acw_events.502.t:0 "Kutsanmışlar Tarafından Geride Bırakılanlar"
  bpm_acw_events.502.d:0 "Demokratik Kongre'nin Bimetalist bir başkan adayı seçmesiyle Halk Partisi Ulusal Kongresi karmaşık bir tartışmaya sürüklendi. Kuzey ve İlerici Güney gruplarının direnişine rağmen Batılı ve Ilımlı Güneylilerden oluşan bir koalisyon partiyi seçim için Demokrat adayı desteklemeye yönlendirdi. Bu uzlaşmanın anahtarı ayrı bir İlerici Güneyli Başkan Yardımcısı adayını destekleme tercihiydi. Partinin Radikal kanadının umutları ne olursa olsun Demokratların bu şekilde desteklenmesi bağımsız bir Popülist Hareketin sonunu işaret ediyor."
  bpm_acw_events.502.f:0 ""Emeğin alnına bu dikenli tacı bastırmayacaksınız."\n\n—William Jennings Bryan, 1896"
  bpm_acw_events.502.a:0 "Ve böylece Dayanışma ölüyor"

  bpm_acw_events.503.t:0 "Baba ve Oğul"
  bpm_acw_events.503.d:0 "Popülist Parti içinde kongrelerini Demokratlardan önce toplayıp bağımsız bir liste çıkarmayı garantilemek ile Demokratlardan sonra toplayıp kesin bir Ulusal Füzyon listesi üretmek arasındaki devam eden tartışma garip bir sonuca ulaştı. Hem Popülistler hem de Demokratlar kongrelerini aynı şehirde düzenlemeye karar verdiler ve bu çifte kongre sırasında iki partiyi birleşik bir 'Demokratik Halk Partisi' altında birleştirmek için oy kullandılar. Bazı Radikal Popülistler bu uzlaşmaya şüpheyle yaklaşsa da Başkan Yardımcılığı için bir Popülistin ve Başkanlık için Bimetalist bir Demokratın seçilmesi birçok radikal aktivistin bu manevrayı kesin bir başarı olarak selamlamasına yol açtı."
  bpm_acw_events.503.f:0 ""Emeğin alnına bu dikenli tacı bastırmayacaksınız."\n\n—William Jennings Bryan, 1896"
  bpm_acw_events.503.a:0 "Ve böylece Dayanışma ölüyor"

  bpm_acw_events.504.t:0 "Rabbin İzzeti"
  bpm_acw_events.504.d:0 "Radikal Popülistler için zafer elde edildi! Ilımlı liderlerin güçlü direnişine rağmen Popülist Ulusal Kongresi Demokratlardan bir hafta öncesine başarıyla planlanmakla kalmadı, aynı zamanda ayrı bir başkanlık listesi de onaylandı! Dahası Popülistler politika taleplerinin ayrılmazlığını vurgulayarak ve bu hedeflerden ödün veren herhangi bir üyeyi ihraç etmekle tehdit ederek parti programlarını daha da radikalleştirmeyi seçtiler."
  bpm_acw_events.504.f:0 ""Emeğin alnına bu dikenli tacı bastırmayacaksınız."\n\n—William Jennings Bryan, 1896"
  bpm_acw_events.504.a:0 "Dayanışma asla ölmeyecek!"

  bpm_acw_events.505.t:0 "Kimi Haksız Yere Sakınır, Ama Yoksulluğa Düşer"
  bpm_acw_events.505.d:0 "Doğu'daki bazı başarılara rağmen ana akım partiler Popülist hareketi Valilik Konaklarından ve Senato Salonundan başarıyla izole ettiler. Popülistler ve Temsilciler Meclisi'ndeki müttefikleri tarafından bazı küçük yasa tasarıları geçirildi ancak Eyalet veya Senato varlığı olmadan Popülist Hareketin reform umutları öldü ve gömüldü."
  bpm_acw_events.505.f:0 ""Kimseye kin beslemeden, herkese merhametle, Tanrı'nın bize doğruyu görme gücü verdiği ölçüde doğrulukta sebat ederek, ulusun yaralarını sarmak için içinde bulunduğumuz işi tamamlamaya gayret edelim"\n\n—Abraham Lincoln, 1865"
  bpm_acw_events.505.a:0 "Halkı hayal kırıklığına uğrattık"

  bpm_acw_events.506.t:0 "Biri Cömertçe Verir, Yine de Daha Çok Kazanır"
  bpm_acw_events.506.d:0 "Popülist Hareketin yalnızca birden fazla Eyalet Valiliği ve Senato Koltuğu kazanmakla kalmayıp son seçimde birden fazla Seçici Oy da almasıyla Demokrat Parti kendi kampanyaları için Popülist teklifleri çalmaya başladı. Cumhuriyetçiler Anayasayı değiştirme yönündeki tüm girişimleri engellemiş olsa da hem Temsilciler Meclisi'nden hem de Senato'dan geniş kapsamlı birden fazla yasa tasarısı geçti; Yürütme ve Yargı bunların uygulanmasına izin vermeleri için baskı altına alınıyor."
  bpm_acw_events.506.f:0 ""Kimseye kin beslemeden, herkese merhametle, Tanrı'nın bize doğruyu görme gücü verdiği ölçüde doğrulukta sebat ederek, ulusun yaralarını sarmak için içinde bulunduğumuz işi tamamlamaya gayret edelim"\n\n—Abraham Lincoln, 1865"
  bpm_acw_events.506.a:0 "Çok fazla değil ama belki de yeterli?"

  bpm_acw_events.507.t:0 "Fakirlere Verin, Cennette Hazineniz Olsun"
  bpm_acw_events.507.d:0 "Artık hem Cumhuriyetçiler hem de Demokratlar Senato ve Temsilciler Meclisi'nde çoğunluktan mahrum kaldıklarından, her iki ana akım parti de Popülist Yasama Üyelerinin sadakatini kazanmak için bir yarışa girdiler. Temsilciler Meclisi ve Senato tarafından yeni bir Anayasa Değişikliği kabul edildi ve kesinlikle onaylanacağı Eyaletlere gönderildi. Popülistlerin en cesur hayalleri hayata geçirilmemiş olsa da en radikal aktivistler bile zaferlerinden memnun olabilirler."
  bpm_acw_events.507.f:0 ""Kimseye kin beslemeden, herkese merhametle, Tanrı'nın bize doğruyu görme gücü verdiği ölçüde doğrulukta sebat ederek, ulusun yaralarını sarmak için içinde bulunduğumuz işi tamamlamaya gayret edelim"\n\n—Abraham Lincoln, 1865"
  bpm_acw_events.507.a:0 "Bize sadece kırıntıları veriyorlar, çünkü ziyafeti kendimiz için alabileceğimizi biliyorlar"

  bpm_acw_events.508.t:0 "Sezar'ın Hakkını Sezar'a Verin"
  bpm_acw_events.508.d:0 "Şaşırtıcı bir gelişmeyle Popülist Parti İkinci bir Anayasa Konvansiyonu toplamayı başardı! Yaklaşan bu seçim kampanyası nasıl sonuçlanırsa sonuçlansın Popülistler kan ve terle yeni bir mükemmel birlik taslağı hazırlayarak bu ulusun ruhuna silinmez bir damga vurdular."
  bpm_acw_events.508.f:0 ""Kimseye kin beslemeden, herkese merhametle, Tanrı'nın bize doğruyu görme gücü verdiği ölçüde doğrulukta sebat ederek, ulusun yaralarını sarmak için içinde bulunduğumuz işi tamamlamaya gayret edelim"\n\n—Abraham Lincoln, 1865"
  bpm_acw_events.508.a:0 "Ve şimdi inşa ettiğimiz büyük köşkün gölgesinde dinlenme zamanı"

  bpm_acw_events.512.t:0 "Yürütme Bir Kez Daha İddialı"
  bpm_acw_events.512.d:0 "On yıllar süren kongre hakimiyetinin ardından Başkan nihayet Yürütme Organı üzerindeki kontrolünü geri alıyor. Dönüm noktası niteliğindeki bir Yüksek Mahkeme davasında Baş Yargıç kabinesi üzerindeki başkanlık hakimiyeti lehine karar verdi; ancak kararın tüm yürütme organını kapsayıp kapsamadığı konusunda sorular devam ediyor. Bu karar Radikal Yeniden Yapılanmacılar tarafından kınanmış olsa da o kıdemli devlet adamlarının pek azı hâlâ hayattadır, siyasetimizde nüfuz sahibi olmaları ise çok daha azdır. Bu ulusumuzun yeni, yürütme egemenliğindeki bir döneminin başlangıcı olabilir."
  bpm_acw_events.512.f:0 ""Doğru adam Başkan olduğunda tek adamlık Başkanlığın faydaları vardı; ve tarihsel olarak Amerikalılar çoğunlukla doğru adamı seçmişlerdi."\n\n—Arthur M. Schlesinger Jr., 1973"
  bpm_acw_events.512.a:0 "Normale döndük sanırım..."

  bpm_acw_events.513.t:0 "Demokratların Uzun Gölgesi"
  bpm_acw_events.513.d:0 "Halk Partisi tamamen Feminist karşıtı ve Afro-Amerikan karşıtı bir parti programı yayınladığında kongre kaybedilen herhangi bir Afro-Amerikan desteğini Beyaz Güneylilerle kolayca telafi edebileceğini umuyordu. Bu fikrin bir fantezi olduğu kanıtlandı; zira davamıza henüz kazanılmamış olan Beyaz Güneyliler inatla Demokrat Parti'ye sadık kaldılar. Daha da kötüsü daha önce en ateşli destekçilerimiz olan Afro-Amerikalı destekçilerimizi oluk oluk kaybediyoruz."
  bpm_acw_events.513.f:0 ""Sandığa gitmeyeceğim. Kayıt yaptırmadım. Amerika Birleşik Devletleri'nde demokrasinin o kadar yok olduğuna inanıyorum ki 'iki kötünün iyisi' diye bir şey yok. İki isimli tek bir kötü parti var ve yapabileceğim veya söyleyebileceğim her şeye rağmen o seçilecek. Üçüncü bir parti yok."\n\n—W. E. B. DuBois, 1956"
  bpm_acw_events.513.a:0 "Irkçılığın bize Siyahların desteğini kazandırmayacağını kim düşünebilirdi ki?"

  bpm_acw_events.514.t:0 "Parti İçi Çekişmeler"
  bpm_acw_events.514.d:0 "Halk Partisi Afro-Amerikan ve Feminist konularda resmi olarak ılımlı tutumlar sergilese de Güney Eyalet Şubeleri özgürlüğün savunulmasında çok daha kararlıdır. Bu Eyalet Halk Partilerinden bazıları Popülist olmayan adayları (çoğunlukla Cumhuriyetçileri) destekleyecek kadar ileri gitmiş, hatta birkaç aktivist yerel Cumhuriyetçi Partilerle birleşmeyi savunmuştur. Bu nedenle Ulusal Parti bu ilerici radikallerin birçoğuyla ilişkisini kesmeye başlarken birçok orta sınıf züppe küçük tartışmalarımızı okumaktan zevk alıyor."
  bpm_acw_events.514.f:0 ""Sandığa gitmeyeceğim. Kayıt yaptırmadım. Amerika Birleşik Devletleri'nde demokrasinin o kadar yok olduğuna inanıyorum ki 'iki kötünün iyisi' diye bir şey yok. İki isimli tek bir kötü parti var ve yapabileceğim veya söyleyebileceğim her şeye rağmen o seçilecek. Üçüncü bir parti yok."\n\n—W. E. B. DuBois, 1956"
  bpm_acw_events.514.a:0 "Lanet İlericiler, bunun POPÜLİST Parti olduğunu bilmiyorlar mı?"

  bpm_acw_events.515.t:0 "Paramiliterler Vuruyor"
  bpm_acw_events.515.d:0 "Partimiz taleplerini açıklarken Afro-Amerikan üyeliğini korumak ile devletin balyozunu aktivistlerinin üzerine indirmemek arasında hassas bir denge kurmayı umuyordu. Bir bakıma bu denge oyunu başarılı oldu: Şimdiye kadar partimize yönelik eyalet veya federal hükümetler tarafından doğrudan bir baskı uygulanmadı. Ancak yönetici otoriteler üyelerimize yönelik Beyaz paramiliter şiddetine göz yummaya fazlasıyla istekli davrandılar. Linçler, silahlı saldırılar ve hatta ara sıra yapılan kundaklamalar Güney'deki örgütlenme çabalarımızın peşini bırakmıyor."
  bpm_acw_events.515.f:0 ""Hiçbir bahaneyle silahlar ve mühimmat teslim edilmemelidir; halkı silahsızlandırmaya yönelik her türlü girişim gerekirse zor kullanılarak durdurulmalıdır"\n\n—Komünist Manifesto, 1848"
  bpm_acw_events.515.a:0 "Gericilik Güçleri saldırıyor"

  bpm_acw_events.516.t:0 "Devlet Baskısı"
  bpm_acw_events.516.d:0 "Taleplerimizi ortaya koyduğumuzda devletin misilleme yapacağını biliyorduk. Ancak bu kadar çabuk saldıracaklarını beklemiyorduk. Gazeteler 'huzuru bozdukları' gerekçesiyle kapatıldı, savunucular 'ırkların karışmasını teşvik ettikleri' gerekçesiyle tutuklandı ve sendikalar ile kooperatifler 'ırk hainlerinin komploları' olarak lağvedildi. Beyaz üyeler hapsedilirken Afrikalı üyelerimiz ölüm ve hakaretle karşı karşıya kalıyor."
  bpm_acw_events.516.f:0 ""Hiçbir bahaneyle silahlar ve mühimmat teslim edilmemelidir; halkı silahsızlandırmaya yönelik her türlü girişim gerekirse zor kullanılarak durdurulmalıdır"\n\n—Komünist Manifesto, 1848"
  bpm_acw_events.516.a:0 "Halkın ağzını sonsuza kadar tıkayamazlar"

  bpm_acw_events.517.t:0 "Hoş Küçük Bir İç Savaş"
  bpm_acw_events.517.d:0 "Adalet ertelenebilecek bir şey değildir. Kadınların Özgürleşmesi ve Afrika Eşitliği konusundaki pozisyonlarımızı belirlerken bunu biliyorduk. Sesimizi yükseltme cesaretimiz karşısında adaletsizlik güçlerinin bedel isteyeceğini de biliyorduk. Dün bir şerif ve beş kişilik çetesi bir adamı 'üstün ırktan bir kadınla düşüp kalktığı' için astı. Bugün o kadın ve iki erkek kardeşi şerifi ait olduğu yere, cehenneme gönderdiler. Yarın Güney'in bir başka yerinde her şey yeniden başlayacak."
  bpm_acw_events.517.f:0 ""Hiçbir bahaneyle silahlar ve mühimmat teslim edilmemelidir; halkı silahsızlandırmaya yönelik her türlü girişim gerekirse zor kullanılarak durdurulmalıdır"\n\n—Komünist Manifesto, 1848"
  bpm_acw_events.517.a:0 "Siyah ya da Beyaz, kanımız her halükarda kırmızı akar"

  bpm_acw_events.518.t:0 "Ocala'da Bir Toplantı"
  bpm_acw_events.518.d:0 "On yıl önce Popülist Hareket kendisini tutarlı bir cephe halinde örgütlemeye başladı. O zamandan beri seçimleri kazanmak, özgürlük sancağını kendi bireysel yöntemlerimizle ileriye taşımak için mücadele ettik. Sömürü güçlerine karşı kol kola savaşmanın çok daha etkili olduğunu öğrendik. Bu yüzden halkı savunacak yeni bir siyasi partiyi tanımlamak için ulusal bir kongrede bir araya geldik. Karar vermemiz gereken ilk konu Senato meselesidir. Eyalet yasama organı tarafından seçilen, antlaşmalar ve savaş üzerinde yetkisi olan Senato, yasama ilerlemesinin en büyük düşmanıdır. Ne yapılmalı?"
  bpm_acw_events.518.f:0 ""Bizi çevreleyen koşurlar işbirliğimizi en iyi şekilde haklı çıkarıyor; ahlaki, siyasi ve maddi yıkımın eşiğine getirilmiş bir ulusun ortasında buluşuyoruz."\n\n—1892 Popülist Parti Programı, 1892"
  bpm_acw_events.518.a:0 "Ayaktakımı ile soyguncu baronlar arasında bir uzlaşma var; Senatörler halk tarafından seçilecek ve eyalet yasama organı tarafından onaylanacaktır"
  bpm_acw_events.518.b:0 "Senato halka tabi kılınmalı ve bu nedenle eyalet çapında oylamayla seçilmelidir"
  bpm_acw_events.518.c:0 "Halk Meclisi artık Seçkinci Senato'ya zincirlenmemelidir"
  bpm_acw_events.518.e:0 "Gerçek Demokrasiye ulaşmak için temsil sistemimiz Ulusal Referandumlarla dengelenmelidir"

  bpm_acw_events.519.t:0 "Çiftlik Meselesi"
  bpm_acw_events.519.d:0 "İkinci olarak hareketimizin küçük çiftçilikte büyüyen kârlılık krizini hafifletmeye nasıl yardımcı olacağını ilan etmeliyiz."
  bpm_acw_events.519.f:0 ""Yolsuzluk sandığa, Yasama Organlarına, Kongre'ye hakimdir ve hatta yargı kürsüsünün kürküne bile dokunmaktadır."\n\n—1892 Popülist Parti Programı, 1892"
  bpm_acw_events.519.a:0 "Her iki uçtan da fiyat dayatılan taraf olmasaydık nihayet refaha ulaşabilirdik. Alt hazine (sub-treasury) sistemini destekleyin"
  bpm_acw_events.519.b:0 "Demiryolu baronları çok uzun süredir iliğimizi kemirdi, düzenlenmeleri gerekir"
  bpm_acw_events.519.c:0 "Düzenleme iltihaplı bir yaraya sadece bir bandajdır, yaramızı iyileştirmek için kamulaştırma (belediyeleştirme) gereklidir"
  bpm_acw_events.519.e:0 "Ulusal Çiftçi Birlikleri gerçekten güvenilebilecek tek kurumlardır; onları çiftçilere modern makinelerin harikalarını sağlayacak devlet destekli kooperatif sistemlerine genişletelim"

  bpm_acw_events.520.t:0 "Vergi Meselesi"
  bpm_acw_events.520.d:0 "Üçüncü olarak hayati hükümet çalışmaları için daha adil fon toplamak amacıyla vergilendirmenin nasıl reforme edilmesi gerektiği konusunda anlaşmalıyız."
  bpm_acw_events.520.f:0 ""Halkın morali bozulmuştur; Eyaletlerin çoğu evrensel sindirme ve rüşveti önlemek için sandık merkezlerinde seçmenleri izole etmek zorunda kalmıştır."\n\n—1892 Popülist Parti Programı, 1892"
  bpm_acw_events.520.a:0 "Gümrük vergileri yüksek fiyatların kaynağıdır, kesilmeleri gerekir"
  bpm_acw_events.520.b:0 "Vergilendirme gerçekten adil olmak için en yüksek gelire sahip olanlara düşmelidir, bir gelir vergisi uygulamalıyız"
  bpm_acw_events.520.c:0 "Bay George'un Toprak Değeri Vergisi teorisi oldukça ilginç, bunu da savunalım"
  bpm_acw_events.520.e:0 "Birikmiş servet eşitsizliğin gerçek kaynağıdır ve vergilendirme yoluyla düzeltilmelidir. Servet, toprak ve gelir vergileri gümrük vergisinin yerini alacaktır"

  bpm_acw_events.521.t:0 "Para Birimi Meselesi"
  bpm_acw_events.521.d:0 "Şimdi hareketimizdeki pek çok kişi için en önemli konuya geliyoruz: para birimi. Deflasyon üyelerimize ödenemez borçlar yükledi: Onları bu yüklerinden nasıl kurtaracağız?"
  bpm_acw_events.521.f:0 ""Gazeteler büyük ölçüde sübvanse edilmiş veya susturulmuştur, kamuoyu sindirilmiştir, ticaret çökmüştür, evler ipoteklerle kaplanmıştır, emek yoksullaşmıştır ve toprak kapitalistlerin elinde toplanmaktadır."\n\n—1892 Popülist Parti Programı, 1892"
  bpm_acw_events.521.a:0 "Gümüş çok bölücüdür, bunun yerine ulusumuzdaki her kişi için 50 dolar olacak şekilde doların devalüe edilmesini talep etmeliyiz"
  bpm_acw_events.521.b:0 "Gümüş tartışmalıdır ancak belki bir uzlaşmaya varılabilir. Yılda 4 milyonluk gümüş alımı kulağa nasıl geliyor?"
  bpm_acw_events.521.c:0 "Gümüş hareketimizin çekirdeğidir ve öyle kalacaktır. Özgür Toprak, Özgür Emek, SERBEST GÜMÜŞ"
  bpm_acw_events.521.e:0 "Yoldan çıkmış toplumumuzu gerçekten düzelteceksek cesaret gerekir. Yeşil banknotların geri dönmesini ve gerçekten enflasyonist bir para politikasını talep edeceğiz"

  bpm_acw_events.522.t:0 "Göçmenlik Meselesi"
  bpm_acw_events.522.d:0 "Sırada nahoş bir konu var: yabancı düşmanı politikalar. Üyelerimiz yabancı göçmenleri hedef alan bir politika maddesi talep ediyor ancak belki de onların en kötü dürtülerini ılımlılaştırabiliriz?"
  bpm_acw_events.522.f:0 ""Şehirli işçilerin kendilerini korumak için örgütlenme hakkı reddediliyor; ithal edilen yoksul emek ücretlerini düşürüyor, onları vurmak için yasalarımızca tanınmayan kiralık bir daimi ordu kuruluyor ve hızla Avrupa koşullarına doğru yozlaşıyorlar."\n\n—1892 Popülist Parti Programı, 1892"
  bpm_acw_events.522.a:0 "Amerikan Toprağı sadece Amerikalılar içindir! Hayalimiz Çinliler için değil"
  bpm_acw_events.522.b:0 "Bir Ulusal Banka paralı çıkarların bizi köleleştirmesi için sadece bir araçtır, bu tür teklifler sona erdirilmelidir"
  bpm_acw_events.522.c:0 "Toprak mülkiyeti yasakları yeterli değildir, ulusumuza yapılacak diğer tüm Çin göçlerini engellemeliyiz"
  bpm_acw_events.522.e:0 "Ve sadece Çinliler değil, Yahudiler de! Amerika sadece Beyazlar (ve belki Siyahlar) içindir"

  bpm_acw_events.523.t:0 "Cinsiyet Meselesi"
  bpm_acw_events.523.d:0 "Kadınlar hareketimizin temel taşı olmuştur. Şimdi partimizin kadın hakları konusunda nerede duracağına karar verme zamanıdır."
  bpm_acw_events.523.f:0 ""Milyonların emeğinin meyveleri insanlık tarihinde eşi benzeri görülmemiş bir şekilde birkaç kişi için devasa servetler inşa etmek üzere küstahça çalınıyor; ve bunlara sahip olanlar sırayla Cumhuriyeti küçümsüyor ve özgürlüğü tehlikeye atıyor."\n\n—1892 Popülist Parti Programı, 1892"
  bpm_acw_events.523.a:0 ""Erkeklerin ilgilendiği her şey kadınların da aynı derecede ilgisini çeker""
  bpm_acw_events.523.b:0 ""Kızlarınızı bağımsız olabilmeleri için eğitin""
  bpm_acw_events.523.c:0 ""Daha az mısır ekin ve daha fazla kıyamet koparın""
  bpm_acw_events.523.e:0 ""Kadınlar göğün yarısını tutar""

  bpm_acw_events.524.t:0 "Irk Meselesi"
  bpm_acw_events.524.d:0 "Son olarak Afro-Amerikalıların yeri konusunda bir tutum belirlemeliyiz. Birçok kişi Siyah emeğinin rekabetinden korksa da Renkli Çiftçiler Birliği Güney'deki çalışmalarımız için temel bir örgüttür. Parti neye karar verecek?"
  bpm_acw_events.524.f:0 ""Hükümet adaletsizliğinin aynı üretken rahminden iki büyük sınıf üretiyoruz: serseriler ve milyonerler."\n\n—1892 Popülist Parti Programı, 1892"
  bpm_acw_events.524.a:0 "Afro-Amerikalı aşağı bir ırktır ve bu şekilde adlandırılmalıdır"
  bpm_acw_events.524.b:0 "Irklarımız arasında çok fazla fark var, ayrı tutulmalıyız"
  bpm_acw_events.524.c:0 "Ayrılık en iyisi olabilir ancak fırsat eşitliği yine de korunmalıdır"
  bpm_acw_events.524.e:0 "Afro-Amerikalı neden Beyaz kardeşinden ayrı tutulsun? Tanrı'nın gözünde hepimiz eşit değil miyiz?"

  bpm_acw_events.525.t:0 "Başlık Meselesi"
  bpm_acw_events.525.d:0 "Şimdi geriye sadece kurucu belgemizi adlandırmak kaldı. Önemsiz bir nokta gibi görünse de bu partimizin söylemini belirleyecek ve böylece üyelerimizin ideolojisini önemli ölçüde etkileyecektir."
  bpm_acw_events.525.f:0 ""Bir reform partisi olarak sempatimiz doğal olarak insanları zeki, erdemli ve ölçülü kılmaya eğilimli her öneriden yana olsa da yine de bu soruları ne kadar önemli olurlarsa olsunlar şu anda çözüm bekleyen ve yalnızca bireysel refahımızın değil özgür kurumların varlığının da bağlı olduğu büyük meselelere göre ikincil görüyoruz;"\n\n—1892 Popülist Parti Programı, 1892"
  bpm_acw_events.525.a:0 "İkinci Bağımsızlık Bildirgesi"
  bpm_acw_events.525.b:0 "İkinci Haklar Bildirgesi"
  bpm_acw_events.525.c:0 "Halkın Sağduyusu"
  bpm_acw_events.525.e:0 "İlerleme Yüzünden Yoksullaşanlar"
  bpm_acw_events.525.g:0 "İşçi Manifestosu"

  bpm_acw_events.526.t:0 "Halk Partisi"
  bpm_acw_events.526.d:0 "Nihayet parti programımız tamamlandı. Bazıları bunu gelecek için bir taslak olarak kutluyor. Diğerleri çok ileri gittiğini ya da belki yeterince ileri gitmediğini düşünerek hayal kırıklığına uğradı. Başkaları ise anlaşmazlıkları nedeniyle hareketimizi tamamen terk edecek. Ne olursa olsun artık geri dönüş yok."
  bpm_acw_events.526.f:0 ""Bugün örgütlenen reform güçlerinin her yanlış düzeltilene ve bu ülkenin tüm erkek ve kadınları için eşit haklar ve eşit ayrıcalıklar güvenli bir şekilde tesis edilene kadar ilerlemeyi asla durdurmayacağına inanarak; yönetilme koşulları üzerinde anlaşmazlığa düşmeden önce tüm insanlardan ilk olarak yöneteceğimiz bir cumhuriyetimiz olup olmayacağını belirlememize yardım etmelerini istiyoruz."\n\n—1892 Popülist Parti Programı, 1892"
  bpm_acw_events.526.a:0 "Bir Köylü Partisi"
  bpm_acw_events.526.b:0 "Bir Popülist Parti"
  bpm_acw_events.526.c:0 "Bir Emekçi Partisi"
  bpm_acw_events.526.e:0 "Bir Eylem Partisi"
  bpm_acw_events.526.g:0 "Bir Devrimci Parti"
  bpm_acw_events.526.h:0 "Bir Gerici Parti"

  bpm_acw_events.527.t:0 "Birinci Ulusal Kongre"
  bpm_acw_events.527.d:0 "Seçim kampanyası tüm hızıyla sürerken Halk Partisi'nin ilk Ulusal Kongresi'ni düzenleme zamanı nihayet geldi. Beklenen adayın zamansız ölümünün ardından kongre Yeşil Banknot Hareketi'nin (Greenback Movement) radikal kanadına liderlik eden New Yorklu bir gazeteci üzerinde karar kıldı."
  bpm_acw_events.527.f:0 ""Neron günlerinden bu yana var olanlardan daha kötü bir tiran ve daha insanlık dışı bir kasap.... Şimdi Lincoln'e oy veren adam bir hain ve katildir.... Ve eğer dört yıl daha kötü yönetmek üzere seçilirse, kamu yararı için cesur bir elin hançer ucuyla onun kalbini deleceğine güveniyoruz."\n\n—Marcus Pomeroy, 1860'lar"
  bpm_acw_events.527.a:0 "Hakaretleri bir kenara bırakırsanız aslında oldukça etkileyici konuşuyor"

  bpm_acw_events.528.t:0 "Birinci Ulusal Kongre"
  bpm_acw_events.528.d:0 "Seçim kampanyası tüm hızıyla sürerken Halk Partisi'nin ilk Ulusal Kongresi'ni düzenleme zamanı nihayet geldi. Beklenen adayın zamansız ölümünün ardından kongre Yeşil Banknot Hareketi'nin ılımlı kanadına liderlik eden Kuzeyli kongre liderlerimizden birinde karar kıldı."
  bpm_acw_events.528.f:0 ""Eski ülkedeki aristokrat sınıflar cumhuriyetlerin insanlığın ezilen milyonlarına hiçbir sığınak veya umut sunmadığının kanıtı olarak çalkantılı aç kitlelerine sürekli Amerika Birleşik Devletleri'ni gösteriyorlar."\n\n—James B. Weaver, 1892"
  bpm_acw_events.528.a:0 "Ne de olsa seçim kaybetme konusunda en çok deneyime sahip olan o"

  bpm_acw_events.529.t:0 "Birinci Ulusal Kongre"
  bpm_acw_events.529.d:0 "Seçim kampanyası tüm hızıyla sürerken Halk Partisi'nin ilk Ulusal Kongresi'ni düzenleme zamanı nihayet geldi. Beklenen adayın zamansız ölümünün ardından kongre ağırbaşlı karakteri ve tekel karşıtı kararlarıyla tanınan ünlü bir Cumhuriyetçi Temyiz Yargıcı üzerinde karar kıldı."
  bpm_acw_events.529.f:0 ""Siyasetin dışındayım ve hiçbir siyasi hedefim yok. Bir dizi Cumhuriyetçi arkadaşıma adımı Minneapolis kongresine sunmaya istekli olmadığımı söylemiş olsam da bu gerçeği kamuoyuna duyurma gereği hissetmedim."\n\n—Walter Q. Gresham, 1892"
  bpm_acw_events.529.a:0 "Cumhuriyetçi idiyse ne olmuş, artık o bir Popülist"

  bpm_acw_events.530.t:0 "Birinci Ulusal Kongre"
  bpm_acw_events.530.d:0 "Seçim kampanyası tüm hızıyla sürerken Halk Partisi'nin ilk Ulusal Kongresi'ni düzenleme zamanı nihayet geldi. Beklenen adayın zamansız ölümünün ardından kongre jeoist teorileri ve New York Belediye Başkanlığı kampanyasıyla ünlü bir ekonomist üzerinde karar kıldı."
  bpm_acw_events.530.f:0 ""Özgürlükten tek bir şey olarak; erdemden, zenginlikten, bilgiden, icattan, ulusal güçten ve ulusal bağımsızlıktan ise başka şeyler olarak bahsederiz. Ancak tüm bunların kaynağı, anası, olmazsa olmaz koşulu Özgürlüktür."\n\n—Henry George, 1879"
  bpm_acw_events.530.a:0 "Biraz daha ılımlı bir Amerikan Marx'ı"

  bpm_acw_events.531.t:0 "Birinci Ulusal Kongre"
  bpm_acw_events.531.d:0 "Seçim kampanyası tüm hızıyla sürerken Halk Partisi'nin ilk Ulusal Kongresi'ni düzenleme zamanı nihayet geldi. Beklenen adayın zamansız ölümünün ardından kongre Emek Şövalyeleri'nin (Knights of Labor) lideri üzerinde karar kıldı."
  bpm_acw_events.531.f:0 ""İlerleyen yaşlarımda birçok kişi tarafından kışkırtıcı olmakla suçlandım; bazı arkadaşlarım beni saldırılara karşı savunurken kışkırtıcı olduğumu inkâr ettiler; yanılıyorlardı, ben bir kışkırtıcıydım ve bu sıfatla çalışan erkek ve kadınlara yapılan adaletsizliklere karşı sesimle ve kalemimle elimden gelen her şeyi yaptım."\n\n—Terence Powderly, 1940"
  bpm_acw_events.531.a:0 "Birliğe liderlik edecek bir Sendika Lideri, umalım da greve gitmesinler"

  bpm_acw_events.532.t:0 "Birinci Ulusal Kongre"
  bpm_acw_events.532.d:0 "Seçim kampanyası tüm hızıyla sürerken Halk Partisi'nin ilk Ulusal Kongresi'ni düzenleme zamanı nihayet geldi. Beklenen adayın zamansız ölümünün ardından kongre beyaz üstünlüğüne ve ırk ayrımcılığına olan bağlılığımız nedeniyle partimize çekilen bir avukat ve eski Demokrat üzerinde karar kıldı."
  bpm_acw_events.532.f:0 ""Eyaletimle gurur duyuyorum... çünkü orada zenci sorununu çözdük... Onu siyasetin dışına çıkardık ve böylece her parti altında iyi bir hükümet sağladık ve her iki ırkın gelecekteki gelişimi için temeller attık."\n\n—Charles Aycock, 1903"
  bpm_acw_events.532.a:0 "Wilmington hakkında konuşan herkes partiden ihraç edilecektir"

  bpm_acw_events.533.t:0 "Bölünme"
  bpm_acw_events.533.d:0 "Partimiz son seçimde şaşırtıcı derecede iyi bir performans sergilemiş olsa da zafer binlerce kavgacı çocuğun anasıdır. Partimiz taleplerini ilerletmenin ideal yöntemleri konusunda şimdiden bölünmeye başlıyor. Füzyonistler yasama zaferleri yoluyla politikalarını başarıyla uygulamayı umarak Demokratlarla ittifakı savunuyorlar. Bu sırada Orta Yolcular Popülist fikirleri uygulamak için yalnızca Popülist adaylara güvenilebileceğine inanarak stratejik bağımsızlığı korumak istiyorlar."
  bpm_acw_events.533.f:0 ""Emeğin alnına bu dikenli tacı bastırmayacaksınız."\n\n—William Jennings Bryan, 1896"
  bpm_acw_events.533.a:0 "Dayanışmaya ne oldu?"

  bpm_acw_events.534.t:0 "Ulusal Çiftçi Birliği"
  bpm_acw_events.534.d:0 "İç Savaş'tan bu yana Ulusal Çiftçiler Birliği (Grange) Kuzey'deki çiftçiler için eğitici, kültürel ve sosyal bir grup olarak hizmet etti. Hem beyaz hem de siyah Güneyli Çiftçinin siyasi tartışmalara geri dönmesiyle Grange'in radikal kanadında bir yükseliş yaşandı. Amerika Birleşik Devletleri çiftçilerini savunmak ve örgütlemek için ekonomik bir örgüt arayışıyla iki Ulusal Çiftçi Birliği kuruldu: Kuzey'de daha ılımlı bir birlik ve Güney'de daha radikal bir birlik. Kuzey şubesi örgütleri için bir renk ayrımı koymayı reddederken, Güney grubu azatlılar için üyeliği kararlılıkla reddetti."
  bpm_acw_events.534.f:0 ""Emeğin alnına bu dikenli tacı bastırmayacaksınız."\n\n—William Jennings Bryan, 1896"
  bpm_acw_events.534.a:0 "Böylece Afro-Amerikalılar kendi örgütlerini kurarak Güney Popülizminin kalesi olacaklar"

  bpm_acw_events.535.t:0 "Emek Şövalyeleri"
  bpm_acw_events.535.d:0 "Ulusumuzdaki ilk ulusal işçi federasyonu olan Ulusal İşçi Sendikası, ırkçılık ve hükümet baskısının yerel şubelerinin fareler gibi dağılmasına neden olmasıyla acınası bir şekilde öldü. Sendikanın küllerinden şimdi daha güçlü yeni bir işçi federasyonu doğdu: Emek Şövalyeleri (Knights of Labor). Açıkça çok ırklı olan yönetimin ulusal vizyonu, Şövalyeler üyeliğinin ülke çapında patlama yapmasını sağladı. Ancak bazıları Şövalyelerin zanaat sendikalarıyla çalışmayı reddetmesinin, yerel sendika anlaşmazlıklarına sürekli karışmasının ve grev stratejisini kararlılıkla desteklemeyi reddetmesinin kaçınılmaz olarak federasyonu parçalayacağından endişe ediyor."
  bpm_acw_events.535.f:0 ""Emeğin alnına bu dikenli tacı bastırmayacaksınız."\n\n—William Jennings Bryan, 1896"
  bpm_acw_events.535.a:0 "Uzlaşmanın gücüne sahipken grev fonuna veya grev komitesine kimin ihtiyacı var ki?"

  bpm_acw_events.536.t:0 "Jeoistler"
  bpm_acw_events.536.d:0 "Hareketimizin şafağında davamızın kilit liderlerinden biri bir kitap yazdı. Bu metinde teknolojinin toplumsal servette artışa yol açmasına rağmen bu tür bir servetin esas olarak doğal kaynakların sahipleri tarafından kazanılması gerçeğinin, teknolojik ilerlemenin yalnızca yoksulluğun yayılmasını ilerlettiğini teorileştirdiler. Bu soruna karşı doğal kaynak sahipleri üzerine her şeyi kapsayan tek bir verginin getirilmesini önerdiler; bu vergi söz konusu sahiplerin doğal servet tekelleşmesini daraltacaktı. Bu felsefe gümrük vergileri gibi konularda hareketimizin diğer üyelerinden önemli ölçüde ayrılsa da 3 milyon kopya satan ve dağıtımda yalnızca İncil'in ardından ikinci sırada gelen inanılmaz derecede popüler bir tezdir."
  bpm_acw_events.536.f:0 ""Emeğin alnına bu dikenli tacı bastırmayacaksınız."\n\n—William Jennings Bryan, 1896"
  bpm_acw_events.536.a:0 "Toprak Değeri Vergisini bir kez daha duymak zorunda kalırsam..."

  bpm_acw_events.537.t:0 "Sosyalistler"
  bpm_acw_events.537.d:0 "Hareketimizin başlangıcında her zaman bir sosyalist varlığı vardı. Sosyalist İşçi Partisi ve Demiryolu Kardeşlikleri diğer üyelerin cesaret edemediği nahoş eylemlerle önerilerimizi ileriye taşıyarak bizim için her zaman kilit aktivistler oldular. Ancak bu ittifak her zaman mesafeli olmuştur: Ilımlılar sosyalistlerin radikalliğinden endişe ederken sosyalistler bizim uzlaşmacı doğamızdan nefret ediyorlardı. Ancak şimdi nihayet sosyalistler partimize tamamen entegre oldular ve bu da partimiz içinde iki yeni grubun oluşmasına yol açtı. Bir tarafta militan endüstriyel sendikacılığı savunan ve yasallık sınırını zar zor koruyan eski Sosyalist İşçi Partisi üyelerinden Sendikalistler oluştu. Diğer tarafta ise Emek Şövalyeleri'nin Demiryolu Kardeşlikleri partimizdeki Merkezci Sosyalizmin ve Ortodoks Marksist Düşüncenin kalesi olarak hareket eden Kardeşlik Fraksiyonunu oluşturdu."
  bpm_acw_events.537.f:0 ""Emeğin alnına bu dikenli tacı bastırmayacaksınız."\n\n—William Jennings Bryan, 1896"
  bpm_acw_events.537.a:0 "Debs ve DeLeon ile Alman Yoldaşları"

  bpm_acw_events.538.t:0 "Üçüncü Parti Sistemi"
  bpm_acw_events.538.d:0 "Şehit Kurtarıcı İkinci Parti Sistemini yok etti ve parçalarıyla partizan sadakati siyaseti üzerine inşa edilmiş yeni bir sistem kurdu. Ana akım partilere duyulan bu akıl almaz şevk; ister Yeşil Banknot, ister İşçi Birliği, ister İçki Yasağı, isterse Popülist olsun Üçüncü Partilerin yükselişini engelledi.\n\nBu partiler siyasi tartışmalarda etkili olsalar da kilitlenmiş bir seçiciler kurulunu ciddi şekilde tehdit etmeye yetecek oyu hiçbir zaman alamadılar. Çoğunlukçu Seçim Sisteminin cilvesi böyledir işte."
  bpm_acw_events.538.f:0 ""Emeğin alnına bu dikenli tacı bastırmayacaksınız."\n\n—William Jennings Bryan, 1896"
  bpm_acw_events.538.a:0 "Washington'ın saflığı peşimizi bırakmıyor."

  bpm_acw_events.539.t:0 "Popülist Yeniden Hizalanma"
  bpm_acw_events.539.d:0 "Şehit Kurtarıcının İkinci Parti Sistemini yıktığı yerde, halk hareketi şimdi onun Üçüncü Parti Sistemini yıktı ve yeni bir gerçeklik inşa etti. Popülist Parti artık Sınır Bölgesine hakim olurken hem Sanayi Ortabatısını hem de Tarımsal Güneyi tehdit ediyor.\n\nÇok uzun süre Çoğunlukçu Sistemin cilvelerini kaçınılmaz olarak kabul ettik ancak dayanışma ve meydan okuma sayesinde nihayet ikili tekel hegemonyasını kırdık."
  bpm_acw_events.539.f:0 ""Emeğin alnına bu dikenli tacı bastırmayacaksınız."\n\n—William Jennings Bryan, 1896"
  bpm_acw_events.539.a:0 "Washington'ın saflığı peşimizi bırakmıyor."

  bpm_solidarity_knights_of_labor.tt:0 "Bu duruşu sergilemek için işçi sendikalarını kazanmış olmamız gerekirdi."
  bpm_solidarity_geoists.tt:0 "Bu duruşu sergilemek için Georgistleri kazanmış olmamız gerekirdi."
  bpm_solidarity_socialistic_laborers.tt:0 "Bu duruşu sergilemek için Sosyalist İşçi Partisi'ni kazanmış olmamız gerekirdi."

  bpm_acw_events.601.t:0 "Büyük Uluslararası Para Konferansı"
  bpm_acw_events.601.d:0 "İç Savaş'tan sonraki yıllarda gümüş para biriminin çöküşünü sona erdirecek uluslararası bir parasal düzen oluşturmak için birçok girişimde bulunuldu. Şimdi ulusumuzun gücünün yeni zirvelere ulaşmasıyla sürekli para savaşlarına son vermek ve ulusumuzun insanları için istikrar ve refahı garanti altına almak amacıyla yeni bir Uluslararası Para Konferansı topladık."
  bpm_acw_events.601.f:0 ""Emeğin alnına bu dikenli tacı bastırmayacaksınız."\n\n—William Jennings Bryan, 1896"
  bpm_acw_events.601.a:0 "Nihayet insanlık çarmıhtan kurtuldu!"

  bpm_acw_events.602.t:0 "Pasifik Hegemonyası Güvence Altında"
  bpm_acw_events.602.d:0 "Kolomb Amerika'ya yelken açtığında kutsal topraklarımızı değil Asya'nın zenginliklerini arıyordu. Şimdi ulusumuzun refahını desteklemek için Manila Körfezi'nde sona eren batıya doğru kendi büyük girişimimizi başlattık. Orada, Doğu'nun incisinde, Çin'de ticaret özgürlüğünü ve Pasifik tüccarlarımızın güvenliğini sağlayacağız."
  bpm_acw_events.602.f:0 ""Filipinler'de özyönetim ilkesini buradaki ilkeyi zayıflatmadan reddedemeyiz"\n\n—William Jennings Bryan, 1900"
  bpm_acw_events.602.a:0 "Selam sana Columbia, mutlu diyar!"

  bpm_acw_events.603.t:0 "Kuzeybatı Geçidi Fethedildi"
  bpm_acw_events.603.d:0 "Kanada'yı fethetmek için üçüncü kez yürüdüğümüzde buzulları yönetilmesi çok pahalı görerek Kuzey Kutup Dairesi'nde durmuştuk. Ancak deniz teknolojisi geliştikçe Kuzeybatı geçidinin potansiyel kârları da arttı. Kutup bölgesini ele geçirmemizle Kuzey deniz yollarındaki hakimiyetimiz sonsuza dek pekişti."
  bpm_acw_events.603.f:0 ""Filipinler'de özyönetim ilkesini buradaki ilkeyi zayıflatmadan reddedemeyiz"\n\n—William Jennings Bryan, 1900"
  bpm_acw_events.603.a:0 "Selam sana Columbia, mutlu diyar!"

  bpm_acw_events.604.t:0 "Tehuantepec Koridoru Alındı"
  bpm_acw_events.604.d:0 "Bir zamanlar Monroe Doktrini'ni mevcut Avrupa sömürgelerini kapsayacak şekilde genişletmiştik. Şimdi dış politikamıza yeni bir ek yaptık: Özgür Amerikan uluslarının güvenliğini sağlamak için gerekli olan her türlü stratejik toprak, şu anda özgür bir Amerikan ulusunun elinde olsa bile bir bütün olarak Batı Yarımküre'nin güvenliğini korumak adına feda edilir."
  bpm_acw_events.604.f:0 ""Filipinler'de özyönetim ilkesini buradaki ilkeyi zayıflatmadan reddedemeyiz"\n\n—William Jennings Bryan, 1900"
  bpm_acw_events.604.a:0 "Selam sana Columbia, mutlu diyar!"

  bpm_acw_events.605.t:0 "Frisco'ya Yürüyüş"
  bpm_acw_events.605.d:0 "Nihayet Mississippi Nehri'nden büyük Pasifik Okyanusu'na uzanan bir güzergahı güvence altına aldık. Ancak şimdi ulusumuzun bayrağının denizden parıldayan denize kadar dalgalandığı söylenebilir!"
  bpm_acw_events.605.f:0 ""Filipinler'de özyönetim ilkesini buradaki ilkeyi zayıflatmadan reddedemeyiz."\n\n—William Jennings Bryan, 1900"
  bpm_acw_events.605.a:0 "Selam sana Columbia, mutlu diyar!"

  bpm_acw_events.606.t:0 "54-40 Tamamlandı"
  bpm_acw_events.606.d:0 "Bir zamanlar atalarımız '54-40 ya da kavga!' (54-40 or fight!) diye haykırmışlardı. Artık cennette huzur buluyorlar; zira Vancouver'ın ele geçirilmesiyle Pasifik'teki topraklarımıza yönelik İngiliz saldırganlığına karşı nihayet güvenliği sağlayabiliriz."
  bpm_acw_events.606.f:0 ""Filipinler'de özyönetim ilkesini buradaki ilkeyi zayıflatmadan reddedemeyiz."\n\n—William Jennings Bryan, 1900"
  bpm_acw_events.606.a:0 "Selam sana Columbia, mutlu diyar!"

  bpm_acw_events.607.t:0 "Ostend Karşılandı"
  bpm_acw_events.607.d:0 "Küba sanayici ve plantasyon sahibi sınıflarımız tarafından uzun süredir arzulanıyordu; adanın bol şeker plantasyonları zengin ödüller vaat ediyordu. Şimdi o ödül ve Guantanamo Körfezi'ndeki deniz üssü bizimdir."
  bpm_acw_events.607.f:0 ""Filipinler'de özyönetim ilkesini buradaki ilkeyi zayıflatmadan reddedemeyiz."\n\n—William Jennings Bryan, 1900"
  bpm_acw_events.607.a:0 "Selam sana Columbia, mutlu diyar!"