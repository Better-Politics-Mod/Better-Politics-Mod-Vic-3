 ##### Ekonomiyi Gözden Geçirme

 bpm_christdem_split.50.t: "Ekonomik Meseleleri Gözden Geçirme"
 bpm_christdem_split.50.d: "Devletin ekonomisinde, genel yaşam standardında ve iç gerilimlerde meydana gelen son değişiklikler, @ig_christian_democrats! #blue Hristiyan Demokratlar#!ı ve onların devlet müdahalesi, ticaret ve vergilendirme konusundaki görüşlerini etkilemeye başlamış; onları iç tartışmalara, mevcut ekonomik pozisyonlarına alternatiflere doğru değişime ve daha önce sessiz olan sesleri duyurmaya itmiştir." 
 bpm_christdem_split.50.f: ""

 bpm_christdem_split.51.t: "İdeolojik Meseleleri Gözden Geçirme"
 bpm_christdem_split.51.d: "Devletin siyasi sisteminde meydana gelen son değişiklikler, gelişen modernist fikirler ve iç gerilimler, @ig_christian_democrats! #blue Hristiyan Demokratlar#!ı ve onların siyasi sistem, oy hakkı, merkezileşme ve gelişmekte olan ülkeye tepki verme konusundaki görüşlerini etkilemeye başlamış; onları iç tartışmalara, mevcut ekonomik pozisyonlarına alternatiflere doğru değişime ve daha önce sessiz olan sesleri duyurmaya itmiştir."
 bpm_christdem_split.51.f: ""

 ##### Ademi Merkeziyetçilik ve Devlet Gücü

 bpm_christdem_split.4.t: "Devlet Gücü ve Ademi Merkeziyetçilik (Yerelleşme) Üzerine"
 bpm_christdem_split.4.desc: "Devletin merkezden uzaklaştırılması ve yerel yapıların güçlendirilmesi arzusu Katolikler için her zaman önemli olmuştur. Çoğu, devletin ademi merkezileştirilmesinin gerekli olduğu görüşünü paylaşır, ancak aynı ölçüde değil.\n\nBir grup güçlü bir şekilde federalleşmiş, uyumlu bir devletin sürdürülmesi veya kurulması gerektiğine inanırken, diğer grup devletin zayıflıklarına ve yetersizliğine dikkat çekerek devletin çok daha derin bir şekilde ademi merkezileştirilmesi için çabalar."
 bpm_christdem_split.4.f: "Devlet, tanımı gereği, basit bir ayakkabıcı dükkanını bile yönetmekten acizdir.\n\n— Luigi Sturzo, 1951"
 bpm_christdem_split.4.a: "Derin bir yerelleşmeye çok ihtiyaç var ve bunu aktif olarak aramalıyız."
 bpm_christdem_split.4.b: "Yerelleşme önemlidir ancak devletin istikrarı çok daha önemlidir."
 bpm_christdem_split.4.c: "Devlet güçlü olmalı ve sakin bir kamu düzenini korumalıdır."


 ##### Ekonomi ve Kapitalizm
 
 bpm_christdem_split.5.t: "Ekonomi ve Kapitalizm Üzerine"

 bpm_christdem_split.5.desc: "Liberal kapitalizm, sanayileşme ve insan yaşamının her alanı ve yönündeki tam bir devrim, başlangıçta Katolik aktivistler ve sıradan Katolikler tarafından büyük bir düşmanlık ve direnişle karşılandı. Ancak zamanla birçoğu bunu kabul etti ve yaklaşımlarında farklılaştılar.\n\nBazıları kapitalizmin genel olarak olumlu olduğuna ve devletin mali muhafazakarlık izlemesi gerektiğine inanırken, diğerleri kademeli demokratikleşme ve farklılıkların eşitlenmesi yoluyla devlet ve vatandaşlar lehine onu sınırlandırmaya çalışır. Bazıları ise sessiz kalsalar da kapitalizmi mutlak bir kötülük olarak görür ve onu güçlü bir şekilde demokratikleşmiş, merkezi planlı bir ekonomiyle değiştirmeyi hedefler."
 bpm_christdem_split.5.f: "Zengin ve yoksul arasındaki muazzam uçurum kapatılmalıdır — kapatılmazsa vay halimize! Sevgi emri, Tanrı katında adalet emrinden bile daha yücedir.\n\n— Karl Freiherr von Vogelsang"

 bpm_christdem_split.5.a: "Sermaye ve işçiler arasındaki barışçıl bir işbirliği büyük meyveler verecektir."
 bpm_christdem_split.5.b: "Kapitalizmin daha fazla reforma ve değişime ihtiyacı var."
 bpm_christdem_split.5.c: "Liberal-kapitalist politikanın ölümcül olduğu kanıtlanmıştır ve yok edilmelidir."
 bpm_christdem_split.5.d: "Tarıma dayalı bir ekonomi sürdürülmeli ve aktif olarak desteklenmelidir."

 ##### Sıradan Hareketler ve Kilise

 bpm_christdem_split.3.t: "Sıradan Hareketler ve Kilise Üzerine"
 bpm_christdem_split.3.d: "Tüm @ig_christian_democrats! Katolikler, devletteki Katolik ahlakını güçlendirmeyi ve aynı zamanda modernist laiklik ile siyasi liberalizmden kendi nüfuzlarını aktif olarak savunmayı hedefler. Bazı Katolikler, Kilise'nin modernist tehdide karşı sıradan hareketlerle işbirliği yapmasını isterken, bazıları bağımsız olarak gelişmeyi ve potansiyel olarak insanlar için Kilise ile savaşmayı amaçlar."
 bpm_christdem_split.3.f: "Tanrı'ya itaat etmek, insanlara itaat etmekten daha iyidir.\n\n— Wojciech Korfanty, 1927"
 bpm_christdem_split.3.a: "Kilise bu süreci denetleyecektir."
 bpm_christdem_split.3.b: "Kilise ancak bizim düşmanımız olabilir, müttefikimiz değil."

 ##### Din

 bpm_christdem_split.6.t: "Din ve Ahlak Üzerine"
 bpm_christdem_split.6.d1: "Tüm @ig_christian_democrats! Katolikler şu veya bu ölçüde dindardır, ancak yine de dindardırlar. Bu nedenle, genel olarak insanlığın dini ve ahlaki yönünü koruma ihtiyacı her zaman önemli olmuştur ve olmaya devam etmektedir; ve birçok inanan yasanın ve devlet faaliyetlerinin dini ve ahlaki karakterini korumaya çalışmaktadır, ancak herkes bu idealin kapsamı ve gücü konusunda hemfikir değildir.\n\nBazıları hukuk ve devlet için dinde daha güçlü bir temel oluşturmaya çalışırken, diğerleri dini ahlakçılığın daha derin bir şekilde ılımlılaştırılması için çabalar ve bazıları da dini siyasi hayatta daha geniş bir şekilde sınırlandırmayı ve hatta kilise ile devletin ayrılmasını ister." 
 bpm_christdem_split.6.f: "Tanrı'ya itaat etmek, insanlara itaat etmekten daha iyidir.\n\n— Wojciech Korfanty, 1927"

 bpm_christdem_split.6.a: "Katoliklik, kamusal yaşamın tüm yönlerini düzenleyecektir."
 bpm_christdem_split.6.b: "Vicdan özgürlüğü garanti altına alınmalı ve kamu yönetimi profesyonel tutulmalıdır."
 bpm_christdem_split.6.c: "Dini ahlak önemlidir ama özgürlüğümüz daha da önemlidir."

 ##### Refah

 bpm_christdem_split.7.t: "Refah ve Hayırseverlik Üzerine"
 bpm_christdem_split.7.d1: "Pek çok @ig_christian_democrats! sıradan Katolik, hayırseverliğe ve bir bütün olarak insanlığın her bireye yaşamın tüm gereksinimlerine erişim sağlama ihtiyacına içtenlikle inanır.\n\nBazıları sivil toplumun ve hayırseverliğin tek başına herkesin ihtiyacını karşılayacağına inanırken, diğerleri herkese fayda sağlamak için devletin güçlü bir şekilde kullanılması gerektiğine inanır ve yine de diğerleri bir orta yol bulmaya ve her iki fikri de sınırlı bir ölçüde kullanmaya çalışır."
 bpm_christdem_split.7.f: "Sadece para vermeyi bilen bir hayırseverlik henüz Hristiyan sevgisi değildir. Suçluluk duygusundan ancak, bu tür suiistimallere sonsuza dek son vermek için zamanınızı, enerjinizi ve becerikliliğinizi de verdiğinizde ve toplumumuzun canlılığını böylesine endişe verici şekillerde yok eden bu kansere karşı, Hristiyan dininizin deposunda gizli yatan hiçbir şeyin kullanılmadan kalmasına izin vermediğinizde kurtulacaksınız.\n\n— Abraham Kuyper, 1891"

 bpm_christdem_split.7.a: "İnsanların hayırseverlik yoluyla birbirlerine yardım etmesi, insana yakışır bir yaşam sağlamanın en adil yoludur."
 bpm_christdem_split.7.b: "Hayırseverlik yeterli değildir, devlet işçiler için bir miktar kamu refahı sağlamalıdır."
 bpm_christdem_split.7.c: "Özel el işçiyi korumakta başarısız olmuştur, devlet tüm kontrolü ele almalıdır."
 bpm_christdem_split.7.d: "Birleştirilmiş dini refah ve hayırseverlik büyük meyveler verecektir."

 ##### Milliyetçilik

 bpm_christdem_split.8.t: "Milliyetçilik ve Sınırlar Üzerine"
 bpm_christdem_split.8.desc: "@ig_christian_democrats! Sıradan Katolikler uzun zamandır güçlü bir kültür bilincine sahiptiler, ancak milliyetçiliğin ve modern insan algılarının ortaya çıkmasıyla birlikte bu kültürle özdeşleşme biçimleri önemli ölçüde değişti. Geçmişte birçoğu sadece ailelerine ve evlerine aidiyet hissederken, şimdi giderek daha fazlası kendi yerini köyün ötesinde buluyor.\n\nMilliyetçilik bazılarının kendi uluslarına aşık olmasına ve başkalarında düşman bulmasına neden olurken, diğerleri bir bütün olarak insanlığa güçlü bir aidiyet duygusu buldular ve küçük grupları tek bir bütün halinde birleştirme arayışını sürdürdüler. Bu arada bazıları iki radikal algı arasında altın bir orta yol buldu."
 bpm_christdem_split.8.f: "Din adamlarının, daha geniş bir toplumsal düzenin kurucu bir parçası olarak, anavatanın çıkarlarını yürekten benimsemesi doğal olmakla birlikte; evrensel Hristiyan ahlakından kaynaklanan o üstün yargılama gücünü kaybetmeyi içeren herhangi bir milliyetçiliğe veya particiliğe kaymak ne doğal ne de Hristiyancadır.\n\n— Luigi Sturzo, 1929"
 
 bpm_christdem_split.8.a: "İster iç ister uluslararası olsun tüm sınırlar zayıflatılmalı ve nihayetinde kaldırılmalıdır."
 bpm_christdem_split.8.b: "Tüm insanların yeni bir güvenli liman aramasına izin verilmelidir."
 bpm_christdem_split.8.c: "Ülkemiz yerel yerli kültürler için korumayı sürdürmeli ve fazla yabancı olanlarla savaşmalıdır." # [SCOPE.GetRootScope.GetCulture.GetName]
 bpm_christdem_split.8.d: "Tüm kültürler korunmalıdır ancak kendi kültürümüzün üstünlüğünü korumalıyız."
 bpm_christdem_split.8.e: "Tüm kültürler devletimizi ve kimliğimizi zayıflatır, bu nedenle ortadan kaldırılmalıdır."

 ##### Demokrasi

 bpm_christdem_split.9.t: "Demokrasi ve Oy Hakkı Üzerine"
 bpm_christdem_split.9.desc: "Bir zamanlar çoğu @ig_christian_democrats! Katoliğin düşman olduğu liberal demokrasi, bugün insan hayatının çeşitli alanlarına nüfuz ederek neredeyse herkes tarafından geniş çapta kabul gören bir şey haline geldi. Birçok Katolik artık toplumda bunun gerekliliğine inanarak demokrasiye daha fazla ya da basitçe olumlu yaklaşıyor, ancak herkes kendi vizyonunda farklılaşıyor.\n\nBazıları açıkça 'parlamenter-liberal' kısmı sınırlamak istiyor, bazıları ilahi egemenlik ilkesini ihlal etmeden bunu sürdürmek istiyor, bazıları ise Demokrasi ve Hristiyanlığın bir sentezini sunma gerekliliğine inanıyor ve onu genişletmek için çabalıyor."
 bpm_christdem_split.9.f: "Bugün konuşma hakkından yararlanmak için altına, hem de çok altına ihtiyacınız var; biz yeterince zengin değiliz. Yoksullar için sessizlik.\n\n— Félicité de La Mennais, 1848"

 bpm_christdem_split.9.a: "Biz demokratız, Hristiyan demokratız."
 bpm_christdem_split.9.b: "Demokrasi içinde ilahi egemenlik korunmalıdır."
 bpm_christdem_split.9.c: "Demokrasi, güçlü bir yönetimin tamamlayıcısı olmalıdır."

 ##### Askeri

 bpm_christdem_split.10.t: "Askeri ve Savunma Üzerine"
 bpm_christdem_split.10.desc: "Barışı koruma ve kendininkini koruma arzusu, Katolik Kilisesi'nin takipçileri arasında her zaman yaygın olmuştur. Buna ek olarak, milliyetçilik ve modern militarizm, @ig_christian_democrats! Katolikler arasında pasifist konumlara ve aşırı abartılı bir orduya karşı düşmanlığa doğru genel bir kaymaya yol açtı.\n\nİlk grup, barış ve karşılıklı işbirliği için çabalamaya devam ederken, yalnızca savunma için güçlü ve modern bir orduya ihtiyaç olduğunu savunurken; ikinci grup, tüm dünyanın kademeli, tam olarak askerden arındırılması ve evrensel barış için çabalar."
 bpm_christdem_split.10.f: "İnancı olanlar dağları yerinden oynatır; inancı olanlar din değiştirir; inancı olanlar savaş kazanır.\n\n— Luigi Sturzo, 1922"

 bpm_christdem_split.10.a: "Olağanüstü ulusal savunma araçlarına ihtiyacımız var."
 bpm_christdem_split.10.b: "Ordumuz güçlü ve modern olmalı."
 bpm_christdem_split.10.c: "Topyekün ve evrensel askerden arındırmayı hedeflemeliyiz."

 ##### Kadınlar (NEREDE?)
 
 bpm_christdem_split.11.t: "Kadınlar ve Oy Hakkı Üzerine"
 bpm_christdem_split.11.desc: "Sıradan Katolikler için aile son derece önemlidir ve kuruluşundan bu yana onu savunmaya ve desteklemeye çalışmışlardır.\n\nFeminizmin ortaya çıkmasıyla birlikte Katolikler de kadınlar hakkındaki düşüncelerini değiştirdiler ve büyük çoğunluğu, bazıları hala evde kalmalarını tercih etse de kadınlar için oy hakkını güvence altına almak istiyor.\n\nBununla birlikte, kadınların siyasete hiç katılmamasını tercih edenler de var."
 bpm_christdem_split.11.f: ""
 
 bpm_christdem_split.11.a: "Kadınlar oy kullanabilmeli, ancak gerçekte ait oldukları yer evleridir."
 bpm_christdem_split.11.b: "Kadınların asıl yeri sadece evleridir."

 ##### Hristiyan Demokrasisinin Yükselişi

 bpm_christdem_split.12.t: "Hristiyan Demokrasisinin Yükselişi"
 bpm_christdem_split.12.desc: "‘Rerum novarum’ ve ‘Graves de communi re’ genelgelerinin ortaya çıkmasıyla yeni bir ideoloji — @ig_christian_democrats! Hristiyan Demokrasi — siyasi alana yayılmaya başladı. Hristiyan Demokratları tanımlamak zordur, çünkü ülkeden ülkeye muazzam farklılıklar gösterirler, ancak büyük çoğunluğu oy hakkını, korporatizmi ve dini ahlakı destekler, bazen de Katolik Sosyal Öğretisine dayalı olarak dünyayı değiştirmeyi amaçlarlar.\n\nOrtaya çıkışları tarihi sarsabilir ya da aslında hiçbir şeyi değiştirmeyebilir."
 bpm_christdem_split.12.f: "Merkez Parti temelde itirafçı değil, siyasi bir partidir. Temsilcilerin kendilerini bir bütün olarak halkın temsilcileri olarak görmelerini gerektiren Alman Anayasası'ndaki yerini alır.\n\n— Merkez Parti Liderliği, 1909"

 bpm_christdem_split.12.a: "Sonunda Hristiyan mı yoksa Demokrat mı olduklarına karar verdiler mi?"

 ##### Sonrası

 bpm_christdem_split.13.t: "Sonrası"
 bpm_christdem_split.13.d: "Avrupa'nın pek çok yerinde Hristiyan Demokratların ortaya çıkması, ezeli düşmanlarının beklediğinin aksine önemli değişikliklere yol açtı. Çeşitli ülkelerde siyasi mekanizmaya tüm güçleriyle katıldılar ve partiler kurdular ya da onları ele geçirerek eski elitleri zayıflattılar.\n\nBazı yerlerde [GetLawType('law_universal_suffrage').GetName], sosyal [GetLawGroup('lawgroup_welfare').GetName], modern ekonomik politikalar gibi büyük reformların yapılmasını sağladılar; diğer yerlerde ise devleti güçlendirmeyi ve onu korporatizm ve kilisenin öğretileri etrafında geliştirerek liberal ve solcu aşırılıkları dizginlemeyi amaçlıyorlar."
 bpm_christdem_split.13.f: "Her şeyden önce, rakiplerimizden nefret etmeden inancımızı savunmayı, bizim gibi düşünmeyenleri takdir etmeyi, her kampta Hristiyanların olduğunu ve Tanrı'ya her zaman olduğu gibi şimdi de hizmet edilebileceğini kabul etmeyi öğrenelim! Zamanımızdan daha az, kendimizden daha çok şikayet edelim. Cesaretimiz kırılmasın, daha iyi olalım.\n\n— Frédéric Ozanam"
 
 bpm_christdem_split.13.a: "Çok tuhaf adamlar."

