je_balkan_national_awakenings: "Ulusal Uyanış"
je_balkan_national_awakenings_reason: "[ROOT.GetCountry.GetName], ulus olma yolunda ilk adımlarını atmış olsa da hâlâ bir köylüler diyarıdır. Halkımızın büyük bir kısmı dünyayı ulusal kardeşlik merceğinden ziyade köy ve aşiret merceğinden görmeye devam ediyor. Halkımız arasında kültürel bir [concept_fervor] (coşku) yaratmalı ve [SCOPE.sCulture('primary_culture_scope').GetName] halkından birleşik bir ulus inşa etmeliyiz.\n\n[SCOPE.sCulture('primary_culture_scope').GetName] kültürünün [concept_fervor] (coşkusu) aşağıdaki koşullardan etkilenir:\n• [SCOPE.sCulture('primary_culture_scope').GetName] [Concept('concept_pop', '$concept_pops$')] nüfusunun ortalama [concept_literacy] (okuryazarlığı)\n• [SCOPE.sCulture('primary_culture_scope').GetName] [GetPopType('academics').GetName] miktarı\n• #b $nationalism$#! ve #b $pan-nationalism$#! araştıran [SCOPE.sCulture('primary_culture_scope').GetName] ülkeleri\n• [SCOPE.sCulture('primary_culture_scope').GetName] nüfusunun ortalama [concept_acceptance] (kabul edilme) oranı\n• Bağımsız veya eskiden bağımsız olmuş [SCOPE.sCulture('primary_culture_scope').GetName] ülkeleri"

