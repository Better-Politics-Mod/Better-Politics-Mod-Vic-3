l_turkish:
 ideology_eco_artisan:0 "Zanaatkarlar"
 ideology_eco_artisan_desc:0 "#lore Bu grup, yerel nitelikli üretime odaklanan zanaatkar bir ekonomiye inanır. #!"

 ideology_eco_laissez_faire:0 "Laissez-Faire"
 ideology_eco_laissez_faire_desc:0 "#lore Bu grup, devlet güçlerinin daha az müdahale ettiği durumlarda en uygun şekilde işleyen bir piyasa ekonomisine inanır. #!"

 ideology_eco_interventionist:0 "Müdahaleci"
 ideology_eco_interventionist_desc:0 "#lore Bu grup, bir dereceye kadar devlet müdahalesinden etkilenen bir piyasa ekonomisine inanır. #!"

 ideology_eco_traditional_agrarian:0 "Geleneksel Tarımcı"
 ideology_eco_traditional_agrarian_desc:0 "#lore Bu grup, geleneksel ve ağırlıklı olarak tarıma dayalı bir ekonomiyi sürdürmek ister. Bunun mümkün olmadığı durumlarda ise sanayileşmeyi devlet eliyle sınırlandırmayı arzular. #!"

 ideology_eco_modern_agrarian:0 "Modern Tarımcı"
 ideology_eco_modern_agrarian_desc:0 "#lore Bu grup, modern ticari çiftçinin çıkarlarını temsil eder. Kentleşme ve serbest ticaretten tehdit altında hissedebilirler ve çıkarlarını devlet müdahalesi yoluyla savunmaya çalışırlar. #!"

 ideology_eco_agrarian_socialist:0 "Tarım Sosyalisti"
 ideology_eco_agrarian_socialist_desc:0 "#lore Bu grup, genellikle kırsal arazilerin eşitlikçi veya komünal (ortak) mülkiyetini tercih eden geniş bir görüş yelpazesini temsil eder. #!"

 ideology_eco_autarky:0 "Otarşi"
 ideology_eco_autarky_desc:0 "#lore Ekonomik bağımsızlığı hedefleyen bu grup, ağır ekonomik yönetimi devletin temel bir işlevi olarak görür. #!"

 ideology_eco_socialist_autarky:0 "Sosyalist Otarşi"
 ideology_eco_socialist_autarky_desc:0 "#lore Kapitalist ülkelerden ekonomik bağımsızlığı hedefleyen bu grup, ekonominin ağır devlet yönetimini ve kolektifleştirilmesini sosyalizme giden yolda gerekli bir ara adım olarak görür. #!"

 ideology_eco_agrarian_autarky:0 "Tarımsal Otarşi"
 ideology_eco_agrarian_autarky_desc:0 "#lore Yabancı ülkelerden ekonomik bağımsızlığı hedefleyen bu grup, güçlü ve bağımsız bir köylülüğün gelişimini ulusun kendi kendini güçlendirmesi için elzem görür. #!"

 ideology_eco_socialist_mixed_economy:0 "Sosyalist Karma Ekonomi"
 ideology_eco_socialist_mixed_economy_desc:0 "#lore Bu grup, sosyalizme giden yolda bir ara adım olarak piyasa ekonomisini bir miktar devlet müdahalesi ve kooperatif mülkiyeti ile harmanlamayı amaçlar. #!"

 ideology_eco_proletarian_economy:0 "Proleter Ekonomi"
 ideology_eco_proletarian_economy_desc:0 "#lore Bu grup, üretim araçları üzerindeki kooperatif yönetimini ve mülkiyetini en üst düzeye çıkarmayı amaçlar. #!"

 ideology_eco_serf_economy:0 "Serf Ekonomisi"
 ideology_eco_serf_economy_desc:0 "#lore Bu grup, büyük tarım arazilerine bağlı köylü serflerin geleneksel yapısını korumayı amaçlar. #!"

 ideology_eco_trad_isolationist:0 "İzolasyonist Serf Ekonomisi"
 ideology_eco_trad_isolationist_desc:0 "#lore Bu grup, büyük tarım arazilerine bağlı köylü serflerin geleneksel yapısını korumayı ve yabancıların tamamen dışlanmasını amaçlar. #!"

 ideology_eco_slave_economy:0 "Köle Ekonomisi"
 ideology_eco_slave_economy_desc:0 "#lore Bu grup, köleliği korumayı amaçlar. #!"

 ideology_eco_antebellum_economy:0 "Antebellum Ekonomisi"
 ideology_eco_antebellum_economy_desc:0 "#lore Bu grup, köleliği ve serbest ticareti korumayı amaçlar. #!"

 ideology_eco_modernizer:0 "Ekonomik Modernleştirici"
 ideology_eco_modernizer_desc:0 "#lore Bu grup, ekonomiyi modernleştirmeyi amaçlar. #!"

 ideology_eco_conservative_agrarian:0 "Muhafazakar Tarımcı"
 ideology_eco_conservative_agrarian_desc:0 "#lore Bu grup, modern aristokratik çiftçinin çıkarlarını temsil eder. Kentleşme ve serbest ticaretten tehdit altında hissedebilirler ve çıkarlarını devlet müdahalesi yoluyla savunmaya çalışırlar. #!"

 ideology_eco_american_system:0 "Amerikan Sistemi"
 ideology_eco_american_system_desc:0 "#lore Bu grup korumacı gümrük tarifeleri, iç altyapı iyileştirmeleri ve ulusal bir banka aracılığıyla ulusal ekonomiyi teşvik etmeyi amaçlarken, kölelik konusunda kararsız (tarafsız) kalır. #!"

 ideology_eco_debt_serf_economy:0 "Borç Serfliği Ekonomisi"
 ideology_eco_debt_serf_economy_desc:0 "#lore Bu grup, büyük tarım arazilerine bağlı köylü serflerin geleneksel yapısını borç köleliği ile korumayı amaçlar. #!"

 ideology_eco_colonialist:0 "Sömürgeci Ekonomi"
 ideology_eco_colonialist_desc:0 "#lore Bu grup, kendi bölgelerinden sürekli servet çıkarılmasına bel bağlayan sömürgeci bir çıkarı temsil eder ve bağımsız ekonomik kalkınma yerine bu sistemin sürdürülmesini destekler. #!"

 ideology_eco_slave_colonialist:0 "Köleci Sömürge Ekonomisi"
 ideology_eco_slave_colonialist_desc:0 "#lore Bu grup, kendi bölgelerinden köleler aracılığıyla sürekli servet çıkarılmasına bel bağlayan sömürgeci bir çıkarı temsil eder ve bağımsız ekonomik kalkınma yerine bu sistemin sürdürülmesini destekler. #!"

 ideology_eco_colonial_slavery_supporter: "Sömürge Köleliği Destekçisi"
 ideology_eco_colonial_slavery_supporter_desc:0 "#lore Bu grup, sömürgelerdeki köle emeğinden yararlanan muhafazakar toprak sahiplerinin ekonomik çıkarlarını temsil eder. Sömürgelerde köleliği korumayı amaçlarlar ancak anakarada köleliği geri getirme konusunda isteksizdirler. #!"