l_simp_chinese:
 bpm_union_leadership.1.t:0 "劳工的屈服"
 bpm_union_leadership.1.desc:0 "随着社会主义的幽灵在我们美丽国度上空游荡，我们的政府别无选择，只能承认某种形式的工人组织是不可避免的。然而，这并不意味着它屈服了。事实上，政府已将工会的理念整合进一个新的部门，以确保雇主与雇员能够为了我们国家的福祉而合作。"
 bpm_union_leadership.1.f:0 "被马克思主义教义所左右的工会并不想要社会和平。他们盘算着，随着工人的不满日益加深，他们夺取政治权力的机会也会随之增大。希特勒政府所面临的首要任务之一，就是解散那些让雇主与雇员之间保持敌对的团体。它们被劳动阵线所取代。\n\n——罗伯特·莱伊，1936年"
 bpm_union_leadership.1.a:0 "对我们有利。"
 bpm_union_leadership.2.t:0 "劳工的解放"
 bpm_union_leadership.2.desc:0 "为了安抚我国下层阶级，国家工会组织最近被正式解散。如今已无衙门可坐，其昔日的领袖或已退休，或重新回流到更庞大的官僚体系之中，而独立的工会则在我们的土地上各个工作场所重新建立起来。"
 bpm_union_leadership.2.f:0 "我认为每一位工人都应当明智地加入工会。我无法想象，一个在世间权势面前毫无防备的人，倘若他尚能从养家糊口的钱里省出会费，却不去加入一个保护劳工权利与利益的组织，该是何等的愚蠢。\n\n——温斯顿·丘吉尔，1911年"
 bpm_union_leadership.2.a:0 "为人民三呼万岁！"
 bpm_union_leadership.2.t2:0 "国家工会的终结"
 bpm_union_leadership.2.desc2:0 "我国的领导人最近认定，国家劳工组织是一个耗资巨大、毫无必要、甚至颇具风险的机构。于是，他们正式解散了国家工会组织，并查禁了任何试图取而代之的其他团体。然而，即便其昔日的领袖或已退休，或已湮没无闻，由新秀领导的基层劳工运动仍在我国的地下顽强存续。"
 bpm_union_leadership.2.f2:0 "有人要求我们允许一百个人围到一个人家门口——这个人不过是想行使这个国家普通法所赋予的权利，在他愿意的时间和地点出卖自己的劳动——然后去“劝告”他、或“和平地说服”他不要上工。如果和平说服真的是目的，那为什么需要一百个人来做这件事？……每一个诚实的人都知道，工会为何坚持拥有组织大规模纠察队的权利。那是因为它们的目标既不依靠和平，也不依靠说服。那些被它们纠察的人，是无法被和平说服的。\n\n——F. E. 史密斯，伯肯黑德伯爵一世，1906年"
 bpm_union_leadership.2.a2:0 "我们迟早会抓住那些煽动分子的。"
 bpm_union_leadership.2.t3:0 "劳工的解放"
 bpm_union_leadership.2.desc3:0 "为了安抚我国下层阶级，国家工会组织最近被正式解散。如今已无衙门可坐，其昔日的领袖或已退休，或重新回流到更庞大的官僚体系之中，而独立的工会则在我们的土地上各个工作场所重新建立起来。不过，仍会保留一些防范措施，以免这些工会生出太多异想天开的念头。"
 bpm_union_leadership.2.f3:0 "我认为每一位工人都应当明智地加入工会。我无法想象，一个在世间权势面前毫无防备的人，倘若他尚能从养家糊口的钱里省出会费，却不去加入一个保护劳工权利与利益的组织，该是何等的愚蠢。\n\n——温斯顿·丘吉尔，1911年"
 bpm_union_leadership.2.a3:0 "温和派赢得了胜利。"
 bpm_union_leadership.2.t4:0 "劳工，再度崛起"
 bpm_union_leadership.2.desc4:0 "随着工人工团集体掌控国家机器，国家工会组织在革命的冲击下轰然坍塌。昔日的领袖们或已受到审判，或在默默无闻中凋零，而那些曾被他们镇压的工会，如今构成了我们社会的脊梁。"
 bpm_union_leadership.2.f4:0 "到田野里去，把其余的工人带回来，好让他们为自己伟大的使命做好充分准备。我们要从资本家手中一步一步地夺取我们所能夺取的一切，但目光始终盯着目标；我们要伴随着新解放那鼓舞人心的乐章，步调一致地前进；等到我们拥有了足够多的这类组织，正如德莱昂兄弟前几天所愉快地说过的那样，当我们列成战阵、而资本家企图将我们关在门外时，我们就要反客为主，把他们关在门外。没有他们我们照样能开动工厂，而没有我们他们却无法开动工厂。\n\n——尤金·德布斯，1905年"
 bpm_union_leadership.2.a4:0 "团结永存！"
 bpm_union_leadership.2.t5:0 "劳工的革命"
 bpm_union_leadership.2.desc5:0 "在这个无产阶级解放的新时代，国家工会组织终于被击垮。领导它的人或已身陷囹圄，或已流亡海外，而我国的工会已被合法化，并置于果敢革命先锋的指引之下。"
 bpm_union_leadership.2.f5:0 "以任何方式贬低社会主义意识形态，哪怕稍有偏离，都意味着加强资产阶级意识形态。关于自发性谈得很多。但工人运动的自发发展，恰恰会导致其从属于资产阶级意识形态……；因为自发的工人运动就是工联主义……，而工联主义意味着工人在思想上被资产阶级奴役。因此，我们的任务，即社会民主党的任务，就是要同自发性作斗争，把工人运动从这种自发的、工联主义的、投靠资产阶级羽翼之下的倾向中拉出来，使它归于革命的社会民主党的羽翼之下。\n\n——弗·伊·列宁，1902年"
 bpm_union_leadership.2.a5:0 "革命万岁！"
