austria_trialism.1.t: "[SCOPE.sCountry('austria_scope').GetRuler.GetPrimaryRoleTitle] [SCOPE.sCountry('austria_scope').GetRuler.GetFirstName] Trialist Manifestoyu Yayınlıyor"
austria_trialism.1.d: "[SCOPE.sCountry('austria_scope').GetCapital.GetCityHubName] merkezindeki [SCOPE.sCountry('austria_scope').GetRuler.GetPrimaryRoleTitle], bir [GetCulture('croat').GetName] krallığının kurulmasını destekleyen bir manifesto yayınladı. Bu krallığı kurmak, [ROOT.GetCountry.GetAdjectiveNoFlag] veliaht topraklarının bütünlüğünden taviz vermeyi gerektirecek ve İmparatorluk içindeki göreceli statümüzü düşürecektir."
austria_trialism.1.f: "Haberci, sadece bir sekreter çıkana kadar Meclis Başkanı'nın kapısını yumrukladı. Bir elinde bir tomar kağıt tutuyor, dengesini sağlamak için diğer elini kapı çerçevesine dayıyordu. Nefes nefese kalarak ilk cümlelerini söylemeyi başardı.\n\n"Haberi yeni aldım. [SCOPE.sCountry('austria_scope').GetRuler.GetCustom('getEmpressEmperor')]-"\n\n"[SCOPE.sCountry('austria_scope').GetRuler.GetCustom('getQueenKing')] demek istiyorsun, değil mi?"\n\n"Ah, evet. [SCOPE.sCountry('austria_scope').GetRuler.GetCustom('getQueenKing')] bizi parçalamak istiyor.""
austria_trialism.1.a: "[ROOT.GetCountry.GetNameNoFlag] devletine yapılan bu hakareti veto edin."
austria_trialism.1.b: "Hatalarımızın intikamı alınsın. Manifestoyu imzalayın."
possible_dp_with_austria_scope_tt: "#r #b [SCOPE.sCountry('austria_scope').GetName] devletine karşı bir [concept_diplomatic_play] (diplomatik oyuna) yol açabilir#!#!"

austria_trialism.2.t: "[SCOPE.sCountry('hungary_scope').GetName] Trialist Manifestosunu Veto Ediyor"
austria_trialism.2.d: "[SCOPE.sCountry('hungary_scope').GetName] hükümeti, [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]'ın [GetCulture('croat').GetName] halkına eşit statüde bir monarşi vaat eden manifestosunu veto etti. [SCOPE.sCountry('hungary_scope').GetNameNoFormatting] devletinin bu reddi, İmparatorluğun her iki yarısındaki Güney Slav nüfusu arasında hoşnutsuzluğa yol açtı."
austria_trialism.2.f: "[SCOPE.GetRootScope.GetCountry.GetCustom('country_legislature_name')] içinden büyük bir iç çekiş geçti. İyimser olmak için hiçbir nedenleri yoktu - ama yine de, nedense çok yakın görünmüştü. Bir an için kendilerine umut etme izni vermişlerdi, sadece sertçe düzeltilmek için.\n\nElbette bir çözüm vardı, o an hiçbirinin dile getirmeye cesaret edemediği bir çözüm. Ancak akşam olduğunda, düşünceleri hayal kırıklığından intikama dönüştüğünde böyle bir şey ifade edilebilirdi. [SCOPE.sCountry('hungary_scope').GetNameNoFormatting]'nın veto gücü vardı, ama [ROOT.GetCountry.GetNameNoFormatting]'nın ağır topları vardı. Acaba tekrar umut etmeye cesaret edebilirler miydi?"
austria_trialism.2.a: "Makul olan her şeyi yaptık."
austria_trialism.2.b: "Şartlarını dayatması için Orduyu seferber edin."

austria_trialism.3.t: "Üçlü Krallık"
austria_trialism.3.d_peace: "[SCOPE.sCountry('hungary_scope').GetName] devletinin [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]'ın manifestosunu onaylamasıyla birlikte, İmparatorluğun [GetCulture('croat').GetName] topraklarından eşit statüde bir [SCOPE.sCountry('croatia_scope').GetName] Krallığı oluşturuldu. İkili Monarşi, Üçlü Monarşiye dönüştü."
austria_trialism.3.d_war: "[SCOPE.sCountry('hungary_scope').GetName] devletinin askeri güçle dize getirilmesiyle birlikte, İmparatorluğun [GetCulture('croat').GetName] topraklarından eşit statüde bir [SCOPE.sCountry('croatia_scope').GetName] Krallığı oluşturuldu. İkili Monarşi, Üçlü Monarşiye dönüştü."
austria_trialism.3.f: "Yetkili, "Gazeteler manifestonun haberini aldığında," diye söze başladı, "[SCOPE.sCountry('croatia_scope').GetCapital.GetCityHubName] içinde iki geçit töreni düzenlendi. Birincisi İkili Monarşinin sonunu, ikincisi ise Üçlü Monarşinin başlangıcını kutlamak içindi. Sanırım bu olabilecek en net mesajdır."\n\n"Birincisinde orada olduğunuzu söylemiştiniz. Hiç kontrolden çıkacağından endişe ettiniz mi?"\n\n"İtiraf etmeliyim ki, bunu düşündüm. Böyle şeyler ne yazık ki çok yaygındır. Ancak parmaklarını Macarlara doğrulttular. Biz onların zalimi olmak yerine, kendimizi kahramanları yaptık.""
austria_trialism.3.a: "[SCOPE.sCountry('croatia_scope').GetNameNoFlag] krallığını tarihi [GetCulture('croat').GetName] topraklarıyla sınırlı tutun."
austria_trialism.3.b: "Ona [GetCulture('slovene').GetName] topraklarının bir kısmının yönetimini verin."
austria_trialism.3.c: "[SCOPE.sCountry('croatia_scope').GetNameNoFlag], tüm Güney Slavlar için bir krallık olacaktır."

