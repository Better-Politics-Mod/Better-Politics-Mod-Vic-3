austria_has_failed_je_danubian_federation_tt: "[SCOPE.sCountry('austria_scope').GetName], aşağıdakiler nedeniyle #v $je_danubian_federation$#! kaydında #b başarısız#! oldu: #indent_newline:3 "

has_been_integrated_by_austria_tt: "Federasyon'a tatmin edici bir şekilde [Concept('concept_integrated_culture','$concept_integrated_culture_short$')] (Entegre) edildik"

austria_federation.13.t: "Federal Bir İmparatorluk"
austria_federation.13.d: "[SCOPE.sCountry('austria_scope').GetName] hükümeti, İmparatorluğu federal bir devlet olarak yeniden örgütleme önerisini resmen destekledi. Eğer başarıyla yasalaşırsa, bu durum [ROOT.GetCountry.GetNameNoFlag] devletinin mevcut özerkliğinin sona ermesi ve tarihi topraklarımızın olası kaybı anlamına gelecektir."
austria_federation.13.f: ""O halde bu bakış açısına göre bu bir "çöküş" meselesi değil, [SCOPE.sCountry('austria_scope').GetNameNoFormatting] devletinin yeniden örgütlenmesi ve yeniden doğuşu meselesidir. Keşke bu imparatorluğa yürekten önem veren herkes, karanlık özlemlerinde bile ileriye giden doğru yolun tamamen farkına varabilseydi. Öncelikle, sadece bağımsız ulusal devletlerin var olma hakkına sahip olduğu doğru değildir. Haklı olarak çokça zikredilen $SWI$ örneği, karma uluslu bir yönetim tipidir ve hiç kimse makul bir şekilde onun var olma hakkını inkar etmek istemez. Aslında bizim imparatorluğumuzda tarihi süreç, sadece yeni uyanan ihtiyaçlarına karşılık gelen modern bir ulus-devlet ilişkileri formu için mücadele etmektedir."\n\n— Aurel Popovici, #italic Büyük Avusturya Birleşik Devletleri#!" # Intentional that this is the same as austria_federation.1 but with a changed scope.
austria_federation.13.a: "Federasyon içinde [ROOT.GetCountry.GetNameNoFlag] için bir yer var."
austria_federation.13.b: "Eğer egemenliğimizi savunmak zorundaysak, öyle olsun."

austria_federation.14.t: "Batan Gemiden Kaçış"
austria_federation.14.d: "[SCOPE.sCountry('austria_or_danubia_scope').GetName] devletinden bağımsızlığımızı kazanmamız, [SCOPE.sCountry('austria_or_danubia_scope').GetCapital.GetCityHubName] merkezinden gelecek müdahale riskini sonsuza dek ortadan kaldırdı. [SCOPE.sCountry('austria_or_danubia_scope').GetAdjectiveNoFlag] hükümeti projesine devam etse de etmese de, biz bunun bir parçası olmayacağız."
austria_federation.14.f: "[ROOT.GetCountry.GetCapital.GetCityHubName] değişmeye başlamıştı. Yeni bayraklar ve su oluklarındaki konfetilerden çok daha derindi bu — [SCOPE.sCharacter('name_a_scope').GetFirstNameNoFormatting] bunu kafe menülerinde, asılmış broşürlerde, sokakta duyduğu sohbetlerde görebiliyordu. Günlük yürüyüşünde, bir Bakanlık binasını boyayan, eski Schönbrunn sarısını yeni bir pas kırmızısı katmanının altına gömen bir işçi ekibine rastlamıştı.\n\n"Burası bir Habsburg şehriydi" der gibiydiler ve icabına bakmışlardı. Acaba mavi kapılar için de gelecekler miydi diye merak etti."
austria_federation.14.a: "Çok yaşa bağımsız [ROOT.GetCountry.GetName]!"
austria_federation.14.b: "Bağışlayıcılığımızı uzaktan sunabiliriz."

austria_federation.15.t: "[SCOPE.sCountry('relevant_subject').GetAdjective] Hükümeti İşbirliği Sözü Verdi"
austria_federation.15.d: "[SCOPE.sCountry('relevant_subject').GetName] hükümeti, İmparatorluğu federalleştirme planımızla tam bir işbirliği yapma sözü verdi. [SCOPE.sCulture('primary_culture_scope').GetName] nüfusumuzun büyük bir kısmı onların bu kararının arkasında duruyor."
austria_federation.15.f: ""Bakan az önce gülümsüyordu. Duydun mu?"\n\n[SCOPE.sCharacter('name_a_scope').GetFirstNameNoFormatting]'ın sesi, komşusunun kaşığının porselene vuruşundan zar zor daha yüksek çıkıyordu. Meslektaşlarından biri başını çevirdi, bu yoruma kaşını kaldırdı.\n\n"Neredeyse inanmayacağım," dedi. "Bunu nereden duydun?"\n\n"Kendim gördüm. Lobideydi, bir Albay ya da bir başkasıyla."\n\n"Eminim [SCOPE.sCulture('primary_culture_scope').GetCustom('getPluralDemonym')] halkıdır," dedi masanın sonundaki adam. "Dün gece [SCOPE.sCountry('relevant_subject').GetCapital.GetCityHubName]'den bir araba geldi ve içinde kimin olduğunu söylemediler. Heyecan verici bir şeyler dönüyor.""
austria_federation.15.a: "Dostluk ruhu Tuna'nın üzerinde çiçek açıyor."
austria_federation.15.b: "Onların girdilerine gerek yok."
inform_vienna_tt: "[ROOT.GetCountry.GetTopOverlord.GetName], bizim uygun tüm [concept_primary_cultures] kültürlerimizi [Concept('concept_integrated_culture','$concept_integrated_culture_present$')] (Entegre) etme fırsatına sahip olacaktır"

austria_federation.16.t: "[SCOPE.sCountry('relevant_subject').GetAdjective] Hükümeti Entegrasyonu Reddetti"
austria_federation.16.d: "[SCOPE.sCountry('relevant_subject').GetName] hükümeti, İmparatorluğu federalleştirme planımıza muhalefet etme sözü verdi. [SCOPE.sCulture('primary_culture_scope').GetName] nüfusumuzun büyük bir kısmının da onların arkasında durması muhtemel."
austria_federation.16.f: "Mektup her zamanki laflarla doluydu. Ulusal egemenlik, [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]'ın yetkisini aşması, [SCOPE.sCountry('relevant_subject').GetAdjectiveNoFormatting] topraklarının kadim hakları ve ayrıcalıkları. Bu gönderilen ilk mektup değildi ve muhtemelen sonuncu da olmayacaktı, ancak açık ara en can sıkıcısıydı. Hükümetin büyük planının gövdesine atılmış bir torpidoydu. Görevli memur mektubu Bakan'a gönderilmek üzere evrak tepsisine yerleştirdi.\n\nBakışları, odanın diğer tarafında kahvesini yudumlayan meslektaşına kaydı. "Başka bir planımız var mı?"\n\n"Bilemiyorum."\n\n"Bilmediğin için mi, yoksa bu askeri bir sır olduğu için mi?"\n\n"Bilemiyorum.""
austria_federation.16.a: "Onlar olmadan idare etmemiz gerekecek."
