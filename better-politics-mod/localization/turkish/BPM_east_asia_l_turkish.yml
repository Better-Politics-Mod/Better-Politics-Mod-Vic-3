#  bpm_not_emperor_restored:0 "İmparator (henüz) tahtına geri dönmedi."
#  bpm_fight_shogunate_civil_war:0 "Şogunluğa sadık olanlar isyan başlattı."

#  je_bpm_secure_shogunate:0 "Şogunluğu Sağlama Almak"
#  je_bpm_secure_shogunate_reason:0 "Tokugawa klanı, savaşan devletler döneminin ardından düzen ve izolasyon zamanını kurarak 17. yüzyıldan beri şogunlar olarak Japonya'yı yönetiyor. Ancak Japonya'daki tüm güç Şogun ve klanının avucunda değil; bölgesel Daimyo lordları ülkenin geniş bir bölümünü özel olarak kontrol ediyor, silahlı adamlar ve Samuray lejyonlarına komuta ediyorlar. Bu dikkatli politika dengesi, Avrupa müdahalesi ve Sakoku izolasyonuna son veren antlaşmaların dayatılmasıyla paramparça oldu.\n\nTokugawa şogunluğunu korumak ve restorasyoncuları geri püskürtmek için, Tokugawa klanı güvenilirliğini ve gücünü tamamen kaybetmeden önce iktidarı güvence altına alacak bazı dikkatli reformlar yapılmalıdır."

#  je_meiji_main:0 "[ROOT.GetCountry.GetRuler.GetFirstName] Restorasyonu"
#  je_meiji_main_reason:0 "#lore \"Burada ortaya konan Yol, atalarımız olan İmparatorlar tarafından miras bırakılan, soyundan gelenler ve tebaası tarafından aynı şekilde gözetilecek olan öğretidir, tüm çağlar boyunca kusursuz ve her yerde doğrudur. Tüm saygımızla bunu hepimizin aynı erdeme ulaşabilmesi için, siz tebaamız ile birlikte kalbimize yerleştirmek Bizim dileğimizdir.\"\n— Mutsuhito Meiji, 1868#!\n\nİmparator yeniden iktidara geldi ve modernleşme süreci başlıyor. İmparatorluk, eğer bir gün [concept_great_power] (Büyük Güç) olmak istiyorsa kurumlarını ve ekonomisini canlandırmalıdır."
#  je_meiji_main_goal:0 "3 Restorasyon [Concept('concept_journal_entry', '$concept_journal_entries$')] tamamla"

#  je_meiji_diplomacy:0 "Restorasyon: Sakoku'nun Sonu"
#  je_meiji_diplomacy_reason:0 "#lore \"Batı'daki sosyal gelişim içseldir, Japonya'nın sosyal gelişimi ise dışsaldır. Burada içsel, bir tomurcuğun dışarı doğru çiçek açması gibi doğal bir şekilde içeriden çıkmak anlamına gelir ve dışsal ise dış etkiler yüzünden belirli bir biçim almaya zorlanmak demektir...\"\n—Natsume Sōseki, 1911#!\n\nJaponya yüzyıllardır yabancı ticareti çok az olan izole bir ekonomi olmuştur. Ancak Kara Gemilerin gelişi ve İmparatorun tahta geri dönüşü ile o günler çok geride kaldı. Japonya'nın Asya ticaretinin sadece bir parçası değil, lideri olması için gereken yolu açmak adına ekonomide reformlar yapmaya devam etmeliyiz."
 
#  je_meiji_economy:0 "Restorasyon: Japonya'yı Sanayileştir"
#  je_meiji_economy_reason:0 "#lore \"Sanayi olmadan yaşam suçtur ve sanat olmadan sanayi gaddarlıktır.\"\n—John Ruskin, 1870#!\n\nJaponya'nın büyümesi ve batılı güçlerin önünde dimdik durabilmesi için tam ekonomik potansiyeline ulaşabilmesi gerekir. Ana adalar hammadde ve çalışkan insanlarla doludur; imparatorluk başarılı olacaksa bu hediyelerden faydalanmalıdır."
#  je_meiji_economy_goal:0 "Japonya'nın GSYİH'sini %50 artır"

#  je_meiji_army:0 "Restorasyon: Samurayları Emekli Et"
#  je_meiji_army_reason:0 "#lore \"Bedenim Ezo topraklarında çürüse bile, ruhum Doğunun Efendisi olarak sizi koruyacaktır\"\n-Hijikata Toshizō, 1869#!\n\nSamuraylar bizim kadim feodal-mirasçı savaşçı kastımızdır. Yüzyıllardır bizim için savaştılar ve ordularımızı yönettiler. Ancak yaşadığımız yüzyıllar süren görece barış döneminde, savaşın yollarını unuttular ve devlete bir yük haline geldiler.\nEk olarak, batılı güçlerle yaşanan arbedeler, sıradan piyadelerimizin teçhizat ve eğitimindeki yetersizliği gözler önüne serdi. Topraklarımızı güvence altına alacaksak modern bir piyade kolordusu kurmalıyız."

#  meiji.1.t:0 "[SCOPE.GetRootScope.GetCountry.GetCustom('jap_imperial_era_name')] Restorasyonu"
#  meiji.1.d:0 "[SCOPE.gsInterestGroup('shogunate_ig').GetName] iktidardan düştü ve [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] monarşinin siyasi üstünlüğünü yeniden sağladı. Bu çok önemli an, [ROOT.GetCountry.GetName] içindeki yüzyıllık Şogunluk yönetiminin sonunu işaret ediyor ve yeni bir modernleşme ve reform çağının habercisi. [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle], siyasi müttefiklerini dikkatlice seçmelidir."
#  meiji.1.f:0 "\"Japonya İmparatoru, tüm yabancı ülkelerin hükümdarlarına ve tebaalarına, şogun Tokugawa Yoshinobu'nun kendi isteği doğrultusunda yönetim gücünü iade etmesine izin verildiğini duyurur. Bundan böyle ülkenin tüm iç ve dış işlerinde en yüksek otoriteyi biz kullanacağız. Sonuç olarak, antlaşmaların yapıldığı Taikun unvanı yerine İmparator unvanı kullanılmalıdır. Dış işlerinin yürütülmesi için tarafımızdan yetkililer atanmaktadır. Antlaşma güçlerinin temsilcilerinin bu duyuruyu tanıması arzu edilmektedir.\""
#  meiji.1.a:0 "Endüstriyel güç bizi düzlüğe çıkaracaktır."
#  meiji.1.b:0 "Aydınlara yönelmeliyiz."

#  era_ninko:0 "Ninkō"
#  era_komei:0 "Kōmei"
#  era_meiji:0 "Meiji"
