l_turkish:

 bpm_lobby.1.t:0 "Aşırı Milliyetçi Gasp"
 bpm_lobby.1.d:0 "[SCOPE.gsInterestGroup('relevant_ig_scope').GetName], ateşli ve aşırı militarist söylemlerini kullanarak kendi güç tabanlarını genişletmek için [SCOPE.sCountry('relevant_country_scope').GetName] ülkesine karşı var olan düşmanlığı kullanıyor ve [SCOPE.sCountry('relevant_country_scope').GetNameNoFormatting] ülkesine karşı askeri harekat için baskı yapmak üzere bir an önce [SCOPE.sPoliticalLobby('relevant_lobby_scope').GetName] lobisine katılmayı amaçlıyorlar."
 bpm_lobby.1.f:0 "Mitingleri tüm sokakları doldurdu. Sıradan insanın çektiği sıkıntıları görüyorlar, ya da öyle iddia ediyorlar. Ve bu sıkıntının kaynağını biliyorlar - ya da öyle iddia ediyorlar. Çareleri ise şiddeti bakımından şaşırtıcı derecede basit: Savaş."
 bpm_lobby.1.a:0 "Onların bu azmi çıkarlarımıza hizmet edecek"
 bpm_lobby.1.a2:0 "[SCOPE.sCountry('relevant_country_scope').GetNameNoFormatting] ortadan kaldırılmalıdır!"
 bpm_lobby.1.b:0 "Sözleri o kadar da ilham verici değil"
 bpm_ultramilitarist_hijacking: "Aşırı Militarist Gasp"

 bpm_lobby.2.t:0 "Kızıl Kreşendo"
 bpm_lobby.2.d:0 "[SCOPE.sPoliticalLobby('relevant_lobby_scope').GetName], [SCOPE.sCountry('relevant_country_scope').GetNameNoFormatting] ile savaş talep etmek için mevcut hükümetimizdeki siyasi bağlantılarını sömürüyor."
 bpm_lobby.2.f:0 "Ülkenin faşist çevrelerine nüfuz eden militarizmin uyumsuz kakofonisi kızıl kreşendosuna (zirvesine) ulaşıyor. Talepleri basit: [SCOPE.sCountry('relevant_country_scope').GetNameNoFormatting] ile savaşa girmeliyiz ve bunu bir an önce yapmalıyız. En azından bu fanatikler, ulusumuzun güvenliği uğruna böyle iddia ediyorlar."
 bpm_lobby.2.a:0 "Elbette! [SCOPE.sCountry('relevant_country_scope').GetNameNoFormatting] yanmalı!"
 bpm_lobby.2.b:0 "Bu bir delilik!"

 bpm_lobby.3.t:0 "Şovenist Bir Ruh Hali"
 bpm_lobby.3.d:0 "Şahin politikalarımız nedeniyle, [SCOPE.gsInterestGroup('relevant_ig_scope').GetName] [SCOPE.sCountry('relevant_country_scope').GetName] hakkındaki olumsuz görüşlerini daha yüksek sesle dile getirmeye başladı ve onlara karşı daha doğrudan bir eylemin gerekliliği konusunda bizi uyarıyor."
 bpm_lobby.3.f:0 "Bu basit bir ulusal güvenlik meselesi. Biz ilk saldırmazsak, onlar saldıracak."
 bpm_lobby.3.a:0 "İlginç bir gelişme."

 bpm_lobby.4.t:0 "Diplomatik Bir Ruh Hali"
 bpm_lobby.4.d:0 "Güvercin (barışçıl) politikalarımız nedeniyle, [SCOPE.gsInterestGroup('relevant_ig_scope').GetName] [SCOPE.sCountry('relevant_country_scope').GetName] hakkındaki olumlu görüşlerini daha yüksek sesle dile getirmeye başladı ve onlarla daha güçlü diplomatik bağlar kurulmasının açık sözlü bir savunucusu haline geldi."
 bpm_lobby.4.f:0 "Bu basit bir ulusal refah meselesi. İyi müttefikler bizi daha güvende ve daha zengin yapar; basit bir hesap."
 bpm_lobby.4.a:0 "İlginç bir gelişme."