 je_bpm_first_international:0 "全世界无产者，联合起来！"
 je_bpm_first_international_status:0 "静候第一国际。"
 je_bpm_first_international_reason:0 "#v 工业革命#!创造了一种新型的人——无产者，他被剥夺了一切，只余自己的劳动力，被从村庄古老的温暖中撕裂，被迫在坚硬的工厂地板上零敲碎打地出卖自己。在那里，他接触到千百万与他一样的人，他们已开始低声诉说着某种伟大的事物。在那里，他或许很快就能找到一个超越过去一切封闭慰藉的光明未来。在那里，他将找到#pink 社会主义#!。\n\n这是一个[Concept('concept_bpm_global_je', '全球日志条目')]。每当一个[Concept('concept_great_power', '列强')]研究#bold 社会主义#!、#bold 无政府主义#!，或在较小程度上研究#bold 劳工运动#!时，它便获得进度。若一个[Concept('concept_great_power', '列强')]遭受民族分裂运动，本日志条目将获得更多进度。此外，每个存在于[Concept('concept_great_power', '列强')]中的[Concept('concept_bpm_socialist_agitator', '社会主义煽动者')]都将使本日志条目每年获得缓慢的进度。\n\n完成时，@ig_socialists! #bold 社会主义者#!与@ig_anarchists! #bold 无政府主义者#!将经历一场不可调和的分裂，同时使这两种意识形态都更加迎合大众。\n\n#lore “直到现在，还从未有过真正的人民政治，而我们所说的‘人民’，指的是卑微的阶级，‘乌合之众’，那些以劳动供养世界的最贫穷的工人。存在的只有特权阶级的政治，他们利用人民的体力，在永无止境的争霸斗争中彼此推翻、取而代之。人民徒劳地在这些政治变革之间辗转支持，希望在至少某一次变革中……他们百年来的贫困与奴役能有所减轻。即便是伟大的法国革命也未能从根本上改变他们的处境。它消灭了贵族，却只是以资产阶级取而代之。人民不再被称为农奴。他们被宣布为自由人，依法享有自由民的一切权利；但事实上，他们依然是贫困的农奴。”\n\n——米哈伊尔·巴枯宁，1869#!"
 bpm_first_intl_happened:0 "#pink 第一国际#!已经建立。"
 je_bpm_second_international:0 "二次结社"
 je_bpm_second_international_status:0 "静候第二国际。"
 je_bpm_second_international_reason:0 "第一国际（在其解散后得此名）的失败，使得全球范围内各社会主义运动之间的合作更加困难。然而，自其解散以来，形势已发生很大变化。社会主义运动中涌入了更加多样的思想，而不同的群体也时常提出再度携手合作的建议。\n\n这是一个[Concept('concept_bpm_global_je', '全球日志条目')]。在当前条件下，本日志的进度将每月变动#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_second_international_tooltip [GetGlobalVariable('bpm_je_second_intl_progress_rate').GetValue|+=]#!。完成时，@ig_revolutionist_socialists! #bold 革命社会主义者#!与@ig_reformist_socialists! #bold 改良社会主义者#!将经历一场不可调和的分裂，同时使所有现存的[Concept('concept_bpm_ig_is_socialist', '社会主义')][Concept('concept_interest_group', '利益集团')]获得更多的追随者。\n\n#lore “想一想：我们整个运动的社会主义性质究竟体现在哪里呢？真正实际的斗争分为三类：工会斗争、争取社会改良的斗争，以及使资本主义国家民主化的斗争。我们这三种斗争形式真的是社会主义吗？根本不是。先看工会运动！看看英国：它在那里不仅不是社会主义的，而且在某些方面还是社会主义的障碍。讲坛社会主义者、国家社会主义者以及诸如此类的人同样强调社会改良。而民主化则专门属于资产阶级。资产阶级在我们之前就早已把民主写在了他们的旗帜上。”\n\n——罗莎·卢森堡，1898#!"
 je_bpm_second_international_tooltip:0 "该进度由以下因素决定：\n#variable [GetGlobalVariable('bpm_je_second_intl_progress_from_base').GetValue|+=]#! 基础值\n#variable [GetGlobalVariable('bpm_je_second_intl_progress_from_powerful_igs').GetValue|+=]#! 来自每个[Concept('concept_great_power', '列强')]中强大的[Concept('concept_bpm_ig_is_socialist', '社会主义')][Concept('concept_interest_group', '利益集团')]\n#variable [GetGlobalVariable('bpm_je_second_intl_progress_from_influential_igs').GetValue|+=]#! 来自每个[Concept('concept_great_power', '列强')]中有影响力的[Concept('concept_bpm_ig_is_socialist', '社会主义')][Concept('concept_interest_group', '利益集团')]\n#variable [GetGlobalVariable('bpm_je_second_intl_progress_from_agitators').GetValue|+=]#! 来自每个[Concept('concept_great_power', '列强')]中活跃的[Concept('concept_bpm_socialist_agitator', '社会主义煽动者')]\n#variable [GetGlobalVariable('bpm_je_second_intl_progress_from_socialist_movements').GetValue|+=]#! 来自每个[Concept('concept_great_power', '列强')]中活跃的[Concept('concept_political_movement', '社会主义运动')]"
 je_bpm_agrarian_socialism:0 "农业社会主义"
 je_bpm_agrarian_socialism_status:0 "监测农业社会主义思想的发展"
 je_bpm_agrarian_socialism_status_1:0 "社会主义者与农民隔绝。"
 je_bpm_agrarian_socialism_status_2:0 "社会主义者开始关注农民阶级。"
 je_bpm_agrarian_socialism_status_3:0 "社会主义者已适应了农村劳动者！"
 je_bpm_agrarian_socialism_reason:0 "#v 进度速率：#! #tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_agrarian_socialism_rate_tooltip [Country.MakeScope.ScriptValue('bpm_je_agrarian_socialism_rate')|+]#!/月。\n\n一些社会主义思想家认为，无产阶级是唯一具有革命潜力的阶级。对于那些更倾向于农村人口的人来说，这种信念显得目光短浅：毕竟，在[Country.GetName]，农民难道不是和城市工人一样深受压迫吗？至少，他们庞大的数量迫使社会主义者将他们纳入革命策略。\n\n本日志条目分为#v 三个部分#!，由日志进度和一项[concept_technology]来解锁。每个部分添加一项新效果：\n (1) #v 0%#!：无要求。\n    @ig_socialists!@ig_anarchists! #yellow 社会主义者#!与[GetInterestGroupVariant('ig_agrarian_populists', GetPlayer).GetName]在@peasants!/@farmers!中赢得支持。\n (2) #v 33%#!：需要#gold 大众政党#!。\n    [GetInterestGroupVariant('ig_agrarian_populists', GetPlayer).GetName]获得一位#green 农业社会主义#!领袖。\n (3) #v 66%#!：需要#gold 政治鼓动#!。\n    [GetInterestGroupVariant('ig_agrarian_populists', GetPlayer).GetName]永久成为#green 农业社会主义者#!。\n\n @information! 如果你达到日志进度阈值却尚未研究所需科技，你将自动获得该科技的研究进度。\n\n若该国的[concept_rank]至少达到[Concept('concept_unrecognized_power','$concept_unrecognized_regional_power$')]，它还将加速所有国家的#yellow 农业社会主义#!日志进度。\n\n#lore “沙皇处于永久的优柔寡断之中，已丧失一切真正思考的能力：他想要解放，却竭尽全力阻挠之。他已认识到，农民的解放无异于土地的解放；而土地的解放又将引发一场社会革命，并使农村公社变得神圣不可侵犯……对俄国而言，这是何等的福分——农村公社从未被拆散，私有制从未取代公社的财产。”\n\n——亚历山大·赫尔岑，1851#!"
 je_bpm_agrarian_socialism_rate_tooltip:0 "[Country.MakeScope.GetScriptValueDesc('bpm_je_agrarian_socialism_rate')]"
 bpm_peasant_population_gt_30:0 "我们人口中至少有#v 30%#!是@peasants! #v 农民#!"
 bpm_peasant_population_lt_30:0 "我们人口中不足#v 30%#!是@peasants! #v 农民#!"
 je_bpm_syndicalism:0 "工团主义"
 je_bpm_syndicalism_status:0 "监测工团主义思想的发展"
 je_bpm_syndicalism_status_1:0 "工团主义思想尚处萌芽。"
 je_bpm_syndicalism_status_2:0 "工团主义思想正在积聚声势。"
 je_bpm_syndicalism_status_3:0 "工团主义思想在劳工运动中如日中天！"
 je_bpm_syndicalism_reason:0 "#v 进度速率：#! #tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_syndicalism_rate_tooltip [Country.MakeScope.ScriptValue('bpm_je_syndicalism_rate')|+]#!/月。\n\n工团主义思想源于工人对其当前处境之无能为力的挫败感。他们眼看着选举派社会主义者在议会中争吵不休，无政府主义者徒劳地投掷炸弹，工会头目们在一次次妥协面前低头。够了！产业工人人数众多、力量强大，他们已经发现了#PB 总罢工#!这一策略。工团主义将提供贯彻到底的动力。\n\n本日志条目分为#v 三个部分#!，由日志进度和一项[concept_technology]来解锁。每个部分添加一项新效果：\n (1) #v 0%#!：无要求。\n    [GetInterestGroupVariant('ig_trade_unions', GetPlayer).GetName]人气上升。\n (2) #v 33%#!：需要#gold 工会联合会#!。\n    [GetInterestGroupVariant('ig_trade_unions', GetPlayer).GetName]与[GetInterestGroupVariant('ig_anarchists', GetPlayer).GetName]获得#pink 工团主义#!领袖。\n (3) #v 66%#!：需要#gold 政治鼓动#!。\n    [GetInterestGroupVariant('ig_trade_unions', GetPlayer).GetName]与[GetInterestGroupVariant('ig_anarchists', GetPlayer).GetName]永久成为#pink 工团主义者#!。\n\n @information! 如果你达到日志进度阈值却尚未研究所需科技，你将自动获得该科技的研究进度。\n\n倘若日志条目达到顶峰，#pink 总罢工#!将变得极有可能发生！\n\n#lore “工团主义与旧工会方法之间的根本区别在于：旧工会无一例外地在工资制度和资本主义内部运作，并视后者为不可避免；而工团主义则驳斥并谴责现存的产业安排为不义与罪恶，且不让工人对这一制度抱有任何持久成果的幻想。”\n\n——爱玛·戈尔德曼，1913#!"
 je_bpm_syndicalism_rate_tooltip:0 "[Country.MakeScope.GetScriptValueDesc('bpm_je_syndicalism_rate')]"
 bpm_syndicalism_legitimized_global:0 "#bold 工团主义意识形态#!将在全世界获得合法地位！"
 bpm_syndicalism.1.t:0 "工团主义革命！"
 bpm_syndicalism.1.d:0 "成功了！凭借工会的力量，凭借总罢工的威胁，以及一场席卷全国的革命，工团主义者在[Country.GetName]取得了胜利。旧的统治机构已然瘫痪——这个新国家通过一幅由工人控制的工会组成的联邦图景来进行治理。更重要的是，革命发生在这一特定国家这一事实，已在全世界证明了工团主义是一种能够实现社会革命的强大而切实可行的意识形态。"
 bpm_syndicalism.1.f:0 "同业公会（抵抗、团结、联合）值得我们鼓励与同情，因为它们是未来社会建构的自然元素；正是它们能够轻易地转变为生产者协会；正是它们能够运转社会工具、组织生产。其许多成员起初往往并未意识到这些公会在未来所要扮演的角色；起初他们只想着抵抗资本的剥削或争取一些表面的改善；但很快，他们为争取那些微不足道的治标之策、有时甚至是徒劳的负面结果而付出的艰辛努力，很容易引导他们去寻求能够将他们从资本主义压迫中解放出来的彻底改革。于是他们研究社会问题，并在工人代表大会上获得代表席位。新团体有必要与旧团体步调一致，因为唯有通过被广泛理解的团结，通过全世界所有行业、所有国家工人的联合，我们才必能实现特权的废除和所有人的平等。\n\n——欧仁·瓦尔兰，1870"
 bpm_syndicalism.1.a:0 "团结永存！"
 bpm_syndicalism.2.t:0 "工团主义革命！"
 bpm_syndicalism.2.d:0 "成功了！凭借工会的力量，凭借总罢工的威胁，以及一场席卷全国的革命，工团主义者在[Country.GetName]取得了胜利。旧的统治机构已然瘫痪——这个新国家通过一幅由工人控制的工会组成的联邦图景来进行治理！"
 bpm_syndicalism.2.f:0 "同业公会（抵抗、团结、联合）值得我们鼓励与同情，因为它们是未来社会建构的自然元素；正是它们能够轻易地转变为生产者协会；正是它们能够运转社会工具、组织生产。其许多成员起初往往并未意识到这些公会在未来所要扮演的角色；起初他们只想着抵抗资本的剥削或争取一些表面的改善；但很快，他们为争取那些微不足道的治标之策、有时甚至是徒劳的负面结果而付出的艰辛努力，很容易引导他们去寻求能够将他们从资本主义压迫中解放出来的彻底改革。于是他们研究社会问题，并在工人代表大会上获得代表席位……新团体有必要与旧团体步调一致，因为唯有通过被广泛理解的团结，通过全世界所有行业、所有国家工人的联合，我们才必能实现特权的废除和所有人的平等。\n\n——欧仁·瓦尔兰，1870"
 bpm_syndicalism.2.a:0 "团结永存！"
 je_bpm_general_strike_trigger:0 "总罢工的威胁"
 je_bpm_general_strike_trigger_reason:0 "本日志条目将迅速逼近其#yellow 平衡点#!，即#v #tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_general_strike_power_tooltip [Country.MakeScope.ScriptValue('bpm_je_general_strike_power')|.1]#!#!。\n\n正是那些将互不相干的群众逼入整齐划一的工厂劳作的条件，将他们引向了一种革命性的新策略。虽然这里或那里的停工远非闻所未闻，但一场遍及全国的协调罢工——一场#PB 总罢工#!——如今已摆上了台面。毕竟，如果工人是无数流水线上可互换的齿轮，难道他们不也共享着共同的利益吗？如果一个齿轮停转，所有齿轮难道不会齐声停转吗？\n\n各种因素都可能导致本日志条目的#yellow 平衡点#!发生偏移——战争与激进主义会激励潜在的罢工者，而慷慨的工人权利则会让他们三思。\n\n倘若本条目达到其极限，一场#PB 总罢工#!便将开始。\n\n工人们的#blue 疲惫程度#!为#variable [Country.MakeScope.Var('bpm_je_general_strike_exhaustion').GetValue|.1]#!，以#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_general_strike_exhaustion_tooltip [Country.MakeScope.ScriptValue('bpm_je_general_strike_exhaustion_rate')|-.1]#!/月的速率恢复到#variable 0#!。\n\n#lore “让一个劳动者试图以罢工的方式讨回一点点被夺走的东西——这位劳动者便侵犯了神圣的财产权，政府便立即率领军队来对付这位劳动者，去援助地主、工厂主或商人……富人据以拥有土地的权利、征税的权利以及占有他人劳动产品的权利，与正义毫无共同之处，而这一切都建立在由军队所制造出来的暴力之上，别无其他。”\n\n——列夫·托尔斯泰，1900#!"
 je_bpm_general_strike_ongoing:0 "总罢工！"
 je_bpm_general_strike_ongoing_status:0 "解决总罢工！"
 je_bpm_general_strike_ongoing_reason:0 "@warning! #PB 总罢工#!以#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_general_strike_power_tooltip [Country.MakeScope.ScriptValue('bpm_je_general_strike_power')|-=]#!/周的速率推进。\n@information! 罢工者的#blue 疲惫程度#!（#variable [Country.MakeScope.Var('bpm_je_general_strike_exhaustion').GetValue|.1]#!）以#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_general_strike_exhaustion_tooltip [Country.MakeScope.ScriptValue('bpm_je_general_strike_exhaustion_rate')|+=]#!/周的速率变化。\n\n[Country.GetName]的工人们已经受够了。眼下，由该国主要劳工组织发起的总罢工正在进行，严重危及国家与社会的所有机能。\n\n只要该条目生效，我们将承受以下随日志进度缩放的惩罚：\n  #N - #!对所有工作场所的[concept_throughput]惩罚，随日志进度缩放，\n  #N - #!对工业建筑的更严苛[concept_throughput]惩罚，以及\n  #N - #!额外的每周[concept_war_exhaustion]\n\n加强我们的[GetInstitutionType('institution_police').GetName]，颁布更具镇压性的[GetLawGroup('lawgroup_policing').GetName]或[GetLawGroup('lawgroup_internal_security').GetName]法律，或作出某些让步，都可能有助于我们解决这一困境。\n\n#lore “我们，在为自由而斗争中，决意于本月四日正午，宣布京汉铁路沿线各工会实行同盟总罢工。出于实际考虑，总工会将在江岸办公。总罢工期间的一切行动，必须严格遵照总工会的命令执行。我们为自由而战，我们为人权而战，我们决不后退！”\n\n——京汉铁路总工会，1923#!"
