 je_pedro_brazil_reason:0 "#bold 进度条#!的状态将由各种#tooltippable;tooltip:[Country.GetTooltipTag],je_pedro_special_tooltip_advance 正面#!或#tooltippable;tooltip:[Country.GetTooltipTag],je_pedro_special_tooltip_deplete 负面#!条件所决定。#bold 进度条#!达到#bold 0#!将导致皇帝统治的终结，并宣告一个寡头制的#bold 共和国#!成立。\n\n皇帝[SCOPE.sCountry('brazil_scope').GetRuler.GetFullName]，是[SCOPE.sCountry('brazil_scope').GetName]帝国的第二任统治者，在其父退位后于幼年便被推上皇位。佩德罗二世志在维持民主统治、捍卫宪法所赋予的公民自由，并最终废除玷污巴西的奴隶制。\n\n@warning! 进度条上至少需要3点，且必须拥有首都里约热内卢州，才能在共和派政变发生时予以抵抗。"
 je_pedro_special_tooltip_deplete:0 "以下情况将#bold 削减#! #bold 进度条#!：\n• 佩德罗二世的男性继承人已去世\n• 佩德罗二世的健康每况愈下\n• 拒绝或未能通过共和派提案\n• 巴西已实行[GetLawType('law_slavery_banned').GetName]\n• [GetInterestGroupVariant('ig_armed_forces',GetPlayer).GetNameWithCountryVariant]或[GetInterestGroupVariant('ig_landowners',GetPlayer).GetNameWithCountryVariant]处于[concept_powerful]且不在[concept_in_government]中\n• 巴西未实行[GetLawType('law_tenant_farmers').GetName]或[GetLawType('law_serfdom').GetName]\n• #Bold 褴褛战争#! [concept_journal_entry]失败\n• #Bold 整合巴西民族#! [concept_journal_entry]失败\n• 巴西处于[concept_default]，或已宣布[concept_bankruptcy]\n• 任何[concept_revolution]进度已超过 #variable 80%#!"
 je_caudillo_reason:0 "#bold 进度条#!的状态将由各种#tooltippable;tooltip:[Country.GetTooltipTag],je_caudillo_special_tooltip_advance 正面#!或#tooltippable;tooltip:[Country.GetTooltipTag],je_caudillo_special_tooltip_deplete 负面#!条件所决定。#bold 进度条#!达到#bold 100#!，将巩固[SCOPE.sCountry('caudillo_country_scope').GetName]军事强人的权力。\n\n削减进度条，并将[concept_bpm_ig_is_anti_democratic] [Concept('concept_interest_group','$concept_interest_groups$')]排除在政府之外，将摧毁[GetInterestGroupVariant('ig_armed_forces',GetPlayer).GetNameWithCountryVariant]中的#bold 考迪罗主义#!，终结该国军事强人的威胁。\n\n$je_coup_loc$\n\n自我们从西班牙独立之后，被解散的殖民政府留下了一个权力真空，很快被富有魅力的军事领袖所填补。这些“caudillos”（考迪罗）已成为南美政治中举足轻重的角色。"
 je_caudillo_special_tooltip_advance:0 "当进度条涨满或清空时，此[concept_journal_entry]将结束。\n\n以下因素将各自以#bold 每月1点#!的速度#bold 推进#!进度条：\n• 任何[concept_bpm_ig_is_anti_democratic] [Concept('concept_interest_group','$concept_interest_groups$')]处于[concept_powerful]\n• 任何[Concept('concept_bpm_ig_is_anti_democratic', '$concept_bpm_ig_is_anti_democratic$')] [Concept('concept_interest_group','$concept_interest_groups$')]处于[concept_in_government]\n• 我们实行[GetLawType('law_autocracy').GetName]、[GetLawType('law_oligarchy').GetName]、[GetLawType('law_technocracy').GetName]、[GetLawType('law_party_single').GetName]或[GetLawType('law_military_junta').GetName]\n• 我们拥有一位[Concept('concept_popularity','loved')]的[concept_general]或[concept_admiral]\n• 我们的[concept_ruler]持有#bold 威权主义#!意识形态"
 je_caudillo_special_tooltip_deplete:0 "以下因素将各自以#bold 每月1点#!的速度#bold 削减#!进度条：\n• 每个[concept_bpm_ig_is_anti_democratic] [concept_interest_group]都处于[concept_in_opposition]\n• 我们实行[GetLawType('law_census_voting').GetName]或[GetLawType('law_universal_suffrage').GetName]\n• 我们拥有一位[Concept('concept_popularity','loved')]的[concept_politician]，且其所属的[concept_powerful]利益集团不赞成[GetLawType('law_autocracy').GetName]、[GetLawType('law_oligarchy').GetName]、[GetLawType('law_technocracy').GetName]、[GetLawType('law_party_single').GetName]和[GetLawType('law_military_junta').GetName]\n• 我们未实行[GetLawType('law_purchased_officers').GetName] [Concept('concept_enactment_of_laws', '$concept_enactment_of_laws_enacted$')]"
