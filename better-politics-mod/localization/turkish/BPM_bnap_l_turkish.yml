 bpm_bnap_patriots_events.2.d:0 "İngiliz Bakan Russell 92 kararı reddetti ve bunun yerine On Karar'ı önerdi."
 bpm_bnap_patriots_events.2.f:0 "Aşağı Kanada'nın mevcut durumunda, o eyaletin Yasama Konseyi'ni seçimle işbaşına gelen bir yapı haline getirmek tavsiye edilmez; ancak Yasama organının bu koluna daha fazla kamu güveni sağlamak için önlemler alınması uygundur..."
