 ig_conservative_catholics: "Muhafazakar Katolikler"
 ig_conservative_catholics_desc: "Muhafazakar Katolikler, İtalyan Partito Popolare Italiano içindeki ve partinin sağ kanadını temsil eden bir gruptu. Klerikalizm (din adamı egemenliği) ile karakterize edilen bu grup, kendi içinde otokratik ve organik akımlar arasında bölünmüştü. Sonunda partiden ayrıldılar ve Ulusal Faşist Parti'ye katıldılar."
 
