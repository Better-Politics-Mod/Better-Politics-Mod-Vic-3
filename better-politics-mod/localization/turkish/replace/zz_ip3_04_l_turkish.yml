slave_revolt.4.t: "Kendi Topraklarımızda"
slave_revolt.4.d: "[SCOPE.sState('fleeing_slaves_state').GetName] kolonimizden kaçan bir grup [GetPopType('slaves').GetName], bir ticaret gemisinde saklanarak [ROOT.GetCountry.GetAdjectiveNoFlag] anakarasına başarıyla ulaştı. Yasalarımıza göre, [ROOT.GetCountry.GetAdjectiveNoFormatting] toprağına ayak basan her köleleştirilmiş kişi özgür sayılır."
slave_revolt.4.f: "[SCOPE.sCharacter('name_a_scope').GetFirstNameNoFormatting] rıhtımın kenarına oturdu, ayaklarını suyun yüzeyinde sallandırdı. Gün batımı suyu kızıla boyamıştı. Bugünün haberleri düşünülünce çok uyumluydu. Bunu gazetede, duvarlara yapıştırılmış afişlerde, yoldan geçenlerin dudaklarında görmüştü.\n\n[SCOPE.sCharacter('name_a_scope').GetHerHim] arkasından bir ses duyuldu. Sesin kime ait olduğunu [SCOPE.sCharacter('name_a_scope').GetSheHe|U] anladı — [SCOPE.sCharacter('name_b_scope').GetFirstNameNoFormatting], adliyeden bir başka katip.\n\n"Ne düşünüyorsun?"\n\n"[SCOPE.sState('port_state').GetPortHubName] içinde zincirli insanlar fikrinden bile ürküyorlar. Ama o ufkun ötesindekileri bir an olsun düşünmüyorlar. Bir gün, [SCOPE.GetRootScope.GetCountry.GetCustom('GetDivinity')] hepimizi cezalandıracak.""
slave_revolt.4.a: "Özgür insanların tüm haklarına sahiptirler."
slave_revolt.4.b: "Özgür olsunlar ya da olmasınlar, [SCOPE.sState('fleeing_slaves_state').GetName] bölgesine geri dönmeliler."

