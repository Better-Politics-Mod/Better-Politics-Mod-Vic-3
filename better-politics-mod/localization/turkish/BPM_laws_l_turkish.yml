l_turkish:
# Modifiers
 bpm_decorative_upgradable_law:0 "Yasa Geliştirilebilir"
 bpm_decorative_upgradable_law_desc:0 "Bu yasanın kabul edilmesi, bazı özel durumlarda onu daha güçlü bir forma dönüştürerek daha iyi bir varyantla değiştirme olasılığını açar."

# Nationality
 law_multicultural:0 "Kozmopolitlik"
 law_multicultural_desc:0 "Kağıt üzerinde ülkede farklı milliyetler ve kültürler arasında yasal bir ayrımcılık yoktur. Pratikte ise, eskisinden daha az bir şevkle de olsa, birincil kültürlere hala ayrıcalıklı muamele edilmektedir."
 law_multicultural_upgraded:0 "Tam Kozmopolitlik"
 law_multicultural_upgraded_desc:0 "Ülkede farklı milliyetler ve kültürler arasında hiçbir yasal ayrımcılık yoktur. Farklı kültürlere eşit haklar verilir ve birincil kültürün ayrıcalıkları en aza indirilerek mümkün olduğunca gelişme fırsatı tanınır."
 EFFECTS_ON_ACCEPTANCE_law_multicultural_upgraded:0 "$EFFECTS_ON_ACCEPTANCE_law_multicultural$"

# Religion
 law_total_separation:0 "Sekülerizm"
 law_total_separation_desc:0 "Kağıt üzerinde din, sivil kurumlarda bir faktör değildir. Ancak bu politikanın pratik uygulaması, devlet dinine hala bir dereceye kadar ayrıcalıklı muamele sağlar."
 law_total_separation_upgraded:0 "Tam Sekülerizm"
 law_total_separation_upgraded_desc:0 "Dinin önemi azaltılmış ve sivil kurumlara müdahalesi mümkün olduğunca ortadan kaldırılmıştır. Toplum genelinde dine dayalı ayrımcılık uygulanmaz, ancak ateist değerler teşvik edilebilir."

# Womens Rights
 law_no_womens_rights:0 "Geleneksel Aile"
 law_no_womens_rights_desc:0 "Gelenek veya yasalar gereği, cinsiyetlerin kendi kültürlerinin geleneksel aile yapısına uygun bir işbölümü izlemesi beklenir."
 law_womens_suffrage:0 "Kadın Eşitliği"
 law_womens_suffrage_desc:0 "Kadınlara, kağıt üzerinde oy hakkı da dahil olmak üzere erkeklerle aynı yasal haklar verilmiştir. Elbette bu eşitliğin pratik uygulaması çok daha eşitsizdir."
 law_womens_suffrage_upgraded:0 "Tam Kadın Eşitliği"
 law_womens_suffrage_upgraded_desc:0 "Kadınlar ve erkekler, yasanın gerçek pratik uygulamasıyla tam olarak desteklenen oy hakkı da dahil olmak üzere tam bir yasal eşitliğe sahiptir."

# Econ
 law_artisanal_economy:0 "Zanaatkar Ekonomisi"
 law_artisanal_economy_desc:0 "Malların endüstriyel süreçler yerine vasıflı bireyler veya loncalar tarafından üretildiği, küçük ölçekli, zanaata dayalı üretime dayalı bir ekonomi."

# Distribution of Power
 law_military_junta:0 "Askeri Cunta"
 law_military_junta_desc:0 "Bu ülkenin ordusunun subayları, sivil bir hükümetin işlevlerinin yerini almıştır. Sivil hükümet ya askıya alınmış ya da tamamen ve kalıcı olarak dağıtılmıştır."
 law_colonial_admin:0 "Sömürge Yönetimi"
 law_colonial_admin_desc:0 "Ülke bir sömürge yönetimi tarafından yönetilir ve metropolün (ana vatanın) tüm konularda son söz hakkı vardır."
 country_bpm_change_primary_culture_to_overlord:0 "Birincil Kültürü Efendiyle eşleşecek şekilde değiştir"
 country_bpm_change_primary_culture_to_overlord_desc:0 "Bu ülkenin birincil kültürü, efendisinin (overlord) birincil kültürüyle eşleşecek şekilde değiştirilecektir."

# Police
 law_no_police:0 "Resmi Polis Yok"
 law_local_police:0 "Sadece Yerel Polis"
 law_dedicated_police:0 "Ulusal Polis"
 law_militarized_police:0 "Askerileştirilmiş Polis"
 law_elected_police:0 "Seçilmiş Polis"
 law_elected_police_desc:0 "Polis gücü yerel konseyler tarafından seçilir ve geri çağırma (görevden alma) seçimlerine tabidir."

# Party Laws
 lawgroup_party_laws:0 "Parti Yasaları"
 lawgroup_party_laws_desc:0 "Belirli siyasi partilerin yasallığını belirler."

 law_no_party_bans:0 "Aktif Yasak Yok"
 law_no_party_bans_desc:0 "Bu [concept_country] içinde herhangi bir [Concept('concept_party', 'Siyasi Partiye')] yönelik doğrudan bir yasak yoktur."
 law_party_anti_reactionary:0 "Sağcı Partiler Yasaklandı"
 law_party_anti_reactionary_desc:0 "Gelenekçi ve gerici [Concept('concept_party', 'Siyasi Partiler')] bastırılır."
 law_party_reactionary_only:0 "Sadece Sağcı Partiler"
 law_party_reactionary_only_desc:0 "Bu [concept_country] içindeki yasal [Concept('concept_party', 'partiler')] geleneksel değerlere bağlı kalmalıdır."
 law_party_anti_socialist:0 "Sosyalist Partiler Yasaklandı"
 law_party_anti_socialist_desc:0 "Tüm formlarındaki Sosyalist [Concept('concept_party', 'Siyasi Partiler')] bastırılır."
 law_party_socialist_only:0 "Sadece Sosyalist Partiler"
 law_party_socialist_only_desc:0 "Bu [concept_country] içindeki yasal [Concept('concept_party', 'partiler')] proletaryanın iradesini bir dereceye kadar temsil etmelidir."
 law_party_anti_liberal:0 "Liberal Partiler Yasaklandı"
 law_party_anti_liberal_desc:0 "Liberal ve Serbest Piyasa [Concept('concept_party', 'Siyasi Partileri')] yasaklanmıştır."
 law_party_liberal_only:0 "Sadece Ilımlı Partiler"
 law_party_liberal_only_desc:0 "Bu [concept_country] içindeki radikal derecede antidemokratik [Concept('concept_party', 'partiler')], liberal-demokratik değerleri korumak için yasaklanmıştır."
 law_party_single:0 "Tek Yasal Parti"
 law_party_single_desc:0 "Bu [concept_country] içinde sadece bir [Concept('concept_party', 'Siyasi Parti')] yasaldır."
 law_no_parties_allowed:0 "Tüm Partiler Yasaklandı"
 law_no_parties_allowed_desc:0 "Bu [concept_country] içinde hiçbir [Concept('concept_party', 'Siyasi Parti')] yasal değildir."

 bpm_decorative_ban_reactionaries:0 "[Concept('concept_bpm_bannable_reactionaries', 'Gerici Partileri')] [Concept('concept_bpm_party_ban', 'Yasakla')]"
 bpm_decorative_ban_reactionaries_desc:0 "Hangi partilerin [Concept('concept_bpm_party_ban', 'yasaklandığını')] belirler."
 bpm_decorative_ban_socialists:0 "[Concept('concept_bpm_bannable_socialists', 'Sosyalist Partileri')] [Concept('concept_bpm_party_ban', 'Yasakla')]"
 bpm_decorative_ban_socialists_desc:0 "Hangi partilerin [Concept('concept_bpm_party_ban', 'yasaklandığını')] belirler."
 bpm_decorative_ban_reactionaries_plus:0 "[Concept('concept_bpm_bannable_reactionaries_plus', 'Anti-Sosyalist Partileri')] [Concept('concept_bpm_party_ban', 'Yasakla')]"
 bpm_decorative_ban_reactionaries_plus_desc:0 "Hangi partilerin [Concept('concept_bpm_party_ban', 'yasaklandığını')] belirler."
 bpm_decorative_ban_socialists_plus:0 "[Concept('concept_bpm_bannable_socialists_plus', 'Gelenek Karşıtı Partileri')] [Concept('concept_bpm_party_ban', 'Yasakla')]"
 bpm_decorative_ban_socialists_plus_desc:0 "Hangi partilerin [Concept('concept_bpm_party_ban', 'yasaklandığını')] belirler."
 bpm_decorative_ban_liberals:0 "[Concept('concept_bpm_bannable_liberals', 'Liberal Partileri')] [Concept('concept_bpm_party_ban', 'Yasakla')]"
 bpm_decorative_ban_liberals_desc:0 "Hangi partilerin [Concept('concept_bpm_party_ban', 'yasaklandığını')] belirler."
 bpm_decorative_ban_antiliberals:0 "[Concept('concept_bpm_bannable_antiliberals', 'Anti-Liberal Partileri')] [Concept('concept_bpm_party_ban', 'Yasakla')]"
 bpm_decorative_ban_antiliberals_desc:0 "Hangi partilerin [Concept('concept_bpm_party_ban', 'yasaklandığını')] belirler."
 bpm_decorative_ban_everyone_but_ruler:0 "Hükümdar Partisi Olmayan Tüm [Concept('concept_party', 'Siyasi Partileri')] [Concept('concept_bpm_party_ban', 'Yasakla')]."
 bpm_decorative_ban_everyone_but_ruler_desc:0 "Hangi partilerin [Concept('concept_bpm_party_ban', 'yasaklandığını')] belirler."
 
 bpm_decorative_ban_everyone:0 "[Concept('concept_bpm_bannable_parties', 'Tüm Partileri')] [Concept('concept_bpm_party_ban', 'Yasakla')]"
 bpm_decorative_ban_everyone_desc:0 "Hangi partilerin [Concept('concept_bpm_party_ban', 'yasaklandığını')] belirler."

 bpm_disable_single_party_tooltip:0 "Bu eylem, Tek Parti yasasının etkilerini ortadan kaldıracaktır."
 bpm_enable_single_party_tooltip:0 "Bu eylem, mevcut iktidar partisi dışındaki tüm partileri yasadışı hale getirecektir. Bu parti dışındaki her Çıkar Grubu, [GetLawType('law_party_single').GetName] [Concept('concept_law', 'Yasasına')] karşı muhalefete geçecektir."

 bpm_enable_no_parties_tooltip:0 "Bu eylem, tüm partileri 'fraksiyonlara' dönüştürecektir. Her Kurumsal Çıkar Grubu kendi fraksiyonuna katılırken, İdeolojik Çıkar Grupları ya bir fraksiyona katılacak ya da [GetLawType('law_no_parties_allowed').GetName] [Concept('concept_law', 'Yasasına')] karşı muhalefete geçecektir."
# Foreign Policy
 lawgroup_foreign_policy:0 "Dış Politika"
 lawgroup_foreign_policy_desc:0 "Bu [Concept('concept_country', 'ülkenin')] yürütebileceği dış politikanın genel duruşu."

 law_premodern_diplomacy:0 "Modern Öncesi Diplomasi"
 law_premodern_diplomacy_desc:0 "Bu ülkenin diplomatik politikaları henüz modern çağı yansıtacak şekilde güncellenmemiştir."
 law_ultramilitarism:0 "Aşırı Militarizm"
 law_ultramilitarism_desc:0 "Diplomasiye yer bırakmayan aşırı milliyetçi, şovenist ve militan dış politika."
 law_jingoism:0 "Şovenizm"
 law_jingoism_desc:0 "Bazı durumlarda diplomasiyi masada bırakan saldırgan ve şahin bir dış politika."
 law_flexible_foreign_policy:0 "Esnek Dış Politika"
 law_flexible_foreign_policy_desc:0 "Bu ülkenin dış politikasına ilişkin hiçbir özel veya olağandışı hüküm getirilmemiş, tüm seçenekler masada bırakılmıştır."
 law_justum_bellum:0 "Haklı Savaş (Justum Bellum)"
 law_justum_bellum_desc:0 "Savaşların haklı olmasını talep eden ve açık saldırganlık savaşlarını sınırlayan ılımlı şahin bir politika."
 law_dove_politics:0 "Barışçıl Siyaset"
 law_dove_politics_desc:0 "Diğer ülkelerle barışçıl etkileşimlere odaklanan saldırgan olmayan dış politikalar bütünü."
 law_armed_neutrality:0 "Silahlı Tarafsızlık"
 law_armed_neutrality_desc:0 "Dış işlerine, özellikle de yurtdışındaki savaşlara müdahale etmeyen izolasyonist bir yaklaşıma odaklanan; yabancı işgaline karşı ulusal güvenliğin makul derecede güçlü bir ordu ile sağlandığı bir dış politika."
 law_disarmed_nation:0 "Silahsızlanmış Ulus"
 law_disarmed_nation_desc:0 "Bu ülkenin katılabileceği dış müdahale boyutunu sınırlayan ve askeri harcamaları diğer alanlara tahsis eden tamamen pasifist bir politikalar bütünü."

 country_bpm_aggressive_diplomacy_disabled:0 "Saldırgan [Concept('concept_diplomatic_play', 'Diplomatik Oyunlar')] Kullanamaz"
 country_bpm_aggressive_diplomacy_disabled_desc:0 "Çoğu savaş hedefini kullanarak bir [Concept('concept_diplomatic_play', 'Diplomatik Oyun')] başlatamaz."
 bpm_aggressive_diplomacy_permitted_tt:0 "Saldırgan [Concept('concept_diplomatic_play', 'Diplomatik Oyunlar')] Kullanmasına İzin Verilir"
 country_bpm_ban_slavery_dp_enabled:0 "Köleliği Yasakla [Concept('concept_diplomatic_play', 'Diplomatik Oyununu')] Kullanabilir"
 country_bpm_ban_slavery_dp_enabled_desc:0 "Köleliği Yasakla hedefini kullanarak bir [Concept('concept_diplomatic_play', 'Diplomatik Oyun')] başlatabilir."
 bpm_exception_ban_slavery_permitted_tt:0 "Diğer kısıtlamalara rağmen Köleliği Yasakla [Concept('concept_diplomatic_play', 'Diplomatik Oyununu')] Kullanabilir"
 country_bpm_regime_change_dp_enabled:0 "Rejim Değişikliği [Concept('concept_diplomatic_play', 'Diplomatik Oyununu')] Kullanabilir"
 country_bpm_regime_change_dp_enabled_desc:0 "Rejim Değişikliği hedefini kullanarak bir [Concept('concept_diplomatic_play', 'Diplomatik Oyun')] başlatabilir."
 bpm_exception_regime_change_permitted_tt:0 "Diğer kısıtlamalara rağmen Rejim Değişikliği [Concept('concept_diplomatic_play', 'Diplomatik Oyununu')] Kullanabilir"
 country_bpm_return_state_dp_enabled:0 "Eyaleti İade Et [Concept('concept_diplomatic_play', 'Diplomatik Oyununu')] Kullanabilir"
 country_bpm_return_state_dp_enabled_desc:0 "Eyaleti İade Et hedefini kullanarak bir [Concept('concept_diplomatic_play', 'Diplomatik Oyun')] başlatabilir."
 bpm_exception_return_state_permitted_tt:0 "Diğer kısıtlamalara rağmen Eyaleti İade Et [Concept('concept_diplomatic_play', 'Diplomatik Oyununu')] Kullanabilir"
 country_bpm_contain_threat_dp_enabled:0 "Haddini Bildir [Concept('concept_diplomatic_play', 'Diplomatik Oyununu')] Kullanabilir"
 country_bpm_contain_threat_dp_enabled_desc:0 "Haddini Bildir hedefini kullanarak bir [Concept('concept_diplomatic_play', 'Diplomatik Oyun')] başlatabilir."
 bpm_exception_contain_threat_permitted_tt:0 "Diğer kısıtlamalara rağmen Haddini Bildir [Concept('concept_diplomatic_play', 'Diplomatik Oyununu')] Kullanabilir"
 country_bpm_jingoist_lobby_force_demands_enabled:0 "Şovenist Lobi Talepleri Zaman Aşımında Yürürlüğe Girer"
 country_bpm_jingoist_lobby_force_demands_enabled_desc:0 "Eğer bir [Concept('concept_political_lobby', 'Lobi')] başka bir ülkeyle savaş talep ederse, bu talebin süresi dolduğunda olağan lobi talebi davranışı yerine otomatik olarak bir [Concept('concept_diplomatic_play', 'Diplomatik Oyun')] başlayacaktır."
 country_bpm_forpol_minister_appointment_switches_law:0 "[GetInstitutionType('institution_diplomacy').GetName] [Concept('concept_bpm_minister', 'Bakanının')] Atanması Bu Yasayı Anında Değiştirir"
 country_bpm_forpol_minister_appointment_switches_law_desc:0 "[GetInstitutionType('institution_diplomacy').GetName] kurumuna her yeni [Concept('concept_bpm_minister', 'Bakan')] atandığında, Bakanın veya parçası olduğu [concept_interest_group] (Çıkar Grubunun) ideolojisine göre şunlardan uygun olan bir yasa yürürlüğe girer: [GetLawType('law_dove_politics').GetName], [GetLawType('law_flexible_foreign_policy').GetName], [GetLawType('law_jingoism').GetName] veya [GetLawType('law_ultramilitarism').GetName]."
 country_bpm_minimum_pro_country_lobby_amount:0 "Garantili Minimum Ülke Yanlısı [Concept('concept_political_lobby', 'Siyasi Lobiler')]"
 country_bpm_minimum_pro_country_lobby_amount_desc:0 "Ülkenizde bulunması garanti edilen, bu değerin altındaysa mümkün olan en kısa sürede oluşturulacak Ülke Yanlısı [Concept('concept_political_lobby', 'Siyasi Lobilerin')] miktarı. Bu durum bize karşı en yüksek görüşe sahip olan ülkelere öncelik verecektir."
 country_bpm_minimum_anti_country_lobby_amount:0 "Garantili Minimum Ülke Karşıtı [Concept('concept_political_lobby', 'Siyasi Lobiler')]"
 country_bpm_minimum_anti_country_lobby_amount_desc:0 "Ülkenizde bulunması garanti edilen, bu değerin altındaysa mümkün olan en kısa sürede oluşturulacak Ülke Karşıtı [Concept('concept_political_lobby', 'Siyasi Lobilerin')] miktarı. Bu durum bize karşı en düşük görüşe sahip olan ülkelere öncelik verecektir."

 # Deprecated fp mods?
 bpm_decorative_can_not_invade:0 "İlhaklar İçin İç Tepki Alır"
 bpm_decorative_can_not_invade_desc:0 "Şu savaş hedeflerini kullanarak bir [Concept('concept_diplomatic_play', 'Diplomatik Oyuna')] katılmak bu ülke için içeride ağır cezalara yol açacaktır: Eyaleti İlhak Et, Antlaşma Limanını Al, Tebaayı İlhak Et."
 bpm_decorative_can_not_invade_no_annex:0 "Saldırganlık Savaşları İçin İç Tepki Alır"
 bpm_decorative_can_not_invade_no_annex_desc:0 "Bir [Concept('concept_diplomatic_play', 'Diplomatik Oyunda')] saldırgan, birincil olmayan bağımsız savunucu olarak veya yeni tebaalar ya da sahipsiz topraklar verecek herhangi bir savaş hedefiyle yer almak, bu ülke için içeride ağır cezalara yol açacaktır."
 bpm_decorative_can_not_join_alliances:0 "İttifaklara ve Savunma Paktlarına Katılamaz"
 bpm_decorative_can_not_join_alliances_desc:0 "İttifaklara ve Savunma Paktlarına katılma yeteneği bu ülkeden kaldırılır."
 bpm_decorative_can_not_stay_peaceful:0 "Barışta Kalamaz"
 bpm_decorative_can_not_stay_peaceful_desc:0 "2 yıldan daha uzun süre barışta kalmak, bu ülke için içeride ağır cezalara yol açacaktır."

# Work Time Regulations
 lawgroup_work_time_regulations:0 "Çalışma Süresi Düzenlemeleri"
 lawgroup_work_time_regulations_desc:0 "İşçilerin dinlenmeleri için yasal olarak sağlanması gereken günde kaç saat, haftada kaç gün çalışacakları ve genel tatiller."

 law_unregulated_work_time:0 "Düzenlenmemiş Çalışma Süresi"
 law_unregulated_work_time_desc:0 "Hükümet, işçilerin işte geçirmesi gereken zamanı düzenlemek için hiçbir girişimde bulunmaz."
 law_token_time_regulations:0 "Göstermelik Süre Düzenlemeleri"
 law_token_time_regulations_desc:0 "İşçilere çalışma saatleri, bir günlük hafta sonları ve bazı geleneksel tatillerde izinler konusunda mütevazı düzenlemeler verilir."
 law_limited_work_hours:0 "Sınırlı Çalışma Saatleri"
 law_limited_work_hours_desc:0 "İşçiler hafta sonları ve tatillere ek olarak, fazla mesai ücretiyle birlikte 8 saatlik bir iş gününün tadını çıkarırlar."
 law_protected_leisure:0 "Dinlenme Hakkı"
 law_protected_leisure_desc:0 "Çeşitli yasal tatillere ek olarak kişisel izinler ve hastalık izinleriyle sağlanan, işçilerin işten cömert bir şekilde uzak kalma hakkı vardır. İş günleri garantili öğle yemeği molalarıyla birlikte 8 saat veya daha azıyla sınırlıdır."

 bpm_decorative_modify_throughput_per_workplace_safety_investment:0 "[GetInstitutionType('institution_workplace_safety').GetName] [Concept('concept_institution', 'Kurum')] Seviyesi başına [concept_building] [concept_throughput]"
