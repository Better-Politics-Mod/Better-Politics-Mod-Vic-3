name: PR Validation Trigger

on:
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  noop:
    runs-on: ubuntu-latest
    steps:
      - run: echo "PR #${{ github.event.pull_request.number }} (${{ github.event.pull_request.head.sha }}) queued for validation"
