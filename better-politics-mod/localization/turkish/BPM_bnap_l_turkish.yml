 bpm_bnap_durham_report_implement_report_tt:0 "@information! Durham Raporu'nun tavsiyelerini uygulamak zorunda kalacağız."
 bpm_bnap_patriots_events.3.t: "Durham Raporu"
 bpm_bnap_patriots_events.3.d: "Vatanseverler İsyanı'ndan sonra Lord Durham İngiliz sömürgelerindeki duruma ilişkin raporunu yayınladı."
 bpm_bnap_patriots_events.3.f: "Bir hükümet ile bir halk arasında bir tezat bulmayı bekliyordum: tek bir devletin bağrında savaşan iki ulus buldum: ilkelerin değil, ırkların mücadelesini buldum; ve Aşağı Kanada sakinlerini şu anda Fransız ve İngiliz olarak düşman gruplara ayıran ölümcül husumeti sona erdirmeyi başaramadığımız sürece yasaları veya kurumları iyileştirmeye çalışmanın boşuna olacağını fark ettim."

 bpm_bnap_patriots_events.3.a: "Raporun tavsiyelerini uygulamalıyız."
 bpm_bnap_patriots_events.3.b: "Böylesine radikal fikirler tehlikelidir."

 je_bpm_bnap_durham_report:0 "Durham Raporu"
 je_bpm_bnap_durham_report_desc:0 "Durham Raporu'nu hızla uygulamalıyız."
 je_bpm_bnap_durham_report_reason:0 "Durham Raporu, Vatanseverler İsyanı'nın temel nedenlerini belirlemiş ve böyle bir felaketin bir daha yaşanmasını önlemek için bir dizi reform önermiştir. Fransız Kanadalıların bize karşı bir kez daha ayaklanmamasını sağlamak için bu reformları bir an önce uygulamalıyız.\n\n#lore \"Fransızlar, İngilizlerin kibrinden ve adaletsizliğinden şikayet ediyordu; İngilizler ise Fransızları zayıf ve fethedilmiş bir halkın kusurlarıyla suçluyor, onları aşağılık ve hainlikle itham ediyordu. İki ırkın böylece birbirlerinin niyetleri hakkında tasavvur etmeyi öğrendiği bu mutlak güvensizlik, onları en masum davranışlara en kötü anlamı yüklemeye; her sözü, her eylemi ve her niyeti haksız yere yargılamaya; en iğrenç tasarıları atfetmeye ve gizli ihanet ile kötülük tasarılarını örtbas ettiği gerekçesiyle her türlü nezaket veya adalet teklifini reddetmeye sevk etmektedir.\"\n\n—Lord Durham, 1839#!"
 je_bpm_bnap_durham_report_complete:0 "Birlik Yasası kabul edildi."

 bpm_bnap_patriots_events.4.t: "Bytown'dan Bir Çağrı"
 bpm_bnap_patriots_events.4.d: "Kanada Eyaleti giderek Amerika Birleşik Devletleri'ne daha fazla ilgi duymaya başladı ve Londra'daki egemenlerine duydukları hoşnutsuzlukla birlikte, bir delegeler kongresi Devletler Birliğimize katılmak için bir talep dilekçesi gönderdi."
 bpm_bnap_patriots_events.4.f: "\"Kanada aslında orada her zaman görülenin gerçek bir modelidir. Her iki yerde de hükümet, halk kadar çok başa sahiptir; ağır basar, hareket eder, düzenler, kontrol eder, her şeyi üstlenir, her şeyi sağlar, tebaanın işleri hakkında kendisinden çok daha fazlasını bilir; kısacası, durmaksızın aktif ve kısırdır.\"\n—Alexis de Tocqueville, 1856"
 bpm_bnap_patriots_events.4.a: "Özgürlük için yapılan bu çağrıyı görmezden gelemeyiz, konuyu derhal kongreye taşıyın!"
 bpm_bnap_patriots_events.4.b: "Görmezden gelin. İngilizlerle daha geniş çaplı bir çatışma riskine giremeyiz."

 je_bpm_bnap_confederation_quest: "Konfederasyon Arayışı"
 je_bpm_bnap_confederation_quest_desc: "Kanada eyaletleri, bir Kanada Konfederasyonu olasılığını tartışıyor."
 je_bpm_bnap_confederation_quest_reason: "Diğer Eyaletleri birbirine bağlamak için demiryolu inşa edersek, konfedere olmayı kabul edebilirler."

 je_west_canada: "Bozkırın Ötesine"
 je_west_canada_desc: "Artık konfederasyonumuzu batıya doğru genişletebiliriz."
 je_west_canada_reason: "Doğu sömürgelerinin Dominyon olarak konfedere olmasıyla birlikte, bu konfederasyonun batıya doğru genişletilip genişletilmeyeceği meselesi tartışma konusu haline geldi. Hudson's Bay Company (HBC), uzun zamandır Hudson Körfezi havzası ile batı ovalarının tamamını kontrol altında tutuyor ancak yönetiminden kâr elde etmekte de uzun süredir zorlanıyor. Bu yüzden İngiltere bir satışı kolaylaştırmaya istekli olabilir. Daha batıda ise Britanya Kolombiyası sömürgesi yer alıyor; Amerikan genişlemesinin tehdidi altında olan bu bölge, kıtayı demir ağlarla birbirine bağlamayı başarırsak konfederasyona katılmaya gönüllü olabilir...\n\n#lore \"Onun egemenliği denizden denize, ırmaktan dünyanın uçlarına kadar uzanacak...\"\n\n—Mezmurlar 72:8#!"
 bnap_rupert_button:0 "Rupert Toprakları İçin Teklif Yap"
