l_simp_chinese:
 je_age_of_princes:0 "诸侯时代"
 je_age_of_princes_reason:0 "所罗门王朝统治埃塞俄比亚已近六个世纪，据称是圣经中以色列王所罗门之子的后裔。然而，经过一个世纪的内斗，贡德尔的皇帝已几乎毫无实权，国家被拉斯率领的、相互争斗的各支系所支配。\n\n若要埃塞俄比亚再度重归荣耀，我们必须确立霸权，为我们的子民恢复和平与繁荣。\n\n#lore "所有聚集一堂的圣徒都说："诚然，千真万确，埃塞俄比亚的君王因天上锡安的荣耀与伟大，比世上任何一位君王都更尊贵、更荣耀。""\n——《列王的荣耀》，约14世纪#!"
 age_of_princes_complete:0 "埃塞俄比亚已经统一。"
 ethiopia.1.t:0 "亡命王子"
 ethiopia.1.d:0 "所罗门家族的一位小贵族迅速崛起，权势与声望与日俱增。虽然依照法律他是个亡命之徒，却击败了每一支前来讨伐他的军队，如今他正力图以武力夺取[ROOT.GetCountry.GetName]的王位。"
 ethiopia.1.f:0 "劫富济贫的绿林好汉传说由来已久，这位桀骜不驯的王子正是其写照。被剥夺了贵族继承权的卡萨·海卢，不仅拉起了一支军队，更赢得了追随者的心。"
 ethiopia.1.a:0 "特沃德罗斯将引领我们走向荣耀。拥立他为帝！"
 ethiopia.1.b:0 "我们会让他见识见识我们如何处置亡命之徒。"
 ethiopia.2.t:0 "泽梅内·梅沙芬特"
 ethiopia.2.d:0 "一个多世纪以来，埃塞俄比亚饱受各地贵族之间不断爆发的继承战争之苦，帝国勉强维持统一，贡德尔的皇帝也不过是个有名无实的傀儡。要重建秩序，必须以智谋与武力降服诸公国。"
 ethiopia.2.f:0 ""愿神兴起，使他的仇敌四散，叫那恨他的人从他面前逃跑。"\n\n——《诗篇》68:1"
 ethiopia.2.a:0 "一个诸侯与士师的时代。"
 je_age_of_princes_button_ras:0 "拥立一位忠诚的皇帝"
 je_age_of_princes_button_ras_desc:0 "如今贡德尔与贝格姆德省已落入我们手中，我们可以拥立一位顺从的所罗门王朝人选登上皇位，同时由我们的家族掌控朝廷。"
 age_of_princes_button_tt:0 "所罗门家族的一位成员将在我们的庇护下成为皇帝，这将极大地激怒其他省份。"
 je_age_of_princes_button_bgm:0 "$je_age_of_princes_button_ras$"
 je_age_of_princes_button_bgm_desc:0 "$je_age_of_princes_button_bgm$"
