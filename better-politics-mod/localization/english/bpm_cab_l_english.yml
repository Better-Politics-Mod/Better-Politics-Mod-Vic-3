  bpm_mandate_overall_desc: "@information! @votes_icon! Mandate is used to determine the [Concept('concept_interest_group', 'Interest Groups')] available for your ministerial appointments.\n[Concept('concept_interest_group', 'Interest Group')] @votes_icon! Mandate is derived from its [Concept('concept_in_government','Governmental')] [concept_clout] and your #yellow Executive Principles#! laws.\nCertain [Concept('concept_interest_group', 'Interest Groups')] are more suited to certain [Concept('concept_institution', 'Ministries')] and cost less @votes_icon! Mandate to assign.\nMinister Skill is determined by their [Concept('concept_character_trait','Traits')], which may affect the [Concept('concept_institution', 'Ministry')]'s max investment level.\nAppointing a minister will choose the #yellow most skilled#! candidate available."
