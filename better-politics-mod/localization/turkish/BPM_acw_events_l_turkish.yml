l_turkish:
  bpm_acw_events.999.t:0 "Sahte Olay (Dummy Event)"
  bpm_acw_events.999.d:0 "Bunu nasıl bulmayı başardın?"
  bpm_acw_events.999.f:0 ""Bir dakika, sen de kimsin?"\n\n—Bilinmeyen"
  bpm_acw_events.999.a:0 "Kim CSA olarak ABD'ye karşı kooperatif oynar ki?"

  bpm_acw_events.1.t:0 "Kırılma Noktası"
  bpm_acw_events.1.d:0 "Baş Yargıç Roger B. Taney, John Brown'ın gerillalarının yarattığı hasarı yasal yollarla sınırlandırma umuduyla Lemmon - New York davasını hızlandırma kararı aldı. Mahkeme, 2'ye karşı 7 oyla eyaletlerin köleliği yasaklama hakkı olmadığına hükmetti ve bu kararı mülkiyet hakları ve eyaletler arası ticaret gerekçeleriyle destekledi. Kuzey Eyaletleri'nden gelen tepki çok sert oldu; Pennsylvania ve Ohio valileri, başkanın bu kararı uygulamaya kalkması halinde Brown'ın gerillalarını silahlandıracaklarına açıkça söz verdiler. Yüksek Mahkeme'nin bu vahim hatası, ulusumuzu yıllar sürecek kanlı bir iç savaşa mahkûm etti."
  bpm_acw_events.1.f:0 ""Şimdi, ... bir köle üzerindeki mülkiyet hakkı Anayasa'da açıkça ve kesin bir dille onaylanmıştır. ... Bu mülahazalar ışığında mahkeme; bir vatandaşın, söz konusu hattın kuzeyindeki Amerika Birleşik Devletleri topraklarında bu türden bir mülke sahip olmasını yasaklayan Kongre yasasının Anayasa tarafından güvence altına alınmadığı ve bu nedenle geçersiz olduğu görüşündedir..."\n\n—Roger B. Taney, 1857"
  bpm_acw_events.1.a:0 "Kendi içinde bölünen bir ev ayakta kalamaz. Birlik için!"
  bpm_acw_events.1.b:0 "O, insanları kutsal kılmak için nasıl öldüyse; gelin biz de insanları özgür kılmak için savaşalım!"
  
  bpm_acw_events.2.t:0 "Kırılma Noktası"
  bpm_acw_events.2.d:0 "Son seçimlere tepki olarak, Derin Güney'deki birçok eyalet birlikten ayrılma (secession) konusunu görüşmek üzere kongreler topladı. Bu olaylara karşılık, Sınır Eyaletleri'nden bir senatör, değiştirilemez bir anayasa değişikliğiyle köleliği anayasaya kalıcı olarak kazıyacak bir uzlaşma sözü verdi. Bu teklif hem yeni başkan hem de ayrılıkçılar tarafından reddedildi. İcra başkanı anayasada değiştirilemez bir maddeye dair hiçbir hüküm bulunmadığına dikkat çekerken, ayrılıkçılar köleliği Güneye doğru genişletmek için temel politika garantileri talep ediyor. Eyaletler şimdiden silah bulmak amacıyla federal cephanelikleri basmaya başladı bile."
  bpm_acw_events.2.f:0 ""Yeni hükümetimiz tam aksine bir fikir üzerine kurulmuştur; temelleri atılmış, köşe taşı ise zencinin beyaz adamla eşit olmadığı, üstün ırka kölece boyun eğmenin onun doğal ve normal durumu olduğu büyük gerçeğine dayanmıştır."\n\n—Alexander H. Stephens, 1861"
  bpm_acw_events.2.a:0 "Kendi içinde bölünen bir ev ayakta kalamaz. Birlik için!"
  bpm_acw_events.2.b:0 "Ben davamıza eyalet hakları davası demeyi yeğlerim."
  
  bpm_acw_events.3.t:0 "Özgürlüğün Ağzındaki Tıkacı Çıkarmak"
  bpm_acw_events.3.d:0 "Kölelik üzerine gerilimler tırmanırken, @ig_radicals! Vicdanlı Whigler nihayet Kuzeyli Whigler ve Demokratlar arasında Ağız Tıkama Kuralı'nı (Gag Rule) iptal etmek için yeterli oyu toplamayı başardılar. Artık kölelik Kongre koridorlarında bir kez daha tartışılabildiğine göre, her iki partinin kırılgan koalisyonları içindeki çatlaklar çok daha belirgin hale geliyor."
  bpm_acw_events.3.f:0 ""Ağzım tıkandı mı tıkanmadı mı?"\n\n—John Quincy Adams, 1836"
  bpm_acw_events.3.a:0 "Fakat bu bir şeyleri değiştirecek mi?"  
  
  bpm_acw_events.4.t:0 "Whig Partisi Çöküyor"
  bpm_acw_events.4.d:0 "Kölelik Amerikan siyasetinde her şeyi kapsayan bir sorun haline geldikçe, ana partilerin hiçbiri bu baskıya dayanamayacak gibi görünüyor. Jacksoncı Liberaller Demokrat Parti'yi terk ederek yeni, Kuzeyli bir Cumhuriyetçi Parti çatısı altında eski Vicdanlı Whigler'e katıldılar. Bu sırada Pamuk Whigleri terk edildi; bazıları Demokratlara katılırken bazıları da Anayasal Birlik Partisi kurmaya çalışıyor. İkinci Parti Sistemi sona erdi."
  bpm_acw_events.4.f:0 ""Amacımız beyler, Cumhuriyetçi Parti'nin misyonu ve teşkilatının temeli, bu bölgesel çıkar politikasına direnmektir.... Amacımız ve politikamız, Birlik bayrağının dalgalandığı her yerde köleliğin anayasa gereği var olduğuna dair bu yeni anayasal dogmalara direnmektir."\n\n—David Wilmot, 1860"
  bpm_acw_events.4.a:0 "Bu, gelecekte sadece daha bölücü bir siyaset anlamına gelir..."
  
  bpm_acw_events.5.t:0 "Korsan Savaşları (Filibuster War)"
  bpm_acw_events.5.d:0 "Amerika bağımsız olduğundan bu yana, vatandaşlarımız arasında özgürlüğün ışığını yasal olmayan yollarla yaymak isteyenler her zaman var olmuştur. Görünüşe göre bu 'korsanların' (filibuster) yeni bir nesli şimdi sahneye çıktı; Honduras, Nikaragua ve Kosta Rika'ya akınlar düzenleniyor. Bu adamlar Amerikan medeniyetini ve köleliğini fetihlerine yaymayı, nihai hedef olarak da köleci eyaletlerin üstünlüğünü garanti altına almak için bu ulusları birliğimize entegre etmeyi planlıyorlar. Bu cesur savaşçılara yardım edip Orta Amerika'da çıkarları olan Avrupalı Güçleri kızdırma riskini göze alalım mı? Uluslararası bir kriz çıkarmadan önce bu serserileri durdurmaya mı çalışalım? Yoksa bekle-gör yaklaşımını mı benimseyelim?"
  bpm_acw_events.5.f:0 ""Amerikan medeniyetinin düşmanları --ki bunlar köleliğin de düşmanlarıdır-- onun dostlarından daha tetikte görünüyor."\n\n—William Walker, 1860"
  bpm_acw_events.5.a:0 "Köleliği yaymaya yönelik bu bariz girişimleri durdurmalıyız!"
  bpm_acw_events.5.b:0 "Bu alçakları durdurmayın ama yardım da etmeyin. Böylece hiçbir risk almadan fayda sağlarız."
  bpm_acw_events.5.c:0 "Eğer bu 'Kendine Has Kurumu' doğrudan genişletemiyorsak, belki de bu paralı askerlerden yararlanabiliriz..."

  bpm_acw_events.6.t:0 "Wilmot Şartı Yeniden İnceleniyor"
  bpm_acw_events.6.d:0 "Devam eden bir davada Yüksek Mahkeme Baş Yargıcı Roger B. Taney, Wilmot Şartı'nın yasallığını sorguladı. Kendisi Şart'ı ve ondan önceki Missouri Uzlaşması'nı anayasaya aykırı görüyor ve diğer yargıçları bunu iptal etmeye ikna etmeye çalışıyor. Nihai karar ne olursa olsun, bu çatışma Meksika Toprakları üzerindeki gerilimi şimdiden yeniden alevlendirdi. Mahkeme ne karar verecek?"
  bpm_acw_events.6.f:0 ""Şu şartla ki; Amerika Birleşik Devletleri tarafından Meksika Cumhuriyeti'nden aralarında müzakere edilecek herhangi bir antlaşma yoluyla elde edilecek herhangi bir bölgenin edinilmesinin ve burada tahsis edilen paraların İcra tarafından kullanılmasının açık ve temel bir koşulu olarak, söz konusu bölgenin hiçbir yerinde, tarafın usulüne uygun olarak mahkûm edileceği suçlar haricinde, kölelik veya zorla çalıştırma asla var olmayacaktır."\n\n—Wilmot Şartı, 1846"
  bpm_acw_events.6.a:0 "7'ye karşı 2 oyla Wilmot iptal edildi."
  bpm_acw_events.6.b:0 "5'e karşı 4 oyla Wilmot bir gün daha yürürlükte kalıyor."
    
  bpm_acw_events.7.t:0 "Kaçak Köle Yasası Hükümsüz Kılındı"
  bpm_acw_events.7.d:0 "Wisconsin Yüksek Mahkemesi, Büyük Uzlaşma'nın bir parçası olan Kaçak Köle Yasası'nı anayasaya aykırı ilan etti. Bu karar Yüksek Mahkeme'nin üstünlüğünü hiçe sayıyor ve kaçan köleleri yakalamaya çalışan ABD Kolluk Kuvvetlerine (US Marshals) karşı Kuzey yasama organlarını cesaretlendirmekle tehdit ediyor. Yüksek Mahkeme bu durumun böyle kalamayacağının farkında ancak bu kadar hassas bir konuyu hızlandırılmış yargılamaya alıp almaması konusunda kararsız. Mahkeme neye karar verecek?"
  bpm_acw_events.7.f:0 ""Bu Anayasa ve buna uygun olarak çıkarılacak Amerika Birleşik Devletleri yasaları ile Amerika Birleşik Devletleri'nin yetkisi altında yapılmış veya yapılacak tüm antlaşmalar, ülkenin en üstün hukuku olacaktır ve herhangi bir Eyaletin Anayasasındaki veya yasalarındaki aksine hükümlere bakılmaksızın, her Eyaletteki yargıçlar bunlarla bağlı olacaktır."\n\n—Roger B. Taney, 1858"
  bpm_acw_events.7.a:0 "Mahkeme davayı hızlandırır; oybirliğiyle alınan karar Kuzeylileri çileden çıkarır."
  bpm_acw_events.7.b:0 "Mahkeme işleri usulüne göre yürütür; bu da Güneylileri öfkelendirir."

  bpm_acw_events.8.t:0 "Kanayan [SCOPE.sState('bpm_bleeding_kansas').GetName]"
  bpm_acw_events.8.d:0 "Kölelik karşıtları ve kölelik yanlıları, bölgenin yönetimini kendi isteklerine göre şekillendirme umuduyla [SCOPE.sState('bpm_bleeding_kansas').GetName] bölgesine akın ediyor. Paramiliter gruplar birbirlerine ve sivillere karşı şiddet eylemleri uygulamaya başladı."
  bpm_acw_events.8.f:0 ""Tanrı'nın huzurunda ve bu şahitlerin önünde, şu andan itibaren hayatımı köleliğin yok edilmesine adıyorum."\n\n—John Brown, 1837"
  bpm_acw_events.8.a:0 "Çeteciler yasaları dikte edemez! [SCOPE.sState('bpm_bleeding_kansas').GetName] özgür bir eyalet olmalı."
  bpm_acw_events.8.b:0 "Bu konuda taraf tutamayız, bu iç savaş anlamına gelir. [SCOPE.sState('bpm_bleeding_kansas').GetName] bölgesinin eyalet olarak kabulünü olabildiğince geciktirin."
  bpm_acw_events.8.c:0 "Neyin doğru olduğuna çeteler karar vermez! [SCOPE.sState('bpm_bleeding_kansas').GetName] köleci bir eyalet olacak."

  bpm_acw_events.9.t:0 "Dred Scott - Sandford Davası"
  bpm_acw_events.9.d:0 "Dred Scott, sahipleri tarafından özgür Illinois eyaletine ve özgür Wisconsin bölgesine götürülen köleleştirilmiş bir adamdı. Köleci Missouri eyaletine geri getirildikten sonra Scott, özgür eyaletlere ve topraklara götürüldüğü için otomatik olarak özgür kaldığını ve yasal olarak artık bir köle olmadığını iddia ederek özgürlüğü için dava açtı. Bu dava şimdi Yüksek Mahkeme'ye ulaştı ve Baş Yargıç Roger B. Taney, gelecekteki tarihçilerin yargı tarihinin en kötü kararı olarak adlandıracağı metni yazmayı planlıyor. Ancak aynı saftaki diğer 6 yargıç, bölgesel kriz korkusuyla kölelik karşıtlığına karşı böylesine agresif bir adım atmakta tereddüt ediyor. Başkan bu kırılgan yargı durumuna nasıl müdahale edecek?"
  bpm_acw_events.9.f:0 ""Beyaz Adamın saygı duymak zorunda olduğu hiçbir hak yoktur"\n\n—Roger B. Taney, 1857"
  bpm_acw_events.9.a:0 "Başkan, yargıçlara Taney'i desteklemeleri için baskı yapar; o da derhal eyalet haklarının bir ikiyüzlülük olduğunu kanıtlar. 7'ye karşı 2 oyla bu suçlu ulusun günahları mürekkeple yazılır, kanla yıkanacaktır."
  bpm_acw_events.9.b:0 "Başkan, Taney'e diğer yargıçlarla birlikte çalışması için baskı yapar ve Scott bir vatandaş olarak tanınır ancak özgür bırakılmaz. Güney, vatandaşlığı görmezden gelip köle kalmasına odaklanır ve öfke kusmaya başlar."

  bpm_acw_events.10.t:0 "John Brown'ın Baskını"
  bpm_acw_events.10.d1:0 ""Kölelik karşıtı akıncı" John Brown, Harpers Ferry'de bir köle ayaklanması başlattı. Kasabayı başarıyla izole edip cephaneliği ele geçirdikten sonra Brown, Harriet Tubman'ın ağının yardımıyla 500'den fazla köleyi seferber etti ve Appalachian Dağları'na kaçtı. Brown şimdi dağ silsilesine komşu olan her köleci eyaleti taciz ediyor; Yeraltı Demiryolu'nu (Underground Railroad) kullanarak savaşamayacak durumdakileri güvenli yerlere kaçırıyor, savaşabilecek olanları ise daha fazla kardeşlerini kurtarmaları için silahlandırıp eğitiyor. Güney; Pennsylvania ve Ohio'dan, eyaletlerindeki Brown'ın ikmal ağını çökertmelerini talep ediyor ancak yerel yönetimler bunu kararlılıkla reddediyor."
  bpm_acw_events.10.d2:0 ""Kölelik karşıtı akıncı" John Brown, Harpers Ferry'de bir köle ayaklanması girişiminde bulundu. Bir dizi talihsiz hata planın çökmesine yol açtı; John Brown yakalandı ve asıldı. Ancak Kuzey Gazeteleri Brown'ın imajını hızla bir şehide dönüştürerek Kölelik Karşıtlarını bir sonraki mücadele için bir araya getirdi. Güney şimdi başka bir John Brown Güneye saldırdığında veya daha kötüsü kölelik karşıtı bir başkan benzer bir planı uygulamak için orduyu kullandığında ne olacağından dehşetle korkuyor."
  bpm_acw_events.10.f:0 ""John Brown'ın bedeni mezarda çürüyor. Ama ruhu dimdik ilerliyor..."\n\n—John Brown's Body Şarkısı, 1861"
  bpm_acw_events.10.a:0 "Savaş boruları çalmaya başlıyor..."

  bpm_acw_events.11.t:0 "Batı'da Kölelik?"
  bpm_acw_events.11.d:0 "Kuzey Meksika'yı ele geçirme niyetimiz artık herkes tarafından bilinirken, kölelik karşıtları ve köle sahipleri yeni elde edilen topraklarda köleliğin nasıl ele alınması gerektiğini tartışmaya başladılar. David Wilmot, köleliğin yeni topraklara genişlemesini yasaklayacak bir şart önerirken, Stephen A. Douglas ve Henry Clay, Missouri Uzlaşması'nın sorunlarını yeni halk egemenliği teorisiyle çözecek yeni bir uzlaşmayı savunuyorlar. Kongre neye karar verecek?"
  bpm_acw_events.11.f:0 ""Kongre'nin köle sahibi bir Eyaleti istemeyen bir halka dayatma hakkını reddediyorum. Özgür bir Eyaleti istemeyen bir halka dayatma hakkını reddediyorum. İstemeyen bir halka iyi bir şeyi dayatma hakkını reddediyorum. Büyük ilke, her topluluğun bir şeyin doğru mu yanlış mı olduğunu, onu benimsemenin kendileri için iyi mi kötü mü olacağını bizzat yargılama ve karar verme hakkıdır; ve özgür hareket etme hakkı, özgür düşünce hakkı, sorun hakkında özgür yargılama hakkı, özgür bir hükümet altındaki her gerçek Amerikalı için diğer her şeyden daha değerlidir."\n\n—Stephen A. Douglas, 1858"
  bpm_acw_events.11.a:0 "Halk Egemenliği tartışmayı kazanır."
  bpm_acw_events.11.b:0 "Wilmot Şartı zaferle çıkar."
  
  bpm_acw_events.12.t:0 "Kuzeybatı Kararnamesinin Genişletilmesi"
  bpm_acw_events.12.d:0 "Kanada'yı ele geçirme niyetimiz artık herkes tarafından bilinirken, bu yeni toprakların nasıl organize edileceğine dair bir karar verilmelidir. Kongre, Kuzeybatı Kararnamesini geçici olarak yeniden canlandırmayı ve bunun dini eşitlik ile kölelikten muafiyet garantilerini yeni edinilen tüm topraklara uygulamayı kabul etti. Bu durum, özgür ve köle eyalet dengesini koruma şanslarını kaybettiklerinden korkan Güney'de büyük bir hoşnutsuzluğa neden oldu."
  bpm_acw_events.12.f:0 ""Söz konusu bölgede, tarafın usulüne uygun olarak mahkûm edileceği suçların cezalandırılması haricinde, ne kölelik ne de zorla çalıştırma var olacaktır."\n\n—Kuzeybatı Kararnamesi, 1787"
  bpm_acw_events.12.a:0 "Quebecliler Katolik olabilir ama AMERİKALI Katolikler olacaklar."

  bpm_acw_events.13.t:0 "Monroe Doktrini'nin Genişletilmesi"
  bpm_acw_events.13.d:0 "Monroe Doktrini ilk hazırlandığında, mevcut hiçbir Avrupa sömürgesine uygulanmayacağını iddia ediyordu. Ancak Küba ve Karayipler'i ele geçirme niyetimiz artık herkes tarafından bilinirken, yeni politikamız için bir gerekçeye ihtiyacımız var. Bu durum, mevcut sömürgeler maddesi kaldırılarak Monroe Doktrini'nin genişletilmesiyle yapıldı. Bu karar, Güneyliler tarafından şeker imparatorluklarının kurulmasının Köleci Gücün federal hükümet üzerindeki hakimiyetini perçinlemesine izin vereceğinden korkan Kuzey'de öfkeye neden oldu."
  bpm_acw_events.13.f:0 ""Herhangi bir Avrupa gücünün mevcut sömürgelerine veya bağımlı topraklarına müdahale etmedik ve etmeyeceğiz."\n\n—Monroe Doktrini, 1823"
  bpm_acw_events.13.a:0 "Kübalılar Katolik olabilir ama AMERİKALI Katolikler olacaklar."

  bpm_acw_events.14.t:0 "Amerikan Sisteminin Kabulü"
  bpm_acw_events.14.d:0 "Büyük çabalar sonucunda Henry Clay, Güneyli Hükümsüzlük Yanlılarını (Nullifiers) Amerikan Sistemi ile başarıyla uzlaştırdı. Güney, yaklaşan seçimlerde artık bir Whig kalesi olacaktır."
  bpm_acw_events.14.f:0 ""Umarım ileride 'Amerika, Amerika'nın en iyi müşterisidir' denir."\n\n—Henry Clay"
  bpm_acw_events.14.a:0 "Çok şükür!"

  bpm_acw_events.15.t:0 "Ucubeliğin Ölümü"
  bpm_acw_events.15.d:0 "Büyük muhalefete rağmen Demokratlar, Güneyli Hükümsüzlük Yanlılarını başarıyla teskin ettiler. Güney, yaklaşan seçimlerde artık bir Demokrat kalesi olacaktır."
  bpm_acw_events.15.f:0 ""Ben bir plantasyon sahibiyim - bir pamuk üreticisiyim. Ben Güneyli bir adamım ve köle sahibiyim -nazik ve merhametli biri olduğuma inanıyorum- ve köle sahibi olduğum için kimseden aşağı kalır yanım yok."\n\n—John C. Calhoun, 1847"
  bpm_acw_events.15.a:0 "Çok şükür!"

  bpm_acw_events.16.t:0 "Ağız Tıkama Kuralı Kesinleşti"
  bpm_acw_events.16.d:0 "Her iki partinin tüm çabalarına rağmen, Hükümsüzlük Yanlıları zamanında tatmin edilemedi. Ağız Tıkama Kuralı (Gag Rule) artık Kongre'nin her kademesine kazındı ve bu hasarın telafi edilmesi biraz zaman alacak."
  bpm_acw_events.16.f:0 ""Ağzım tıkandı mı tıkanmadı mı?"\n\n—John Quincy Adams, 1836"
  bpm_acw_events.16.a:0 "Aman Tanrım!"

  bpm_acw_events.17.t:0 "Fort Independence Muharebesi"
  bpm_acw_events.17.d:0 "Haftalar süren gerilimlerin ardından Eyaletler Arası Savaş'ın ilk kurşunu sıkıldı. Boston Limanı'nın kontrolünü sağlamak amacıyla FSA (Özgür Eyaletler Ordusu), Fort Independence'ı bombaladı."
  bpm_acw_events.17.f:0 ""Tanrı yardımcımız olsun.""
  bpm_acw_events.17.a:0 "Ve böylece başlıyor."
  
  bpm_acw_events.18.t:0 "Fort Sumter Muharebesi"
  bpm_acw_events.18.d:0 "Haftalar süren gerilimlerin ardından Eyaletler Arası Savaş'ın ilk kurşunu sıkıldı. Charleston Limanı'nın kontrolünü sağlamak amacıyla CSA Ordusu (Konfederasyon), Fort Sumter'ı bombaladı."
  bpm_acw_events.18.f:0 ""Tanrı yardımcımız olsun.""
  bpm_acw_events.18.a:0 "Ve böylece başlıyor."

  bpm_acw_events.19.t:0 "Fort Independence Muharebesi"
  bpm_acw_events.19.d:0 "Haftalar süren gerilimlerin ardından Eyaletler Arası Savaş'ın ilk kurşunu sıkıldı. Boston Limanı'nın kontrolünü sağlamak amacıyla FSA, Fort Independence'ı bombaladı."
  bpm_acw_events.19.f:0 ""Tanrı yardımcımız olsun.""
  bpm_acw_events.19.a:0 "Ve böylece başlıyor."

  bpm_acw_events.20.t:0 "Fort Sumter Muharebesi"
  bpm_acw_events.20.d:0 "Haftalar süren gerilimlerin ardından Eyaletler Arası Savaş'ın ilk kurşunu sıkıldı. Charleston Limanı'nın kontrolünü sağlamak amacıyla CSA Ordusu, Fort Sumter'ı bombaladı."
  bpm_acw_events.20.f:0 ""Tanrı yardımcımız olsun.""
  bpm_acw_events.20.a:0 "Ve böylece başlıyor."
  
  bpm_acw_events.21.t:0 "Bölgeden Ayrılış"
  bpm_acw_events.21.d:0 "Uzun tartışmaların ardından Kongre, İkamet Yasasını (Residence Act) yürürlükten kaldırarak ulusumuzun başkentini Columbia Bölgesi'nden (Washington D.C.) taşıma kararı aldı. Bürokratlar şimdiden bu kararın ne kadar aptalca olduğuna dair alarm verirken, başkentimize yeni ev sahipliği yapacak eyalet yeni fırsatlar karşısında iştah kabartıyor."
  bpm_acw_events.21.f:0 ""Herkes İçin Adalet"\n\n—Washington DC'nin Sloganı"
  bpm_acw_events.21.a:0 "Eylemlerimizin Sonuçları"
  
  bpm_acw_events.22.t:0 "Tanınma!"
  bpm_acw_events.22.d:0 "İki yıllık savaşın ardından diplomatik temaslarımıza nihayet yanıt geldi! Savaş öncesi ABD ile Avrupalılar arasında Orta Amerika pazarları üzerindeki rekabet, davamız için tanınma sağlama fırsatı yarattı. Birlik'in Eski Dünya müttefikleri bile bizimle diplomatik ilişkiler kurdu!"
  bpm_acw_events.22.f:0 ""Kuzey kazanırsa mutlu olurum. Ama Güney kazanırsa sevinçten havalara uçarım."\n\n—III. Napolyon"
  bpm_acw_events.22.a:0 "Özgür olacağız!"

  bpm_acw_events.23.t:0 "Barnburner Manifestosu"
  bpm_acw_events.23.d:0 "Ulusumuzdaki bölgesel gerilimler arttıkça, Demokrat Parti içinde de fokurdamaya başladı. Martin van Buren'in Albany Naipliğine sadık politikacılar, hem Kurucu Babalar'ın köleliği sona erdirme arzusunu hem de Kongre'nin bunu düzenleme yetkisini ilan eden bir belgeyi desteklediler.\n\nDemokrat Parti'nin kurucu kadroları tarafından desteklenen böylesi bir belge, Jackson'ın popülist hareketini böldü. Yeni "Barnburner" Demokratları, Özgür Toprak Partisi'ni (Free Soil Party) kurmak için Özgürlük Partisi (Liberty Party) ile görüşmelere başladı."
  bpm_acw_events.23.f:0 ""Başkanlığa gelince, hayatımın en mutlu iki günü göreve başladığım ve görevi devrettiğim günlerdi."\n\n—Martin van Buren"
  bpm_acw_events.23.a:0 "Küçük Sihirbaz son büyüsünü yapıyor..."
  
  bpm_acw_events.24.t:0 "Yeni Bir Yönetim"
  bpm_acw_events.24.d:0 "Sandıktaki her yenilgi, kaybeden taraf arasında daha fazla radikalleşme anlamına geliyordu. Bu durum, John C. Breckinridge'in Abraham Lincoln'e yenilmesiyle en uç noktaya ulaştı ve birçok Güney Eyaletinin seçim sisteminin artık geçerli bir seçenek olmadığı sonucuna varmasına yol açtı."
  bpm_acw_events.24.f:0 ""Hükümetin kendisi kadar eski bir geleneğe uygun olarak, sizlere kısaca hitap etmek ve Başkan'ın bu görevin icrasına başlamadan önce etmesi gereken Amerika Birleşik Devletleri Anayasası'nda öngörülen yemini huzurunuzda etmek üzere karşınızdayım."\n\n—Abraham Lincoln, 1861"
  bpm_acw_events.24.a:0 "İç Savaşa Bir Adım Daha Yakın..."
    
  bpm_acw_events.25.t1:0 "Bir Başkanın Ölümü"
  bpm_acw_events.25.t2:0 "Gergin Bir Devir Teslim"
  bpm_acw_events.25.d1:0 "Başkanlık seçimleri radikalleştirici olsa da, erken dönem Başkan Yardımcılarının makama yükselişi çok daha fazla öyleydi. Başkan Yardımcısı vefat eden Başkan ile zıt bir bölgedense partileri içinden isyanlar çıkıyordu. Eğer Başkan Yardımcısı selefinin politikalarını sürdürürse bu sefer de meşruiyetsizlik suçlamalarıyla karşılaşabiliyordu."
  bpm_acw_events.25.d2:0 "Kölelik yürürlükte olduğu sürece ABD'deki seçimler her zaman birer parlama noktası olacaktı. 1860 seçimlerinde kimin galip geldiğine bakılmaksızın bölgesel bir krizden kaçınma umudu çok azdı."
  bpm_acw_events.25.f:0 ""Ben asla bir hain olmadım."\n\n—John Tyler"
  bpm_acw_events.25.a:0 "İç Savaşa İki Adım Daha Yakın..."

  bpm_acw_events.26.t:0 "Bir Eyaletin Doğuşu"
  bpm_acw_events.26.d:0 "Birliğe ne zaman yeni bir eyalet eklense, Senato çılgınca yeni bir yöne savrulur. Tarihsel olarak ABD, yeni eyaletlerin bir özgür ve bir köle çifti halinde girmesine izin vererek bu sorunu yönetmişti. Artık [SCOPE.sState('bpm_new_state').GetName] tam bir Eyalet olarak Birliğimize katıldığına göre, kaderi ne olmalıdır?"
  bpm_acw_events.26.f:0 ""Kendi içinde bölünen bir ev ayakta kalamaz."\n\n—Abraham Lincoln, 1858"
  bpm_acw_events.26.a:0 "Birliğe yeni bir Köle Eyaleti katılsın."
  bpm_acw_events.26.b:0 "Birliğe yeni bir Özgür Eyalet katılsın."

  bpm_acw_events.27.t:0 "Rubicon'u Geçmek"
  bpm_acw_events.27.d:0 "Kölelikten yasama yoluyla arınabileceğimize ve kan dökülmesini engelleyebileceğimize inanmıştık. Böylesi birlik hayalleri naif bir zihnin uydurmasından ibaretti. Kongre'nin köleliği yasaklamasına öfkelenen Güney Eyalet Hükümetleri, özgürlük yalanıyla lekelenmemiş yeni bir ulus yaratmak için silaha sarıldılar."
  bpm_acw_events.27.f:0 ""Bu suçlu ülkenin işlediği suçlar, kan dökülmeden asla temizlenmeyecektir."\n\n—John Brown, 1859"

  bpm_acw_events.28.t:0 "Rubicon'u Geçmek"
  bpm_acw_events.28.d:0 "Kölelik konusunda zamanı geri alabileceğimize ve eski yöntemlere dönebileceğimize inanmıştık. Bu tür gerici hayaller bir seraptan ibaretti. Kongre'nin köleliği genişletmesine öfkelenen Kuzey Eyalet Hükümetleri, kölelik günahıyla lekelenmemiş yeni bir ulus yaratmak için silaha sarıldılar."
  bpm_acw_events.28.f:0 ""Bu suçlu ülkenin işlediği suçlar, kan dökülmeden asla temizlenmeyecektir."\n\n—John Brown, 1859"

  bpm_acw_events.29.t:0 "İkinci Parti Sistemi"
  bpm_acw_events.29.d:0 "Jackson, İkinci Parti Sistemi'nin ve kitle katılımı siyasetinin babasıydı. İkinci Parti Sistemi'nin yükselişiyle birlikte Mason Karşıtı (Anti-Masonic), Özgürlük (Liberty), Amerikan ve Özgür Toprak (Free Soil) Partileri gibi Üçüncü Partilerin de yükselişi gerçekleşti.\n\nBu partiler siyasi tartışmalarda etkili olsalar da hiçbir eyaleti kazanmaya yetecek oyu alamadılar. Çoğunlukçu Seçim Sistemi'nin (First-Past-The-Post) cilvesi böyledir işte."
  bpm_acw_events.29.f:0 ""Mücadele yalnızca siyahların özgürlüğü için değil, beyazların da özgürlüğü için bir mücadele haline geliyor—ve geldi."\n\n—James G. Birney"
  bpm_acw_events.29.a:0 "Washington'ın saflığı peşimizi bırakmıyor."

  bpm_acw_events.30.t:0 "İkinci Parti Sistemi"
  bpm_acw_events.30.d:0 "Jackson, İkinci Parti Sistemi'nin ve kitle katılımı siyasetinin babasıydı. İkinci Parti Sistemi'nin yükselişiyle birlikte Mason Karşıtı, Özgürlük, Amerikan ve Özgür Toprak Partileri gibi Üçüncü Partilerin de yükselişi gerçekleşti.\n\nBu partiler siyasi tartışmalarda etkili olsalar da hiçbir eyaleti kazanmaya yetecek oyu alamadılar. Çoğunlukçu Seçim Sistemi'nin cilvesi böyledir işte."
  bpm_acw_events.30.f:0 ""Mücadele yalnızca siyahların özgürlüğü için değil, beyazların da özgürlüğü için bir mücadele haline geliyor—ve geldi."\n\n—James G. Birney"
  bpm_acw_events.30.a:0 "Washington'ın saflığı peşimizi bırakmıyor."

