 bpm_decorative_modify_employment_machinists_per_workplace_safety_investment_desc:0 "$bpm_decorative_modify_employment_machinists_per_workplace_safety_investment$"
 bpm_decorative_modify_employment_clerks_per_workplace_safety_investment:0 "[GetInstitutionType('institution_workplace_safety').GetName] [Concept('concept_institution', 'Kurum')] Seviyesi başına @clerks! Tezgahtar İstihdamı"
 bpm_decorative_modify_employment_clerks_per_workplace_safety_investment_desc:0 "$bpm_decorative_modify_employment_clerks_per_workplace_safety_investment$"

# Trade Unions
 lawgroup_labour_associations:0 "İşçi Sendikaları"
 lawgroup_labour_associations_desc:0 "Bu yasalar, işçilerin çeşitli ideolojik ve yönetimsel kısıtlamalara bağlı kalırken haklarını savunmak için nasıl örgütlenebileceklerini yönlendirerek emeğin temsil ortamını şekillendirir."

 law_combination_acts:0 "Yasadışı Sendikalar"
 law_combination_acts_desc:0 "İşçi sendikalarının her türlüsü kesinlikle yasaktır ve bu tür örgütlere katılmak yasalara aykırıdır."
 law_corporatized_unions:0 "Devlet Kontrollü Sendikalar"
 law_corporatized_unions_desc:0 "Hükümet, devlet politikaları ve hedefleriyle uyumlu olmalarını sağlayarak tüm işçi sendikalarını denetler ve kontrol eder."
 law_anti_strike_laws:0 "Sınırlı Sendikalar"
 law_anti_strike_laws_desc:0 "İşçi sendikalarına zımnen izin verilir, ancak grevler ve siyasi duruşlar konusunda ağır kısıtlamalara tabidirler."
 law_right_to_associate:0 "Tüm Sendikalara İzin Var"
 law_right_to_associate_desc:0 "İdeolojik duruşları ne olursa olsun çeşitli işçi sendikalarının ülke içinde özgürce faaliyet göstermesine izin verilir."
 law_socialist_labor_unions:0 "Sadece Sosyalist Sendikalar"
 law_socialist_labor_unions_desc:0 "Sadece devletin sosyalist doktriniyle uyumlu işçi sendikalarının ülkede faaliyet göstermesine izin verilir."
 law_syndicalism:0 "Sendikalizm"
 law_syndicalism_desc:0 "İşçi sendikaları, toplumun sosyal örgütlenmesinin bir temeli olarak kullanılır ve ülkenin yönetim birimleri haline gelir."

