l_simp_chinese:
 ideology_mil_ultramilitarist:0 "极端军国主义者"
 ideology_mil_ultramilitarist_desc:0 "#lore 该群体认为战争与冲突本身就是善的、值得向往的，摒弃一切和平之念而一心向战。#!"
 ideology_jingoist:0 "军国主义者"
 ideology_jingoist_desc:0 "#lore 为了神！该群体相信军国主义在外交事务中至高无上，并需要一支军队来支撑这种渴望。#!"
 ideology_mil_patriotic:0 "爱国主义者"
 ideology_mil_patriotic_desc:0 "#lore 该群体支持建立一支强大而专业的军队来保卫国防——如有需要，也不排斥偶尔的远征。#!"
 ideology_mil_patriotic_liberal:0 "自由爱国主义者"
 ideology_mil_patriotic_liberal_desc:0 "#lore 该群体支持建立一支强大而专业的军队来保卫国防，并将某些进步元素融入其军队的使用方针之中。#!"
 ideology_mil_defensive_patriot:0 "防御性军国主义者"
 ideology_mil_defensive_patriot_desc:0 "#lore 该群体支持建立一支强大而专业的军队来保卫国防，也仅仅为了保卫国防。#!"
 ideology_mil_frontier_expansion:0 "边境扩张主义者"
 ideology_mil_frontier_expansion_desc:0 "#lore 该群体偏好一支组织松散的军队，用于在险恶的边境护送拓荒者——或驱逐当地人。#!"
 ideology_mil_antimilitarist:0 "反军国主义者"
 ideology_mil_antimilitarist_desc:0 "#lore 如果说军队终究必须存在，该群体认为它理想上应当是规模小、去中心化、完全自愿的，并在外交政策上秉持和平主义的立场。#!"
 ideology_mil_popular_army:0 "人民军队主义者"
 ideology_mil_popular_army_desc:0 "#lore 该群体认为，一支去中心化、自愿组建、直接对人民负责、并围绕自卫或无产阶级团结之需要而组织的军队，才是应对战争与和平的首选之道。#!"
 ideology_mil_aristocratic_militarist:0 "贵族军国主义者"
 ideology_mil_aristocratic_militarist_desc:0 "#lore 该群体认为军队应主要由贵族率领的农民军队构成。他们将职业军事集团视为对其自身权力的威胁。#!"
 ideology_mil_plutocratic_militarist:0 "财阀军国主义者"
 ideology_mil_plutocratic_militarist_desc:0 "#lore 该群体对保持军队向财富的影响敞开大门有着切身的利益。#!"
 ideology_mil_mass_army:0 "革命军国主义者"
 ideology_mil_mass_army_desc:0 "#lore 该群体虽然在和平时期可能反对军国主义，但他们相信需要一支庞大的群众军队，不惜一切代价保卫革命。#!"
 ideology_mil_emergency:0 "应急军国主义者"
 ideology_mil_emergency_desc:0 "#lore 在大规模冲突的压力之下，该群体如今不顾其和平时期的军事政策，转而推动全民动员。#!"
 ideology_mil_institutional_militarist:0 "建制军国主义者"
 ideology_mil_institutional_militarist_desc:0 "#lore 该群体渴望将重点放在一支经费充足、实力强大的军队之上——只要军队的现任领导层不受干涉即可。#!"
