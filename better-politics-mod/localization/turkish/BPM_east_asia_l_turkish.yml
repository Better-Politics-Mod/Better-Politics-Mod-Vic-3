# # JAPAN JEs
#  je_meiji_restoration:0 "Bakumatsu"
#  je_meiji_restoration_reason:0 "#lore \"Büyük bir ağaç bile küçük baltalarla devrilir.\"\n—Japon Atasözü#!\n\nBatılı güçler Japonya kıyılarına dayandı ve Sakoku politikası Japonya'yı zayıf bıraktı. Limanlarımızın zorla açılması, bankacılık sistemimizin çökmesine ve limanlarımızın misyonerler dahil yabancılarla dolup taşmasına neden oldu. Pek çok Daimyo ve imparatorluk hanedanı üyesi, Japonya'yı yabancı egemenliğinden korumak için radikal bir değişimin gerekli olduğuna inanmaya başlıyor.\n\nBazıları buna Şogunluğun sonu olan #v Bakumatsu#! diyor.\n\nŞogunluğun sonuna doğru her ay #P 1#! ilerleme kaydedilir. Restorasyona doğru büyük sıçramalara olanak tanıyan olaylar da meydana gelebilir."
#  je_meiji_restoration_goal:0 "Bakumatsu ilerlemesi 100'e ulaştı"
#  bpm_shogunate_var:0 "Bakumatsu İlerlemesi"

#  bpm_shogunate_secured_tt:0 "Şogunluk reforme edildi."
