 bpm_amendment_patchwork_governance: "Patchwork Governance"
 bpm_amendment_patchwork_governance_desc: "This polity's administration has an inconsistent, sometimes contradictory set of policies regarding the autonomy and privileges of various regions. As long as any incorporated [concept_state] retains its patchwork of local privileges, the central administration cannot be built up."

 bpm_patchwork_governance_level_1: "Patchwork Governance (I)"
 bpm_patchwork_governance_level_1_desc: "A few lingering local privileges still blunt the reach of our [Concept('concept_institution', 'Institutions')] in this [concept_state]."
 bpm_patchwork_governance_level_2: "Patchwork Governance (II)"
 bpm_patchwork_governance_level_2_desc: "Local privileges still hinder the reach of our [Concept('concept_institution', 'Institutions')] in this [concept_state]."
 bpm_patchwork_governance_level_3: "Patchwork Governance (III)"
 bpm_patchwork_governance_level_3_desc: "A tangle of local privileges and exemptions severely limits the reach of our [Concept('concept_institution', 'Institutions')] in this [concept_state]."
 bpm_patchwork_governance_level_4: "Patchwork Governance (IV)"
 bpm_patchwork_governance_level_4_desc: "Local notables, charters and customs leave our [Concept('concept_institution', 'Institutions')] nearly powerless in this [concept_state]."
 bpm_patchwork_governance_level_5: "Patchwork Governance (V)"
 bpm_patchwork_governance_level_5_desc: "This [concept_state] is governed by its own patchwork of charters, privileges and customs. Our [Concept('concept_institution', 'Institutions')] have no effect here."

 decree_bpm_dismantle_patchwork_governance: "Dismantle Local Privileges"
 decree_bpm_dismantle_patchwork_governance_desc: "Send administrators to override local charters and exemptions, slowly reducing #v Patchwork Governance#! in this [concept_state]. The process is sped up by a powerful and content #v $ig_petty_bourgeoisie$#! and slowed by a powerful and content #v $ig_landowners$#!. Local upper classes will be radicalized while it is in effect."
 decree_bpm_dismantle_patchwork_governance_colonial: "Impose Colonial Administration"
 decree_bpm_dismantle_patchwork_governance_colonial_desc: "Replace the patchwork of local arrangements in this unincorporated [concept_state] with direct administration, slowly reducing #v Patchwork Governance#!. The process is sped up by a powerful and content #v $ig_armed_forces$#! and slowed by a powerful and content #v $ig_landowners$#!. Local upper classes will be radicalized while it is in effect."

 bpm_patchwork_governance_speed_from_petty_bourgeoisie: "$ig_petty_bourgeoisie$ clout and approval"
 bpm_patchwork_governance_speed_from_armed_forces: "$ig_armed_forces$ clout and approval"
 bpm_patchwork_governance_speed_from_landowners: "$ig_landowners$ clout and approval"

 country_institution_application_mult: "Institutional Reach"
 country_institution_application_mult_desc: "How far the central administration can actually carry out its [Concept('concept_institution', 'Institutions')]. Scales both the #v Impact#! and the @bur![Nbsp][concept_bureaucracy] Cost of every [Concept('concept_institution', 'Institution')] other than $institution_centralization$."
 bpm_institution_application: "$country_institution_application_mult$"
 bpm_institution_application_desc: "$country_institution_application_mult_desc$"
 je_bpm_institution_application: "$country_institution_application_mult$"
 je_bpm_institution_application_reason: "$country_institution_application_mult_desc$"
