 je_bpm_the_holy_see_sees_reason:0 "#bold #tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_encyclical_progress_values 通谕的进度数值#!#!\n#bold #tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_encyclical_progress_effects 通谕可能产生的效果#!#!\n\n#bold 现任#gold 教皇#!：#! #v [GetPlayer.GetCustom('bpm_papal_name_global_variable')]#!\n#bold 现任#gold 教皇意识形态#!：#! #v [GetPlayer.GetCustom('bpm_personal_papal_ideology_global_variable')]#!\n\n时代与世界在不断变化，但这并不意味着旧的人物、事物和思想也随之而变。天主教会#bold 正是如此#!，尤其是它的心脏与头脑——#v #gold 圣座#!#!。若#bold 天主教会#!想在这变化的世界中坚守下去，它也必须回应全球性的变化。\n\n此[concept_journal_entry]记录了#v 圣座#!#bold 明察#!这日新月异的现代世界，并对种种新的现代威胁作出多彩回应、重申旧有理念的过程。各种#v 通谕#!及其形成进度，将取决于所要回应之事，以及促成其形成的种种价值观。"
