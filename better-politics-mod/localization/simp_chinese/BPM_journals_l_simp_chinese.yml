 je_bpm_women_rights_upgrade:0 "真正的性别平等"
 je_bpm_women_rights_upgrade_reason:0 "随着[GetLawType('law_womens_suffrage').GetName][Concept('concept_law', '法律')]的通过，妇女的权利在纸面上得到了保障。若我们想获得[GetLawType('law_womens_suffrage_upgraded').GetName]，就必须努力在实践中推动平等。\n\n让[GetLawType('law_womens_suffrage_upgraded').GetName]的支持者保持[Concept('concept_powerful', '强大')]或[Concept('concept_in_government', '执政')]，同时反复通过[GetLawType('law_repeatable_culture_promote_socialist_values').GetName]，将增加本条目的进度。反之，让[Concept('concept_bpm_ig_is_sexist', '反女权主义者')]保持[Concept('concept_powerful', '强大')]或[Concept('concept_in_government', '执政')]将降低本条目的进度。"
 je_bpm_multicultural_upgrade:0 "各族人民的友谊"
 je_bpm_multicultural_upgrade_reason:0 "随着[GetLawType('law_multicultural').GetName][Concept('concept_law', '法律')]的通过，种族与文化的平等只是在纸面上得到了认定。然而，国际事业最激进的倡导者们正进一步推进，倘若我们任由他们得逞，我们将转而获得[GetLawType('law_multicultural_upgraded').GetName]。\n\n让[GetLawType('law_multicultural').GetName]的支持者保持[Concept('concept_powerful', '强大')]或[Concept('concept_in_government', '执政')]，同时反复通过[GetLawType('law_repeatable_culture_affirmative_action').GetName]，将增加本条目的进度。反之，让[GetLawType('law_multicultural').GetName]的反对者保持[Concept('concept_powerful', '强大')]或[Concept('concept_in_government', '执政')]将降低本条目的进度。"
 je_bpm_total_separation_upgrade:0 "真正的世俗化"
 je_bpm_total_separation_upgrade_reason:0 "随着[GetLawType('law_total_separation').GetName][Concept('concept_law', '法律')]的通过，我们已成为一个表面上的世俗国家。倘若我们推进采纳[GetLawType('law_total_separation_upgraded').GetName]，或许有一条通往真正世俗化的道路。\n\n让[GetLawType('law_repeatable_religion_promote_secular_values').GetName]的支持者保持[Concept('concept_powerful', '强大')]或[Concept('concept_in_government', '执政')]，同时反复通过[GetLawType('law_repeatable_religion_promote_secular_values').GetName]，将增加本条目的进度。反之，让[GetLawType('law_repeatable_religion_promote_secular_values').GetName]的支持者保持[Concept('concept_powerful', '强大')]或[Concept('concept_in_government', '执政')]将降低本条目的进度。"
