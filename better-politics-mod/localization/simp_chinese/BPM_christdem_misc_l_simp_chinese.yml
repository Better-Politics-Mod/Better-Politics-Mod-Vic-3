 je_bpm_ideological_power:0 "#v 意识形态力量#!是一种“机制”，代表当地[Concept('concept_party', '保守党')]内部，无论在其#bold 隐秘的基层#!还是#bold 议会殿堂#!中，那种凝聚的统一、投入以及普遍根深蒂固的政治影响力。此[concept_journal_entry]中的双方都将根据各种数值与因素获得#v 意识形态力量#!，并可以利用各自的#v 意识形态力量#!来限制对方的增长。\n\n#v #lore 需要75#!点意识形态力量#!才能获胜，若无人达到，且时间耗尽，则将达成#v 现状#!。"
 je_bpm_new_wine_in_old_wineskins:0 "旧皮囊里的新酒"
 je_bpm_new_wine_in_old_wineskins_reason:0 "曾经相对弱小、微末、易受摆布的天主教平信徒，多年来已显著壮大，随着《新事》通谕的颁布，他们甚至开始更公开地参与政治，令保守的老派精英大为不满。\n\n往往激进而执着，[GetInterestGroupVariant('ig_christian_democrats',GetPlayer).GetNameWithCountryVariant]将不得不与狡黠的[GetInterestGroupVariant('ig_conservatives',GetPlayer).GetNameWithCountryVariant]展开一场生存之战。#v 而胜者只能有一个#!。\n\n此[concept_journal_entry]记录了一场在许多国家发生过的、高度动态且影响深远的[Concept('concept_political_strength', '政治斗争')]，交战双方是@ig_christian_democrats! #bold 基督教民主主义者#!与@ig_conservatives! #bold 古典保守主义者#!，双方都施展精明的#italic 政治手腕#!来削弱敌方的[Concept('concept_political_movement', '派系')]/[Concept('concept_interest_group', '意识形态')]，以取得无可匹敌的优势，最终#v 击败#!并#v 吞并#!败者。要使@ig_christian_democrats! 基督教民主主义者获胜，他们必须达到#v 75#!点#bold #tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_ideological_power 意识形态力量#!#!；而要使@ig_conservatives! 保守主义者获胜，他们必须通过#bold #tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_paternalistic_reforms_tooltip 家长式改革#!#!来削弱天主教徒。败者将被变成一个“派系”或一个“翼”。若无人获胜且#bold 时间耗尽#!，则双方之间将达成#v 现状#!，此[concept_journal_entry]就此终结。\n\n#lore 同样错误的是相信今日存在之物必须存续到明日乃至更久，因为身处其中感到舒适便不惜一切代价维持现状，又因为身处其中感到不适便急于求变，最终忘却了：现实中的当下，永远是一种新事态的出现，而这一出现是持续不断的。\n\n——沃伊切赫·科尔凡蒂，1927年#!"
