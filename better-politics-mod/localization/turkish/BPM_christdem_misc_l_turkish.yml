 ig_christian_democrats_rightwing: "Hristiyan Demokratlar (Sağ)"
 ig_christian_democrats_rightwing_desc: "Hristiyan Demokrat düşüncenin sağ kanadı genellikle geri kalanından daha ılımlı ve dindardır. İhtiyatlı ılımlılıkları; oy hakkının ve sosyo-ekonomik yasaların sınırlandırılmasından klerikalizme (din adamı egemenliği) ve dini refaha kadar uzanabilir. İtalyan Popülerciler (Sağ), Çek Konzervativní Lidovci, Avusturyalı Bürgerliche ve Belçikalı #italic de Broqueville#! kabinesi bunlara örnektir."

