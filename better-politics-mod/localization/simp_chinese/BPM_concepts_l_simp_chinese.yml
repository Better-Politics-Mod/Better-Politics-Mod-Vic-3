l_simp_chinese:
 concept_bpm_party_ban:0 "政党禁令"
 concept_bpm_party_ban_desc:0 "某些[Concept('concept_law', '法律')]可能导致各种[Concept('concept_party', '政党')]被禁。一旦被禁，任何[Concept('concept_interest_group','$concept_interest_groups$')]都无法加入该[Concept('concept_party', '政党')]。你的言论自由[Concept('concept_law', '法律')]决定了究竟哪些[Concept('concept_party', '政党')]最终会因政党禁令而被禁。"
 concept_bpm_bannable_parties:0 "所有政党被禁"
 concept_bpm_bannable_parties_desc:0 "审查制度会禁止所有政党，迫使其成为议会中由机构领导的“派系”。取缔异议会禁止所有政党，并制造一个由反动主义者和机构性利益集团组成的巨型“派系”。意识形态性利益集团则大多是独立人士。"
 concept_bpm_bannable_reactionaries:0 "被禁的反动派政党"
 concept_bpm_bannable_reactionaries_desc:0 "始终禁止法西斯党。审查制度（或更严厉的制度）还会禁止反动派政党。取缔异议还会禁止保守派和宗教政党。"
 concept_bpm_bannable_socialists:0 "被禁的社会主义政党"
 concept_bpm_bannable_socialists_desc:0 "始终禁止共产党和无政府主义党（以及第二国际之前的社会民主党）。审查制度（或更严厉的制度）还会禁止社会民主党（若在第二国际之后）。取缔异议还会禁止激进党。"
 concept_bpm_bannable_reactionaries_plus:0 "被禁的反社会主义政党"
 concept_bpm_bannable_reactionaries_plus_desc:0 "始终禁止法西斯党、反动派、宗教党和保守党。审查制度（或更严厉的制度）还会禁止自由党和农本党。取缔异议还会禁止激进党。"
 concept_bpm_bannable_socialists_plus:0 "被禁的反传统政党"
 concept_bpm_bannable_socialists_plus_desc:0 "始终禁止共产党、无政府主义党、社会民主党和激进党。审查制度（或更严厉的制度）还会禁止自由党和农本党。取缔异议还会禁止保守党。"
 concept_bpm_bannable_liberals:0 "被禁的自由派政党"
 concept_bpm_bannable_liberals_desc:0 "始终禁止自由党和激进党。审查制度（或更严厉的制度）还会禁止农本党。取缔异议还会禁止保守党。"
 concept_bpm_bannable_antiliberals:0 "被禁的反自由派政党"
 concept_bpm_bannable_antiliberals_desc:0 "始终禁止共产党、无政府主义党和法西斯党（以及第二国际之前的社会民主党）。审查制度（或更严厉的制度）还会禁止反动派政党（以及第二国际之后的社会民主党）。取缔异议还会禁止激进党和宗教政党。"
 concept_bpm_socialist_agitator:0 "社会主义煽动者"
 concept_bpm_socialist_agitator_desc:0 "其[Concept('concept_ideology', '意识形态')]或[Concept('concept_interest_group', '利益集团')]支持颁布[GetLawType('law_council_republic').GetName][Concept('concept_law', '法律')]的煽动者。"
 concept_bpm_global_je:0 "全局日志条目"
 concept_bpm_global_je_desc:0 "一种同时在所有国家生效的日志条目。其进度在这些国家之间共享，且影响进度的因素通常是国际性的。"
 concept_bpm_repeatable_law:0 "可重复法律"
 concept_bpm_repeatable_laws:0 "可重复法律"
 concept_bpm_repeatable_law_desc:0 "$concept_bpm_repeatable_laws$是[Concept('concept_country', '国家')]可以反复颁布的[Concept('concept_law', '法律')]，因为每一次颁布此类法律都会将其重置为默认值。\n\n$concept_bpm_repeatable_laws$产生即时效果，且颁布速度比普通法律更快。一旦通过，$concept_bpm_repeatable_law$将进入冷却期。可以同时通过多项$concept_bpm_repeatable_laws$，其效果会相互叠加。\n\n@information! #blue #v 提示：#! 当更有意义的改革尚不可行时，这些可选的法律可以占用你的立法机构。有些可重复法律带有风险性的代价，因此在颁布前务必仔细斟酌。#!"
 concept_bpm_ideological_ig:0 "意识形态性利益集团"
 concept_bpm_ideological_ig_desc:0 "意识形态性[Concept('concept_interest_group', '利益集团')]由其强烈的意识形态性质所定义。它们拥有大量的[Concept('concept_ideology', '意识形态')]，使其对广泛的[Concept('concept_law', '法律')]持有鲜明的立场。它们也是最反复无常的[Concept('concept_interest_group', '利益集团')]；它们频繁地从[Concept('concept_radical', '激进派')]或[Concept('concept_loyalist', '忠诚派')]那里获得支持者，并因国内各种事件而此消彼长。"
 concept_bpm_institutional_ig:0 "机构性利益集团"
 concept_bpm_institutional_ig_desc:0 "机构性[Concept('concept_interest_group', '利益集团')]由其相对非意识形态的性质所定义。它们只关心一小部分与其物质利益最直接相关的[Concept('concept_ideology', '意识形态')]。这些[Concept('concept_interest_group', '利益集团')]往往在[Concept('concept_bpm_politically_stagnant', '政治僵化')]的国家中占据主导地位，而在[Concept('concept_bpm_politically_unstable', '政治动荡')]期间则销声匿迹、无足轻重。"
 tooltip_bpm_ig_is_revolutionary_socialist:0 "是一个[Concept('concept_bpm_ig_is_revolutionary_socialist', '$concept_bpm_ig_is_revolutionary_socialist$')][Concept('concept_interest_group', '利益集团')]"
 concept_bpm_ig_is_revolutionary_socialist:0 "革命社会主义者"
 concept_bpm_ig_is_revolutionary_socialist_desc:0 "拥有[GetIdeology('ideology_gov_radical_proletarian').GetName][Concept('concept_ideology', '意识形态')]而没有[GetIdeology('ideology_dop_anarchist').GetName][Concept('concept_ideology', '意识形态')]的[Concept('concept_interest_group', '利益集团')]。他们认为政党组织是实现社会主义和国家消亡的必要条件。"
 tooltip_bpm_ig_is_anarchist:0 "是一个[Concept('concept_bpm_ig_is_anarchist', '$concept_bpm_ig_is_anarchist$')][Concept('concept_interest_group', '利益集团')]"
 concept_bpm_ig_is_anarchist:0 "无政府主义者"
 concept_bpm_ig_is_anarchist_desc:0 "拥有[GetIdeology('ideology_dop_anarchist').GetName]或[GetIdeology('ideology_dop_anarcho_syndicalist').GetName][Concept('concept_ideology', '意识形态')]的[Concept('concept_interest_group', '利益集团')]。他们以废除一切等级制度、尤其是国家，作为其直接目标。"
 tooltip_bpm_ig_is_radical_socialist:0 "是一个[Concept('concept_bpm_ig_is_radical_socialist', '$concept_bpm_ig_is_radical_socialist$')][Concept('concept_interest_group', '利益集团')]"
 concept_bpm_ig_is_radical_socialist:0 "激进社会主义者"
 concept_bpm_ig_is_radical_socialist_desc:0 "@ig_socialists! #bold 社会主义者#![Concept('concept_interest_group', '利益集团')]，或是一个[Concept('concept_bpm_ig_is_revolutionary_socialist', '革命社会主义者')]或[Concept('concept_bpm_ig_is_anarchist', '无政府主义者')][Concept('concept_interest_group', '利益集团')]。他们认为社会主义应当通过革命而非改良来实现。"
 tooltip_bpm_ig_is_reformist_socialist:0 "是一个[Concept('concept_bpm_ig_is_reformist_socialist', '$concept_bpm_ig_is_reformist_socialist$')][Concept('concept_interest_group', '利益集团')]"
 concept_bpm_ig_is_reformist_socialist:0 "改良社会主义者"
 concept_bpm_ig_is_reformist_socialist_desc:0 "@ig_reformist_socialists! #bold 改良社会主义者#![Concept('concept_interest_group', '利益集团')]，或是拥有[GetIdeology('ideology_gov_moderate_proletarian').GetName][Concept('concept_ideology', '意识形态')]的[Concept('concept_interest_group', '利益集团')]。他们相信可以通过改良而非革命来达到社会主义。"
 tooltip_bpm_ig_is_syndicalist:0 "是一个[Concept('concept_bpm_ig_is_syndicalist', '$concept_bpm_ig_is_syndicalist$')][Concept('concept_interest_group', '利益集团')]"
 concept_bpm_ig_is_syndicalist:0 "工团主义者"
 concept_bpm_ig_is_syndicalist_desc:0 "拥有[GetIdeology('ideology_dop_syndicalist').GetName]、[GetIdeology('ideology_dop_anarcho_syndicalist').GetName]或[GetIdeology('ideology_dop_syndical_unionist').GetName][Concept('concept_ideology', '意识形态')]的[Concept('concept_interest_group', '利益集团')]。他们认为工会在社会主义下应当成为社会的基石。"
 tooltip_bpm_ig_is_party_socialist:0 "是一个[Concept('concept_bpm_ig_is_party_socialist', '$concept_bpm_ig_is_party_socialist$')][Concept('concept_interest_group', '利益集团')]"
 concept_bpm_ig_is_party_socialist:0 "政党社会主义者"
 concept_bpm_ig_is_party_socialist_desc:0 "一个[Concept('concept_bpm_ig_is_revolutionary_socialist', '革命社会主义者')]或[Concept('concept_bpm_ig_is_reformist_socialist', '改良社会主义者')][Concept('concept_interest_group', '利益集团')]。他们认为一个有纪律的政党结构是通向社会主义的必要一步。"
 tooltip_bpm_ig_is_authoritarian_socialist:0 "是一个[Concept('concept_bpm_ig_is_authoritarian_socialist', '$concept_bpm_ig_is_authoritarian_socialist$')][Concept('concept_interest_group', '利益集团')]"
 concept_bpm_ig_is_authoritarian_socialist:0 "威权社会主义者"
 concept_bpm_ig_is_authoritarian_socialist_desc:0 "一个[Concept('concept_bpm_ig_is_socialist', '革命社会主义者')]且拥有[GetIdeology('ideology_dop_party_socialist').GetName]或[GetIdeology('ideology_dop_party_state').GetName][Concept('concept_ideology', '意识形态')]的[Concept('concept_interest_group', '利益集团')]。他们认为需要一个社会主义国家来保卫革命的成果。"
 tooltip_bpm_ig_is_moderate_socialist:0 "是一个[Concept('concept_bpm_ig_is_moderate_socialist', '$concept_bpm_ig_is_moderate_socialist$')][Concept('concept_interest_group', '利益集团')]"
 concept_bpm_ig_is_moderate_socialist:0 "温和社会主义者"
 concept_bpm_ig_is_moderate_socialist_desc:0 "一个[Concept('concept_bpm_ig_is_party_socialist', '政党社会主义者')]且既没有[GetIdeology('ideology_gov_radical_proletarian').GetName]也没有[GetIdeology('ideology_gov_moderate_proletarian').GetName][Concept('concept_ideology', '意识形态')]，或拥有[GetIdeology('ideology_eco_agrarian_socialist').GetName][Concept('concept_ideology', '意识形态')]的[Concept('concept_interest_group', '利益集团')]。他们认为眼下建立完全社会主义的经济和国家为时过早，但仍信奉某些进步性的改革。"
 tooltip_bpm_ig_is_proletarian_socialist:0 "是一个[Concept('tooltip_bpm_ig_is_proletarian_socialist', '$tooltip_bpm_ig_is_proletarian_socialist$')][Concept('concept_interest_group', '利益集团')]"
 concept_bpm_ig_is_proletarian_socialist:0 "无产阶级社会主义者"
 concept_bpm_ig_is_proletarian_socialist_desc:0 "一个[Concept('concept_bpm_ig_is_party_socialist', '政党社会主义者')]、[Concept('concept_bpm_ig_is_anarchist', '无政府主义者')]或[Concept('concept_bpm_ig_is_syndicalist', '工团主义者')][Concept('concept_interest_group', '利益集团')]。他们认为产业工人阶级——即无产阶级——是带来社会主义的首要阶级。"
 tooltip_bpm_ig_is_socialist:0 "是一个[Concept('concept_bpm_ig_is_socialist', '$concept_bpm_ig_is_socialist$')][Concept('concept_interest_group', '利益集团')]"
 concept_bpm_ig_is_socialist:0 "社会主义者"
 concept_bpm_ig_is_socialist_desc:0 "一个[Concept('concept_bpm_ig_is_proletarian_socialist', '无产阶级社会主义者')]或拥有[GetIdeology('ideology_eco_agrarian_socialist').GetName][Concept('concept_ideology', '意识形态')]的[Concept('concept_interest_group', '利益集团')]。他们认为确保生产资料和治理权直接由人民掌控——即社会主义——是一个值得追求的目标。"
 tooltip_bpm_ig_is_proletarian:0 "是一个[Concept('concept_bpm_ig_is_proletarian', '$concept_bpm_ig_is_proletarian$')][Concept('concept_interest_group', '利益集团')]"
 concept_bpm_ig_is_proletarian:0 "无产者"
 concept_bpm_ig_is_proletarian_desc:0 "在未处于[GetLawType(law_corporatized_unions').GetName]之下的#bold 工会#![Concept('concept_interest_group', '利益集团')]，或是一个[Concept('concept_bpm_ig_is_proletarian_socialist', '无产阶级社会主义者')][Concept('concept_interest_group', '利益集团')]。他们在这个变革时代代表着产业工人的诉求。"
 tooltip_bpm_ig_is_labor:0 "是一个[Concept('concept_bpm_ig_is_labor', '$concept_bpm_ig_is_labor$')][Concept('concept_interest_group', '利益集团')]"
 concept_bpm_ig_is_labor:0 "劳工"
 concept_bpm_ig_is_labor_desc:0 "一个[Concept('concept_bpm_ig_is_socialist', '社会主义者')]或[Concept('concept_bpm_ig_is_proletarian', '无产者')][Concept('concept_interest_group', '利益集团')]。他们信奉支持劳动人民的诉求。"
 tooltip_bpm_ig_is_actually_desiring_socialism:0 "是一个[Concept('concept_bpm_ig_is_actually_desiring_socialism', '$concept_bpm_ig_is_actually_desiring_socialism$')][Concept('concept_interest_group', '利益集团')]"
 concept_bpm_ig_is_actually_desiring_socialism:0 "真正社会主义者"
 concept_bpm_ig_is_actually_desiring_socialism_desc:0 "一个既是[Concept('concept_bpm_ig_is_socialist', '社会主义者')]又#bold 不是#![Concept('concept_bpm_ig_is_moderate_socialist', '温和社会主义者')]的[Concept('concept_interest_group', '利益集团')]。他们认为社会主义可以也应当在相对不远的将来建成。"
 tooltip_bpm_ig_is_agrarian:0 "是一个[Concept('concept_bpm_ig_is_agrarian', '$concept_bpm_ig_is_agrarian$')][Concept('concept_interest_group', '利益集团')]"
 concept_bpm_ig_is_agrarian:0 "农本主义者"
 concept_bpm_ig_is_agrarian_desc:0 "拥有[GetIdeology('ideology_eco_agrarian_socialist').GetName]、[GetIdeology('ideology_eco_modern_agrarian').GetName]、[GetIdeology('ideology_eco_traditional_agrarian').GetName]、[GetIdeology('ideology_eco_slave_economy').GetName]、[GetIdeology('ideology_eco_serf_economy').GetName]、[GetIdeology('ideology_eco_trad_isolationist').GetName]或[GetIdeology('ideology_eco_agrarian_autarky').GetName][Concept('concept_ideology', '意识形态')]的[Concept('concept_interest_group', '利益集团')]。他们支持优先考虑农业需求，将其视为经济重心。"
 tooltip_bpm_ig_wants_small_government:0 "是一个[Concept('concept_bpm_ig_wants_small_government', '$concept_bpm_ig_wants_small_government$')][Concept('concept_interest_group', '利益集团')]"
 concept_bpm_ig_wants_small_government:0 "小政府"
 concept_bpm_ig_wants_small_government_desc:0 "拥有[GetIdeology('ideology_sta_minimal_state').GetName]、[GetIdeology('ideology_sta_decentralized_state').GetName]、[GetIdeology('ideology_sta_subjugated_state').GetName]或[GetIdeology('ideology_sta_weak_state').GetName][Concept('concept_ideology', '意识形态')]的[Concept('concept_interest_group', '利益集团')]。他们认为，为了社会的福祉，需要一个不干预其公民（或至少是其群体支持者）的小政府。"
 tooltip_bpm_ig_is_pro_serfdom:0 "是一个[Concept('concept_bpm_ig_is_pro_serfdom', '$concept_bpm_ig_is_pro_serfdom$')][Concept('concept_interest_group', '利益集团')]"
 concept_bpm_ig_is_pro_serfdom:0 "拥护农奴制"
 concept_bpm_ig_is_pro_serfdom_desc:0 "拥有[GetIdeology('ideology_eco_serf_economy').GetName]、[GetIdeology('ideology_eco_trad_isolationist').GetName]或[GetIdeology('ideology_eco_debt_serf_economy').GetName][Concept('concept_ideology', '意识形态')]的[Concept('concept_interest_group', '利益集团')]。他们谋求保留农奴被束缚于大型农业庄园的传统结构。"
 tooltip_bpm_ig_is_democrat:0 "是一个[Concept('concept_bpm_ig_is_democrat', '$concept_bpm_ig_is_democrat$')][Concept('concept_interest_group', '利益集团')]"
 concept_bpm_ig_is_democrat:0 "民主主义者"
 concept_bpm_ig_is_democrat_desc:0 "拥有[GetIdeology('ideology_dop_radical_democrat').GetName]、[GetIdeology('ideology_dop_moderate_democrat').GetName]或[GetIdeology('ideology_dop_authoritarian_democrat').GetName][Concept('concept_ideology', '意识形态')]的[Concept('concept_interest_group', '利益集团')]。他们认为，任何想要在现代世界生存下去的国家，都至少需要某种形式的选举权。"
 tooltip_bpm_ig_is_republican:0 "是一个[Concept('concept_bpm_ig_is_republican', '$concept_bpm_ig_is_republican$')][Concept('concept_interest_group', '利益集团')]"
 concept_bpm_ig_is_republican:0 "共和主义者"
 concept_bpm_ig_is_republican_desc:0 "拥有[GetIdeology('ideology_gov_liberal_republican').GetName]或[GetIdeology('ideology_gov_radical_republican').GetName][Concept('concept_ideology', '意识形态')]的[Concept('concept_interest_group', '利益集团')]。他们认为君主制是旧时代的遗物，最好予以废除，代之以自由共和国。"
 tooltip_bpm_ig_is_radical_liberal:0 "是一个[Concept('concept_bpm_ig_is_radical_liberal', '$concept_bpm_ig_is_radical_liberal$')][Concept('concept_interest_group', '利益集团')]"
 concept_bpm_ig_is_radical_liberal:0 "激进自由主义者"
 concept_bpm_ig_is_radical_liberal_desc:0 "@ig_radicals! #bold 激进主义者#![Concept('concept_interest_group', '利益集团')]，或是拥有[GetIdeology('ideology_dop_radical_democrat').GetName][Concept('concept_ideology', '意识形态')]且#bold 不是#![Concept('concept_bpm_ig_is_actually_desiring_socialism', '$concept_bpm_ig_is_actually_desiring_socialism$')][Concept('concept_interest_group', '利益集团')]的[Concept('concept_interest_group', '利益集团')]。他们认为人民拥有政府必须尊重的固有权利，并为实现自由主义的平等主义和个人主义梦想而奋斗。"
 tooltip_bpm_ig_is_moderate_liberal:0 "是一个[Concept('concept_bpm_ig_is_moderate_liberal', '$concept_bpm_ig_is_moderate_liberal$')][Concept('concept_interest_group', '利益集团')]"
 concept_bpm_ig_is_moderate_liberal:0 "温和自由主义者"
 concept_bpm_ig_is_moderate_liberal_desc:0 "@ig_liberals! #bold 自由主义者#![Concept('concept_interest_group', '利益集团')]，或是拥有[GetIdeology('ideology_dop_moderate_democrat').GetName][Concept('concept_ideology', '意识形态')]的[Concept('concept_interest_group', '利益集团')]。他们信奉推动民主，但认为需要以温和的步伐来防止革命的混乱。"
 tooltip_bpm_ig_is_non_religious:0 "是一个[Concept('concept_bpm_ig_is_non_religious', '$concept_bpm_ig_is_non_religious$')][Concept('concept_interest_group', '利益集团')]"
 concept_bpm_ig_is_non_religious:0 "世俗主义者"
 concept_bpm_ig_is_non_religious_desc:0 "拥有[GetIdeology('ideology_rel_radical_secularist').GetName]或[GetIdeology('ideology_rel_atheist').GetName][Concept('concept_ideology', '意识形态')]的[Concept('concept_interest_group', '利益集团')]。他们坚信宗教应当被排除在政府之外，尤其是政府的制度和法律之外。"
 tooltip_bpm_ig_is_liberal:0 "是一个[Concept('concept_bpm_ig_is_liberal', '$concept_bpm_ig_is_liberal$')][Concept('concept_interest_group', '利益集团')]"
 concept_bpm_ig_is_liberal:0 "自由主义者"
 concept_bpm_ig_is_liberal_desc:0 "[GetInterestGroupVariant('ig_national_liberals', GetPlayer).GetName]、[GetInterestGroupVariant('ig_market_liberals', GetPlayer).GetName]，或是一个[concept_bpm_ig_is_radical_liberal]或[concept_bpm_ig_is_moderate_liberal][concept_interest_group]。他们信奉保障所有人的生命、自由和财产的理想。"
