l_turkish:
 ideology_nonexistent:0 "Başlatılmamış"
 ideology_nonexistent_desc:0 "#lore Bu çıkar grubu veya lider henüz başlatılmadı. Eğer başlatılmamış bir çıkar grubunun nüfuzu sıfırdan farklıysa, lütfen bunu BPM geliştiricilerine bir hata (bug) olarak bildirin! #!"
 ideology_placeholder_leader:0 "$ideology_nonexistent$"
 ideology_placeholder_leader_desc:0 "$ideology_nonexistent_desc$"
 ideology_center_leader:0 "Merkez"
 ideology_center_leader_desc:0 "#lore Bu lider, grubu için ideolojik geleneklere sıkı sıkıya bağlıdır. #!"
 ideology_moderate_desc:0 "#lore Bu liderin kendine has belirgin bir ideolojisi yoktur, ancak genel olarak daha ılımlı yaklaşımları tercih eder. #!"

 ideology_social_democrat:0 "Emek Radikali"
 ideology_social_democrat_desc:0 "#lore Bu lider, genel olarak radikal işçi hareketleri geleneğine uyan kendine özgü bir ideolojiyi takip eder. Daha radikal sosyalistlerin aksine, bu lider burjuva cumhuriyetini devirmeye çalışmaz, onun içinde kalarak işleri yürütmeye çabalar. #!"

 ideology_socialist_leader:0 "Sosyalist"
 ideology_socialist_leader_desc:0 "#lore Bu lider, Birinci Enternasyonal'de anarşistlere karşı çıkan geniş solcu geleneğe mensuptur. #!"

 ideology_agrarian_socialist_leader:0 "Tarım Sosyalisti"
 ideology_agrarian_socialist_leader_desc:0 "#lore Bu lider, kapitalizmin getirdiği sanayileşmeye genel olarak karşı çıkan tarım sosyalistlerinin geniş geleneğine mensuptur. #!"

 ideology_luddite:0 "Radikal Tarımcı"
 ideology_humanitarian:0 "Liberal İlerici"
 ideology_positivist:0 "Teknokrat"

 ideology_physiocrat:0 "Fizyokrat"
 ideology_physiocrat_desc:0 "#lore Bu lider, fizyokratik ekonomi okulunu takip eder. Bir ekonominin en değerli unsurunun ve artık zenginliğin yegane kaynağının tarımsal kalkınma olduğuna inanır. Bu artığın, bırakınız yapsınlar (laissez-faire) politikaları ve sabit bir arazi vergisiyle en üst düzeye çıkarılabileceğini savunur. #!"
 
 ideology_cameralist:0 "Kameralist"
 ideology_cameralist_desc:0 "#lore Bu lider, modern bir ihracat ekonomisinin genişletilmesi yoluyla devletin zenginliğini en üst düzeye çıkarmak için ekonomide reform yapılması gerektiğine inanır.#!"

 ideology_against_single_party:0 "Tek Parti Muhalefeti"
 ideology_against_single_party_desc:0 "#lore Bu grup, mevcut tek yasal partinin devrilmesi gerektiğine inanır. #!"
 ideology_pro_single_party:0 "Tek Parti Destekçileri"
 ideology_pro_single_party_desc:0 "#lore Bu grup, mevcut Tek Parti devletinden yanadır. #!"

 ideology_corporatist_leader:0 "Sosyal Paternalist"
 ideology_liberal_leader:0 "Liberal Demokrat"

 ideology_serfdom_reformer:0 "Serflik Reformcusu"
 ideology_serfdom_reformer_desc:0 "#lore Bu lider, serfliğin asgari düzeyde de olsa bazı reformlara ihtiyaç duyan bir kurum olduğuna inanır. #!"

 ideology_anarchist_syndicalist:0 "Anarko-Sendikalist"
 ideology_anarchist_syndicalist_desc:0 "$ideology_anarchist_desc$"

 ideology_syndicalist:0 "Sendikalist"
 ideology_syndicalist_desc:0 "$ideology_syndicalist$"

 ideology_donghak:0 "Donghak"
 ideology_donghak_desc:0 "#lore \"Doğu Öğretisi\" anlamına gelen Donghak'ın takipçileri, eski Kore geleneklerinin yenilenmesi ve reformlar yoluyla daha ilerici ve bağımsız bir toplum inşa ederek batı etkisini defetmeyi amaçlarlar. #!"

 ideology_tridemism:0 "Tridemist"
 ideology_tridemism_desc:0 "#lore Tridemizm veya Halkın Üç İlkesi, devrimci Sun Yat-sen'in fikirlerinden türetilmiş bir siyasi felsefedir. Söz konusu üç ilke Milliyetçilik, İrade (Demokrasi) ve Refah'tır. Çeşitli Çin siyasi fraksiyonları tarafından geniş çapta farklı yorumlansa da, Tridemizm'in amacı güçlü ve egemen bir Çin ulusu inşa etmektir. #!"

 ideology_dop_metropole_loyalist:0 "Metropol Sadığı"
 ideology_dop_metropole_loyalist_desc:0 "#lore Bu grup metropole (ana vatana) sadıktır. #!"

 ideology_reconstructionist:0 "Radikal Yeniden İnşacı"
 ideology_reconstructionist_desc:0 "#lore Bu lider, Güney'in Yeniden İnşasını ve Gerçek Eşitliği destekler. #!"

 ideology_dove:0 "Barışçıl"
 ideology_dove_desc:0 "#lore Bu lider dış politikada diplomatik yaklaşımı tercih eder. #!"

 ideology_revolutionary_hawk:0 "Devrimci Şahin"
 ideology_revolutionary_hawk_desc:0 "#lore Bu lider, ilerici politikalarının tüm dünyaya aktif olarak dayatılması gerektiğine, gerekirse bunun silah zoruyla yapılması gerektiğine inanır. #!"