# SPRINGTIME OF THE PEOPLES
 je_march_to_radicalism:0 "Devrimin Hayaleti"
 je_march_to_radicalism_status:0 "Bir barut fıçısı doluyor."
 je_march_to_radicalism_awaiting_spark_status:0 "Devrimci bir kıvılcım bekleniyor."
 je_march_to_radicalism_reason:0 "Fransız Devrimi'nin mirası, Avrupa'nın kadim güçlerini sarsmasından yaklaşık 50 yıl sonra yankılanmaya devam ediyor. Liberalizmin yeniden dirilişinin yeni keşfedilen ulusal bilinçle buluşmasıyla, Burjuvalar ve Proleterler eskinin çürümüş sistemlerini yıkmaya çalışacaklar.\n\n#v Bu bir [Concept('concept_bpm_global_je', 'Küresel Günlük Kaydıdır')].#! Avrupa'daki bir ülke şunları her yaptığında #P ilerleme kazanır#:\n#P +#! #YB Eşitlikçilik#!, #YB Milliyetçilik#! veya #YB Diyalektik#! araştırması\n#P +#! Ülke [concept_rank] (Kademesine) göre ayarlanan bir [concept_civil_war] yaşaması\n\nAyrıca, şunlar için biraz #P yıllık ilerleme#! eklenir:\n#P +#! Bir Avrupa [Concept('concept_great_power', 'Büyük Gücündeki')] her radikal sol [concept_agitator] veya [concept_politician]\n#P +#! Her Avrupa [Concept('concept_great_power', 'Büyük Gücünde')] [Concept('concept_expected_sol','Minimum Yaşam Standardının')] altındaki nüfus\n\nBu kayıt ilerledikçe, @ig_radicals! #YB Radikallerin#! popülaritesinde bir artış görülecek ve Avrupa çapındaki ülkeler nüfuslarının kitlesel olarak radikalleştiğine tanık olacaklar. Tamamlandığında Avrupa, milliyetçilik ve demokrasi için devrimci hareketlerin bir dalgasıyla karşı karşıya kalacak. Henüz #YB Eşitlikçilik#! araştırmamış olan ülkelerde, bu teknoloji de kademeli olarak araştırma ilerlemesi kazanacaktır.\n\n#lore \"Özgürlüğün davası insanlığın kaderiyle özdeşleşmiştir ve dünyanın neresinde yavaş yavaş zemin kazanırsa, onu arzulayan herkes için ortak bir kazanç olacaktır.\"\n\n—Lajos Kossuth, 1849#!"
 bpm_peoples_springtime_spark_happened:0 "Avrupa'da bir #v Devrimci Kıvılcım#! patlak verdi."
 bpm_activate_je_springtimes:0 "#v Ulusların Baharı'nı#! etkinleştirin."

 je_springtime_of_the_peoples_status:0 "Fırtınayı atlatın."
 je_springtime_of_the_peoples_reason:0 "Avrupa'nın dört bir yanında çeşitli halklar bayraklar çekip değişim için yürüyorlar. Göz kamaştırıcı pankartlarına geçmiş bir neslin yasaklı sözcükleri yazılı: #gold Özgürlük, Eşitlik, Kardeşlik#!.\n\nBu dönemin sonunda, ülkeniz aşağıdaki durumlardaysa #gold Devrimciler#! galip gelecektir:\n- Bir #yellow Cumhuriyet#! ise ve\n- #yellow Servete Dayalı Oy Hakkı#! veya #v daha iyisine#! sahipse.\n\nÖte yandan, şu durumlarda #purple Gericiler#! galip gelecektir:\n- [GetInterestGroupVariant('ig_radicals',GetPlayer).GetName] ve [GetInterestGroupVariant('ig_socialists',GetPlayer).GetName] [concept_marginalized] durumdaysa.\n\nAksi takdirde, ülkeniz reforme edilmiş bir statükoyu korur.\n\n#lore Üçüncü Sınıf nedir? Her şey.\n—Abbé Sieyès, 1788#!#!"

# FRANKFURT PARLIAMENT
 je_frankfurt_parliament:0 "Frankfurt Parlamentosu"
 # idk what frankfurt_debate_stage is supposed to be so i just commented this out to silence the error since its disabled anyway right now sorry --helvetica
 #je_frankfurt_parliament_status:0 "[SCOPE.GetRootScope.GetCountry.GetCustom('frankfurt_debate_stage')]" 
 je_frankfurt_parliament_status:0 "je_frankfurt_parliament_status"
 je_frankfurt_parliament_reason:0 "Kutsal Roma İmparatorluğu'nun Napolyon tarafından feshedilip yerine #yellow Alman Konfederasyonunun#! kurulmasından bu yana, Alman millet olma hareketi, Alman devletlerinde artan sivil haklar ve anayasal yönetim arzusuyla birlikte büyüdü. Şimdi, devrimci ateş Avrupa'yı kasıp kavururken, birçok eyalet artan baskıya boyun eğdi ve vekillerin konfederasyonu merkezileştirecek yeni bir Alman anayasası konusunu tartışacağı #yellow Frankfurt'ta#! bir #yellow Ulusal Meclis#! oluşturmaya başladı.\n\nBu günlüğün ilerlemesi ve meclisteki fraksiyonların bileşimi, katılan devletlerdeki radikal-sol, liberal ve muhafazakar Çıkar Gruplarının toplam gücü tarafından belirlenir. Daha güçlü bir sol kanat veya liberal fraksiyon ilerlemeyi hızlandıracaktır.\n\nBu günlük kaydında kaydedilen her 10 ilerleme için Meclis, yeni Alman Anayasasına ilişkin bir konuyu oylayacaktır. Belirli kararlar bazı delegasyonların meclisi boykot etmesine neden olabilir.\n\nMeclis, devrim sönmeden önce bir anayasaya son şeklini vermelidir, aksi takdirde #pink tamamen feshedilecektir.#!\n\nEgemen fraksiyonsalar ve büyük güç rütbesindeki veya daha üstündeki en az bir Alman ülkesi sol kanat hükümete veya cumhuriyete sahipse, Radikal bir zafer elde edilir. Egemenlik kurarlarsa ve Avusturya İmparatorluğunu masada tutarlarsa Muhafazakarlar kazanacaktır. Aksi takdirde, anayasayı bir taç adayına sunarak ılımlı bir sonuca ulaşılacaktır.\n\n#lore Maas'tan Memel'e, Adige'den Belt'e kadar Almanya. Almanya, her şeyin üstünde, dünyadaki her şeyin üstünde!\n—Almanların Şarkısı (Das Lied der Deutschen), August Heinrich Hoffmann, 1841#!"
 je_frankfurt_button:0 "Meclise Genel Bakış"
 je_frankfurt_button_desc:0 "Delegasyonların genel bir görünümünü açar."
 je_frankfurt_boycott_button:0 "Parlamentoyu Boykot Et"
 je_frankfurt_boycott_button_desc:0 "Frankfurt Parlamentosunun tanınmasını tamamen geri çek. #red Bu durum liberalleri ve solcuları öfkelendirecektir!#!"
 je_frankfurt_boycott_button_tt:0 "Frankfurt Parlamentosunu henüz boykot etmedi"
 frankfurt_fail_tt:0 "Meclis dağıldı veya Ulusların Baharı bitmeden anayasayı tamamlayamadı."
 frankfurt_win_tt:0 "Meclis anayasayı zamanında tamamlar ve bir imparator veya başka bir devlet başkanı seçer."
 frankfurt_dissolved_tt:0 "#red Uyum ve katılım eksikliği meclisin dağılmasına neden olacaktır!"
 
 bpm_je_trigger_natlibs_germany:0 "#variable Büyük Güç#! veya daha üstü bir [concept_rank] rütbesine sahip olun ve @ig_national_liberals! nüfuzu %5'in üzerinde olsun."

# FIRST INTERNATIONALE
 je_bpm_first_international:0 "Bütün Ülkelerin İşçileri, Birleşin!"
 je_bpm_first_international_status:0 "Birinci Enternasyonal'i bekleyin."
 je_bpm_first_international_reason:0 "#v Sanayi Devrimi#! yeni bir insan türü yaratıyor — emek gücünden başka her şeyi elinden alınmış, köyünün o kadim sıcaklığından koparılmış ve sert fabrika zeminlerinde kendini parça parça satmaya zorlanan Proleter. Orada, kendisi gibi harika bir şeyden fısıldaşmaya başlayan milyonlarla temasa geçiyor. Orada, yakında geçmişin tüm kapalı konforlarını aşan parlak bir gelecek bulabilir. Orada, #pink Sosyalizm'i#! bulacaktır.\n\nBu bir [Concept('concept_bpm_global_je', 'Küresel Günlük Kaydıdır')]. Bir [Concept('concept_great_power', 'Büyük Güç')] her #bold Sosyalizm#!, #bold Anarşizm#! veya daha az ölçüde #bold İşçi Hareketi#! araştırdığında ilerleme kazanır. Eğer bir [Concept('concept_great_power', 'Büyük Güç')] milliyetçi bir ayrılıkçılıktan muzdarip olursa, bu Günlük Kaydı daha da fazla ilerleme kazanacaktır. Ayrıca, bir [Concept('concept_great_power', 'Büyük Güçte')] bulunan her [Concept('concept_bpm_socialist_agitator', 'Sosyalist Agitatör')], bu Günlük Kaydının her yıl yavaşça ilerlemesine neden olacaktır.\n\nTamamlandığında, @ig_socialists! #bold Sosyalistler#! ve @ig_anarchists! #bold Anarşistler#! uzlaşmaz bir bölünmeye uğrayacak, aynı zamanda her iki ideolojiyi de kitleler için daha cazip hale getirecektir.\n\n#lore \"Şimdiye kadar halkın gerçek bir siyaseti hiç olmadı ve 'halk' derken aşağı sınıfları, 'ayak takımını', emeğiyle dünyayı ayakta tutan en fakir işçileri kastediyoruz. Yalnızca ayrıcalıklı sınıfların, hiç bitmeyen üstünlük mücadelesinde birbirlerini devirmek ve yerlerini almak için halkın fiziksel gücünü kullananların siyaseti oldu. Halk, en azından bu siyasi değişikliklerden birinde... yüzyıllık yoksulluklarının ve köleliklerinin hafifletileceği gibi boş bir umutla desteğini bir taraftan diğerine kaydırdı. Büyük Fransız Devrimi bile temelde onların statüsünü değiştirmedi. Sadece soyluluğu ortadan kaldırıp yerine burjuvaziyi geçirdi. Halka artık serf denmiyor. Onlar özgür insanlar ilan edildiler, hukuken özgür doğan vatandaşların tüm haklarına sahipler; ama gerçekte yoksulluk çeken serfler olarak kalıyorlar.\"\n\n—Mihail Bakunin, 1869#!"

# SECOND INTERNATIONALE
 bpm_first_intl_happened:0 "#pink Birinci Enternasyonal#! zaten kuruldu."
 je_bpm_second_international:0 "İkinci Bir Birlik"
 je_bpm_second_international_status:0 "İkinci Enternasyonal'i bekleyin."
 je_bpm_second_international_reason:0 "Birinci Enternasyonal'in (dağılmasından sonra bilinen adıyla) başarısızlıkları, çeşitli sosyalist hareketler arasındaki işbirliğini küresel düzeyde daha da zorlaştırdı. Ancak dağılmasından bu yana çok şey değişti. Sosyalist harekete daha büyük bir düşünce çeşitliliği girdi ve çoğu zaman bir kez daha birlikte çalışma önerisi farklı gruplar tarafından yapıldı.\n\nBu bir [Concept('concept_bpm_global_je', 'Küresel Günlük Kaydıdır')]. Mevcut koşullarda, günlüğün ilerlemesi her ay #tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_second_international_tooltip [GetGlobalVariable('bpm_je_second_intl_progress_rate').GetValue|+=]#! oranında değişecektir. Tamamlandığında, @ig_revolutionist_socialists! #bold Devrimci Sosyalistler#! ve @ig_reformist_socialists! #bold Reformist Sosyalistler#! uzlaşmaz bir bölünmeye uğrayacak, aynı zamanda mevcut tüm [Concept('concept_bpm_ig_is_socialist', 'Sosyalist')] [Concept('concept_interest_group', 'Çıkar Gruplarının')] daha fazla takipçi kazanmasını sağlayacaktır.\n\n#lore \"Bir düşünün: Tüm hareketimizin sosyalist karakterini gerçekten ne oluşturuyor? Gerçekten pratik mücadele üç kategoriye ayrılır: sendika mücadelesi, sosyal reformlar için mücadele ve kapitalist devleti demokratikleştirme mücadelesi. Mücadelemizin bu üç biçimi gerçekten sosyalizm midir? Hiç de değil. Önce sendikal hareketi ele alalım! İngiltere'ye bakın: Orada sadece sosyalist olmamakla kalmıyor, aynı zamanda bazı açılardan sosyalizme engel teşkil ediyor. Sosyal reform Akademik Sosyalistler, Nasyonal Sosyalistler ve benzeri tipler tarafından da vurgulanmaktadır. Ve demokratikleşme özellikle burjuvadır. Burjuvazi, bizden önce zaten pankartına demokrasiyi yazmıştı.\"\n\n—Rosa Luxemburg, 1898#!"

 je_bpm_second_international_tooltip:0 "İlerleme aşağıdakiler tarafından belirlenir:\n#variable [GetGlobalVariable('bpm_je_second_intl_progress_from_base').GetValue|+=]#! temel değer\n#variable [GetGlobalVariable('bpm_je_second_intl_progress_from_powerful_igs').GetValue|+=]#! her [Concept('concept_great_power', 'Büyük Güçteki')] Güçlü [Concept('concept_bpm_ig_is_socialist', 'Sosyalist')] [Concept('concept_interest_group', 'Çıkar Gruplarından')]\n#variable [GetGlobalVariable('bpm_je_second_intl_progress_from_influential_igs').GetValue|+=]#! her [Concept('concept_great_power', 'Büyük Güçteki')] Etkili [Concept('concept_bpm_ig_is_socialist', 'Sosyalist')] [Concept('concept_interest_group', 'Çıkar Gruplarından')]\n#variable [GetGlobalVariable('bpm_je_second_intl_progress_from_agitators').GetValue|+=]#! her [Concept('concept_great_power', 'Büyük Güçteki')] aktif [Concept('concept_bpm_socialist_agitator', 'Sosyalist Agitatörlerden')]\n#variable [GetGlobalVariable('bpm_je_second_intl_progress_from_socialist_movements').GetValue|+=]#! her [Concept('concept_great_power', 'Büyük Güçteki')] aktif [Concept('concept_political_movement', 'Sosyalist Hareketlerden')]"

# AGRARIAN SOCIALISM
 je_bpm_agrarian_socialism:0 "Tarım Sosyalizmi"
 je_bpm_agrarian_socialism_status:0 "Tarım Sosyalisti düşüncenin gelişimini izleyin"
 je_bpm_agrarian_socialism_status_1:0 "Sosyalistler Köylülerden izole edilmiştir."
 je_bpm_agrarian_socialism_status_2:0 "Sosyalistler Köylülüğe ilgi duyuyor."
 je_bpm_agrarian_socialism_status_3:0 "Sosyalistler kırsal işçilere adapte oldu!"
 je_bpm_agrarian_socialism_reason:0 "#v İlerleme Hızı:#! ayda #tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_agrarian_socialism_rate_tooltip [Country.MakeScope.ScriptValue('bpm_je_agrarian_socialism_rate')|+]#!.\n\nBazı sosyalist düşünürler devrim potansiyeli olan tek sınıfın proletarya olduğuna inanırlar. Kırsal nüfusa daha yatkın olanlara göre bu inanç dar görüşlüdür: Ne de olsa köylüler de [Country.GetName] içinde kentli işçiler kadar ezilmiyor mu? En azından sayıları, sosyalistlerin onları devrimci stratejilerine dahil etmelerini zorunlu kılıyor.\n\nBu Günlük Kaydı, Günlük ilerlemesi ve bir [concept_technology] (Teknoloji) ile geçilen #v üç bölüme#! ayrılmıştır. Her bölüm yeni bir etki ekler:\n (1) #v %0#!: Gereksinim yok.\n    @ig_socialists!@ig_anarchists! #yellow Sosyalistler#! ve [GetInterestGroupVariant('ig_agrarian_populists', GetPlayer).GetName], @peasants!/@farmers! ile ivme kazanır.\n (2) #v %33#!: #gold Kitle Partileri#! gerektirir.\n    [GetInterestGroupVariant('ig_agrarian_populists', GetPlayer).GetName], bir #green Tarım Sosyalisti#! Lider kazanır.\n (3) #v %66#!: #gold Siyasi Ajitasyon#! gerektirir.\n    [GetInterestGroupVariant('ig_agrarian_populists', GetPlayer).GetName], kalıcı olarak #green Tarım Sosyalistleri#! haline gelir.\n\n @information! Gerekli teknolojiyi araştırmadan bir Günlük ilerlemesi eşiğine ulaşırsanız, o teknoloji için otomatik olarak araştırma ilerlemesi kazanırsınız.\n\nEğer bu ülke [concept_rank] (Kademesinde) en az bir [Concept('concept_unrecognized_power','$concept_unrecognized_regional_power$')] ise, tüm ülkelerde #yellow Tarım Sosyalizmi#! Günlük ilerlemesini de hızlandıracaktır.\n\n#lore \"Çar kalıcı bir kararsızlık durumu içindedir ve tüm gerçek düşünme gücünü kaybetmiştir: özgürleşmeyi ister, ancak bunu önlemek için elinden geleni yapar. Köylünün özgürleşmesinin toprağın özgürleşmesiyle eşdeğer olduğunu ve toprağın özgürleşmesinin de sırasıyla bir sosyal devrime öncülük edeceğini ve kırsal komünizmi kutsal hale getireceğini anlamıştır... Kırsal komünün hiçbir zaman parçalanmamış olması, özel mülkiyetin hiçbir zaman komünün mülkiyetinin yerini almamış olması Rusya için ne büyük bir lütuftur.\"\n\n—Aleksandr Herzen, 1851#!" 

