l_english:
    bpm_state_has_patchwork_tt: "Patchwork Governance modifier is greater than zero"

    bpm_patchwork_events.1.t: "One Law for All"
    bpm_patchwork_events.1.d: "From [SCOPE.sState('state_1').GetCityHubName] to [SCOPE.sState('state_2').GetCityHubName], local administrators finally answer to the authorities in [SCOPE.sState('capital_state').GetCityHubName]. The old charters, exemptions and customary privileges that once let provincial notables govern as they saw fit have been struck down, bought out, or simply allowed to lapse. For the first time, a decree issued in the capital means the same thing in every corner of [ROOT.GetCountry.GetNameNoFlag].\n\nThe work is far from glamorous. Clerks still squabble over jurisdiction and local grandees still grumble about lost dignities, but the patchwork that once divided our realm into a hundred little fiefdoms is gone."
    bpm_patchwork_events.1.d_alt: "Across [ROOT.GetCountry.GetNameNoFlag], local administrators finally answer to the authorities in [SCOPE.sState('capital_state').GetCityHubName]. The old charters, exemptions and customary privileges that once let provincial notables govern as they saw fit have been struck down, bought out or simply allowed to lapse. For the first time, a decree issued in the capital means the same thing in every corner of the realm.\n\nThe work is far from glamorous. Clerks still squabble over jurisdiction and local grandees still grumble about lost dignities, but the patchwork that once divided our lands is gone."
    bpm_patchwork_events.1.f: "Inasmuch as a national constitution and public liberty are of more advantage to the provinces than the privileges which some of these enjoy, and inasmuch as the surrender of such privileges is essential to the intimate union of all parts of the realm, it is decreed that all the peculiar privileges, pecuniary or otherwise, of the provinces, principalities, districts, cantons, cities and communes, are once for all abolished and are absorbed into the law common to all Frenchmen.\n\n—Decree of the National Assembly, August 1789"
    bpm_patchwork_events.1.a: "One realm, one administration."