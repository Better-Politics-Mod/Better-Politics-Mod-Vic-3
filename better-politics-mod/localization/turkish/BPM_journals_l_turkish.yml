 bpm_je_modernizers_copy_production_button:0 "Sanayiyi Araştır"
 bpm_je_modernizers_copy_production_button_desc:0 "Sanayi modern bir ulusun gücüdür. Yabancıların yöntemlerini incelemeliyiz ki onlara yetişebilelim ve onları geçebilelim."
 bpm_je_modernizers_copy_military_button:0 "Orduyu Güncelle"
 bpm_je_modernizers_copy_military_button_desc:0 "Çabalarımızı yabancı modern orduları incelemeye odaklamak, herhangi bir düşmanı yakalamamıza yardımcı olacaktır!"
 bpm_je_modernizers_copy_society_button:0 "Yeni Gelenekleri Teşvik Et"
 bpm_je_modernizers_copy_society_button_desc:0 "Daha ileri toplumlara daha iyi uyum sağlamak için geleneklerimizi değiştirmek, daha geleneksel unsurlarımızın bizi küçümsemesine neden olabilir, ancak inkar edilemez bir şekilde tüm cephelerde daha hızlı ilerlememize yardımcı olacaktır."
 bpm_je_modernizers_invite_production_button:0 "Yatırım Davet Et"
 bpm_je_modernizers_invite_production_button_desc:0 "Sanayideki gelişmelere yönelik son araştırmalarımız bize bilgiyi sağladı - ancak bu bilgiyi kullanmak için gerekli kaynakları sağlamadı. Yabancı yatırımları davet etmek, bu endüstrileri hızla başlatmamıza yardımcı olabilir."

