 bpm_bnap_statehood_button:0 "İlhak İçin Dilekçe Ver"
 bpm_bnap_statehood_button_desc:0 "Kanada'daki güçlü Amerikan yanlısı duyguları değerlendir ve Birliğe ilhak edilmek için ABD'ye bir dilekçe gönder."
 bpm_bnap_statehood_button_trigger_desc:0 "Amerikan kimliğini en üst düzeye çıkarın ve denizcilik sömürgeleriyle konfederasyon kurmaktan vazgeçin."

 bpm_bnap_canada_events.1.t:0 "Sorumlu Bir Hükümet"
 bpm_bnap_canada_events.1.d:0 "İngilizler bize sorumlu hükümet yetkisi vermeyi kabul etti."
 bpm_bnap_canada_events.1.f:0 "Seçmenler başbakanları seçmez; temsilcileri seçerler. Ve seçmenlerin gücü, temsilcilerinin hükümetlere güvenoyu verme ve bu güveni geri çekme hakkıyla ifade edilir. Eğer temsilcilerin güven verme veya geri çekme yetkisine müdahale edilirse, artık bir demokrasi değiliz demektir."

 bpm_bnap_canada_events.1.a:0 "Kanada'nın her iki Halkına da İktidar!"

 je_bpm_bnap_the_question_of_british_rule_complete:0 "#v 100#! İngiliz Katılımına Ulaştık."

 bpm_bnap_the_question_of_british_rule_complete_tt:0 "#v 100#! İngiliz Katılımı ile tamamlanırsa, Britanya İmparatorluğu'na daha da yakınlaşacağız ve idari maliyetlerimizin daha büyük bir kısmını karşılayacaklar.\nİngiliz Katılımı düşürülerek tamamlanırsa, Britanya İmparatorluğu'ndan daha bağımsız hale geleceğiz ve idari maliyetlerimizin daha az bir kısmını karşılayacaklar."

 bpm_bnap_canada_events.2.t:0 "İngiliz Yönetiminin Sonu"
 bpm_bnap_canada_events.2.d:0 "Britanya İmparatorluğu'ndan bağımsızlığımızı ilan ettik."
 bpm_bnap_canada_events.2.f:0 "İnsanlık tarihi boyunca, bir halkın kendisini diğerine bağlayan siyasi bağları koparması ve yeryüzündeki güçler arasında Doğa Yasalarının ve Doğa Tanrısı'nın onlara hak tanıdığı ayrı ve eşit statüyü üstlenmesi gerektiğinde, insanlığın görüşlerine duyulan saygı, onları bu ayrılığa iten nedenleri ilan etmelerini gerektirir."

 bpm_bnap_canada_events.2.a:0 "Bizim Kuzey Amerika'mız"
 # maybe change this if Britain is a republic
 bpm_bnap_canada_events.3.t:0 "Kraliyet'in Sadık Tebaası"
 bpm_bnap_canada_events.3.d:0 "Kraliyet'e sadık kalmaya karar verdik."
 bpm_bnap_canada_events.3.f:0 "Biz Kanada halkı olarak, Kanada'nın [Country.GetOverlord.GetRuler.GetPrimaryRoleTitle] unvanlı Majesteleri [Country.GetOverlord.GetRuler.GetFullName]'na ve [Country.GetOverlord.GetRuler.GetHerHim] varislerine ve haleflerine sadık kalacağımıza ve gerçek bağlılık göstereceğimize yemin ederiz. Tanrı yardımcımız olsun."

 je_bpm_bnap_between_lion_and_eagle:0 "Aslan ile Kartal Arasında"
 je_bpm_bnap_between_lion_and_eagle_desc:0 "Sadakatimizin nerede olduğuna karar vermeliyiz."
 je_bpm_bnap_between_lion_and_eagle_reason:0 "Britanya İmparatorluğu'nun bir sömürgesiyiz ancak aynı zamanda Amerika Birleşik Devletleri ile de komşuyuz. Sadakatimizin kime ait olduğuna ve bu iki büyük güç arasındaki karmaşık ilişkide nasıl bir yol izleyeceğimize karar vermeliyiz. Britanya İmparatorluğu'na sadık kalmayı seçebilir, ulusal bağımsızlığımızı isteyebilir veya Amerika Birleşik Devletleri'ne bile katılabiliriz."

