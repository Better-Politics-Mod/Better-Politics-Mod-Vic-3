l_english:
 je_bpm_revolt_ember: "Embers Beneath the Ashes"
 je_bpm_revolt_ember_concluded: "Embers Beneath the Ashes"
 je_bpm_revolt_ember_reason: "Beneath the calm of our streets, the fire has not gone out. In cellars and taverns, in factory yards and village squares, conspirators gather and whisper of a new order. Each [concept_bpm_revolutionary_cell] is an ember."
 je_bpm_revolt_ember_status: "The embers are alive but the fire is not yet raging."
 je_bpm_revolt_ember_widget_header: ""
 je_bpm_revolt_ember_widget_none: "#i The embers have gone cold. There are no ongoing insurrections.#!"
 BPM_REVOLT_MAP_CELL_COUNT: "[Concept('concept_bpm_revolutionary_cell', '$concept_bpm_revolutionary_cells|q$')] in this state: #v [THIS.GetState.MakeScope.ScriptValue('bpm_revolt_map_cells_in_state')|0]#!"
 BPM_REVOLT_MAP_STATE_INFO: "$BPM_REVOLT_MAP_CELL_COUNT$"
 je_bpm_revolt_ember_tt_lvl4: "#bold [THIS.GetState.GetName]#!\n$TOOLTIP_DELIMITER$\n#N Highest level: Triumphant#!\nThe revolutionaries hold sway here. A cell at this level cannot grow further, and instead spreads to neighbouring states with more than #v 25%#! turmoil. A Triumphant cell in our capital puts the government itself at risk.\n\n$BPM_REVOLT_MAP_STATE_INFO$"
 je_bpm_revolt_ember_tt_lvl3: "#bold [THIS.GetState.GetName]#!\n$TOOLTIP_DELIMITER$\n#N Highest level: Insurgent#!\nThe revolutionaries recruit openly and defy the authorities. If the cell keeps advancing, it will become #N Triumphant#!.\n\n$BPM_REVOLT_MAP_STATE_INFO$"
 je_bpm_revolt_ember_tt_lvl2: "#bold [THIS.GetState.GetName]#!\n$TOOLTIP_DELIMITER$\n#v Highest level: Agitating#!\nThe conspiracy is organised, spreading pamphlets and stirring up strikes in secret.\n\n$BPM_REVOLT_MAP_STATE_INFO$"
 je_bpm_revolt_ember_tt_lvl1: "#bold [THIS.GetState.GetName]#!\n$TOOLTIP_DELIMITER$\n#v Highest level: Underground#!\nA handful of conspirators meet in secret. If the cell retreats, it will be stamped out.\n\n$BPM_REVOLT_MAP_STATE_INFO$"
 je_bpm_revolt_ember_tt_none: "#bold [THIS.GetState.GetName]#!\n$TOOLTIP_DELIMITER$\nNo [Concept('concept_bpm_revolutionary_cell', '$concept_bpm_revolutionary_cells|q$')] in this state."
 
 je_bpm_ping_pong: "jank"
 je_bpm_ping_pong_reason: "bwaa"
 
 BPM_GRASP_HEADER: "[concept_bpm_grasp] over the States"
 BPM_REVOLT_SELECT_HEADER: "Revolutions"
 BPM_REVOLT_SELECT_TT: "Show our [concept_bpm_grasp] against this revolution and where its cells are. Each revolution is fought separately: its own [concept_clout] and cells weaken our [concept_bpm_grasp] against it. The front line is shared by all revolutions."
 BPM_REVOLT_CELLS_HEADER: "Cells of this Revolution"
 BPM_REVOLT_CELLS_EMPTY: "#i This revolution has no cells yet.#!"
 BPM_REVOLT_CELL_ENTRY_LEVEL: "[AddLocalizationIf(EqualTo_CFixedPoint(State.MakeScope.Var('bpm_grasp_sel_level').GetValue, '(CFixedPoint)1'), 'BPM_CELL_LEVEL_1')][AddLocalizationIf(EqualTo_CFixedPoint(State.MakeScope.Var('bpm_grasp_sel_level').GetValue, '(CFixedPoint)2'), 'BPM_CELL_LEVEL_2')][AddLocalizationIf(EqualTo_CFixedPoint(State.MakeScope.Var('bpm_grasp_sel_level').GetValue, '(CFixedPoint)3'), 'BPM_CELL_LEVEL_3')][AddLocalizationIf(EqualTo_CFixedPoint(State.MakeScope.Var('bpm_grasp_sel_level').GetValue, '(CFixedPoint)4'), 'BPM_CELL_LEVEL_4')]"
 bpm_grasp_revolutionary_clout: "[concept_clout] of this revolution's [Concept('concept_interest_group', '$concept_interest_groups$')]"
 BPM_GRASP_HEADER_COUNT_TT: "This revolution has #gold [Concept('concept_bpm_revolutionary_cell', '$concept_bpm_revolutionary_cells|q$')]#! in #v [JournalEntry.GetCountry.MakeScope.ScriptValue('bpm_revolt_selected_cell_count')|0]#! of our states."
 BPM_GRASP_LEGEND: "Each state's #v [concept_bpm_grasp]#! shows how firmly we hold it and places it in one of the categories below. Grasp is measured against the selected revolution. It starts from our [concept_legitimacy] and falls with [concept_turmoil] (#v 1#! per #v 4%#!), with the [concept_clout] of the revolution's [Concept('concept_interest_group', '$concept_interest_groups$')] and with its cells in the state. Neighbouring states matter too: those with cells lower it, while calm ones without cells raise it. Only states with a revolutionary cell or at least #v 25%#! [concept_turmoil] are listed.\n\nEach month the #gold front line#! (the framed category) shifts at random. The more [concept_clout] the revolutionaries have compared to our [concept_legitimacy], the more the rolls are weighted towards higher grasp thresholds. Every week, states in #R red#! categories below it may gain a new cell and cells there have a #v [GetPlayer.MakeScope.ScriptValue('bpm_revcell_front_line_chance')|0]%#! chance to advance, cells in #G green#! categories above it have a #v [GetPlayer.MakeScope.ScriptValue('bpm_revcell_front_line_chance')|0]%#! chance to retreat, and on the front line itself it is a contest between the two.\n\n#bold [AddLocalizationIf(EqualTo_CFixedPoint(JournalEntry.GetCountry.MakeScope.Var('bpm_grasp_threshold').GetValue, '(CFixedPoint)0'), 'BPM_GRASP_FRONT_LINE_0')][AddLocalizationIf(EqualTo_CFixedPoint(JournalEntry.GetCountry.MakeScope.Var('bpm_grasp_threshold').GetValue, '(CFixedPoint)1'), 'BPM_GRASP_FRONT_LINE_1')][AddLocalizationIf(EqualTo_CFixedPoint(JournalEntry.GetCountry.MakeScope.Var('bpm_grasp_threshold').GetValue, '(CFixedPoint)2'), 'BPM_GRASP_FRONT_LINE_2')][AddLocalizationIf(EqualTo_CFixedPoint(JournalEntry.GetCountry.MakeScope.Var('bpm_grasp_threshold').GetValue, '(CFixedPoint)3'), 'BPM_GRASP_FRONT_LINE_3')][AddLocalizationIf(EqualTo_CFixedPoint(JournalEntry.GetCountry.MakeScope.Var('bpm_grasp_threshold').GetValue, '(CFixedPoint)4'), 'BPM_GRASP_FRONT_LINE_4')][AddLocalizationIf(EqualTo_CFixedPoint(JournalEntry.GetCountry.MakeScope.Var('bpm_grasp_threshold').GetValue, '(CFixedPoint)5'), 'BPM_GRASP_FRONT_LINE_5')][AddLocalizationIf(EqualTo_CFixedPoint(JournalEntry.GetCountry.MakeScope.Var('bpm_grasp_threshold').GetValue, '(CFixedPoint)6'), 'BPM_GRASP_FRONT_LINE_6')]#!"
 BPM_GRASP_FRONT_LINE_0: "This month, the front line lies below every state: cells everywhere may retreat."
 BPM_GRASP_FRONT_LINE_1: "This month, the front line runs through states with a [concept_bpm_grasp] of 0–20 (Lost)."
 BPM_GRASP_FRONT_LINE_2: "This month, the front line runs through states with a [concept_bpm_grasp] of 21–40 (Slipping)."
 BPM_GRASP_FRONT_LINE_3: "This month, the front line runs through states with a [concept_bpm_grasp] of 41–60 (Contested)."
 BPM_GRASP_FRONT_LINE_4: "This month, the front line runs through states with a [concept_bpm_grasp] of 61–80 (Firm)."
 BPM_GRASP_FRONT_LINE_5: "This month, the front line runs through states with a [concept_bpm_grasp] of 81–100 (Iron Grip)."
 BPM_GRASP_FRONT_LINE_6: "This month, the front line lies above every state: cells everywhere may advance."
 BPM_GRASP_BOX_1: "Lost"
 BPM_GRASP_BOX_1_TT: "#tooltip_header Lost#!\n$TOOLTIP_DELIMITER$\nStates with a [concept_bpm_grasp] of #v 0–20#!.\n\n#i The government's writ barely runs here. Officials are ignored, and the conspirators move openly.#!"
 BPM_GRASP_BOX_2: "Slipping"
 BPM_GRASP_BOX_2_TT: "#tooltip_header Slipping#!\n$TOOLTIP_DELIMITER$\nStates with a [concept_bpm_grasp] of #v 21–40#!.\n\n#i Authority is eroding. Orders are obeyed grudgingly, if at all.#!"
 BPM_GRASP_BOX_3: "Contested"
 BPM_GRASP_BOX_3_TT: "#tooltip_header Contested#!\n$TOOLTIP_DELIMITER$\nStates with a [concept_bpm_grasp] of #v 41–60#!.\n\n#i The government and its enemies vie for the loyalty of the populace.#!"
 BPM_GRASP_BOX_4: "Firm"
 BPM_GRASP_BOX_4_TT: "#tooltip_header Firm#!\n$TOOLTIP_DELIMITER$\nStates with a [concept_bpm_grasp] of #v 61–80#!.\n\n#i The authorities are respected and the conspirators must keep their heads down.#!"
 BPM_GRASP_BOX_5: "Iron Grip"
 BPM_GRASP_BOX_5_TT: "#tooltip_header Iron Grip#!\n$TOOLTIP_DELIMITER$\nStates with a [concept_bpm_grasp] of #v 81–100#!.\n\n#i The state is held tightly. Dissent is quickly found out and stamped out.#!"
 BPM_GRASP_BOX_EMPTY: "No states"
 BPM_GRASP_STATE_TT: "#tooltip_header [State.GetName]#!\n$TOOLTIP_DELIMITER$[AddLocalizationIf(GreaterThan_CFixedPoint(State.MakeScope.Var('bpm_grasp_sel_level').GetValue, '(CFixedPoint)0'), 'BPM_GRASP_STATE_TT_LEVEL')]\nGrasp against this revolution: #v [State.MakeScope.Var('bpm_grasp_sel').GetValue|0]#!\n[AddLocalizationIf(Not(EqualTo_CFixedPoint(State.MakeScope.Var('bpm_gp_legitimacy').GetValue, '(CFixedPoint)0')), 'BPM_GP_LEGITIMACY')][AddLocalizationIf(Not(EqualTo_CFixedPoint(State.MakeScope.Var('bpm_gp_turmoil').GetValue, '(CFixedPoint)0')), 'BPM_GP_TURMOIL')][AddLocalizationIf(Not(EqualTo_CFixedPoint(State.MakeScope.Var('bpm_gp_clout').GetValue, '(CFixedPoint)0')), 'BPM_GP_CLOUT')][AddLocalizationIf(Not(EqualTo_CFixedPoint(State.MakeScope.Var('bpm_gp_neighbour_cells').GetValue, '(CFixedPoint)0')), 'BPM_GP_NEIGHBOUR_CELLS')][AddLocalizationIf(Not(EqualTo_CFixedPoint(State.MakeScope.Var('bpm_gp_calm_neighbours').GetValue, '(CFixedPoint)0')), 'BPM_GP_CALM_NEIGHBOURS')][AddLocalizationIf(Not(EqualTo_CFixedPoint(State.MakeScope.Var('bpm_gp_capital').GetValue, '(CFixedPoint)0')), 'BPM_GP_CAPITAL')][AddLocalizationIf(Not(EqualTo_CFixedPoint(State.MakeScope.Var('bpm_gp_unincorporated').GetValue, '(CFixedPoint)0')), 'BPM_GP_UNINCORPORATED')][AddLocalizationIf(Not(EqualTo_CFixedPoint(State.MakeScope.Var('bpm_gp_cells').GetValue, '(CFixedPoint)0')), 'BPM_GP_CELLS')]\n\n[AddLocalizationIf(And(GreaterThan_CFixedPoint(State.MakeScope.Var('bpm_grasp_sel_category').GetValue, '(CFixedPoint)0'), LessThan_CFixedPoint(State.MakeScope.Var('bpm_grasp_sel_category').GetValue, State.GetOwner.MakeScope.Var('bpm_grasp_threshold').GetValue)), 'BPM_GRASP_STATE_TT_BELOW')][AddLocalizationIf(GreaterThan_CFixedPoint(State.MakeScope.Var('bpm_grasp_sel_category').GetValue, State.GetOwner.MakeScope.Var('bpm_grasp_threshold').GetValue), 'BPM_GRASP_STATE_TT_ABOVE')][AddLocalizationIf(EqualTo_CFixedPoint(State.MakeScope.Var('bpm_grasp_sel_category').GetValue, State.GetOwner.MakeScope.Var('bpm_grasp_threshold').GetValue), 'BPM_GRASP_STATE_TT_ON')]"
 BPM_GRASP_STATE_TT_LEVEL: "\n[concept_bpm_revolutionary_cell]: [AddLocalizationIf(EqualTo_CFixedPoint(State.MakeScope.Var('bpm_grasp_sel_level').GetValue, '(CFixedPoint)1'), 'BPM_CELL_LEVEL_1')][AddLocalizationIf(EqualTo_CFixedPoint(State.MakeScope.Var('bpm_grasp_sel_level').GetValue, '(CFixedPoint)2'), 'BPM_CELL_LEVEL_2')][AddLocalizationIf(EqualTo_CFixedPoint(State.MakeScope.Var('bpm_grasp_sel_level').GetValue, '(CFixedPoint)3'), 'BPM_CELL_LEVEL_3')][AddLocalizationIf(EqualTo_CFixedPoint(State.MakeScope.Var('bpm_grasp_sel_level').GetValue, '(CFixedPoint)4'), 'BPM_CELL_LEVEL_4')]\n"
 BPM_GP_LEGITIMACY: "\n[concept_legitimacy]: [State.MakeScope.Var('bpm_gp_legitimacy').GetValue|+=0]"
 BPM_GP_TURMOIL: "\n[concept_turmoil]: [State.MakeScope.Var('bpm_gp_turmoil').GetValue|+=0]"
 BPM_GP_CLOUT: "\n$bpm_grasp_revolutionary_clout$: [State.MakeScope.Var('bpm_gp_clout').GetValue|+=0]"
 BPM_GP_NEIGHBOUR_CELLS: "\n$bpm_grasp_neighbouring_cells$: [State.MakeScope.Var('bpm_gp_neighbour_cells').GetValue|+=0]"
 BPM_GP_CALM_NEIGHBOURS: "\n$bpm_grasp_calm_neighbours$: [State.MakeScope.Var('bpm_gp_calm_neighbours').GetValue|+=0]"
 BPM_GP_CAPITAL: "\n$bpm_grasp_capital$: [State.MakeScope.Var('bpm_gp_capital').GetValue|+=0]"
 BPM_GP_UNINCORPORATED: "\n$bpm_grasp_unincorporated$: [State.MakeScope.Var('bpm_gp_unincorporated').GetValue|+=0]"
 BPM_GP_CELLS: "\n$bpm_grasp_cells$: [State.MakeScope.Var('bpm_gp_cells').GetValue|+=0]"
 BPM_CELL_LEVEL_1: "#v Underground#!"
 BPM_CELL_LEVEL_2: "#v Agitating#!"
 BPM_CELL_LEVEL_3: "#N Insurgent#!"
 BPM_CELL_LEVEL_4: "#N Triumphant#!"
 BPM_GRASP_STATE_TT_BELOW: "This state is #R below the front line#!: cells here have a #v [GetPlayer.MakeScope.ScriptValue('bpm_revcell_front_line_chance')|0]%#! chance to advance every week."
 BPM_GRASP_STATE_TT_ABOVE: "This state is #G above the front line#!: cells here have a #v [GetPlayer.MakeScope.ScriptValue('bpm_revcell_front_line_chance')|0]%#! chance to retreat every week."
 BPM_GRASP_STATE_TT_ON: "This state is #gold on the front line#!: cells here may advance or retreat."
 bpm_grasp_legitimacy: "[concept_legitimacy]"
