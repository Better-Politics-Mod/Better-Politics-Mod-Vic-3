 bpm_patcon_split.1.t:0 "Paternalist Muhafazakarlar"
 bpm_patcon_split.1.d:0 "Devletin gücü halkın gücünden doğar ve halka karşı sorumlu olanlar onların ortak refahını sağlamalıdır.\n\nYani en azından, muhafazakar hareketi domine etmeye başlayan ve yurttaşlarını modern dünyanın acımasızlıklarından korumaya söz veren yeni nesil @ig_conservatives! #blue Paternalist Muhafazakarlar#! böyle söylüyor. Modernleşmeye isteksiz olanlar ise, patrisyen geçmişlerinin son kalesi olarak @ig_reactionaries! Gericilerin arasına düştüler."
 bpm_patcon_split.1.f:0 "Emekçi sınıfların çıkarlarını her zaman ülkenin esasen en muhafazakar çıkarları olarak görmüşümdür. Emeğin hakları benim için her zaman mülkiyet hakları kadar kutsal olmuştur ve bir Devletin istikrarı ve hatta ihtişamıyla en çok ilgilenenlerin nüfusun o büyük kitlesi olduğunu her zaman düşünmüşümdür.\n\n—Benjamin Disraeli, 1867"
 bpm_patcon_split.1.a:0 "Halkın karnı doyacak!"