 je_bpm_csa_crossroads_of_our_being:0 "我们存在的十字路口"
 je_bpm_csa_crossroads_of_our_being_reason:0 "地区间的战争来临了，随之而来的是自独立战争以来未曾有过的斗争。那些被自身的怠惰迷了心窍的火食者，将内战带到了我们这座山巅之城。作为总司令，总统有责任进行这场斗争，并引领我们的国家走过十字路口。\n\n随着战事拖延，一些人将提出紧急立法，以促使这场冲突迅速了结。这项立法不仅在内战期间有益，也将在我国的重建中发挥作用。然而，此类立法也会激起反战情绪。若这种情绪过高，我们将输掉下一届总统选举，而我们的和平主义继任者必将允许邦联脱离。因此，我们必须平衡军事与政治考量，确保我们的国家能如凤凰般从这场危机中涅槃重生。\n\n#lore “除非你们自己是侵略者，否则就不会有冲突。你们没有在天庭登记过要摧毁政府的誓言，而我则立下过最为庄严的誓言，要‘维护、保护并捍卫它’。我实不忍就此结束。我们不是敌人，而是朋友。”\n\n——亚伯拉罕·林肯，1861#!"
 je_bpm_fsa_crossroads_of_our_being:0 "我们存在的十字路口"
 je_bpm_fsa_crossroads_of_our_being_reason:0 "地区间的战争来临了，随之而来的是自独立战争以来未曾有过的斗争。那些被自身的骄傲迷了心窍的激进共和党人，将内战带到了我们这座山巅之城。作为总司令，总统有责任进行这场斗争，并引领我们的国家走过十字路口。\n\n随着战事拖延，一些人将提出紧急立法，以促使这场冲突迅速了结。这项立法不仅在内战期间有益，也将在我们重夺阳光下的位置中发挥作用。然而，此类立法也会激起反战情绪。若这种情绪过高，我们将输掉下一届总统选举，而我们的和平主义继任者必将让我们的国家错失走向伟大的良机。因此，我们必须平衡军事与政治考量，确保我们的国家能将其天赐的启蒙传播到全世界。\n\n#lore “我们的新政府恰恰建立在截然相反的理念之上；它的地基、它的基石，都建立在这样一个伟大真理之上：黑人并不等同于白人；奴隶制、从属于优越种族，才是他自然而正常的状态。”\n\n——亚历山大·H·斯蒂芬斯，1861#!"
