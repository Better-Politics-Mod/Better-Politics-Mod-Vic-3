 je_bpm_new_imperialism:0 "Yeni Emperyalizm"
 je_bpm_new_imperialism_reason:0 "Ulusun iç savaşın sonuçlarından tamamen kurtulmasıyla birlikte, sonsuz savaş tamtamları bir kez daha çalmaya başladı. Manifest Destiny'nin (Açık Kader) yenilenmiş bir dalgası şimdi kendisini piyasaların ve endüstrinin diliyle gizledi. Columbia, yaralarının kabuk bağlamasıyla, artık bir kez daha sınırı genişletmeye geri dönmelidir.\n\nGenişleme için yeni bir dürtüyle birlikte yeni bir Uluslararası Para Konferansı çağrıları da geliyor. Sıklıkla Amerikan İç Savaşı'nın ardından düzenlenen bu toplantılar, bimetalizmin uluslararası piyasada düşen istikrarını durdurmaya çalıştı. Nihayetinde, büyük güçlerin dış ticaret üzerindeki rekabeti, hiçbir zaman anlaşmaya varılamayacağı anlamına geliyordu. Şimdi, ulusumuzun benzersiz bir güvenlik konumunda olmasıyla, nihayet uluslararası para politikasının Gordion Düğümünü çözebilecek yeni bir Uluslararası Para Konferansı düzenleyebiliriz.\n\nBaşarılı bir Uluslararası Para Konferansı düzenlemek için şunların onayına ihtiyacımız olacak:\n\nBüyük Britanya\nFransa veya Almanya\nFransa veya İspanya\nAlmanya veya Rusya\nAvusturya veya İtalya\nAvusturya veya Türkiye"

