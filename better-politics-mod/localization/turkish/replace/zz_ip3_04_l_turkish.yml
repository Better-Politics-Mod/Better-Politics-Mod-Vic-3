je_danubian_federation_czech_button_desc: "Eski #b Bohemya Tacı#! topraklarının #b Bohemya#!, #b Moravya#! ve #b Silezya#! veliaht topraklarına bölünmesi [GetCulture('czech').GetName] milliyetçileri için uzun zamandır bir hoşnutsuzluk kaynağı olmuştur. Buna ek olarak, [GetCulture('czech').GetNameNoFormatting] topraklarında büyük bir [GetCulture('south_german').GetName] azınlığın varlığı, sürekli bir etnik gerilim kaynağı olarak hizmet etmektedir. Bölgeyi başarılı bir şekilde Federasyon'a entegre edebilmek için, [GetCulture('south_german').GetNameNoFormatting] azınlığı ötekileştirmeden Bohemya'yı yeniden birleştirecek bir çözüm bulmalıyız."
