je_metternich_reason: "The aftermath of the #b Napoleonic Wars#! has established [ROOT.GetCountry.GetName] as a leading conservative power in Europe. The leading architect of the post-Napoleonic order, [SCOPE.sCharacter('metternich_scope').GetFullName], has served as Chancellor of [ROOT.GetCountry.GetNameNoFormatting] since the tumultuous year of 1821. [SCOPE.sCharacter('metternich_scope').GetHerHis|U] agenda calls for upholding the [ROOT.GetCountry.GetAdjectiveNoFormatting] [GetLawType('law_autocracy').GetName], the maintenance of the conservative peace in Europe, and the promotion of the arts and sciences.\n\n#b The Metternich Agenda:#!\nRealizing various items on Chancellor [SCOPE.sCharacter('metternich_scope').GetLastName]'s agenda will improve the effects of this [concept_journal_entry]. These achievements will be scored upon this journal entry successfully #b completing#!.\n• [SCOPE.GetRootScope.GetCountry.GetCustom('metternich_ita_checkbox')] Prevented #b $ITA_ADJ$#! [Concept('concept_unification', '$concept_unification_short$')]\n• [SCOPE.GetRootScope.GetCountry.GetCustom('metternich_ger_checkbox')] #b $GER$#! has not been [Concept('concept_unification', 'unified')] by any other [concept_country]\n• [SCOPE.GetRootScope.GetCountry.GetCustom('metternich_art_checkbox')] [ROOT.GetCountry.GetNameNoFlag] is the leading producer of [GetGoods('fine_art').GetName]\n• [SCOPE.GetRootScope.GetCountry.GetCustom('metternich_krakow_checkbox')] [ROOT.GetCountry.GetNameNoFlag] owns the entire [concept_state_region] of [GetStateRegion('STATE_WEST_GALICIA').GetName]\n• [SCOPE.GetRootScope.GetCountry.GetCustom('metternich_tech_checkbox')] [ROOT.GetCountry.GetNameNoFlag] has researched [GetPlayer.MakeScope.ScriptValue('metternich_tech_target')|v0] [Concept('concept_technology', '$concept_technologies$')] (currently [GetPlayer.MakeScope.ScriptValue('techs_researched_script')|v0])[SCOPE.GetRootScope.GetCountry.GetCustom('metternich_system_entry')][SCOPE.GetRootScope.GetCountry.GetCustom('metternich_system_cohesion_entry')]\n• [SCOPE.GetRootScope.GetCountry.GetCustom('metternich_movement_checkbox')] All #tooltippable;tooltip:[GetPlayer.GetTooltipTag],liberal_movements_list_tt Liberal#! or #tooltippable;tooltip:[GetPlayer.GetTooltipTag],socialist_movements_list_tt Socialist#! [Concept('concept_political_movement','$concept_political_movements$')] have #b Marginal#! support\n• [SCOPE.GetRootScope.GetCountry.GetCustom('metternich_laws_checkbox')] [ROOT.GetCountry.GetNameNoFlag] has [GetLawType('law_autocracy').GetName], [GetLawType('law_censorship').GetName], and [GetLawType('law_secret_police').GetName]\n• [SCOPE.GetRootScope.GetCountry.GetCustom('metternich_institution_checkbox')] #b $institution_home_affairs$#! and #b $institution_police$#! [Concept('concept_institution', '$concept_institutions$')] are at level #v 3#! or higher"

metternich_system_box_tt: "\n• [SCOPE.GetRootScope.GetCountry.GetCustom('metternich_bloc_checkbox')] [ROOT.GetCountry.GetPowerBloc.GetName] has more than [GetPlayer.MakeScope.ScriptValue('metternich_bloc_target')|v0] [Concept('concept_power_bloc_member','$concept_power_bloc_members_extra_short$')] (currently [GetPlayer.MakeScope.ScriptValue('num_power_bloc_members_script')|v0])"


