 je_bpm_gag_rule:0 "Susturma Kuralı (Gag Rule)"
 je_bpm_gag_rule_reason:0 "1819'daki acı verici Panik'ten bu yana, biz #GB Güney'in#! onurlu beyefendileri, Merkezi Hükümetten aralıksız suistimale maruz kaldık. 1820 Missouri Uzlaşması, çok değer verdiğimiz Özgün Kurumumuzu (Peculiar Institution - Kölelik) bağlamayı amaçladı ve ardından onların gümrük vergileri bizi ilerlememiz için gereken temel makinelerden mahrum bıraktı. Şimdi de o Garrison denilen adam köleliği kaldırmak gibi cüretkâr bir amaçla bir kampanya başlattı!\n\nKuma bir çizgi çekmeliyiz: İşgüzar #GBB Kuzeyliler#!, asil ekonomimizin temeline müdahale etme girişimlerinde daha ileri gidemeyeceklerdir. Bir parti, Yok Sayma Krizinde açılan yaraları sarmaya hazır olmadıkça, bu kutsal meclislerde kölelik meselesi üzerine hiçbir tartışma yapılmayacaktır!\n\n@information! #brightyellow Whigler#! adına #GB Güney'i#! kazanmak için, #GB Güney'de#! #yellow Limanlar#! ve #yellow İnşaat Sektörleri#! inşa ederek devasa bir İç İyileştirmeler kampanyası başlatmalıyız.\n\n@information! #blue Demokratlar#! adına #GB Güney'i#! kazanmak için, [GetLawType('law_free_trade').GetName] yasasını geçirerek ve #yellow Pamuk Plantasyonlarını#! genişleterek Kral Pamuğu (King Cotton) dünya pazarına salmalıyız.\n\n@warning! Bu talepler çileden çıkarıcıdır; köle sahiplerini yatıştırmanın faydası bu belaya değmeyebileceğinden, bunları kendi sorumluluğunuzda yerine getirin.\n\nEğer iki büyük partiden hiçbiri 3 yıl içinde Yok Sayma Krizinin yarattığı çatlağı onaramazsa, #GB Güney#! Susturma Kuralını pekiştirerek yakın gelecekte kölelik tartışmalarını sona erdirecektir.\n\n#lore \"Biz, dünyanın genel pazarının arzı için belirli temel ürünleri yetiştiriyoruz; onlar ise neredeyse sadece iç pazar için üretim yapıyorlar. Onların gümrük vergisindeki amaçları, iç pazarın tekelini elde etmek için dış rekabeti bastırmaktır.\"\n\n—John C. Calhoun, 1837#!"
 bpm_je_american_system:0 "Louisiana, Mississippi, Alabama, Georgia ve Güney Karolina'nın her birinde #yellow 5 İnşaat Sektörüne#! ve #yellow 5 Limana#! sahip olun"
 bpm_je_abomination_slayer:0 "[GetLawType('law_free_trade').GetName] yasasını geçirin ve Louisiana, Mississippi, Alabama, Georgia ve Güney Karolina'nın her birinde #yellow 15 Pamuk Plantasyonuna#! sahip olun"
 bpm_je_gag_failure:0 "3 yıl geçti ve Yok Sayma yarası hala kanıyor"
 bpm_je_south_unites:0 "#GB Güneyli#! Seçkinler ya #brightyellow Whiglerin#! ya da #blue Demokratların#! arkasında birleşiyor!"

 je_bpm_csa_crossroads_of_our_being:0 "Varlığımızın Yol Ayrımı"
 je_bpm_csa_crossroads_of_our_being_reason:0 "Bölgesel Savaş geldi ve onunla birlikte Bağımsızlık Savaşı'ndan beri görülmemiş mücadeleler geliyor. Kendi tembelliklerine bu kadar kapılmış Ateş-Yiyenler (Fire-Eaters), tepedeki şehrimize İç Savaş getirdiler. Bu mücadeleyi yürütmek ve ulusumuzu bu yol ayrımında yönetmek, Başkomutan olarak Başkan'ın sorumluluğudur.\n\nSavaş uzadıkça, bazıları bu çatışmanın hızla sonuçlanmasına yardımcı olmak için acil durum mevzuatı önerecektir. Bu mevzuat sadece İç Savaş sırasında değil, Ulusumuzun Yeniden İnşasında da faydalı olacaktır. Ancak, böyle bir mevzuat aynı zamanda savaş karşıtı duyguları da körükleyecektir. Bu duygu çok yükselirse, bir sonraki başkanlık seçimini kaybedeceğiz ve pasifist yerine geçecek kişi Konfederasyonun ayrılmasına kesinlikle izin verecektir. Bu nedenle, ulusumuzun bu krizden bir anka kuşu gibi doğabilmesini sağlamak için askeri ve siyasi endişeleri dengelemeliyiz.\n\n#lore \"Siz kendiniz saldırgan olmadan hiçbir çatışma yaşayamazsınız. Sizin Hükümeti yok etmek için cennette kayıtlı hiçbir yemininiz yokken, benim onu 'korumak, kollamak ve savunmak' için en ciddi yeminim var. Sözlerimi bitirmek istemiyorum. Biz düşman değiliz, dostuz.\"\n\n-Abraham Lincoln, 1861#!"
 je_bpm_fsa_crossroads_of_our_being:0 "Varlığımızın Yol Ayrımı"
 je_bpm_fsa_crossroads_of_our_being_reason:0 "Bölgesel Savaş geldi ve onunla birlikte Bağımsızlık Savaşı'ndan beri görülmemiş mücadeleler geliyor. Kendi kibirlerine bu kadar kapılmış Radikal Cumhuriyetçiler, tepedeki şehrimize İç Savaş getirdiler. Bu mücadeleyi yürütmek ve ulusumuzu bu yol ayrımında yönetmek, Başkomutan olarak Başkan'ın sorumluluğudur.\n\nSavaş uzadıkça, bazıları bu çatışmanın hızla sonuçlanmasına yardımcı olmak için acil durum mevzuatı önerecektir. Bu mevzuat sadece İç Savaş sırasında değil, Güneşteki Yerimizin Geri Alınmasında da faydalı olacaktır. Ancak, böyle bir mevzuat aynı zamanda savaş karşıtı duyguları da körükleyecektir. Bu duygu çok yükselirse, bir sonraki başkanlık seçimini kaybedeceğiz ve pasifist yerine geçecek kişi ulusumuzun büyüklük şansını kaybetmesine kesinlikle izin verecektir. Bu nedenle, ulusumuzun Tanrı vergisi aydınlanmasını tüm dünyaya yayabilmesini sağlamak için askeri ve siyasi endişeleri dengelemeliyiz.\n\n#lore \"Yeni hükümetimiz tam tersi bir fikir üzerine kurulmuştur; temelleri atılmıştır, temel taşı, zencinin beyaz adamla eşit olmadığı; üstün ırka kölelik boyun eğmesinin onun doğal ve normal durumu olduğu büyük gerçeğine dayanmaktadır.\"\n\n-Alexander H. Stephens, 1861#!"
