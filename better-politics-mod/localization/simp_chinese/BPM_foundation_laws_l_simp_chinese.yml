l_simp_chinese:
 lawgroup_executive_principles:0 "行政架构"
 lawgroup_executive_principles_desc:0 "[Concept('concept_ruler','国家元首')]与[concept_bpm_head_of_government]之间的关系。"
 law_appointed_by_hos:0 "[GetPlayer.GetRuler.GetPrimaryRoleTitle]任命"
 law_appointed_by_hos_desc:0 "[GetPlayer.GetRuler.GetPrimaryRoleTitle]在任命或罢免[concept_bpm_head_of_government]方面拥有绝对权力。"
 law_appointed_on_advice:0 "依建议任命"
 law_appointed_on_advice_desc:0 "[GetPlayer.GetRuler.GetPrimaryRoleTitle]在立法机构的正式支持下选定[concept_bpm_head_of_government]。"
 law_no_separate_hog:0 "统一行政"
 law_no_separate_hog_desc:0 "[GetPlayer.GetRuler.GetPrimaryRoleTitle]同时兼任[concept_bpm_head_of_government]。"
 law_answers_to_legislature:0 "虚位[GetPlayer.GetRuler.GetPrimaryRoleTitle]"
 law_answers_to_legislature_desc:0 "[GetPlayer.GetRuler.GetPrimaryRoleTitle]纯属礼仪性质，[concept_bpm_head_of_government]仅对立法机构负责。"
 lawgroup_legislative_principles:0 "立法权力"
 lawgroup_legislative_principles_desc:0 "立法与行政部门之间的关系。"
 law_advisory_body:0 "咨询机构"
 law_advisory_body_desc:0 "立法机构仅仅是咨询机构，无权通过法律。在虚位[GetPlayer.GetRuler.GetPrimaryRoleTitle]之下，[GetPlayer.GetCustom('bpm_hog_title')]将成为终身独裁者。"
 law_separated_powers:0 "三权分立"
 law_separated_powers_desc:0 "立法机构与[concept_government]是彼此分离的实体，拥有各自的权力与职责。"
 law_supreme_legislature:0 "最高立法机构"
 law_supreme_legislature_desc:0 "立法机构是国家的最高权力机关，同时行使立法与行政职能。"
 country_bpm_hog_impact_on_ruler_veto:0 "[concept_bpm_head_of_government]对[concept_ruler]否决权的影响"
