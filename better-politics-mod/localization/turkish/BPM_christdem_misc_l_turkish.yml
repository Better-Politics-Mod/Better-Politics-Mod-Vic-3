 je_bpm_ideological_power: "#v İdeolojik Güç#!, yerel [Concept('concept_party', 'Muhafazakar Parti')] içindeki uyumlu bütünlüğü, bağlılığı ve genel olarak kökleşmiş siyasi nüfuzu hem #bold sessiz tabanda#! hem de #bold parlamento kürsüsünde#! temsil eden bir 'mekanik'tir. Bu [concept_journal_entry] görevindeki her iki taraf da çeşitli değerlere ve faktörlere bağlı olarak #v İdeolojik Güç#! kazanacak ve kendi #v İdeolojik Güçlerini#! kullanarak diğer tarafın büyümesini sınırlamaya çalışabileceklerdir.\n\n#v #lore 75#! İdeolojik Güç#! kazanmak için gereklidir; hiçbiri bu güce ulaşamazsa ve süre dolarsa, bir #v Statüko#! oluşturulacaktır."
 
 je_bpm_new_wine_in_old_wineskins: "Eski Kırbalarda Yeni Şarap"
 je_bpm_new_wine_in_old_wineskins_reason: "Bir zamanlar nispeten küçük, zayıf ve kolayca manipüle edilebilen sıradan Katolikler yıllar geçtikçe önemli ölçüde güçlendiler ve 'Rerum novarum' genelgesinin yayımlanmasıyla birlikte, eski muhafazakar seçkinlerin hoşnutsuzluğuna rağmen siyasete daha açık bir şekilde katılmaya başladılar.\n\nGenellikle radikal ve ısrarcı olan [GetInterestGroupVariant('ig_christian_democrats',GetPlayer).GetNameWithCountryVariant], kurnaz [GetInterestGroupVariant('ig_conservatives',GetPlayer).GetNameWithCountryVariant] grubuyla bir hayatta kalma savaşı vermek zorunda kalacaktır. #v Ve yalnızca tek bir kazanan olabilir#!.\n\nBu [concept_journal_entry], birçok ülkede @ig_christian_democrats! #bold Hristiyan Demokratlar#! ile @ig_conservatives! #bold Klasik Muhafazakarlar#! arasında yaşanan, her iki tarafın da düşman [Concept('concept_political_movement', 'Fraksiyonu')]/[Concept('concept_interest_group', 'İdeolojiyi')] zayıflatmak ve sarsılmaz bir avantaj elde etmek için kurnazca #italic siyasi manevralara#! giriştiği, nihayetinde kaybedeni #v yendiği#! ve #v asimile ettiği#! oldukça dinamik ve etkili [Concept('concept_political_strength', 'Siyasi Savaşı')] konu alıyor. @ig_christian_democrats! Hristiyan Demokratların kazanması için #v 75#! #bold #tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_ideological_power İdeolojik Güce#!#! ulaşmaları gerekir; ve @ig_conservatives! Muhafazakarların kazanması için Katolikleri zayıflatmak üzere #bold #tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_paternalistic_reforms_tooltip Paternalist Reformları#!#! geçirmeleri gerekir. Kaybeden taraf bir 'fraksiyon' veya 'kanat' haline getirilecektir. Hiçbiri kazanamazsa ve #bold süre dolarsa#!, her ikisi arasında bir #v Statüko#! sağlanacak ve bu [concept_journal_entry] sona erecektir.\n\n#lore Ayrıca bugün var olanın yarına ve ötesine kadar yaşamak zorunda olduğuna inanmak, içinde kendimizi rahat hissettiğimiz için ne pahasına olursa olsun bugünü korumak istemek, içinde kendimizi rahatsız hissettiğimiz için bugünde acil bir değişim için çabalamak ve son olarak, bugünün her zaman, gerçekte, yeni bir durumun ortaya çıkışı olduğunu ve bu ortaya çıkışın sürekli olduğunu unutmak da bir hatadır.\n\n— Wojciech Korfanty, 1927#!"
 je_bpm_new_wine_in_old_wineskins_status: "Şimdi enfes bir tat için."

