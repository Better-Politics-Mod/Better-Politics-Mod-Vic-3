 bpm_labor_igs_not_insurrectionary:0 "没有任何[concept_bpm_ig_is_labor][concept_interest_group]处于[Concept('concept_revolution', '$concept_revolutionary$')]。"
 je_german_unification_idea_trigger_desc:0 "已完成$je_german_unification_idea$[concept_journal_entry]，且#bold 人民之春#!已经落幕。"
 je_italian_unification_idea_trigger_desc:0 "#bold 人民之春#!已经落幕。"
 je_bpm_winds_of_change:0 "变革之风（教程）"
 je_bpm_winds_of_change_status:0 "了解政治僵化。"
 je_bpm_winds_of_change_reason:0 "在这个新时代，变革之风正吹拂我国，但要颁布法律，我们需要降低我们的[Concept('concept_bpm_political_stability', '政治僵化')]。该数值位于政府窗口顶部、合法性条之上。\n\n根据政府的僵化程度，你将处于[Concept('concept_bpm_politically_stagnant', '停滞')]、[Concept('concept_bpm_politically_dynamic', '活跃')]或[Concept('concept_bpm_politically_unstable', '动荡')]状态：\n- [Concept('concept_bpm_politically_stagnant', '停滞')]僵化度#v (66-100)#!会使[Concept('concept_enactment_of_laws','法律颁布')]困难得多\n- [Concept('concept_bpm_politically_dynamic', '活跃')]僵化度#v (33-66)#!不提供任何特殊加成\n- [Concept('concept_bpm_politically_unstable', '动荡')]僵化度#v (0-33)#!会降低[concept_throughput]和[concept_construction]效率\n\n僵化度介于#v 0-100#!之间，并缓慢向一个#v 目标值#!靠拢。该目标值会被多种因素@arrow_up!#v 抬高#!，例如：\n- 保守的治理，如[GetLawType('law_monarchy').GetName]和[GetLawType('law_ad_hoc_centralization').GetName]\n- 保守的经济，如[GetLawType('law_serfdom').GetName]或[GetLawType('law_tenant_farmers').GetName]\n- 受压抑的言论，如[GetLawType('law_censorship').GetName]或[GetLawType('law_outlawed_dissent').GetName]\n- 对#yellow $institution_police$#!制度的投资\n- 庞大的[concept_loyalist]人口\n\n另一方面，#v 目标值#!也会被诸如以下因素@arrow_down!#v 降低#!：\n- 对#yellow $institution_suffrage$#!制度的投资\n- 起义性的利益集团与[concept_revolution]\n- [concept_war_exhaustion]\n- 低[concept_legitimacy]\n- 庞大的[concept_radical]人口\n\n#v 若无法立即降低僵化度，也不必担心。#!尝试工业化，并尽可能利用[Concept('concept_political_movement','政治运动')]和[Concept('concept_war', '战争')]。煽动利益集团起义可能会有所帮助，而一场内战则大有裨益！"
 bpm_tutorial_stability_req:0 "尚未完成教程，且拥有超过66的#v 政治僵化#!度。"
 bpm_tutorial_stability:0 "将你的#v 政治僵化#!度降至66或更低。"
 bpm_tutorial.1.t:0 "一个活跃的政府"
 bpm_tutorial.1.d:0 "我们现在处于[Concept('concept_bpm_politically_dynamic', '活跃')]级别的[Concept('concept_bpm_political_stability', '政治僵化')]！只要维持在这一水平，我们的政治建制将不再阻碍任何改革尝试。\n\n@warning! 若僵化度降得太低，我们的政府将变得[Concept('concept_bpm_politically_unstable', '动荡')]，并伴随严重的减益！"
 bpm_tutorial.1.f:0 "一股新的政治活力之风拂过首都，或许一个变革的时代即将来临。"
 bpm_tutorial.1.a:0 "前进！"
 je_bpm_ban_communists:0 "反社会主义法"
 je_bpm_ban_communists_status:0 "从政府中根除社会主义组织。"
 je_bpm_ban_communists_reason:0 "社会主义者唱起了革命的塞壬之歌，妄图颠覆脆弱的自然秩序；这场革命已令我国政治建制颇为不安。\n\n只要该日志条目生效，我国[Concept('concept_bpm_ig_is_liberal', '$concept_bpm_ig_is_liberal$')]和[Concept('concept_bpm_ig_is_moderate_conservative', '$concept_bpm_ig_is_moderate_conservative$')][Concept('concept_interest_group', '利益集团')]将倾向于支持禁止共产党派的法律。"
 je_bpm_ban_fascists:0 "反法西斯主义法"
 je_bpm_ban_fascists_status:0 "从政府中根除法西斯组织。"
 je_bpm_ban_fascists_reason:0 "法西斯分子——那些狂热的排外者和极端军国主义狂徒——如同褐色瘟疫般涌上街头，以其暴力的疯狂玷污着我国的政治舞台。随着法西斯威胁的显现，我国政治舞台上更大一部分参与者已对其发难，甚至主张完全禁止其活动。\n\n只要该日志条目生效，我国[Concept('concept_bpm_ig_is_liberal', '$concept_bpm_ig_is_liberal$')]、[Concept('concept_bpm_ig_is_moderate_conservative', '$concept_bpm_ig_is_moderate_conservative$')]以及非无政府主义的[Concept('concept_bpm_ig_is_socialist', '$concept_bpm_ig_is_socialist$')][Concept('concept_interest_group', '利益集团')]将倾向于支持禁止法西斯党派的法律。"
 je_bpm_ban_anti_communists:0 "反资本主义法"
 je_bpm_ban_anti_communists_status:0 "从政府中根除资本主义组织。"
 je_bpm_ban_anti_communists_reason:0 "我们的革命事业发现自身被内部的敌人所侵蚀，他们企图恢复资产阶级的枷锁。随着反动势力通过参与我们的民主进程而不断积聚力量，我们的革命领袖日益焦虑，要求采取果断措施来对付他们。\n\n只要该日志条目生效，我国非无政府主义的[Concept('concept_bpm_ig_is_socialist', '$concept_bpm_ig_is_socialist$')][Concept('concept_interest_group', '利益集团')]将倾向于支持禁止非社会主义党派的法律。"
 bpm_become_single_party:0 "当前唯一执政的[Concept('concept_party', '政党')]将颁布[GetLawType('law_party_single').GetName][Concept('concept_law', '法律')]，取缔你国内所有其他[Concept('concept_party', '政党')]。"
 bpm_je_single_party_in_government_trigger:0 "你的[Concept('concept_ruler', '统治者')]当前的[Concept('concept_party', '政党')]必须是[Concept('concept_government', '政府')]中唯一的政党，不得有其他[Concept('concept_party', '政党')]或[Concept('concept_interest_group', '利益集团')]。"
 bpm_je_reactionaries_in_government_trigger:0 "[GetInterestGroupVariant('ig_reactionaries',GetPlayer).GetNameWithCountryVariant]当前的[Concept('concept_party', '政党')]必须是[Concept('concept_government', '政府')]中唯一的政党，须[concept_powerful]，须为[Concept('concept_bpm_ig_is_organicist', '有机主义者')]，且不得有其他[Concept('concept_party', '政党')]或[Concept('concept_interest_group', '利益集团')]。"
 bpm_je_single_party_has_elections:0 "你拥有允许[Concept('concept_election', '选举')]的[Concept('concept_law', '法律')]"
 je_bpm_single_party_become:0 "通往一党制国家之路"
 je_bpm_single_party_become_status:0 "巩固权力，牢牢确立现任政党的统治。"
 je_bpm_single_party_become_reason:0 "时机已到，是时候让党无可争议地掌控国家的权柄，引领我们的国家走向辉煌的未来！只要棋盘上再多几枚棋子，我们就能巩固政权，确保所有其他政党从我们的道路上消失。\n\n#italic 如果你有[GetInterestGroupVariant('ig_reactionaries',GetPlayer).GetNameWithCountryVariant][concept_in_government]，且他们为[Concept('concept_bpm_ig_is_organicist', '有机主义者')]，你将转而获得[GetLawType('law_no_parties_allowed').GetName]！#!"
 bpm_single_party.1.t:0 "党治国家"
 bpm_single_party.1.d:0 "从今日起，[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFullName]宣布除[SCOPE.sParty('single_party_party').GetName]外的所有政党非法。然而，在此裁决之前，反对派早已遭受逮捕、失踪与暗杀，使其政治存在事实上已属非法。"
 bpm_single_party.1.f:0 "俄国革命运用政治独裁，除革命成功外别无顾忌……其成功的原因在于党被置于国家之上。我认为我们应该通过把党置于国家之上来进行改组。\n\n——孙中山，1924"
 bpm_single_party.1.a:0 "荣耀归于[SCOPE.sParty('single_party_party').GetName]！"
 bpm_single_party.2.t:0 "无党国家"
 bpm_single_party.2.d:0 "从今日起，[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFullName]宣布，所有政党无论其意识形态一律非法。然而，在此裁决之前，反对派早已遭受逮捕、失踪与暗杀，使其政治存在事实上已属非法。"
 bpm_single_party.2.f:0 "俄国革命运用政治独裁，除革命成功外别无顾忌……其成功的原因在于党被置于国家之上。我认为我们应该通过把党置于国家之上来进行改组。\n\n——孙中山，1924"
 bpm_single_party.2.a:0 "一个真正具有代表性的国家近在咫尺！"
 je_bpm_socialist_electoralism:0 "论社会主义者与选举"
 je_bpm_socialist_electoralism_status:0 "监测社会主义者的选举参与水平。"
 je_bpm_socialist_electoralism_reason:0 "我们民主制度与社会主义意识形态发展的结合，将革命行动者置于一个困境——一场关于是否参与他们所谓的#bold “资产阶级民主”#!、以及实际参与我国选举制度之利弊的辩论。我们是希望他们远离我们的选票，还是鼓励他们进入体面的政治？这个选择间接地掌握在我们手中。\n\n在当前条件下，#bold 社会主义#!选举参与度预计将在未来几周内达到#tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_socialist_electoralism_special_tooltip [Country.MakeScope.Var('bpm_je_socialist_electoralism_baseline_target').GetValue|-=]#!。只要选举参与度高于#bold 10#!，@ig_reformist_socialists!#bold 改良社会主义者#!将继续留在选举政治中。若选举参与度低于#bold 40#!，@ig_revolutionist_socialists!#bold 革命社会主义者#!将更不愿意加入政党；若低于#bold 25#!，则将彻底回避选举。若选举参与度低于#bold 90#!，@ig_anarchists!#bold 无政府主义者#!将不太愿意加入政党；若低于#bold 75#!，则将完全转为反选举主义者\n\n#lore “由此得出的结论是绝对不容置疑的：已经证明，参加资产阶级民主议会，即使在苏维埃共和国胜利前数周、甚至胜利之后，也远不会损害革命无产阶级，反而有助于无产阶级向后进群众证明这种议会为何应当被废除；它有助于这种议会的顺利解散，也有助于使资产阶级议会制‘在政治上过时’。”\n\n——弗拉基米尔·列宁，1920#!"
 je_bpm_socialist_electoralism_special_tooltip:0 "这一自然基线由以下因素决定：\n#variable [Country.MakeScope.Var('bpm_je_socialist_electoralism_from_base').GetValue|-=]#! 基础值\n#variable [Country.MakeScope.Var('bpm_je_socialist_electoralism_from_powerful_socialists').GetValue|-=]#! 来自强大的#bold 社会主义#![Concept('concept_interest_group', '利益集团')]\n#variable [Country.MakeScope.Var('bpm_je_socialist_electoralism_from_socialists_in_government').GetValue|-=]#! 来自执政的#bold 社会主义#![Concept('concept_interest_group', '利益集团')]\n#variable [Country.MakeScope.Var('bpm_je_socialist_electoralism_from_bolstered_socialists').GetValue|-=]#! 来自受扶植的#bold 社会主义#![Concept('concept_interest_group', '利益集团')]\n#variable [Country.MakeScope.Var('bpm_je_socialist_electoralism_from_happy_socialists').GetValue|-=]#! 来自满意的#bold 社会主义#![Concept('concept_interest_group', '利益集团')]\n#variable [Country.MakeScope.Var('bpm_je_socialist_electoralism_from_suppressed_socialists').GetValue|-=]#! 来自受打压的#bold 社会主义#![Concept('concept_interest_group', '利益集团')]\n#variable [Country.MakeScope.Var('bpm_je_socialist_electoralism_from_revolution').GetValue|-=]#! 来自#bold 当前的革命#!或低于33%的[Concept('concept_bpm_political_stability', '政治僵化')]\n#variable [Country.MakeScope.Var('bpm_je_socialist_electoralism_from_censorship').GetValue|-=]#! 来自#bold 言论自由#!法律\n#variable [Country.MakeScope.Var('bpm_je_socialist_electoralism_from_party_ban').GetValue|-=]#! 来自#bold 政党法#!法律\n#variable [Country.MakeScope.Var('bpm_je_socialist_electoralism_from_home_affairs').GetValue|-=]#! 来自#bold 内务#![Concept('concept_institution', '$concept_institutions$')]"
 je_bpm_propaganda_of_the_deed:0 "行动宣传"
 je_bpm_propaganda_of_the_deed_status_1:0 "现在来点爆炸性的哲学。"
 je_bpm_propaganda_of_the_deed_status_2:0 "爆炸性的谋划正在进行中。"
 je_bpm_propaganda_of_the_deed_status_3:0 "行动已近在咫尺。"
 je_bpm_propaganda_of_the_deed_reason:0 "#v 每月筹划进度：#! #tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_propaganda_of_the_deed_bomb_tooltip [Country.MakeScope.ScriptValue('bpm_je_propaganda_of_the_deed_бомбометр_rate_true')|-=]#!\n@warning! 达到#v 100%#!时，[GetInterestGroupVariant('ig_anarchists',GetPlayer).GetName]将试图#N 炸弹袭击#!一名[concept_leader]。\n\n#PB 信念强度：#! [Country.MakeScope.ScriptValue('bpm_je_propaganda_of_the_deed_philosophy_value')|-] @arrow_right! #tooltippable;tooltip:[Country.GetTooltipTag],je_bpm_propaganda_of_the_deed_baseline_tooltip [Country.MakeScope.ScriptValue('bpm_je_propaganda_of_the_deed_baseline_target')|-]#!（#v 0.5#!/月）\n当此值#v 高于 [Country.MakeScope.ScriptValue('bpm_je_propaganda_of_the_deed_decay_threshold_value')]#!时，日志进度将增长。\n@warning! 达到#v [Country.MakeScope.ScriptValue('bpm_je_propaganda_of_the_deed_complete_threshold_value')]#!时，[GetInterestGroupVariant('ig_anarchists',GetPlayer).GetName]将试图#N 炸弹袭击#!我们的[concept_ruler]。\n\n随着我们的激进派日益对国家幻灭，一部分坚定的无政府主义者正试图以定点暗杀来唤醒大众的意识。\n\n他们的#pink 信念强度#!趋向于一个#v 目标值#!，该值由国家镇压、经济困顿、战争以及无政府主义运动的大胆程度等因素决定。若此值足够高，无政府主义者将开始#v 筹划#!下一次#N 炸弹袭击#!。\n\n随着时间推移，无政府主义者会对这一策略愈发感到沮丧。每次#N 炸弹袭击#!的尝试：\n  @arrow_up!提高筹划下一次袭击所需的#pink 信念#!阈值（#v [Country.MakeScope.ScriptValue('bpm_je_propaganda_of_the_deed_decay_threshold_value')]#!），并\n  @arrow_down!降低#N 炸弹袭击#![concept_ruler]所需的#pink 信念#!阈值（#v [Country.MakeScope.ScriptValue('bpm_je_propaganda_of_the_deed_complete_threshold_value')]#!）。\n\n上一次#N 炸弹袭击企图#!发生在[Country.MakeScope.ScriptValue('bpm_je_propaganda_of_the_deed_months_below_value')]个月前。\n\n#lore “1892年7月6日，对十一名手无寸铁的工人的最后屠杀，激起了全美国的义愤……但只有一个人将劳动者的怒火化为了英勇的行动。此人便是亚历山大·伯克曼。1892年7月22日，他闯入H. C. 弗里克的办公室并企图取其性命。三颗子弹射入弗里克的身体，但他活了下来……这是美国第一起无政府主义经济恐怖行动，而亚历山大·伯克曼为他的革命抗议付出了沉重的代价。”\n\n——爱玛·戈尔德曼，1922#!"
 je_bpm_propaganda_of_the_deed_full:0 "#Pink 信念强度#!为#v [GetPlayer.MakeScope.ScriptValue('bpm_je_propaganda_of_the_deed_complete_threshold_value')]#!。"
 je_bpm_propaganda_of_the_deed_empty:0 "#Pink 信念强度#!为#v 0#!（运动趋于平息）。"
 je_bpm_propaganda_of_the_deed_timeout:0 "#v 10年#!内无#N 炸弹袭击#!（运动趋于平息）。"
 je_bpm_propaganda_of_the_deed_baseline_tooltip:0 "[Country.MakeScope.GetScriptValueDesc('bpm_je_propaganda_of_the_deed_baseline_target')]"
 je_bpm_propaganda_of_the_deed_bomb_tooltip:0 "[Country.MakeScope.GetScriptValueDesc('bpm_je_propaganda_of_the_deed_бомбометр_rate')]"
 bpm_je_potd_will_add_progress:0 "#bold 行动宣传#![Concept('concept_journal_entry', '日志条目')]将获得#pink 信念#!"
 bpm_je_potd_will_remove_progress:0 "#bold 行动宣传#![Concept('concept_journal_entry', '日志条目')]将失去#pink 信念#!"
 bpm_je_propaganda_of_the_deed_complete:0 "若运动趋于平息，[GetInterestGroupVariant('ig_anarchists',GetPlayer).GetName]将寻求其他策略。\n\n倘若#pink 信念强度#!达到#v [GetPlayer.MakeScope.ScriptValue('bpm_je_propaganda_of_the_deed_complete_threshold_value')]#!，将有人企图刺杀我们的[Concept('concept_ruler', '统治者')]。暗杀将在以下情况失败：\n- [GetInterestGroupVariant('ig_anarchists',GetPlayer).GetName]为[concept_marginalized]，且\n- 我国没有[GetInterestGroupVariant('ig_anarchists',GetPlayer).GetName]的[Concept('concept_agitator', '煽动者')]。\n否则，[Concept('concept_ruler', '统治者')]将身亡，我们将被迫镇压。"
 bpm_anarchist_potd.1.t:0 "下一个目标"
 bpm_anarchist_potd.1.desc:0 "@ig_anarchists! #bold 无政府主义者#!正在为下一次行动收尾准备。他们此刻正在几个不同方案之间抉择。"
 bpm_anarchist_potd.1.f:0 "空气中弥漫着阴沉的期待。那枚用简易材料制成的炸弹几乎压抑不住其杀意。它即将被引爆，其行动的回响将远超这枚炸药轰鸣之声所能及。"
 bpm_anarchist_potd.1.a:0 "低级别的官员"
 bpm_anarchist_potd.1.b:0 "[SCOPE.sCharacter('bpm_anarchist_potd_target_1').GetFullName]"
 bpm_anarchist_potd.1.c:0 "[SCOPE.sCharacter('bpm_anarchist_potd_target_2').GetFullName]"
 bpm_anarchist_potd.1.d:0 "[SCOPE.sCharacter('bpm_anarchist_potd_target_3').GetFullName]"
 bpm_anarchist_potd.2.t:0 "政府办公室遭炸弹袭击！"
 bpm_anarchist_potd.2.d:0 "@ig_anarchists! #bold 无政府主义者#!成功暗杀了我们一位显要的国家公职人员——他的办公室在爆炸中严重受损。近期我们需要一段时间才能恢复在该设施中的行政能力。"
 bpm_anarchist_potd.2.f:0 "这位官僚的死并非无法弥补。但这一象征性举动远为重要——即便是国家最高级别的公仆也难逃报复。"
 bpm_anarchist_potd.2.a:0 "该死！"
 bpm_anarchist_potd.3.t:0 "重要政治人物遭暗杀！"
 bpm_anarchist_potd.3.d:0 "@ig_anarchists! #bold 无政府主义者#!成功暗杀了[SCOPE.sCharacter('bpm_anarchist_potd_target').GetFullName]，以其大胆的举动改变了我们的政治格局。"
 bpm_anarchist_potd.3.f:0 "一次迅猛的投掷，一次迅速的脱身，一个有权有势的个体最终与众人归于平等。"
 bpm_anarchist_potd.3.a:0 "此仇必报！"
 bpm_anarchist_potd.3.b:0 "必须保持克制，以免激起更多此类事件！"
 bpm_anarchist_potd.4.t:0 "暗杀失败！"
 bpm_anarchist_potd.4.d:0 "@ig_anarchists! #bold 无政府主义者#!策划刺杀[SCOPE.sCharacter('bpm_anarchist_potd_target_ruler').GetFullName]已有一段时间。他们最近的一次最接近成功——或许也是最难复制的一次。多名凶手已被逮捕，一场大范围的镇压正在进行。在如此多的行动之后社会变革却迟迟未能实现，他们正转向一种截然不同的政治行动形式，那需要更深入的人民组织。"
 bpm_anarchist_potd.4.f:0 "若要使暴乱得以平息和解除武装，别无他途，唯有让所有人享有宣传与组织的自由；让被剥夺者、受压迫者和心怀不满者保有一切文明抗争的途径；让他们怀抱希望，即便是一点一滴，也能以不流血的方式争取自身的解放。意大利政府对此一概拒绝；它将一意孤行地镇压下去……而它也将继续自食其果。\n\n——埃里科·马拉泰斯塔，1900"
 bpm_anarchist_potd.4.a:0 "受够了这种自由派的软弱！"
 bpm_anarchist_potd.4.b:0 "我们侥幸躲过了一场悲剧——让我们避免另一场。"
 bpm_anarchist_potd.5.t:0 "我们的统治者遇害！"
 bpm_anarchist_potd.5.d:0 "@ig_anarchists! #bold 无政府主义者#!策划刺杀[SCOPE.sCharacter('bpm_anarchist_potd_target_ruler').GetFullName]已有一段时间。他们最近的一次企图取得了#N 血腥的成功#!，[SCOPE.sCharacter('bpm_anarchist_potd_target_ruler').GetFullName]的死讯震惊全国。我们随后的镇压既迅速又残酷。"
 bpm_anarchist_potd.5.f:0 "一位国王被杀；而国王说到底仍是一个人，这一事实值得痛惜。一位王后成了寡妇；而王后说到底仍是一个女人，她的丧夫之痛值得我们同情。然而，一个男人的死和一个女人的眼泪，何以引起这般轩然大波？人们日复一日地因战争、工伤事故、被枪弹镇压的起义、以及贫困、复仇之心、狂热与酗酒所滋生的无数罪行而死亡，无数女人因此终日以泪洗面，这一切却被视作理所当然。\n\n——埃里科·马拉泰斯塔，1900"
 bpm_anarchist_potd.5.a:0 "[SCOPE.sCharacter('bpm_anarchist_potd_target_ruler').GetFullName]将被复仇！"
 bpm_anarchist_potd.6.t:0 "行动趋于平息"
 bpm_anarchist_potd.6.d:0 "@ig_anarchists! #bold 无政府主义者#!对定点暗杀这一策略日益失望。经过内部辩论与策略的转变，他们现在正将重心转向不同形式的政治行动。"
 bpm_anarchist_potd.6.f:0 "出于情感与原则，我们憎恶暴力，并总是尽力避免之；唯有以恰当有效之手段反抗邪恶的必要性，才能促使我们诉诸暴力。我们知道，在人民缺乏充分准备的情况下，这种孤立的暴力行为仍是徒劳的，并且实际上，由于会引发难以承受的反扑，它反而会对它们本欲服务的事业造成不可估量的伤害。我们知道，那种本质的、无可辩驳的有目的的行动，不在于从肉体上杀死一位国王，而在于从法院、议会和工厂之中，在人民的心与脑中杀死所有的国王；也就是说，根除对如此众多人民所崇拜的权威原则的信仰。\n\n——埃里科·马拉泰斯塔，1900"
 bpm_anarchist_potd.6.a:0 "是时候改变策略了。"
 bpm_anarchist_potd.7.t:0 "一种爆炸性的哲学"
 bpm_anarchist_potd.7.d:0 "[SCOPE.sCharacter('bpm_anarchist_potd_failed_target').GetFullName]正穿行于城市时，一名披着斗篷的人向[SCOPE.sCharacter('bpm_anarchist_potd_failed_target').GetHerHis]马车掷出一枚炸弹。在一阵惊慌中，[SCOPE.sCharacter('bpm_anarchist_potd_failed_target').GetSheHe]与车夫设法跳出了马车，随后……\n\n什么都没发生。那枚炸弹是哑弹。这个未遂的刺客很快被附近的警察拖走，口中仍高呼着“无政府万岁！”"
 bpm_anarchist_potd.7.f:0 "战争，阶级战争，而你是最先在你所谓的秩序之强力机构的庇护下、在你法律的黑暗中发动它的人。必将流血；我们不会回避；必有谋杀：我们将杀人，因为这是必要的；必有毁灭：我们将摧毁，以将世界从你那些暴虐的制度中解放出来。\n\n——无政府主义传单，1919"
 bpm_anarchist_potd.7.a:0 "这种肆无忌惮的行径绝不能容忍！"
 bpm_anarchist_potd.7.b:0 "没有人受伤，对吧？"
 je_bpm_split_natlibs:0 "国族自由主义崛起"
 je_bpm_split_natlibs_status:0 "监测国族自由主义者的涌现。"
 je_bpm_split_natlibs_reason:0 "自由主义已不再是睁着天真大眼的煽动家的意识形态，它已彻底融入我国社会的政治经济结构。我国近期的危机将一批全新的保守自由主义者推上了舞台，他们倡导一个强大的国家、现代的经济，以及一支为民族利益服务的强大军队。\n\n#lore “我们有广袤的处女地待开垦；有待开通的道路；待挖掘的港口；待通航的河流；待竣工的运河，还有待完成的铁路网。在马赛前方，还有一个广袤的王国有待并入法兰西……这就是我所构想的帝国，如果帝国得以重建的话。这些便是我所筹划的征服，而你们，我身边这些与我一样心系国家福祉的人，你们就是我的士兵。”\n\n——拿破仑三世，1852#!"
 je_bpm_split_natlibs_special_tooltip:0 "该进度由以下因素决定：\n#variable [Country.MakeScope.Var('bpm_je_split_natlibs_progress_from_base').GetValue|+=]#! 基础值\n#variable [Country.MakeScope.Var('bpm_je_split_natlibs_progress_from_conflicts').GetValue|+=]#! 来自处于战争、外交博弈、革命或担任民族统一领袖\n#variable [Country.MakeScope.Var('bpm_je_split_natlibs_progress_from_liberals_empowered').GetValue|+=]#! 来自执政或受扶植的#bold 自由#!与#bold 保守#![Concept('concept_interest_group', '利益集团')]\n#variable [Country.MakeScope.Var('bpm_je_split_natlibs_progress_from_libcons_suppressed').GetValue|+=]#! 来自受打压的#bold 自由#!与#bold 保守#![Concept('concept_interest_group', '利益集团')]\n#variable [Country.MakeScope.Var('bpm_je_split_natlibs_progress_from_libcons_marginal').GetValue|+=]#! 来自边缘化的#bold 自由#!与#bold 保守#![Concept('concept_interest_group', '利益集团')]\n#variable [Country.MakeScope.Var('bpm_je_split_natlibs_progress_from_radicals').GetValue|+=]#! 来自激进的下层人群；仅当#bold 自由#!与#bold 保守#![Concept('concept_interest_group', '利益集团')]未被边缘化且未受打压时，此项才会累积。"
 je_bpm_split_natlibs_progress_bar:0 "国族自由主义崛起"
 je_bpm_split_natlibs_progress_bar_desc:0 "#v [JournalEntry.GetCurrentBarProgress(ScriptedProgressBar.Self)|%]#!（[JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1]/100）每周变动#v [SCOPE.GetRootScope.GetCountry.MakeScope.ScriptValue('bpm_je_split_natlibs_progress_rate')|+=]#!。"
