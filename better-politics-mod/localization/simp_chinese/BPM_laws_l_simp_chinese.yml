l_simp_chinese:
 bpm_decorative_upgradable_law:0 "该法律可被改良"
 bpm_decorative_upgradable_law_desc:0 "通过该法律后，在某些特定情况下，有可能将其改良为更强大的形式，用一个更好的变体取代它。"
 law_multicultural:0 "世界主义"
 law_multicultural_desc:0 "从纸面上看，该国不同民族与文化之间不存在法律歧视。实际上，主要文化仍受到优待，尽管不如以往那般强烈。"
 law_multicultural_upgraded:0 "完全世界主义"
 law_multicultural_upgraded_desc:0 "该国不同民族与文化之间不存在法律歧视。各文化享有平等的权利，并被赋予尽可能蓬勃发展的能力，主要文化的特权被最小化。"
 EFFECTS_ON_ACCEPTANCE_law_multicultural_upgraded:0 "$EFFECTS_ON_ACCEPTANCE_law_multicultural$"
 law_total_separation:0 "世俗主义"
 law_total_separation_desc:0 "从纸面上看，宗教不是民事制度中的一个因素。然而，这一政策的实际执行仍赋予国教一定程度的优待。"
 law_total_separation_upgraded:0 "完全世俗主义"
 law_total_separation_upgraded_desc:0 "宗教被弱化，并尽可能地从民事制度中剥离。整个社会并不实行基于宗教的歧视，但无神论价值观可能会被推广。"
 law_no_womens_rights:0 "传统家庭"
 law_no_womens_rights_desc:0 "无论是出于习俗还是法律，两性都被期望按照其文化中的传统家庭结构进行劳动分工。"
 law_womens_suffrage:0 "女性平等"
 law_womens_suffrage_desc:0 "从纸面上看，女性获得了与男性相同的法律权利，包括选举权。当然，这种平等的实际执行要远比纸面更不平等。"
 law_womens_suffrage_upgraded:0 "完全女性平等"
 law_womens_suffrage_upgraded_desc:0 "女性与男性享有完全的法律平等，包括由法律的实际执行所充分保障的选举权。"
 law_artisanal_economy:0 "手工艺经济"
 law_artisanal_economy_desc:0 "一种围绕小规模、以手工艺为基础的生产建立的经济，商品由熟练的个人或行会制造，而非通过工业流程。"
 law_military_junta:0 "军政府"
 law_military_junta_desc:0 "该国军队的军官取代了文官政府的职能。文官政府要么被中止，要么被彻底且永久地解散。"
 law_colonial_admin:0 "殖民行政"
 law_colonial_admin_desc:0 "该国由一个殖民行政机构统治，宗主国在所有事务上拥有最终决定权。"
 country_bpm_change_primary_culture_to_overlord:0 "将主要文化改为与宗主国一致"
 country_bpm_change_primary_culture_to_overlord_desc:0 "该国的主要文化将被改为与宗主国的主要文化一致。"
 law_no_police:0 "无正式警察"
 law_local_police:0 "仅地方警察"
 law_dedicated_police:0 "国家警察"
 law_militarized_police:0 "军事化警察"
 law_elected_police:0 "民选警察"
 law_elected_police_desc:0 "警察部队由地方议会选举产生，并受罢免选举的约束。"
 lawgroup_party_laws:0 "政党法律"
 lawgroup_party_laws_desc:0 "决定某些政党的合法性。"
 law_no_party_bans:0 "无现行禁令"
 law_no_party_bans_desc:0 "这个[concept_country]中不存在对任何[Concept('concept_party', '政党')]的彻底禁令。"
 law_party_anti_reactionary:0 "右翼政党被禁"
 law_party_anti_reactionary_desc:0 "传统主义与反动的[Concept('concept_party', '政党')]遭到压制。"
 law_party_reactionary_only:0 "仅限右翼政党"
 law_party_reactionary_only_desc:0 "这个[concept_country]中合法的[Concept('concept_party', '政党')]必须恪守传统价值观。"
 law_party_anti_socialist:0 "社会主义政党被禁"
 law_party_anti_socialist_desc:0 "各种形式的社会主义[Concept('concept_party', '政党')]都遭到压制。"
 law_party_socialist_only:0 "仅限社会主义政党"
 law_party_socialist_only_desc:0 "这个[concept_country]中合法的[Concept('concept_party', '政党')]必须在某种程度上代表无产阶级的意志。"
 law_party_anti_liberal:0 "自由主义政党被禁"
 law_party_anti_liberal_desc:0 "自由主义与自由市场的[Concept('concept_party', '政党')]遭到禁止。"
 law_party_liberal_only:0 "仅限温和政党"
 law_party_liberal_only_desc:0 "为了捍卫自由民主价值观，这个[concept_country]中极端不民主的[Concept('concept_party', '政党')]遭到禁止。"
 law_party_single:0 "单一合法政党"
 law_party_single_desc:0 "这个[concept_country]中只有一个[Concept('concept_party', '政党')]是合法的。"
 law_no_parties_allowed:0 "所有政党被禁"
 law_no_parties_allowed_desc:0 "这个[concept_country]中没有任何[Concept('concept_party', '政党')]是合法的。"
 bpm_decorative_ban_reactionaries:0 "[Concept('concept_bpm_party_ban', '禁止')][Concept('concept_bpm_bannable_reactionaries', '反动政党')]"
 bpm_decorative_ban_reactionaries_desc:0 "决定哪些政党被[Concept('concept_bpm_party_ban', '禁止')]。"
 bpm_decorative_ban_socialists:0 "[Concept('concept_bpm_party_ban', '禁止')][Concept('concept_bpm_bannable_socialists', '社会主义政党')]"
 bpm_decorative_ban_socialists_desc:0 "决定哪些政党被[Concept('concept_bpm_party_ban', '禁止')]。"
 bpm_decorative_ban_reactionaries_plus:0 "[Concept('concept_bpm_party_ban', '禁止')][Concept('concept_bpm_bannable_reactionaries_plus', '反社会主义政党')]"
 bpm_decorative_ban_reactionaries_plus_desc:0 "决定哪些政党被[Concept('concept_bpm_party_ban', '禁止')]。"
 bpm_decorative_ban_socialists_plus:0 "[Concept('concept_bpm_party_ban', '禁止')][Concept('concept_bpm_bannable_socialists_plus', '反传统政党')]"
 bpm_decorative_ban_socialists_plus_desc:0 "决定哪些政党被[Concept('concept_bpm_party_ban', '禁止')]。"
 bpm_decorative_ban_liberals:0 "[Concept('concept_bpm_party_ban', '禁止')][Concept('concept_bpm_bannable_liberals', '自由主义政党')]"
 bpm_decorative_ban_liberals_desc:0 "决定哪些政党被[Concept('concept_bpm_party_ban', '禁止')]。"
 bpm_decorative_ban_antiliberals:0 "[Concept('concept_bpm_party_ban', '禁止')][Concept('concept_bpm_bannable_antiliberals', '反自由主义政党')]"
 bpm_decorative_ban_antiliberals_desc:0 "决定哪些政党被[Concept('concept_bpm_party_ban', '禁止')]。"
 bpm_decorative_ban_everyone_but_ruler:0 "[Concept('concept_bpm_party_ban', '禁止')]所有非执政者的[Concept('concept_party', '政党')]。"
 bpm_decorative_ban_everyone_but_ruler_desc:0 "决定哪些政党被[Concept('concept_bpm_party_ban', '禁止')]。"
 bpm_decorative_ban_everyone:0 "[Concept('concept_bpm_party_ban', '禁止')][Concept('concept_bpm_bannable_parties', '所有政党')]"
 bpm_decorative_ban_everyone_desc:0 "决定哪些政党被[Concept('concept_bpm_party_ban', '禁止')]"
 bpm_disable_single_party_tooltip:0 "这将移除单一政党法律的效果。"
 bpm_enable_single_party_tooltip:0 "这将使除当前执政党之外的所有政党非法。该党之外的每个利益集团都将对[GetLawType('law_party_single').GetName][Concept('concept_law', '法律')]持反对立场。"
 bpm_enable_no_parties_tooltip:0 "这将把所有政党转变为“派系”。每个制度性利益集团都将加入各自相应的派系，而意识形态利益集团要么加入某个派系，要么对[GetLawType('law_no_parties_allowed').GetName][Concept('concept_law', '法律')]持反对立场。"
 lawgroup_foreign_policy:0 "外交政策"
 lawgroup_foreign_policy_desc:0 "这个[Concept('concept_country', '国家')]可能采取的广泛外交政策立场。"
 law_premodern_diplomacy:0 "前现代外交"
 law_premodern_diplomacy_desc:0 "该国的外交政策尚未更新以反映现代时代。"
 law_ultramilitarism:0 "超军国主义"
 law_ultramilitarism_desc:0 "极端民族主义、沙文主义和好战的外交政策，不留任何外交余地。"
 law_jingoism:0 "沙文主义"
 law_jingoism_desc:0 "一种侵略性、鹰派的外交政策，在某些情况下仍留有外交余地。"
 law_flexible_foreign_policy:0 "灵活外交政策"
 law_flexible_foreign_policy_desc:0 "该国在外交政策方面没有制定特殊或非常规的条款，所有选项都摆在桌面上。"
 law_justum_bellum:0 "正义战争"
 law_justum_bellum_desc:0 "一种温和鹰派的政策，要求战争必须正义，从而限制公开的侵略战争。"
 law_dove_politics:0 "鸽派政治"
 law_dove_politics_desc:0 "一套非侵略性的外交政策，专注于与其他国家的和平交往。"
 law_armed_neutrality:0 "武装中立"
 law_armed_neutrality_desc:0 "一种专注孤立主义、不干预外交事务的外交政策，尤其是对海外战争不介入，同时凭借相当强大的军队保障国家安全免受外敌入侵。"
 law_disarmed_nation:0 "解除武装的国家"
 law_disarmed_nation_desc:0 "完全和平主义的政策，既限制该国可参与的外部干预程度，又将军事开支重新分配到其他领域。"
 country_bpm_aggressive_diplomacy_disabled:0 "可使用侵略性[Concept('concept_diplomatic_play', '外交博弈')]"
 country_bpm_aggressive_diplomacy_disabled_desc:0 "可使用大多数战争目标发起[Concept('concept_diplomatic_play', '外交博弈')]。"
 bpm_aggressive_diplomacy_permitted_tt:0 "被允许使用侵略性[Concept('concept_diplomatic_play', '外交博弈')]"
 country_bpm_ban_slavery_dp_enabled:0 "可使用禁止奴隶制[Concept('concept_diplomatic_play', '外交博弈')]"
 country_bpm_ban_slavery_dp_enabled_desc:0 "可使用禁止奴隶制目标发起[Concept('concept_diplomatic_play', '外交博弈')]。"
 bpm_exception_ban_slavery_permitted_tt:0 "尽管有其他限制，仍可使用禁止奴隶制[Concept('concept_diplomatic_play', '外交博弈')]"
 country_bpm_regime_change_dp_enabled:0 "可使用政权更迭[Concept('concept_diplomatic_play', '外交博弈')]"
 country_bpm_regime_change_dp_enabled_desc:0 "可使用政权更迭目标发起[Concept('concept_diplomatic_play', '外交博弈')]。"
 bpm_exception_regime_change_permitted_tt:0 "尽管有其他限制，仍可使用政权更迭[Concept('concept_diplomatic_play', '外交博弈')]"
 country_bpm_return_state_dp_enabled:0 "可使用收复领土[Concept('concept_diplomatic_play', '外交博弈')]"
 country_bpm_return_state_dp_enabled_desc:0 "可使用收复领土目标发起[Concept('concept_diplomatic_play', '外交博弈')]。"
 bpm_exception_return_state_permitted_tt:0 "尽管有其他限制，仍可使用收复领土[Concept('concept_diplomatic_play', '外交博弈')]"
 country_bpm_contain_threat_dp_enabled:0 "可使用削弱列强[Concept('concept_diplomatic_play', '外交博弈')]"
 country_bpm_contain_threat_dp_enabled_desc:0 "可使用削弱列强目标发起[Concept('concept_diplomatic_play', '外交博弈')]。"
 bpm_exception_contain_threat_permitted_tt:0 "尽管有其他限制，仍可使用削弱列强[Concept('concept_diplomatic_play', '外交博弈')]"
 country_bpm_jingoist_lobby_force_demands_enabled:0 "沙文主义游说团体在超时后强行提出要求"
 country_bpm_jingoist_lobby_force_demands_enabled_desc:0 "如果某个[Concept('concept_political_lobby', '游说团体')]要求与另一国开战，一旦该要求超时，将自动发起一场[Concept('concept_diplomatic_play', '外交博弈')]，而非通常的游说团体要求行为。"
 country_bpm_forpol_minister_appointment_switches_law:0 "[GetInstitutionType('institution_diplomacy').GetName][Concept('concept_bpm_minister', '部长')]任命会立即改变该法律"
 country_bpm_forpol_minister_appointment_switches_law_desc:0 "每当一位新的[Concept('concept_bpm_minister', '部长')]被任命到[GetInstitutionType('institution_diplomacy').GetName]，都会根据该部长或其所属[concept_interest_group]的意识形态，从以下法律中颁布一项相关法律：[GetLawType('law_dove_politics').GetName]、[GetLawType('law_flexible_foreign_policy').GetName]、[GetLawType('law_jingoism').GetName]或[GetLawType('law_ultramilitarism').GetName]。"
 country_bpm_minimum_pro_country_lobby_amount:0 "保证的最低亲该国[Concept('concept_political_lobby', '政治游说团体')]数量"
 country_bpm_minimum_pro_country_lobby_amount_desc:0 "将保证在你的国家中存在一定数量的亲该国[Concept('concept_political_lobby', '政治游说团体')]，若低于此值则尽快创建。这将优先针对对我国好感度最高的国家。"
 country_bpm_minimum_anti_country_lobby_amount:0 "保证的最低反该国[Concept('concept_political_lobby', '政治游说团体')]数量"
 country_bpm_minimum_anti_country_lobby_amount_desc:0 "将保证在你的国家中存在一定数量的反该国[Concept('concept_political_lobby', '政治游说团体')]，若低于此值则尽快创建。这将优先针对对我国好感度最低的国家。"
 bpm_decorative_can_not_invade:0 "吞并会招致内部强烈反弹"
 bpm_decorative_can_not_invade_desc:0 "参与使用以下战争目标的[Concept('concept_diplomatic_play', '外交博弈')]：吞并州、夺取条约港、吞并附属国，将对该国国内造成严厉惩罚。"
 bpm_decorative_can_not_invade_no_annex:0 "侵略战争会招致内部强烈反弹"
 bpm_decorative_can_not_invade_no_annex_desc:0 "作为侵略者、非主要独立防御者，或以任何将获得新附属国或无主领土的战争目标参与[Concept('concept_diplomatic_play', '外交博弈')]，将对该国国内造成严厉惩罚。"
 bpm_decorative_can_not_join_alliances:0 "不能加入联盟和防御协定"
 bpm_decorative_can_not_join_alliances_desc:0 "该国被移除了加入联盟和防御协定的能力。"
 bpm_decorative_can_not_stay_peaceful:0 "不能保持和平"
 bpm_decorative_can_not_stay_peaceful_desc:0 "保持和平超过2年将对该国国内造成严厉惩罚。"
 lawgroup_work_time_regulations:0 "工作时间规定"
 lawgroup_work_time_regulations_desc:0 "法律必须为工人提供的每日工作小时数、每周工作天数以及假期的大致范围。"
 law_unregulated_work_time:0 "不受管制的工作时间"
 law_unregulated_work_time_desc:0 "政府不试图管制工人必须花费在工作上的时间。"
 law_token_time_regulations:0 "象征性时间规定"
 law_token_time_regulations_desc:0 "工人获得适度的工时规定、单日周末，以及某些传统节日的休息日。"
 law_limited_work_hours:0 "有限工作时间"
 law_limited_work_hours_desc:0 "除周末和节假日外，工人享有每天8小时的工作制以及加班费。"
 law_protected_leisure:0 "休息权"
 law_protected_leisure_desc:0 "工人在各种法定假日之外，还享有个人假和病假提供的充裕休息时间。工作日被限制在8小时或更少，并保证午休时间。"
 bpm_decorative_modify_throughput_per_workplace_safety_investment:0 "每级[GetInstitutionType('institution_workplace_safety').GetName][Concept('concept_institution', '机构')]等级的[concept_building][concept_throughput]"
 bpm_decorative_modify_throughput_per_workplace_safety_investment_desc:0 "$bpm_decorative_modify_throughput_per_workplace_safety_investment$"
 bpm_decorative_modify_sol_per_workplace_safety_investment:0 "每级[GetInstitutionType('institution_workplace_safety').GetName][Concept('concept_institution', '机构')]等级的[concept_sol]"
 bpm_decorative_modify_sol_per_workplace_safety_investment_desc:0 "$bpm_decorative_modify_sol_per_workplace_safety_investment$"
 bpm_decorative_modify_employment_laborers_per_workplace_safety_investment:0 "每级[GetInstitutionType('institution_workplace_safety').GetName][Concept('concept_institution', '机构')]等级的@laborers! 劳工就业"
 bpm_decorative_modify_employment_laborers_per_workplace_safety_investment_desc:0 "$bpm_decorative_modify_employment_laborers_per_workplace_safety_investment$"
 bpm_decorative_modify_employment_machinists_per_workplace_safety_investment:0 "每级[GetInstitutionType('institution_workplace_safety').GetName][Concept('concept_institution', '机构')]等级的@machinists! 机械师就业"
 bpm_decorative_modify_employment_machinists_per_workplace_safety_investment_desc:0 "$bpm_decorative_modify_employment_machinists_per_workplace_safety_investment$"
 bpm_decorative_modify_employment_clerks_per_workplace_safety_investment:0 "每级[GetInstitutionType('institution_workplace_safety').GetName][Concept('concept_institution', '机构')]等级的@clerks! 职员就业"
 bpm_decorative_modify_employment_clerks_per_workplace_safety_investment_desc:0 "$bpm_decorative_modify_employment_clerks_per_workplace_safety_investment$"
 lawgroup_labour_associations:0 "工会"
 lawgroup_labour_associations_desc:0 "这些法律塑造了劳工代表的格局，指导工人在遵循各种意识形态与政府约束的同时如何组织起来并维护自身权利。"
 law_combination_acts:0 "非法工会"
 law_combination_acts_desc:0 "任何形式的工会都被严格禁止，参与此类组织是违法的。"
 law_corporatized_unions:0 "国家控制的工会"
 law_corporatized_unions_desc:0 "政府监管并控制所有工会，确保它们与国家政策和目标保持一致。"
 law_anti_strike_laws:0 "受限工会"
 law_anti_strike_laws_desc:0 "工会被默许存在，但在罢工和政治立场方面受到严格限制。"
 law_right_to_associate:0 "允许所有工会"
 law_right_to_associate_desc:0 "各种类型的工会，无论其意识形态立场如何，都被允许在国内自由运作。"
 law_socialist_labor_unions:0 "仅限社会主义工会"
 law_socialist_labor_unions_desc:0 "只有与国家社会主义教义一致的工会才被允许在该国运作。"
 law_syndicalism:0 "工团主义"
 law_syndicalism_desc:0 "工会被用作社会组织的基础，成为国家的治理实体。"
 bpm_decorative_trade_unions_non_institutional:0 "[GetInterestGroupVariant('ig_trade_unions', GetPlayer).GetName]不被视为[Concept('concept_bpm_institutional_ig', '制度性利益集团')]"
 bpm_decorative_trade_unions_non_institutional_desc:0 "[GetInterestGroupVariant('ig_trade_unions', GetPlayer).GetName]的吸引力将不受该国[Concept('concept_bpm_political_stability', '政治稳定')]的调整。"
 bpm_decorative_trade_unions_force_leader_moderate:0 "强制[GetInterestGroupVariant('ig_trade_unions', GetPlayer).GetName]领袖为非左翼"
 bpm_decorative_trade_unions_force_leader_moderate_desc:0 "[GetInterestGroupVariant('ig_trade_unions', GetPlayer).GetName]领袖将无法获得左翼意识形态，并将更频繁地获得[GetIdeology('ideology_corporatist_leader').GetName]意识形态。"
 bpm_decorative_trade_unions_force_leader_non_socialist:0 "强制[GetInterestGroupVariant('ig_trade_unions', GetPlayer).GetName]领袖为非社会主义者"
 bpm_decorative_trade_unions_force_leader_non_socialist_desc:0 "[GetInterestGroupVariant('ig_trade_unions', GetPlayer).GetName]领袖将无法获得社会主义意识形态。"
 bpm_decorative_trade_unions_force_leader_vanguardist_desc:0 "[GetInterestGroupVariant('ig_trade_unions', GetPlayer).GetName]领袖将获得[GetIdeology('ideology_vanguardist').GetName]意识形态。"
 interest_group_bpm_intelligentsia_force_leader_non_moderate:0 "强制[GetInterestGroupVariant('ig_intelligentsia', GetPlayer).GetName]领袖为非温和派"
 interest_group_bpm_intelligentsia_force_leader_non_moderate_desc:0 "[GetInterestGroupVariant('ig_intelligentsia', GetPlayer).GetName]领袖将永远不会获得[GetIdeology('ideology_moderate').GetName]意识形态。"
 lawgroup_centralization:0 "中央集权"
 lawgroup_centralization_desc:0 "决定中央政府与地方政府之间权力平衡的法律。"
 law_unitary:0 "单一制"
 law_unitary_desc:0 "在单一制国家，所有权力最终都归于中央政府，地方当局执行其意志。"
 law_devolved:0 "分权制"
 law_devolved_desc:0 "在分权制国家，几乎所有权力都归于中央政府；其中一部分被下放给选定的地区当局，以实现有限程度的自治。"
 law_federated:0 "联邦制"
 law_federated_desc:0 "在联邦制国家，相当一部分权力被下放给地方的联邦主体。中央政府保留着重要的影响力，但必须顾及地方权力。"
 law_confederated:0 "邦联制"
 law_confederated_desc:0 "在邦联政体中，权力分散于地方当局之间，中央权力要么不存在，要么只是名义上的，要么是被授权的。"
 law_ad_hoc_centralization:0 "拼凑式治理"
 law_ad_hoc_centralization_desc:0 "该政体的行政对各地区的自治与特权持有一套不一致、有时甚至自相矛盾的政策。"
 bpm_law_effect_tt_officer_law_change:0 "你目前所有的指挥官都将被解雇，以腾出位置给新的指挥官。"
 lawgroup_officers:0 "军官构成"
 lawgroup_officers_desc:0 "军官的任命与晋升标准。"
 law_noble_officers:0 "贵族军官"
 law_noble_officers_desc:0 "只有贵族才能拥有军官头衔。"
 bpm_law_effect_tt_noble_officers:0 "你的指挥官将主要来自[GetInterestGroupVariant('ig_landowners', GetPlayer).GetName][Concept('concept_interest_group', '利益集团')]。他们也可能来自[Concept('concept_bpm_ig_is_liberal', '$concept_bpm_ig_is_liberal$')]、[Concept('concept_bpm_ig_is_right_wing', '$concept_bpm_ig_is_right_wing$')]、[Concept('concept_bpm_ig_is_middle_institutional', '$concept_bpm_ig_is_middle_institutional$')]或[Concept('concept_bpm_ig_is_upper_institutional', '$concept_bpm_ig_is_upper_institutional$')][Concept('concept_interest_group', '利益集团')]。"
 bpm_law_effect_tt_warrior_caste:0 "你的指挥官将完全来自[GetInterestGroupVariant('ig_armed_forces', GetPlayer).GetName]。"
 law_purchased_officers:0 "买官制"
 law_purchased_officers_desc:0 "晋升和更高军衔可供富人购买。"
 bpm_law_effect_tt_purchased_officers:0 "你的指挥官将来自[Concept('concept_bpm_ig_is_liberal', '$concept_bpm_ig_is_liberal$')]、[Concept('concept_bpm_ig_is_right_wing', '$concept_bpm_ig_is_right_wing$')]、[Concept('concept_bpm_ig_is_middle_institutional', '$concept_bpm_ig_is_middle_institutional$')]或[Concept('concept_bpm_ig_is_upper_institutional', '$concept_bpm_ig_is_upper_institutional$')][Concept('concept_interest_group', '利益集团')]。"
 law_professional_officers:0 "职业军官"
 law_professional_officers_desc:0 "军官依据其被认为的功绩进行任命与晋升。"
 bpm_law_effect_tt_professional_officers:0 "你的指挥官将主要来自[Concept('concept_bpm_ig_is_state_institutional', '$concept_bpm_ig_is_state_institutional$')][Concept('concept_interest_group', '利益集团')]。"
 law_political_officers:0 "政治化军官"
 law_political_officers_desc:0 "国家使用一切必要手段确保每位军官的忠诚。"
 bpm_law_effect_tt_political_officers:0 "你的指挥官将仅来自[Concept('concept_bpm_ig_is_state_institutional', '$concept_bpm_ig_is_state_institutional$')][Concept('concept_interest_group', '利益集团')]，或来自目前身在政府中的[Concept('concept_interest_group', '利益集团')]。任何将某个[Concept('concept_interest_group', '利益集团')]移出政府的政府改革，也将同时把其军官移出该国！"
 law_elected_officers:0 "民选军官"
 law_elected_officers_desc:0 "这支军队的军官从他们所指挥的士兵中选举产生。"
 bpm_law_effect_tt_elected_officers:0 "你的指挥官将仅来自非[Concept('concept_bpm_ig_is_institutional', '$concept_bpm_ig_is_institutional$')][Concept('concept_interest_group', '利益集团')]。如果你有[GetLawType('law_womens_suffrage').GetName][Concept('concept_law', '法律')]，你可以让女性担任你的军官。"
 law_land_based_taxation:0 "农民税"
 law_land_based_taxation_desc:0 "一种传统的征税形式，主要通过土地税、实物税、徭役以及有限的所得税等任意组合向农民征收。"
 law_per_capita_based_taxation:0 "累退税"
 law_proportional_taxation:0 "比例税"
 law_graduated_taxation:0 "累进税"
 law_traditional_ostracism:0 "传统排斥"
 law_traditional_ostracism_desc:0 "虽然不存在执行审查的正式机构，但传统制度会施加压力以维持当前秩序。"
 law_right_of_assembly:0 "国家媒体"
 law_right_of_assembly_desc:0 "公众享有集会权和言论自由；然而，国家保留通过制作自己的出版物和赞助艺术来干预大众文化的权利。"
 law_protected_speech:0 "不干预言论"
 law_protected_speech_desc:0 "国家不干预公共言论。集会自由和言论自由得到保障，公共机构不制作自己的媒体，也不显著干预艺术。"
 law_bakuhan_system:0 "幕藩体制"
 law_bakuhan_system_desc:0 "$law_serfdom_desc$"
 law_ideological_jingoism:0 "意识形态沙文主义"
 law_ideological_jingoism_desc:0 "一种鹰派政策，不关注直接征服扩张，而关注全世界意识形态统一。"
 bpm_decorative_trade_unions_force_leader_vanguardist:0 ""
